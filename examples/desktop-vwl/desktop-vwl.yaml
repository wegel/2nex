build:
  environment: 13ce31fd97c19f5756e4413babf279d543b5a71c

  script: |
    set -eux

    # desktop-specific directories
    mkdir -p /target/var/cache/fontconfig
    mkdir -p /target/run/{dbus,user/1000}

    # seed upstream libvirt objects as mutable host state
    mkdir -p \
      /target/etc/libvirt/nwfilter \
      /target/etc/libvirt/qemu/networks/autostart
    copy_target_file() {
      source=$1
      destination=$2
      if [ -L "${source}" ]; then
        link=$(readlink "${source}")
        case "${link}" in
          /*) cp -a "/target${link}" "${destination}" ;;
          *) cp -a "$(dirname "${source}")/${link}" "${destination}" ;;
        esac
      else
        cp -a "${source}" "${destination}"
      fi
    }
    for source in /target/usr/share/libvirt/initial-state/nwfilter/*.xml; do
      copy_target_file \
        "${source}" \
        "/target/etc/libvirt/nwfilter/$(basename "${source}")"
    done
    copy_target_file \
      /target/usr/share/libvirt/initial-state/qemu/networks/default.xml \
      /target/etc/libvirt/qemu/networks/default.xml
    ln -s ../default.xml \
      /target/etc/libvirt/qemu/networks/autostart/default.xml

    # The desktop masks networkd and must not inherit the base enablement link.
    rm -f \
      /target/etc/systemd/system/multi-user.target.wants/systemd-networkd.service

    # locale generation
    mkdir -p /target/usr/lib/locale
    localedef -i en_US -c -f UTF-8 -A /usr/share/locale/locale.alias /target/usr/lib/locale/en_US.UTF-8

    # recompile gsettings schemas (includes overrides from the files section)
    for f in /target/usr/share/glib-2.0/schemas/*.xml; do
      if [ -L "$f" ]; then
        real=$(readlink "$f")
        cp "/target/$real" "$f.tmp"
        rm "$f"
        mv "$f.tmp" "$f"
      fi
    done
    glib-compile-schemas /target/usr/share/glib-2.0/schemas/

    # rootless containers: setuid on newuidmap/newgidmap
    for f in /target/nex/pkg/core/userland/shadow/*/*/usr/bin/newuidmap; do
      chmod u+s "$f"
    done
    for f in /target/nex/pkg/core/userland/shadow/*/*/usr/bin/newgidmap; do
      chmod u+s "$f"
    done

    # ship the repository bundle for self-hosting; nex-init-manifests clones it
    mkdir -p /target/usr/share/nex
    cp "/${SOURCE_nex_bundle}" /target/usr/share/nex/nex.bundle
    chmod 0644 /target/usr/share/nex/nex.bundle
    touch -d "2024-01-01T00:00:00+00:00" /target/usr/share/nex/nex.bundle

    test -f /target/usr/lib/os-release
    grep -Fq 'PRETTY_NAME="nex Desktop"' /target/usr/lib/os-release
    test -f /target/usr/lib/inputrc
    test -f /target/usr/lib/environment.d/10-desktop.conf
    test -f /target/usr/lib/NetworkManager/conf.d/wifi-backend.conf
    test -f /target/usr/lib/iwd/main.conf
    test -f /target/usr/lib/systemd/logind.conf.d/10-desktop.conf
    test -f /target/usr/lib/systemd/journald.conf.d/00-persistent.conf
    test -f /target/usr/lib/systemd/system/systemd-logind.service.d/dbus-ordering.conf
    test -f /target/usr/lib/tmpfiles.d/xdg-runtime.conf
    test -f /target/usr/lib/tmpfiles.d/utmp.conf
    test -f /target/usr/lib/udev/rules.d/70-seat.rules
    test -f /target/usr/share/containers/containers.conf
    test -f /target/usr/share/containers/registries.conf
    test -f /target/usr/share/containers/policy.json
    test -f /target/etc/pam.d/system-auth
    test -f /target/etc/pam.d/login
    test -f /target/etc/pam.d/other
    test ! -e /target/etc/os-release
    test ! -e /target/etc/fstab
    test ! -e /target/etc/sysctl.conf
    test ! -e /target/etc/environment
    test ! -e /target/etc/inputrc
    test ! -e /target/etc/systemd/network/80-dhcp.network
    test ! -e /target/etc/systemd/logind.conf
    test ! -e /target/etc/systemd/system/systemd-logind.service.d/dbus-ordering.conf
