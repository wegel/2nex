system:
  schema: 1
  name: Desktop System with vwl/Wayland
  slug: desktop-vwl
  version: 0.0.1
  description: Desktop system with vwl compositor, wayland tools, and CLI utilities
  nex_structure: true
  extends: nex:base/nex-systemd.yaml
  checksum: 9bb0f6fd4916dbc3bd0108efba5172919f0f5ac8d92ea8075a4ac8d48af9318f

sources:
# Ship the Nex repository for self-hosting, as a Git bundle rather than a file
# tree. Manifests name their build environment by historical blob, so a machine
# given only current files can resolve none of them. First boot clones this.
# The pinned commit necessarily predates the manifest that names it; a
# self-rebuild converges on a fixed point without reaching one.
- name: nex_bundle
  sha256: 6d8250bc44650b99db9b3826f5efc3640d8f3f2cbea8e328114edbfd5b89c0b8
  git_bundle: 08df833ef49eb69d1b454ede5a3646c7a9ffbebe

