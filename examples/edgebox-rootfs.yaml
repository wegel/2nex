files:
# locale and clock policy
- path: /etc/locale.conf
  mode: 420
  content: |
    LANG=en_GB.UTF-8

- path: /etc/timezone
  mode: 420
  content: |
    Universal

- path: /etc/localtime
  symlink: /usr/share/zoneinfo/Universal
  replace: true

# network policy
- path: /etc/systemd/network/80-dhcp.network
  mode: 420
  content: |
    [Match]
    Name=en*

    [Network]
    DHCP=yes

- path: /etc/resolv.conf
  symlink: /run/systemd/resolve/stub-resolv.conf
  replace: true

- path: /etc/mtab
  symlink: /proc/self/mounts
  replace: true

# OpenSSL compatibility path; the early boot service regenerates this cache.
- path: /etc/ssl/certs
  symlink: /run/ssl/certs
  replace: true

- path: /usr/lib/systemd/system/update-ca-certificates.service.d/runtime-store.conf
  mode: 420
  content: |
    [Service]
    ExecStartPre=/usr/bin/mkdir -p /run/ssl
    ExecStartPre=-/usr/bin/ln -sT /usr/lib/ssl/certs /run/ssl/certs
    ExecStart=
    ExecStart=/usr/bin/update-ca-certificates --output-dir /run/ssl/certs

- path: /var/run
  symlink: /run
  replace: true

# D-Bus broker compatibility alias
- path: /usr/lib/systemd/system/dbus.service
  symlink: dbus-broker.service
  replace: true

# System-wide audio policy. The PipeWire and WirePlumber packages retain their
# upstream user units; this appliance assembly chooses dedicated system units.
- path: /usr/lib/systemd/system/pipewire-system.service
  mode: 420
  content: |
    [Unit]
    Description=PipeWire multimedia service
    After=sound.target

    [Service]
    Type=simple
    User=pipewire
    Group=pipewire
    SupplementaryGroups=audio
    RuntimeDirectory=pipewire
    RuntimeDirectoryMode=0750
    Environment=PIPEWIRE_RUNTIME_DIR=/run/pipewire
    Environment=XDG_RUNTIME_DIR=/run/pipewire
    ExecStart=/usr/bin/pipewire
    Restart=on-failure

    [Install]
    WantedBy=multi-user.target

- path: /usr/lib/systemd/system/wireplumber-system.service
  mode: 420
  content: |
    [Unit]
    Description=WirePlumber multimedia session manager
    Requires=pipewire-system.service
    After=pipewire-system.service

    [Service]
    Type=simple
    User=pipewire
    Group=pipewire
    SupplementaryGroups=audio
    Environment=PIPEWIRE_RUNTIME_DIR=/run/pipewire
    Environment=XDG_RUNTIME_DIR=/run/pipewire
    Environment=GIO_USE_VFS=local
    ExecStart=/usr/bin/wireplumber
    Restart=on-failure

    [Install]
    WantedBy=multi-user.target

- path: /usr/lib/systemd/system/pipewire-pulse-system.service
  mode: 420
  content: |
    [Unit]
    Description=PipeWire PulseAudio service
    Requires=pipewire-system.service wireplumber-system.service
    After=pipewire-system.service wireplumber-system.service

    [Service]
    Type=simple
    User=pipewire
    Group=pipewire
    SupplementaryGroups=audio
    Environment=PIPEWIRE_RUNTIME_DIR=/run/pipewire
    Environment=XDG_RUNTIME_DIR=/run/pipewire
    ExecStart=/usr/bin/pipewire-pulse
    Restart=on-failure

    [Install]
    WantedBy=multi-user.target

# service enablement
- path: /etc/systemd/system/sockets.target.wants/dbus.socket
  symlink: /usr/lib/systemd/system/dbus.socket

- path: /etc/systemd/system/multi-user.target.wants/systemd-networkd.service
  symlink: /usr/lib/systemd/system/systemd-networkd.service

- path: /etc/systemd/system/multi-user.target.wants/systemd-resolved.service
  symlink: /usr/lib/systemd/system/systemd-resolved.service

- path: /etc/systemd/system/sysinit.target.wants/systemd-timesyncd.service
  symlink: /usr/lib/systemd/system/systemd-timesyncd.service

- path: /etc/systemd/system/multi-user.target.wants/sshd-keygen.service
  symlink: /usr/lib/systemd/system/sshd-keygen.service

- path: /etc/systemd/system/multi-user.target.wants/sshd.service
  symlink: /usr/lib/systemd/system/sshd.service

- path: /etc/systemd/system/multi-user.target.wants/acpid.service
  symlink: /usr/lib/systemd/system/acpid.service

- path: /etc/systemd/system/multi-user.target.wants/containerd.service
  symlink: /usr/lib/systemd/system/containerd.service

- path: /etc/systemd/system/multi-user.target.wants/docker.service
  symlink: /usr/lib/systemd/system/docker.service

- path: /etc/systemd/system/sockets.target.wants/docker.socket
  symlink: /usr/lib/systemd/system/docker.socket

- path: /etc/systemd/system/multi-user.target.wants/pipewire-system.service
  symlink: /usr/lib/systemd/system/pipewire-system.service

- path: /etc/systemd/system/multi-user.target.wants/wireplumber-system.service
  symlink: /usr/lib/systemd/system/wireplumber-system.service

- path: /etc/systemd/system/multi-user.target.wants/pipewire-pulse-system.service
  symlink: /usr/lib/systemd/system/pipewire-pulse-system.service


build:
  environment: 13ce31fd97c19f5756e4413babf279d543b5a71c

  script: |
    set -eu

    cat > /target/etc/passwd << 'EOF'
    root:x:0:0:root:/root:/usr/bin/bash
    sshd:x:74:74:Privilege-separated SSH:/var/lib/sshd:/usr/bin/nologin
    systemd-network:x:192:192:systemd Network Management:/:/usr/bin/nologin
    systemd-resolve:x:193:193:systemd Resolver:/:/usr/bin/nologin
    systemd-timesync:x:194:194:systemd Time Synchronization:/:/usr/bin/nologin
    pipewire:x:994:990:PipeWire multimedia daemon:/:/usr/bin/nologin
    EOF

    cat > /target/etc/group << 'EOF'
    root:x:0:
    audio:x:29:pipewire
    sshd:x:74:
    systemd-journal:x:190:
    systemd-network:x:192:
    systemd-resolve:x:193:
    systemd-timesync:x:194:
    pipewire:x:990:
    docker:x:996:
    utmp:x:22:
    EOF

    cat > /target/etc/shadow << 'EOF'
    root:!*:19735:0:99999:7:::
    sshd:!*:19735::::::
    systemd-network:!*:19735::::::
    systemd-resolve:!*:19735::::::
    systemd-timesync:!*:19735::::::
    pipewire:!*:19735::::::
    EOF
    chmod 600 /target/etc/shadow

    cat > /target/usr/lib/os-release << 'EOF'
    NAME="nex"
    PRETTY_NAME="Nex Edgebox Rootfs"
    ID=nex
    VERSION_ID=0.0.1
    VARIANT="Embedded appliance rootfs"
    EOF

    mkdir -p \
      /target/etc/acpi/events \
      /target/root \
      /target/var/lib/containerd \
      /target/var/lib/docker \
      /target/var/lib/sshd
    chmod 700 /target/var/lib/sshd

    test -s /target/usr/lib/ssl/certs/ca-certificates.crt
    test "$(readlink /target/etc/ssl/certs)" = /run/ssl/certs
    test ! -e /target/etc/os-release
    grep -Fq \
      'ExecStart=/usr/bin/update-ca-certificates --output-dir /run/ssl/certs' \
      /target/usr/lib/systemd/system/update-ca-certificates.service.d/runtime-store.conf

    find /target -exec touch -h -d '2024-01-01T00:00:00+00:00' {} \;
