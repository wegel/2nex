system:
  name: Initramfs
  slug: initramfs
  version: 0.1.0
  architecture: x86_64
  description: Initial ramdisk for early boot
  checksum: 4afd2c372cbcb24da8e8f675a95d5113dadfaff7bba3ac0f43a91a35b00e5689

sources: []

dependencies:
- name: util-linux-lib
  commit: x86_64/pkg/core/userland/util_linux/2.40/outputs/lib
- name: kmod
  commit: x86_64/pkg/core/kernel/kmod/32/outputs/bin
- name: glibc
  commit: x86_64/pkg/libs/system/glibc/2.39/outputs/lib
- name: inetutils
  commit: x86_64/pkg/net/misc/inetutils/2.5/outputs/bin
- name: findutils
  commit: x86_64/pkg/core/userland/findutils/4.9.0/outputs/bin

packages:
- name: bash
  commit: x86_64/pkg/cli/shells/bash/5.2.21/outputs/bin
- name: coreutils
  commit: x86_64/pkg/core/userland/coreutils/9.5/outputs/bin
- name: util-linux
  commit: x86_64/pkg/core/userland/util_linux/2.40/outputs/bin

build:
  script: |
    set -eux

    # create init script
    cat > /target/init <<'EOF'
    #!/usr/bin/bash
    # nex initramfs init script

    echo "Hello from init!"
    EOF

    chmod +x /target/init

    # create minimal device nodes (if devtmpfs fails)
    mknod -m 600 /target/dev/console c 5 1 || true
    mknod -m 666 /target/dev/null c 1 3 || true

    # deterministic timestamps
    find "/target" -exec touch -d "2024-01-01T00:00:00+00:00" {} \;
