system:
  schema: 1
  name: Edgebox Rootfs
  slug: edgebox-rootfs
  version: 0.0.1
  description: Flat appliance rootfs assembled from reusable upstream packages
  extends: asm/flat-systemd.yaml
  checksum: d8c158b77a3c864942af08520cdf8417d5c10703250cc3f05bb91acf4f1e1098

overlays:
- asm/edgebox-rootfs-overlay.yaml

packages:
# kernel modules and device firmware
- name: linux-modules
  commit: x86_64/pkg/core/kernel/linux/6.18.24/bundles/all-modules
- name: firmware-amd-gpu
  commit: x86_64/pkg/core/kernel/linux-firmware/20251125/outputs/gpu-amd
- name: firmware-realtek
  commit: x86_64/pkg/core/kernel/linux-firmware/20251125/outputs/wifi-realtek
# base appliance services
- name: acpid
  commit: x86_64/pkg/core/power/acpid/2.0.34/bundles/full
- name: ca-certificates
  commit: x86_64/pkg/apps/misc/ca-certificates/20251104/bundles/full
- name: openssh
  commit: x86_64/pkg/cli/net/openssh/9.9p1/bundles/full
- name: bash-completion
  commit: x86_64/pkg/cli/shells/bash-completion/2.17.0/bundles/full
# containers and networking
- name: bridge-utils
  commit: x86_64/pkg/net/misc/bridge-utils/1.7.1/bundles/full
- name: containerd
  commit: x86_64/pkg/apps/containers/containerd/2.2.2+git5957d3334b/bundles/full
- name: docker
  commit: x86_64/pkg/apps/containers/docker/29.3.0+git1da6517e1a/bundles/full
- name: docker-compose
  commit: x86_64/pkg/apps/containers/docker-compose/5.1.0+gite8c21434/bundles/full
- name: iproute2
  commit: x86_64/pkg/net/misc/iproute2/6.18.0/bundles/full
- name: nftables
  commit: x86_64/pkg/net/firewall/nftables/1.1.1/bundles/full
# storage, crypto, and update tools
- name: cryptsetup
  commit: x86_64/pkg/cli/crypto/cryptsetup/2.8.6/bundles/full
- name: curl
  commit: x86_64/pkg/cli/net/curl/8.17.0/bundles/full
- name: dosfstools
  commit: x86_64/pkg/core/fs/dosfstools/4.2/outputs/bin
- name: e2fsprogs
  commit: x86_64/pkg/core/fs/e2fsprogs/1.47.0/bundles/full
- name: gnupg
  commit: x86_64/pkg/cli/crypto/gnupg/2.5.17/bundles/full
- name: ostree
  commit: x86_64/pkg/core/fs/ostree/2026.1/bundles/full
# audio runtime
- name: alsa-utils-bin
  commit: x86_64/pkg/libs/audio/alsa-utils/1.2.14/outputs/bin
- name: alsa-utils-lib
  commit: x86_64/pkg/libs/audio/alsa-utils/1.2.14/outputs/lib
- name: alsa-utils-misc
  commit: x86_64/pkg/libs/audio/alsa-utils/1.2.14/outputs/misc
- name: pipewire-bin
  commit: x86_64/pkg/libs/audio/pipewire/1.4.9/outputs/bin
- name: pipewire-conf
  commit: x86_64/pkg/libs/audio/pipewire/1.4.9/outputs/conf
- name: pipewire-lib
  commit: x86_64/pkg/libs/audio/pipewire/1.4.9/outputs/lib
- name: pipewire-misc
  commit: x86_64/pkg/libs/audio/pipewire/1.4.9/outputs/misc
- name: wireplumber-bin
  commit: x86_64/pkg/libs/audio/wireplumber/0.5.12/outputs/bin
- name: wireplumber-conf
  commit: x86_64/pkg/libs/audio/wireplumber/0.5.12/outputs/conf
- name: wireplumber-lib
  commit: x86_64/pkg/libs/audio/wireplumber/0.5.12/outputs/lib
- name: wireplumber-misc
  commit: x86_64/pkg/libs/audio/wireplumber/0.5.12/outputs/misc
# diagnostics and operator tools
- name: dmidecode
  commit: x86_64/pkg/cli/system/dmidecode/3.7/outputs/bin
- name: file
  commit: x86_64/pkg/dev/tools/file/5.45/bundles/full
- name: grep
  commit: x86_64/pkg/cli/text/grep/3.11/bundles/full
- name: i2c-tools
  commit: x86_64/pkg/cli/system/i2c-tools/4.4/bundles/full
- name: jq
  commit: x86_64/pkg/cli/json/jq/1.8.2/outputs/bin
- name: kbd-bin
  commit: x86_64/pkg/core/userland/kbd/2.9.0/outputs/bin
- name: kbd-misc
  commit: x86_64/pkg/core/userland/kbd/2.9.0/outputs/misc
- name: procps-ng
  commit: x86_64/pkg/core/userland/procps-ng/4.0.5/bundles/full
- name: smartmontools
  commit: x86_64/pkg/cli/system/smartmontools/7.5/bundles/full
- name: usbutils
  commit: x86_64/pkg/cli/system/usbutils/019/bundles/full
- name: vim
  commit: x86_64/pkg/cli/editors/vim/9.2.0340/bundles/full
# locale and interpreters required by packaged helper scripts
- name: glibc-tools
  commit: x86_64/pkg/libs/system/glibc/2.39/outputs/bin
- name: locale-en-gb
  commit: x86_64/pkg/libs/system/glibc-locale-en-gb/2.39/bundles/full
- name: python-bin
  commit: x86_64/pkg/dev/lang/python3/3.12.2/outputs/bin
- name: python-lib
  commit: x86_64/pkg/dev/lang/python3/3.12.2/outputs/lib
- name: python-misc
  commit: x86_64/pkg/dev/lang/python3/3.12.2/outputs/misc
- name: tzdata
  commit: x86_64/pkg/core/userland/tzdata/2026b/bundles/full

build:
  environment: 13ce31fd97c19f5756e4413babf279d543b5a71c

  script: |
    set -eu

    cat > /target/etc/passwd << 'EOF'
    root:x:0:0:root:/root:/usr/bin/bash
    sshd:x:74:74:Privilege-separated SSH:/var/lib/sshd:/usr/bin/nologin
    systemd-network:x:192:192:systemd Network Management:/:/usr/bin/nologin
    systemd-resolve:x:193:193:systemd Resolver:/:/usr/bin/nologin
    systemd-timesync:x:194:194:systemd Time Synchronization:/:/usr/bin/nologin
    pipewire:x:994:990:PipeWire multimedia daemon:/:/usr/bin/nologin
    EOF

    cat > /target/etc/group << 'EOF'
    root:x:0:
    audio:x:29:pipewire
    sshd:x:74:
    systemd-journal:x:190:
    systemd-network:x:192:
    systemd-resolve:x:193:
    systemd-timesync:x:194:
    pipewire:x:990:
    docker:x:996:
    utmp:x:22:
    EOF

    cat > /target/etc/shadow << 'EOF'
    root:!*:19735:0:99999:7:::
    sshd:!*:19735::::::
    systemd-network:!*:19735::::::
    systemd-resolve:!*:19735::::::
    systemd-timesync:!*:19735::::::
    pipewire:!*:19735::::::
    EOF
    chmod 600 /target/etc/shadow

    cat > /target/etc/os-release << 'EOF'
    NAME="nex"
    PRETTY_NAME="Nex Edgebox Rootfs"
    ID=nex
    VERSION_ID=0.0.1
    VARIANT="Embedded appliance rootfs"
    EOF

    mkdir -p \
      /target/etc/acpi/events \
      /target/root \
      /target/var/lib/containerd \
      /target/var/lib/docker \
      /target/var/lib/sshd
    chmod 700 /target/var/lib/sshd

    find /target -exec touch -h -d '2024-01-01T00:00:00+00:00' {} \;
