build:
  environment: 13ce31fd97c19f5756e4413babf279d543b5a71c
  script: |
    set -eux
    mkdir -p /target/etc

    cat > /target/etc/passwd << 'EOF'
    root:x:0:0:root:/root:/bin/bash
    testuser:x:1000:1000:Test User:/home/testuser:/bin/bash
    systemd-network:x:192:192:systemd Network Management:/:/usr/sbin/nologin
    systemd-resolve:x:193:193:systemd Resolver:/:/usr/sbin/nologin
    systemd-timesync:x:194:194:systemd Time Synchronization:/:/usr/sbin/nologin
    sshd:x:74:74:Privilege-separated SSH:/var/lib/sshd:/usr/sbin/nologin
    EOF

    cat > /target/etc/group << 'EOF'
    root:x:0:
    testuser:x:1000:
    systemd-network:x:192:
    systemd-resolve:x:193:
    systemd-timesync:x:194:
    systemd-journal:x:190:
    sshd:x:74:
    EOF

    cat > /target/etc/shadow << 'EOF'
    root::19735:0:99999:7:::
    testuser::19735:0:99999:7:::
    systemd-network:!*:19735::::::
    systemd-resolve:!*:19735::::::
    systemd-timesync:!*:19735::::::
    EOF
    chmod 600 /target/etc/shadow

    # subuid/subgid for user namespaces
    cat > /target/etc/subuid << 'EOF'
    testuser:100000:65536
    EOF
    cat > /target/etc/subgid << 'EOF'
    testuser:100000:65536
    EOF

    # create testuser home directory
    mkdir -p /target/home/testuser

    # fix testuser home ownership on first boot via tmpfiles
    mkdir -p /target/etc/tmpfiles.d
    cat > /target/etc/tmpfiles.d/home-testuser.conf << 'EOF'
    d /home/testuser 0755 testuser testuser -
    EOF

    mkdir -p /target/{proc,sys,dev,run,tmp,root}
    mkdir -p /target/etc/systemd/system
    mkdir -p /target/var/log/journal
    mkdir -p /target/var/lib/systemd

    # mount points for systemd virtual filesystems
    mkdir -p /target/dev/hugepages
    mkdir -p /target/dev/mqueue
    mkdir -p /target/dev/shm
    mkdir -p /target/sys/kernel/debug
    mkdir -p /target/sys/kernel/tracing
    mkdir -p /target/sys/kernel/config
    mkdir -p /target/sys/fs/fuse/connections
    mkdir -p /target/sys/fs/cgroup

    # systemd needs these directories
    mkdir -p /target/var/lib/systemd/random-seed
    mkdir -p /target/var/lib/systemd/timers
    mkdir -p /target/var/lib/systemd/coredump
    mkdir -p /target/run/systemd

    # fstab - empty but must exist for systemd-remount-fs
    touch /target/etc/fstab

    # mtab - symlink to /proc/self/mounts (required by mount command)
    ln -sf /proc/self/mounts /target/etc/mtab

    # empty sysctl.conf - prevents errors
    touch /target/etc/sysctl.conf

    # os-release - required by systemd
    cat > /target/etc/os-release << 'EOF'
    NAME="nex"
    PRETTY_NAME="nex Linux"
    ID=nex
    VERSION_ID=0.0.1
    EOF
    mkdir -p /target/usr/lib
    ln -sf ../../etc/os-release /target/usr/lib/os-release

    # link /usr/share to /nex/env/share for data files (dbus-1, keymaps, terminfo, etc)
    mkdir -p /target/usr/share
    ln -sf ../../nex/env/share/dbus-1 /target/usr/share/dbus-1
    ln -sf ../../nex/env/share/keymaps /target/usr/share/keymaps
    ln -sf ../../nex/env/share/consolefonts /target/usr/share/consolefonts
    ln -sf ../../nex/env/share/terminfo /target/usr/share/terminfo
    ln -sf ../../nex/env/share/nvim /target/usr/share/nvim

    # machine-id placeholder (systemd will initialize)
    touch /target/etc/machine-id

    # systemd-networkd config: DHCP on all ethernet interfaces
    mkdir -p /target/etc/systemd/network
    cat > /target/etc/systemd/network/80-dhcp.network << 'EOF'
    [Match]
    Name=en*

    [Network]
    DHCP=yes
    EOF

    # enable systemd-networkd and systemd-resolved
    mkdir -p /target/etc/systemd/system/multi-user.target.wants
    mkdir -p /target/etc/systemd/system/getty.target.wants
    ln -sf /usr/lib/systemd/system/systemd-networkd.service /target/etc/systemd/system/multi-user.target.wants/
    ln -sf /usr/lib/systemd/system/systemd-resolved.service /target/etc/systemd/system/multi-user.target.wants/
    # enable getty on tty1 for GTK console
    ln -sf /usr/lib/systemd/system/getty@.service /target/etc/systemd/system/getty.target.wants/getty@tty1.service
    # enable sshd
    ln -sf /usr/lib/systemd/system/sshd-keygen.service /target/etc/systemd/system/multi-user.target.wants/
    ln -sf /usr/lib/systemd/system/sshd.service /target/etc/systemd/system/multi-user.target.wants/

    # sshd privilege separation directory
    mkdir -p /target/var/lib/sshd
    chmod 700 /target/var/lib/sshd

    # create /usr/libexec symlinks for openssh (system builder only does /usr/bin)
    mkdir -p /target/usr/libexec
    for f in /target/nex/pkg/cli/net/openssh/*/*/usr/libexec/*; do
      name=$(basename "$f")
      # extract the relative path from /target to the actual file
      relpath="${f#/target/}"
      ln -sf "../../$relpath" "/target/usr/libexec/$name"
    done

    # configure sshd to accept any key
    # create script that echoes back whatever key is presented
    # %t = key type, %k = base64-encoded key
    mkdir -p /target/usr/local/bin
    # remove the symlink to nex/pkg and replace with our own config
    rm -f /target/etc/ssh/sshd_config
    cat > /target/usr/local/bin/accept-any-key << 'SCRIPT'
    #!/bin/bash
    # accepts any SSH key - echoes back the key in authorized_keys format
    echo "$1 $2"
    SCRIPT
    chmod 755 /target/usr/local/bin/accept-any-key

    cat > /target/etc/ssh/sshd_config << 'EOF'
    PermitRootLogin yes
    PermitEmptyPasswords yes
    PasswordAuthentication yes
    PubkeyAuthentication yes
    AuthorizedKeysFile none
    AuthorizedKeysCommand /usr/local/bin/accept-any-key %t %k
    AuthorizedKeysCommandUser root
    HostKey /etc/ssh/ssh_host_ed25519_key
    HostKey /etc/ssh/ssh_host_rsa_key
    HostKey /etc/ssh/ssh_host_ecdsa_key
    Subsystem sftp /usr/libexec/sftp-server
    EOF

    # auto-load virtio modules for qemu testing
    mkdir -p /target/etc/modules-load.d
    mkdir -p /target/etc/modprobe.d
    cat > /target/etc/modules-load.d/virtio.conf << 'EOF'
    virtio_net
    EOF

    # resolv.conf -> systemd-resolved stub
    ln -sf /run/systemd/resolve/stub-resolv.conf /target/etc/resolv.conf

    ln -sf usr/bin/init /target/init
