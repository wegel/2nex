- name: bash
  commit: x86_64/pkg/cli/shells/bash/5.2.21/outputs/bin
- name: coreutils
  commit: x86_64/pkg/core/userland/coreutils/9.5/outputs/bin
- name: util_linux
  commit: x86_64/pkg/core/userland/util_linux/2.40/bundles/runtime
- name: findutils
  commit: x86_64/pkg/core/userland/findutils/4.9.0/outputs/bin
- name: grep
  commit: x86_64/pkg/cli/text/grep/3.11/outputs/bin
- name: sed
  commit: x86_64/pkg/cli/text/sed/4.9/outputs/bin
- name: shadow
  commit: x86_64/pkg/core/userland/shadow/4.15.1/outputs/bin
- name: kbd
  commit: x86_64/pkg/core/userland/kbd/2.9.0/bundles/full
- name: kmod
