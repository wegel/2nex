system:
  schema: 1
  name: Nex Systemd Base
  slug: nex-systemd
  version: 0.0.1
  description: Minimal nex rootfs with systemd, networking, and SSH
  nex_structure: true
  checksum: e4834b42b6be0c89737c948e00a90120666cf6a9f9b4b497bbd0b06b12470e80

overlays:
- asm/nex-systemd-overlay.yaml

dependencies:
- name: findutils
