build:
  environment: 13ce31fd97c19f5756e4413babf279d543b5a71c
  script: |
    set -eux

    # directories that can't be in overlay (mount points, runtime dirs)
    mkdir -p /target/{proc,sys,dev,run,tmp,root}
    mkdir -p /target/dev/{hugepages,mqueue,shm}
    mkdir -p /target/sys/kernel/{debug,tracing,config}
    mkdir -p /target/sys/fs/{fuse/connections,cgroup}
    mkdir -p /target/var/{log/journal,lib/systemd/{random-seed,timers,coredump},cache/fontconfig}
    mkdir -p /target/run/{systemd,dbus,user/1000}
    mkdir -p /target/etc/modprobe.d

    # openssh libexec symlinks (dynamic based on package path)
    mkdir -p /target/usr/libexec
    for f in /target/nex/pkg/cli/net/openssh/*/*/usr/libexec/*; do
      name=$(basename "$f")
      relpath="${f#/target/}"
      ln -sf "../../$relpath" "/target/usr/libexec/$name"
    done

    # locale generation
    mkdir -p /target/usr/lib/locale
    localedef -i en_US -c -f UTF-8 -A /usr/share/locale/locale.alias /target/usr/lib/locale/en_US.UTF-8

    # recompile gsettings schemas (includes overrides from overlay)
    # resolve symlinks so glib-compile-schemas can read them
    for f in /target/usr/share/glib-2.0/schemas/*.xml; do
      if [ -L "$f" ]; then
        real=$(readlink "$f")
        cp "/target/$real" "$f.tmp"
        rm "$f"
        mv "$f.tmp" "$f"
      fi
    done
    glib-compile-schemas /target/usr/share/glib-2.0/schemas/

