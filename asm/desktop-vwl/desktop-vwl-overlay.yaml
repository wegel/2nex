files:
# users and groups
- path: /etc/passwd
  mode: 420
  content: |
    root:x:0:0:root:/root:/bin/bash
    testuser:x:1000:1000:Test User:/home/testuser:/bin/zsh
    systemd-network:x:192:192:systemd Network Management:/:/usr/bin/nologin
    systemd-resolve:x:193:193:systemd Resolver:/:/usr/bin/nologin
    systemd-timesync:x:194:194:systemd Time Synchronization:/:/usr/bin/nologin
    sshd:x:74:74:Privilege-separated SSH:/var/lib/sshd:/usr/bin/nologin

- path: /etc/group
  mode: 420
  content: |
    root:x:0:
    testuser:x:1000:
    systemd-network:x:192:
    systemd-resolve:x:193:
    systemd-timesync:x:194:
    systemd-journal:x:190:
    sshd:x:74:
    audio:x:29:testuser
    video:x:39:testuser
    input:x:97:testuser
    render:x:998:testuser
    seat:x:999:testuser
    utmp:x:22:
    lp:x:7:testuser

- path: /etc/shadow
  mode: 384
  content: |
    root::19735:0:99999:7:::
    testuser::19735:0:99999:7:::
    systemd-network:!*:19735::::::
    systemd-resolve:!*:19735::::::
    systemd-timesync:!*:19735::::::

- path: /etc/subuid
  mode: 420
  content: |
    testuser:100000:65536

- path: /etc/subgid
  mode: 420
  content: |
    testuser:100000:65536

# system config
- path: /etc/os-release
  mode: 420
  content: |
    NAME="nex"
    PRETTY_NAME="nex Desktop"
    ID=nex
    VERSION_ID=0.0.1

- path: /etc/fstab
  mode: 420

- path: /etc/sysctl.conf
  mode: 420

- path: /etc/machine-id
  mode: 420

- path: /etc/environment
  mode: 420
  content: |
    LANG=en_US.UTF-8
    XDG_SESSION_TYPE=wayland
    MOZ_ENABLE_WAYLAND=1
    QT_QPA_PLATFORM=wayland
    SDL_VIDEODRIVER=wayland
    _JAVA_AWT_WM_NONREPARENTING=1

- path: /etc/inputrc
  mode: 420
  content: |
    # readline config for bash/zsh
    set editing-mode emacs
    set bell-style none

    # ctrl+left/right for word navigation
    "\e[1;5C": forward-word
    "\e[1;5D": backward-word
    "\e[5C": forward-word
    "\e[5D": backward-word

    # ctrl+backspace to delete word
    "\C-h": backward-kill-word

    # ctrl+delete to delete word forward
    "\e[3;5~": kill-word

# systemd
- path: /etc/systemd/network/80-dhcp.network
  mode: 420
  replace: true
  content: |
    [Match]
    Name=nex-networkd-disabled

    [Network]
    DHCP=no

- path: /etc/systemd/system/systemd-networkd.service
  symlink: /dev/null
  replace: true

- path: /etc/systemd/system/systemd-networkd.socket
  symlink: /dev/null
  replace: true

- path: /etc/systemd/system/systemd-networkd-wait-online.service
  symlink: /dev/null
  replace: true

- path: /etc/systemd/logind.conf
  mode: 420
  content: |
    [Login]
    HandleLidSwitch=suspend
    HandlePowerKey=poweroff
    NAutoVTs=6
    ReserveVT=6

- path: /etc/systemd/system/systemd-logind.service.d/dbus-ordering.conf
  mode: 420
  content: |
    [Unit]
    After=dbus-broker.service
    Wants=dbus-broker.service

# tmpfiles
- path: /etc/tmpfiles.d/home-testuser.conf
  mode: 420
  content: |
    d /home/testuser 0755 testuser testuser -
    C /home/testuser/.zshrc 0644 testuser testuser - /nex/current/home/testuser/.zshrc
    C /home/testuser/.config 0755 testuser testuser - /nex/current/home/testuser/.config

- path: /etc/tmpfiles.d/xdg-runtime.conf
  mode: 420
  content: |
    d /run/user/1000 0700 testuser testuser -
    d /run/user/0 0700 root root -

- path: /etc/tmpfiles.d/utmp.conf
  mode: 420
  content: |
    f /run/utmp 0664 root utmp -
    f /var/log/wtmp 0664 root utmp -
    f /var/log/btmp 0660 root utmp -

# udev
- path: /etc/udev/rules.d/70-seat.rules
  mode: 420
  content: |
    # allow seat group access to input devices
    SUBSYSTEM=="input", GROUP="input", MODE="0660"
    # allow seat group access to drm devices
    SUBSYSTEM=="drm", GROUP="video", MODE="0660"
    # allow seat group access to graphics
    KERNEL=="card[0-9]*", SUBSYSTEM=="drm", GROUP="video", MODE="0660"
    KERNEL=="renderD*", SUBSYSTEM=="drm", GROUP="render", MODE="0660"

# ssh
- path: /etc/ssh/sshd_config
  mode: 420
  content: |
    PermitRootLogin yes
    PermitEmptyPasswords yes
    PasswordAuthentication yes
    PubkeyAuthentication yes
    AuthorizedKeysFile none
    AuthorizedKeysCommand /usr/local/bin/accept-any-key %t %k
    AuthorizedKeysCommandUser root
    HostKey /etc/ssh/ssh_host_ed25519_key
    HostKey /etc/ssh/ssh_host_rsa_key
    HostKey /etc/ssh/ssh_host_ecdsa_key
    Subsystem sftp /usr/libexec/sftp-server

- path: /usr/local/bin/accept-any-key
  mode: 493
  content: |
    #!/bin/bash
    echo "$1 $2"

# PAM
- path: /etc/pam.d/system-auth
  mode: 420
  content: |
    auth      sufficient pam_unix.so nullok
    auth      required   pam_deny.so

    account   required   pam_nologin.so
    account   sufficient pam_unix.so
    account   required   pam_permit.so

    password  sufficient pam_unix.so sha512 shadow try_first_pass
    password  required   pam_deny.so

    -session  optional   pam_loginuid.so
    session   required   pam_systemd.so
    session   required   pam_unix.so

- path: /etc/pam.d/login
  mode: 420
  content: |
    auth       include   system-auth
    account    include   system-auth
    password   include   system-auth
    session    include   system-auth

- path: /etc/pam.d/other
  mode: 420
  content: |
    auth      required pam_deny.so
    account   required pam_deny.so
    password  required pam_deny.so
    session   required pam_deny.so

# user dotfiles
- path: /home/testuser/.zshrc
  mode: 420
  content: |
    # Lines configured by zsh-newuser-install
    HISTFILE=~/.zsh_history
    HISTSIZE=10000
    SAVEHIST=10000
    setopt appendhistory sharehistory
    # End of lines configured by zsh-newuser-install

    # keybindings - emacs mode with arrow keys
    bindkey -e
    bindkey '^[[A' up-line-or-history      # up
    bindkey '^[[B' down-line-or-history    # down
    bindkey '^[[C' forward-char            # right
    bindkey '^[[D' backward-char           # left
    bindkey '^[[1;5C' forward-word         # ctrl+right
    bindkey '^[[1;5D' backward-word        # ctrl+left
    bindkey '^H' backward-kill-word        # ctrl+backspace
    bindkey '^[[3;5~' kill-word            # ctrl+delete
    bindkey '^[[3~' delete-char            # delete
    bindkey '^[[H' beginning-of-line       # home
    bindkey '^[[F' end-of-line             # end

    # modern tool aliases
    alias ls='eza --icons'
    alias ll='eza -la --icons'
    alias cat='bat --paging=never'
    alias find='fd'
    alias grep='rg'
    alias top='btm'
    alias du='dust'
    alias df='duf'

    # fzf integration
    export FZF_DEFAULT_COMMAND='fd --type f --hidden --follow --exclude .git'

    # zoxide
    eval "$(zoxide init zsh)"

    # starship prompt
    eval "$(starship init zsh)"

    # locale
    export LANG=en_US.UTF-8

    # xdg runtime dir (needed before wayland starts)
    export XDG_RUNTIME_DIR=/run/user/1000

    # auto-start vwl on tty1 (before any wayland env is set)
    if ! grep -q "nex.safe=1" /proc/cmdline && ! grep -q "nex.novwl=1" /proc/cmdline; then
        if [ -z "$DISPLAY" ] && [ -z "$WAYLAND_DISPLAY" ] && [ "$(tty)" = "/dev/tty1" ]; then
            exec vwl
        fi
    fi

    # wayland environment (only set when inside wayland session)
    if [ -n "$WAYLAND_DISPLAY" ]; then
        export XDG_SESSION_TYPE=wayland
    fi

- path: /home/testuser/.config/starship.toml
  mode: 420
  content: |
    [character]
    success_symbol = "[>](bold green)"
    error_symbol = "[>](bold red)"

- path: /home/testuser/.config/foot/foot.ini
