system:
  schema: 1
  name: Desktop System with vwl/Wayland and Nvidia 580
  slug: desktop-vwl-nvidia-580
  version: 0.0.1
  description: Desktop system with vwl compositor, Nvidia 580, and capture tools
  nex_structure: true
  extends: asm/desktop-vwl/desktop-vwl.yaml
  checksum: e96c1d90579086617c714a6eb479b2275377c2165aa69aa2dea33c4bfc6e9148

packages:
# source-built public OpenCL loader
- name: opencl-icd-loader
  commit: x86_64/pkg/libs/graphics/opencl-icd-loader/2026.05.29/bundles/runtime
# Nvidia 580 for Pascal/Turing machines
- name: nvidia-580
  commit: x86_64/pkg/libs/graphics/nvidia-580/580.159.04/bundles/runtime
# host capture modules and client
- name: v4l2loopback
  commit: x86_64/pkg/core/kernel/v4l2loopback/0.15.4/bundles/runtime
- name: kvmfr
  commit: x86_64/pkg/core/kernel/kvmfr/B7/bundles/runtime
- name: looking-glass
  commit: x86_64/pkg/apps/virt/looking-glass/B7/bundles/runtime

providers:
  graphics.egl: x86_64/pkg/libs/graphics/nvidia-580/580.159.04/bundles/runtime
  graphics.gbm: x86_64/pkg/libs/graphics/mesa/24.2.7/outputs/lib
  graphics.gles: x86_64/pkg/libs/graphics/nvidia-580/580.159.04/bundles/runtime

build:
  environment: 13ce31fd97c19f5756e4413babf279d543b5a71c

  script: |
    set -eu

    mkdir -p /target/etc/modprobe.d
    {
      printf '%s\n' 'blacklist nouveau'
      printf '%s\n' 'blacklist nvidiafb'
      printf '%s\n' 'options nouveau modeset=0'
      printf '%s\n' 'options nvidia-drm modeset=1'
    } > /target/etc/modprobe.d/nvidia.conf

    mkdir -p /target/etc/modules-load.d
    {
      printf '%s\n' 'nvidia'
      printf '%s\n' 'nvidia-modeset'
      printf '%s\n' 'nvidia-uvm'
      printf '%s\n' 'nvidia-drm'
    } > /target/etc/modules-load.d/nvidia.conf

    modules_dir=/target/usr/lib/modules/6.18.24
    for metadata in "${modules_dir}"/modules.*; do
      if [ -L "${metadata}" ]; then
        target=$(readlink "${metadata}")
        case "${target}" in
          /*) cp -a "/target${target}" "${metadata}.tmp" ;;
          *) cp -a "$(dirname "${metadata}")/${target}" "${metadata}.tmp" ;;
        esac
        rm "${metadata}"
        mv "${metadata}.tmp" "${metadata}"
      fi
    done

    chroot /target /usr/bin/depmod 6.18.24

    chroot /target /usr/bin/modinfo -k 6.18.24 nvidia >/dev/null
    chroot /target /usr/bin/modprobe --set-version 6.18.24 --show-depends nvidia-drm >/dev/null
    grep -q '^extra/nvidia\.ko:' /target/usr/lib/modules/6.18.24/modules.dep
    grep -q '^extra/nvidia-drm\.ko:' /target/usr/lib/modules/6.18.24/modules.dep
    grep -q '^extra/v4l2loopback\.ko:' /target/usr/lib/modules/6.18.24/modules.dep
    grep -q '^extra/kvmfr\.ko:' /target/usr/lib/modules/6.18.24/modules.dep

    vwl_root="/target$(readlink /target/usr/bin/vwl)"
    vwl_root="${vwl_root%/usr/bin/vwl}"
    test -e "${vwl_root}/usr/share/glvnd/egl_vendor.d/10_nvidia.json" \
      || test -L "${vwl_root}/usr/share/glvnd/egl_vendor.d/10_nvidia.json"
    test -e "${vwl_root}/usr/share/egl/egl_external_platform.d/15_nvidia_gbm.json" \
      || test -L "${vwl_root}/usr/share/egl/egl_external_platform.d/15_nvidia_gbm.json"
    test -e "${vwl_root}/usr/lib/libEGL_nvidia.so.0" \
      || test -L "${vwl_root}/usr/lib/libEGL_nvidia.so.0"
    test -e "${vwl_root}/usr/lib/gbm/nvidia-drm_gbm.so" \
      || test -L "${vwl_root}/usr/lib/gbm/nvidia-drm_gbm.so"

    case "$(readlink /target/usr/lib/libOpenCL.so.1)" in
      /nex/pkg/libs/graphics/opencl-icd-loader/2026.05.29/*/usr/lib/libOpenCL.so.1) ;;
      *) exit 1 ;;
    esac
    chroot /target /usr/bin/test -e /usr/lib/libnvidia-opencl.so.1
    chroot /target /usr/bin/test -s /usr/share/OpenCL/vendors/nvidia.icd
    chroot /target /usr/bin/grep -Fxq 'libnvidia-opencl.so.1' \
      /usr/share/OpenCL/vendors/nvidia.icd
    chroot /target /usr/bin/test ! -e /etc/OpenCL
    chroot /target /usr/bin/cllayerinfo >/dev/null

    echo "Nvidia 580 module metadata generated."
