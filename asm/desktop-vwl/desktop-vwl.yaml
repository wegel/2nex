system:
  schema: 1
  name: Desktop System with vwl/Wayland
  slug: desktop-vwl
  version: 0.0.1
  description: Desktop system with vwl compositor, wayland tools, and CLI utilities
  nex_structure: true
  extends: asm/nex-systemd.yaml
  checksum: fc9df3e68a32a7016735b6d6d61c0af891b56061d10a1ea97d006308e0edfeb8

overlays:
- asm/desktop-vwl/desktop-vwl-overlay.yaml

sources:
# Ship a snapshot of the Nex repo needed for self-hosting. The installed system
# copies this template into writable /var on first boot.
- name: nex_pkg
  dev: pkg
- name: nex_asm
  dev: asm
- name: nex_src_cli
  dev: src/cli
- name: nex_scripts
  dev: scripts

