build:
  environment: 13ce31fd97c19f5756e4413babf279d543b5a71c

  script: |
    set -eu

    # desktop-specific directories
    mkdir -p /target/var/cache/fontconfig
    mkdir -p /target/run/{dbus,user/1000}

    # locale generation
    mkdir -p /target/usr/lib/locale
    localedef -i en_US -c -f UTF-8 -A /usr/share/locale/locale.alias /target/usr/lib/locale/en_US.UTF-8

    # recompile gsettings schemas (includes overrides from overlay)
    for f in /target/usr/share/glib-2.0/schemas/*.xml; do
      if [ -L "$f" ]; then
        real=$(readlink "$f")
        cp "/target/$real" "$f.tmp"
        rm "$f"
        mv "$f.tmp" "$f"
      fi
    done
    glib-compile-schemas /target/usr/share/glib-2.0/schemas/

    # rootless containers: setuid on newuidmap/newgidmap
    for f in /target/nex/pkg/core/userland/shadow/*/*/usr/bin/newuidmap; do
      chmod u+s "$f"
    done
    for f in /target/nex/pkg/core/userland/shadow/*/*/usr/bin/newgidmap; do
      chmod u+s "$f"
    done

    # ship manifests + sources for self-hosting (template copied to /var on first boot)
    mkdir -p /target/usr/share/nex/manifests/pkg
    mkdir -p /target/usr/share/nex/manifests/asm
    mkdir -p /target/usr/share/nex/manifests/src/cli
    mkdir -p /target/usr/share/nex/manifests/scripts

    # extract dev sources (uncompressed tarballs)
    if [ -n "${SOURCE_nex_pkg_IS_DEV:-}" ]; then
        tar --no-same-owner -xf "/${SOURCE_nex_pkg}" -C /target/usr/share/nex/manifests/pkg --strip-components=1
    fi
    if [ -n "${SOURCE_nex_asm_IS_DEV:-}" ]; then
        tar --no-same-owner -xf "/${SOURCE_nex_asm}" -C /target/usr/share/nex/manifests/asm --strip-components=1
        find /target/usr/share/nex/manifests/asm -name '*.yaml' -exec sed -i '/^[[:space:]]*checksum:[[:space:]]/d' {} +
    fi
    if [ -n "${SOURCE_nex_src_cli_IS_DEV:-}" ]; then
        tar --no-same-owner -xf "/${SOURCE_nex_src_cli}" -C /target/usr/share/nex/manifests/src/cli --strip-components=1
    fi
    if [ -n "${SOURCE_nex_scripts_IS_DEV:-}" ]; then
        tar --no-same-owner -xf "/${SOURCE_nex_scripts}" -C /target/usr/share/nex/manifests/scripts --strip-components=1
    fi

    # keep deterministic timestamps for the shipped snapshot
    find /target/usr/share/nex/manifests -exec touch -d "2024-01-01T00:00:00+00:00" {} \; || true

    echo "Desktop assembly configuration done."
