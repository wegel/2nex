system:
  schema: 1
  name: Nex Minimal System
  slug: nex-minimal
  version: 0.0.1
  description: Minimal nex rootfs with bash init
  nex_structure: true
  checksum: fd375b373548d00250a8c1c0d3b76be0b4684849c3b99026bcd2f0711e60c35a

dependencies:
- name: nex-utilities
  commit: x86_64/pkg/core/userland/nex-utilities/0.0.1/bundles/dev
- name: findutils
  commit: x86_64/pkg/core/userland/findutils/4.9.0/bundles/dev

packages:
- name: glibc-conf
  commit: x86_64/pkg/libs/system/glibc/2.39/outputs/conf
- name: bash
  commit: x86_64/pkg/cli/shells/bash/5.2.21/outputs/bin
- name: coreutils
  commit: x86_64/pkg/core/userland/coreutils/9.5/outputs/bin
- name: findutils
  commit: x86_64/pkg/core/userland/findutils/4.9.0/outputs/bin
- name: sed
  commit: x86_64/pkg/cli/text/sed/4.9/outputs/bin
- name: grep
  commit: x86_64/pkg/cli/text/grep/3.11/outputs/bin

build:
  environment: 13ce31fd97c19f5756e4413babf279d543b5a71c

  script: |
    # create minimal /etc/passwd and /etc/group
    mkdir -p /target/etc

    cat > /target/etc/passwd << 'EOF'
    root:x:0:0:root:/root:/bin/bash
    EOF

    cat > /target/etc/group << 'EOF'
    root:x:0:
    EOF

    # create mount points for essential filesystems
    mkdir -p /target/{proc,sys,dev,run,root}

    # create a simple init script
    cat > /target/init << 'EOF'
    #!/usr/bin/bash

    mount -t proc proc /proc
    mount -t sysfs sysfs /sys
    mount -t tmpfs tmpfs /run

    echo "=== nex-minimal started ==="
    echo "System info:"
    uname -a
    echo ""
    echo "Package structure:"
    ls -la /nex/pkg/
    echo ""
    echo "Symlinks in /usr/bin:"
    ls -la /usr/bin/ | head -20
    echo ""
    echo "Testing bash from /nex structure..."
    /usr/bin/bash --version
    echo ""
    echo "Starting shell..."

    exec /usr/bin/bash
    EOF

    chmod +x /target/init

    find /target -exec touch -d "2024-01-01T00:00:00+00:00" {} \;
