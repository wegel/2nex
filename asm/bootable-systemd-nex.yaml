- name: 2nex-utilities
  commit: x86_64/pkg/core/userland/2nex-utilities/0.0.1/bundles/dev
- name: findutils
  commit: x86_64/pkg/core/userland/findutils/4.9.0/bundles/dev
# runtime libs needed by packages
- name: glibc
  commit: x86_64/pkg/libs/system/glibc/2.39/outputs/lib
- name: gcc-libs
  commit: x86_64/pkg/core/toolchain/gcc/13.2.0/outputs/lib
- name: ncurses
  commit: x86_64/pkg/libs/system/ncurses/6.4-20230520/outputs/lib
- name: zlib
  commit: x86_64/pkg/libs/system/zlib/1.3.1/outputs/lib
- name: xz
  commit: x86_64/pkg/libs/compression/xz/5.4.6/outputs/lib
- name: zstd
  commit: x86_64/pkg/libs/compression/zstd/1.5.6/outputs/lib
- name: libcap
  commit: x86_64/pkg/libs/security/libcap/2.69/outputs/lib
- name: acl
  commit: x86_64/pkg/libs/system/acl/2.3.2/outputs/lib
- name: attr
  commit: x86_64/pkg/libs/system/attr/2.5.2/outputs/lib
- name: expat
  commit: x86_64/pkg/libs/system/expat/2.6.2/outputs/lib
- name: gmp
  commit: x86_64/pkg/libs/system/gmp/6.3.0/outputs/lib
- name: libxcrypt
  commit: x86_64/pkg/libs/system/libxcrypt/4.4.36/outputs/lib
- name: openssl
  commit: x86_64/pkg/dev/libs/openssl3/3.3.1/outputs/lib
- name: util_linux-lib
  commit: x86_64/pkg/core/userland/util_linux/2.40/outputs/lib
- name: nex-ld-shim
  commit: x86_64/pkg/core/nex/nex-ld-shim/0.1.0/outputs/bin

packages:
# systemd - init system
- commit: x86_64/pkg/core/init/systemd/257.5/outputs/bin
  name: systemd-bin
- commit: x86_64/pkg/core/init/systemd/257.5/outputs/lib
  name: systemd-lib
- commit: x86_64/pkg/core/init/systemd/257.5/outputs/conf
  name: systemd-conf

# dbus-broker - D-Bus message broker
- commit: x86_64/pkg/core/ipc/dbus-broker/37/outputs/bin
  name: dbus-broker-bin
- commit: x86_64/pkg/core/ipc/dbus-broker/37/outputs/conf
  name: dbus-broker-conf

# bash - shell
- commit: x86_64/pkg/cli/shells/bash/5.2.21/outputs/bin
  name: bash

# coreutils - basic commands
- commit: x86_64/pkg/core/userland/coreutils/9.5/outputs/bin
  name: coreutils

# util-linux - essential system utilities
- commit: x86_64/pkg/core/userland/util_linux/2.40/outputs/bin
  name: util-linux

# findutils - find, xargs
- commit: x86_64/pkg/core/userland/findutils/4.9.0/outputs/bin
  name: findutils

# grep - pattern matching
- commit: x86_64/pkg/cli/text/grep/3.11/outputs/bin
