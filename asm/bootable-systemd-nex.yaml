system:
  schema: 1
  name: "Bootable System with systemd and nex"
  slug: "bootable-systemd-nex"
  version: "0.0.1"
  description: "Bootable system with systemd init, nex package manager, and /nex/pkg structure"
  nex_structure: true

  checksum: 3b8fe00d0d79d42ea55f6eb9b5688415e340b7ed7586e1801017efb3256d4274
