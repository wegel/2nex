files:
# users and groups
- path: /etc/passwd
  mode: 420
  content: |
    root:x:0:0:root:/root:/bin/bash
    testuser:x:1000:1000:Test User:/home/testuser:/bin/bash
    systemd-network:x:192:192:systemd Network Management:/:/usr/bin/nologin
    systemd-resolve:x:193:193:systemd Resolver:/:/usr/bin/nologin
    systemd-timesync:x:194:194:systemd Time Synchronization:/:/usr/bin/nologin
    sshd:x:74:74:Privilege-separated SSH:/var/lib/sshd:/usr/bin/nologin

- path: /etc/group
  mode: 420
  content: |
    root:x:0:
    testuser:x:1000:
    systemd-network:x:192:
    systemd-resolve:x:193:
    systemd-timesync:x:194:
    systemd-journal:x:190:
    sshd:x:74:
    utmp:x:22:

- path: /etc/shadow
  mode: 384
  content: |
    root::19735:0:99999:7:::
    testuser::19735:0:99999:7:::
    systemd-network:!*:19735::::::
    systemd-resolve:!*:19735::::::
    systemd-timesync:!*:19735::::::

- path: /etc/subuid
  mode: 420
  content: |
    testuser:100000:65536

- path: /etc/subgid
  mode: 420
  content: |
    testuser:100000:65536

# system config
- path: /etc/os-release
  mode: 420
  content: |
    NAME="nex"
    PRETTY_NAME="nex Linux"
    ID=nex
    VERSION_ID=0.0.1

- path: /etc/fstab
  mode: 420

- path: /etc/sysctl.conf
  mode: 420

- path: /etc/machine-id
  mode: 420

- path: /etc/inputrc
  mode: 420
  content: |
    set editing-mode emacs
    set bell-style none
    "\e[1;5C": forward-word
    "\e[1;5D": backward-word
    "\C-h": backward-kill-word

- path: /etc/security/namespace.conf
  mode: 420
  content: |
    # Empty config to satisfy pam_namespace.

# systemd networking
- path: /etc/systemd/network/80-dhcp.network
  mode: 420
  content: |
    [Match]
    Name=en*

    [Network]
    DHCP=yes

# ssh
- path: /etc/ssh/sshd_config
  mode: 420
  content: |
    PermitRootLogin yes
    PermitEmptyPasswords yes
    PasswordAuthentication yes
    PubkeyAuthentication yes
    AuthorizedKeysFile none
    AuthorizedKeysCommand /usr/local/bin/accept-any-key %t %k
    AuthorizedKeysCommandUser root
    HostKey /etc/ssh/ssh_host_ed25519_key
    HostKey /etc/ssh/ssh_host_rsa_key
    HostKey /etc/ssh/ssh_host_ecdsa_key
    Subsystem sftp /usr/libexec/sftp-server

- path: /usr/local/bin/accept-any-key
  mode: 493
  content: |
    #!/bin/bash
    echo "$1 $2"

# initialize /nex/manifests as a writable git repo (backed by /var) on first boot
- path: /usr/local/bin/nex-init-manifests
  mode: 493
  content: |
    #!/bin/sh
    set -eu

    dst=/nex/manifests
    src=/usr/share/nex/manifests

    if [ -d "$dst/.git" ]; then
        exit 0
    fi

    if [ ! -d "$src" ]; then
        echo "nex-init-manifests: missing source snapshot at $src" >&2
        exit 0
    fi

    mkdir -p "$dst"
    cp -a "$src/." "$dst/"

    if ! command -v git >/dev/null 2>&1; then
        echo "nex-init-manifests: git not available, leaving snapshot without .git" >&2
        exit 0
    fi

    cd "$dst"
    git init -q
    git config user.name "nex"
    git config user.email "nex@localhost"
    git add -A >/dev/null 2>&1 || true
    git commit -q -m "nex manifests snapshot" --allow-empty || true

- path: /etc/systemd/system/nex-init-manifests.service
  mode: 420
  content: |
    [Unit]
    Description=Initialize /nex/manifests for self-hosting
    After=local-fs.target

    [Service]
    Type=oneshot
    ExecStart=/usr/local/bin/nex-init-manifests

    [Install]
    WantedBy=multi-user.target

# tmpfiles
- path: /etc/tmpfiles.d/home-testuser.conf
  mode: 420
  content: |
    d /home/testuser 0755 testuser testuser -

# dbus socket activation expects /run/dbus to exist (it is a tmpfs, so create via tmpfiles)
- path: /usr/lib/tmpfiles.d/dbus.conf
  mode: 420
  content: |
    d /run/dbus 0755 root root -

# directories
- path: /var/lib/sshd
  directory: true
  mode: 448

- path: /home/testuser
  directory: true

# symlinks
- path: /bin
  symlink: /usr/bin
  replace: true

- path: /sbin
  symlink: /usr/sbin
  replace: true

- path: /lib
  symlink: /usr/lib
  replace: true

- path: /usr/sbin
  symlink: /usr/bin
  replace: true

- path: /var/run
  symlink: /run

- path: /etc/mtab
  symlink: /proc/self/mounts

- path: /usr/lib/os-release
  symlink: ../../etc/os-release

- path: /etc/resolv.conf
  symlink: /run/systemd/resolve/stub-resolv.conf

# OpenSSL compatibility path; the early boot service regenerates this cache.
- path: /etc/ssl/certs
  symlink: /run/ssl/certs

- path: /usr/lib/systemd/system/update-ca-certificates.service.d/runtime-store.conf
  mode: 420
  content: |
    [Service]
    ExecStartPre=/usr/bin/mkdir -p /run/ssl
    ExecStartPre=-/usr/bin/ln -s /usr/lib/ssl/certs /run/ssl/certs
    ExecStart=
    ExecStart=/usr/bin/update-ca-certificates --output-dir /run/ssl/certs

- path: /init
  symlink: usr/bin/init

# systemd dbus-activation aliases (force symlinks to avoid duplicate BusName units)
- path: /usr/lib/systemd/system/dbus-org.freedesktop.hostname1.service
  symlink: systemd-hostnamed.service
  replace: true

- path: /usr/lib/systemd/system/dbus-org.freedesktop.locale1.service
  symlink: systemd-localed.service
  replace: true

- path: /usr/lib/systemd/system/dbus-org.freedesktop.login1.service
  symlink: systemd-logind.service
  replace: true

- path: /usr/lib/systemd/system/dbus-org.freedesktop.machine1.service
  symlink: systemd-machined.service
  replace: true

- path: /usr/lib/systemd/system/dbus-org.freedesktop.portable1.service
  symlink: systemd-portabled.service
  replace: true

- path: /usr/lib/systemd/system/dbus-org.freedesktop.timedate1.service
  symlink: systemd-timedated.service
  replace: true

# PAM configs used by systemd-user
- path: /etc/pam.d/systemd-user
  symlink: /usr/lib/pam.d/systemd-user
  replace: true

- path: /etc/pam.d/systemd-run0
  symlink: /usr/lib/pam.d/systemd-run0
  replace: true

# dbus.service alias
- path: /usr/lib/systemd/system/dbus.service
  symlink: dbus-broker.service
  replace: true

# systemd service enablement
- path: /etc/systemd/system/multi-user.target.wants/systemd-networkd.service
  symlink: /usr/lib/systemd/system/systemd-networkd.service

- path: /etc/systemd/system/multi-user.target.wants/systemd-resolved.service
  symlink: /usr/lib/systemd/system/systemd-resolved.service

- path: /etc/systemd/system/getty.target.wants/getty@tty1.service
  symlink: /usr/lib/systemd/system/getty@.service

- path: /etc/systemd/system/multi-user.target.wants/sshd-keygen.service
  symlink: /usr/lib/systemd/system/sshd-keygen.service

- path: /etc/systemd/system/multi-user.target.wants/sshd.service
  symlink: /usr/lib/systemd/system/sshd.service

- path: /etc/systemd/system/multi-user.target.wants/nex-init-manifests.service
  symlink: /etc/systemd/system/nex-init-manifests.service

- path: /etc/systemd/system/sockets.target.wants/dbus.socket
  symlink: /usr/lib/systemd/system/dbus.socket
