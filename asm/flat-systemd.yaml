system:
  schema: 1
  name: Flat Systemd System
  slug: flat-systemd
  version: 0.0.1
  description: Minimal flat rootfs with systemd init
  checksum: 90fafdd1915f50aa96fdd994eff3cad62a336222757eca8be928913c4c8a5d87

dependencies:
- name: findutils
  commit: x86_64/pkg/core/userland/findutils/4.9.0/bundles/dev

packages:
- name: glibc-conf
  commit: x86_64/pkg/libs/system/glibc/2.39/outputs/conf
- name: attr-conf
  commit: x86_64/pkg/libs/system/attr/2.5.2/outputs/conf
- name: linux
  commit: x86_64/pkg/core/kernel/linux/6.18.24/bundles/vm
- name: linux-boot
  commit: x86_64/pkg/core/kernel/linux/6.18.24/outputs/boot
- name: initramfs
  commit: x86_64/pkg/core/kernel/initramfs/1.0.0/outputs/boot
- name: systemd-bin
  commit: x86_64/pkg/core/init/systemd/257.5/outputs/bin
- name: systemd-lib
  commit: x86_64/pkg/core/init/systemd/257.5/outputs/lib
- name: coreutils-bin
  commit: x86_64/pkg/core/userland/coreutils/9.5/outputs/bin
- name: util-linux-bin
  commit: x86_64/pkg/core/userland/util_linux/2.40/outputs/bin
- name: bash-bin
  commit: x86_64/pkg/cli/shells/bash/5.2.21/outputs/bin
- name: shadow
  commit: x86_64/pkg/core/userland/shadow/4.15.1/bundles/runtime
- name: dbus-broker-bin
  commit: x86_64/pkg/core/ipc/dbus-broker/37/outputs/bin
- name: dbus-broker-conf
  commit: x86_64/pkg/core/ipc/dbus-broker/37/outputs/conf
- name: kmod-bin
  commit: x86_64/pkg/core/kernel/kmod/32/outputs/bin

build:
  environment: 13ce31fd97c19f5756e4413babf279d543b5a71c

  script: |
    mkdir -p /target/etc /target/root

    cat > /target/etc/passwd << 'EOF'
    root:x:0:0:root:/root:/usr/bin/bash
    systemd-network:x:192:192:systemd Network Management:/:/usr/bin/nologin
    systemd-resolve:x:193:193:systemd Resolver:/:/usr/bin/nologin
    systemd-timesync:x:194:194:systemd Time Synchronization:/:/usr/bin/nologin
    EOF

    cat > /target/etc/group << 'EOF'
    root:x:0:
    systemd-network:x:192:
    systemd-resolve:x:193:
    systemd-timesync:x:194:
    systemd-journal:x:190:
    EOF

    cat > /target/etc/shadow << 'EOF'
    root::19735:0:99999:7:::
    systemd-network:!*:19735::::::
    systemd-resolve:!*:19735::::::
    systemd-timesync:!*:19735::::::
    EOF
    chmod 600 /target/etc/shadow

    cat > /target/etc/nsswitch.conf << 'EOF'
    passwd:     files
    group:      files
    shadow:     files
    hosts:      files dns
    networks:   files
    protocols:  files
    services:   files
    EOF

    cat > /target/etc/os-release << 'EOF'
    NAME="nex"
    ID=nex
    VERSION="0.0.1"
    EOF

    echo "uninitialized" > /target/etc/machine-id

    mkdir -p /target/{proc,sys,dev,run,tmp}
    ln -sf usr/lib /target/lib
    ln -sf usr/lib /target/lib64
    ln -sf usr/bin /target/bin

    mkdir -p /target/etc/systemd/system
    mkdir -p /target/var/log/journal
    mkdir -p /target/var/lib/systemd

    cat > /target/usr/lib/profile << 'EOF'
    export PS1='# '
    export TERM=linux
    EOF

    ln -sf /usr/lib/systemd/systemd /target/init

    # kmod symlinks
    ln -sf /usr/bin/kmod /target/usr/bin/modprobe
    ln -sf /usr/bin/kmod /target/usr/bin/insmod
    ln -sf /usr/bin/kmod /target/usr/bin/rmmod
    ln -sf /usr/bin/kmod /target/usr/bin/lsmod
    ln -sf /usr/bin/kmod /target/usr/bin/depmod
    ln -sf /usr/bin /target/sbin

    find /target -exec touch -h -d "2024-01-01T00:00:00+00:00" {} \;
