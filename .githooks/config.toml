[hooks.pre_commit]
phases = [
  { kind = "code-style", mode = "blocking", scope = "staged" },
  { kind = "fmt", mode = "blocking" },
  { kind = "clippy", mode = "blocking" },
  { kind = "test", mode = "blocking" },
]

[hooks.commit_msg]
phases = [{ kind = "commit-message", mode = "blocking" }]

[hooks.pre_push]
phases = []

[code_style]
excluded_paths = []

[[rust_projects]]
name = "hook runner"
manifest_path = "xtask/Cargo.toml"

[[rust_projects]]
name = "Nex builder"
manifest_path = "src/nex-builder/Cargo.toml"

[[rust_projects]]
name = "Nex bootloader"
manifest_path = "src/bootloader/Cargo.toml"
clippy_args = ["--target", "x86_64-unknown-linux-gnu"]
test_args = ["--target", "x86_64-unknown-linux-gnu", "--no-default-features"]
