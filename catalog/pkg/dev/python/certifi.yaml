build:
  environment: 248c5014338ab55a89b9c261e303e111e6847aec
  profile: [957:2379]

  script: |
    set -eu

    tar --no-same-owner -xf "/./${SOURCE_certifi}" -C "${WORK_DIR}" --strip-components=1
    cd "${WORK_DIR}"

    python3 -m pip install --no-build-isolation --no-deps --root="${OUT_DIR}" --prefix=/usr .

    find "${OUT_DIR}" -exec touch -d "2024-01-01T00:00:00+00:00" {} \;

