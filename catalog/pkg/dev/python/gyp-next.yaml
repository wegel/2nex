  name: gyp-next
  slug: gyp-next
  namespace: dev/python
  version: 0.21.0
  description: GYP build tool (maintained fork)
  homepage: https://pypi.org/project/gyp-next/
  checksum: 2838d6f43e89dd81a3f9a1538a88e052a7d846f43592f30a98653d111ddc2cfe

sources:
- name: gyp-next
  url: https://files.pythonhosted.org/packages/source/g/gyp-next/gyp_next-0.21.0.tar.gz
  sha256: 4cbf51defec8e8fe5ac963f17513eaf21b0d0e26a9ca3af90c835e06bcd6f043

