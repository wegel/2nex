  commit: x86_64/pkg/dev/python/packaging/25.0/bundles/dev

build:
  environment: 248c5014338ab55a89b9c261e303e111e6847aec
  profile: [1782:3252]

  script: |
    set -eux
    tar --no-same-owner -xf /${SOURCE_gyp_next} -C "${WORK_DIR}" --strip-components=1
    cd ${WORK_DIR}

    PYTHONDONTWRITEBYTECODE=1 \
      python3 -m pip install --no-build-isolation --no-deps --no-compile \
      --root="${OUT_DIR}" --prefix=/usr .

    find "${OUT_DIR}" -type d -name '__pycache__' -exec rm -rf {} + 2>/dev/null || true
    find "${OUT_DIR}" -name '*.pyc' -delete 2>/dev/null || true
    if [ -f "${OUT_DIR}/usr/lib/python3.12/site-packages/gyp_next-0.21.0.dist-info/RECORD" ]; then
      tmp_record="${OUT_DIR}/tmp/RECORD"
      mkdir -p "${OUT_DIR}/tmp"
      grep -v '__pycache__' "${OUT_DIR}/usr/lib/python3.12/site-packages/gyp_next-0.21.0.dist-info/RECORD" \
        | grep -v '\.pyc' \
        | LC_ALL=C sort > "${tmp_record}"
      mv "${tmp_record}" "${OUT_DIR}/usr/lib/python3.12/site-packages/gyp_next-0.21.0.dist-info/RECORD"
    fi

    find "${OUT_DIR}" -exec touch -d "2024-01-01T00:00:00+00:00" {} \;

bundles:
  dev:
  - bin
  - lib

  full:
  - bin
  - lib

