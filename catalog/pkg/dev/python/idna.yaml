package:
  schema: 1
  name: idna
  slug: idna
  namespace: dev/python
  version: "3.10"
  description: Python IDNA domain name library
  homepage: https://github.com/kjd/idna
  checksum: 2840cb5261856ffe481eff72d48dceff435ae0f3bdd8875717762c8004be52f1

sources:
- name: idna
  url: https://files.pythonhosted.org/packages/f1/70/7703c29685631f5a7590aa73f1f1d3fa9a380e654b86af429e0934a32f7d/idna-3.10.tar.gz
  sha256: 12f65c9b470abda6dc35cf8e63cc574b1c52b11df2c86030af0ac09b01b13ea9

dependencies:
- name: bash
  commit: x86_64/pkg/cli/shells/bash/5.2.21/bundles/dev
- name: coreutils
  commit: x86_64/pkg/core/userland/coreutils/9.5/bundles/dev
- name: findutils
  commit: x86_64/pkg/core/userland/findutils/4.9.0/bundles/dev
- name: tar
  commit: x86_64/pkg/cli/archive/tar/1.35/bundles/dev
- name: gzip
  commit: x86_64/pkg/cli/archive/gzip/1.13/bundles/dev
- name: python3
  commit: x86_64/pkg/dev/lang/python3/3.12.2/bundles/dev
- name: flit-core
  commit: x86_64/pkg/dev/python/flit-core/3.9.0/bundles/dev

build:
  environment: 248c5014338ab55a89b9c261e303e111e6847aec
  profile: [922:791]

  script: |
    set -eu

    tar --no-same-owner -xf "/./${SOURCE_idna}" -C "${WORK_DIR}" --strip-components=1
    cd "${WORK_DIR}"

    python3 -m pip install --no-build-isolation --no-deps --root="${OUT_DIR}" --prefix=/usr .

    find "${OUT_DIR}" -exec touch -d "2024-01-01T00:00:00+00:00" {} \;

bundles:
  full:
  - lib

