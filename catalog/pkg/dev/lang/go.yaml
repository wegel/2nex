- name: acl
  commit: x86_64/pkg/libs/system/acl/2.3.2/bundles/dev

build:
  environment: 248c5014338ab55a89b9c261e303e111e6847aec
  profile: [32:7824]

  script: |
    # Extract the pre-built Go binary
    mkdir -p ${OUT_DIR}/usr/lib
    tar --no-same-owner -xf ${SOURCE_go_binary} -C "${OUT_DIR}/usr/lib"

    # Create symlinks in /usr/bin to Go binaries
    mkdir -p ${OUT_DIR}/usr/bin
    ln -sf ../lib/go/bin/go ${OUT_DIR}/usr/bin/go
    ln -sf ../lib/go/bin/gofmt ${OUT_DIR}/usr/bin/gofmt

    # Set consistent timestamps for reproducible builds
    find "${OUT_DIR}" -exec touch -h -d '2024-01-01T00:00:00+00:00' {} \;

bundles:
  dev:
  - bin
  - dev
  - lib
  - static

  full:
  - bin
  - dev
  - lib
  - static

