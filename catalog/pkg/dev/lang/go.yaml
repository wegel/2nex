  slug: go
  namespace: dev/lang
  version: 1.26.4
  description: An open source programming language that makes it easy to build simple, reliable, and efficient software
  homepage: https://go.dev/
  checksum: eca1fa3b3fe41367224157d57ab3068e604d917d30a4b05dd3af1b09d57fbcd6

sources:
- name: go_binary
  url: https://go.dev/dl/go1.26.4.linux-amd64.tar.gz
  sha256: 1153d3d50e0ac764b447adfe05c2bcf08e889d42a02e0fe0259bd47f6733ad7f

dependencies:
- name: bash
  commit: x86_64/pkg/cli/shells/bash/5.2.21/bundles/dev
- name: coreutils
  commit: x86_64/pkg/core/userland/coreutils/9.5/bundles/dev
- name: findutils
  commit: x86_64/pkg/core/userland/findutils/4.9.0/bundles/dev
- name: gzip
  commit: x86_64/pkg/cli/archive/gzip/1.13/bundles/dev
- name: tar
  commit: x86_64/pkg/cli/archive/tar/1.35/bundles/dev
- name: glibc
