build:
  environment: 248c5014338ab55a89b9c261e303e111e6847aec
  profile: [4545:1646, 14727:1647, 35058:1650, 50425:1780, 70800:1802, 86075:1911, 101378:1961, 126940:2079, 152406:2161, 167984:4617]

  script: |
    set -eu
    tar --no-same-owner -xf "${SOURCE_tk}" -C "${WORK_DIR}" --strip-components=1
    cd "${WORK_DIR}/unix"

    ./configure \
      --prefix=/usr \
      --mandir=/usr/share/man \
      --with-tcl=/usr/lib \
      --disable-xft

    make
    make DESTDIR="${OUT_DIR}" install
    make DESTDIR="${OUT_DIR}" install-private-headers
    ln -sf wish8.6 "${OUT_DIR}/usr/bin/wish"

    find "${OUT_DIR}" -type f -executable -exec strip --strip-unneeded {} \; 2>/dev/null || true
    find "${OUT_DIR}" -name '*.a' -exec objcopy --enable-deterministic-archives {} \; 2>/dev/null || true
    find "${OUT_DIR}" -exec touch -d "2024-01-01T00:00:00+00:00" {} \;

