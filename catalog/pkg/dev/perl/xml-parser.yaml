    - path: /usr/lib/perl5/5.38/site_perl/XML/Parser/Encodings/iso-8859-4.enc
    - path: /usr/lib/perl5/5.38/site_perl/XML/Parser/Encodings/iso-8859-5.enc
    - path: /usr/lib/perl5/5.38/site_perl/XML/Parser/Encodings/iso-8859-7.enc
