    - path: /usr/lib/perl5/5.38/site_perl/auto/XML/Parser/Expat/Expat.so
      needs:
      - /usr/lib/ld-linux-x86-64.so.2
      - /usr/lib/libc.so.6
      - /usr/lib/libexpat.so.1

  man:
    files:
    - path: /usr/share/man/man3/XML::Parser.3
