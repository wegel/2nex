    - path: /usr/lib/perl5/5.38/site_perl/XML/Parser/Encodings/koi8-r.enc
    - path: /usr/lib/perl5/5.38/site_perl/XML/Parser/Encodings/windows-1250.enc
    - path: /usr/lib/perl5/5.38/site_perl/XML/Parser/Encodings/windows-1251.enc
    - path: /usr/lib/perl5/5.38/site_perl/XML/Parser/Encodings/windows-1252.enc
    - path: /usr/lib/perl5/5.38/site_perl/XML/Parser/Encodings/windows-1255.enc
    - path: /usr/lib/perl5/5.38/site_perl/XML/Parser/Encodings/x-euc-jp-jisx0221.enc
    - path: /usr/lib/perl5/5.38/site_perl/XML/Parser/Encodings/x-euc-jp-unicode.enc
    - path: /usr/lib/perl5/5.38/site_perl/XML/Parser/Encodings/x-sjis-cp932.enc
    - path: /usr/lib/perl5/5.38/site_perl/XML/Parser/Encodings/x-sjis-jdk117.enc
