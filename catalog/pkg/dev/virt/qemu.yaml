build:
  environment: 248c5014338ab55a89b9c261e303e111e6847aec
  profile: [8247:98215, 24771:130398, 53761:156899, 86954:178505, 115928:193253, 144915:202692, 169642:227393, 215037:261620, 256274:283217, 282618:695839]

  script: |
    tar --no-same-owner -xf /${SOURCE_qemu} -C "${WORK_DIR}" --strip-components=1
    cd ${WORK_DIR}

    export CC=gcc
    export CXX=g++

    ./configure --prefix=/usr \
      --sysconfdir=/etc \
      --localstatedir=/var \
      --target-list=x86_64-softmmu \
      --disable-docs \
      --disable-gtk \
      --disable-sdl \
      --disable-spice \
      --disable-usb-redir \
      --disable-libusb \
      --disable-virglrenderer \
      --disable-opengl \
      --disable-vnc \
      --disable-curses \
      --disable-brlapi \
      --disable-vte \
      --disable-capstone \
      --disable-libiscsi \
      --disable-libnfs \
      --disable-libssh \
      --disable-slirp \
      --disable-bzip2 \
      --disable-lzo \
      --disable-snappy \
      --disable-rdma \
      --disable-xen \
      --disable-numa \
      --disable-debug-info \
      --disable-fdt \
      --enable-kvm \
      --enable-pie \
      --audio-drv-list=

    ninja -C build
    DESTDIR="${OUT_DIR}" ninja -C build install

    find ${OUT_DIR} -type f -executable -exec strip --strip-unneeded {} \; 2>/dev/null || true
    find ${OUT_DIR} -name '*.a' -exec objcopy --enable-deterministic-archives {} \; 2>/dev/null || true
    find "${OUT_DIR}" -exec touch -d '2024-01-01T00:00:00+00:00' {} \;

bundles:
  dev:
  - bin
  - misc

