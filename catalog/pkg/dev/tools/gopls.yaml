package:
  schema: 1
  name: gopls
  slug: gopls
  namespace: dev/tools
  version: 0.23.0
  description: Go language server
  homepage: https://pkg.go.dev/golang.org/x/tools/gopls
  checksum: 4022cff54ed1874f0d72e20013a37e45cda95be9800b10fa0de841c6a67b85ff

sources:
- name: gopls
  url: https://github.com/golang/tools/archive/refs/tags/gopls/v0.23.0.tar.gz
  sha256: 1ba41875b918db73c6a409ad8f552b85f72dfeea43ffb541b798322ff6b4152b
- name: vendor
  sha256: 72268179d2e47cf33b3acdcbc492baa1834927e32086a268c30fbd1de1a4d884
  go_sum: https://raw.githubusercontent.com/golang/tools/gopls/v0.23.0/gopls/go.sum

dependencies:
- name: bash
  commit: x86_64/pkg/cli/shells/bash/5.2.21/bundles/dev
- name: coreutils
  commit: x86_64/pkg/core/userland/coreutils/9.5/bundles/dev
- name: findutils
  commit: x86_64/pkg/core/userland/findutils/4.9.0/bundles/dev
- name: binutils
  commit: x86_64/pkg/core/toolchain/binutils/2.42/bundles/dev
- name: gzip
  commit: x86_64/pkg/cli/archive/gzip/1.13/bundles/dev
- name: tar
  commit: x86_64/pkg/cli/archive/tar/1.35/bundles/dev
- name: glibc
  commit: x86_64/pkg/libs/system/glibc/2.39/bundles/dev
- name: go
  commit: x86_64/pkg/dev/lang/go/1.26.4/bundles/dev
- name: ncurses
  commit: x86_64/pkg/libs/system/ncurses/6.4-20230520/bundles/dev
- name: acl
  commit: x86_64/pkg/libs/system/acl/2.3.2/bundles/dev
- name: attr
  commit: x86_64/pkg/libs/system/attr/2.5.2/bundles/dev

build:
  environment: 248c5014338ab55a89b9c261e303e111e6847aec
  profile: [32:7253]

  script: |
    tar --no-same-owner -xf ${SOURCE_gopls} -C "${WORK_DIR}" --strip-components=1
    tar --no-same-owner -xf /./${SOURCE_vendor} -C "${WORK_DIR}/gopls"
    cd "${WORK_DIR}/gopls"

    export GOROOT=/usr/lib/go
    export GOPATH=${WORK_DIR}/gopath
    export GOCACHE=${WORK_DIR}/gocache
    export CGO_ENABLED=0
    export GOTOOLCHAIN=local
    mkdir -p "${GOPATH}" "${GOCACHE}"

    go build -mod=vendor -ldflags="-s -w -X main.version=v0.23.0" -o gopls .

    mkdir -p "${OUT_DIR}/usr/bin"
    install -m 755 gopls "${OUT_DIR}/usr/bin/gopls"

    strip --strip-all "${OUT_DIR}/usr/bin/gopls"

    find "${OUT_DIR}" -exec touch -d '2024-01-01T00:00:00+00:00' {} \;

bundles:
  dev:
  - bin

outputs:
  bin:
    files:
    - path: /usr/bin/gopls
