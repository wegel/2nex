package:
  schema: 1
  name: libgpg-error
  slug: libgpg-error
  namespace: dev/libs
  version: "1.59"
  description: Library that defines common error values for all GnuPG components
  homepage: https://www.gnupg.org/software/libgpg-error/
  checksum: d7b2b074c78e5e539a71d4f0c207f70212903f8100eea59ee5ad04bd23831411

sources:
- name: libgpg_error
  url: https://gnupg.org/ftp/gcrypt/libgpg-error/libgpg-error-1.59.tar.bz2
  sha256: a19bc5087fd97026d93cb4b45d51638d1a25202a5e1fbc3905799f424cfa6134

dependencies:
- name: glibc
  commit: x86_64/pkg/libs/system/glibc/2.39/bundles/dev
- name: gcc
  commit: x86_64/pkg/core/toolchain/gcc/13.2.0/bundles/dev
- name: binutils
  commit: x86_64/pkg/core/toolchain/binutils/2.42/bundles/dev
- name: bash
  commit: x86_64/pkg/cli/shells/bash/5.2.21/bundles/dev
- name: coreutils
  commit: x86_64/pkg/core/userland/coreutils/9.5/bundles/dev
- name: findutils
  commit: x86_64/pkg/core/userland/findutils/4.9.0/bundles/dev
- name: gawk
  commit: x86_64/pkg/cli/text/gawk/5.3.0/bundles/dev
- name: grep
  commit: x86_64/pkg/cli/text/grep/3.11/bundles/dev
- name: make
  commit: x86_64/pkg/core/toolchain/make/4.4.1/bundles/dev
- name: sed
  commit: x86_64/pkg/cli/text/sed/4.9/bundles/dev
- name: tar
  commit: x86_64/pkg/cli/archive/tar/1.35/bundles/dev
- name: linux-headers
  commit: x86_64/pkg/libs/system/linux-headers/6.4.1/bundles/dev
- name: ncurses
  commit: x86_64/pkg/libs/system/ncurses/6.4-20230520/bundles/dev
- name: acl
  commit: x86_64/pkg/libs/system/acl/2.3.2/bundles/dev
- name: attr
  commit: x86_64/pkg/libs/system/attr/2.5.2/bundles/dev
- name: gmp
  commit: x86_64/pkg/libs/system/gmp/6.3.0/bundles/dev
- name: libcap
  commit: x86_64/pkg/libs/security/libcap/2.69/bundles/dev
- name: zlib
  commit: x86_64/pkg/libs/system/zlib/1.3.1/bundles/dev
- name: bzip2
  commit: x86_64/pkg/libs/compression/bzip2/1.0.8/bundles/dev
- name: diffutils
  commit: x86_64/pkg/core/userland/diffutils/3.10/bundles/dev
- name: file
  commit: x86_64/pkg/dev/tools/file/5.45/bundles/dev
- name: inetutils
  commit: x86_64/pkg/net/misc/inetutils/2.5/bundles/dev

build:
  environment: 248c5014338ab55a89b9c261e303e111e6847aec
  profile: [4141:1097, 8268:3464, 17147:4264, 25434:4266, 29967:4301, 38432:4353, 47016:6985, 55749:7033, 68671:7353, 73125:7504]

  script: |
    tar --no-same-owner -xf ${SOURCE_libgpg_error} -C "${WORK_DIR}" --strip-components=1
    cd ${WORK_DIR}

    # Configure
    ./configure --prefix=/usr --disable-static

    # Build
    make

    # Install
    make DESTDIR="${OUT_DIR}" install

    # Set consistent timestamps for reproducible builds
    find "${OUT_DIR}" -exec touch -h -d '2024-01-01T00:00:00+00:00' {} \;

    strip --strip-unneeded ${OUT_DIR}/usr/bin/gpg-error || true
    strip --strip-unneeded ${OUT_DIR}/usr/bin/yat2m || true
    find ${OUT_DIR}/usr/lib -name "*.so*" -exec strip --strip-unneeded {} \; 2>/dev/null || true

bundles:
  dev:
  - bin
  - dev
  - lib

  full:
  - bin
  - dev
  - lib

outputs:
  bin:
    files:
    - path: /usr/bin/gpg-error
      needs:
      - /usr/lib/ld-linux-x86-64.so.2
      - /usr/lib/libc.so.6
      - /usr/lib/libgpg-error.so.0
    - path: /usr/bin/gpgrt-config
    - path: /usr/bin/yat2m
      needs:
      - /usr/lib/ld-linux-x86-64.so.2
      - /usr/lib/libc.so.6

  dev:
    files:
    - path: /usr/include/gpg-error.h
    - path: /usr/include/gpgrt.h
    - path: /usr/lib/libgpg-error.la
    - path: /usr/lib/pkgconfig/gpg-error.pc

  info:
    files:
    - path: /usr/share/info/gpgrt.info

  lib:
    files:
    - path: /usr/lib/libgpg-error.so
      needs:
      - /usr/lib/libc.so.6
    - path: /usr/lib/libgpg-error.so.0
      needs:
      - /usr/lib/libc.so.6
    - path: /usr/lib/libgpg-error.so.0.41.2
      needs:
      - /usr/lib/libc.so.6

  locale:
    files:
    - path: /usr/share/locale/cs/LC_MESSAGES/libgpg-error.mo
    - path: /usr/share/locale/da/LC_MESSAGES/libgpg-error.mo
    - path: /usr/share/locale/de/LC_MESSAGES/libgpg-error.mo
    - path: /usr/share/locale/eo/LC_MESSAGES/libgpg-error.mo
    - path: /usr/share/locale/es/LC_MESSAGES/libgpg-error.mo
    - path: /usr/share/locale/fr/LC_MESSAGES/libgpg-error.mo
    - path: /usr/share/locale/hu/LC_MESSAGES/libgpg-error.mo
    - path: /usr/share/locale/it/LC_MESSAGES/libgpg-error.mo
    - path: /usr/share/locale/ja/LC_MESSAGES/libgpg-error.mo
    - path: /usr/share/locale/nl/LC_MESSAGES/libgpg-error.mo
    - path: /usr/share/locale/pl/LC_MESSAGES/libgpg-error.mo
    - path: /usr/share/locale/pt/LC_MESSAGES/libgpg-error.mo
    - path: /usr/share/locale/ro/LC_MESSAGES/libgpg-error.mo
    - path: /usr/share/locale/ru/LC_MESSAGES/libgpg-error.mo
    - path: /usr/share/locale/sr/LC_MESSAGES/libgpg-error.mo
    - path: /usr/share/locale/sv/LC_MESSAGES/libgpg-error.mo
    - path: /usr/share/locale/tr/LC_MESSAGES/libgpg-error.mo
    - path: /usr/share/locale/uk/LC_MESSAGES/libgpg-error.mo
    - path: /usr/share/locale/vi/LC_MESSAGES/libgpg-error.mo
    - path: /usr/share/locale/zh_CN/LC_MESSAGES/libgpg-error.mo
    - path: /usr/share/locale/zh_TW/LC_MESSAGES/libgpg-error.mo

  man:
    files:
    - path: /usr/share/man/man1/gpgrt-config.1

  misc:
    files:
    - path: /usr/share/aclocal/gpg-error.m4
    - path: /usr/share/aclocal/gpgrt.m4
    - path: /usr/share/common-lisp/source/gpg-error/gpg-error-codes.lisp
    - path: /usr/share/common-lisp/source/gpg-error/gpg-error-package.lisp
    - path: /usr/share/common-lisp/source/gpg-error/gpg-error.asd
    - path: /usr/share/common-lisp/source/gpg-error/gpg-error.lisp
    - path: /usr/share/libgpg-error/errorref.txt

resolution:
  /usr/lib/ld-linux-x86-64.so.2: glibc
  /usr/lib/libc.so.6: glibc
  /usr/lib/libgpg-error.so.0: self
