build:
  environment: 248c5014338ab55a89b9c261e303e111e6847aec
  profile: [4127:31358, 8251:53615, 12368:65336, 16500:74272, 20651:78334, 24809:86636, 28908:93442, 31534:97652]

  script: |
    tar --no-same-owner -xf ${SOURCE_libgit2} -C "${WORK_DIR}" --strip-components=1
    cd ${WORK_DIR}

    mkdir build && cd build
    cmake .. \
      -DCMAKE_INSTALL_PREFIX=/usr \
      -DCMAKE_BUILD_TYPE=Release \
      -DUSE_SSH=OFF \
      -DUSE_HTTPS=OpenSSL \
      -DREGEX_BACKEND=pcre2 \
      -DBUILD_SHARED_LIBS=ON \
      -DBUILD_TESTS=OFF

    make -j${MAKEFLAGS#-j}
    make DESTDIR=${OUT_DIR} install

    find ${OUT_DIR} -type f -executable -exec strip --strip-unneeded {} \; 2>/dev/null || true
    find ${OUT_DIR} -name '*.a' -exec objcopy --enable-deterministic-archives {} \; 2>/dev/null || true
    find "${OUT_DIR}" -exec touch -d '2024-01-01T00:00:00+00:00' {} \;

