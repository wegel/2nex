package:
  schema: 1
  name: fmt
  slug: fmt
  namespace: dev/libs
  version: 11.2.0
  description: Modern C++ formatting library
  homepage: https://fmt.dev/
  checksum: 98845acc7364ea70eaba5ef7e93a1109df80634351d4d97d969cbe3f3e524f5d

sources:
- name: fmt
  url: https://github.com/fmtlib/fmt/archive/refs/tags/11.2.0.tar.gz
  sha256: bc23066d87ab3168f27cef3e97d545fa63314f5c79df5ea444d41d56f962c6af

dependencies:
- name: glibc
  commit: x86_64/pkg/libs/system/glibc/2.39/bundles/dev
- name: gmp
  commit: x86_64/pkg/libs/system/gmp/6.3.0/bundles/dev
- name: gcc
  commit: x86_64/pkg/core/toolchain/gcc/13.2.0/bundles/dev
- name: binutils
  commit: x86_64/pkg/core/toolchain/binutils/2.42/bundles/dev
- name: bash
  commit: x86_64/pkg/cli/shells/bash/5.2.21/bundles/dev
- name: ncurses
  commit: x86_64/pkg/libs/system/ncurses/6.4-20230520/bundles/dev
- name: acl
  commit: x86_64/pkg/libs/system/acl/2.3.2/bundles/dev
- name: attr
  commit: x86_64/pkg/libs/system/attr/2.5.2/bundles/dev
- name: tar
  commit: x86_64/pkg/cli/archive/tar/1.35/bundles/dev
- name: gzip
  commit: x86_64/pkg/cli/archive/gzip/1.13/bundles/dev
- name: zlib
  commit: x86_64/pkg/libs/system/zlib/1.3.1/bundles/dev
- name: coreutils
  commit: x86_64/pkg/core/userland/coreutils/9.5/bundles/dev
- name: findutils
  commit: x86_64/pkg/core/userland/findutils/4.9.0/bundles/dev
- name: linux-headers
  commit: x86_64/pkg/libs/system/linux-headers/6.4.1/bundles/dev
- name: cmake
  commit: x86_64/pkg/dev/build/cmake/3.31.10/bundles/full
- name: ninja
  commit: x86_64/pkg/core/toolchain/ninja/1.12.1/bundles/dev
- name: curl
  commit: x86_64/pkg/cli/net/curl/8.17.0/bundles/full
- name: libarchive
  commit: x86_64/pkg/libs/archive/libarchive/3.8.4/bundles/dev
- name: openssl
  commit: x86_64/pkg/dev/libs/openssl3/3.3.1/bundles/dev
- name: libxml2
  commit: x86_64/pkg/libs/system/libxml2/2.13.5/bundles/dev
- name: bzip2
  commit: x86_64/pkg/libs/compression/bzip2/1.0.8/bundles/dev
- name: xz
  commit: x86_64/pkg/libs/compression/xz/5.4.6/bundles/dev
- name: zstd
  commit: x86_64/pkg/libs/compression/zstd/1.5.6/bundles/dev
- name: lz4
  commit: x86_64/pkg/libs/compression/lz4/1.9.4/bundles/dev

build:
  environment: 248c5014338ab55a89b9c261e303e111e6847aec
  profile: [1987:2892]

  script: |
    set -eu

    tar --no-same-owner -xf "${SOURCE_fmt}" -C "${WORK_DIR}" --strip-components=1
    cd "${WORK_DIR}"

    cmake -S . -B build -G Ninja \
      -DCMAKE_INSTALL_PREFIX=/usr \
      -DCMAKE_INSTALL_LIBDIR=lib \
      -DCMAKE_BUILD_TYPE=Release \
      -DBUILD_SHARED_LIBS=ON \
      -DFMT_TEST=OFF \
      -DFMT_DOC=OFF

    cmake --build build
    DESTDIR="${OUT_DIR}" cmake --install build

    find "${OUT_DIR}" -type f -executable -exec strip --strip-unneeded {} \; 2>/dev/null || true
    find "${OUT_DIR}" -name '*.a' -exec objcopy --enable-deterministic-archives {} \; 2>/dev/null || true
    find "${OUT_DIR}" -exec touch -d "2024-01-01T00:00:00+00:00" {} \;

bundles:
  dev:
  - dev
  - lib

outputs:
  dev:
    files:
    - path: /usr/include/fmt/args.h
    - path: /usr/include/fmt/base.h
    - path: /usr/include/fmt/chrono.h
    - path: /usr/include/fmt/color.h
    - path: /usr/include/fmt/compile.h
    - path: /usr/include/fmt/core.h
    - path: /usr/include/fmt/format-inl.h
    - path: /usr/include/fmt/format.h
    - path: /usr/include/fmt/os.h
    - path: /usr/include/fmt/ostream.h
    - path: /usr/include/fmt/printf.h
    - path: /usr/include/fmt/ranges.h
    - path: /usr/include/fmt/std.h
    - path: /usr/include/fmt/xchar.h
    - path: /usr/lib/cmake/fmt/fmt-config-version.cmake
    - path: /usr/lib/cmake/fmt/fmt-config.cmake
    - path: /usr/lib/cmake/fmt/fmt-targets-release.cmake
    - path: /usr/lib/cmake/fmt/fmt-targets.cmake
    - path: /usr/lib/pkgconfig/fmt.pc

  lib:
    files:
    - path: /usr/lib/libfmt.so
      needs:
      - /usr/lib/libc.so.6
      - /usr/lib/libgcc_s.so.1
      - /usr/lib/libstdc++.so.6
    - path: /usr/lib/libfmt.so.11
      needs:
      - /usr/lib/libc.so.6
      - /usr/lib/libgcc_s.so.1
      - /usr/lib/libstdc++.so.6
    - path: /usr/lib/libfmt.so.11.2.0
      needs:
      - /usr/lib/libc.so.6
      - /usr/lib/libgcc_s.so.1
      - /usr/lib/libstdc++.so.6

resolution:
  /usr/lib/libgcc_s.so.1: gcc
  /usr/lib/libstdc++.so.6: gcc
  /usr/lib/libc.so.6: glibc
