build:
  environment: 248c5014338ab55a89b9c261e303e111e6847aec
  profile: [4114:1649, 8217:7509, 12524:8714, 13080:8924]

  script: |
    tar --no-same-owner -xf ${SOURCE0} -C "${WORK_DIR}" --strip-components=1
    cd ${WORK_DIR}
    patch --batch --fuzz=0 -Np1 -i "/${SOURCE_uapi_config_patch}"

    # disable iptables and berkeley db support
    sed -i /ARPD/d Makefile
    rm -fv man/man8/arpd.8

    make PREFIX=/usr SBINDIR=/usr/bin
    make PREFIX=/usr SBINDIR=/usr/bin DESTDIR=${OUT_DIR} install

    # Exercise the newly built, installed `ip` through its real rt_tables
    # reader instead of reimplementing its tier-merge and precedence rules;
    # see the check script for detail.
    sh "/${SOURCE_uapi_check}" \
      "${OUT_DIR}" \
      "${WORK_DIR}"

    find ${OUT_DIR} -type f -executable -exec strip --strip-unneeded {} \; 2>/dev/null || true
    find "${OUT_DIR}" -exec touch -d "2024-01-01T00:00:00+00:00" {} \;

