build:
  environment: 248c5014338ab55a89b9c261e303e111e6847aec
  profile: [2977:1589]

  script: |
    set -eu

    tar --no-same-owner -xf "${SOURCE_wofi}" -C "${WORK_DIR}" --strip-components=1
    cd "${WORK_DIR}"

    export PKG_CONFIG_PATH=/usr/lib/pkgconfig:/usr/share/pkgconfig

    meson setup build \
      --prefix=/usr \
      --buildtype=release \
      --pkg-config-path=/usr/lib/pkgconfig:/usr/share/pkgconfig

    ninja -C build
    DESTDIR="${OUT_DIR}" ninja -C build install

    strip --strip-unneeded "${OUT_DIR}/usr/bin/wofi"
    find "${OUT_DIR}" -exec touch -d "2024-01-01T00:00:00+00:00" {} \;

bundles:
  full:
  - bin
  - dev
  - man

outputs:
  bin:
    files:
    - path: /usr/bin/wofi
      needs:
      - /usr/lib/ld-linux-x86-64.so.2
      - /usr/lib/libc.so.6
      - /usr/lib/libcairo.so.2
      - /usr/lib/libgdk-3.so.0
      - /usr/lib/libgdk_pixbuf-2.0.so.0
      - /usr/lib/libgio-2.0.so.0
      - /usr/lib/libglib-2.0.so.0
      - /usr/lib/libgobject-2.0.so.0
      - /usr/lib/libgtk-3.so.0
      - /usr/lib/libpango-1.0.so.0
      - /usr/lib/libwayland-client.so.0

  dev:
    files:
    - path: /usr/include/wofi-1/config.h
    - path: /usr/include/wofi-1/map.h
    - path: /usr/include/wofi-1/utils.h
    - path: /usr/include/wofi-1/utils_g.h
    - path: /usr/include/wofi-1/widget_builder_api.h
    - path: /usr/include/wofi-1/wofi_api.h
    - path: /usr/lib/pkgconfig/wofi.pc

  man:
    files:
    - path: /usr/share/man/man1/wofi.1
    - path: /usr/share/man/man3/wofi-api.3
    - path: /usr/share/man/man3/wofi-config.3
    - path: /usr/share/man/man3/wofi-map.3
    - path: /usr/share/man/man3/wofi-utils.3
    - path: /usr/share/man/man3/wofi-widget-builder.3
    - path: /usr/share/man/man3/wofi.3
    - path: /usr/share/man/man5/wofi.5
    - path: /usr/share/man/man7/wofi-keys.7
    - path: /usr/share/man/man7/wofi.7

resolution:
  /usr/lib/libcairo.so.2: cairo
  /usr/lib/libgdk_pixbuf-2.0.so.0: gdk-pixbuf
  /usr/lib/libgio-2.0.so.0: glib2
  /usr/lib/libglib-2.0.so.0: glib2
  /usr/lib/libgobject-2.0.so.0: glib2
  /usr/lib/ld-linux-x86-64.so.2: glibc
  /usr/lib/libc.so.6: glibc
  /usr/lib/libgdk-3.so.0: gtk3
  /usr/lib/libgtk-3.so.0: gtk3
  /usr/lib/libpango-1.0.so.0: pango
  /usr/lib/libwayland-client.so.0: wayland
