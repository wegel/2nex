build:
  environment: 248c5014338ab55a89b9c261e303e111e6847aec
  profile: [8346:747, 29052:1079, 62693:1465, 104059:1617, 141257:1618, 174436:1636, 208002:1644, 262527:1693, 312156:1699, 344583:4816]

  script: |
    set -eu

    tar --no-same-owner -xf "${SOURCE_swaync}" -C "${WORK_DIR}" --strip-components=1
    cd "${WORK_DIR}"

    mkdir -p /tmp/nex-vala-bin
    printf '%s\n' '#!/usr/bin/env bash' \
      'exec /usr/bin/valac-0.56 --vapidir=/usr/share/vala-0.56/vapi --vapidir=/usr/share/vala/vapi "$@"' \
      > /tmp/nex-vala-bin/valac
    chmod +x /tmp/nex-vala-bin/valac
    export PATH="/tmp/nex-vala-bin:${PATH}"
    export PKG_CONFIG_PATH=/usr/lib/pkgconfig:/usr/share/pkgconfig

    sed -i 's/--pkg=GtkLayerShell-0.1/--pkg=gtk-layer-shell-0/' src/meson.build
    patch --batch --fuzz=0 -Np1 -i /${SOURCE_uapi_config_patch}

    meson setup build \
      --prefix=/usr \
      --libdir=lib \
      --sysconfdir=/etc \
      --buildtype=release \
      --pkg-config-path=/usr/lib/pkgconfig:/usr/share/pkgconfig \
      -Dpulse-audio=false \
      -Dscripting=true \
      -Dsystemd-service=true \
      -Dman-pages=true \
      -Dzsh-completions=true \
      -Dbash-completions=true \
      -Dfish-completions=true

    ninja -C build
    meson test -C build --print-errorlogs
    DESTDIR="${OUT_DIR}" ninja -C build install
    glib-compile-schemas "${OUT_DIR}/usr/share/glib-2.0/schemas"

    # The reader appends the application-relative swaync/<file> to every search
    # base, so the compiled vendor base must combine with that relative path to
    # name the files this package actually installs. Read the generated
    # constants rather than the binary, because that is the value the Vala
    # sources compile against.
    constants_file=$(find build -name constants.vala -print -quit)
    if [ -z "${constants_file}" ]; then
      printf 'swaync: no generated constants.vala found\n' >&2
      exit 1
    fi
    vendor_base=$(sed -n 's/.*VENDOR_CONFIG_DIR = "\([^"]*\)".*/\1/p' \
      "${constants_file}" | head -1)
    if [ "${vendor_base}" != /usr/share/xdg ]; then
      printf 'swaync: compiled vendor base is "%s", expected /usr/share/xdg\n' \
        "${vendor_base}" >&2
      exit 1
    fi
    for vendor_file in config.json style.css; do
      if [ ! -f "${OUT_DIR}${vendor_base}/swaync/${vendor_file}" ]; then
        printf 'swaync: vendor search path %s/swaync/%s names no installed file\n' \
          "${vendor_base}" "${vendor_file}" >&2
        exit 1
      fi
    done

    printf 'swaync UAPI smoke: the vendor search base names the installed files\n'

    find "${OUT_DIR}" -type f -executable -exec strip --strip-unneeded {} \; 2>/dev/null || true
    find "${OUT_DIR}" -name '*.a' -exec objcopy --enable-deterministic-archives {} \; 2>/dev/null || true
    find "${OUT_DIR}" -exec touch -d "2024-01-01T00:00:00+00:00" {} \;

