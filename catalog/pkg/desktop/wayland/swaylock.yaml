build:
  environment: 248c5014338ab55a89b9c261e303e111e6847aec
  profile: [3774:1414]

  script: |
    tar --no-same-owner -xf ${SOURCE_swaylock} -C "${WORK_DIR}" --strip-components=1
    cd ${WORK_DIR}

    patch --batch --fuzz=0 -Np1 -i "/${SOURCE_uapi_config_patch}"

    export PKG_CONFIG_PATH=/usr/lib/pkgconfig:/usr/share/pkgconfig

    meson setup build \
      --prefix=/usr \
      --sysconfdir=/etc \
      --buildtype=release \
      --pkg-config-path=/usr/lib/pkgconfig:/usr/share/pkgconfig \
      -Dpam=enabled \
      -Dgdk-pixbuf=enabled

    ninja -C build
    DESTDIR=${OUT_DIR} ninja -C build install

    install -Dm644 \
      "${OUT_DIR}/etc/pam.d/swaylock" \
      "${OUT_DIR}/usr/lib/pam.d/swaylock"
    rm "${OUT_DIR}/etc/pam.d/swaylock"
    rmdir "${OUT_DIR}/etc/pam.d" "${OUT_DIR}/etc"

    # get_config_path tries the user files, then the admin, runtime, and
    # vendor tiers in that order. Plant a config in all three system paths and
    # remove the winning one at each step to prove the loader still reads the
    # next tier down rather than stopping at the first miss.
    admin_conf=/etc/swaylock/config
    runtime_conf=/run/swaylock/config
    vendor_conf=/usr/lib/swaylock/config
    mkdir -p /etc/swaylock /run/swaylock /usr/lib/swaylock
    rm -f "${admin_conf}" "${runtime_conf}" "${vendor_conf}"

    probe_home="${WORK_DIR}/swaylock-uapi-home"
    mkdir -p "${probe_home}"
    probe_out="${WORK_DIR}/swaylock-uapi-probe.out"

    # initialize_pw_backend() forks a PAM worker before the config or
    # display is touched, and that worker can sit inside pam_start() well
    # past the point where main() itself has returned. Kill any leftover
    # worker after each run so it cannot hold the binary open for strip.
    reap_pw_worker() {
        for proc_dir in /proc/[0-9]*; do
            [ "$(cat "${proc_dir}/comm" 2>/dev/null)" = "swaylock" ] || continue
            kill -KILL "${proc_dir#/proc/}" 2>/dev/null || true
        done
    }

    run_probe() {
        env -u WAYLAND_DISPLAY -u XDG_CONFIG_HOME HOME="${probe_home}" \
            LD_LIBRARY_PATH="${OUT_DIR}/usr/lib" \
            "${OUT_DIR}/usr/bin/swaylock" -d \
            > "${probe_out}" 2>&1 || true
        reap_pw_worker
    }

    expect_loaded() {
        run_probe
        if ! grep -qF "Found config at $1" "${probe_out}"; then
            printf 'swaylock UAPI smoke: expected config at %s, log:\n' "$1" >&2
            cat "${probe_out}" >&2
            exit 1
        fi
    }

    : > "${admin_conf}"
    : > "${runtime_conf}"
    : > "${vendor_conf}"
    expect_loaded "${admin_conf}"

    rm -f "${admin_conf}"
    expect_loaded "${runtime_conf}"

    rm -f "${runtime_conf}"
    expect_loaded "${vendor_conf}"

    rm -f "${vendor_conf}"
    rm -rf "${probe_home}" "${probe_out}"

    printf 'swaylock UAPI smoke: config loader read all three tiers in order\n'

    strip --strip-unneeded ${OUT_DIR}/usr/bin/swaylock

    find "${OUT_DIR}" -exec touch -d '2024-01-01T00:00:00+00:00' {} \;

bundles:
  dev:
  - bin
  - lib

  runtime:
  - bin
  - lib

outputs:
  bin:
    files:
    - path: /usr/bin/swaylock
      needs:
      - /usr/lib/ld-linux-x86-64.so.2
      - /usr/lib/libc.so.6
      - /usr/lib/libcairo.so.2
      - /usr/lib/libcrypt.so.2
      - /usr/lib/libgdk_pixbuf-2.0.so.0
      - /usr/lib/libgobject-2.0.so.0
      - /usr/lib/libpam.so.0
      - /usr/lib/libwayland-client.so.0
      - /usr/lib/libxkbcommon.so.0

  lib:
    files:
    - path: /usr/lib/pam.d/swaylock

  man:
    files:
    - path: /usr/share/man/man1/swaylock.1

  misc:
    files:
    - path: /usr/share/bash-completion/completions/swaylock
    - path: /usr/share/fish/vendor_completions.d/swaylock.fish
    - path: /usr/share/zsh/site-functions/_swaylock

resolution:
  /usr/lib/libcairo.so.2: cairo
  /usr/lib/libgdk_pixbuf-2.0.so.0: gdk-pixbuf
  /usr/lib/libgobject-2.0.so.0: glib2
  /usr/lib/ld-linux-x86-64.so.2: glibc
  /usr/lib/libc.so.6: glibc
  /usr/lib/libcrypt.so.2: libxcrypt
  /usr/lib/libxkbcommon.so.0: libxkbcommon
  /usr/lib/libpam.so.0: linux-pam
  /usr/lib/libwayland-client.so.0: wayland
