package:
  schema: 1
  name: Time Zone Database
  slug: tzdata
  namespace: core/userland
  version: 2026b
  description: IANA time zone rules and compiled zone database
  homepage: https://www.iana.org/time-zones
  checksum: e67cb3579f1e20353c7fe77a27697782e9d2a4fecda62621305546b5f715f655

sources:
- name: tzcode
  url: https://data.iana.org/time-zones/releases/tzcode2026b.tar.gz
  sha256: 37e9ed8427f5d3521c22fc58e293cbfb043d70eedf1003870b33f363f61ca344
- name: tzdata
  url: https://data.iana.org/time-zones/releases/tzdata2026b.tar.gz
  sha256: 114543d9f19a6bfeb5bca43686aea173d38755a3db1f2eec112647ae92c6f544

dependencies:
- name: bash
  commit: x86_64/pkg/cli/shells/bash/5.2.21/bundles/dev
- name: coreutils
  commit: x86_64/pkg/core/userland/coreutils/9.5/bundles/dev
- name: findutils
  commit: x86_64/pkg/core/userland/findutils/4.9.0/bundles/dev
- name: gawk
  commit: x86_64/pkg/cli/text/gawk/5.3.0/bundles/dev
- name: glibc
  commit: x86_64/pkg/libs/system/glibc/2.39/bundles/dev
- name: gzip
  commit: x86_64/pkg/cli/archive/gzip/1.13/bundles/dev
- name: make
  commit: x86_64/pkg/core/toolchain/make/4.4.1/bundles/dev
- name: tar
  commit: x86_64/pkg/cli/archive/tar/1.35/bundles/dev

build:
  environment: 248c5014338ab55a89b9c261e303e111e6847aec
  profile: [685:666]

  script: |
    set -eu
    tar --no-same-owner -xf "${SOURCE_tzcode}" -C "${WORK_DIR}"
    tar --no-same-owner -xf "${SOURCE_tzdata}" -C "${WORK_DIR}"
    cd "${WORK_DIR}"

    make AWK=gawk tzdata.zi
    zone_root="${OUT_DIR}/usr/share/zoneinfo"
    mkdir -p "${zone_root}" "${zone_root}/right"
    zic -b slim -d "${zone_root}" -L /dev/null -p America/New_York \
      africa antarctica asia australasia europe northamerica southamerica \
      factory etcetera backward
    zic -b slim -d "${zone_root}/right" -L leapseconds \
      africa antarctica asia australasia europe northamerica southamerica \
      factory etcetera backward
    ln -s . "${zone_root}/posix"

    install -m644 leapseconds leap-seconds.list tzdata.zi zone.tab \
      zone1970.tab iso3166.tab "${zone_root}/"

    find "${OUT_DIR}" -exec touch -h -d '2024-01-01T00:00:00+00:00' {} \;

bundles:
  full:
  - misc

