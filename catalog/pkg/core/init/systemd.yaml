build:
  environment: 248c5014338ab55a89b9c261e303e111e6847aec
  profile: [8222:2956, 20600:6061, 41216:7644, 70185:9078, 90766:10435, 115564:12230, 136220:42037, 173415:57156, 206464:57189, 226505:57781]

  script: |
    tar --no-same-owner -xf ${SOURCE_systemd} -C "${WORK_DIR}" --strip-components=1
    cd ${WORK_DIR}

    # Configure systemd build
    mkdir -p build
    cd build

    # Basic meson setup with minimal dependencies
    meson setup .. \
      --prefix=/usr \
      --sysconfdir=/etc \
      --localstatedir=/var \
      --buildtype=release \
      -Dconfigfiledir=/usr/lib \
      -Dmode=release \
      -Ddefault-dnssec=no \
      -Dfirstboot=false \
      -Dinstall-tests=false \
      -Dldconfig=false \
      -Dsysusers=false \
      -Drpmmacrosdir=no \
      -Dhomed=false \
      -Duserdb=false \
      -Dman=false \
      -Dhtml=false \
      -Dtranslations=true \
      -Danalyze=true \
      -Ddbuspolicydir=/usr/share/dbus-1/system.d \
      -Dshellprofiledir=/usr/lib/profile.d \
      -Dsshconfdir=/usr/lib/ssh/ssh_config.d \
      -Dsysvinit-path= \
      -Dsysvrcnd-path= \
      -Dxinitrcdir=/usr/lib/X11/xinit/xinitrc.d \
      -Ddefault-hierarchy=unified \
      -Ddefault-kill-user-processes=false \
      -Ddefault-locale=C.UTF-8 \
      -Dglib=false \
      -Dimportd=false \
      -Dseccomp=false \
      -Dselinux=false \
      -Dsysext=true \
      -Dsysupdate=true \
      -Dtests=false \
      -Dpam=true \
      -Dsplit-bin=false

    # Build systemd
    ninja
    DESTDIR="${OUT_DIR}" ninja install

    # Package defaults belong to the vendor trees. Keep /etc available for the
    # machine owner without installing systemd's empty host templates there.
    test ! -e "${OUT_DIR}/etc/environment"
    rm "${OUT_DIR}/etc/xdg/systemd/user"
    find "${OUT_DIR}/etc" -depth -type d -empty -delete
    test ! -e "${OUT_DIR}/etc"

    # These upstream files are sample host policy, not package defaults.
    # Assemblies provide authentication policy as initial machine state. The
    # other readers use vendor files below /usr or safe compiled fallbacks.
    rm -rf "${OUT_DIR}/usr/share/factory/etc"
    test ! -e "${OUT_DIR}/usr/share/factory/etc"
    test -s "${OUT_DIR}/usr/lib/pam.d/systemd-user"
    test -s "${OUT_DIR}/usr/lib/pam.d/systemd-run0"

    # Prove main-file replacement and same-name drop-in masking across the
    # native systemd configuration hierarchy.
    smoke_root="${WORK_DIR}/uapi-smoke-root"
    smoke_output="${WORK_DIR}/uapi-smoke-output"
    mkdir -p \
      "${smoke_root}/usr/lib/systemd/system.conf.d" \
      "${smoke_root}/run/systemd/system.conf.d" \
      "${smoke_root}/etc/systemd/system.conf.d"

    printf '[Manager]\n# uapi-test-vendor-main\n' \
      > "${smoke_root}/usr/lib/systemd/system.conf"
    LD_LIBRARY_PATH="${OUT_DIR}/usr/lib/systemd:${OUT_DIR}/usr/lib" \
      "${OUT_DIR}/usr/bin/systemd-analyze" --root="${smoke_root}" \
      cat-config systemd/system.conf > "${smoke_output}"
    grep -q uapi-test-vendor-main "${smoke_output}"

    printf '[Manager]\n# uapi-test-transient-main\n' \
      > "${smoke_root}/run/systemd/system.conf"
    LD_LIBRARY_PATH="${OUT_DIR}/usr/lib/systemd:${OUT_DIR}/usr/lib" \
      "${OUT_DIR}/usr/bin/systemd-analyze" --root="${smoke_root}" \
      cat-config systemd/system.conf > "${smoke_output}"
    grep -q uapi-test-transient-main "${smoke_output}"
    test "$(grep -c uapi-test-vendor-main "${smoke_output}")" -eq 0

    printf '[Manager]\n# uapi-test-administrator-main\n' \
      > "${smoke_root}/etc/systemd/system.conf"
    LD_LIBRARY_PATH="${OUT_DIR}/usr/lib/systemd:${OUT_DIR}/usr/lib" \
      "${OUT_DIR}/usr/bin/systemd-analyze" --root="${smoke_root}" \
      cat-config systemd/system.conf > "${smoke_output}"
    grep -q uapi-test-administrator-main "${smoke_output}"
    test "$(grep -c uapi-test-transient-main "${smoke_output}")" -eq 0

    printf '[Manager]\n# uapi-test-vendor-dropin\n' \
      > "${smoke_root}/usr/lib/systemd/system.conf.d/50-tier.conf"
    printf '[Manager]\n# uapi-test-transient-dropin\n' \
      > "${smoke_root}/run/systemd/system.conf.d/50-tier.conf"
    printf '[Manager]\n# uapi-test-administrator-dropin\n' \
      > "${smoke_root}/etc/systemd/system.conf.d/50-tier.conf"
    LD_LIBRARY_PATH="${OUT_DIR}/usr/lib/systemd:${OUT_DIR}/usr/lib" \
      "${OUT_DIR}/usr/bin/systemd-analyze" --root="${smoke_root}" \
      cat-config systemd/system.conf > "${smoke_output}"
    grep -q uapi-test-administrator-dropin "${smoke_output}"
    test "$(grep -c uapi-test-transient-dropin "${smoke_output}")" -eq 0
    test "$(grep -c uapi-test-vendor-dropin "${smoke_output}")" -eq 0

    : > "${smoke_root}/etc/systemd/system.conf.d/50-tier.conf"
    LD_LIBRARY_PATH="${OUT_DIR}/usr/lib/systemd:${OUT_DIR}/usr/lib" \
      "${OUT_DIR}/usr/bin/systemd-analyze" --root="${smoke_root}" \
      cat-config systemd/system.conf > "${smoke_output}"
    test "$(grep -c uapi-test-administrator-dropin "${smoke_output}")" -eq 0
    test "$(grep -c uapi-test-transient-dropin "${smoke_output}")" -eq 0
    test "$(grep -c uapi-test-vendor-dropin "${smoke_output}")" -eq 0

    # Create necessary directories
    mkdir -p ${OUT_DIR}/usr/lib/systemd/system
    mkdir -p ${OUT_DIR}/var/lib/systemd

    find ${OUT_DIR} -type f -executable -exec strip --strip-unneeded {} \; 2>/dev/null || true
    find ${OUT_DIR} -name '*.a' -exec objcopy --enable-deterministic-archives {} \; 2>/dev/null || true
    find "${OUT_DIR}" -exec touch -d "2024-01-01T00:00:00+00:00" {} \;

