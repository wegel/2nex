build:
  environment: 248c5014338ab55a89b9c261e303e111e6847aec
  profile: [8240:2263, 20626:2715, 45474:3330, 76331:8251, 102246:8478, 123770:8623, 148875:8721, 187513:13487, 224853:41886, 247347:44245]

  script: |
    tar --no-same-owner -xf ${SOURCE_binutils} -C "${WORK_DIR}" --strip-components=1
    cd "${WORK_DIR}" && mkdir -p build && cd build

    ../configure                 \
      --prefix=/usr              \
      --build=$(../config.guess) \
      --host=${TARGET}           \
      --disable-nls              \
      --enable-shared            \
      --enable-gprofng=no        \
      --disable-werror           \
      --enable-64-bit-bfd        \
      --enable-default-hash-style=gnu \
      --enable-gold              \
      --enable-plugins           \
      --without-zstd

    make
    make DESTDIR=${OUT_DIR} install

    find ${OUT_DIR} -type f -executable -exec strip --strip-unneeded {} \; 2>/dev/null || true
    find ${OUT_DIR} -name '*.a' -exec objcopy --enable-deterministic-archives {} \; 2>/dev/null || true
    find "${OUT_DIR}" -exec touch -d "2024-01-01T00:00:00+00:00" {} \;

