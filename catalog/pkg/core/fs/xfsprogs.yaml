build:
  environment: 248c5014338ab55a89b9c261e303e111e6847aec
  profile: [4114:27404, 8231:55962, 12347:75994, 16453:93310, 20560:101884, 24756:107630, 28933:111570, 31447:113747]

  script: |
    set -eu

    tar --no-same-owner -xf "/./${SOURCE_xfsprogs}" -C "${WORK_DIR}" --strip-components=1
    cd "${WORK_DIR}"

    ./configure \
      --prefix=/usr \
      --libdir=/usr/lib \
      --sbindir=/usr/bin \
      --enable-static=no \
      --enable-gettext=no \
      --enable-editline=no \
      --enable-termcap=no \
      --enable-lib64=no \
      --enable-scrub=yes \
      --enable-libicu=yes \
      --enable-healer=yes \
      --with-systemd-unit-dir=/usr/lib/systemd/system \
      --with-udev-rule-dir=/usr/lib/udev/rules.d \
      --with-crond-dir=no

    make
    make DIST_ROOT="${OUT_DIR}" install install-dev

    for script in fsck.xfs xfs_admin xfs_bmap xfs_freeze xfs_info xfs_metadump xfs_mkfile xfs_ncheck; do
      sed -i '1s|^#!/bin/sh -f$|#!/usr/bin/sh -f|' "${OUT_DIR}/usr/bin/${script}"
    done
    sed -i '1s|^#!/bin/bash -f$|#!/usr/bin/bash -f|' "${OUT_DIR}/usr/bin/xfs_property"
    sed -i '1s|^#!/bin/bash$|#!/usr/bin/bash|' "${OUT_DIR}/usr/libexec/xfsprogs/xfs_scrub_fail"
    awk '
      /^import dbus$/ { next }
      { print }
      /^\tdef bind\(self\):$/ {
        print "\t\tglobal dbus"
        print "\t\timport dbus"
      }
    ' "${OUT_DIR}/usr/bin/xfs_scrub_all" > "${OUT_DIR}/usr/bin/xfs_scrub_all.tmp"
    mv "${OUT_DIR}/usr/bin/xfs_scrub_all.tmp" "${OUT_DIR}/usr/bin/xfs_scrub_all"
    chmod 755 "${OUT_DIR}/usr/bin/xfs_scrub_all"

    find "${OUT_DIR}" -name '*.la' -delete
    find "${OUT_DIR}" -type f -executable -exec strip --strip-unneeded {} \; 2>/dev/null || true
    find "${OUT_DIR}" -name '*.a' -exec objcopy --enable-deterministic-archives {} \; 2>/dev/null || true
    find "${OUT_DIR}" -exec touch -d "2024-01-01T00:00:00+00:00" {} \;

