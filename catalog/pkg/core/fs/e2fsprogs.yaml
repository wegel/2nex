build:
  environment: 248c5014338ab55a89b9c261e303e111e6847aec
  profile: [4137:938, 8247:3368, 12378:5658, 16509:6439, 20643:7941, 24741:9781, 28874:11215, 33017:11324, 37131:11389, 40633:11740]

  script: |
    tar --no-same-owner -xf ${SOURCE0} -C "${WORK_DIR}" --strip-components=1
    cd ${WORK_DIR}

    patch --batch --fuzz=0 -Np1 -i "/${SOURCE_uapi_config}"

    mkdir -v build
    cd       build

    ../configure --prefix=/usr           \
             --sysconfdir=/etc       \
             --enable-elf-shlibs     \
             --disable-libblkid      \
             --disable-libuuid       \
             --disable-uuidd         \
             --disable-fsck

    make
    make DESTDIR=$OUT_DIR install

    mkdir -p "${OUT_DIR}/usr/lib"
    mv "${OUT_DIR}/etc/e2scrub.conf" "${OUT_DIR}/usr/lib/e2scrub.conf"
    mv "${OUT_DIR}/etc/mke2fs.conf" "${OUT_DIR}/usr/lib/mke2fs.conf"
    rmdir "${OUT_DIR}/etc"

    # move from /usr/sbin to /usr/bin
    if [ -d "${OUT_DIR}/usr/sbin" ]; then
      mv ${OUT_DIR}/usr/sbin/* ${OUT_DIR}/usr/bin/
      rmdir ${OUT_DIR}/usr/sbin
    fi

    smoke_root="${WORK_DIR}/uapi-smoke-root"
    smoke_report="${WORK_DIR}/uapi-smoke-report"
    mkdir -p \
      "${smoke_root}/etc" \
      "${smoke_root}/run" \
      "${smoke_root}/tmp" \
      "${smoke_root}/usr/bin" \
      "${smoke_root}/usr/lib"
    : > "${smoke_root}/etc/mtab"
    ln -s usr/lib "${smoke_root}/lib64"
    cp \
      "${OUT_DIR}/usr/bin/dumpe2fs" \
      "${OUT_DIR}/usr/bin/e2fsck" \
      "${OUT_DIR}/usr/bin/e2scrub" \
      "${OUT_DIR}/usr/bin/e2scrub_all" \
      "${OUT_DIR}/usr/bin/mke2fs" \
      /usr/bin/bash \
      "${smoke_root}/usr/bin/"
    cp -L \
      /usr/lib/ld-linux-x86-64.so.2 \
      /usr/lib/libblkid.so.1 \
      /usr/lib/libc.so.6 \
      /usr/lib/libncursesw.so.6 \
      /usr/lib/libuuid.so.1 \
      "${smoke_root}/usr/lib/"
    cp -L \
      "${OUT_DIR}/usr/lib/libcom_err.so.2" \
      "${OUT_DIR}/usr/lib/libe2p.so.2" \
      "${OUT_DIR}/usr/lib/libext2fs.so.2" \
      "${smoke_root}/usr/lib/"
    cp \
      "${OUT_DIR}/usr/lib/e2scrub.conf" \
      "${OUT_DIR}/usr/lib/mke2fs.conf" \
      "${smoke_root}/usr/lib/"

    cat > "${WORK_DIR}/uapi-chroot.c" << 'EOF'
    #include <stdio.h>
    #include <unistd.h>

    int main(int argc, char **argv) {
      if (argc < 3 || chroot(argv[1]) != 0 || chdir("/") != 0) {
        perror("uapi-chroot");
        return 1;
      }
      execv(argv[2], &argv[2]);
      perror("execv");
      return 1;
    }
    EOF
    gcc -O2 -o "${WORK_DIR}/uapi-chroot" "${WORK_DIR}/uapi-chroot.c"

    make_mke2fs_config() {
      sed "0,/inode_ratio = 16384/s//inode_ratio = $2/" \
        "${OUT_DIR}/usr/lib/mke2fs.conf" > "$1"
    }
    assert_inode_count() {
      rm -f "${smoke_root}/tmp/image"
      truncate -s 1G "${smoke_root}/tmp/image"
      "${WORK_DIR}/uapi-chroot" "${smoke_root}" \
        /usr/bin/mke2fs -q -F -t ext4 /tmp/image
      "${WORK_DIR}/uapi-chroot" "${smoke_root}" \
        /usr/bin/dumpe2fs -h /tmp/image > "${smoke_report}" 2>/dev/null
      grep -Eq "^Inode count:[[:space:]]+$1$" "${smoke_report}"
    }

    make_mke2fs_config "${smoke_root}/usr/lib/mke2fs.conf" 4096
    assert_inode_count 262144
    make_mke2fs_config "${smoke_root}/run/mke2fs.conf" 8192
    assert_inode_count 131072
    make_mke2fs_config "${smoke_root}/etc/mke2fs.conf" 32768
    assert_inode_count 32768
    : > "${smoke_root}/etc/mke2fs.conf"
    rm -f "${smoke_root}/tmp/image"
    truncate -s 1G "${smoke_root}/tmp/image"
    "${WORK_DIR}/uapi-chroot" "${smoke_root}" \
      /usr/bin/mke2fs -q -F -t ext4 /tmp/image \
      > "${smoke_report}" 2>&1
    grep -q 'does not define the ext4 filesystem type' "${smoke_report}"
    "${WORK_DIR}/uapi-chroot" "${smoke_root}" \
      /usr/bin/dumpe2fs -h /tmp/image > "${smoke_report}" 2>/dev/null
    grep -Eq '^Inode count:[[:space:]]+131072$' "${smoke_report}"

    assert_scrub_tier() {
      test "$("${WORK_DIR}/uapi-chroot" "${smoke_root}" \
        /usr/bin/bash /usr/bin/e2scrub -V)" = "$1"
      test "$("${WORK_DIR}/uapi-chroot" "${smoke_root}" \
        /usr/bin/bash /usr/bin/e2scrub_all -V)" = "$1"
    }

    printf 'printf "vendor\\n"\nexit 0\n' \
      > "${smoke_root}/usr/lib/e2scrub.conf"
    assert_scrub_tier vendor
    printf 'printf "transient\\n"\nexit 0\n' \
      > "${smoke_root}/run/e2scrub.conf"
    assert_scrub_tier transient
    printf 'printf "administrator\\n"\nexit 0\n' \
      > "${smoke_root}/etc/e2scrub.conf"
    assert_scrub_tier administrator
    : > "${smoke_root}/etc/e2scrub.conf"
    "${WORK_DIR}/uapi-chroot" "${smoke_root}" \
      /usr/bin/bash /usr/bin/e2scrub -V | grep -q '^e2scrub '
    "${WORK_DIR}/uapi-chroot" "${smoke_root}" \
      /usr/bin/bash /usr/bin/e2scrub_all -V | grep -q '^e2scrub_all '

    # e2fsck reads its own configuration file and must follow the same tiers
    # that mke2fs does. `report_time` makes it print a "Memory used:" summary,
    # so the presence of that line names whether the selected file was read.
    rm -f "${smoke_root}/etc/mke2fs.conf" "${smoke_root}/run/mke2fs.conf"
    rm -f "${smoke_root}/etc/e2scrub.conf" "${smoke_root}/run/e2scrub.conf"
    rm -f "${smoke_root}/tmp/image"
    truncate -s 32M "${smoke_root}/tmp/image"
    "${WORK_DIR}/uapi-chroot" "${smoke_root}" \
      /usr/bin/mke2fs -q -F -t ext4 /tmp/image

    assert_fsck_reports_time() {
      "${WORK_DIR}/uapi-chroot" "${smoke_root}" \
        /usr/bin/e2fsck -f -n /tmp/image > "${smoke_report}" 2>&1 || true
      if ! grep -q 'Memory used:' "${smoke_report}"; then
        printf 'e2fsck smoke: %s was not read\n' "$1" >&2
        exit 1
      fi
    }

    assert_fsck_silent() {
      "${WORK_DIR}/uapi-chroot" "${smoke_root}" \
        /usr/bin/e2fsck -f -n /tmp/image > "${smoke_report}" 2>&1 || true
      if grep -q 'Memory used:' "${smoke_report}"; then
        printf 'e2fsck smoke: %s should not have applied\n' "$1" >&2
        exit 1
      fi
    }

    assert_fsck_silent 'no configuration file'
    printf '[options]\n\treport_time = true\n' \
      > "${smoke_root}/usr/lib/e2fsck.conf"
    assert_fsck_reports_time /usr/lib/e2fsck.conf
    rm "${smoke_root}/usr/lib/e2fsck.conf"
    printf '[options]\n\treport_time = true\n' \
      > "${smoke_root}/run/e2fsck.conf"
    assert_fsck_reports_time /run/e2fsck.conf
    printf '[options]\n\treport_time = true\n' \
      > "${smoke_root}/etc/e2fsck.conf"
    assert_fsck_reports_time /etc/e2fsck.conf

    # An empty administrator file is selected and masks the lower tiers.
    : > "${smoke_root}/etc/e2fsck.conf"
    assert_fsck_silent 'the /run file under an empty /etc file'
    rm -f "${smoke_root}/etc/e2fsck.conf" "${smoke_root}/run/e2fsck.conf"

    printf 'e2fsprogs UAPI smoke: mke2fs, e2fsck, and e2scrub honoured all tiers\n'

    find ${OUT_DIR} -type f -executable -exec strip --strip-unneeded {} \; 2>/dev/null || true
    find ${OUT_DIR} -name '*.a' -exec objcopy --enable-deterministic-archives {} \; 2>/dev/null || true
    find "${OUT_DIR}" -exec touch -d "2024-01-01T00:00:00+00:00" {} \;

