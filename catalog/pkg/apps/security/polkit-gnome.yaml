build:
  environment: 248c5014338ab55a89b9c261e303e111e6847aec
  profile: [4172:20288, 8295:27867, 12420:31689, 16547:35262, 20681:38249, 24796:39726, 25979:40268]

  script: |
    set -eu

    tar --no-same-owner -xf /${SOURCE_polkit_gnome} -C "${WORK_DIR}" --strip-components=1
    cd "${WORK_DIR}"

    export PKG_CONFIG_PATH=/usr/lib/pkgconfig:/usr/share/pkgconfig

    mkdir -p m4 "${WORK_DIR}/bin"
    for tool in intltool-extract intltool-merge intltool-prepare intltool-update intltoolize; do
      printf '#!/bin/sh\nexec /usr/bin/perl /usr/bin/%s "$@"\n' "${tool}" > "${WORK_DIR}/bin/${tool}"
      chmod 755 "${WORK_DIR}/bin/${tool}"
    done
    export PATH="${WORK_DIR}/bin:${PATH}"

    sed -i '/GNOME_DEBUG_CHECK/d' configure.ac
    sed -i '/GNOME_COMPILE_WARNINGS/d' configure.ac
    sed -i '/IT_PROG_INTLTOOL/d' configure.ac
    sed -i '/AM_GLIB_GNU_GETTEXT/d' configure.ac
    sed -i '/po\/Makefile.in/d' configure.ac
    sed -i 's/^SUBDIRS = src po$/SUBDIRS = src/' Makefile.am
    sed -i '/AC_SUBST(\[AM_CPPFLAGS\])/i WARN_CFLAGS=""\nGCONF_CFLAGS=""\nGCONF_LIBS=""\nINTLLIBS=""\nAC_SUBST([WARN_CFLAGS])\nAC_SUBST([GCONF_CFLAGS])\nAC_SUBST([GCONF_LIBS])\nAC_SUBST([INTLLIBS])' configure.ac

    autoreconf -fi

    ./configure \
      --prefix=/usr \
      --libexecdir=/usr/libexec \
      --disable-static \
      --disable-dependency-tracking

    make
    make DESTDIR="${OUT_DIR}" install

    find "${OUT_DIR}" -name '*.la' -delete
    find "${OUT_DIR}" -type f -executable -exec strip --strip-unneeded {} \; 2>/dev/null || true
    find "${OUT_DIR}" -exec touch -d "2024-01-01T00:00:00+00:00" {} \;

bundles:
  full:
  - bin

outputs:
  bin:
    files:
    - path: /usr/libexec/polkit-gnome-authentication-agent-1
      needs:
      - /usr/lib/ld-linux-x86-64.so.2
      - /usr/lib/libc.so.6
      - /usr/lib/libgdk-3.so.0
      - /usr/lib/libgdk_pixbuf-2.0.so.0
      - /usr/lib/libgio-2.0.so.0
      - /usr/lib/libglib-2.0.so.0
      - /usr/lib/libgobject-2.0.so.0
      - /usr/lib/libgtk-3.so.0
      - /usr/lib/libpolkit-agent-1.so.0
      - /usr/lib/libpolkit-gobject-1.so.0

resolution:
