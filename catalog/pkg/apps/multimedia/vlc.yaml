build:
  environment: 248c5014338ab55a89b9c261e303e111e6847aec
  profile: [12326:83689, 41196:133531, 90918:161323, 149031:198766, 198973:201124, 250362:203475, 299433:205191, 372457:210716, 448801:217315, 493984:239604]

  script: |
    tar --no-same-owner -xf /${SOURCE_vlc} -C "${WORK_DIR}" --strip-components=1
    cd "${WORK_DIR}"

    export BUILDCC=gcc
    export CFLAGS="${CFLAGS//-flto=auto/}"
    export CXXFLAGS="${CXXFLAGS//-flto=auto/}"
    export LDFLAGS="${LDFLAGS//-flto=auto/}"

    ./configure \
      --prefix=/usr \
      --disable-lua \
      --disable-vlm \
      --disable-sout \
      --disable-dbus \
      --disable-qt \
      --disable-skins2 \
      --disable-live555 \
      --disable-linsys \
      --disable-v4l2 \
      --disable-libcddb \
      --disable-vcd \
      --disable-vnc \
      --disable-freerdp \
      --disable-dvbpsi \
      --disable-sid \
      --disable-ogg \
      --disable-mad \
      --disable-a52 \
      --disable-x264 \
      --disable-x26410b \
      --disable-zvbi \
      --disable-libass \
      --disable-aribsub \
      --disable-png \
      --disable-jpeg \
      --disable-xcb \
      --without-x \
      --disable-xvideo \
      --disable-wayland \
      --disable-sdl-image \
      --disable-pulse \
      --disable-jack \
      --disable-samplerate \
      --disable-chromaprint \
      --disable-projectm \
      --disable-notify \
      --disable-libplacebo \
      --disable-libgcrypt \
      --disable-gnutls \
      --disable-taglib \
      --disable-kwallet \
      --disable-vdpau \
      --disable-dvdread \
      --disable-dvdnav \
      --disable-bluray \
      --enable-avcodec \
      --enable-swscale \
      --enable-alsa

    make
    make DESTDIR="${OUT_DIR}" install

    rm -f "${OUT_DIR}/usr/lib/vlc/plugins/plugins.dat"
    find "${OUT_DIR}" -type f -executable -exec strip --strip-unneeded {} \; 2>/dev/null || true
    find "${OUT_DIR}" -name '*.a' -exec objcopy --enable-deterministic-archives {} \; 2>/dev/null || true
    find "${OUT_DIR}" -exec touch -d "2024-01-01T00:00:00+00:00" {} \;

