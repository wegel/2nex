build:
  environment: 248c5014338ab55a89b9c261e303e111e6847aec
  profile: [4148:593, 8306:716, 12445:4533, 16544:4833, 18555:5894]

  script: |
    set -eu
    tar --no-same-owner -xf "/${SOURCE_looking_glass}" -C "${WORK_DIR}" --strip-components=1
    cd "${WORK_DIR}"

    patch --batch --fuzz=0 -Np1 -i "/${SOURCE_uapi_config}"

    cd "${WORK_DIR}/client"

    export PKG_CONFIG_PATH=/usr/lib/pkgconfig:/usr/share/pkgconfig
    export CFLAGS="${CFLAGS//-flto=auto/}"
    export CXXFLAGS="${CXXFLAGS//-flto=auto/}"
    export LDFLAGS="${LDFLAGS//-flto=auto/}"

    cmake -B build -G Ninja \
      -DCMAKE_BUILD_TYPE=Release \
      -DCMAKE_INSTALL_PREFIX=/usr \
      -DOPTIMIZE_FOR_NATIVE=OFF \
      -DENABLE_BACKTRACE=OFF \
      -DENABLE_X11=OFF \
      -DENABLE_WAYLAND=ON \
      -DENABLE_LIBDECOR=OFF \
      -DENABLE_PIPEWIRE=ON \
      -DENABLE_PULSEAUDIO=OFF \
      -DENABLE_EGL=ON \
      -DENABLE_OPENGL=OFF

    cmake --build build
    DESTDIR="${OUT_DIR}" cmake --install build

    # The system-wide client options file carries machine policy, so the client
    # must overlay /usr/lib, then /run, then /etc. Each tier names a different
    # window title, and --help prints the title the loaded files produced.
    admin_ini=/etc/looking-glass-client.ini
    runtime_ini=/run/looking-glass-client.ini
    vendor_ini=/usr/lib/looking-glass-client.ini

    mkdir -p /etc /run /usr/lib
    rm -f "${admin_ini}" "${runtime_ini}" "${vendor_ini}"

    probe_home="${WORK_DIR}/lg-uapi-home"
    probe_out="${WORK_DIR}/lg-uapi-probe.out"
    mkdir -p "${probe_home}/config" "${probe_home}/run"
    chmod 0755 "${WORK_DIR}"
    chmod -R 0777 "${probe_home}"

    # The client refuses to start as root, and the build runs as root inside a
    # namespace that maps no other id, so neither setuid nor a nested user
    # namespace can drop privileges here. Interpose getuid and geteuid instead:
    # that satisfies the client's own guard and leaves every configuration
    # reader untouched.
    cat > "${WORK_DIR}/lg-fake-uid.c" <<'FAKEUID'
    #include <sys/types.h>
    #include <unistd.h>

    uid_t getuid(void) { return 65534; }
    uid_t geteuid(void) { return 65534; }
    FAKEUID

    gcc -shared -fPIC -o "${WORK_DIR}/lg-fake-uid.so" "${WORK_DIR}/lg-fake-uid.c"

    write_ini() {
        printf '[win]\ntitle=%s\n' "$2" > "$1"
        chmod 0644 "$1"
    }

    probe_title() {
        HOME="${probe_home}" XDG_CONFIG_HOME="${probe_home}/config" \
            XDG_RUNTIME_DIR="${probe_home}/run" \
            LD_PRELOAD="${WORK_DIR}/lg-fake-uid.so" \
            "${OUT_DIR}/usr/bin/looking-glass-client" --help \
            > "${probe_out}" 2>&1 || true
    }

    expect_title() {
        probe_title
        if ! grep -q -- "$1" "${probe_out}"; then
            printf 'looking-glass UAPI smoke: expected title %s\n' "$1" >&2
            tail -30 "${probe_out}" >&2
            exit 1
        fi
        shift
        for absent in "$@"; do
            if grep -q -- "${absent}" "${probe_out}"; then
                printf 'looking-glass UAPI smoke: %s should not be in effect\n' \
                    "${absent}" >&2
                exit 1
            fi
        done
    }

    # The compiled default is the upstream window title, which no tier uses.
    expect_title 'Looking Glass (client)' NEXTIER_vendor NEXTIER_runtime NEXTIER_admin

    write_ini "${vendor_ini}" NEXTIER_vendor
    expect_title NEXTIER_vendor NEXTIER_runtime NEXTIER_admin

    write_ini "${runtime_ini}" NEXTIER_runtime
    expect_title NEXTIER_runtime NEXTIER_vendor NEXTIER_admin

    write_ini "${admin_ini}" NEXTIER_admin
    expect_title NEXTIER_admin NEXTIER_vendor NEXTIER_runtime

    # Removing a tier uncovers the one below it, which proves every tier is
    # read on each run rather than resolved once.
    rm -f "${admin_ini}"
    expect_title NEXTIER_runtime NEXTIER_admin

    rm -f "${runtime_ini}"
    expect_title NEXTIER_vendor NEXTIER_admin NEXTIER_runtime

    rm -f "${vendor_ini}"
    expect_title 'Looking Glass (client)' NEXTIER_vendor NEXTIER_runtime NEXTIER_admin

    rm -rf "${probe_home}" "${probe_out}" "${WORK_DIR}/lg-fake-uid.so" \
        "${WORK_DIR}/lg-fake-uid.c"

    printf 'looking-glass UAPI smoke: all three option tiers and their order behaved\n'

    strip --strip-unneeded "${OUT_DIR}/usr/bin/looking-glass-client"
    find "${OUT_DIR}" -exec touch -d "2024-01-01T00:00:00+00:00" {} \;

bundles:
  runtime:
  - bin
  - misc

