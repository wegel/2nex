package:
  schema: 1
  name: Netavark
  slug: netavark
  namespace: apps/containers
  version: 1.14.1
  description: A container network stack
  homepage: https://github.com/containers/netavark
  checksum: c648f6c25191dabf9ec46602309ef5ea112e2ecce44c3570241383915374c56c

sources:
- name: netavark
  url: https://github.com/containers/netavark/archive/refs/tags/v1.14.1.tar.gz
  sha256: fd4a25db0abe73e2d0d7a9958f298ace134671edc64259cbc8ea3c2907f89dd8
- name: netavark_vendor
  url: https://github.com/containers/netavark/releases/download/v1.14.1/netavark-v1.14.1-vendor.tar.gz
  sha256: 0e218da756515c767a4e7e5aa8178e40073317c85decdbbbed5d1f4238c4fce0

dependencies:
- name: bash
  commit: x86_64/pkg/cli/shells/bash/5.2.21/bundles/dev
- name: coreutils
  commit: x86_64/pkg/core/userland/coreutils/9.5/bundles/dev
- name: findutils
  commit: x86_64/pkg/core/userland/findutils/4.9.0/bundles/dev
- name: libcap
  commit: x86_64/pkg/libs/security/libcap/2.69/bundles/dev
- name: gzip
  commit: x86_64/pkg/cli/archive/gzip/1.13/bundles/dev
- name: tar
  commit: x86_64/pkg/cli/archive/tar/1.35/bundles/dev
- name: binutils
  commit: x86_64/pkg/core/toolchain/binutils/2.42/bundles/dev
- name: glibc
  commit: x86_64/pkg/libs/system/glibc/2.39/bundles/dev
- name: gcc
  commit: x86_64/pkg/core/toolchain/gcc/13.2.0/bundles/dev
- name: ncurses
  commit: x86_64/pkg/libs/system/ncurses/6.4-20230520/bundles/dev
- name: inetutils
  commit: x86_64/pkg/net/misc/inetutils/2.5/bundles/dev
- name: attr
  commit: x86_64/pkg/libs/system/attr/2.5.2/bundles/dev
- name: acl
  commit: x86_64/pkg/libs/system/acl/2.3.2/bundles/dev
- name: gmp
  commit: x86_64/pkg/libs/system/gmp/6.3.0/bundles/dev
- name: zlib
  commit: x86_64/pkg/libs/system/zlib/1.3.1/bundles/dev
- name: rust-bin
  commit: x86_64/pkg/dev/lang/rust-bin/1.91.1/bundles/dev
- name: protobuf
  commit: x86_64/pkg/dev/libs/protobuf/30.2/bundles/dev
- name: libabseil-cpp
  commit: x86_64/pkg/dev/libs/libabseil-cpp/20250127.0/bundles/dev

build:
  environment: 248c5014338ab55a89b9c261e303e111e6847aec
  profile: [4102:2647, 8237:14627, 11718:37754]

  script: |
    # Extract the netavark source code
    echo "Extracting ${SOURCE_netavark}"
    tar --no-same-owner -xf ${SOURCE_netavark} -C "${WORK_DIR}" --strip-components=1
    cd ${WORK_DIR}

    # Extract the vendored dependencies
    # The vendor tarball already contains the 'vendor' directory
    echo "Extracting ${SOURCE_netavark_vendor}"
    tar --no-same-owner -xf /./${SOURCE_netavark_vendor} -C "${WORK_DIR}"

    # Set up Rust environment
    export CARGO_HOME="${WORK_DIR}/.cargo"
    export RUSTUP_HOME="${WORK_DIR}/.rustup"

    # Create symlinks for compiler and linker in a system location
    mkdir -p /usr/local/bin
    ln -sf /usr/bin/gcc /usr/local/bin/cc
    ln -sf /usr/bin/ld.bfd /usr/local/bin/ld
    export PATH="/usr/local/bin:${PATH}"

    # use gcc as linker (lld needs /proc/self/exe which is unavailable in unshare)
    export CARGO_TARGET_X86_64_UNKNOWN_LINUX_GNU_LINKER=gcc
    export RUSTFLAGS="-C codegen-units=1 -C embed-bitcode=yes -C debuginfo=0 -C link-args=-frandom-seed=424242"

    # Create .cargo/config to use the vendor directory
    mkdir -p "${CARGO_HOME}"
    cat > "${CARGO_HOME}/config.toml" << EOF
    [source.crates-io]
    replace-with = "vendored-sources"

    [source.vendored-sources]
    directory = "vendor"
    EOF

    # Build with specific target to avoid proc-macro issues
    cargo build --release --offline --target x86_64-unknown-linux-gnu

    netavark_version=$(target/x86_64-unknown-linux-gnu/release/netavark --version)
    case "${netavark_version}" in
      *1.14.1*) ;;
      *)
        printf 'unexpected netavark version: %s\n' "${netavark_version}" >&2
        exit 1
        ;;
    esac

    # Install
    mkdir -p ${OUT_DIR}/usr/bin
    install -D -m 755 target/x86_64-unknown-linux-gnu/release/netavark ${OUT_DIR}/usr/bin/netavark

    # Create directory for podman
    mkdir -p ${OUT_DIR}/usr/libexec/podman
    ln -sf ../../bin/netavark ${OUT_DIR}/usr/libexec/podman/netavark

    # Set consistent timestamps for reproducible builds
    find "${OUT_DIR}" -exec touch -d '2024-01-01T00:00:00+00:00' {} \;
    find ${OUT_DIR} -type f -executable -exec strip --strip-unneeded {} \; 2>/dev/null || true
    find ${OUT_DIR} -name '*.a' -exec objcopy --enable-deterministic-archives {} \; 2>/dev/null || true

bundles:
  dev:
  - bin

  full:
  - bin

outputs:
  bin:
    files:
    - path: /usr/bin/netavark
      needs:
      - /usr/lib/ld-linux-x86-64.so.2
      - /usr/lib/libc.so.6
      - /usr/lib/libgcc_s.so.1
      - /usr/lib/libm.so.6
    - path: /usr/libexec/podman/netavark
      needs:
      - /usr/lib/ld-linux-x86-64.so.2
      - /usr/lib/libc.so.6
      - /usr/lib/libgcc_s.so.1
      - /usr/lib/libm.so.6

resolution:
  /usr/lib/libgcc_s.so.1: gcc
  /usr/lib/ld-linux-x86-64.so.2: glibc
  /usr/lib/libc.so.6: glibc
  /usr/lib/libm.so.6: glibc
