build:
  environment: 248c5014338ab55a89b9c261e303e111e6847aec
  profile: [4207:9439, 12967:41887, 16919:42209]

  script: |
    tar --no-same-owner -xf /./${SOURCE_podman} -C "${WORK_DIR}" --strip-components=1
    cd ${WORK_DIR}
    patch --batch --fuzz=0 -Np1 -i /${SOURCE_uapi_config}

    # Set up Go environment
    export GOROOT="/usr/lib/go"
    export GOPATH="${WORK_DIR}/gopath"
    export PATH="/usr/bin:/usr/lib/go/bin:${PATH}"
    export CGO_ENABLED=1
    export GO111MODULE=on
    export GOFLAGS="-trimpath -ldflags=-compressdwarf=false"

    # Set up proxy to disable external downloads
    export GOPROXY=off
    export GOSUMDB=off

    go test \
      github.com/containers/common/pkg/config \
      github.com/containers/image/v5/pkg/sysregistriesv2 \
      github.com/containers/image/v5/signature \
      github.com/containers/image/v5/docker \
      github.com/containers/storage/types

    printf 'podman UAPI smoke: containers.conf, registries.conf, policy, storage.conf, and registries.d tests passed\n'

    # Create symlinks for compiler and linker to ensure build tools can find them
    mkdir -p /usr/local/bin
    ln -sf /usr/bin/gcc /usr/local/bin/cc
    ln -sf /usr/bin/ld.bfd /usr/local/bin/ld
    export PATH="/usr/local/bin:${PATH}"

    # Configure PKG_CONFIG_PATH for dependencies
    export PKG_CONFIG_PATH="/usr/lib/pkgconfig:/usr/lib64/pkgconfig:/usr/share/pkgconfig"

    # Configure library path to ensure libcrypt is found
    export LD_LIBRARY_PATH="/usr/lib:/usr/lib64"

    # Use upstream's host feature checks and install the normal Linux tools.
    make GO=go GIT_COMMIT=v5.4.1 PREFIX=/usr podman podman-remote rootlessport quadlet docs
    make \
      GO=go \
      GIT_COMMIT=v5.4.1 \
      DESTDIR="${OUT_DIR}" \
      PREFIX=/usr \
      install.bin \
      install.remote \
      install.man \
      install.systemd \
      install.completions

    # Set consistent timestamps for reproducible builds
    find "${OUT_DIR}" -exec touch -h -d '2024-01-01T00:00:00+00:00' {} \;
    find ${OUT_DIR} -type f -executable -exec strip --strip-unneeded {} \; 2>/dev/null || true
    find ${OUT_DIR} -name '*.a' -exec objcopy --enable-deterministic-archives {} \; 2>/dev/null || true

