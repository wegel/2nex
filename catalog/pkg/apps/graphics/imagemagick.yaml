build:
  environment: 248c5014338ab55a89b9c261e303e111e6847aec
  profile: [4118:1339, 8223:2541, 16458:9450, 28853:11510, 37164:12530, 45843:22375, 55998:22404, 68373:22473, 80827:22548, 86440:27645]

  script: |
    set -eu

    tar --no-same-owner -xzf /${SOURCE_imagemagick} -C "${WORK_DIR}" --strip-components=1
    cd "${WORK_DIR}"

    patch -Np1 --batch --fuzz=0 < "/${SOURCE_uapi_config}"

    export PKG_CONFIG_PATH=/usr/lib/pkgconfig:/usr/share/pkgconfig

    ./configure \
      --prefix=/usr \
      --sysconfdir=/etc \
      --disable-static \
      --disable-openmp \
      --without-magick-plus-plus \
      --without-perl \
      --without-x \
      --without-autotrace \
      --without-djvu \
      --without-dps \
      --without-fpx \
      --without-gvc \
      --without-heic \
      --without-jxl \
      --without-lcms \
      --without-lqr \
      --without-openexr \
      --without-openjp2 \
      --without-pango \
      --without-raqm \
      --without-raw \
      --without-rsvg \
      --without-wmf \
      --with-bzlib=yes \
      --with-fontconfig=yes \
      --with-freetype=yes \
      --with-jpeg=yes \
      --with-lzma=yes \
      --with-png=yes \
      --with-tiff=yes \
      --with-webp=yes \
      --with-xml=yes \
      --with-zlib=yes \
      --with-zstd=yes

    make
    make DESTDIR="${OUT_DIR}" install

    for config in \
      colors.xml \
      delegates.xml \
      log.xml \
      mime.xml \
      policy.xml \
      quantization-table.xml \
      thresholds.xml \
      type-apple.xml \
      type-dejavu.xml \
      type-ghostscript.xml \
      type-urw-base35-type1.xml \
      type-urw-base35.xml \
      type-windows.xml \
      type.xml; do
      mv "${OUT_DIR}/etc/ImageMagick-7/${config}" \
        "${OUT_DIR}/usr/share/ImageMagick-7/${config}"
    done
    rmdir "${OUT_DIR}/etc/ImageMagick-7" "${OUT_DIR}/etc"

    write_policy() {
      path=$1
      resource=$2
      value=$3
      mkdir -p "$(dirname "${path}")"
      printf '%s\n' \
        '<policymap>' \
        "  <policy domain=\"resource\" name=\"${resource}\" value=\"${value}\"/>" \
        '</policymap>' > "${path}"
    }

    list_policies() {
      output=$1
      shift
      LD_LIBRARY_PATH="${OUT_DIR}/usr/lib" \
        "$@" "${OUT_DIR}/usr/bin/magick" -list policy > "${output}"
    }

    assert_policy() {
      output=$1
      path=$2
      value=$3
      grep -Fq "Path: ${path}" "${output}"
      grep -Fq "value: ${value}" "${output}"
    }

    assert_before() {
      output=$1
      first=$2
      second=$3
      first_line=$(grep -Fn -m1 "Path: ${first}" "${output}")
      second_line=$(grep -Fn -m1 "Path: ${second}" "${output}")
      first_line=${first_line%%:*}
      second_line=${second_line%%:*}
      test "${first_line}" -lt "${second_line}"
    }

    mkdir -p /usr/share/ImageMagick-7 /run/ImageMagick-7 /etc/ImageMagick-7
    rm -f /usr/share/ImageMagick-7/policy.xml \
      /run/ImageMagick-7/policy.xml /etc/ImageMagick-7/policy.xml
    write_policy /usr/share/ImageMagick-7/policy.xml memory 333MiB
    list_policies "${WORK_DIR}/vendor-policy.log" env
    assert_policy "${WORK_DIR}/vendor-policy.log" \
      /usr/share/ImageMagick-7/policy.xml 333MiB
    write_policy /run/ImageMagick-7/policy.xml memory 222MiB
    list_policies "${WORK_DIR}/run-policy.log" env
    assert_policy "${WORK_DIR}/run-policy.log" \
      /usr/share/ImageMagick-7/policy.xml 333MiB
    assert_policy "${WORK_DIR}/run-policy.log" \
      /run/ImageMagick-7/policy.xml 222MiB
    assert_before "${WORK_DIR}/run-policy.log" \
      /usr/share/ImageMagick-7/policy.xml /run/ImageMagick-7/policy.xml
    write_policy /etc/ImageMagick-7/policy.xml memory 111MiB
    list_policies "${WORK_DIR}/etc-policy.log" env
    assert_policy "${WORK_DIR}/etc-policy.log" \
      /etc/ImageMagick-7/policy.xml 111MiB
    assert_before "${WORK_DIR}/etc-policy.log" \
      /run/ImageMagick-7/policy.xml /etc/ImageMagick-7/policy.xml
    : > /etc/ImageMagick-7/policy.xml
    list_policies "${WORK_DIR}/empty-policy.log" env
    assert_policy "${WORK_DIR}/empty-policy.log" \
      /run/ImageMagick-7/policy.xml 222MiB
    if grep -Fq 'Path: /etc/ImageMagick-7/policy.xml' \
      "${WORK_DIR}/empty-policy.log"; then
      exit 1
    fi
    write_policy "${WORK_DIR}/explicit/policy.xml" map 444MiB
    list_policies "${WORK_DIR}/explicit-policy.log" env \
      MAGICK_CONFIGURE_PATH="${WORK_DIR}/explicit"
    assert_policy "${WORK_DIR}/explicit-policy.log" \
      "${WORK_DIR}/explicit/policy.xml" 444MiB
    assert_before "${WORK_DIR}/explicit-policy.log" \
      "${WORK_DIR}/explicit/policy.xml" /usr/share/ImageMagick-7/policy.xml
    rm -f /etc/ImageMagick-7/policy.xml /run/ImageMagick-7/policy.xml
    list_policies "${WORK_DIR}/restored-policy.log" env
    assert_policy "${WORK_DIR}/restored-policy.log" \
      /usr/share/ImageMagick-7/policy.xml 333MiB

    find "${OUT_DIR}" -name '*.la' -delete
    find "${OUT_DIR}" -type f -executable -exec strip --strip-unneeded {} \; 2>/dev/null || true
    find "${OUT_DIR}" -name '*.a' -exec objcopy --enable-deterministic-archives {} \; 2>/dev/null || true
    find "${OUT_DIR}" -exec touch -d "2024-01-01T00:00:00+00:00" {} \;

