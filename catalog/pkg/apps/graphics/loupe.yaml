build:
  environment: 248c5014338ab55a89b9c261e303e111e6847aec
  profile: [4099:6526, 8215:16496, 16426:86305, 24673:86797, 32986:87235, 41233:87619, 49678:87882, 62278:88189, 74914:88496, 79648:88617]

  script: |
    set -eu

    tar --no-same-owner -xf /${SOURCE_loupe} -C "${WORK_DIR}" --strip-components=1
    cd "${WORK_DIR}"

    tar --no-same-owner -xf /./${SOURCE_vendor} -C "${WORK_DIR}"

    mkdir -p /usr/local/bin
    ln -sf /usr/bin/gcc /usr/local/bin/cc
    ln -sf /usr/bin/ld.bfd /usr/local/bin/ld
    export PATH="/usr/local/bin:${PATH}"
    export PKG_CONFIG_PATH=/usr/lib/pkgconfig:/usr/share/pkgconfig
    export LIBRARY_PATH=/usr/lib
    export CARGO_TARGET_X86_64_UNKNOWN_LINUX_GNU_LINKER=gcc
    export RUSTFLAGS="-C codegen-units=1 -C embed-bitcode=yes -C debuginfo=0 -C link-arg=-L/usr/lib"
    export CFLAGS="${CFLAGS//-flto=auto/}"
    export CXXFLAGS="${CXXFLAGS//-flto=auto/}"
    export LDFLAGS="${LDFLAGS//-flto=auto/}"

    meson setup build \
      --prefix=/usr \
      --libdir=lib \
      --buildtype=release \
      --wrap-mode=nodownload \
      -Dprofile=release \
      -Dx11=disabled

    mkdir -p build/cargo-home
    cat > build/cargo-home/config.toml << EOF
    [source.crates-io]
    replace-with = "vendored-sources"

    [source.vendored-sources]
    directory = "${WORK_DIR}/vendor"
    EOF

    ninja -C build
    DESTDIR="${OUT_DIR}" ninja -C build install

    glib-compile-schemas "${OUT_DIR}/usr/share/glib-2.0/schemas"

    find "${OUT_DIR}" -type f -executable -exec strip --strip-unneeded {} \; 2>/dev/null || true
    find "${OUT_DIR}" -name '*.a' -exec objcopy --enable-deterministic-archives {} \; 2>/dev/null || true
    find "${OUT_DIR}" -exec touch -d "2024-01-01T00:00:00+00:00" {} \;

