  commit: x86_64/pkg/bootstrap/phase1/tar/1.35/bundles/dev

build:
  environment: 4f2c74a7b827c73d2ca4d9caedbd9df1c6481e23
  profile: [8256:2951, 25731:4198, 52221:4241, 82219:4304, 109053:4346, 136907:4408, 163155:4463, 203968:5160, 248266:5779, 271467:7902]

  script: |
    tar --no-same-owner -xf ${SOURCE_xz} -C "${WORK_DIR}" --strip-components=1
    cd ${WORK_DIR}

    ./configure --prefix=/usr --libdir=/usr/lib \
                --build=$(build-aux/config.guess) \
                --host=${TARGET} \
          --disable-static \
          --docdir=/usr/share/doc/xz-5.4.6
    make
    make check

    make DESTDIR=${OUT_DIR} install
    rm -rf ${OUT_DIR}/usr/share/info ${OUT_DIR}/usr/share/man

    find "${OUT_DIR}" -exec touch -d '2024-01-01T00:00:00+00:00' {} \;

bundles:
  dev:
  - bin
  - dev
  - lib
  - locale

