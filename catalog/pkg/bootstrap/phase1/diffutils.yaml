    - path: /usr/share/locale/ja/LC_MESSAGES/diffutils.mo
    - path: /usr/share/locale/ka/LC_MESSAGES/diffutils.mo
    - path: /usr/share/locale/ko/LC_MESSAGES/diffutils.mo
    - path: /usr/share/locale/lv/LC_MESSAGES/diffutils.mo
    - path: /usr/share/locale/ms/LC_MESSAGES/diffutils.mo
