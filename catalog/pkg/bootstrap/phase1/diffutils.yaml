    - path: /usr/share/locale/es/LC_MESSAGES/diffutils.mo
    - path: /usr/share/locale/fi/LC_MESSAGES/diffutils.mo
    - path: /usr/share/locale/fr/LC_MESSAGES/diffutils.mo
    - path: /usr/share/locale/ga/LC_MESSAGES/diffutils.mo
