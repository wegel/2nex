    - path: /usr/share/locale/hr/LC_MESSAGES/diffutils.mo
    - path: /usr/share/locale/hu/LC_MESSAGES/diffutils.mo
    - path: /usr/share/locale/id/LC_MESSAGES/diffutils.mo
