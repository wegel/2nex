- name: gzip
  commit: x86_64/pkg/bootstrap/phase1/gzip/1.13/bundles/dev
- name: make
  commit: x86_64/pkg/bootstrap/phase1/make/4.4.1/bundles/dev
- name: patch
  commit: x86_64/pkg/bootstrap/phase1/patch/2.7.6/bundles/dev
- name: sed
  commit: x86_64/pkg/bootstrap/phase1/sed/4.9/bundles/dev
- name: tar
  commit: x86_64/pkg/bootstrap/phase1/tar/1.35/bundles/dev
- name: xz
  commit: x86_64/pkg/bootstrap/phase1/xz/5.4.6/bundles/dev
- name: bzip2
  commit: x86_64/pkg/bootstrap/phase1/bzip2/1.0.8/bundles/dev
- name: binutils-pass2
  commit: x86_64/pkg/bootstrap/phase1/binutils/2.42/bundles/dev
- name: gcc-pass2
  commit: x86_64/pkg/bootstrap/phase1/gcc/13.2.0/bundles/dev

build:
  environment: 4f2c74a7b827c73d2ca4d9caedbd9df1c6481e23
  profile: []

  script: |
    for path in etc usr; do
      if [ -e "${SYSROOT}/${path}" ]; then
        cp -a "${SYSROOT}/${path}" "${OUT_DIR}/"
      fi
    done
    rm -f "${OUT_DIR}/usr/lib64" "${OUT_DIR}/usr/sbin"

    test -x "${OUT_DIR}/usr/bin/bash"
    test -x "${OUT_DIR}/usr/bin/gcc"
    test -x "${OUT_DIR}/usr/lib/ld-linux-x86-64.so.2"

    readelf -l "${OUT_DIR}/usr/bin/gcc" |
      grep -Eq '/(usr/lib|lib64)/ld-linux-x86-64.so.2'
    "${OUT_DIR}/usr/lib/ld-linux-x86-64.so.2" \
      --library-path "${OUT_DIR}/usr/lib" \
      "${OUT_DIR}/usr/bin/gcc" --version
    "${OUT_DIR}/usr/lib/ld-linux-x86-64.so.2" \
      --library-path "${OUT_DIR}/usr/lib" \
      "${OUT_DIR}/usr/bin/bash" --version

    bad_abi=$(
      find "${OUT_DIR}" -type f -exec bash -c '
        for file do
          readelf -h "$file" >/dev/null 2>&1 || continue
          readelf --version-info "$file" 2>/dev/null |
            sed -n "s/.*GLIBC_\([0-9][0-9]*\)\.\([0-9][0-9]*\).*/\1 \2/p" |
            while read -r major minor; do
              if [ "$major" -gt 2 ] || { [ "$major" -eq 2 ] && [ "$minor" -gt 39 ]; }; then
                printf "%s needs GLIBC_%s.%s\n" "$file" "$major" "$minor"
              fi
            done
        done
      ' bash {} +
    )
    if [ -n "${bad_abi}" ]; then
      printf '%s\n' "${bad_abi}" >&2
      exit 1
    fi

bundles:
  dev:
  - bin
  - dev
  - lib
  - locale
  - misc
  - static

