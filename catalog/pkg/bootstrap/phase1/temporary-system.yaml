package:
  schema: 1
  name: Temporary target system
  slug: temporary-system
  namespace: bootstrap/phase1
  version: "1.0"
  description: Complete target root used before Nex enters chroot
  homepage: https://www.linuxfromscratch.org/lfs/view/stable/chapter06/introduction.html
  stable_checksum: false
  seed: true

sources: []

dependencies:
- name: pass1-toolchain
  commit: x86_64/pkg/bootstrap/phase0/toolchain/1.0/bundles/dev
- name: m4
  commit: x86_64/pkg/bootstrap/phase1/m4/1.4.19/bundles/dev
- name: ncurses
  commit: x86_64/pkg/bootstrap/phase1/ncurses/6.4-20230520/bundles/dev
- name: bash
  commit: x86_64/pkg/bootstrap/phase1/bash/5.2.21/bundles/dev
- name: coreutils
  commit: x86_64/pkg/bootstrap/phase1/coreutils/9.5/bundles/dev
- name: diffutils
