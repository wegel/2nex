package:
  schema: 1
  name: Bash
  slug: bash
  namespace: bootstrap/phase3
  version: 5.2.21
  description: The GNU Bourne Again shell
  homepage: https://www.gnu.org/software/bash/
  checksum: 0e949f371955ba2130b8c5de91b9a1101e817e60169f2a2945561625c65fb297
  seed: true

sources:
- name: bash
  url: https://ftp.gnu.org/gnu/bash/bash-5.2.21.tar.gz
  sha256: c8e31bdc59b69aaffc5b36509905ba3e5cbb12747091d27b4b977f078560d5b8

dependencies:
- name: temporary-system
  commit: x86_64/pkg/bootstrap/phase1/temporary-system/1.0/bundles/dev
- name: linux-headers
  commit: x86_64/pkg/bootstrap/phase3/linux-headers/6.4.1/bundles/dev
- name: glibc
  commit: x86_64/pkg/bootstrap/phase3/glibc/2.39/bundles/dev
- name: binutils
  commit: x86_64/pkg/bootstrap/phase3/binutils/2.42/bundles/dev
- name: gcc
  commit: x86_64/pkg/bootstrap/phase3/gcc/13.2.0/bundles/dev

build:
  environment: 002d6759a3ccdb3587b39a187250574c6d1de529
  profile: [4112:2874, 12378:12815, 24934:25096, 37453:25260, 49950:25566, 62421:25672, 74846:25851, 91393:25960, 108136:31104, 120057:31548]

  script: |
    tar --no-same-owner -xf /${SOURCE_bash} -C "${WORK_DIR}" --strip-components=1
    cd ${WORK_DIR}

    ./configure --prefix=/usr --without-bash-malloc --disable-readline --disable-nls
    make
    make DESTDIR=${OUT_DIR} install
    ln -sv bash ${OUT_DIR}/usr/bin/sh

    rm -rf ${OUT_DIR}/usr/share/man ${OUT_DIR}/usr/share/info ${OUT_DIR}/usr/share/doc
    rm -rf ${OUT_DIR}/usr/share/locale
    rm -rf ${OUT_DIR}/usr/include ${OUT_DIR}/usr/lib

    find ${OUT_DIR} -type f -executable -exec strip --strip-unneeded {} \; 2>/dev/null || true
    find ${OUT_DIR} -name '*.a' -exec objcopy --enable-deterministic-archives {} \; 2>/dev/null || true
    find "${OUT_DIR}" -exec touch -d '2024-01-01T00:00:00+00:00' {} \;

bundles:
  dev:
  - bin

outputs:
  bin:
    files:
    - path: /usr/bin/bash
    - path: /usr/bin/bashbug
    - path: /usr/bin/sh
