package:
  schema: 1
  name: Tar
  slug: tar
  namespace: bootstrap/phase3
  version: "1.35"
  description: An archiving program
  homepage: https://www.gnu.org/software/tar/
  checksum: d135eb5a24bdcbc9a2486ff1ef936eeb0670a88f217610c1c3e8bb06e8c36b54
  seed: true

sources:
- name: tar
  url: https://ftp.gnu.org/gnu/tar/tar-1.35.tar.xz
  sha256: 4d62ff37342ec7aed748535323930c7cf94acf71c3591882b26a7ea50f3edc16

dependencies:
- name: temporary-system
  commit: x86_64/pkg/bootstrap/phase1/temporary-system/1.0/bundles/dev
- name: linux-headers
  commit: x86_64/pkg/bootstrap/phase3/linux-headers/6.4.1/bundles/dev
- name: glibc
  commit: x86_64/pkg/bootstrap/phase3/glibc/2.39/bundles/dev
- name: binutils
  commit: x86_64/pkg/bootstrap/phase3/binutils/2.42/bundles/dev
- name: gcc
  commit: x86_64/pkg/bootstrap/phase3/gcc/13.2.0/bundles/dev

build:
  environment: 002d6759a3ccdb3587b39a187250574c6d1de529
  profile: [4120:2392, 8222:6649, 12329:11813, 16455:15048, 20571:25871, 24699:32362, 28805:33845, 32926:34085, 37040:37055, 39678:37233]

  script: |
    tar --no-same-owner -xf /${SOURCE_tar} -C "${WORK_DIR}" --strip-components=1
    cd ${WORK_DIR}

    FORCE_UNSAFE_CONFIGURE=1 ./configure --prefix=/usr --disable-nls
    make
    make DESTDIR=${OUT_DIR} install

    rm -rf ${OUT_DIR}/usr/share/info ${OUT_DIR}/usr/share/man
    rm -rf ${OUT_DIR}/usr/share/locale

    find ${OUT_DIR} -type f -executable -exec strip --strip-unneeded {} \; 2>/dev/null || true
    find ${OUT_DIR} -name '*.a' -exec objcopy --enable-deterministic-archives {} \; 2>/dev/null || true
    find "${OUT_DIR}" -exec touch -d '2024-01-01T00:00:00+00:00' {} \;

bundles:
  dev:
  - bin

outputs:
  bin:
    files:
    - path: /usr/bin/tar
    - path: /usr/libexec/rmt
