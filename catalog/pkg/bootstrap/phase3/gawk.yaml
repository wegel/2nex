package:
  schema: 1
  name: Gawk
  slug: gawk
  namespace: bootstrap/phase3
  version: 5.3.0
  description: GNU awk, a pattern scanning and processing language
  homepage: https://www.gnu.org/software/gawk/
  checksum: 65bbb057573991f12f116b3a0d284848ddff9add4ed417cc320060f897ec2fd0
  seed: true

sources:
- name: gawk
  url: https://ftp.gnu.org/gnu/gawk/gawk-5.3.0.tar.xz
  sha256: ca9c16d3d11d0ff8c69d79dc0b47267e1329a69b39b799895604ed447d3ca90b

dependencies:
- name: temporary-system
  commit: x86_64/pkg/bootstrap/phase1/temporary-system/1.0/bundles/dev
- name: linux-headers
  commit: x86_64/pkg/bootstrap/phase3/linux-headers/6.4.1/bundles/dev
- name: glibc
  commit: x86_64/pkg/bootstrap/phase3/glibc/2.39/bundles/dev
- name: binutils
  commit: x86_64/pkg/bootstrap/phase3/binutils/2.42/bundles/dev
- name: gcc
  commit: x86_64/pkg/bootstrap/phase3/gcc/13.2.0/bundles/dev

build:
  environment: 002d6759a3ccdb3587b39a187250574c6d1de529
  profile: [4112:1555, 8234:6674, 12371:7900, 20795:10245, 24907:10262, 33599:10663, 37906:12995, 46460:13113, 54716:13643, 59863:14174]

  script: |
    tar --no-same-owner -xf /${SOURCE_gawk} -C "${WORK_DIR}" --strip-components=1
    cd ${WORK_DIR}

    sed -i 's/extras//' Makefile.in
    ./configure --prefix=/usr --disable-nls
    make
    make DESTDIR=${OUT_DIR} install

    rm -rf ${OUT_DIR}/usr/share/man ${OUT_DIR}/usr/share/info
    rm -rf ${OUT_DIR}/usr/share/locale
    rm -rf ${OUT_DIR}/usr/include

    find ${OUT_DIR} -type f -executable -exec strip --strip-unneeded {} \; 2>/dev/null || true
    find ${OUT_DIR} -name '*.a' -exec objcopy --enable-deterministic-archives {} \; 2>/dev/null || true
    find "${OUT_DIR}" -exec touch -d '2024-01-01T00:00:00+00:00' {} \;

bundles:
  dev:
  - bin

outputs:
  bin:
    files:
    - path: /usr/bin/awk
    - path: /usr/bin/gawk
    - path: /usr/bin/gawk-5.3.0
    - path: /usr/bin/gawkbug
    - path: /usr/libexec/awk/grcat
    - path: /usr/libexec/awk/pwcat

  lib:
    files:
    - path: /usr/lib/gawk/filefuncs.so
    - path: /usr/lib/gawk/fnmatch.so
    - path: /usr/lib/gawk/fork.so
    - path: /usr/lib/gawk/inplace.so
    - path: /usr/lib/gawk/intdiv.so
    - path: /usr/lib/gawk/ordchr.so
    - path: /usr/lib/gawk/readdir.so
    - path: /usr/lib/gawk/readfile.so
    - path: /usr/lib/gawk/revoutput.so
    - path: /usr/lib/gawk/revtwoway.so
    - path: /usr/lib/gawk/rwarray.so
    - path: /usr/lib/gawk/time.so

  misc:
    files:
    - path: /usr/share/awk/assert.awk
    - path: /usr/share/awk/bits2str.awk
    - path: /usr/share/awk/cliff_rand.awk
    - path: /usr/share/awk/ctime.awk
    - path: /usr/share/awk/ftrans.awk
    - path: /usr/share/awk/getopt.awk
    - path: /usr/share/awk/gettime.awk
    - path: /usr/share/awk/group.awk
