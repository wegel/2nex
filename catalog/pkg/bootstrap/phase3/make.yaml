package:
  schema: 1
  name: Make
  slug: make
  namespace: bootstrap/phase3
  version: 4.4.1
  description: Utility to maintain groups of programs
  homepage: https://www.gnu.org/software/make/
  checksum: c14f6172ca4676daf8b8e8a41286fee443b801d89a0c5fa0a6413f1528edad8c
  seed: true

sources:
- name: make
  url: https://ftp.gnu.org/gnu/make/make-4.4.1.tar.gz
  sha256: dd16fb1d67bfab79a72f5e8390735c49e3e8e70b4945a15ab1f81ddb78658fb3

dependencies:
- name: temporary-system
  commit: x86_64/pkg/bootstrap/phase1/temporary-system/1.0/bundles/dev
- name: linux-headers
  commit: x86_64/pkg/bootstrap/phase3/linux-headers/6.4.1/bundles/dev
- name: glibc
  commit: x86_64/pkg/bootstrap/phase3/glibc/2.39/bundles/dev
- name: binutils
  commit: x86_64/pkg/bootstrap/phase3/binutils/2.42/bundles/dev
- name: gcc
  commit: x86_64/pkg/bootstrap/phase3/gcc/13.2.0/bundles/dev
- name: zlib
  commit: x86_64/pkg/bootstrap/phase3/zlib/1.3.1/bundles/dev

build:
  environment: 002d6759a3ccdb3587b39a187250574c6d1de529
  profile: [4118:1879, 8285:6066, 12406:6112, 16711:6127, 20828:6145, 24938:7645, 25805:7693]

  script: |
    tar --no-same-owner -xf /${SOURCE_make} -C "${WORK_DIR}" --strip-components=1
    cd ${WORK_DIR}

    ./configure --prefix=/usr --without-guile CPP="gcc -E"
    make
    make DESTDIR=${OUT_DIR} install

    rm -rf ${OUT_DIR}/usr/share/info ${OUT_DIR}/usr/share/man
    rm -rf ${OUT_DIR}/usr/share/locale
    rm -rf ${OUT_DIR}/usr/include

    find ${OUT_DIR} -type f -executable -exec strip --strip-unneeded {} \; 2>/dev/null || true
    find ${OUT_DIR} -name '*.a' -exec objcopy --enable-deterministic-archives {} \; 2>/dev/null || true
    find "${OUT_DIR}" -exec touch -d '2024-01-01T00:00:00+00:00' {} \;

bundles:
  dev:
  - bin

outputs:
  bin:
    files:
    - path: /usr/bin/make
