package:
  schema: 1
  name: Zlib
  slug: zlib
  namespace: bootstrap/phase3
  version: 1.3.1
  description: A Massively Spiffy Yet Delicately Unobtrusive Compression Library
  homepage: https://zlib.net/
  checksum: ef3e360cdbf65429677f4789303dd00faeb91f493f0752e25a07efc0a61e5f13
  seed: true

sources:
- name: zlib
  url: https://zlib.net/fossils/zlib-1.3.1.tar.gz
  sha256: 9a93b2b7dfdac77ceba5a558a580e74667dd6fede4585b91eefb60f03b72df23

dependencies:
- name: temporary-system
  commit: x86_64/pkg/bootstrap/phase1/temporary-system/1.0/bundles/dev
- name: linux-headers
  commit: x86_64/pkg/bootstrap/phase3/linux-headers/6.4.1/bundles/dev
- name: glibc
  commit: x86_64/pkg/bootstrap/phase3/glibc/2.39/bundles/dev
- name: binutils
  commit: x86_64/pkg/bootstrap/phase3/binutils/2.42/bundles/dev
- name: gcc
  commit: x86_64/pkg/bootstrap/phase3/gcc/13.2.0/bundles/dev

build:
  environment: 002d6759a3ccdb3587b39a187250574c6d1de529
  profile: [4233:390, 8382:2072, 8488:2092]

  script: |
    tar --no-same-owner -xf /${SOURCE_zlib} -C "${WORK_DIR}" --strip-components=1
    cd ${WORK_DIR}

    ./configure --prefix=/usr
    make
    make DESTDIR=${OUT_DIR} install

    rm -rf ${OUT_DIR}/usr/share
    rm -f ${OUT_DIR}/usr/lib/libz.a

    find ${OUT_DIR} -type f -executable -exec strip --strip-unneeded {} \; 2>/dev/null || true
    find ${OUT_DIR} -name '*.a' -exec objcopy --enable-deterministic-archives {} \; 2>/dev/null || true
    find "${OUT_DIR}" -exec touch -d '2024-01-01T00:00:00+00:00' {} \;

bundles:
  dev:
  - dev
  - lib

outputs:
  dev:
    files:
    - path: /usr/include/zconf.h
    - path: /usr/include/zlib.h
    - path: /usr/lib/pkgconfig/zlib.pc

  lib:
    files:
    - path: /usr/lib/libz.so
    - path: /usr/lib/libz.so.1
    - path: /usr/lib/libz.so.1.3.1
