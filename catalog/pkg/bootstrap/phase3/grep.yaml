package:
  schema: 1
  name: Grep
  slug: grep
  namespace: bootstrap/phase3
  version: "3.11"
  description: Print lines that match patterns
  homepage: https://www.gnu.org/software/grep/
  checksum: b3e84b14fc489c93dc71b753649a4c98e93eca60168d9b2c976379a57484be0d
  seed: true

sources:
- name: grep
  url: https://ftp.gnu.org/gnu/grep/grep-3.11.tar.xz
  sha256: 1db2aedde89d0dea42b16d9528f894c8d15dae4e190b59aecc78f5a951276eab

dependencies:
- name: temporary-system
  commit: x86_64/pkg/bootstrap/phase1/temporary-system/1.0/bundles/dev
- name: linux-headers
  commit: x86_64/pkg/bootstrap/phase3/linux-headers/6.4.1/bundles/dev
- name: glibc
  commit: x86_64/pkg/bootstrap/phase3/glibc/2.39/bundles/dev
- name: binutils
  commit: x86_64/pkg/bootstrap/phase3/binutils/2.42/bundles/dev
- name: gcc
  commit: x86_64/pkg/bootstrap/phase3/gcc/13.2.0/bundles/dev

build:
  environment: 002d6759a3ccdb3587b39a187250574c6d1de529
  profile: [4127:3089, 8230:7541, 12372:9754, 16537:13132, 20673:17741, 24799:26555, 28895:28698, 32612:29121]

  script: |
    tar --no-same-owner -xf /${SOURCE_grep} -C "${WORK_DIR}" --strip-components=1
    cd ${WORK_DIR}

    ./configure --prefix=/usr --disable-nls
    make
    make DESTDIR=${OUT_DIR} install

    rm -rf ${OUT_DIR}/usr/share/info ${OUT_DIR}/usr/share/man
    rm -rf ${OUT_DIR}/usr/share/locale

    find ${OUT_DIR} -type f -executable -exec strip --strip-unneeded {} \; 2>/dev/null || true
    find ${OUT_DIR} -name '*.a' -exec objcopy --enable-deterministic-archives {} \; 2>/dev/null || true
    find "${OUT_DIR}" -exec touch -d '2024-01-01T00:00:00+00:00' {} \;

bundles:
  dev:
  - bin

outputs:
  bin:
    files:
    - path: /usr/bin/egrep
    - path: /usr/bin/fgrep
    - path: /usr/bin/grep
