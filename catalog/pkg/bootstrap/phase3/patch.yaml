package:
  schema: 1
  name: Patch
  slug: patch
  namespace: bootstrap/phase3
  version: 2.7.6
  description: A utility to apply patch files to original sources
  homepage: https://savannah.gnu.org/projects/patch/
  checksum: 518ed042f6f180687a6e4a18fd912962e3181ef07461cf4fd24b2bd3585544b6
  seed: true

sources:
- name: patch
  url: https://ftp.gnu.org/gnu/patch/patch-2.7.6.tar.xz
  sha256: ac610bda97abe0d9f6b7c963255a11dcb196c25e337c61f94e4778d632f1d8fd

dependencies:
- name: temporary-system
  commit: x86_64/pkg/bootstrap/phase1/temporary-system/1.0/bundles/dev
- name: linux-headers
  commit: x86_64/pkg/bootstrap/phase3/linux-headers/6.4.1/bundles/dev
- name: glibc
  commit: x86_64/pkg/bootstrap/phase3/glibc/2.39/bundles/dev
- name: binutils
  commit: x86_64/pkg/bootstrap/phase3/binutils/2.42/bundles/dev
- name: gcc
  commit: x86_64/pkg/bootstrap/phase3/gcc/13.2.0/bundles/dev

build:
  environment: 002d6759a3ccdb3587b39a187250574c6d1de529
  profile: [4122:4193, 8240:8720, 12386:11175, 16482:13664, 20643:14990, 24794:18004, 28900:24530, 32999:27661, 34416:27764]

  script: |
    tar --no-same-owner -xf /${SOURCE_patch} -C "${WORK_DIR}" --strip-components=1
    cd ${WORK_DIR}

    ./configure --prefix=/usr
    make
    make DESTDIR=${OUT_DIR} install

    rm -rf ${OUT_DIR}/usr/share/info ${OUT_DIR}/usr/share/man

    find ${OUT_DIR} -type f -executable -exec strip --strip-unneeded {} \; 2>/dev/null || true
    find ${OUT_DIR} -name '*.a' -exec objcopy --enable-deterministic-archives {} \; 2>/dev/null || true
    find "${OUT_DIR}" -exec touch -d '2024-01-01T00:00:00+00:00' {} \;

bundles:
  dev:
  - bin

outputs:
  bin:
    files:
    - path: /usr/bin/patch
