  homepage: https://www.gnu.org/software/binutils/
  checksum: c6222c27a5e78a5af481ef30d879f21c922337da4be244d4f0ef9e695eb27655
  seed: true

sources:
- name: binutils
  url: https://ftp.gnu.org/gnu/binutils/binutils-2.42.tar.xz
  sha256: f6e4d41fd5fc778b06b7891457b3620da5ecea1006c6a4a41ae998109f85a800

dependencies:
- name: temporary-system
  commit: x86_64/pkg/bootstrap/phase1/temporary-system/1.0/bundles/dev
- name: linux-headers
  commit: x86_64/pkg/bootstrap/phase3/linux-headers/6.4.1/bundles/dev
- name: glibc
  commit: x86_64/pkg/bootstrap/phase3/glibc/2.39/bundles/dev

build:
  environment: 002d6759a3ccdb3587b39a187250574c6d1de529
  profile: [8223:2200, 20629:2670, 41269:3121, 66775:7414, 87902:7464, 109318:7513, 130149:7569, 160077:13717, 193197:33997, 210903:36023]

  script: |
    # Build Binutils with the target-native pass-2 compiler and tools.
    unset AR NM RANLIB

    tar --no-same-owner -xf ${SOURCE_binutils} -C "${WORK_DIR}" --strip-components=1
    cd "${WORK_DIR}" && mkdir -p build && cd build

    ../configure                 \
      --prefix=/usr              \
      --build=$(../config.guess) \
      --disable-nls              \
      --enable-shared            \
      --enable-gprofng=no        \
      --disable-werror           \
      --enable-64-bit-bfd        \
      --enable-default-hash-style=gnu \
      --enable-gold              \
      --enable-plugins           \
      --without-zstd

    make MAKEINFO=true
    make MAKEINFO=true DESTDIR=${OUT_DIR} install

    rm -rf ${OUT_DIR}/usr/share/info ${OUT_DIR}/usr/share/man

    # strip binaries
    find ${OUT_DIR} -type f -executable -exec x86_64-nex-linux-gnu-strip --strip-unneeded {} \; 2>/dev/null || true

    # make static archives deterministic
    for A in ${OUT_DIR}/usr/lib/*.a; do
      x86_64-nex-linux-gnu-objcopy --enable-deterministic-archives "$A"
    done

    find "${OUT_DIR}" -exec touch -d '2024-01-01T00:00:00+00:00' {} \;

