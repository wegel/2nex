  name: Python
  slug: python3
  namespace: bootstrap/phase2
  version: 3.12.2
  description: Python is an easy to learn, powerful programming language
  homepage: https://www.python.org/
  stable_checksum: false
  seed: true

sources:
- name: python
  url: https://www.python.org/ftp/python/3.12.2/Python-3.12.2.tar.xz
  sha256: be28112dac813d2053545c14bf13a16401a21877f1a69eb6ea5d84c4a0f3d870

dependencies:
- name: temporary-system
  commit: x86_64/pkg/bootstrap/phase1/temporary-system/1.0/bundles/dev

build:
  environment: 002d6759a3ccdb3587b39a187250574c6d1de529
  profile: [16432:11725, 54162:21134, 120974:28523, 199844:30004, 268033:63428, 330225:63741, 396383:64113, 496132:65899, 595525:74157, 660050:80650]

  script: |
    tar --no-same-owner -xf ${SOURCE_python} -C "${WORK_DIR}" --strip-components=1
    cd ${WORK_DIR}

    export PYTHONHASHSEED=424242
    CFLAGS=
    LDFLAGS=

    ./configure --prefix=/usr   \
          --enable-shared \
          --without-ensurepip
    set -x
    make
    make DESTDIR=${OUT_DIR} install

    LD_LIBRARY_PATH=${OUT_DIR}/usr/lib \
      ${OUT_DIR}/usr/bin/python3 -c 'import math, cmath, termios'

    find ${OUT_DIR}/usr/lib/python* -name "*.a" -delete
    rm -rf ${OUT_DIR}/usr/lib/python*/test

    rm -rf ${OUT_DIR}/usr/share/info ${OUT_DIR}/usr/share/man
    find "${OUT_DIR}" -exec touch -d "2024-01-01T00:00:00+00:00" {} \;

bundles:
  dev:
  - bin
  - dev
  - lib

