  file: pkg/libs/graphics/libglvnd-egl-vendor-uapi-config.patch
  sha256: a4673a94c4539970e9e981721befe88a3cc8439b984abf41f5605f5cd4a9c0c4
- name: egl_vendor_smoke
  file: pkg/libs/graphics/libglvnd-egl-vendor-smoke.c
  sha256: 9cd2461bc62d38e427a9a6b6e620d9f88192b5ffe19f45bfd8aa829b2eb13120

