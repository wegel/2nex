  description: GL Vendor-Neutral Dispatch library
  homepage: https://github.com/NVIDIA/libglvnd
  checksum: b7a914309f4e10ea7f06a5d8b9e7dc083f9708cc0fb638d3fdc1b9d7c0291d62

sources:
- name: libglvnd
  url: https://github.com/NVIDIA/libglvnd/archive/v1.7.0.tar.gz
  sha256: 073e7292788d4d3eeb45ea6c7bdcce9bfdb3b3eef8d7dbd47f2f30dce046ef98
