build:
  environment: 248c5014338ab55a89b9c261e303e111e6847aec
  profile: [4132:10243, 8280:13173, 10405:14846]

  script: |
    set -eu

    CFLAGS=${CFLAGS/-flto=auto/}
    CXXFLAGS=${CXXFLAGS/-flto=auto/}
    LDFLAGS=${LDFLAGS/-flto=auto/}

    tar --no-same-owner -xf "${SOURCE_qt6_5compat}" -C "${WORK_DIR}" --strip-components=1
    cd "${WORK_DIR}"

    cmake -S . -B build -G Ninja \
      -DCMAKE_INSTALL_PREFIX=/usr \
      -DCMAKE_BUILD_TYPE=Release \
      -DINSTALL_LIBDIR=lib \
      -DINSTALL_INCLUDEDIR=include/qt6 \
      -DINSTALL_ARCHDATADIR=lib/qt6 \
      -DINSTALL_DATADIR=share/qt6 \
      -DINSTALL_MKSPECSDIR=lib/qt6/mkspecs \
      -DQT_BUILD_TESTS=OFF \
      -DQT_BUILD_EXAMPLES=OFF

    cmake --build build
    DESTDIR="${OUT_DIR}" cmake --install build

    find "${OUT_DIR}" -type f -executable -exec strip --strip-unneeded {} \; 2>/dev/null || true
    find "${OUT_DIR}" -name '*.a' -exec objcopy --enable-deterministic-archives {} \; 2>/dev/null || true
    find "${OUT_DIR}" -exec touch -d "2024-01-01T00:00:00+00:00" {} \;

bundles:
  dev:
  - dev
  - lib

  full:
  - dev
  - lib

