package:
  schema: 1
  name: libnotify
  slug: libnotify
  namespace: libs/graphics
  version: 0.8.3
  description: Desktop notifications library
  homepage: https://gitlab.gnome.org/GNOME/libnotify
  checksum: 43d43c92ae4928dc0d3e8421ffd2ce284c6855d8fe4e2f50eb1aed9375f52b37

sources:
- name: libnotify
  url: https://download.gnome.org/sources/libnotify/0.8/libnotify-0.8.3.tar.xz
  sha256: ee8f3ef946156ad3406fdf45feedbdcd932dbd211ab4f16f75eba4f36fb2f6c0

dependencies:
- name: glibc
  commit: x86_64/pkg/libs/system/glibc/2.39/bundles/dev
- name: gmp
  commit: x86_64/pkg/libs/system/gmp/6.3.0/bundles/dev
- name: gcc
  commit: x86_64/pkg/core/toolchain/gcc/13.2.0/bundles/dev
- name: binutils
  commit: x86_64/pkg/core/toolchain/binutils/2.42/bundles/dev
- name: bash
  commit: x86_64/pkg/cli/shells/bash/5.2.21/bundles/dev
- name: ncurses
  commit: x86_64/pkg/libs/system/ncurses/6.4-20230520/bundles/dev
- name: acl
  commit: x86_64/pkg/libs/system/acl/2.3.2/bundles/dev
- name: attr
  commit: x86_64/pkg/libs/system/attr/2.5.2/bundles/dev
- name: tar
  commit: x86_64/pkg/cli/archive/tar/1.35/bundles/dev
- name: xz
  commit: x86_64/pkg/libs/compression/xz/5.4.6/bundles/dev
- name: zlib
  commit: x86_64/pkg/libs/system/zlib/1.3.1/bundles/dev
- name: coreutils
  commit: x86_64/pkg/core/userland/coreutils/9.5/bundles/dev
- name: findutils
  commit: x86_64/pkg/core/userland/findutils/4.9.0/bundles/dev
- name: linux-headers
  commit: x86_64/pkg/libs/system/linux-headers/6.4.1/bundles/dev
- name: meson
  commit: x86_64/pkg/core/toolchain/meson/1.6.1/bundles/dev
- name: ninja
  commit: x86_64/pkg/core/toolchain/ninja/1.12.1/bundles/dev
- name: python3
  commit: x86_64/pkg/dev/lang/python3/3.12.2/bundles/dev
- name: pkgconf
  commit: x86_64/pkg/core/toolchain/pkgconf/2.2.0/bundles/dev
- name: glib2
  commit: x86_64/pkg/dev/libs/glib2/2.84.0/bundles/dev
- name: libffi
  commit: x86_64/pkg/libs/system/libffi/3.4.6/bundles/dev
- name: pcre2
  commit: x86_64/pkg/dev/libs/pcre2/10.44/bundles/dev
- name: gdk-pixbuf
  commit: x86_64/pkg/libs/graphics/gdk-pixbuf/2.44.2/bundles/dev
- name: cairo
  commit: x86_64/pkg/libs/graphics/cairo/1.18.4/bundles/dev
- name: pango
  commit: x86_64/pkg/libs/text/pango/1.57.0/bundles/dev
- name: gtk3
  commit: x86_64/pkg/libs/graphics/gtk3/3.24.43/bundles/dev
- name: libxslt
  commit: x86_64/pkg/libs/text/libxslt/1.1.42/bundles/dev
- name: libpng
  commit: x86_64/pkg/libs/graphics/libpng/1.6.51/bundles/dev
- name: libjpeg-turbo
  commit: x86_64/pkg/libs/graphics/libjpeg-turbo/3.1.2/bundles/dev
- name: libtiff
  commit: x86_64/pkg/libs/graphics/libtiff/4.7.1/bundles/dev
- name: zstd
  commit: x86_64/pkg/libs/compression/zstd/1.5.6/bundles/dev
- name: shared-mime-info
  commit: x86_64/pkg/libs/system/shared-mime-info/2.4/bundles/dev
- name: util-linux
  commit: x86_64/pkg/core/userland/util_linux/2.40/bundles/dev

build:
  environment: 248c5014338ab55a89b9c261e303e111e6847aec
  profile: [3306:4599]

  script: |
    tar --no-same-owner -xf /${SOURCE0} -C "${WORK_DIR}" --strip-components=1
    cd ${WORK_DIR}

    meson setup build \
      --prefix=/usr \
      --libdir=lib \
      --buildtype=release \
      -Dtests=false \
      -Dintrospection=disabled \
      -Dman=false \
      -Dgtk_doc=false \
      -Ddocbook_docs=disabled

    ninja -C build
    DESTDIR="${OUT_DIR}" ninja -C build install

    find ${OUT_DIR} -type f -executable -exec strip --strip-unneeded {} \; 2>/dev/null || true
    find ${OUT_DIR} -name '*.a' -exec objcopy --enable-deterministic-archives {} \; 2>/dev/null || true
    find "${OUT_DIR}" -exec touch -d "2024-01-01T00:00:00+00:00" {} \;

bundles:
  dev:
  - dev
  - lib

  full:
  - dev
  - lib

outputs:
  bin:
    files:
    - path: /usr/bin/notify-send
      needs:
      - /usr/lib/ld-linux-x86-64.so.2
      - /usr/lib/libc.so.6
      - /usr/lib/libglib-2.0.so.0
      - /usr/lib/libgobject-2.0.so.0
      - /usr/lib/libnotify.so.4

  dev:
    files:
    - path: /usr/include/libnotify/notification.h
    - path: /usr/include/libnotify/notify-enum-types.h
    - path: /usr/include/libnotify/notify-features.h
    - path: /usr/include/libnotify/notify.h
    - path: /usr/lib/pkgconfig/libnotify.pc

  lib:
    files:
    - path: /usr/lib/libnotify.so
      needs:
      - /usr/lib/libc.so.6
      - /usr/lib/libgdk_pixbuf-2.0.so.0
      - /usr/lib/libgio-2.0.so.0
      - /usr/lib/libglib-2.0.so.0
      - /usr/lib/libgobject-2.0.so.0
    - path: /usr/lib/libnotify.so.4
      needs:
      - /usr/lib/libc.so.6
      - /usr/lib/libgdk_pixbuf-2.0.so.0
      - /usr/lib/libgio-2.0.so.0
      - /usr/lib/libglib-2.0.so.0
      - /usr/lib/libgobject-2.0.so.0
    - path: /usr/lib/libnotify.so.4.0.0
      needs:
      - /usr/lib/libc.so.6
      - /usr/lib/libgdk_pixbuf-2.0.so.0
      - /usr/lib/libgio-2.0.so.0
      - /usr/lib/libglib-2.0.so.0
      - /usr/lib/libgobject-2.0.so.0

resolution:
  /usr/lib/libgdk_pixbuf-2.0.so.0: gdk-pixbuf
  /usr/lib/libgio-2.0.so.0: glib2
  /usr/lib/libglib-2.0.so.0: glib2
  /usr/lib/libgobject-2.0.so.0: glib2
  /usr/lib/ld-linux-x86-64.so.2: glibc
  /usr/lib/libc.so.6: glibc
  /usr/lib/libnotify.so.4: self
