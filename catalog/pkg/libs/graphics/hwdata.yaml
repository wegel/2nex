package:
  schema: 1
  name: hwdata
  slug: hwdata
  namespace: libs/graphics
  version: "0.402"
  description: Hardware identification and configuration data
  homepage: https://github.com/vcrhonek/hwdata
  checksum: b93e137dad3a5a312f07c6254beaae61349a6b645c079c24adb91bd51b413d9c

sources:
- name: hwdata
  url: https://github.com/vcrhonek/hwdata/archive/refs/tags/v0.402.tar.gz
  sha256: e390fe2f5f5ef7ed9ccbe62eb7cd40d4ee2b57389e7869c0dc96433c81812e7a

dependencies:
- name: glibc
  commit: x86_64/pkg/libs/system/glibc/2.39/bundles/dev
- name: bash
  commit: x86_64/pkg/cli/shells/bash/5.2.21/bundles/dev
- name: ncurses
  commit: x86_64/pkg/libs/system/ncurses/6.4-20230520/bundles/dev
- name: acl
  commit: x86_64/pkg/libs/system/acl/2.3.2/bundles/dev
- name: attr
  commit: x86_64/pkg/libs/system/attr/2.5.2/bundles/dev
- name: coreutils
  commit: x86_64/pkg/core/userland/coreutils/9.5/bundles/dev
- name: findutils
  commit: x86_64/pkg/core/userland/findutils/4.9.0/bundles/dev
- name: tar
  commit: x86_64/pkg/cli/archive/tar/1.35/bundles/dev
- name: gzip
  commit: x86_64/pkg/cli/archive/gzip/1.13/bundles/dev
- name: make
  commit: x86_64/pkg/core/toolchain/make/4.4.1/bundles/dev
- name: sed
  commit: x86_64/pkg/cli/text/sed/4.9/bundles/dev
- name: gawk
  commit: x86_64/pkg/cli/text/gawk/5.3.0/bundles/dev

build:
  environment: 248c5014338ab55a89b9c261e303e111e6847aec
  profile: [623:191]

  script: |
    tar --no-same-owner -xzf ${SOURCE0} -C "${WORK_DIR}" --strip-components=1
    cd ${WORK_DIR}

    ./configure --prefix=/usr \
      --sysconfdir=/etc \
      --datadir=/usr/share \
      --disable-blacklist

    make
    make DESTDIR="${OUT_DIR}" install

    find "${OUT_DIR}" -exec touch -d "2024-01-01T00:00:00+00:00" {} \;

bundles:
  dev:
  - dev
  - misc

outputs:
  dev:
    files:
    - path: /usr/share/pkgconfig/hwdata.pc

  misc:
    files:
    - path: /usr/share/hwdata/iab.txt
    - path: /usr/share/hwdata/oui.txt
    - path: /usr/share/hwdata/pci.ids
    - path: /usr/share/hwdata/pnp.ids
    - path: /usr/share/hwdata/usb.ids
