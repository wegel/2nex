build:
  environment: 248c5014338ab55a89b9c261e303e111e6847aec
  profile: [4118:966, 8215:1944, 12325:7958, 14475:8011]

  script: |
    set -eu

    tar --no-same-owner -xf "${SOURCE_libhandy}" -C "${WORK_DIR}" --strip-components=1
    cd "${WORK_DIR}"

    mkdir -p /tmp/nex-vapigen-bin
    printf '%s\n' '#!/usr/bin/env bash' \
      'exec /usr/bin/vapigen-0.56 --vapidir=/usr/share/vala-0.56/vapi "$@"' \
      > /tmp/nex-vapigen-bin/vapigen
    chmod +x /tmp/nex-vapigen-bin/vapigen
    export PATH="/tmp/nex-vapigen-bin:${PATH}"
    export PKG_CONFIG_PATH=/usr/lib/pkgconfig:/usr/share/pkgconfig

    meson setup build \
      --prefix=/usr \
      --libdir=lib \
      --buildtype=release \
      --pkg-config-path=/usr/lib/pkgconfig:/usr/share/pkgconfig \
      -Dintrospection=enabled \
      -Dvapi=true \
      -Dgtk_doc=false \
      -Dtests=false \
      -Dexamples=false \
      -Dglade_catalog=disabled

    ninja -C build
    DESTDIR="${OUT_DIR}" ninja -C build install

    find "${OUT_DIR}" -type f -executable -exec strip --strip-unneeded {} \; 2>/dev/null || true
    find "${OUT_DIR}" -name '*.a' -exec objcopy --enable-deterministic-archives {} \; 2>/dev/null || true
    find "${OUT_DIR}" -exec touch -d "2024-01-01T00:00:00+00:00" {} \;

