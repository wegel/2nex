build:
  environment: 248c5014338ab55a89b9c261e303e111e6847aec
  profile: [4152:2646, 5608:2785]

  script: |
    set -eu
    tar --no-same-owner -xf /${SOURCE0} -C "${WORK_DIR}" --strip-components=1
    cd ${WORK_DIR}
    patch --batch --fuzz=0 -Np1 -i "/${SOURCE_config_patch}"

    meson setup build \
      --prefix=/usr \
      --libdir=lib \
      --buildtype=release \
      -Dwith_x11=no \
      -Dwith_glx=no \
      -Dwith_wayland=yes

    ninja -C build
    DESTDIR="${OUT_DIR}" ninja -C build install

    # va_parseConfig() carries DLL_HIDDEN visibility, so the smoke cannot
    # link against it directly. It goes through vaInitialize() instead,
    # which reads LIBVA_MESSAGING_LEVEL via va_parseConfig() on every call,
    # so each case below runs a fresh process against the real library.
    config_smoke="${WORK_DIR}/libva-config-smoke"
    gcc \
      -Wall -Wextra -Werror \
      -I"${OUT_DIR}/usr/include" \
      "/${SOURCE_config_smoke}" \
      -L"${OUT_DIR}/usr/lib" \
      -lva \
      -o "${config_smoke}"

    admin_conf=/etc/libva.conf
    runtime_conf=/run/libva.conf
    vendor_conf=/usr/lib/libva.conf

    cleanup_config_smoke() {
      rm -f "${admin_conf}" "${runtime_conf}" "${vendor_conf}"
    }
    trap cleanup_config_smoke EXIT
    cleanup_config_smoke
    mkdir -p /etc /run /usr/lib

    assert_level() {
      LD_LIBRARY_PATH="${OUT_DIR}/usr/lib:/usr/lib" "${config_smoke}" "$1"
    }
    assert_level_with_env() {
      env "LIBVA_MESSAGING_LEVEL=$1" \
        LD_LIBRARY_PATH="${OUT_DIR}/usr/lib:/usr/lib" \
        "${config_smoke}" "$2"
    }

    printf 'LIBVA_MESSAGING_LEVEL=0\n' > "${vendor_conf}"
    assert_level 0

    printf 'LIBVA_MESSAGING_LEVEL=1\n' > "${runtime_conf}"
    assert_level 1

    printf 'LIBVA_MESSAGING_LEVEL=2\n' > "${admin_conf}"
    assert_level 2

    rm "${admin_conf}"
    assert_level 1

    rm "${runtime_conf}"
    assert_level 0

    printf 'LIBVA_MESSAGING_LEVEL=1\n' > "${runtime_conf}"
    : > "${admin_conf}"
    assert_level 2
    rm "${admin_conf}"

    rm "${runtime_conf}"
    : > "${runtime_conf}"
    assert_level 2
    rm "${runtime_conf}"

    rm "${vendor_conf}"
    assert_level 2
    assert_level_with_env 1 1

    printf 'LIBVA_MESSAGING_LEVEL=0\n' > "${vendor_conf}"
    assert_level_with_env 2 0

    cleanup_config_smoke
    trap - EXIT

    printf 'libva UAPI smoke: libva.conf honoured all tiers\n'

    find ${OUT_DIR} -type f -executable -exec strip --strip-unneeded {} \; 2>/dev/null || true
    find ${OUT_DIR} -name '*.a' -exec objcopy --enable-deterministic-archives {} \; 2>/dev/null || true
    find "${OUT_DIR}" -exec touch -d "2024-01-01T00:00:00+00:00" {} \;

