build:
  environment: 248c5014338ab55a89b9c261e303e111e6847aec
  profile: [3597:6751]

  script: |
    set -eu

    tar --no-same-owner -xf /${SOURCE0} -C "${WORK_DIR}" --strip-components=1
    cd ${WORK_DIR}
    patch --batch --fuzz=0 -Np1 -i "/${SOURCE_uapi_config_patch}"

    cmake -B build -G Ninja \
      -DCMAKE_BUILD_TYPE=Release \
      -DCMAKE_INSTALL_PREFIX=/usr \
      -DCMAKE_INSTALL_LIBDIR=lib \
      -DCMAKE_INSTALL_SYSCONFDIR=/etc \
      -DBUILD_WSI_XCB_SUPPORT=OFF \
      -DBUILD_WSI_WAYLAND_SUPPORT=ON \
      -DBUILD_WSI_XLIB_SUPPORT=OFF \
      -DBUILD_TESTS=OFF

    cmake --build build
    DESTDIR="${OUT_DIR}" cmake --install build

    # Exercise the newly built, installed libvulkan through vkCreateInstance(),
    # the public entry point that always runs the real default driver, implicit
    # layer, and vk_loader_settings.json searches before it can tell whether a
    # usable driver exists. VK_LOADER_DEBUG=all makes those real readers log the
    # absolute path of every file each one selected, which the check script
    # inspects instead of a working ICD.
    sh "/${SOURCE_uapi_check}" \
      "${OUT_DIR}" \
      "${WORK_DIR}" \
      "/${SOURCE_uapi_smoke}"

    find ${OUT_DIR} -type f -executable -exec strip --strip-unneeded {} \; 2>/dev/null || true
    find ${OUT_DIR} -name '*.a' -exec objcopy --enable-deterministic-archives {} \; 2>/dev/null || true
    find "${OUT_DIR}" -exec touch -d "2024-01-01T00:00:00+00:00" {} \;

bundles:
  dev:
  - dev
  - lib

  full:
  - dev
  - lib

outputs:
  dev:
    files:
    - path: /usr/lib/pkgconfig/vulkan.pc

  lib:
    files:
    - path: /usr/lib/cmake/VulkanLoader/VulkanLoaderConfig-release.cmake
    - path: /usr/lib/cmake/VulkanLoader/VulkanLoaderConfig.cmake
    - path: /usr/lib/cmake/VulkanLoader/VulkanLoaderConfigVersion.cmake
    - path: /usr/lib/libvulkan.so
      needs:
      - /usr/lib/libc.so.6
    - path: /usr/lib/libvulkan.so.1
      needs:
      - /usr/lib/libc.so.6
    - path: /usr/lib/libvulkan.so.1.4.328
      needs:
      - /usr/lib/libc.so.6

resolution:
  /usr/lib/libc.so.6: glibc
