package:
  schema: 1
  name: Little CMS 2
  slug: lcms2
  namespace: libs/graphics
  version: "2.17"
  description: Small-footprint color management engine
  homepage: https://www.littlecms.com/
  checksum: 304203d7703c0ea95c7daa43348dc1fa5ed7eea728b4712228eab06a9087464d

sources:
- name: lcms2
  url: https://github.com/mm2/Little-CMS/releases/download/lcms2.17/lcms2-2.17.tar.gz
  sha256: d11af569e42a1baa1650d20ad61d12e41af4fead4aa7964a01f93b08b53ab074

dependencies:
- name: glibc
  commit: x86_64/pkg/libs/system/glibc/2.39/bundles/dev
- name: gcc
  commit: x86_64/pkg/core/toolchain/gcc/13.2.0/bundles/dev
- name: binutils
  commit: x86_64/pkg/core/toolchain/binutils/2.42/bundles/dev
- name: bash
  commit: x86_64/pkg/cli/shells/bash/5.2.21/bundles/dev
- name: coreutils
  commit: x86_64/pkg/core/userland/coreutils/9.5/bundles/dev
- name: findutils
  commit: x86_64/pkg/core/userland/findutils/4.9.0/bundles/dev
- name: gawk
  commit: x86_64/pkg/cli/text/gawk/5.3.0/bundles/dev
- name: grep
  commit: x86_64/pkg/cli/text/grep/3.11/bundles/dev
- name: make
  commit: x86_64/pkg/core/toolchain/make/4.4.1/bundles/dev
- name: sed
  commit: x86_64/pkg/cli/text/sed/4.9/bundles/dev
- name: tar
  commit: x86_64/pkg/cli/archive/tar/1.35/bundles/dev
- name: gzip
  commit: x86_64/pkg/cli/archive/gzip/1.13/bundles/dev
- name: diffutils
  commit: x86_64/pkg/core/userland/diffutils/3.10/bundles/dev
- name: file
  commit: x86_64/pkg/dev/tools/file/5.45/bundles/dev
- name: linux-headers
  commit: x86_64/pkg/libs/system/linux-headers/6.4.1/bundles/dev

build:
  environment: 248c5014338ab55a89b9c261e303e111e6847aec
  profile: [4110:11539, 8611:16038, 17689:17236, 21818:17843, 30926:21117, 40217:21492, 44721:21586, 58140:21961, 67072:23943, 72565:27191]

  script: |
    set -eu

    tar --no-same-owner -xzf /${SOURCE_lcms2} -C "${WORK_DIR}" --strip-components=1
    cd "${WORK_DIR}"

    ./configure \
      --prefix=/usr \
      --disable-static \
      --without-zlib

    make
    make DESTDIR="${OUT_DIR}" install

    find "${OUT_DIR}" -name '*.la' -delete
    find "${OUT_DIR}" -type f -executable -exec strip --strip-unneeded {} \; 2>/dev/null || true
    find "${OUT_DIR}" -exec touch -d "2024-01-01T00:00:00+00:00" {} \;

bundles:
  dev:
  - dev
  - lib

  full:
  - bin
  - doc
  - lib

outputs:
  bin:
    files:
    - path: /usr/bin/linkicc
      needs:
      - /usr/lib/ld-linux-x86-64.so.2
      - /usr/lib/libc.so.6
      - /usr/lib/liblcms2.so.2
    - path: /usr/bin/psicc
      needs:
      - /usr/lib/ld-linux-x86-64.so.2
      - /usr/lib/libc.so.6
      - /usr/lib/liblcms2.so.2
    - path: /usr/bin/transicc
      needs:
      - /usr/lib/ld-linux-x86-64.so.2
      - /usr/lib/libc.so.6
      - /usr/lib/liblcms2.so.2
      - /usr/lib/libm.so.6

  dev:
    files:
    - path: /usr/include/lcms2.h
    - path: /usr/include/lcms2_plugin.h
    - path: /usr/lib/pkgconfig/lcms2.pc

  doc:
    files:
    - path: /usr/share/man/man1/jpgicc.1
    - path: /usr/share/man/man1/linkicc.1
    - path: /usr/share/man/man1/psicc.1
    - path: /usr/share/man/man1/tificc.1
    - path: /usr/share/man/man1/transicc.1

  lib:
    files:
    - path: /usr/lib/liblcms2.so
      needs:
      - /usr/lib/ld-linux-x86-64.so.2
      - /usr/lib/libc.so.6
      - /usr/lib/libm.so.6
    - path: /usr/lib/liblcms2.so.2
      needs:
      - /usr/lib/ld-linux-x86-64.so.2
      - /usr/lib/libc.so.6
      - /usr/lib/libm.so.6
    - path: /usr/lib/liblcms2.so.2.0.17
      needs:
      - /usr/lib/ld-linux-x86-64.so.2
      - /usr/lib/libc.so.6
      - /usr/lib/libm.so.6

resolution:
  /usr/lib/ld-linux-x86-64.so.2: glibc
  /usr/lib/libc.so.6: glibc
  /usr/lib/libm.so.6: glibc
  /usr/lib/liblcms2.so.2: self
