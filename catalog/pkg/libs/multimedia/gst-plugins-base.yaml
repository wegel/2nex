build:
  environment: 248c5014338ab55a89b9c261e303e111e6847aec
  profile: [4106:43928, 8215:56181, 12446:67995, 16597:68406, 20749:73306, 24858:77353, 29042:80867, 37305:89611, 45647:97447, 48394:100930]

  script: |
    set -eu

    tar --no-same-owner -xf /${SOURCE_gst_plugins_base} -C "${WORK_DIR}" --strip-components=1
    cd "${WORK_DIR}"

    meson setup build \
      --prefix=/usr \
      --libdir=lib \
      --buildtype=release \
      -Dintrospection=disabled \
      -Ddoc=disabled \
      -Dtests=disabled \
      -Dexamples=disabled \
      -Dnls=disabled \
      -Dorc=disabled \
      -Dtools=enabled \
      -Diso-codes=disabled \
      -Dgl=disabled \
      -Dalsa=disabled \
      -Dcdparanoia=disabled \
      -Dlibvisual=disabled \
      -Dogg=disabled \
      -Dopus=disabled \
      -Dpango=disabled \
      -Dtheora=disabled \
      -Dtremor=disabled \
      -Dvorbis=disabled \
      -Dx11=disabled \
      -Dxshm=disabled \
      -Dxvideo=disabled \
      -Dxi=disabled \
      -Dadder=disabled \
      -Dapp=disabled \
      -Daudioconvert=disabled \
      -Daudiomixer=disabled \
      -Daudiorate=disabled \
      -Daudioresample=disabled \
      -Daudiotestsrc=disabled \
      -Dcompositor=disabled \
      -Ddebugutils=disabled \
      -Ddrm=disabled \
      -Ddsd=disabled \
      -Dencoding=disabled \
      -Dgio=disabled \
      -Dgio-typefinder=disabled \
      -Doverlaycomposition=disabled \
      -Dpbtypes=disabled \
      -Dplayback=disabled \
      -Drawparse=disabled \
      -Dsubparse=disabled \
      -Dtcp=disabled \
      -Dtypefind=disabled \
      -Dvideoconvertscale=disabled \
      -Dvideorate=disabled \
      -Dvideotestsrc=disabled \
      -Dvolume=disabled

    ninja -C build
    DESTDIR="${OUT_DIR}" ninja -C build install

    find "${OUT_DIR}" -type f -executable -exec strip --strip-unneeded {} \; 2>/dev/null || true
    find "${OUT_DIR}" -name '*.a' -exec objcopy --enable-deterministic-archives {} \; 2>/dev/null || true
    find "${OUT_DIR}" -exec touch -d "2024-01-01T00:00:00+00:00" {} \;

