package:
  schema: 1
  name: woff2
  slug: woff2
  namespace: libs/text
  version: 1.0.2
  description: Web Open Font Format 2 library
  homepage: https://github.com/google/woff2
  checksum: be22e8847da28c55c67d186f4df7c9f55407cb062d60752699467030fb4ee631

sources:
- name: woff2
  url: https://github.com/google/woff2/archive/refs/tags/v1.0.2.tar.gz
  sha256: add272bb09e6384a4833ffca4896350fdb16e0ca22df68c0384773c67a175594

dependencies:
- name: glibc
  commit: x86_64/pkg/libs/system/glibc/2.39/bundles/dev
- name: gmp
  commit: x86_64/pkg/libs/system/gmp/6.3.0/bundles/dev
- name: gcc
  commit: x86_64/pkg/core/toolchain/gcc/13.2.0/bundles/dev
- name: binutils
  commit: x86_64/pkg/core/toolchain/binutils/2.42/bundles/dev
- name: bash
  commit: x86_64/pkg/cli/shells/bash/5.2.21/bundles/dev
- name: coreutils
  commit: x86_64/pkg/core/userland/coreutils/9.5/bundles/dev
- name: findutils
  commit: x86_64/pkg/core/userland/findutils/4.9.0/bundles/dev
- name: tar
  commit: x86_64/pkg/cli/archive/tar/1.35/bundles/dev
- name: gzip
  commit: x86_64/pkg/cli/archive/gzip/1.13/bundles/dev
- name: linux-headers
  commit: x86_64/pkg/libs/system/linux-headers/6.4.1/bundles/dev
- name: ncurses
  commit: x86_64/pkg/libs/system/ncurses/6.4-20230520/bundles/dev
- name: acl
  commit: x86_64/pkg/libs/system/acl/2.3.2/bundles/dev
- name: attr
  commit: x86_64/pkg/libs/system/attr/2.5.2/bundles/dev
- name: zlib
  commit: x86_64/pkg/libs/system/zlib/1.3.1/bundles/dev
- name: brotli
  commit: x86_64/pkg/libs/compression/brotli/1.1.0/bundles/dev
- name: cmake
  commit: x86_64/pkg/dev/build/cmake/3.31.10/bundles/dev
- name: libcap
  commit: x86_64/pkg/libs/security/libcap/2.69/bundles/dev
- name: ninja
  commit: x86_64/pkg/core/toolchain/ninja/1.12.1/bundles/dev
- name: pkgconf
  commit: x86_64/pkg/core/toolchain/pkgconf/2.2.0/bundles/dev
- name: curl
  commit: x86_64/pkg/cli/net/curl/8.17.0/bundles/dev
- name: libarchive
  commit: x86_64/pkg/libs/archive/libarchive/3.8.4/bundles/dev
- name: openssl3
  commit: x86_64/pkg/dev/libs/openssl3/3.3.1/bundles/dev
- name: zstd
  commit: x86_64/pkg/libs/compression/zstd/1.5.6/bundles/dev
- name: lz4
  commit: x86_64/pkg/libs/compression/lz4/1.9.4/bundles/dev
- name: bzip2
  commit: x86_64/pkg/libs/compression/bzip2/1.0.8/bundles/dev
- name: xz-lib
  commit: x86_64/pkg/libs/compression/xz/5.4.6/bundles/dev
- name: libxml2
  commit: x86_64/pkg/libs/system/libxml2/2.13.5/bundles/dev

build:
  environment: 248c5014338ab55a89b9c261e303e111e6847aec
  profile: [4117:61620, 4683:68423]

  script: |
    tar --no-same-owner -xf /${SOURCE_woff2} -C "${WORK_DIR}" --strip-components=1
    cd ${WORK_DIR}

    cmake -B build -G Ninja \
      -DCMAKE_INSTALL_PREFIX=/usr \
      -DCMAKE_BUILD_TYPE=Release \
      -DBUILD_SHARED_LIBS=ON

    ninja -C build
    DESTDIR="${OUT_DIR}" ninja -C build install

    find ${OUT_DIR} -type f -executable -exec strip --strip-unneeded {} \; 2>/dev/null || true
    find ${OUT_DIR} -name '*.a' -exec objcopy --enable-deterministic-archives {} \; 2>/dev/null || true
    find "${OUT_DIR}" -exec touch -d "2024-01-01T00:00:00+00:00" {} \;

bundles:
  dev:
  - dev
  - lib

  full:
  - dev
  - lib

outputs:
  dev:
    files:
    - path: /usr/include/woff2/decode.h
    - path: /usr/include/woff2/encode.h
    - path: /usr/include/woff2/output.h
    - path: /usr/lib/pkgconfig/libwoff2dec.pc
    - path: /usr/lib/pkgconfig/libwoff2enc.pc
    - path: /usr/lib/pkgconfig/libwoff2common.pc

  lib:
    files:
    - path: /usr/lib/libwoff2dec.so
      needs:
      - /usr/lib/libbrotlidec.so.1
      - /usr/lib/libc.so.6
      - /usr/lib/libgcc_s.so.1
      - /usr/lib/libstdc++.so.6
      - /usr/lib/libwoff2common.so.1.0.2
    - path: /usr/lib/libwoff2dec.so.1.0.2
      needs:
      - /usr/lib/libbrotlidec.so.1
      - /usr/lib/libc.so.6
      - /usr/lib/libgcc_s.so.1
      - /usr/lib/libstdc++.so.6
      - /usr/lib/libwoff2common.so.1.0.2
    - path: /usr/lib/libwoff2enc.so
      needs:
      - /usr/lib/libbrotlienc.so.1
      - /usr/lib/libc.so.6
      - /usr/lib/libgcc_s.so.1
      - /usr/lib/libstdc++.so.6
      - /usr/lib/libwoff2common.so.1.0.2
    - path: /usr/lib/libwoff2enc.so.1.0.2
      needs:
      - /usr/lib/libbrotlienc.so.1
      - /usr/lib/libc.so.6
      - /usr/lib/libgcc_s.so.1
      - /usr/lib/libstdc++.so.6
      - /usr/lib/libwoff2common.so.1.0.2
    - path: /usr/lib/libwoff2common.so
      needs:
      - /usr/lib/libc.so.6
      - /usr/lib/libgcc_s.so.1
      - /usr/lib/libstdc++.so.6
    - path: /usr/lib/libwoff2common.so.1.0.2
      needs:
      - /usr/lib/libc.so.6
      - /usr/lib/libgcc_s.so.1
      - /usr/lib/libstdc++.so.6

resolution:
  /usr/lib/libbrotlidec.so.1: brotli
  /usr/lib/libbrotlienc.so.1: brotli
  /usr/lib/libgcc_s.so.1: gcc
  /usr/lib/libstdc++.so.6: gcc
  /usr/lib/libc.so.6: glibc
  /usr/lib/libwoff2common.so.1.0.2: self
