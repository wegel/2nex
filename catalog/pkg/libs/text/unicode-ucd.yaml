package:
  schema: 1
  name: unicode-ucd
  slug: unicode-ucd
  namespace: libs/text
  version: 15.1.0
  description: Unicode Character Database data files
  homepage: https://www.unicode.org/ucd/
  checksum: 84d9671b92be668fc31335372a17a5fa7d8a15f86272057e2130bc8b4bb2005a

sources:
- name: ucd
  url: https://www.unicode.org/Public/15.1.0/ucd/UCD.zip
  sha256: cb1c663d053926500cd501229736045752713a066bd75802098598b7a7056177

dependencies:
- name: glibc
  commit: x86_64/pkg/libs/system/glibc/2.39/bundles/dev
- name: gmp
  commit: x86_64/pkg/libs/system/gmp/6.3.0/bundles/dev
- name: libcap
  commit: x86_64/pkg/libs/security/libcap/2.69/bundles/dev
- name: bash
  commit: x86_64/pkg/cli/shells/bash/5.2.21/bundles/dev
- name: ncurses
  commit: x86_64/pkg/libs/system/ncurses/6.4-20230520/bundles/dev
- name: acl
  commit: x86_64/pkg/libs/system/acl/2.3.2/bundles/dev
- name: attr
  commit: x86_64/pkg/libs/system/attr/2.5.2/bundles/dev
- name: tar
  commit: x86_64/pkg/cli/archive/tar/1.35/bundles/dev
- name: gzip
  commit: x86_64/pkg/cli/archive/gzip/1.13/bundles/dev
- name: xz
  commit: x86_64/pkg/libs/compression/xz/5.4.6/bundles/dev
- name: bzip2
  commit: x86_64/pkg/libs/compression/bzip2/1.0.8/bundles/dev
- name: coreutils
  commit: x86_64/pkg/core/userland/coreutils/9.5/bundles/dev
- name: findutils
  commit: x86_64/pkg/core/userland/findutils/4.9.0/bundles/dev
- name: unzip
  commit: x86_64/pkg/cli/archive/unzip/6.0/bundles/dev

build:
  environment: 248c5014338ab55a89b9c261e303e111e6847aec
  profile: [32:108]

  script: |
    mkdir -p "${OUT_DIR}/usr/share/unicode/ucd"
    unzip -q /${SOURCE0} -d "${OUT_DIR}/usr/share/unicode/ucd"

    find "${OUT_DIR}" -exec touch -d "2024-01-01T00:00:00+00:00" {} \;

bundles:
  dev:
  - misc

  full:
  - misc

