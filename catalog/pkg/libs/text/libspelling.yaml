build:
  environment: 248c5014338ab55a89b9c261e303e111e6847aec
  profile: [4117:1769, 8287:5899, 8467:6273]

  script: |
    tar --no-same-owner -xf /${SOURCE_libspelling} -C "${WORK_DIR}" --strip-components=1
    cd ${WORK_DIR}

    mkdir -p /usr/local/include

    meson setup build \
      --prefix=/usr \
      --libdir=lib \
      --buildtype=release \
      -Ddocs=false \
      -Dintrospection=disabled \
      -Dvapi=false \
      -Dsysprof=false

    ninja -C build
    DESTDIR="${OUT_DIR}" ninja -C build install

    find ${OUT_DIR} -type f -executable -exec strip --strip-unneeded {} \; 2>/dev/null || true
    find ${OUT_DIR} -name '*.a' -exec objcopy --enable-deterministic-archives {} \; 2>/dev/null || true
    find "${OUT_DIR}" -exec touch -d "2024-01-01T00:00:00+00:00" {} \;

bundles:
  dev:
  - dev
  - lib

outputs:
  dev:
    files:
    - path: /usr/include/libspelling-1/libspelling.h
