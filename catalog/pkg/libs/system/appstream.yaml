build:
  environment: 248c5014338ab55a89b9c261e303e111e6847aec
  profile: [4130:595, 8273:970, 12422:1421, 16595:6486, 20700:6486, 24813:6493, 28913:6493, 29608:6746]

  script: |
    tar --no-same-owner -xf /${SOURCE_appstream} -C "${WORK_DIR}" --strip-components=2
    cd ${WORK_DIR}
    patch --batch --fuzz=0 -Np1 -i "/${SOURCE_uapi_config_patch}"

    # create /usr/local/include to satisfy -Werror=missing-include-dirs
    mkdir -p /usr/local/include

    meson setup build \
      --prefix=/usr \
      --libdir=lib \
      --buildtype=release \
      -Dgir=false \
      -Ddocs=false \
      -Dstemming=false \
      -Dsystemd=false \
      -Dsvg-support=false \
      -Dcompose=false \
      -Dapidocs=false \
      -Dman=false

    LD_LIBRARY_PATH="${WORK_DIR}/build/src" ninja -C build
    LD_LIBRARY_PATH="${WORK_DIR}/build/src" DESTDIR="${OUT_DIR}" ninja -C build install

    # Exercise the newly built, installed libappstream through the real
    # as_context_ensure_os_config_loaded() reader instead of reimplementing
    # its tier-selection rules; see the check script for detail.
    sh "/${SOURCE_uapi_check}" \
      "${OUT_DIR}" \
      "${WORK_DIR}" \
      "/${SOURCE_uapi_smoke}"

    find ${OUT_DIR} -type f -executable -exec strip --strip-unneeded {} \; 2>/dev/null || true
    find ${OUT_DIR} -name '*.a' -exec objcopy --enable-deterministic-archives {} \; 2>/dev/null || true
    find "${OUT_DIR}" -exec touch -d "2024-01-01T00:00:00+00:00" {} \;

