package:
  schema: 1
  name: Libxcrypt
  slug: libxcrypt
  namespace: libs/system
  version: 4.4.36
  description: Extended cryptographic library
  homepage: https://github.com/besser82/libxcrypt
  checksum: fb8aeceaca02ca0bc650a4ef9b51fa44864cc80c98fadf0fac7d0246197c6aaf
  seed: true

sources:
- name: libxcrypt
  url: https://github.com/besser82/libxcrypt/releases/download/v4.4.36/libxcrypt-4.4.36.tar.xz
  sha256: e5e1f4caee0a01de2aee26e3138807d6d3ca2b8e67287966d1fefd65e1fd8943

dependencies:
- name: linux-headers
  commit: x86_64/pkg/bootstrap/phase3/linux-headers/6.4.1/bundles/dev
- name: glibc
  commit: x86_64/pkg/libs/system/glibc/2.39/bundles/dev
- name: binutils
  commit: x86_64/pkg/bootstrap/phase3/binutils/2.42/bundles/dev
- name: gcc
  commit: x86_64/pkg/bootstrap/phase3/gcc/13.2.0/bundles/dev
- name: zlib
  commit: x86_64/pkg/bootstrap/phase3/zlib/1.3.1/bundles/dev
- name: perl
  commit: x86_64/pkg/dev/lang/perl/5.38.2/bundles/dev
- name: bash
  commit: x86_64/pkg/bootstrap/phase3/bash/5.2.21/bundles/dev
- name: coreutils
  commit: x86_64/pkg/bootstrap/phase3/coreutils/9.5/bundles/dev
- name: findutils
  commit: x86_64/pkg/bootstrap/phase3/findutils/4.9.0/bundles/dev
- name: gawk
  commit: x86_64/pkg/bootstrap/phase3/gawk/5.3.0/bundles/dev
- name: grep
  commit: x86_64/pkg/bootstrap/phase3/grep/3.11/bundles/dev
- name: make
  commit: x86_64/pkg/bootstrap/phase3/make/4.4.1/bundles/dev
- name: sed
  commit: x86_64/pkg/bootstrap/phase3/sed/4.9/bundles/dev
- name: tar
  commit: x86_64/pkg/bootstrap/phase3/tar/1.35/bundles/dev
- name: xz
  commit: x86_64/pkg/bootstrap/phase3/xz/5.4.6/bundles/dev

build:
  environment: 248c5014338ab55a89b9c261e303e111e6847aec
  profile: [4155:832, 13160:2226, 22415:2232, 36485:2240, 45582:2268, 54485:2274, 67649:2308, 80891:2332, 97992:2399, 107096:3343]

  script: |
    tar --no-same-owner -xf ${SOURCE_libxcrypt} -C "${WORK_DIR}" --strip-components=1
    cd ${WORK_DIR}

    ./configure --prefix=/usr                \
              --enable-hashes=strong,glibc \
              --enable-obsolete-api=no     \
              --disable-failure-tokens
           
    make
    make DESTDIR="${OUT_DIR}" install

    find ${OUT_DIR} -type f -executable -exec strip --strip-unneeded {} \; 2>/dev/null || true
    find ${OUT_DIR} -name '*.a' -exec objcopy --enable-deterministic-archives {} \; 2>/dev/null || true
    find "${OUT_DIR}" -exec touch -d '2024-01-01T00:00:00+00:00' {} \;

bundles:
  dev:
  - dev
  - lib
  - static

  full:
  - dev
  - lib
  - man
  - static

outputs:
  dev:
    files:
    - path: /usr/include/crypt.h
    - path: /usr/lib/libcrypt.la
    - path: /usr/lib/pkgconfig/libcrypt.pc
    - path: /usr/lib/pkgconfig/libxcrypt.pc

  lib:
    files:
    - path: /usr/lib/libcrypt.so
      needs:
      - /usr/lib/libc.so.6
    - path: /usr/lib/libcrypt.so.2
      needs:
      - /usr/lib/libc.so.6
    - path: /usr/lib/libcrypt.so.2.0.0
      needs:
      - /usr/lib/libc.so.6

  man:
    files:
    - path: /usr/share/man/man3/crypt.3
    - path: /usr/share/man/man3/crypt_checksalt.3
    - path: /usr/share/man/man3/crypt_gensalt.3
    - path: /usr/share/man/man3/crypt_gensalt_ra.3
    - path: /usr/share/man/man3/crypt_gensalt_rn.3
    - path: /usr/share/man/man3/crypt_preferred_method.3
    - path: /usr/share/man/man3/crypt_r.3
    - path: /usr/share/man/man3/crypt_ra.3
    - path: /usr/share/man/man3/crypt_rn.3
    - path: /usr/share/man/man5/crypt.5

  static:
    files:
    - path: /usr/lib/libcrypt.a

resolution:
  /usr/lib/libc.so.6: glibc
