  commit: x86_64/pkg/cli/text/gawk/5.3.0/bundles/dev

build:
  environment: 248c5014338ab55a89b9c261e303e111e6847aec
  profile: [4106:2405, 8260:3682, 12436:3686, 16668:3694, 20904:3734, 25044:3745, 29260:3769, 33764:3868, 37910:4646, 38457:4732]

  script: |
    tar --no-same-owner -xf ${SOURCE_readline} -C "${WORK_DIR}" --strip-components=1
    cd ${WORK_DIR}

    sed -i "/MV.*old/d" Makefile.in
    sed -i "/{OLDSUFF}/c:" support/shlib-install
    patch --batch --fuzz=0 -Np1 -i /${SOURCE1}
    patch --batch --fuzz=0 -Np1 -i /${SOURCE_uapi_config}
    ./configure --prefix=/usr    \
              --docdir=/usr/share/doc/readline-8.2
    make SHLIB_LIBS="-lncurses"
    make SHLIB_LIBS="-lncurses" DESTDIR="${OUT_DIR}" install

    smoke_root="${WORK_DIR}/uapi-smoke-root"
    mkdir -p \
      "${smoke_root}/etc" \
      "${smoke_root}/run" \
      "${smoke_root}/usr/lib" \
      "${smoke_root}/lib64" \
      "${smoke_root}/home/test"
    gcc "/${SOURCE_uapi_smoke}" \
      -I"${OUT_DIR}/usr/include" \
      -L"${OUT_DIR}/usr/lib" \
      -Wl,-rpath,/usr/lib \
      -lreadline \
      -lncursesw \
      -o "${smoke_root}/readline-uapi-smoke"
    cp -L "${OUT_DIR}/usr/lib/libreadline.so.8" \
      "${smoke_root}/usr/lib/libreadline.so.8"
    cp -L /usr/lib/libncursesw.so.6 \
      "${smoke_root}/usr/lib/libncursesw.so.6"
    cp -L /usr/lib/libc.so.6 "${smoke_root}/usr/lib/libc.so.6"
    cp -L /usr/lib/ld-linux-x86-64.so.2 \
      "${smoke_root}/usr/lib/ld-linux-x86-64.so.2"
    cp -L /usr/lib/ld-linux-x86-64.so.2 \
      "${smoke_root}/lib64/ld-linux-x86-64.so.2"

    assert_setting() {
      expected=$1
      shift
      actual=$(HOME=/home/test chroot "${smoke_root}" \
        /readline-uapi-smoke "$@")
      test "${actual}" = "${expected}"
    }

    printf '%s\n' 'set completion-ignore-case on' \
      > "${smoke_root}/usr/lib/inputrc"
    assert_setting on
    printf '%s\n' 'set completion-ignore-case off' \
      > "${smoke_root}/run/inputrc"
    assert_setting off
    printf '%s\n' 'set completion-ignore-case on' \
      > "${smoke_root}/etc/inputrc"
    assert_setting on

    rm "${smoke_root}/run/inputrc"
    : > "${smoke_root}/etc/inputrc"
    assert_setting off

    rm "${smoke_root}/etc/inputrc"
    printf '%s\n' 'set completion-ignore-case off' \
      > "${smoke_root}/usr/lib/inputrc"
    printf '%s\n' 'set completion-ignore-case on' \
      > "${smoke_root}/home/test/.inputrc"
    assert_setting on
    printf '%s\n' 'set completion-ignore-case off' \
      > "${smoke_root}/explicit-inputrc"
    assert_setting off /explicit-inputrc

    find ${OUT_DIR} -type f -executable -exec strip --strip-unneeded {} \; 2>/dev/null || true
    find ${OUT_DIR} -name '*.a' -exec objcopy --enable-deterministic-archives {} \; 2>/dev/null || true
    find "${OUT_DIR}" -exec touch -d "2024-01-01T00:00:00+00:00" {} \;

