package:
  schema: 1
  name: pciutils
  slug: pciutils
  namespace: libs/system
  version: 3.14.0
  description: PCI utilities and library
  homepage: https://mj.ucw.cz/sw/pciutils/
  checksum: 1c38be23dd3c9b7c1e0627eec6905e10f70c74d3953667641542b744df7d8d96

sources:
- name: pciutils
  url: https://mj.ucw.cz/download/linux/pci/pciutils-3.14.0.tar.gz
  sha256: e31c79722dbbe9d2906b92996ce295268e54d4342fefe3ff476caa613e51be2a

dependencies:
- name: glibc
  commit: x86_64/pkg/libs/system/glibc/2.39/bundles/dev
- name: gmp
  commit: x86_64/pkg/libs/system/gmp/6.3.0/bundles/dev
- name: gcc
  commit: x86_64/pkg/core/toolchain/gcc/13.2.0/bundles/dev
- name: binutils
  commit: x86_64/pkg/core/toolchain/binutils/2.42/bundles/dev
- name: bash
  commit: x86_64/pkg/cli/shells/bash/5.2.21/bundles/dev
- name: ncurses
  commit: x86_64/pkg/libs/system/ncurses/6.4-20230520/bundles/dev
- name: acl
  commit: x86_64/pkg/libs/system/acl/2.3.2/bundles/dev
- name: attr
  commit: x86_64/pkg/libs/system/attr/2.5.2/bundles/dev
- name: tar
  commit: x86_64/pkg/cli/archive/tar/1.35/bundles/dev
- name: gzip
  commit: x86_64/pkg/cli/archive/gzip/1.13/bundles/dev
- name: zlib
  commit: x86_64/pkg/libs/system/zlib/1.3.1/bundles/dev
- name: coreutils
  commit: x86_64/pkg/core/userland/coreutils/9.5/bundles/dev
- name: findutils
  commit: x86_64/pkg/core/userland/findutils/4.9.0/bundles/dev
- name: linux-headers
  commit: x86_64/pkg/libs/system/linux-headers/6.4.1/bundles/dev
- name: make
  commit: x86_64/pkg/core/toolchain/make/4.4.1/bundles/dev
- name: sed
  commit: x86_64/pkg/cli/text/sed/4.9/bundles/dev
- name: hwdata
  commit: x86_64/pkg/libs/graphics/hwdata/0.402/bundles/dev

build:
  environment: 248c5014338ab55a89b9c261e303e111e6847aec
  profile: [4426:53, 8556:112, 11201:520]

  script: |
    tar --no-same-owner -xf /${SOURCE0} -C "${WORK_DIR}" --strip-components=1
    cd ${WORK_DIR}

    make CC=gcc \
         PREFIX=/usr \
         SBINDIR=/usr/bin \
         LIBDIR=/usr/lib \
         SHAREDIR=/usr/share/hwdata \
         SHARED=yes \
         ZLIB=yes

    make CC=gcc \
         PREFIX=/usr \
         SBINDIR=/usr/bin \
         LIBDIR=/usr/lib \
         SHAREDIR=/usr/share/hwdata \
         SHARED=yes \
         DESTDIR="${OUT_DIR}" \
         install install-lib

    find ${OUT_DIR} -type f -executable -exec strip --strip-unneeded {} \; 2>/dev/null || true
    find ${OUT_DIR} -name '*.a' -exec objcopy --enable-deterministic-archives {} \; 2>/dev/null || true
    find "${OUT_DIR}" -exec touch -d "2024-01-01T00:00:00+00:00" {} \;

bundles:
  dev:
  - bin
  - dev
  - lib

  full:
  - bin
  - dev
  - lib
  - misc

outputs:
  bin:
    files:
    - path: /usr/bin/lspci
      needs:
      - /usr/lib/ld-linux-x86-64.so.2
      - /usr/lib/libc.so.6
      - /usr/lib/libpci.so.3

  dev:
    files:
    - path: /usr/include/pci/config.h
    - path: /usr/include/pci/header.h
    - path: /usr/include/pci/pci.h
    - path: /usr/include/pci/types.h
    - path: /usr/lib/pkgconfig/libpci.pc

  lib:
    files:
    - path: /usr/lib/libpci.so
      needs:
      - /usr/lib/libc.so.6
      - /usr/lib/libz.so.1
    - path: /usr/lib/libpci.so.3
      needs:
      - /usr/lib/libc.so.6
      - /usr/lib/libz.so.1
    - path: /usr/lib/libpci.so.3.14.0
      needs:
      - /usr/lib/libc.so.6
      - /usr/lib/libz.so.1

  misc:
    files:
    - path: /usr/bin/pcilmr
      needs:
      - /usr/lib/ld-linux-x86-64.so.2
      - /usr/lib/libc.so.6
      - /usr/lib/libpci.so.3
    - path: /usr/bin/setpci
      needs:
      - /usr/lib/ld-linux-x86-64.so.2
      - /usr/lib/libc.so.6
      - /usr/lib/libpci.so.3
    - path: /usr/bin/update-pciids
    - path: /usr/man/man5/pci.ids.5
    - path: /usr/man/man7/pcilib.7
    - path: /usr/man/man8/lspci.8
    - path: /usr/man/man8/pcilmr.8
    - path: /usr/man/man8/setpci.8
    - path: /usr/man/man8/update-pciids.8
    - path: /usr/share/hwdata/pci.ids.gz

resolution:
  /usr/lib/ld-linux-x86-64.so.2: glibc
  /usr/lib/libc.so.6: glibc
  /usr/lib/libpci.so.3: self
  /usr/lib/libz.so.1: zlib
