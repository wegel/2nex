  name: userspace-rcu
  slug: userspace-rcu
  namespace: libs/system
  version: 0.15.6
  description: Read-copy-update synchronization library for userspace programs
  homepage: https://liburcu.org/
  checksum: 61860df6565f95c400563b8f6b3729496e5bd44fab396f605ff73a2fef9b6671

