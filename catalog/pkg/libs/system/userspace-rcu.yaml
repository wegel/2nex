build:
  environment: 248c5014338ab55a89b9c261e303e111e6847aec
  profile: [4113:10452, 8246:15215, 12356:20866, 20569:31310, 24685:34418, 28815:37517, 37117:41120, 45514:44879, 53783:48615, 55540:49290]

  script: |
    set -eu

    tar --no-same-owner -xf "/./${SOURCE_userspace_rcu}" -C "${WORK_DIR}" --strip-components=1
    cd "${WORK_DIR}"

    ./configure \
      --prefix=/usr \
      --libdir=/usr/lib \
      --disable-static

    make
    make DESTDIR="${OUT_DIR}" install

    find "${OUT_DIR}" -name '*.la' -delete
    find "${OUT_DIR}" -type f -executable -exec strip --strip-unneeded {} \; 2>/dev/null || true
    find "${OUT_DIR}" -exec touch -d "2024-01-01T00:00:00+00:00" {} \;

bundles:
  dev:
  - dev
  - lib

  full:
  - dev
  - doc
  - lib

