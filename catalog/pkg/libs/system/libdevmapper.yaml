package:
  schema: 1
  name: Device Mapper Library
  slug: libdevmapper
  namespace: libs/system
  version: 1.02.213
  description: Library and commands for configuring Linux device-mapper targets
  homepage: https://sourceware.org/lvm2/
  checksum: af58b78df0201a9521e6b1c94ffa4a7b084e8308b55e0ee08410a5a6af97f0e3

sources:
- name: lvm2
  url: https://sourceware.org/pub/lvm2/LVM2.2.03.39.tgz
  sha256: 23bc9067e28fe0d37b3cc441f2865b9e022ce3c624babe22918b8dd90c031ee8

dependencies:
- name: bash
  commit: x86_64/pkg/cli/shells/bash/5.2.21/bundles/dev
- name: binutils
  commit: x86_64/pkg/core/toolchain/binutils/2.42/bundles/dev
- name: coreutils
  commit: x86_64/pkg/core/userland/coreutils/9.5/bundles/dev
- name: diffutils
  commit: x86_64/pkg/core/userland/diffutils/3.10/bundles/dev
- name: file
  commit: x86_64/pkg/dev/tools/file/5.45/bundles/dev
- name: findutils
  commit: x86_64/pkg/core/userland/findutils/4.9.0/bundles/dev
- name: gawk
  commit: x86_64/pkg/cli/text/gawk/5.3.0/bundles/dev
- name: gcc
  commit: x86_64/pkg/core/toolchain/gcc/13.2.0/bundles/dev
- name: glibc
  commit: x86_64/pkg/libs/system/glibc/2.39/bundles/dev
- name: grep
  commit: x86_64/pkg/cli/text/grep/3.11/bundles/dev
- name: gzip
  commit: x86_64/pkg/cli/archive/gzip/1.13/bundles/dev
- name: linux-headers
  commit: x86_64/pkg/libs/system/linux-headers/6.4.1/bundles/dev
- name: make
  commit: x86_64/pkg/core/toolchain/make/4.4.1/bundles/dev
- name: pkgconf
  commit: x86_64/pkg/core/toolchain/pkgconf/2.2.0/bundles/dev
- name: readline
  commit: x86_64/pkg/libs/system/readline/8.2/bundles/dev
- name: sed
  commit: x86_64/pkg/cli/text/sed/4.9/bundles/dev
- name: systemd
  commit: x86_64/pkg/core/init/systemd/257.5/bundles/dev
- name: tar
  commit: x86_64/pkg/cli/archive/tar/1.35/bundles/dev

build:
  environment: 248c5014338ab55a89b9c261e303e111e6847aec
  profile: [4110:2326, 8249:4985, 12346:6098, 16317:8369]

  script: |
    set -eu
    tar --no-same-owner -xf "${SOURCE_lvm2}" -C "${WORK_DIR}" --strip-components=1
    cd "${WORK_DIR}"

    export PKG_CONFIG_PATH=/usr/lib/pkgconfig:/usr/share/pkgconfig
    MODPROBE_CMD=/usr/bin/modprobe ./configure \
      --prefix=/usr \
      --sbindir=/usr/bin \
      --libdir=/usr/lib \
      --with-usrlibdir=/usr/lib \
      --with-udevdir=/usr/lib/udev/rules.d \
      --enable-o_direct \
      --enable-realtime \
      --enable-cmdlib \
      --enable-pkgconfig \
      --enable-udev_sync \
      --enable-udev_rules \
      --with-thin=none
    make -C libdm
    make DESTDIR="${OUT_DIR}" -C libdm install
    make DESTDIR="${OUT_DIR}" -C udev install_device-mapper

    find "${OUT_DIR}" -type f -executable -exec strip --strip-unneeded {} \; 2>/dev/null || true
    find "${OUT_DIR}" -name '*.a' -exec ranlib -D {} \; 2>/dev/null || true
    find "${OUT_DIR}" -exec touch -h -d '2024-01-01T00:00:00+00:00' {} \;

bundles:
  dev:
  - bin
  - dev
  - lib

  full:
  - bin
  - lib

outputs:
  bin:
    files:
    - path: /usr/bin/dmsetup
      needs:
      - /usr/lib/ld-linux-x86-64.so.2
      - /usr/lib/libc.so.6
      - /usr/lib/libdevmapper.so.1.02
    - path: /usr/bin/dmstats
      needs:
      - /usr/lib/ld-linux-x86-64.so.2
      - /usr/lib/libc.so.6
      - /usr/lib/libdevmapper.so.1.02

  dev:
    files:
    - path: /usr/include/libdevmapper.h
    - path: /usr/lib/pkgconfig/devmapper.pc

  lib:
    files:
    - path: /usr/lib/libdevmapper.so
      needs:
      - /usr/lib/libc.so.6
      - /usr/lib/libm.so.6
      - /usr/lib/libudev.so.1
    - path: /usr/lib/libdevmapper.so.1.02
      needs:
      - /usr/lib/libc.so.6
      - /usr/lib/libm.so.6
      - /usr/lib/libudev.so.1
    - path: /usr/lib/udev/rules.d/10-dm.rules
    - path: /usr/lib/udev/rules.d/13-dm-disk.rules
    - path: /usr/lib/udev/rules.d/95-dm-notify.rules

resolution:
  /usr/lib/ld-linux-x86-64.so.2: glibc
  /usr/lib/libc.so.6: glibc
  /usr/lib/libm.so.6: glibc
  /usr/lib/libdevmapper.so.1.02: self
  /usr/lib/libudev.so.1: systemd
