package:
  schema: 1
  name: json-glib
  slug: json-glib
  namespace: libs/system
  version: 1.10.6
  description: JSON library for GLib
  homepage: https://gitlab.gnome.org/GNOME/json-glib
  checksum: e0df1cd5bc9ed7f82cf4089c95cabdfc36324e8e6eb2f25b69ed8108c275cbe6

sources:
- name: json-glib
  url: https://download.gnome.org/sources/json-glib/1.10/json-glib-1.10.6.tar.xz
  sha256: 77f4bcbf9339528f166b8073458693f0a20b77b7059dbc2db61746a1928b0293

dependencies:
- name: glibc
  commit: x86_64/pkg/libs/system/glibc/2.39/bundles/dev
- name: gmp
  commit: x86_64/pkg/libs/system/gmp/6.3.0/bundles/dev
- name: libcap
  commit: x86_64/pkg/libs/security/libcap/2.69/bundles/dev
- name: gcc
  commit: x86_64/pkg/core/toolchain/gcc/13.2.0/bundles/dev
- name: binutils
  commit: x86_64/pkg/core/toolchain/binutils/2.42/bundles/dev
- name: bash
  commit: x86_64/pkg/cli/shells/bash/5.2.21/bundles/dev
- name: ncurses
  commit: x86_64/pkg/libs/system/ncurses/6.4-20230520/bundles/dev
- name: acl
  commit: x86_64/pkg/libs/system/acl/2.3.2/bundles/dev
- name: attr
  commit: x86_64/pkg/libs/system/attr/2.5.2/bundles/dev
- name: tar
  commit: x86_64/pkg/cli/archive/tar/1.35/bundles/dev
- name: xz
  commit: x86_64/pkg/libs/compression/xz/5.4.6/bundles/dev
- name: zlib
  commit: x86_64/pkg/libs/system/zlib/1.3.1/bundles/dev
- name: coreutils
  commit: x86_64/pkg/core/userland/coreutils/9.5/bundles/dev
- name: findutils
  commit: x86_64/pkg/core/userland/findutils/4.9.0/bundles/dev
- name: linux-headers
  commit: x86_64/pkg/libs/system/linux-headers/6.4.1/bundles/dev
- name: gawk
  commit: x86_64/pkg/cli/text/gawk/5.3.0/bundles/dev
- name: sed
  commit: x86_64/pkg/cli/text/sed/4.9/bundles/dev
- name: grep
  commit: x86_64/pkg/cli/text/grep/3.11/bundles/dev
- name: meson
  commit: x86_64/pkg/core/toolchain/meson/1.6.1/bundles/dev
- name: ninja
  commit: x86_64/pkg/core/toolchain/ninja/1.12.1/bundles/dev
- name: python3
  commit: x86_64/pkg/dev/lang/python3/3.12.2/bundles/dev
- name: pkgconf
  commit: x86_64/pkg/core/toolchain/pkgconf/2.2.0/bundles/dev
- name: glib2
  commit: x86_64/pkg/dev/libs/glib2/2.84.0/bundles/dev
- name: libffi
  commit: x86_64/pkg/libs/system/libffi/3.4.6/bundles/dev
- name: pcre2
  commit: x86_64/pkg/dev/libs/pcre2/10.44/bundles/dev
- name: util-linux
  commit: x86_64/pkg/core/userland/util_linux/2.40/bundles/dev

build:
  environment: 248c5014338ab55a89b9c261e303e111e6847aec
  profile: [4131:37735, 8037:51915]

  script: |
    tar --no-same-owner -xf /${SOURCE_json_glib} -C "${WORK_DIR}" --strip-components=1
    cd ${WORK_DIR}

    meson setup build \
      --prefix=/usr \
      --libdir=lib \
      --buildtype=release \
      -Dintrospection=disabled \
      -Dgtk_doc=disabled \
      -Dtests=false \
      -Dman=false

    ninja -C build
    DESTDIR="${OUT_DIR}" ninja -C build install

    find ${OUT_DIR} -type f -executable -exec strip --strip-unneeded {} \; 2>/dev/null || true
    find ${OUT_DIR} -name '*.a' -exec objcopy --enable-deterministic-archives {} \; 2>/dev/null || true
    find "${OUT_DIR}" -exec touch -d "2024-01-01T00:00:00+00:00" {} \;

bundles:
  dev:
  - dev
  - lib

outputs:
  bin:
    files:
    - path: /usr/bin/json-glib-format
      needs:
      - /usr/lib/ld-linux-x86-64.so.2
      - /usr/lib/libc.so.6
      - /usr/lib/libgio-2.0.so.0
      - /usr/lib/libglib-2.0.so.0
      - /usr/lib/libgobject-2.0.so.0
      - /usr/lib/libjson-glib-1.0.so.0
    - path: /usr/bin/json-glib-validate
      needs:
      - /usr/lib/ld-linux-x86-64.so.2
      - /usr/lib/libc.so.6
      - /usr/lib/libgio-2.0.so.0
      - /usr/lib/libglib-2.0.so.0
      - /usr/lib/libgobject-2.0.so.0
      - /usr/lib/libjson-glib-1.0.so.0

  dev:
    files:
    - path: /usr/include/json-glib-1.0/json-glib/json-builder.h
    - path: /usr/include/json-glib-1.0/json-glib/json-enum-types.h
    - path: /usr/include/json-glib-1.0/json-glib/json-generator.h
    - path: /usr/include/json-glib-1.0/json-glib/json-glib.h
    - path: /usr/include/json-glib-1.0/json-glib/json-gobject.h
    - path: /usr/include/json-glib-1.0/json-glib/json-gvariant.h
    - path: /usr/include/json-glib-1.0/json-glib/json-parser.h
    - path: /usr/include/json-glib-1.0/json-glib/json-path.h
    - path: /usr/include/json-glib-1.0/json-glib/json-reader.h
    - path: /usr/include/json-glib-1.0/json-glib/json-types.h
    - path: /usr/include/json-glib-1.0/json-glib/json-utils.h
    - path: /usr/include/json-glib-1.0/json-glib/json-version-macros.h
    - path: /usr/include/json-glib-1.0/json-glib/json-version.h
    - path: /usr/lib/pkgconfig/json-glib-1.0.pc

  lib:
    files:
    - path: /usr/lib/libjson-glib-1.0.so
      needs:
      - /usr/lib/libc.so.6
      - /usr/lib/libgio-2.0.so.0
      - /usr/lib/libglib-2.0.so.0
      - /usr/lib/libgobject-2.0.so.0
    - path: /usr/lib/libjson-glib-1.0.so.0
      needs:
      - /usr/lib/libc.so.6
      - /usr/lib/libgio-2.0.so.0
      - /usr/lib/libglib-2.0.so.0
      - /usr/lib/libgobject-2.0.so.0
    - path: /usr/lib/libjson-glib-1.0.so.0.1000.6
      needs:
      - /usr/lib/libc.so.6
      - /usr/lib/libgio-2.0.so.0
      - /usr/lib/libglib-2.0.so.0
      - /usr/lib/libgobject-2.0.so.0

resolution:
  /usr/lib/libgio-2.0.so.0: glib2
  /usr/lib/libglib-2.0.so.0: glib2
  /usr/lib/libgobject-2.0.so.0: glib2
  /usr/lib/ld-linux-x86-64.so.2: glibc
  /usr/lib/libc.so.6: glibc
  /usr/lib/libjson-glib-1.0.so.0: self
