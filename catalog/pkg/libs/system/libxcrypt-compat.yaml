package:
  schema: 1
  name: Libxcrypt compat
  slug: libxcrypt-compat
  namespace: libs/system
  version: 4.4.36
  description: Legacy libcrypt.so.1 compatibility library
  homepage: https://github.com/besser82/libxcrypt
  checksum: d752801bf76bb5dcd0b9b1b06e9831359d8448b8709647edc1be78ea4588ca92

sources:
- name: libxcrypt
  url: https://github.com/besser82/libxcrypt/releases/download/v4.4.36/libxcrypt-4.4.36.tar.xz
  sha256: e5e1f4caee0a01de2aee26e3138807d6d3ca2b8e67287966d1fefd65e1fd8943

dependencies:
- name: linux-headers
  commit: x86_64/pkg/libs/system/linux-headers/6.4.1/bundles/dev
- name: glibc
  commit: x86_64/pkg/libs/system/glibc/2.39/bundles/dev
- name: binutils
  commit: x86_64/pkg/core/toolchain/binutils/2.42/bundles/dev
- name: gcc
  commit: x86_64/pkg/core/toolchain/gcc/13.2.0/bundles/dev
- name: zlib
  commit: x86_64/pkg/libs/system/zlib/1.3.1/bundles/dev
- name: perl
  commit: x86_64/pkg/dev/lang/perl/5.38.2/bundles/dev
- name: bash
  commit: x86_64/pkg/cli/shells/bash/5.2.21/bundles/dev
- name: coreutils
  commit: x86_64/pkg/core/userland/coreutils/9.5/bundles/dev
- name: findutils
  commit: x86_64/pkg/core/userland/findutils/4.9.0/bundles/dev
- name: gawk
  commit: x86_64/pkg/cli/text/gawk/5.3.0/bundles/dev
- name: grep
  commit: x86_64/pkg/cli/text/grep/3.11/bundles/dev
- name: make
  commit: x86_64/pkg/core/toolchain/make/4.4.1/bundles/dev
- name: sed
  commit: x86_64/pkg/cli/text/sed/4.9/bundles/dev
- name: tar
  commit: x86_64/pkg/cli/archive/tar/1.35/bundles/dev
- name: xz
  commit: x86_64/pkg/libs/compression/xz/5.4.6/bundles/dev

build:
  environment: 248c5014338ab55a89b9c261e303e111e6847aec
  profile: [4104:1197, 8222:2794, 16958:2984, 26258:2986, 35493:2988, 40266:3031, 49125:3034, 62192:3037, 75781:3151, 79439:4010]

  script: |
    tar --no-same-owner -xf ${SOURCE_libxcrypt} -C "${WORK_DIR}" --strip-components=1
    cd "${WORK_DIR}"

    ./configure --prefix=/usr                \
              --enable-hashes=strong,glibc \
              --enable-obsolete-api=glibc  \
              --disable-failure-tokens     \
              --disable-static             \
              --disable-werror

    make
    make DESTDIR="${OUT_DIR}" install

    rm -rf "${OUT_DIR}/usr/include"
    rm -f "${OUT_DIR}/usr/lib/libcrypt.la"
    rm -f "${OUT_DIR}/usr/lib/libcrypt.so"
    rm -f "${OUT_DIR}/usr/lib/libxcrypt.so"
    rm -rf "${OUT_DIR}/usr/lib/pkgconfig"
    rm -rf "${OUT_DIR}/usr/share/man"

    find "${OUT_DIR}" -type f -executable -exec strip --strip-unneeded {} \; 2>/dev/null || true
    find "${OUT_DIR}" -name '*.a' -exec objcopy --enable-deterministic-archives {} \; 2>/dev/null || true
    find "${OUT_DIR}" -exec touch -d '2024-01-01T00:00:00+00:00' {} \;

bundles:
  lib:
  - lib

outputs:
  lib:
    files:
    - path: /usr/lib/libcrypt.so.1
      needs:
      - /usr/lib/libc.so.6
    - path: /usr/lib/libcrypt.so.1.1.0
      needs:
      - /usr/lib/libc.so.6

resolution:
  /usr/lib/libc.so.6: glibc
