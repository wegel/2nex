package:
  schema: 1
  name: Zlib
  slug: zlib
  namespace: libs/system
  version: 1.3.1
  description: A Massively Spiffy Yet Delicately Unobtrusive Compression Library
  homepage: https://zlib.net/
  checksum: 325e097a6a91894a074ce5ab55b7a51d825272e94449439146469a08f4f4a78a
  seed: true

sources:
- name: zlib
  url: https://zlib.net/fossils/zlib-1.3.1.tar.gz
  sha256: 9a93b2b7dfdac77ceba5a558a580e74667dd6fede4585b91eefb60f03b72df23

dependencies:
- name: linux-headers
  commit: x86_64/pkg/bootstrap/phase3/linux-headers/6.4.1/bundles/dev
- name: glibc
  commit: x86_64/pkg/libs/system/glibc/2.39/bundles/dev
- name: binutils
  commit: x86_64/pkg/bootstrap/phase3/binutils/2.42/bundles/dev
- name: gcc
  commit: x86_64/pkg/bootstrap/phase3/gcc/13.2.0/bundles/dev
- name: bash
  commit: x86_64/pkg/bootstrap/phase3/bash/5.2.21/bundles/dev
- name: coreutils
  commit: x86_64/pkg/bootstrap/phase3/coreutils/9.5/bundles/dev
- name: findutils
  commit: x86_64/pkg/bootstrap/phase3/findutils/4.9.0/bundles/dev
- name: grep
  commit: x86_64/pkg/bootstrap/phase3/grep/3.11/bundles/dev
- name: gzip
  commit: x86_64/pkg/bootstrap/phase3/gzip/1.13/bundles/dev
- name: diffutils
  commit: x86_64/pkg/bootstrap/phase3/diffutils/3.10/bundles/dev
- name: gawk
  commit: x86_64/pkg/bootstrap/phase3/gawk/5.3.0/bundles/dev
- name: make
  commit: x86_64/pkg/bootstrap/phase3/make/4.4.1/bundles/dev
- name: sed
  commit: x86_64/pkg/bootstrap/phase3/sed/4.9/bundles/dev
- name: tar
  commit: x86_64/pkg/bootstrap/phase3/tar/1.35/bundles/dev
- name: xz
  commit: x86_64/pkg/bootstrap/phase3/xz/5.4.6/bundles/dev

build:
  environment: 248c5014338ab55a89b9c261e303e111e6847aec
  profile: [4160:256, 8535:266, 12966:359, 15682:1804]

  script: |
    tar --no-same-owner -xf ${SOURCE_zlib} -C "${WORK_DIR}" --strip-components=1
    cd ${WORK_DIR}

    ./configure --prefix=/usr
    make
    make check
    make DESTDIR=${OUT_DIR} install

    # Build minizip directly from zlib's contrib tree. Using autoreconf here
    # would pull normal Perl and autotools into this early package and create a
    # bootstrap cycle.
    pushd contrib/minizip
    cc ${CFLAGS:-} -fPIC -I../.. -c ioapi.c unzip.c zip.c
    cc -shared -Wl,-soname,libminizip.so.1 -o libminizip.so.1.0.0 ioapi.o unzip.o zip.o -L"${OUT_DIR}/usr/lib" -lz
    ar rcs libminizip.a ioapi.o unzip.o zip.o
    ranlib -D libminizip.a

    install -d "${OUT_DIR}/usr/include/minizip" "${OUT_DIR}/usr/lib/pkgconfig"
    install -m 0644 crypt.h ioapi.h mztools.h unzip.h zip.h "${OUT_DIR}/usr/include/minizip/"
    install -m 0755 libminizip.so.1.0.0 "${OUT_DIR}/usr/lib/"
    install -m 0644 libminizip.a "${OUT_DIR}/usr/lib/"
    ln -sf libminizip.so.1.0.0 "${OUT_DIR}/usr/lib/libminizip.so.1"
    ln -sf libminizip.so.1 "${OUT_DIR}/usr/lib/libminizip.so"
    cat > "${OUT_DIR}/usr/lib/libminizip.la" <<'EOF'
    # libminizip.la - a libtool library file
    dlname='libminizip.so.1'
    library_names='libminizip.so.1.0.0 libminizip.so.1 libminizip.so'
    old_library='libminizip.a'
    dependency_libs=' -lz'
    installed=yes
    shouldnotlink=no
    dlopen=''
    dlpreopen=''
    libdir='/usr/lib'
    EOF
    cat > "${OUT_DIR}/usr/lib/pkgconfig/minizip.pc" <<'EOF'
    prefix=/usr
    exec_prefix=${prefix}
    libdir=${exec_prefix}/lib
    includedir=${prefix}/include

    Name: minizip
    Description: Minizip zip file manipulation library
    Version: 1.3.1
    Requires: zlib
    Libs: -L${libdir} -lminizip
    Cflags: -I${includedir}
    EOF
    popd

    rm -rf ${OUT_DIR}/usr/share/info ${OUT_DIR}/usr/share/man ${OUT_DIR}/usr/share/doc
    find "${OUT_DIR}" -exec touch -d '2024-01-01T00:00:00+00:00' {} \;

    find ${OUT_DIR} -type f -executable -exec strip --strip-unneeded {} \; 2>/dev/null || true
    find ${OUT_DIR} -name '*.a' -exec objcopy --enable-deterministic-archives {} \; 2>/dev/null || true

bundles:
  contrib-dev:
  - contrib-dev
  - contrib-lib
  - contrib-static

  dev:
  - dev
  - lib
  - static

outputs:
  contrib-dev:
    files:
    - path: /usr/include/minizip/crypt.h
    - path: /usr/include/minizip/ioapi.h
    - path: /usr/include/minizip/mztools.h
    - path: /usr/include/minizip/unzip.h
    - path: /usr/include/minizip/zip.h
    - path: /usr/lib/libminizip.la
    - path: /usr/lib/pkgconfig/minizip.pc

  contrib-lib:
    files:
    - path: /usr/lib/libminizip.so
      needs:
      - /usr/lib/libc.so.6
      - /usr/lib/libz.so.1
    - path: /usr/lib/libminizip.so.1
      needs:
      - /usr/lib/libc.so.6
      - /usr/lib/libz.so.1
    - path: /usr/lib/libminizip.so.1.0.0
      needs:
      - /usr/lib/libc.so.6
      - /usr/lib/libz.so.1

  contrib-static:
    files:
    - path: /usr/lib/libminizip.a

  dev:
    files:
    - path: /usr/include/zconf.h
    - path: /usr/include/zlib.h
    - path: /usr/lib/pkgconfig/zlib.pc

  lib:
    files:
    - path: /usr/lib/libz.so
      needs:
      - /usr/lib/libc.so.6
    - path: /usr/lib/libz.so.1
      needs:
      - /usr/lib/libc.so.6
    - path: /usr/lib/libz.so.1.3.1
      needs:
      - /usr/lib/libc.so.6

  static:
    files:
    - path: /usr/lib/libz.a

resolution:
  /usr/lib/libc.so.6: glibc
  /usr/lib/libz.so.1: self
