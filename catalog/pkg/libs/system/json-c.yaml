    - path: /usr/include/json-c/json_visit.h
    - path: /usr/include/json-c/linkhash.h
    - path: /usr/include/json-c/printbuf.h
    - path: /usr/lib/pkgconfig/json-c.pc

  lib:
    files:
    - path: /usr/lib/cmake/json-c/json-c-config.cmake
    - path: /usr/lib/cmake/json-c/json-c-targets-release.cmake
    - path: /usr/lib/cmake/json-c/json-c-targets.cmake
    - path: /usr/lib/libjson-c.so
      needs:
      - /usr/lib/ld-linux-x86-64.so.2
      - /usr/lib/libc.so.6
    - path: /usr/lib/libjson-c.so.5
      needs:
      - /usr/lib/ld-linux-x86-64.so.2
      - /usr/lib/libc.so.6
    - path: /usr/lib/libjson-c.so.5.4.0
      needs:
      - /usr/lib/ld-linux-x86-64.so.2
      - /usr/lib/libc.so.6

resolution:
