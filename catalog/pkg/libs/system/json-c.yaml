  commit: x86_64/pkg/core/toolchain/ninja/1.12.1/bundles/dev

build:
  environment: 248c5014338ab55a89b9c261e303e111e6847aec
  profile: [4097:52037, 8218:63793, 11062:72392]

  script: |
    tar --no-same-owner -xf /${SOURCE_json_c} -C "${WORK_DIR}" --strip-components=1
    cd ${WORK_DIR}

    mkdir build && cd build
    cmake .. \
      -DCMAKE_INSTALL_PREFIX=/usr \
      -DCMAKE_BUILD_TYPE=Release \
      -DBUILD_SHARED_LIBS=ON \
      -DBUILD_STATIC_LIBS=OFF \
      -G Ninja

    ninja
    DESTDIR="${OUT_DIR}" ninja install

    find ${OUT_DIR} -type f -executable -exec strip --strip-unneeded {} \; 2>/dev/null || true
    find ${OUT_DIR} -name '*.a' -exec objcopy --enable-deterministic-archives {} \; 2>/dev/null || true
    find "${OUT_DIR}" -exec touch -d "2024-01-01T00:00:00+00:00" {} \;

bundles:
  dev:
  - dev
  - lib

outputs:
  dev:
    files:
    - path: /usr/include/json-c/arraylist.h
    - path: /usr/include/json-c/debug.h
