package:
  schema: 1
  name: libice
  slug: libice
  namespace: libs/x11
  version: 1.1.2
  description: X11 inter-client exchange library
  homepage: https://xorg.freedesktop.org/
  checksum: 5cc83d624e1a83e8dd09c28d3f683e19799d35f5250b90d778bda455eb6f0122

sources:
- name: libice
  url: https://xorg.freedesktop.org/archive/individual/lib/libICE-1.1.2.tar.xz
  sha256: 974e4ed414225eb3c716985df9709f4da8d22a67a2890066bc6dfc89ad298625

dependencies:
- name: glibc
  commit: x86_64/pkg/libs/system/glibc/2.39/bundles/dev
- name: gcc
  commit: x86_64/pkg/core/toolchain/gcc/13.2.0/bundles/dev
- name: binutils
  commit: x86_64/pkg/core/toolchain/binutils/2.42/bundles/dev
- name: make
  commit: x86_64/pkg/core/toolchain/make/4.4.1/bundles/dev
- name: pkgconf
  commit: x86_64/pkg/core/toolchain/pkgconf/2.2.0/bundles/dev
- name: bash
  commit: x86_64/pkg/cli/shells/bash/5.2.21/bundles/dev
- name: ncurses
  commit: x86_64/pkg/libs/system/ncurses/6.4-20230520/bundles/dev
- name: acl
  commit: x86_64/pkg/libs/system/acl/2.3.2/bundles/dev
- name: attr
  commit: x86_64/pkg/libs/system/attr/2.5.2/bundles/dev
- name: tar
  commit: x86_64/pkg/cli/archive/tar/1.35/bundles/dev
- name: xz
  commit: x86_64/pkg/libs/compression/xz/5.4.6/bundles/dev
- name: zlib
  commit: x86_64/pkg/libs/system/zlib/1.3.1/bundles/dev
- name: coreutils
  commit: x86_64/pkg/core/userland/coreutils/9.5/bundles/dev
- name: findutils
  commit: x86_64/pkg/core/userland/findutils/4.9.0/bundles/dev
- name: diffutils
  commit: x86_64/pkg/core/userland/diffutils/3.10/bundles/dev
- name: linux-headers
  commit: x86_64/pkg/libs/system/linux-headers/6.4.1/bundles/dev
- name: gawk
  commit: x86_64/pkg/cli/text/gawk/5.3.0/bundles/dev
- name: sed
  commit: x86_64/pkg/cli/text/sed/4.9/bundles/dev
- name: grep
  commit: x86_64/pkg/cli/text/grep/3.11/bundles/dev
- name: xorgproto
  commit: x86_64/pkg/libs/x11/xorgproto/2024.1/bundles/dev
- name: util-macros
  commit: x86_64/pkg/libs/x11/util-macros/1.20.2/bundles/dev
- name: xtrans
  commit: x86_64/pkg/libs/x11/xtrans/1.5.2/bundles/dev

build:
  environment: 248c5014338ab55a89b9c261e303e111e6847aec
  profile: [4136:18502, 8246:39069, 10587:48835]

  script: |
    tar --no-same-owner -xf /${SOURCE0} -C "${WORK_DIR}" --strip-components=1
    cd ${WORK_DIR}

    ./configure \
      --prefix=/usr \
      --disable-static \
      --without-xmlto \
      --without-fop \
      --without-xsltproc

    make
    make DESTDIR="${OUT_DIR}" install

    find ${OUT_DIR} -type f -executable -exec strip --strip-unneeded {} \; 2>/dev/null || true
    find ${OUT_DIR} -name '*.a' -exec objcopy --enable-deterministic-archives {} \; 2>/dev/null || true
    find "${OUT_DIR}" -exec touch -d "2024-01-01T00:00:00+00:00" {} \;

bundles:
  dev:
  - dev
  - lib

outputs:
  dev:
    files:
    - path: /usr/include/X11/ICE/ICE.h
    - path: /usr/include/X11/ICE/ICEconn.h
    - path: /usr/include/X11/ICE/ICElib.h
    - path: /usr/include/X11/ICE/ICEmsg.h
    - path: /usr/include/X11/ICE/ICEproto.h
    - path: /usr/include/X11/ICE/ICEutil.h
    - path: /usr/lib/libICE.la
    - path: /usr/lib/pkgconfig/ice.pc

  doc:
    files:
    - path: /usr/share/doc/libICE/ICElib.xml
    - path: /usr/share/doc/libICE/ice.xml

  lib:
    files:
    - path: /usr/lib/libICE.so
      needs:
      - /usr/lib/libc.so.6
    - path: /usr/lib/libICE.so.6
      needs:
      - /usr/lib/libc.so.6
    - path: /usr/lib/libICE.so.6.3.0
      needs:
      - /usr/lib/libc.so.6

resolution:
  /usr/lib/libc.so.6: glibc
