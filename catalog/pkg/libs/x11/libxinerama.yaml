  commit: x86_64/pkg/libs/system/zlib/1.3.1/bundles/dev
- name: coreutils
  commit: x86_64/pkg/core/userland/coreutils/9.5/bundles/dev
- name: findutils
  commit: x86_64/pkg/core/userland/findutils/4.9.0/bundles/dev
- name: linux-headers
  commit: x86_64/pkg/libs/system/linux-headers/6.4.1/bundles/dev
- name: gawk
  commit: x86_64/pkg/cli/text/gawk/5.3.0/bundles/dev
- name: sed
  commit: x86_64/pkg/cli/text/sed/4.9/bundles/dev
- name: grep
  commit: x86_64/pkg/cli/text/grep/3.11/bundles/dev
- name: util-macros
  commit: x86_64/pkg/libs/x11/util-macros/1.20.2/bundles/dev
- name: xorgproto
  commit: x86_64/pkg/libs/x11/xorgproto/2024.1/bundles/dev
- name: libx11
  commit: x86_64/pkg/libs/x11/libx11/1.8.10/bundles/dev
- name: libxcb
  commit: x86_64/pkg/libs/x11/libxcb/1.17.0/bundles/dev
- name: libxau
  commit: x86_64/pkg/libs/x11/libxau/1.0.12/bundles/dev
- name: libxdmcp
  commit: x86_64/pkg/libs/x11/libxdmcp/1.1.5/bundles/dev
- name: libxext
  commit: x86_64/pkg/libs/x11/libxext/1.3.6/bundles/dev

build:
  environment: 248c5014338ab55a89b9c261e303e111e6847aec
  profile: [4138:4940, 8252:9441, 8925:10466]

  script: |
    tar --no-same-owner -xf /${SOURCE0} -C "${WORK_DIR}" --strip-components=1
    cd ${WORK_DIR}

    ./configure --prefix=/usr --disable-static

    make
    make DESTDIR="${OUT_DIR}" install

    find ${OUT_DIR} -type f -executable -exec strip --strip-unneeded {} \; 2>/dev/null || true
    find ${OUT_DIR} -name '*.a' -exec objcopy --enable-deterministic-archives {} \; 2>/dev/null || true
    find "${OUT_DIR}" -exec touch -d "2024-01-01T00:00:00+00:00" {} \;

bundles:
  dev:
  - dev
  - lib

  full:
  - dev
  - lib
  - man

outputs:
  dev:
    files:
    - path: /usr/include/X11/extensions/Xinerama.h
    - path: /usr/include/X11/extensions/panoramiXext.h
    - path: /usr/lib/libXinerama.la
    - path: /usr/lib/pkgconfig/xinerama.pc

  lib:
    files:
    - path: /usr/lib/libXinerama.so
      needs:
      - /usr/lib/libX11.so.6
      - /usr/lib/libXau.so.6
      - /usr/lib/libXdmcp.so.6
      - /usr/lib/libXext.so.6
      - /usr/lib/libc.so.6
      - /usr/lib/libxcb.so.1
    - path: /usr/lib/libXinerama.so.1
      needs:
      - /usr/lib/libX11.so.6
      - /usr/lib/libXau.so.6
      - /usr/lib/libXdmcp.so.6
      - /usr/lib/libXext.so.6
      - /usr/lib/libc.so.6
      - /usr/lib/libxcb.so.1
    - path: /usr/lib/libXinerama.so.1.0.0
      needs:
      - /usr/lib/libX11.so.6
      - /usr/lib/libXau.so.6
      - /usr/lib/libXdmcp.so.6
      - /usr/lib/libXext.so.6
      - /usr/lib/libc.so.6
      - /usr/lib/libxcb.so.1

  man:
    files:
    - path: /usr/share/man/man3/Xinerama.3
    - path: /usr/share/man/man3/XineramaIsActive.3
    - path: /usr/share/man/man3/XineramaQueryExtension.3
    - path: /usr/share/man/man3/XineramaQueryScreens.3
    - path: /usr/share/man/man3/XineramaQueryVersion.3

resolution:
  /usr/lib/libc.so.6: glibc
  /usr/lib/libX11.so.6: libx11
  /usr/lib/libXau.so.6: libxau
  /usr/lib/libxcb.so.1: libxcb
  /usr/lib/libXdmcp.so.6: libxdmcp
  /usr/lib/libXext.so.6: libxext
