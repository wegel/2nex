package:
  schema: 1
  name: libxdmcp
  slug: libxdmcp
  namespace: libs/x11
  version: 1.1.5
  description: X Display Manager Control Protocol library
  homepage: https://xorg.freedesktop.org/
  checksum: 07793df94f45b9ece5ecf799afca30de038bf37b221d9cf764198cf756a293d2

sources:
- name: libxdmcp
  url: https://xorg.freedesktop.org/archive/individual/lib/libXdmcp-1.1.5.tar.xz
  sha256: d8a5222828c3adab70adf69a5583f1d32eb5ece04304f7f8392b6a353aa2228c

dependencies:
- name: glibc
  commit: x86_64/pkg/libs/system/glibc/2.39/bundles/dev
- name: gmp
  commit: x86_64/pkg/libs/system/gmp/6.3.0/bundles/dev
