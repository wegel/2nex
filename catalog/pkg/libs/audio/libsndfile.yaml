    - path: /usr/share/man/man1/sndfile-cmp.1
    - path: /usr/share/man/man1/sndfile-concat.1
    - path: /usr/share/man/man1/sndfile-convert.1
    - path: /usr/share/man/man1/sndfile-deinterleave.1
