  slug: libsndfile
  namespace: libs/audio
  version: 1.2.2
  description: C library for reading and writing sound files
  homepage: https://libsndfile.github.io/libsndfile/
  checksum: 0c02e8b6eb433e672d631535ef4b638263b7ac3f217b38219220fb470d270cd3

sources:
- name: libsndfile
  url: https://github.com/libsndfile/libsndfile/releases/download/1.2.2/libsndfile-1.2.2.tar.xz
  sha256: 3799ca9924d3125038880367bf1468e53a1b7e3686a934f098b7e1d286cdb80e

dependencies:
- name: glibc
  commit: x86_64/pkg/libs/system/glibc/2.39/bundles/dev
- name: gmp
  commit: x86_64/pkg/libs/system/gmp/6.3.0/bundles/dev
- name: gcc
