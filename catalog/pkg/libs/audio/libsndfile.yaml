  lib:
    files:
    - path: /usr/lib/libsndfile.so
      needs:
      - /usr/lib/libc.so.6
      - /usr/lib/libm.so.6
    - path: /usr/lib/libsndfile.so.1
      needs:
      - /usr/lib/libc.so.6
