      - /usr/lib/libc.so.6
      - /usr/lib/libsndfile.so.1
    - path: /usr/bin/sndfile-info
      needs:
      - /usr/lib/ld-linux-x86-64.so.2
      - /usr/lib/libc.so.6
      - /usr/lib/libm.so.6
      - /usr/lib/libsndfile.so.1
    - path: /usr/bin/sndfile-interleave
      needs:
      - /usr/lib/ld-linux-x86-64.so.2
      - /usr/lib/libc.so.6
      - /usr/lib/libsndfile.so.1
    - path: /usr/bin/sndfile-metadata-get
      needs:
      - /usr/lib/ld-linux-x86-64.so.2
      - /usr/lib/libc.so.6
      - /usr/lib/libsndfile.so.1
    - path: /usr/bin/sndfile-metadata-set
      needs:
      - /usr/lib/ld-linux-x86-64.so.2
      - /usr/lib/libc.so.6
      - /usr/lib/libm.so.6
      - /usr/lib/libsndfile.so.1
    - path: /usr/bin/sndfile-play
      needs:
      - /usr/lib/ld-linux-x86-64.so.2
      - /usr/lib/libc.so.6
      - /usr/lib/libsndfile.so.1
    - path: /usr/bin/sndfile-salvage
      needs:
      - /usr/lib/ld-linux-x86-64.so.2
      - /usr/lib/libc.so.6
      - /usr/lib/libsndfile.so.1

  dev:
    files:
    - path: /usr/include/sndfile.h
    - path: /usr/include/sndfile.hh
    - path: /usr/lib/libsndfile.la
    - path: /usr/lib/pkgconfig/sndfile.pc

  doc:
    files:
    - path: /usr/share/doc/libsndfile/FAQ.md
    - path: /usr/share/doc/libsndfile/api.md
    - path: /usr/share/doc/libsndfile/bugs.md
