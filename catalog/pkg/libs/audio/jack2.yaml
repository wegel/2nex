build:
  environment: 248c5014338ab55a89b9c261e303e111e6847aec
  profile: [4112:1092, 8288:1860, 12473:2469, 16584:3126, 20694:4266, 24830:4539, 28949:4791, 33060:15529, 36492:16446]

  script: |
    set -eux

    tar --no-same-owner -xf /${SOURCE_jack2} -C "${WORK_DIR}" --strip-components=1
    cd "${WORK_DIR}"

    patch --batch --fuzz=0 -Np1 -i "/${SOURCE_uapi_config}"

    python3 - <<'PY'
    from pathlib import Path

    path = Path("waflib/Context.py")
    text = path.read_text()
    text = text.replace("import os, re, imp, sys", "import os, re, sys, types")
    text = text.replace("module = imp.new_module(WSCRIPT_FILE)", "module = types.ModuleType(WSCRIPT_FILE)")
    path.write_text(text)
    PY

    export SOURCE_DATE_EPOCH=1704067200
    python3 ./waf configure \
      --prefix=/usr \
      --libdir=/usr/lib \
      --pkgconfigdir=/usr/lib/pkgconfig \
      --mandir=/usr/share/man/man1 \
      --classic \
      --autostart=classic \
      --alsa=yes \
      --opus=yes \
      --no-celt \
      --no-doxygen \
      --no-firewire \
      --no-iio \
      --no-portaudio \
      --no-samplerate \
      --no-systemd \
      --no-db \
      --no-tests \
      --no-winmme

    python3 ./waf build
    python3 ./waf install --destdir="${OUT_DIR}"

    mkdir -p /etc /run /usr/lib
    probe_src="${WORK_DIR}/jack2-uapi-probe.c"
    cat > "${probe_src}" <<'PROBE'
    #include <jack/jack.h>

    int main(void)
    {
        jack_status_t status;
        jack_client_t *client = jack_client_open("nex-uapi-probe", JackNullOption, &status);
        if (client) {
            jack_client_close(client);
        }
        return 0;
    }
    PROBE

    gcc -I "${OUT_DIR}/usr/include" "${probe_src}" \
      -L "${OUT_DIR}/usr/lib" -Wl,-rpath,"${OUT_DIR}/usr/lib" \
      -ljackserver -o "${WORK_DIR}/jack2-uapi-probe"

    probe_home="${WORK_DIR}/jack2-uapi-home"
    mkdir -p "${probe_home}"

    run_probe() {
      HOME="${probe_home}" JACK_DRIVER_DIR="${OUT_DIR}/usr/lib/jack" \
        "${WORK_DIR}/jack2-uapi-probe" 2>&1 1>/dev/null
    }

    expect_driver() {
      expected=$1
      out="$(run_probe)" || true
      case "${out}" in
        *"${expected}"*) ;;
        *)
          printf 'jack2 UAPI smoke: expected %s, got: %s\n' "${expected}" "${out}" >&2
          exit 1
          ;;
      esac
    }

    # Only the vendor tier exists.
    printf -- 'jackd -d nex-usr-marker\n' > /usr/lib/jackdrc
    expect_driver nex-usr-marker

    # The runtime tier appears and must shadow the vendor tier.
    printf -- 'jackd -d nex-run-marker\n' > /run/jackdrc
    expect_driver nex-run-marker

    # The admin tier appears and must shadow both lower tiers.
    printf -- 'jackd -d nex-etc-marker\n' > /etc/jackdrc
    expect_driver nex-etc-marker

    # An empty admin file still counts as complete and must mask the lower tiers.
    : > /etc/jackdrc
    out="$(run_probe)" || true
    if printf '%s' "${out}" | grep -q 'nex-run-marker\|nex-usr-marker'; then
      printf 'jack2 UAPI smoke: empty /etc/jackdrc failed to mask lower tiers: %s\n' "${out}" >&2
      exit 1
    fi

    # Remove the three tiers; the legacy jackd.conf alias is the last resort.
    rm -f /etc/jackdrc /run/jackdrc /usr/lib/jackdrc
    printf -- 'jackd -d nex-legacy-marker\n' > /etc/jackd.conf
    expect_driver nex-legacy-marker

    rm -f /etc/jackd.conf
    printf 'jack2 UAPI smoke: autostart jackdrc read all three tiers in order\n'

    find "${OUT_DIR}" -type f -executable -exec strip --strip-unneeded {} \; 2>/dev/null || true
    find "${OUT_DIR}" -name '*.a' -exec objcopy --enable-deterministic-archives {} \; 2>/dev/null || true
    find "${OUT_DIR}" -exec touch -d "2024-01-01T00:00:00+00:00" {} \;

