package:
  schema: 1
  name: minizip-ng
  slug: minizip-ng
  namespace: libs/compression
  version: 4.0.10
  description: Fork of zlib's minizip with modern features
  homepage: https://github.com/zlib-ng/minizip-ng
  checksum: 31b6383009e9c4c214a2afccc6138023847e96f23f3936133b8f86fdace2df26

sources:
- name: minizip-ng
  url: https://github.com/zlib-ng/minizip-ng/archive/refs/tags/4.0.10.tar.gz
  sha256: c362e35ee973fa7be58cc5e38a4a6c23cc8f7e652555daf4f115a9eb2d3a6be7

dependencies:
- name: glibc
  commit: x86_64/pkg/libs/system/glibc/2.39/bundles/dev
- name: gmp
  commit: x86_64/pkg/libs/system/gmp/6.3.0/bundles/dev
- name: gcc
  commit: x86_64/pkg/core/toolchain/gcc/13.2.0/bundles/dev
- name: binutils
  commit: x86_64/pkg/core/toolchain/binutils/2.42/bundles/dev
- name: bash
  commit: x86_64/pkg/cli/shells/bash/5.2.21/bundles/dev
- name: coreutils
  commit: x86_64/pkg/core/userland/coreutils/9.5/bundles/dev
- name: findutils
  commit: x86_64/pkg/core/userland/findutils/4.9.0/bundles/dev
- name: tar
  commit: x86_64/pkg/cli/archive/tar/1.35/bundles/dev
- name: gzip
  commit: x86_64/pkg/cli/archive/gzip/1.13/bundles/dev
- name: linux-headers
  commit: x86_64/pkg/libs/system/linux-headers/6.4.1/bundles/dev
- name: ncurses
  commit: x86_64/pkg/libs/system/ncurses/6.4-20230520/bundles/dev
- name: acl
  commit: x86_64/pkg/libs/system/acl/2.3.2/bundles/dev
- name: attr
  commit: x86_64/pkg/libs/system/attr/2.5.2/bundles/dev
- name: zlib
  commit: x86_64/pkg/libs/system/zlib/1.3.1/bundles/dev
- name: bzip2
  commit: x86_64/pkg/libs/compression/bzip2/1.0.8/bundles/dev
- name: xz-lib
  commit: x86_64/pkg/libs/compression/xz/5.4.6/bundles/dev
- name: zstd
  commit: x86_64/pkg/libs/compression/zstd/1.5.6/bundles/dev
- name: openssl3
  commit: x86_64/pkg/dev/libs/openssl3/3.3.1/bundles/dev
- name: cmake
  commit: x86_64/pkg/dev/build/cmake/3.31.10/bundles/dev
- name: libcap
  commit: x86_64/pkg/libs/security/libcap/2.69/bundles/dev
- name: ninja
  commit: x86_64/pkg/core/toolchain/ninja/1.12.1/bundles/dev
- name: curl
  commit: x86_64/pkg/cli/net/curl/8.17.0/bundles/dev
- name: libarchive
  commit: x86_64/pkg/libs/archive/libarchive/3.8.4/bundles/dev
- name: lz4
  commit: x86_64/pkg/libs/compression/lz4/1.9.4/bundles/dev
- name: libxml2
  commit: x86_64/pkg/libs/system/libxml2/2.13.5/bundles/dev

build:
  environment: 248c5014338ab55a89b9c261e303e111e6847aec
  profile: [4157:1756, 5282:1775]

  script: |
    tar --no-same-owner -xf /${SOURCE_minizip_ng} -C "${WORK_DIR}" --strip-components=1
    cd ${WORK_DIR}

    cmake -B build -G Ninja \
      -DCMAKE_INSTALL_PREFIX=/usr \
      -DCMAKE_BUILD_TYPE=Release \
      -DBUILD_SHARED_LIBS=ON \
      -DMZ_COMPAT=ON \
      -DMZ_BZIP2=ON \
      -DMZ_LZMA=ON \
      -DMZ_ZSTD=ON \
      -DMZ_OPENSSL=ON

    ninja -C build
    DESTDIR="${OUT_DIR}" ninja -C build install

    find ${OUT_DIR} -type f -executable -exec strip --strip-unneeded {} \; 2>/dev/null || true
    find ${OUT_DIR} -name '*.a' -exec objcopy --enable-deterministic-archives {} \; 2>/dev/null || true
    find "${OUT_DIR}" -exec touch -d "2024-01-01T00:00:00+00:00" {} \;

bundles:
  dev:
  - dev
  - lib

  full:
  - dev
  - lib

outputs:
  dev:
    files:
    - path: /usr/include/minizip/ioapi.h
    - path: /usr/include/minizip/mz.h
    - path: /usr/include/minizip/mz_crypt.h
    - path: /usr/include/minizip/mz_os.h
    - path: /usr/include/minizip/mz_strm.h
    - path: /usr/include/minizip/mz_strm_buf.h
    - path: /usr/include/minizip/mz_strm_bzip.h
    - path: /usr/include/minizip/mz_strm_lzma.h
    - path: /usr/include/minizip/mz_strm_mem.h
    - path: /usr/include/minizip/mz_strm_os.h
    - path: /usr/include/minizip/mz_strm_pkcrypt.h
    - path: /usr/include/minizip/mz_strm_split.h
    - path: /usr/include/minizip/mz_strm_wzaes.h
    - path: /usr/include/minizip/mz_strm_zlib.h
    - path: /usr/include/minizip/mz_zip.h
    - path: /usr/include/minizip/mz_zip_rw.h
    - path: /usr/include/minizip/unzip.h
    - path: /usr/include/minizip/zip.h
    - path: /usr/lib/pkgconfig/minizip.pc

  lib:
    files:
    - path: /usr/lib/cmake/minizip/minizip-config-version.cmake
    - path: /usr/lib/cmake/minizip/minizip-config.cmake
    - path: /usr/lib/cmake/minizip/minizip-release.cmake
    - path: /usr/lib/cmake/minizip/minizip.cmake
    - path: /usr/lib/libminizip.so
      needs:
      - /usr/lib/libbz2.so.1.0
      - /usr/lib/libc.so.6
      - /usr/lib/libcrypto.so.3
      - /usr/lib/liblzma.so.5
      - /usr/lib/libz.so.1
    - path: /usr/lib/libminizip.so.1
      needs:
      - /usr/lib/libbz2.so.1.0
      - /usr/lib/libc.so.6
      - /usr/lib/libcrypto.so.3
      - /usr/lib/liblzma.so.5
      - /usr/lib/libz.so.1
    - path: /usr/lib/libminizip.so.4.0.10
      needs:
      - /usr/lib/libbz2.so.1.0
      - /usr/lib/libc.so.6
      - /usr/lib/libcrypto.so.3
      - /usr/lib/liblzma.so.5
      - /usr/lib/libz.so.1

resolution:
  /usr/lib/libbz2.so.1.0: bzip2
  /usr/lib/libc.so.6: glibc
  /usr/lib/libcrypto.so.3: openssl3
  /usr/lib/liblzma.so.5: xz-lib
  /usr/lib/libz.so.1: zlib
