build:
  environment: 248c5014338ab55a89b9c261e303e111e6847aec
  profile: [21308:7532, 84117:8809, 185819:10229, 310783:10728, 413477:12175, 514998:12530, 617353:14360, 770880:21062, 922813:27965, 1024505:30105]

  script: |
    tar --no-same-owner -xf /${SOURCE0} -C "${WORK_DIR}" --strip-components=1
    cd ${WORK_DIR}/src
    patch --batch --fuzz=0 -Np1 -i "/${SOURCE_uapi_config_patch}"

    ./configure \
      --prefix=/usr \
      --sbindir=/usr/bin \
      --sysconfdir=/etc \
      --localstatedir=/var/lib \
      --runstatedir=/run \
      --enable-shared \
      --disable-rpath

    make -j$(nproc)
    make DESTDIR="${OUT_DIR}" install

    # Exercise the newly built, installed profile library and GSSAPI
    # mechanism registry through krb5_init_context() and
    # gss_indicate_mechs(), the real readers this package patches, instead
    # of reimplementing their tier-merge and precedence rules; see the check
    # script for detail.
    sh "/${SOURCE_uapi_check}" \
      "${OUT_DIR}" \
      "${WORK_DIR}" \
      "/${SOURCE_uapi_smoke}"

    find ${OUT_DIR} -type f -executable -exec strip --strip-unneeded {} \; 2>/dev/null || true
    find ${OUT_DIR} -name '*.a' -exec objcopy --enable-deterministic-archives {} \; 2>/dev/null || true
    find "${OUT_DIR}" -exec touch -h -d "2024-01-01T00:00:00+00:00" {} \;

