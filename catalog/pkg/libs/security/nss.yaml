build:
  environment: 248c5014338ab55a89b9c261e303e111e6847aec
  profile: [16746:68054, 59813:80352, 132554:88160, 218494:93363, 288587:97183, 360220:99078, 435382:101428, 542038:103346, 650801:111262, 719072:125551]

  script: |
    tar --no-same-owner -xf /${SOURCE0} -C "${WORK_DIR}" --strip-components=1
    cd ${WORK_DIR}

    cd nss
    mkdir -p "${WORK_DIR}/_bin"
    cat > "${WORK_DIR}/_bin/python" <<'EOF'
    #!/bin/sh
    exec python3 "$@"
    EOF
    chmod +x "${WORK_DIR}/_bin/python"
    export PATH="${WORK_DIR}/_bin:${PATH}"

    mkdir -p "${WORK_DIR}/_bin"
    cat > "${WORK_DIR}/_bin/gyp" <<'EOF'
    #!/bin/sh
    exec /usr/sbin/gyp --no-parallel "$@"
    EOF
    cat > "${WORK_DIR}/_bin/cc" <<'EOF'
    #!/bin/sh
    exec gcc "$@"
    EOF
    cat > "${WORK_DIR}/_bin/c++" <<'EOF'
    #!/bin/sh
    exec g++ "$@"
    EOF
    chmod +x "${WORK_DIR}/_bin/gyp"
    chmod +x "${WORK_DIR}/_bin/cc" "${WORK_DIR}/_bin/c++"
    export PATH="${WORK_DIR}/_bin:${PATH}"

    ./build.sh -c -v --disable-tests --opt --system-nspr

    distdir=$(find ../dist -maxdepth 2 -type d -name 'Release*' | head -n 1)
    if [ -z "$distdir" ]; then
      echo "failed to locate NSS dist directory" >&2
      exit 1
    fi

    mkdir -p ${OUT_DIR}/usr/{lib,bin,include/nss}
    cp -a "$distdir"/lib/* ${OUT_DIR}/usr/lib/
    if [ -d "$distdir"/bin ]; then
      cp -a "$distdir"/bin/* ${OUT_DIR}/usr/bin/
    fi
    if [ -d "$distdir"/include ]; then
      cp -a "$distdir"/include/* ${OUT_DIR}/usr/include/nss/
    fi
    if [ -d ../dist/public/nss ]; then
      cp -a ../dist/public/nss/* ${OUT_DIR}/usr/include/nss/
    fi

    find ${OUT_DIR} -name '*.chk' -delete 2>/dev/null || true

    find ${OUT_DIR} -type f -executable -exec strip --strip-unneeded {} \; 2>/dev/null || true
    find ${OUT_DIR} -name '*.a' -exec objcopy --enable-deterministic-archives {} \; 2>/dev/null || true
    find "${OUT_DIR}" -exec touch -d "2024-01-01T00:00:00+00:00" {} \;

