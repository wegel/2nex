build:
  environment: 248c5014338ab55a89b9c261e303e111e6847aec
  profile: [4133:2100, 8240:3247, 12352:6648, 16469:9987, 20578:12549, 24675:12712, 28774:16942, 37002:17012, 45234:17274, 47688:17975]

  script: |
    set -eu

    tar --no-same-owner -xf "/${SOURCE_cups}" -C "${WORK_DIR}" --strip-components=1
    cd "${WORK_DIR}"
    patch --batch --fuzz=0 -Np1 -i "/${SOURCE_uapi_config}"

    mkdir -p /etc
    if [ ! -f /etc/passwd ]; then
      cat > /etc/passwd <<'EOF'
    root:x:0:0:root:/root:/bin/sh
    nobody:x:65534:65534:nobody:/:
    EOF
    elif ! grep -q '^root:' /etc/passwd; then
      printf '%s\n' 'root:x:0:0:root:/root:/bin/sh' >> /etc/passwd
    fi

    if [ ! -f /etc/group ]; then
      cat > /etc/group <<'EOF'
    root:x:0:
    nobody:x:65534:
    EOF
    elif ! grep -q '^root:' /etc/group; then
      printf '%s\n' 'root:x:0:' >> /etc/group
    fi

    ./configure \
      --prefix=/usr \
      --sysconfdir=/etc \
      --localstatedir=/var \
      --runstatedir=/run \
      --sbindir=/usr/bin \
      --libdir=/usr/lib \
      --with-cachedir=/var/cache/cups \
      --with-logdir=/var/log/cups \
      --with-rundir=/run/cups \
      --disable-static \
      --disable-systemd \
      --without-rcdir \
      --without-dbus

    make
    make DESTDIR="${OUT_DIR}" install

    install -d "${OUT_DIR}/usr/lib/cups"
    for config in cups-files.conf cupsd.conf snmp.conf; do
      mv "${OUT_DIR}/etc/cups/${config}" \
        "${OUT_DIR}/usr/lib/cups/${config}"
      rm "${OUT_DIR}/etc/cups/${config}.default"
    done
    rmdir \
      "${OUT_DIR}/etc/cups/ppd" \
      "${OUT_DIR}/etc/cups/ssl" \
      "${OUT_DIR}/etc/cups" \
      "${OUT_DIR}/etc" \
      "${OUT_DIR}/run/cups/certs" \
      "${OUT_DIR}/run/cups" \
      "${OUT_DIR}/run" \
      "${OUT_DIR}/var/cache/cups/rss" \
      "${OUT_DIR}/var/cache/cups" \
      "${OUT_DIR}/var/cache" \
      "${OUT_DIR}/var/log/cups" \
      "${OUT_DIR}/var/log" \
      "${OUT_DIR}/var/spool/cups/tmp" \
      "${OUT_DIR}/var/spool/cups" \
      "${OUT_DIR}/var/spool" \
      "${OUT_DIR}/var"

    cups_pid=
    cleanup_cups_smoke() {
      if [ -n "${cups_pid}" ]; then
        kill "${cups_pid}" 2>/dev/null || true
        wait "${cups_pid}" 2>/dev/null || true
      fi
      rm -f \
        /etc/cups/cups-files.conf \
        /etc/cups/cupsd.conf \
        /etc/cups/client.conf \
        /etc/cups/snmp.conf \
        /run/cups/cups-files.conf \
        /run/cups/cupsd.conf \
        /run/cups/client.conf \
        /run/cups/snmp.conf \
        /usr/lib/cups/cups-files.conf \
        /usr/lib/cups/cupsd.conf \
        /usr/lib/cups/client.conf \
        /usr/lib/cups/snmp.conf
      rmdir /etc/cups /run/cups /usr/lib/cups 2>/dev/null || true
    }
    trap cleanup_cups_smoke EXIT HUP INT TERM

    test ! -e /etc/cups/cups-files.conf
    test ! -e /etc/cups/cupsd.conf
    test ! -e /etc/cups/snmp.conf
    test ! -e /run/cups/cups-files.conf
    test ! -e /run/cups/cupsd.conf
    test ! -e /run/cups/snmp.conf
    test ! -e /usr/lib/cups/cups-files.conf
    test ! -e /usr/lib/cups/cupsd.conf
    test ! -e /usr/lib/cups/snmp.conf
    mkdir -p /etc/cups /run/cups /usr/lib/cups

    cp "${OUT_DIR}/usr/lib/cups/cups-files.conf" /usr/lib/cups/cups-files.conf
    cp "${OUT_DIR}/usr/lib/cups/cupsd.conf" /usr/lib/cups/cupsd.conf

    cupsd_bin="${OUT_DIR}/usr/bin/cupsd"
    cups_library_path="${OUT_DIR}/usr/lib"
    check_cupsd_paths() {
      expected_main="$1"
      expected_files="$2"
      set +e
      output="$(LD_LIBRARY_PATH="${cups_library_path}" "${cupsd_bin}" -t 2>&1)"
      status=$?
      set -e
      if [ "${status}" -ne 0 ] ||
        ! printf '%s\n' "${output}" | grep -Fq "\"${expected_files}\" is OK." ||
        ! printf '%s\n' "${output}" | grep -Fq "\"${expected_main}\" is OK."; then
        printf '%s\n' \
          "cupsd -t failed: status=${status}" \
          "expected main: ${expected_main}" \
          "expected files: ${expected_files}" >&2
        printf '%s\n' "${output}" >&2
        return 1
      fi
    }

    check_cupsd_paths \
      /usr/lib/cups/cupsd.conf \
      /usr/lib/cups/cups-files.conf

    cp /usr/lib/cups/cupsd.conf /run/cups/cupsd.conf
    check_cupsd_paths \
      /run/cups/cupsd.conf \
      /usr/lib/cups/cups-files.conf

    cp /usr/lib/cups/cups-files.conf /run/cups/cups-files.conf
    check_cupsd_paths \
      /run/cups/cupsd.conf \
      /run/cups/cups-files.conf

    cp /usr/lib/cups/cupsd.conf /etc/cups/cupsd.conf
    check_cupsd_paths \
      /etc/cups/cupsd.conf \
      /run/cups/cups-files.conf

    cp /usr/lib/cups/cups-files.conf /etc/cups/cups-files.conf
    check_cupsd_paths \
      /etc/cups/cupsd.conf \
      /etc/cups/cups-files.conf

    : > /etc/cups/cupsd.conf
    check_cupsd_paths \
      /etc/cups/cupsd.conf \
      /etc/cups/cups-files.conf

    cp /usr/lib/cups/cupsd.conf /etc/cups/cupsd.conf
    : > /etc/cups/cups-files.conf
    check_cupsd_paths \
      /etc/cups/cupsd.conf \
      /etc/cups/cups-files.conf

    explicit_root="${WORK_DIR}/cups-explicit"
    mkdir -p "${explicit_root}"
    cp /usr/lib/cups/cupsd.conf "${explicit_root}/chosen-cupsd.conf"
    cp /usr/lib/cups/cups-files.conf "${explicit_root}/chosen-cups-files.conf"
    output="$(LD_LIBRARY_PATH="${cups_library_path}" \
      "${cupsd_bin}" -t \
      -c "${explicit_root}/chosen-cupsd.conf" \
      -s "${explicit_root}/chosen-cups-files.conf" 2>&1)"
    printf '%s\n' "${output}" | \
      grep -Fq "\"${explicit_root}/chosen-cups-files.conf\" is OK."
    printf '%s\n' "${output}" | \
      grep -Fq "\"${explicit_root}/chosen-cupsd.conf\" is OK."

    cat > "${WORK_DIR}/cups-snmp-smoke.c" <<'EOF'
    #include <stdio.h>
    extern const char *_cupsSNMPDefaultCommunity(void);
    int main(void) {
      puts(_cupsSNMPDefaultCommunity());
      return 0;
    }
    EOF
    gcc \
      -L"${OUT_DIR}/usr/lib" \
      -Wl,-rpath,"${OUT_DIR}/usr/lib" \
      -o "${WORK_DIR}/cups-snmp-smoke" \
      "${WORK_DIR}/cups-snmp-smoke.c" \
      -lcups

    snmp_smoke="${WORK_DIR}/cups-snmp-smoke"
    snmp_backend="${OUT_DIR}/usr/lib/cups/backend/snmp"
    check_snmp_tier() {
      expected_path="$1"
      expected_community="$2"
      output="$(LD_LIBRARY_PATH="${cups_library_path}" "${snmp_backend}" 2>&1)"
      printf '%s\n' "${output}" | grep -Fq "${expected_path}"
      test "$(LD_LIBRARY_PATH="${cups_library_path}" "${snmp_smoke}")" = \
        "${expected_community}"
    }

    printf '%s\n' 'Community vendor' > /usr/lib/cups/snmp.conf
    check_snmp_tier /usr/lib/cups/snmp.conf vendor

    printf '%s\n' 'Community transient' > /run/cups/snmp.conf
    check_snmp_tier /run/cups/snmp.conf transient

    printf '%s\n' 'Community administrator' > /etc/cups/snmp.conf
    check_snmp_tier /etc/cups/snmp.conf administrator

    : > /etc/cups/snmp.conf
    check_snmp_tier /etc/cups/snmp.conf public

    snmp_explicit="${WORK_DIR}/cups-snmp-explicit"
    mkdir -p "${snmp_explicit}"
    printf '%s\n' 'Community explicit' > "${snmp_explicit}/snmp.conf"
    output="$(CUPS_SERVERROOT="${snmp_explicit}" \
      LD_LIBRARY_PATH="${cups_library_path}" "${snmp_backend}" 2>&1)"
    printf '%s\n' "${output}" | grep -Fq "${snmp_explicit}/snmp.conf"
    test "$(CUPS_SERVERROOT="${snmp_explicit}" \
      LD_LIBRARY_PATH="${cups_library_path}" "${snmp_smoke}")" = explicit

    rm /etc/cups/snmp.conf
    output="$(CUPS_SERVERROOT=/etc/cups \
      LD_LIBRARY_PATH="${cups_library_path}" "${snmp_backend}" 2>&1)"
    printf '%s\n' "${output}" | grep -Fq /etc/cups/snmp.conf
    test "$(CUPS_SERVERROOT=/etc/cups \
      LD_LIBRARY_PATH="${cups_library_path}" "${snmp_smoke}")" = public

    # client.conf, cupsfilter, cupsctl, and the mailto notifier now share the
    # libcups selector, so each must see a vendor or transient file that only
    # the scheduler used to see.
    cat > "${WORK_DIR}/cups-client-smoke.c" <<'EOF'
    #include <stdio.h>
    #include <cups/cups.h>
    int main(void) {
      puts(cupsServer());
      return 0;
    }
    EOF
    gcc \
      -I"${OUT_DIR}/usr/include" \
      -L"${OUT_DIR}/usr/lib" \
      -Wl,-rpath,"${OUT_DIR}/usr/lib" \
      -o "${WORK_DIR}/cups-client-smoke" \
      "${WORK_DIR}/cups-client-smoke.c" \
      -lcups

    client_smoke="${WORK_DIR}/cups-client-smoke"
    check_client_tier() {
      actual="$(LD_LIBRARY_PATH="${cups_library_path}" "${client_smoke}")"
      if [ "${actual}" != "$1" ]; then
        printf 'client.conf: expected ServerName %s, got %s\n' "$1" "${actual}" >&2
        exit 1
      fi
    }

    rm -f /etc/cups/client.conf /run/cups/client.conf /usr/lib/cups/client.conf
    printf 'ServerName uapi-vendor\n' > /usr/lib/cups/client.conf
    check_client_tier uapi-vendor
    printf 'ServerName uapi-transient\n' > /run/cups/client.conf
    check_client_tier uapi-transient
    printf 'ServerName uapi-admin\n' > /etc/cups/client.conf
    check_client_tier uapi-admin
    rm /etc/cups/client.conf /run/cups/client.conf /usr/lib/cups/client.conf

    printf 'cups UAPI smoke: cupsd, snmp, and client.conf honoured all tiers\n'

    daemon_root="${WORK_DIR}/cups-daemon-smoke"
    daemon_socket="${daemon_root}/cups.sock"
    mkdir -p \
      "${daemon_root}/cache" \
      "${daemon_root}/request" \
      "${daemon_root}/server" \
      "${daemon_root}/state" \
      "${daemon_root}/tmp"
    chmod 777 \
      "${daemon_root}" \
      "${daemon_root}/cache" \
      "${daemon_root}/request" \
      "${daemon_root}/server" \
      "${daemon_root}/state" \
      "${daemon_root}/tmp"

    cat > "${daemon_root}/server/cupsd.conf" <<EOF
    Listen ${daemon_socket}
    Browsing Off
    WebInterface No
    <Location />
      Order allow,deny
      Allow all
    </Location>
    EOF
    cat > "${daemon_root}/server/cups-files.conf" <<EOF
    User nobody
    Group nobody
    SystemGroup root
    AccessLog stderr
    ErrorLog stderr
    PageLog stderr
    CacheDir ${daemon_root}/cache
    DataDir ${OUT_DIR}/usr/share/cups
    DocumentRoot ${OUT_DIR}/usr/share/doc/cups
    RequestRoot ${daemon_root}/request
    ServerBin ${OUT_DIR}/usr/lib/cups
    StateDir ${daemon_root}/state
    TempDir ${daemon_root}/tmp
    EOF

    LD_LIBRARY_PATH="${cups_library_path}" \
      "${cupsd_bin}" -f \
      -c "${daemon_root}/server/cupsd.conf" \
      -s "${daemon_root}/server/cups-files.conf" \
      > "${daemon_root}/cupsd.log" 2>&1 &
    cups_pid=$!

    attempts=0
    while [ ! -S "${daemon_socket}" ]; do
      kill -0 "${cups_pid}"
      attempts=$((attempts + 1))
      test "${attempts}" -lt 100
      sleep 0.05
    done

    output="$(CUPS_SERVER="${daemon_socket}" \
      LD_LIBRARY_PATH="${cups_library_path}" \
      "${OUT_DIR}/usr/bin/lpstat" -r)"
    test "${output}" = 'scheduler is running'
    kill "${cups_pid}"
    wait "${cups_pid}" || true
    cups_pid=

    cleanup_cups_smoke
    trap - EXIT HUP INT TERM

    find ${OUT_DIR} -type f -executable -exec strip --strip-unneeded {} \; 2>/dev/null || true
    find ${OUT_DIR} -name '*.a' -exec objcopy --enable-deterministic-archives {} \; 2>/dev/null || true
    find "${OUT_DIR}" -exec touch -d "2024-01-01T00:00:00+00:00" {} \;

