build:
  environment: 248c5014338ab55a89b9c261e303e111e6847aec
  profile: [4121:1293, 8259:3464, 12365:8137, 16470:12421, 20584:14784, 24709:15195, 28464:17758]

  script: |
    tar --no-same-owner -xf /${SOURCE_libarchive} -C "${WORK_DIR}" --strip-components=1
    cd ${WORK_DIR}

    ./configure \
      --prefix=/usr \
      --disable-static \
      --without-nettle \
      --without-libb2

    make
    make DESTDIR="${OUT_DIR}" install

    find ${OUT_DIR} -type f -executable -exec strip --strip-unneeded {} \; 2>/dev/null || true
    find ${OUT_DIR} -name '*.la' -delete
    find ${OUT_DIR} -name '*.a' -exec objcopy --enable-deterministic-archives {} \; 2>/dev/null || true
    find "${OUT_DIR}" -exec touch -d "2024-01-01T00:00:00+00:00" {} \;

bundles:
  dev:
  - bin
  - dev
  - lib

