package:
  schema: 1
  name: libslirp
  slug: libslirp
  namespace: libs/net
  version: 4.9.3
  description: User-mode networking library used by rootless containers and virtual machines
  homepage: https://gitlab.freedesktop.org/slirp/libslirp
  checksum: 60b5aad4964cf9192ce9492b95fa90270df4981c0f660c4f2cc2851c27e0de07

sources:
- name: libslirp
  url: https://gitlab.freedesktop.org/slirp/libslirp/-/archive/v4.9.3/libslirp-v4.9.3.tar.gz
  sha256: ee698ca4ce05217ca7d520c7f0b1b1228fd7d32922dd32d1051c347152588417

dependencies:
- name: glibc
  commit: x86_64/pkg/libs/system/glibc/2.39/bundles/dev
- name: gcc
  commit: x86_64/pkg/core/toolchain/gcc/13.2.0/bundles/dev
- name: binutils
  commit: x86_64/pkg/core/toolchain/binutils/2.42/bundles/dev
- name: bash
  commit: x86_64/pkg/cli/shells/bash/5.2.21/bundles/dev
- name: coreutils
  commit: x86_64/pkg/core/userland/coreutils/9.5/bundles/dev
- name: findutils
  commit: x86_64/pkg/core/userland/findutils/4.9.0/bundles/dev
- name: tar
  commit: x86_64/pkg/cli/archive/tar/1.35/bundles/dev
- name: gzip
  commit: x86_64/pkg/cli/archive/gzip/1.13/bundles/dev
- name: meson
  commit: x86_64/pkg/core/toolchain/meson/1.6.1/bundles/dev
- name: ninja
  commit: x86_64/pkg/core/toolchain/ninja/1.12.1/bundles/dev
- name: python3
  commit: x86_64/pkg/dev/lang/python3/3.12.2/bundles/dev
- name: pkgconf
  commit: x86_64/pkg/core/toolchain/pkgconf/2.2.0/bundles/dev
- name: glib2
  commit: x86_64/pkg/dev/libs/glib2/2.84.0/bundles/dev
- name: pcre2
  commit: x86_64/pkg/dev/libs/pcre2/10.44/bundles/dev
- name: libffi
  commit: x86_64/pkg/libs/system/libffi/3.4.6/bundles/dev
- name: linux-headers
  commit: x86_64/pkg/libs/system/linux-headers/6.4.1/bundles/dev

build:
  environment: 248c5014338ab55a89b9c261e303e111e6847aec
  profile: [4114:33117, 4114:33811]

  script: |
    set -eu

    tar --no-same-owner -xf "/./${SOURCE_libslirp}" -C "${WORK_DIR}" --strip-components=1
    cd "${WORK_DIR}"
    printf '4.9.3\n' > .tarball-version
    python3 -c 'from pathlib import Path; p = Path("meson.build"); s = p.read_text(); p.write_text(s.replace("full_version = r.stdout().strip()", "full_version = meson.project_version()"))'

    meson setup build \
      --prefix=/usr \
      --libdir=lib \
      --buildtype=release

    ninja -C build
    DESTDIR="${OUT_DIR}" ninja -C build install

    find "${OUT_DIR}" -type f -executable -exec strip --strip-unneeded {} \; 2>/dev/null || true
    find "${OUT_DIR}" -name '*.a' -exec objcopy --enable-deterministic-archives {} \; 2>/dev/null || true
    find "${OUT_DIR}" -exec touch -d "2024-01-01T00:00:00+00:00" {} \;

bundles:
  dev:
  - dev
  - lib

  full:
  - dev
  - lib

outputs:
  dev:
    files:
    - path: /usr/include/slirp/libslirp-version.h
    - path: /usr/include/slirp/libslirp.h
    - path: /usr/lib/pkgconfig/slirp.pc

  lib:
    files:
    - path: /usr/lib/libslirp.so
      needs:
      - /usr/lib/libc.so.6
      - /usr/lib/libglib-2.0.so.0
    - path: /usr/lib/libslirp.so.0
      needs:
      - /usr/lib/libc.so.6
      - /usr/lib/libglib-2.0.so.0
    - path: /usr/lib/libslirp.so.0.4.0
      needs:
      - /usr/lib/libc.so.6
      - /usr/lib/libglib-2.0.so.0

resolution:
  /usr/lib/libglib-2.0.so.0: glib2
  /usr/lib/libc.so.6: glibc
