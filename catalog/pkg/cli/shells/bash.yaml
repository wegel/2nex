build:
  environment: 248c5014338ab55a89b9c261e303e111e6847aec
  profile: [4124:1478, 12353:8360, 25642:14739, 43460:14870, 56703:15008, 69663:15039, 82109:15129, 103838:18446, 124970:19993, 136743:20398]

  script: |
    tar --no-same-owner -xf ${SOURCE_bash} -C "${WORK_DIR}" --strip-components=1
    cd ${WORK_DIR}

    patch --batch --fuzz=0 -Np1 -i /./${SOURCE_patch}
    patch --batch --fuzz=0 -Np1 -i "/${SOURCE_uapi_profile}"

    ./configure --prefix=/usr             \
            --without-bash-malloc     \
            --with-installed-readline \
            bash_cv_strtold_broken=no \
            --docdir=/usr/share/doc/bash-5.2.21

    make
    make DESTDIR=${OUT_DIR} install
    ln -sv bash ${OUT_DIR}/usr/bin/sh

    smoke_root="${WORK_DIR}/uapi-smoke-root"
    mkdir -p \
      "${smoke_root}/etc" \
      "${smoke_root}/root" \
      "${smoke_root}/run" \
      "${smoke_root}/usr/bin" \
      "${smoke_root}/usr/lib"
    ln -s usr/lib "${smoke_root}/lib64"
    cp "${OUT_DIR}/usr/bin/bash" "${smoke_root}/usr/bin/bash"
    cp -L \
      /usr/lib/ld-linux-x86-64.so.2 \
      /usr/lib/libc.so.6 \
      /usr/lib/libncursesw.so.6 \
      "${smoke_root}/usr/lib/"

    cat > "${WORK_DIR}/uapi-chroot.c" << 'EOF'
    #include <stdio.h>
    #include <unistd.h>

    int main(int argc, char **argv) {
      if (argc < 3 || chroot(argv[1]) != 0 || chdir("/") != 0) {
        perror("uapi-chroot");
        return 1;
      }
      execv(argv[2], &argv[2]);
      perror("execv");
      return 1;
    }
    EOF
    gcc -O2 -o "${WORK_DIR}/uapi-chroot" "${WORK_DIR}/uapi-chroot.c"

    printf 'uapi_test_tier=vendor\n' > "${smoke_root}/usr/lib/profile"
    HOME=/root "${WORK_DIR}/uapi-chroot" "${smoke_root}" \
      /usr/bin/bash --login -c \
      'test "$uapi_test_tier" = vendor'

    printf 'uapi_test_tier=transient\n' > "${smoke_root}/run/profile"
    HOME=/root "${WORK_DIR}/uapi-chroot" "${smoke_root}" \
      /usr/bin/bash --login -c \
      'test "$uapi_test_tier" = transient'

    printf 'uapi_test_tier=administrator\n' > "${smoke_root}/etc/profile"
    HOME=/root "${WORK_DIR}/uapi-chroot" "${smoke_root}" \
      /usr/bin/bash --login -c \
      'test "$uapi_test_tier" = administrator'

    : > "${smoke_root}/etc/profile"
    HOME=/root "${WORK_DIR}/uapi-chroot" "${smoke_root}" \
      /usr/bin/bash --login -c \
      'test -z "${uapi_test_tier+x}"'

    # Bash links its bundled Readline, so the system inputrc must follow the
    # same three tiers here as it does for the packaged Readline library.
    # `bind -v` prints the resulting variable, which names the tier that won.
    rm -f "${smoke_root}/etc/profile" "${smoke_root}/run/profile" \
      "${smoke_root}/usr/lib/profile"

    assert_inputrc_tier() {
      expected="$1"
      actual=$(HOME=/root "${WORK_DIR}/uapi-chroot" "${smoke_root}" \
        /usr/bin/bash -i -c 'bind -v' 2>/dev/null \
        | sed -n 's/^set completion-prefix-display-length //p')
      if [ "${actual}" != "${expected}" ]; then
        printf 'bash inputrc smoke: expected %s, got %s\n' \
          "${expected}" "${actual}" >&2
        exit 1
      fi
    }

    printf 'set completion-prefix-display-length 31\n' \
      > "${smoke_root}/usr/lib/inputrc"
    assert_inputrc_tier 31

    printf 'set completion-prefix-display-length 32\n' \
      > "${smoke_root}/run/inputrc"
    assert_inputrc_tier 32

    printf 'set completion-prefix-display-length 33\n' \
      > "${smoke_root}/etc/inputrc"
    assert_inputrc_tier 33

    # An empty administrator file is read successfully and masks both lower
    # files, leaving the compiled default of 0.
    : > "${smoke_root}/etc/inputrc"
    assert_inputrc_tier 0

    rm -f "${smoke_root}/etc/inputrc" "${smoke_root}/run/inputrc" \
      "${smoke_root}/usr/lib/inputrc"
    assert_inputrc_tier 0

    printf 'bash UAPI smoke: profile and inputrc honoured all tiers\n'

    find ${OUT_DIR} -type f -executable -exec strip --strip-unneeded {} \; 2>/dev/null || true
    find ${OUT_DIR} -name '*.a' -exec objcopy --enable-deterministic-archives {} \; 2>/dev/null || true
    find "${OUT_DIR}" -exec touch -d "2024-01-01T00:00:00+00:00" {} \;

