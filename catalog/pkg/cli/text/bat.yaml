package:
  schema: 1
  name: bat
  slug: bat
  namespace: cli/text
  version: 0.26.1
  description: A cat clone with syntax highlighting and Git integration
  homepage: https://github.com/sharkdp/bat
  checksum: ca4729fe8bf863aef6709d98ad33062e546bcbb1a6cf70976b16d648ec7eef77

sources:
- name: bat
  url: https://github.com/sharkdp/bat/archive/refs/tags/v0.26.1.tar.gz
  sha256: 4474de87e084953eefc1120cf905a79f72bbbf85091e30cf37c9214eafcaa9c9
- name: vendor
  sha256: 876bb03f99836f3f4b0457220ea9b923160ccc4c7e98709abfaf7e4d91ee6c8c
  cargo_lock: https://raw.githubusercontent.com/sharkdp/bat/v0.26.1/Cargo.lock
- name: uapi_config
  file: pkg/cli/text/bat-uapi-config.patch
  sha256: cd78e05ea76bc578b926ab1b721bbcf0fa1f2a3cdb593a1f30dc4d9e96b03e10

dependencies:
- name: bash
  commit: x86_64/pkg/cli/shells/bash/5.2.21/bundles/dev
- name: coreutils
  commit: x86_64/pkg/core/userland/coreutils/9.5/bundles/dev
- name: findutils
  commit: x86_64/pkg/core/userland/findutils/4.9.0/bundles/dev
- name: gzip
  commit: x86_64/pkg/cli/archive/gzip/1.13/bundles/dev
- name: tar
  commit: x86_64/pkg/cli/archive/tar/1.35/bundles/dev
- name: binutils
  commit: x86_64/pkg/core/toolchain/binutils/2.42/bundles/dev
- name: glibc
  commit: x86_64/pkg/libs/system/glibc/2.39/bundles/dev
- name: gcc
  commit: x86_64/pkg/core/toolchain/gcc/13.2.0/bundles/dev
- name: rust-bin
  commit: x86_64/pkg/dev/lang/rust-bin/1.91.1/bundles/dev
- name: ncurses
  commit: x86_64/pkg/libs/system/ncurses/6.4-20230520/bundles/dev
- name: acl
  commit: x86_64/pkg/libs/system/acl/2.3.2/bundles/dev
- name: attr
  commit: x86_64/pkg/libs/system/attr/2.5.2/bundles/dev
- name: zlib
  commit: x86_64/pkg/libs/system/zlib/1.3.1/bundles/dev
- name: linux-headers
  commit: x86_64/pkg/libs/system/linux-headers/6.4.1/bundles/dev
- name: oniguruma
  commit: x86_64/pkg/libs/text/oniguruma/6.9.10/bundles/dev
- name: pkgconf
  commit: x86_64/pkg/core/toolchain/pkgconf/2.2.0/bundles/dev
- name: libgit2
  commit: x86_64/pkg/dev/libs/libgit2/1.9.1/bundles/dev
- name: openssl3
  commit: x86_64/pkg/dev/libs/openssl3/3.3.1/bundles/dev
- name: pcre2
  commit: x86_64/pkg/dev/libs/pcre2/10.44/bundles/dev
- name: patch
  commit: x86_64/pkg/core/toolchain/patch/2.7.6/bundles/dev

build:
  environment: 248c5014338ab55a89b9c261e303e111e6847aec
  profile: [4109:7040, 5476:38277]

  script: |
    tar --no-same-owner -xf ${SOURCE_bat} -C "${WORK_DIR}" --strip-components=1
    cd ${WORK_DIR}

    patch --batch --fuzz=0 -Np1 -i "/${SOURCE_uapi_config}"

    tar --no-same-owner -xf /./${SOURCE_vendor} -C "${WORK_DIR}"

    export CARGO_HOME="${WORK_DIR}/.cargo"
    mkdir -p "${CARGO_HOME}"

    cat > "${CARGO_HOME}/config.toml" << EOF
    [source.crates-io]
    replace-with = "vendored-sources"

    [source.vendored-sources]
    directory = "vendor"
    EOF

    mkdir -p /usr/local/bin
    ln -sf /usr/bin/gcc /usr/local/bin/cc
    ln -sf /usr/bin/ld.bfd /usr/local/bin/ld
    export PATH="/usr/local/bin:${PATH}"
    export CARGO_TARGET_X86_64_UNKNOWN_LINUX_GNU_LINKER=gcc
    export RUSTFLAGS="-C codegen-units=1 -C embed-bitcode=yes -C debuginfo=0"
    export PKG_CONFIG_PATH="/usr/lib/pkgconfig"
    export RUSTONIG_SYSTEM_LIBONIG=1
    export LIBGIT2_NO_VENDOR=1
    export LIBGIT2_SYS_USE_PKG_CONFIG=1

    cargo build --release --offline --target x86_64-unknown-linux-gnu

    mkdir -p ${OUT_DIR}/usr/bin
    install -m 755 target/x86_64-unknown-linux-gnu/release/bat ${OUT_DIR}/usr/bin/bat

    strip --strip-unneeded ${OUT_DIR}/usr/bin/bat

    # --style=header is silent when stdout is not a tty even with
    # --decorations=always on bat 0.26, so the smoke uses --line-range
    # instead: each tier keeps a different number of lines from a
    # three-line file.
    mkdir -p /etc/bat /run/bat /usr/lib/bat
    unset BAT_CONFIG_PATH
    export HOME="${WORK_DIR}/bat-smoke-home"
    mkdir -p "${HOME}"

    vendor=/usr/lib/bat/config
    runtime=/run/bat/config
    admin=/etc/bat/config
    smoke_file="${WORK_DIR}/bat-smoke.txt"
    printf 'L1\nL2\nL3\n' > "${smoke_file}"
    rm -f "${vendor}" "${runtime}" "${admin}"

    run_and_expect() {
      desc="$1"
      expect="$2"
      if ! out=$("${OUT_DIR}/usr/bin/bat" --paging=never --style=plain \
        --decorations=never "${smoke_file}" 2>&1); then
        printf 'bat UAPI smoke: expected a clean run for %s\n' "${desc}" >&2
        printf '%s\n' "${out}" >&2
        exit 1
      fi
      if [ "${out}" != "${expect}" ]; then
        printf 'bat UAPI smoke: expected [%s] for %s, got [%s]\n' \
          "${expect}" "${desc}" "${out}" >&2
        exit 1
      fi
    }

    printf -- '--line-range=1:1\n' > "${vendor}"
    run_and_expect "vendor alone" $'L1'

    printf -- '--line-range=1:2\n' > "${runtime}"
    run_and_expect "vendor and runtime present" $'L1\nL2'

    printf -- '--line-range=1:3\n' > "${admin}"
    run_and_expect "vendor, runtime and admin present" $'L1\nL2\nL3'

    rm -f "${admin}"
    run_and_expect "admin removed uncovers runtime" $'L1\nL2'

    rm -f "${vendor}" "${runtime}" "${admin}" "${smoke_file}"
    printf 'bat UAPI smoke: the config loader read all three tiers in order\n'

    find "${OUT_DIR}" -exec touch -d '2024-01-01T00:00:00+00:00' {} \;

bundles:
  dev:
  - bin

outputs:
  bin:
    files:
    - path: /usr/bin/bat
      needs:
      - /usr/lib/ld-linux-x86-64.so.2
      - /usr/lib/libc.so.6
      - /usr/lib/libgcc_s.so.1
      - /usr/lib/libgit2.so.1.9
      - /usr/lib/libm.so.6
      - /usr/lib/libonig.so.5

resolution:
  /usr/lib/libgcc_s.so.1: gcc
  /usr/lib/ld-linux-x86-64.so.2: glibc
  /usr/lib/libc.so.6: glibc
  /usr/lib/libm.so.6: glibc
  /usr/lib/libgit2.so.1.9: libgit2
  /usr/lib/libonig.so.5: oniguruma
