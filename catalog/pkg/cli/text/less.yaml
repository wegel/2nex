build:
  environment: 248c5014338ab55a89b9c261e303e111e6847aec
  profile: [4225:2203, 8331:2205, 12442:2211, 16560:3137, 16956:3161]

  script: |
    tar --no-same-owner -xf ${SOURCE_less} -C "${WORK_DIR}" --strip-components=1
    cd ${WORK_DIR}

    patch --batch --fuzz=0 -Np1 -i "/${SOURCE_uapi_config}"

    ./configure --prefix=/usr --sysconfdir=/etc
    make
    make DESTDIR=$OUT_DIR install

    # The system lesskey file must come from /etc, then /run, then /usr/lib.
    # Each tier sets LESSOPEN to a different input preprocessor, and the
    # preprocessor output names the tier that the pager actually selected.
    mkdir -p /etc /run /usr/lib
    rm -f /etc/syslesskey /run/syslesskey /usr/lib/syslesskey
    printf 'plain\n' > "${WORK_DIR}/less-uapi-input"

    write_key() {
        printf '#env\nLESSOPEN = |echo TIER_%s %%s\n' "$2" > "$1"
    }

    expect_tier() {
        expected=$1
        actual=$(env -u LESSOPEN -u LESSKEYIN_SYSTEM -u LESSKEY_SYSTEM \
            "${OUT_DIR}/usr/bin/less" "${WORK_DIR}/less-uapi-input" | head -1)
        case "${actual}" in
            "${expected}"*) ;;
            *)
                printf 'less UAPI smoke: expected %s, got %s\n' \
                    "${expected}" "${actual}" >&2
                exit 1
                ;;
        esac
    }

    write_key /usr/lib/syslesskey vendor
    expect_tier 'TIER_vendor'

    write_key /run/syslesskey runtime
    expect_tier 'TIER_runtime'

    write_key /etc/syslesskey admin
    expect_tier 'TIER_admin'

    # An empty administrator file masks both lower tiers, so no preprocessor
    # runs and the pager shows the input file itself.
    : > /etc/syslesskey
    expect_tier 'plain'

    rm -f /etc/syslesskey /run/syslesskey /usr/lib/syslesskey
    expect_tier 'plain'

    # An explicit override outranks all three tiers.
    write_key /usr/lib/syslesskey vendor
    write_key "${WORK_DIR}/explicit-syslesskey" explicit
    actual=$(env -u LESSOPEN \
        LESSKEYIN_SYSTEM="${WORK_DIR}/explicit-syslesskey" \
        "${OUT_DIR}/usr/bin/less" "${WORK_DIR}/less-uapi-input" | head -1)
    case "${actual}" in
        TIER_explicit*) ;;
        *)
            printf 'less UAPI smoke: LESSKEYIN_SYSTEM ignored, got %s\n' \
                "${actual}" >&2
            exit 1
            ;;
    esac
    rm -f /usr/lib/syslesskey

    printf 'less UAPI smoke: all tiers, mask, and override behaved\n'

    find ${OUT_DIR} -type f -executable -exec strip --strip-unneeded {} \; 2>/dev/null || true
    find ${OUT_DIR} -name '*.a' -exec objcopy --enable-deterministic-archives {} \; 2>/dev/null || true
    find "${OUT_DIR}" -exec touch -d "2024-01-01T00:00:00+00:00" {} \;

bundles:
  dev:
  - bin

  full:
  - bin
  - man

outputs:
  bin:
    files:
    - path: /usr/bin/less
      needs:
      - /usr/lib/ld-linux-x86-64.so.2
      - /usr/lib/libc.so.6
      - /usr/lib/libncursesw.so.6
    - path: /usr/bin/lessecho
      needs:
      - /usr/lib/ld-linux-x86-64.so.2
      - /usr/lib/libc.so.6
    - path: /usr/bin/lesskey
      needs:
      - /usr/lib/ld-linux-x86-64.so.2
      - /usr/lib/libc.so.6

  man:
    files:
    - path: /usr/share/man/man1/less.1
    - path: /usr/share/man/man1/lessecho.1
    - path: /usr/share/man/man1/lesskey.1

resolution:
  /usr/lib/ld-linux-x86-64.so.2: glibc
  /usr/lib/libc.so.6: glibc
  /usr/lib/libncursesw.so.6: ncurses
