  schema: 1
  name: Less
  slug: less
  namespace: cli/text
  version: "643"
  description: A text file viewer
  homepage: https://www.greenwoodsoftware.com/less/
  checksum: 714605869d75eb6bb8024d6cc51cebc4a144b10dd492655db5e56f5d606e03e3

sources:
- name: less
  url: https://www.greenwoodsoftware.com/less/less-643.tar.gz
  sha256: 2911b5432c836fa084c8a2e68f6cd6312372c026a58faaa98862731c8b6052e8
- name: uapi_config
  file: pkg/cli/text/less-uapi-config.patch
  sha256: c82a30830c5b3c963201b768c3e683a79e88b3d8f2f1f45bc061d149ec2b722f

