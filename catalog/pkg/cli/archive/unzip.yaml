package:
  schema: 1
  name: unzip
  slug: unzip
  namespace: cli/archive
  version: "6.0"
  description: Extract files from ZIP archives
  homepage: https://infozip.sourceforge.net/UnZip.html
  checksum: 2dae326d062698daa10f0a15d7dca7da928340bf5b21ae7d2a89f1bd3695f0d4

sources:
- name: unzip
  url: https://downloads.sourceforge.net/infozip/unzip60.tar.gz
  sha256: 036d96991646d0449ed0aa952e4fbe21b476ce994abc276e49d30e686708bd37

dependencies:
- name: glibc
  commit: x86_64/pkg/libs/system/glibc/2.39/bundles/dev
- name: gmp
  commit: x86_64/pkg/libs/system/gmp/6.3.0/bundles/dev
- name: zlib
  commit: x86_64/pkg/libs/system/zlib/1.3.1/bundles/dev
- name: linux-headers
  commit: x86_64/pkg/libs/system/linux-headers/6.4.1/bundles/dev
- name: gcc
  commit: x86_64/pkg/core/toolchain/gcc/13.2.0/bundles/dev
- name: binutils
  commit: x86_64/pkg/core/toolchain/binutils/2.42/bundles/dev
- name: bash
  commit: x86_64/pkg/cli/shells/bash/5.2.21/bundles/dev
- name: coreutils
  commit: x86_64/pkg/core/userland/coreutils/9.5/bundles/dev
- name: findutils
  commit: x86_64/pkg/core/userland/findutils/4.9.0/bundles/dev
- name: tar
  commit: x86_64/pkg/cli/archive/tar/1.35/bundles/dev
- name: acl
  commit: x86_64/pkg/libs/system/acl/2.3.2/bundles/dev
- name: attr
  commit: x86_64/pkg/libs/system/attr/2.5.2/bundles/dev
- name: make
  commit: x86_64/pkg/core/toolchain/make/4.4.1/bundles/dev
- name: ncurses
  commit: x86_64/pkg/libs/system/ncurses/6.4-20230520/bundles/dev
- name: gzip
  commit: x86_64/pkg/cli/archive/gzip/1.13/bundles/dev

build:
  environment: 248c5014338ab55a89b9c261e303e111e6847aec
  profile: [4283:3865, 8490:3995, 9975:7445]

  script: |
    tar --no-same-owner -xf /${SOURCE_unzip} -C "${WORK_DIR}" --strip-components=1
    cd ${WORK_DIR}

    make -f unix/Makefile CC=gcc generic LOCAL_UNZIP=-DLARGE_FILE_SUPPORT
    make -f unix/Makefile prefix="${OUT_DIR}/usr" MANDIR="${OUT_DIR}/usr/share/man/man1" install

    find ${OUT_DIR} -type f -executable -exec strip --strip-unneeded {} \; 2>/dev/null || true
    find ${OUT_DIR} -name '*.a' -exec objcopy --enable-deterministic-archives {} \; 2>/dev/null || true
    find "${OUT_DIR}" -exec touch -d "2024-01-01T00:00:00+00:00" {} \;

bundles:
  dev:
  - bin

outputs:
  bin:
    files:
    - path: /usr/bin/funzip
      needs:
      - /usr/lib/ld-linux-x86-64.so.2
      - /usr/lib/libc.so.6
    - path: /usr/bin/unzip
      needs:
      - /usr/lib/ld-linux-x86-64.so.2
      - /usr/lib/libc.so.6
    - path: /usr/bin/unzipsfx
      needs:
      - /usr/lib/ld-linux-x86-64.so.2
      - /usr/lib/libc.so.6
    - path: /usr/bin/zipgrep
    - path: /usr/bin/zipinfo
      needs:
      - /usr/lib/ld-linux-x86-64.so.2
      - /usr/lib/libc.so.6

  man:
    files:
    - path: /usr/share/man/man1/funzip.1
    - path: /usr/share/man/man1/unzip.1
    - path: /usr/share/man/man1/unzipsfx.1
    - path: /usr/share/man/man1/zipgrep.1
    - path: /usr/share/man/man1/zipinfo.1

resolution:
  /usr/lib/ld-linux-x86-64.so.2: glibc
  /usr/lib/libc.so.6: glibc
