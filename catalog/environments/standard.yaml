name: standard
description: Standard hardened build environment with full chroot isolation

execution:
  chroot: true

paths:
  work: nex/work
  out: nex/out
  inputs: inputs

env:
  HOME: /homeless/deterministic
  LC_ALL: C
  TZ: UTC
  LANG: en_US.UTF-8
  SOURCE_DATE_EPOCH: "1704067200"
  GLIBC_TUNABLES: glibc.cpu.hwcaps=-RNDRAND
  MAKEFLAGS: "-j{num_cpus}"
  PATH: /usr/sbin:/usr/bin:/sbin:/bin
  TARGET: x86_64-pc-linux-gnu
  WORK_DIR: /nex/work
  OUT_DIR: /nex/out
  RUSTC_BOOTSTRAP: "1"
  AR: gcc-ar
  NM: gcc-nm
  RANLIB: gcc-ranlib
  CFLAGS: "-march=x86-64 -mtune=generic -O2 -pipe -fno-plt -fexceptions -Wp,-D_FORTIFY_SOURCE=2 -Wformat -Werror=format-security -fstack-clash-protection -fcf-protection -fPIC -fno-common -fno-omit-frame-pointer -frandom-seed=424242 -flto=auto"
  CXXFLAGS: "-march=x86-64 -mtune=generic -O2 -pipe -fno-plt -fexceptions -Wp,-D_FORTIFY_SOURCE=2 -Wformat -Werror=format-security -fstack-clash-protection -fcf-protection -Wp,-D_GLIBCXX_ASSERTIONS -fPIC -fno-common -fno-omit-frame-pointer -frandom-seed=424242 -flto=auto"
  LDFLAGS: "-Wl,-O1,--sort-common,--as-needed,-z,relro,-z,now -flto=auto"
  RUSTFLAGS: "-C codegen-units=1 -C embed-bitcode=yes -C debuginfo=0 -C link-args=-fuse-ld=lld -C target-feature=+crt-static -C link-args=-frandom-seed=424242"
  DEBUG_CFLAGS: "-g"
  DEBUG_CXXFLAGS: "-g"
  DEBUG_RUSTFLAGS: "-C debuginfo=2"

preamble: |
  if ! read -r current_hostname < /proc/sys/kernel/hostname; then
      echo 'Warning: Could not read current hostname; forcing to nex-builder' >&2
      current_hostname=""
  fi

  if [ "$current_hostname" != "nex-builder" ]; then
      echo 'Setting hostname to nex-builder'
      if ! hostname nex-builder; then
          echo 'Warning: Failed to run hostname command' >&2
      fi
  fi

  mkdir -p {build_dir}/dev
  for D in null zero random urandom tty console full; do
      touch {build_dir}/dev/$D
      mount --bind /dev/$D {build_dir}/dev/$D
  done

  mkdir -p {build_dir}/dev/pts
  mount -t devpts devpts {build_dir}/dev/pts
  ln -sf /dev/pts/ptmx {build_dir}/dev/ptmx

  mkdir -p {build_dir}/proc
  mount -t proc proc {build_dir}/proc

  # remove symlinks for usrmerge compatibility (only remove if symlink, not dir)
  if [ -L {build_dir}/lib ]; then
      rm -f {build_dir}/lib
  fi

  if [ -L {build_dir}/lib64 ]; then
      rm -f {build_dir}/lib64
  fi

  if [ -L {build_dir}/sbin ]; then
      rm -f {build_dir}/sbin
  fi

  if [ -L {build_dir}/usr/lib64 ]; then
      rm -f {build_dir}/usr/lib64
  fi

  if [ -L {build_dir}/usr/sbin ]; then
      rm -f {build_dir}/usr/sbin
  fi

  mkdir -p {build_dir}/usr

  if [ ! -e {build_dir}/bin ]; then
      ln -sf /usr/bin {build_dir}/bin
  fi

  if [ ! -e {build_dir}/lib ]; then
      ln -sf /usr/lib {build_dir}/lib
  fi

  if [ ! -e {build_dir}/sbin ]; then
      ln -sf /usr/bin {build_dir}/sbin
  fi

  if [ ! -e {build_dir}/lib64 ]; then
      ln -sf /usr/lib {build_dir}/lib64
  fi

  if [ ! -e {build_dir}/usr/lib64 ]; then
      ln -sf lib {build_dir}/usr/lib64
  fi

  if [ ! -e {build_dir}/usr/sbin ]; then
      ln -sf bin {build_dir}/usr/sbin
  fi

  # create same FHS symlinks in /target for system builds
  if [ -d {build_dir}/target ]; then
      mkdir -p {build_dir}/target/usr

      if [ ! -e {build_dir}/target/bin ]; then
          ln -sf /usr/bin {build_dir}/target/bin
      fi

      if [ ! -e {build_dir}/target/lib ]; then
          ln -sf /usr/lib {build_dir}/target/lib
      fi

      if [ ! -e {build_dir}/target/sbin ]; then
          ln -sf /usr/bin {build_dir}/target/sbin
      fi

      if [ ! -e {build_dir}/target/lib64 ]; then
          ln -sf /usr/lib {build_dir}/target/lib64
      fi

      if [ ! -e {build_dir}/target/usr/lib64 ]; then
          ln -sf lib {build_dir}/target/usr/lib64
      fi

      if [ ! -e {build_dir}/target/usr/sbin ]; then
          ln -sf bin {build_dir}/target/usr/sbin
      fi
  fi

  # regenerate ld.so.cache so dynamic linker can find all libraries from dependencies
  # (required for tools like glib-compile-resources that dlopen gdk-pixbuf loaders)
  if [ -x {build_dir}/usr/bin/ldconfig ]; then
      mkdir -p {build_dir}/etc
      if [ ! -e {build_dir}/etc/ld.so.cache ]; then
          {build_dir}/usr/bin/ldconfig -r {build_dir}
      else
          echo 'Warning: skipping ldconfig cache refresh because /etc/ld.so.cache already exists' >&2
      fi
  fi
