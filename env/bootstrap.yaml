name: bootstrap
description: Bootstrap build environment for building toolchain on host filesystem

execution:
  chroot: false
  fixed_build_dir: true
  sequential: true

env:
  HOME: /homeless/deterministic
  LC_ALL: C
  TZ: UTC
  LANG: en_US.UTF-8
  SOURCE_DATE_EPOCH: "1704067200"
  GLIBC_TUNABLES: glibc.cpu.hwcaps=-RNDRAND
  MAKEFLAGS: "-j{num_cpus}"
  PATH: "/tmp/bootstrap/bootstrap/tools/bin:/usr/bin"
  TARGET: x86_64-2nex-linux-gnu
  WORK_DIR: "/tmp/bootstrap/2nex/work"
  OUT_DIR: "/tmp/bootstrap/2nex/out"
  BOOTSTRAP_TOOLS: "/tmp/bootstrap/bootstrap/tools"
  BOOTSTRAP_SYSROOT: "/tmp/bootstrap/bootstrap"
  CFLAGS: "-march=x86-64 -mtune=generic -O2 -frandom-seed=424242"
  CXXFLAGS: "-march=x86-64 -mtune=generic -O2 -frandom-seed=424242"
  LDFLAGS: "-L/tmp/bootstrap/usr/lib -Wl,-O1,--sort-common,--as-needed,-z,now"

preamble: |
  mount -t tmpfs tmpfs /tmp
  mkdir /tmp/bootstrap
  mount --bind {build_dir} /tmp/bootstrap
