build:
  script: |
    tar --no-same-owner -xf ${SOURCE_gperf} -C "${WORK_DIR}" --strip-components=1
    cd ${WORK_DIR}

    ./configure --prefix=/usr --docdir=/usr/share/doc/gperf-3.1

    make
    make DESTDIR=$OUT_DIR install
    
    find "${OUT_DIR}" -exec touch -d "2024-01-01T00:00:00+00:00" {} \;
    2nex_strip_binaries ${OUT_DIR}

bundles:
  full:
    - info
    - man
    - doc
    - bin
  dev:
    - bin

outputs:
  info:
    files:
    - /usr/share/info/gperf.info
  man:
    files:
    - /usr/share/man/man1/gperf.1
  doc:
    files:
    - /usr/share/doc/gperf-3.1/gperf.html
  bin:
    files:
    - /usr/bin/gperf
    requires:
    - x86_64/gcc/13.2.0/bootstrap/phase3/outputs/lib
    - x86_64/glibc/2.39/sys-libs/outputs/lib
