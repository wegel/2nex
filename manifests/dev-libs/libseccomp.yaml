package:
  schema: 1
  name: "libseccomp"
  slug: "libseccomp"
  flavor: "dev-libs"
  version: "2.5.6"
  description: "Enhanced seccomp library"
  homepage: "https://github.com/seccomp/libseccomp"
  checksum: e95283d740080704359174857626339f284c3801cdd5aa9220ca87fa47b9d791

sources:
  - name: "libseccomp"
    url: "https://github.com/seccomp/libseccomp/releases/download/v2.5.6/libseccomp-2.5.6.tar.gz"
    sha256: "04c37d72965dce218a0c94519b056e1775cf786b5260ee2b7992956c4ee38633"

dependencies:
- commit: x86_64/bash/5.2.21/app-shells/bundles/dev
  name: bash
- commit: x86_64/coreutils/9.5/sys-apps/bundles/dev
  name: coreutils
- commit: x86_64/findutils/4.9.0/sys-apps/bundles/dev
  name: findutils
- commit: x86_64/2nex-utilities-bootstrap/0.0.1/bootstrap/phase3/bundles/dev
  name: 2nex-utilities
- commit: x86_64/gawk/5.3.0/sys-apps/bundles/dev
  name: gawk
- commit: x86_64/grep/3.11/sys-apps/bundles/dev
  name: grep
- commit: x86_64/gzip/1.13/app-arch/bundles/dev
  name: gzip
- commit: x86_64/make/4.4.1/sys-devel/bundles/dev
  name: make
- commit: x86_64/sed/4.9/sys-apps/bundles/dev
  name: sed
- commit: x86_64/tar/1.35/app-arch/bundles/dev
  name: tar
- commit: x86_64/binutils/2.42/bootstrap/phase3/bundles/dev
  name: binutils
- commit: x86_64/glibc/2.39/sys-libs/bundles/dev
  name: glibc
- commit: x86_64/gcc/13.2.0/bootstrap/phase3/bundles/dev
  name: gcc
- commit: x86_64/linux-headers/6.4.1/bootstrap/phase3/bundles/dev
  name: linux-headers
- commit: x86_64/ncurses/6.4-20230520/bootstrap/phase3/bundles/dev
  name: ncurses
- commit: x86_64/inetutils/2.5/net-misc/bundles/dev
  name: inetutils
- commit: x86_64/attr/2.5.2/bootstrap/phase3/bundles/dev
  name: attr
- commit: x86_64/acl/2.3.2/bootstrap/phase3/bundles/dev
  name: acl
- commit: x86_64/mpc/1.2.1/bootstrap/phase3/bundles/dev
  name: mpc
- commit: x86_64/mpfr/4.2.1/bootstrap/phase3/bundles/dev
  name: mpfr
- commit: x86_64/gmp/6.3.0/sys-libs/bundles/dev
  name: gmp
- commit: x86_64/libcap/2.69/sys-apps/bundles/dev
  name: libcap
- commit: x86_64/zlib/1.3.1/bootstrap/phase3/bundles/dev
  name: zlib
- commit: x86_64/gperf/3.1/sys-devel/bundles/dev
  name: gperf
- commit: x86_64/file/5.45/bootstrap/phase3/bundles/dev
  name: file
- commit: x86_64/xz/5.4.6/bootstrap/phase3/bundles/dev
  name: xz
- commit: x86_64/bzip2/1.0.8/bootstrap/phase3/bundles/dev
  name: bzip2

build:
  script: |
    tar --no-same-owner -xf ${SOURCE_libseccomp} -C "${WORK_DIR}" --strip-components=1
    cd ${WORK_DIR}
    
    # Configure
    ./configure --prefix=/usr --disable-static
    
    # Build
    make
    
    # Install
    make DESTDIR="${OUT_DIR}" install
    
    # Set consistent timestamps for reproducible builds
    find "${OUT_DIR}" -exec touch -d '2024-01-01T00:00:00+00:00' {} \;
    2nex_strip_binaries ${OUT_DIR}

bundles:
  full:
    - bin
    - lib
    - man
    - dev
  dev:
    - bin
    - lib
    - dev

outputs:
  bin:
    files:
    - /usr/bin/scmp_sys_resolver
    requires:
    - x86_64/glibc/2.39/sys-libs/outputs/lib
  dev:
    files:
    - /usr/include/seccomp-syscalls.h
    - /usr/include/seccomp.h
    - /usr/lib/libseccomp.la
    - /usr/lib/pkgconfig/libseccomp.pc
  man:
    files:
    - /usr/share/man/man1/scmp_sys_resolver.1
    - /usr/share/man/man3/seccomp_api_get.3
    - /usr/share/man/man3/seccomp_api_set.3
    - /usr/share/man/man3/seccomp_arch_add.3
    - /usr/share/man/man3/seccomp_arch_exist.3
    - /usr/share/man/man3/seccomp_arch_native.3
    - /usr/share/man/man3/seccomp_arch_remove.3
    - /usr/share/man/man3/seccomp_arch_resolve_name.3
    - /usr/share/man/man3/seccomp_attr_get.3
    - /usr/share/man/man3/seccomp_attr_set.3
    - /usr/share/man/man3/seccomp_export_bpf.3
    - /usr/share/man/man3/seccomp_export_pfc.3
    - /usr/share/man/man3/seccomp_init.3
    - /usr/share/man/man3/seccomp_load.3
    - /usr/share/man/man3/seccomp_merge.3
    - /usr/share/man/man3/seccomp_notify_alloc.3
    - /usr/share/man/man3/seccomp_notify_fd.3
    - /usr/share/man/man3/seccomp_notify_free.3
    - /usr/share/man/man3/seccomp_notify_id_valid.3
    - /usr/share/man/man3/seccomp_notify_receive.3
    - /usr/share/man/man3/seccomp_notify_respond.3
    - /usr/share/man/man3/seccomp_release.3
    - /usr/share/man/man3/seccomp_reset.3
    - /usr/share/man/man3/seccomp_rule_add.3
    - /usr/share/man/man3/seccomp_rule_add_array.3
    - /usr/share/man/man3/seccomp_rule_add_exact.3
    - /usr/share/man/man3/seccomp_rule_add_exact_array.3
    - /usr/share/man/man3/seccomp_syscall_priority.3
    - /usr/share/man/man3/seccomp_syscall_resolve_name.3
    - /usr/share/man/man3/seccomp_syscall_resolve_name_arch.3
    - /usr/share/man/man3/seccomp_syscall_resolve_name_rewrite.3
    - /usr/share/man/man3/seccomp_syscall_resolve_num_arch.3
    - /usr/share/man/man3/seccomp_version.3
  lib:
    files:
    - /usr/lib/libseccomp.so
    - /usr/lib/libseccomp.so.2
    - /usr/lib/libseccomp.so.2.5.6
    requires:
    - x86_64/glibc/2.39/sys-libs/outputs/lib
