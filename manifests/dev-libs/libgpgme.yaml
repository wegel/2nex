package:
  schema: 1
  name: "GPGME"
  slug: "libgpgme"
  flavor: "dev-libs"
  version: "1.23.2"
  description: "GnuPG Made Easy - a library for making GnuPG easier to use"
  homepage: "https://gnupg.org/software/gpgme/"
  checksum: 77f7513891d72feacf2250737ce605a4ec5850f58ecac7f3cc7a5034535fe111

sources:
  - name: "gpgme"
    url: "https://gnupg.org/ftp/gcrypt/gpgme/gpgme-1.23.2.tar.bz2"
    sha256: "9499e8b1f33cccb6815527a1bc16049d35a6198a6c5fae0185f2bd561bce5224"

dependencies:
- commit: x86_64/bash/5.2.21/app-shells/bundles/dev
  name: bash
- commit: x86_64/coreutils/9.5/sys-apps/bundles/dev
  name: coreutils
- commit: x86_64/findutils/4.9.0/sys-apps/bundles/dev
  name: findutils
- commit: x86_64/2nex-utilities-bootstrap/0.0.1/bootstrap/phase3/bundles/dev
  name: 2nex-utilities
- commit: x86_64/gawk/5.3.0/sys-apps/bundles/dev
  name: gawk
- commit: x86_64/grep/3.11/sys-apps/bundles/dev
  name: grep
- commit: x86_64/make/4.4.1/sys-devel/bundles/dev
  name: make
- commit: x86_64/sed/4.9/sys-apps/bundles/dev
  name: sed
- commit: x86_64/tar/1.35/app-arch/bundles/dev
  name: tar
- commit: x86_64/binutils/2.42/bootstrap/phase3/bundles/dev
  name: binutils
- commit: x86_64/inetutils/2.5/net-misc/bundles/dev
  name: inetutils
- commit: x86_64/glibc/2.39/sys-libs/bundles/dev
  name: glibc
- commit: x86_64/gcc/13.2.0/bootstrap/phase3/bundles/dev
  name: gcc
- commit: x86_64/acl/2.3.2/sys-libs/bundles/dev
  name: acl
- commit: x86_64/attr/2.5.2/sys-libs/bundles/dev
  name: attr
- commit: x86_64/bzip2/1.0.8/bootstrap/phase3/bundles/dev
  name: bzip2
- commit: x86_64/gmp/6.3.0/sys-libs/bundles/dev
  name: gmp
- commit: x86_64/libcap/2.69/sys-apps/bundles/dev
  name: libcap
- commit: x86_64/mpfr/4.2.1/bootstrap/phase3/bundles/dev
  name: mpfr
- commit: x86_64/zlib/1.3.1/bootstrap/phase3/bundles/dev
  name: zlib
- commit: x86_64/linux-headers/6.4.1/bootstrap/phase3/bundles/dev
  name: linux-headers
- commit: x86_64/mpc/1.2.1/bootstrap/phase3/bundles/dev
  name: mpc
- commit: x86_64/ncurses/6.4-20230520/sys-libs/bundles/dev
  name: ncurses
- commit: x86_64/libgpg-error/1.51/dev-libs/bundles/dev
  name: libgpg-error
- commit: x86_64/libassuan/2.5.7/dev-libs/bundles/dev
  name: libassuan

build:
  script: |
    tar --no-same-owner -xf ${SOURCE_gpgme} -C "${WORK_DIR}" --strip-components=1
    cd ${WORK_DIR}
    
    # Configure
    ./configure --prefix=/usr \
                --disable-gpgsm-test \
                --disable-gpgconf-test \
                --disable-g13-test \
                --disable-gpg-test \
                --enable-languages=cl
    
    # Build
    make
    
    # Install
    make DESTDIR="${OUT_DIR}" install
    
    # Set consistent timestamps for reproducible builds
    find "${OUT_DIR}" -exec touch -d '2024-01-01T00:00:00+00:00' {} \;
    find "${OUT_DIR}" ! -type d -exec strip-nondeterminism -T 1704067200 --normalizers +all {} \; || true
    2nex_strip_binaries ${OUT_DIR}

bundles:
  full:
    - bin
    - lib
    - dev
    - misc
    - info
  dev:
    - bin
    - lib
    - dev

outputs:
  lib:
    files:
    - /usr/lib/libgpgme.so
    - /usr/lib/libgpgme.so.11
    - /usr/lib/libgpgme.so.11.32.1
    requires:
    - x86_64/glibc/2.39/sys-libs/outputs/lib
    - x86_64/libassuan/2.5.7/dev-libs/outputs/lib
    - x86_64/libgpg-error/1.51/dev-libs/outputs/lib
  bin:
    files:
    - /usr/bin/gpgme-json
    - /usr/bin/gpgme-tool
    requires:
    - x86_64/glibc/2.39/sys-libs/outputs/lib
    - x86_64/libassuan/2.5.7/dev-libs/outputs/lib
    - x86_64/libgpg-error/1.51/dev-libs/outputs/lib
  misc:
    files:
    - /usr/share/aclocal/gpgme.m4
    - /usr/share/common-lisp/source/gpgme/gpgme-grovel.lisp
    - /usr/share/common-lisp/source/gpgme/gpgme-package.lisp
    - /usr/share/common-lisp/source/gpgme/gpgme.asd
    - /usr/share/common-lisp/source/gpgme/gpgme.lisp
  dev:
    files:
    - /usr/include/gpgme.h
    - /usr/lib/libgpgme.la
    - /usr/lib/pkgconfig/gpgme-glib.pc
    - /usr/lib/pkgconfig/gpgme.pc
  info:
    files:
    - /usr/share/info/gpgme.info
    - /usr/share/info/gpgme.info-1
    - /usr/share/info/gpgme.info-2
