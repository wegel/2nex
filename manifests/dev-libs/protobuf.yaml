build:
  script: |
    tar --no-same-owner -xf ${SOURCE_protobuf} -C "${WORK_DIR}" --strip-components=1
    cd ${WORK_DIR}
    
    # Create build directory
    mkdir -p build
    cd build
    
    # Configure with CMake
    # Using the same options as Buildroot
    cmake .. \
    -G Ninja \
    -DCMAKE_INSTALL_PREFIX=/usr \
    -DCMAKE_BUILD_TYPE=Release \
    -Dprotobuf_ALLOW_CCACHE=ON \
    -Dprotobuf_BUILD_CONFORMANCE=OFF \
    -Dprotobuf_BUILD_LIBPROTOC=OFF \
    -Dprotobuf_BUILD_LIBUPB=ON \
    -Dprotobuf_BUILD_PROTOBUF_BINARIES=ON \
    -Dprotobuf_BUILD_PROTOC_BINARIES=ON \
    -Dprotobuf_BUILD_TESTS=OFF \
    -Dprotobuf_DISABLE_RTTI=OFF \
    -Dprotobuf_INSTALL=ON \
    -Dprotobuf_WITH_ZLIB=ON \
    -DCMAKE_EXE_LINKER_FLAGS="-Wl,--allow-multiple-definition"
    
    # Build
    ninja
    
    # Install
    DESTDIR="${OUT_DIR}" ninja install
    
    # Set consistent timestamps for reproducible builds
    find "${OUT_DIR}" -exec touch -d '2024-01-01T00:00:00+00:00' {} \;
    find "${OUT_DIR}" ! -type d -exec strip-nondeterminism -T 1704067200 --normalizers +all {} \; || true
    2nex_strip_binaries ${OUT_DIR}

bundles:
  full:
    - static
    - lib
    - dev
    - bin
  dev:
    - bin
    - static
    - lib
    - dev

