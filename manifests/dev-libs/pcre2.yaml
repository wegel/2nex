build:
  script: |
    tar --no-same-owner -xf ${SOURCE_pcre2} -C "${WORK_DIR}" --strip-components=1
    cd ${WORK_DIR}
    
    # Run autoconf to regenerate configure script
    autoreconf -fi
    
    # Configure with options from Buildroot
    ./configure --prefix=/usr \
      --enable-pcre2-8 \
      --enable-pcre2-16 \
      --disable-pcre2-32 \
      --enable-jit
    
    # Build
    make ${MAKEFLAGS}
    
    # Install
    make DESTDIR="${OUT_DIR}" install
    
    # Set consistent timestamps for reproducible builds
    find "${OUT_DIR}" -exec touch -d '2024-01-01T00:00:00+00:00' {} \;
    find "${OUT_DIR}" ! -type d -exec strip-nondeterminism -T 1704067200 --normalizers +all {} \; || true
    2nex_strip_binaries ${OUT_DIR}

bundles:
  full:
    - bin
    - lib
    - dev
    - static
    - doc 
    - man
  dev:
    - bin
    - lib
    - dev
    - static

