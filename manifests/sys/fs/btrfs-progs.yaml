package:
  schema: 1
  name: "Btrfs Progs"
  slug: "btrfs-progs"
  flavor: "sys/fs"
  version: "6.10"
  description: "Userspace utilities for the btrfs filesystem"
  homepage: "https://btrfs.wiki.kernel.org"
  checksum: 4f4a1f0cef100dcc63af16a94e100e9ef8e04f0627e54ba24e6f19a97132ab9b

sources:
  - name: "btrfs_progs"
    url: "https://www.kernel.org/pub/linux/kernel/people/kdave/btrfs-progs/btrfs-progs-v6.10.tar.xz"
    sha256: 3382a84e3fcfe1ffdea07a61ab3f4e86665d38fa35f1f34548d5df867423e0df

dependencies:
- commit: x86_64/bash/5.2.21/app/shells/bundles/dev
  name: bash
- commit: x86_64/coreutils/9.5/sys/apps/bundles/dev
  name: coreutils
- commit: x86_64/findutils/4.9.0/sys/apps/bundles/dev
  name: findutils
- commit: x86_64/2nex-utilities-bootstrap/0.0.1/bootstrap/phase3/bundles/dev
  name: 2nex-utilities
- commit: x86_64/gawk/5.3.0/sys/apps/bundles/dev
  name: gawk
- commit: x86_64/grep/3.11/sys/apps/bundles/dev
  name: grep
- commit: x86_64/make/4.4.1/sys/devel/bundles/dev
  name: make
- commit: x86_64/sed/4.9/sys/apps/bundles/dev
  name: sed
- commit: x86_64/tar/1.35/app/arch/bundles/dev
  name: tar
- commit: x86_64/binutils/2.42/bootstrap/phase3/bundles/dev
  name: binutils
- commit: x86_64/inetutils/2.5/net/misc/bundles/dev
  name: inetutils
- commit: x86_64/glibc/2.39/sys/libs/bundles/dev
  name: glibc
- commit: x86_64/gcc/13.2.0/bootstrap/phase3/bundles/dev
  name: gcc
- commit: x86_64/acl/2.3.2/sys/libs/bundles/dev
  name: acl
- commit: x86_64/attr/2.5.2/sys/libs/bundles/dev
  name: attr
- commit: x86_64/bzip2/1.0.8/bootstrap/phase3/bundles/dev
  name: bzip2
- commit: x86_64/gmp/6.3.0/sys/libs/bundles/dev
  name: gmp
- commit: x86_64/libcap/2.69/sys/apps/bundles/dev
  name: libcap
- commit: x86_64/mpfr/4.2.1/bootstrap/phase3/bundles/dev
  name: mpfr
- commit: x86_64/zlib/1.3.1/bootstrap/phase3/bundles/dev
  name: zlib
- commit: x86_64/linux-headers/6.4.1/bootstrap/phase3/bundles/dev
  name: linux-headers
- commit: x86_64/mpc/1.2.1/bootstrap/phase3/bundles/dev
  name: mpc
- commit: x86_64/xz/5.4.6/bootstrap/phase3/bundles/dev
  name: xz
- commit: x86_64/ncurses/6.4-20230520/sys/libs/bundles/dev
  name: ncurses
- commit: x86_64/util_linux/2.40/sys/apps/bundles/dev
  name: util-linux
- commit: x86_64/lzo/2.10/app/arch/bundles/dev
  name: lzo
- commit: x86_64/e2fsprogs/1.47.0/sys/fs/bundles/dev
  name: e2fsprogs
- commit: x86_64/pkgconf/2.2.0/bootstrap/phase3/bundles/dev
  name: pkgconf
- commit: x86_64/systemd/257.5/sys/apps/bundles/dev
  name: systemd
- commit: x86_64/zstd/1.5.6/bootstrap/phase3/bundles/dev
  name: zstd
- commit: x86_64/file/5.45/bootstrap/phase3/bundles/dev
  name: file

build:
  script: |
    tar --no-same-owner -xf ${SOURCE_btrfs_progs} -C "${WORK_DIR}" --strip-components=1
    cd ${WORK_DIR}
    
    # Configure
    ./configure --prefix=/usr --disable-documentation --disable-python
    
    # Build
    make
    
    # Install
    make DESTDIR="${OUT_DIR}" install
    
    # Set consistent timestamps for reproducible builds
    find "${OUT_DIR}" -exec touch -d '2024-01-01T00:00:00+00:00' {} \;
    #find "${OUT_DIR}" ! -type d -exec strip-nondeterminism -T 1704067200 --normalizers +all {} \; || true
    2nex_strip_binaries ${OUT_DIR}

bundles:
  full:
    - bin
    - lib
    - dev
    - static

  dev:
    - lib
    - dev
    - bin
    - static

outputs:
  lib:
    files:
    - /usr/lib/libbtrfs.so
    - /usr/lib/libbtrfs.so.0
    - /usr/lib/libbtrfs.so.0.1
    - /usr/lib/libbtrfs.so.0.1.3
    - /usr/lib/libbtrfsutil.so
    - /usr/lib/libbtrfsutil.so.1
    - /usr/lib/libbtrfsutil.so.1.3
    - /usr/lib/libbtrfsutil.so.1.3.2
    - /usr/lib/udev/rules.d/64-btrfs-dm.rules
    - /usr/lib/udev/rules.d/64-btrfs-zoned.rules
    requires:
    - x86_64/glibc/2.39/sys/libs/outputs/lib
  dev:
    files:
    - /usr/include/btrfs/ctree.h
    - /usr/include/btrfs/ioctl.h
    - /usr/include/btrfs/kerncompat.h
    - /usr/include/btrfs/list.h
    - /usr/include/btrfs/rbtree.h
    - /usr/include/btrfs/rbtree_types.h
    - /usr/include/btrfs/send-stream.h
    - /usr/include/btrfs/send-utils.h
    - /usr/include/btrfs/send.h
    - /usr/include/btrfs/version.h
    - /usr/include/btrfsutil.h
    - /usr/lib/pkgconfig/libbtrfsutil.pc
  static:
    files:
    - /usr/lib/libbtrfs.a
    - /usr/lib/libbtrfsutil.a
  bin:
    files:
    - /usr/bin/btrfs
    - /usr/bin/btrfs-convert
    - /usr/bin/btrfs-find-root
    - /usr/bin/btrfs-image
    - /usr/bin/btrfs-map-logical
    - /usr/bin/btrfs-select-super
    - /usr/bin/btrfsck
    - /usr/bin/btrfstune
    - /usr/bin/fsck.btrfs
    - /usr/bin/mkfs.btrfs
    requires:
    - x86_64/bash/5.2.21/app/shells/outputs/bin
    - x86_64/e2fsprogs/1.47.0/sys/fs/outputs/lib
    - x86_64/glibc/2.39/sys/libs/outputs/lib
    - x86_64/lzo/2.10/app/arch/outputs/lib
    - x86_64/systemd/257.5/sys/apps/outputs/lib
    - x86_64/util_linux/2.40/sys/apps/outputs/lib
    - x86_64/zlib/1.3.1/bootstrap/phase3/outputs/lib
    - x86_64/zstd/1.5.6/bootstrap/phase3/outputs/lib
