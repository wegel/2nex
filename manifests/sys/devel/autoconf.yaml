package:
  schema: 1
  name: "Autoconf"
  slug: "autoconf"
  flavor: "sys/devel"
  version: "2.72"
  description: "A package of M4 macros that produce shell scripts to automatically configure software source code packages"
  homepage: "https://www.gnu.org/software/autoconf/"
  checksum: e99442d9082eb21dae8b3d01867e91df9bc002184f1640a0cbb7a29ff6d2cd38

sources:
  - name: "autoconf"
    url: "https://ftp.gnu.org/gnu/autoconf/autoconf-2.72.tar.xz"
    sha256: "ba885c1319578d6c94d46e9b0dceb4014caafe2490e437a0dbca3f270a223f5a"

dependencies:
- commit: x86_64/mpc/1.2.1/bootstrap/phase3/bundles/dev
  name: mpc
- commit: x86_64/coreutils/9.5/bootstrap/phase1/bundles/dev
  name: coreutils
- commit: x86_64/findutils/4.9.0/bootstrap/phase1/bundles/dev
  name: findutils
- commit: x86_64/2nex-utilities-bootstrap/0.0.1/bootstrap/phase3/bundles/dev
  name: 2nex-utilities
- commit: x86_64/gawk/5.3.0/bootstrap/phase1/bundles/dev
  name: gawk
- commit: x86_64/make/4.4.1/bootstrap/phase1/bundles/dev
  name: make
- commit: x86_64/tar/1.35/bootstrap/phase1/bundles/dev
  name: tar
- commit: x86_64/texinfo/7.1/bootstrap/phase2/bundles/dev
  name: texinfo
- commit: x86_64/xz/5.4.6/bootstrap/phase3/bundles/dev
  name: xz
- commit: x86_64/m4/1.4.19/bootstrap/phase3/bundles/dev
  name: m4
- commit: x86_64/attr/2.5.2/bootstrap/phase3/bundles/dev
  name: attr
- commit: x86_64/acl/2.3.2/bootstrap/phase3/bundles/dev
  name: acl
- commit: x86_64/libxcrypt/4.4.36/bootstrap/phase3/bundles/dev
  name: libxcrypt
- commit: x86_64/ncurses/6.4-20230520/bootstrap/phase3/bundles/dev
  name: ncurses
- commit: x86_64/sed/4.9/bootstrap/phase1/bundles/dev
  name: sed
- commit: x86_64/grep/3.11/bootstrap/phase1/bundles/dev
  name: grep
- commit: x86_64/bash/5.2.21/bootstrap/phase1/bundles/dev
  name: bash
- commit: x86_64/perl/5.38.2/bootstrap/phase2/bundles/dev
  name: perl
- commit: x86_64/glibc/2.39/sys/libs/bundles/dev
  name: glibc
- commit: x86_64/file/5.45/bootstrap/phase1/bundles/dev
  name: file


build:
  script: |
    tar --no-same-owner -xf ${SOURCE0} -C "${WORK_DIR}" --strip-components=1
    cd ${WORK_DIR}

    ./configure --prefix=/usr
    make
    make DESTDIR=$OUT_DIR install
    
    find "${OUT_DIR}" -exec touch -d "2024-01-01T00:00:00+00:00" {} \;
    2nex_strip_binaries ${OUT_DIR}

bundles:
  full:
    - info
    - bin
    - dev
    - man

  dev:
    - bin
    - dev

outputs:
  info:
    files:
    - /usr/share/info/autoconf.info
    - /usr/share/info/dir
    - /usr/share/info/standards.info
  bin:
    files:
    - /usr/bin/autoconf
    - /usr/bin/autoheader
    - /usr/bin/autom4te
    - /usr/bin/autoreconf
    - /usr/bin/autoscan
    - /usr/bin/autoupdate
    - /usr/bin/ifnames
  dev:
    files:
    - /usr/share/autoconf/Autom4te/C4che.pm
    - /usr/share/autoconf/Autom4te/ChannelDefs.pm
    - /usr/share/autoconf/Autom4te/Channels.pm
    - /usr/share/autoconf/Autom4te/Config.pm
    - /usr/share/autoconf/Autom4te/Configure_ac.pm
    - /usr/share/autoconf/Autom4te/FileUtils.pm
    - /usr/share/autoconf/Autom4te/General.pm
    - /usr/share/autoconf/Autom4te/Getopt.pm
    - /usr/share/autoconf/Autom4te/Request.pm
    - /usr/share/autoconf/Autom4te/XFile.pm
    - /usr/share/autoconf/INSTALL
    - /usr/share/autoconf/autoconf/autoconf.m4
    - /usr/share/autoconf/autoconf/autoconf.m4f
    - /usr/share/autoconf/autoconf/autoheader.m4
    - /usr/share/autoconf/autoconf/autoscan.m4
    - /usr/share/autoconf/autoconf/autotest.m4
    - /usr/share/autoconf/autoconf/autoupdate.m4
    - /usr/share/autoconf/autoconf/c.m4
    - /usr/share/autoconf/autoconf/erlang.m4
    - /usr/share/autoconf/autoconf/fortran.m4
    - /usr/share/autoconf/autoconf/functions.m4
    - /usr/share/autoconf/autoconf/general.m4
    - /usr/share/autoconf/autoconf/go.m4
    - /usr/share/autoconf/autoconf/headers.m4
    - /usr/share/autoconf/autoconf/lang.m4
    - /usr/share/autoconf/autoconf/libs.m4
    - /usr/share/autoconf/autoconf/oldnames.m4
    - /usr/share/autoconf/autoconf/programs.m4
    - /usr/share/autoconf/autoconf/specific.m4
    - /usr/share/autoconf/autoconf/status.m4
    - /usr/share/autoconf/autoconf/trailer.m4
    - /usr/share/autoconf/autoconf/types.m4
    - /usr/share/autoconf/autom4te.cfg
    - /usr/share/autoconf/autoscan/autoscan.list
    - /usr/share/autoconf/autotest/autotest.m4
    - /usr/share/autoconf/autotest/autotest.m4f
    - /usr/share/autoconf/autotest/general.m4
    - /usr/share/autoconf/autotest/specific.m4
    - /usr/share/autoconf/build-aux/config.guess
    - /usr/share/autoconf/build-aux/config.sub
    - /usr/share/autoconf/build-aux/install-sh
    - /usr/share/autoconf/m4sugar/foreach.m4
    - /usr/share/autoconf/m4sugar/m4sh.m4
    - /usr/share/autoconf/m4sugar/m4sh.m4f
    - /usr/share/autoconf/m4sugar/m4sugar.m4
    - /usr/share/autoconf/m4sugar/m4sugar.m4f
    - /usr/share/autoconf/version.m4
  man:
    files:
    - /usr/share/man/man1/autoconf.1
    - /usr/share/man/man1/autoheader.1
    - /usr/share/man/man1/autom4te.1
    - /usr/share/man/man1/autoreconf.1
    - /usr/share/man/man1/autoscan.1
    - /usr/share/man/man1/autoupdate.1
    - /usr/share/man/man1/ifnames.1
