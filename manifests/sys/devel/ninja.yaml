package:
  schema: 1
  name: "Ninja"
  slug: "ninja"
  flavor: "sys/devel"
  version: "1.12.1"
  description: "A small build system with a focus on speed."
  homepage: "https://ninja-build.org/"
  checksum: e9e38fda60ace274d8a9db8a33805cc68fa863d6a76ca29266b1908bde0a1bb9

sources:
  - name: "ninja"
    url: "https://github.com/ninja-build/ninja/archive/v1.12.1/ninja-1.12.1.tar.gz"
    sha256: "821bdff48a3f683bc4bb3b6f0b5fe7b2d647cf65d52aeb63328c91a6c6df285a"

dependencies:
- commit: x86_64/coreutils/9.5/bootstrap/phase1/bundles/dev
  name: coreutils
- commit: x86_64/findutils/4.9.0/bootstrap/phase1/bundles/dev
  name: findutils
- commit: x86_64/2nex-utilities/0.0.1/sys/apps/bundles/dev
  name: 2nex-utilities
- commit: x86_64/gzip/1.13/bootstrap/phase1/bundles/dev
  name: gzip
- commit: x86_64/tar/1.35/bootstrap/phase1/bundles/dev
  name: tar
- commit: x86_64/glibc/2.39/sys/libs/bundles/dev
  name: glibc
- commit: x86_64/zlib/1.3.1/bootstrap/phase3/bundles/dev
  name: zlib
- commit: x86_64/bzip2/1.0.8/bootstrap/phase3/bundles/dev
  name: bzip2
- commit: x86_64/xz/5.4.6/bootstrap/phase3/bundles/dev
  name: xz
- commit: x86_64/file/5.45/bootstrap/phase3/bundles/dev
  name: file
- commit: x86_64/binutils/2.42/bootstrap/phase3/bundles/dev
  name: binutils
- commit: x86_64/gmp/6.3.0/sys/libs/bundles/dev
  name: gmp
- commit: x86_64/mpfr/4.2.1/bootstrap/phase3/bundles/dev
  name: mpfr
- commit: x86_64/mpc/1.2.1/bootstrap/phase3/bundles/dev
  name: mpc
- commit: x86_64/attr/2.5.2/sys/libs/bundles/dev
  name: attr
- commit: x86_64/acl/2.3.2/sys/libs/bundles/dev
  name: acl
- commit: x86_64/gcc/13.2.0/bootstrap/phase3/bundles/dev
  name: gcc
- commit: x86_64/linux-headers/6.4.1/bootstrap/phase3/bundles/dev
  name: linux
- commit: x86_64/ncurses/6.4-20230520/sys/libs/bundles/dev
  name: ncurses
- commit: x86_64/sed/4.9/sys/apps/bundles/dev
  name: sed
- commit: x86_64/grep/3.11/sys/apps/bundles/dev
  name: grep
- commit: x86_64/bash/5.2.21/app/shells/bundles/dev
  name: bash
- commit: x86_64/python3/3.12.2/dev/lang/bundles/dev
  name: python3

build:
  script: |
    tar --no-same-owner -xf ${SOURCE0} -C "${WORK_DIR}" --strip-components=1
    cd ${WORK_DIR}

    python3 configure.py --bootstrap
    mkdir -p ${OUT_DIR}/usr/{bin,share/bash-completion/completions,share/zsh/site-functions}
    install -vm755 ninja ${OUT_DIR}/usr/bin/
    install -vDm644 misc/bash-completion ${OUT_DIR}/usr/share/bash-completion/completions/ninja
    install -vDm644 misc/zsh-completion  ${OUT_DIR}/usr/share/zsh/site-functions/_ninja

    find "${OUT_DIR}" -exec touch -d "2024-01-01T00:00:00+00:00" {} \;
    2nex_strip_binaries ${OUT_DIR}

bundles:
  full:
    - misc
    - bin

  dev:
    - bin

outputs:
  misc:
    files:
    - /usr/share/bash-completion/completions/ninja
    - /usr/share/zsh/site-functions/_ninja
  bin:
    files:
    - /usr/bin/ninja
    requires:
    - x86_64/gcc/13.2.0/bootstrap/phase3/outputs/lib
    - x86_64/glibc/2.39/sys/libs/outputs/lib
