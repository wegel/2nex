package:
  schema: 1
  name: "Make"
  slug: "make"
  flavor: "sys/devel"
  version: "4.4.1"
  description: "Utility to maintain groups of programs"  
  homepage: "https://www.gnu.org/software/make/"
  checksum: 02827bce773dfd7e9d19db26634719cd226cf9c13817441b57c73909ce3f3143

sources:
  - name: "make" 
    url: "https://ftp.gnu.org/gnu/make/make-4.4.1.tar.gz"
    sha256: "dd16fb1d67bfab79a72f5e8390735c49e3e8e70b4945a15ab1f81ddb78658fb3"


dependencies:
- commit: x86_64/2nex-utilities-bootstrap/0.0.1/bootstrap/phase3/bundles/dev
  name: 2nex-utilities
- commit: x86_64/make/4.4.1/bootstrap/phase1/bundles/dev
  name: make
- commit: x86_64/tar/1.35/bootstrap/phase1/bundles/dev
  name: tar
- commit: x86_64/texinfo/7.1/bootstrap/phase2/bundles/dev
  name: texinfo
- commit: x86_64/zlib/1.3.1/bootstrap/phase3/bundles/dev
  name: zlib
- commit: x86_64/bzip2/1.0.8/bootstrap/phase3/bundles/dev
  name: bzip2
- commit: x86_64/xz/5.4.6/bootstrap/phase3/bundles/dev
  name: xz
- commit: x86_64/file/5.45/bootstrap/phase3/bundles/dev
  name: file
- commit: x86_64/binutils/2.42/bootstrap/phase3/bundles/dev
  name: binutils
- commit: x86_64/gcc/13.2.0/bootstrap/phase3/bundles/dev
  name: gcc
- commit: x86_64/sed/4.9/bootstrap/phase1/bundles/dev
  name: sed
- commit: x86_64/grep/3.11/bootstrap/phase1/bundles/dev
  name: grep
- commit: x86_64/bash/5.2.21/bootstrap/phase1/bundles/dev
  name: bash
- commit: x86_64/coreutils/9.5/bootstrap/phase1/bundles/dev
  name: coreutils
- commit: x86_64/gawk/5.3.0/bootstrap/phase1/bundles/dev
  name: gawk
- commit: x86_64/findutils/4.9.0/bootstrap/phase1/bundles/dev
  name: findutils
- commit: x86_64/gzip/1.13/bootstrap/phase1/bundles/dev
  name: gzip
- commit: x86_64/glibc/2.39/sys/libs/bundles/dev
  name: glibc

build:
  script: |
    tar --no-same-owner -xf ${SOURCE0} -C "${WORK_DIR}" --strip-components=1
    cd ${WORK_DIR}

    ./configure --prefix=/usr

    make
    make DESTDIR=${OUT_DIR} install

    find "${OUT_DIR}" -exec touch -d "2024-01-01T00:00:00+00:00" {} \;
    2nex_strip_binaries ${OUT_DIR}

bundles:
  full:
    - bin
    - info
    - dev
    - locale
    - man
    
  dev:
    - dev
    - locale
    - bin
 
outputs:
  bin:
    files:
    - /usr/bin/make
    requires:
    - x86_64/glibc/2.39/sys/libs/outputs/lib
  info:
    files:
    - /usr/share/info/dir
    - /usr/share/info/make.info
    - /usr/share/info/make.info-1
    - /usr/share/info/make.info-2
    - /usr/share/info/make.info-3
  dev:
    files:
    - /usr/include/gnumake.h
  locale:
    files:
    - /usr/share/locale/be/LC_MESSAGES/make.mo
    - /usr/share/locale/bg/LC_MESSAGES/make.mo
    - /usr/share/locale/cs/LC_MESSAGES/make.mo
    - /usr/share/locale/da/LC_MESSAGES/make.mo
    - /usr/share/locale/de/LC_MESSAGES/make.mo
    - /usr/share/locale/es/LC_MESSAGES/make.mo
    - /usr/share/locale/fi/LC_MESSAGES/make.mo
    - /usr/share/locale/fr/LC_MESSAGES/make.mo
    - /usr/share/locale/ga/LC_MESSAGES/make.mo
    - /usr/share/locale/gl/LC_MESSAGES/make.mo
    - /usr/share/locale/he/LC_MESSAGES/make.mo
    - /usr/share/locale/hr/LC_MESSAGES/make.mo
    - /usr/share/locale/id/LC_MESSAGES/make.mo
