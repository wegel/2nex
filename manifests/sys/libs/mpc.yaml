package:
  schema: 1
  name: "MPC"
  slug: "mpc"
  flavor: "sys/libs"
  version: "1.2.1"
  description: "Multiple Precision Complex Library"
  homepage: "https://www.multiprecision.org/mpc/"
  checksum: 0eafcfd9f2d0474190214fd154429ceeee29a87a0680785eb9e4062a61f4b8cc

sources:
  - name: "mpc"
    url: "https://ftp.gnu.org/gnu/mpc/mpc-1.3.1.tar.gz"
    sha256: "ab642492f5cf882b74aa0cb730cd410a81edcdbec895183ce930e706c1c759b8"

dependencies:
- commit: x86_64/bootstrap_tools/0.0.1/bootstrap/phase1/bundles/dev
  name: bootstrap_tools
- commit: x86_64/gcc/13.2.0/bootstrap/phase1/outputs/lib
  name: gcc
- commit: x86_64/bash/5.2.21/bootstrap/phase1/bundles/dev
  name: bash
- commit: x86_64/findutils/4.9.0/bootstrap/phase1/bundles/dev
  name: findutils
- commit: x86_64/2nex-utilities-bootstrap/0.0.1/bootstrap/phase3/bundles/dev
  name: 2nex-utilities-bootstrap
- commit: x86_64/gawk/5.3.0/bootstrap/phase1/bundles/dev
  name: gawk
- commit: x86_64/grep/3.11/bootstrap/phase1/bundles/dev
  name: grep
- commit: x86_64/gzip/1.13/bootstrap/phase1/bundles/dev
  name: gzip
- commit: x86_64/make/4.4.1/bootstrap/phase1/bundles/dev
  name: make
- commit: x86_64/sed/4.9/bootstrap/phase1/bundles/dev
  name: sed
- commit: x86_64/tar/1.35/bootstrap/phase1/bundles/dev
  name: tar
- commit: x86_64/mpc/1.2.1/bootstrap/phase3/outputs/lib
  name: mpc
- commit: x86_64/gcc/13.2.0/bootstrap/phase3/bundles/dev
  name: gcc
- commit: x86_64/coreutils/9.5/bootstrap/phase1/outputs/bin
  name: coreutils
- commit: x86_64/texinfo/7.1/bootstrap/phase2/bundles/dev
  name: texinfo
- commit: x86_64/zlib/1.3.1/bootstrap/phase3/bundles/dev
  name: zlib
- commit: x86_64/bzip2/1.0.8/bootstrap/phase3/outputs/lib
  name: bzip2
- commit: x86_64/xz/5.4.6/bootstrap/phase3/outputs/lib
  name: xz
- commit: x86_64/file/5.45/bootstrap/phase3/bundles/dev
  name: file
- commit: x86_64/binutils/2.42/bootstrap/phase3/bundles/dev
  name: binutils
- commit: x86_64/glibc/2.39/sys/libs/outputs/lib
  name: glibc
- commit: x86_64/gcc/13.2.0/sys/devel/outputs/lib
  name: gcc
- commit: x86_64/gmp/6.3.0/sys/libs/bundles/dev
  name: gmp
- commit: x86_64/mpfr/4.2.1/sys/libs/bundles/dev
  name: mpfr
- commit: x86_64/glibc/2.39/sys/libs/bundles/dev
  name: glibc

build:
  script: |
    tar --no-same-owner -xf ${SOURCE_mpc} -C "${WORK_DIR}" --strip-components=1
    cd ${WORK_DIR}

    ./configure \
        --prefix=/usr \
        --with-gmp=/usr \
        --with-mpfr=/usr

    make
    make check
    make DESTDIR="${OUT_DIR}" install

    find "${OUT_DIR}" -exec touch -d '2024-01-01T00:00:00+00:00' {} \;
    2nex_strip_binaries ${OUT_DIR}

bundles:
  full:
    - static
    - dev
    - lib
    - info

  dev:
    - static
    - dev
    - lib

outputs:
  static:
    files:
    - /usr/lib/libmpc.a
  dev:
    files:
    - /usr/include/mpc.h
    - /usr/lib/libmpc.la
  lib:
    files:
    - /usr/lib/libmpc.so
    - /usr/lib/libmpc.so.3
    - /usr/lib/libmpc.so.3.3.1
    requires:
    - x86_64/glibc/2.39/sys/libs/outputs/lib
    - x86_64/gmp/6.3.0/sys/libs/outputs/lib
    - x86_64/mpfr/4.2.1/sys/libs/outputs/lib
  info:
    files:
    - /usr/share/info/dir
    - /usr/share/info/mpc.info
