  dev:
    files:
    - /usr/include/acl/libacl.h
    - /usr/include/sys/acl.h
    - /usr/lib/libacl.la
    - /usr/lib/pkgconfig/libacl.pc
  lib:
    files:
    - /usr/lib/libacl.so
    - /usr/lib/libacl.so.1
    - /usr/lib/libacl.so.1.1.2302
    requires:
