package:
  schema: 1
  name: "Attr"
  slug: "attr"
  flavor: "sys/libs"
  version: "2.5.2"
  description: "Utilities for manipulating filesystem extended attributes"
  homepage: "https://savannah.nongnu.org/projects/attr"
  checksum: a54d58eabcbb648d594594827204b4786d49ce4c6e422a5b6a2e5d9f544eb513

sources:
  - name: "attr"
    url: "https://download.savannah.nongnu.org/releases/attr/attr-2.5.2.tar.xz"
    sha256: "f2e97b0ab7ce293681ab701915766190d607a1dba7fae8a718138150b700a70b" 

dependencies:
- commit: x86_64/mpc/1.2.1/bootstrap/phase3/bundles/dev
  name: mpc
- commit: x86_64/bash/5.2.21/bootstrap/phase1/bundles/dev
  name: bash
- commit: x86_64/coreutils/9.5/bootstrap/phase1/bundles/dev
  name: coreutils
- commit: x86_64/findutils/4.9.0/bootstrap/phase1/bundles/dev
  name: findutils
- commit: x86_64/2nex-utilities-bootstrap/0.0.1/bootstrap/phase3/bundles/dev
  name: 2nex-utilities
- commit: x86_64/gawk/5.3.0/bootstrap/phase1/bundles/dev
  name: gawk
- commit: x86_64/grep/3.11/bootstrap/phase1/bundles/dev
  name: grep
- commit: x86_64/make/4.4.1/bootstrap/phase1/bundles/dev
  name: make
- commit: x86_64/sed/4.9/bootstrap/phase1/bundles/dev
  name: sed
- commit: x86_64/tar/1.35/bootstrap/phase1/bundles/dev
  name: tar
- commit: x86_64/gcc/13.2.0/bootstrap/phase3/bundles/dev
  name: gcc
- commit: x86_64/perl/5.38.2/bootstrap/phase2/bundles/dev
  name: perl
- commit: x86_64/strip-nondeterminism/1.13.0/bootstrap/phase3/bundles/dev
  name: strip_nondeterminism
- commit: x86_64/zlib/1.3.1/bootstrap/phase3/bundles/dev
  name: zlib
- commit: x86_64/bzip2/1.0.8/bootstrap/phase3/bundles/dev
  name: bzip2
- commit: x86_64/xz/5.4.6/bootstrap/phase3/bundles/dev
  name: xz
- commit: x86_64/file/5.45/bootstrap/phase3/bundles/dev
  name: file
- commit: x86_64/binutils/2.42/bootstrap/phase3/bundles/dev
  name: binutils
- commit: x86_64/glibc/2.39/sys/libs/bundles/dev
  name: glibc

build:
  script: |  
    tar --no-same-owner -xf ${SOURCE_attr} -C "${WORK_DIR}" --strip-components=1
    cd ${WORK_DIR}

    ./configure --prefix=/usr     \
              --sysconfdir=/etc \
              --docdir=/usr/share/doc/attr-2.5.2

    make
    make DESTDIR="${OUT_DIR}" install

    find "${OUT_DIR}" -exec touch -d '2024-01-01T00:00:00+00:00' {} \;
    find "${OUT_DIR}" ! -type d -exec strip-nondeterminism -T 1704067200 --normalizers +all {} \;
    2nex_strip_binaries ${OUT_DIR}

bundles:
  full:
    - lib
    - doc
    - man
    - locale
    - bin
    - conf
    - static
    - dev

  dev:
    - lib
    - bin
    - conf
    - static
    - dev

outputs:
  lib:
    files:
    - /usr/lib/libattr.so
    - /usr/lib/libattr.so.1
    - /usr/lib/libattr.so.1.1.2502
    requires:
    - x86_64/glibc/2.39/sys/libs/outputs/lib
  doc:
    files:
    - /usr/share/doc/attr-2.5.2/CHANGES
    - /usr/share/doc/attr-2.5.2/COPYING
    - /usr/share/doc/attr-2.5.2/COPYING.LGPL
  man:
    files:
    - /usr/share/man/man1/attr.1
    - /usr/share/man/man1/getfattr.1
    - /usr/share/man/man1/setfattr.1
    - /usr/share/man/man3/attr_get.3
    - /usr/share/man/man3/attr_getf.3
    - /usr/share/man/man3/attr_list.3
    - /usr/share/man/man3/attr_listf.3
    - /usr/share/man/man3/attr_multi.3
    - /usr/share/man/man3/attr_multif.3
    - /usr/share/man/man3/attr_remove.3
    - /usr/share/man/man3/attr_removef.3
    - /usr/share/man/man3/attr_set.3
    - /usr/share/man/man3/attr_setf.3
  locale:
    files:
    - /usr/share/locale/cs/LC_MESSAGES/attr.mo
    - /usr/share/locale/de/LC_MESSAGES/attr.mo
    - /usr/share/locale/en@boldquot/LC_MESSAGES/attr.mo
    - /usr/share/locale/en@quot/LC_MESSAGES/attr.mo
    - /usr/share/locale/es/LC_MESSAGES/attr.mo
    - /usr/share/locale/fr/LC_MESSAGES/attr.mo
    - /usr/share/locale/gl/LC_MESSAGES/attr.mo
    - /usr/share/locale/ka/LC_MESSAGES/attr.mo
    - /usr/share/locale/nl/LC_MESSAGES/attr.mo
    - /usr/share/locale/pl/LC_MESSAGES/attr.mo
    - /usr/share/locale/sv/LC_MESSAGES/attr.mo
  bin:
    files:
    - /usr/bin/attr
    - /usr/bin/getfattr
    - /usr/bin/setfattr
    requires:
    - x86_64/glibc/2.39/sys/libs/outputs/lib
  conf:
    files:
    - /etc/xattr.conf
  static:
    files:
    - /usr/lib/libattr.a
  dev:
    files:
    - /usr/include/attr/attributes.h
    - /usr/include/attr/error_context.h
    - /usr/include/attr/libattr.h
    - /usr/lib/libattr.la
    - /usr/lib/pkgconfig/libattr.pc
