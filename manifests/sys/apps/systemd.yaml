build:
  script: |
    tar --no-same-owner -xf ${SOURCE_systemd} -C "${WORK_DIR}" --strip-components=1
    cd ${WORK_DIR}

    # Configure systemd build
    mkdir -p build
    cd build

    # Basic meson setup with minimal dependencies
    meson setup .. \
      --prefix=/usr \
      --sysconfdir=/etc \
      --localstatedir=/var \
      --buildtype=release \
      -Dmode=release \
      -Ddefault-dnssec=no \
      -Dfirstboot=false \
      -Dinstall-tests=false \
      -Dldconfig=false \
      -Dsysusers=false \
      -Drpmmacrosdir=no \
      -Dhomed=false \
      -Duserdb=false \
      -Dman=false \
      -Dhtml=false \
      -Dtranslations=true \
      -Danalyze=false \
      -Ddbuspolicydir=/usr/share/dbus-1/system.d \
      -Ddefault-hierarchy=unified \
      -Ddefault-kill-user-processes=false \
      -Ddefault-locale=C.UTF-8 \
      -Dglib=false \
      -Dimportd=false \
      -Dseccomp=false \
      -Dselinux=false \
      -Dsysext=true \
      -Dsysupdate=true \
      -Dtests=false \
      -Dpam=false

    # Build systemd
    ninja
    DESTDIR="${OUT_DIR}" ninja install

    # Create necessary directories
    mkdir -p ${OUT_DIR}/etc/systemd/system
    mkdir -p ${OUT_DIR}/usr/lib/systemd/system
    mkdir -p ${OUT_DIR}/var/lib/systemd
    
    # Ensure consistent file timestamps for reproducible builds
    find "${OUT_DIR}" -exec touch -d '2024-01-01T00:00:00+00:00' {} \;
    find "${OUT_DIR}" ! -type d -exec strip-nondeterminism -T 1704067200 --normalizers +all {} \;
    2nex_strip_binaries ${OUT_DIR}

bundles:
  full:
    - bin
    - lib
    - dev
    - conf
    - locale
  dev:
    - bin
    - lib
    - dev
  minimal:
    - bin
    - lib
    - conf

