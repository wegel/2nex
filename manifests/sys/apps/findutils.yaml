package:
  schema: 1  
  name: "Findutils"
  slug: "findutils"
  flavor: "sys/apps"
  version: "4.9.0"
  description: "The GNU versions of find utilities (find and xargs)"
  homepage: "https://www.gnu.org/software/findutils/"
  checksum: be34111aaa0b8ce915b538bb48e10651d291da7c583fe28ae7bb448f06e384d0

sources:
  - name: "findutils"
    url: "https://ftp.gnu.org/gnu/findutils/findutils-4.9.0.tar.xz"
    sha256: "a2bfb8c09d436770edc59f50fa483e785b161a3b7b9d547573cb08065fd462fe"

dependencies:
- commit: x86_64/findutils/4.9.0/bootstrap/phase1/bundles/dev
  name: findutils
- commit: x86_64/2nex-utilities/0.0.1/sys/apps/bundles/dev
  name: 2nex-utilities
- commit: x86_64/make/4.4.1/bootstrap/phase1/bundles/dev
  name: make
- commit: x86_64/tar/1.35/bootstrap/phase1/bundles/dev
  name: tar
- commit: x86_64/texinfo/7.1/bootstrap/phase2/bundles/dev
  name: texinfo
- commit: x86_64/glibc/2.39/sys/libs/bundles/dev
  name: glibc
- commit: x86_64/zlib/1.3.1/bootstrap/phase3/bundles/dev
  name: zlib
- commit: x86_64/bzip2/1.0.8/bootstrap/phase3/bundles/dev
  name: bzip2
- commit: x86_64/xz/5.4.6/bootstrap/phase3/bundles/dev
  name: xz
- commit: x86_64/file/5.45/bootstrap/phase3/bundles/dev
  name: file
- commit: x86_64/binutils/2.42/bootstrap/phase3/bundles/dev
  name: binutils
- commit: x86_64/gmp/6.3.0/sys/libs/bundles/dev
  name: gmp
- commit: x86_64/mpfr/4.2.1/bootstrap/phase3/bundles/dev
  name: mpfr
- commit: x86_64/mpc/1.2.1/bootstrap/phase3/bundles/dev
  name: mpc
- commit: x86_64/attr/2.5.2/sys/libs/bundles/dev
  name: attr
- commit: x86_64/acl/2.3.2/sys/libs/bundles/dev
  name: acl
- commit: x86_64/libcap/2.69/sys/apps/bundles/dev
  name: libcap
- commit: x86_64/gcc/13.2.0/bootstrap/phase3/bundles/dev
  name: gcc
- commit: x86_64/linux-headers/6.4.1/bootstrap/phase3/bundles/dev
  name: linux
- commit: x86_64/ncurses/6.4-20230520/sys/libs/bundles/dev
  name: ncurses
- commit: x86_64/sed/4.9/sys/apps/bundles/dev
  name: sed
- commit: x86_64/grep/3.11/sys/apps/bundles/dev
  name: grep
- commit: x86_64/bash/5.2.21/app/shells/bundles/dev
  name: bash
- commit: x86_64/inetutils/2.5/net/misc/bundles/dev
  name: inetutils
- commit: x86_64/coreutils/9.5/sys/apps/bundles/dev
  name: coreutils
- commit: x86_64/gawk/5.3.0/sys/apps/bundles/dev
  name: gawk

build:
  script: | 
    tar --no-same-owner -xf ${SOURCE0} -C "${WORK_DIR}" --strip-components=1
    cd ${WORK_DIR}

    ./configure --prefix=/usr                   \
          --localstatedir=/var/lib/locate

    make
    make DESTDIR=${OUT_DIR} install

    find "${OUT_DIR}" -exec touch -d "2024-01-01T00:00:00+00:00" {} \;
    2nex_strip_binaries ${OUT_DIR}

bundles:
  dev:
    - bin
    - locale
    
outputs:
  bin:
    files:
    - /usr/bin/find
    - /usr/bin/locate
    - /usr/bin/updatedb
    - /usr/bin/xargs
    - /usr/libexec/frcode
    requires:
    - x86_64/bash/5.2.21/app/shells/outputs/bin
    - x86_64/glibc/2.39/sys/libs/outputs/lib
  locale:
    files:
    - /usr/share/locale/be/LC_MESSAGES/findutils.mo
    - /usr/share/locale/bg/LC_MESSAGES/findutils.mo
    - /usr/share/locale/ca/LC_MESSAGES/findutils.mo
