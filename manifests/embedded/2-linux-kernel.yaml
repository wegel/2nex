build:
  script: |
    set -x
    tar --no-same-owner -xf ${SOURCE_kernel} -C "${WORK_DIR}"
    cd "${WORK_DIR}/linux-6.7.9"
    export LD_LIBRARY_PATH="/usr/lib:${LD_LIBRARY_PATH:-}"
    export KBUILD_BUILD_USER="2nex-builder"
    export KBUILD_BUILD_HOST="2nex-builder"
    export KBUILD_BUILD_TIMESTAMP="2024-01-01T00:00:00+00:00"

    make x86_64_defconfig

    # Enable embedded-friendly options
    sed -i 's/# CONFIG_EXT4_FS is not set/CONFIG_EXT4_FS=y/' .config
    sed -i 's/# CONFIG_BLK_DEV_INITRD is not set/CONFIG_BLK_DEV_INITRD=y/' .config
    sed -i 's/# CONFIG_NETDEVICES is not set/CONFIG_NETDEVICES=y/' .config
    sed -i 's/# CONFIG_VIRTIO_NET is not set/CONFIG_VIRTIO_NET=y/' .config

    make -j$(nproc)

    mkdir -p ${OUT_DIR}/boot
    cp -v arch/x86/boot/bzImage ${OUT_DIR}/boot/vmlinuz-6.7.9
    cp -v System.map ${OUT_DIR}/boot/System.map-6.7.9
    cp -v .config ${OUT_DIR}/boot/config-6.7.9

    make INSTALL_MOD_PATH=${OUT_DIR} modules_install

    find "${OUT_DIR}" -exec touch -d "2024-01-01T00:00:00+00:00" {} \;
    2nex_strip_binaries ${OUT_DIR}

bundles:
  base:
    - boot
    - modules

