package:
  schema: 1
  name: "Inetutils"
  slug: "inetutils"
  flavor: "net/misc"
  version: "2.5"
  description: "A collection of common network programs"
  homepage: "https://www.gnu.org/software/inetutils/"
  checksum: 7b4ecd09217e6e17232503d7d5ddef4beb2eb2215e036ff1dad316284f137756

sources:
  - name: "inetutils"
    url: "https://ftp.gnu.org/gnu/inetutils/inetutils-2.5.tar.xz"
    sha256: "87697d60a31e10b5cb86a9f0651e1ec7bee98320d048c0739431aac3d5764fb6"
  - name: "inetutils-no-proc.patch"
    file: inetutils-no-proc.patch
    sha256: "ce74ce825b244be5ddb98fbb1d6573ef3854cd51782f59f612aa1386321fbb2d"

dependencies:
- commit: x86_64/coreutils/9.5/bootstrap/phase1/bundles/dev
  name: coreutils
- commit: x86_64/findutils/4.9.0/bootstrap/phase1/bundles/dev
  name: findutils
- commit: x86_64/2nex-utilities-bootstrap/0.0.1/bootstrap/phase3/bundles/dev
  name: 2nex-utilities
- commit: x86_64/gawk/5.3.0/bootstrap/phase1/bundles/dev
  name: gawk
- commit: x86_64/make/4.4.1/bootstrap/phase1/bundles/dev
  name: make
- commit: x86_64/patch/2.7.6/bootstrap/phase1/bundles/dev
  name: patch
- commit: x86_64/tar/1.35/bootstrap/phase1/bundles/dev
  name: tar
- commit: x86_64/texinfo/7.1/bootstrap/phase2/bundles/dev
  name: texinfo
- commit: x86_64/zlib/1.3.1/bootstrap/phase3/bundles/dev
  name: zlib
- commit: x86_64/bzip2/1.0.8/bootstrap/phase3/bundles/dev
  name: bzip2
- commit: x86_64/xz/5.4.6/bootstrap/phase3/bundles/dev
  name: xz
- commit: x86_64/file/5.45/bootstrap/phase3/bundles/dev
  name: file
- commit: x86_64/binutils/2.42/bootstrap/phase3/bundles/dev
  name: binutils
- commit: x86_64/gcc/13.2.0/bootstrap/phase3/bundles/dev
  name: gcc
- commit: x86_64/bash/5.2.21/bootstrap/phase1/bundles/dev
  name: bash
- commit: x86_64/glibc/2.39/sys/libs/bundles/dev
  name: glibc
- commit: x86_64/ncurses/6.4-20230520/sys/libs/bundles/dev
  name: ncurses

build:
  script: |
    tar --no-same-owner -xf ${SOURCE0} -C "${WORK_DIR}" --strip-components=1
    cd ${WORK_DIR}
    patch -Np1 -i /${SOURCE1}

    ./configure --prefix=/usr        \
            --bindir=/usr/bin    \
            --localstatedir=/var \
            --disable-logger     \
            --disable-whois      \
            --disable-rcp        \
            --disable-rexec      \
            --disable-rlogin     \
            --disable-rsh        \
            --disable-servers

    make
    make DESTDIR=${OUT_DIR} install
   
    find "${OUT_DIR}" -exec touch -d "2024-01-01T00:00:00+00:00" {} \;
    2nex_strip_binaries ${OUT_DIR}

bundles:
  full:
    - info
    - man
    - bin

  dev:
    - bin

outputs:
  bin:
    files:
    - /usr/bin/dnsdomainname
    - /usr/bin/ftp
    - /usr/bin/hostname
    - /usr/bin/ifconfig
    - /usr/bin/ping
    - /usr/bin/ping6
    - /usr/bin/talk
    - /usr/bin/telnet
    - /usr/bin/tftp
    - /usr/bin/traceroute
    requires:
    - x86_64/glibc/2.39/sys/libs/outputs/lib
    - x86_64/ncurses/6.4-20230520/sys/libs/outputs/lib
  info:
    files:
    - /usr/share/info/dir
    - /usr/share/info/inetutils.info
  man:
    files:
    - /usr/share/man/man1/dnsdomainname.1
    - /usr/share/man/man1/ftp.1
    - /usr/share/man/man1/hostname.1
    - /usr/share/man/man1/ifconfig.1
    - /usr/share/man/man1/ping.1
    - /usr/share/man/man1/ping6.1
    - /usr/share/man/man1/talk.1
    - /usr/share/man/man1/telnet.1
    - /usr/share/man/man1/tftp.1
    - /usr/share/man/man1/traceroute.1
