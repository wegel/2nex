package:
  schema: 1
  name: "Expect"
  slug: "expect"
  flavor: "dev/util"
  version: "5.45.4"
  description: "A program for automating interactive applications"
  homepage: "https://core.tcl.tk/expect/"
  checksum: 8c3eb7984679f7effd31054907b7f775e3c1f78124b8457bf8fe62d64beeb6f3

sources:
  - name: "expect"
    url: "https://downloads.sourceforge.net/expect/expect5.45.4.tar.gz"
    sha256: "49a7da83b0bdd9f46d04a04deec19c7767bb9a323e40c4781f89caf760b92c34"
  - name: "patch"
    url: "https://raw.githubusercontent.com/buildroot/buildroot/c05e6aa361a4049eabd8b21eb64a34899ef83fc7/package/expect/0001-enable-cross-compilation.patch"
    sha256: "bd1448c28bc35728b958b4a9f1dfe7be53196306e6ea7775ca5d4b3fe082dd2e"

dependencies:
- commit: x86_64/bootstrap_tools/0.0.1/bootstrap/phase1/bundles/dev
  name: bootstrap_tools
- commit: x86_64/gcc/13.2.0/bootstrap/phase1/outputs/lib
  name: gcc
- commit: x86_64/gmp-bootstrap/6.3.0/bootstrap/phase3/outputs/lib
  name: gmp-bootstrap
- commit: x86_64/mpfr/4.2.1/bootstrap/phase3/outputs/lib
  name: mpfr
- commit: x86_64/glibc/2.39/sys/libs/bundles/dev
  name: glibc
- commit: x86_64/bash/5.2.21/bootstrap/phase1/bundles/dev
  name: bash
- commit: x86_64/findutils/4.9.0/bootstrap/phase1/bundles/dev
  name: findutils
- commit: x86_64/gawk/5.3.0/bootstrap/phase1/bundles/dev
  name: gawk
- commit: x86_64/grep/3.11/bootstrap/phase1/bundles/dev
  name: grep
- commit: x86_64/gzip/1.13/bootstrap/phase1/bundles/dev
  name: gzip
- commit: x86_64/make/4.4.1/bootstrap/phase1/bundles/dev
  name: make
- commit: x86_64/patch/2.7.6/bootstrap/phase1/bundles/dev
  name: patch
- commit: x86_64/sed/4.9/bootstrap/phase1/bundles/dev
  name: sed
- commit: x86_64/tar/1.35/bootstrap/phase1/bundles/dev
  name: tar
- commit: x86_64/binutils/2.42/bootstrap/phase3/bundles/dev
  name: binutils
- commit: x86_64/mpc/1.2.1/bootstrap/phase3/outputs/lib
  name: mpc
- commit: x86_64/gcc/13.2.0/bootstrap/phase3/bundles/dev
  name: gcc
- commit: x86_64/coreutils/9.5/bootstrap/phase1/outputs/bin
  name: coreutils
- commit: x86_64/python3/3.12.2/bootstrap/phase2/bundles/dev
  name: python3
- commit: x86_64/2nex-utilities-bootstrap/0.0.1/bootstrap/phase3/bundles/dev
  name: 2nex-utilities-bootstrap
- commit: x86_64/bzip2/1.0.8/bootstrap/phase3/outputs/lib
  name: bzip2
- commit: x86_64/xz/5.4.6/bootstrap/phase3/outputs/lib
  name: xz
- commit: x86_64/file/5.45/bootstrap/phase3/bundles/dev
  name: file
- commit: x86_64/glibc/2.39/sys/libs/outputs/lib
  name: glibc
- commit: x86_64/zlib/1.3.1/sys/libs/outputs/lib
  name: zlib
- commit: x86_64/tcl/8.6.14/dev/lang/bundles/dev
  name: tcl

build:  
  script: |
    tar --no-same-owner -xf ${SOURCE_expect} -C "${WORK_DIR}" --strip-components=1
    cd ${WORK_DIR}
    patch -Np1 -i /./${SOURCE_patch}

    CFLAGS="${CFLAGS/ -Werror=format-security/}"

    python3 -c "from pty import spawn; spawn([\"echo\", \"ok\"])" | grep "ok" 
    ./configure --prefix=/usr           \
              --with-tcl=/usr/lib     \
              --enable-shared         \
              --mandir=/usr/share/man \
              --with-tclinclude=/usr/include

    make
    make test
    make DESTDIR="${OUT_DIR}" install
    ln -svf expect5.45.4/libexpect5.45.4.so "${OUT_DIR}/usr/lib"
    
    find "${OUT_DIR}" -exec touch -d '2024-01-01T00:00:00+00:00' {} \;
    2nex_strip_binaries "${OUT_DIR}"
    find "${OUT_DIR}" ! -type d -exec strip-nondeterminism -T 1704067200 --normalizers +all {} \;

bundles:
  full:
    - dev
    - man
    - bin
    - lib

  dev:
    - dev
    - lib
    - bin
    
outputs:
  dev:
    files:
    - /usr/include/expect.h
    - /usr/include/expect_comm.h
    - /usr/include/expect_tcl.h
    - /usr/include/tcldbg.h
  man:
    files:
    - /usr/share/man/man1/autoexpect.1
    - /usr/share/man/man1/cryptdir.1
    - /usr/share/man/man1/decryptdir.1
    - /usr/share/man/man1/dislocate.1
    - /usr/share/man/man1/expect.1
    - /usr/share/man/man1/kibitz.1
    - /usr/share/man/man1/mkpasswd.1
    - /usr/share/man/man1/multixterm.1
    - /usr/share/man/man1/passmass.1
    - /usr/share/man/man1/tknewsbiff.1
    - /usr/share/man/man1/unbuffer.1
    - /usr/share/man/man1/xkibitz.1
    - /usr/share/man/man3/libexpect.3
  lib:
    files:
    - /usr/lib/expect5.45.4/libexpect5.45.4.so
    - /usr/lib/expect5.45.4/pkgIndex.tcl
    - /usr/lib/libexpect5.45.4.so
    requires:
    - x86_64/glibc/2.39/sys/libs/outputs/lib
  bin:
    files:
    - /usr/bin/autoexpect
    - /usr/bin/autopasswd
    - /usr/bin/cryptdir
    - /usr/bin/decryptdir
    - /usr/bin/dislocate
    - /usr/bin/expect
    - /usr/bin/ftp-rfc
    - /usr/bin/kibitz
    - /usr/bin/lpunlock
    - /usr/bin/mkpasswd
    - /usr/bin/multixterm
    - /usr/bin/passmass
    - /usr/bin/rftp
    - /usr/bin/rlogin-cwd
    - /usr/bin/timed-read
    - /usr/bin/timed-run
    - /usr/bin/tknewsbiff
    - /usr/bin/tkpasswd
    - /usr/bin/unbuffer
    - /usr/bin/weather
    - /usr/bin/xkibitz
    - /usr/bin/xpstat
    requires:
    - x86_64/glibc/2.39/sys/libs/outputs/lib
    - x86_64/tcl/8.6.14/dev/lang/outputs/lib
