schema: 1
kind: system

system:
  name: "Initramfs"
  slug: "initramfs"
  version: "0.1.0"
  architecture: "x86_64"
  description: "Initial ramdisk for early boot"
  checksum: 4afd2c372cbcb24da8e8f675a95d5113dadfaff7bba3ac0f43a91a35b00e5689

sources: []

# these are runtime dependencies
packages:
- commit: x86_64/bash/5.2.21/app/shells/outputs/bin
  name: bash
- commit: x86_64/coreutils/9.5/sys/apps/outputs/bin
  name: coreutils
- commit: x86_64/util_linux/2.40/sys/apps/outputs/bin
  name: util-linux

# these are build-time dependencies, ONLY available in the build script below to configure the
# final rootfs that's available in /target
dependencies:
- commit: x86_64/util_linux/2.40/sys/apps/outputs/lib
  name: util-linux-lib
- commit: x86_64/kmod/32/sys/kernel/outputs/bin
  name: kmod
- commit: x86_64/glibc/2.39/sys/libs/outputs/lib
  name: glibc
- commit: x86_64/inetutils/2.5/net/misc/outputs/bin
  name: inetutils
- commit: x86_64/findutils/4.9.0/sys/apps/outputs/bin
  name: findutils

build:
  script: |
    set -eux

    # create init script
    cat > /target/init <<'EOF'
    #!/usr/bin/bash
    # 2nex initramfs init script

    echo "Hello from init!"
    EOF

    chmod +x /target/init

    # create minimal device nodes (if devtmpfs fails)
    mknod -m 600 /target/dev/console c 5 1 || true
    mknod -m 666 /target/dev/null c 1 3 || true

    # deterministic timestamps
    find "/target" -exec touch -d "2024-01-01T00:00:00+00:00" {} \;

