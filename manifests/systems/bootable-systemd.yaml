system:
  schema: 1
  name: "Bootable System with systemd"
  slug: "bootable-systemd"
  version: "0.0.1"
  description: "Minimal bootable system with systemd init"

dependencies:
- commit: x86_64/findutils/4.9.0/sys/apps/bundles/dev
  name: findutils

packages:
- commit: x86_64/systemd/257.5/sys/apps/outputs/bin
  name: systemd-bin
- commit: x86_64/systemd/257.5/sys/apps/outputs/lib
  name: systemd-lib
- commit: x86_64/coreutils/9.5/sys/apps/outputs/bin
  name: coreutils-bin
- commit: x86_64/util_linux/2.40/sys/apps/outputs/bin
  name: util-linux-bin
- commit: x86_64/bash/5.2.21/app/shells/outputs/bin
  name: bash-bin

build:
  script: |
    # create minimal /etc/passwd and /etc/group with systemd users
    mkdir -p /target/etc

    cat > /target/etc/passwd << 'EOF'
    root:x:0:0:root:/root:/bin/bash
    systemd-network:x:192:192:systemd Network Management:/:/usr/bin/nologin
    systemd-resolve:x:193:193:systemd Resolver:/:/usr/bin/nologin
    systemd-timesync:x:194:194:systemd Time Synchronization:/:/usr/bin/nologin
    EOF

    cat > /target/etc/group << 'EOF'
    root:x:0:
    systemd-network:x:192:
    systemd-resolve:x:193:
    systemd-timesync:x:194:
    systemd-journal:x:190:
    EOF

    # create mount points for essential filesystems
    mkdir -p /target/{proc,sys,dev,run,tmp}

    # create minimal systemd directories
    mkdir -p /target/etc/systemd/system
    mkdir -p /target/var/log/journal
    mkdir -p /target/var/lib/systemd

    # symlink init to systemd
    ln -sf /usr/lib/systemd/systemd /target/init

    find /target -exec touch -d "2024-01-01T00:00:00+00:00" {} \;
