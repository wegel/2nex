package:
  schema: 1
  name: "Aardvark DNS"
  slug: "aardvark-dns"
  flavor: "app-containers"
  version: "1.14.0"
  description: "A container DNS server for Netavark"
  homepage: "https://github.com/containers/aardvark-dns"
  checksum: 1964dc6957435d4e066cf43714136135286d1bb74a1f6a619957e5386259ec42

sources:
  - name: "aardvark_dns"
    url: "https://github.com/containers/aardvark-dns/archive/refs/tags/v1.14.0.tar.gz"
    filename: aardvark-dns-v1.14.0.tar.gz
    sha256: "d46f170e0439fc97e15bb31d63b7464192f74809b0d54064383e6a0b592d8cfd"
  - name: "aardvark_dns_vendor"
    url: "https://github.com/containers/aardvark-dns/releases/download/v1.14.0/aardvark-dns-v1.14.0-vendor.tar.gz"
    sha256: "0de36c3b39d8babc81267148c652f3aed46e4d4306a4584b02814faa5b5628d0"

dependencies:
- commit: x86_64/bash/5.2.21/app-shells/bundles/dev
  name: bash
- commit: x86_64/coreutils/9.5/sys-apps/bundles/dev
  name: coreutils
- commit: x86_64/findutils/4.9.0/sys-apps/bundles/dev
  name: findutils
- commit: x86_64/2nex-utilities-bootstrap/0.0.1/bootstrap/phase3/bundles/dev
  name: 2nex-utilities
- commit: x86_64/gzip/1.13/app-arch/bundles/dev
  name: gzip
- commit: x86_64/tar/1.35/app-arch/bundles/dev
  name: tar
- commit: x86_64/binutils/2.42/bootstrap/phase3/bundles/dev
  name: binutils
- commit: x86_64/glibc/2.39/sys-libs/bundles/dev
  name: glibc
- commit: x86_64/gcc/13.2.0/bootstrap/phase3/bundles/dev
  name: gcc
- commit: x86_64/ncurses/6.4-20230520/sys-libs/bundles/dev
  name: ncurses
- commit: x86_64/inetutils/2.5/net-misc/bundles/dev
  name: inetutils
- commit: x86_64/attr/2.5.2/sys-libs/bundles/dev
  name: attr
- commit: x86_64/acl/2.3.2/sys-libs/bundles/dev
  name: acl
- commit: x86_64/mpc/1.2.1/bootstrap/phase3/bundles/dev
  name: mpc
- commit: x86_64/mpfr/4.2.1/bootstrap/phase3/bundles/dev
  name: mpfr
- commit: x86_64/gmp/6.3.0/sys-libs/bundles/dev
  name: gmp
- commit: x86_64/zlib/1.3.1/bootstrap/phase3/bundles/dev
  name: zlib
- commit: x86_64/rust-bin/1.76.0/dev-lang/bundles/dev
  name: rust-bin

build:
  script: |
    # Extract the aardvark-dns source code - this will create a directory like aardvark-dns-1.14.0
    tar --no-same-owner -xf ${SOURCE_aardvark_dns} -C "${WORK_DIR}" --strip-components=1
    cd ${WORK_DIR}
    # Extract the vendor tarball directly
    tar --no-same-owner -xf /./${SOURCE_aardvark_dns_vendor} -C "${WORK_DIR}"

    # Set up Rust environment
    export CARGO_HOME="${WORK_DIR}/.cargo"
    export RUSTUP_HOME="${WORK_DIR}/.rustup"
    
    # Create symlinks for compiler and linker in a system location 
    mkdir -p /usr/local/bin
    ln -sf /usr/bin/gcc /usr/local/bin/cc
    ln -sf /usr/bin/ld.bfd /usr/local/bin/ld
    export PATH="/usr/local/bin:${PATH}"
    
    # Override default RUSTFLAGS to not use lld
    export RUSTFLAGS="-C codegen-units=1 -C embed-bitcode=yes -C debuginfo=0 -C target-feature=+crt-static -C link-args=-frandom-seed=424242"
    
    # Create .cargo/config to use the vendor directory
    mkdir -p "${CARGO_HOME}"
    cat > "${CARGO_HOME}/config.toml" << EOF
    [source.crates-io]
    replace-with = "vendored-sources"
    
    [source.vendored-sources]
    directory = "vendor"
    EOF
    
    # Build with specific target to avoid proc-macro issues
    cargo build --release --offline --target x86_64-unknown-linux-gnu
    
    # Install
    mkdir -p ${OUT_DIR}/usr/bin
    install -D -m 755 target/x86_64-unknown-linux-gnu/release/aardvark-dns ${OUT_DIR}/usr/bin/aardvark-dns
    
    # Create directory for podman
    mkdir -p ${OUT_DIR}/usr/libexec/podman
    ln -sf ../../bin/aardvark-dns ${OUT_DIR}/usr/libexec/podman/aardvark-dns
    
    # Set consistent timestamps for reproducible builds
    find "${OUT_DIR}" -exec touch -d '2024-01-01T00:00:00+00:00' {} \;
    2nex_strip_binaries ${OUT_DIR}

bundles:
  full:
    - bin
  dev:
    - bin

outputs:
  bin:
    files:
    - /usr/bin/aardvark-dns
    - /usr/libexec/podman/aardvark-dns
