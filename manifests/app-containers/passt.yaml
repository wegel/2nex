package:
  schema: 1
  name: "passt"
  slug: "passt"
  flavor: "app-containers"
  version: "2025_02_17"
  description: "Plug A Simple Socket Transport - network passthrough for containers"
  homepage: "https://passt.top"
  checksum: 551f508fe2973c4416f69a9b1e2453ac6e35e1a7a166c452b7bf8df2fc47789a

sources:
  - name: "passt"
    url: "https://passt.top/passt/snapshot/passt-2025_02_17.a1e48a0.tar.gz"
    sha256: "fc5517c5e62fdcb6f40e25e66d2d8f5337cb2f96701c9e36b62b87ed89e59631"

dependencies:
- commit: x86_64/bash/5.2.21/app-shells/bundles/dev
  name: bash
- commit: x86_64/coreutils/9.5/sys-apps/bundles/dev
  name: coreutils
- commit: x86_64/findutils/4.9.0/sys-apps/bundles/dev
  name: findutils
- commit: x86_64/2nex-utilities-bootstrap/0.0.1/bootstrap/phase3/bundles/dev
  name: 2nex-utilities
- commit: x86_64/gzip/1.13/app-arch/bundles/dev
  name: gzip
- commit: x86_64/make/4.4.1/sys-devel/bundles/dev
  name: make
- commit: x86_64/sed/4.9/sys-apps/bundles/dev
  name: sed
- commit: x86_64/tar/1.35/app-arch/bundles/dev
  name: tar
- commit: x86_64/binutils/2.42/bootstrap/phase3/bundles/dev
  name: binutils
- commit: x86_64/glibc/2.39/sys-libs/bundles/dev
  name: glibc
- commit: x86_64/gcc/13.2.0/bootstrap/phase3/bundles/dev
  name: gcc
- commit: x86_64/linux-headers/6.4.1/bootstrap/phase3/bundles/dev
  name: linux-headers
- commit: x86_64/ncurses/6.4-20230520/sys-libs/bundles/dev
  name: ncurses
- commit: x86_64/inetutils/2.5/net-misc/bundles/dev
  name: inetutils
- commit: x86_64/attr/2.5.2/sys-libs/bundles/dev
  name: attr
- commit: x86_64/acl/2.3.2/sys-libs/bundles/dev
  name: acl
- commit: x86_64/mpc/1.2.1/bootstrap/phase3/bundles/dev
  name: mpc
- commit: x86_64/mpfr/4.2.1/bootstrap/phase3/bundles/dev
  name: mpfr
- commit: x86_64/gmp/6.3.0/sys-libs/bundles/dev
  name: gmp
- commit: x86_64/zlib/1.3.1/bootstrap/phase3/bundles/dev
  name: zlib

build:
  script: |
    tar --no-same-owner -xf ${SOURCE_passt} -C "${WORK_DIR}" --strip-components=1
    cd ${WORK_DIR}
    
    # Build
    export CC=gcc
    make prefix=/usr CC=gcc
    
    # Install
    make DESTDIR="${OUT_DIR}" prefix=/usr CC=gcc install
    
    # Create directory for podman
    mkdir -p ${OUT_DIR}/usr/libexec/podman
    ln -sf ../../bin/pasta ${OUT_DIR}/usr/libexec/podman/pasta
    
    # Set consistent timestamps for reproducible builds
    find "${OUT_DIR}" -exec touch -d '2024-01-01T00:00:00+00:00' {} \;
    #2nex_strip_binaries ${OUT_DIR}

bundles:
  full:
    - bin
    - man
    - doc
  dev:
    - bin

outputs:
  bin:
    files:
    - /usr/bin/passt
    - /usr/bin/passt-repair
    - /usr/bin/passt.avx2
    - /usr/bin/pasta
    - /usr/bin/pasta.avx2
    - /usr/bin/qrap
    - /usr/libexec/podman/pasta
    requires:
    - x86_64/glibc/2.39/sys-libs/outputs/lib
  man:
    files:
    - /usr/share/man/man1/passt-repair.1
    - /usr/share/man/man1/passt.1
    - /usr/share/man/man1/pasta.1
    - /usr/share/man/man1/qrap.1
  doc:
    files:
    - /usr/share/doc/passt/README.md
    - /usr/share/doc/passt/demo.sh
    requires:
    - x86_64/bash/5.2.21/app-shells/outputs/bin
