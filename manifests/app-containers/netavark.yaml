package:
  schema: 1
  name: "Netavark"
  slug: "netavark"
  flavor: "app-containers"
  version: "1.14.0"
  description: "A container network stack"
  homepage: "https://github.com/containers/netavark"

sources:
  - name: "netavark"
    url: "https://github.com/containers/netavark/archive/refs/tags/v1.14.1.tar.gz"
    sha256: "fd4a25db0abe73e2d0d7a9958f298ace134671edc64259cbc8ea3c2907f89dd8"
  - name: "netavark_vendor"
    url: "https://github.com/containers/netavark/releases/download/v1.14.1/netavark-v1.14.1-vendor.tar.gz"
    sha256: "0e218da756515c767a4e7e5aa8178e40073317c85decdbbbed5d1f4238c4fce0"

dependencies:
- commit: x86_64/bash/5.2.21/app-shells/bundles/dev
  name: bash
- commit: x86_64/coreutils/9.5/sys-apps/bundles/dev
  name: coreutils
- commit: x86_64/findutils/4.9.0/sys-apps/bundles/dev
  name: findutils
- commit: x86_64/2nex-utilities-bootstrap/0.0.1/bootstrap/phase3/bundles/dev
  name: 2nex-utilities
- commit: x86_64/gzip/1.13/app-arch/bundles/dev
  name: gzip
- commit: x86_64/tar/1.35/app-arch/bundles/dev
  name: tar
- commit: x86_64/binutils/2.42/bootstrap/phase3/bundles/dev
  name: binutils
- commit: x86_64/glibc/2.39/sys-libs/bundles/dev
  name: glibc
- commit: x86_64/gcc/13.2.0/bootstrap/phase3/bundles/dev
  name: gcc
- commit: x86_64/ncurses/6.4-20230520/bootstrap/phase3/bundles/dev
  name: ncurses
- commit: x86_64/inetutils/2.5/net-misc/bundles/dev
  name: inetutils
- commit: x86_64/attr/2.5.2/bootstrap/phase3/bundles/dev
  name: attr
- commit: x86_64/acl/2.3.2/bootstrap/phase3/bundles/dev
  name: acl
- commit: x86_64/mpc/1.2.1/bootstrap/phase3/bundles/dev
  name: mpc
- commit: x86_64/mpfr/4.2.1/bootstrap/phase3/bundles/dev
  name: mpfr
- commit: x86_64/gmp/6.3.0/sys-libs/bundles/dev
  name: gmp
- commit: x86_64/zlib/1.3.1/bootstrap/phase3/bundles/dev
  name: zlib
- commit: x86_64/rust-bin/1.76.0/dev-lang/bundles/dev
  name: rust-bin
- commit: x86_64/protobuf/30.2/dev-libs/bundles/dev
  name: protobuf

build:
  script: |
    # Extract the netavark source code
    echo "Extracting ${SOURCE_netavark}"
    tar --no-same-owner -xf ${SOURCE_netavark} -C "${WORK_DIR}" --strip-components=1
    cd ${WORK_DIR}
    
    # Extract the vendored dependencies
    # The vendor tarball already contains the 'vendor' directory
    echo "Extracting ${SOURCE_netavark_vendor}"
    tar --no-same-owner -xf /./${SOURCE_netavark_vendor} -C "${WORK_DIR}"
    
    # Set up Rust environment
    export CARGO_HOME="${WORK_DIR}/.cargo"
    export RUSTUP_HOME="${WORK_DIR}/.rustup"
    
    # Create symlinks for compiler and linker in a system location
    mkdir -p /usr/local/bin
    ln -sf /usr/bin/gcc /usr/local/bin/cc
    ln -sf /usr/bin/ld.bfd /usr/local/bin/ld
    export PATH="/usr/local/bin:${PATH}"
    
    # Override default RUSTFLAGS to not use lld
    export RUSTFLAGS="-C codegen-units=1 -C embed-bitcode=yes -C debuginfo=0 -C target-feature=+crt-static -C link-args=-frandom-seed=424242"
    
    # Create .cargo/config to use the vendor directory
    mkdir -p "${CARGO_HOME}"
    cat > "${CARGO_HOME}/config.toml" << EOF
    [source.crates-io]
    replace-with = "vendored-sources"
    
    [source.vendored-sources]
    directory = "vendor"
    EOF
    
    # Build with specific target to avoid proc-macro issues
    cargo build --release --offline --target x86_64-unknown-linux-gnu
    
    # Install
    mkdir -p ${OUT_DIR}/usr/bin
    install -D -m 755 target/x86_64-unknown-linux-gnu/release/netavark ${OUT_DIR}/usr/bin/netavark
    
    # Create directory for podman
    mkdir -p ${OUT_DIR}/usr/libexec/podman
    ln -sf ../../bin/netavark ${OUT_DIR}/usr/libexec/podman/netavark
    
    # Create containers configuration directory
    mkdir -p ${OUT_DIR}/etc/containers/containers.conf.d
    printf '[network]\nfirewall_driver = "nftables"\n' > ${OUT_DIR}/etc/containers/containers.conf.d/50-buildroot-nftables.conf
    
    # Set consistent timestamps for reproducible builds
    find "${OUT_DIR}" -exec touch -d '2024-01-01T00:00:00+00:00' {} \;
    2nex_strip_binaries ${OUT_DIR}

bundles:
  full:
    - bin
    - conf
  dev:
    - bin

outputs:
  bin:
    files:
    - /usr/bin/netavark
    - /usr/libexec/podman/netavark
  conf:
    files:
    - /etc/containers/containers.conf.d/50-buildroot-nftables.conf
