build:
  script: |
    tar --no-same-owner -xf /./${SOURCE_podman} -C "${WORK_DIR}" --strip-components=1
    cd ${WORK_DIR}
    
    # Set up Go environment
    export GOROOT="/usr/lib/go"
    export GOPATH="${WORK_DIR}/gopath"
    export PATH="/usr/bin:/usr/lib/go/bin:${PATH}"
    export CGO_ENABLED=1
    export GO111MODULE=on
    export GOFLAGS="-tags=exclude_graphdriver_devicemapper,seccomp,libsubid -ldflags=-compressdwarf=false"
    
    # Set up proxy to disable external downloads
    export GOPROXY=off
    export GOSUMDB=off
    
    # Create symlinks for compiler and linker to ensure build tools can find them
    mkdir -p /usr/local/bin
    ln -sf /usr/bin/gcc /usr/local/bin/cc
    ln -sf /usr/bin/ld.bfd /usr/local/bin/ld
    export PATH="/usr/local/bin:${PATH}"
    
    # Configure PKG_CONFIG_PATH for dependencies
    export PKG_CONFIG_PATH="/usr/lib/pkgconfig:/usr/lib64/pkgconfig:/usr/share/pkgconfig"
    
    # Configure library path to ensure libcrypt is found
    export LD_LIBRARY_PATH="/usr/lib:/usr/lib64"
    
    # Build all required binaries
    make BUILDTAGS="seccomp exclude_graphdriver_devicemapper libsubid" GO=go GIT_COMMIT=v5.4.1 podman podman-remote rootlessport
    
    # Install binaries only, skip manpages
    mkdir -p ${OUT_DIR}/usr/bin ${OUT_DIR}/usr/libexec/podman
    install -m 755 bin/podman ${OUT_DIR}/usr/bin/podman
    install -m 755 bin/podman-remote ${OUT_DIR}/usr/bin/podman-remote
    ln -sf podman ${OUT_DIR}/usr/bin/podmansh
    install -m 755 bin/rootlessport ${OUT_DIR}/usr/libexec/podman/rootlessport
    
    # Install container configuration files
    mkdir -p ${OUT_DIR}/etc/containers
    install -m 644 /./${SOURCE_policy_json} ${OUT_DIR}/etc/containers/policy.json
    install -m 644 /./${SOURCE_registries_conf} ${OUT_DIR}/etc/containers/registries.conf
    
    # Set consistent timestamps for reproducible builds
    find "${OUT_DIR}" -exec touch -d '2024-01-01T00:00:00+00:00' {} \;
    find "${OUT_DIR}" ! -type d -exec strip-nondeterminism -T 1704067200 --normalizers +all {} \; || true
    2nex_strip_binaries ${OUT_DIR}

bundles:
  full:
    - bin
    - conf
  dev:
    - bin
    - conf

outputs:
  bin:
    files:
    - /usr/bin/podman
    - /usr/bin/podman-remote
    - /usr/bin/podmansh
    - /usr/libexec/podman/rootlessport
    requires:
    - x86_64/glibc/2.39/sys-libs/outputs/lib
    - x86_64/libgpgme/1.23.2/dev-libs/outputs/lib
    - x86_64/libseccomp/2.5.6/dev-libs/outputs/lib
    - x86_64/shadow/4.15.1/bootstrap/phase3/outputs/lib
  conf:
    files:
    - /etc/containers/policy.json
    - /etc/containers/registries.conf
