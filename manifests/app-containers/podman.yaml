package:
  schema: 1
  name: "Podman"
  slug: "podman"
  flavor: "app-containers"
  version: "5.4.1"
  description: "A tool for managing OCI containers and pods"
  homepage: "https://podman.io/"
  checksum: bf58ea90deec9e99285dc84f617d00117cda2629e83e21f9b81da8533faeb75f

sources:
  - name: "podman"
    url: "https://github.com/containers/podman/archive/refs/tags/v5.4.1.tar.gz"
    sha256: "502117195c06678db612313aaf42505cabeea860f8668802a0608754eb0df9f6"
  - name: "policy_json"
    url: "https://raw.githubusercontent.com/buildroot/buildroot/ebbaac08e3f462bf023c12077f739ed1c0543eb2/package/podman/policy.json"
    sha256: "dcb3a91795cecb9021141bc565d30a64ebfe754934390ceff6ad2920507010b3"
  - name: "registries_conf"
    url: "https://raw.githubusercontent.com/buildroot/buildroot/ebbaac08e3f462bf023c12077f739ed1c0543eb2/package/podman/registries.conf"
    sha256: "ec865a599049720379ebd5b1bcc5a7ad31a341fe624f1e42ac6f98a5b5d0575e"

