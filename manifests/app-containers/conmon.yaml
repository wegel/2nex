package:
  schema: 1
  name: "Conmon"
  slug: "conmon"
  flavor: "app-containers"
  version: "2.1.8"
  description: "A container monitor for podman and other OCI container runtimes"
  homepage: "https://github.com/containers/conmon"
  checksum: 5d8ee01f1ee57dc1c511f108d25ace8485b7acb019b0a37aef9f34ec1699bb5e

sources:
  - name: "conmon"
    url: "https://github.com/containers/conmon/archive/refs/tags/v2.1.8.tar.gz"
    sha256: "e72c090210a03ca3b43a0fad53f15bca90bbee65105c412468009cf3a5988325"
  - name: "seccomp_patch"
    url: "https://raw.githubusercontent.com/buildroot/buildroot/master/package/conmon/0001-src-seccomp_notify.c-fix-static-build.patch"
    sha256: "6e09ee2abf5f9dbb4f45f9240ed37469997f053c27968ad7dab00f881eef0fe7"

dependencies:
- commit: x86_64/bash/5.2.21/app-shells/bundles/dev
  name: bash
- commit: x86_64/coreutils/9.5/sys-apps/bundles/dev
  name: coreutils
- commit: x86_64/findutils/4.9.0/sys-apps/bundles/dev
  name: findutils
- commit: x86_64/2nex-utilities-bootstrap/0.0.1/bootstrap/phase3/bundles/dev
  name: 2nex-utilities
- commit: x86_64/gzip/1.13/app-arch/bundles/dev
  name: gzip
- commit: x86_64/make/4.4.1/sys-devel/bundles/dev
  name: make
- commit: x86_64/tar/1.35/app-arch/bundles/dev
  name: tar
- commit: x86_64/binutils/2.42/bootstrap/phase3/bundles/dev
  name: binutils
- commit: x86_64/glibc/2.39/sys-libs/bundles/dev
  name: glibc
- commit: x86_64/gcc/13.2.0/bootstrap/phase3/bundles/dev
  name: gcc
- commit: x86_64/ncurses/6.4-20230520/sys-libs/bundles/dev
  name: ncurses
- commit: x86_64/inetutils/2.5/net-misc/bundles/dev
  name: inetutils
- commit: x86_64/attr/2.5.2/sys-libs/bundles/dev
  name: attr
- commit: x86_64/acl/2.3.2/sys-libs/bundles/dev
  name: acl
- commit: x86_64/mpc/1.2.1/bootstrap/phase3/bundles/dev
  name: mpc
- commit: x86_64/mpfr/4.2.1/bootstrap/phase3/bundles/dev
  name: mpfr
- commit: x86_64/gmp/6.3.0/sys-libs/bundles/dev
  name: gmp
- commit: x86_64/zlib/1.3.1/bootstrap/phase3/bundles/dev
  name: zlib
- commit: x86_64/linux-headers/6.4.1/bootstrap/phase3/bundles/dev
  name: linux-headers
- commit: x86_64/glib2/2.84.0/dev-libs/bundles/dev
  name: libglib2
- commit: x86_64/libseccomp/2.5.6/dev-libs/bundles/dev
  name: libseccomp
- commit: x86_64/patch/2.7.6/sys-devel/bundles/dev
  name: patch
- commit: x86_64/pkgconf/2.2.0/bootstrap/phase3/bundles/dev
  name: pkgconf
- commit: x86_64/pcre2/10.44/dev-libs/bundles/dev
  name: pcre2

build:
  script: |
    tar --no-same-owner -xf ${SOURCE_conmon} -C "${WORK_DIR}" --strip-components=1
    cd ${WORK_DIR}
    
    # Apply the seccomp patch
    patch -Np1 -i "/./${SOURCE_seccomp_patch}"
    
    # Create seccomp-notify script
    printf '#!/bin/bash\necho "0"\n' > hack/seccomp-notify.sh
    chmod +x hack/seccomp-notify.sh
    
    # Build using gcc explicitly with proper include paths for glib
    make CC=gcc CFLAGS="-std=c99 ${CFLAGS} -I/usr/lib/glib-2.0/include" LDFLAGS="${LDFLAGS}"
    
    # Install
    mkdir -p ${OUT_DIR}/usr/bin
    install -D -m 755 bin/conmon ${OUT_DIR}/usr/bin/conmon
    
    # Set consistent timestamps for reproducible builds
    find "${OUT_DIR}" -exec touch -d '2024-01-01T00:00:00+00:00' {} \;
    2nex_strip_binaries ${OUT_DIR}

bundles:
  full:
    - bin
  dev:
    - bin

outputs:
  bin:
    files:
    - /usr/bin/conmon
    requires:
    - x86_64/gcc/13.2.0/bootstrap/phase3/outputs/lib
    - x86_64/glib2/2.84.0/dev-libs/outputs/lib
    - x86_64/glibc/2.39/sys-libs/outputs/lib
