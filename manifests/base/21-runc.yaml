package:
  schema: 1
  name: "runc"
  slug: "runc"
  flavor: "base"
  version: "1.2.4"
  description: "CLI tool for spawning and running containers according to the OCI specification"
  homepage: "https://github.com/opencontainers/runc"

sources:
  - name: "runc"
    url: "https://github.com/opencontainers/runc/archive/refs/tags/v1.2.4.tar.gz"
    sha256: "9785c144c97974b52b6091b7a79168b73681ff574bc8438b44f3f5f8c112f171"

dependencies:
- commit: x86_64/bash/5.2.21/bootstrap/phase3/bundles/dev
  name: bash
- commit: x86_64/coreutils/9.5/bootstrap/phase3/bundles/dev
  name: coreutils
- commit: x86_64/findutils/4.9.0/bootstrap/phase3/bundles/dev
  name: findutils
- commit: x86_64/2nex-utilities/0.0.1/bootstrap/phase3/bundles/dev
  name: 2nex-utilities
- commit: x86_64/gzip/1.13/bootstrap/phase3/bundles/dev
  name: gzip
- commit: x86_64/make/4.4.1/bootstrap/phase3/bundles/dev
  name: make
- commit: x86_64/tar/1.35/bootstrap/phase3/bundles/dev
  name: tar
- commit: x86_64/binutils/2.42/bootstrap/phase3/bundles/dev
  name: binutils
- commit: x86_64/glibc/2.39/bootstrap/phase3/bundles/dev
  name: glibc
- commit: x86_64/gcc/13.2.0/bootstrap/phase3/bundles/dev
  name: gcc
- commit: x86_64/pkgconf/2.2.0/bootstrap/phase3/bundles/dev
  name: pkgconf
- commit: x86_64/linux-headers/6.4.1/bootstrap/phase3/bundles/dev
  name: linux-headers
- commit: x86_64/ncurses/6.4-20230520/bootstrap/phase3/bundles/dev
  name: ncurses
- commit: x86_64/inetutils/2.5/bootstrap/phase3/bundles/dev
  name: inetutils
- commit: x86_64/attr/2.5.2/bootstrap/phase3/bundles/dev
  name: attr
- commit: x86_64/acl/2.3.2/bootstrap/phase3/bundles/dev
  name: acl
- commit: x86_64/mpc/1.2.1/bootstrap/phase3/bundles/dev
  name: mpc
- commit: x86_64/mpfr/4.2.1/bootstrap/phase3/bundles/dev
  name: mpfr
- commit: x86_64/gmp/6.3.0/bootstrap/phase3/bundles/dev
  name: gmp
- commit: x86_64/zlib/1.3.1/bootstrap/phase3/bundles/dev
  name: zlib
- commit: x86_64/libseccomp/2.5.6/base/bundles/dev
  name: libseccomp
- commit: x86_64/go/1.23.8/base/bundles/dev
  name: go

build:
  script: |
    tar --no-same-owner -xf ${SOURCE_runc} -C "${WORK_DIR}" --strip-components=1
    cd ${WORK_DIR}
    
    # Set up Go environment
    export GOPATH="${WORK_DIR}/gopath"
    export GOROOT="/usr/lib/go"
    export PATH="/usr/bin:/usr/lib/go/bin:${PATH}"
    export GOFLAGS="-ldflags=-compressdwarf=false"
    
    # Build with seccomp support
    make BUILDTAGS="seccomp cgo static_build" EXTRA_LDFLAGS="-X main.version=1.2.4"
    
    # Install
    mkdir -p ${OUT_DIR}/usr/bin
    install -D -m 755 runc ${OUT_DIR}/usr/bin/runc
    
    # Set consistent timestamps for reproducible builds
    find "${OUT_DIR}" -exec touch -d '2024-01-01T00:00:00+00:00' {} \;
    2nex_strip_binaries ${OUT_DIR}

bundles:
  full:
    - bin
  dev:
    - bin

outputs:
  bin:
    - /usr/bin/runc
