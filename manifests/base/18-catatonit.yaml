package:
  schema: 1
  name: "Catatonit"
  slug: "catatonit"
  flavor: "base"
  version: "0.2.1"
  description: "A container init system with simple and predictable behavior"
  homepage: "https://github.com/openSUSE/catatonit"

sources:
  - name: "catatonit"
    url: "https://github.com/openSUSE/catatonit/archive/refs/tags/v0.2.1.tar.gz"
    sha256: "771385049516fdd561fbb9164eddf376075c4c7de3900a8b18654660172748f1"

dependencies:
- commit: x86_64/bash/5.2.21/bootstrap/phase3/bundles/dev
  name: bash
- commit: x86_64/coreutils/9.5/bootstrap/phase3/bundles/dev
  name: coreutils
- commit: x86_64/findutils/4.9.0/bootstrap/phase3/bundles/dev
  name: findutils
- commit: x86_64/2nex-utilities/0.0.1/bootstrap/phase3/bundles/dev
  name: 2nex-utilities
- commit: x86_64/gawk/5.3.0/bootstrap/phase3/bundles/dev
  name: gawk
- commit: x86_64/grep/3.11/bootstrap/phase3/bundles/dev
  name: grep
- commit: x86_64/gzip/1.13/bootstrap/phase3/bundles/dev
  name: gzip
- commit: x86_64/make/4.4.1/bootstrap/phase3/bundles/dev
  name: make
- commit: x86_64/sed/4.9/bootstrap/phase3/bundles/dev
  name: sed
- commit: x86_64/tar/1.35/bootstrap/phase3/bundles/dev
  name: tar
- commit: x86_64/binutils/2.42/bootstrap/phase3/bundles/dev
  name: binutils
- commit: x86_64/glibc/2.39/bootstrap/phase3/bundles/dev
  name: glibc
- commit: x86_64/gcc/13.2.0/bootstrap/phase3/bundles/dev
  name: gcc
- commit: x86_64/autoconf/2.72/bootstrap/phase3/bundles/dev
  name: autoconf
- commit: x86_64/automake/1.16.5/bootstrap/phase3/bundles/dev
  name: automake
- commit: x86_64/libtool/2.4.7/bootstrap/phase3/bundles/dev
  name: libtool
- commit: x86_64/ncurses/6.4-20230520/bootstrap/phase3/bundles/dev
  name: ncurses
- commit: x86_64/inetutils/2.5/bootstrap/phase3/bundles/dev
  name: inetutils
- commit: x86_64/attr/2.5.2/bootstrap/phase3/bundles/dev
  name: attr
- commit: x86_64/acl/2.3.2/bootstrap/phase3/bundles/dev
  name: acl
- commit: x86_64/mpc/1.2.1/bootstrap/phase3/bundles/dev
  name: mpc
- commit: x86_64/mpfr/4.2.1/bootstrap/phase3/bundles/dev
  name: mpfr
- commit: x86_64/gmp/6.3.0/bootstrap/phase3/bundles/dev
  name: gmp
- commit: x86_64/libcap/2.69/bootstrap/phase3/bundles/dev
  name: libcap
- commit: x86_64/zlib/1.3.1/bootstrap/phase3/bundles/dev
  name: zlib
- commit: x86_64/perl/5.38.2/bootstrap/phase3/bundles/dev
  name: perl
- commit: x86_64/m4/1.4.19/bootstrap/phase3/bundles/dev
  name: m4
- commit: x86_64/linux-headers/6.4.1/bootstrap/phase3/bundles/dev
  name: linux-headers

build:
  script: |
    tar --no-same-owner -xf ${SOURCE_catatonit} -C "${WORK_DIR}" --strip-components=1
    cd ${WORK_DIR}
    
    # Bootstrap the build system
    autoreconf -fi
    
    # Configure
    ./configure --prefix=/usr
    
    # Build
    make
    
    # Install
    make DESTDIR="${OUT_DIR}" install
    
    # Create directory for podman
    mkdir -p ${OUT_DIR}/usr/libexec/podman
    ln -sf ../../bin/catatonit ${OUT_DIR}/usr/libexec/podman/catatonit
    
    # Set consistent timestamps for reproducible builds
    find "${OUT_DIR}" -exec touch -d '2024-01-01T00:00:00+00:00' {} \;
    2nex_strip_binaries ${OUT_DIR}

bundles:
  full:
    - bin
  dev:
    - bin

outputs:
  bin:
    - /usr/bin/catatonit
    - /usr/libexec/podman/catatonit
