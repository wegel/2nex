package:
  schema: 1
  name: "libassuan"
  slug: "libassuan"
  flavor: "base"
  version: "2.5.7"
  description: "IPC library used by GnuPG and related software"
  homepage: "https://www.gnupg.org/software/libassuan/"

sources:
  - name: "libassuan"
    url: "https://gnupg.org/ftp/gcrypt/libassuan/libassuan-2.5.7.tar.bz2"
    sha256: 0103081ffc27838a2e50479153ca105e873d3d65d8a9593282e9c94c7e6afb76

dependencies:
- commit: x86_64/bash/5.2.21/bootstrap/phase3/bundles/dev
  name: bash
- commit: x86_64/coreutils/9.5/bootstrap/phase3/bundles/dev
  name: coreutils
- commit: x86_64/findutils/4.9.0/bootstrap/phase3/bundles/dev
  name: findutils
- commit: x86_64/2nex-utilities/0.0.1/bootstrap/phase3/bundles/dev
  name: 2nex-utilities
- commit: x86_64/gawk/5.3.0/bootstrap/phase3/bundles/dev
  name: gawk
- commit: x86_64/grep/3.11/bootstrap/phase3/bundles/dev
  name: grep
- commit: x86_64/make/4.4.1/bootstrap/phase3/bundles/dev
  name: make
- commit: x86_64/sed/4.9/bootstrap/phase3/bundles/dev
  name: sed
- commit: x86_64/tar/1.35/bootstrap/phase3/bundles/dev
  name: tar
- commit: x86_64/binutils/2.42/bootstrap/phase3/bundles/dev
  name: binutils
- commit: x86_64/inetutils/2.5/bootstrap/phase3/bundles/dev
  name: inetutils
- commit: x86_64/glibc/2.39/bootstrap/phase3/bundles/dev
  name: glibc
- commit: x86_64/gcc/13.2.0/bootstrap/phase3/bundles/dev
  name: gcc
- commit: x86_64/acl/2.3.2/bootstrap/phase3/bundles/dev
  name: acl
- commit: x86_64/attr/2.5.2/bootstrap/phase3/bundles/dev
  name: attr
- commit: x86_64/bzip2/1.0.8/bootstrap/phase3/bundles/dev
  name: bzip2
- commit: x86_64/gmp/6.3.0/bootstrap/phase3/bundles/dev
  name: gmp
- commit: x86_64/libcap/2.69/bootstrap/phase3/bundles/dev
  name: libcap
- commit: x86_64/mpfr/4.2.1/bootstrap/phase3/bundles/dev
  name: mpfr
- commit: x86_64/zlib/1.3.1/bootstrap/phase3/bundles/dev
  name: zlib
- commit: x86_64/linux-headers/6.4.1/bootstrap/phase3/bundles/dev
  name: linux-headers
- commit: x86_64/mpc/1.2.1/bootstrap/phase3/bundles/dev
  name: mpc
- commit: x86_64/ncurses/6.4-20230520/bootstrap/phase3/bundles/dev
  name: ncurses
- commit: x86_64/libgpg-error/1.51/base/bundles/dev
  name: libgpg-error

build:
  script: |
    tar --no-same-owner -xf ${SOURCE_libassuan} -C "${WORK_DIR}" --strip-components=1
    cd ${WORK_DIR}
    
    # Configure
    ./configure --prefix=/usr --disable-static
    
    # Build
    make
    
    # Install
    make DESTDIR="${OUT_DIR}" install
    
    # Set consistent timestamps for reproducible builds
    find "${OUT_DIR}" -exec touch -d '2024-01-01T00:00:00+00:00' {} \;
    find "${OUT_DIR}" ! -type d -exec strip-nondeterminism -T 1704067200 --normalizers +all {} \; || true
    2nex_strip_binaries ${OUT_DIR}

bundles:
  full:
    - bin
    - lib
    - dev
  dev:
    - bin
    - lib
    - dev

outputs:
  bin:
    - /usr/bin/libassuan-config
  lib:
    - /usr/lib/libassuan.so
    - /usr/lib/libassuan.so.0
    - /usr/lib/libassuan.so.0.8.7
  dev:
    - /usr/include/assuan.h
    - /usr/lib/libassuan.la
    - /usr/lib/pkgconfig/libassuan.pc
    - /usr/share/aclocal/libassuan.m4
