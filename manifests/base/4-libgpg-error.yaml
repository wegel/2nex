package:
  schema: 1
  name: "libgpg-error"
  slug: "libgpg-error"
  flavor: "base"
  version: "1.51"
  description: "Library that defines common error values for all GnuPG components"
  homepage: "https://www.gnupg.org/software/libgpg-error/"

sources:
  - name: "libgpg_error"
    url: "https://gnupg.org/ftp/gcrypt/libgpg-error/libgpg-error-1.51.tar.bz2"
    sha256: be0f1b2db6b93eed55369cdf79f19f72750c8c7c39fc20b577e724545427e6b2

dependencies:
- commit: x86_64/bash/5.2.21/bootstrap/phase3/bundles/dev
  name: bash
- commit: x86_64/coreutils/9.5/bootstrap/phase3/bundles/dev
  name: coreutils
- commit: x86_64/findutils/4.9.0/bootstrap/phase3/bundles/dev
  name: findutils
- commit: x86_64/2nex-utilities/0.0.1/bootstrap/phase3/bundles/dev
  name: 2nex-utilities
- commit: x86_64/gawk/5.3.0/bootstrap/phase3/bundles/dev
  name: gawk
- commit: x86_64/grep/3.11/bootstrap/phase3/bundles/dev
  name: grep
- commit: x86_64/make/4.4.1/bootstrap/phase3/bundles/dev
  name: make
- commit: x86_64/sed/4.9/bootstrap/phase3/bundles/dev
  name: sed
- commit: x86_64/tar/1.35/bootstrap/phase3/bundles/dev
  name: tar
- commit: x86_64/binutils/2.42/bootstrap/phase3/bundles/dev
  name: binutils
- commit: x86_64/inetutils/2.5/bootstrap/phase3/bundles/dev
  name: inetutils
- commit: x86_64/glibc/2.39/bootstrap/phase3/bundles/dev
  name: glibc
- commit: x86_64/gcc/13.2.0/bootstrap/phase3/bundles/dev
  name: gcc
- commit: x86_64/acl/2.3.2/bootstrap/phase3/bundles/dev
  name: acl
- commit: x86_64/attr/2.5.2/bootstrap/phase3/bundles/dev
  name: attr
- commit: x86_64/bzip2/1.0.8/bootstrap/phase3/bundles/dev
  name: bzip2
- commit: x86_64/gmp/6.3.0/bootstrap/phase3/bundles/dev
  name: gmp
- commit: x86_64/libcap/2.69/bootstrap/phase3/bundles/dev
  name: libcap
- commit: x86_64/mpfr/4.2.1/bootstrap/phase3/bundles/dev
  name: mpfr
- commit: x86_64/zlib/1.3.1/bootstrap/phase3/bundles/dev
  name: zlib
- commit: x86_64/linux-headers/6.4.1/bootstrap/phase3/bundles/dev
  name: linux-headers
- commit: x86_64/mpc/1.2.1/bootstrap/phase3/bundles/dev
  name: mpc
- commit: x86_64/ncurses/6.4-20230520/bootstrap/phase3/bundles/dev
  name: ncurses

build:
  script: |
    tar --no-same-owner -xf ${SOURCE_libgpg_error} -C "${WORK_DIR}" --strip-components=1
    cd ${WORK_DIR}
    
    # Configure
    ./configure --prefix=/usr --disable-static
    
    # Build
    make
    
    # Install
    make DESTDIR="${OUT_DIR}" install
    
    # Set consistent timestamps for reproducible builds
    find "${OUT_DIR}" -exec touch -d '2024-01-01T00:00:00+00:00' {} \;
    find "${OUT_DIR}" ! -type d -exec strip-nondeterminism -T 1704067200 --normalizers +all {} \; || true
    2nex_strip_binaries ${OUT_DIR}

bundles:
  full:
    - bin
    - lib
    - dev
  dev:
    - bin
    - lib
    - dev

outputs:
  info:
    files:
    - /usr/share/info/gpgrt.info
  man:
    files:
    - /usr/share/man/man1/gpgrt-config.1
  bin:
    files:
    - /usr/bin/gpg-error
    - /usr/bin/gpgrt-config
    - /usr/bin/yat2m
    requires:
    - x86_64/bash/5.2.21/bootstrap/phase3/outputs/bin
    - x86_64/glibc/2.39/bootstrap/phase3/outputs/lib
  dev:
    files:
    - /usr/include/gpg-error.h
    - /usr/include/gpgrt.h
    - /usr/lib/libgpg-error.la
    - /usr/lib/pkgconfig/gpg-error.pc
  lib:
    files:
    - /usr/lib/libgpg-error.so
    - /usr/lib/libgpg-error.so.0
    - /usr/lib/libgpg-error.so.0.38.0
    requires:
    - x86_64/glibc/2.39/bootstrap/phase3/outputs/lib
  locale:
    files:
    - /usr/share/locale/cs/LC_MESSAGES/libgpg-error.mo
    - /usr/share/locale/da/LC_MESSAGES/libgpg-error.mo
    - /usr/share/locale/de/LC_MESSAGES/libgpg-error.mo
    - /usr/share/locale/eo/LC_MESSAGES/libgpg-error.mo
    - /usr/share/locale/es/LC_MESSAGES/libgpg-error.mo
    - /usr/share/locale/fr/LC_MESSAGES/libgpg-error.mo
    - /usr/share/locale/hu/LC_MESSAGES/libgpg-error.mo
    - /usr/share/locale/it/LC_MESSAGES/libgpg-error.mo
    - /usr/share/locale/ja/LC_MESSAGES/libgpg-error.mo
    - /usr/share/locale/nl/LC_MESSAGES/libgpg-error.mo
    - /usr/share/locale/pl/LC_MESSAGES/libgpg-error.mo
    - /usr/share/locale/pt/LC_MESSAGES/libgpg-error.mo
    - /usr/share/locale/ro/LC_MESSAGES/libgpg-error.mo
    - /usr/share/locale/ru/LC_MESSAGES/libgpg-error.mo
    - /usr/share/locale/sr/LC_MESSAGES/libgpg-error.mo
    - /usr/share/locale/sv/LC_MESSAGES/libgpg-error.mo
    - /usr/share/locale/tr/LC_MESSAGES/libgpg-error.mo
    - /usr/share/locale/uk/LC_MESSAGES/libgpg-error.mo
    - /usr/share/locale/vi/LC_MESSAGES/libgpg-error.mo
    - /usr/share/locale/zh_CN/LC_MESSAGES/libgpg-error.mo
    - /usr/share/locale/zh_TW/LC_MESSAGES/libgpg-error.mo
  misc:
    files:
    - /usr/share/aclocal/gpg-error.m4
    - /usr/share/aclocal/gpgrt.m4
    - /usr/share/common-lisp/source/gpg-error/gpg-error-codes.lisp
    - /usr/share/common-lisp/source/gpg-error/gpg-error-package.lisp
    - /usr/share/common-lisp/source/gpg-error/gpg-error.asd
    - /usr/share/common-lisp/source/gpg-error/gpg-error.lisp
    - /usr/share/libgpg-error/errorref.txt
