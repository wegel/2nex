build:
  script: |
    tar --no-same-owner -xf ${SOURCE_git} -C "${WORK_DIR}" --strip-components=1
    cd ${WORK_DIR}
    
    # Configure Git with required options
    ./configure \
      --prefix=/usr \
      --with-libpcre2 \
      --with-expat \
      --without-tcltk \
      --without-openssl \
      --without-curl \
      --without-iconv
    
    # Build with NO_GETTEXT=1 to avoid msgfmt dependency
    make NO_GETTEXT=1 all
    
    # Install
    make NO_GETTEXT=1 DESTDIR="${OUT_DIR}" install
    
    # Set consistent timestamps for reproducible builds
    find "${OUT_DIR}" -exec touch -d '2024-01-01T00:00:00+00:00' {} \;
    find "${OUT_DIR}" ! -type d -exec strip-nondeterminism -T 1704067200 --normalizers +all {} \; || true
    2nex_strip_binaries ${OUT_DIR}

bundles:
  full:
    - bin
    - misc
  dev:
    - bin
    - misc

