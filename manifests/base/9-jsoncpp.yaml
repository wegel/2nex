package:
  schema: 1
  name: "JsonCpp"
  slug: "jsoncpp"
  flavor: "base"
  version: "1.9.6"
  description: "C++ library for interacting with JSON"
  homepage: "https://github.com/open-source-parsers/jsoncpp"

sources:
  - name: "jsoncpp"
    url: "https://github.com/open-source-parsers/jsoncpp/archive/refs/tags/1.9.6.tar.gz"
    sha256: "f93b6dd7ce796b13d02c108bc9f79812245a82e577581c4c9aabe57075c90ea2"

dependencies:
- commit: x86_64/bash/5.2.21/bootstrap/phase3/bundles/dev
  name: bash
- commit: x86_64/coreutils/9.5/bootstrap/phase3/bundles/dev
  name: coreutils
- commit: x86_64/findutils/4.9.0/bootstrap/phase3/bundles/dev
  name: findutils
- commit: x86_64/2nex-utilities/0.0.1/bootstrap/phase3/bundles/dev
  name: 2nex-utilities
- commit: x86_64/gzip/1.13/bootstrap/phase3/bundles/dev
  name: gzip
- commit: x86_64/tar/1.35/bootstrap/phase3/bundles/dev
  name: tar
- commit: x86_64/binutils/2.42/bootstrap/phase3/bundles/dev
  name: binutils
- commit: x86_64/glibc/2.39/bootstrap/phase3/bundles/dev
  name: glibc
- commit: x86_64/gcc/13.2.0/bootstrap/phase3/bundles/dev
  name: gcc
- commit: x86_64/linux-headers/6.4.1/bootstrap/phase3/bundles/dev
  name: linux-headers
- commit: x86_64/ncurses/6.4-20230520/bootstrap/phase3/bundles/dev
  name: ncurses
- commit: x86_64/inetutils/2.5/bootstrap/phase3/bundles/dev
  name: inetutils
- commit: x86_64/attr/2.5.2/bootstrap/phase3/bundles/dev
  name: attr
- commit: x86_64/acl/2.3.2/bootstrap/phase3/bundles/dev
  name: acl
- commit: x86_64/mpc/1.2.1/bootstrap/phase3/bundles/dev
  name: mpc
- commit: x86_64/mpfr/4.2.1/bootstrap/phase3/bundles/dev
  name: mpfr
- commit: x86_64/gmp/6.3.0/bootstrap/phase3/bundles/dev
  name: gmp
- commit: x86_64/zlib/1.3.1/bootstrap/phase3/bundles/dev
  name: zlib
- commit: x86_64/ninja/1.12.1/bootstrap/phase3/bundles/dev
  name: ninja
- commit: x86_64/python3/3.12.2/bootstrap/phase3/bundles/dev
  name: python3
- commit: x86_64/meson/1.4.1/bootstrap/phase3/bundles/dev
  name: meson

build:
  script: |
    tar --no-same-owner -xf ${SOURCE_jsoncpp} -C "${WORK_DIR}" --strip-components=1
    cd ${WORK_DIR}
    
    # Configure with Meson
    meson setup build \
      --prefix=/usr \
      --buildtype=release \
      -Dtests=false
    
    # Build
    ninja -C build
    
    # Install
    DESTDIR="${OUT_DIR}" ninja -C build install
    
    # Set consistent timestamps for reproducible builds
    find "${OUT_DIR}" -exec touch -d '2024-01-01T00:00:00+00:00' {} \;
    find "${OUT_DIR}" ! -type d -exec strip-nondeterminism -T 1704067200 --normalizers +all {} \; || true
    2nex_strip_binaries ${OUT_DIR}

bundles:
  full:
    - lib
    - dev
  dev:
    - lib
    - dev

outputs:
  lib:
    - /usr/lib/cmake/jsoncpp/jsoncpp-namespaced-targets.cmake
    - /usr/lib/cmake/jsoncpp/jsoncppConfig.cmake
    - /usr/lib/libjsoncpp.so
    - /usr/lib/libjsoncpp.so.26
  dev:
    - /usr/include/json/allocator.h
    - /usr/include/json/assertions.h
    - /usr/include/json/config.h
    - /usr/include/json/forwards.h
    - /usr/include/json/json.h
    - /usr/include/json/json_features.h
    - /usr/include/json/reader.h
    - /usr/include/json/value.h
    - /usr/include/json/version.h
    - /usr/include/json/writer.h
    - /usr/lib/pkgconfig/jsoncpp.pc