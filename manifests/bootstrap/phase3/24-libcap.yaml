    requires:
    - x86_64/bootstrap_tools/0.0.1/bootstrap/phase1/bundles/dev
    - x86_64/glibc/2.39/bootstrap/phase3/outputs/lib
  dev:
    files:
    - /usr/include/sys/capability.h
    - /usr/include/sys/psx_syscall.h
    - /usr/lib/pkgconfig/libcap.pc
    - /usr/lib/pkgconfig/libpsx.pc
  lib:
    files:
    - /usr/lib/libcap.so
    - /usr/lib/libcap.so.2
    - /usr/lib/libcap.so.2.69
    - /usr/lib/libpsx.so
    - /usr/lib/libpsx.so.2
    - /usr/lib/libpsx.so.2.69
    requires:
