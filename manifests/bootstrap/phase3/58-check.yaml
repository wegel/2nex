build:
  script: |
    tar --no-same-owner -xf ${SOURCE0} -C "${WORK_DIR}" --strip-components=1
    cd ${WORK_DIR}
    
    ./configure --prefix=/usr --disable-static
    make
    make DESTDIR=$OUT_DIR install
    make docdir=${OUT_DIR}/usr/share/doc/check-0.15.2 install
    
    find "${OUT_DIR}" -exec touch -d "2024-01-01T00:00:00+00:00" {} \;
    2nex_strip_binaries ${OUT_DIR}

bundles:
  full:
    - man
    - dev
    - lib
    - doc
    - info
    - misc
    - bin

  dev:
    - dev
    - lib
    - bin
    - misc

outputs:
  man:
    - /usr/share/man/man1/checkmk.1
  dev:
    - /usr/include/check.h
    - /usr/include/check_stdint.h
    - /usr/lib/libcheck.la
    - /usr/lib/pkgconfig/check.pc
  lib:
