package:
  schema: 1
  name: "Python wheel"
  slug: "wheel"
  flavor: "bootstrap/phase3"
  version: "0.43.0"
  description: "The reference implementation of the Python wheel packaging standard."
  homepage: "https://pypi.org/project/wheel"
  checksum: cb04f78dccce938e103c062bca00f50fb0f9ccd62db347c7a291cf9c3526c95c

sources:
  - name: "wheel"
    url: "https://pypi.org/packages/source/w/wheel/wheel-0.43.0.tar.gz"
    sha256: "465ef92c69fa5c5da2d1cf8ac40559a8c940886afcef87dcf14b9470862f1d85"

dependencies:
- commit: x86_64/findutils/4.9.0/bootstrap/phase1/bundles/dev
  name: findutils
- commit: x86_64/2nex-utilities/0.0.1/bootstrap/phase3/bundles/dev
  name: 2nex-utilities
- commit: x86_64/gzip/1.13/bootstrap/phase1/bundles/dev
  name: gzip
- commit: x86_64/tar/1.35/bootstrap/phase1/bundles/dev
  name: tar
- commit: x86_64/glibc/2.39/bootstrap/phase3/bundles/dev
  name: glibc
- commit: x86_64/zlib/1.3.1/bootstrap/phase3/bundles/dev
  name: zlib
- commit: x86_64/ncurses/6.4-20230520/bootstrap/phase3/bundles/dev
  name: ncurses
- commit: x86_64/bash/5.2.21/bootstrap/phase3/bundles/dev
  name: bash
- commit: x86_64/expat/2.6.2/bootstrap/phase3/bundles/dev
  name: expat
- commit: x86_64/python3/3.12.2/bootstrap/phase3/bundles/dev
  name: python3
- commit: x86_64/flit-core/3.9.0/bootstrap/phase3/bundles/dev
  name: flit-core
- commit: x86_64/inetutils/2.5/bootstrap/phase3/bundles/dev
  name: inetutils

build:
  script: |
    tar --no-same-owner -xf ${SOURCE0} -C "${WORK_DIR}" --strip-components=1
    cd ${WORK_DIR}

    pip3 wheel -w dist --no-cache-dir --no-build-isolation --no-deps $PWD
    pip3 install --no-index --root=${OUT_DIR} --find-links=dist wheel

    find "${OUT_DIR}" -exec touch -d "2024-01-01T00:00:00+00:00" {} \;
    2nex_strip_binaries ${OUT_DIR}

bundles:
  full:
    - bin
    - lib

  dev:
    - bin
    - lib

outputs:
  lib:
    - /usr/lib/python3.12/site-packages/wheel-0.43.0.dist-info/INSTALLER
    - /usr/lib/python3.12/site-packages/wheel-0.43.0.dist-info/LICENSE.txt
