package:
  schema: 1
  name: "Expat"
  slug: "expat"
  flavor: "sys-libs"
  version: "2.6.2"
  description: "An XML parser library written in C"
  homepage: "https://libexpat.github.io/"
  checksum: 27c545ad189789f5d5ce8957156aef819bdad52b6ee38fc597325b3d0582f34e

sources:
  - name: "expat"
    url: "https://github.com/libexpat/libexpat/releases/download/R_2_6_2/expat-2.6.2.tar.xz"
    sha256: "ee14b4c5d8908b1bec37ad937607eab183d4d9806a08adee472c3c3121d27364"

dependencies:
- commit: x86_64/coreutils/9.5/bootstrap/phase1/bundles/dev
  name: coreutils
- commit: x86_64/findutils/4.9.0/bootstrap/phase1/bundles/dev
  name: findutils
- commit: x86_64/2nex-utilities/0.0.1/sys-apps/bundles/dev
  name: 2nex-utilities
- commit: x86_64/gawk/5.3.0/bootstrap/phase1/bundles/dev
  name: gawk
- commit: x86_64/make/4.4.1/bootstrap/phase1/bundles/dev
  name: make
- commit: x86_64/tar/1.35/bootstrap/phase1/bundles/dev
  name: tar
- commit: x86_64/glibc/2.39/sys-libs/bundles/dev
  name: glibc
- commit: x86_64/zlib/1.3.1/bootstrap/phase3/bundles/dev
  name: zlib
- commit: x86_64/bzip2/1.0.8/bootstrap/phase3/bundles/dev
  name: bzip2
- commit: x86_64/xz/5.4.6/bootstrap/phase3/bundles/dev
  name: xz
- commit: x86_64/file/5.45/bootstrap/phase3/bundles/dev
  name: file
- commit: x86_64/binutils/2.42/bootstrap/phase3/bundles/dev
  name: binutils
- commit: x86_64/gmp/6.3.0/sys-libs/bundles/dev
  name: gmp
- commit: x86_64/mpfr/4.2.1/bootstrap/phase3/bundles/dev
  name: mpfr
- commit: x86_64/mpc/1.2.1/bootstrap/phase3/bundles/dev
  name: mpc
- commit: x86_64/attr/2.5.2/sys-libs/bundles/dev
  name: attr
- commit: x86_64/acl/2.3.2/sys-libs/bundles/dev
  name: acl
- commit: x86_64/gcc/13.2.0/bootstrap/phase3/bundles/dev
  name: gcc
- commit: x86_64/linux-headers/6.4.1/bootstrap/phase3/bundles/dev
  name: linux
- commit: x86_64/ncurses/6.4-20230520/sys-libs/bundles/dev
  name: ncurses
- commit: x86_64/sed/4.9/sys-apps/bundles/dev
  name: sed
- commit: x86_64/grep/3.11/sys-apps/bundles/dev
  name: grep
- commit: x86_64/bash/5.2.21/app-shells/bundles/dev
  name: bash

build:
  script: |
    tar --no-same-owner -xf ${SOURCE0} -C "${WORK_DIR}" --strip-components=1
    cd ${WORK_DIR}

    ./configure --prefix=/usr    \
                --disable-static \
                --docdir=/usr/share/doc/expat-2.6.2

    make
    make DESTDIR=$OUT_DIR install
    install -v -m644 doc/*.{html,css} ${OUT_DIR}/usr/share/doc/expat-2.6.2
    
    find "${OUT_DIR}" -exec touch -d "2024-01-01T00:00:00+00:00" {} \;
    2nex_strip_binaries ${OUT_DIR}

bundles:
  full:
    - bin
    - dev
    - lib
    - doc
    - man

  dev:
    - bin
    - lib
    - dev

outputs:
  bin:
    files:
    - /usr/bin/xmlwf
    requires:
    - x86_64/glibc/2.39/sys-libs/outputs/lib
  dev:
    files:
    - /usr/include/expat.h
    - /usr/include/expat_config.h
    - /usr/include/expat_external.h
    - /usr/lib/libexpat.la
    - /usr/lib/pkgconfig/expat.pc
  lib:
    files:
    - /usr/lib/cmake/expat-2.6.2/expat-config-version.cmake
    - /usr/lib/cmake/expat-2.6.2/expat-config.cmake
    - /usr/lib/cmake/expat-2.6.2/expat-noconfig.cmake
    - /usr/lib/cmake/expat-2.6.2/expat.cmake
    - /usr/lib/libexpat.so
    - /usr/lib/libexpat.so.1
    - /usr/lib/libexpat.so.1.9.2
    requires:
    - x86_64/glibc/2.39/sys-libs/outputs/lib
  doc:
    files:
    - /usr/share/doc/expat-2.6.2/AUTHORS
    - /usr/share/doc/expat-2.6.2/changelog
    - /usr/share/doc/expat-2.6.2/ok.min.css
    - /usr/share/doc/expat-2.6.2/reference.html
    - /usr/share/doc/expat-2.6.2/style.css
  man:
    files:
    - /usr/share/man/man1/xmlwf.1
