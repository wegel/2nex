build:
  environment: 27b6e5dc7ad152c9a17c2cabfcc5ee93daa9bbf0
  profile: [4105:95910, 12544:144415, 20850:177777, 37355:196507, 45700:205055, 58110:215811, 70483:225190, 86990:237168, 103570:458099, 113944:458391]

  script: |
    tar --no-same-owner -xf ${SOURCE_networkmanager} -C "${WORK_DIR}" --strip-components=1
    cd ${WORK_DIR}

    mkdir build && cd build
    meson setup .. \
      --prefix=/usr \
      --sbindir=/usr/bin \
      --sysconfdir=/etc \
      --localstatedir=/var \
      --buildtype=release \
      -Dsystemdsystemunitdir=/usr/lib/systemd/system \
      -Dsystem_ca_path=/etc/ssl/certs \
      -Dpolkit=false \
      -Dselinux=false \
      -Dlibaudit=no \
      -Dqt=false \
      -Dppp=false \
      -Dmodem_manager=false \
      -Dovs=false \
      -Dnmtui=true \
      -Dbluez5_dun=false \
      -Debpf=false \
      -Dwifi=true \
      -Dwext=false \
      -Diwd=true \
      -Dconfig_plugins_default=keyfile \
      -Ddhcpcd=no \
      -Ddhclient=no \
      -Dintrospection=false \
      -Dvapi=false \
      -Ddocs=false \
      -Dtests=no \
      -Dmore_asserts=no \
      -Dmore_logging=false \
      -Dld_gc=false \
      -Dcrypto=gnutls \
      -Dconcheck=false \
      -Dnm_cloud_setup=false

    ninja

    DESTDIR="${OUT_DIR}" ninja install

    find ${OUT_DIR} -type f -executable -exec strip --strip-unneeded {} \; 2>/dev/null || true
    find ${OUT_DIR} -name '*.a' -exec objcopy --enable-deterministic-archives {} \; 2>/dev/null || true
    find "${OUT_DIR}" -exec touch -d "2024-01-01T00:00:00+00:00" {} \;

