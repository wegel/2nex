package:
  schema: 1
  name: iwd
  slug: iwd
  namespace: net/wifi
  version: "2.22"
  description: Internet Wireless Daemon - modern WiFi daemon from Intel
  homepage: https://git.kernel.org/pub/scm/network/wireless/iwd.git
  checksum: 855d3981ef2cc3b9d22835967b7def71b3b706c41ef8a883899344f6d79a0990

sources:
- name: iwd
  url: https://mirrors.edge.kernel.org/pub/linux/network/wireless/iwd-2.22.tar.xz
  sha256: 2c41c5da9924b90f8383b293b0c0b3d0bfb34fdc8822d8d0d37ec100707f263e
- name: uapi_config
  file: pkg/net/wifi/iwd-uapi-config.patch
  sha256: 9e0d2f71cc3f86bde72aab122258d54bde1f6133c18783e0e992f7aec7b5fdd5

dependencies:
- name: bash
  commit: x86_64/pkg/cli/shells/bash/5.2.21/bundles/dev
- name: coreutils
  commit: x86_64/pkg/core/userland/coreutils/9.5/bundles/dev
- name: gmp
  commit: x86_64/pkg/libs/system/gmp/6.3.0/bundles/dev
- name: libcap
  commit: x86_64/pkg/libs/security/libcap/2.69/bundles/dev
- name: zlib
  commit: x86_64/pkg/libs/system/zlib/1.3.1/bundles/dev
- name: diffutils
  commit: x86_64/pkg/core/userland/diffutils/3.10/bundles/dev
- name: findutils
  commit: x86_64/pkg/core/userland/findutils/4.9.0/bundles/dev
- name: tar
  commit: x86_64/pkg/cli/archive/tar/1.35/bundles/dev
- name: xz
  commit: x86_64/pkg/libs/compression/xz/5.4.6/bundles/dev
- name: glibc
  commit: x86_64/pkg/libs/system/glibc/2.39/bundles/dev
- name: gcc
  commit: x86_64/pkg/core/toolchain/gcc/13.2.0/bundles/dev
- name: binutils
  commit: x86_64/pkg/core/toolchain/binutils/2.42/bundles/dev
- name: make
  commit: x86_64/pkg/core/toolchain/make/4.4.1/bundles/dev
- name: linux-headers
  commit: x86_64/pkg/libs/system/linux-headers/6.4.1/bundles/dev
- name: ncurses
  commit: x86_64/pkg/libs/system/ncurses/6.4-20230520/bundles/dev
- name: acl
  commit: x86_64/pkg/libs/system/acl/2.3.2/bundles/dev
- name: attr
  commit: x86_64/pkg/libs/system/attr/2.5.2/bundles/dev
- name: pkgconf
  commit: x86_64/pkg/core/toolchain/pkgconf/2.2.0/bundles/dev
- name: sed
  commit: x86_64/pkg/cli/text/sed/4.9/bundles/dev
- name: gawk
  commit: x86_64/pkg/cli/text/gawk/5.3.0/bundles/dev
- name: grep
  commit: x86_64/pkg/cli/text/grep/3.11/bundles/dev
- name: ell
  commit: x86_64/pkg/libs/net/ell/0.81/bundles/dev
- name: dbus
  commit: x86_64/pkg/core/ipc/dbus/1.16.2/bundles/dev
- name: readline
  commit: x86_64/pkg/libs/system/readline/8.2/bundles/dev
- name: systemd
  commit: x86_64/pkg/core/init/systemd/257.5/bundles/dev
- name: patch
  commit: x86_64/pkg/core/toolchain/patch/2.7.6/bundles/dev

build:
  environment: 27b6e5dc7ad152c9a17c2cabfcc5ee93daa9bbf0
  profile: [4114:998, 8220:2273, 12383:3935, 13992:3981]

  script: |
    set -eux
    tar --no-same-owner -xf /${SOURCE_iwd} -C "${WORK_DIR}" --strip-components=1
    cd ${WORK_DIR}
    patch --batch --fuzz=0 -Np1 -i /${SOURCE_uapi_config}

    ./configure --prefix=/usr \
      --sysconfdir=/etc \
      --localstatedir=/var \
      --libexecdir=/usr/lib/iwd \
      --enable-external-ell \
      --enable-client \
      --enable-monitor \
      --enable-wired \
      --enable-systemd-service

    make
    make DESTDIR="${OUT_DIR}" install

    strings "${OUT_DIR}/usr/lib/iwd/iwd" \
      | grep -Fx '/etc/iwd:/run/iwd:/usr/lib/iwd'
    ! grep -Fq 'ConfigurationDirectory=' \
      "${OUT_DIR}/usr/lib/systemd/system/iwd.service"

    smoke_root="${WORK_DIR}/uapi-smoke"
    mkdir -p \
      "${smoke_root}/etc/iwd" \
      "${smoke_root}/run/iwd" \
      "${smoke_root}/usr/lib/iwd" \
      "${smoke_root}/state"

    assert_config() {
      expected=$1
      rm -f "${smoke_root}/iwd.log"
      set +e
      CONFIGURATION_DIRECTORY="${smoke_root}/etc/iwd:${smoke_root}/run/iwd:${smoke_root}/usr/lib/iwd" \
        STATE_DIRECTORY="${smoke_root}/state" \
        timeout 2 "${OUT_DIR}/usr/lib/iwd/iwd" \
        > "${smoke_root}/iwd.log" 2>&1
      status=$?
      set -e
      test "${status}" -eq 0 || test "${status}" -eq 1 \
        || test "${status}" -eq 124
      grep -F "Loaded configuration from ${expected}/main.conf" \
        "${smoke_root}/iwd.log"
    }

    printf '%s\n' '[General]' 'EnableNetworkConfiguration=true' \
      > "${smoke_root}/usr/lib/iwd/main.conf"
    assert_config "${smoke_root}/usr/lib/iwd"
    printf '%s\n' '[General]' 'EnableNetworkConfiguration=false' \
      > "${smoke_root}/run/iwd/main.conf"
    assert_config "${smoke_root}/run/iwd"
    printf '%s\n' '[General]' 'EnableNetworkConfiguration=true' \
      > "${smoke_root}/etc/iwd/main.conf"
    assert_config "${smoke_root}/etc/iwd"
    : > "${smoke_root}/etc/iwd/main.conf"
    assert_config "${smoke_root}/etc/iwd"

    find ${OUT_DIR} -type f -executable -exec strip --strip-unneeded {} \; 2>/dev/null || true
    find "${OUT_DIR}" -exec touch -d "2024-01-01T00:00:00+00:00" {} \;

bundles:
  dev:
  - bin
  - conf
  - dbus-services
  - lib

  full:
  - bin
  - conf
  - dbus-services
  - lib
  - man

outputs:
  bin:
    files:
    - path: /usr/bin/iwctl
      needs:
      - /usr/lib/ld-linux-x86-64.so.2
      - /usr/lib/libc.so.6
      - /usr/lib/libell.so.0
      - /usr/lib/libgcc_s.so.1
      - /usr/lib/libreadline.so.8
    - path: /usr/bin/iwmon
      needs:
      - /usr/lib/ld-linux-x86-64.so.2
      - /usr/lib/libc.so.6
      - /usr/lib/libell.so.0

  conf:
    files:
    - path: /usr/share/dbus-1/system.d/ead-dbus.conf
    - path: /usr/share/dbus-1/system.d/iwd-dbus.conf

  dbus-services:
    files:
    - path: /usr/share/dbus-1/system-services/net.connman.ead.service
    - path: /usr/share/dbus-1/system-services/net.connman.iwd.service

  lib:
    files:
    - path: /usr/lib/iwd/ead
      needs:
      - /usr/lib/ld-linux-x86-64.so.2
      - /usr/lib/libc.so.6
      - /usr/lib/libell.so.0
      - /usr/lib/libgcc_s.so.1
    - path: /usr/lib/iwd/iwd
      needs:
      - /usr/lib/ld-linux-x86-64.so.2
      - /usr/lib/libc.so.6
      - /usr/lib/libell.so.0
      - /usr/lib/libgcc_s.so.1
    - path: /usr/lib/modules-load.d/pkcs8.conf
    - path: /usr/lib/systemd/network/80-iwd.link
    - path: /usr/lib/systemd/system/ead.service
    - path: /usr/lib/systemd/system/iwd.service

  man:
    files:
    - path: /usr/share/man/man1/iwctl.1
    - path: /usr/share/man/man1/iwmon.1
    - path: /usr/share/man/man5/iwd.ap.5
    - path: /usr/share/man/man5/iwd.config.5
    - path: /usr/share/man/man5/iwd.network.5
    - path: /usr/share/man/man7/iwd.debug.7
    - path: /usr/share/man/man8/ead.8
    - path: /usr/share/man/man8/iwd.8

resolution:
  /usr/lib/libell.so.0: ell
  /usr/lib/libgcc_s.so.1: gcc
  /usr/lib/ld-linux-x86-64.so.2: glibc
  /usr/lib/libc.so.6: glibc
  /usr/lib/libreadline.so.8: readline
