  commit: x86_64/pkg/dev/lang/python3/3.12.2/bundles/dev

build:
  environment: 27b6e5dc7ad152c9a17c2cabfcc5ee93daa9bbf0

  script: |
    set -eux

    tar --no-same-owner -xf /${SOURCE_bluez} -C "${WORK_DIR}" --strip-components=1
    cd ${WORK_DIR}

    ./configure \
      --prefix=/usr \
      --sysconfdir=/etc \
      --libexecdir=/usr/libexec \
      --localstatedir=/var \
      --enable-library \
      --enable-tools \
      --enable-systemd \
      --disable-cups \
      --disable-mesh \
      --disable-midi \
      --disable-obex

    make
    make DESTDIR="${OUT_DIR}" install

bundles:
  dev:
  - bin
  - conf
  - lib
  - misc

  full:
  - bin
  - conf
  - lib
  - man
  - misc

