package:
  schema: 1
  name: nftables
  slug: nftables
  namespace: net/firewall
  version: 1.1.1
  description: Netfilter tables userspace utilities
  homepage: https://www.netfilter.org/projects/nftables/
  checksum: ed4cd32130e0dc86cc2aedc09d7a455d3646f312770e401f399c0f9153e701c0

sources:
- name: nftables
  url: https://www.netfilter.org/projects/nftables/files/nftables-1.1.1.tar.xz
  sha256: 6358830f3a64f31e39b0ad421d7dadcd240b72343ded48d8ef13b8faf204865a
- name: uapi_osf
  file: pkg/net/firewall/nftables-uapi-osf.patch
  sha256: 1f77d1396bfe3b0bcfd1910d9e341cc42617480f4e04dba0f510f9615637a13f

