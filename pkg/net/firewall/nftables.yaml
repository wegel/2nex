    files:
    - path: /usr/bin/nft
      needs:
      - /usr/lib/ld-linux-x86-64.so.2
      - /usr/lib/libc.so.6
      - /usr/lib/libnftables.so.1
      - /usr/lib/libreadline.so.8

  conf:
