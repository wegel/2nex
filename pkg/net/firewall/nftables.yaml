  commit: x86_64/pkg/core/toolchain/make/4.4.1/bundles/dev
- name: bash
  commit: x86_64/pkg/cli/shells/bash/5.2.21/bundles/dev
- name: ncurses
  commit: x86_64/pkg/libs/system/ncurses/6.4-20230520/bundles/dev
- name: acl
  commit: x86_64/pkg/libs/system/acl/2.3.2/bundles/dev
- name: attr
  commit: x86_64/pkg/libs/system/attr/2.5.2/bundles/dev
- name: zlib
  commit: x86_64/pkg/libs/system/zlib/1.3.1/bundles/dev
- name: coreutils
  commit: x86_64/pkg/core/userland/coreutils/9.5/bundles/dev
- name: util-linux
  commit: x86_64/pkg/core/userland/util_linux/2.40/bundles/full
- name: findutils
  commit: x86_64/pkg/core/userland/findutils/4.9.0/bundles/dev
- name: sed
  commit: x86_64/pkg/cli/text/sed/4.9/bundles/dev
- name: grep
  commit: x86_64/pkg/cli/text/grep/3.11/bundles/dev
- name: gawk
  commit: x86_64/pkg/cli/text/gawk/5.3.0/bundles/dev
- name: tar
  commit: x86_64/pkg/cli/archive/tar/1.35/bundles/dev
- name: xz
  commit: x86_64/pkg/libs/compression/xz/5.4.6/bundles/dev
- name: linux-headers
  commit: x86_64/pkg/libs/system/linux-headers/6.4.1/bundles/dev
- name: libmnl
  commit: x86_64/pkg/libs/net/libmnl/1.0.5/bundles/dev
- name: libnftnl
  commit: x86_64/pkg/libs/net/libnftnl/1.3.1/bundles/dev
- name: gmp
  commit: x86_64/pkg/libs/system/gmp/6.3.0/bundles/dev
- name: libcap
  commit: x86_64/pkg/libs/security/libcap/2.69/bundles/dev
- name: readline
  commit: x86_64/pkg/libs/system/readline/8.2/bundles/dev
- name: pkgconf
  commit: x86_64/pkg/core/toolchain/pkgconf/2.2.0/bundles/dev
- name: patch
  commit: x86_64/pkg/core/toolchain/patch/2.7.6/bundles/dev
- name: flex
  commit: x86_64/pkg/core/toolchain/flex/2.6.4/bundles/dev
- name: bison
  commit: x86_64/pkg/core/toolchain/bison/3.8.2/bundles/dev
- name: diffutils
  commit: x86_64/pkg/core/userland/diffutils/3.10/bundles/dev
- name: jansson
  commit: x86_64/pkg/libs/system/jansson/2.14.1/bundles/dev

build:
  environment: 27b6e5dc7ad152c9a17c2cabfcc5ee93daa9bbf0
  profile: [4111:852, 8281:4569, 9129:4731]

  script: |
    tar --no-same-owner -xf ${SOURCE_nftables} -C "${WORK_DIR}" --strip-components=1
    cd ${WORK_DIR}

    patch -Np1 --batch --fuzz=0 < "/${SOURCE_uapi_osf}"

    ./configure \
      --prefix=/usr \
      --sbindir=/usr/bin \
      --sysconfdir=/etc \
      --disable-static \
      --disable-man-doc \
      --with-cli=readline \
      --with-json

    make
    make DESTDIR=${OUT_DIR} install
    install -Dm644 doc/libnftables-json.5 "${OUT_DIR}/usr/share/man/man5/libnftables-json.5"
    install -Dm644 doc/libnftables.3 "${OUT_DIR}/usr/share/man/man3/libnftables.3"
    install -Dm644 doc/nft.8 "${OUT_DIR}/usr/share/man/man8/nft.8"

    install -Dm644 "${OUT_DIR}/etc/nftables/osf/pf.os" \
      "${OUT_DIR}/usr/lib/nftables/osf/pf.os"
    rm "${OUT_DIR}/etc/nftables/osf/pf.os"
    rmdir "${OUT_DIR}/etc/nftables/osf" "${OUT_DIR}/etc/nftables" "${OUT_DIR}/etc"

    printf '%s\n' \
      'table inet uapi_osf_test {' \
      '  chain input {' \
      '    type filter hook input priority filter;' \
      '    osf name "Linux" accept' \
      '  }' \
      '}' > "${WORK_DIR}/uapi-osf-test.nft"

    run_osf_test() {
      expected_path=$1
      expected_record=$2
      LD_LIBRARY_PATH="${OUT_DIR}/usr/lib" \
        /usr/bin/unshare --net \
        "${OUT_DIR}/usr/bin/nft" --debug mnl --check \
        --file "${WORK_DIR}/uapi-osf-test.nft" \
        > "${WORK_DIR}/uapi-osf-test.log" 2>&1
      grep -Fq "Opening OS signature file '${expected_path}'" \
        "${WORK_DIR}/uapi-osf-test.log"
      if [ -n "${expected_record}" ]; then
        grep -Fq "${expected_record}" "${WORK_DIR}/uapi-osf-test.log"
      elif grep -Fq "Loading '" "${WORK_DIR}/uapi-osf-test.log"; then
        exit 1
      fi
    }

    mkdir -p /etc/nftables/osf /run/nftables/osf /usr/lib/nftables/osf
    rm -f /etc/nftables/osf/pf.os /run/nftables/osf/pf.os
    install -m644 files/osf/pf.os /usr/lib/nftables/osf/pf.os
    run_osf_test /usr/lib/nftables/osf/pf.os '45046:64:0:44:M*:'
    printf '45046:64:0:44:M*:\t\tUAPIRUN:1::Run tier\n' \
      > /run/nftables/osf/pf.os
    run_osf_test /run/nftables/osf/pf.os UAPIRUN
    printf '45046:64:0:44:M*:\t\tUAPIETC:1::Administrator tier\n' \
      > /etc/nftables/osf/pf.os
    run_osf_test /etc/nftables/osf/pf.os UAPIETC
    : > /etc/nftables/osf/pf.os
    run_osf_test /etc/nftables/osf/pf.os ''
    rm -f /etc/nftables/osf/pf.os /run/nftables/osf/pf.os
    run_osf_test /usr/lib/nftables/osf/pf.os '45046:64:0:44:M*:'

    find ${OUT_DIR} -type f -executable -exec strip --strip-unneeded {} \; 2>/dev/null || true
    find ${OUT_DIR} -name '*.la' -delete
    find "${OUT_DIR}" -exec touch -h -d "2024-01-01T00:00:00+00:00" {} \;

bundles:
  dev:
  - bin
  - dev
  - lib

  full:
  - bin
  - conf
  - doc
  - lib
  - man
  - misc

