build:
  environment: 27b6e5dc7ad152c9a17c2cabfcc5ee93daa9bbf0
  profile: [4111:911, 17355:2162, 35754:2610, 54084:2657, 73034:2710, 87309:2755, 104346:2848, 130240:3320, 156370:3485, 172425:4452]

  script: |
    tar --no-same-owner -xf ${SOURCE_iptables} -C "${WORK_DIR}" --strip-components=1
    cd ${WORK_DIR}

    patch -Np1 --batch --fuzz=0 < "/${SOURCE_uapi_ethertypes}"

    ./configure \
      --prefix=/usr \
      --sbindir=/usr/bin \
      --libexecdir=/usr/lib \
      --sysconfdir=/etc \
      --disable-static

    make
    make DESTDIR=${OUT_DIR} install

    # create iptables symlinks for legacy compatibility
    for prog in iptables iptables-save iptables-restore ip6tables ip6tables-save ip6tables-restore; do
      ln -sfv xtables-nft-multi ${OUT_DIR}/usr/bin/${prog}
    done

    install -Dm644 "${OUT_DIR}/etc/ethertypes" "${OUT_DIR}/usr/lib/ethertypes"
    rm "${OUT_DIR}/etc/ethertypes"
    rmdir "${OUT_DIR}/etc"

    mkdir -p /etc /run /usr/lib
    rm -f /etc/ethertypes /run/ethertypes
    install -m644 "${WORK_DIR}/etc/ethertypes" /usr/lib/ethertypes
    LD_LIBRARY_PATH="${OUT_DIR}/usr/lib" \
      XTABLES_LIBDIR="${OUT_DIR}/usr/lib/xtables" \
      "${OUT_DIR}/usr/bin/ebtables-translate" \
      -A INPUT -p IPv4 -j ACCEPT | grep -q 'ether type 0x800'
    printf 'UAPITEST 88b6\n' > /run/ethertypes
    LD_LIBRARY_PATH="${OUT_DIR}/usr/lib" \
      XTABLES_LIBDIR="${OUT_DIR}/usr/lib/xtables" \
      "${OUT_DIR}/usr/bin/ebtables-translate" \
      -A INPUT -p UAPITEST -j ACCEPT | grep -q 'ether type 0x88b6'
    printf 'UAPITEST 88b7\n' > /etc/ethertypes
    LD_LIBRARY_PATH="${OUT_DIR}/usr/lib" \
      XTABLES_LIBDIR="${OUT_DIR}/usr/lib/xtables" \
      "${OUT_DIR}/usr/bin/ebtables-translate" \
      -A INPUT -p UAPITEST -j ACCEPT | grep -q 'ether type 0x88b7'
    : > /etc/ethertypes
    if LD_LIBRARY_PATH="${OUT_DIR}/usr/lib" \
      XTABLES_LIBDIR="${OUT_DIR}/usr/lib/xtables" \
      "${OUT_DIR}/usr/bin/ebtables-translate" \
      -A INPUT -p IPv4 -j ACCEPT >/dev/null 2>&1; then
      exit 1
    fi
    rm -f /etc/ethertypes /run/ethertypes
    LD_LIBRARY_PATH="${OUT_DIR}/usr/lib" \
      XTABLES_LIBDIR="${OUT_DIR}/usr/lib/xtables" \
      "${OUT_DIR}/usr/bin/ebtables-translate" \
      -A INPUT -p IPv4 -j ACCEPT | grep -q 'ether type 0x800'

    find ${OUT_DIR} -type f -executable -exec strip --strip-unneeded {} \; 2>/dev/null || true
    find ${OUT_DIR} -name '*.la' -delete
    find "${OUT_DIR}" -exec touch -h -d "2024-01-01T00:00:00+00:00" {} \;

