build:
  environment: 27b6e5dc7ad152c9a17c2cabfcc5ee93daa9bbf0
  profile: [4103:3873, 8217:3873, 12370:5743, 16478:13671, 17448:13943]

  script: |
    set -eu

    tar --no-same-owner -xf "/./${SOURCE_gtk_vnc}" -C "${WORK_DIR}" --strip-components=1
    cd "${WORK_DIR}"

    meson setup build \
      --prefix=/usr \
      --sysconfdir=/etc \
      --libdir=lib \
      --buildtype=release \
      -Dintrospection=enabled \
      -Dpulseaudio=disabled \
      -Dsasl=disabled \
      -Dwith-vala=disabled

    ninja -C build
    DESTDIR="${OUT_DIR}" ninja -C build install

    installed_lib="${OUT_DIR}/usr/lib/libgvnc-1.0.so.0.0.1"
    python3 -c "import sys;d=open(sys.argv[1],'rb').read();assert b'/usr/etc' not in d;assert b'/etc' in d;assert b'%s/pki' in d" "${installed_lib}"
    printf 'gtk-vnc UAPI smoke: SYSCONFDIR/pki is /etc/pki, not /usr/etc\n'

    find "${OUT_DIR}" -type f -executable -exec strip --strip-unneeded {} \; 2>/dev/null || true
    find "${OUT_DIR}" -name '*.a' -exec objcopy --enable-deterministic-archives {} \; 2>/dev/null || true
    find "${OUT_DIR}" -exec touch -d "2024-01-01T00:00:00+00:00" {} \;

