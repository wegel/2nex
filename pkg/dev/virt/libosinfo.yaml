build:
  environment: 27b6e5dc7ad152c9a17c2cabfcc5ee93daa9bbf0
  profile: [4138:3426, 8297:7380, 12443:10026, 16590:10210, 20741:10364, 22933:10995]

  script: |
    set -eu
    tar --no-same-owner -xf /${SOURCE_libosinfo} -C "${WORK_DIR}" --strip-components=1
    cd "${WORK_DIR}"

    meson setup build \
      --prefix=/usr \
      --libdir=lib \
      --buildtype=release \
      -Denable-gtk-doc=false \
      -Denable-tests=false \
      -Denable-introspection=enabled \
      -Denable-vala=disabled \
      -Dlibsoup-abi=3.0 \
      -Dwith-pci-ids-path=/usr/share/hwdata/pci.ids \
      -Dwith-usb-ids-path=/usr/share/hwdata/usb.ids

    ninja -C build
    DESTDIR="${OUT_DIR}" ninja -C build install

    find "${OUT_DIR}" -type f -executable -exec strip --strip-unneeded {} \; 2>/dev/null || true
    find "${OUT_DIR}" -name '*.a' -exec objcopy --enable-deterministic-archives {} \; 2>/dev/null || true
    find "${OUT_DIR}" -exec touch -d "2024-01-01T00:00:00+00:00" {} \;

