build:
  environment: 27b6e5dc7ad152c9a17c2cabfcc5ee93daa9bbf0
  profile: [4112:1069, 8222:1069, 12328:1836, 16472:4776, 20618:4776, 23087:5135]

  script: |
    set -eu
    tar --no-same-owner -xf /${SOURCE_libosinfo} -C "${WORK_DIR}" --strip-components=1
    cd "${WORK_DIR}"
    patch --batch --fuzz=0 -Np1 -i "/${SOURCE_uapi_config}"

    meson setup build \
      --prefix=/usr \
      --sysconfdir=/etc \
      --libdir=lib \
      --buildtype=release \
      -Denable-gtk-doc=false \
      -Denable-tests=false \
      -Denable-introspection=enabled \
      -Denable-vala=disabled \
      -Dlibsoup-abi=3.0 \
      -Dwith-pci-ids-path=/usr/share/hwdata/pci.ids \
      -Dwith-usb-ids-path=/usr/share/hwdata/usb.ids

    ninja -C build
    DESTDIR="${OUT_DIR}" ninja -C build install

    installed_lib="${OUT_DIR}/usr/lib/libosinfo-1.0.so.0.1012.0"
    if grep -qa '/usr/etc' "${installed_lib}"; then
      printf 'libosinfo UAPI smoke: found /usr/etc compiled into libosinfo-1.0.so\n' >&2
      exit 1
    fi
    if ! grep -qa '/run/osinfo' "${installed_lib}"; then
      printf 'libosinfo UAPI smoke: /run/osinfo missing from libosinfo-1.0.so\n' >&2
      exit 1
    fi
    if ! grep -qa '/etc/osinfo' "${installed_lib}"; then
      printf 'libosinfo UAPI smoke: /etc/osinfo missing from libosinfo-1.0.so\n' >&2
      exit 1
    fi

    plant_os() {
      dir="$1"
      name="$2"
      mkdir -p "${dir}/os/nex.internal"
      cat > "${dir}/os/nex.internal/test-uapi-loader-tier.xml" <<EOX
    <?xml version="1.0" encoding="UTF-8"?>
    <libosinfo version="0.0.1">
      <os id="http://nex.internal/test/uapi-loader-tier">
        <short-id>nex-uapi-loader-tier</short-id>
        <name>${name}</name>
        <vendor>libosinfo.org</vendor>
        <family>test</family>
      </os>
    </libosinfo>
    EOX
    }

    mkdir -p /usr/share/osinfo /run/osinfo /etc/osinfo
    plant_os /usr/share/osinfo "Nex UAPI vendor os"
    plant_os /run/osinfo "Nex UAPI run os"
    plant_os /etc/osinfo "Nex UAPI admin os"

    run_query() {
      env -u OSINFO_SYSTEM_DIR -u OSINFO_RUN_DIR -u OSINFO_LOCAL_DIR -u OSINFO_USER_DIR \
        LD_LIBRARY_PATH="${OUT_DIR}/usr/lib${LD_LIBRARY_PATH:+:$LD_LIBRARY_PATH}" \
        "${OUT_DIR}/usr/bin/osinfo-query" --fields=name os short-id=nex-uapi-loader-tier \
        | tail -n +3 | sed 's/^[[:space:]]*//;s/[[:space:]]*$//'
    }
    expect_name() {
      actual="$(run_query)"
      if [ "${actual}" != "$1" ]; then
        printf 'libosinfo UAPI smoke: expected %s, got %s\n' "$1" "${actual}" >&2
        exit 1
      fi
    }
    expect_name "Nex UAPI admin os"
    rm -f /etc/osinfo/os/nex.internal/test-uapi-loader-tier.xml
    expect_name "Nex UAPI run os"
    rm -f /run/osinfo/os/nex.internal/test-uapi-loader-tier.xml
    expect_name "Nex UAPI vendor os"
    rm -rf /usr/share/osinfo /run/osinfo /etc/osinfo

    printf 'libosinfo UAPI smoke: loader searched /usr/share/osinfo, /run/osinfo, and /etc/osinfo\n'

    find "${OUT_DIR}" -type f -executable -exec strip --strip-unneeded {} \; 2>/dev/null || true
    find "${OUT_DIR}" -name '*.a' -exec objcopy --enable-deterministic-archives {} \; 2>/dev/null || true
    find "${OUT_DIR}" -exec touch -d "2024-01-01T00:00:00+00:00" {} \;

