build:
  environment: 27b6e5dc7ad152c9a17c2cabfcc5ee93daa9bbf0
  profile: [4106:1527, 12377:3446, 24691:3964, 37052:4635, 49367:5606, 61745:6786, 70051:7860, 90753:46568, 107286:46583, 115572:47138]

  script: |
    tar --no-same-owner -xf /${SOURCE_libvirt} -C "${WORK_DIR}" --strip-components=1
    cd ${WORK_DIR}

    mkdir build && cd build
    meson setup .. \
      --prefix=/usr \
      --sbindir=/usr/bin \
      --sysconfdir=/etc \
      --localstatedir=/var \
      --buildtype=release \
      -Ddriver_qemu=enabled \
      -Dqemu_user=nobody \
      -Dqemu_group=nobody \
      -Ddriver_lxc=disabled \
      -Ddriver_openvz=disabled \
      -Ddriver_esx=disabled \
      -Ddriver_vmware=disabled \
      -Ddriver_vbox=disabled \
      -Ddriver_libxl=disabled \
      -Ddriver_ch=disabled \
      -Dstorage_zfs=disabled \
      -Dstorage_gluster=disabled \
      -Dstorage_rbd=disabled \
      -Dstorage_iscsi=disabled \
      -Dstorage_iscsi_direct=disabled \
      -Dnumactl=disabled \
      -Dnumad=disabled \
      -Dapparmor=disabled \
      -Dselinux=disabled \
      -Daudit=disabled \
      -Dpolkit=disabled \
      -Dlibssh=disabled \
      -Dlibssh2=disabled \
      -Dsasl=disabled \
      -Dfirewalld=disabled \
      -Dwireshark_dissector=disabled \
      -Ddocs=disabled \
      -Dtests=disabled \
      -Dsecdriver_apparmor=disabled \
      -Dsecdriver_selinux=disabled

    ninja
    DESTDIR="${OUT_DIR}" ninja install

    mkdir -p docs-api "${OUT_DIR}/usr/share/libvirt/api"
    python3 ../scripts/apibuild.py ../docs docs-api
    install -m 0644 docs-api/libvirt-api.xml "${OUT_DIR}/usr/share/libvirt/api/libvirt-api.xml"
    install -m 0644 docs-api/libvirt-admin-api.xml "${OUT_DIR}/usr/share/libvirt/api/libvirt-admin-api.xml"
    install -m 0644 docs-api/libvirt-lxc-api.xml "${OUT_DIR}/usr/share/libvirt/api/libvirt-lxc-api.xml"
    install -m 0644 docs-api/libvirt-qemu-api.xml "${OUT_DIR}/usr/share/libvirt/api/libvirt-qemu-api.xml"

    find ${OUT_DIR} -type f -executable -exec strip --strip-unneeded {} \; 2>/dev/null || true
    find ${OUT_DIR} -name '*.a' -exec objcopy --enable-deterministic-archives {} \; 2>/dev/null || true
    find "${OUT_DIR}" -exec touch -d '2024-01-01T00:00:00+00:00' {} \;

