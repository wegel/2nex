build:
  environment: 27b6e5dc7ad152c9a17c2cabfcc5ee93daa9bbf0
  profile: [4136:863, 8277:1335, 12416:1412, 16574:1738, 20800:1963, 24927:2228, 29161:4119, 37471:4328, 45776:4333, 47260:4409]

  script: |
    set -eu
    tar --no-same-owner -xf /${SOURCE_libvirt_glib} -C "${WORK_DIR}" --strip-components=1
    cd "${WORK_DIR}"

    meson setup build \
      --prefix=/usr \
      --libdir=lib \
      --buildtype=release \
      -Ddocs=disabled \
      -Dtests=disabled \
      -Dintrospection=enabled \
      -Dvapi=disabled \
      -Dgit_werror=disabled

    ninja -C build
    DESTDIR="${OUT_DIR}" ninja -C build install

    find "${OUT_DIR}" -type f -executable -exec strip --strip-unneeded {} \; 2>/dev/null || true
    find "${OUT_DIR}" -name '*.a' -exec objcopy --enable-deterministic-archives {} \; 2>/dev/null || true
    find "${OUT_DIR}" -exec touch -d "2024-01-01T00:00:00+00:00" {} \;

bundles:
  dev:
  - dev
  - lib
  - misc

  full:
  - dev
  - lib
  - misc

