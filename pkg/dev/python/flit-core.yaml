  schema: 1
  name: Python flit-core
  slug: flit-core
  namespace: dev/python
  version: 3.9.0
  description: The distribution-building parts of Flit (a packaging tool for simple Python modules)
  homepage: https://pypi.org/project/flit-core/
  checksum: b133cca31126631d02f87dfc35ef54e6cf9c009ee5de509c424eac0190b0c21b

sources:
- name: flit_core
  url: https://pypi.org/packages/source/f/flit-core/flit_core-3.9.0.tar.gz
  sha256: 72ad266176c4a3fcfab5f2930d76896059851240570ce9a98733b658cb786eba

dependencies:
- name: findutils
  commit: x86_64/pkg/bootstrap/phase1/findutils/4.9.0/bundles/dev
- name: bash
  commit: x86_64/pkg/bootstrap/phase1/bash/5.2.21/bundles/dev
- name: 2nex-utilities-bootstrap
  commit: x86_64/pkg/bootstrap/phase3/2nex-utilities-bootstrap/0.0.1/bundles/dev
- name: gzip
  commit: x86_64/pkg/bootstrap/phase1/gzip/1.13/bundles/dev
- name: tar
  commit: x86_64/pkg/bootstrap/phase1/tar/1.35/bundles/dev
- name: glibc
  commit: x86_64/pkg/libs/system/glibc/2.39/bundles/dev
- name: expat
  commit: x86_64/pkg/libs/system/expat/2.6.2/outputs/lib
- name: gcc
  commit: x86_64/pkg/core/toolchain/gcc/13.2.0/bundles/dev
- name: zlib
  commit: x86_64/pkg/libs/system/zlib/1.3.1/outputs/lib
- name: python3
  commit: x86_64/pkg/dev/lang/python3/3.12.2/bundles/dev

build:
  environment: 13ce31fd97c19f5756e4413babf279d543b5a71c
  profile: [4109:649, 8209:665, 12360:677, 16456:689, 20552:702, 24648:718, 26760:725]

  script: |
    tar --no-same-owner -xf ${SOURCE0} -C "${WORK_DIR}" --strip-components=1
    cd ${WORK_DIR}

    pip3 wheel -w dist --no-cache-dir --no-build-isolation --no-deps $PWD
    pip3 install --no-index --no-user --root=${OUT_DIR} --find-links dist flit_core

    find "${OUT_DIR}" -exec touch -d "2024-01-01T00:00:00+00:00" {} \;
    2nex_strip_binaries ${OUT_DIR}

bundles:
  dev:
  - lib

  full:
  - lib
  - man

