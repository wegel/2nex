build:
  environment: 27b6e5dc7ad152c9a17c2cabfcc5ee93daa9bbf0
  profile: [4102:3222, 8251:4041, 12627:7176, 16736:7896, 18894:8087]

  script: |
    set -eu

    tar --no-same-owner -xf "/./${SOURCE_libvirt_python}" -C "${WORK_DIR}" --strip-components=1
    cd "${WORK_DIR}"

    python3 setup.py build
    python3 setup.py install --root="${OUT_DIR}" --prefix=/usr --optimize=1

    find "${OUT_DIR}" -type f -executable -exec strip --strip-unneeded {} \; 2>/dev/null || true
    find "${OUT_DIR}" -exec touch -d "2024-01-01T00:00:00+00:00" {} \;

bundles:
  dev:
  - lib

  full:
  - lib

