build:
  environment: 27b6e5dc7ad152c9a17c2cabfcc5ee93daa9bbf0
  profile: [4153:730, 5617:1866]

  script: |
    set -eux
    tar --no-same-owner -xf /${SOURCE_pycairo} -C "${WORK_DIR}" --strip-components=1
    cd "${WORK_DIR}"

    meson setup build \
      --prefix=/usr \
      --buildtype=release \
      -Dpython=/usr/bin/python3 \
      -Dtests=false \
      -Dwheel=false

    ninja -C build
    DESTDIR="${OUT_DIR}" ninja -C build install

    find "${OUT_DIR}" -type f -executable -exec strip --strip-unneeded {} \; 2>/dev/null || true
    find "${OUT_DIR}" -exec touch -d "2024-01-01T00:00:00+00:00" {} \;

bundles:
  dev:
  - dev
  - lib

  full:
  - dev
  - lib

outputs:
  dev:
    files:
    - path: /usr/include/pycairo/py3cairo.h
    - path: /usr/lib/pkgconfig/py3cairo.pc
    - path: /usr/lib/python3.12/site-packages/cairo/include/py3cairo.h

  lib:
    files:
    - path: /usr/lib/python3.12/site-packages/cairo/__init__.py
    - path: /usr/lib/python3.12/site-packages/cairo/__init__.pyi
    - path: /usr/lib/python3.12/site-packages/cairo/__pycache__/__init__.cpython-312.pyc
    - path: /usr/lib/python3.12/site-packages/cairo/_cairo.cpython-312-x86_64-linux-gnu.so
      needs:
      - /usr/lib/libc.so.6
      - /usr/lib/libcairo.so.2
    - path: /usr/lib/python3.12/site-packages/cairo/py.typed
    - path: /usr/lib/python3.12/site-packages/pycairo-1.29.0.dist-info/METADATA

resolution:
  /usr/lib/libcairo.so.2: cairo
  /usr/lib/libc.so.6: glibc
