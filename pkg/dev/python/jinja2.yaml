- name: attr
  commit: x86_64/pkg/libs/system/attr/2.5.2/bundles/dev
- name: tar
  commit: x86_64/pkg/cli/archive/tar/1.35/bundles/dev
- name: zlib
  commit: x86_64/pkg/libs/system/zlib/1.3.1/bundles/dev
- name: coreutils
  commit: x86_64/pkg/core/userland/coreutils/9.5/bundles/dev
- name: findutils
  commit: x86_64/pkg/core/userland/findutils/4.9.0/bundles/dev
- name: gzip
  commit: x86_64/pkg/cli/archive/gzip/1.13/bundles/dev
- name: expat
  commit: x86_64/pkg/libs/system/expat/2.6.2/bundles/dev
- name: libffi
  commit: x86_64/pkg/libs/system/libffi/3.4.6/bundles/dev
- name: python3
  commit: x86_64/pkg/dev/lang/python3/3.12.2/bundles/dev
- name: wheel
  commit: x86_64/pkg/dev/python/wheel/0.43.0/bundles/dev
- name: setuptools
  commit: x86_64/pkg/dev/python/setuptools/70.0.0/bundles/dev

build:
  environment: 27b6e5dc7ad152c9a17c2cabfcc5ee93daa9bbf0
  profile: [4061:1858]

  script: |
    # First build MarkupSafe (required dependency for Jinja2)
    OLDCWD=$(pwd)
    mkdir -p "${WORK_DIR}/markupsafe"
    tar --no-same-owner -xf ${SOURCE_markupsafe} -C "${WORK_DIR}/markupsafe" --strip-components=1
    cd "${WORK_DIR}/markupsafe"

    python3 -m pip wheel --no-cache-dir --no-deps --wheel-dir=dist .
    python3 -m pip install --no-deps --ignore-installed --root="${OUT_DIR}" dist/*.whl

    # Now build Jinja2
    cd "${OLDCWD}"
    mkdir -p "${WORK_DIR}/jinja2"
    tar --no-same-owner -xf ${SOURCE_jinja2} -C "${WORK_DIR}/jinja2" --strip-components=1
    cd "${WORK_DIR}/jinja2"

    python3 -m pip wheel --no-cache-dir --no-deps --wheel-dir=dist .
    python3 -m pip install --no-deps --ignore-installed --root="${OUT_DIR}" dist/*.whl

    find ${OUT_DIR} -type f -executable -exec strip --strip-unneeded {} \; 2>/dev/null || true
    find ${OUT_DIR} -name '*.a' -exec objcopy --enable-deterministic-archives {} \; 2>/dev/null || true
    find "${OUT_DIR}" -exec touch -d "2024-01-01T00:00:00+00:00" {} \;

bundles:
  dev:
  - lib

  full:
  - lib

