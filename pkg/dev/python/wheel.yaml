package:
  schema: 1
  name: Python wheel
  slug: wheel
  namespace: dev/python
  version: 0.43.0
  description: The reference implementation of the Python wheel packaging standard.
  homepage: https://pypi.org/project/wheel
  checksum: cb04f78dccce938e103c062bca00f50fb0f9ccd62db347c7a291cf9c3526c95c

sources:
- name: wheel
  url: https://pypi.org/packages/source/w/wheel/wheel-0.43.0.tar.gz
  sha256: 465ef92c69fa5c5da2d1cf8ac40559a8c940886afcef87dcf14b9470862f1d85

dependencies:
- name: findutils
  commit: x86_64/pkg/bootstrap/phase1/findutils/4.9.0/bundles/dev
- name: bash
  commit: x86_64/pkg/bootstrap/phase1/bash/5.2.21/bundles/dev
- name: 2nex-utilities-bootstrap
  commit: x86_64/pkg/bootstrap/phase3/2nex-utilities-bootstrap/0.0.1/bundles/dev
- name: gzip
  commit: x86_64/pkg/bootstrap/phase1/gzip/1.13/bundles/dev
- name: tar
  commit: x86_64/pkg/bootstrap/phase1/tar/1.35/bundles/dev
- name: glibc
  commit: x86_64/pkg/libs/system/glibc/2.39/bundles/dev
- name: expat
  commit: x86_64/pkg/libs/system/expat/2.6.2/outputs/lib
- name: gcc
  commit: x86_64/pkg/core/toolchain/gcc/13.2.0/bundles/dev
- name: zlib
  commit: x86_64/pkg/libs/system/zlib/1.3.1/outputs/lib
- name: python3
  commit: x86_64/pkg/dev/lang/python3/3.12.2/bundles/dev
- name: flit-core
  commit: x86_64/pkg/dev/python/flit-core/3.9.0/bundles/dev

build:
  profile: [4114:697, 8262:712, 12358:724, 12998:726]

  script: |
    tar --no-same-owner -xf ${SOURCE0} -C "${WORK_DIR}" --strip-components=1
    cd ${WORK_DIR}

    pip3 wheel -w dist --no-cache-dir --no-build-isolation --no-deps $PWD
    pip3 install --no-index --root=${OUT_DIR} --find-links=dist wheel

    find "${OUT_DIR}" -exec touch -d "2024-01-01T00:00:00+00:00" {} \;
    2nex_strip_binaries ${OUT_DIR}

bundles:
  dev:
  - bin
  - lib

  full:
  - bin
  - lib

outputs:
  bin:
    files:
    - path: /usr/bin/wheel

  lib:
