build:
  environment: 27b6e5dc7ad152c9a17c2cabfcc5ee93daa9bbf0
  profile: [4128:1388, 8244:1758, 12340:3950, 14005:4000]

  script: |
    set -eux
    tar --no-same-owner -xf /${SOURCE_pygobject} -C "${WORK_DIR}" --strip-components=1
    cd "${WORK_DIR}"

    meson setup build \
      --prefix=/usr \
      --libdir=lib \
      --buildtype=release \
      -Dpython=/usr/bin/python3 \
      -Dpycairo=enabled \
      -Dtests=false \
      -Dwheel=false

    ninja -C build
    DESTDIR="${OUT_DIR}" ninja -C build install

    find "${OUT_DIR}" -type f -executable -exec strip --strip-unneeded {} \; 2>/dev/null || true
    find "${OUT_DIR}" -exec touch -d "2024-01-01T00:00:00+00:00" {} \;

bundles:
  dev:
  - dev
  - lib

  full:
  - dev
  - lib

