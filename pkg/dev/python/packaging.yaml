  commit: x86_64/pkg/libs/system/libffi/3.4.6/bundles/dev

build:
  environment: 27b6e5dc7ad152c9a17c2cabfcc5ee93daa9bbf0
  profile: [1307:3471]

  script: |
    set -eux
    tar --no-same-owner -xf /${SOURCE_packaging} -C "${WORK_DIR}" --strip-components=1
    cd ${WORK_DIR}

    PYTHONDONTWRITEBYTECODE=1 \
      python3 -m pip install --no-build-isolation --no-deps --no-compile \
      --root="${OUT_DIR}" --prefix=/usr .

    find "${OUT_DIR}" -exec touch -d "2024-01-01T00:00:00+00:00" {} \;

bundles:
  dev:
  - lib

  full:
  - lib

