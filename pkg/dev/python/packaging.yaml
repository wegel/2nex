  name: packaging
  slug: packaging
  namespace: dev/python
  version: "25.0"
  description: Core utilities for Python packages
  homepage: https://pypi.org/project/packaging/
  checksum: 0311dabc308eb692344cdf882b4b4e5418aa7149cfce5518e0d3ea60946f6f24

sources:
- name: packaging
  url: https://files.pythonhosted.org/packages/source/p/packaging/packaging-25.0.tar.gz
  sha256: d443872c98d677bf60f6a1f2f8c1cb748e8fe762d2bf9d3148b5599295b0fc4f

