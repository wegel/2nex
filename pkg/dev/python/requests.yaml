build:
  environment: 27b6e5dc7ad152c9a17c2cabfcc5ee93daa9bbf0
  profile: [976:570]

  script: |
    set -eu

    tar --no-same-owner -xf "/./${SOURCE_requests}" -C "${WORK_DIR}" --strip-components=1
    cd "${WORK_DIR}"

    python3 -m pip install --no-build-isolation --no-deps --root="${OUT_DIR}" --prefix=/usr .

    find "${OUT_DIR}" -exec touch -d "2024-01-01T00:00:00+00:00" {} \;

