  name: urllib3
  slug: urllib3
  namespace: dev/python
  version: 1.26.20
  description: Python HTTP library with connection pooling
  homepage: https://urllib3.readthedocs.io/
  checksum: 23d21f91d240f0ca783d1314cf93e93a89b3a9bb5b82f57cb8429aa51a5783a6

sources:
- name: urllib3
  url: https://files.pythonhosted.org/packages/e4/e8/6ff5e6bc22095cfc59b6ea711b687e2b7ed4bdb373f7eeec370a97d7392f/urllib3-1.26.20.tar.gz
  sha256: 40c2dc0c681e47eb8f90e7e27bf6ff7df2e677421fd46756da1161c39ca70d32

dependencies:
- name: bash
  commit: x86_64/pkg/cli/shells/bash/5.2.21/bundles/dev
- name: coreutils
  commit: x86_64/pkg/core/userland/coreutils/9.5/bundles/dev
- name: findutils
  commit: x86_64/pkg/core/userland/findutils/4.9.0/bundles/dev
- name: tar
  commit: x86_64/pkg/cli/archive/tar/1.35/bundles/dev
- name: gzip
  commit: x86_64/pkg/cli/archive/gzip/1.13/bundles/dev
- name: python3
  commit: x86_64/pkg/dev/lang/python3/3.12.2/bundles/dev
- name: setuptools
  commit: x86_64/pkg/dev/python/setuptools/70.0.0/bundles/dev
- name: wheel
  commit: x86_64/pkg/dev/python/wheel/0.43.0/bundles/dev

build:
  environment: 27b6e5dc7ad152c9a17c2cabfcc5ee93daa9bbf0
  profile: [951:566]

  script: |
    set -eu

    tar --no-same-owner -xf "/./${SOURCE_urllib3}" -C "${WORK_DIR}" --strip-components=1
    cd "${WORK_DIR}"

    python3 -m pip install --no-build-isolation --no-deps --root="${OUT_DIR}" --prefix=/usr .

    find "${OUT_DIR}" -exec touch -d "2024-01-01T00:00:00+00:00" {} \;

bundles:
  full:
  - lib

