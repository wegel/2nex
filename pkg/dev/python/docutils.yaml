package:
  schema: 1
  name: docutils
  slug: docutils
  namespace: dev/python
  version: 0.21.2
  description: Python documentation utilities - includes rst2man
  homepage: https://docutils.sourceforge.io/
  checksum: 38af2ef9aed9deed0b390c06c5032028ae9c6ff5b8c4df0d95cf37009d8ed395

sources:
- name: docutils
  url: https://files.pythonhosted.org/packages/source/d/docutils/docutils-0.21.2.tar.gz
  sha256: 3a6b18732edf182daa3cd12775bbb338cf5691468f91eeeb109deff6ebfa986f

dependencies:
- name: glibc
  commit: x86_64/pkg/libs/system/glibc/2.39/bundles/dev
- name: python3
  commit: x86_64/pkg/dev/lang/python3/3.12.2/bundles/dev
- name: bash
  commit: x86_64/pkg/cli/shells/bash/5.2.21/bundles/dev
- name: coreutils
  commit: x86_64/pkg/core/userland/coreutils/9.5/bundles/dev
- name: tar
  commit: x86_64/pkg/cli/archive/tar/1.35/bundles/dev
- name: gzip
  commit: x86_64/pkg/cli/archive/gzip/1.13/bundles/dev
- name: findutils
