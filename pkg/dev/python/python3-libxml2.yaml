build:
  environment: 13ce31fd97c19f5756e4413babf279d543b5a71c
  profile: [4121:2148, 8361:4784, 11225:7843]

  script: |
    tar --no-same-owner -xf /${SOURCE_libxml2} -C "${WORK_DIR}" --strip-components=1
    cd ${WORK_DIR}

    ./configure \
      --prefix=/usr \
      --with-python=/usr/bin/python3

    cd python
    python3 setup.py build
    python3 setup.py install --root="${OUT_DIR}" --prefix=/usr --optimize=1

    find "${OUT_DIR}" -exec touch -d "2024-01-01T00:00:00+00:00" {} \;

bundles:
  dev:
  - lib

outputs:
  lib:
    files:
    - path: /usr/lib/python3.12/site-packages/__pycache__/drv_libxml2.cpython-312.opt-1.pyc
    - path: /usr/lib/python3.12/site-packages/__pycache__/drv_libxml2.cpython-312.pyc
    - path: /usr/lib/python3.12/site-packages/__pycache__/libxml2.cpython-312.opt-1.pyc
    - path: /usr/lib/python3.12/site-packages/__pycache__/libxml2.cpython-312.pyc
    - path: /usr/lib/python3.12/site-packages/drv_libxml2.py
    - path: /usr/lib/python3.12/site-packages/libxml2mod.cpython-312-x86_64-linux-gnu.so
      needs:
      - /usr/lib/libc.so.6
      - /usr/lib/libxml2.so.2
    - path: /usr/lib/python3.12/site-packages/libxml2.py
    - path: /usr/lib/python3.12/site-packages/libxml2_python-2.13.5-py3.12.egg-info/PKG-INFO
    - path: /usr/lib/python3.12/site-packages/libxml2_python-2.13.5-py3.12.egg-info/SOURCES.txt
    - path: /usr/lib/python3.12/site-packages/libxml2_python-2.13.5-py3.12.egg-info/dependency_links.txt
    - path: /usr/lib/python3.12/site-packages/libxml2_python-2.13.5-py3.12.egg-info/top_level.txt

resolution:
  /usr/lib/libc.so.6: glibc
  /usr/lib/libxml2.so.2: libxml2
