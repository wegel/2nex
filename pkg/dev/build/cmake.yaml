build:
  environment: 27b6e5dc7ad152c9a17c2cabfcc5ee93daa9bbf0
  profile: [12967:2831, 48443:6328, 105831:13794, 172655:20032, 231289:59363, 289126:83064, 342985:83105, 430000:83165, 516948:83226, 571608:84898]

  script: |
    # cmake's bundled libraries don't work with LTO
    CFLAGS=${CFLAGS/-flto=auto/}
    CXXFLAGS=${CXXFLAGS/-flto=auto/}
    LDFLAGS=${LDFLAGS/-flto=auto/}

    tar --no-same-owner -xf ${SOURCE_cmake} -C "${WORK_DIR}" --strip-components=1
    cd ${WORK_DIR}
    sed -i '/"lib64"/s/64//' Modules/GNUInstallDirs.cmake
    mkdir build && cd build

    # Bootstrap CMake itself
    # We use a simple build for now without all the dependencies
    ../bootstrap --prefix=/usr \
      --system-zlib \
      --system-bzip2 \
      --system-liblzma \
      --system-zstd \
      --system-curl \
      --system-expat \
      --system-libarchive \
      --parallel=$(nproc) \
      -- \
      -DCMAKE_USE_OPENSSL=ON \
      -DBUILD_CursesDialog=OFF

    make DESTDIR="${OUT_DIR}" install

    find ${OUT_DIR} -type f -executable -exec strip --strip-unneeded {} \; 2>/dev/null || true
    find ${OUT_DIR} -name '*.a' -exec objcopy --enable-deterministic-archives {} \; 2>/dev/null || true
    find "${OUT_DIR}" -exec touch -d "2024-01-01T00:00:00+00:00" {} \;

