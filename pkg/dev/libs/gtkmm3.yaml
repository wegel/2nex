build:
  environment: 27b6e5dc7ad152c9a17c2cabfcc5ee93daa9bbf0
  profile: [4160:3822, 12532:4423, 20859:6614, 33267:14291, 45743:21382, 58239:39038, 66571:39043, 83149:39053, 99713:39061, 108395:39350]

  script: |
    set -eu

    tar --no-same-owner -xf "${SOURCE_gtkmm3}" -C "${WORK_DIR}" --strip-components=1
    cd "${WORK_DIR}"

    mkdir -p "${WORK_DIR}/mime-root/usr/share"
    cp -R --no-preserve=ownership /usr/share/mime "${WORK_DIR}/mime-root/usr/share/"
    /usr/bin/update-mime-database "${WORK_DIR}/mime-root/usr/share/mime"
    export XDG_DATA_DIRS="${WORK_DIR}/mime-root/usr/share:/usr/share"

    meson setup build \
      --prefix=/usr \
      --libdir=lib \
      --buildtype=release \
      -Dmaintainer-mode=false \
      -Dbuild-documentation=false \
      -Dbuild-atkmm-api=false \
      -Dbuild-x11-api=false \
      -Dbuild-demos=false \
      -Dbuild-tests=false

    ninja -C build
    DESTDIR="${OUT_DIR}" ninja -C build install

    find "${OUT_DIR}" -type f -executable -exec strip --strip-unneeded {} \; 2>/dev/null || true
    find "${OUT_DIR}" -name '*.a' -exec objcopy --enable-deterministic-archives {} \; 2>/dev/null || true
    find "${OUT_DIR}" -exec touch -d "2024-01-01T00:00:00+00:00" {} \;

