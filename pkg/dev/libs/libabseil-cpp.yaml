build:
  script: "tar --no-same-owner -xf ${SOURCE_libabseil_cpp} -C \"${WORK_DIR}\" --strip-components=1\n\
    cd ${WORK_DIR}\n\n# Create a build directory\nmkdir -p build\ncd build\n\n# Configure\n\
    cmake .. \\\n  -G Ninja \\\n  -DCMAKE_INSTALL_PREFIX=/usr \\\n  -DCMAKE_BUILD_TYPE=Release\
    \ \\\n  -DABSL_ENABLE_INSTALL=ON \\\n  -DABSL_USE_GOOGLETEST_HEAD=OFF \\\n  -DCMAKE_CXX_STANDARD=14\n\
    \n# Build\nninja\n\n# Install\nDESTDIR=\"${OUT_DIR}\" ninja install\n\n# Set consistent\
    \ timestamps for reproducible builds\nfind \"${OUT_DIR}\" -exec touch -d '2024-01-01T00:00:00+00:00'\
    \ {} \\;\nfind \"${OUT_DIR}\" ! -type d -exec strip-nondeterminism -T 1704067200\
    \ --normalizers +all {} \\; || true\n#2nex_strip_binaries ${OUT_DIR}\n"
bundles:
  full:
  - lib
  - static
  - dev
  dev:
  - lib
  - dev
  - static
