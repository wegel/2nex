build:
  environment: 27b6e5dc7ad152c9a17c2cabfcc5ee93daa9bbf0
  profile: [4190:4452, 8300:7639, 16602:21616, 24908:28913, 33153:33269, 41432:38954, 49701:45075, 62073:57012, 74427:57025, 80256:57582]

  script: |
    # protobuf's internal library linking breaks with LTO
    CFLAGS=${CFLAGS/-flto=auto/}
    CXXFLAGS=${CXXFLAGS/-flto=auto/}
    LDFLAGS=${LDFLAGS/-flto=auto/}

    tar --no-same-owner -xf ${SOURCE_protobuf} -C "${WORK_DIR}" --strip-components=1
    cd ${WORK_DIR}

    # Create build directory
    mkdir -p build
    cd build

    # Configure with CMake
    # Using the same options as Buildroot
    cmake .. \
    -G Ninja \
    -DCMAKE_INSTALL_PREFIX=/usr \
    -DCMAKE_PREFIX_PATH=/usr \
    -DCMAKE_BUILD_TYPE=Release \
    -DCMAKE_C_FLAGS="${CFLAGS}" \
    -DCMAKE_CXX_FLAGS="${CXXFLAGS}" \
    -DBUILD_SHARED_LIBS=ON \
    -Dprotobuf_ALLOW_CCACHE=ON \
    -Dprotobuf_BUILD_CONFORMANCE=OFF \
    -Dprotobuf_BUILD_LIBPROTOC=ON \
    -Dprotobuf_BUILD_LIBUPB=ON \
    -Dprotobuf_BUILD_PROTOBUF_BINARIES=ON \
    -Dprotobuf_BUILD_PROTOC_BINARIES=ON \
    -Dprotobuf_BUILD_TESTS=OFF \
    -Dprotobuf_DISABLE_RTTI=OFF \
    -Dprotobuf_INSTALL=ON \
    -Dprotobuf_WITH_ZLIB=ON \
    -Dprotobuf_LOCAL_DEPENDENCIES_ONLY=ON

    # Build
    ninja

    # Install
    DESTDIR="${OUT_DIR}" ninja install

    find ${OUT_DIR} -type f -executable -exec strip --strip-unneeded {} \; 2>/dev/null || true
    find ${OUT_DIR} -name '*.a' -exec objcopy --enable-deterministic-archives {} \; 2>/dev/null || true
    find "${OUT_DIR}" -exec touch -d '2024-01-01T00:00:00+00:00' {} \;

bundles:
  dev:
  - bin
  - dev
  - lib
  - static

  full:
  - bin
  - dev
  - lib
  - static

