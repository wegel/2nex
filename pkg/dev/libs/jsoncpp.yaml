package:
  schema: 1
  name: JsonCpp
  slug: jsoncpp
  namespace: dev/libs
  version: 1.9.6
  description: C++ library for interacting with JSON
  homepage: https://github.com/open-source-parsers/jsoncpp
  checksum: ac3f997d9e737ea920dced25b5ca50bda89d271f2f8b3771f1141409689f3d0c

sources:
- name: jsoncpp
  url: https://github.com/open-source-parsers/jsoncpp/archive/refs/tags/1.9.6.tar.gz
  sha256: f93b6dd7ce796b13d02c108bc9f79812245a82e577581c4c9aabe57075c90ea2

dependencies:
- name: glibc
  commit: x86_64/pkg/libs/system/glibc/2.39/bundles/dev
- name: gcc
  commit: x86_64/pkg/core/toolchain/gcc/13.2.0/bundles/dev
- name: binutils
  commit: x86_64/pkg/core/toolchain/binutils/2.42/bundles/dev
- name: bash
  commit: x86_64/pkg/cli/shells/bash/5.2.21/bundles/dev
- name: findutils
  commit: x86_64/pkg/core/userland/findutils/4.9.0/bundles/dev
- name: gzip
  commit: x86_64/pkg/cli/archive/gzip/1.13/bundles/dev
- name: tar
  commit: x86_64/pkg/cli/archive/tar/1.35/bundles/dev
- name: linux-headers
  commit: x86_64/pkg/libs/system/linux-headers/6.4.1/bundles/dev
- name: ncurses
  commit: x86_64/pkg/libs/system/ncurses/6.4-20230520/bundles/dev
- name: acl
  commit: x86_64/pkg/libs/system/acl/2.3.2/bundles/dev
- name: attr
  commit: x86_64/pkg/libs/system/attr/2.5.2/bundles/dev
- name: gmp
  commit: x86_64/pkg/libs/system/gmp/6.3.0/bundles/dev
- name: zlib
  commit: x86_64/pkg/libs/system/zlib/1.3.1/bundles/dev
- name: ninja
  commit: x86_64/pkg/core/toolchain/ninja/1.12.1/bundles/dev
- name: python3
  commit: x86_64/pkg/dev/lang/python3/3.12.2/bundles/dev
- name: meson
  commit: x86_64/pkg/core/toolchain/meson/1.6.1/bundles/dev

build:
  environment: 27b6e5dc7ad152c9a17c2cabfcc5ee93daa9bbf0
  profile: [4113:2753, 4881:2757]

  script: |
    tar --no-same-owner -xf ${SOURCE_jsoncpp} -C "${WORK_DIR}" --strip-components=1
    cd ${WORK_DIR}

    # Configure with Meson
    meson setup build \
      --prefix=/usr \
      --buildtype=release \
      -Dtests=false

    # Build
    ninja -C build

    # Install
    DESTDIR="${OUT_DIR}" ninja -C build install

    # Set consistent timestamps for reproducible builds
    find "${OUT_DIR}" -exec touch -d '2024-01-01T00:00:00+00:00' {} \;

    find ${OUT_DIR}/usr/lib -name "*.so*" -exec strip --strip-unneeded {} \; 2>/dev/null || true

bundles:
  dev:
  - dev
  - lib

  full:
  - dev
  - lib

outputs:
  dev:
    files:
    - path: /usr/include/json/allocator.h
    - path: /usr/include/json/assertions.h
    - path: /usr/include/json/config.h
    - path: /usr/include/json/forwards.h
    - path: /usr/include/json/json.h
    - path: /usr/include/json/json_features.h
    - path: /usr/include/json/reader.h
    - path: /usr/include/json/value.h
    - path: /usr/include/json/version.h
    - path: /usr/include/json/writer.h
    - path: /usr/lib/pkgconfig/jsoncpp.pc

  lib:
    files:
    - path: /usr/lib/cmake/jsoncpp/jsoncpp-namespaced-targets.cmake
    - path: /usr/lib/cmake/jsoncpp/jsoncppConfig.cmake
    - path: /usr/lib/libjsoncpp.so
      needs:
      - /usr/lib/libc.so.6
      - /usr/lib/libgcc_s.so.1
      - /usr/lib/libm.so.6
      - /usr/lib/libstdc++.so.6
    - path: /usr/lib/libjsoncpp.so.26
      needs:
      - /usr/lib/libc.so.6
      - /usr/lib/libgcc_s.so.1
      - /usr/lib/libm.so.6
      - /usr/lib/libstdc++.so.6

resolution:
  /usr/lib/libgcc_s.so.1: gcc
  /usr/lib/libstdc++.so.6: gcc
  /usr/lib/libc.so.6: glibc
  /usr/lib/libm.so.6: glibc
