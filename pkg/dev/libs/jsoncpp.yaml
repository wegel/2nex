package:
  schema: 1
  name: JsonCpp
  slug: jsoncpp
  namespace: dev/libs
  version: 1.9.6
  description: C++ library for interacting with JSON
  homepage: https://github.com/open-source-parsers/jsoncpp
  checksum: 05f7a23b0de043ac9dbcf699f054710cd8c67100bdb835bc8f3f63dbd2a5a319

sources:
- name: jsoncpp
  url: https://github.com/open-source-parsers/jsoncpp/archive/refs/tags/1.9.6.tar.gz
  sha256: f93b6dd7ce796b13d02c108bc9f79812245a82e577581c4c9aabe57075c90ea2

dependencies:
- name: bash
  commit: x86_64/pkg/cli/shells/bash/5.2.21/bundles/dev
- name: coreutils
  commit: x86_64/pkg/core/userland/coreutils/9.5/bundles/dev
- name: findutils
  commit: x86_64/pkg/core/userland/findutils/4.9.0/bundles/dev
- name: phase3
  commit: x86_64/pkg/bootstrap/phase3/2nex-utilities-bootstrap/0.0.1/bundles/dev
- name: gzip
  commit: x86_64/pkg/cli/archive/gzip/1.13/bundles/dev
- name: tar
  commit: x86_64/pkg/cli/archive/tar/1.35/bundles/dev
- name: binutils
  commit: x86_64/pkg/bootstrap/phase3/binutils/2.42/bundles/dev
- name: glibc
  commit: x86_64/pkg/libs/system/glibc/2.39/bundles/dev
- name: gcc
  commit: x86_64/pkg/bootstrap/phase3/gcc/13.2.0/bundles/dev
- name: linux-headers
  commit: x86_64/pkg/bootstrap/phase3/linux-headers/6.4.1/bundles/dev
- name: ncurses
  commit: x86_64/pkg/libs/system/ncurses/6.4-20230520/bundles/dev
- name: inetutils
  commit: x86_64/pkg/net/misc/inetutils/2.5/bundles/dev
- name: attr
  commit: x86_64/pkg/libs/system/attr/2.5.2/bundles/dev
- name: acl
  commit: x86_64/pkg/libs/system/acl/2.3.2/bundles/dev
- name: mpc
  commit: x86_64/pkg/bootstrap/phase3/mpc/1.2.1/bundles/dev
- name: mpfr
  commit: x86_64/pkg/bootstrap/phase3/mpfr/4.2.1/bundles/dev
- name: gmp
  commit: x86_64/pkg/libs/system/gmp/6.3.0/bundles/dev
- name: zlib
  commit: x86_64/pkg/bootstrap/phase3/zlib/1.3.1/bundles/dev
- name: ninja
  commit: x86_64/pkg/core/toolchain/ninja/1.12.1/bundles/dev
- name: python3
  commit: x86_64/pkg/dev/lang/python3/3.12.2/bundles/dev
- name: meson
  commit: x86_64/pkg/core/toolchain/meson/1.4.1/bundles/dev

build:
  profile: [4100:1840, 4740:1843]

  script: |
    tar --no-same-owner -xf ${SOURCE_jsoncpp} -C "${WORK_DIR}" --strip-components=1
    cd ${WORK_DIR}

    # Configure with Meson
    meson setup build \
      --prefix=/usr \
      --buildtype=release \
      -Dtests=false

    # Build
    ninja -C build

    # Install
    DESTDIR="${OUT_DIR}" ninja -C build install

    # Set consistent timestamps for reproducible builds
    find "${OUT_DIR}" -exec touch -d '2024-01-01T00:00:00+00:00' {} \;
    find "${OUT_DIR}" ! -type d -exec strip-nondeterminism -T 1704067200 --normalizers +all {} \; || true
    2nex_strip_binaries ${OUT_DIR}

bundles:
  dev:
  - dev
  - lib

  full:
  - dev
  - lib

outputs:
  dev:
    files:
    - path: /usr/include/json/allocator.h
    - path: /usr/include/json/assertions.h
    - path: /usr/include/json/config.h
    - path: /usr/include/json/forwards.h
    - path: /usr/include/json/json.h
    - path: /usr/include/json/json_features.h
    - path: /usr/include/json/reader.h
    - path: /usr/include/json/value.h
    - path: /usr/include/json/version.h
    - path: /usr/include/json/writer.h
    - path: /usr/lib/pkgconfig/jsoncpp.pc

  lib:
    files:
    - path: /usr/lib/cmake/jsoncpp/jsoncpp-namespaced-targets.cmake
    - path: /usr/lib/cmake/jsoncpp/jsoncppConfig.cmake
    - path: /usr/lib/libjsoncpp.so
    - path: /usr/lib/libjsoncpp.so.26
