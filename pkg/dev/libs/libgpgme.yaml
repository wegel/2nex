package:
  schema: 1
  name: GPGME
  slug: libgpgme
  namespace: dev/libs
  version: 1.23.2
  description: GnuPG Made Easy - a library for making GnuPG easier to use
  homepage: https://gnupg.org/software/gpgme/
  checksum: 1042cddc0e2ca6859e8fefd7ac9d3879804505982e16e89df8fda27b88fadfd0

sources:
- name: gpgme
  url: https://gnupg.org/ftp/gcrypt/gpgme/gpgme-1.23.2.tar.bz2
  sha256: 9499e8b1f33cccb6815527a1bc16049d35a6198a6c5fae0185f2bd561bce5224

dependencies:
- name: glibc
  commit: x86_64/pkg/libs/system/glibc/2.39/bundles/dev
- name: gcc
  commit: x86_64/pkg/core/toolchain/gcc/13.2.0/bundles/dev
- name: binutils
  commit: x86_64/pkg/core/toolchain/binutils/2.42/bundles/dev
- name: bash
  commit: x86_64/pkg/cli/shells/bash/5.2.21/bundles/dev
- name: coreutils
  commit: x86_64/pkg/core/userland/coreutils/9.5/bundles/dev
- name: findutils
  commit: x86_64/pkg/core/userland/findutils/4.9.0/bundles/dev
- name: gawk
  commit: x86_64/pkg/cli/text/gawk/5.3.0/bundles/dev
- name: grep
  commit: x86_64/pkg/cli/text/grep/3.11/bundles/dev
- name: make
  commit: x86_64/pkg/core/toolchain/make/4.4.1/bundles/dev
- name: sed
  commit: x86_64/pkg/cli/text/sed/4.9/bundles/dev
- name: tar
  commit: x86_64/pkg/cli/archive/tar/1.35/bundles/dev
- name: linux-headers
  commit: x86_64/pkg/libs/system/linux-headers/6.4.1/bundles/dev
- name: ncurses
  commit: x86_64/pkg/libs/system/ncurses/6.4-20230520/bundles/dev
- name: acl
  commit: x86_64/pkg/libs/system/acl/2.3.2/bundles/dev
- name: attr
  commit: x86_64/pkg/libs/system/attr/2.5.2/bundles/dev
- name: gmp
  commit: x86_64/pkg/libs/system/gmp/6.3.0/bundles/dev
- name: libcap
  commit: x86_64/pkg/libs/security/libcap/2.69/bundles/dev
- name: zlib
  commit: x86_64/pkg/libs/system/zlib/1.3.1/bundles/dev
- name: bzip2
  commit: x86_64/pkg/libs/compression/bzip2/1.0.8/bundles/dev
- name: libgpg-error
  commit: x86_64/pkg/dev/libs/libgpg-error/1.51/bundles/dev
- name: libassuan
  commit: x86_64/pkg/dev/libs/libassuan/2.5.7/bundles/dev

build:
  environment: 27b6e5dc7ad152c9a17c2cabfcc5ee93daa9bbf0
  profile: [4115:1046, 12548:6222, 21290:6225, 34994:6236, 44150:6248, 52727:6309, 65859:6321, 78826:6366, 96375:7572, 104198:8256]

  script: |
    tar --no-same-owner -xf ${SOURCE_gpgme} -C "${WORK_DIR}" --strip-components=1
    cd ${WORK_DIR}

    # Configure
    ./configure --prefix=/usr \
                --disable-gpgsm-test \
                --disable-gpgconf-test \
                --disable-g13-test \
                --disable-gpg-test \
                --enable-languages=cl

    # Build
    make

    # Install
    make DESTDIR="${OUT_DIR}" install

    # Set consistent timestamps for reproducible builds
    find "${OUT_DIR}" -exec touch -d '2024-01-01T00:00:00+00:00' {} \;

    strip --strip-unneeded ${OUT_DIR}/usr/bin/gpgme-json || true
    strip --strip-unneeded ${OUT_DIR}/usr/bin/gpgme-tool || true
    find ${OUT_DIR}/usr/lib -name "*.so*" -exec strip --strip-unneeded {} \; 2>/dev/null || true

bundles:
  dev:
  - bin
  - dev
  - lib

  full:
  - bin
  - dev
  - info
  - lib
  - misc

outputs:
  bin:
    files:
    - path: /usr/bin/gpgme-json
      needs:
      - /usr/lib/ld-linux-x86-64.so.2
      - /usr/lib/libc.so.6
      - /usr/lib/libgpg-error.so.0
      - /usr/lib/libgpgme.so.11
      - /usr/lib/libm.so.6
    - path: /usr/bin/gpgme-tool
      needs:
      - /usr/lib/ld-linux-x86-64.so.2
      - /usr/lib/libassuan.so.0
      - /usr/lib/libc.so.6
      - /usr/lib/libgpg-error.so.0
      - /usr/lib/libgpgme.so.11

  dev:
    files:
    - path: /usr/include/gpgme.h
    - path: /usr/lib/libgpgme.la
    - path: /usr/lib/pkgconfig/gpgme-glib.pc
    - path: /usr/lib/pkgconfig/gpgme.pc

  info:
    files:
    - path: /usr/share/info/gpgme.info
    - path: /usr/share/info/gpgme.info-1
    - path: /usr/share/info/gpgme.info-2

  lib:
    files:
    - path: /usr/lib/libgpgme.so
      needs:
      - /usr/lib/ld-linux-x86-64.so.2
      - /usr/lib/libassuan.so.0
      - /usr/lib/libc.so.6
      - /usr/lib/libgpg-error.so.0
    - path: /usr/lib/libgpgme.so.11
      needs:
      - /usr/lib/ld-linux-x86-64.so.2
      - /usr/lib/libassuan.so.0
      - /usr/lib/libc.so.6
      - /usr/lib/libgpg-error.so.0
    - path: /usr/lib/libgpgme.so.11.32.1
      needs:
      - /usr/lib/ld-linux-x86-64.so.2
      - /usr/lib/libassuan.so.0
      - /usr/lib/libc.so.6
      - /usr/lib/libgpg-error.so.0

  misc:
    files:
    - path: /usr/share/aclocal/gpgme.m4
    - path: /usr/share/common-lisp/source/gpgme/gpgme-grovel.lisp
    - path: /usr/share/common-lisp/source/gpgme/gpgme-package.lisp
    - path: /usr/share/common-lisp/source/gpgme/gpgme.asd
    - path: /usr/share/common-lisp/source/gpgme/gpgme.lisp

resolution:
  /usr/lib/ld-linux-x86-64.so.2: glibc
  /usr/lib/libc.so.6: glibc
  /usr/lib/libm.so.6: glibc
  /usr/lib/libassuan.so.0: libassuan
  /usr/lib/libgpg-error.so.0: libgpg-error
  /usr/lib/libgpgme.so.11: self
