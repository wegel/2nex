build:
  environment: 27b6e5dc7ad152c9a17c2cabfcc5ee93daa9bbf0
  profile: [4127:1755, 8237:6186, 20672:6976, 33028:7654, 41299:8326, 53773:9410, 62015:10013, 74447:35167, 90991:35184, 99248:35405]

  script: |
    tar --no-same-owner -xf ${SOURCE_glib2} -C "${WORK_DIR}" --strip-components=1
    cd ${WORK_DIR}

    # Configure with meson build system
    meson setup build \
      --prefix=/usr \
      --buildtype=release \
      -Dglib_debug=disabled \
      -Dlibelf=disabled \
      -Dselinux=disabled \
      -Dxattr=false \
      -Dtests=false \
      -Doss_fuzz=disabled \
      -Dintrospection=disabled \
      -Dgio_module_dir=/usr/lib/gio/modules \
      -Dlibmount=enabled

    # Build
    ninja -C build

    # Install
    DESTDIR="${OUT_DIR}" ninja -C build install

    # Commenting out removal of development files to preserve glibconfig.h and other potentially needed files
    # rm -rf ${OUT_DIR}/usr/lib/glib-2.0
    # rm -rf ${OUT_DIR}/usr/share/glib-2.0/codegen ${OUT_DIR}/usr/share/glib-2.0/gettext
    # rm -f ${OUT_DIR}/usr/bin/gdbus-codegen
    # rm -f ${OUT_DIR}/usr/bin/glib-compile-schemas
    # rm -f ${OUT_DIR}/usr/bin/glib-compile-resources
    # rm -f ${OUT_DIR}/usr/bin/glib-genmarshal
    # rm -f ${OUT_DIR}/usr/bin/glib-gettextize
    # rm -f ${OUT_DIR}/usr/bin/glib-mkenums
    # rm -f ${OUT_DIR}/usr/bin/gobject-query
    # rm -f ${OUT_DIR}/usr/bin/gtester
    # rm -f ${OUT_DIR}/usr/bin/gtester-report
    # rm -rf ${OUT_DIR}/usr/share/glib-2.0/gdb
    # rm -f ${OUT_DIR}/usr/share/glib-2.0/schemas/*.xml
    # rm -f ${OUT_DIR}/usr/share/glib-2.0/schemas/*.dtd

    find ${OUT_DIR} -type f -executable -exec strip --strip-unneeded {} \; 2>/dev/null || true
    find ${OUT_DIR} -name '*.a' -exec objcopy --enable-deterministic-archives {} \; 2>/dev/null || true
    find "${OUT_DIR}" -exec touch -d "2024-01-01T00:00:00+00:00" {} \;

