package:
  schema: 1
  name: libseccomp
  slug: libseccomp
  namespace: dev/libs
  version: 2.5.6
  description: Enhanced seccomp library
  homepage: https://github.com/seccomp/libseccomp
  checksum: 82e620d4366777b53e4139dd5fe163a352071bd146b8c8d7ceed3fb4c5856495

sources:
- name: libseccomp
  url: https://github.com/seccomp/libseccomp/releases/download/v2.5.6/libseccomp-2.5.6.tar.gz
  sha256: 04c37d72965dce218a0c94519b056e1775cf786b5260ee2b7992956c4ee38633

dependencies:
- name: glibc
  commit: x86_64/pkg/libs/system/glibc/2.39/bundles/dev
- name: gcc
  commit: x86_64/pkg/core/toolchain/gcc/13.2.0/bundles/dev
- name: binutils
  commit: x86_64/pkg/core/toolchain/binutils/2.42/bundles/dev
- name: bash
  commit: x86_64/pkg/cli/shells/bash/5.2.21/bundles/dev
- name: coreutils
  commit: x86_64/pkg/core/userland/coreutils/9.5/bundles/dev
- name: findutils
  commit: x86_64/pkg/core/userland/findutils/4.9.0/bundles/dev
- name: gawk
  commit: x86_64/pkg/cli/text/gawk/5.3.0/bundles/dev
- name: grep
  commit: x86_64/pkg/cli/text/grep/3.11/bundles/dev
- name: gzip
  commit: x86_64/pkg/cli/archive/gzip/1.13/bundles/dev
- name: make
  commit: x86_64/pkg/core/toolchain/make/4.4.1/bundles/dev
- name: sed
  commit: x86_64/pkg/cli/text/sed/4.9/bundles/dev
- name: tar
  commit: x86_64/pkg/cli/archive/tar/1.35/bundles/dev
- name: linux-headers
  commit: x86_64/pkg/libs/system/linux-headers/6.4.1/bundles/dev
- name: ncurses
  commit: x86_64/pkg/libs/system/ncurses/6.4-20230520/bundles/dev
- name: attr
  commit: x86_64/pkg/libs/system/attr/2.5.2/bundles/dev
- name: acl
  commit: x86_64/pkg/libs/system/acl/2.3.2/bundles/dev
- name: gmp
  commit: x86_64/pkg/libs/system/gmp/6.3.0/bundles/dev
- name: libcap
  commit: x86_64/pkg/libs/security/libcap/2.69/bundles/dev
- name: zlib
  commit: x86_64/pkg/libs/system/zlib/1.3.1/bundles/dev
- name: gperf
  commit: x86_64/pkg/core/toolchain/gperf/3.1/bundles/dev

build:
  environment: 27b6e5dc7ad152c9a17c2cabfcc5ee93daa9bbf0
  profile: [4120:10034, 8234:14322, 9435:14572]

  script: |
    tar --no-same-owner -xf ${SOURCE_libseccomp} -C "${WORK_DIR}" --strip-components=1
    cd ${WORK_DIR}

    # Configure
    ./configure --prefix=/usr --disable-static

    # Build
    make

    # Install
    make DESTDIR="${OUT_DIR}" install

    # Set consistent timestamps for reproducible builds
    find "${OUT_DIR}" -exec touch -d '2024-01-01T00:00:00+00:00' {} \;

    strip --strip-unneeded ${OUT_DIR}/usr/bin/scmp_sys_resolver || true
    find ${OUT_DIR}/usr/lib -name "*.so*" -exec strip --strip-unneeded {} \; 2>/dev/null || true

bundles:
  dev:
  - bin
  - dev
  - lib

  full:
  - bin
  - dev
  - lib
  - man

outputs:
  bin:
    files:
    - path: /usr/bin/scmp_sys_resolver
      needs:
      - /usr/lib/ld-linux-x86-64.so.2
      - /usr/lib/libc.so.6
      - /usr/lib/libseccomp.so.2

  dev:
    files:
    - path: /usr/include/seccomp-syscalls.h
    - path: /usr/include/seccomp.h
    - path: /usr/lib/libseccomp.la
    - path: /usr/lib/pkgconfig/libseccomp.pc

  lib:
    files:
    - path: /usr/lib/libseccomp.so
      needs:
      - /usr/lib/libc.so.6
    - path: /usr/lib/libseccomp.so.2
      needs:
      - /usr/lib/libc.so.6
    - path: /usr/lib/libseccomp.so.2.5.6
      needs:
      - /usr/lib/libc.so.6

  man:
    files:
    - path: /usr/share/man/man1/scmp_sys_resolver.1
    - path: /usr/share/man/man3/seccomp_api_get.3
    - path: /usr/share/man/man3/seccomp_api_set.3
    - path: /usr/share/man/man3/seccomp_arch_add.3
    - path: /usr/share/man/man3/seccomp_arch_exist.3
    - path: /usr/share/man/man3/seccomp_arch_native.3
    - path: /usr/share/man/man3/seccomp_arch_remove.3
    - path: /usr/share/man/man3/seccomp_arch_resolve_name.3
    - path: /usr/share/man/man3/seccomp_attr_get.3
    - path: /usr/share/man/man3/seccomp_attr_set.3
    - path: /usr/share/man/man3/seccomp_export_bpf.3
    - path: /usr/share/man/man3/seccomp_export_pfc.3
    - path: /usr/share/man/man3/seccomp_init.3
    - path: /usr/share/man/man3/seccomp_load.3
    - path: /usr/share/man/man3/seccomp_merge.3
    - path: /usr/share/man/man3/seccomp_notify_alloc.3
    - path: /usr/share/man/man3/seccomp_notify_fd.3
    - path: /usr/share/man/man3/seccomp_notify_free.3
    - path: /usr/share/man/man3/seccomp_notify_id_valid.3
    - path: /usr/share/man/man3/seccomp_notify_receive.3
    - path: /usr/share/man/man3/seccomp_notify_respond.3
    - path: /usr/share/man/man3/seccomp_release.3
    - path: /usr/share/man/man3/seccomp_reset.3
    - path: /usr/share/man/man3/seccomp_rule_add.3
    - path: /usr/share/man/man3/seccomp_rule_add_array.3
    - path: /usr/share/man/man3/seccomp_rule_add_exact.3
    - path: /usr/share/man/man3/seccomp_rule_add_exact_array.3
    - path: /usr/share/man/man3/seccomp_syscall_priority.3
    - path: /usr/share/man/man3/seccomp_syscall_resolve_name.3
    - path: /usr/share/man/man3/seccomp_syscall_resolve_name_arch.3
    - path: /usr/share/man/man3/seccomp_syscall_resolve_name_rewrite.3
    - path: /usr/share/man/man3/seccomp_syscall_resolve_num_arch.3
    - path: /usr/share/man/man3/seccomp_version.3

resolution:
  /usr/lib/ld-linux-x86-64.so.2: glibc
  /usr/lib/libc.so.6: glibc
  /usr/lib/libseccomp.so.2: self
