build:
  environment: 27b6e5dc7ad152c9a17c2cabfcc5ee93daa9bbf0
  profile: [4117:1248, 8594:2350, 13178:2352, 17842:2353, 21956:2364, 26428:2365, 30532:2639, 34784:3623, 36273:3659]

  script: |
    set -eu

    tar --no-same-owner -xf "${SOURCE_cairomm1}" -C "${WORK_DIR}" --strip-components=1
    cd "${WORK_DIR}"

    sed -i \
      -e '/context_surface_xlib.cc/d' \
      -e 's/ context_surface_xlib.lo//' \
      -e '/context_surface_xlib.Plo/d' \
      -e '/xlib_surface.cc/d' \
      -e 's/ xlib_surface.lo//' \
      -e '/xlib_surface.Plo/d' \
      -e '/xlib_surface.h/d' \
      cairomm/filelist.am \
      cairomm/Makefile.in \
      docs/Makefile.in
    sed -i \
      -e 's/ $(am__objects_2)//' \
      cairomm/Makefile.in
    sed -i \
      -e '/cairomm-xlib-1.0.pc/d' \
      -e '/cairomm-xlib-xrender-1.0.pc/d' \
      Makefile.in

    ./configure \
      --prefix=/usr \
      --libdir=/usr/lib \
      --disable-static \
      --disable-documentation \
      --disable-tests

    make
    DESTDIR="${OUT_DIR}" make install

    rm -f \
      "${OUT_DIR}/usr/lib/pkgconfig/cairomm-xlib-1.0.pc" \
      "${OUT_DIR}/usr/lib/pkgconfig/cairomm-xlib-xrender-1.0.pc"

    find "${OUT_DIR}" -name '*.la' -delete
    find "${OUT_DIR}" -type f -executable -exec strip --strip-unneeded {} \; 2>/dev/null || true
    find "${OUT_DIR}" -name '*.a' -exec objcopy --enable-deterministic-archives {} \; 2>/dev/null || true
    find "${OUT_DIR}" -exec touch -d "2024-01-01T00:00:00+00:00" {} \;

