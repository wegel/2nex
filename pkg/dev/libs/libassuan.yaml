package:
  schema: 1
  name: libassuan
  slug: libassuan
  namespace: dev/libs
  version: 2.5.7
  description: IPC library used by GnuPG and related software
  homepage: https://www.gnupg.org/software/libassuan/
  checksum: fd74792bb29674078ef24f4a37e76cfe21bfc45fa25d7ec32af410b57df08b44

sources:
- name: libassuan
  url: https://gnupg.org/ftp/gcrypt/libassuan/libassuan-2.5.7.tar.bz2
  sha256: 0103081ffc27838a2e50479153ca105e873d3d65d8a9593282e9c94c7e6afb76

dependencies:
- name: bash
  commit: x86_64/pkg/cli/shells/bash/5.2.21/bundles/dev
- name: coreutils
  commit: x86_64/pkg/core/userland/coreutils/9.5/bundles/dev
- name: findutils
  commit: x86_64/pkg/core/userland/findutils/4.9.0/bundles/dev
- name: phase3
  commit: x86_64/pkg/bootstrap/phase3/2nex-utilities-bootstrap/0.0.1/bundles/dev
- name: gawk
  commit: x86_64/pkg/cli/text/gawk/5.3.0/bundles/dev
- name: grep
  commit: x86_64/pkg/cli/text/grep/3.11/bundles/dev
- name: make
  commit: x86_64/pkg/core/toolchain/make/4.4.1/bundles/dev
- name: sed
  commit: x86_64/pkg/cli/text/sed/4.9/bundles/dev
- name: tar
  commit: x86_64/pkg/cli/archive/tar/1.35/bundles/dev
- name: binutils
  commit: x86_64/pkg/bootstrap/phase3/binutils/2.42/bundles/dev
- name: inetutils
  commit: x86_64/pkg/net/misc/inetutils/2.5/bundles/dev
- name: glibc
  commit: x86_64/pkg/libs/system/glibc/2.39/bundles/dev
- name: gcc
  commit: x86_64/pkg/bootstrap/phase3/gcc/13.2.0/bundles/dev
- name: acl
  commit: x86_64/pkg/libs/system/acl/2.3.2/bundles/dev
- name: attr
  commit: x86_64/pkg/libs/system/attr/2.5.2/bundles/dev
- name: bzip2
  commit: x86_64/pkg/bootstrap/phase3/bzip2/1.0.8/bundles/dev
- name: gmp
  commit: x86_64/pkg/libs/system/gmp/6.3.0/bundles/dev
- name: libcap
  commit: x86_64/pkg/libs/security/libcap/2.69/bundles/dev
- name: mpfr
  commit: x86_64/pkg/bootstrap/phase3/mpfr/4.2.1/bundles/dev
- name: zlib
  commit: x86_64/pkg/bootstrap/phase3/zlib/1.3.1/bundles/dev
- name: linux-headers
  commit: x86_64/pkg/bootstrap/phase3/linux-headers/6.4.1/bundles/dev
- name: mpc
  commit: x86_64/pkg/bootstrap/phase3/mpc/1.2.1/bundles/dev
- name: ncurses
  commit: x86_64/pkg/libs/system/ncurses/6.4-20230520/bundles/dev
- name: libgpg-error
  commit: x86_64/pkg/dev/libs/libgpg-error/1.51/bundles/dev

build:
  profile: [4111:789, 8470:3109, 12736:3110, 17317:3112, 21882:3121, 26414:3123, 30887:3124, 35309:3324, 43731:3512, 45780:3543]

  script: |
    tar --no-same-owner -xf ${SOURCE_libassuan} -C "${WORK_DIR}" --strip-components=1
    cd ${WORK_DIR}

    # Configure
    ./configure --prefix=/usr --disable-static

    # Build
    make

    # Install
    make DESTDIR="${OUT_DIR}" install

    # Set consistent timestamps for reproducible builds
    find "${OUT_DIR}" -exec touch -d '2024-01-01T00:00:00+00:00' {} \;
    find "${OUT_DIR}" ! -type d -exec strip-nondeterminism -T 1704067200 --normalizers +all {} \; || true
    2nex_strip_binaries ${OUT_DIR}

bundles:
  dev:
  - bin
  - dev
  - lib

  full:
  - bin
  - dev
  - lib

outputs:
  bin:
    files:
    - path: /usr/bin/libassuan-config

  dev:
    files:
    - path: /usr/include/assuan.h
    - path: /usr/lib/libassuan.la
    - path: /usr/lib/pkgconfig/libassuan.pc
    - path: /usr/share/aclocal/libassuan.m4

  lib:
    files:
    - path: /usr/lib/libassuan.so
      needs:
      - /usr/lib/libc.so.6
      - /usr/lib/libgpg-error.so.0
    - path: /usr/lib/libassuan.so.0
      needs:
      - /usr/lib/libc.so.6
      - /usr/lib/libgpg-error.so.0
    - path: /usr/lib/libassuan.so.0.8.7
      needs:
      - /usr/lib/libc.so.6
      - /usr/lib/libgpg-error.so.0

resolution:
  /usr/lib/libc.so.6: glibc
  /usr/lib/libgpg-error.so.0: libgpg-error
