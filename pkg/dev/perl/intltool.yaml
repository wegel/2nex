package:
  schema: 1
  name: intltool
  slug: intltool
  namespace: dev/perl
  version: 0.51.0
  description: intltool is a set of tools to centralize translation of many different file formats using GNU gettext-compatible PO files.
  homepage: https://freedesktop.org/wiki/Software/intltool
  checksum: ec29ce03f93b199331b3d1ae367cdd58eb3479e09062eb84c3c53e81f534cd90

sources:
- name: intltool
  url: https://launchpad.net/intltool/trunk/0.51.0/+download/intltool-0.51.0.tar.gz
  sha256: 67c74d94196b153b774ab9f89b2fa6c6ba79352407037c8c14d5aeb334e959cd

dependencies:
- name: coreutils
  commit: x86_64/pkg/bootstrap/phase1/coreutils/9.5/bundles/dev
- name: findutils
  commit: x86_64/pkg/bootstrap/phase1/findutils/4.9.0/bundles/dev
- name: bash
  commit: x86_64/pkg/bootstrap/phase1/bash/5.2.21/bundles/dev
- name: phase3
  commit: x86_64/pkg/bootstrap/phase3/2nex-utilities-bootstrap/0.0.1/bundles/dev
- name: gawk
  commit: x86_64/pkg/bootstrap/phase1/gawk/5.3.0/bundles/dev
- name: gzip
  commit: x86_64/pkg/bootstrap/phase1/gzip/1.13/bundles/dev
- name: make
  commit: x86_64/pkg/bootstrap/phase1/make/4.4.1/bundles/dev
- name: tar
  commit: x86_64/pkg/bootstrap/phase1/tar/1.35/bundles/dev
- name: gcc
  commit: x86_64/pkg/bootstrap/phase3/gcc/13.2.0/bundles/dev
- name: glibc
  commit: x86_64/pkg/libs/system/glibc/2.39/bundles/dev
- name: perl
  commit: x86_64/pkg/dev/lang/perl/5.38.2/bundles/dev
- name: sed
  commit: x86_64/pkg/bootstrap/phase1/sed/4.9/bundles/dev
- name: expat
  commit: x86_64/pkg/libs/system/expat/2.6.2/bundles/dev
- name: xml_parser
  commit: x86_64/pkg/dev/perl/xml-parser/2.47/bundles/dev

build:
  environment: 13ce31fd97c19f5756e4413babf279d543b5a71c
  profile: [4131:200, 6685:220]

  script: |
    tar --no-same-owner -xf ${SOURCE0} -C "${WORK_DIR}" --strip-components=1
    cd ${WORK_DIR}

    sed -i 's:\\\${:\\\$\\{:' intltool-update.in
    ./configure --prefix=/usr
    make
    make DESTDIR=$OUT_DIR install
    install -v -Dm644 doc/I18N-HOWTO ${OUT_DIR}/usr/share/doc/intltool-0.51.0/I18N-HOWTO

    find "${OUT_DIR}" -exec touch -d "2024-01-01T00:00:00+00:00" {} \;
    2nex_strip_binaries ${OUT_DIR}

bundles:
  dev:
  - bin
  - misc

  full:
  - bin
  - doc
  - man
  - misc

outputs:
  bin:
    files:
    - path: /usr/bin/intltool-extract
    - path: /usr/bin/intltool-merge
    - path: /usr/bin/intltool-prepare
    - path: /usr/bin/intltool-update
    - path: /usr/bin/intltoolize

  doc:
    files:
    - path: /usr/share/doc/intltool-0.51.0/I18N-HOWTO

  man:
    files:
    - path: /usr/share/man/man8/intltool-extract.8
    - path: /usr/share/man/man8/intltool-merge.8
    - path: /usr/share/man/man8/intltool-prepare.8
    - path: /usr/share/man/man8/intltool-update.8
    - path: /usr/share/man/man8/intltoolize.8

  misc:
    files:
    - path: /usr/share/aclocal/intltool.m4
    - path: /usr/share/intltool/Makefile.in.in
