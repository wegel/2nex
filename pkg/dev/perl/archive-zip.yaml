package:
  schema: 1
  name: Archive::Zip
  slug: archive-zip
  namespace: dev/perl
  version: "1.68"
  description: Perl module for ZIP archives
  homepage: https://metacpan.org/pod/Archive::Zip
  checksum: 6960b79d008700be53838b225798c7a896923c3cf3727f457a750befecf5fae8

sources:
- name: archive_zip
  url: https://cpan.metacpan.org/authors/id/P/PH/PHRED/Archive-Zip-1.68.tar.gz
  sha256: 984e185d785baf6129c6e75f8eb44411745ac00bf6122fb1c8e822a3861ec650

dependencies:
- name: bash
  commit: x86_64/pkg/cli/shells/bash/5.2.21/bundles/dev
- name: coreutils
  commit: x86_64/pkg/core/userland/coreutils/9.5/bundles/dev
- name: findutils
  commit: x86_64/pkg/core/userland/findutils/4.9.0/bundles/dev
- name: gzip
  commit: x86_64/pkg/cli/archive/gzip/1.13/bundles/dev
- name: make
  commit: x86_64/pkg/core/toolchain/make/4.4.1/bundles/dev
- name: tar
  commit: x86_64/pkg/cli/archive/tar/1.35/bundles/dev
- name: perl
  commit: x86_64/pkg/dev/lang/perl/5.38.2/bundles/dev

build:
  environment: 27b6e5dc7ad152c9a17c2cabfcc5ee93daa9bbf0
  profile: [2541:262]

  script: |
    tar --no-same-owner -xf ${SOURCE_archive_zip} -C "${WORK_DIR}" --strip-components=1
    cd "${WORK_DIR}"

    perl Makefile.PL
    make
    make DESTDIR="${OUT_DIR}" install

    find "${OUT_DIR}" -exec touch -d "2024-01-01T00:00:00+00:00" {} \;

bundles:
  dev:
  - lib

  full:
  - bin
  - lib
  - man

outputs:
  bin:
    files:
    - path: /usr/bin/crc32
      needs:
      - /usr/bin/perl

  lib:
    files:
    - path: /usr/lib/perl5/5.38/core_perl/perllocal.pod
    - path: /usr/lib/perl5/5.38/site_perl/Archive/Zip.pm
    - path: /usr/lib/perl5/5.38/site_perl/Archive/Zip/Archive.pm
    - path: /usr/lib/perl5/5.38/site_perl/Archive/Zip/BufferedFileHandle.pm
    - path: /usr/lib/perl5/5.38/site_perl/Archive/Zip/DirectoryMember.pm
    - path: /usr/lib/perl5/5.38/site_perl/Archive/Zip/FAQ.pod
    - path: /usr/lib/perl5/5.38/site_perl/Archive/Zip/FileMember.pm
    - path: /usr/lib/perl5/5.38/site_perl/Archive/Zip/Member.pm
    - path: /usr/lib/perl5/5.38/site_perl/Archive/Zip/MemberRead.pm
    - path: /usr/lib/perl5/5.38/site_perl/Archive/Zip/MockFileHandle.pm
    - path: /usr/lib/perl5/5.38/site_perl/Archive/Zip/NewFileMember.pm
    - path: /usr/lib/perl5/5.38/site_perl/Archive/Zip/StringMember.pm
    - path: /usr/lib/perl5/5.38/site_perl/Archive/Zip/Tree.pm
    - path: /usr/lib/perl5/5.38/site_perl/Archive/Zip/ZipFileMember.pm
    - path: /usr/lib/perl5/5.38/site_perl/auto/Archive/Zip/.packlist

  man:
    files:
    - path: /usr/share/man/man3/Archive::Zip.3
    - path: /usr/share/man/man3/Archive::Zip::FAQ.3
    - path: /usr/share/man/man3/Archive::Zip::MemberRead.3
    - path: /usr/share/man/man3/Archive::Zip::Tree.3

resolution:
  /usr/bin/perl: perl
