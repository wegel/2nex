  commit: x86_64/pkg/cli/text/grep/3.11/bundles/dev
- name: gawk
  commit: x86_64/pkg/cli/text/gawk/5.3.0/bundles/dev
- name: sed
  commit: x86_64/pkg/cli/text/sed/4.9/bundles/dev
- name: tar
  commit: x86_64/pkg/cli/archive/tar/1.35/bundles/dev
- name: gzip
  commit: x86_64/pkg/cli/archive/gzip/1.13/bundles/dev
- name: bzip2
  commit: x86_64/pkg/libs/compression/bzip2/1.0.8/bundles/dev
- name: xz
  commit: x86_64/pkg/libs/compression/xz/5.4.6/bundles/dev

build:
  environment: 27b6e5dc7ad152c9a17c2cabfcc5ee93daa9bbf0
  profile: [4136:803, 8246:3668, 12364:5519, 16550:5619, 20812:5738, 24955:5830, 29092:5941, 32040:6006]

  script: |
    tar --no-same-owner -xf ${SOURCE_file} -C "${WORK_DIR}" --strip-components=1
    cd ${WORK_DIR}
    ./configure --prefix=/usr
    make
    make check
    make DESTDIR="${OUT_DIR}" install

    find ${OUT_DIR} -type f -executable -exec strip --strip-unneeded {} \; 2>/dev/null || true
    find ${OUT_DIR} -name '*.a' -exec objcopy --enable-deterministic-archives {} \; 2>/dev/null || true
    find "${OUT_DIR}" -exec touch -d "2024-01-01T00:00:00+00:00" {} \;

bundles:
  dev:
  - bin
  - dev
  - lib
  - misc

  full:
  - bin
  - dev
  - lib
  - man

outputs:
  bin:
    files:
    - path: /usr/bin/file
      needs:
      - /usr/lib/ld-linux-x86-64.so.2
      - /usr/lib/libc.so.6
      - /usr/lib/libmagic.so.1

  dev:
    files:
    - path: /usr/include/magic.h
    - path: /usr/lib/libmagic.la
    - path: /usr/lib/pkgconfig/libmagic.pc

  lib:
    files:
    - path: /usr/lib/libmagic.so
      needs:
      - /usr/lib/libbz2.so.1.0
      - /usr/lib/libc.so.6
      - /usr/lib/liblzma.so.5
      - /usr/lib/libm.so.6
      - /usr/lib/libz.so.1
    - path: /usr/lib/libmagic.so.1
      needs:
      - /usr/lib/libbz2.so.1.0
      - /usr/lib/libc.so.6
      - /usr/lib/liblzma.so.5
      - /usr/lib/libm.so.6
      - /usr/lib/libz.so.1
    - path: /usr/lib/libmagic.so.1.0.0
      needs:
      - /usr/lib/libbz2.so.1.0
      - /usr/lib/libc.so.6
      - /usr/lib/liblzma.so.5
      - /usr/lib/libm.so.6
      - /usr/lib/libz.so.1

  man:
    files:
    - path: /usr/share/man/man1/file.1
    - path: /usr/share/man/man3/libmagic.3
    - path: /usr/share/man/man4/magic.4

  misc:
    files:
    - path: /usr/share/misc/magic.mgc

resolution:
  /usr/lib/libbz2.so.1.0: bzip2
  /usr/lib/ld-linux-x86-64.so.2: glibc
  /usr/lib/libc.so.6: glibc
  /usr/lib/libm.so.6: glibc
  /usr/lib/libmagic.so.1: self
  /usr/lib/liblzma.so.5: xz
  /usr/lib/libz.so.1: zlib
