build:
  environment: 13ce31fd97c19f5756e4413babf279d543b5a71c
  profile: [4143:819, 8271:3412, 12402:5222, 16621:5314, 20883:5427, 25026:5504, 29184:5615, 32288:5698]

  script: |
    tar --no-same-owner -xf ${SOURCE_file} -C "${WORK_DIR}" --strip-components=1
    cd ${WORK_DIR}
    ./configure --prefix=/usr
    make
    make check
    make DESTDIR="${OUT_DIR}" install

    find "${OUT_DIR}" -exec touch -d '2024-01-01T00:00:00+00:00' {} \;
    2nex_strip_binaries ${OUT_DIR}

bundles:
  dev:
  - bin
  - dev
  - lib
  - misc

  full:
  - bin
  - dev
  - lib
  - man

outputs:
  bin:
    files:
    - path: /usr/bin/file
      needs:
      - /usr/lib/ld-linux-x86-64.so.2
      - /usr/lib/libc.so.6
      - /usr/lib/libmagic.so.1

  dev:
    files:
    - path: /usr/include/magic.h
    - path: /usr/lib/libmagic.la
    - path: /usr/lib/pkgconfig/libmagic.pc

  lib:
    files:
    - path: /usr/lib/libmagic.so
      needs:
      - /usr/lib/libbz2.so.1.0
      - /usr/lib/libc.so.6
      - /usr/lib/liblzma.so.5
      - /usr/lib/libm.so.6
      - /usr/lib/libz.so.1
    - path: /usr/lib/libmagic.so.1
      needs:
      - /usr/lib/libbz2.so.1.0
      - /usr/lib/libc.so.6
      - /usr/lib/liblzma.so.5
      - /usr/lib/libm.so.6
      - /usr/lib/libz.so.1
    - path: /usr/lib/libmagic.so.1.0.0
      needs:
      - /usr/lib/libbz2.so.1.0
      - /usr/lib/libc.so.6
      - /usr/lib/liblzma.so.5
      - /usr/lib/libm.so.6
      - /usr/lib/libz.so.1

  man:
    files:
    - path: /usr/share/man/man1/file.1
    - path: /usr/share/man/man3/libmagic.3
    - path: /usr/share/man/man4/magic.4

  misc:
    files:
    - path: /usr/share/misc/magic.mgc

resolution:
  /usr/lib/libbz2.so.1.0: bzip2
  /usr/lib/ld-linux-x86-64.so.2: glibc
  /usr/lib/libc.so.6: glibc
  /usr/lib/libm.so.6: glibc
  /usr/lib/libmagic.so.1: self
  /usr/lib/liblzma.so.5: xz
  /usr/lib/libz.so.1: zlib
