build:
  script: 'tar --no-same-owner -xf ${SOURCE_file} -C "${WORK_DIR}" --strip-components=1

    cd ${WORK_DIR}

    ./configure --prefix=/usr

    make

    make check

    make DESTDIR="${OUT_DIR}" install


    find "${OUT_DIR}" -exec touch -d ''2024-01-01T00:00:00+00:00'' {} \;

    2nex_strip_binaries ${OUT_DIR}

    '
bundles:
  full:
  - man
  - bin
  - lib
  - dev
  dev:
  - bin
  - lib
  - dev
  - misc
outputs:
  man:
    files:
    - /usr/share/man/man1/file.1
    - /usr/share/man/man3/libmagic.3
    - /usr/share/man/man4/magic.4
  bin:
    files:
    - /usr/bin/file
    requires:
    - x86_64/pkg/libs/system/glibc/2.39/outputs/lib
  lib:
    files:
    - /usr/lib/libmagic.so
    - /usr/lib/libmagic.so.1
    - /usr/lib/libmagic.so.1.0.0
    requires:
    - x86_64/pkg/libs/compression/bzip2/1.0.8/outputs/lib
    - x86_64/pkg/libs/system/glibc/2.39/outputs/lib
    - x86_64/pkg/libs/compression/xz/5.4.6/outputs/lib
    - x86_64/pkg/libs/system/zlib/1.3.1/outputs/lib
  dev:
    files:
    - /usr/include/magic.h
    - /usr/lib/libmagic.la
    - /usr/lib/pkgconfig/libmagic.pc
  misc:
    files:
    - /usr/share/misc/magic.mgc
