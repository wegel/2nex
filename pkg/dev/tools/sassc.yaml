package:
  schema: 1
  name: sassc
  slug: sassc
  namespace: dev/tools
  version: 3.6.2
  description: Sass compiler written in C
  homepage: https://github.com/sass/sassc
  checksum: a5934b6e47bc2f33db3dba725e1b642c6ce67905feac93663be2b431280e341e

sources:
- name: libsass
  url: https://github.com/sass/libsass/archive/3.6.6.tar.gz
  sha256: 11f0bb3709a4f20285507419d7618f3877a425c0131ea8df40fe6196129df15d
- name: sassc
  url: https://github.com/sass/sassc/archive/3.6.2.tar.gz
  sha256: 608dc9002b45a91d11ed59e352469ecc05e4f58fc1259fc9a9f5b8f0f8348a03

dependencies:
- name: glibc
  commit: x86_64/pkg/libs/system/glibc/2.39/bundles/dev
- name: gcc
  commit: x86_64/pkg/core/toolchain/gcc/13.2.0/bundles/dev
- name: binutils
  commit: x86_64/pkg/core/toolchain/binutils/2.42/bundles/dev
- name: make
  commit: x86_64/pkg/core/toolchain/make/4.4.1/bundles/dev
- name: autoconf
  commit: x86_64/pkg/core/toolchain/autoconf/2.72/bundles/dev
- name: automake
  commit: x86_64/pkg/core/toolchain/automake/1.16.5/bundles/dev
- name: libtool
  commit: x86_64/pkg/core/toolchain/libtool/2.4.7/bundles/dev
- name: bash
  commit: x86_64/pkg/cli/shells/bash/5.2.21/bundles/dev
- name: ncurses
  commit: x86_64/pkg/libs/system/ncurses/6.4-20230520/bundles/dev
- name: acl
  commit: x86_64/pkg/libs/system/acl/2.3.2/bundles/dev
- name: attr
  commit: x86_64/pkg/libs/system/attr/2.5.2/bundles/dev
- name: libcap
  commit: x86_64/pkg/libs/security/libcap/2.69/bundles/dev
- name: tar
  commit: x86_64/pkg/cli/archive/tar/1.35/bundles/dev
- name: gzip
  commit: x86_64/pkg/cli/archive/gzip/1.13/bundles/dev
- name: coreutils
  commit: x86_64/pkg/core/userland/coreutils/9.5/bundles/dev
- name: findutils
  commit: x86_64/pkg/core/userland/findutils/4.9.0/bundles/dev
- name: linux-headers
  commit: x86_64/pkg/libs/system/linux-headers/6.4.1/bundles/dev
- name: gawk
  commit: x86_64/pkg/cli/text/gawk/5.3.0/bundles/dev
- name: sed
  commit: x86_64/pkg/cli/text/sed/4.9/bundles/dev
- name: grep
  commit: x86_64/pkg/cli/text/grep/3.11/bundles/dev
- name: m4
  commit: x86_64/pkg/dev/lang/m4/1.4.19/bundles/dev
- name: perl
  commit: x86_64/pkg/dev/lang/perl/5.38.2/bundles/dev
- name: gmp
  commit: x86_64/pkg/libs/system/gmp/6.3.0/bundles/dev
- name: zlib
  commit: x86_64/pkg/libs/system/zlib/1.3.1/bundles/dev
- name: diffutils
  commit: x86_64/pkg/core/userland/diffutils/3.10/bundles/dev

build:
  environment: 27b6e5dc7ad152c9a17c2cabfcc5ee93daa9bbf0
  profile: [26350:20636, 101164:40585, 229487:70593, 382903:92913, 507316:106142, 635590:110571, 759908:116172, 950968:124388, 1136960:132914, 1262922:145488]

  script: |
    # save absolute paths to sources (they are relative to /)
    LIBSASS_TAR=/${SOURCE_libsass}
    SASSC_TAR=/${SOURCE_sassc}

    # set up aclocal path for libtool macros
    export ACLOCAL_PATH="/usr/share/aclocal"

    # extract libsass
    mkdir -p ${WORK_DIR}/libsass
    tar --no-same-owner -xf ${LIBSASS_TAR} -C "${WORK_DIR}/libsass" --strip-components=1

    # build libsass
    cd ${WORK_DIR}/libsass
    autoreconf -fi
    ./configure --prefix=/usr --disable-static
    make
    make DESTDIR="${OUT_DIR}" install

    # extract sassc
    mkdir -p ${WORK_DIR}/sassc
    tar --no-same-owner -xf ${SASSC_TAR} -C "${WORK_DIR}/sassc" --strip-components=1

    # build sassc
    cd ${WORK_DIR}/sassc
    export PKG_CONFIG_PATH="${OUT_DIR}/usr/lib/pkgconfig"
    export LDFLAGS="${LDFLAGS:-} -L${OUT_DIR}/usr/lib -Wl,-rpath,/usr/lib"
    export CPPFLAGS="${CPPFLAGS:-} -I${OUT_DIR}/usr/include"
    autoreconf -fi
    ./configure --prefix=/usr
    make
    make DESTDIR="${OUT_DIR}" install

    find ${OUT_DIR} -type f -executable -exec strip --strip-unneeded {} \; 2>/dev/null || true
    find ${OUT_DIR} -name '*.a' -exec objcopy --enable-deterministic-archives {} \; 2>/dev/null || true
    find "${OUT_DIR}" -exec touch -d "2024-01-01T00:00:00+00:00" {} \;

bundles:
  dev:
  - bin
  - dev
  - lib

outputs:
  bin:
    files:
    - path: /usr/bin/sassc
      needs:
      - /usr/lib/ld-linux-x86-64.so.2
      - /usr/lib/libc.so.6
      - /usr/lib/libsass.so.1

  dev:
    files:
    - path: /usr/include/sass.h
    - path: /usr/include/sass/base.h
    - path: /usr/include/sass/context.h
    - path: /usr/include/sass/functions.h
    - path: /usr/include/sass/values.h
    - path: /usr/include/sass/version.h
    - path: /usr/include/sass2scss.h
    - path: /usr/lib/libsass.la
    - path: /usr/lib/pkgconfig/libsass.pc

  lib:
    files:
    - path: /usr/lib/libsass.so
      needs:
      - /usr/lib/libc.so.6
      - /usr/lib/libgcc_s.so.1
      - /usr/lib/libm.so.6
      - /usr/lib/libstdc++.so.6
    - path: /usr/lib/libsass.so.1
      needs:
      - /usr/lib/libc.so.6
      - /usr/lib/libgcc_s.so.1
      - /usr/lib/libm.so.6
      - /usr/lib/libstdc++.so.6
    - path: /usr/lib/libsass.so.1.0.0
      needs:
      - /usr/lib/libc.so.6
      - /usr/lib/libgcc_s.so.1
      - /usr/lib/libm.so.6
      - /usr/lib/libstdc++.so.6

resolution:
  /usr/lib/libgcc_s.so.1: gcc
  /usr/lib/libstdc++.so.6: gcc
  /usr/lib/ld-linux-x86-64.so.2: glibc
  /usr/lib/libc.so.6: glibc
  /usr/lib/libm.so.6: glibc
  /usr/lib/libsass.so.1: self
