  commit: x86_64/pkg/cli/text/sed/4.9/bundles/dev
- name: grep
  commit: x86_64/pkg/cli/text/grep/3.11/bundles/dev
- name: gawk
  commit: x86_64/pkg/cli/text/gawk/5.3.0/bundles/dev
- name: diffutils
  commit: x86_64/pkg/core/userland/diffutils/3.10/bundles/dev
- name: file
  commit: x86_64/pkg/dev/tools/file/5.45/bundles/dev
- name: m4
  commit: x86_64/pkg/dev/lang/m4/1.4.19/bundles/dev
- name: bison
  commit: x86_64/pkg/core/toolchain/bison/3.8.2/bundles/dev
- name: flex
  commit: x86_64/pkg/core/toolchain/flex/2.6.4/bundles/dev
- name: pkgconf
  commit: x86_64/pkg/core/toolchain/pkgconf/2.2.0/bundles/dev
- name: texinfo
  commit: x86_64/pkg/cli/text/texinfo/7.1/bundles/dev
- name: zlib
  commit: x86_64/pkg/libs/system/zlib/1.3.1/bundles/dev
- name: ncurses
  commit: x86_64/pkg/libs/system/ncurses/6.4-20230520/bundles/dev
- name: readline
  commit: x86_64/pkg/libs/system/readline/8.2/bundles/dev
- name: expat
  commit: x86_64/pkg/libs/system/expat/2.6.2/bundles/dev
- name: gmp
  commit: x86_64/pkg/libs/system/gmp/6.3.0/bundles/dev
- name: mpfr
  commit: x86_64/pkg/libs/system/mpfr/4.2.1/bundles/dev

build:
  environment: 27b6e5dc7ad152c9a17c2cabfcc5ee93daa9bbf0
  profile: [8323:2849, 24801:3883, 54748:5973, 92955:10509, 122772:10570, 153222:10656, 182825:11198, 228038:19631, 274442:42724, 300370:73418]

  script: |
    tar --no-same-owner -xf ${SOURCE_gdb} -C "${WORK_DIR}" --strip-components=1
    cd "${WORK_DIR}"
    mkdir -p build
    cd build

    ../configure                  \
      --prefix=/usr               \
      --build=$(../config.guess)  \
      --host=${TARGET}            \
      --disable-binutils          \
      --disable-gas               \
      --disable-gold              \
      --disable-gprof             \
      --disable-ld                \
      --disable-nls               \
      --disable-sim               \
      --disable-source-highlight  \
      --disable-werror            \
      --with-system-readline      \
      --with-system-zlib          \
      --with-expat                \
      --with-gmp=/usr             \
      --with-mpfr=/usr            \
      --with-lzma                 \
      --with-python=no            \
      --with-guile=no             \
      --without-debuginfod        \
      --without-babeltrace        \
      --without-libunwind         \
      --without-xxhash            \
      MAKEINFO=true

    make MAKEINFO=true
    make DESTDIR="${OUT_DIR}" MAKEINFO=true install

    find "${OUT_DIR}" -type f -executable -exec strip --strip-unneeded {} \; 2>/dev/null || true
    find "${OUT_DIR}" -name '*.a' -exec objcopy --enable-deterministic-archives {} \; 2>/dev/null || true
    find "${OUT_DIR}" -exec touch -d "2024-01-01T00:00:00+00:00" {} \;

bundles:
  dev:
  - bin
  - dev
  - lib

  full:
  - bin
  - dev
  - info
  - lib
  - man
  - misc
  - static

outputs:
  bin:
    files:
    - path: /usr/bin/gcore
    - path: /usr/bin/gdb
      needs:
      - /usr/lib/ld-linux-x86-64.so.2
      - /usr/lib/libc.so.6
      - /usr/lib/libexpat.so.1
      - /usr/lib/libgcc_s.so.1
      - /usr/lib/libgmp.so.10
      - /usr/lib/liblzma.so.5
      - /usr/lib/libm.so.6
      - /usr/lib/libmpfr.so.6
      - /usr/lib/libncursesw.so.6
      - /usr/lib/libreadline.so.8
      - /usr/lib/libstdc++.so.6
      - /usr/lib/libz.so.1
    - path: /usr/bin/gdb-add-index
    - path: /usr/bin/gdbserver
      needs:
      - /usr/lib/ld-linux-x86-64.so.2
      - /usr/lib/libc.so.6
      - /usr/lib/libgcc_s.so.1
      - /usr/lib/libstdc++.so.6
    - path: /usr/bin/gstack

  dev:
    files:
    - path: /usr/include/ansidecl.h
    - path: /usr/include/bfd.h
    - path: /usr/include/bfdlink.h
    - path: /usr/include/ctf-api.h
