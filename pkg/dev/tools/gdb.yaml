    - path: /usr/share/info/gdb.info-1
    - path: /usr/share/info/gdb.info-2
    - path: /usr/share/info/gdb.info-3
    - path: /usr/share/info/gdb.info-4
    - path: /usr/share/info/gdb.info-5
    - path: /usr/share/info/gdb.info-6
    - path: /usr/share/info/gdb.info-7
