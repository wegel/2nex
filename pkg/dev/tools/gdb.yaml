  homepage: https://www.gnu.org/software/gdb/
  checksum: 52a9ba4090dd1b8bb0e557f8a4034522b409de7a073850db642165ba0a012cb7

sources:
- name: gdb
  url: https://ftp.gnu.org/gnu/gdb/gdb-17.2.tar.xz
  sha256: 1c036c0d72e4b3d1fb5c94c88632add6f9d76f4d7c4d2ea793c12a9f19a3228c

dependencies:
- name: linux-headers
  commit: x86_64/pkg/libs/system/linux-headers/6.4.1/bundles/dev
