    - path: /usr/include/diagnostics.h
    - path: /usr/include/dis-asm.h
    - path: /usr/include/gdb/jit-reader.h
    - path: /usr/include/plugin-api.h
    - path: /usr/include/sframe-api.h
    - path: /usr/include/sframe.h
    - path: /usr/include/symcat.h
    - path: /usr/lib/libbfd.la
    - path: /usr/lib/libctf-nobfd.la
    - path: /usr/lib/libctf.la
    - path: /usr/lib/libopcodes.la
    - path: /usr/lib/libsframe.la

  info:
