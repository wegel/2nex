package:
  schema: 1
  name: ast-grep
  slug: ast-grep
  namespace: dev/tools
  version: 0.44.0
  description: Search and rewrite code using AST patterns
  homepage: https://ast-grep.github.io/
  checksum: c6cea3e4af34bf0d92967ee87988552d658844bc829831a3ecca566f0eef9fb3

sources:
- name: ast_grep
  url: https://github.com/ast-grep/ast-grep/archive/refs/tags/0.44.0.tar.gz
  sha256: 1cc8d5d6a759c6d99c676bcec09fbf1fc72e023804e54480146fd62b300fce95
- name: vendor
  sha256: 51e9bc228b131d995f5c7ca26b23c09b2ec6b301e70158735f65286672ec82d2
  cargo_lock: https://raw.githubusercontent.com/ast-grep/ast-grep/0.44.0/Cargo.lock

dependencies:
- name: bash
  commit: x86_64/pkg/cli/shells/bash/5.2.21/bundles/dev
- name: coreutils
  commit: x86_64/pkg/core/userland/coreutils/9.5/bundles/dev
- name: findutils
  commit: x86_64/pkg/core/userland/findutils/4.9.0/bundles/dev
- name: gzip
  commit: x86_64/pkg/cli/archive/gzip/1.13/bundles/dev
- name: tar
  commit: x86_64/pkg/cli/archive/tar/1.35/bundles/dev
- name: binutils
  commit: x86_64/pkg/core/toolchain/binutils/2.42/bundles/dev
- name: glibc
  commit: x86_64/pkg/libs/system/glibc/2.39/bundles/dev
- name: linux-headers
  commit: x86_64/pkg/libs/system/linux-headers/6.4.1/bundles/dev
- name: gcc
  commit: x86_64/pkg/core/toolchain/gcc/13.2.0/bundles/dev
- name: rust-bin
  commit: x86_64/pkg/dev/lang/rust-bin/1.91.1/bundles/dev
- name: ncurses
  commit: x86_64/pkg/libs/system/ncurses/6.4-20230520/bundles/dev
- name: acl
  commit: x86_64/pkg/libs/system/acl/2.3.2/bundles/dev
- name: attr
  commit: x86_64/pkg/libs/system/attr/2.5.2/bundles/dev
- name: zlib
  commit: x86_64/pkg/libs/system/zlib/1.3.1/bundles/dev

build:
  environment: 27b6e5dc7ad152c9a17c2cabfcc5ee93daa9bbf0
  profile: [4122:3920, 6680:81563]

  script: |
    tar --no-same-owner -xf ${SOURCE_ast_grep} -C "${WORK_DIR}" --strip-components=1
    cd ${WORK_DIR}

    tar --no-same-owner -xf /./${SOURCE_vendor} -C "${WORK_DIR}"

    export CARGO_HOME="${WORK_DIR}/.cargo"
    mkdir -p "${CARGO_HOME}"

    cat > "${CARGO_HOME}/config.toml" << EOF
    [source.crates-io]
    replace-with = "vendored-sources"

    [source.vendored-sources]
    directory = "vendor"
    EOF

    mkdir -p /usr/local/bin
    ln -sf /usr/bin/gcc /usr/local/bin/cc
    ln -sf /usr/bin/ld.bfd /usr/local/bin/ld
    export PATH="/usr/local/bin:${PATH}"
    export CFLAGS="${CFLAGS//-flto=auto/}"
    export CXXFLAGS="${CXXFLAGS//-flto=auto/}"
    export LDFLAGS="${LDFLAGS//-flto=auto/}"
    export CARGO_TARGET_X86_64_UNKNOWN_LINUX_GNU_LINKER=gcc
    export RUSTFLAGS="-C codegen-units=1 -C embed-bitcode=yes -C debuginfo=0"

    cargo build --release --offline --target x86_64-unknown-linux-gnu -p ast-grep --bin ast-grep --bin sg

    mkdir -p ${OUT_DIR}/usr/bin
    install -m 755 target/x86_64-unknown-linux-gnu/release/ast-grep ${OUT_DIR}/usr/bin/ast-grep
    install -m 755 target/x86_64-unknown-linux-gnu/release/sg ${OUT_DIR}/usr/bin/sg

    strip --strip-unneeded ${OUT_DIR}/usr/bin/ast-grep ${OUT_DIR}/usr/bin/sg

    find "${OUT_DIR}" -exec touch -d '2024-01-01T00:00:00+00:00' {} \;

bundles:
  dev:
  - bin

outputs:
  bin:
    files:
    - path: /usr/bin/ast-grep
      needs:
      - /usr/lib/ld-linux-x86-64.so.2
      - /usr/lib/libc.so.6
      - /usr/lib/libgcc_s.so.1
      - /usr/lib/libm.so.6
    - path: /usr/bin/sg
      needs:
      - /usr/lib/ld-linux-x86-64.so.2
      - /usr/lib/libc.so.6
      - /usr/lib/libgcc_s.so.1

resolution:
  /usr/lib/libgcc_s.so.1: gcc
  /usr/lib/ld-linux-x86-64.so.2: glibc
  /usr/lib/libc.so.6: glibc
  /usr/lib/libm.so.6: glibc
