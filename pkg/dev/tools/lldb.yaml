build:
  environment: 27b6e5dc7ad152c9a17c2cabfcc5ee93daa9bbf0
  profile: [8225:10007, 20724:16405, 41828:42552, 66686:74163, 87518:101604, 108230:124546, 133353:143314, 162346:164619, 195320:178342, 216269:179308]

  script: |
    CFLAGS=${CFLAGS/-flto=auto/}
    CXXFLAGS=${CXXFLAGS/-flto=auto/}
    LDFLAGS=${LDFLAGS/-flto=auto/}

    tar --no-same-owner -xf "${SOURCE_llvm}" -C "${WORK_DIR}" --strip-components=1
    cd "${WORK_DIR}"

    cmake -B build -G Ninja \
      -DCMAKE_BUILD_TYPE=Release \
      -DCMAKE_INSTALL_PREFIX=/usr \
      -DLLVM_DIR=/usr/lib/cmake/llvm \
      -DClang_DIR=/usr/lib/cmake/clang \
      -DPython3_EXECUTABLE=/usr/bin/python3 \
      -DLLDB_ENABLE_PYTHON=OFF \
      -DLLDB_ENABLE_LUA=OFF \
      -DLLDB_ENABLE_LIBEDIT=OFF \
      -DLLDB_ENABLE_CURSES=OFF \
      -DLLDB_INCLUDE_TESTS=OFF \
      -DLLDB_INCLUDE_DOCS=OFF \
      -DLLDB_INCLUDE_EXAMPLES=OFF \
      lldb

    python3 lldb/scripts/generate-sbapi-dwarf-enum.py \
      /usr/include/llvm/BinaryFormat/Dwarf.def \
      -o build/include/lldb/API/SBLanguages.h
    test -s build/include/lldb/API/SBLanguages.h

    cmake --build build
    DESTDIR="${OUT_DIR}" cmake --install build

    find "${OUT_DIR}" -type f -executable -exec strip --strip-unneeded {} \; 2>/dev/null || true
    find "${OUT_DIR}" -name '*.a' -exec objcopy --enable-deterministic-archives {} \; 2>/dev/null || true
    find "${OUT_DIR}" -exec touch -d "2024-01-01T00:00:00+00:00" {} \;

bundles:
  dev:
  - bin
  - lib

  full:
  - bin
  - dev
  - lib

