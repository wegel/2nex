package:
  schema: 1
  name: itstool
  slug: itstool
  namespace: dev/tools
  version: 2.0.7
  description: XML to PO and PO to XML translator using ITS rules
  homepage: https://itstool.org/
  checksum: f3b916cb14696b0ccc6557ea4717f568e81c163654e372ca16ce643dad79056d

sources:
- name: itstool
  url: http://files.itstool.org/itstool/itstool-2.0.7.tar.bz2
  sha256: 6b9a7cd29a12bb95598f5750e8763cee78836a1a207f85b74d8b3275b27e87ca

dependencies:
- name: glibc
  commit: x86_64/pkg/libs/system/glibc/2.39/bundles/dev
- name: python3
  commit: x86_64/pkg/dev/lang/python3/3.12.2/bundles/dev
- name: bash
  commit: x86_64/pkg/cli/shells/bash/5.2.21/bundles/dev
- name: ncurses
  commit: x86_64/pkg/libs/system/ncurses/6.4-20230520/bundles/dev
- name: acl
  commit: x86_64/pkg/libs/system/acl/2.3.2/bundles/dev
- name: attr
  commit: x86_64/pkg/libs/system/attr/2.5.2/bundles/dev
- name: tar
  commit: x86_64/pkg/cli/archive/tar/1.35/bundles/dev
- name: bzip2
  commit: x86_64/pkg/libs/compression/bzip2/1.0.8/bundles/dev
- name: coreutils
  commit: x86_64/pkg/core/userland/coreutils/9.5/bundles/dev
- name: findutils
  commit: x86_64/pkg/core/userland/findutils/4.9.0/bundles/dev
- name: make
  commit: x86_64/pkg/core/toolchain/make/4.4.1/bundles/dev
- name: libxml2
  commit: x86_64/pkg/libs/system/libxml2/2.13.5/bundles/dev
- name: gmp
  commit: x86_64/pkg/libs/system/gmp/6.3.0/bundles/dev
- name: libcap
  commit: x86_64/pkg/libs/security/libcap/2.69/bundles/dev
- name: sed
  commit: x86_64/pkg/cli/text/sed/4.9/bundles/dev
- name: gawk
  commit: x86_64/pkg/cli/text/gawk/5.3.0/bundles/dev
- name: python3-libxml2
  commit: x86_64/pkg/dev/python/python3-libxml2/2.13.5/bundles/dev

build:
  environment: 27b6e5dc7ad152c9a17c2cabfcc5ee93daa9bbf0
  profile: [2143:6228]

  script: |
    tar --no-same-owner -xf /${SOURCE_itstool} -C "${WORK_DIR}" --strip-components=1
    cd ${WORK_DIR}

    ./configure --prefix=/usr
    make
    make DESTDIR="${OUT_DIR}" install

    find "${OUT_DIR}" -exec touch -d "2024-01-01T00:00:00+00:00" {} \;

bundles:
  dev:
  - bin
  - misc

outputs:
  bin:
    files:
    - path: /usr/bin/itstool

  man:
    files:
    - path: /usr/share/man/man1/itstool.1

  misc:
    files:
    - path: /usr/share/itstool/its/docbook.its
    - path: /usr/share/itstool/its/docbook5.its
    - path: /usr/share/itstool/its/its.its
    - path: /usr/share/itstool/its/mallard.its
    - path: /usr/share/itstool/its/ttml.its
    - path: /usr/share/itstool/its/xhtml.its
