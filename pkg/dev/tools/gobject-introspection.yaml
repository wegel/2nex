build:
  environment: 27b6e5dc7ad152c9a17c2cabfcc5ee93daa9bbf0
  profile: [4148:1123, 8267:1282, 12412:1467, 16625:7104, 20735:7104, 24946:7111, 29053:7111, 33150:7113, 35486:7232]

  script: |
    set -eux
    tar --no-same-owner -xf /${SOURCE_gobject_introspection} -C "${WORK_DIR}" --strip-components=1
    cd "${WORK_DIR}"

    meson setup build \
      --prefix=/usr \
      --libdir=lib \
      --buildtype=release \
      -Ddoctool=disabled \
      -Dgtk_doc=false \
      -Dtests=false \
      -Dcairo=enabled

    ninja -C build
    ninja -C build \
      gir/GLib-2.0.typelib \
      gir/GObject-2.0.typelib \
      gir/GModule-2.0.typelib \
      gir/Gio-2.0.typelib
    DESTDIR="${OUT_DIR}" ninja -C build install

    /usr/bin/python3 - "${OUT_DIR}/usr/bin/g-ir-scanner" "${OUT_DIR}/usr/bin/g-ir-annotation-tool" <<'PY'
    import sys
    from pathlib import Path

    for filename in sys.argv[1:]:
        script = Path(filename)
        lines = script.read_text().splitlines()
        lines[0] = "#!/usr/bin/python3"
        script.write_text("\n".join(lines) + "\n")
    PY

    for namespace in GLib-2.0 GObject-2.0 GModule-2.0 Gio-2.0; do
      install -Dm644 "build/gir/${namespace}.gir" "${OUT_DIR}/usr/share/gir-1.0/${namespace}.gir"
      install -Dm644 "build/gir/${namespace}.typelib" "${OUT_DIR}/usr/lib/girepository-1.0/${namespace}.typelib"
    done

    find "${OUT_DIR}" -type f -executable -exec strip --strip-unneeded {} \; 2>/dev/null || true
    find "${OUT_DIR}" -name '*.a' -exec objcopy --enable-deterministic-archives {} \; 2>/dev/null || true
    find "${OUT_DIR}" -exec touch -d "2024-01-01T00:00:00+00:00" {} \;

