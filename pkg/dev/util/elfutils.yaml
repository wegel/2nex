build:
  environment: 27b6e5dc7ad152c9a17c2cabfcc5ee93daa9bbf0
  profile: [4101:1821, 8303:3291, 12403:3480, 16509:4705, 24738:5345, 28862:5721, 32983:6132, 41206:8197, 49464:10148, 54237:10395]

  script: |
    set -eu

    tar --no-same-owner -xf ${SOURCE0} -C "${WORK_DIR}" --strip-components=1
    cd "${WORK_DIR}"

    ./configure --prefix=/usr                \
                --sysconfdir=/etc            \
                --disable-debuginfod         \
                --enable-libdebuginfod=dummy \
                --libdir=/usr/lib

    make
    make DESTDIR="${OUT_DIR}" install

    # Upstream couples the profile hook install directory to sysconfdir. Keep
    # the hook immutable while retaining its administrator-owned /etc lookup.
    mkdir -p "${OUT_DIR}/usr/lib/profile.d"
    mv "${OUT_DIR}/etc/profile.d/debuginfod.csh" \
       "${OUT_DIR}/usr/lib/profile.d/debuginfod.csh"
    mv "${OUT_DIR}/etc/profile.d/debuginfod.sh" \
       "${OUT_DIR}/usr/lib/profile.d/debuginfod.sh"
    rmdir "${OUT_DIR}/etc/profile.d" \
          "${OUT_DIR}/etc/debuginfod" \
          "${OUT_DIR}/etc"

    test -s "${OUT_DIR}/usr/lib/profile.d/debuginfod.csh"
    bash -n "${OUT_DIR}/usr/lib/profile.d/debuginfod.sh"
    bash --noprofile --norc -c '
      DEBUGINFOD_URLS=https://debuginfod.example.invalid/
      export DEBUGINFOD_URLS
      source "$1"
      test "${DEBUGINFOD_URLS}" = https://debuginfod.example.invalid/
    ' elfutils-test "${OUT_DIR}/usr/lib/profile.d/debuginfod.sh"

    find ${OUT_DIR} -type f -executable -exec strip --strip-unneeded {} \; 2>/dev/null || true
    find ${OUT_DIR} -name '*.a' -exec objcopy --enable-deterministic-archives {} \; 2>/dev/null || true
    find "${OUT_DIR}" -exec touch -d "2024-01-01T00:00:00+00:00" {} \;

