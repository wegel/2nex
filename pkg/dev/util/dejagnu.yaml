  commit: x86_64/pkg/bootstrap/phase1/make/4.4.1/bundles/dev
- name: sed
  commit: x86_64/pkg/bootstrap/phase1/sed/4.9/bundles/dev
- name: tar
  commit: x86_64/pkg/bootstrap/phase1/tar/1.35/bundles/dev
- name: zlib
  commit: x86_64/pkg/bootstrap/phase3/zlib/1.3.1/bundles/dev
- name: binutils
  commit: x86_64/pkg/bootstrap/phase3/binutils/2.42/bundles/dev
- name: mpc
  commit: x86_64/pkg/bootstrap/phase3/mpc/1.2.1/bundles/dev
- name: gcc
  commit: x86_64/pkg/bootstrap/phase3/gcc/13.2.0/bundles/dev
- name: perl
  commit: x86_64/pkg/bootstrap/phase2/perl/5.38.2/bundles/dev
- name: coreutils
  commit: x86_64/pkg/bootstrap/phase1/coreutils/9.5/bundles/dev
- name: texinfo
  commit: x86_64/pkg/bootstrap/phase2/texinfo/7.1/bundles/dev
- name: glibc
  commit: x86_64/pkg/libs/system/glibc/2.39/bundles/dev

build:
  environment: 13ce31fd97c19f5756e4413babf279d543b5a71c
  profile: [4145:2121, 8343:2526, 12485:2603, 16581:2644, 16965:2649]

  script: |
    tar --no-same-owner -xf ${SOURCE_dejagnu} -C "${WORK_DIR}" --strip-components=1
    cd ${WORK_DIR}

    SHELL=/usr/bin/bash

    mkdir -v build
    cd       build
    ../configure --prefix=/usr
    makeinfo --html --no-split -o doc/dejagnu.html ../doc/dejagnu.texi
    makeinfo --plaintext       -o doc/dejagnu.txt  ../doc/dejagnu.texi
    make
    make check
    make DESTDIR="${OUT_DIR}" install
    install -v -dm755  "${OUT_DIR}"/usr/share/doc/dejagnu-1.6.3
    install -v -m644   doc/dejagnu.{html,txt} "${OUT_DIR}"/usr/share/doc/dejagnu-1.6.3

    find "${OUT_DIR}" -exec touch -d '2024-01-01T00:00:00+00:00' {} \;
    2nex_strip_binaries ${OUT_DIR}

bundles:
  dev:
  - bin
  - dev

  full:
  - bin
  - dev
  - doc
  - info
  - man

outputs:
  bin:
    files:
    - path: /usr/bin/dejagnu
    - path: /usr/bin/runtest

