    - /usr/share/man/man1/cryptdir.1
    - /usr/share/man/man1/decryptdir.1
    - /usr/share/man/man1/dislocate.1
    - /usr/share/man/man1/expect.1
    - /usr/share/man/man1/kibitz.1
    - /usr/share/man/man1/mkpasswd.1
    - /usr/share/man/man1/multixterm.1
    - /usr/share/man/man1/passmass.1
    - /usr/share/man/man1/tknewsbiff.1
    - /usr/share/man/man1/unbuffer.1
    - /usr/share/man/man1/xkibitz.1
    - /usr/share/man/man3/libexpect.3
  lib:
    files:
    - /usr/lib/expect5.45.4/libexpect5.45.4.so
    - /usr/lib/expect5.45.4/pkgIndex.tcl
    - /usr/lib/libexpect5.45.4.so
    requires:
    - x86_64/pkg/libs/system/glibc/2.39/outputs/lib
  bin:
    files:
    - /usr/bin/autoexpect
    - /usr/bin/autopasswd
    - /usr/bin/cryptdir
    - /usr/bin/decryptdir
    - /usr/bin/dislocate
    - /usr/bin/expect
    - /usr/bin/ftp-rfc
    - /usr/bin/kibitz
    - /usr/bin/lpunlock
    - /usr/bin/mkpasswd
    - /usr/bin/multixterm
    - /usr/bin/passmass
    - /usr/bin/rftp
    - /usr/bin/rlogin-cwd
    - /usr/bin/timed-read
    - /usr/bin/timed-run
    - /usr/bin/tknewsbiff
    - /usr/bin/tkpasswd
    - /usr/bin/unbuffer
    - /usr/bin/weather
    - /usr/bin/xkibitz
    - /usr/bin/xpstat
    requires:
    - x86_64/pkg/libs/system/glibc/2.39/outputs/lib
    - x86_64/pkg/dev/lang/tcl/8.6.14/outputs/lib
