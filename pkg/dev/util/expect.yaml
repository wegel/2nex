  commit: x86_64/pkg/dev/lang/tcl/8.6.14/bundles/dev

build:
  environment: 27b6e5dc7ad152c9a17c2cabfcc5ee93daa9bbf0
  profile: [4111:1529, 8234:3496, 13448:4408, 23668:4409, 28780:4409, 39012:4410, 44114:4411, 53335:4474, 65827:18405, 69969:18467]

  script: |
    tar --no-same-owner -xf ${SOURCE_expect} -C "${WORK_DIR}" --strip-components=1
    cd ${WORK_DIR}
    patch --batch --fuzz=0 -Np1 -i /./${SOURCE_patch}

    CFLAGS="${CFLAGS/ -Werror=format-security/}"

    python3 -c "from pty import spawn; spawn([\"echo\", \"ok\"])" | grep "ok" 
    ./configure --prefix=/usr           \
              --with-tcl=/usr/lib     \
              --enable-shared         \
              --mandir=/usr/share/man \
              --with-tclinclude=/usr/include

    make
    make test
    make DESTDIR="${OUT_DIR}" install
    ln -svf expect5.45.4/libexpect5.45.4.so "${OUT_DIR}/usr/lib"

    strip --strip-unneeded ${OUT_DIR}/usr/bin/expect || true
    strip --strip-unneeded ${OUT_DIR}/usr/lib/expect*/libexpect*.so || true
    strip --strip-unneeded ${OUT_DIR}/usr/lib/libexpect*.so || true

    find "${OUT_DIR}" -exec touch -d '2024-01-01T00:00:00+00:00' {} \;

bundles:
  dev:
  - bin
  - dev
  - lib

  full:
  - bin
  - dev
  - lib
  - man

