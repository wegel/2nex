      - /usr/lib/libtcl8.6.so
    - path: /usr/bin/ftp-rfc
    - path: /usr/bin/kibitz
    - path: /usr/bin/lpunlock
    - path: /usr/bin/mkpasswd
    - path: /usr/bin/multixterm
    - path: /usr/bin/passmass
    - path: /usr/bin/rftp
    - path: /usr/bin/rlogin-cwd
    - path: /usr/bin/timed-read
    - path: /usr/bin/timed-run
    - path: /usr/bin/tknewsbiff
    - path: /usr/bin/tkpasswd
    - path: /usr/bin/unbuffer
