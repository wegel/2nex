    - path: /usr/share/man/man1/decryptdir.1
    - path: /usr/share/man/man1/dislocate.1
    - path: /usr/share/man/man1/expect.1
    - path: /usr/share/man/man1/kibitz.1
    - path: /usr/share/man/man1/mkpasswd.1
    - path: /usr/share/man/man1/multixterm.1
    - path: /usr/share/man/man1/passmass.1
    - path: /usr/share/man/man1/tknewsbiff.1
