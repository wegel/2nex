- commit: x86_64/pkg/dev/lang/tcl/8.6.14/bundles/dev
  name: tcl
build:
  script: "tar --no-same-owner -xf ${SOURCE_expect} -C \"${WORK_DIR}\" --strip-components=1\n\
    cd ${WORK_DIR}\npatch -Np1 -i /./${SOURCE_patch}\n\nCFLAGS=\"${CFLAGS/ -Werror=format-security/}\"\
    \n\npython3 -c \"from pty import spawn; spawn([\\\"echo\\\", \\\"ok\\\"])\" |\
    \ grep \"ok\" \n./configure --prefix=/usr           \\\n          --with-tcl=/usr/lib\
    \     \\\n          --enable-shared         \\\n          --mandir=/usr/share/man\
    \ \\\n          --with-tclinclude=/usr/include\n\nmake\nmake test\nmake DESTDIR=\"\
    ${OUT_DIR}\" install\nln -svf expect5.45.4/libexpect5.45.4.so \"${OUT_DIR}/usr/lib\"\
    \n\nfind \"${OUT_DIR}\" -exec touch -d '2024-01-01T00:00:00+00:00' {} \\;\n2nex_strip_binaries\
    \ \"${OUT_DIR}\"\nfind \"${OUT_DIR}\" ! -type d -exec strip-nondeterminism -T\
    \ 1704067200 --normalizers +all {} \\;\n"
bundles:
  full:
  - dev
  - man
  - bin
  - lib
  dev:
  - dev
  - lib
  - bin
