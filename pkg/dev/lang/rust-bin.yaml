build:
  script: |
    # Extract the Rust archive
    mkdir -p "${WORK_DIR}/rust"
    tar --no-same-owner -xf ${SOURCE_rust_binary} -C "${WORK_DIR}/rust" --strip-components=1
    cd "${WORK_DIR}/rust"

    # Run the installer script with a prefix for the output dir
    ./install.sh --prefix=${OUT_DIR}/usr --without=rust-docs

    # Set consistent timestamps for reproducible builds
    find "${OUT_DIR}" -exec touch -d '2024-01-01T00:00:00+00:00' {} \;
    2nex_strip_binaries ${OUT_DIR}
bundles:
  full:
  - lib
  - static
  - misc
  - man
  - bin
  - conf
  - doc
  dev:
  - lib
  - static
  - misc
  - bin
  - conf
