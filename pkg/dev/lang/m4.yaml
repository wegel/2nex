package:
  schema: 1
  name: M4
  slug: m4
  namespace: dev/lang
  version: 1.4.19
  description: A macro processor
  homepage: https://www.gnu.org/software/m4/
  checksum: cd39975b44c6a7d9bc29e837e88bd5fc2270025e3ac10fce7fc1e4e3fae03db9
sources:
- name: m4
  url: https://ftp.gnu.org/gnu/m4/m4-1.4.19.tar.xz
  sha256: 63aede5c6d33b6d9b13511cd0be2cac046f2e70fd0a07aa9573a04a82783af96
dependencies:
- name: bash
  commit: x86_64/pkg/bootstrap/phase1/bash/5.2.21/bundles/dev
- name: coreutils
  commit: x86_64/pkg/bootstrap/phase1/coreutils/9.5/bundles/dev
- name: findutils
  commit: x86_64/pkg/bootstrap/phase1/findutils/4.9.0/bundles/dev
- name: gawk
  commit: x86_64/pkg/bootstrap/phase1/gawk/5.3.0/bundles/dev
- name: grep
  commit: x86_64/pkg/bootstrap/phase1/grep/3.11/bundles/dev
- name: make
  commit: x86_64/pkg/bootstrap/phase1/make/4.4.1/bundles/dev
- name: sed
  commit: x86_64/pkg/bootstrap/phase1/sed/4.9/bundles/dev
- name: tar
  commit: x86_64/pkg/bootstrap/phase1/tar/1.35/bundles/dev
- name: binutils
  commit: x86_64/pkg/bootstrap/phase3/binutils/2.42/bundles/dev
- name: gcc
  commit: x86_64/pkg/bootstrap/phase3/gcc/13.2.0/bundles/dev
- name: texinfo
  commit: x86_64/pkg/bootstrap/phase2/texinfo/7.1/bundles/dev
- name: glibc
  commit: x86_64/pkg/libs/system/glibc/2.39/bundles/dev
- name: phase3
  commit: x86_64/pkg/bootstrap/phase3/2nex-utilities-bootstrap/0.0.1/bundles/dev
- name: xz
  commit: x86_64/pkg/bootstrap/phase3/xz/5.4.6/bundles/dev
- name: mpc
  commit: x86_64/pkg/bootstrap/phase3/mpc/1.2.1/bundles/dev
build:
  script: 'tar --no-same-owner -xf ${SOURCE_m4} -C "${WORK_DIR}" --strip-components=1

    cd ${WORK_DIR}


    ./configure --prefix=/usr

    make

    make check || true # currently fails when building inside a container

    make DESTDIR="${OUT_DIR}" install


    find "${OUT_DIR}" -exec touch -d ''2024-01-01T00:00:00+00:00'' {} \;

    2nex_strip_binaries ${OUT_DIR}

    '
bundles:
  full:
  - info
  - locale
  - man
  - bin
  dev:
  - bin
outputs:
  info:
    files:
    - path: /usr/share/info/dir
    - path: /usr/share/info/m4.info
    - path: /usr/share/info/m4.info-1
    - path: /usr/share/info/m4.info-2
  locale:
    files:
    - path: /usr/share/locale/bg/LC_MESSAGES/m4.mo
    - path: /usr/share/locale/cs/LC_MESSAGES/m4.mo
    - path: /usr/share/locale/da/LC_MESSAGES/m4.mo
    - path: /usr/share/locale/de/LC_MESSAGES/m4.mo
    - path: /usr/share/locale/el/LC_MESSAGES/m4.mo
    - path: /usr/share/locale/eo/LC_MESSAGES/m4.mo
    - path: /usr/share/locale/es/LC_MESSAGES/m4.mo
    - path: /usr/share/locale/fi/LC_MESSAGES/m4.mo
    - path: /usr/share/locale/fr/LC_MESSAGES/m4.mo
    - path: /usr/share/locale/ga/LC_MESSAGES/m4.mo
    - path: /usr/share/locale/gl/LC_MESSAGES/m4.mo
    - path: /usr/share/locale/hr/LC_MESSAGES/m4.mo
    - path: /usr/share/locale/id/LC_MESSAGES/m4.mo
    - path: /usr/share/locale/ja/LC_MESSAGES/m4.mo
    - path: /usr/share/locale/ko/LC_MESSAGES/m4.mo
    - path: /usr/share/locale/nl/LC_MESSAGES/m4.mo
    - path: /usr/share/locale/pl/LC_MESSAGES/m4.mo
    - path: /usr/share/locale/pt_BR/LC_MESSAGES/m4.mo
    - path: /usr/share/locale/ro/LC_MESSAGES/m4.mo
    - path: /usr/share/locale/ru/LC_MESSAGES/m4.mo
    - path: /usr/share/locale/sr/LC_MESSAGES/m4.mo
    - path: /usr/share/locale/sv/LC_MESSAGES/m4.mo
    - path: /usr/share/locale/uk/LC_MESSAGES/m4.mo
    - path: /usr/share/locale/vi/LC_MESSAGES/m4.mo
    - path: /usr/share/locale/zh_CN/LC_MESSAGES/m4.mo
    - path: /usr/share/locale/zh_TW/LC_MESSAGES/m4.mo
  man:
    files:
    - path: /usr/share/man/man1/m4.1
  bin:
    files:
    - path: /usr/bin/m4
