  commit: x86_64/pkg/bootstrap/phase3/mpc/1.2.1/bundles/dev

build:
  environment: 13ce31fd97c19f5756e4413babf279d543b5a71c
  profile: [4101:2797, 12361:11579, 24741:20890, 41152:28543, 57591:28988, 69937:29340, 82281:29680, 102851:30360, 128590:30900, 136376:31208]

  script: |
    tar --no-same-owner -xf ${SOURCE_m4} -C "${WORK_DIR}" --strip-components=1
    cd ${WORK_DIR}

    ./configure --prefix=/usr
    make
    make check || true # currently fails when building inside a container
    make DESTDIR="${OUT_DIR}" install

    find "${OUT_DIR}" -exec touch -d '2024-01-01T00:00:00+00:00' {} \;
    2nex_strip_binaries ${OUT_DIR}

bundles:
  dev:
  - bin

  full:
  - bin
  - info
  - locale
  - man

outputs:
  bin:
    files:
    - path: /usr/bin/m4
      needs:
      - /usr/lib/ld-linux-x86-64.so.2
      - /usr/lib/libc.so.6

  info:
    files:
    - path: /usr/share/info/dir
    - path: /usr/share/info/m4.info
    - path: /usr/share/info/m4.info-1
    - path: /usr/share/info/m4.info-2

  locale:
    files:
    - path: /usr/share/locale/bg/LC_MESSAGES/m4.mo
