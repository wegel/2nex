      - /usr/lib/libc.so.6
      - /usr/lib/libgcc_s.so.1
      - /usr/lib/libm.so.6
    - path: /usr/lib/libluajit-5.1.so.2
      needs:
      - /usr/lib/ld-linux-x86-64.so.2
      - /usr/lib/libc.so.6
      - /usr/lib/libgcc_s.so.1
      - /usr/lib/libm.so.6
    - path: /usr/lib/libluajit-5.1.so.2.1.1741730670
      needs:
      - /usr/lib/ld-linux-x86-64.so.2
      - /usr/lib/libc.so.6
      - /usr/lib/libgcc_s.so.1
      - /usr/lib/libm.so.6

  man:
    files:
    - path: /usr/share/man/man1/luajit.1

  misc:
    files:
    - path: /usr/share/luajit-2.1/jit/bc.lua
    - path: /usr/share/luajit-2.1/jit/bcsave.lua
    - path: /usr/share/luajit-2.1/jit/dis_arm.lua
    - path: /usr/share/luajit-2.1/jit/dis_arm64be.lua
    - path: /usr/share/luajit-2.1/jit/dis_arm64.lua
    - path: /usr/share/luajit-2.1/jit/dis_mips.lua
    - path: /usr/share/luajit-2.1/jit/dis_mips64r6el.lua
    - path: /usr/share/luajit-2.1/jit/dis_mips64r6.lua
    - path: /usr/share/luajit-2.1/jit/dis_mips64el.lua
    - path: /usr/share/luajit-2.1/jit/dis_mips64.lua
    - path: /usr/share/luajit-2.1/jit/dis_mipsel.lua
    - path: /usr/share/luajit-2.1/jit/dis_ppc.lua
    - path: /usr/share/luajit-2.1/jit/dis_x64.lua
    - path: /usr/share/luajit-2.1/jit/dis_x86.lua
    - path: /usr/share/luajit-2.1/jit/dump.lua
    - path: /usr/share/luajit-2.1/jit/p.lua
    - path: /usr/share/luajit-2.1/jit/v.lua
    - path: /usr/share/luajit-2.1/jit/vmdef.lua
    - path: /usr/share/luajit-2.1/jit/zone.lua

  static:
