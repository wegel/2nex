package:
  schema: 1
  name: LuaJIT
  slug: luajit
  namespace: dev/lang
  version: 2.1-20241113
  description: Just-In-Time Compiler for Lua (deterministic build for reproducibility)
  homepage: https://luajit.org/
  checksum: 9ca0fcb694a0a1a0b0b3537649715d26e7ff4bf66c6078871946f88e48ad02f8

sources:
- name: luajit
  url: https://github.com/luajit/luajit/archive/538a82133ad6fddfd0ca64de167c4aca3bc1a2da.tar.gz
  sha256: 7acbc36be8f21072422eb9a5e5fc468d0eaa55bec1b70260d651e845684621e2

dependencies:
- name: glibc
  commit: x86_64/pkg/libs/system/glibc/2.39/bundles/dev
- name: gcc
  commit: x86_64/pkg/core/toolchain/gcc/13.2.0/bundles/dev
- name: bash
  commit: x86_64/pkg/cli/shells/bash/5.2.21/bundles/dev
- name: ncurses
  commit: x86_64/pkg/libs/system/ncurses/6.4-20230520/bundles/dev
- name: coreutils
  commit: x86_64/pkg/core/userland/coreutils/9.5/bundles/dev
- name: findutils
  commit: x86_64/pkg/core/userland/findutils/4.9.0/bundles/dev
- name: make
  commit: x86_64/pkg/core/toolchain/make/4.4.1/bundles/dev
- name: tar
  commit: x86_64/pkg/cli/archive/tar/1.35/bundles/dev
- name: grep
  commit: x86_64/pkg/cli/text/grep/3.11/bundles/dev
- name: sed
  commit: x86_64/pkg/cli/text/sed/4.9/bundles/dev
- name: acl
  commit: x86_64/pkg/libs/system/acl/2.3.2/bundles/dev
- name: attr
  commit: x86_64/pkg/libs/system/attr/2.5.2/bundles/dev
- name: gzip
  commit: x86_64/pkg/cli/archive/gzip/1.13/bundles/dev
- name: zlib
  commit: x86_64/pkg/libs/system/zlib/1.3.1/bundles/dev
- name: binutils
  commit: x86_64/pkg/core/toolchain/binutils/2.42/bundles/dev
- name: gmp
  commit: x86_64/pkg/libs/system/gmp/6.3.0/bundles/dev
- name: linux-headers
  commit: x86_64/pkg/libs/system/linux-headers/6.4.1/bundles/dev

build:
  environment: 27b6e5dc7ad152c9a17c2cabfcc5ee93daa9bbf0
  profile: [4104:4078, 8028:4138]

  script: |
    # luajit doesn't build correctly with LTO
    CFLAGS=${CFLAGS/-flto=auto/}
    CXXFLAGS=${CXXFLAGS/-flto=auto/}
    LDFLAGS=${LDFLAGS/-flto=auto/}

    tar --no-same-owner -xf ${SOURCE_luajit} -C "${WORK_DIR}" --strip-components=1
    cd ${WORK_DIR}

    # build with deterministic settings for reproducible builds
    # LUAJIT_SECURITY_STRID=0 disables random string ID generation
    # LUAJIT_SECURITY_PRN=0 disables secure PRNG seeding (makes bytecode deterministic)
    make PREFIX=/usr \
         XCFLAGS="-DLUAJIT_SECURITY_STRID=0 -DLUAJIT_SECURITY_PRN=0" \
         INSTALL_INC=/usr/include/luajit-2.1

    make PREFIX=/usr \
         INSTALL_INC=${OUT_DIR}/usr/include/luajit-2.1 \
         DESTDIR="${OUT_DIR}" install

    # create lua symlinks for compatibility
    #ln -sf luajit-2.1.0-beta3 ${OUT_DIR}/usr/bin/luajit
    #ln -sf luajit ${OUT_DIR}/usr/bin/lua

    # repack static archives with deterministic ar (D flag = deterministic mode)
    for a in ${OUT_DIR}/usr/lib/*.a; do
      if [ -f "$a" ]; then
        tmpdir=$(mktemp -d)
        cd "$tmpdir"
        ar x "$a"
        rm "$a"
        ar Drc "$a" *.o
        rm -rf "$tmpdir"
      fi
    done

    strip --strip-unneeded ${OUT_DIR}/usr/bin/luajit* || true
    strip --strip-unneeded ${OUT_DIR}/usr/lib/libluajit*.so* || true

    find "${OUT_DIR}" -exec touch -d '2024-01-01T00:00:00+00:00' {} \;

bundles:
  dev:
  - bin
  - dev
  - lib
  - misc

  full:
  - bin
  - dev
  - lib
  - misc

outputs:
  bin:
    files:
    - path: /usr/bin/luajit
      needs:
      - /usr/lib/ld-linux-x86-64.so.2
      - /usr/lib/libc.so.6
      - /usr/lib/libgcc_s.so.1
      - /usr/lib/libm.so.6
    - path: /usr/bin/luajit-2.1.1741730670
      needs:
      - /usr/lib/ld-linux-x86-64.so.2
      - /usr/lib/libc.so.6
      - /usr/lib/libgcc_s.so.1
      - /usr/lib/libm.so.6

  dev:
