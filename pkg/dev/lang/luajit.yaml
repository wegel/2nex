    - path: /usr/include/luajit-2.1/lauxlib.h
    - path: /usr/include/luajit-2.1/lua.h
    - path: /usr/include/luajit-2.1/lua.hpp
    - path: /usr/include/luajit-2.1/luaconf.h
    - path: /usr/include/luajit-2.1/luajit.h
    - path: /usr/include/luajit-2.1/lualib.h
    - path: /usr/lib/pkgconfig/luajit.pc

  lib:
