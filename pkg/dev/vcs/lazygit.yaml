package:
  schema: 1
  name: lazygit
  slug: lazygit
  namespace: dev/vcs
  version: 0.44.1
  description: Simple terminal UI for git commands
  homepage: https://github.com/jesseduffield/lazygit
  checksum: 46b76b92179191d55c76d5a056fb039a933c9b6861edc66e3100b0c5942cbb41

sources:
- name: lazygit
  url: https://github.com/jesseduffield/lazygit/archive/refs/tags/v0.44.1.tar.gz
  sha256: 02b67d38e07ae89b0ddd3b4917bd0cfcdfb5e158ed771566d3eb81f97f78cc26
- name: vendor
  sha256: 7887b848843f381418f774796c2f436570c9885d0aa05aade634aa8fa675e650
  go_sum: https://raw.githubusercontent.com/jesseduffield/lazygit/v0.44.1/go.sum

dependencies:
- name: bash
  commit: x86_64/pkg/cli/shells/bash/5.2.21/bundles/dev
- name: coreutils
  commit: x86_64/pkg/core/userland/coreutils/9.5/bundles/dev
- name: findutils
  commit: x86_64/pkg/core/userland/findutils/4.9.0/bundles/dev
- name: binutils
  commit: x86_64/pkg/core/toolchain/binutils/2.42/bundles/dev
- name: gzip
  commit: x86_64/pkg/cli/archive/gzip/1.13/bundles/dev
- name: tar
  commit: x86_64/pkg/cli/archive/tar/1.35/bundles/dev
- name: glibc
  commit: x86_64/pkg/libs/system/glibc/2.39/bundles/dev
- name: go
  commit: x86_64/pkg/dev/lang/go/1.23.8/bundles/dev
- name: ncurses
  commit: x86_64/pkg/libs/system/ncurses/6.4-20230520/bundles/dev
- name: acl
  commit: x86_64/pkg/libs/system/acl/2.3.2/bundles/dev
- name: attr
  commit: x86_64/pkg/libs/system/attr/2.5.2/bundles/dev

build:
  environment: 27b6e5dc7ad152c9a17c2cabfcc5ee93daa9bbf0
  profile: [32:64471]

  script: |
    tar --no-same-owner -xf ${SOURCE_lazygit} -C "${WORK_DIR}" --strip-components=1
    cd ${WORK_DIR}

    tar --no-same-owner -xf /./${SOURCE_vendor} -C "${WORK_DIR}"

    export GOROOT=/usr/lib/go
    export GOPATH=${WORK_DIR}/gopath
    export GOCACHE=${WORK_DIR}/gocache
    export CGO_ENABLED=0
    export GOTOOLCHAIN=local
    mkdir -p ${GOPATH} ${GOCACHE}

    go build -mod=vendor -ldflags="-s -w -X main.version=0.44.1" -o lazygit

    mkdir -p ${OUT_DIR}/usr/bin
    install -m 755 lazygit ${OUT_DIR}/usr/bin/lazygit

    strip --strip-all ${OUT_DIR}/usr/bin/lazygit

    find "${OUT_DIR}" -exec touch -d '2024-01-01T00:00:00+00:00' {} \;

bundles:
  dev:
  - bin

outputs:
  bin:
    files:
    - path: /usr/bin/lazygit
