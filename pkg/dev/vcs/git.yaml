build:
  environment: 27b6e5dc7ad152c9a17c2cabfcc5ee93daa9bbf0
  profile: [4101:7716, 8222:10455, 12318:66787, 16443:94761, 20540:127608, 24646:127807, 25277:132244]

  script: |
    tar --no-same-owner -xf ${SOURCE_git} -C "${WORK_DIR}" --strip-components=1
    cd ${WORK_DIR}

    # Build git directly without configure
    # pass flags explicitly since git's Makefile uses hard assignments
    make prefix=/usr \
      CC=gcc \
      AR="$AR" \
      CFLAGS="$CFLAGS" \
      LDFLAGS="$LDFLAGS" \
      NO_GETTEXT=1 \
      NO_TCLTK=1 \
      NO_OPENSSL=1 \
      NO_CURL=1 \
      NO_ICONV=1 \
      NO_EXPAT=1 \
      all

    make prefix=/usr \
      CC=gcc \
      AR="$AR" \
      CFLAGS="$CFLAGS" \
      LDFLAGS="$LDFLAGS" \
      NO_GETTEXT=1 \
      NO_TCLTK=1 \
      NO_OPENSSL=1 \
      NO_CURL=1 \
      NO_ICONV=1 \
      NO_EXPAT=1 \
      DESTDIR="${OUT_DIR}" \
      install

    strip --strip-unneeded ${OUT_DIR}/usr/bin/git || true
    strip --strip-unneeded ${OUT_DIR}/usr/bin/git-receive-pack || true
    strip --strip-unneeded ${OUT_DIR}/usr/bin/git-shell || true
    strip --strip-unneeded ${OUT_DIR}/usr/bin/git-upload-archive || true
    strip --strip-unneeded ${OUT_DIR}/usr/bin/git-upload-pack || true
    strip --strip-unneeded ${OUT_DIR}/usr/bin/scalar || true
    find ${OUT_DIR}/usr/libexec/git-core -type f -perm /u+x -exec strip --strip-unneeded {} \; 2>/dev/null || true

    find "${OUT_DIR}" -exec touch -d '2024-01-01T00:00:00+00:00' {} \;

bundles:
  dev:
  - bin
  - misc

  full:
  - bin
  - misc

