build:
  script: "tar --no-same-owner -xf ${SOURCE_git} -C \"${WORK_DIR}\" --strip-components=1\n\
    cd ${WORK_DIR}\n\n# Configure Git with required options\n./configure \\\n  --prefix=/usr\
    \ \\\n  --with-libpcre2 \\\n  --with-expat \\\n  --without-tcltk \\\n  --without-openssl\
    \ \\\n  --without-curl \\\n  --without-iconv\n\n# Build with NO_GETTEXT=1 to avoid\
    \ msgfmt dependency\nmake NO_GETTEXT=1 all\n\n# Install\nmake NO_GETTEXT=1 DESTDIR=\"\
    ${OUT_DIR}\" install\n\n# Set consistent timestamps for reproducible builds\n\
    find \"${OUT_DIR}\" -exec touch -d '2024-01-01T00:00:00+00:00' {} \\;\nfind \"\
    ${OUT_DIR}\" ! -type d -exec strip-nondeterminism -T 1704067200 --normalizers\
    \ +all {} \\; || true\n2nex_strip_binaries ${OUT_DIR}\n"
bundles:
  full:
  - bin
  - misc
  dev:
  - bin
  - misc
