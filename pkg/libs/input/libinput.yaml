build:
  environment: 13ce31fd97c19f5756e4413babf279d543b5a71c
  profile: [4100:771, 8243:1039, 12360:1220, 16468:5159, 20639:5281, 24776:5281, 28878:5349, 32974:5359, 37070:5370, 38862:5375]

  script: |
    tar --no-same-owner -xf ${SOURCE0} -C "${WORK_DIR}" --strip-components=1
    cd ${WORK_DIR}

    meson setup build \
      --prefix=/usr \
      --buildtype=release \
      -Dtests=false \
      -Ddocumentation=false \
      -Dlibwacom=false \
      -Ddebug-gui=false

    ninja -C build
    DESTDIR="${OUT_DIR}" ninja -C build install

    find "${OUT_DIR}" -exec touch -d "2024-01-01T00:00:00+00:00" {} \;
    2nex_strip_binaries ${OUT_DIR}

