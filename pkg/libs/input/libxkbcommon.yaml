build:
  environment: 27b6e5dc7ad152c9a17c2cabfcc5ee93daa9bbf0
  profile: [4132:42485, 8239:63043, 12373:72560, 16475:79961, 20574:81155, 24760:88256, 26126:89830]

  script: |
    set -eu

    tar --no-same-owner -xf ${SOURCE0} -C "${WORK_DIR}" --strip-components=1
    cd ${WORK_DIR}
    patch --batch --fuzz=0 -Np1 -i "/${SOURCE_uapi_config}"

    meson setup build \
      --prefix=/usr \
      --sysconfdir=/etc \
      --buildtype=release \
      -Denable-docs=false \
      -Denable-x11=false \
      -Denable-wayland=true \
      -Dxkb-config-root=/usr/share/X11/xkb

    ninja -C build
    DESTDIR="${OUT_DIR}" ninja -C build install

    # Exercise the newly built, installed xkbcli-compile-keymap through the
    # real default XKB include path search; see the check script for detail.
    sh "/${SOURCE_uapi_check}" \
      "${OUT_DIR}" \
      "${WORK_DIR}" \
      "/${SOURCE_uapi_keymap}"

    find ${OUT_DIR} -type f -executable -exec strip --strip-unneeded {} \; 2>/dev/null || true
    find ${OUT_DIR} -name '*.a' -exec objcopy --enable-deterministic-archives {} \; 2>/dev/null || true
    find "${OUT_DIR}" -exec touch -d "2024-01-01T00:00:00+00:00" {} \;

