build:
  profile: [4114:721, 12434:1088, 28964:1088, 45484:1138, 61993:1138, 74395:1254, 91044:1303, 111693:1474, 132415:1474, 146905:1985]

  script: |
    tar --no-same-owner -xf ${SOURCE0} -C "${WORK_DIR}" --strip-components=1
    cd ${WORK_DIR}

    meson setup build \
      --prefix=/usr \
      --buildtype=release \
      -Denable-docs=false \
      -Denable-x11=false \
      -Denable-wayland=true \
      -Dxkb-config-root=/usr/share/X11/xkb

    ninja -C build
    DESTDIR="${OUT_DIR}" ninja -C build install

    find "${OUT_DIR}" -exec touch -d "2024-01-01T00:00:00+00:00" {} \;
    2nex_strip_binaries ${OUT_DIR}

