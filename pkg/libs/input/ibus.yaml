build:
  environment: 27b6e5dc7ad152c9a17c2cabfcc5ee93daa9bbf0
  profile: [4104:1811, 8200:5308, 12326:10061, 16429:16241, 24637:18964, 28812:21131, 33207:21592, 41474:22389, 49675:23134, 52446:23394]

  script: |
    tar --no-same-owner -xf /${SOURCE0} -C "${WORK_DIR}" --strip-components=1
    cd ${WORK_DIR}

    ./configure \
      --prefix=/usr \
      --libdir=/usr/lib \
      --disable-static \
      --enable-gtk2=no \
      --disable-gtk-doc \
      --disable-gtk-doc-html \
      --disable-gtk-doc-pdf \
      --disable-dconf \
      --disable-emoji-dict \
      --disable-gtk4 \
      --disable-tests \
      --disable-xim \
      --enable-wayland \
      --disable-appindicator \
      --disable-ui \
      --enable-introspection=no \
      --enable-vala=no \
      --enable-python-library=no \
      --disable-install-tests

    make
    make DESTDIR="${OUT_DIR}" install

    find ${OUT_DIR} -type f -executable -exec strip --strip-unneeded {} \; 2>/dev/null || true
    find ${OUT_DIR} -name '*.a' -exec objcopy --enable-deterministic-archives {} \; 2>/dev/null || true
    find "${OUT_DIR}" -exec touch -d "2024-01-01T00:00:00+00:00" {} \;

