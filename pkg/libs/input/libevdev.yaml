package:
  schema: 1
  name: libevdev
  slug: libevdev
  namespace: libs/input
  version: 1.13.3
  description: Wrapper library for evdev devices
  homepage: https://www.freedesktop.org/wiki/Software/libevdev/
  checksum: d89f3b4a268f2b66bb1fb02cdb5275e17c43db6d9f9367eade9276c95e93460e

sources:
- name: libevdev
  url: https://www.freedesktop.org/software/libevdev/libevdev-1.13.3.tar.xz
  sha256: abf1aace86208eebdd5d3550ffded4c8d73bb405b796d51c389c9d0604cbcfbf

dependencies:
- name: glibc
  commit: x86_64/pkg/libs/system/glibc/2.39/bundles/dev
- name: gcc
  commit: x86_64/pkg/core/toolchain/gcc/13.2.0/bundles/dev
- name: binutils
  commit: x86_64/pkg/core/toolchain/binutils/2.42/bundles/dev
- name: meson
  commit: x86_64/pkg/core/toolchain/meson/1.6.1/bundles/dev
- name: ninja
  commit: x86_64/pkg/core/toolchain/ninja/1.12.1/bundles/dev
- name: python3
  commit: x86_64/pkg/dev/lang/python3/3.12.2/bundles/dev
- name: bash
  commit: x86_64/pkg/cli/shells/bash/5.2.21/bundles/dev
- name: ncurses
  commit: x86_64/pkg/libs/system/ncurses/6.4-20230520/bundles/dev
- name: acl
  commit: x86_64/pkg/libs/system/acl/2.3.2/bundles/dev
- name: attr
  commit: x86_64/pkg/libs/system/attr/2.5.2/bundles/dev
- name: tar
  commit: x86_64/pkg/cli/archive/tar/1.35/bundles/dev
- name: xz
  commit: x86_64/pkg/libs/compression/xz/5.4.6/bundles/dev
- name: zlib
  commit: x86_64/pkg/libs/system/zlib/1.3.1/bundles/dev
- name: coreutils
  commit: x86_64/pkg/core/userland/coreutils/9.5/bundles/dev
- name: findutils
  commit: x86_64/pkg/core/userland/findutils/4.9.0/bundles/dev
- name: linux-headers
  commit: x86_64/pkg/libs/system/linux-headers/6.4.1/bundles/dev

build:
  environment: 27b6e5dc7ad152c9a17c2cabfcc5ee93daa9bbf0
  profile: [2959:5082]

  script: |
    tar --no-same-owner -xf ${SOURCE0} -C "${WORK_DIR}" --strip-components=1
    cd ${WORK_DIR}

    meson setup build \
      --prefix=/usr \
      --buildtype=release \
      -Dtests=disabled \
      -Ddocumentation=disabled

    ninja -C build
    DESTDIR="${OUT_DIR}" ninja -C build install

    find ${OUT_DIR} -type f -executable -exec strip --strip-unneeded {} \; 2>/dev/null || true
    find ${OUT_DIR} -name '*.a' -exec objcopy --enable-deterministic-archives {} \; 2>/dev/null || true
    find "${OUT_DIR}" -exec touch -d "2024-01-01T00:00:00+00:00" {} \;

bundles:
  dev:
  - dev
  - lib

outputs:
  bin:
    files:
    - path: /usr/bin/libevdev-tweak-device
      needs:
      - /usr/lib/ld-linux-x86-64.so.2
      - /usr/lib/libc.so.6
      - /usr/lib/libevdev.so.2
    - path: /usr/bin/mouse-dpi-tool
      needs:
      - /usr/lib/ld-linux-x86-64.so.2
      - /usr/lib/libc.so.6
      - /usr/lib/libevdev.so.2
    - path: /usr/bin/touchpad-edge-detector
      needs:
      - /usr/lib/ld-linux-x86-64.so.2
      - /usr/lib/libc.so.6
      - /usr/lib/libevdev.so.2
      - /usr/lib/libm.so.6

  dev:
    files:
    - path: /usr/include/libevdev-1.0/libevdev/libevdev-uinput.h
    - path: /usr/include/libevdev-1.0/libevdev/libevdev.h
    - path: /usr/lib/pkgconfig/libevdev.pc

  lib:
    files:
    - path: /usr/lib/libevdev.so
      needs:
      - /usr/lib/libc.so.6
    - path: /usr/lib/libevdev.so.2
      needs:
      - /usr/lib/libc.so.6
    - path: /usr/lib/libevdev.so.2.3.0
      needs:
      - /usr/lib/libc.so.6

  man:
    files:
    - path: /usr/share/man/man1/libevdev-tweak-device.1
    - path: /usr/share/man/man1/mouse-dpi-tool.1
    - path: /usr/share/man/man1/touchpad-edge-detector.1
    - path: /usr/share/man/man3/libevdev.3

resolution:
  /usr/lib/ld-linux-x86-64.so.2: glibc
  /usr/lib/libc.so.6: glibc
  /usr/lib/libm.so.6: glibc
  /usr/lib/libevdev.so.2: self
