build:
  environment: 27b6e5dc7ad152c9a17c2cabfcc5ee93daa9bbf0
  profile: [3336:2470]

  script: |
    set -eu

    tar --no-same-owner -xf "${SOURCE_gtk_layer_shell}" -C "${WORK_DIR}" --strip-components=1
    cd "${WORK_DIR}"

    export PKG_CONFIG_PATH=/usr/lib/pkgconfig:/usr/share/pkgconfig

    meson setup build \
      --prefix=/usr \
      --buildtype=release \
      --pkg-config-path=/usr/lib/pkgconfig:/usr/share/pkgconfig \
      -Dexamples=false \
      -Ddocs=false \
      -Dtests=false \
      -Dintrospection=false \
      -Dvapi=false

    ninja -C build
    DESTDIR="${OUT_DIR}" ninja -C build install

    find "${OUT_DIR}" -type f -executable -exec strip --strip-unneeded {} \; 2>/dev/null || true
    find "${OUT_DIR}" -name '*.a' -exec objcopy --enable-deterministic-archives {} \; 2>/dev/null || true
    find "${OUT_DIR}" -exec touch -d "2024-01-01T00:00:00+00:00" {} \;

bundles:
  dev:
  - dev
  - lib

outputs:
  dev:
    files:
    - path: /usr/include/gtk-layer-shell/gtk-layer-shell.h
    - path: /usr/lib/pkgconfig/gtk-layer-shell-0.pc

  lib:
    files:
    - path: /usr/lib/libgtk-layer-shell.so
      needs:
      - /usr/lib/libc.so.6
      - /usr/lib/libgdk-3.so.0
      - /usr/lib/libglib-2.0.so.0
      - /usr/lib/libgobject-2.0.so.0
      - /usr/lib/libgtk-3.so.0
      - /usr/lib/libwayland-client.so.0
    - path: /usr/lib/libgtk-layer-shell.so.0
      needs:
      - /usr/lib/libc.so.6
      - /usr/lib/libgdk-3.so.0
      - /usr/lib/libglib-2.0.so.0
      - /usr/lib/libgobject-2.0.so.0
      - /usr/lib/libgtk-3.so.0
      - /usr/lib/libwayland-client.so.0
    - path: /usr/lib/libgtk-layer-shell.so.0.10.1
      needs:
      - /usr/lib/libc.so.6
      - /usr/lib/libgdk-3.so.0
      - /usr/lib/libglib-2.0.so.0
      - /usr/lib/libgobject-2.0.so.0
      - /usr/lib/libgtk-3.so.0
      - /usr/lib/libwayland-client.so.0

