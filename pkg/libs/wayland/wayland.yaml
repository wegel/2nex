package:
  schema: 1
  name: Wayland
  slug: wayland
  namespace: libs/wayland
  version: 1.24.0
  description: Wayland display protocol libraries
  homepage: https://wayland.freedesktop.org/
  checksum: da4a968a33104c9b1f991775c8aaca3c0b69fc1e17cd836df0f402659492ec35

sources:
- name: wayland
  url: https://gitlab.freedesktop.org/wayland/wayland/-/releases/1.24.0/downloads/wayland-1.24.0.tar.xz
  sha256: 82892487a01ad67b334eca83b54317a7c86a03a89cfadacfef5211f11a5d0536

dependencies:
- name: glibc
  commit: x86_64/pkg/libs/system/glibc/2.39/bundles/dev
- name: gcc
  commit: x86_64/pkg/core/toolchain/gcc/13.2.0/bundles/dev
- name: binutils
  commit: x86_64/pkg/core/toolchain/binutils/2.42/bundles/dev
- name: linux-headers
  commit: x86_64/pkg/libs/system/linux-headers/6.4.1/bundles/dev
- name: python3
  commit: x86_64/pkg/dev/lang/python3/3.12.2/bundles/dev
- name: meson
  commit: x86_64/pkg/core/toolchain/meson/1.6.1/bundles/dev
- name: ninja
  commit: x86_64/pkg/core/toolchain/ninja/1.12.1/bundles/dev
- name: pkgconf
  commit: x86_64/pkg/core/toolchain/pkgconf/2.2.0/bundles/dev
- name: libffi
  commit: x86_64/pkg/libs/system/libffi/3.4.6/bundles/dev
- name: expat
  commit: x86_64/pkg/libs/system/expat/2.6.2/bundles/dev
- name: libxml2
  commit: x86_64/pkg/libs/system/libxml2/2.13.5/bundles/dev
- name: ncurses
  commit: x86_64/pkg/libs/system/ncurses/6.4-20230520/bundles/dev
- name: bash
  commit: x86_64/pkg/cli/shells/bash/5.2.21/bundles/dev
- name: acl
  commit: x86_64/pkg/libs/system/acl/2.3.2/bundles/dev
- name: attr
  commit: x86_64/pkg/libs/system/attr/2.5.2/bundles/dev
- name: tar
  commit: x86_64/pkg/cli/archive/tar/1.35/bundles/dev
- name: xz
  commit: x86_64/pkg/libs/compression/xz/5.4.6/bundles/dev
- name: zlib
  commit: x86_64/pkg/libs/system/zlib/1.3.1/bundles/dev
- name: coreutils
  commit: x86_64/pkg/core/userland/coreutils/9.5/bundles/dev
- name: findutils
  commit: x86_64/pkg/core/userland/findutils/4.9.0/bundles/dev

build:
  environment: 27b6e5dc7ad152c9a17c2cabfcc5ee93daa9bbf0
  profile: [4123:2880, 6948:3034]

  script: |
    tar --no-same-owner -xf ${SOURCE_wayland} -C "${WORK_DIR}" --strip-components=1
    cd ${WORK_DIR}

    meson setup build \
      --prefix=/usr \
      --buildtype=release \
      -Ddocumentation=false \
      -Dtests=false

    ninja -C build
    DESTDIR="${OUT_DIR}" ninja -C build install

    find ${OUT_DIR} -type f -executable -exec strip --strip-unneeded {} \; 2>/dev/null || true
    find ${OUT_DIR} -name '*.a' -exec objcopy --enable-deterministic-archives {} \; 2>/dev/null || true
    find "${OUT_DIR}" -exec touch -d "2024-01-01T00:00:00+00:00" {} \;

bundles:
  dev:
  - bin
  - dev
  - lib
  - misc

outputs:
  bin:
    files:
    - path: /usr/bin/wayland-scanner
      needs:
      - /usr/lib/ld-linux-x86-64.so.2
      - /usr/lib/libc.so.6
      - /usr/lib/libexpat.so.1
      - /usr/lib/libxml2.so.2

  dev:
    files:
    - path: /usr/include/wayland-client-core.h
    - path: /usr/include/wayland-client-protocol.h
    - path: /usr/include/wayland-client.h
    - path: /usr/include/wayland-cursor.h
    - path: /usr/include/wayland-egl-backend.h
    - path: /usr/include/wayland-egl-core.h
    - path: /usr/include/wayland-egl.h
    - path: /usr/include/wayland-server-core.h
    - path: /usr/include/wayland-server-protocol.h
    - path: /usr/include/wayland-server.h
    - path: /usr/include/wayland-util.h
    - path: /usr/include/wayland-version.h
    - path: /usr/lib/pkgconfig/wayland-client.pc
    - path: /usr/lib/pkgconfig/wayland-cursor.pc
    - path: /usr/lib/pkgconfig/wayland-egl-backend.pc
    - path: /usr/lib/pkgconfig/wayland-egl.pc
    - path: /usr/lib/pkgconfig/wayland-scanner.pc
    - path: /usr/lib/pkgconfig/wayland-server.pc

  lib:
    files:
    - path: /usr/lib/libwayland-client.so
      needs:
      - /usr/lib/libc.so.6
      - /usr/lib/libffi.so.8
    - path: /usr/lib/libwayland-client.so.0
      needs:
      - /usr/lib/libc.so.6
      - /usr/lib/libffi.so.8
    - path: /usr/lib/libwayland-client.so.0.24.0
      needs:
      - /usr/lib/libc.so.6
      - /usr/lib/libffi.so.8
    - path: /usr/lib/libwayland-cursor.so
      needs:
      - /usr/lib/libc.so.6
      - /usr/lib/libwayland-client.so.0
    - path: /usr/lib/libwayland-cursor.so.0
      needs:
      - /usr/lib/libc.so.6
      - /usr/lib/libwayland-client.so.0
    - path: /usr/lib/libwayland-cursor.so.0.24.0
      needs:
      - /usr/lib/libc.so.6
      - /usr/lib/libwayland-client.so.0
    - path: /usr/lib/libwayland-egl.so
      needs:
      - /usr/lib/libc.so.6
    - path: /usr/lib/libwayland-egl.so.1
      needs:
      - /usr/lib/libc.so.6
    - path: /usr/lib/libwayland-egl.so.1.24.0
      needs:
      - /usr/lib/libc.so.6
    - path: /usr/lib/libwayland-server.so
      needs:
      - /usr/lib/libc.so.6
      - /usr/lib/libffi.so.8
    - path: /usr/lib/libwayland-server.so.0
      needs:
      - /usr/lib/libc.so.6
      - /usr/lib/libffi.so.8
    - path: /usr/lib/libwayland-server.so.0.24.0
      needs:
      - /usr/lib/libc.so.6
      - /usr/lib/libffi.so.8

  misc:
    files:
    - path: /usr/share/aclocal/wayland-scanner.m4
    - path: /usr/share/wayland/wayland-scanner.mk
    - path: /usr/share/wayland/wayland.dtd
    - path: /usr/share/wayland/wayland.xml

resolution:
  /usr/lib/libexpat.so.1: expat
  /usr/lib/ld-linux-x86-64.so.2: glibc
  /usr/lib/libc.so.6: glibc
  /usr/lib/libffi.so.8: libffi
  /usr/lib/libxml2.so.2: libxml2
  /usr/lib/libwayland-client.so.0: self
