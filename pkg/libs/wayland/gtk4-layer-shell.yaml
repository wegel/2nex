build:
  environment: 13ce31fd97c19f5756e4413babf279d543b5a71c
  profile: [2974:1052]

  script: |
    tar --no-same-owner -xf ${SOURCE_gtk4_layer_shell} -C "${WORK_DIR}" --strip-components=1
    cd ${WORK_DIR}

    export PKG_CONFIG_PATH=/usr/lib/pkgconfig:/usr/share/pkgconfig

    meson setup build \
      --prefix=/usr \
      --buildtype=release \
      --pkg-config-path=/usr/lib/pkgconfig:/usr/share/pkgconfig \
      -Dexamples=false \
      -Ddocs=false \
      -Dtests=false \
      -Dintrospection=false \
      -Dvapi=false

    ninja -C build
    DESTDIR=${OUT_DIR} ninja -C build install

    find "${OUT_DIR}" -exec touch -d '2024-01-01T00:00:00+00:00' {} \;
    2nex_strip_binaries ${OUT_DIR}

bundles:
  dev:
  - dev
  - lib

outputs:
  dev:
    files:
    - path: /usr/include/gtk4-layer-shell/gtk4-layer-shell.h
    - path: /usr/lib/pkgconfig/gtk4-layer-shell-0.pc

  lib:
    files:
    - path: /usr/lib/libgtk4-layer-shell.so
      needs:
      - /usr/lib/libc.so.6
      - /usr/lib/libglib-2.0.so.0
      - /usr/lib/libgobject-2.0.so.0
      - /usr/lib/libgtk-4.so.1
      - /usr/lib/libwayland-client.so.0
    - path: /usr/lib/libgtk4-layer-shell.so.0
      needs:
      - /usr/lib/libc.so.6
      - /usr/lib/libglib-2.0.so.0
      - /usr/lib/libgobject-2.0.so.0
      - /usr/lib/libgtk-4.so.1
      - /usr/lib/libwayland-client.so.0
    - path: /usr/lib/libgtk4-layer-shell.so.1.0.3
      needs:
      - /usr/lib/libc.so.6
      - /usr/lib/libglib-2.0.so.0
      - /usr/lib/libgobject-2.0.so.0
      - /usr/lib/libgtk-4.so.1
      - /usr/lib/libwayland-client.so.0

resolution:
  /usr/lib/libglib-2.0.so.0: glib2
  /usr/lib/libgobject-2.0.so.0: glib2
  /usr/lib/libc.so.6: glibc
