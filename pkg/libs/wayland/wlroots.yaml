build:
  script: |
    tar --no-same-owner -xzf /${SOURCE0} -C "${WORK_DIR}" --strip-components=1
    cd ${WORK_DIR}

    meson setup build \
      --prefix=/usr \
      --buildtype=release \
      -Dexamples=false \
      -Dbackends=drm,libinput \
      -Drenderers=gles2 \
      -Dxwayland=enabled \
      -Dsession=enabled

    ninja -C build
    DESTDIR="${OUT_DIR}" ninja -C build install

    find "${OUT_DIR}" -exec touch -d "2024-01-01T00:00:00+00:00" {} \;
    2nex_strip_binaries ${OUT_DIR}

bundles:
  dev:
  - dev
  - lib

