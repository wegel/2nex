  slug: wayland-protocols
  namespace: libs/wayland
  version: "1.41"
  description: Wayland protocol extensions
  homepage: https://wayland.freedesktop.org/
  checksum: 053ac948b6a35989346afc7989bfdeee38b48a0721615c765b3539088b30c037

sources:
- name: wayland-protocols
  url: https://gitlab.freedesktop.org/wayland/wayland-protocols/-/releases/1.41/downloads/wayland-protocols-1.41.tar.xz
