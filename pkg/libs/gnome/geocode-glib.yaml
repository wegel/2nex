build:
  environment: 27b6e5dc7ad152c9a17c2cabfcc5ee93daa9bbf0
  profile: [4109:1499, 6753:1533]

  script: |
    set -eu
    tar --no-same-owner -xf /${SOURCE_geocode_glib} -C "${WORK_DIR}" --strip-components=1
    cd "${WORK_DIR}"

    meson setup build \
      --prefix=/usr \
      --libdir=lib \
      --buildtype=release \
      -Dsoup2=false \
      -Denable-introspection=false \
      -Denable-gtk-doc=false \
      -Denable-installed-tests=false

    ninja -C build
    DESTDIR="${OUT_DIR}" ninja -C build install

    find "${OUT_DIR}" -type f -executable -exec strip --strip-unneeded {} \; 2>/dev/null || true
    find "${OUT_DIR}" -name '*.a' -exec objcopy --enable-deterministic-archives {} \; 2>/dev/null || true
    find "${OUT_DIR}" -exec touch -d "2024-01-01T00:00:00+00:00" {} \;

bundles:
  dev:
  - dev
  - lib

  full:
  - lib
  - misc

