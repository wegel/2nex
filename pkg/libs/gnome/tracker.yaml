build:
  environment: 27b6e5dc7ad152c9a17c2cabfcc5ee93daa9bbf0
  profile: [4096:11700, 8221:16895, 12408:18654, 16519:20905, 20708:22415, 24835:34833, 28945:35270, 31837:35406]

  script: |
    tar --no-same-owner -xf /${SOURCE_tracker} -C "${WORK_DIR}" --strip-components=1
    cd ${WORK_DIR}

    meson setup build \
      --prefix=/usr \
      --libdir=lib \
      --buildtype=release \
      -Ddocs=false \
      -Dman=false \
      -Dsystemd_user_services=false \
      -Dstemmer=disabled \
      -Dunicode_support=icu \
      -Dbash_completion=false \
      -Dtests=false \
      -Dtests_tap_protocol=false \
      -Dintrospection=disabled \
      -Dvapi=disabled \
      -Dtest_utils=false

    ninja -C build
    DESTDIR="${OUT_DIR}" ninja -C build install

    find "${OUT_DIR}" -exec touch -d "2024-01-01T00:00:00+00:00" {} \;
    find ${OUT_DIR} -type f -executable -exec strip --strip-unneeded {} \; 2>/dev/null || true
    find ${OUT_DIR} -name '*.a' -exec objcopy --enable-deterministic-archives {} \; 2>/dev/null || true

