build:
  environment: 27b6e5dc7ad152c9a17c2cabfcc5ee93daa9bbf0
  profile: [4136:779, 12395:893, 20660:1119, 33124:1245, 45494:1421, 57876:1666, 66221:1789, 82807:1790, 99311:6404, 109638:6577]

  script: |
    tar --no-same-owner -xf /${SOURCE_gcr} -C "${WORK_DIR}" --strip-components=1
    cd ${WORK_DIR}

    meson setup build \
      --prefix=/usr \
      --libdir=lib \
      --buildtype=release \
      -Dgtk=false \
      -Dintrospection=false \
      -Dgtk_doc=false \
      -Dssh_agent=false \
      -Dsystemd=disabled \
      -Dgpg_path=/usr/bin/false

    ninja -C build
    DESTDIR="${OUT_DIR}" ninja -C build install

    rm -f \
      "${OUT_DIR}/usr/share/dbus-1/services/org.gnome.keyring.PrivatePrompter.service" \
      "${OUT_DIR}/usr/share/dbus-1/services/org.gnome.keyring.SystemPrompter.service"
    rmdir --ignore-fail-on-non-empty "${OUT_DIR}/usr/share/dbus-1/services" 2>/dev/null || true
    rmdir --ignore-fail-on-non-empty "${OUT_DIR}/usr/share/dbus-1" 2>/dev/null || true

    glib-compile-schemas "${OUT_DIR}/usr/share/glib-2.0/schemas"

    find ${OUT_DIR} -type f -executable -exec strip --strip-unneeded {} \; 2>/dev/null || true
    find ${OUT_DIR} -name '*.a' -exec objcopy --enable-deterministic-archives {} \; 2>/dev/null || true
    find "${OUT_DIR}" -exec touch -d "2024-01-01T00:00:00+00:00" {} \;

