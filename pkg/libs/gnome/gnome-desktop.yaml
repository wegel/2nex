build:
  environment: 27b6e5dc7ad152c9a17c2cabfcc5ee93daa9bbf0
  profile: [4108:774, 8209:784, 12314:792, 16466:2293, 20607:2293, 24710:2302, 28908:2302, 33004:2502, 37100:2546, 38956:2568]

  script: |
    tar --no-same-owner -xf /${SOURCE_gnome_desktop} -C "${WORK_DIR}" --strip-components=1
    cd ${WORK_DIR}

    # fix bug: empty string used as source file when introspection=false
    sed -i "s/_gir = ''/_gir = []/" libgnome-desktop/meson.build
    sed -i "s/_gir = ''/_gir = []/" libgnome-desktop/gnome-bg/meson.build
    sed -i "s/_gir = ''/_gir = []/" libgnome-desktop/gnome-rr/meson.build

    meson setup build \
      --prefix=/usr \
      --libdir=lib \
      --buildtype=release \
      -Dgtk_doc=false \
      -Dintrospection=false \
      -Ddesktop_docs=false \
      -Ddebug_tools=false \
      -Dudev=disabled \
      -Dsystemd=disabled \
      -Dinstalled_tests=false \
      -Dlegacy_library=false \
      -Dbuild_gtk4=true

    ninja -C build
    DESTDIR="${OUT_DIR}" ninja -C build install

    find ${OUT_DIR} -type f -executable -exec strip --strip-unneeded {} \; 2>/dev/null || true
    find ${OUT_DIR} -name '*.a' -exec objcopy --enable-deterministic-archives {} \; 2>/dev/null || true
    find "${OUT_DIR}" -exec touch -d "2024-01-01T00:00:00+00:00" {} \;

