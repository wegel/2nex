build:
  environment: 13ce31fd97c19f5756e4413babf279d543b5a71c
  profile: [4114:1400, 4786:1435]

  script: |
    tar --no-same-owner -xf /${SOURCE_gnome_autoar} -C "${WORK_DIR}" --strip-components=1
    cd ${WORK_DIR}

    meson setup build \
      --prefix=/usr \
      --libdir=lib \
      --buildtype=release \
      -Dgtk=false \
      -Dvapi=false \
      -Dintrospection=disabled \
      -Dtests=false \
      -Dgtk_doc=false

    ninja -C build
    DESTDIR="${OUT_DIR}" ninja -C build install

    find "${OUT_DIR}" -exec touch -d "2024-01-01T00:00:00+00:00" {} \;
    2nex_strip_binaries ${OUT_DIR}

