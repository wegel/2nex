    - path: /usr/include/va/va_dec_hevc.h
    - path: /usr/include/va/va_dec_jpeg.h
    - path: /usr/include/va/va_dec_vp8.h
    - path: /usr/include/va/va_dec_vp9.h
    - path: /usr/include/va/va_drm.h
    - path: /usr/include/va/va_drmcommon.h
    - path: /usr/include/va/va_egl.h
    - path: /usr/include/va/va_enc_av1.h
    - path: /usr/include/va/va_enc_h264.h
    - path: /usr/include/va/va_enc_hevc.h
    - path: /usr/include/va/va_enc_jpeg.h
    - path: /usr/include/va/va_enc_mpeg2.h
    - path: /usr/include/va/va_enc_vp8.h
    - path: /usr/include/va/va_enc_vp9.h
    - path: /usr/include/va/va_fei.h
    - path: /usr/include/va/va_fei_h264.h
    - path: /usr/include/va/va_fei_hevc.h
    - path: /usr/include/va/va_prot.h
    - path: /usr/include/va/va_str.h
    - path: /usr/include/va/va_tpi.h
    - path: /usr/include/va/va_version.h
    - path: /usr/include/va/va_vpp.h
    - path: /usr/include/va/va_wayland.h
    - path: /usr/lib/pkgconfig/libva-drm.pc
    - path: /usr/lib/pkgconfig/libva-wayland.pc
    - path: /usr/lib/pkgconfig/libva.pc

  lib:
    files:
    - path: /usr/lib/libva-drm.so
      needs:
      - /usr/lib/libc.so.6
      - /usr/lib/libdrm.so.2
      - /usr/lib/libva.so.2
    - path: /usr/lib/libva-drm.so.2
      needs:
      - /usr/lib/libc.so.6
      - /usr/lib/libdrm.so.2
      - /usr/lib/libva.so.2
    - path: /usr/lib/libva-drm.so.2.2000.0
      needs:
      - /usr/lib/libc.so.6
      - /usr/lib/libdrm.so.2
      - /usr/lib/libva.so.2
    - path: /usr/lib/libva-wayland.so
      needs:
      - /usr/lib/libc.so.6
      - /usr/lib/libdrm.so.2
      - /usr/lib/libva.so.2
      - /usr/lib/libwayland-client.so.0
    - path: /usr/lib/libva-wayland.so.2
      needs:
      - /usr/lib/libc.so.6
      - /usr/lib/libdrm.so.2
      - /usr/lib/libva.so.2
      - /usr/lib/libwayland-client.so.0
    - path: /usr/lib/libva-wayland.so.2.2000.0
      needs:
      - /usr/lib/libc.so.6
      - /usr/lib/libdrm.so.2
      - /usr/lib/libva.so.2
      - /usr/lib/libwayland-client.so.0
    - path: /usr/lib/libva.so
      needs:
      - /usr/lib/libc.so.6
    - path: /usr/lib/libva.so.2
      needs:
      - /usr/lib/libc.so.6
    - path: /usr/lib/libva.so.2.2000.0
      needs:
      - /usr/lib/libc.so.6

resolution:
  /usr/lib/libc.so.6: glibc
  /usr/lib/libdrm.so.2: libdrm
  /usr/lib/libva.so.2: self
  /usr/lib/libwayland-client.so.0: wayland
