build:
  environment: 27b6e5dc7ad152c9a17c2cabfcc5ee93daa9bbf0
  profile: [4124:3817, 20575:8052, 37132:12592, 62073:18557, 82766:23317, 103394:27750, 124094:31418, 157192:33889, 186071:35809, 206037:36645]

  script: |
    tar --no-same-owner -xf /${SOURCE0} -C "${WORK_DIR}" --strip-components=1
    cd ${WORK_DIR}

    # set TMPDIR for LTO linker temp files (workaround for namespace /tmp issues)
    export TMPDIR=/nex/work/tmp
    mkdir -p "$TMPDIR"

    # disable LTO for this build (88 LTRANS jobs overwhelm the limited namespace environment)
    export CFLAGS="$(echo $CFLAGS | sed 's/-flto=auto//g')"
    export CXXFLAGS="$(echo $CXXFLAGS | sed 's/-flto=auto//g')"
    export LDFLAGS="$(echo $LDFLAGS | sed 's/-flto=auto//g')"

    # update ld.so.cache to include all libraries added by dependencies
    /usr/sbin/ldconfig 2>/dev/null || true

    # generate shared-mime-info database for glib-compile-resources image format detection
    mkdir -p "${WORK_DIR}/mime-root/usr/share"
    cp -R --no-preserve=ownership /usr/share/mime "${WORK_DIR}/mime-root/usr/share/"
    /usr/bin/update-mime-database "${WORK_DIR}/mime-root/usr/share/mime"
    export XDG_DATA_DIRS="${WORK_DIR}/mime-root/usr/share:/usr/share"

    meson setup build \
      --prefix=/usr \
      --libdir=lib \
      --buildtype=release \
      -Dintrospection=true \
      -Dx11_backend=false \
      -Dwayland_backend=true \
      -Dtests=false \
      -Dman=false

    ninja -C build
    DESTDIR="${OUT_DIR}" ninja -C build install

    find ${OUT_DIR} -type f -executable -exec strip --strip-unneeded {} \; 2>/dev/null || true
    find ${OUT_DIR} -name '*.a' -exec objcopy --enable-deterministic-archives {} \; 2>/dev/null || true
    find "${OUT_DIR}" -exec touch -d "2024-01-01T00:00:00+00:00" {} \;

