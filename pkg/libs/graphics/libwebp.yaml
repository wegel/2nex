build:
  environment: 13ce31fd97c19f5756e4413babf279d543b5a71c
  profile: [4128:699, 8275:994, 12426:1323, 16578:1556, 20731:2241, 24854:2288, 25174:2292]

  script: |
    # disable LTO due to linking issues with libwebp extras
    CFLAGS=${CFLAGS/-flto=auto/}
    CXXFLAGS=${CXXFLAGS/-flto=auto/}
    LDFLAGS=${LDFLAGS/-flto=auto/}

    tar --no-same-owner -xzf /${SOURCE_libwebp} -C "${WORK_DIR}" --strip-components=1
    cd ${WORK_DIR}

    cmake -B build -G Ninja \
      -DCMAKE_BUILD_TYPE=Release \
      -DCMAKE_INSTALL_PREFIX=/usr \
      -DCMAKE_INSTALL_LIBDIR=lib \
      -DBUILD_SHARED_LIBS=ON \
      -DWEBP_BUILD_EXTRAS=OFF \
      -DWEBP_LINK_STATIC=OFF

    ninja -C build
    DESTDIR="${OUT_DIR}" ninja -C build install

    find "${OUT_DIR}" -exec touch -d "2024-01-01T00:00:00+00:00" {} \;
    2nex_strip_binaries ${OUT_DIR}

