build:
  environment: 13ce31fd97c19f5756e4413babf279d543b5a71c
  profile: [4112:837, 8217:1744, 12330:2986, 16464:11334, 20624:11334, 21630:11392]

  script: |
    tar --no-same-owner -xf /${SOURCE_libadwaita} -C "${WORK_DIR}" --strip-components=1
    cd ${WORK_DIR}

    meson setup build \
      --prefix=/usr \
      --libdir=lib \
      --buildtype=release \
      -Dgtk_doc=false \
      -Dintrospection=disabled \
      -Dvapi=false \
      -Dtests=false \
      -Dexamples=false

    ninja -C build
    DESTDIR="${OUT_DIR}" ninja -C build install

    find ${OUT_DIR} -type f -executable -exec strip --strip-unneeded {} \; 2>/dev/null || true
    find ${OUT_DIR} -name '*.a' -exec objcopy --enable-deterministic-archives {} \; 2>/dev/null || true
    find "${OUT_DIR}" -exec touch -d "2024-01-01T00:00:00+00:00" {} \;

