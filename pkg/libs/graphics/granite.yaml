build:
  environment: 27b6e5dc7ad152c9a17c2cabfcc5ee93daa9bbf0
  profile: [8232:725, 24889:1985, 53760:2064, 86732:2102, 115834:2150, 144793:2204, 169735:2432, 215642:2492, 257396:2653, 282774:6672]

  script: |
    set -eu

    tar --no-same-owner -xf "${SOURCE_granite}" -C "${WORK_DIR}" --strip-components=1
    cd "${WORK_DIR}"

    mkdir -p /tmp/nex-vala-bin
    printf '%s\n' '#!/usr/bin/env bash' \
      'exec /usr/bin/valac-0.56 --vapidir=/usr/share/vala-0.56/vapi "$@"' \
      > /tmp/nex-vala-bin/valac
    chmod +x /tmp/nex-vala-bin/valac
    export PATH="/tmp/nex-vala-bin:${PATH}"
    export PKG_CONFIG_PATH=/usr/lib/pkgconfig:/usr/share/pkgconfig

    sed -i "/subdir('demo')/d" meson.build

    meson setup build \
      --prefix=/usr \
      --libdir=lib \
      --buildtype=release \
      --pkg-config-path=/usr/lib/pkgconfig:/usr/share/pkgconfig \
      -Ddocumentation=false \
      -Dintrospection=true

    ninja -C build
    DESTDIR="${OUT_DIR}" ninja -C build install

    find "${OUT_DIR}" -type f -executable -exec strip --strip-unneeded {} \; 2>/dev/null || true
    find "${OUT_DIR}" -name '*.a' -exec objcopy --enable-deterministic-archives {} \; 2>/dev/null || true
    find "${OUT_DIR}" -exec touch -d "2024-01-01T00:00:00+00:00" {} \;

