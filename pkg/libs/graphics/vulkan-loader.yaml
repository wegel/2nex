  commit: x86_64/pkg/libs/wayland/wayland/1.24.0/bundles/dev
- name: curl
  commit: x86_64/pkg/cli/net/curl/8.17.0/bundles/dev
- name: libarchive
  commit: x86_64/pkg/libs/archive/libarchive/3.8.4/bundles/dev
- name: openssl3
  commit: x86_64/pkg/dev/libs/openssl3/3.3.1/bundles/dev
- name: zstd
  commit: x86_64/pkg/libs/compression/zstd/1.5.6/bundles/dev
- name: lz4
  commit: x86_64/pkg/libs/compression/lz4/1.9.4/bundles/dev
- name: bzip2
  commit: x86_64/pkg/libs/compression/bzip2/1.0.8/bundles/dev
- name: xz
  commit: x86_64/pkg/libs/compression/xz/5.4.6/bundles/dev
- name: libxml2
  commit: x86_64/pkg/libs/system/libxml2/2.13.5/bundles/dev

build:
  environment: 27b6e5dc7ad152c9a17c2cabfcc5ee93daa9bbf0
  profile: [3192:147246]

  script: |
    tar --no-same-owner -xf /${SOURCE0} -C "${WORK_DIR}" --strip-components=1
    cd ${WORK_DIR}

    cmake -B build -G Ninja \
      -DCMAKE_BUILD_TYPE=Release \
      -DCMAKE_INSTALL_PREFIX=/usr \
      -DCMAKE_INSTALL_LIBDIR=lib \
      -DCMAKE_INSTALL_SYSCONFDIR=/etc \
      -DBUILD_WSI_XCB_SUPPORT=OFF \
      -DBUILD_WSI_WAYLAND_SUPPORT=ON \
      -DBUILD_WSI_XLIB_SUPPORT=OFF \
      -DBUILD_TESTS=OFF

    cmake --build build
    DESTDIR="${OUT_DIR}" cmake --install build

    find ${OUT_DIR} -type f -executable -exec strip --strip-unneeded {} \; 2>/dev/null || true
    find ${OUT_DIR} -name '*.a' -exec objcopy --enable-deterministic-archives {} \; 2>/dev/null || true
    find "${OUT_DIR}" -exec touch -d "2024-01-01T00:00:00+00:00" {} \;

bundles:
  dev:
  - dev
  - lib

  full:
  - dev
  - lib

outputs:
  dev:
    files:
    - path: /usr/lib/pkgconfig/vulkan.pc

  lib:
    files:
    - path: /usr/lib/cmake/VulkanLoader/VulkanLoaderConfig-release.cmake
    - path: /usr/lib/cmake/VulkanLoader/VulkanLoaderConfig.cmake
    - path: /usr/lib/cmake/VulkanLoader/VulkanLoaderConfigVersion.cmake
    - path: /usr/lib/libvulkan.so
      needs:
      - /usr/lib/libc.so.6
    - path: /usr/lib/libvulkan.so.1
      needs:
      - /usr/lib/libc.so.6
    - path: /usr/lib/libvulkan.so.1.4.328
      needs:
      - /usr/lib/libc.so.6

resolution:
  /usr/lib/libc.so.6: glibc
