package:
  schema: 1
  name: graphene
  slug: graphene
  namespace: libs/graphics
  version: 1.10.8
  description: Thin layer of types for graphic libraries
  homepage: https://github.com/ebassi/graphene
  checksum: f84d0ae2f8cae7b311eebe86f6161d14a4f96b8c2335fa961da8c56c1dcb09f2

sources:
- name: graphene
  url: https://download.gnome.org/sources/graphene/1.10/graphene-1.10.8.tar.xz
  sha256: a37bb0e78a419dcbeaa9c7027bcff52f5ec2367c25ec859da31dfde2928f279a

dependencies:
- name: glibc
  commit: x86_64/pkg/libs/system/glibc/2.39/bundles/dev
- name: gmp
  commit: x86_64/pkg/libs/system/gmp/6.3.0/bundles/dev
- name: gcc
  commit: x86_64/pkg/core/toolchain/gcc/13.2.0/bundles/dev
- name: binutils
  commit: x86_64/pkg/core/toolchain/binutils/2.42/bundles/dev
- name: bash
  commit: x86_64/pkg/cli/shells/bash/5.2.21/bundles/dev
- name: ncurses
  commit: x86_64/pkg/libs/system/ncurses/6.4-20230520/bundles/dev
- name: acl
  commit: x86_64/pkg/libs/system/acl/2.3.2/bundles/dev
- name: attr
  commit: x86_64/pkg/libs/system/attr/2.5.2/bundles/dev
- name: tar
  commit: x86_64/pkg/cli/archive/tar/1.35/bundles/dev
- name: xz
  commit: x86_64/pkg/libs/compression/xz/5.4.6/bundles/dev
- name: zlib
  commit: x86_64/pkg/libs/system/zlib/1.3.1/bundles/dev
- name: findutils
  commit: x86_64/pkg/core/userland/findutils/4.9.0/bundles/dev
- name: linux-headers
  commit: x86_64/pkg/libs/system/linux-headers/6.4.1/bundles/dev
- name: meson
  commit: x86_64/pkg/core/toolchain/meson/1.6.1/bundles/dev
- name: ninja
  commit: x86_64/pkg/core/toolchain/ninja/1.12.1/bundles/dev
- name: python3
  commit: x86_64/pkg/dev/lang/python3/3.12.2/bundles/dev
- name: pkgconf
  commit: x86_64/pkg/core/toolchain/pkgconf/2.2.0/bundles/dev
- name: glib2
  commit: x86_64/pkg/dev/libs/glib2/2.84.0/bundles/dev
- name: libffi
  commit: x86_64/pkg/libs/system/libffi/3.4.6/bundles/dev
- name: pcre2
  commit: x86_64/pkg/dev/libs/pcre2/10.44/bundles/dev

build:
  environment: 27b6e5dc7ad152c9a17c2cabfcc5ee93daa9bbf0
  profile: [4117:1091, 8286:1930, 8286:1965]

  script: |
    tar --no-same-owner -xf /${SOURCE_graphene} -C "${WORK_DIR}" --strip-components=1
    cd ${WORK_DIR}

    meson setup build \
      --prefix=/usr \
      --libdir=lib \
      --buildtype=release \
      -Dgtk_doc=false \
      -Dintrospection=disabled \
      -Dinstalled_tests=false \
      -Dtests=false

    ninja -C build
    DESTDIR="${OUT_DIR}" ninja -C build install

    find ${OUT_DIR} -type f -executable -exec strip --strip-unneeded {} \; 2>/dev/null || true
    find ${OUT_DIR} -name '*.a' -exec objcopy --enable-deterministic-archives {} \; 2>/dev/null || true
    find "${OUT_DIR}" -exec touch -d "2024-01-01T00:00:00+00:00" {} \;

bundles:
  dev:
  - dev
  - lib

outputs:
  dev:
    files:
    - path: /usr/include/graphene-1.0/graphene-box.h
    - path: /usr/include/graphene-1.0/graphene-euler.h
    - path: /usr/include/graphene-1.0/graphene-frustum.h
    - path: /usr/include/graphene-1.0/graphene-gobject.h
    - path: /usr/include/graphene-1.0/graphene-macros.h
    - path: /usr/include/graphene-1.0/graphene-matrix.h
    - path: /usr/include/graphene-1.0/graphene-plane.h
    - path: /usr/include/graphene-1.0/graphene-point.h
    - path: /usr/include/graphene-1.0/graphene-point3d.h
    - path: /usr/include/graphene-1.0/graphene-quad.h
    - path: /usr/include/graphene-1.0/graphene-quaternion.h
    - path: /usr/include/graphene-1.0/graphene-ray.h
    - path: /usr/include/graphene-1.0/graphene-rect.h
    - path: /usr/include/graphene-1.0/graphene-simd4f.h
    - path: /usr/include/graphene-1.0/graphene-simd4x4f.h
    - path: /usr/include/graphene-1.0/graphene-size.h
    - path: /usr/include/graphene-1.0/graphene-sphere.h
    - path: /usr/include/graphene-1.0/graphene-triangle.h
    - path: /usr/include/graphene-1.0/graphene-types.h
    - path: /usr/include/graphene-1.0/graphene-vec2.h
    - path: /usr/include/graphene-1.0/graphene-vec3.h
    - path: /usr/include/graphene-1.0/graphene-vec4.h
    - path: /usr/include/graphene-1.0/graphene-version-macros.h
    - path: /usr/include/graphene-1.0/graphene-version.h
    - path: /usr/include/graphene-1.0/graphene.h
    - path: /usr/lib/graphene-1.0/include/graphene-config.h
    - path: /usr/lib/pkgconfig/graphene-1.0.pc
    - path: /usr/lib/pkgconfig/graphene-gobject-1.0.pc

  lib:
    files:
    - path: /usr/lib/libgraphene-1.0.so
      needs:
      - /usr/lib/libc.so.6
      - /usr/lib/libglib-2.0.so.0
      - /usr/lib/libgobject-2.0.so.0
      - /usr/lib/libm.so.6
    - path: /usr/lib/libgraphene-1.0.so.0
      needs:
      - /usr/lib/libc.so.6
      - /usr/lib/libglib-2.0.so.0
      - /usr/lib/libgobject-2.0.so.0
      - /usr/lib/libm.so.6
    - path: /usr/lib/libgraphene-1.0.so.0.1000.8
      needs:
      - /usr/lib/libc.so.6
      - /usr/lib/libglib-2.0.so.0
      - /usr/lib/libgobject-2.0.so.0
      - /usr/lib/libm.so.6

resolution:
  /usr/lib/libglib-2.0.so.0: glib2
  /usr/lib/libgobject-2.0.so.0: glib2
  /usr/lib/libc.so.6: glibc
  /usr/lib/libm.so.6: glibc
