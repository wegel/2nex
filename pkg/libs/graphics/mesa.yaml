build:
  environment: 27b6e5dc7ad152c9a17c2cabfcc5ee93daa9bbf0
  profile: [4138:274, 16692:568, 37359:6152, 62134:8312, 82930:10613, 103564:14800, 124181:16259, 157401:19091, 186321:23864, 206281:223569]

  script: |
    # install python dependencies for mesa code generation first (before cd)
    # use --single-version-externally-managed to install flat (not as eggs)
    PYLIB=/tmp/pylib
    mkdir -p $PYLIB

    tar --no-same-owner -xzf /${SOURCE_markupsafe} -C /tmp
    pushd /tmp/markupsafe-*
    python3 setup.py install --single-version-externally-managed --record=/dev/null --root=/ --prefix=$PYLIB
    popd

    tar --no-same-owner -xzf /${SOURCE_mako} -C /tmp
    pushd /tmp/mako-*
    python3 setup.py install --single-version-externally-managed --record=/dev/null --root=/ --prefix=$PYLIB
    popd

    tar --no-same-owner -xzf /${SOURCE_pyyaml} -C /tmp
    pushd /tmp/pyyaml-*
    python3 setup.py install --single-version-externally-managed --record=/dev/null --root=/ --prefix=$PYLIB
    popd

    export PYTHONPATH=$PYLIB/lib/python3.12/site-packages

    tar --no-same-owner -xf /${SOURCE0} -C "${WORK_DIR}" --strip-components=1
    cd ${WORK_DIR}

    # fix missing includes in loader_wayland_helper.c (mesa bug)
    sed -i '/#include "loader_wayland_helper.h"/a #include <time.h>\n#include "util/timespec.h"' src/loader/loader_wayland_helper.c

    export CFLAGS="${CFLAGS} -D_DEFAULT_SOURCE -D_GNU_SOURCE"
    export CXXFLAGS="${CXXFLAGS} -D_DEFAULT_SOURCE -D_GNU_SOURCE"

    meson setup build \
      --prefix=/usr \
      --buildtype=release \
      -Dcpp_rtti=false \
      -Dplatforms=wayland \
      -Dgallium-drivers=radeonsi,nouveau,swrast,virgl \
      -Dvulkan-drivers=amd \
      -Dglx=disabled \
      -Degl=enabled \
      -Dgles1=disabled \
      -Dgles2=enabled \
      -Dllvm=enabled \
      -Dshared-llvm=disabled \
      -Dgbm=enabled \
      -Dosmesa=false \
      -Dvalgrind=disabled \
      -Dlibunwind=disabled \
      -Dxlib-lease=disabled

    ninja -C build
    DESTDIR="${OUT_DIR}" ninja -C build install

    find ${OUT_DIR} -type f -executable -exec strip --strip-unneeded {} \; 2>/dev/null || true
    find ${OUT_DIR} -name '*.a' -exec objcopy --enable-deterministic-archives {} \; 2>/dev/null || true
    find "${OUT_DIR}" -exec touch -d "2024-01-01T00:00:00+00:00" {} \;

