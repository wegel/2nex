package:
  schema: 1
  name: vulkan-headers
  slug: vulkan-headers
  namespace: libs/graphics
  version: 1.4.328.1
  description: Vulkan header files
  homepage: https://github.com/KhronosGroup/Vulkan-Headers
  checksum: 66269c685c9eeb06b8a1a890a633b47f5158063482cfb8eb6b3ad62d6265822d

sources:
- name: vulkan-headers
  url: https://github.com/KhronosGroup/Vulkan-Headers/archive/refs/tags/vulkan-sdk-1.4.328.1.tar.gz
  sha256: c465aa56757e7746ac707f582b6e2d51546569a4a2488c1172fb543aa5fdfc2c

dependencies:
- name: bash
  commit: x86_64/pkg/cli/shells/bash/5.2.21/bundles/dev
- name: coreutils
  commit: x86_64/pkg/core/userland/coreutils/9.5/bundles/dev
- name: findutils
  commit: x86_64/pkg/core/userland/findutils/4.9.0/bundles/dev
- name: tar
  commit: x86_64/pkg/cli/archive/tar/1.35/bundles/dev
- name: gzip
  commit: x86_64/pkg/cli/archive/gzip/1.13/bundles/dev
- name: glibc
  commit: x86_64/pkg/libs/system/glibc/2.39/bundles/dev
- name: ncurses
  commit: x86_64/pkg/libs/system/ncurses/6.4-20230520/bundles/dev
- name: acl
  commit: x86_64/pkg/libs/system/acl/2.3.2/bundles/dev
- name: attr
  commit: x86_64/pkg/libs/system/attr/2.5.2/bundles/dev
- name: zlib
  commit: x86_64/pkg/libs/system/zlib/1.3.1/bundles/dev

build:
  environment: 13ce31fd97c19f5756e4413babf279d543b5a71c
  profile: [33:149]

  script: |
    tar --no-same-owner -xf /${SOURCE_vulkan_headers} -C "${WORK_DIR}" --strip-components=1
    cd ${WORK_DIR}

    # headers-only package, just copy them
    mkdir -p "${OUT_DIR}/usr/include"
    cp -r include/vulkan include/vk_video "${OUT_DIR}/usr/include/"

    # registry files for tools
    mkdir -p "${OUT_DIR}/usr/share/vulkan/registry"
    cp -r registry/* "${OUT_DIR}/usr/share/vulkan/registry/"

    find "${OUT_DIR}" -exec touch -d '2024-01-01T00:00:00+00:00' {} \;

bundles:
  dev:
  - dev

