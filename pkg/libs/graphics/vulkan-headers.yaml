build:
  environment: 27b6e5dc7ad152c9a17c2cabfcc5ee93daa9bbf0
  profile: [4105:35108, 5255:41246]

  script: |
    tar --no-same-owner -xf /${SOURCE_vulkan_headers} -C "${WORK_DIR}" --strip-components=1
    cd ${WORK_DIR}

    cmake -B build -G Ninja \
      -DCMAKE_BUILD_TYPE=Release \
      -DCMAKE_INSTALL_PREFIX=/usr \
      -DCMAKE_INSTALL_DATADIR=share

    cmake --build build
    DESTDIR="${OUT_DIR}" cmake --install build

    find "${OUT_DIR}" -exec touch -d '2024-01-01T00:00:00+00:00' {} \;

bundles:
  dev:
  - dev
  - misc

