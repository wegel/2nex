build:
  environment: 27b6e5dc7ad152c9a17c2cabfcc5ee93daa9bbf0
  profile: [4140:1933, 8242:2537, 12407:2696, 16526:5445, 19464:6562]

  script: |
    set -eu
    tar --no-same-owner -xf "/${SOURCE_fontconfig}" -C "${WORK_DIR}" --strip-components=1
    cd "${WORK_DIR}"
    patch --batch --fuzz=0 -Np1 -i "/${SOURCE_system_config}"

    meson setup build \
      --prefix=/usr \
      --buildtype=release \
      -Ddoc=disabled \
      -Dtests=disabled \
      -Dbaseconfig-dir=/usr/share/fontconfig \
      -Dconfig-dir=/usr/share/fontconfig/conf.d

    ninja -C build
    DESTDIR="${OUT_DIR}" ninja -C build install

    config_smoke="${WORK_DIR}/fontconfig-config-smoke"
    gcc \
      -Wall -Wextra -Werror \
      -I"${OUT_DIR}/usr/include" \
      -L"${OUT_DIR}/usr/lib" \
      "/${SOURCE_config_smoke}" \
      -lfontconfig \
      -o "${config_smoke}"

    smoke_root="${WORK_DIR}/fontconfig-smoke-root"
    mkdir -p "${smoke_root}/usr/share"
    cp -a "${OUT_DIR}/usr/share/fontconfig" \
      "${smoke_root}/usr/share/fontconfig"
    LD_LIBRARY_PATH="${OUT_DIR}/usr/lib:/usr/lib" \
      "${config_smoke}" graph "${smoke_root}"
    LD_LIBRARY_PATH="${OUT_DIR}/usr/lib:/usr/lib" \
      "${config_smoke}" suite "${smoke_root}"

    find "${OUT_DIR}" -type f -executable -exec strip --strip-unneeded {} \; 2>/dev/null || true
    find "${OUT_DIR}" -name '*.a' -exec objcopy --enable-deterministic-archives {} \; 2>/dev/null || true
    find "${OUT_DIR}" -exec touch -d "2024-01-01T00:00:00+00:00" {} \;

