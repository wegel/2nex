package:
  schema: 1
  name: libpng
  slug: libpng
  namespace: libs/graphics
  version: 1.6.51
  description: PNG reference library
  homepage: http://www.libpng.org/pub/png/libpng.html
  checksum: dd79ab0883dfd74305e674446c72cea090989bbe52712190e925af95c02bbe74

sources:
- name: libpng
  url: https://downloads.sourceforge.net/project/libpng/libpng16/1.6.51/libpng-1.6.51.tar.xz
  sha256: a050a892d3b4a7bb010c3a95c7301e49656d72a64f1fc709a90b8aded192bed2

dependencies:
- name: glibc
  commit: x86_64/pkg/libs/system/glibc/2.39/bundles/dev
- name: gmp
  commit: x86_64/pkg/libs/system/gmp/6.3.0/bundles/dev
- name: libcap
  commit: x86_64/pkg/libs/security/libcap/2.69/bundles/dev
- name: mpfr
  commit: x86_64/pkg/libs/system/mpfr/4.2.1/bundles/dev
- name: gcc
  commit: x86_64/pkg/core/toolchain/gcc/13.2.0/bundles/dev
- name: binutils
  commit: x86_64/pkg/bootstrap/phase3/binutils/2.42/bundles/dev
- name: make
  commit: x86_64/pkg/core/toolchain/make/4.4.1/bundles/dev
- name: diffutils
  commit: x86_64/pkg/bootstrap/phase1/diffutils/3.10/bundles/dev
- name: gawk
  commit: x86_64/pkg/cli/text/gawk/5.3.0/bundles/dev
- name: sed
  commit: x86_64/pkg/cli/text/sed/4.9/bundles/dev
- name: grep
  commit: x86_64/pkg/cli/text/grep/3.11/bundles/dev
- name: pkgconf
  commit: x86_64/pkg/core/toolchain/pkgconf/2.2.0/bundles/dev
- name: bash
  commit: x86_64/pkg/cli/shells/bash/5.2.21/bundles/dev
- name: ncurses
  commit: x86_64/pkg/libs/system/ncurses/6.4-20230520/bundles/dev
- name: acl
  commit: x86_64/pkg/libs/system/acl/2.3.2/bundles/dev
- name: attr
  commit: x86_64/pkg/libs/system/attr/2.5.2/bundles/dev
- name: tar
  commit: x86_64/pkg/cli/archive/tar/1.35/bundles/dev
- name: xz
  commit: x86_64/pkg/libs/compression/xz/5.4.6/bundles/dev
- name: zlib
  commit: x86_64/pkg/libs/system/zlib/1.3.1/bundles/dev
- name: coreutils
  commit: x86_64/pkg/core/userland/coreutils/9.5/bundles/dev
- name: findutils
  commit: x86_64/pkg/core/userland/findutils/4.9.0/bundles/dev
- name: 2nex-utilities
  commit: x86_64/pkg/bootstrap/phase3/2nex-utilities-bootstrap/0.0.1/bundles/dev
- name: linux-headers
  commit: x86_64/pkg/bootstrap/phase3/linux-headers/6.4.1/bundles/dev

build:
  environment: 13ce31fd97c19f5756e4413babf279d543b5a71c
  profile: [4112:2808, 8230:5930, 12383:5932, 16848:5937, 20989:5953, 25111:6057, 29333:6074, 33673:8807, 42244:11826, 43650:12014]

  script: |
    tar --no-same-owner -xf ${SOURCE0} -C "${WORK_DIR}" --strip-components=1
    cd ${WORK_DIR}

    ./configure --prefix=/usr --disable-static

    make
    make DESTDIR="${OUT_DIR}" install

    find "${OUT_DIR}" -exec touch -d "2024-01-01T00:00:00+00:00" {} \;
    2nex_strip_binaries ${OUT_DIR}

bundles:
  dev:
  - dev
  - lib

outputs:
  bin:
    files:
    - path: /usr/bin/libpng-config
    - path: /usr/bin/libpng16-config
    - path: /usr/bin/png-fix-itxt
      needs:
      - /usr/lib/ld-linux-x86-64.so.2
      - /usr/lib/libc.so.6
      - /usr/lib/libz.so.1
    - path: /usr/bin/pngfix
      needs:
      - /usr/lib/ld-linux-x86-64.so.2
      - /usr/lib/libc.so.6
      - /usr/lib/libpng16.so.16
      - /usr/lib/libz.so.1

  dev:
    files:
    - path: /usr/include/libpng16/png.h
    - path: /usr/include/libpng16/pngconf.h
    - path: /usr/include/libpng16/pnglibconf.h
    - path: /usr/include/png.h
    - path: /usr/include/pngconf.h
    - path: /usr/include/pnglibconf.h
    - path: /usr/lib/libpng.la
    - path: /usr/lib/libpng16.la
    - path: /usr/lib/pkgconfig/libpng.pc
    - path: /usr/lib/pkgconfig/libpng16.pc

  lib:
    files:
    - path: /usr/lib/libpng.so
      needs:
      - /usr/lib/libc.so.6
      - /usr/lib/libm.so.6
      - /usr/lib/libz.so.1
    - path: /usr/lib/libpng16.so
      needs:
      - /usr/lib/libc.so.6
      - /usr/lib/libm.so.6
      - /usr/lib/libz.so.1
    - path: /usr/lib/libpng16.so.16
      needs:
      - /usr/lib/libc.so.6
      - /usr/lib/libm.so.6
      - /usr/lib/libz.so.1
    - path: /usr/lib/libpng16.so.16.51.0
      needs:
      - /usr/lib/libc.so.6
      - /usr/lib/libm.so.6
      - /usr/lib/libz.so.1

  man:
    files:
    - path: /usr/share/man/man3/libpng.3
    - path: /usr/share/man/man3/libpngpf.3
    - path: /usr/share/man/man5/png.5

resolution:
  /usr/lib/ld-linux-x86-64.so.2: glibc
  /usr/lib/libc.so.6: glibc
  /usr/lib/libm.so.6: glibc
  /usr/lib/libpng16.so.16: self
  /usr/lib/libz.so.1: zlib
