build:
  environment: 27b6e5dc7ad152c9a17c2cabfcc5ee93daa9bbf0
  profile: [4112:1293, 8248:1391, 12950:1489, 23024:1557, 28474:1558, 34180:1563, 39958:1577, 49788:1602, 58692:3465, 62776:4034]

  script: |
    tar --no-same-owner -xf /${SOURCE_gdk_pixbuf} -C "${WORK_DIR}" --strip-components=1
    cd ${WORK_DIR}

    meson setup build \
      --prefix=/usr \
      --libdir=lib \
      --buildtype=release \
      -Dbuiltin_loaders=png,gif,jpeg,tiff \
      -Dpng=enabled \
      -Djpeg=enabled \
      -Dtiff=enabled \
      -Dgif=enabled \
      -Dman=false \
      -Dgtk_doc=false \
      -Dintrospection=enabled \
      -Dglycin=disabled \
      -Dthumbnailer=disabled \
      -Dtests=false \
      -Dinstalled_tests=false

    ninja -v -C build
    DESTDIR="${OUT_DIR}" ninja -C build install

    # Generate a loaders.cache that points at the packaged modules.
    mkdir -p "${OUT_DIR}/usr/lib/gdk-pixbuf-2.0/2.10.0"
    GDK_PIXBUF_MODULEDIR="${OUT_DIR}/usr/lib/gdk-pixbuf-2.0/2.10.0/loaders" \
    GDK_PIXBUF_MODULE_FILE="${OUT_DIR}/usr/lib/gdk-pixbuf-2.0/2.10.0/loaders.cache" \
    LD_LIBRARY_PATH="${OUT_DIR}/usr/lib" \
      "${OUT_DIR}/usr/bin/gdk-pixbuf-query-loaders" > "${OUT_DIR}/usr/lib/gdk-pixbuf-2.0/2.10.0/loaders.cache"
    sed -i "s#${OUT_DIR}##g" "${OUT_DIR}/usr/lib/gdk-pixbuf-2.0/2.10.0/loaders.cache"

    find ${OUT_DIR} -type f -executable -exec strip --strip-unneeded {} \; 2>/dev/null || true
    find ${OUT_DIR} -name '*.a' -exec objcopy --enable-deterministic-archives {} \; 2>/dev/null || true
    find "${OUT_DIR}" -exec touch -d "2024-01-01T00:00:00+00:00" {} \;

