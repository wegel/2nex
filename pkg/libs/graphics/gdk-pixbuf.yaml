  commit: x86_64/pkg/libs/graphics/libjpeg-turbo/3.1.2/bundles/dev
- name: libpng
  commit: x86_64/pkg/libs/graphics/libpng/1.6.51/bundles/dev
- name: util-linux
  commit: x86_64/pkg/core/userland/util_linux/2.40/bundles/dev
- name: shared-mime-info
  commit: x86_64/pkg/libs/system/shared-mime-info/2.4/bundles/dev

build:
  environment: 13ce31fd97c19f5756e4413babf279d543b5a71c
  profile: [4135:1036, 8276:1326, 11343:2932]

  script: |
    tar --no-same-owner -xf /${SOURCE_gdk_pixbuf} -C "${WORK_DIR}" --strip-components=1
    cd ${WORK_DIR}

    meson setup build \
      --prefix=/usr \
      --libdir=lib \
      --buildtype=release \
      -Dbuiltin_loaders=all \
      -Dman=false \
      -Dgtk_doc=false \
      -Dintrospection=disabled \
      -Dglycin=disabled \
      -Dthumbnailer=disabled \
      -Dtests=false \
      -Dinstalled_tests=false

    ninja -C build
    DESTDIR="${OUT_DIR}" ninja -C build install

    find ${OUT_DIR} -type f -executable -exec strip --strip-unneeded {} \; 2>/dev/null || true
    find ${OUT_DIR} -name '*.a' -exec objcopy --enable-deterministic-archives {} \; 2>/dev/null || true
    find "${OUT_DIR}" -exec touch -d "2024-01-01T00:00:00+00:00" {} \;

bundles:
  dev:
  - bin
  - dev
  - lib

