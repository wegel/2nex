build:
  environment: 13ce31fd97c19f5756e4413babf279d543b5a71c
  profile: [4109:2058, 8267:6069, 12378:6227, 16474:6247, 17754:6259]

  script: |
    tar --no-same-owner -xf ${SOURCE0} -C "${WORK_DIR}" --strip-components=1
    cd ${WORK_DIR}

    meson setup build \
      --prefix=/usr \
      --buildtype=release \
      -Dudev=false \
      -Dvalgrind=disabled \
      -Dtests=false \
      -Dman-pages=disabled

    ninja -C build
    DESTDIR="${OUT_DIR}" ninja -C build install

    find "${OUT_DIR}" -exec touch -d "2024-01-01T00:00:00+00:00" {} \;
    2nex_strip_binaries ${OUT_DIR}

