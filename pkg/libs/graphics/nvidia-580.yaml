build:
  environment: env/standard.yaml
  profile: [4117:6393, 8235:9681, 12363:11202, 16498:14450, 20652:19347, 20741:19554]

  script: |
    set -eu

    mkdir -p "${WORK_DIR}/nvidia"
    nvidia_skip="$(awk -F= '/^skip=/{print $2; exit}' "/${SOURCE_nvidia}")"
    tail -n +"${nvidia_skip}" "/${SOURCE_nvidia}" \
      | zstd -d \
      | tar --no-same-owner -xf - -C "${WORK_DIR}/nvidia"

    make -C "${WORK_DIR}/nvidia/kernel" \
      SYSSRC=/usr/src/linux-6.18.24 \
      NV_EXCLUDE_KERNEL_MODULES="nvidia-peermem" \
      modules

    for module in nvidia nvidia-drm nvidia-modeset nvidia-uvm; do
      install -Dm644 "${WORK_DIR}/nvidia/kernel/${module}.ko" \
        "${OUT_DIR}/usr/lib/modules/6.18.24/extra/${module}.ko"
      strip --strip-debug "${OUT_DIR}/usr/lib/modules/6.18.24/extra/${module}.ko"
      printf 'nvidia build: installed %s module\n' "${module}"
    done

    bash "/${SOURCE_runtime_installer}" "${WORK_DIR}/nvidia" "${OUT_DIR}" "580.159.04"
    printf 'nvidia build: installed userspace runtime\n'

    python3 "/${SOURCE_application_profile_repair}" "${OUT_DIR}" "580.159.04"
    printf 'nvidia build: repaired application-profile paths\n'

    # Structural check: each of the six libraries whose fixed path table
    # NVIDIA compiles in must carry the normalized /run entry exactly once
    # and never the old versioned-vendor entry it replaced.
    python3 - "${OUT_DIR}" <<'PY'
    import sys

    out_dir = sys.argv[1]
    old = b"/usr/share/nvidia/nvidia-application-profiles-580.159.04-rc"
    new = b"/run/nvidia/nvidia-application-profiles-rc.d"
    libs = [
        "libcuda",
        "libnvidia-eglcore",
        "libnvidia-glcore",
        "libnvidia-glsi",
        "libnvidia-opencl",
        "libnvidia-vksc-core",
    ]
    for lib in libs:
        path = f"{out_dir}/usr/lib/{lib}.so.580.159.04"
        with open(path, "rb") as handle:
            data = handle.read()
        if old in data:
            sys.exit(f"{path}: old versioned-vendor path table entry still present")
        if data.count(new) != 1:
            sys.exit(f"{path}: runtime path table entry is not present exactly once")
    PY
    printf 'nvidia build: verified six application-profile path tables\n'

    # The stable unversioned vendor name must resolve to the versioned
    # profile file this package installs.
    test "$(readlink "${OUT_DIR}/usr/share/nvidia/nvidia-application-profiles-rc")" \
      = "nvidia-application-profiles-580.159.04-rc"
    printf 'nvidia build: verified stable vendor profile link\n'

    # Real-parser smoke: load the actual proprietary GLX driver and prove
    # its own application-profile parser sees administrator main,
    # administrator directory, runtime directory, vendor file, in that
    # order, with alphanumeric ordering inside a directory and a working
    # fallback once the runtime directory disappears again. Every absolute
    # fixture below is an exact path this smoke owns; setup refuses to run
    # if any of them already exists, and cleanup only removes the exact
    # files, links, and directories (via rmdir, never recursively) that
    # this smoke itself creates.
    profile_smoke="${WORK_DIR}/nvidia-application-profile-smoke"
    gcc \
      -Wall -Wextra -Werror \
      "/${SOURCE_application_profile_smoke}" \
      -ldl \
      -o "${profile_smoke}"

    admin_main=/etc/nvidia/nvidia-application-profiles-rc
    admin_dir=/etc/nvidia/nvidia-application-profiles-rc.d
    admin_dir_marker="${admin_dir}/zz-admin-dir-marker"
    runtime_dir=/run/nvidia/nvidia-application-profiles-rc.d
    runtime_marker="${runtime_dir}/zz-runtime-marker"
    runtime_a="${runtime_dir}/a-first-marker"
    runtime_b="${runtime_dir}/b-second-marker"
    vendor_dir=/usr/share/nvidia
    vendor_versioned="${vendor_dir}/nvidia-application-profiles-580.159.04-rc"
    vendor_stable="${vendor_dir}/nvidia-application-profiles-rc"
    profile_home="${WORK_DIR}/nvidia-profile-smoke-home"
    profile_log="${WORK_DIR}/nvidia-profile-smoke.log"

    for fixture_path in \
      /etc/nvidia "${admin_main}" "${admin_dir}" "${admin_dir_marker}" \
      /run/nvidia "${runtime_dir}" "${runtime_marker}" "${runtime_a}" "${runtime_b}" \
      "${vendor_dir}" "${vendor_versioned}" "${vendor_stable}"; do
      if [ -e "${fixture_path}" ] || [ -L "${fixture_path}" ]; then
        printf '%s\n' "profile smoke: fixture path already exists, refusing to run: ${fixture_path}" >&2
        exit 1
      fi
    done

    cleanup_profile_smoke() {
      rm -f "${runtime_a}" "${runtime_b}" "${runtime_marker}"
      [ -d "${runtime_dir}" ] && rmdir "${runtime_dir}"
      [ -d /run/nvidia ] && rmdir /run/nvidia
      rm -f "${admin_dir_marker}"
      [ -d "${admin_dir}" ] && rmdir "${admin_dir}"
      rm -f "${admin_main}"
      [ -d /etc/nvidia ] && rmdir /etc/nvidia
      rm -f "${vendor_versioned}" "${vendor_stable}"
      [ -d "${vendor_dir}" ] && rmdir "${vendor_dir}"
      rm -rf "${profile_home}"
    }
    trap cleanup_profile_smoke EXIT

    mkdir /etc/nvidia
    mkdir "${vendor_dir}"
    cp "${OUT_DIR}/usr/share/nvidia/nvidia-application-profiles-580.159.04-rc" "${vendor_versioned}"
    cp -a "${OUT_DIR}/usr/share/nvidia/nvidia-application-profiles-rc" "${vendor_stable}"

    write_profile() {
      mkdir -p "$(dirname "$1")"
      cat > "$1" <<PROFILE
    {
        "rules": [ { "pattern": [], "profile": "$2" } ],
        "profiles": [ { "name": "$2", "settings": [ "GLConformantBlitFramebufferScissor", false ] } ]
    }
    PROFILE
    }

    run_profile_smoke() {
      rm -rf "${profile_home}"
      mkdir -p "${profile_home}/.nv"
      if ! env HOME="${profile_home}" __GL_APPLICATION_PROFILE_LOG=1 \
          LD_LIBRARY_PATH="${OUT_DIR}/usr/lib" \
          "${profile_smoke}" "${OUT_DIR}/usr/lib/libGLX_nvidia.so.580.159.04" \
          >"${profile_log}" 2>&1; then
        fail_profile_smoke "profile smoke: proprietary GLX parser failed to start"
      fi
    }

    fail_profile_smoke() {
      printf '%s\n' "$1" >&2
      cat "${profile_log}" >&2
      exit 1
    }

    # Vendor-only fallback: nothing at the administrator or runtime tiers.
    run_profile_smoke
    grep -qF "Parsing file ${vendor_stable}" "${profile_log}" \
      || fail_profile_smoke "profile smoke: vendor fallback did not parse"
    if grep -qE "Parsing file (${admin_main}|${runtime_dir})" "${profile_log}"; then
      fail_profile_smoke "profile smoke: vendor-only case parsed an unexpected file"
    fi

    # Runtime directory before vendor.
    write_profile "${runtime_marker}" runtime-marker
    run_profile_smoke
    runtime_line=$(grep -nE "Parsing file ${runtime_dir}/+zz-runtime-marker" "${profile_log}" | head -n1 | cut -d: -f1)
    vendor_line=$(grep -nF "Parsing file ${vendor_stable}" "${profile_log}" | head -n1 | cut -d: -f1)
    if [ -z "${runtime_line:-}" ] || [ -z "${vendor_line:-}" ] || [ "${runtime_line}" -ge "${vendor_line}" ]; then
      fail_profile_smoke "profile smoke: runtime directory did not parse before the vendor file"
    fi

    # Both administrator entries before the runtime directory.
    write_profile "${admin_dir_marker}" admin-dir-marker
    write_profile "${admin_main}" admin-main-marker
    run_profile_smoke
    main_line=$(grep -nF "Parsing file ${admin_main}" "${profile_log}" | head -n1 | cut -d: -f1)
    dir_line=$(grep -nE "Parsing file ${admin_dir}/+zz-admin-dir-marker" "${profile_log}" | head -n1 | cut -d: -f1)
    runtime_line=$(grep -nE "Parsing file ${runtime_dir}/+zz-runtime-marker" "${profile_log}" | head -n1 | cut -d: -f1)
    if [ -z "${main_line:-}" ] || [ -z "${dir_line:-}" ] || [ -z "${runtime_line:-}" ] \
        || [ "${main_line}" -ge "${dir_line}" ] || [ "${dir_line}" -ge "${runtime_line}" ]; then
      fail_profile_smoke "profile smoke: administrator entries did not both precede the runtime directory"
    fi

    # Directory entries load in alphanumeric order.
    rm -f "${admin_main}" "${admin_dir_marker}" "${runtime_marker}"
    write_profile "${runtime_a}" a-first-marker
    write_profile "${runtime_b}" b-second-marker
    run_profile_smoke
    a_line=$(grep -nE "Parsing file ${runtime_dir}/+a-first-marker" "${profile_log}" | head -n1 | cut -d: -f1)
    b_line=$(grep -nE "Parsing file ${runtime_dir}/+b-second-marker" "${profile_log}" | head -n1 | cut -d: -f1)
    if [ -z "${a_line:-}" ] || [ -z "${b_line:-}" ] || [ "${a_line}" -ge "${b_line}" ]; then
      fail_profile_smoke "profile smoke: runtime directory entries did not load in alphanumeric order"
    fi

    # Runtime directory removal falls back to the vendor tier. Remove only
    # the two exact marker files this scenario owns, then rmdir the exact
    # runtime directory and its exact parent; never a recursive delete.
    rm -f "${runtime_a}" "${runtime_b}"
    rmdir "${runtime_dir}"
    rmdir /run/nvidia
    run_profile_smoke
    grep -qF "Parsing file ${vendor_stable}" "${profile_log}" \
      || fail_profile_smoke "profile smoke: vendor fallback did not run after removing the runtime directory"
    if grep -qF "Parsing file ${runtime_dir}" "${profile_log}"; then
      fail_profile_smoke "profile smoke: removed runtime directory was still parsed"
    fi

    cleanup_profile_smoke
    trap - EXIT

    printf 'nvidia application-profile smoke: PASS\n'

    find "${OUT_DIR}" -exec touch -h -d "2024-01-01T00:00:00+00:00" {} \;

