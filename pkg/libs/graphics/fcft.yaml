package:
  schema: 1
  name: fcft
  slug: fcft
  namespace: libs/graphics
  version: 3.3.2
  description: Simple library for font loading and glyph rasterization
  homepage: https://codeberg.org/dnkl/fcft
  checksum: 98fa53d2b084983112b206d2f04626d5e52958449f2e47006c7c20afd89c3cd8

sources:
- name: fcft
  url: https://codeberg.org/dnkl/fcft/archive/3.3.2.tar.gz
  sha256: 79e52aaafc0b57fa2b68ed6127de13e98318050399a939691b8ca30d44d48591

dependencies:
- name: glibc
  commit: x86_64/pkg/libs/system/glibc/2.39/bundles/dev
- name: gmp
  commit: x86_64/pkg/libs/system/gmp/6.3.0/bundles/dev
- name: gcc
  commit: x86_64/pkg/core/toolchain/gcc/13.2.0/bundles/dev
- name: binutils
  commit: x86_64/pkg/core/toolchain/binutils/2.42/bundles/dev
- name: bash
  commit: x86_64/pkg/cli/shells/bash/5.2.21/bundles/dev
- name: ncurses
  commit: x86_64/pkg/libs/system/ncurses/6.4-20230520/bundles/dev
- name: acl
  commit: x86_64/pkg/libs/system/acl/2.3.2/bundles/dev
- name: attr
  commit: x86_64/pkg/libs/system/attr/2.5.2/bundles/dev
- name: tar
  commit: x86_64/pkg/cli/archive/tar/1.35/bundles/dev
- name: gzip
  commit: x86_64/pkg/cli/archive/gzip/1.13/bundles/dev
- name: zlib
  commit: x86_64/pkg/libs/system/zlib/1.3.1/bundles/dev
- name: coreutils
  commit: x86_64/pkg/core/userland/coreutils/9.5/bundles/dev
- name: findutils
  commit: x86_64/pkg/core/userland/findutils/4.9.0/bundles/dev
- name: linux-headers
  commit: x86_64/pkg/libs/system/linux-headers/6.4.1/bundles/dev
- name: meson
  commit: x86_64/pkg/core/toolchain/meson/1.6.1/bundles/dev
- name: ninja
  commit: x86_64/pkg/core/toolchain/ninja/1.12.1/bundles/dev
- name: python3
  commit: x86_64/pkg/dev/lang/python3/3.12.2/bundles/dev
- name: pkgconf
  commit: x86_64/pkg/core/toolchain/pkgconf/2.2.0/bundles/dev
- name: fontconfig
  commit: x86_64/pkg/libs/graphics/fontconfig/2.17.1/bundles/dev
- name: freetype
  commit: x86_64/pkg/libs/graphics/freetype/2.14.1/bundles/dev
- name: pixman
  commit: x86_64/pkg/libs/graphics/pixman/0.46.4/bundles/dev
- name: harfbuzz
  commit: x86_64/pkg/libs/text/harfbuzz/10.1.0/bundles/dev
- name: tllist
  commit: x86_64/pkg/libs/system/tllist/1.1.0/bundles/dev
- name: expat
  commit: x86_64/pkg/libs/system/expat/2.6.2/bundles/dev
- name: libpng
  commit: x86_64/pkg/libs/graphics/libpng/1.6.51/bundles/dev
- name: glib2
  commit: x86_64/pkg/dev/libs/glib2/2.84.0/bundles/dev
- name: pcre2
  commit: x86_64/pkg/dev/libs/pcre2/10.44/bundles/dev

build:
  environment: 27b6e5dc7ad152c9a17c2cabfcc5ee93daa9bbf0
  profile: [3377:1548]

  script: |
    tar --no-same-owner -xzf /${SOURCE_fcft} -C "${WORK_DIR}" --strip-components=1
    cd ${WORK_DIR}

    meson setup build \
      --prefix=/usr \
      --libdir=lib \
      --buildtype=release \
      -Ddocs=disabled \
      -Dtest-text-shaping=false

    ninja -C build
    DESTDIR="${OUT_DIR}" ninja -C build install

    find ${OUT_DIR} -type f -executable -exec strip --strip-unneeded {} \; 2>/dev/null || true
    find ${OUT_DIR} -name '*.a' -exec objcopy --enable-deterministic-archives {} \; 2>/dev/null || true
    find "${OUT_DIR}" -exec touch -d "2024-01-01T00:00:00+00:00" {} \;

bundles:
  dev:
  - dev
  - lib

outputs:
  dev:
    files:
    - path: /usr/include/fcft/fcft.h
    - path: /usr/include/fcft/stride.h
    - path: /usr/lib/pkgconfig/fcft.pc

  lib:
    files:
    - path: /usr/lib/libfcft.so
      needs:
      - /usr/lib/libc.so.6
      - /usr/lib/libfontconfig.so.1
      - /usr/lib/libfreetype.so.6
      - /usr/lib/libharfbuzz.so.0
      - /usr/lib/libm.so.6
      - /usr/lib/libpixman-1.so.0
    - path: /usr/lib/libfcft.so.4
      needs:
      - /usr/lib/libc.so.6
      - /usr/lib/libfontconfig.so.1
      - /usr/lib/libfreetype.so.6
      - /usr/lib/libharfbuzz.so.0
      - /usr/lib/libm.so.6
      - /usr/lib/libpixman-1.so.0
    - path: /usr/lib/libfcft.so.4.3.2
      needs:
      - /usr/lib/libc.so.6
      - /usr/lib/libfontconfig.so.1
      - /usr/lib/libfreetype.so.6
      - /usr/lib/libharfbuzz.so.0
      - /usr/lib/libm.so.6
      - /usr/lib/libpixman-1.so.0

resolution:
  /usr/lib/libfontconfig.so.1: fontconfig
  /usr/lib/libfreetype.so.6: freetype
  /usr/lib/libc.so.6: glibc
  /usr/lib/libm.so.6: glibc
  /usr/lib/libharfbuzz.so.0: harfbuzz
  /usr/lib/libpixman-1.so.0: pixman
