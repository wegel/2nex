  commit: x86_64/pkg/libs/graphics/atk/2.38.0/bundles/dev
- name: at-spi2-core
  commit: x86_64/pkg/libs/graphics/at-spi2-core/2.54.0/bundles/dev

build:
  environment: 27b6e5dc7ad152c9a17c2cabfcc5ee93daa9bbf0
  profile: [4168:1664, 7569:4841]

  script: |
    tar --no-same-owner -xf /${SOURCE0} -C "${WORK_DIR}" --strip-components=1
    cd ${WORK_DIR}

    export PKG_CONFIG_PATH=/usr/lib/pkgconfig:/usr/share/pkgconfig:/usr/lib64/pkgconfig

    meson setup build \
      --prefix=/usr \
      --libdir=lib \
      --buildtype=release \
      -Dtests=false

    ninja -C build
    DESTDIR="${OUT_DIR}" ninja -C build install

    find ${OUT_DIR} -type f -executable -exec strip --strip-unneeded {} \; 2>/dev/null || true
    find ${OUT_DIR} -name '*.a' -exec objcopy --enable-deterministic-archives {} \; 2>/dev/null || true
    find "${OUT_DIR}" -exec touch -d "2024-01-01T00:00:00+00:00" {} \;

bundles:
  dev:
  - dev
  - lib

  full:
  - dev
  - lib

outputs:
  dev:
    files:
    - path: /usr/include/at-spi2-atk/2.0/atk-bridge.h
    - path: /usr/lib/pkgconfig/atk-bridge-2.0.pc

  lib:
    files:
    - path: /usr/lib/gnome-settings-daemon-3.0/gtk-modules/at-spi2-atk.desktop
    - path: /usr/lib/gtk-2.0/modules/libatk-bridge.so
      needs:
      - /usr/lib/libatk-bridge-2.0.so.0
      - /usr/lib/libglib-2.0.so.0
      - /usr/lib/libgmodule-2.0.so.0
    - path: /usr/lib/libatk-bridge-2.0.so
      needs:
      - /usr/lib/libatk-1.0.so.0
      - /usr/lib/libatspi.so.0
      - /usr/lib/libc.so.6
      - /usr/lib/libdbus-1.so.3
      - /usr/lib/libglib-2.0.so.0
      - /usr/lib/libgobject-2.0.so.0
    - path: /usr/lib/libatk-bridge-2.0.so.0
      needs:
      - /usr/lib/libatk-1.0.so.0
      - /usr/lib/libatspi.so.0
      - /usr/lib/libc.so.6
      - /usr/lib/libdbus-1.so.3
      - /usr/lib/libglib-2.0.so.0
      - /usr/lib/libgobject-2.0.so.0
    - path: /usr/lib/libatk-bridge-2.0.so.0.0.0
      needs:
      - /usr/lib/libatk-1.0.so.0
      - /usr/lib/libatspi.so.0
      - /usr/lib/libc.so.6
      - /usr/lib/libdbus-1.so.3
      - /usr/lib/libglib-2.0.so.0
      - /usr/lib/libgobject-2.0.so.0

resolution:
  /usr/lib/libatk-1.0.so.0: at-spi2-core
  /usr/lib/libatspi.so.0: at-spi2-core
  /usr/lib/libdbus-1.so.3: dbus
  /usr/lib/libglib-2.0.so.0: glib2
  /usr/lib/libgmodule-2.0.so.0: glib2
  /usr/lib/libgobject-2.0.so.0: glib2
  /usr/lib/libc.so.6: glibc
  /usr/lib/libatk-bridge-2.0.so.0: self
