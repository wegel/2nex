build:
  environment: 27b6e5dc7ad152c9a17c2cabfcc5ee93daa9bbf0
  profile: [4113:6886, 8218:25922, 12323:94367, 15587:129179]

  script: |
    tar --no-same-owner -xf /${SOURCE_librsvg} -C "${WORK_DIR}" --strip-components=1
    cd ${WORK_DIR}

    # extract vendored rust dependencies
    tar --no-same-owner -xf /${SOURCE_vendor}

    # configure cargo to use vendored deps
    mkdir -p .cargo
    cat > .cargo/config.toml << 'EOF'
    [source.crates-io]
    replace-with = "vendored-sources"

    [source.vendored-sources]
    directory = "vendor"
    EOF

    # setup cargo environment
    export CARGO_HOME=${WORK_DIR}/.cargo_home
    mkdir -p ${CARGO_HOME}
    cp .cargo/config.toml ${CARGO_HOME}/config.toml

    # create a gcc wrapper that sorts -l flags for deterministic DT_NEEDED/dynstr order
    cat > /tmp/gcc-sort-wrapper << 'WRAPPER'
    #!/bin/bash
    # gcc wrapper that sorts -l flags for reproducible builds
    other_args=()
    lib_args=()
    for arg in "$@"; do
      case "$arg" in
        -l*) lib_args+=("$arg") ;;
        *) other_args+=("$arg") ;;
      esac
    done
    IFS=$'\n' sorted_libs=($(printf '%s\n' "${lib_args[@]}" | LC_ALL=C sort -u))
    exec /usr/bin/gcc "${other_args[@]}" "${sorted_libs[@]}"
    WRAPPER
    chmod +x /tmp/gcc-sort-wrapper

    export CARGO_TARGET_X86_64_UNKNOWN_LINUX_GNU_LINKER=/tmp/gcc-sort-wrapper
    ln -sf /tmp/gcc-sort-wrapper /usr/bin/cc
    export CC=/tmp/gcc-sort-wrapper
    unset RUSTFLAGS

    # reproducibility: single codegen unit
    export CARGO_PROFILE_RELEASE_CODEGEN_UNITS=1
    export CARGO_PROFILE_RELEASE_LTO=true

    meson setup build \
      --prefix=/usr \
      --libdir=lib \
      --buildtype=release \
      -Ddocs=disabled \
      -Dintrospection=disabled \
      -Dvala=disabled \
      -Dtests=false \
      -Dpixbuf-loader=disabled

    ninja -C build
    DESTDIR="${OUT_DIR}" ninja -C build install

    # normalize Libs.private in .pc files for reproducibility
    for pc in $(find "${OUT_DIR}" -name '*.pc' 2>/dev/null); do
      if grep -q '^Libs.private:' "$pc"; then
        sed -i 's/^Libs.private:.*/Libs.private: -lc -ldl -lgcc_s -lm -lpthread -lrt -lutil/' "$pc"
      fi
    done

    find ${OUT_DIR} -type f -executable -exec strip --strip-unneeded {} \; 2>/dev/null || true
    find ${OUT_DIR} -name '*.a' -exec objcopy --enable-deterministic-archives {} \; 2>/dev/null || true
    find "${OUT_DIR}" -exec touch -d "2024-01-01T00:00:00+00:00" {} \;

