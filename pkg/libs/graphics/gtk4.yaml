build:
  environment: 27b6e5dc7ad152c9a17c2cabfcc5ee93daa9bbf0
  profile: [4134:2144, 16492:2778, 37232:3448, 62073:5942, 82767:8050, 99326:10115, 119941:12616, 148738:15813, 177644:71875, 197098:72118]

  script: |
    tar --no-same-owner -xf /${SOURCE_gtk4} -C "${WORK_DIR}" --strip-components=1
    cd ${WORK_DIR}

    meson setup build \
      --prefix=/usr \
      --libdir=lib \
      --buildtype=release \
      -Dwayland-backend=true \
      -Dx11-backend=false \
      -Dbroadway-backend=false \
      -Dmedia-gstreamer=disabled \
      -Dprint-cups=disabled \
      -Dvulkan=disabled \
      -Dcloudproviders=disabled \
      -Dsysprof=disabled \
      -Dtracker=disabled \
      -Dcolord=disabled \
      -Ddocumentation=false \
      -Dman-pages=false \
      -Dintrospection=disabled \
      -Dbuild-demos=false \
      -Dbuild-testsuite=false \
      -Dbuild-examples=false \
      -Dbuild-tests=false

    ninja -C build
    DESTDIR="${OUT_DIR}" ninja -C build install

    find ${OUT_DIR} -type f -executable -exec strip --strip-unneeded {} \; 2>/dev/null || true
    find ${OUT_DIR} -name '*.a' -exec objcopy --enable-deterministic-archives {} \; 2>/dev/null || true
    find "${OUT_DIR}" -exec touch -d "2024-01-01T00:00:00+00:00" {} \;

