build:
  environment: 27b6e5dc7ad152c9a17c2cabfcc5ee93daa9bbf0
  profile: [4141:1608, 8240:2150, 12365:2545, 16489:2869, 20597:6131, 24711:6131, 27323:6336]

  script: |
    tar --no-same-owner -xf /${SOURCE0} -C "${WORK_DIR}" --strip-components=1
    cd ${WORK_DIR}

    patch --batch --fuzz=0 -Np1 -i "/${SOURCE_uapi_config}"

    meson setup build \
      --prefix=/usr \
      --sysconfdir=/etc \
      --libdir=lib \
      --buildtype=release \
      -Ddbus_daemon=/usr/bin/dbus-daemon \
      -Ddbus_broker=/usr/bin/dbus-broker-launch \
      -Ddefault_bus=dbus-broker \
      -Dx11=disabled \
      -Dintrospection=enabled

    ninja -C build
    DESTDIR="${OUT_DIR}" ninja -C build install

    install -d "${OUT_DIR}/usr/share/xdg/autostart"
    mv "${OUT_DIR}/etc/xdg/autostart/at-spi-dbus-bus.desktop" \
      "${OUT_DIR}/usr/share/xdg/autostart/"
    rmdir "${OUT_DIR}/etc/xdg/autostart" "${OUT_DIR}/etc/xdg" "${OUT_DIR}/etc"

    grep -qx 'Type=Application' \
      "${OUT_DIR}/usr/share/xdg/autostart/at-spi-dbus-bus.desktop"
    grep -qx 'Exec=/usr/libexec/at-spi-bus-launcher --launch-immediately' \
      "${OUT_DIR}/usr/share/xdg/autostart/at-spi-dbus-bus.desktop"
    strings "${OUT_DIR}/usr/libexec/at-spi-bus-launcher" \
      | grep -qx '/usr/bin/dbus-daemon'
    strings "${OUT_DIR}/usr/libexec/at-spi-bus-launcher" \
      | grep -qx '/usr/bin/dbus-broker-launch'
    if strings "${OUT_DIR}/usr/libexec/at-spi-bus-launcher" \
        | grep -q '^/usr/sbin/dbus-daemon$'; then
      echo 'at-spi-bus-launcher retained the host dbus-daemon path' >&2
      exit 1
    fi

    if strings "${OUT_DIR}/usr/libexec/at-spi-bus-launcher" | grep -q '/usr/etc'; then
      echo 'at-spi-bus-launcher compiled a /usr/etc path' >&2
      exit 1
    fi

    # UAPI D-Bus policy smoke: ensure_a11y_bus() selects one complete
    # accessibility bus config file. Run the real just-built launcher under
    # a real session bus and prove the exact --config-file argument it
    # passes to the spawned bus process for the administrator, transient,
    # and vendor tiers, and that an empty higher tier still masks the
    # tiers below it. The a11y bus process itself is replaced by a logging
    # wrapper only after the session bus is already running, so the
    # session bus that owns org.a11y.Bus keeps using the real binary.
    schema_dir="${WORK_DIR}/atspi-empty-schemas"
    mkdir -p "${schema_dir}"
    cat > "${schema_dir}/org.nex.atspi-smoke.gschema.xml" <<'SCHEMA_XML'
    <?xml version="1.0" encoding="UTF-8"?>
    <schemalist>
      <schema id="org.nex.atspi-smoke" path="/org/nex/atspi-smoke/">
      </schema>
    </schemalist>
    SCHEMA_XML
    glib-compile-schemas "${schema_dir}"

    dbus_daemon_real="${WORK_DIR}/dbus-daemon.real"
    cp /usr/bin/dbus-daemon "${dbus_daemon_real}"
    chmod +x "${dbus_daemon_real}"

    dbus_daemon_wrapper="${WORK_DIR}/dbus-daemon.wrapper"
    cat > "${dbus_daemon_wrapper}" <<'DBUS_DAEMON_WRAPPER'
    #!/bin/bash
    printf '%s\n' "$@" > "${ATSPI_ARGV_LOG}"
    exit 1
    DBUS_DAEMON_WRAPPER
    chmod +x "${dbus_daemon_wrapper}"

    argv_log="${WORK_DIR}/atspi-dbus-daemon-argv.log"

    run_launcher() {
      rm -f "${argv_log}"
      ATSPI_ARGV_LOG="${argv_log}" \
      ATSPI_DBUS_IMPLEMENTATION=dbus-daemon \
      ATSPI_LAUNCHER="${OUT_DIR}/usr/libexec/at-spi-bus-launcher" \
      ATSPI_DBUS_DAEMON_WRAPPER="${dbus_daemon_wrapper}" \
      ATSPI_DBUS_DAEMON_REAL="${dbus_daemon_real}" \
      GSETTINGS_SCHEMA_DIR="${schema_dir}" \
        timeout 15 dbus-run-session -- bash -c '
          rm -f /usr/bin/dbus-daemon
          cp "${ATSPI_DBUS_DAEMON_WRAPPER}" /usr/bin/dbus-daemon
          chmod +x /usr/bin/dbus-daemon
          "${ATSPI_LAUNCHER}" --launch-immediately
        ' >/dev/null 2>&1 || true
      rm -f /usr/bin/dbus-daemon
      cp "${dbus_daemon_real}" /usr/bin/dbus-daemon
      chmod +x /usr/bin/dbus-daemon
    }

    expect_config_file() {
      expected="$1"
      run_launcher
      if [ ! -s "${argv_log}" ]; then
        echo "at-spi2-core UAPI smoke: dbus-daemon was never invoked, expected --config-file=${expected}" >&2
        exit 1
      fi
      if ! grep -qxF -- "--config-file=${expected}" "${argv_log}"; then
        echo "at-spi2-core UAPI smoke: expected --config-file=${expected}, got:" >&2
        cat "${argv_log}" >&2
        exit 1
      fi
    }

    mkdir -p /usr/share/defaults/at-spi2
    cp "${OUT_DIR}/usr/share/defaults/at-spi2/accessibility.conf" \
      /usr/share/defaults/at-spi2/accessibility.conf

    rm -rf /etc/at-spi2 /run/at-spi2

    # Neither the administrator nor the transient tier exists: vendor wins.
    expect_config_file "/usr/share/defaults/at-spi2/accessibility.conf"

    # The transient tier appears and must win over the vendor default.
    mkdir -p /run/at-spi2
    printf 'nex-run-marker\n' > /run/at-spi2/accessibility.conf
    expect_config_file "/run/at-spi2/accessibility.conf"

    # The administrator tier appears and must win over the transient and vendor tiers.
    mkdir -p /etc/at-spi2
    printf 'nex-etc-marker\n' > /etc/at-spi2/accessibility.conf
    expect_config_file "/etc/at-spi2/accessibility.conf"

    # An empty administrator file is still complete and must mask the lower tiers.
    : > /etc/at-spi2/accessibility.conf
    expect_config_file "/etc/at-spi2/accessibility.conf"

    # Remove the administrator file; the transient tier must still mask the vendor default.
    rm -f /etc/at-spi2/accessibility.conf
    expect_config_file "/run/at-spi2/accessibility.conf"

    # An empty transient file is still complete and must mask the vendor default.
    : > /run/at-spi2/accessibility.conf
    expect_config_file "/run/at-spi2/accessibility.conf"

    rm -rf /etc/at-spi2 /run/at-spi2
    rm -f /usr/share/defaults/at-spi2/accessibility.conf
    rmdir /usr/share/defaults/at-spi2 /usr/share/defaults 2>/dev/null || true

    printf 'at-spi2-core UAPI smoke: at-spi-bus-launcher selected the administrator, transient, and vendor config files in order, and an empty higher tier masked the tiers below it\n'

    find ${OUT_DIR} -type f -executable -exec strip --strip-unneeded {} \; 2>/dev/null || true
    find ${OUT_DIR} -name '*.a' -exec objcopy --enable-deterministic-archives {} \; 2>/dev/null || true
    find "${OUT_DIR}" -exec touch -d "2024-01-01T00:00:00+00:00" {} \;

