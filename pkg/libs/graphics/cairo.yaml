build:
  profile: [4113:2495, 8233:2687, 20537:3123, 32888:3318, 41175:3710, 53601:4048, 61945:4621, 78461:4646, 94922:4647, 102475:4956]

  script: |
    tar --no-same-owner -xf ${SOURCE0} -C "${WORK_DIR}" --strip-components=1
    cd ${WORK_DIR}

    meson setup build \
      --prefix=/usr \
      --buildtype=release \
      -Dxcb=disabled \
      -Dxlib=disabled \
      -Dxlib-xcb=disabled \
      -Dgtk_doc=false \
      -Dtests=disabled \
      -Dspectre=disabled

    ninja -C build
    DESTDIR="${OUT_DIR}" ninja -C build install

    find "${OUT_DIR}" -exec touch -d "2024-01-01T00:00:00+00:00" {} \;
    2nex_strip_binaries ${OUT_DIR}

bundles:
  dev:
  - dev
  - lib

