build:
  environment: 27b6e5dc7ad152c9a17c2cabfcc5ee93daa9bbf0
  profile: [4103:4342, 8201:9373, 12321:9890, 16466:9981, 20595:13031, 24753:13036, 33014:16416, 37597:16961, 45794:19484, 48648:19907]

  script: |
    tar --no-same-owner -xf ${SOURCE0} -C "${WORK_DIR}" --strip-components=1
    cd ${WORK_DIR}

    export CPP=/usr/bin/cpp
    export CFLAGS="${CFLAGS} -Wno-error"

    ./configure \
      --prefix=/usr \
      --libdir=/usr/lib \
      --disable-static \
      --disable-gtk-doc \
      --disable-gtk-doc-html \
      --disable-gtk-doc-pdf \
      --disable-introspection \
      --disable-dumper \
      --disable-vala

    make
    make -j1 DESTDIR="${OUT_DIR}" install

    find ${OUT_DIR} -type f -executable -exec strip --strip-unneeded {} \; 2>/dev/null || true
    find ${OUT_DIR} -name '*.a' -exec objcopy --enable-deterministic-archives {} \; 2>/dev/null || true
    find "${OUT_DIR}" -exec touch -d "2024-01-01T00:00:00+00:00" {} \;

