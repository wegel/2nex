build:
  script: "tar --no-same-owner -xf ${SOURCE_libxcrypt} -C \"${WORK_DIR}\" --strip-components=1\ncd ${WORK_DIR}\n\n./configure --prefix=/usr                \\\n          --enable-hashes=strong,glibc \\\n          --enable-obsolete-api=no     \\\n          --disable-failure-tokens\n       \nmake\nmake DESTDIR=\"${OUT_DIR}\" install\n\nfind \"${OUT_DIR}\" -exec touch -d '2024-01-01T00:00:00+00:00' {} \\;\n2nex_strip_binaries ${OUT_DIR}\n"
bundles:
  full:
  - dev
  - static
  - man
  - lib
  dev:
  - dev
  - static
  - lib
outputs:
  dev:
    files:
    - path: /usr/include/crypt.h
    - path: /usr/lib/libcrypt.la
    - path: /usr/lib/pkgconfig/libcrypt.pc
    - path: /usr/lib/pkgconfig/libxcrypt.pc
  static:
    files:
    - path: /usr/lib/libcrypt.a
  man:
    files:
    - path: /usr/share/man/man3/crypt.3
    - path: /usr/share/man/man3/crypt_checksalt.3
    - path: /usr/share/man/man3/crypt_gensalt.3
    - path: /usr/share/man/man3/crypt_gensalt_ra.3
    - path: /usr/share/man/man3/crypt_gensalt_rn.3
    - path: /usr/share/man/man3/crypt_preferred_method.3
    - path: /usr/share/man/man3/crypt_r.3
    - path: /usr/share/man/man3/crypt_ra.3
    - path: /usr/share/man/man3/crypt_rn.3
    - path: /usr/share/man/man5/crypt.5
  lib:
    files:
    - path: /usr/lib/libcrypt.so
      needs:
      - /usr/lib/libc.so.6
    - path: /usr/lib/libcrypt.so.2
      needs:
      - /usr/lib/libc.so.6
    - path: /usr/lib/libcrypt.so.2.0.0
      needs:
      - /usr/lib/libc.so.6

resolution:
  /usr/lib/libc.so.6: glibc
