build:
  environment: 13ce31fd97c19f5756e4413babf279d543b5a71c
  profile: [4143:640, 8292:1151, 12457:1849, 16619:1849, 19378:1976]

  script: |
    tar --no-same-owner -xzf /${SOURCE_shared_mime_info} -C "${WORK_DIR}" --strip-components=1
    cd ${WORK_DIR}

    meson setup build \
      --prefix=/usr \
      --libdir=lib \
      --buildtype=release \
      -Dupdate-mimedb=false

    ninja -C build
    DESTDIR="${OUT_DIR}" ninja -C build install

    find ${OUT_DIR} -type f -executable -exec strip --strip-unneeded {} \; 2>/dev/null || true
    find ${OUT_DIR} -name '*.a' -exec objcopy --enable-deterministic-archives {} \; 2>/dev/null || true
    find "${OUT_DIR}" -exec touch -d "2024-01-01T00:00:00+00:00" {} \;

bundles:
  dev:
  - bin
  - dev
  - misc

outputs:
  bin:
    files:
    - path: /usr/bin/update-mime-database
      needs:
      - /usr/lib/ld-linux-x86-64.so.2
      - /usr/lib/libc.so.6
      - /usr/lib/libgcc_s.so.1
      - /usr/lib/libglib-2.0.so.0
      - /usr/lib/libstdc++.so.6
      - /usr/lib/libxml2.so.2

  dev:
    files:
    - path: /usr/share/pkgconfig/shared-mime-info.pc

  locale:
