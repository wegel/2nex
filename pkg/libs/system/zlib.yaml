package:
  schema: 1
  name: Zlib
  slug: zlib
  namespace: libs/system
  version: 1.3.1
  description: A Massively Spiffy Yet Delicately Unobtrusive Compression Library
  homepage: https://zlib.net/
  checksum: 6d7155108c951b13b1fd3ccb199f788bf19e635637e5722dbc957ffdb0fd38e2
  seed: true

sources:
- name: zlib
  url: https://zlib.net/zlib-1.3.1.tar.xz
  sha256: 38ef96b8dfe510d42707d9c781877914792541133e1870841463bfa73f883e32

dependencies:
- name: linux-headers
  commit: x86_64/pkg/bootstrap/phase1/linux-headers/6.4.1/bundles/dev
- name: glibc
  commit: x86_64/pkg/libs/system/glibc/2.39/bundles/dev
- name: gmp
  commit: x86_64/pkg/libs/system/gmp/6.3.0/bundles/dev
- name: perl
  commit: x86_64/pkg/dev/lang/perl/5.38.2/bundles/dev
- name: m4
  commit: x86_64/pkg/dev/lang/m4/1.4.19/bundles/dev
- name: binutils
  commit: x86_64/pkg/bootstrap/phase1/binutils/2.42/bundles/dev
- name: gcc
  commit: x86_64/pkg/bootstrap/phase1/gcc/13.2.0/bundles/dev
- name: bash
  commit: x86_64/pkg/bootstrap/phase1/bash/5.2.21/bundles/dev
- name: coreutils
  commit: x86_64/pkg/bootstrap/phase1/coreutils/9.5/bundles/dev
- name: findutils
  commit: x86_64/pkg/bootstrap/phase1/findutils/4.9.0/bundles/dev
- name: grep
  commit: x86_64/pkg/bootstrap/phase1/grep/3.11/bundles/dev
- name: diffutils
  commit: x86_64/pkg/bootstrap/phase1/diffutils/3.10/bundles/dev
- name: gawk
  commit: x86_64/pkg/bootstrap/phase1/gawk/5.3.0/bundles/dev
- name: make
  commit: x86_64/pkg/bootstrap/phase1/make/4.4.1/bundles/dev
- name: sed
  commit: x86_64/pkg/bootstrap/phase1/sed/4.9/bundles/dev
- name: tar
  commit: x86_64/pkg/bootstrap/phase1/tar/1.35/bundles/dev
- name: xz
  commit: x86_64/pkg/bootstrap/phase1/xz/5.4.6/bundles/dev
- name: autoconf
  commit: x86_64/pkg/core/toolchain/autoconf/2.72/bundles/dev
- name: automake
  commit: x86_64/pkg/core/toolchain/automake/1.16.5/bundles/dev
- name: libtool
  commit: x86_64/pkg/core/toolchain/libtool/2.4.7/bundles/dev

build:
  environment: 27b6e5dc7ad152c9a17c2cabfcc5ee93daa9bbf0
  profile: [4160:316, 8535:323, 12966:407, 17066:3528, 21866:4687, 26708:4710, 30821:4846, 32551:5288]

  script: |
    tar --no-same-owner -xf ${SOURCE_zlib} -C "${WORK_DIR}" --strip-components=1
    cd ${WORK_DIR}

    ./configure --prefix=/usr
    make
    make check
    make DESTDIR=${OUT_DIR} install

    # build and install minizip from zlib contrib
    pushd contrib/minizip
    autoreconf -fi
    ./configure --prefix=/usr
    make
    make DESTDIR=${OUT_DIR} install
    popd

    rm -rf ${OUT_DIR}/usr/share/info ${OUT_DIR}/usr/share/man ${OUT_DIR}/usr/share/doc
    find "${OUT_DIR}" -exec touch -d '2024-01-01T00:00:00+00:00' {} \;

    find ${OUT_DIR} -type f -executable -exec strip --strip-unneeded {} \; 2>/dev/null || true
    find ${OUT_DIR} -name '*.a' -exec objcopy --enable-deterministic-archives {} \; 2>/dev/null || true

bundles:
  contrib-dev:
  - contrib-dev
  - contrib-lib
  - contrib-static

  dev:
  - dev
  - lib
  - static

outputs:
  contrib-dev:
    files:
    - path: /usr/include/minizip/crypt.h
    - path: /usr/include/minizip/ioapi.h
    - path: /usr/include/minizip/mztools.h
    - path: /usr/include/minizip/unzip.h
    - path: /usr/include/minizip/zip.h
    - path: /usr/lib/libminizip.la
    - path: /usr/lib/pkgconfig/minizip.pc

  contrib-lib:
    files:
    - path: /usr/lib/libminizip.so
      needs:
      - /usr/lib/libc.so.6
      - /usr/lib/libz.so.1
    - path: /usr/lib/libminizip.so.1
      needs:
      - /usr/lib/libc.so.6
      - /usr/lib/libz.so.1
    - path: /usr/lib/libminizip.so.1.0.0
      needs:
      - /usr/lib/libc.so.6
      - /usr/lib/libz.so.1

  contrib-static:
    files:
    - path: /usr/lib/libminizip.a

  dev:
    files:
    - path: /usr/include/zconf.h
    - path: /usr/include/zlib.h
    - path: /usr/lib/pkgconfig/zlib.pc

  lib:
    files:
    - path: /usr/lib/libz.so
      needs:
      - /usr/lib/libc.so.6
    - path: /usr/lib/libz.so.1
      needs:
      - /usr/lib/libc.so.6
    - path: /usr/lib/libz.so.1.3.1
      needs:
      - /usr/lib/libc.so.6

  static:
    files:
    - path: /usr/lib/libz.a

resolution:
  /usr/lib/libc.so.6: glibc
  /usr/lib/libz.so.1: self
