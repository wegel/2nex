build:
  environment: 27b6e5dc7ad152c9a17c2cabfcc5ee93daa9bbf0
  profile: [282523:7685, 1128706:10110, 2531916:16966, 4219378:22830, 5625173:27194, 7032788:32438, 8440822:44076, 10549762:51331, 12658458:59679, 14062377:80695]

  script: |
    tar --no-same-owner -xf ${SOURCE_glibc} -C "${WORK_DIR}" --strip-components=1
    cd ${WORK_DIR}
    patch --batch --fuzz=0 -Np1 -i /${SOURCE_fhs_patch}
    patch --batch --fuzz=0 -Np1 -i /${SOURCE_uapi_config_patch}
    mkdir build
    cd build

    echo "slibdir=/usr/lib" >> configparms
    echo "rtlddir=/usr/lib" >> configparms
    echo "sbindir=/usr/bin" >> configparms
    echo "rootsbindir=/usr/bin" >> configparms
    CFLAGS=
    CSSFLAGS=
    LDFLAGS=

    ../configure --prefix=/usr                            \
               --disable-werror                         \
               --enable-kernel=4.19                     \
               --enable-stack-protector=strong          \
               --disable-nscd                           \
               libc_cv_slibdir=/usr/lib

    sed "/test-installation/s@\$(PERL)@echo not running@" -i ../Makefile
    make
    make info
    make install DESTDIR=${OUT_DIR}
    #make install
    sed "/RTLDLIST=/s@/usr@@g" -i ${OUT_DIR}/usr/bin/ldd

    install -d ${OUT_DIR}/usr/lib
    mv ${OUT_DIR}/etc/rpc ${OUT_DIR}/usr/lib/rpc
    rm ${OUT_DIR}/etc/ld.so.cache
    rmdir ${OUT_DIR}/etc

    #set -x
    ##exit 0
    #mkdir -pv ${OUT_DIR}/usr/lib/locale /usr/lib/locale
    #ln -sf ${OUT_DIR}/usr/lib/locale/locale-archive /usr/lib/locale/locale-archive
    #/usr/bin/localedef -i C -f UTF-8 C.UTF-8
    #/usr/bin/localedef -i en_US -f ISO-8859-1 en_US
    #/usr/bin/localedef -i en_US -f UTF-8 en_US.UTF-8
    #/usr/bin/localedef -i ja_JP -f SHIFT_JIS ja_JP.SJIS 2> /dev/null || true

    cat > ${OUT_DIR}/usr/lib/nsswitch.conf << "EOF"
    # Begin /usr/lib/nsswitch.conf

    passwd: files systemd
    group: files systemd
    shadow: files systemd

    hosts: mymachines resolve [!UNAVAIL=return] files myhostname dns
    networks: files

    protocols: files
    services: files
    ethers: files
    rpc: files

    # End /usr/lib/nsswitch.conf
    EOF

    gcc -O2 -Wall -Wextra -Werror \
      -I${OUT_DIR}/usr/include \
      ${WORK_DIR}/nss/tst-uapi-config.c \
      -o ${WORK_DIR}/tst-uapi-config
    ${OUT_DIR}/usr/lib/ld-linux-x86-64.so.2 \
      --library-path ${OUT_DIR}/usr/lib \
      ${WORK_DIR}/tst-uapi-config

    mkdir -p /etc
    cat > /etc/ld.so.conf << "EOF"
    # Begin /etc/ld.so.conf
    /usr/local/lib

    EOF

    find "${OUT_DIR}" -exec touch -d '2024-01-01T00:00:00+00:00' {} \;

    set -x
    for F in libBrokenLocale.a libc.a libc_nonshared.a libg.a libm-2.39.a libmvec.a libresolv.a; do
      strip --strip-debug ${OUT_DIR}/usr/lib/$F
      ranlib -D ${OUT_DIR}/usr/lib/$F
    done

    # strip shared libraries
    find ${OUT_DIR}/usr/lib -name "*.so*" -type f -exec strip --strip-debug {} \;

