- name: sed
  commit: x86_64/pkg/bootstrap/phase1/sed/4.9/bundles/dev
- name: tar
  commit: x86_64/pkg/bootstrap/phase1/tar/1.35/bundles/dev
- name: mpc
  commit: x86_64/pkg/bootstrap/phase3/mpc/1.2.1/outputs/lib
- name: perl
  commit: x86_64/pkg/bootstrap/phase2/perl/5.38.2/bundles/dev
- name: coreutils
  commit: x86_64/pkg/bootstrap/phase1/coreutils/9.5/outputs/bin
- name: texinfo
  commit: x86_64/pkg/bootstrap/phase2/texinfo/7.1/bundles/dev
- name: zlib
  commit: x86_64/pkg/bootstrap/phase3/zlib/1.3.1/bundles/dev
- name: xz
  commit: x86_64/pkg/bootstrap/phase3/xz/5.4.6/bundles/dev
- name: bzip2
  commit: x86_64/pkg/bootstrap/phase3/bzip2/1.0.8/outputs/lib
- name: file
  commit: x86_64/pkg/bootstrap/phase3/file/5.45/bundles/dev
- name: binutils
  commit: x86_64/pkg/bootstrap/phase3/binutils/2.42/bundles/dev
- name: glibc
  commit: x86_64/pkg/libs/system/glibc/2.39/bundles/dev
- name: gcc
  commit: x86_64/pkg/core/toolchain/gcc/13.2.0/bundles/dev
- name: gmp
  commit: x86_64/pkg/libs/system/gmp/6.3.0/bundles/dev

build:
  environment: 13ce31fd97c19f5756e4413babf279d543b5a71c
  profile: [39475:4078, 147283:4231, 323522:4460, 536947:4732, 716531:4975, 892333:5197, 1072853:5465, 1340559:8434, 1607684:9171, 1783683:16125]

  script: |
    tar --no-same-owner -xf ${SOURCE_mpfr} -C "${WORK_DIR}" --strip-components=1
    cd ${WORK_DIR}

    ./configure --prefix=/usr        \
              --enable-thread-safe \
              --docdir=/usr/share/doc/mpfr-4.2.1

    make
    make html
    make check
    make DESTDIR="${OUT_DIR}" install
    make DESTDIR="${OUT_DIR}" install-html

    find "${OUT_DIR}" -exec touch -d '2024-01-01T00:00:00+00:00' {} \;
    2nex_strip_binaries ${OUT_DIR}

bundles:
  dev:
  - dev
  - lib
  - static

  full:
  - dev
  - doc
  - info
  - lib
  - static

outputs:
  dev:
    files:
    - path: /usr/include/mpf2mpfr.h
    - path: /usr/include/mpfr.h
    - path: /usr/lib/libmpfr.la
    - path: /usr/lib/pkgconfig/mpfr.pc

  doc:
