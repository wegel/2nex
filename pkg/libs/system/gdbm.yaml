package:
  schema: 1
  name: GDBM
  slug: gdbm
  namespace: libs/system
  version: "1.23"
  description: GNU dbm is a set of database routines that use extensible hashing
  homepage: https://www.gnu.org/software/gdbm/
  checksum: 899a6d90d35ce40f99bdeb6e9e28917162ef47dc45e1fc4970e321de9c02b8d1

sources:
- name: gdbm
  url: https://ftp.gnu.org/gnu/gdbm/gdbm-1.23.tar.gz
  sha256: 74b1081d21fff13ae4bd7c16e5d6e504a4c26f7cde1dca0d963a484174bbcacd

dependencies:
- name: linux-headers
  commit: x86_64/pkg/libs/system/linux-headers/6.4.1/bundles/dev
- name: glibc
  commit: x86_64/pkg/libs/system/glibc/2.39/bundles/dev
- name: zlib
  commit: x86_64/pkg/libs/system/zlib/1.3.1/bundles/dev
- name: ncurses
  commit: x86_64/pkg/libs/system/ncurses/6.4-20230520/bundles/dev
- name: attr
  commit: x86_64/pkg/libs/system/attr/2.5.2/bundles/dev
- name: acl
  commit: x86_64/pkg/libs/system/acl/2.3.2/bundles/dev
- name: libcap
  commit: x86_64/pkg/libs/security/libcap/2.69/bundles/dev
- name: gmp
  commit: x86_64/pkg/libs/system/gmp/6.3.0/bundles/dev
- name: binutils
  commit: x86_64/pkg/core/toolchain/binutils/2.42/bundles/dev
- name: gcc
  commit: x86_64/pkg/core/toolchain/gcc/13.2.0/bundles/dev
- name: make
  commit: x86_64/pkg/core/toolchain/make/4.4.1/bundles/dev
- name: bash
  commit: x86_64/pkg/cli/shells/bash/5.2.21/bundles/dev
- name: coreutils
  commit: x86_64/pkg/core/userland/coreutils/9.5/bundles/dev
- name: findutils
  commit: x86_64/pkg/core/userland/findutils/4.9.0/bundles/dev
- name: grep
  commit: x86_64/pkg/cli/text/grep/3.11/bundles/dev
- name: gawk
  commit: x86_64/pkg/cli/text/gawk/5.3.0/bundles/dev
- name: sed
  commit: x86_64/pkg/cli/text/sed/4.9/bundles/dev
- name: tar
  commit: x86_64/pkg/cli/archive/tar/1.35/bundles/dev
- name: gzip
  commit: x86_64/pkg/cli/archive/gzip/1.13/bundles/dev

build:
  environment: 27b6e5dc7ad152c9a17c2cabfcc5ee93daa9bbf0
  profile: [4148:922, 8261:2970, 12391:4933, 16506:5185, 17682:5233]

  script: |
    tar --no-same-owner -xf ${SOURCE0} -C "${WORK_DIR}" --strip-components=1
    cd ${WORK_DIR}

    ./configure --prefix=/usr    \
                --disable-static \
                --enable-libgdbm-compat
    make
    make DESTDIR=$OUT_DIR install

    find ${OUT_DIR} -type f -executable -exec strip --strip-unneeded {} \; 2>/dev/null || true
    find ${OUT_DIR} -name '*.a' -exec objcopy --enable-deterministic-archives {} \; 2>/dev/null || true
    find "${OUT_DIR}" -exec touch -d "2024-01-01T00:00:00+00:00" {} \;

bundles:
  dev:
  - bin
  - dev
  - lib

  full:
  - bin
  - dev
  - info
  - lib
  - locale
  - man

outputs:
  bin:
    files:
    - path: /usr/bin/gdbm_dump
      needs:
      - /usr/lib/ld-linux-x86-64.so.2
      - /usr/lib/libc.so.6
      - /usr/lib/libgdbm.so.6
    - path: /usr/bin/gdbm_load
      needs:
      - /usr/lib/ld-linux-x86-64.so.2
      - /usr/lib/libc.so.6
      - /usr/lib/libgdbm.so.6
    - path: /usr/bin/gdbmtool
      needs:
      - /usr/lib/ld-linux-x86-64.so.2
      - /usr/lib/libc.so.6
      - /usr/lib/libgdbm.so.6

  dev:
    files:
    - path: /usr/include/dbm.h
    - path: /usr/include/gdbm.h
    - path: /usr/include/ndbm.h
    - path: /usr/lib/libgdbm.la
    - path: /usr/lib/libgdbm_compat.la

  info:
    files:
    - path: /usr/share/info/gdbm.info

  lib:
    files:
    - path: /usr/lib/libgdbm.so
      needs:
      - /usr/lib/ld-linux-x86-64.so.2
      - /usr/lib/libc.so.6
    - path: /usr/lib/libgdbm.so.6
      needs:
      - /usr/lib/ld-linux-x86-64.so.2
      - /usr/lib/libc.so.6
    - path: /usr/lib/libgdbm.so.6.0.0
      needs:
      - /usr/lib/ld-linux-x86-64.so.2
      - /usr/lib/libc.so.6
    - path: /usr/lib/libgdbm_compat.so
      needs:
      - /usr/lib/libc.so.6
      - /usr/lib/libgdbm.so.6
    - path: /usr/lib/libgdbm_compat.so.4
      needs:
      - /usr/lib/libc.so.6
      - /usr/lib/libgdbm.so.6
    - path: /usr/lib/libgdbm_compat.so.4.0.0
      needs:
      - /usr/lib/libc.so.6
      - /usr/lib/libgdbm.so.6

  locale:
    files:
    - path: /usr/share/locale/da/LC_MESSAGES/gdbm.mo
    - path: /usr/share/locale/de/LC_MESSAGES/gdbm.mo
    - path: /usr/share/locale/eo/LC_MESSAGES/gdbm.mo
    - path: /usr/share/locale/es/LC_MESSAGES/gdbm.mo
    - path: /usr/share/locale/fi/LC_MESSAGES/gdbm.mo
    - path: /usr/share/locale/fr/LC_MESSAGES/gdbm.mo
    - path: /usr/share/locale/ja/LC_MESSAGES/gdbm.mo
    - path: /usr/share/locale/pl/LC_MESSAGES/gdbm.mo
    - path: /usr/share/locale/pt_BR/LC_MESSAGES/gdbm.mo
    - path: /usr/share/locale/ru/LC_MESSAGES/gdbm.mo
    - path: /usr/share/locale/sr/LC_MESSAGES/gdbm.mo
    - path: /usr/share/locale/sv/LC_MESSAGES/gdbm.mo
    - path: /usr/share/locale/uk/LC_MESSAGES/gdbm.mo
    - path: /usr/share/locale/vi/LC_MESSAGES/gdbm.mo

  man:
    files:
    - path: /usr/share/man/man1/gdbm_dump.1
    - path: /usr/share/man/man1/gdbm_load.1
    - path: /usr/share/man/man1/gdbmtool.1
    - path: /usr/share/man/man3/gdbm.3

resolution:
  /usr/lib/ld-linux-x86-64.so.2: glibc
  /usr/lib/libc.so.6: glibc
  /usr/lib/libgdbm.so.6: self
