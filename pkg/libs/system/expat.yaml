package:
  schema: 1
  name: Expat
  slug: expat
  namespace: libs/system
  version: 2.6.2
  description: An XML parser library written in C
  homepage: https://libexpat.github.io/
  checksum: b330889dd20d7445d9ac4c6dcd8b09295cf7d9bf0edbd0185dd222d3d69fc439
  seed: true

sources:
- name: expat
  url: https://github.com/libexpat/libexpat/releases/download/R_2_6_2/expat-2.6.2.tar.xz
  sha256: ee14b4c5d8908b1bec37ad937607eab183d4d9806a08adee472c3c3121d27364

dependencies:
- name: linux-headers
  commit: x86_64/pkg/bootstrap/phase1/linux-headers/6.4.1/bundles/dev
- name: glibc
  commit: x86_64/pkg/libs/system/glibc/2.39/bundles/dev
- name: binutils
  commit: x86_64/pkg/bootstrap/phase1/binutils/2.42/bundles/dev
- name: gcc
  commit: x86_64/pkg/bootstrap/phase1/gcc/13.2.0/bundles/dev
- name: zlib
  commit: x86_64/pkg/bootstrap/phase1/zlib/1.3.1/bundles/dev
- name: bash
  commit: x86_64/pkg/bootstrap/phase1/bash/5.2.21/bundles/dev
- name: coreutils
  commit: x86_64/pkg/bootstrap/phase1/coreutils/9.5/bundles/dev
- name: findutils
  commit: x86_64/pkg/bootstrap/phase1/findutils/4.9.0/bundles/dev
- name: gawk
  commit: x86_64/pkg/bootstrap/phase1/gawk/5.3.0/bundles/dev
- name: grep
  commit: x86_64/pkg/bootstrap/phase1/grep/3.11/bundles/dev
- name: make
  commit: x86_64/pkg/bootstrap/phase1/make/4.4.1/bundles/dev
- name: sed
  commit: x86_64/pkg/bootstrap/phase1/sed/4.9/bundles/dev
- name: tar
  commit: x86_64/pkg/bootstrap/phase1/tar/1.35/bundles/dev
- name: xz
  commit: x86_64/pkg/bootstrap/phase1/xz/5.4.6/bundles/dev

build:
  environment: 27b6e5dc7ad152c9a17c2cabfcc5ee93daa9bbf0
  profile: [4099:829, 8203:2266, 12802:2292, 17173:2313, 21482:3235, 25887:3288, 29996:3434, 34778:3514, 38966:3755, 39320:3771]

  script: |
    tar --no-same-owner -xf ${SOURCE0} -C "${WORK_DIR}" --strip-components=1
    cd ${WORK_DIR}

    ./configure --prefix=/usr    \
                --disable-static \
                --docdir=/usr/share/doc/expat-2.6.2

    make
    make DESTDIR=$OUT_DIR install
    install -v -m644 doc/*.{html,css} ${OUT_DIR}/usr/share/doc/expat-2.6.2

    find ${OUT_DIR} -type f -executable -exec strip --strip-unneeded {} \; 2>/dev/null || true
    find ${OUT_DIR} -name '*.a' -exec objcopy --enable-deterministic-archives {} \; 2>/dev/null || true
    find "${OUT_DIR}" -exec touch -d "2024-01-01T00:00:00+00:00" {} \;

bundles:
  dev:
  - bin
  - dev
  - lib

  full:
  - bin
  - dev
  - doc
  - lib
  - man

outputs:
  bin:
    files:
    - path: /usr/bin/xmlwf
      needs:
      - /usr/lib/ld-linux-x86-64.so.2
      - /usr/lib/libc.so.6
      - /usr/lib/libexpat.so.1

  dev:
    files:
    - path: /usr/include/expat.h
    - path: /usr/include/expat_config.h
    - path: /usr/include/expat_external.h
    - path: /usr/lib/libexpat.la
    - path: /usr/lib/pkgconfig/expat.pc

  doc:
    files:
    - path: /usr/share/doc/expat-2.6.2/AUTHORS
    - path: /usr/share/doc/expat-2.6.2/changelog
    - path: /usr/share/doc/expat-2.6.2/ok.min.css
    - path: /usr/share/doc/expat-2.6.2/reference.html
    - path: /usr/share/doc/expat-2.6.2/style.css

  lib:
    files:
    - path: /usr/lib/cmake/expat-2.6.2/expat-config-version.cmake
    - path: /usr/lib/cmake/expat-2.6.2/expat-config.cmake
    - path: /usr/lib/cmake/expat-2.6.2/expat-noconfig.cmake
    - path: /usr/lib/cmake/expat-2.6.2/expat.cmake
    - path: /usr/lib/libexpat.so
      needs:
      - /usr/lib/libc.so.6
      - /usr/lib/libm.so.6
    - path: /usr/lib/libexpat.so.1
      needs:
      - /usr/lib/libc.so.6
      - /usr/lib/libm.so.6
    - path: /usr/lib/libexpat.so.1.9.2
      needs:
      - /usr/lib/libc.so.6
      - /usr/lib/libm.so.6

  man:
    files:
    - path: /usr/share/man/man1/xmlwf.1

resolution:
  /usr/lib/ld-linux-x86-64.so.2: glibc
  /usr/lib/libc.so.6: glibc
  /usr/lib/libm.so.6: glibc
  /usr/lib/libexpat.so.1: self
