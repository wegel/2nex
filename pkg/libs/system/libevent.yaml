    - path: /usr/include/evhttp.h
    - path: /usr/include/evrpc.h
    - path: /usr/include/evutil.h
    - path: /usr/lib/libevent.la
    - path: /usr/lib/libevent_core.la
    - path: /usr/lib/libevent_extra.la
    - path: /usr/lib/libevent_openssl.la
    - path: /usr/lib/libevent_pthreads.la
    - path: /usr/lib/pkgconfig/libevent.pc
    - path: /usr/lib/pkgconfig/libevent_core.pc
