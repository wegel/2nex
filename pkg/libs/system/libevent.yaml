      needs:
      - /usr/lib/libc.so.6
    - path: /usr/lib/libevent-2.1.so.7.0.1
      needs:
      - /usr/lib/libc.so.6
    - path: /usr/lib/libevent.so
      needs:
      - /usr/lib/libc.so.6
    - path: /usr/lib/libevent_core-2.1.so.7
      needs:
      - /usr/lib/libc.so.6
    - path: /usr/lib/libevent_core-2.1.so.7.0.1
      needs:
