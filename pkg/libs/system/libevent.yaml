  commit: x86_64/pkg/bootstrap/phase3/pkgconf/2.2.0/bundles/dev

build:
  environment: 13ce31fd97c19f5756e4413babf279d543b5a71c
  profile: [4100:902, 8199:2037, 12298:5365, 16455:5578, 20583:7439, 23769:7584]

  script: |
    tar --no-same-owner -xf /${SOURCE_libevent} -C "${WORK_DIR}" --strip-components=1
    cd ${WORK_DIR}

    ./configure --prefix=/usr --disable-static

    make
    make DESTDIR=${OUT_DIR} install

    find "${OUT_DIR}" -exec touch -d '2024-01-01T00:00:00+00:00' {} \;
    2nex_strip_binaries ${OUT_DIR}

bundles:
  dev:
  - dev
  - lib

outputs:
  bin:
    files:
    - path: /usr/bin/event_rpcgen.py

  dev:
    files:
    - path: /usr/include/evdns.h
    - path: /usr/include/event.h
