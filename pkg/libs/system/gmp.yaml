package:
  schema: 1
  name: GNU GMP
  slug: gmp
  namespace: libs/system
  version: 6.3.0
  description: GNU multiple precision arithmetic library
  homepage: https://gmplib.org
  checksum: a1539c827b5c17d0f2fd28170204173ec7251ae076cfab06306fb838d454afee
  seed: true

sources:
- name: gmp
  url: https://gmplib.org/download/gmp/gmp-6.3.0.tar.xz
  sha256: a3c2b80201b89e68616f4ad30bc66aee4927c3ce50e33929ca819d5c43538898

dependencies:
- name: glibc
  commit: x86_64/pkg/libs/system/glibc/2.39/bundles/dev
- name: gcc
  commit: x86_64/pkg/core/toolchain/gcc/13.2.0/bundles/dev
- name: binutils
  commit: x86_64/pkg/bootstrap/phase1/binutils/2.42/bundles/dev
- name: bash
  commit: x86_64/pkg/bootstrap/phase1/bash/5.2.21/bundles/dev
- name: coreutils
  commit: x86_64/pkg/bootstrap/phase1/coreutils/9.5/bundles/dev
- name: findutils
  commit: x86_64/pkg/bootstrap/phase1/findutils/4.9.0/bundles/dev
- name: gawk
  commit: x86_64/pkg/bootstrap/phase1/gawk/5.3.0/bundles/dev
- name: grep
  commit: x86_64/pkg/bootstrap/phase1/grep/3.11/bundles/dev
- name: m4
  commit: x86_64/pkg/bootstrap/phase1/m4/1.4.19/bundles/dev
- name: make
  commit: x86_64/pkg/bootstrap/phase1/make/4.4.1/bundles/dev
- name: sed
  commit: x86_64/pkg/bootstrap/phase1/sed/4.9/bundles/dev
- name: tar
  commit: x86_64/pkg/bootstrap/phase1/tar/1.35/bundles/dev
- name: xz
  commit: x86_64/pkg/bootstrap/phase1/xz/5.4.6/bundles/dev
- name: zlib
  commit: x86_64/pkg/bootstrap/phase1/zlib/1.3.1/bundles/dev
- name: linux-headers
  commit: x86_64/pkg/bootstrap/phase1/linux-headers/6.4.1/bundles/dev

build:
  environment: 27b6e5dc7ad152c9a17c2cabfcc5ee93daa9bbf0
  profile: [29161:9664, 110733:9796, 247178:9980, 411488:10253, 545613:10681, 681432:11582, 819356:12212, 1023379:14486, 1224852:20035, 1358542:27309]

  script: |
    tar --no-same-owner -xf ${SOURCE_gmp} -C "${WORK_DIR}" --strip-components=1
    cd ${WORK_DIR}

    ./configure --prefix=/usr    \
              --with-pic \
              --build=x86_64-unknown-linux-gnu \
              --enable-fat \
              --enable-cxx     \
              --docdir=/usr/share/doc/gmp-6.3.0

    make
    make check 2>&1 | tee gmp-check-log
    awk "/# PASS:/{total+=\$3} ; END{print total}" gmp-check-log
    make DESTDIR="${OUT_DIR}" install
    rm -rf ${OUT_DIR}/usr/share/info
    rm -rf ${OUT_DIR}/usr/share/doc

    rm ${OUT_DIR}/usr/lib/*.la

    find ${OUT_DIR} -type f -executable -exec strip --strip-unneeded {} \; 2>/dev/null || true
    find ${OUT_DIR} -name '*.a' -exec objcopy --enable-deterministic-archives {} \; 2>/dev/null || true
    find "${OUT_DIR}" -exec touch -d '2024-01-01T00:00:00+00:00' {} \;

bundles:
  dev:
  - dev
  - lib
  - static

  full:
  - dev
  - lib
  - static

outputs:
  dev:
    files:
    - path: /usr/include/gmp.h
    - path: /usr/include/gmpxx.h
    - path: /usr/lib/pkgconfig/gmp.pc
    - path: /usr/lib/pkgconfig/gmpxx.pc

  lib:
    files:
    - path: /usr/lib/libgmp.so
      needs:
      - /usr/lib/libc.so.6
    - path: /usr/lib/libgmp.so.10
      needs:
      - /usr/lib/libc.so.6
    - path: /usr/lib/libgmp.so.10.5.0
      needs:
      - /usr/lib/libc.so.6
    - path: /usr/lib/libgmpxx.so
      needs:
      - /usr/lib/libc.so.6
      - /usr/lib/libgcc_s.so.1
      - /usr/lib/libgmp.so.10
      - /usr/lib/libm.so.6
      - /usr/lib/libstdc++.so.6
    - path: /usr/lib/libgmpxx.so.4
      needs:
      - /usr/lib/libc.so.6
      - /usr/lib/libgcc_s.so.1
      - /usr/lib/libgmp.so.10
      - /usr/lib/libm.so.6
      - /usr/lib/libstdc++.so.6
    - path: /usr/lib/libgmpxx.so.4.7.0
      needs:
      - /usr/lib/libc.so.6
      - /usr/lib/libgcc_s.so.1
      - /usr/lib/libgmp.so.10
      - /usr/lib/libm.so.6
      - /usr/lib/libstdc++.so.6

  static:
    files:
    - path: /usr/lib/libgmp.a
    - path: /usr/lib/libgmpxx.a

resolution:
  /usr/lib/libgcc_s.so.1: gcc
  /usr/lib/libstdc++.so.6: gcc
  /usr/lib/libc.so.6: glibc
  /usr/lib/libm.so.6: glibc
  /usr/lib/libgmp.so.10: self
