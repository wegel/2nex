package:
  schema: 1
  name: Readline
  slug: readline
  namespace: libs/system
  version: "8.2"
  description: The GNU Readline library
  homepage: https://tiswww.case.edu/php/chet/readline/rltop.html
  checksum: 746c87a8d4968723d28de6db824ef8dc3802aeb573f17dea63fd9cd86740041d

sources:
- name: readline
  url: https://ftp.gnu.org/gnu/readline/readline-8.2.tar.gz
  sha256: 3feb7171f16a84ee82ca18a36d7b9be109a52c04f492a053331d7d1095007c35
- name: patch
  url: https://www.linuxfromscratch.org/patches/downloads/readline/readline-8.2-upstream_fixes-3.patch
  sha256: 8a108b34c5bdf9d6a9d6c0bd4cf2da756ae5232c5de2ae55c5468e953bb8de62

dependencies:
- name: linux-headers
  commit: x86_64/pkg/libs/system/linux-headers/6.4.1/bundles/dev
- name: glibc
  commit: x86_64/pkg/libs/system/glibc/2.39/bundles/dev
- name: zlib
  commit: x86_64/pkg/libs/system/zlib/1.3.1/bundles/dev
- name: ncurses
  commit: x86_64/pkg/libs/system/ncurses/6.4-20230520/bundles/dev
- name: attr
  commit: x86_64/pkg/libs/system/attr/2.5.2/bundles/dev
- name: acl
  commit: x86_64/pkg/libs/system/acl/2.3.2/bundles/dev
- name: libcap
  commit: x86_64/pkg/libs/security/libcap/2.69/bundles/dev
- name: gmp
  commit: x86_64/pkg/libs/system/gmp/6.3.0/bundles/dev
- name: binutils
  commit: x86_64/pkg/core/toolchain/binutils/2.42/bundles/dev
- name: gcc
  commit: x86_64/pkg/core/toolchain/gcc/13.2.0/bundles/dev
- name: make
  commit: x86_64/pkg/core/toolchain/make/4.4.1/bundles/dev
- name: patch
  commit: x86_64/pkg/core/toolchain/patch/2.7.6/bundles/dev
- name: bash
  commit: x86_64/pkg/cli/shells/bash/5.2.21/bundles/dev
- name: coreutils
  commit: x86_64/pkg/core/userland/coreutils/9.5/bundles/dev
- name: findutils
  commit: x86_64/pkg/core/userland/findutils/4.9.0/bundles/dev
- name: sed
  commit: x86_64/pkg/cli/text/sed/4.9/bundles/dev
- name: tar
  commit: x86_64/pkg/cli/archive/tar/1.35/bundles/dev
- name: gzip
  commit: x86_64/pkg/cli/archive/gzip/1.13/bundles/dev
- name: grep
  commit: x86_64/pkg/cli/text/grep/3.11/bundles/dev
- name: gawk
  commit: x86_64/pkg/cli/text/gawk/5.3.0/bundles/dev

build:
  environment: 27b6e5dc7ad152c9a17c2cabfcc5ee93daa9bbf0
  profile: [4134:16478, 8502:31448, 12711:31569, 16944:31713, 21232:31919, 25349:32004, 29540:32125, 33685:33152, 37831:39393, 38449:39442]

  script: |
    tar --no-same-owner -xf ${SOURCE_readline} -C "${WORK_DIR}" --strip-components=1
    cd ${WORK_DIR}

    sed -i "/MV.*old/d" Makefile.in
    sed -i "/{OLDSUFF}/c:" support/shlib-install
    patch -Np1 -i /${SOURCE1}
    ./configure --prefix=/usr    \
              --docdir=/usr/share/doc/readline-8.2
    make SHLIB_LIBS="-lncurses"
    make SHLIB_LIBS="-lncurses" DESTDIR="${OUT_DIR}" install

    find ${OUT_DIR} -type f -executable -exec strip --strip-unneeded {} \; 2>/dev/null || true
    find ${OUT_DIR} -name '*.a' -exec objcopy --enable-deterministic-archives {} \; 2>/dev/null || true
    find "${OUT_DIR}" -exec touch -d "2024-01-01T00:00:00+00:00" {} \;

bundles:
  dev:
  - dev
  - lib
  - static

  full:
  - dev
  - doc
  - lib
  - man
  - misc
  - static

outputs:
  dev:
    files:
    - path: /usr/include/readline/chardefs.h
    - path: /usr/include/readline/history.h
    - path: /usr/include/readline/keymaps.h
    - path: /usr/include/readline/readline.h
    - path: /usr/include/readline/rlconf.h
    - path: /usr/include/readline/rlstdc.h
    - path: /usr/include/readline/rltypedefs.h
    - path: /usr/include/readline/tilde.h
    - path: /usr/lib/pkgconfig/history.pc
    - path: /usr/lib/pkgconfig/readline.pc

  doc:
    files:
    - path: /usr/share/doc/readline-8.2/CHANGES
    - path: /usr/share/doc/readline-8.2/INSTALL
    - path: /usr/share/doc/readline-8.2/README

  info:
    files:
    - path: /usr/share/info/history.info
    - path: /usr/share/info/readline.info
    - path: /usr/share/info/rluserman.info

  lib:
    files:
    - path: /usr/lib/libhistory.so
      needs:
      - /usr/lib/libc.so.6
    - path: /usr/lib/libhistory.so.8
      needs:
      - /usr/lib/libc.so.6
    - path: /usr/lib/libhistory.so.8.2
      needs:
      - /usr/lib/libc.so.6
    - path: /usr/lib/libreadline.so
      needs:
      - /usr/lib/libc.so.6
      - /usr/lib/libncursesw.so.6
    - path: /usr/lib/libreadline.so.8
      needs:
      - /usr/lib/libc.so.6
      - /usr/lib/libncursesw.so.6
    - path: /usr/lib/libreadline.so.8.2
      needs:
      - /usr/lib/libc.so.6
      - /usr/lib/libncursesw.so.6

  man:
    files:
    - path: /usr/share/man/man3/history.3
    - path: /usr/share/man/man3/readline.3

  misc:
    files:
    - path: /usr/share/readline/excallback.c
    - path: /usr/share/readline/fileman.c
    - path: /usr/share/readline/hist_erasedups.c
    - path: /usr/share/readline/hist_purgecmd.c
    - path: /usr/share/readline/histexamp.c
    - path: /usr/share/readline/manexamp.c
    - path: /usr/share/readline/rl-callbacktest.c
    - path: /usr/share/readline/rl-fgets.c
    - path: /usr/share/readline/rl-timeout.c
    - path: /usr/share/readline/rl.c
    - path: /usr/share/readline/rlbasic.c
    - path: /usr/share/readline/rlcat.c
    - path: /usr/share/readline/rlevent.c
    - path: /usr/share/readline/rlkeymaps.c
    - path: /usr/share/readline/rlptytest.c
    - path: /usr/share/readline/rltest.c
    - path: /usr/share/readline/rlversion.c

  static:
    files:
    - path: /usr/lib/libhistory.a
    - path: /usr/lib/libreadline.a

resolution:
  /usr/lib/libc.so.6: glibc
  /usr/lib/libncursesw.so.6: ncurses
