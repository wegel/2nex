package:
  schema: 1
  name: Readline
  slug: readline
  namespace: libs/system
  version: "8.2"
  description: The GNU Readline library
  homepage: https://tiswww.case.edu/php/chet/readline/rltop.html
  checksum: 122b49186da086b3d2e577dfff3fbd700c97cf4c5565f06a15cccd87caa248ac

sources:
- name: readline
  url: https://ftp.gnu.org/gnu/readline/readline-8.2.tar.gz
  sha256: 3feb7171f16a84ee82ca18a36d7b9be109a52c04f492a053331d7d1095007c35
- name: patch
  url: https://www.linuxfromscratch.org/patches/downloads/readline/readline-8.2-upstream_fixes-3.patch
  sha256: 8a108b34c5bdf9d6a9d6c0bd4cf2da756ae5232c5de2ae55c5468e953bb8de62

dependencies:
- name: bootstrap_tools
  commit: x86_64/pkg/bootstrap/phase1/bootstrap_tools/0.0.1/bundles/dev
- name: gmp-bootstrap
  commit: x86_64/pkg/bootstrap/phase3/gmp-bootstrap/6.3.0/bundles/dev
- name: mpfr
  commit: x86_64/pkg/bootstrap/phase3/mpfr/4.2.1/bundles/dev
- name: bash
  commit: x86_64/pkg/bootstrap/phase1/bash/5.2.21/bundles/dev
- name: findutils
  commit: x86_64/pkg/bootstrap/phase1/findutils/4.9.0/bundles/dev
- name: gawk
  commit: x86_64/pkg/bootstrap/phase1/gawk/5.3.0/bundles/dev
- name: grep
  commit: x86_64/pkg/bootstrap/phase1/grep/3.11/bundles/dev
- name: gzip
  commit: x86_64/pkg/bootstrap/phase1/gzip/1.13/bundles/dev
- name: make
  commit: x86_64/pkg/bootstrap/phase1/make/4.4.1/bundles/dev
- name: patch
  commit: x86_64/pkg/bootstrap/phase1/patch/2.7.6/bundles/dev
- name: sed
  commit: x86_64/pkg/bootstrap/phase1/sed/4.9/bundles/dev
- name: tar
  commit: x86_64/pkg/bootstrap/phase1/tar/1.35/bundles/dev
- name: binutils
  commit: x86_64/pkg/bootstrap/phase3/binutils/2.42/bundles/dev
- name: mpc
  commit: x86_64/pkg/bootstrap/phase3/mpc/1.2.1/bundles/dev
- name: gcc
  commit: x86_64/pkg/bootstrap/phase3/gcc/13.2.0/bundles/dev
- name: coreutils
  commit: x86_64/pkg/bootstrap/phase1/coreutils/9.5/bundles/dev
- name: ncurses
  commit: x86_64/pkg/bootstrap/phase1/ncurses/6.4-20230520/bundles/dev
- name: texinfo
  commit: x86_64/pkg/bootstrap/phase2/texinfo/7.1/bundles/dev
- name: zlib
  commit: x86_64/pkg/bootstrap/phase3/zlib/1.3.1/bundles/dev
- name: phase3
  commit: x86_64/pkg/bootstrap/phase3/2nex-utilities-bootstrap/0.0.1/bundles/dev
- name: bzip2
  commit: x86_64/pkg/bootstrap/phase3/bzip2/1.0.8/bundles/dev
- name: xz
  commit: x86_64/pkg/bootstrap/phase3/xz/5.4.6/bundles/dev
- name: file
  commit: x86_64/pkg/bootstrap/phase3/file/5.45/bundles/dev
- name: glibc
  commit: x86_64/pkg/libs/system/glibc/2.39/bundles/dev

build:
  profile: [4127:1584, 8225:2515, 12620:2520, 16757:2538, 20896:2601, 25257:2621, 29359:2651, 33469:2696, 37626:3288, 37696:3361]

  script: |
    tar --no-same-owner -xf ${SOURCE_readline} -C "${WORK_DIR}" --strip-components=1
    cd ${WORK_DIR}

    sed -i "/MV.*old/d" Makefile.in
    sed -i "/{OLDSUFF}/c:" support/shlib-install
    patch -Np1 -i /inputs/readline-8.2-upstream_fixes-3.patch
    ./configure --prefix=/usr    \
              --docdir=/usr/share/doc/readline-8.2
    make DESTDIR="${OUT_DIR}" install

    find "${OUT_DIR}" -exec touch -d '2024-01-01T00:00:00+00:00' {} \;
    2nex_strip_binaries ${OUT_DIR}

bundles:
  dev:
  - dev
  - lib
  - static

  full:
  - dev
  - doc
  - info
  - lib
  - man
  - misc
  - static

outputs:
  dev:
    files:
    - path: /usr/include/readline/chardefs.h
    - path: /usr/include/readline/history.h
    - path: /usr/include/readline/keymaps.h
    - path: /usr/include/readline/readline.h
    - path: /usr/include/readline/rlconf.h
    - path: /usr/include/readline/rlstdc.h
    - path: /usr/include/readline/rltypedefs.h
    - path: /usr/include/readline/tilde.h
    - path: /usr/lib/pkgconfig/history.pc
    - path: /usr/lib/pkgconfig/readline.pc

  doc:
    files:
    - path: /usr/share/doc/readline-8.2/CHANGES
    - path: /usr/share/doc/readline-8.2/INSTALL
    - path: /usr/share/doc/readline-8.2/README

  info:
    files:
    - path: /usr/share/info/dir
    - path: /usr/share/info/history.info
    - path: /usr/share/info/readline.info
    - path: /usr/share/info/rluserman.info

  lib:
    files:
    - path: /usr/lib/libhistory.so
    - path: /usr/lib/libhistory.so.8
    - path: /usr/lib/libhistory.so.8.2
    - path: /usr/lib/libreadline.so
    - path: /usr/lib/libreadline.so.8
    - path: /usr/lib/libreadline.so.8.2

  man:
    files:
    - path: /usr/share/man/man3/history.3
    - path: /usr/share/man/man3/readline.3

  misc:
    files:
    - path: /usr/share/readline/excallback.c
    - path: /usr/share/readline/fileman.c
    - path: /usr/share/readline/hist_erasedups.c
    - path: /usr/share/readline/hist_purgecmd.c
    - path: /usr/share/readline/histexamp.c
    - path: /usr/share/readline/manexamp.c
    - path: /usr/share/readline/rl-callbacktest.c
    - path: /usr/share/readline/rl-fgets.c
    - path: /usr/share/readline/rl-timeout.c
    - path: /usr/share/readline/rl.c
    - path: /usr/share/readline/rlbasic.c
    - path: /usr/share/readline/rlcat.c
    - path: /usr/share/readline/rlevent.c
    - path: /usr/share/readline/rlkeymaps.c
    - path: /usr/share/readline/rlptytest.c
    - path: /usr/share/readline/rltest.c
    - path: /usr/share/readline/rlversion.c

  static:
    files:
    - path: /usr/lib/libhistory.a
    - path: /usr/lib/libreadline.a
