build:
  environment: 27b6e5dc7ad152c9a17c2cabfcc5ee93daa9bbf0
  profile: [4120:1770, 12318:2641, 20514:5186, 32844:7772, 44785:12699, 53066:16412, 66449:23084, 78931:28061, 95428:28209, 103998:32230]

  script: |
    tar --no-same-owner -xzf /${SOURCE_icu} -C "${WORK_DIR}" --strip-components=1
    cd ${WORK_DIR}/source

    # unset TARGET as it conflicts with ICU's build system
    unset TARGET

    ./configure \
      --prefix=/usr \
      --sbindir=/usr/bin \
      --disable-samples \
      --disable-tests

    make
    make DESTDIR="${OUT_DIR}" install

    find ${OUT_DIR} -type f -executable -exec strip --strip-unneeded {} \; 2>/dev/null || true
    find ${OUT_DIR} -name '*.a' -exec objcopy --enable-deterministic-archives {} \; 2>/dev/null || true
    find "${OUT_DIR}" -exec touch -d "2024-01-01T00:00:00+00:00" {} \;

