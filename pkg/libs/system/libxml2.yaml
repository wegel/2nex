package:
  schema: 1
  name: libxml2
  slug: libxml2
  namespace: libs/system
  version: 2.13.5
  description: XML C parser and toolkit
  homepage: https://gitlab.gnome.org/GNOME/libxml2
  checksum: 5b62c29ad01dcf84ff92a0e2310ce596ba0125689c5af046e0aa1a81da532d4f

sources:
- name: libxml2
  url: https://download.gnome.org/sources/libxml2/2.13/libxml2-2.13.5.tar.xz
  sha256: 74fc163217a3964257d3be39af943e08861263c4231f9ef5b496b6f6d4c7b2b6

dependencies:
- name: linux-headers
  commit: x86_64/pkg/libs/system/linux-headers/6.4.1/bundles/dev
- name: glibc
  commit: x86_64/pkg/libs/system/glibc/2.39/bundles/dev
