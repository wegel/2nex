build:
  script: |
    tar --no-same-owner -xf ${SOURCE_ncurses} -C "${WORK_DIR}" --strip-components=1
    cd ${WORK_DIR}

    CFLAGS=
    CPPFLAGS=
    ./configure --prefix=/usr           \
            --mandir=/usr/share/man \
            --with-shared           \
            --without-debug         \
            --without-normal        \
            --with-cxx-shared       \
            --enable-pc-files       \
            --enable-widec          \
            --with-pkg-config-libdir=/usr/lib/pkgconfig
    make
    make DESTDIR=$OUT_DIR install

    for lib in ncurses form panel menu ; do
        rm -vf                    $OUT_DIR/usr/lib/lib${lib}.so
        echo "INPUT(-l${lib}w)" > $OUT_DIR/usr/lib/lib${lib}.so
        ln -sfv ${lib}w.pc        $OUT_DIR/usr/lib/pkgconfig/${lib}.pc
    done

    rm -vf                     $OUT_DIR/usr/lib/libcursesw.so
    echo "INPUT(-lncursesw)" > $OUT_DIR/usr/lib/libcursesw.so
    ln -sfv libncurses.so      $OUT_DIR/usr/lib/libcurses.so

    mkdir -pv      $OUT_DIR/usr/share/doc/ncurses-6.4
    cp -v -R doc/* $OUT_DIR/usr/share/doc/ncurses-6.4

    find "${OUT_DIR}" -exec touch -d "2024-01-01T00:00:00+00:00" {} \;
    2nex_strip_binaries ${OUT_DIR}
bundles:
  dev:
  - dev
  - bin
  - lib
  - terminfo
  full:
  - doc
  - man
  - dev
  - bin
  - lib
  - terminfo
