package:
  schema: 1
  name: libeconf
  slug: libeconf
  namespace: libs/system
  version: 0.8.4
  description: Library for merging key-value configuration from vendor and administrator directories
  homepage: https://github.com/openSUSE/libeconf
  checksum: 451fa06240d6c696adb3ad2dbe520547acf7cd5b7af9332dde0d553765e3585a

sources:
- name: libeconf
  url: https://github.com/openSUSE/libeconf/archive/refs/tags/v0.8.4.tar.gz
  sha256: 7c311d55237f1fc6ac437caca194d170c9cae314235d60a9fbf11e980114e25e

dependencies:
- name: glibc
  commit: x86_64/pkg/libs/system/glibc/2.39/bundles/dev
- name: gcc
  commit: x86_64/pkg/core/toolchain/gcc/13.2.0/bundles/dev
- name: binutils
  commit: x86_64/pkg/core/toolchain/binutils/2.42/bundles/dev
- name: bash
  commit: x86_64/pkg/cli/shells/bash/5.2.21/bundles/dev
- name: coreutils
  commit: x86_64/pkg/core/userland/coreutils/9.5/bundles/dev
- name: findutils
  commit: x86_64/pkg/core/userland/findutils/4.9.0/bundles/dev
- name: tar
  commit: x86_64/pkg/cli/archive/tar/1.35/bundles/dev
- name: gzip
  commit: x86_64/pkg/cli/archive/gzip/1.13/bundles/dev
- name: meson
  commit: x86_64/pkg/core/toolchain/meson/1.6.1/bundles/dev
- name: ninja
  commit: x86_64/pkg/core/toolchain/ninja/1.12.1/bundles/dev
- name: python3
  commit: x86_64/pkg/dev/lang/python3/3.12.2/bundles/dev
- name: linux-headers
  commit: x86_64/pkg/libs/system/linux-headers/6.4.1/bundles/dev
- name: ncurses
  commit: x86_64/pkg/libs/system/ncurses/6.4-20230520/bundles/dev
- name: acl
  commit: x86_64/pkg/libs/system/acl/2.3.2/bundles/dev
- name: attr
  commit: x86_64/pkg/libs/system/attr/2.5.2/bundles/dev
- name: zlib
  commit: x86_64/pkg/libs/system/zlib/1.3.1/bundles/dev

build:
  environment: 27b6e5dc7ad152c9a17c2cabfcc5ee93daa9bbf0
  profile: [4121:1031, 8254:1136, 12393:1931, 16511:2171, 20623:2613, 24733:2854, 27003:2934]

  script: |
    tar --no-same-owner -xf /${SOURCE_libeconf} -C "${WORK_DIR}" --strip-components=1
    cd "${WORK_DIR}"

    meson setup build \
      --prefix=/usr \
      --libdir=lib \
      --buildtype=release

    ninja -C build
    meson test -C build --print-errorlogs
    DESTDIR="${OUT_DIR}" ninja -C build install

    find "${OUT_DIR}" -type f -executable -exec strip --strip-unneeded {} \; 2>/dev/null || true
    find "${OUT_DIR}" -exec touch -d "2024-01-01T00:00:00+00:00" {} \;

bundles:
  dev:
  - dev
  - lib

  full:
  - bin
  - dev
  - lib
  - man

outputs:
  bin:
    files:
    - path: /usr/bin/econftool
      needs:
      - /usr/lib/ld-linux-x86-64.so.2
      - /usr/lib/libc.so.6
      - /usr/lib/libeconf.so.0
      - /usr/lib/libgcc_s.so.1

  dev:
    files:
    - path: /usr/include/libeconf.h
    - path: /usr/include/libeconf_ext.h
    - path: /usr/lib/pkgconfig/libeconf.pc

  lib:
    files:
    - path: /usr/lib/libeconf.so
      needs:
      - /usr/lib/libc.so.6
    - path: /usr/lib/libeconf.so.0
      needs:
      - /usr/lib/libc.so.6
    - path: /usr/lib/libeconf.so.0.8.4
      needs:
      - /usr/lib/libc.so.6

  man:
    files:
    - path: /usr/share/man/man3/econf_comment_tag.3
    - path: /usr/share/man/man3/econf_delimiter_tag.3
    - path: /usr/share/man/man3/econf_errLocation.3
    - path: /usr/share/man/man3/econf_errString.3
    - path: /usr/share/man/man3/econf_freeArray.3
    - path: /usr/share/man/man3/econf_freeExtValue.3
    - path: /usr/share/man/man3/econf_freeFile.3
    - path: /usr/share/man/man3/econf_getBoolValue.3
    - path: /usr/share/man/man3/econf_getBoolValueDef.3
    - path: /usr/share/man/man3/econf_getDoubleValue.3
    - path: /usr/share/man/man3/econf_getDoubleValueDef.3
    - path: /usr/share/man/man3/econf_getExtValue.3
    - path: /usr/share/man/man3/econf_getFloatValue.3
    - path: /usr/share/man/man3/econf_getFloatValueDef.3
    - path: /usr/share/man/man3/econf_getGroups.3
    - path: /usr/share/man/man3/econf_getInt64Value.3
    - path: /usr/share/man/man3/econf_getInt64ValueDef.3
    - path: /usr/share/man/man3/econf_getIntValue.3
    - path: /usr/share/man/man3/econf_getIntValueDef.3
    - path: /usr/share/man/man3/econf_getKeys.3
    - path: /usr/share/man/man3/econf_getPath.3
    - path: /usr/share/man/man3/econf_getStringValue.3
    - path: /usr/share/man/man3/econf_getStringValueDef.3
    - path: /usr/share/man/man3/econf_getUInt64Value.3
    - path: /usr/share/man/man3/econf_getUInt64ValueDef.3
    - path: /usr/share/man/man3/econf_getUIntValue.3
    - path: /usr/share/man/man3/econf_getUIntValueDef.3
    - path: /usr/share/man/man3/econf_getValue.3
    - path: /usr/share/man/man3/econf_getValueDef.3
    - path: /usr/share/man/man3/econf_mergeFiles.3
    - path: /usr/share/man/man3/econf_newIniFile.3
    - path: /usr/share/man/man3/econf_newKeyFile.3
    - path: /usr/share/man/man3/econf_readConfig.3
    - path: /usr/share/man/man3/econf_readConfigWithCallback.3
    - path: /usr/share/man/man3/econf_readFile.3
    - path: /usr/share/man/man3/econf_readFileWithCallback.3
    - path: /usr/share/man/man3/econf_setBoolValue.3
    - path: /usr/share/man/man3/econf_setDoubleValue.3
    - path: /usr/share/man/man3/econf_setExtValue.3
    - path: /usr/share/man/man3/econf_setFloatValue.3
    - path: /usr/share/man/man3/econf_setInt64Value.3
    - path: /usr/share/man/man3/econf_setIntValue.3
    - path: /usr/share/man/man3/econf_setStringValue.3
    - path: /usr/share/man/man3/econf_setUInt64Value.3
    - path: /usr/share/man/man3/econf_setValue.3
    - path: /usr/share/man/man3/econf_set_comment_tag.3
    - path: /usr/share/man/man3/econf_set_conf_dirs.3
    - path: /usr/share/man/man3/econf_set_delimiter_tag.3
    - path: /usr/share/man/man3/econf_writeFile.3
    - path: /usr/share/man/man3/libeconf.3
    - path: /usr/share/man/man8/econftool.8

resolution:
  /usr/lib/libgcc_s.so.1: gcc
  /usr/lib/ld-linux-x86-64.so.2: glibc
  /usr/lib/libc.so.6: glibc
  /usr/lib/libeconf.so.0: self
