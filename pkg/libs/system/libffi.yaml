package:
  schema: 1
  name: libffi
  slug: libffi
  namespace: libs/system
  version: 3.4.6
  description: A portable foreign-function interface library.
  homepage: https://github.com/libffi/libffi
  checksum: 213ef92ecaf5beda970f6d85ffa7315af1df33e00d88a20c1e5a5509f7e50a16

sources:
- name: libffi
  url: https://github.com/libffi/libffi/releases/download/v3.4.6/libffi-3.4.6.tar.gz
  sha256: b0dea9df23c863a7a50e825440f3ebffabd65df1497108e5d437747843895a4e

dependencies:
- name: findutils
  commit: x86_64/pkg/bootstrap/phase1/findutils/4.9.0/bundles/dev
- name: bash
  commit: x86_64/pkg/bootstrap/phase1/bash/5.2.21/bundles/dev
- name: 2nex-utilities-bootstrap
  commit: x86_64/pkg/bootstrap/phase3/2nex-utilities-bootstrap/0.0.1/bundles/dev
- name: gawk
  commit: x86_64/pkg/bootstrap/phase1/gawk/5.3.0/bundles/dev
- name: gzip
  commit: x86_64/pkg/bootstrap/phase1/gzip/1.13/bundles/dev
- name: make
  commit: x86_64/pkg/bootstrap/phase1/make/4.4.1/bundles/dev
- name: tar
  commit: x86_64/pkg/bootstrap/phase1/tar/1.35/bundles/dev
- name: bootstrap_tools
  commit: x86_64/pkg/bootstrap/phase1/bootstrap_tools/0.0.1/bundles/dev
- name: coreutils
  commit: x86_64/pkg/bootstrap/phase1/coreutils/9.5/outputs/bin
- name: texinfo
  commit: x86_64/pkg/bootstrap/phase2/texinfo/7.1/bundles/dev
- name: bzip2
  commit: x86_64/pkg/bootstrap/phase3/bzip2/1.0.8/outputs/lib
- name: xz
  commit: x86_64/pkg/bootstrap/phase3/xz/5.4.6/outputs/lib
- name: zlib
  commit: x86_64/pkg/bootstrap/phase3/zlib/1.3.1/outputs/lib
- name: file
  commit: x86_64/pkg/bootstrap/phase3/file/5.45/bundles/dev
- name: binutils
  commit: x86_64/pkg/bootstrap/phase3/binutils/2.42/bundles/dev
- name: gmp-bootstrap
  commit: x86_64/pkg/bootstrap/phase3/gmp-bootstrap/6.3.0/outputs/lib
- name: mpfr
  commit: x86_64/pkg/bootstrap/phase3/mpfr/4.2.1/outputs/lib
- name: mpc
  commit: x86_64/pkg/bootstrap/phase3/mpc/1.2.1/outputs/lib
- name: gcc
  commit: x86_64/pkg/bootstrap/phase3/gcc/13.2.0/bundles/dev
- name: sed
  commit: x86_64/pkg/bootstrap/phase1/sed/4.9/bundles/dev
- name: grep
  commit: x86_64/pkg/bootstrap/phase1/grep/3.11/bundles/dev
- name: glibc
  commit: x86_64/pkg/libs/system/glibc/2.39/bundles/dev

build:
  environment: 13ce31fd97c19f5756e4413babf279d543b5a71c
  profile: [4104:997, 8502:2543, 12983:2546, 17288:2575, 21636:2591, 26056:2745, 30192:3273, 31385:3335]

  script: |
    tar --no-same-owner -xf ${SOURCE0} -C "${WORK_DIR}" --strip-components=1
    cd ${WORK_DIR}

    ./configure --prefix=/usr      \
            --with-gcc-arch=x86-64-v3

    make
    make DESTDIR=$OUT_DIR install

    find "${OUT_DIR}" -exec touch -d "2024-01-01T00:00:00+00:00" {} \;
    2nex_strip_binaries ${OUT_DIR}

bundles:
  dev:
  - dev
  - lib
  - static

  full:
  - dev
  - info
  - lib
  - man
  - static

outputs:
  dev:
    files:
    - path: /usr/include/ffi.h
    - path: /usr/include/ffitarget.h
    - path: /usr/lib/libffi.la
    - path: /usr/lib/pkgconfig/libffi.pc

  info:
    files:
    - path: /usr/share/info/dir
    - path: /usr/share/info/libffi.info

  lib:
    files:
    - path: /usr/lib/libffi.so
      needs:
      - /usr/lib/libc.so.6
    - path: /usr/lib/libffi.so.8
      needs:
      - /usr/lib/libc.so.6
    - path: /usr/lib/libffi.so.8.1.4
      needs:
      - /usr/lib/libc.so.6

  man:
    files:
    - path: /usr/share/man/man3/ffi.3
    - path: /usr/share/man/man3/ffi_call.3
    - path: /usr/share/man/man3/ffi_prep_cif.3
    - path: /usr/share/man/man3/ffi_prep_cif_var.3

  static:
    files:
    - path: /usr/lib/libffi.a

resolution:
  /usr/lib/libc.so.6: glibc
