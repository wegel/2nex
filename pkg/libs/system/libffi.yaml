package:
  schema: 1
  name: libffi
  slug: libffi
  namespace: libs/system
  version: 3.4.6
  description: A portable foreign-function interface library.
  homepage: https://github.com/libffi/libffi
  checksum: 2f0c6e41a73427c8941b840e7f3f15a76d8ea8f28764bc07965fea5477ece69d
  seed: true

sources:
- name: libffi
  url: https://github.com/libffi/libffi/releases/download/v3.4.6/libffi-3.4.6.tar.gz
  sha256: b0dea9df23c863a7a50e825440f3ebffabd65df1497108e5d437747843895a4e

dependencies:
- name: linux-headers
  commit: x86_64/pkg/bootstrap/phase3/linux-headers/6.4.1/bundles/dev
- name: glibc
  commit: x86_64/pkg/libs/system/glibc/2.39/bundles/dev
- name: binutils
  commit: x86_64/pkg/bootstrap/phase3/binutils/2.42/bundles/dev
- name: gcc
  commit: x86_64/pkg/bootstrap/phase3/gcc/13.2.0/bundles/dev
- name: zlib
  commit: x86_64/pkg/bootstrap/phase3/zlib/1.3.1/bundles/dev
- name: texinfo
  commit: x86_64/pkg/cli/text/texinfo/7.1/bundles/dev
- name: bash
  commit: x86_64/pkg/bootstrap/phase3/bash/5.2.21/bundles/dev
- name: coreutils
  commit: x86_64/pkg/bootstrap/phase3/coreutils/9.5/bundles/dev
- name: findutils
  commit: x86_64/pkg/bootstrap/phase3/findutils/4.9.0/bundles/dev
- name: gawk
  commit: x86_64/pkg/bootstrap/phase3/gawk/5.3.0/bundles/dev
- name: grep
  commit: x86_64/pkg/bootstrap/phase3/grep/3.11/bundles/dev
- name: gzip
  commit: x86_64/pkg/bootstrap/phase3/gzip/1.13/bundles/dev
- name: make
  commit: x86_64/pkg/bootstrap/phase3/make/4.4.1/bundles/dev
- name: sed
  commit: x86_64/pkg/bootstrap/phase3/sed/4.9/bundles/dev
- name: tar
  commit: x86_64/pkg/bootstrap/phase3/tar/1.35/bundles/dev
- name: xz
  commit: x86_64/pkg/bootstrap/phase3/xz/5.4.6/bundles/dev

build:
  environment: 27b6e5dc7ad152c9a17c2cabfcc5ee93daa9bbf0
  profile: [4128:922, 8225:2630, 12706:2645, 17015:2674, 21112:2706, 25779:2904, 29968:3520, 30816:3553]

  script: |
    tar --no-same-owner -xf ${SOURCE0} -C "${WORK_DIR}" --strip-components=1
    cd ${WORK_DIR}

    ./configure --prefix=/usr      \
            --with-gcc-arch=x86-64-v3

    make
    make DESTDIR=$OUT_DIR install

    find ${OUT_DIR} -type f -executable -exec strip --strip-unneeded {} \; 2>/dev/null || true
    find ${OUT_DIR} -name '*.a' -exec objcopy --enable-deterministic-archives {} \; 2>/dev/null || true
    find "${OUT_DIR}" -exec touch -d "2024-01-01T00:00:00+00:00" {} \;

bundles:
  dev:
  - dev
  - lib
  - static

  full:
  - dev
  - info
  - lib
  - man
  - static

outputs:
  dev:
    files:
    - path: /usr/include/ffi.h
    - path: /usr/include/ffitarget.h
    - path: /usr/lib/libffi.la
    - path: /usr/lib/pkgconfig/libffi.pc

  info:
    files:
    - path: /usr/share/info/dir
    - path: /usr/share/info/libffi.info

  lib:
    files:
    - path: /usr/lib/libffi.so
      needs:
      - /usr/lib/libc.so.6
    - path: /usr/lib/libffi.so.8
      needs:
      - /usr/lib/libc.so.6
    - path: /usr/lib/libffi.so.8.1.4
      needs:
      - /usr/lib/libc.so.6

  man:
    files:
    - path: /usr/share/man/man3/ffi.3
    - path: /usr/share/man/man3/ffi_call.3
    - path: /usr/share/man/man3/ffi_prep_cif.3
    - path: /usr/share/man/man3/ffi_prep_cif_var.3

  static:
    files:
    - path: /usr/lib/libffi.a

resolution:
  /usr/lib/libc.so.6: glibc
