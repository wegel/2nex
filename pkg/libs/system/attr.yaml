package:
  schema: 1
  name: Attr
  slug: attr
  namespace: libs/system
  version: 2.5.2
  description: Utilities for manipulating filesystem extended attributes
  homepage: https://savannah.nongnu.org/projects/attr
  checksum: 2fba331aba23c967ea505c421dafcf8292abd130d4b69a37077e2377599e7d1f
  seed: true

sources:
- name: attr
  url: https://download.savannah.nongnu.org/releases/attr/attr-2.5.2.tar.xz
  sha256: f2e97b0ab7ce293681ab701915766190d607a1dba7fae8a718138150b700a70b
- name: uapi_config
  file: pkg/libs/system/attr-uapi-config.patch
  sha256: e3c468b1ba29ed573bdf8424c880884dce9c5db6b847c9094faa088db83ec1a6

dependencies:
- name: linux-headers
  commit: x86_64/pkg/bootstrap/phase1/linux-headers/6.4.1/bundles/dev
- name: glibc
  commit: x86_64/pkg/libs/system/glibc/2.39/bundles/dev
- name: binutils
  commit: x86_64/pkg/bootstrap/phase1/binutils/2.42/bundles/dev
- name: gcc
  commit: x86_64/pkg/bootstrap/phase1/gcc/13.2.0/bundles/dev
- name: zlib
  commit: x86_64/pkg/bootstrap/phase1/zlib/1.3.1/bundles/dev
- name: bash
  commit: x86_64/pkg/bootstrap/phase1/bash/5.2.21/bundles/dev
- name: coreutils
  commit: x86_64/pkg/bootstrap/phase1/coreutils/9.5/bundles/dev
- name: findutils
  commit: x86_64/pkg/bootstrap/phase1/findutils/4.9.0/bundles/dev
- name: gawk
  commit: x86_64/pkg/bootstrap/phase1/gawk/5.3.0/bundles/dev
- name: grep
  commit: x86_64/pkg/bootstrap/phase1/grep/3.11/bundles/dev
- name: make
  commit: x86_64/pkg/bootstrap/phase1/make/4.4.1/bundles/dev
- name: patch
  commit: x86_64/pkg/bootstrap/phase1/patch/2.7.6/bundles/dev
- name: sed
  commit: x86_64/pkg/bootstrap/phase1/sed/4.9/bundles/dev
- name: tar
  commit: x86_64/pkg/bootstrap/phase1/tar/1.35/bundles/dev
- name: xz
  commit: x86_64/pkg/bootstrap/phase1/xz/5.4.6/bundles/dev

build:
  environment: 27b6e5dc7ad152c9a17c2cabfcc5ee93daa9bbf0
  profile: [4099:907, 8415:1889, 11944:2041]

  script: |
    tar --no-same-owner -xf ${SOURCE_attr} -C "${WORK_DIR}" --strip-components=1
    cd ${WORK_DIR}

    patch -Np1 --batch --fuzz=0 < "/${SOURCE_uapi_config}"

    ./configure --prefix=/usr     \
              --sysconfdir=/etc \
              --docdir=/usr/share/doc/attr-2.5.2

    make
    make DESTDIR="${OUT_DIR}" install

    install -Dm644 "${OUT_DIR}/etc/xattr.conf" "${OUT_DIR}/usr/lib/xattr.conf"
    rm "${OUT_DIR}/etc/xattr.conf"
    rmdir "${OUT_DIR}/etc"

    cat > "${WORK_DIR}/attr-uapi-smoke.c" << 'EOF'
    #include <attr/libattr.h>
    #include <stdlib.h>

    int main(int argc, char **argv)
    {
        int expected;

        if (argc != 3)
            return 2;
        expected = atoi(argv[2]);
        return attr_copy_action(argv[1], NULL) == expected ? 0 : 1;
    }
    EOF
    gcc ${CFLAGS} ${LDFLAGS} \
      -I"${OUT_DIR}/usr/include" \
      -L"${OUT_DIR}/usr/lib" \
      -Wl,-rpath,"${OUT_DIR}/usr/lib" \
      -o "${WORK_DIR}/attr-uapi-smoke" \
      "${WORK_DIR}/attr-uapi-smoke.c" -lattr

    mkdir -p /etc /run
    rm -f /etc/xattr.conf /run/xattr.conf /usr/lib/xattr.conf
    printf 'user.uapi skip\n' > /usr/lib/xattr.conf
    "${WORK_DIR}/attr-uapi-smoke" user.uapi 1
    printf 'user.uapi permissions\n' > /run/xattr.conf
    "${WORK_DIR}/attr-uapi-smoke" user.uapi 2
    printf 'user.uapi skip\n' > /etc/xattr.conf
    "${WORK_DIR}/attr-uapi-smoke" user.uapi 1
    : > /etc/xattr.conf
    "${WORK_DIR}/attr-uapi-smoke" user.uapi 0
    rm -f /etc/xattr.conf /run/xattr.conf /usr/lib/xattr.conf
    "${WORK_DIR}/attr-uapi-smoke" user.uapi 0

    find ${OUT_DIR} -type f -executable -exec strip --strip-unneeded {} \; 2>/dev/null || true
    find ${OUT_DIR} -name '*.a' -exec objcopy --enable-deterministic-archives {} \; 2>/dev/null || true
    find "${OUT_DIR}" -exec touch -d '2024-01-01T00:00:00+00:00' {} \;

bundles:
  dev:
  - bin
  - conf
  - dev
  - lib
  - static

  full:
  - bin
  - conf
  - dev
  - doc
  - lib
  - locale
  - man
  - static

outputs:
  bin:
    files:
    - path: /usr/bin/attr
      needs:
      - /usr/lib/ld-linux-x86-64.so.2
      - /usr/lib/libattr.so.1
      - /usr/lib/libc.so.6
    - path: /usr/bin/getfattr
      needs:
      - /usr/lib/ld-linux-x86-64.so.2
      - /usr/lib/libc.so.6
    - path: /usr/bin/setfattr
      needs:
      - /usr/lib/ld-linux-x86-64.so.2
      - /usr/lib/libc.so.6

  conf:
    files:
    - path: /usr/lib/xattr.conf

  dev:
    files:
    - path: /usr/include/attr/attributes.h
    - path: /usr/include/attr/error_context.h
    - path: /usr/include/attr/libattr.h
    - path: /usr/lib/libattr.la
    - path: /usr/lib/pkgconfig/libattr.pc

  doc:
    files:
    - path: /usr/share/doc/attr-2.5.2/CHANGES
    - path: /usr/share/doc/attr-2.5.2/COPYING
    - path: /usr/share/doc/attr-2.5.2/COPYING.LGPL

  lib:
    files:
    - path: /usr/lib/libattr.so
      needs:
      - /usr/lib/libc.so.6
    - path: /usr/lib/libattr.so.1
      needs:
      - /usr/lib/libc.so.6
    - path: /usr/lib/libattr.so.1.1.2502
      needs:
      - /usr/lib/libc.so.6

  locale:
    files:
    - path: /usr/share/locale/cs/LC_MESSAGES/attr.mo
    - path: /usr/share/locale/de/LC_MESSAGES/attr.mo
    - path: /usr/share/locale/en@boldquot/LC_MESSAGES/attr.mo
    - path: /usr/share/locale/en@quot/LC_MESSAGES/attr.mo
    - path: /usr/share/locale/es/LC_MESSAGES/attr.mo
    - path: /usr/share/locale/fr/LC_MESSAGES/attr.mo
    - path: /usr/share/locale/gl/LC_MESSAGES/attr.mo
    - path: /usr/share/locale/ka/LC_MESSAGES/attr.mo
    - path: /usr/share/locale/nl/LC_MESSAGES/attr.mo
    - path: /usr/share/locale/pl/LC_MESSAGES/attr.mo
    - path: /usr/share/locale/sv/LC_MESSAGES/attr.mo

  man:
    files:
    - path: /usr/share/man/man1/attr.1
    - path: /usr/share/man/man1/getfattr.1
    - path: /usr/share/man/man1/setfattr.1
    - path: /usr/share/man/man3/attr_get.3
    - path: /usr/share/man/man3/attr_getf.3
    - path: /usr/share/man/man3/attr_list.3
    - path: /usr/share/man/man3/attr_listf.3
    - path: /usr/share/man/man3/attr_multi.3
    - path: /usr/share/man/man3/attr_multif.3
    - path: /usr/share/man/man3/attr_remove.3
    - path: /usr/share/man/man3/attr_removef.3
    - path: /usr/share/man/man3/attr_set.3
    - path: /usr/share/man/man3/attr_setf.3

  static:
    files:
    - path: /usr/lib/libattr.a

resolution:
  /usr/lib/ld-linux-x86-64.so.2: glibc
  /usr/lib/libc.so.6: glibc
  /usr/lib/libattr.so.1: self
