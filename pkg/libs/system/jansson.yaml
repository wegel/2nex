package:
  schema: 1
  name: jansson
  slug: jansson
  namespace: libs/system
  version: 2.14.1
  description: C library for encoding, decoding and manipulating JSON data
  homepage: https://github.com/akheron/jansson
  checksum: cc53453c0cbbf14a4fc178b46af583eab491c586a155e6c7d75187c7affa11e7

sources:
- name: jansson
  url: https://github.com/akheron/jansson/releases/download/v2.14.1/jansson-2.14.1.tar.bz2
  sha256: 6bd82d3043dadbcd58daaf903d974891128d22aab7dada5d399cb39094af49ce

dependencies:
- name: glibc
  commit: x86_64/pkg/libs/system/glibc/2.39/bundles/dev
- name: gcc
  commit: x86_64/pkg/core/toolchain/gcc/13.2.0/bundles/dev
- name: binutils
  commit: x86_64/pkg/core/toolchain/binutils/2.42/bundles/dev
- name: make
  commit: x86_64/pkg/core/toolchain/make/4.4.1/bundles/dev
- name: bash
  commit: x86_64/pkg/cli/shells/bash/5.2.21/bundles/dev
- name: coreutils
  commit: x86_64/pkg/core/userland/coreutils/9.5/bundles/dev
- name: findutils
  commit: x86_64/pkg/core/userland/findutils/4.9.0/bundles/dev
- name: tar
  commit: x86_64/pkg/cli/archive/tar/1.35/bundles/dev
- name: bzip2
  commit: x86_64/pkg/libs/compression/bzip2/1.0.8/bundles/dev
- name: ncurses
  commit: x86_64/pkg/libs/system/ncurses/6.4-20230520/bundles/dev
- name: acl
  commit: x86_64/pkg/libs/system/acl/2.3.2/bundles/dev
- name: attr
  commit: x86_64/pkg/libs/system/attr/2.5.2/bundles/dev
- name: gmp
  commit: x86_64/pkg/libs/system/gmp/6.3.0/bundles/dev
- name: sed
  commit: x86_64/pkg/cli/text/sed/4.9/bundles/dev
- name: grep
  commit: x86_64/pkg/cli/text/grep/3.11/bundles/dev
- name: libcap
  commit: x86_64/pkg/libs/security/libcap/2.69/bundles/dev
- name: gawk
  commit: x86_64/pkg/cli/text/gawk/5.3.0/bundles/dev
- name: zlib
  commit: x86_64/pkg/libs/system/zlib/1.3.1/bundles/dev
- name: linux-headers
  commit: x86_64/pkg/libs/system/linux-headers/6.4.1/bundles/dev

build:
  environment: 27b6e5dc7ad152c9a17c2cabfcc5ee93daa9bbf0
  profile: [4123:919, 8284:2175, 12774:2176, 17134:2203, 21488:2803, 25626:2885, 26535:2900]

  script: |
    CFLAGS=${CFLAGS/-flto=auto/}
    CXXFLAGS=${CXXFLAGS/-flto=auto/}
    LDFLAGS=${LDFLAGS/-flto=auto/}

    tar --no-same-owner -xjf ${SOURCE0} -C "${WORK_DIR}" --strip-components=1
    cd ${WORK_DIR}

    ./configure \
      --prefix=/usr \
      --disable-static

    make
    make DESTDIR=${OUT_DIR} install

    find ${OUT_DIR} -type f -executable -exec strip --strip-unneeded {} \; 2>/dev/null || true
    find ${OUT_DIR} -name '*.la' -delete
    find "${OUT_DIR}" -exec touch -d "2024-01-01T00:00:00+00:00" {} \;

bundles:
  dev:
  - dev
  - lib

outputs:
  dev:
    files:
    - path: /usr/include/jansson.h
    - path: /usr/include/jansson_config.h
    - path: /usr/lib/pkgconfig/jansson.pc

  lib:
    files:
    - path: /usr/lib/libjansson.so
      needs:
      - /usr/lib/libc.so.6
    - path: /usr/lib/libjansson.so.4
      needs:
      - /usr/lib/libc.so.6
    - path: /usr/lib/libjansson.so.4.14.1
      needs:
      - /usr/lib/libc.so.6

resolution:
  /usr/lib/libc.so.6: glibc
