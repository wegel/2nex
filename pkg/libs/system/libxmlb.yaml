package:
  schema: 1
  name: libxmlb
  slug: libxmlb
  namespace: libs/system
  version: 0.3.24
  description: XML binary database library
  homepage: https://github.com/hughsie/libxmlb
  checksum: cdf479948c0e759d8fe90ad896abadec9c2ce203d165eb0520fc82d9783c816b

sources:
- name: libxmlb
  url: https://github.com/hughsie/libxmlb/releases/download/0.3.24/libxmlb-0.3.24.tar.xz
  sha256: ded52667aac942bb1ff4d1e977e8274a9432d99033d86918feb82ade82b8e001

dependencies:
- name: glibc
  commit: x86_64/pkg/libs/system/glibc/2.39/bundles/dev
- name: gcc
  commit: x86_64/pkg/core/toolchain/gcc/13.2.0/bundles/dev
- name: binutils
  commit: x86_64/pkg/core/toolchain/binutils/2.42/bundles/dev
- name: meson
  commit: x86_64/pkg/core/toolchain/meson/1.6.1/bundles/dev
- name: ninja
  commit: x86_64/pkg/core/toolchain/ninja/1.12.1/bundles/dev
- name: python3
  commit: x86_64/pkg/dev/lang/python3/3.12.2/bundles/dev
- name: pkgconf
  commit: x86_64/pkg/core/toolchain/pkgconf/2.2.0/bundles/dev
- name: bash
  commit: x86_64/pkg/cli/shells/bash/5.2.21/bundles/dev
- name: ncurses
  commit: x86_64/pkg/libs/system/ncurses/6.4-20230520/bundles/dev
- name: acl
  commit: x86_64/pkg/libs/system/acl/2.3.2/bundles/dev
- name: attr
  commit: x86_64/pkg/libs/system/attr/2.5.2/bundles/dev
- name: tar
  commit: x86_64/pkg/cli/archive/tar/1.35/bundles/dev
- name: xz
  commit: x86_64/pkg/libs/compression/xz/5.4.6/bundles/dev
- name: findutils
  commit: x86_64/pkg/core/userland/findutils/4.9.0/bundles/dev
- name: linux-headers
  commit: x86_64/pkg/libs/system/linux-headers/6.4.1/bundles/dev
- name: gmp
  commit: x86_64/pkg/libs/system/gmp/6.3.0/bundles/dev
- name: zlib
  commit: x86_64/pkg/libs/system/zlib/1.3.1/bundles/dev
- name: glib2
  commit: x86_64/pkg/dev/libs/glib2/2.84.0/bundles/dev
- name: libffi
  commit: x86_64/pkg/libs/system/libffi/3.4.6/bundles/dev
- name: pcre2
  commit: x86_64/pkg/dev/libs/pcre2/10.44/bundles/dev
- name: util-linux
  commit: x86_64/pkg/core/userland/util_linux/2.40/bundles/dev
- name: zstd
  commit: x86_64/pkg/libs/compression/zstd/1.5.6/bundles/dev

build:
  environment: 27b6e5dc7ad152c9a17c2cabfcc5ee93daa9bbf0
  profile: [4097:1262, 8243:1503, 10916:3208]

  script: |
    tar --no-same-owner -xf /${SOURCE_libxmlb} -C "${WORK_DIR}" --strip-components=1
    cd ${WORK_DIR}

    meson setup build \
      --prefix=/usr \
      --libdir=lib \
      --buildtype=release \
      -Dgtkdoc=false \
      -Dintrospection=false \
      -Dtests=false \
      -Dstemmer=false \
      -Dcli=true

    ninja -C build
    DESTDIR="${OUT_DIR}" ninja -C build install

    find ${OUT_DIR} -type f -executable -exec strip --strip-unneeded {} \; 2>/dev/null || true
    find ${OUT_DIR} -name '*.a' -exec objcopy --enable-deterministic-archives {} \; 2>/dev/null || true
    find "${OUT_DIR}" -exec touch -d "2024-01-01T00:00:00+00:00" {} \;

bundles:
  dev:
  - bin
  - dev
  - lib

outputs:
  bin:
    files:
    - path: /usr/bin/xb-tool
      needs:
      - /usr/lib/ld-linux-x86-64.so.2
      - /usr/lib/libc.so.6
      - /usr/lib/libgcc_s.so.1
      - /usr/lib/libgio-2.0.so.0
      - /usr/lib/libglib-2.0.so.0
      - /usr/lib/libgobject-2.0.so.0
      - /usr/lib/libxmlb.so.2

  dev:
    files:
    - path: /usr/include/libxmlb-2/libxmlb/xb-builder-fixup.h
    - path: /usr/include/libxmlb-2/libxmlb/xb-builder-node.h
    - path: /usr/include/libxmlb-2/libxmlb/xb-builder-source-ctx.h
    - path: /usr/include/libxmlb-2/libxmlb/xb-builder-source.h
    - path: /usr/include/libxmlb-2/libxmlb/xb-builder.h
    - path: /usr/include/libxmlb-2/libxmlb/xb-compile.h
    - path: /usr/include/libxmlb-2/libxmlb/xb-machine.h
    - path: /usr/include/libxmlb-2/libxmlb/xb-node-query.h
    - path: /usr/include/libxmlb-2/libxmlb/xb-node-silo.h
    - path: /usr/include/libxmlb-2/libxmlb/xb-node.h
    - path: /usr/include/libxmlb-2/libxmlb/xb-opcode.h
    - path: /usr/include/libxmlb-2/libxmlb/xb-query-context.h
    - path: /usr/include/libxmlb-2/libxmlb/xb-query.h
    - path: /usr/include/libxmlb-2/libxmlb/xb-silo-export.h
    - path: /usr/include/libxmlb-2/libxmlb/xb-silo-query.h
    - path: /usr/include/libxmlb-2/libxmlb/xb-silo.h
    - path: /usr/include/libxmlb-2/libxmlb/xb-stack.h
    - path: /usr/include/libxmlb-2/libxmlb/xb-string.h
    - path: /usr/include/libxmlb-2/libxmlb/xb-value-bindings.h
    - path: /usr/include/libxmlb-2/libxmlb/xb-version.h
    - path: /usr/include/libxmlb-2/xmlb.h
    - path: /usr/lib/pkgconfig/xmlb.pc

  lib:
    files:
    - path: /usr/lib/libxmlb.so
      needs:
      - /usr/lib/libc.so.6
      - /usr/lib/libgcc_s.so.1
      - /usr/lib/libgio-2.0.so.0
      - /usr/lib/libglib-2.0.so.0
      - /usr/lib/libgobject-2.0.so.0
      - /usr/lib/liblzma.so.5
      - /usr/lib/libzstd.so.1
    - path: /usr/lib/libxmlb.so.2
      needs:
      - /usr/lib/libc.so.6
      - /usr/lib/libgcc_s.so.1
      - /usr/lib/libgio-2.0.so.0
      - /usr/lib/libglib-2.0.so.0
      - /usr/lib/libgobject-2.0.so.0
      - /usr/lib/liblzma.so.5
      - /usr/lib/libzstd.so.1
    - path: /usr/lib/libxmlb.so.2.0.0
      needs:
      - /usr/lib/libc.so.6
      - /usr/lib/libgcc_s.so.1
      - /usr/lib/libgio-2.0.so.0
      - /usr/lib/libglib-2.0.so.0
      - /usr/lib/libgobject-2.0.so.0
      - /usr/lib/liblzma.so.5
      - /usr/lib/libzstd.so.1

  man:
    files:
    - path: /usr/share/man/man1/xb-tool.1

resolution:
  /usr/lib/libgcc_s.so.1: gcc
  /usr/lib/libgio-2.0.so.0: glib2
  /usr/lib/libglib-2.0.so.0: glib2
  /usr/lib/libgobject-2.0.so.0: glib2
  /usr/lib/ld-linux-x86-64.so.2: glibc
  /usr/lib/libc.so.6: glibc
  /usr/lib/libxmlb.so.2: self
  /usr/lib/liblzma.so.5: xz
  /usr/lib/libzstd.so.1: zstd
