  slug: popt
  namespace: libs/system
  version: "1.19"
  description: Command line option parsing library
  homepage: http://rpm.org/
  checksum: c93761cd57cc99524cd1b56b70a026072978b3a272e5ca162fd36095d585457e

sources:
- name: popt
  url: http://ftp.rpm.org/popt/releases/popt-1.x/popt-1.19.tar.gz
  sha256: c25a4838fc8e4c1c8aacb8bd620edb3084a3d63bf8987fdad3ca2758c63240f9
- name: uapi_config_patch
  file: pkg/libs/system/popt-uapi-config.patch
  sha256: 9d188d05207c48635b07208c694932b4da522efa443df15be40268ba8165b5c8
- name: uapi_smoke
  file: pkg/libs/system/popt-uapi-smoke.c
  sha256: 8bb8fcf5f38e6dfa201cd84b9238cf23e7bc74081317dbc077cc20e818cea2c9
- name: uapi_check
  file: pkg/libs/system/popt-uapi-check.sh
  sha256: 88621c3bca3ba7c88e4e51f123b77d50fddbf96753fc0cf92ea733b4110cf1d8

dependencies:
- name: glibc
  commit: x86_64/pkg/libs/system/glibc/2.39/bundles/dev
- name: gcc
  commit: x86_64/pkg/core/toolchain/gcc/13.2.0/bundles/dev
- name: binutils
  commit: x86_64/pkg/core/toolchain/binutils/2.42/bundles/dev
- name: bash
