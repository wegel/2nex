    commit: x86_64/pkg/bootstrap/phase1/sed/4.9/bundles/dev
  - name: tar
    commit: x86_64/pkg/bootstrap/phase1/tar/1.35/bundles/dev
  - name: mpc
    commit: x86_64/pkg/bootstrap/phase3/mpc/1.2.1/outputs/lib
  - name: gcc
    commit: x86_64/pkg/bootstrap/phase3/gcc/13.2.0/bundles/dev
  - name: perl
    commit: x86_64/pkg/bootstrap/phase2/perl/5.38.2/bundles/dev
  - name: strip-nondeterminism
    commit: x86_64/pkg/bootstrap/phase3/strip-nondeterminism/1.13.0/bundles/dev
  - name: zlib
    commit: x86_64/pkg/bootstrap/phase3/zlib/1.3.1/bundles/dev
  - name: xz
    commit: x86_64/pkg/bootstrap/phase3/xz/5.4.6/bundles/dev
  - name: bzip2
    commit: x86_64/pkg/bootstrap/phase3/bzip2/1.0.8/outputs/lib
  - name: file
    commit: x86_64/pkg/bootstrap/phase3/file/5.45/bundles/dev
  - name: binutils
    commit: x86_64/pkg/bootstrap/phase3/binutils/2.42/bundles/dev
  - name: glibc
    commit: x86_64/pkg/libs/system/glibc/2.39/outputs/lib
  - name: attr
    commit: x86_64/pkg/libs/system/attr/2.5.2/bundles/dev
  - name: glibc
    commit: x86_64/pkg/libs/system/glibc/2.39/bundles/dev
build:
  script: "tar --no-same-owner -xf ${SOURCE_acl} -C \"${WORK_DIR}\" --strip-components=1\n\
    cd ${WORK_DIR}\n\n./configure --prefix=/usr         \\\n          --disable-static\
    \      \\\n          --docdir=/usr/share/doc/acl-2.3.2\n\nmake\nmake DESTDIR=\"\
    ${OUT_DIR}\" install\n\nfind \"${OUT_DIR}\" -exec touch -d '2024-01-01T00:00:00+00:00'\
    \ {} \\;\nfind \"${OUT_DIR}\" ! -type d -exec strip-nondeterminism -T 1704067200\
    \ --normalizers +all {} \\;\n2nex_strip_binaries ${OUT_DIR}\n"
bundles:
  full:
  - locale
  - bin
  - doc
  - man
  - dev
  - lib
  dev:
  - bin
  - dev
  - lib
