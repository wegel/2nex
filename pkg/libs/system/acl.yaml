package:
  schema: 1
  name: Acl
  slug: acl
  namespace: libs/system
  version: 2.3.2
  description: Utilities for manipulating access control lists
  homepage: https://savannah.nongnu.org/projects/acl
  checksum: 15386fddc7e5dc6e882990c7ddd997dbf32a91033734f13be15b4e355226b222
  seed: true

sources:
- name: acl
  url: https://download.savannah.nongnu.org/releases/acl/acl-2.3.2.tar.xz
  sha256: 97203a72cae99ab89a067fe2210c1cbf052bc492b479eca7d226d9830883b0bd

dependencies:
- name: linux-headers
  commit: x86_64/pkg/bootstrap/phase1/linux-headers/6.4.1/bundles/dev
- name: glibc
  commit: x86_64/pkg/libs/system/glibc/2.39/bundles/dev
- name: attr
  commit: x86_64/pkg/libs/system/attr/2.5.2/bundles/dev
- name: binutils
  commit: x86_64/pkg/bootstrap/phase1/binutils/2.42/bundles/dev
- name: gcc
  commit: x86_64/pkg/bootstrap/phase1/gcc/13.2.0/bundles/dev
- name: zlib
  commit: x86_64/pkg/bootstrap/phase1/zlib/1.3.1/bundles/dev
- name: bash
  commit: x86_64/pkg/bootstrap/phase1/bash/5.2.21/bundles/dev
- name: coreutils
  commit: x86_64/pkg/bootstrap/phase1/coreutils/9.5/bundles/dev
- name: findutils
  commit: x86_64/pkg/bootstrap/phase1/findutils/4.9.0/bundles/dev
- name: gawk
  commit: x86_64/pkg/bootstrap/phase1/gawk/5.3.0/bundles/dev
- name: grep
  commit: x86_64/pkg/bootstrap/phase1/grep/3.11/bundles/dev
- name: make
  commit: x86_64/pkg/bootstrap/phase1/make/4.4.1/bundles/dev
- name: sed
  commit: x86_64/pkg/bootstrap/phase1/sed/4.9/bundles/dev
- name: tar
  commit: x86_64/pkg/bootstrap/phase1/tar/1.35/bundles/dev
- name: xz
  commit: x86_64/pkg/bootstrap/phase1/xz/5.4.6/bundles/dev

build:
  environment: 27b6e5dc7ad152c9a17c2cabfcc5ee93daa9bbf0
  profile: [4110:795, 8226:2256, 12333:2313, 13120:2397]

  script: |
    tar --no-same-owner -xf ${SOURCE_acl} -C "${WORK_DIR}" --strip-components=1
    cd ${WORK_DIR}

    ./configure --prefix=/usr         \
              --disable-static      \
              --docdir=/usr/share/doc/acl-2.3.2

    make
    make DESTDIR="${OUT_DIR}" install

    find ${OUT_DIR} -type f -executable -exec strip --strip-unneeded {} \; 2>/dev/null || true
    find ${OUT_DIR} -name '*.a' -exec objcopy --enable-deterministic-archives {} \; 2>/dev/null || true
    find "${OUT_DIR}" -exec touch -d '2024-01-01T00:00:00+00:00' {} \;

bundles:
  dev:
  - bin
  - dev
  - lib

  full:
  - bin
  - dev
  - doc
  - lib
  - locale
  - man

outputs:
  bin:
    files:
    - path: /usr/bin/chacl
      needs:
      - /usr/lib/ld-linux-x86-64.so.2
      - /usr/lib/libacl.so.1
      - /usr/lib/libc.so.6
    - path: /usr/bin/getfacl
      needs:
      - /usr/lib/ld-linux-x86-64.so.2
      - /usr/lib/libacl.so.1
      - /usr/lib/libc.so.6
    - path: /usr/bin/setfacl
      needs:
      - /usr/lib/ld-linux-x86-64.so.2
      - /usr/lib/libacl.so.1
      - /usr/lib/libc.so.6

  dev:
    files:
    - path: /usr/include/acl/libacl.h
    - path: /usr/include/sys/acl.h
    - path: /usr/lib/libacl.la
    - path: /usr/lib/pkgconfig/libacl.pc

  doc:
    files:
    - path: /usr/share/doc/acl-2.3.2/CHANGES
    - path: /usr/share/doc/acl-2.3.2/COPYING
    - path: /usr/share/doc/acl-2.3.2/COPYING.LGPL
    - path: /usr/share/doc/acl-2.3.2/extensions.txt
    - path: /usr/share/doc/acl-2.3.2/libacl.txt

  lib:
    files:
    - path: /usr/lib/libacl.so
      needs:
      - /usr/lib/libattr.so.1
      - /usr/lib/libc.so.6
    - path: /usr/lib/libacl.so.1
      needs:
      - /usr/lib/libattr.so.1
      - /usr/lib/libc.so.6
    - path: /usr/lib/libacl.so.1.1.2302
      needs:
      - /usr/lib/libattr.so.1
      - /usr/lib/libc.so.6

  locale:
    files:
    - path: /usr/share/locale/de/LC_MESSAGES/acl.mo
    - path: /usr/share/locale/en@boldquot/LC_MESSAGES/acl.mo
    - path: /usr/share/locale/en@quot/LC_MESSAGES/acl.mo
    - path: /usr/share/locale/es/LC_MESSAGES/acl.mo
    - path: /usr/share/locale/fr/LC_MESSAGES/acl.mo
    - path: /usr/share/locale/gl/LC_MESSAGES/acl.mo
    - path: /usr/share/locale/ka/LC_MESSAGES/acl.mo
    - path: /usr/share/locale/pl/LC_MESSAGES/acl.mo
    - path: /usr/share/locale/sv/LC_MESSAGES/acl.mo

  man:
    files:
    - path: /usr/share/man/man1/chacl.1
    - path: /usr/share/man/man1/getfacl.1
    - path: /usr/share/man/man1/setfacl.1
    - path: /usr/share/man/man3/acl_add_perm.3
    - path: /usr/share/man/man3/acl_calc_mask.3
    - path: /usr/share/man/man3/acl_check.3
    - path: /usr/share/man/man3/acl_clear_perms.3
    - path: /usr/share/man/man3/acl_cmp.3
    - path: /usr/share/man/man3/acl_copy_entry.3
    - path: /usr/share/man/man3/acl_copy_ext.3
    - path: /usr/share/man/man3/acl_copy_int.3
    - path: /usr/share/man/man3/acl_create_entry.3
    - path: /usr/share/man/man3/acl_delete_def_file.3
    - path: /usr/share/man/man3/acl_delete_entry.3
    - path: /usr/share/man/man3/acl_delete_perm.3
    - path: /usr/share/man/man3/acl_dup.3
    - path: /usr/share/man/man3/acl_entries.3
