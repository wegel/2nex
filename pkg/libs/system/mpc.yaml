package:
  schema: 1
  name: MPC
  slug: mpc
  namespace: libs/system
  version: 1.2.1
  description: Multiple Precision Complex Library
  homepage: https://www.multiprecision.org/mpc/
  checksum: 599e0d182c69d54210b9abd8d45b7e9312bd6478ed1a198fc53b24a345d17365
  seed: true

sources:
- name: mpc
  url: https://ftp.gnu.org/gnu/mpc/mpc-1.3.1.tar.gz
  sha256: ab642492f5cf882b74aa0cb730cd410a81edcdbec895183ce930e706c1c759b8

dependencies:
- name: glibc
  commit: x86_64/pkg/libs/system/glibc/2.39/bundles/dev
- name: gcc
  commit: x86_64/pkg/core/toolchain/gcc/13.2.0/bundles/dev
- name: binutils
  commit: x86_64/pkg/bootstrap/phase1/binutils/2.42/bundles/dev
- name: bash
  commit: x86_64/pkg/bootstrap/phase1/bash/5.2.21/bundles/dev
- name: coreutils
  commit: x86_64/pkg/bootstrap/phase1/coreutils/9.5/bundles/dev
- name: findutils
  commit: x86_64/pkg/bootstrap/phase1/findutils/4.9.0/bundles/dev
- name: gawk
  commit: x86_64/pkg/bootstrap/phase1/gawk/5.3.0/bundles/dev
- name: grep
  commit: x86_64/pkg/bootstrap/phase1/grep/3.11/bundles/dev
- name: gzip
  commit: x86_64/pkg/bootstrap/phase1/gzip/1.13/bundles/dev
- name: make
  commit: x86_64/pkg/bootstrap/phase1/make/4.4.1/bundles/dev
- name: sed
  commit: x86_64/pkg/bootstrap/phase1/sed/4.9/bundles/dev
- name: tar
  commit: x86_64/pkg/bootstrap/phase1/tar/1.35/bundles/dev
- name: zlib
  commit: x86_64/pkg/bootstrap/phase1/zlib/1.3.1/bundles/dev
- name: xz
  commit: x86_64/pkg/bootstrap/phase1/xz/5.4.6/bundles/dev
- name: linux-headers
  commit: x86_64/pkg/bootstrap/phase1/linux-headers/6.4.1/bundles/dev
- name: gmp
  commit: x86_64/pkg/libs/system/gmp/6.3.0/bundles/dev
- name: mpfr
  commit: x86_64/pkg/libs/system/mpfr/4.2.1/bundles/dev

build:
  environment: 27b6e5dc7ad152c9a17c2cabfcc5ee93daa9bbf0
  profile: [8516:2654, 21766:2740, 47848:2956, 78297:3139, 103651:3298, 130190:4398, 156156:4555, 194194:4863, 228860:5511, 253404:10178]

  script: |
    tar --no-same-owner -xf ${SOURCE_mpc} -C "${WORK_DIR}" --strip-components=1
    cd ${WORK_DIR}

    ./configure \
        --prefix=/usr \
        --with-gmp=/usr \
        --with-mpfr=/usr

    make
    make check
    make DESTDIR="${OUT_DIR}" install

    find ${OUT_DIR} -type f -executable -exec strip --strip-unneeded {} \; 2>/dev/null || true
    find ${OUT_DIR} -name '*.a' -exec objcopy --enable-deterministic-archives {} \; 2>/dev/null || true
    find "${OUT_DIR}" -exec touch -d '2024-01-01T00:00:00+00:00' {} \;

bundles:
  dev:
  - dev
  - lib
  - static

  full:
  - dev
  - info
  - lib
  - static

outputs:
  dev:
    files:
    - path: /usr/include/mpc.h
    - path: /usr/lib/libmpc.la

  info:
    files:
    - path: /usr/share/info/mpc.info

  lib:
    files:
    - path: /usr/lib/libmpc.so
      needs:
      - /usr/lib/libc.so.6
      - /usr/lib/libgmp.so.10
      - /usr/lib/libm.so.6
      - /usr/lib/libmpfr.so.6
    - path: /usr/lib/libmpc.so.3
      needs:
      - /usr/lib/libc.so.6
      - /usr/lib/libgmp.so.10
      - /usr/lib/libm.so.6
      - /usr/lib/libmpfr.so.6
    - path: /usr/lib/libmpc.so.3.3.1
      needs:
      - /usr/lib/libc.so.6
      - /usr/lib/libgmp.so.10
      - /usr/lib/libm.so.6
      - /usr/lib/libmpfr.so.6

  static:
    files:
    - path: /usr/lib/libmpc.a

resolution:
  /usr/lib/libc.so.6: glibc
  /usr/lib/libm.so.6: glibc
  /usr/lib/libgmp.so.10: gmp
  /usr/lib/libmpfr.so.6: mpfr
