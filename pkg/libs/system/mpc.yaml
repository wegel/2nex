package:
  schema: 1
  name: MPC
  slug: mpc
  namespace: libs/system
  version: 1.2.1
  description: Multiple Precision Complex Library
  homepage: https://www.multiprecision.org/mpc/
  checksum: 0eafcfd9f2d0474190214fd154429ceeee29a87a0680785eb9e4062a61f4b8cc

sources:
- name: mpc
  url: https://ftp.gnu.org/gnu/mpc/mpc-1.3.1.tar.gz
  sha256: ab642492f5cf882b74aa0cb730cd410a81edcdbec895183ce930e706c1c759b8

dependencies:
- name: bootstrap_tools
  commit: x86_64/pkg/bootstrap/phase1/bootstrap_tools/0.0.1/bundles/dev
- name: bash
  commit: x86_64/pkg/bootstrap/phase1/bash/5.2.21/bundles/dev
- name: findutils
  commit: x86_64/pkg/bootstrap/phase1/findutils/4.9.0/bundles/dev
- name: 2nex-utilities-bootstrap
  commit: x86_64/pkg/bootstrap/phase3/2nex-utilities-bootstrap/0.0.1/bundles/dev
- name: gawk
  commit: x86_64/pkg/bootstrap/phase1/gawk/5.3.0/bundles/dev
- name: grep
  commit: x86_64/pkg/bootstrap/phase1/grep/3.11/bundles/dev
- name: gzip
  commit: x86_64/pkg/bootstrap/phase1/gzip/1.13/bundles/dev
- name: make
  commit: x86_64/pkg/bootstrap/phase1/make/4.4.1/bundles/dev
- name: sed
  commit: x86_64/pkg/bootstrap/phase1/sed/4.9/bundles/dev
- name: tar
  commit: x86_64/pkg/bootstrap/phase1/tar/1.35/bundles/dev
- name: mpc
  commit: x86_64/pkg/bootstrap/phase3/mpc/1.2.1/outputs/lib
- name: coreutils
  commit: x86_64/pkg/bootstrap/phase1/coreutils/9.5/outputs/bin
- name: texinfo
  commit: x86_64/pkg/bootstrap/phase2/texinfo/7.1/bundles/dev
- name: zlib
  commit: x86_64/pkg/bootstrap/phase3/zlib/1.3.1/bundles/dev
- name: bzip2
  commit: x86_64/pkg/bootstrap/phase3/bzip2/1.0.8/outputs/lib
- name: xz
  commit: x86_64/pkg/bootstrap/phase3/xz/5.4.6/outputs/lib
- name: file
  commit: x86_64/pkg/bootstrap/phase3/file/5.45/bundles/dev
- name: binutils
  commit: x86_64/pkg/bootstrap/phase3/binutils/2.42/bundles/dev
- name: glibc
  commit: x86_64/pkg/libs/system/glibc/2.39/bundles/dev
- name: gcc
  commit: x86_64/pkg/core/toolchain/gcc/13.2.0/bundles/dev
- name: gmp
  commit: x86_64/pkg/libs/system/gmp/6.3.0/bundles/dev
- name: mpfr
  commit: x86_64/pkg/libs/system/mpfr/4.2.1/bundles/dev

build:
  profile: [8439:1716, 21322:1756, 46444:1872, 76704:2021, 98439:2156, 123982:2517, 149697:2731, 184691:3029, 223386:3425, 245548:7341]

  script: |
    tar --no-same-owner -xf ${SOURCE_mpc} -C "${WORK_DIR}" --strip-components=1
    cd ${WORK_DIR}

    ./configure \
        --prefix=/usr \
        --with-gmp=/usr \
        --with-mpfr=/usr

    make
    make check
    make DESTDIR="${OUT_DIR}" install

    find "${OUT_DIR}" -exec touch -d '2024-01-01T00:00:00+00:00' {} \;
    2nex_strip_binaries ${OUT_DIR}

bundles:
  dev:
  - dev
  - lib
  - static

  full:
  - dev
  - info
  - lib
  - static

outputs:
  dev:
    files:
    - path: /usr/include/mpc.h
    - path: /usr/lib/libmpc.la

  info:
    files:
    - path: /usr/share/info/dir
    - path: /usr/share/info/mpc.info

  lib:
    files:
    - path: /usr/lib/libmpc.so
      needs:
      - /usr/lib/libc.so.6
      - /usr/lib/libgmp.so.10
      - /usr/lib/libm.so.6
      - /usr/lib/libmpfr.so.6
    - path: /usr/lib/libmpc.so.3
      needs:
      - /usr/lib/libc.so.6
      - /usr/lib/libgmp.so.10
      - /usr/lib/libm.so.6
      - /usr/lib/libmpfr.so.6
    - path: /usr/lib/libmpc.so.3.3.1
      needs:
      - /usr/lib/libc.so.6
      - /usr/lib/libgmp.so.10
      - /usr/lib/libm.so.6
      - /usr/lib/libmpfr.so.6

  static:
    files:
    - path: /usr/lib/libmpc.a

resolution:
  /usr/lib/libc.so.6: glibc
  /usr/lib/libm.so.6: glibc
  /usr/lib/libgmp.so.10: gmp
  /usr/lib/libmpfr.so.6: mpfr
