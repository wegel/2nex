  commit: x86_64/pkg/libs/system/expat/2.6.2/bundles/dev

build:
  environment: 27b6e5dc7ad152c9a17c2cabfcc5ee93daa9bbf0
  profile: [4115:1654, 8227:2491, 16438:2513, 28779:2557, 37037:2558, 45302:2563, 57701:2569, 70061:2582, 82459:5274, 89872:5415]

  script: |
    tar --no-same-owner -xf /${SOURCE_dbus_glib} -C "${WORK_DIR}" --strip-components=1
    cd "${WORK_DIR}"

    ./configure \
      --prefix=/usr \
      --disable-static \
      --disable-tests \
      --disable-bash-completion \
      --disable-gtk-doc \
      --disable-dependency-tracking

    make
    make DESTDIR="${OUT_DIR}" install

    find "${OUT_DIR}" -type f -executable -exec strip --strip-unneeded {} \; 2>/dev/null || true
    find "${OUT_DIR}" -name '*.a' -exec objcopy --enable-deterministic-archives {} \; 2>/dev/null || true
    find "${OUT_DIR}" -exec touch -d "2024-01-01T00:00:00+00:00" {} \;

bundles:
  dev:
  - bin
  - dev
  - lib

  full:
  - bin
  - dev
  - lib
  - man
  - misc

outputs:
  bin:
    files:
    - path: /usr/bin/dbus-binding-tool
      needs:
      - /usr/lib/ld-linux-x86-64.so.2
      - /usr/lib/libc.so.6
      - /usr/lib/libdbus-1.so.3
      - /usr/lib/libdbus-glib-1.so.2
      - /usr/lib/libexpat.so.1
      - /usr/lib/libgio-2.0.so.0
      - /usr/lib/libglib-2.0.so.0
      - /usr/lib/libgobject-2.0.so.0

  dev:
    files:
    - path: /usr/include/dbus-1.0/dbus/dbus-glib-bindings.h
    - path: /usr/include/dbus-1.0/dbus/dbus-glib-lowlevel.h
    - path: /usr/include/dbus-1.0/dbus/dbus-glib.h
    - path: /usr/include/dbus-1.0/dbus/dbus-gtype-specialized.h
    - path: /usr/include/dbus-1.0/dbus/dbus-gvalue-parse-variant.h
    - path: /usr/lib/libdbus-glib-1.la
    - path: /usr/lib/pkgconfig/dbus-glib-1.pc

  lib:
    files:
    - path: /usr/lib/libdbus-glib-1.so
      needs:
      - /usr/lib/libc.so.6
      - /usr/lib/libdbus-1.so.3
      - /usr/lib/libgio-2.0.so.0
      - /usr/lib/libglib-2.0.so.0
      - /usr/lib/libgobject-2.0.so.0
    - path: /usr/lib/libdbus-glib-1.so.2
      needs:
      - /usr/lib/libc.so.6
      - /usr/lib/libdbus-1.so.3
      - /usr/lib/libgio-2.0.so.0
      - /usr/lib/libglib-2.0.so.0
      - /usr/lib/libgobject-2.0.so.0
    - path: /usr/lib/libdbus-glib-1.so.2.3.5
      needs:
      - /usr/lib/libc.so.6
      - /usr/lib/libdbus-1.so.3
      - /usr/lib/libgio-2.0.so.0
      - /usr/lib/libglib-2.0.so.0
      - /usr/lib/libgobject-2.0.so.0

  man:
    files:
    - path: /usr/share/man/man1/dbus-binding-tool.1

  misc:
    files:
    - path: /usr/share/gtk-doc/html/dbus-glib/api-index-full.html
    - path: /usr/share/gtk-doc/html/dbus-glib/ch01.html
    - path: /usr/share/gtk-doc/html/dbus-glib/ch02.html
    - path: /usr/share/gtk-doc/html/dbus-glib/ch03.html
