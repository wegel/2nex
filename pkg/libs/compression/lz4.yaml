package:
  schema: 1
  name: Lz4
  slug: lz4
  namespace: libs/compression
  version: 1.9.4
  description: Extremely Fast Compression algorithm
  homepage: https://lz4.github.io/lz4/
  checksum: bfa7bae4e3aef5c5ebaf8f482b22cbe35d862652b5f888e64084594b21b7926d

sources:
- name: lz4
  url: https://github.com/lz4/lz4/archive/v1.9.4/lz4-1.9.4.tar.gz
  sha256: 0b0e3aa07c8c063ddf40b082bdf7e37a1562bda40a0ff5272957f3e987e0e54b

dependencies:
- name: linux-headers
  commit: x86_64/pkg/libs/system/linux-headers/6.4.1/bundles/dev
- name: glibc
  commit: x86_64/pkg/libs/system/glibc/2.39/bundles/dev
- name: zlib
  commit: x86_64/pkg/libs/system/zlib/1.3.1/bundles/dev
- name: ncurses
  commit: x86_64/pkg/libs/system/ncurses/6.4-20230520/bundles/dev
- name: attr
  commit: x86_64/pkg/libs/system/attr/2.5.2/bundles/dev
- name: acl
  commit: x86_64/pkg/libs/system/acl/2.3.2/bundles/dev
- name: binutils
  commit: x86_64/pkg/core/toolchain/binutils/2.42/bundles/dev
- name: gcc
  commit: x86_64/pkg/core/toolchain/gcc/13.2.0/bundles/dev
- name: make
  commit: x86_64/pkg/core/toolchain/make/4.4.1/bundles/dev
- name: bash
  commit: x86_64/pkg/cli/shells/bash/5.2.21/bundles/dev
- name: coreutils
  commit: x86_64/pkg/core/userland/coreutils/9.5/bundles/dev
- name: findutils
  commit: x86_64/pkg/core/userland/findutils/4.9.0/bundles/dev
- name: sed
  commit: x86_64/pkg/cli/text/sed/4.9/bundles/dev
- name: tar
  commit: x86_64/pkg/cli/archive/tar/1.35/bundles/dev
- name: gzip
  commit: x86_64/pkg/cli/archive/gzip/1.13/bundles/dev
- name: diffutils
  commit: x86_64/pkg/core/userland/diffutils/3.10/bundles/dev
- name: grep
  commit: x86_64/pkg/cli/text/grep/3.11/bundles/dev

build:
  environment: 27b6e5dc7ad152c9a17c2cabfcc5ee93daa9bbf0
  profile: [4101:2005, 8201:2067, 12391:2475, 16574:2829, 19980:6280]

  script: |
    tar --no-same-owner -xf ${SOURCE_lz4} -C "${WORK_DIR}" --strip-components=1
    cd ${WORK_DIR}

    ln -sf /usr/bin/gcc /usr/bin/cc
    make check
    make PREFIX=/usr DESTDIR=${OUT_DIR} install

    find ${OUT_DIR} -type f -executable -exec strip --strip-unneeded {} \; 2>/dev/null || true
    find ${OUT_DIR} -name '*.a' -exec objcopy --enable-deterministic-archives {} \; 2>/dev/null || true
    find "${OUT_DIR}" -exec touch -d "2024-01-01T00:00:00+00:00" {} \;

bundles:
  dev:
  - bin
  - dev
  - lib

  full:
  - bin
  - dev
  - lib
  - man

outputs:
  bin:
    files:
    - path: /usr/bin/lz4
      needs:
      - /usr/lib/ld-linux-x86-64.so.2
      - /usr/lib/libc.so.6
    - path: /usr/bin/lz4c
      needs:
      - /usr/lib/ld-linux-x86-64.so.2
      - /usr/lib/libc.so.6
    - path: /usr/bin/lz4cat
      needs:
      - /usr/lib/ld-linux-x86-64.so.2
      - /usr/lib/libc.so.6
    - path: /usr/bin/unlz4
      needs:
      - /usr/lib/ld-linux-x86-64.so.2
      - /usr/lib/libc.so.6

  dev:
    files:
    - path: /usr/include/lz4hc.h
    - path: /usr/include/lz4.h
    - path: /usr/include/lz4frame.h
    - path: /usr/lib/pkgconfig/liblz4.pc

  lib:
    files:
    - path: /usr/lib/liblz4.so
      needs:
      - /usr/lib/libc.so.6
    - path: /usr/lib/liblz4.so.1
      needs:
      - /usr/lib/libc.so.6
    - path: /usr/lib/liblz4.so.1.9.4
      needs:
      - /usr/lib/libc.so.6

  man:
    files:
    - path: /usr/share/man/man1/lz4c.1
    - path: /usr/share/man/man1/lz4.1
    - path: /usr/share/man/man1/lz4cat.1
    - path: /usr/share/man/man1/unlz4.1

resolution:
  /usr/lib/ld-linux-x86-64.so.2: glibc
  /usr/lib/libc.so.6: glibc
