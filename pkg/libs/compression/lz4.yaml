package:
  schema: 1
  name: Lz4
  slug: lz4
  namespace: libs/compression
  version: 1.9.4
  description: Extremely Fast Compression algorithm
  homepage: https://lz4.github.io/lz4/
  checksum: 13929744a6344075fa0d4c7025038b771e93a74c96b46e2d208d281946aa48d6

sources:
- name: lz4
  url: https://github.com/lz4/lz4/archive/v1.9.4/lz4-1.9.4.tar.gz
  sha256: 0b0e3aa07c8c063ddf40b082bdf7e37a1562bda40a0ff5272957f3e987e0e54b

dependencies:
- name: m4
  commit: x86_64/pkg/bootstrap/phase1/m4/1.4.19/bundles/dev
- name: ncurses
  commit: x86_64/pkg/bootstrap/phase1/ncurses/6.4-20230520/bundles/dev
- name: bash
  commit: x86_64/pkg/bootstrap/phase1/bash/5.2.21/bundles/dev
- name: coreutils
  commit: x86_64/pkg/bootstrap/phase1/coreutils/9.5/bundles/dev
- name: diffutils
  commit: x86_64/pkg/bootstrap/phase1/diffutils/3.10/bundles/dev
- name: file
  commit: x86_64/pkg/bootstrap/phase3/file/5.45/bundles/dev
- name: findutils
  commit: x86_64/pkg/bootstrap/phase1/findutils/4.9.0/bundles/dev
- name: gawk
  commit: x86_64/pkg/bootstrap/phase1/gawk/5.3.0/bundles/dev
- name: grep
  commit: x86_64/pkg/bootstrap/phase1/grep/3.11/bundles/dev
- name: gzip
  commit: x86_64/pkg/bootstrap/phase1/gzip/1.13/bundles/dev
- name: make
  commit: x86_64/pkg/bootstrap/phase1/make/4.4.1/bundles/dev
- name: patch
  commit: x86_64/pkg/bootstrap/phase1/patch/2.7.6/bundles/dev
- name: sed
  commit: x86_64/pkg/bootstrap/phase1/sed/4.9/bundles/dev
- name: tar
  commit: x86_64/pkg/bootstrap/phase1/tar/1.35/bundles/dev
- name: binutils
  commit: x86_64/pkg/bootstrap/phase3/binutils/2.42/bundles/dev
- name: gcc
  commit: x86_64/pkg/bootstrap/phase3/gcc/13.2.0/bundles/dev
- name: bison
  commit: x86_64/pkg/bootstrap/phase2/bison/3.8.2/bundles/dev
- name: gettext
  commit: x86_64/pkg/bootstrap/phase2/gettext/0.22.5/bundles/dev
- name: perl
  commit: x86_64/pkg/bootstrap/phase2/perl/5.38.2/bundles/dev
- name: python3
  commit: x86_64/pkg/bootstrap/phase2/python3/3.12.2/bundles/dev
- name: texinfo
  commit: x86_64/pkg/bootstrap/phase2/texinfo/7.1/bundles/dev
- name: zlib
  commit: x86_64/pkg/bootstrap/phase3/zlib/1.3.1/bundles/dev
- name: 2nex-utilities
  commit: x86_64/pkg/bootstrap/phase3/2nex-utilities-bootstrap/0.0.1/bundles/dev
- name: bzip2
  commit: x86_64/pkg/bootstrap/phase3/bzip2/1.0.8/bundles/dev
- name: xz
  commit: x86_64/pkg/bootstrap/phase3/xz/5.4.6/bundles/dev
- name: mpc
  commit: x86_64/pkg/bootstrap/phase3/mpc/1.2.1/bundles/dev
- name: gmp-bootstrap
  commit: x86_64/pkg/bootstrap/phase3/gmp-bootstrap/6.3.0/outputs/lib
- name: mpfr
  commit: x86_64/pkg/bootstrap/phase3/mpfr/4.2.1/outputs/lib
- name: glibc
  commit: x86_64/pkg/libs/system/glibc/2.39/bundles/dev
- name: linux-headers
  commit: x86_64/pkg/bootstrap/phase3/linux-headers/6.4.1/bundles/dev

build:
  profile: [4100:4063, 8267:4171, 12496:4676, 16633:5071, 20127:17462]

  script: |
    tar --no-same-owner -xf ${SOURCE_lz4} -C "${WORK_DIR}" --strip-components=1
    cd ${WORK_DIR}

    ln -sf /usr/bin/gcc /usr/bin/cc
    make check
    make PREFIX=${OUT_DIR}/usr install
    sed -i 's@/2nex/out@@g' ${OUT_DIR}/usr/lib/pkgconfig/liblz4.pc

    find "${OUT_DIR}" -exec touch -d '2024-01-01T00:00:00+00:00' {} \;
    2nex_strip_binaries ${OUT_DIR}

bundles:
  dev:
  - bin
  - dev
  - lib

  full:
  - bin
  - dev
  - lib
  - man

outputs:
  bin:
    files:
    - path: /usr/bin/lz4
      needs:
      - /usr/lib/ld-linux-x86-64.so.2
      - /usr/lib/libc.so.6
    - path: /usr/bin/lz4c
      needs:
      - /usr/lib/ld-linux-x86-64.so.2
      - /usr/lib/libc.so.6
    - path: /usr/bin/lz4cat
      needs:
      - /usr/lib/ld-linux-x86-64.so.2
      - /usr/lib/libc.so.6
    - path: /usr/bin/unlz4
      needs:
      - /usr/lib/ld-linux-x86-64.so.2
      - /usr/lib/libc.so.6

  dev:
    files:
    - path: /usr/include/lz4hc.h
    - path: /usr/include/lz4.h
    - path: /usr/include/lz4frame.h
    - path: /usr/lib/pkgconfig/liblz4.pc

  lib:
    files:
    - path: /usr/lib/liblz4.so
      needs:
      - /usr/lib/libc.so.6
    - path: /usr/lib/liblz4.so.1
      needs:
      - /usr/lib/libc.so.6
    - path: /usr/lib/liblz4.so.1.9.4
      needs:
      - /usr/lib/libc.so.6

  man:
    files:
    - path: /usr/share/man/man1/lz4c.1
    - path: /usr/share/man/man1/lz4.1
    - path: /usr/share/man/man1/lz4cat.1
    - path: /usr/share/man/man1/unlz4.1

resolution:
  /usr/lib/ld-linux-x86-64.so.2: glibc
  /usr/lib/libc.so.6: glibc
