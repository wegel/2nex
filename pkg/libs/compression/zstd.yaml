package:
  schema: 1
  name: Zstd
  slug: zstd
  namespace: libs/compression
  version: 1.5.6
  description: Zstandard - Fast real-time compression algorithm
  homepage: https://facebook.github.io/zstd/
  checksum: 14f7cac68ec1375c9d8182ec7d09398ffd52e03912d76bace883baa6ce98e90d
sources:
- name: zstd
  url: https://github.com/facebook/zstd/releases/download/v1.5.6/zstd-1.5.6.tar.gz
  sha256: 8c29e06cf42aacc1eafc4077ae2ec6c6fcb96a626157e0593d5e82a34fd403c1
dependencies:
- name: bash
  commit: x86_64/pkg/bootstrap/phase1/bash/5.2.21/bundles/dev
- name: coreutils
  commit: x86_64/pkg/bootstrap/phase1/coreutils/9.5/bundles/dev
- name: diffutils
  commit: x86_64/pkg/bootstrap/phase1/diffutils/3.10/bundles/dev
- name: bootstrap_tools
  commit: x86_64/pkg/bootstrap/phase1/bootstrap_tools/0.0.1/bundles/dev
- name: bzip2
  commit: x86_64/pkg/bootstrap/phase3/bzip2/1.0.8/outputs/lib
- name: file
  commit: x86_64/pkg/bootstrap/phase3/file/5.45/bundles/dev
- name: findutils
  commit: x86_64/pkg/bootstrap/phase1/findutils/4.9.0/bundles/dev
- name: grep
  commit: x86_64/pkg/bootstrap/phase1/grep/3.11/bundles/dev
- name: gzip
  commit: x86_64/pkg/bootstrap/phase1/gzip/1.13/bundles/dev
- name: make
  commit: x86_64/pkg/bootstrap/phase1/make/4.4.1/bundles/dev
- name: sed
  commit: x86_64/pkg/bootstrap/phase1/sed/4.9/bundles/dev
- name: tar
  commit: x86_64/pkg/bootstrap/phase1/tar/1.35/bundles/dev
- name: binutils
  commit: x86_64/pkg/bootstrap/phase3/binutils/2.42/bundles/dev
- name: gmp-bootstrap
  commit: x86_64/pkg/bootstrap/phase3/gmp-bootstrap/6.3.0/outputs/lib
- name: mpfr
  commit: x86_64/pkg/bootstrap/phase3/mpfr/4.2.1/outputs/lib
- name: mpc
  commit: x86_64/pkg/bootstrap/phase3/mpc/1.2.1/outputs/lib
- name: gcc
  commit: x86_64/pkg/bootstrap/phase3/gcc/13.2.0/bundles/dev
- name: glibc
  commit: x86_64/pkg/libs/system/glibc/2.39/bundles/dev
- name: zlib
  commit: x86_64/pkg/libs/system/zlib/1.3.1/bundles/dev
- name: 2nex-utilities-bootstrap
  commit: x86_64/pkg/bootstrap/phase3/2nex-utilities-bootstrap/0.0.1/bundles/dev
- name: xz
  commit: x86_64/pkg/libs/compression/xz/5.4.6/bundles/dev
- name: lz4
  commit: x86_64/pkg/libs/compression/lz4/1.9.4/bundles/dev
build:
  script: |
    tar --no-same-owner -xf ${SOURCE_zstd} -C "${WORK_DIR}" --strip-components=1
    cd ${WORK_DIR}

    export CC=gcc
    make
    make check
    make DESTDIR=${OUT_DIR} PREFIX=/usr install

    find "${OUT_DIR}" -exec touch -d '2024-01-01T00:00:00+00:00' {} \;
    2nex_strip_binaries ${OUT_DIR}
bundles:
  full:
  - dev
  - static
  - lib
  - bin
  - man
  dev:
  - dev
  - lib
  - bin
  - static
outputs:
  dev:
    files:
    - path: /usr/include/zdict.h
    - path: /usr/include/zstd.h
    - path: /usr/include/zstd_errors.h
    - path: /usr/lib/pkgconfig/libzstd.pc
  lib:
    files:
    - path: /usr/lib/libzstd.so
      needs:
      - /usr/lib/libc.so.6
    - path: /usr/lib/libzstd.so.1
      needs:
      - /usr/lib/libc.so.6
    - path: /usr/lib/libzstd.so.1.5.6
      needs:
      - /usr/lib/libc.so.6
  bin:
    files:
    - path: /usr/bin/unzstd
      needs:
      - /usr/lib/libz.so.1
      - /usr/lib/liblzma.so.5
      - /usr/lib/liblz4.so.1
      - /usr/lib/libc.so.6
      - /usr/lib/ld-linux-x86-64.so.2
    - path: /usr/bin/zstd
      needs:
      - /usr/lib/libz.so.1
      - /usr/lib/liblzma.so.5
      - /usr/lib/liblz4.so.1
      - /usr/lib/libc.so.6
      - /usr/lib/ld-linux-x86-64.so.2
    - path: /usr/bin/zstdcat
      needs:
      - /usr/lib/libz.so.1
      - /usr/lib/liblzma.so.5
      - /usr/lib/liblz4.so.1
      - /usr/lib/libc.so.6
      - /usr/lib/ld-linux-x86-64.so.2
    - path: /usr/bin/zstdgrep
    - path: /usr/bin/zstdless
    - path: /usr/bin/zstdmt
      needs:
      - /usr/lib/libz.so.1
      - /usr/lib/liblzma.so.5
      - /usr/lib/liblz4.so.1
      - /usr/lib/libc.so.6
      - /usr/lib/ld-linux-x86-64.so.2
  man:
    files:
    - path: /usr/share/man/man1/unzstd.1
    - path: /usr/share/man/man1/zstd.1
    - path: /usr/share/man/man1/zstdcat.1
    - path: /usr/share/man/man1/zstdgrep.1
    - path: /usr/share/man/man1/zstdless.1
  static:
    files:
    - path: /usr/lib/libzstd.a

resolution:
  /usr/lib/libz.so.1: zlib
  /usr/lib/libc.so.6: glibc
  /usr/lib/liblzma.so.5: xz
  /usr/lib/ld-linux-x86-64.so.2: glibc
  /usr/lib/liblz4.so.1: lz4
