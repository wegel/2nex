package:
  schema: 1
  name: Zstd
  slug: zstd
  namespace: libs/compression
  version: 1.5.6
  description: Zstandard - Fast real-time compression algorithm
  homepage: https://facebook.github.io/zstd/
  checksum: 7f41086843b52ba0bde3917058b2883d76b22404e61ceec964ad814c665ec62f

sources:
- name: zstd
  url: https://github.com/facebook/zstd/releases/download/v1.5.6/zstd-1.5.6.tar.gz
  sha256: 8c29e06cf42aacc1eafc4077ae2ec6c6fcb96a626157e0593d5e82a34fd403c1

dependencies:
- name: linux-headers
  commit: x86_64/pkg/libs/system/linux-headers/6.4.1/bundles/dev
- name: glibc
  commit: x86_64/pkg/libs/system/glibc/2.39/bundles/dev
- name: zlib
  commit: x86_64/pkg/libs/system/zlib/1.3.1/bundles/dev
- name: ncurses
  commit: x86_64/pkg/libs/system/ncurses/6.4-20230520/bundles/dev
- name: attr
  commit: x86_64/pkg/libs/system/attr/2.5.2/bundles/dev
- name: acl
  commit: x86_64/pkg/libs/system/acl/2.3.2/bundles/dev
- name: libcap
  commit: x86_64/pkg/libs/security/libcap/2.69/bundles/dev
- name: binutils
  commit: x86_64/pkg/core/toolchain/binutils/2.42/bundles/dev
- name: gcc
  commit: x86_64/pkg/core/toolchain/gcc/13.2.0/bundles/dev
- name: make
  commit: x86_64/pkg/core/toolchain/make/4.4.1/bundles/dev
- name: bash
  commit: x86_64/pkg/cli/shells/bash/5.2.21/bundles/dev
- name: coreutils
  commit: x86_64/pkg/core/userland/coreutils/9.5/bundles/dev
- name: findutils
  commit: x86_64/pkg/core/userland/findutils/4.9.0/bundles/dev
- name: grep
  commit: x86_64/pkg/cli/text/grep/3.11/bundles/dev
- name: sed
  commit: x86_64/pkg/cli/text/sed/4.9/bundles/dev
- name: tar
  commit: x86_64/pkg/cli/archive/tar/1.35/bundles/dev
- name: gzip
  commit: x86_64/pkg/cli/archive/gzip/1.13/bundles/dev
- name: xz
  commit: x86_64/pkg/libs/compression/xz/5.4.6/bundles/dev
- name: lz4
  commit: x86_64/pkg/libs/compression/lz4/1.9.4/bundles/dev

build:
  environment: 27b6e5dc7ad152c9a17c2cabfcc5ee93daa9bbf0
  profile: [4108:1276, 6011:6159]

  script: |
    tar --no-same-owner -xf ${SOURCE_zstd} -C "${WORK_DIR}" --strip-components=1
    cd ${WORK_DIR}

    # disable LTO as zstd build has issues with it
    export CFLAGS="${CFLAGS//-flto=auto/} -pthread"
    export CXXFLAGS="${CXXFLAGS//-flto=auto/} -pthread"
    export LDFLAGS="${LDFLAGS//-flto=auto/} -pthread"
    export CC=gcc
    make
    make DESTDIR=${OUT_DIR} PREFIX=/usr install

    find ${OUT_DIR} -type f -executable -exec strip --strip-unneeded {} \; 2>/dev/null || true
    find ${OUT_DIR} -name '*.a' -exec objcopy --enable-deterministic-archives {} \; 2>/dev/null || true
    find "${OUT_DIR}" -exec touch -d "2024-01-01T00:00:00+00:00" {} \;

bundles:
  dev:
  - bin
  - dev
  - lib
  - static

  full:
  - bin
  - dev
  - lib
  - man
  - static

outputs:
  bin:
    files:
    - path: /usr/bin/unzstd
      needs:
      - /usr/lib/ld-linux-x86-64.so.2
      - /usr/lib/libc.so.6
      - /usr/lib/liblz4.so.1
      - /usr/lib/liblzma.so.5
      - /usr/lib/libz.so.1
    - path: /usr/bin/zstd
      needs:
      - /usr/lib/ld-linux-x86-64.so.2
      - /usr/lib/libc.so.6
      - /usr/lib/liblz4.so.1
      - /usr/lib/liblzma.so.5
      - /usr/lib/libz.so.1
    - path: /usr/bin/zstdcat
      needs:
      - /usr/lib/ld-linux-x86-64.so.2
      - /usr/lib/libc.so.6
      - /usr/lib/liblz4.so.1
      - /usr/lib/liblzma.so.5
      - /usr/lib/libz.so.1
    - path: /usr/bin/zstdgrep
    - path: /usr/bin/zstdless
    - path: /usr/bin/zstdmt
      needs:
      - /usr/lib/ld-linux-x86-64.so.2
      - /usr/lib/libc.so.6
      - /usr/lib/liblz4.so.1
      - /usr/lib/liblzma.so.5
      - /usr/lib/libz.so.1

  dev:
    files:
    - path: /usr/include/zdict.h
    - path: /usr/include/zstd.h
    - path: /usr/include/zstd_errors.h
    - path: /usr/lib/pkgconfig/libzstd.pc

  lib:
    files:
    - path: /usr/lib/libzstd.so
      needs:
      - /usr/lib/libc.so.6
    - path: /usr/lib/libzstd.so.1
      needs:
      - /usr/lib/libc.so.6
    - path: /usr/lib/libzstd.so.1.5.6
      needs:
      - /usr/lib/libc.so.6

  man:
    files:
    - path: /usr/share/man/man1/unzstd.1
    - path: /usr/share/man/man1/zstd.1
    - path: /usr/share/man/man1/zstdcat.1
    - path: /usr/share/man/man1/zstdgrep.1
    - path: /usr/share/man/man1/zstdless.1

  static:
    files:
    - path: /usr/lib/libzstd.a

resolution:
  /usr/lib/ld-linux-x86-64.so.2: glibc
  /usr/lib/libc.so.6: glibc
  /usr/lib/liblz4.so.1: lz4
  /usr/lib/liblzma.so.5: xz
  /usr/lib/libz.so.1: zlib
