package:
  schema: 1
  name: brotli
  slug: brotli
  namespace: libs/compression
  version: 1.1.0
  description: Brotli compression library
  homepage: https://github.com/google/brotli
  checksum: 40a98017f2296c3268356920e3ad8a5e232c390fee1c9065a7b2eb1d03bfbc40

sources:
- name: brotli
  url: https://github.com/google/brotli/archive/refs/tags/v1.1.0.tar.gz
  sha256: e720a6ca29428b803f4ad165371771f5398faba397edf6778837a18599ea13ff

dependencies:
- name: glibc
  commit: x86_64/pkg/libs/system/glibc/2.39/bundles/dev
- name: gmp
  commit: x86_64/pkg/libs/system/gmp/6.3.0/bundles/dev
- name: libcap
  commit: x86_64/pkg/libs/security/libcap/2.69/bundles/dev
- name: mpfr
  commit: x86_64/pkg/libs/system/mpfr/4.2.1/bundles/dev
- name: gcc
  commit: x86_64/pkg/core/toolchain/gcc/13.2.0/bundles/dev
- name: binutils
  commit: x86_64/pkg/bootstrap/phase3/binutils/2.42/bundles/dev
- name: bash
  commit: x86_64/pkg/cli/shells/bash/5.2.21/bundles/dev
- name: ncurses
  commit: x86_64/pkg/libs/system/ncurses/6.4-20230520/bundles/dev
- name: acl
  commit: x86_64/pkg/libs/system/acl/2.3.2/bundles/dev
- name: attr
  commit: x86_64/pkg/libs/system/attr/2.5.2/bundles/dev
- name: tar
  commit: x86_64/pkg/cli/archive/tar/1.35/bundles/dev
- name: xz
  commit: x86_64/pkg/libs/compression/xz/5.4.6/bundles/dev
- name: zlib
  commit: x86_64/pkg/libs/system/zlib/1.3.1/bundles/dev
- name: coreutils
  commit: x86_64/pkg/core/userland/coreutils/9.5/bundles/dev
- name: findutils
  commit: x86_64/pkg/core/userland/findutils/4.9.0/bundles/dev
- name: 2nex-utilities
  commit: x86_64/pkg/bootstrap/phase3/2nex-utilities-bootstrap/0.0.1/bundles/dev
- name: linux-headers
  commit: x86_64/pkg/bootstrap/phase3/linux-headers/6.4.1/bundles/dev
- name: gawk
  commit: x86_64/pkg/cli/text/gawk/5.3.0/bundles/dev
- name: sed
  commit: x86_64/pkg/cli/text/sed/4.9/bundles/dev
- name: grep
  commit: x86_64/pkg/cli/text/grep/3.11/bundles/dev
- name: gzip
  commit: x86_64/pkg/cli/archive/gzip/1.13/bundles/dev
- name: bzip2
  commit: x86_64/pkg/libs/compression/bzip2/1.0.8/bundles/dev
- name: zstd
  commit: x86_64/pkg/libs/compression/zstd/1.5.6/bundles/dev
- name: cmake
  commit: x86_64/pkg/dev/build/cmake/3.21.2/bundles/dev
- name: make
  commit: x86_64/pkg/core/toolchain/make/4.4.1/bundles/dev

build:
  environment: 13ce31fd97c19f5756e4413babf279d543b5a71c
  profile: [4112:3703, 6171:3730]

  script: |
    tar --no-same-owner -xf /${SOURCE_brotli} -C "${WORK_DIR}" --strip-components=1
    cd ${WORK_DIR}

    cmake -B build \
      -DCMAKE_INSTALL_PREFIX=/usr \
      -DCMAKE_INSTALL_LIBDIR=lib \
      -DCMAKE_BUILD_TYPE=Release \
      -DBUILD_SHARED_LIBS=ON

    cmake --build build
    DESTDIR="${OUT_DIR}" cmake --install build

    find "${OUT_DIR}" -exec touch -d "2024-01-01T00:00:00+00:00" {} \;
    2nex_strip_binaries ${OUT_DIR}

bundles:
  dev:
  - bin
  - dev
  - lib

outputs:
  bin:
    files:
    - path: /usr/bin/brotli
      needs:
      - /usr/lib/ld-linux-x86-64.so.2
      - /usr/lib/libbrotlidec.so.1
      - /usr/lib/libbrotlienc.so.1
      - /usr/lib/libc.so.6

  dev:
    files:
    - path: /usr/include/brotli/decode.h
    - path: /usr/include/brotli/encode.h
    - path: /usr/include/brotli/port.h
    - path: /usr/include/brotli/shared_dictionary.h
    - path: /usr/include/brotli/types.h
    - path: /usr/lib/pkgconfig/libbrotlicommon.pc
    - path: /usr/lib/pkgconfig/libbrotlidec.pc
    - path: /usr/lib/pkgconfig/libbrotlienc.pc

  lib:
    files:
    - path: /usr/lib/libbrotlicommon.so
      needs:
      - /usr/lib/libc.so.6
    - path: /usr/lib/libbrotlicommon.so.1
      needs:
      - /usr/lib/libc.so.6
    - path: /usr/lib/libbrotlicommon.so.1.1.0
      needs:
      - /usr/lib/libc.so.6
    - path: /usr/lib/libbrotlidec.so
      needs:
      - /usr/lib/libbrotlicommon.so.1
      - /usr/lib/libc.so.6
    - path: /usr/lib/libbrotlidec.so.1
      needs:
      - /usr/lib/libbrotlicommon.so.1
      - /usr/lib/libc.so.6
    - path: /usr/lib/libbrotlidec.so.1.1.0
      needs:
      - /usr/lib/libbrotlicommon.so.1
      - /usr/lib/libc.so.6
    - path: /usr/lib/libbrotlienc.so
      needs:
      - /usr/lib/libbrotlicommon.so.1
      - /usr/lib/libc.so.6
      - /usr/lib/libm.so.6
    - path: /usr/lib/libbrotlienc.so.1
      needs:
      - /usr/lib/libbrotlicommon.so.1
      - /usr/lib/libc.so.6
      - /usr/lib/libm.so.6
    - path: /usr/lib/libbrotlienc.so.1.1.0
      needs:
      - /usr/lib/libbrotlicommon.so.1
      - /usr/lib/libc.so.6
      - /usr/lib/libm.so.6

resolution:
  /usr/lib/ld-linux-x86-64.so.2: glibc
  /usr/lib/libc.so.6: glibc
  /usr/lib/libm.so.6: glibc
  /usr/lib/libbrotlicommon.so.1: self
  /usr/lib/libbrotlidec.so.1: self
  /usr/lib/libbrotlienc.so.1: self
