package:
  schema: 1
  name: libxfont2
  slug: libxfont2
  namespace: libs/x11
  version: 2.0.7
  description: X font handling library for X servers
  homepage: https://xorg.freedesktop.org/
  checksum: d37a3ff57519273815afb61e1f591faf603a59b1ad17e2e5950180d4b32b9bcb

sources:
- name: libxfont2
  url: https://xorg.freedesktop.org/archive/individual/lib/libXfont2-2.0.7.tar.xz
  sha256: 8b7b82fdeba48769b69433e8e3fbb984a5f6bf368b0d5f47abeec49de3e58efb

dependencies:
- name: glibc
  commit: x86_64/pkg/libs/system/glibc/2.39/bundles/dev
- name: gmp
  commit: x86_64/pkg/libs/system/gmp/6.3.0/bundles/dev
- name: libcap
  commit: x86_64/pkg/libs/security/libcap/2.69/bundles/dev
- name: gcc
  commit: x86_64/pkg/core/toolchain/gcc/13.2.0/bundles/dev
- name: binutils
  commit: x86_64/pkg/core/toolchain/binutils/2.42/bundles/dev
- name: make
  commit: x86_64/pkg/core/toolchain/make/4.4.1/bundles/dev
- name: pkgconf
  commit: x86_64/pkg/core/toolchain/pkgconf/2.2.0/bundles/dev
- name: bash
  commit: x86_64/pkg/cli/shells/bash/5.2.21/bundles/dev
- name: ncurses
  commit: x86_64/pkg/libs/system/ncurses/6.4-20230520/bundles/dev
- name: acl
  commit: x86_64/pkg/libs/system/acl/2.3.2/bundles/dev
- name: attr
  commit: x86_64/pkg/libs/system/attr/2.5.2/bundles/dev
- name: tar
  commit: x86_64/pkg/cli/archive/tar/1.35/bundles/dev
- name: xz
  commit: x86_64/pkg/libs/compression/xz/5.4.6/bundles/dev
- name: zlib
  commit: x86_64/pkg/libs/system/zlib/1.3.1/bundles/dev
- name: coreutils
  commit: x86_64/pkg/core/userland/coreutils/9.5/bundles/dev
- name: findutils
  commit: x86_64/pkg/core/userland/findutils/4.9.0/bundles/dev
- name: linux-headers
  commit: x86_64/pkg/libs/system/linux-headers/6.4.1/bundles/dev
- name: gawk
  commit: x86_64/pkg/cli/text/gawk/5.3.0/bundles/dev
- name: sed
  commit: x86_64/pkg/cli/text/sed/4.9/bundles/dev
- name: grep
  commit: x86_64/pkg/cli/text/grep/3.11/bundles/dev
- name: xorgproto
  commit: x86_64/pkg/libs/x11/xorgproto/2024.1/bundles/dev
- name: xtrans
  commit: x86_64/pkg/libs/x11/xtrans/1.5.2/bundles/dev
- name: freetype
  commit: x86_64/pkg/libs/graphics/freetype/2.14.1/bundles/dev
- name: bzip2
  commit: x86_64/pkg/libs/compression/bzip2/1.0.8/bundles/dev
- name: libpng
  commit: x86_64/pkg/libs/graphics/libpng/1.6.51/bundles/dev
- name: libfontenc
  commit: x86_64/pkg/libs/x11/libfontenc/1.1.8/bundles/dev

build:
  environment: 27b6e5dc7ad152c9a17c2cabfcc5ee93daa9bbf0
  profile: [4138:1048, 8250:3360, 11625:4723]

  script: |
    tar --no-same-owner -xf /${SOURCE0} -C "${WORK_DIR}" --strip-components=1
    cd ${WORK_DIR}

    ./configure --prefix=/usr --disable-static --disable-devel-docs

    make
    make DESTDIR="${OUT_DIR}" install

    find ${OUT_DIR} -type f -executable -exec strip --strip-unneeded {} \; 2>/dev/null || true
    find ${OUT_DIR} -name '*.a' -exec objcopy --enable-deterministic-archives {} \; 2>/dev/null || true
    find "${OUT_DIR}" -exec touch -d "2024-01-01T00:00:00+00:00" {} \;

bundles:
  dev:
  - dev
  - lib

outputs:
  dev:
    files:
    - path: /usr/include/X11/fonts/libxfont2.h
    - path: /usr/lib/libXfont2.la
    - path: /usr/lib/pkgconfig/xfont2.pc

  lib:
    files:
    - path: /usr/lib/libXfont2.so
      needs:
      - /usr/lib/libc.so.6
      - /usr/lib/libfontenc.so.1
      - /usr/lib/libfreetype.so.6
      - /usr/lib/libm.so.6
      - /usr/lib/libz.so.1
    - path: /usr/lib/libXfont2.so.2
      needs:
      - /usr/lib/libc.so.6
      - /usr/lib/libfontenc.so.1
      - /usr/lib/libfreetype.so.6
      - /usr/lib/libm.so.6
      - /usr/lib/libz.so.1
    - path: /usr/lib/libXfont2.so.2.0.0
      needs:
      - /usr/lib/libc.so.6
      - /usr/lib/libfontenc.so.1
      - /usr/lib/libfreetype.so.6
      - /usr/lib/libm.so.6
      - /usr/lib/libz.so.1

resolution:
  /usr/lib/libfreetype.so.6: freetype
  /usr/lib/libc.so.6: glibc
  /usr/lib/libm.so.6: glibc
  /usr/lib/libfontenc.so.1: libfontenc
  /usr/lib/libz.so.1: zlib
