  commit: x86_64/pkg/libs/x11/libx11/1.8.10/bundles/dev
- name: libxcb
  commit: x86_64/pkg/libs/x11/libxcb/1.17.0/bundles/dev
- name: libxau
  commit: x86_64/pkg/libs/x11/libxau/1.0.12/bundles/dev
- name: libxdmcp
  commit: x86_64/pkg/libs/x11/libxdmcp/1.1.5/bundles/dev

build:
  environment: 27b6e5dc7ad152c9a17c2cabfcc5ee93daa9bbf0
  profile: [4138:842, 8271:2570, 8682:2585]

  script: |
    tar --no-same-owner -xf /${SOURCE0} -C "${WORK_DIR}" --strip-components=1
    cd ${WORK_DIR}

    ./configure --prefix=/usr --disable-static

    make
    make DESTDIR="${OUT_DIR}" install

    find ${OUT_DIR} -type f -executable -exec strip --strip-unneeded {} \; 2>/dev/null || true
    find ${OUT_DIR} -name '*.a' -exec objcopy --enable-deterministic-archives {} \; 2>/dev/null || true
    find "${OUT_DIR}" -exec touch -d "2024-01-01T00:00:00+00:00" {} \;

bundles:
  dev:
  - dev
  - lib

  full:
  - dev
  - lib
  - man

outputs:
  dev:
    files:
    - path: /usr/include/X11/extensions/Xfixes.h
    - path: /usr/lib/libXfixes.la
    - path: /usr/lib/pkgconfig/xfixes.pc

  lib:
    files:
    - path: /usr/lib/libXfixes.so
      needs:
      - /usr/lib/libX11.so.6
      - /usr/lib/libXau.so.6
      - /usr/lib/libXdmcp.so.6
      - /usr/lib/libc.so.6
      - /usr/lib/libxcb.so.1
    - path: /usr/lib/libXfixes.so.3
      needs:
      - /usr/lib/libX11.so.6
      - /usr/lib/libXau.so.6
      - /usr/lib/libXdmcp.so.6
      - /usr/lib/libc.so.6
      - /usr/lib/libxcb.so.1
    - path: /usr/lib/libXfixes.so.3.1.0
      needs:
      - /usr/lib/libX11.so.6
      - /usr/lib/libXau.so.6
      - /usr/lib/libXdmcp.so.6
      - /usr/lib/libc.so.6
      - /usr/lib/libxcb.so.1

  man:
    files:
    - path: /usr/share/man/man3/Xfixes.3

resolution:
  /usr/lib/libc.so.6: glibc
  /usr/lib/libX11.so.6: libx11
  /usr/lib/libXau.so.6: libxau
  /usr/lib/libxcb.so.1: libxcb
  /usr/lib/libXdmcp.so.6: libxdmcp
