package:
  schema: 1
  name: libxcvt
  slug: libxcvt
  namespace: libs/x11
  version: 0.1.3
  description: VESA CVT standard timing modelines generator
  homepage: https://gitlab.freedesktop.org/xorg/lib/libxcvt
  checksum: ded0ae70918da76796204582b4bf757a6c1871e88dfd2f9c26034ac5223be516

sources:
- name: libxcvt
  url: https://xorg.freedesktop.org/archive/individual/lib/libxcvt-0.1.3.tar.xz
  sha256: a929998a8767de7dfa36d6da4751cdbeef34ed630714f2f4a767b351f2442e01

dependencies:
- name: glibc
  commit: x86_64/pkg/libs/system/glibc/2.39/bundles/dev
- name: gmp
  commit: x86_64/pkg/libs/system/gmp/6.3.0/bundles/dev
- name: gcc
  commit: x86_64/pkg/core/toolchain/gcc/13.2.0/bundles/dev
- name: binutils
  commit: x86_64/pkg/core/toolchain/binutils/2.42/bundles/dev
- name: meson
  commit: x86_64/pkg/core/toolchain/meson/1.6.1/bundles/dev
- name: ninja
  commit: x86_64/pkg/core/toolchain/ninja/1.12.1/bundles/dev
- name: python3
  commit: x86_64/pkg/dev/lang/python3/3.12.2/bundles/dev
- name: bash
  commit: x86_64/pkg/cli/shells/bash/5.2.21/bundles/dev
- name: ncurses
  commit: x86_64/pkg/libs/system/ncurses/6.4-20230520/bundles/dev
- name: acl
  commit: x86_64/pkg/libs/system/acl/2.3.2/bundles/dev
- name: attr
  commit: x86_64/pkg/libs/system/attr/2.5.2/bundles/dev
- name: tar
  commit: x86_64/pkg/cli/archive/tar/1.35/bundles/dev
- name: xz
  commit: x86_64/pkg/libs/compression/xz/5.4.6/bundles/dev
- name: zlib
  commit: x86_64/pkg/libs/system/zlib/1.3.1/bundles/dev
- name: findutils
  commit: x86_64/pkg/core/userland/findutils/4.9.0/bundles/dev

build:
  environment: 27b6e5dc7ad152c9a17c2cabfcc5ee93daa9bbf0
  profile: [1845:655]

  script: |
    tar --no-same-owner -xf /${SOURCE0} -C "${WORK_DIR}" --strip-components=1
    cd ${WORK_DIR}

    meson setup build \
      --prefix=/usr \
      --buildtype=release

    ninja -C build
    DESTDIR="${OUT_DIR}" ninja -C build install

    find ${OUT_DIR} -type f -executable -exec strip --strip-unneeded {} \; 2>/dev/null || true
    find ${OUT_DIR} -name '*.a' -exec objcopy --enable-deterministic-archives {} \; 2>/dev/null || true
    find "${OUT_DIR}" -exec touch -d "2024-01-01T00:00:00+00:00" {} \;

bundles:
  dev:
  - bin
  - dev
  - lib

outputs:
  bin:
    files:
    - path: /usr/bin/cvt
      needs:
      - /usr/lib/ld-linux-x86-64.so.2
      - /usr/lib/libc.so.6
      - /usr/lib/libm.so.6
      - /usr/lib/libxcvt.so.0

  dev:
    files:
    - path: /usr/include/libxcvt/libxcvt.h
    - path: /usr/include/libxcvt/libxcvt_mode.h
    - path: /usr/lib/pkgconfig/libxcvt.pc

  lib:
    files:
    - path: /usr/lib/libxcvt.so
      needs:
      - /usr/lib/libc.so.6
    - path: /usr/lib/libxcvt.so.0
      needs:
      - /usr/lib/libc.so.6
    - path: /usr/lib/libxcvt.so.0.1.3
      needs:
      - /usr/lib/libc.so.6

  man:
    files:
    - path: /usr/share/man/man1/cvt.1

resolution:
  /usr/lib/ld-linux-x86-64.so.2: glibc
  /usr/lib/libc.so.6: glibc
  /usr/lib/libm.so.6: glibc
  /usr/lib/libxcvt.so.0: self
