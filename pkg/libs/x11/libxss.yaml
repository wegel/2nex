  commit: x86_64/pkg/libs/x11/libxdmcp/1.1.5/bundles/dev

build:
  environment: 27b6e5dc7ad152c9a17c2cabfcc5ee93daa9bbf0

  script: |
    tar --no-same-owner -xf /${SOURCE0} -C "${WORK_DIR}" --strip-components=1
    cd ${WORK_DIR}

    ./configure --prefix=/usr --disable-static

    make
    make DESTDIR="${OUT_DIR}" install

    find ${OUT_DIR} -type f -executable -exec strip --strip-unneeded {} \; 2>/dev/null || true
    find ${OUT_DIR} -name '*.a' -exec objcopy --enable-deterministic-archives {} \; 2>/dev/null || true
    find "${OUT_DIR}" -exec touch -d "2024-01-01T00:00:00+00:00" {} \;

bundles:
  dev:
  - dev
  - lib

  full:
  - dev
  - lib
  - man

outputs:
  dev:
    files:
    - path: /usr/include/X11/extensions/scrnsaver.h
    - path: /usr/lib/libXss.la
    - path: /usr/lib/pkgconfig/xscrnsaver.pc

  lib:
    files:
    - path: /usr/lib/libXss.so
      needs:
      - /usr/lib/libX11.so.6
      - /usr/lib/libXau.so.6
      - /usr/lib/libXdmcp.so.6
      - /usr/lib/libXext.so.6
      - /usr/lib/libc.so.6
      - /usr/lib/libxcb.so.1
    - path: /usr/lib/libXss.so.1
      needs:
      - /usr/lib/libX11.so.6
      - /usr/lib/libXau.so.6
      - /usr/lib/libXdmcp.so.6
      - /usr/lib/libXext.so.6
      - /usr/lib/libc.so.6
      - /usr/lib/libxcb.so.1
    - path: /usr/lib/libXss.so.1.0.0
      needs:
      - /usr/lib/libX11.so.6
      - /usr/lib/libXau.so.6
      - /usr/lib/libXdmcp.so.6
      - /usr/lib/libXext.so.6
      - /usr/lib/libc.so.6
      - /usr/lib/libxcb.so.1

  man:
    files:
    - path: /usr/share/man/man3/XScreenSaverAllocInfo.3
    - path: /usr/share/man/man3/XScreenSaverGetRegistered.3
    - path: /usr/share/man/man3/XScreenSaverQueryExtension.3
    - path: /usr/share/man/man3/XScreenSaverQueryInfo.3
    - path: /usr/share/man/man3/XScreenSaverQueryVersion.3
    - path: /usr/share/man/man3/XScreenSaverRegister.3
    - path: /usr/share/man/man3/XScreenSaverSelectInput.3
    - path: /usr/share/man/man3/XScreenSaverSetAttributes.3
    - path: /usr/share/man/man3/XScreenSaverSuspend.3
    - path: /usr/share/man/man3/XScreenSaverUnregister.3
    - path: /usr/share/man/man3/XScreenSaverUnsetAttributes.3
    - path: /usr/share/man/man3/Xss.3

resolution:
  /usr/lib/libc.so.6: glibc
  /usr/lib/libX11.so.6: libx11
