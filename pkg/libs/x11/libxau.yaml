package:
  schema: 1
  name: libxau
  slug: libxau
  namespace: libs/x11
  version: 1.0.12
  description: X11 authorization library
  homepage: https://xorg.freedesktop.org/
  checksum: 5c3428e1f6f6c6d39b9ea355466a8670d0c9ec66bbd4c5cac9a35ed99e9c0252

sources:
- name: libxau
  url: https://xorg.freedesktop.org/archive/individual/lib/libXau-1.0.12.tar.xz
  sha256: 74d0e4dfa3d39ad8939e99bda37f5967aba528211076828464d2777d477fc0fb

dependencies:
- name: glibc
  commit: x86_64/pkg/libs/system/glibc/2.39/bundles/dev
- name: gcc
  commit: x86_64/pkg/core/toolchain/gcc/13.2.0/bundles/dev
- name: binutils
  commit: x86_64/pkg/core/toolchain/binutils/2.42/bundles/dev
- name: meson
  commit: x86_64/pkg/core/toolchain/meson/1.6.1/bundles/dev
- name: ninja
  commit: x86_64/pkg/core/toolchain/ninja/1.12.1/bundles/dev
- name: python3
  commit: x86_64/pkg/dev/lang/python3/3.12.2/bundles/dev
- name: pkgconf
  commit: x86_64/pkg/core/toolchain/pkgconf/2.2.0/bundles/dev
- name: bash
  commit: x86_64/pkg/cli/shells/bash/5.2.21/bundles/dev
- name: ncurses
  commit: x86_64/pkg/libs/system/ncurses/6.4-20230520/bundles/dev
- name: acl
  commit: x86_64/pkg/libs/system/acl/2.3.2/bundles/dev
- name: attr
  commit: x86_64/pkg/libs/system/attr/2.5.2/bundles/dev
- name: tar
  commit: x86_64/pkg/cli/archive/tar/1.35/bundles/dev
- name: xz
  commit: x86_64/pkg/libs/compression/xz/5.4.6/bundles/dev
- name: zlib
  commit: x86_64/pkg/libs/system/zlib/1.3.1/bundles/dev
- name: coreutils
  commit: x86_64/pkg/core/userland/coreutils/9.5/bundles/dev
- name: findutils
  commit: x86_64/pkg/core/userland/findutils/4.9.0/bundles/dev
- name: linux-headers
  commit: x86_64/pkg/libs/system/linux-headers/6.4.1/bundles/dev
- name: sed
  commit: x86_64/pkg/cli/text/sed/4.9/bundles/dev
- name: xorgproto
  commit: x86_64/pkg/libs/x11/xorgproto/2024.1/bundles/dev

build:
  environment: 27b6e5dc7ad152c9a17c2cabfcc5ee93daa9bbf0
  profile: [3383:726]

  script: |
    tar --no-same-owner -xf /${SOURCE0} -C "${WORK_DIR}" --strip-components=1
    cd ${WORK_DIR}

    meson setup build \
      --prefix=/usr \
      --buildtype=release

    ninja -C build
    DESTDIR="${OUT_DIR}" ninja -C build install

    find ${OUT_DIR} -type f -executable -exec strip --strip-unneeded {} \; 2>/dev/null || true
    find ${OUT_DIR} -name '*.a' -exec objcopy --enable-deterministic-archives {} \; 2>/dev/null || true
    find "${OUT_DIR}" -exec touch -d "2024-01-01T00:00:00+00:00" {} \;

bundles:
  dev:
  - dev
  - lib

outputs:
  dev:
    files:
    - path: /usr/include/X11/Xauth.h
    - path: /usr/lib/pkgconfig/xau.pc

  lib:
    files:
    - path: /usr/lib/libXau.so
      needs:
      - /usr/lib/libc.so.6
    - path: /usr/lib/libXau.so.6
      needs:
      - /usr/lib/libc.so.6
    - path: /usr/lib/libXau.so.6.0.0
      needs:
      - /usr/lib/libc.so.6

  man:
    files:
    - path: /usr/share/man/man3/Xau.3
    - path: /usr/share/man/man3/XauDisposeAuth.3
    - path: /usr/share/man/man3/XauFileName.3
    - path: /usr/share/man/man3/XauGetAuthByAddr.3
    - path: /usr/share/man/man3/XauGetBestAuthByAddr.3
    - path: /usr/share/man/man3/XauLockAuth.3
    - path: /usr/share/man/man3/XauReadAuth.3
    - path: /usr/share/man/man3/XauUnlockAuth.3
    - path: /usr/share/man/man3/XauWriteAuth.3

resolution:
  /usr/lib/libc.so.6: glibc
