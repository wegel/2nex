- name: attr
  commit: x86_64/pkg/libs/system/attr/2.5.2/bundles/dev
- name: tar
  commit: x86_64/pkg/cli/archive/tar/1.35/bundles/dev
- name: xz
  commit: x86_64/pkg/libs/compression/xz/5.4.6/bundles/dev
- name: zlib
  commit: x86_64/pkg/libs/system/zlib/1.3.1/bundles/dev
- name: coreutils
  commit: x86_64/pkg/core/userland/coreutils/9.5/bundles/dev
- name: findutils
  commit: x86_64/pkg/core/userland/findutils/4.9.0/bundles/dev
- name: 2nex-utilities
  commit: x86_64/pkg/bootstrap/phase3/2nex-utilities-bootstrap/0.0.1/bundles/dev
- name: linux-headers
  commit: x86_64/pkg/bootstrap/phase3/linux-headers/6.4.1/bundles/dev
- name: gawk
  commit: x86_64/pkg/cli/text/gawk/5.3.0/bundles/dev
- name: sed
  commit: x86_64/pkg/cli/text/sed/4.9/bundles/dev
- name: grep
  commit: x86_64/pkg/cli/text/grep/3.11/bundles/dev
- name: xorgproto
  commit: x86_64/pkg/libs/x11/xorgproto/2024.1/bundles/dev
- name: libx11
  commit: x86_64/pkg/libs/x11/libx11/1.8.10/bundles/dev
- name: libxcb
  commit: x86_64/pkg/libs/x11/libxcb/1.17.0/bundles/dev
- name: libxau
  commit: x86_64/pkg/libs/x11/libxau/1.0.12/bundles/dev
- name: libxdmcp
  commit: x86_64/pkg/libs/x11/libxdmcp/1.1.5/bundles/dev

build:
  environment: 13ce31fd97c19f5756e4413babf279d543b5a71c
  profile: [4139:963, 8257:2826, 12388:2830, 16515:2831, 20716:2833, 24837:2836, 27853:3779]

  script: |
    tar --no-same-owner -xf /${SOURCE0} -C "${WORK_DIR}" --strip-components=1
    cd ${WORK_DIR}

    ./configure --prefix=/usr --disable-static

    make
    make DESTDIR="${OUT_DIR}" install

    find "${OUT_DIR}" -exec touch -d "2024-01-01T00:00:00+00:00" {} \;
    2nex_strip_binaries ${OUT_DIR}

bundles:
  dev:
  - dev
  - lib

outputs:
  dev:
    files:
    - path: /usr/include/X11/extensions/XKBbells.h
    - path: /usr/include/X11/extensions/XKBconfig.h
    - path: /usr/include/X11/extensions/XKBfile.h
    - path: /usr/include/X11/extensions/XKBrules.h
    - path: /usr/include/X11/extensions/XKM.h
    - path: /usr/include/X11/extensions/XKMformat.h
    - path: /usr/lib/libxkbfile.la
    - path: /usr/lib/pkgconfig/xkbfile.pc

  lib:
    files:
    - path: /usr/lib/libxkbfile.so
      needs:
      - /usr/lib/libX11.so.6
      - /usr/lib/libXau.so.6
      - /usr/lib/libXdmcp.so.6
      - /usr/lib/libc.so.6
      - /usr/lib/libxcb.so.1
    - path: /usr/lib/libxkbfile.so.1
      needs:
      - /usr/lib/libX11.so.6
      - /usr/lib/libXau.so.6
      - /usr/lib/libXdmcp.so.6
      - /usr/lib/libc.so.6
      - /usr/lib/libxcb.so.1
    - path: /usr/lib/libxkbfile.so.1.0.2
      needs:
      - /usr/lib/libX11.so.6
      - /usr/lib/libXau.so.6
      - /usr/lib/libXdmcp.so.6
      - /usr/lib/libc.so.6
      - /usr/lib/libxcb.so.1

resolution:
  /usr/lib/libc.so.6: glibc
  /usr/lib/libX11.so.6: libx11
  /usr/lib/libXau.so.6: libxau
  /usr/lib/libxcb.so.1: libxcb
  /usr/lib/libXdmcp.so.6: libxdmcp
