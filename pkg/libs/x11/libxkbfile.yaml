package:
  schema: 1
  name: libxkbfile
  slug: libxkbfile
  namespace: libs/x11
  version: 1.1.3
  description: XKB file handling library
  homepage: https://xorg.freedesktop.org/
  checksum: fbcd48e65f0fffccc75b761f59b00f9d7297f3f5cab2594f7814b10c65a30049

sources:
- name: libxkbfile
  url: https://xorg.freedesktop.org/archive/individual/lib/libxkbfile-1.1.3.tar.xz
  sha256: a9b63eea997abb9ee6a8b4fbb515831c841f471af845a09de443b28003874bec

dependencies:
- name: glibc
  commit: x86_64/pkg/libs/system/glibc/2.39/bundles/dev
- name: gmp
  commit: x86_64/pkg/libs/system/gmp/6.3.0/bundles/dev
- name: libcap
  commit: x86_64/pkg/libs/security/libcap/2.69/bundles/dev
- name: gcc
  commit: x86_64/pkg/core/toolchain/gcc/13.2.0/bundles/dev
- name: binutils
  commit: x86_64/pkg/core/toolchain/binutils/2.42/bundles/dev
- name: make
  commit: x86_64/pkg/core/toolchain/make/4.4.1/bundles/dev
- name: pkgconf
  commit: x86_64/pkg/core/toolchain/pkgconf/2.2.0/bundles/dev
- name: bash
  commit: x86_64/pkg/cli/shells/bash/5.2.21/bundles/dev
- name: ncurses
  commit: x86_64/pkg/libs/system/ncurses/6.4-20230520/bundles/dev
- name: acl
  commit: x86_64/pkg/libs/system/acl/2.3.2/bundles/dev
- name: attr
  commit: x86_64/pkg/libs/system/attr/2.5.2/bundles/dev
- name: tar
  commit: x86_64/pkg/cli/archive/tar/1.35/bundles/dev
- name: xz
  commit: x86_64/pkg/libs/compression/xz/5.4.6/bundles/dev
- name: zlib
  commit: x86_64/pkg/libs/system/zlib/1.3.1/bundles/dev
- name: coreutils
  commit: x86_64/pkg/core/userland/coreutils/9.5/bundles/dev
- name: findutils
  commit: x86_64/pkg/core/userland/findutils/4.9.0/bundles/dev
- name: linux-headers
  commit: x86_64/pkg/libs/system/linux-headers/6.4.1/bundles/dev
- name: gawk
  commit: x86_64/pkg/cli/text/gawk/5.3.0/bundles/dev
- name: sed
  commit: x86_64/pkg/cli/text/sed/4.9/bundles/dev
- name: grep
  commit: x86_64/pkg/cli/text/grep/3.11/bundles/dev
- name: xorgproto
  commit: x86_64/pkg/libs/x11/xorgproto/2024.1/bundles/dev
- name: libx11
  commit: x86_64/pkg/libs/x11/libx11/1.8.10/bundles/dev
- name: libxcb
  commit: x86_64/pkg/libs/x11/libxcb/1.17.0/bundles/dev
- name: libxau
  commit: x86_64/pkg/libs/x11/libxau/1.0.12/bundles/dev
- name: libxdmcp
  commit: x86_64/pkg/libs/x11/libxdmcp/1.1.5/bundles/dev

build:
  environment: 27b6e5dc7ad152c9a17c2cabfcc5ee93daa9bbf0
  profile: [4139:1209, 8260:2991, 12440:2994, 16597:2996, 20710:2998, 24818:3001, 27115:3943]

  script: |
    tar --no-same-owner -xf /${SOURCE0} -C "${WORK_DIR}" --strip-components=1
    cd ${WORK_DIR}

    ./configure --prefix=/usr --disable-static

    make
    make DESTDIR="${OUT_DIR}" install

    find "${OUT_DIR}" -exec touch -d "2024-01-01T00:00:00+00:00" {} \;
    find ${OUT_DIR} -type f -executable -exec strip --strip-unneeded {} \; 2>/dev/null || true
    find ${OUT_DIR} -name '*.a' -exec objcopy --enable-deterministic-archives {} \; 2>/dev/null || true

bundles:
  dev:
  - dev
  - lib

outputs:
  dev:
    files:
    - path: /usr/include/X11/extensions/XKBbells.h
    - path: /usr/include/X11/extensions/XKBconfig.h
    - path: /usr/include/X11/extensions/XKBfile.h
    - path: /usr/include/X11/extensions/XKBrules.h
    - path: /usr/include/X11/extensions/XKM.h
    - path: /usr/include/X11/extensions/XKMformat.h
    - path: /usr/lib/libxkbfile.la
    - path: /usr/lib/pkgconfig/xkbfile.pc

  lib:
    files:
    - path: /usr/lib/libxkbfile.so
      needs:
      - /usr/lib/libX11.so.6
      - /usr/lib/libXau.so.6
      - /usr/lib/libXdmcp.so.6
      - /usr/lib/libc.so.6
      - /usr/lib/libxcb.so.1
    - path: /usr/lib/libxkbfile.so.1
      needs:
      - /usr/lib/libX11.so.6
      - /usr/lib/libXau.so.6
      - /usr/lib/libXdmcp.so.6
      - /usr/lib/libc.so.6
      - /usr/lib/libxcb.so.1
    - path: /usr/lib/libxkbfile.so.1.0.2
      needs:
      - /usr/lib/libX11.so.6
      - /usr/lib/libXau.so.6
      - /usr/lib/libXdmcp.so.6
      - /usr/lib/libc.so.6
      - /usr/lib/libxcb.so.1

resolution:
  /usr/lib/libc.so.6: glibc
  /usr/lib/libX11.so.6: libx11
  /usr/lib/libXau.so.6: libxau
  /usr/lib/libxcb.so.1: libxcb
  /usr/lib/libXdmcp.so.6: libxdmcp
