build:
  profile: [4105:1907, 8288:4111, 12389:9355, 16529:30135, 20673:30207, 24769:30220, 25089:30221]

  script: |
    tar --no-same-owner -xf ${SOURCE0} -C "${WORK_DIR}" --strip-components=1
    cd ${WORK_DIR}

    export LDFLAGS="${LDFLAGS} -lstdc++"

    meson setup build \
      --prefix=/usr \
      --buildtype=release \
      -Ddocs=disabled \
      -Dtests=disabled \
      -Dintrospection=disabled

    ninja -C build
    DESTDIR="${OUT_DIR}" ninja -C build install

    find "${OUT_DIR}" -exec touch -d "2024-01-01T00:00:00+00:00" {} \;
    2nex_strip_binaries ${OUT_DIR}

