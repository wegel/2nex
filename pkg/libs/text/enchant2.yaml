package:
  schema: 1
  name: enchant2
  slug: enchant2
  namespace: libs/text
  version: 2.8.2
  description: Generic spell checking library
  homepage: https://github.com/rrthomas/enchant
  checksum: 9df833a28a432f6d9de32f0dbc8e083cdd8a4a34b0390d8dadaa77520d70e5f8

sources:
- name: enchant
  url: https://github.com/rrthomas/enchant/releases/download/v2.8.2/enchant-2.8.2.tar.gz
  sha256: 8f19535adb5577b83b00e02f330fe9b9eb40dd21f19e2899636fc4d3a7696375

dependencies:
- name: glibc
  commit: x86_64/pkg/libs/system/glibc/2.39/bundles/dev
- name: gmp
  commit: x86_64/pkg/libs/system/gmp/6.3.0/bundles/dev
- name: libcap
  commit: x86_64/pkg/libs/security/libcap/2.69/bundles/dev
- name: gcc
  commit: x86_64/pkg/core/toolchain/gcc/13.2.0/bundles/dev
- name: binutils
  commit: x86_64/pkg/core/toolchain/binutils/2.42/bundles/dev
- name: bash
  commit: x86_64/pkg/cli/shells/bash/5.2.21/bundles/dev
- name: ncurses
  commit: x86_64/pkg/libs/system/ncurses/6.4-20230520/bundles/dev
- name: acl
  commit: x86_64/pkg/libs/system/acl/2.3.2/bundles/dev
- name: attr
  commit: x86_64/pkg/libs/system/attr/2.5.2/bundles/dev
- name: tar
  commit: x86_64/pkg/cli/archive/tar/1.35/bundles/dev
- name: gzip
  commit: x86_64/pkg/cli/archive/gzip/1.13/bundles/dev
- name: zlib
  commit: x86_64/pkg/libs/system/zlib/1.3.1/bundles/dev
- name: coreutils
  commit: x86_64/pkg/core/userland/coreutils/9.5/bundles/dev
- name: findutils
  commit: x86_64/pkg/core/userland/findutils/4.9.0/bundles/dev
- name: linux-headers
  commit: x86_64/pkg/libs/system/linux-headers/6.4.1/bundles/dev
- name: gawk
  commit: x86_64/pkg/cli/text/gawk/5.3.0/bundles/dev
- name: sed
  commit: x86_64/pkg/cli/text/sed/4.9/bundles/dev
- name: grep
  commit: x86_64/pkg/cli/text/grep/3.11/bundles/dev
- name: make
  commit: x86_64/pkg/core/toolchain/make/4.4.1/bundles/dev
- name: pkgconf
  commit: x86_64/pkg/core/toolchain/pkgconf/2.2.0/bundles/dev
- name: glib2
  commit: x86_64/pkg/dev/libs/glib2/2.84.0/bundles/dev
- name: libffi
  commit: x86_64/pkg/libs/system/libffi/3.4.6/bundles/dev
- name: pcre2
  commit: x86_64/pkg/dev/libs/pcre2/10.44/bundles/dev
- name: util-linux
  commit: x86_64/pkg/core/userland/util_linux/2.40/bundles/dev

build:
  environment: 27b6e5dc7ad152c9a17c2cabfcc5ee93daa9bbf0
  profile: [4107:1019, 12351:3093, 24696:7811, 42817:13104, 54266:13106, 65447:13137, 79234:13173, 99903:13197, 121749:13644, 129757:14011]

  script: |
    tar --no-same-owner -xzf /${SOURCE_enchant} -C "${WORK_DIR}" --strip-components=1
    cd ${WORK_DIR}

    ./configure \
      --prefix=/usr \
      --disable-static \
      --without-aspell \
      --without-hunspell \
      --without-nuspell \
      --without-voikko \
      --without-applespell \
      --without-zemberek

    # disable html doc generation (needs groff)
    sed -i 's/^nodist_doc_DATA.*/nodist_doc_DATA =/' lib/Makefile
    sed -i 's/^nodist_doc_DATA.*/nodist_doc_DATA =/' src/Makefile

    make
    make DESTDIR="${OUT_DIR}" install

    find ${OUT_DIR} -type f -executable -exec strip --strip-unneeded {} \; 2>/dev/null || true
    find ${OUT_DIR} -name '*.a' -exec objcopy --enable-deterministic-archives {} \; 2>/dev/null || true
    find "${OUT_DIR}" -exec touch -d "2024-01-01T00:00:00+00:00" {} \;

bundles:
  dev:
  - bin
  - dev
  - lib

outputs:
  bin:
    files:
    - path: /usr/bin/enchant-2
      needs:
      - /usr/lib/ld-linux-x86-64.so.2
      - /usr/lib/libc.so.6
      - /usr/lib/libenchant-2.so.2
      - /usr/lib/libglib-2.0.so.0
    - path: /usr/bin/enchant-lsmod-2
      needs:
      - /usr/lib/ld-linux-x86-64.so.2
      - /usr/lib/libc.so.6
      - /usr/lib/libenchant-2.so.2

  dev:
    files:
    - path: /usr/include/enchant-2/enchant++.h
    - path: /usr/include/enchant-2/enchant.h
    - path: /usr/lib/libenchant-2.la
    - path: /usr/lib/pkgconfig/enchant-2.pc

  lib:
    files:
    - path: /usr/lib/libenchant-2.so
      needs:
      - /usr/lib/libc.so.6
      - /usr/lib/libgio-2.0.so.0
      - /usr/lib/libglib-2.0.so.0
      - /usr/lib/libgmodule-2.0.so.0
      - /usr/lib/libgobject-2.0.so.0
    - path: /usr/lib/libenchant-2.so.2
      needs:
      - /usr/lib/libc.so.6
      - /usr/lib/libgio-2.0.so.0
      - /usr/lib/libglib-2.0.so.0
      - /usr/lib/libgmodule-2.0.so.0
      - /usr/lib/libgobject-2.0.so.0
    - path: /usr/lib/libenchant-2.so.2.8.2
      needs:
      - /usr/lib/libc.so.6
      - /usr/lib/libgio-2.0.so.0
      - /usr/lib/libglib-2.0.so.0
      - /usr/lib/libgmodule-2.0.so.0
      - /usr/lib/libgobject-2.0.so.0

  man:
    files:
    - path: /usr/share/man/man1/enchant-2.1
    - path: /usr/share/man/man1/enchant-lsmod-2.1
    - path: /usr/share/man/man5/enchant.5

  misc:
    files:
    - path: /usr/share/enchant-2/enchant.ordering

resolution:
  /usr/lib/libgio-2.0.so.0: glib2
  /usr/lib/libglib-2.0.so.0: glib2
  /usr/lib/libgmodule-2.0.so.0: glib2
  /usr/lib/libgobject-2.0.so.0: glib2
  /usr/lib/ld-linux-x86-64.so.2: glibc
  /usr/lib/libc.so.6: glibc
  /usr/lib/libenchant-2.so.2: self
