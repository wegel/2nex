package:
  schema: 1
  name: libxslt
  slug: libxslt
  namespace: libs/text
  version: 1.1.42
  description: XSLT C library and tools
  homepage: https://gitlab.gnome.org/GNOME/libxslt
  checksum: 51580debecfb2979957c7c825fb7ede217ac9a51effbac0cc9b80251c58fb08f

sources:
- name: libxslt
  url: https://download.gnome.org/sources/libxslt/1.1/libxslt-1.1.42.tar.xz
  sha256: 85ca62cac0d41fc77d3f6033da9df6fd73d20ea2fc18b0a3609ffb4110e1baeb

dependencies:
- name: bash
  commit: x86_64/pkg/cli/shells/bash/5.2.21/bundles/dev
- name: coreutils
  commit: x86_64/pkg/core/userland/coreutils/9.5/bundles/dev
- name: findutils
  commit: x86_64/pkg/core/userland/findutils/4.9.0/bundles/dev
