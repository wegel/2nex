    - path: /usr/include/libxslt/documents.h
    - path: /usr/include/libxslt/extensions.h
    - path: /usr/include/libxslt/extra.h
    - path: /usr/include/libxslt/functions.h
    - path: /usr/include/libxslt/imports.h
    - path: /usr/include/libxslt/keys.h
    - path: /usr/include/libxslt/namespaces.h
