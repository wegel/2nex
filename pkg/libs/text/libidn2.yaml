  name: libidn2
  slug: libidn2
  namespace: libs/text
  version: 2.3.7
  description: Internationalized Domain Names library
  homepage: https://www.gnu.org/software/libidn/
  checksum: fde98bc8e78f57b843a525080efcc1848c5f5c9f58457b29ea20fd93feb006a3

sources:
- name: libidn2
  url: https://ftp.gnu.org/gnu/libidn/libidn2-2.3.7.tar.gz
  sha256: 4c21a791b610b9519b9d0e12b8097bf2f359b12f8dd92647611a929e6bfd7d64

dependencies:
- name: linux-headers
  commit: x86_64/pkg/libs/system/linux-headers/6.4.1/bundles/dev
- name: glibc
  commit: x86_64/pkg/libs/system/glibc/2.39/bundles/dev
- name: zlib
