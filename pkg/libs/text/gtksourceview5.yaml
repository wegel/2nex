build:
  environment: 27b6e5dc7ad152c9a17c2cabfcc5ee93daa9bbf0
  profile: [4106:944, 8247:1238, 12435:2334, 20683:3268, 24867:3741, 33132:10778, 37242:10778, 49677:10791, 58002:10795, 61798:10913]

  script: |
    tar --no-same-owner -xf /${SOURCE_gtksourceview} -C "${WORK_DIR}" --strip-components=1
    cd ${WORK_DIR}

    mkdir -p /usr/local/include

    meson setup build \
      --prefix=/usr \
      --libdir=lib \
      --buildtype=release \
      -Ddocumentation=false \
      -Dintrospection=disabled \
      -Dvapi=false

    ninja -C build
    DESTDIR="${OUT_DIR}" ninja -C build install

    find ${OUT_DIR} -type f -executable -exec strip --strip-unneeded {} \; 2>/dev/null || true
    find ${OUT_DIR} -name '*.a' -exec objcopy --enable-deterministic-archives {} \; 2>/dev/null || true
    find "${OUT_DIR}" -exec touch -d "2024-01-01T00:00:00+00:00" {} \;

