package:
  schema: 1
  name: oniguruma
  slug: oniguruma
  namespace: libs/text
  version: 6.9.10
  description: Regular expression library supporting various character encodings
  homepage: https://github.com/kkos/oniguruma
  checksum: 8690e7babc8be017110cbfc302f16f1158fad4b4bb7cbdbe8062118e100dc812

sources:
- name: oniguruma
  url: https://github.com/kkos/oniguruma/releases/download/v6.9.10/onig-6.9.10.tar.gz
  sha256: 2a5cfc5ae259e4e97f86b68dfffc152cdaffe94e2060b770cb827238d769fc05

dependencies:
- name: bash
  commit: x86_64/pkg/cli/shells/bash/5.2.21/bundles/dev
- name: coreutils
  commit: x86_64/pkg/core/userland/coreutils/9.5/bundles/dev
- name: findutils
  commit: x86_64/pkg/core/userland/findutils/4.9.0/bundles/dev
- name: 2nex-utilities
  commit: x86_64/pkg/bootstrap/phase3/2nex-utilities-bootstrap/0.0.1/bundles/dev
- name: gzip
  commit: x86_64/pkg/cli/archive/gzip/1.13/bundles/dev
- name: tar
  commit: x86_64/pkg/cli/archive/tar/1.35/bundles/dev
- name: binutils
  commit: x86_64/pkg/bootstrap/phase3/binutils/2.42/bundles/dev
- name: glibc
  commit: x86_64/pkg/libs/system/glibc/2.39/bundles/dev
- name: gcc
  commit: x86_64/pkg/core/toolchain/gcc/13.2.0/bundles/dev
- name: make
  commit: x86_64/pkg/core/toolchain/make/4.4.1/bundles/dev
- name: linux-headers
  commit: x86_64/pkg/bootstrap/phase3/linux-headers/6.4.1/bundles/dev
- name: ncurses
  commit: x86_64/pkg/libs/system/ncurses/6.4-20230520/bundles/dev
- name: acl
  commit: x86_64/pkg/libs/system/acl/2.3.2/bundles/dev
- name: attr
  commit: x86_64/pkg/libs/system/attr/2.5.2/bundles/dev
- name: gmp
  commit: x86_64/pkg/libs/system/gmp/6.3.0/bundles/dev
- name: mpfr
  commit: x86_64/pkg/libs/system/mpfr/4.2.1/bundles/dev
- name: zlib
  commit: x86_64/pkg/libs/system/zlib/1.3.1/bundles/dev
- name: libcap
  commit: x86_64/pkg/libs/security/libcap/2.69/bundles/dev
- name: sed
  commit: x86_64/pkg/cli/text/sed/4.9/bundles/dev
- name: gawk
  commit: x86_64/pkg/cli/text/gawk/5.3.0/bundles/dev
- name: grep
  commit: x86_64/pkg/cli/text/grep/3.11/bundles/dev
- name: gettext
  commit: x86_64/pkg/cli/text/gettext/0.22.5/bundles/dev

build:
  environment: 13ce31fd97c19f5756e4413babf279d543b5a71c
  profile: [4103:813, 8446:1454, 12864:1456, 21390:1494, 29884:1522, 38402:1555, 42572:1568, 55388:1623, 64807:2117, 69393:3211]

  script: |
    tar --no-same-owner -xf ${SOURCE_oniguruma} -C "${WORK_DIR}" --strip-components=1
    cd ${WORK_DIR}

    ./configure --prefix=/usr

    make -j${MAKEFLAGS#-j}
    make DESTDIR=${OUT_DIR} install

    find "${OUT_DIR}" -exec touch -d '2024-01-01T00:00:00+00:00' {} \;
    2nex_strip_binaries ${OUT_DIR}

bundles:
  dev:
  - dev
  - lib

outputs:
  bin:
    files:
    - path: /usr/bin/onig-config

  dev:
    files:
    - path: /usr/include/oniggnu.h
    - path: /usr/include/oniguruma.h
    - path: /usr/lib/libonig.la
    - path: /usr/lib/pkgconfig/oniguruma.pc

  lib:
    files:
    - path: /usr/lib/libonig.so
      needs:
      - /usr/lib/libc.so.6
    - path: /usr/lib/libonig.so.5
      needs:
      - /usr/lib/libc.so.6
    - path: /usr/lib/libonig.so.5.5.0
      needs:
      - /usr/lib/libc.so.6

  static:
    files:
    - path: /usr/lib/libonig.a

resolution:
  /usr/lib/libc.so.6: glibc
