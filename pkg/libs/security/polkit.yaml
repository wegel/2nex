build:
  environment: 27b6e5dc7ad152c9a17c2cabfcc5ee93daa9bbf0
  profile: [4126:736, 12444:1059, 20774:1082, 33198:1088, 45676:1094, 58188:1121, 66487:1122, 82982:1147, 99558:1147, 109990:3024]

  script: |
    tar --no-same-owner -xf /${SOURCE_polkit} -C "${WORK_DIR}" --strip-components=1
    cd "${WORK_DIR}"
    patch --batch --fuzz=0 -Np1 -i "/${SOURCE_run_tier_patch}"

    meson setup build \
      --prefix=/usr \
      --sysconfdir=/etc \
      --localstatedir=/var \
      --libdir=lib \
      --buildtype=release \
      -Dsession_tracking=libsystemd-login \
      -Dauthfw=pam \
      -Dpam_prefix=/usr/lib/pam.d \
      -Dos_type=lfs \
      -Djs_engine=duktape \
      -Dexamples=false \
      -Dtests=false \
      -Dintrospection=false \
      -Dgtk_doc=false \
      -Dman=false

    ninja -C build
    DESTDIR="${OUT_DIR}" ninja -C build install

    # Drives the real, newly built polkitd through a live authorization
    # decision over a private D-Bus system bus, checking which rules.d
    # tier decides for a same-named file and that a missing /run tier is
    # tolerated, instead of reimplementing the sort order this package
    # patches; see the check script for detail.
    sh "/${SOURCE_run_tier_check}" "${OUT_DIR}" "${WORK_DIR}"

    find "${OUT_DIR}" -type f -executable -exec strip --strip-unneeded {} \; 2>/dev/null || true
    find "${OUT_DIR}" -name '*.a' -exec objcopy --enable-deterministic-archives {} \; 2>/dev/null || true
    find "${OUT_DIR}" -exec touch -d "2024-01-01T00:00:00+00:00" {} \;

