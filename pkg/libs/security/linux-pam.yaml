build:
  environment: 27b6e5dc7ad152c9a17c2cabfcc5ee93daa9bbf0
  profile: [4099:2159, 8255:2281, 12395:2377, 16526:2477, 20664:3107, 24795:3774, 28975:3774, 29968:3914]

  script: |
    set -eu
    tar --no-same-owner -xf /${SOURCE0} -C "${WORK_DIR}" --strip-components=1
    cd ${WORK_DIR}
    patch --batch --fuzz=0 -Np1 -i "/${SOURCE_uapi_config}"

    meson setup build \
      --prefix=/usr \
      --sbindir=/usr/bin \
      --buildtype=release \
      -Ddocs=disabled \
      -Dexamples=false \
      -Deconf=enabled \
      -Dvendordir=/usr/lib

    ninja -C build
    meson test -C build tst-pam_config --print-errorlogs
    DESTDIR="${OUT_DIR}" ninja -C build install
    rmdir \
      "${OUT_DIR}/etc/security/limits.d" \
      "${OUT_DIR}/etc/security/namespace.d" \
      "${OUT_DIR}/etc/security" \
      "${OUT_DIR}/etc"

    # setuid for unix_chkpwd (needed for non-root password checks)
    chmod 4755 "${OUT_DIR}/usr/bin/unix_chkpwd"

    smoke_bin="${WORK_DIR}/pam-uapi-smoke"
    smoke_service=uapi-service-smoke
    limits_service=uapi-limits-smoke
    env_service=uapi-env-smoke
    gcc "/${SOURCE_uapi_smoke}" \
      -I"${OUT_DIR}/usr/include" \
      -L"${OUT_DIR}/usr/lib" \
      -Wl,-rpath,"${OUT_DIR}/usr/lib" \
      -lpam \
      -o "${smoke_bin}"

    mkdir -p /etc/pam.d /run/pam.d /usr/lib/pam.d
    printf 'auth required %s\n' \
      "${OUT_DIR}/usr/lib/security/pam_permit.so" \
      > "/usr/lib/pam.d/${smoke_service}"
    LD_LIBRARY_PATH="${OUT_DIR}/usr/lib" \
      "${smoke_bin}" "${smoke_service}" auth allow

    printf 'auth required %s\n' \
      "${OUT_DIR}/usr/lib/security/pam_deny.so" \
      > "/run/pam.d/${smoke_service}"
    LD_LIBRARY_PATH="${OUT_DIR}/usr/lib" \
      "${smoke_bin}" "${smoke_service}" auth deny

    printf 'auth required %s\n' \
      "${OUT_DIR}/usr/lib/security/pam_permit.so" \
      > "/etc/pam.d/${smoke_service}"
    LD_LIBRARY_PATH="${OUT_DIR}/usr/lib" \
      "${smoke_bin}" "${smoke_service}" auth allow

    printf 'session required %s\n' \
      "${OUT_DIR}/usr/lib/security/pam_limits.so" \
      > "/usr/lib/pam.d/${limits_service}"
    mkdir -p /usr/lib/security/limits.d /run/security/limits.d /etc/security/limits.d
    printf 'root:x:0:0:root:/root:/bin/sh\n' > /etc/passwd

    printf 'root soft nofile 2010\n' > /usr/lib/security/limits.conf
    LD_LIBRARY_PATH="${OUT_DIR}/usr/lib" \
      "${smoke_bin}" "${limits_service}" session-limit 2010
    printf 'root soft nofile 2020\n' > /run/security/limits.conf
    LD_LIBRARY_PATH="${OUT_DIR}/usr/lib" \
      "${smoke_bin}" "${limits_service}" session-limit 2020
    printf 'root soft nofile 2030\n' > /etc/security/limits.conf
    LD_LIBRARY_PATH="${OUT_DIR}/usr/lib" \
      "${smoke_bin}" "${limits_service}" session-limit 2030
    : > /etc/security/limits.conf
    LD_LIBRARY_PATH="${OUT_DIR}/usr/lib" \
      "${smoke_bin}" "${limits_service}" session-limit unchanged

    rm /usr/lib/security/limits.conf /run/security/limits.conf /etc/security/limits.conf
    printf 'root soft nofile 2040\n' > /usr/lib/security/limits.d/10-vendor.conf
    printf 'root soft nofile 2050\n' > /run/security/limits.d/20-runtime.conf
    printf 'root soft nofile 2060\n' > /etc/security/limits.d/30-admin.conf
    LD_LIBRARY_PATH="${OUT_DIR}/usr/lib" \
      "${smoke_bin}" "${limits_service}" session-limit 2060

    printf 'session required %s\n' \
      "${OUT_DIR}/usr/lib/security/pam_env.so" \
      > "/usr/lib/pam.d/${env_service}"
    cp "${OUT_DIR}/usr/lib/security/pam_env.conf" /usr/lib/security/pam_env.conf
    printf 'UAPI_LAYER=vendor\n' > /usr/lib/environment
    printf 'UAPI_LAYER=runtime\n' > /run/environment
    printf 'UAPI_LAYER=admin\n' > /etc/environment
    LD_LIBRARY_PATH="${OUT_DIR}/usr/lib" \
      "${smoke_bin}" "${env_service}" session-env UAPI_LAYER admin
    rm /etc/environment
    LD_LIBRARY_PATH="${OUT_DIR}/usr/lib" \
      "${smoke_bin}" "${env_service}" session-env UAPI_LAYER runtime
    rm /run/environment
    LD_LIBRARY_PATH="${OUT_DIR}/usr/lib" \
      "${smoke_bin}" "${env_service}" session-env UAPI_LAYER vendor
    : > /etc/environment
    LD_LIBRARY_PATH="${OUT_DIR}/usr/lib" \
      "${smoke_bin}" "${env_service}" session-env-absent UAPI_LAYER

    # pam_namespace_helper prepares the polyinstantiated directories that
    # pam_namespace declares, so it must select the same namespace.conf the
    # module does rather than only the administrator copy.
    helper="${OUT_DIR}/usr/bin/pam_namespace_helper"
    mkdir -p /usr/lib/security /run/security /etc/security
    rm -f /usr/lib/security/namespace.conf /run/security/namespace.conf \
      /etc/security/namespace.conf

    assert_helper_tier() {
      expected="$1"
      actual=$("${helper}" | head -1)
      case "${actual}" in
        "mkdir ${expected}") ;;
        *)
          printf 'pam_namespace_helper: expected mkdir %s, got %s\n' \
            "${expected}" "${actual}" >&2
          exit 1
          ;;
      esac
      rmdir "${expected}" 2>/dev/null || true
    }

    printf '/tmp/uapi-poly /tmp/uapi-vendor/ level root\n' \
      > /usr/lib/security/namespace.conf
    assert_helper_tier /tmp/uapi-vendor/
    printf '/tmp/uapi-poly /tmp/uapi-runtime/ level root\n' \
      > /run/security/namespace.conf
    assert_helper_tier /tmp/uapi-runtime/
    printf '/tmp/uapi-poly /tmp/uapi-admin/ level root\n' \
      > /etc/security/namespace.conf
    assert_helper_tier /tmp/uapi-admin/
    rm /usr/lib/security/namespace.conf /run/security/namespace.conf \
      /etc/security/namespace.conf

    # pam_securetty must also honour a transient securetty file. Root on a tty
    # that the selected file lists is allowed; a tty it omits is denied.
    securetty_service=uapi-securetty-smoke
    printf 'auth required %s\n' \
      "${OUT_DIR}/usr/lib/security/pam_securetty.so" \
      > "/usr/lib/pam.d/${securetty_service}"
    rm -f /etc/securetty /run/securetty /usr/lib/securetty

    printf 'uapivendor\n' > /usr/lib/securetty
    PAM_UAPI_TTY=uapivendor LD_LIBRARY_PATH="${OUT_DIR}/usr/lib" \
      "${smoke_bin}" "${securetty_service}" auth allow
    printf 'uapiruntime\n' > /run/securetty
    PAM_UAPI_TTY=uapivendor LD_LIBRARY_PATH="${OUT_DIR}/usr/lib" \
      "${smoke_bin}" "${securetty_service}" auth deny
    PAM_UAPI_TTY=uapiruntime LD_LIBRARY_PATH="${OUT_DIR}/usr/lib" \
      "${smoke_bin}" "${securetty_service}" auth allow
    printf 'uapiadmin\n' > /etc/securetty
    PAM_UAPI_TTY=uapiruntime LD_LIBRARY_PATH="${OUT_DIR}/usr/lib" \
      "${smoke_bin}" "${securetty_service}" auth deny
    PAM_UAPI_TTY=uapiadmin LD_LIBRARY_PATH="${OUT_DIR}/usr/lib" \
      "${smoke_bin}" "${securetty_service}" auth allow
    rm -f /etc/securetty /run/securetty /usr/lib/securetty \
      "/usr/lib/pam.d/${securetty_service}"

    printf 'pam UAPI smoke: namespace helper and securetty honoured all tiers\n'

    rm \
      "/etc/pam.d/${smoke_service}" \
      "/run/pam.d/${smoke_service}" \
      "/usr/lib/pam.d/${smoke_service}" \
      "/usr/lib/pam.d/${limits_service}" \
      "/usr/lib/pam.d/${env_service}" \
      /usr/lib/security/limits.d/10-vendor.conf \
      /usr/lib/security/pam_env.conf \
      /run/security/limits.d/20-runtime.conf \
      /etc/security/limits.d/30-admin.conf \
      /usr/lib/environment \
      /etc/environment \
      /etc/passwd
    rmdir /usr/lib/security/limits.d /run/security/limits.d /etc/security/limits.d || true
    rmdir /run/security /etc/security /run/pam.d /etc/pam.d || true

    find ${OUT_DIR} -type f -executable -exec strip --strip-unneeded {} \; 2>/dev/null || true
    find ${OUT_DIR} -name '*.a' -exec objcopy --enable-deterministic-archives {} \; 2>/dev/null || true
    find "${OUT_DIR}" -exec touch -d "2024-01-01T00:00:00+00:00" {} \;

