build:
  environment: 27b6e5dc7ad152c9a17c2cabfcc5ee93daa9bbf0
  profile: [4107:3005, 8249:3212, 12348:3365, 16515:3499, 20646:4448, 24814:4955, 28237:5110]

  script: |
    set -eu
    tar --no-same-owner -xf /${SOURCE0} -C "${WORK_DIR}" --strip-components=1
    cd ${WORK_DIR}
    patch --batch --fuzz=0 -Np1 -i "/${SOURCE_uapi_services}"

    meson setup build \
      --prefix=/usr \
      --sbindir=/usr/bin \
      --buildtype=release \
      -Ddocs=disabled \
      -Dexamples=false

    ninja -C build
    DESTDIR="${OUT_DIR}" ninja -C build install

    # setuid for unix_chkpwd (needed for non-root password checks)
    chmod 4755 "${OUT_DIR}/usr/bin/unix_chkpwd"

    smoke_bin="${WORK_DIR}/pam-uapi-smoke"
    smoke_service=uapi-service-smoke
    gcc "/${SOURCE_uapi_smoke}" \
      -I"${OUT_DIR}/usr/include" \
      -L"${OUT_DIR}/usr/lib" \
      -Wl,-rpath,"${OUT_DIR}/usr/lib" \
      -lpam \
      -o "${smoke_bin}"

    mkdir -p /etc/pam.d /run/pam.d /usr/lib/pam.d
    printf 'auth required %s\n' \
      "${OUT_DIR}/usr/lib/security/pam_permit.so" \
      > "/usr/lib/pam.d/${smoke_service}"
    LD_LIBRARY_PATH="${OUT_DIR}/usr/lib" "${smoke_bin}" allow

    printf 'auth required %s\n' \
      "${OUT_DIR}/usr/lib/security/pam_deny.so" \
      > "/run/pam.d/${smoke_service}"
    LD_LIBRARY_PATH="${OUT_DIR}/usr/lib" "${smoke_bin}" deny

    printf 'auth required %s\n' \
      "${OUT_DIR}/usr/lib/security/pam_permit.so" \
      > "/etc/pam.d/${smoke_service}"
    LD_LIBRARY_PATH="${OUT_DIR}/usr/lib" "${smoke_bin}" allow

    rm \
      "/etc/pam.d/${smoke_service}" \
      "/run/pam.d/${smoke_service}" \
      "/usr/lib/pam.d/${smoke_service}"

    find ${OUT_DIR} -type f -executable -exec strip --strip-unneeded {} \; 2>/dev/null || true
    find ${OUT_DIR} -name '*.a' -exec objcopy --enable-deterministic-archives {} \; 2>/dev/null || true
    find "${OUT_DIR}" -exec touch -d "2024-01-01T00:00:00+00:00" {} \;

