package:
  schema: 1
  name: libpcap
  slug: libpcap
  namespace: libs/net
  version: 1.10.6
  description: Packet capture library used by tcpdump
  homepage: https://www.tcpdump.org/
  checksum: a26db0df41446d82eb2b06f6040c94e93c851e8663dc4b14596ffedfc4b9f403

sources:
- name: libpcap
  url: https://www.tcpdump.org/release/libpcap-1.10.6.tar.xz
  sha256: ec97d1206bdd19cb6bdd043eaa9f0037aa732262ec68e070fd7c7b5f834d5dfc

dependencies:
- name: glibc
  commit: x86_64/pkg/libs/system/glibc/2.39/bundles/dev
- name: gcc
  commit: x86_64/pkg/core/toolchain/gcc/13.2.0/bundles/dev
- name: binutils
  commit: x86_64/pkg/core/toolchain/binutils/2.42/bundles/dev
- name: bash
  commit: x86_64/pkg/cli/shells/bash/5.2.21/bundles/dev
- name: coreutils
  commit: x86_64/pkg/core/userland/coreutils/9.5/bundles/dev
- name: findutils
  commit: x86_64/pkg/core/userland/findutils/4.9.0/bundles/dev
- name: grep
  commit: x86_64/pkg/cli/text/grep/3.11/bundles/dev
- name: sed
  commit: x86_64/pkg/cli/text/sed/4.9/bundles/dev
- name: gawk
  commit: x86_64/pkg/cli/text/gawk/5.3.0/bundles/dev
- name: make
  commit: x86_64/pkg/core/toolchain/make/4.4.1/bundles/dev
- name: tar
  commit: x86_64/pkg/cli/archive/tar/1.35/bundles/dev
- name: xz
  commit: x86_64/pkg/libs/compression/xz/5.4.6/bundles/dev
- name: pkgconf
  commit: x86_64/pkg/core/toolchain/pkgconf/2.2.0/bundles/dev
- name: flex
  commit: x86_64/pkg/core/toolchain/flex/2.6.4/bundles/dev
- name: bison
  commit: x86_64/pkg/core/toolchain/bison/3.8.2/bundles/dev
- name: m4
  commit: x86_64/pkg/dev/lang/m4/1.4.19/bundles/dev
- name: linux-headers
  commit: x86_64/pkg/libs/system/linux-headers/6.4.1/bundles/dev

build:
  environment: 27b6e5dc7ad152c9a17c2cabfcc5ee93daa9bbf0
  profile: [4141:11191, 8803:13193, 13360:13566, 17463:15306, 21608:17702, 23558:19384]

  script: |
    set -eu

    tar --no-same-owner -xf "/./${SOURCE_libpcap}" -C "${WORK_DIR}" --strip-components=1
    cd "${WORK_DIR}"

    ./configure \
      --prefix=/usr \
      --libdir=/usr/lib \
      --enable-shared \
      --disable-dbus \
      --disable-bluetooth \
      --disable-rdma \
      --disable-usb \
      --disable-netmap \
      --without-libnl

    make
    make DESTDIR="${OUT_DIR}" install

    sed -i '1s|^#! */bin/sh$|#!/usr/bin/sh|' "${OUT_DIR}/usr/bin/pcap-config"

    find "${OUT_DIR}" -type f -executable -exec strip --strip-unneeded {} \; 2>/dev/null || true
    find "${OUT_DIR}" -name '*.a' -exec objcopy --enable-deterministic-archives {} \; 2>/dev/null || true
    find "${OUT_DIR}" -exec touch -d "2024-01-01T00:00:00+00:00" {} \;

bundles:
  dev:
  - bin
  - dev
  - lib
  - static

  full:
  - bin
  - dev
  - lib
  - man
  - static

outputs:
  bin:
    files:
    - path: /usr/bin/pcap-config
      needs:
      - /usr/bin/sh

  dev:
    files:
    - path: /usr/include/pcap-bpf.h
    - path: /usr/include/pcap-namedb.h
    - path: /usr/include/pcap.h
    - path: /usr/include/pcap/bluetooth.h
    - path: /usr/include/pcap/bpf.h
    - path: /usr/include/pcap/can_socketcan.h
    - path: /usr/include/pcap/compiler-tests.h
    - path: /usr/include/pcap/dlt.h
    - path: /usr/include/pcap/funcattrs.h
    - path: /usr/include/pcap/ipnet.h
    - path: /usr/include/pcap/namedb.h
    - path: /usr/include/pcap/nflog.h
    - path: /usr/include/pcap/pcap-inttypes.h
    - path: /usr/include/pcap/pcap.h
    - path: /usr/include/pcap/sll.h
    - path: /usr/include/pcap/socket.h
    - path: /usr/include/pcap/usb.h
    - path: /usr/include/pcap/vlan.h
    - path: /usr/lib/pkgconfig/libpcap.pc

  lib:
