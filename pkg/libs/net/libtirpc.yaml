build:
  environment: 27b6e5dc7ad152c9a17c2cabfcc5ee93daa9bbf0
  profile: [4096:1068, 8219:2303, 12353:3154, 13172:3225]

  script: |
    set -eu
    tar --no-same-owner -xf "/${SOURCE_libtirpc}" -C "${WORK_DIR}" --strip-components=1
    cd "${WORK_DIR}"
    patch --batch --fuzz=0 -Np1 -i "/${SOURCE_databases_config}"

    ./configure --prefix=/usr \
      --sysconfdir=/usr/lib \
      --disable-static \
      --disable-gssapi

    make
    make DESTDIR="${OUT_DIR}" install

    if [ -e /etc/netconfig ] || [ -e /etc/bindresvport.blacklist ] || \
       [ -e /run/netconfig ] || [ -e /run/bindresvport.blacklist ] || \
       [ -e /usr/lib/netconfig ] || [ -e /usr/lib/bindresvport.blacklist ]; then
      echo 'libtirpc smoke-test paths already exist' >&2
      exit 1
    fi
    mkdir -p /etc /run
    cp "${OUT_DIR}/usr/lib/netconfig" /usr/lib/netconfig
    cp "${OUT_DIR}/usr/lib/bindresvport.blacklist" \
      /usr/lib/bindresvport.blacklist
    printf 'vendor-net tpi_clts v inet udp - -\n' >> /usr/lib/netconfig
    printf '700\n' >> /usr/lib/bindresvport.blacklist

    databases_smoke="${WORK_DIR}/libtirpc-databases-smoke"
    gcc \
      -I"${OUT_DIR}/usr/include/tirpc" \
      -L"${OUT_DIR}/usr/lib" \
      "/${SOURCE_databases_smoke}" \
      -ltirpc \
      -o "${databases_smoke}"

    LD_LIBRARY_PATH="${OUT_DIR}/usr/lib:/usr/lib" \
      unshare --net "${databases_smoke}" vendor-net blocked

    printf 'runtime-net tpi_clts v inet udp - -\n' > /run/netconfig
    printf '700\n' > /run/bindresvport.blacklist
    LD_LIBRARY_PATH="${OUT_DIR}/usr/lib:/usr/lib" \
      unshare --net "${databases_smoke}" runtime-net blocked

    printf 'admin-net tpi_clts v inet udp - -\n' > /etc/netconfig
    printf '700\n' > /etc/bindresvport.blacklist
    LD_LIBRARY_PATH="${OUT_DIR}/usr/lib:/usr/lib" \
      unshare --net "${databases_smoke}" admin-net blocked

    : > /etc/netconfig
    : > /etc/bindresvport.blacklist
    LD_LIBRARY_PATH="${OUT_DIR}/usr/lib:/usr/lib" \
      unshare --net "${databases_smoke}" none allowed

    rm /etc/netconfig /etc/bindresvport.blacklist \
      /run/netconfig /run/bindresvport.blacklist
    LD_LIBRARY_PATH="${OUT_DIR}/usr/lib:/usr/lib" \
      unshare --net "${databases_smoke}" vendor-net blocked

    rm /usr/lib/netconfig /usr/lib/bindresvport.blacklist
    rmdir /etc /run 2>/dev/null || true

    find "${OUT_DIR}" -type f -executable -exec strip --strip-unneeded {} \; 2>/dev/null || true
    find "${OUT_DIR}" -name '*.a' -exec objcopy --enable-deterministic-archives {} \; 2>/dev/null || true
    find "${OUT_DIR}" -exec touch -d "2024-01-01T00:00:00+00:00" {} \;

bundles:
  dev:
  - conf
  - dev
  - lib

