    - path: /usr/include/tirpc/rpcsvc/crypt.h
    - path: /usr/include/tirpc/rpcsvc/crypt.x
    - path: /usr/lib/libtirpc.la
    - path: /usr/lib/pkgconfig/libtirpc.pc

  lib:
    files:
    - path: /usr/lib/libtirpc.so
      needs:
      - /usr/lib/libc.so.6
    - path: /usr/lib/libtirpc.so.3
      needs:
      - /usr/lib/libc.so.6
    - path: /usr/lib/libtirpc.so.3.0.0
      needs:
      - /usr/lib/libc.so.6

  man:
    files:
