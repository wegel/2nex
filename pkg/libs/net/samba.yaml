build:
  environment: 27b6e5dc7ad152c9a17c2cabfcc5ee93daa9bbf0
  profile: [12384:3789, 45555:11928, 112398:23681, 162569:25208, 212205:26572, 268457:28178, 317939:32241, 397298:47534, 479979:62964, 529334:68090]

  script: |
    tar --no-same-owner -xf /${SOURCE_samba} -C "${WORK_DIR}" --strip-components=1
    cd "${WORK_DIR}"

    patch --batch --fuzz=0 -Np1 -i /${SOURCE_linux_credential_probe_patch}
    patch --batch --fuzz=0 -Np1 -i /${SOURCE_uapi_config_patch}

    CFLAGS=${CFLAGS/-flto=auto/}
    CXXFLAGS=${CXXFLAGS/-flto=auto/}
    LDFLAGS=${LDFLAGS/-flto=auto/}
    export CFLAGS CXXFLAGS LDFLAGS

    ./configure \
      --prefix=/usr \
      --libdir=/usr/lib \
      --sysconfdir=/etc \
      --localstatedir=/var \
      --enable-fhs \
      --disable-python \
      --without-gettext \
      --without-gpgme \
      --without-ad-dc \
      --without-ads \
      --without-ldap \
      --without-pam \
      --without-systemd \
      --disable-cups \
      --disable-avahi \
      --without-libarchive \
      --without-json \
      --without-acl-support \
      --without-winbind \
      --without-ldb-lmdb \
      --without-quotas \
      --without-utmp \
      --without-automount \
      --without-fam \
      --without-regedit \
      --without-winexe \
      --disable-glusterfs \
      --disable-cephfs \
      --disable-spotlight \
      --disable-wsp \
      --with-shared-modules='!vfs_snapper' \
      --bundled-libraries=ALL

    PYTHONHASHSEED=1 WAF_MAKE=1 ./buildtools/bin/waf build --targets=smbclient
    PYTHONHASHSEED=1 WAF_MAKE=1 DESTDIR="${OUT_DIR}" ./buildtools/bin/waf install

    # Exercise the newly built, installed libsmbclient through its real
    # reader: smbc_new_context()/smbc_init_context() resolve the effective
    # workgroup through the vendor, run, and etc smb.conf tiers, with the
    # user's own $HOME/.smb/smb.conf still outranking all three. See
    # samba-uapi-config-check.sh.
    sh /${SOURCE_uapi_check} \
      "${OUT_DIR}" \
      "${WORK_DIR}" \
      /${SOURCE_uapi_smoke}

    find "${OUT_DIR}" -mindepth 1 -maxdepth 1 ! -name usr -exec rm -rf {} +
    find "${OUT_DIR}/usr" -mindepth 1 -maxdepth 1 \
      ! -name include \
      ! -name lib \
      -exec rm -rf {} +
    find "${OUT_DIR}/usr/lib" -mindepth 1 -maxdepth 1 \
      ! -name 'lib*.so' \
      ! -name 'lib*.so.*' \
      ! -name pkgconfig \
      ! -name samba \
      -exec rm -rf {} +

    find "${OUT_DIR}" -exec touch -d "2024-01-01T00:00:00+00:00" {} \;
    find "${OUT_DIR}" -type f -executable -exec strip --strip-unneeded {} \; 2>/dev/null || true

