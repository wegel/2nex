package:
  schema: 1
  name: nghttp2
  slug: nghttp2
  namespace: libs/net
  version: 1.64.0
  description: HTTP/2 C library
  homepage: https://nghttp2.org/
  checksum: 8d41b2f28537b4c3b5a2355234ace6bd1ec40017a3bf0610e7daeb5775b31de0

sources:
- name: nghttp2
  url: https://github.com/nghttp2/nghttp2/releases/download/v1.64.0/nghttp2-1.64.0.tar.xz
  sha256: 88bb94c9e4fd1c499967f83dece36a78122af7d5fb40da2019c56b9ccc6eb9dd

dependencies:
- name: glibc
  commit: x86_64/pkg/libs/system/glibc/2.39/bundles/dev
- name: gmp
  commit: x86_64/pkg/libs/system/gmp/6.3.0/bundles/dev
- name: libcap
  commit: x86_64/pkg/libs/security/libcap/2.69/bundles/dev
- name: gcc
  commit: x86_64/pkg/core/toolchain/gcc/13.2.0/bundles/dev
- name: binutils
  commit: x86_64/pkg/core/toolchain/binutils/2.42/bundles/dev
- name: bash
  commit: x86_64/pkg/cli/shells/bash/5.2.21/bundles/dev
- name: ncurses
  commit: x86_64/pkg/libs/system/ncurses/6.4-20230520/bundles/dev
- name: acl
  commit: x86_64/pkg/libs/system/acl/2.3.2/bundles/dev
- name: attr
  commit: x86_64/pkg/libs/system/attr/2.5.2/bundles/dev
- name: tar
  commit: x86_64/pkg/cli/archive/tar/1.35/bundles/dev
- name: xz
  commit: x86_64/pkg/libs/compression/xz/5.4.6/bundles/dev
- name: zlib
  commit: x86_64/pkg/libs/system/zlib/1.3.1/bundles/dev
- name: coreutils
  commit: x86_64/pkg/core/userland/coreutils/9.5/bundles/dev
- name: findutils
  commit: x86_64/pkg/core/userland/findutils/4.9.0/bundles/dev
- name: linux-headers
  commit: x86_64/pkg/libs/system/linux-headers/6.4.1/bundles/dev
- name: gawk
  commit: x86_64/pkg/cli/text/gawk/5.3.0/bundles/dev
- name: sed
  commit: x86_64/pkg/cli/text/sed/4.9/bundles/dev
- name: grep
  commit: x86_64/pkg/cli/text/grep/3.11/bundles/dev
- name: make
  commit: x86_64/pkg/core/toolchain/make/4.4.1/bundles/dev

build:
  environment: 27b6e5dc7ad152c9a17c2cabfcc5ee93daa9bbf0
  profile: [4146:949, 8250:3496, 12363:5188, 16484:6321, 20586:6405, 22544:6444]

  script: |
    tar --no-same-owner -xf /${SOURCE_nghttp2} -C "${WORK_DIR}" --strip-components=1
    cd ${WORK_DIR}

    ./configure \
      --prefix=/usr \
      --libdir=/usr/lib \
      --disable-static \
      --enable-lib-only \
      --disable-python-bindings

    make
    make DESTDIR="${OUT_DIR}" install

    find ${OUT_DIR} -type f -executable -exec strip --strip-unneeded {} \; 2>/dev/null || true
    find ${OUT_DIR} -name '*.a' -exec objcopy --enable-deterministic-archives {} \; 2>/dev/null || true
    find "${OUT_DIR}" -exec touch -d "2024-01-01T00:00:00+00:00" {} \;

bundles:
  dev:
  - dev
  - lib

outputs:
  dev:
    files:
    - path: /usr/include/nghttp2/nghttp2ver.h
    - path: /usr/include/nghttp2/nghttp2.h
    - path: /usr/lib/libnghttp2.la
    - path: /usr/lib/pkgconfig/libnghttp2.pc

  doc:
    files:
    - path: /usr/share/doc/nghttp2/README.rst

  lib:
    files:
    - path: /usr/lib/libnghttp2.so
      needs:
      - /usr/lib/libc.so.6
    - path: /usr/lib/libnghttp2.so.14
      needs:
      - /usr/lib/libc.so.6
    - path: /usr/lib/libnghttp2.so.14.28.3
      needs:
      - /usr/lib/libc.so.6

  man:
    files:
    - path: /usr/share/man/man1/h2load.1
    - path: /usr/share/man/man1/nghttp.1
    - path: /usr/share/man/man1/nghttpd.1
    - path: /usr/share/man/man1/nghttpx.1

  misc:
    files:
    - path: /usr/share/nghttp2/fetch-ocsp-response

resolution:
  /usr/lib/libc.so.6: glibc
