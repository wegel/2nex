build:
  environment: 27b6e5dc7ad152c9a17c2cabfcc5ee93daa9bbf0
  profile: [4101:661, 8260:1186, 12404:1628, 16516:2012, 20638:6032, 24691:6074]

  script: |
    tar --no-same-owner -xf /${SOURCE_libsoup} -C "${WORK_DIR}" --strip-components=1
    cd ${WORK_DIR}

    meson setup build \
      --prefix=/usr \
      --libdir=lib \
      --buildtype=release \
      -Dintrospection=disabled \
      -Dvapi=disabled \
      -Ddocs=disabled \
      -Dtests=false \
      -Dsysprof=disabled \
      -Dgssapi=disabled \
      -Dntlm=disabled \
      -Dtls_check=false

    ninja -C build
    DESTDIR="${OUT_DIR}" ninja -C build install

    find ${OUT_DIR} -type f -executable -exec strip --strip-unneeded {} \; 2>/dev/null || true
    find ${OUT_DIR} -name '*.a' -exec objcopy --enable-deterministic-archives {} \; 2>/dev/null || true
    find "${OUT_DIR}" -exec touch -d "2024-01-01T00:00:00+00:00" {} \;

