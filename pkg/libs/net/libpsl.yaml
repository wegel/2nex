package:
  schema: 1
  name: libpsl
  slug: libpsl
  namespace: libs/net
  version: 0.21.5
  description: Public Suffix List library
  homepage: https://github.com/rockdaboot/libpsl
  checksum: 41b0dfdca15f0335c4115010432f40596f1233ca34ef8182162439be2c9c7a62

sources:
- name: libpsl
  url: https://github.com/rockdaboot/libpsl/releases/download/0.21.5/libpsl-0.21.5.tar.gz
  sha256: 1dcc9ceae8b128f3c0b3f654decd0e1e891afc6ff81098f227ef260449dae208

dependencies:
- name: glibc
  commit: x86_64/pkg/libs/system/glibc/2.39/bundles/dev
- name: gmp
  commit: x86_64/pkg/libs/system/gmp/6.3.0/bundles/dev
- name: gcc
  commit: x86_64/pkg/core/toolchain/gcc/13.2.0/bundles/dev
- name: binutils
  commit: x86_64/pkg/core/toolchain/binutils/2.42/bundles/dev
- name: bash
  commit: x86_64/pkg/cli/shells/bash/5.2.21/bundles/dev
- name: ncurses
  commit: x86_64/pkg/libs/system/ncurses/6.4-20230520/bundles/dev
- name: acl
  commit: x86_64/pkg/libs/system/acl/2.3.2/bundles/dev
- name: attr
  commit: x86_64/pkg/libs/system/attr/2.5.2/bundles/dev
- name: tar
  commit: x86_64/pkg/cli/archive/tar/1.35/bundles/dev
- name: zlib
  commit: x86_64/pkg/libs/system/zlib/1.3.1/bundles/dev
- name: findutils
  commit: x86_64/pkg/core/userland/findutils/4.9.0/bundles/dev
- name: linux-headers
  commit: x86_64/pkg/libs/system/linux-headers/6.4.1/bundles/dev
- name: meson
  commit: x86_64/pkg/core/toolchain/meson/1.6.1/bundles/dev
- name: ninja
  commit: x86_64/pkg/core/toolchain/ninja/1.12.1/bundles/dev
- name: python3
  commit: x86_64/pkg/dev/lang/python3/3.12.2/bundles/dev
- name: pkgconf
  commit: x86_64/pkg/core/toolchain/pkgconf/2.2.0/bundles/dev
- name: libunistring
  commit: x86_64/pkg/libs/text/libunistring/1.3/bundles/dev
- name: libidn2
  commit: x86_64/pkg/libs/text/libidn2/2.3.7/bundles/dev
- name: gzip
  commit: x86_64/pkg/cli/archive/gzip/1.13/bundles/dev

build:
  environment: 13ce31fd97c19f5756e4413babf279d543b5a71c
  profile: [3779:2710]

  script: |
    tar --no-same-owner -xf /${SOURCE_libpsl} -C "${WORK_DIR}" --strip-components=1
    cd ${WORK_DIR}

    meson setup build \
      --prefix=/usr \
      --libdir=lib \
      --buildtype=release \
      -Druntime=libidn2 \
      -Dbuiltin=true

    ninja -C build
    DESTDIR="${OUT_DIR}" ninja -C build install

    find ${OUT_DIR} -type f -executable -exec strip --strip-unneeded {} \; 2>/dev/null || true
    find ${OUT_DIR} -name '*.a' -exec objcopy --enable-deterministic-archives {} \; 2>/dev/null || true
    find "${OUT_DIR}" -exec touch -d "2024-01-01T00:00:00+00:00" {} \;

bundles:
  dev:
  - dev
  - lib

outputs:
  bin:
    files:
    - path: /usr/bin/psl
      needs:
      - /usr/lib/ld-linux-x86-64.so.2
      - /usr/lib/libc.so.6
      - /usr/lib/libpsl.so.5
    - path: /usr/bin/psl-make-dafsa

  dev:
    files:
    - path: /usr/include/libpsl.h
    - path: /usr/lib/pkgconfig/libpsl.pc

  lib:
    files:
    - path: /usr/lib/libpsl.so
      needs:
      - /usr/lib/libc.so.6
      - /usr/lib/libidn2.so.0
      - /usr/lib/libunistring.so.5
    - path: /usr/lib/libpsl.so.5
      needs:
      - /usr/lib/libc.so.6
      - /usr/lib/libidn2.so.0
      - /usr/lib/libunistring.so.5
    - path: /usr/lib/libpsl.so.5.3.5
      needs:
      - /usr/lib/libc.so.6
      - /usr/lib/libidn2.so.0
      - /usr/lib/libunistring.so.5

  man:
    files:
    - path: /usr/share/man/man1/psl-make-dafsa.1
    - path: /usr/share/man/man1/psl.1

resolution:
  /usr/lib/ld-linux-x86-64.so.2: glibc
  /usr/lib/libc.so.6: glibc
  /usr/lib/libidn2.so.0: libidn2
  /usr/lib/libunistring.so.5: libunistring
  /usr/lib/libpsl.so.5: self
