build:
  environment: 27b6e5dc7ad152c9a17c2cabfcc5ee93daa9bbf0
  profile: [4282:607, 8395:613, 12498:818, 15069:1106]

  script: |
    tar --no-same-owner -xzf /${SOURCE0} -C "${WORK_DIR}" --strip-components=1
    cd ${WORK_DIR}

    # disable LTO - causes linker issues
    CFLAGS=${CFLAGS/-flto=auto/}
    LDFLAGS=${LDFLAGS/-flto=auto/}

    ./configure --prefix=/usr --without-tcl --without-python

    make
    make DESTDIR="${OUT_DIR}" install

    find ${OUT_DIR} -type f -executable -exec strip --strip-unneeded {} \; 2>/dev/null || true
    find ${OUT_DIR} -name '*.a' -exec objcopy --enable-deterministic-archives {} \; 2>/dev/null || true
    find "${OUT_DIR}" -exec touch -d "2024-01-01T00:00:00+00:00" {} \;

bundles:
  dev:
  - dev
  - lib

outputs:
  bin:
    files:
    - path: /usr/bin/whiptail
      needs:
      - /usr/lib/ld-linux-x86-64.so.2
      - /usr/lib/libc.so.6
      - /usr/lib/libnewt.so.0.52
      - /usr/lib/libpopt.so.0
      - /usr/lib/libslang.so.2

  dev:
