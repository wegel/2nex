build:
  environment: 27b6e5dc7ad152c9a17c2cabfcc5ee93daa9bbf0
  profile: [4122:1396, 8270:6217, 12492:6439, 20842:6477, 25075:6514, 33314:9594, 37441:9753, 45664:10214, 53884:10345, 59786:10481]

  script: |
    tar --no-same-owner -xjf /${SOURCE_slang} -C "${WORK_DIR}" --strip-components=1
    cd ${WORK_DIR}

    patch -Np1 --batch --fuzz=0 < "/${SOURCE_uapi_config}"

    ./configure --prefix=/usr --sysconfdir=/etc --with-readline=gnu

    make
    make DESTDIR="${OUT_DIR}" install

    install -Dm644 "${OUT_DIR}/etc/slsh.rc" "${OUT_DIR}/usr/lib/slsh.rc"
    rm "${OUT_DIR}/etc/slsh.rc"
    rmdir "${OUT_DIR}/etc"

    mkdir -p /etc /run /usr/lib "${WORK_DIR}/slsh-explicit"
    rm -f /etc/slsh.rc /run/slsh.rc /usr/lib/slsh.rc
    printf 'variable Uapi_Selected = "vendor";\n' > /usr/lib/slsh.rc
    test "$(LD_LIBRARY_PATH="${OUT_DIR}/usr/lib" \
      SLSH_PATH="${OUT_DIR}/usr/share/slsh" \
      "${OUT_DIR}/usr/bin/slsh" -n -e \
      '() = printf("%s\n", Uapi_Selected);')" = vendor
    printf 'variable Uapi_Selected = "transient";\n' > /run/slsh.rc
    test "$(LD_LIBRARY_PATH="${OUT_DIR}/usr/lib" \
      SLSH_PATH="${OUT_DIR}/usr/share/slsh" \
      "${OUT_DIR}/usr/bin/slsh" -n -e \
      '() = printf("%s\n", Uapi_Selected);')" = transient
    printf 'variable Uapi_Selected = "administrator";\n' > /etc/slsh.rc
    test "$(LD_LIBRARY_PATH="${OUT_DIR}/usr/lib" \
      SLSH_PATH="${OUT_DIR}/usr/share/slsh" \
      "${OUT_DIR}/usr/bin/slsh" -n -e \
      '() = printf("%s\n", Uapi_Selected);')" = administrator
    : > /etc/slsh.rc
    test "$(LD_LIBRARY_PATH="${OUT_DIR}/usr/lib" \
      SLSH_PATH="${OUT_DIR}/usr/share/slsh" \
      "${OUT_DIR}/usr/bin/slsh" -n -e \
      '() = printf("masked\n");')" = masked
    printf 'variable Uapi_Selected = "explicit";\n' \
      > "${WORK_DIR}/slsh-explicit/slsh.rc"
    test "$(SLSH_CONF_DIR="${WORK_DIR}/slsh-explicit" \
      LD_LIBRARY_PATH="${OUT_DIR}/usr/lib" \
      SLSH_PATH="${OUT_DIR}/usr/share/slsh" \
      "${OUT_DIR}/usr/bin/slsh" -n -e \
      '() = printf("%s\n", Uapi_Selected);')" = explicit
    rm -f /etc/slsh.rc /run/slsh.rc /usr/lib/slsh.rc
    test "$(LD_LIBRARY_PATH="${OUT_DIR}/usr/lib" \
      SLSH_PATH="${OUT_DIR}/usr/share/slsh" \
      "${OUT_DIR}/usr/bin/slsh" -n -e \
      '() = printf("no-files\n");')" = no-files

    find ${OUT_DIR} -type f -executable -exec strip --strip-unneeded {} \; 2>/dev/null || true
    find ${OUT_DIR} -name '*.a' -exec objcopy --enable-deterministic-archives {} \; 2>/dev/null || true
    find "${OUT_DIR}" -exec touch -d "2024-01-01T00:00:00+00:00" {} \;

