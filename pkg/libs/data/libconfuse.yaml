package:
  schema: 1
  name: libconfuse
  slug: libconfuse
  namespace: libs/data
  version: "3.3"
  description: Configuration file parser library
  homepage: https://github.com/libconfuse/libconfuse
  checksum: a4381886d14204b264024fada6a0d0cb9bebf26a99f6f0f4657e96eab800ff35

sources:
- name: libconfuse
  url: https://github.com/libconfuse/libconfuse/releases/download/v3.3/confuse-3.3.tar.xz
  sha256: 1dd50a0320e135a55025b23fcdbb3f0a81913b6d0b0a9df8cc2fdf3b3dc67010

dependencies:
- name: bash
  commit: x86_64/pkg/cli/shells/bash/5.2.21/bundles/dev
- name: coreutils
  commit: x86_64/pkg/core/userland/coreutils/9.5/bundles/dev
- name: findutils
  commit: x86_64/pkg/core/userland/findutils/4.9.0/bundles/dev
- name: tar
  commit: x86_64/pkg/cli/archive/tar/1.35/bundles/dev
- name: xz
  commit: x86_64/pkg/libs/compression/xz/5.4.6/bundles/dev
- name: glibc
  commit: x86_64/pkg/libs/system/glibc/2.39/bundles/dev
- name: gcc
  commit: x86_64/pkg/core/toolchain/gcc/13.2.0/bundles/dev
- name: binutils
  commit: x86_64/pkg/core/toolchain/binutils/2.42/bundles/dev
- name: make
  commit: x86_64/pkg/core/toolchain/make/4.4.1/bundles/dev
- name: sed
  commit: x86_64/pkg/cli/text/sed/4.9/bundles/dev
- name: gawk
  commit: x86_64/pkg/cli/text/gawk/5.3.0/bundles/dev
- name: grep
  commit: x86_64/pkg/cli/text/grep/3.11/bundles/dev
- name: linux-headers
  commit: x86_64/pkg/libs/system/linux-headers/6.4.1/bundles/dev
- name: ncurses
  commit: x86_64/pkg/libs/system/ncurses/6.4-20230520/bundles/dev
- name: acl
  commit: x86_64/pkg/libs/system/acl/2.3.2/bundles/dev
- name: attr
  commit: x86_64/pkg/libs/system/attr/2.5.2/bundles/dev
- name: libcap
  commit: x86_64/pkg/libs/security/libcap/2.69/bundles/dev
- name: zlib
  commit: x86_64/pkg/libs/system/zlib/1.3.1/bundles/dev
- name: gmp
  commit: x86_64/pkg/libs/system/gmp/6.3.0/bundles/dev

build:
  environment: 27b6e5dc7ad152c9a17c2cabfcc5ee93daa9bbf0
  profile: [4103:10836, 8360:23229, 12796:28313, 17235:28499, 21690:28843, 25826:30262, 26651:30556]

  script: |
    tar --no-same-owner -xf ${SOURCE_libconfuse} -C "${WORK_DIR}" --strip-components=1
    cd ${WORK_DIR}

    ./configure --prefix=/usr

    make
    make DESTDIR="${OUT_DIR}" install

    find ${OUT_DIR} -type f -executable -exec strip --strip-unneeded {} \; 2>/dev/null || true
    find ${OUT_DIR} -name '*.a' -exec objcopy --enable-deterministic-archives {} \; 2>/dev/null || true
    find "${OUT_DIR}" -exec touch -d "2024-01-01T00:00:00+00:00" {} \;

bundles:
  dev:
  - dev
  - lib
  - static

outputs:
  dev:
    files:
    - path: /usr/include/confuse.h
    - path: /usr/lib/libconfuse.la
    - path: /usr/lib/pkgconfig/libconfuse.pc

  doc:
    files:
    - path: /usr/share/doc/confuse/AUTHORS
    - path: /usr/share/doc/confuse/ChangeLog.md
    - path: /usr/share/doc/confuse/LICENSE
    - path: /usr/share/doc/confuse/README.md

  lib:
    files:
    - path: /usr/lib/libconfuse.so
      needs:
      - /usr/lib/libc.so.6
    - path: /usr/lib/libconfuse.so.2
      needs:
      - /usr/lib/libc.so.6
    - path: /usr/lib/libconfuse.so.2.1.0
      needs:
      - /usr/lib/libc.so.6

  locale:
    files:
    - path: /usr/share/locale/de/LC_MESSAGES/confuse.mo
    - path: /usr/share/locale/fr/LC_MESSAGES/confuse.mo
    - path: /usr/share/locale/sv/LC_MESSAGES/confuse.mo

  static:
    files:
    - path: /usr/lib/libconfuse.a

resolution:
  /usr/lib/libc.so.6: glibc
