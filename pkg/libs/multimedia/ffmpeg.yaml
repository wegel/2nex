build:
  environment: 13ce31fd97c19f5756e4413babf279d543b5a71c
  profile: [4135:7573, 12377:7578, 28857:7608, 49429:10912, 61901:13729, 78387:16062, 94794:17807, 115333:28214, 140123:38996, 152091:39118]

  script: |
    tar --no-same-owner -xf /${SOURCE_ffmpeg} -C "${WORK_DIR}" --strip-components=1
    cd ${WORK_DIR}

    export CFLAGS="${CFLAGS//-flto=auto/}"
    export LDFLAGS="${LDFLAGS//-flto=auto/}"

    ./configure \
      --prefix=/usr \
      --enable-gpl \
      --enable-version3 \
      --enable-nonfree \
      --enable-shared \
      --disable-static \
      --disable-debug \
      --enable-pic \
      --disable-x86asm \
      --enable-libfreetype \
      --disable-doc \
      --disable-htmlpages \
      --disable-manpages \
      --disable-podpages \
      --disable-txtpages

    make
    make DESTDIR="${OUT_DIR}" install

    find "${OUT_DIR}" -exec touch -d "2024-01-01T00:00:00+00:00" {} \;
    2nex_strip_binaries ${OUT_DIR}

