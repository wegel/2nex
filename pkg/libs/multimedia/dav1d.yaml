package:
  schema: 1
  name: dav1d
  slug: dav1d
  namespace: libs/multimedia
  version: 1.5.3
  description: AV1 cross-platform decoder
  homepage: https://code.videolan.org/videolan/dav1d
  checksum: 33ed289bc289dbfe965ce92f4fdbd268afdc3839c0cdfa68b2540914d1484bb4

sources:
- name: dav1d
  url: https://code.videolan.org/videolan/dav1d/-/archive/1.5.3/dav1d-1.5.3.tar.bz2
  sha256: e099f53253f6c247580c554d53a13f1040638f2066edc3c740e4c2f15174ce22

dependencies:
- name: glibc
  commit: x86_64/pkg/libs/system/glibc/2.39/bundles/dev
- name: gmp
  commit: x86_64/pkg/libs/system/gmp/6.3.0/bundles/dev
- name: gcc
  commit: x86_64/pkg/core/toolchain/gcc/13.2.0/bundles/dev
- name: binutils
  commit: x86_64/pkg/core/toolchain/binutils/2.42/bundles/dev
- name: bash
  commit: x86_64/pkg/cli/shells/bash/5.2.21/bundles/dev
- name: coreutils
  commit: x86_64/pkg/core/userland/coreutils/9.5/bundles/dev
- name: findutils
  commit: x86_64/pkg/core/userland/findutils/4.9.0/bundles/dev
- name: tar
  commit: x86_64/pkg/cli/archive/tar/1.35/bundles/dev
- name: bzip2
  commit: x86_64/pkg/libs/compression/bzip2/1.0.8/bundles/dev
- name: linux-headers
  commit: x86_64/pkg/libs/system/linux-headers/6.4.1/bundles/dev
- name: ncurses
  commit: x86_64/pkg/libs/system/ncurses/6.4-20230520/bundles/dev
- name: acl
  commit: x86_64/pkg/libs/system/acl/2.3.2/bundles/dev
- name: attr
  commit: x86_64/pkg/libs/system/attr/2.5.2/bundles/dev
- name: zlib
  commit: x86_64/pkg/libs/system/zlib/1.3.1/bundles/dev
- name: meson
  commit: x86_64/pkg/core/toolchain/meson/1.6.1/bundles/dev
- name: ninja
  commit: x86_64/pkg/core/toolchain/ninja/1.12.1/bundles/dev
- name: python3
  commit: x86_64/pkg/dev/lang/python3/3.12.2/bundles/dev
- name: nasm
  commit: x86_64/pkg/core/toolchain/nasm/2.16.01/bundles/dev

build:
  environment: 27b6e5dc7ad152c9a17c2cabfcc5ee93daa9bbf0
  profile: [4116:12040, 8245:14523, 11318:122436]

  script: |
    tar --no-same-owner -xf /${SOURCE_dav1d} -C "${WORK_DIR}" --strip-components=1
    cd ${WORK_DIR}

    meson setup build \
      --prefix=/usr \
      --libdir=lib \
      --buildtype=release \
      -Denable_tests=false \
      -Denable_docs=false

    ninja -C build
    DESTDIR="${OUT_DIR}" ninja -C build install

    find ${OUT_DIR} -type f -executable -exec strip --strip-unneeded {} \; 2>/dev/null || true
    find ${OUT_DIR} -name '*.a' -exec objcopy --enable-deterministic-archives {} \; 2>/dev/null || true
    find "${OUT_DIR}" -exec touch -d "2024-01-01T00:00:00+00:00" {} \;

bundles:
  dev:
  - bin
  - dev
  - lib

  full:
  - bin
  - dev
  - lib

outputs:
  bin:
    files:
    - path: /usr/bin/dav1d
      needs:
      - /usr/lib/ld-linux-x86-64.so.2
      - /usr/lib/libc.so.6
      - /usr/lib/libdav1d.so.7

  dev:
    files:
    - path: /usr/include/dav1d/common.h
    - path: /usr/include/dav1d/data.h
    - path: /usr/include/dav1d/dav1d.h
    - path: /usr/include/dav1d/headers.h
    - path: /usr/include/dav1d/picture.h
    - path: /usr/include/dav1d/version.h
    - path: /usr/lib/pkgconfig/dav1d.pc

  lib:
    files:
    - path: /usr/lib/libdav1d.so
      needs:
      - /usr/lib/libc.so.6
    - path: /usr/lib/libdav1d.so.7
      needs:
      - /usr/lib/libc.so.6
    - path: /usr/lib/libdav1d.so.7.0.0
      needs:
      - /usr/lib/libc.so.6

resolution:
  /usr/lib/ld-linux-x86-64.so.2: glibc
  /usr/lib/libc.so.6: glibc
  /usr/lib/libdav1d.so.7: self
