package:
  schema: 1
  name: libvpx
  slug: libvpx
  namespace: libs/multimedia
  version: 1.14.1
  description: VP8/VP9 video codec
  homepage: https://chromium.googlesource.com/webm/libvpx
  checksum: 3c90596868f4364ceb7ef2a77d4aeb60618c1b56bd7dd8d3e112ba8bfdca396d

sources:
- name: libvpx
  url: https://github.com/webmproject/libvpx/archive/v1.14.1.tar.gz
  sha256: 901747254d80a7937c933d03bd7c5d41e8e6c883e0665fadcb172542167c7977

dependencies:
- name: glibc
  commit: x86_64/pkg/libs/system/glibc/2.39/bundles/dev
- name: gcc
  commit: x86_64/pkg/core/toolchain/gcc/13.2.0/bundles/dev
- name: binutils
  commit: x86_64/pkg/core/toolchain/binutils/2.42/bundles/dev
- name: bash
  commit: x86_64/pkg/cli/shells/bash/5.2.21/bundles/dev
- name: coreutils
  commit: x86_64/pkg/core/userland/coreutils/9.5/bundles/dev
- name: findutils
  commit: x86_64/pkg/core/userland/findutils/4.9.0/bundles/dev
- name: diffutils
  commit: x86_64/pkg/core/userland/diffutils/3.10/bundles/dev
- name: sed
  commit: x86_64/pkg/cli/text/sed/4.9/bundles/dev
- name: grep
  commit: x86_64/pkg/cli/text/grep/3.11/bundles/dev
- name: gawk
  commit: x86_64/pkg/cli/text/gawk/5.3.0/bundles/dev
- name: make
  commit: x86_64/pkg/core/toolchain/make/4.4.1/bundles/dev
- name: tar
  commit: x86_64/pkg/cli/archive/tar/1.35/bundles/dev
- name: gzip
  commit: x86_64/pkg/cli/archive/gzip/1.13/bundles/dev
- name: nasm
  commit: x86_64/pkg/core/toolchain/nasm/2.16.01/bundles/dev
- name: ncurses
  commit: x86_64/pkg/libs/system/ncurses/6.4-20230520/bundles/dev
- name: acl
  commit: x86_64/pkg/libs/system/acl/2.3.2/bundles/dev
- name: attr
  commit: x86_64/pkg/libs/system/attr/2.5.2/bundles/dev
- name: linux-headers
  commit: x86_64/pkg/libs/system/linux-headers/6.4.1/bundles/dev
- name: zlib
  commit: x86_64/pkg/libs/system/zlib/1.3.1/bundles/dev
- name: perl
  commit: x86_64/pkg/dev/lang/perl/5.38.2/bundles/dev

build:
  environment: 27b6e5dc7ad152c9a17c2cabfcc5ee93daa9bbf0
  profile: [4129:39464, 8256:60687, 12378:69206, 16477:77571, 20589:88625, 24717:98432, 28845:104628, 32958:110146, 34705:112264]

  script: |
    CFLAGS=${CFLAGS/-flto=auto/}
    CXXFLAGS=${CXXFLAGS/-flto=auto/}
    LDFLAGS=${LDFLAGS/-flto=auto/}

    tar --no-same-owner -xf /${SOURCE0} -C "${WORK_DIR}" --strip-components=1
    cd ${WORK_DIR}

    ./configure \
      --prefix=/usr \
      --enable-shared \
      --enable-vp9-highbitdepth \
      --as=nasm

    make
    make DESTDIR="${OUT_DIR}" install

    find ${OUT_DIR} -type f -executable -exec strip --strip-unneeded {} \; 2>/dev/null || true
    find ${OUT_DIR} -name '*.a' -exec objcopy --enable-deterministic-archives {} \; 2>/dev/null || true
    find "${OUT_DIR}" -exec touch -d "2024-01-01T00:00:00+00:00" {} \;

bundles:
  dev:
  - dev
  - lib

  full:
  - dev
  - lib

outputs:
  bin:
    files:
    - path: /usr/bin/vpxdec
      needs:
      - /usr/lib/ld-linux-x86-64.so.2
      - /usr/lib/libc.so.6
      - /usr/lib/libgcc_s.so.1
      - /usr/lib/libm.so.6
      - /usr/lib/libstdc++.so.6
      - /usr/lib/libvpx.so.9
    - path: /usr/bin/vpxenc
      needs:
      - /usr/lib/ld-linux-x86-64.so.2
      - /usr/lib/libc.so.6
      - /usr/lib/libgcc_s.so.1
      - /usr/lib/libm.so.6
      - /usr/lib/libstdc++.so.6
      - /usr/lib/libvpx.so.9

  dev:
    files:
    - path: /usr/include/vpx/vp8.h
    - path: /usr/include/vpx/vp8cx.h
    - path: /usr/include/vpx/vp8dx.h
    - path: /usr/include/vpx/vpx_codec.h
    - path: /usr/include/vpx/vpx_decoder.h
    - path: /usr/include/vpx/vpx_encoder.h
    - path: /usr/include/vpx/vpx_ext_ratectrl.h
    - path: /usr/include/vpx/vpx_frame_buffer.h
    - path: /usr/include/vpx/vpx_image.h
    - path: /usr/include/vpx/vpx_integer.h
    - path: /usr/include/vpx/vpx_tpl.h
    - path: /usr/lib/pkgconfig/vpx.pc

  lib:
    files:
    - path: /usr/lib/libvpx.so
      needs:
      - /usr/lib/libc.so.6
      - /usr/lib/libm.so.6
    - path: /usr/lib/libvpx.so.9
      needs:
      - /usr/lib/libc.so.6
      - /usr/lib/libm.so.6
    - path: /usr/lib/libvpx.so.9.0
      needs:
      - /usr/lib/libc.so.6
      - /usr/lib/libm.so.6
    - path: /usr/lib/libvpx.so.9.0.1
      needs:
      - /usr/lib/libc.so.6
      - /usr/lib/libm.so.6

  static:
    files:
    - path: /usr/lib/libvpx.a

resolution:
  /usr/lib/libgcc_s.so.1: gcc
  /usr/lib/libstdc++.so.6: gcc
  /usr/lib/ld-linux-x86-64.so.2: glibc
  /usr/lib/libc.so.6: glibc
  /usr/lib/libm.so.6: glibc
  /usr/lib/libvpx.so.9: self
