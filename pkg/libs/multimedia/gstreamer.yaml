build:
  environment: 27b6e5dc7ad152c9a17c2cabfcc5ee93daa9bbf0
  profile: [4150:1701, 8267:1803, 12414:2416, 16520:2806, 20639:11724, 24784:17425, 28932:17425, 33105:17429, 35382:17527]

  script: |
    set -eu

    tar --no-same-owner -xf /${SOURCE_gstreamer} -C "${WORK_DIR}" --strip-components=1
    cd "${WORK_DIR}"

    meson setup build \
      --prefix=/usr \
      --libdir=lib \
      --libexecdir=libexec \
      --buildtype=release \
      -Dintrospection=disabled \
      -Ddoc=disabled \
      -Dtests=disabled \
      -Dexamples=disabled \
      -Dbenchmarks=disabled \
      -Dcheck=disabled \
      -Dlibunwind=disabled \
      -Dlibdw=disabled \
      -Dnls=disabled \
      -Dptp-helper=disabled \
      -Dcoretracers=disabled \
      -Dbash-completion=disabled \
      -Dtools=enabled

    ninja -C build
    DESTDIR="${OUT_DIR}" ninja -C build install

    find "${OUT_DIR}" -type f -executable -exec strip --strip-unneeded {} \; 2>/dev/null || true
    find "${OUT_DIR}" -name '*.a' -exec objcopy --enable-deterministic-archives {} \; 2>/dev/null || true
    find "${OUT_DIR}" -exec touch -d "2024-01-01T00:00:00+00:00" {} \;

