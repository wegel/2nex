build:
  environment: 27b6e5dc7ad152c9a17c2cabfcc5ee93daa9bbf0
  profile: [4123:44159, 16480:77974, 32971:96534, 53642:122603, 70208:132397, 86797:141430, 103382:609955, 128321:625895, 153302:897559, 169479:901807]

  script: |
    tar --no-same-owner -xf /${SOURCE0} -C "${WORK_DIR}" --strip-components=1
    cd ${WORK_DIR}

    cmake -S . -B build -G Ninja \
      -DCMAKE_INSTALL_PREFIX=/usr \
      -DCMAKE_BUILD_TYPE=Release \
      -DBUILD_SHARED_LIBS=ON \
      -DENABLE_TESTS=OFF

    ninja -C build
    DESTDIR="${OUT_DIR}" ninja -C build install

    find ${OUT_DIR} -type f -executable -exec strip --strip-unneeded {} \; 2>/dev/null || true
    find ${OUT_DIR} -name '*.a' -exec objcopy --enable-deterministic-archives {} \; 2>/dev/null || true
    find "${OUT_DIR}" -exec touch -d "2024-01-01T00:00:00+00:00" {} \;

bundles:
  dev:
  - dev
  - lib

  full:
  - bin
  - dev
  - lib
  - static

outputs:
  bin:
    files:
    - path: /usr/bin/aomdec
      needs:
      - /usr/lib/ld-linux-x86-64.so.2
      - /usr/lib/libaom.so.3
      - /usr/lib/libc.so.6
      - /usr/lib/libgcc_s.so.1
      - /usr/lib/libstdc++.so.6
    - path: /usr/bin/aomenc
      needs:
      - /usr/lib/ld-linux-x86-64.so.2
      - /usr/lib/libaom.so.3
      - /usr/lib/libc.so.6
      - /usr/lib/libgcc_s.so.1
      - /usr/lib/libm.so.6
      - /usr/lib/libstdc++.so.6

  dev:
    files:
    - path: /usr/include/aom/aom.h
    - path: /usr/include/aom/aom_codec.h
    - path: /usr/include/aom/aom_decoder.h
    - path: /usr/include/aom/aom_encoder.h
    - path: /usr/include/aom/aom_external_partition.h
    - path: /usr/include/aom/aom_frame_buffer.h
    - path: /usr/include/aom/aom_image.h
    - path: /usr/include/aom/aom_integer.h
    - path: /usr/include/aom/aomcx.h
    - path: /usr/include/aom/aomdx.h
    - path: /usr/lib/pkgconfig/aom.pc

  lib:
    files:
    - path: /usr/lib/libaom.so
      needs:
      - /usr/lib/libc.so.6
      - /usr/lib/libm.so.6
    - path: /usr/lib/libaom.so.3
      needs:
      - /usr/lib/libc.so.6
      - /usr/lib/libm.so.6
    - path: /usr/lib/libaom.so.3.9.0
      needs:
      - /usr/lib/libc.so.6
      - /usr/lib/libm.so.6

  static:
    files:
    - path: /usr/lib/libaom.a

resolution:
  /usr/lib/libgcc_s.so.1: gcc
  /usr/lib/libstdc++.so.6: gcc
  /usr/lib/ld-linux-x86-64.so.2: glibc
  /usr/lib/libc.so.6: glibc
  /usr/lib/libm.so.6: glibc
  /usr/lib/libaom.so.3: self
