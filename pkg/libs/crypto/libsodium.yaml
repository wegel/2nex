build:
  environment: 27b6e5dc7ad152c9a17c2cabfcc5ee93daa9bbf0
  profile: [4391:11712, 8668:13053, 13189:13659, 17315:18198, 21430:24471, 25592:26669, 29693:28877, 33825:31961, 37929:33130, 39073:33736]

  script: |
    set -eu

    tar --no-same-owner -xzf /${SOURCE_libsodium} -C "${WORK_DIR}" --strip-components=1
    cd "${WORK_DIR}"

    ./configure \
      --prefix=/usr \
      --disable-static

    make
    make DESTDIR="${OUT_DIR}" install

    find "${OUT_DIR}" -name '*.la' -delete
    find "${OUT_DIR}" -name '*.a' -exec objcopy --enable-deterministic-archives {} \; 2>/dev/null || true
    find "${OUT_DIR}" -type f -executable -exec strip --strip-unneeded {} \; 2>/dev/null || true
    find "${OUT_DIR}" -exec touch -d "2024-01-01T00:00:00+00:00" {} \;

bundles:
  dev:
  - dev
  - lib

  full:
  - lib

