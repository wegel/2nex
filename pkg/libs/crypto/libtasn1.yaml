    - path: /usr/share/man/man3/asn1_delete_structure2.3
    - path: /usr/share/man/man3/asn1_der_coding.3
    - path: /usr/share/man/man3/asn1_der_decoding.3
    - path: /usr/share/man/man3/asn1_der_decoding2.3
    - path: /usr/share/man/man3/asn1_der_decoding_element.3
    - path: /usr/share/man/man3/asn1_der_decoding_startEnd.3
    - path: /usr/share/man/man3/asn1_dup_node.3
