  commit: x86_64/pkg/cli/text/grep/3.11/bundles/dev
- name: pkgconf
  commit: x86_64/pkg/core/toolchain/pkgconf/2.2.0/bundles/dev

build:
  environment: 13ce31fd97c19f5756e4413babf279d543b5a71c
  profile: [4114:1022, 8228:4705, 12393:6260, 21714:9679, 25835:11128, 29948:11129, 38222:11133, 46557:11265, 54819:11887, 58083:11921]

  script: |
    tar --no-same-owner -xf /${SOURCE_libtasn1} -C "${WORK_DIR}" --strip-components=1
    cd ${WORK_DIR}

    ./configure --prefix=/usr --disable-static

    make

    make DESTDIR="${OUT_DIR}" install

    find "${OUT_DIR}" -exec touch -d '2024-01-01T00:00:00+00:00' {} \;
    2nex_strip_binaries ${OUT_DIR}

bundles:
  dev:
  - bin
  - dev
  - lib

outputs:
  bin:
    files:
    - path: /usr/bin/asn1Parser
      needs:
      - /usr/lib/ld-linux-x86-64.so.2
      - /usr/lib/libc.so.6
      - /usr/lib/libtasn1.so.6
    - path: /usr/bin/asn1Decoding
      needs:
      - /usr/lib/ld-linux-x86-64.so.2
      - /usr/lib/libc.so.6
      - /usr/lib/libtasn1.so.6
    - path: /usr/bin/asn1Coding
      needs:
      - /usr/lib/ld-linux-x86-64.so.2
      - /usr/lib/libc.so.6
      - /usr/lib/libtasn1.so.6

  dev:
    files:
    - path: /usr/include/libtasn1.h
    - path: /usr/lib/libtasn1.la
    - path: /usr/lib/pkgconfig/libtasn1.pc

  info:
    files:
    - path: /usr/share/info/libtasn1.info

  lib:
    files:
    - path: /usr/lib/libtasn1.so
      needs:
      - /usr/lib/libc.so.6
    - path: /usr/lib/libtasn1.so.6
      needs:
      - /usr/lib/libc.so.6
    - path: /usr/lib/libtasn1.so.6.6.3
      needs:
      - /usr/lib/libc.so.6

  man:
    files:
    - path: /usr/share/man/man1/asn1Parser.1
