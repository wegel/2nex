  namespace: libs/crypto
  version: 4.19.0
  description: ASN.1 library used by GnuTLS
  homepage: https://www.gnu.org/software/libtasn1/
  checksum: dcc3abbead2a2490f592280523b675a65beb6d395734a9bb2d56cf6e90b04887

sources:
- name: libtasn1
