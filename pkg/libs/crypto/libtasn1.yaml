package:
  schema: 1
  name: libtasn1
  slug: libtasn1
  namespace: libs/crypto
  version: 4.19.0
  description: ASN.1 library used by GnuTLS
  homepage: https://www.gnu.org/software/libtasn1/
  checksum: c48294eb2766649137b26a03981bd3e4118488a86db36f4e589dfe21e6f766a0

sources:
- name: libtasn1
  url: https://ftp.gnu.org/gnu/libtasn1/libtasn1-4.19.0.tar.gz
  sha256: 1613f0ac1cf484d6ec0ce3b8c06d56263cc7242f1c23b30d82d23de345a63f7a

dependencies:
- name: linux-headers
  commit: x86_64/pkg/libs/system/linux-headers/6.4.1/bundles/dev
- name: glibc
  commit: x86_64/pkg/libs/system/glibc/2.39/bundles/dev
- name: zlib
  commit: x86_64/pkg/libs/system/zlib/1.3.1/bundles/dev
- name: ncurses
  commit: x86_64/pkg/libs/system/ncurses/6.4-20230520/bundles/dev
- name: attr
  commit: x86_64/pkg/libs/system/attr/2.5.2/bundles/dev
- name: acl
  commit: x86_64/pkg/libs/system/acl/2.3.2/bundles/dev
- name: libcap
  commit: x86_64/pkg/libs/security/libcap/2.69/bundles/dev
- name: gmp
  commit: x86_64/pkg/libs/system/gmp/6.3.0/bundles/dev
- name: binutils
  commit: x86_64/pkg/core/toolchain/binutils/2.42/bundles/dev
- name: gcc
  commit: x86_64/pkg/core/toolchain/gcc/13.2.0/bundles/dev
- name: make
  commit: x86_64/pkg/core/toolchain/make/4.4.1/bundles/dev
- name: bash
  commit: x86_64/pkg/cli/shells/bash/5.2.21/bundles/dev
- name: coreutils
  commit: x86_64/pkg/core/userland/coreutils/9.5/bundles/dev
- name: findutils
  commit: x86_64/pkg/core/userland/findutils/4.9.0/bundles/dev
- name: grep
  commit: x86_64/pkg/cli/text/grep/3.11/bundles/dev
- name: gawk
  commit: x86_64/pkg/cli/text/gawk/5.3.0/bundles/dev
- name: sed
  commit: x86_64/pkg/cli/text/sed/4.9/bundles/dev
- name: tar
  commit: x86_64/pkg/cli/archive/tar/1.35/bundles/dev
- name: gzip
  commit: x86_64/pkg/cli/archive/gzip/1.13/bundles/dev

build:
  environment: 27b6e5dc7ad152c9a17c2cabfcc5ee93daa9bbf0
  profile: [4114:960, 8228:3794, 12393:5182, 16530:6189, 25850:9112, 29961:9112, 34092:9117, 42413:9117, 50683:9759, 54593:9875]

  script: |
    tar --no-same-owner -xf /${SOURCE_libtasn1} -C "${WORK_DIR}" --strip-components=1
    cd ${WORK_DIR}

    ./configure --prefix=/usr --disable-static

    make

    make DESTDIR="${OUT_DIR}" install

    find ${OUT_DIR} -type f -executable -exec strip --strip-unneeded {} \; 2>/dev/null || true
    find ${OUT_DIR} -name '*.a' -exec objcopy --enable-deterministic-archives {} \; 2>/dev/null || true
    find "${OUT_DIR}" -exec touch -d "2024-01-01T00:00:00+00:00" {} \;

bundles:
  dev:
  - bin
  - dev
  - lib

outputs:
  bin:
    files:
    - path: /usr/bin/asn1Parser
      needs:
      - /usr/lib/ld-linux-x86-64.so.2
      - /usr/lib/libc.so.6
      - /usr/lib/libtasn1.so.6
    - path: /usr/bin/asn1Decoding
      needs:
      - /usr/lib/ld-linux-x86-64.so.2
      - /usr/lib/libc.so.6
      - /usr/lib/libtasn1.so.6
    - path: /usr/bin/asn1Coding
      needs:
      - /usr/lib/ld-linux-x86-64.so.2
      - /usr/lib/libc.so.6
      - /usr/lib/libtasn1.so.6

  dev:
    files:
    - path: /usr/include/libtasn1.h
    - path: /usr/lib/libtasn1.la
    - path: /usr/lib/pkgconfig/libtasn1.pc

  info:
    files:
    - path: /usr/share/info/libtasn1.info

  lib:
    files:
    - path: /usr/lib/libtasn1.so
      needs:
      - /usr/lib/libc.so.6
    - path: /usr/lib/libtasn1.so.6
      needs:
      - /usr/lib/libc.so.6
    - path: /usr/lib/libtasn1.so.6.6.3
      needs:
      - /usr/lib/libc.so.6

  man:
    files:
    - path: /usr/share/man/man1/asn1Parser.1
