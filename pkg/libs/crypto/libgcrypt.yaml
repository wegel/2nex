package:
  schema: 1
  name: libgcrypt
  slug: libgcrypt
  namespace: libs/crypto
  version: 1.12.1
  description: General-purpose cryptographic library from GnuPG
  homepage: https://www.gnupg.org/software/libgcrypt/
  checksum: c6f27945a70498f9df530209b58bf451192ab2307c9e8e30d1fd68d9cfb26709

sources:
- name: libgcrypt
  url: https://gnupg.org/ftp/gcrypt/libgcrypt/libgcrypt-1.12.1.tar.bz2
  sha256: 7df5c08d952ba33f9b6bdabdb06a61a78b2cf62d2122c2d1d03a91a79832aa3c

dependencies:
- name: glibc
  commit: x86_64/pkg/libs/system/glibc/2.39/bundles/dev
- name: gcc
  commit: x86_64/pkg/core/toolchain/gcc/13.2.0/bundles/dev
- name: binutils
  commit: x86_64/pkg/core/toolchain/binutils/2.42/bundles/dev
- name: bash
  commit: x86_64/pkg/cli/shells/bash/5.2.21/bundles/dev
- name: coreutils
  commit: x86_64/pkg/core/userland/coreutils/9.5/bundles/dev
- name: findutils
  commit: x86_64/pkg/core/userland/findutils/4.9.0/bundles/dev
- name: gawk
  commit: x86_64/pkg/cli/text/gawk/5.3.0/bundles/dev
- name: grep
  commit: x86_64/pkg/cli/text/grep/3.11/bundles/dev
- name: make
  commit: x86_64/pkg/core/toolchain/make/4.4.1/bundles/dev
- name: sed
  commit: x86_64/pkg/cli/text/sed/4.9/bundles/dev
- name: tar
  commit: x86_64/pkg/cli/archive/tar/1.35/bundles/dev
- name: bzip2
  commit: x86_64/pkg/libs/compression/bzip2/1.0.8/bundles/dev
- name: linux-headers
  commit: x86_64/pkg/libs/system/linux-headers/6.4.1/bundles/dev
- name: ncurses
  commit: x86_64/pkg/libs/system/ncurses/6.4-20230520/bundles/dev
- name: acl
  commit: x86_64/pkg/libs/system/acl/2.3.2/bundles/dev
- name: attr
  commit: x86_64/pkg/libs/system/attr/2.5.2/bundles/dev
- name: gmp
  commit: x86_64/pkg/libs/system/gmp/6.3.0/bundles/dev
- name: libgpg-error
  commit: x86_64/pkg/dev/libs/libgpg-error/1.59/bundles/dev
- name: diffutils
  commit: x86_64/pkg/core/userland/diffutils/3.10/bundles/dev
- name: file
  commit: x86_64/pkg/dev/tools/file/5.45/bundles/dev
- name: inetutils
  commit: x86_64/pkg/net/misc/inetutils/2.5/bundles/dev
- name: texinfo
  commit: x86_64/pkg/cli/text/texinfo/7.1/bundles/dev

build:
  environment: 27b6e5dc7ad152c9a17c2cabfcc5ee93daa9bbf0
  profile: [8218:3772, 25450:7383, 51662:7596, 86038:7742, 116160:7881, 142551:7964, 172888:8124, 215383:10193, 258305:10675, 284480:12148]

  script: |
    tar --no-same-owner -xf /${SOURCE_libgcrypt} -C "${WORK_DIR}" --strip-components=1
    cd ${WORK_DIR}

    ./configure \
      --prefix=/usr \
      --disable-static

    make
    make DESTDIR="${OUT_DIR}" install

    find "${OUT_DIR}" -name '*.la' -delete
    find ${OUT_DIR} -type f -executable -exec strip --strip-unneeded {} \; 2>/dev/null || true
    find ${OUT_DIR} -name '*.a' -exec objcopy --enable-deterministic-archives {} \; 2>/dev/null || true
    find "${OUT_DIR}" -exec touch -h -d "2024-01-01T00:00:00+00:00" {} \;

bundles:
  dev:
  - bin
  - dev
  - lib

  full:
  - bin
  - info
  - lib
  - man
  - misc

outputs:
  bin:
    files:
    - path: /usr/bin/dumpsexp
      needs:
      - /usr/lib/ld-linux-x86-64.so.2
      - /usr/lib/libc.so.6
    - path: /usr/bin/hmac256
      needs:
      - /usr/lib/ld-linux-x86-64.so.2
      - /usr/lib/libc.so.6
    - path: /usr/bin/mpicalc
      needs:
      - /usr/lib/ld-linux-x86-64.so.2
      - /usr/lib/libc.so.6
      - /usr/lib/libgcrypt.so.20
      - /usr/lib/libgpg-error.so.0

  dev:
    files:
    - path: /usr/include/gcrypt.h
    - path: /usr/lib/libgcrypt.so
    - path: /usr/lib/pkgconfig/libgcrypt.pc

  info:
    files:
    - path: /usr/share/info/dir
    - path: /usr/share/info/gcrypt.info
    - path: /usr/share/info/gcrypt.info-1
    - path: /usr/share/info/gcrypt.info-2

  lib:
    files:
    - path: /usr/lib/libgcrypt.so.20
      needs:
      - /usr/lib/ld-linux-x86-64.so.2
      - /usr/lib/libc.so.6
      - /usr/lib/libgpg-error.so.0
    - path: /usr/lib/libgcrypt.so.20.7.1
      needs:
      - /usr/lib/ld-linux-x86-64.so.2
      - /usr/lib/libc.so.6
      - /usr/lib/libgpg-error.so.0

  man:
    files:
    - path: /usr/share/man/man1/hmac256.1

  misc:
    files:
    - path: /usr/share/aclocal/libgcrypt.m4

resolution:
  /usr/lib/ld-linux-x86-64.so.2: glibc
  /usr/lib/libc.so.6: glibc
  /usr/lib/libgpg-error.so.0: libgpg-error
  /usr/lib/libgcrypt.so.20: self
