build:
  environment: 27b6e5dc7ad152c9a17c2cabfcc5ee93daa9bbf0
  profile: [490706:86432, 1950877:87327, 4388511:89212, 7312121:90528, 9748862:92301, 12185934:144701, 14622786:161770, 18280979:208872, 21937292:212274, 24370636:220482]

  script: |
    tar --no-same-owner -xf /${SOURCE_gnutls} -C "${WORK_DIR}" --strip-components=1
    cd ${WORK_DIR}

    ./configure --prefix=/usr \
      --disable-static \
      --with-default-trust-store-pkcs11="pkcs11:" \
      --without-tpm \
      --disable-guile \
      --disable-doc

    make

    make DESTDIR="${OUT_DIR}" install

    find ${OUT_DIR} -type f -executable -exec strip --strip-unneeded {} \; 2>/dev/null || true
    find ${OUT_DIR} -name '*.a' -exec objcopy --enable-deterministic-archives {} \; 2>/dev/null || true
    find "${OUT_DIR}" -exec touch -d "2024-01-01T00:00:00+00:00" {} \;

