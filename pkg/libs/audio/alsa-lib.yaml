build:
  environment: 27b6e5dc7ad152c9a17c2cabfcc5ee93daa9bbf0
  profile: [4099:1528, 8235:3509, 12334:4470, 16450:7723, 20582:7777, 24901:7834, 29001:8771, 31455:8909]

  script: |
    tar --no-same-owner -xf /${SOURCE_alsa_lib} -C "${WORK_DIR}" --strip-components=1
    cd ${WORK_DIR}

    patch --batch --fuzz=0 -Np1 -i "/${SOURCE_uapi_config}"

    ./configure \
      --prefix=/usr \
      --without-debug \
      --disable-python

    make
    make DESTDIR="${OUT_DIR}" install

    installed_conf="${OUT_DIR}/usr/share/alsa/alsa.conf"
    if grep -q '/usr/etc' "${installed_conf}"; then
      printf 'alsa-lib UAPI smoke: leftover /usr/etc in alsa.conf\n' >&2
      exit 1
    fi
    for p in '/usr/share/alsa/conf.d' '/run/alsa/conf.d' '/etc/alsa/conf.d' \
             '/etc/asound.conf' '/run/asound.conf' '/usr/share/alsa/asound.conf'; do
      if ! grep -q "${p}" "${installed_conf}"; then
        printf 'alsa-lib UAPI smoke: missing %s\n' "${p}" >&2
        exit 1
      fi
    done
    printf 'alsa-lib UAPI smoke: alsa.conf names /etc, /run, and /usr/share, not /usr/etc\n'

    find ${OUT_DIR} -type f -executable -exec strip --strip-unneeded {} \; 2>/dev/null || true
    find ${OUT_DIR} -name '*.a' -exec objcopy --enable-deterministic-archives {} \; 2>/dev/null || true
    find "${OUT_DIR}" -exec touch -d "2024-01-01T00:00:00+00:00" {} \;

