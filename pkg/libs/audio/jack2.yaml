package:
  schema: 1
  name: jack2
  slug: jack2
  namespace: libs/audio
  version: 1.9.22
  description: JACK audio server and client libraries
  homepage: https://jackaudio.org/
  checksum: 527b38622c7e290f5b82c6c30427373042583fe7edae9611728f97b2b6e1a096

sources:
- name: jack2
  url: https://github.com/jackaudio/jack2/archive/refs/tags/v1.9.22.tar.gz
  sha256: 1e42b9fc4ad7db7befd414d45ab2f8a159c0b30fcd6eee452be662298766a849

dependencies:
- name: glibc
  commit: x86_64/pkg/libs/system/glibc/2.39/bundles/dev
- name: gmp
  commit: x86_64/pkg/libs/system/gmp/6.3.0/bundles/dev
- name: gcc
  commit: x86_64/pkg/core/toolchain/gcc/13.2.0/bundles/dev
- name: binutils
  commit: x86_64/pkg/core/toolchain/binutils/2.42/bundles/dev
- name: bash
  commit: x86_64/pkg/cli/shells/bash/5.2.21/bundles/dev
- name: ncurses
  commit: x86_64/pkg/libs/system/ncurses/6.4-20230520/bundles/dev
- name: acl
  commit: x86_64/pkg/libs/system/acl/2.3.2/bundles/dev
- name: attr
  commit: x86_64/pkg/libs/system/attr/2.5.2/bundles/dev
- name: tar
  commit: x86_64/pkg/cli/archive/tar/1.35/bundles/dev
- name: gzip
  commit: x86_64/pkg/cli/archive/gzip/1.13/bundles/dev
- name: zlib
  commit: x86_64/pkg/libs/system/zlib/1.3.1/bundles/dev
- name: coreutils
  commit: x86_64/pkg/core/userland/coreutils/9.5/bundles/dev
- name: findutils
  commit: x86_64/pkg/core/userland/findutils/4.9.0/bundles/dev
- name: sed
  commit: x86_64/pkg/cli/text/sed/4.9/bundles/dev
- name: linux-headers
  commit: x86_64/pkg/libs/system/linux-headers/6.4.1/bundles/dev
- name: python3
  commit: x86_64/pkg/dev/lang/python3/3.12.2/bundles/dev
- name: pkgconf
  commit: x86_64/pkg/core/toolchain/pkgconf/2.2.0/bundles/dev
- name: alsa-lib
  commit: x86_64/pkg/libs/audio/alsa-lib/1.2.14/bundles/dev
- name: opus
  commit: x86_64/pkg/libs/audio/opus/1.5.2/bundles/dev

build:
  environment: 27b6e5dc7ad152c9a17c2cabfcc5ee93daa9bbf0
  profile: [4211:509, 8461:922, 12642:1238, 16762:1609, 20916:1892, 25048:2105, 29146:2212, 33270:5897, 36863:6793]

  script: |
    set -eu

    tar --no-same-owner -xf /${SOURCE_jack2} -C "${WORK_DIR}" --strip-components=1
    cd "${WORK_DIR}"

    python3 - <<'PY'
    from pathlib import Path

    path = Path("waflib/Context.py")
    text = path.read_text()
    text = text.replace("import os, re, imp, sys", "import os, re, sys, types")
    text = text.replace("module = imp.new_module(WSCRIPT_FILE)", "module = types.ModuleType(WSCRIPT_FILE)")
    path.write_text(text)
    PY

    export SOURCE_DATE_EPOCH=1704067200
    python3 ./waf configure \
      --prefix=/usr \
      --libdir=/usr/lib \
      --pkgconfigdir=/usr/lib/pkgconfig \
      --mandir=/usr/share/man/man1 \
      --classic \
      --autostart=classic \
      --alsa=yes \
      --opus=yes \
      --no-celt \
      --no-doxygen \
      --no-firewire \
      --no-iio \
      --no-portaudio \
      --no-samplerate \
      --no-systemd \
      --no-db \
      --no-tests \
      --no-winmme

    python3 ./waf build
    python3 ./waf install --destdir="${OUT_DIR}"

    find "${OUT_DIR}" -type f -executable -exec strip --strip-unneeded {} \; 2>/dev/null || true
    find "${OUT_DIR}" -name '*.a' -exec objcopy --enable-deterministic-archives {} \; 2>/dev/null || true
    find "${OUT_DIR}" -exec touch -d "2024-01-01T00:00:00+00:00" {} \;

bundles:
  dev:
  - bin
  - dev
  - lib
  - man

outputs:
  bin:
    files:
    - path: /usr/bin/jackd
      needs:
      - /usr/lib/ld-linux-x86-64.so.2
      - /usr/lib/libc.so.6
