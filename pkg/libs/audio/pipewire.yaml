build:
  environment: 13ce31fd97c19f5756e4413babf279d543b5a71c
  profile: [4174:1011, 12408:1507, 28923:2215, 49786:3218, 62335:3451, 78927:4366, 95406:5561, 120298:16237, 141075:16273, 155030:16618]

  script: |
    tar --no-same-owner -xzf /${SOURCE_pipewire} -C "${WORK_DIR}" --strip-components=1
    cd ${WORK_DIR}

    meson setup build \
      --prefix=/usr \
      --buildtype=release \
      -Dsystemd=enabled \
      -Dalsa=enabled \
      -Dpipewire-alsa=enabled \
      -Djack=disabled \
      -Dpipewire-jack=disabled \
      -Dv4l2=enabled \
      -Dlibpulse=disabled \
      -Dpipewire-v4l2=enabled \
      -Dbluez5=disabled \
      -Dtests=disabled \
      -Dinstalled_tests=disabled \
      -Dgstreamer=disabled \
      -Dlibcamera=disabled \
      -Dvolume=disabled \
      -Dvulkan=disabled \
      -Dsdl2=disabled \
      -Droc=disabled \
      -Davahi=disabled \
      -Decho-cancel-webrtc=disabled \
      -Dlibusb=disabled \
      -Draop=disabled \
      -Dlv2=disabled \
      -Dx11=disabled \
      -Dx11-xfixes=disabled \
      -Dlibcanberra=disabled \
      -Dflatpak=disabled \
      -Dudevrulesdir=/usr/lib/udev/rules.d \
      -Dsession-managers=[]

    ninja -C build
    DESTDIR="${OUT_DIR}" ninja -C build install

    find ${OUT_DIR} -type f -executable -exec strip --strip-unneeded {} \; 2>/dev/null || true
    find ${OUT_DIR} -name '*.a' -exec objcopy --enable-deterministic-archives {} \; 2>/dev/null || true
    find "${OUT_DIR}" -exec touch -d "2024-01-01T00:00:00+00:00" {} \;

