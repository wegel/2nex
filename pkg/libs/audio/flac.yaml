package:
  schema: 1
  name: flac
  slug: flac
  namespace: libs/audio
  version: 1.5.0
  description: Free Lossless Audio Codec
  homepage: https://xiph.org/flac/
  checksum: d1fe2acd0c110a9bc5fa03799dbfbbd09d1eb7f59ad2364cc9e5c2fdd1d4b4da

sources:
- name: flac
  url: https://github.com/xiph/flac/releases/download/1.5.0/flac-1.5.0.tar.xz
  sha256: f2c1c76592a82ffff8413ba3c4a1299b6c7ab06c734dee03fd88630485c2b920

dependencies:
- name: glibc
  commit: x86_64/pkg/libs/system/glibc/2.39/bundles/dev
- name: gmp
  commit: x86_64/pkg/libs/system/gmp/6.3.0/bundles/dev
- name: gcc
  commit: x86_64/pkg/core/toolchain/gcc/13.2.0/bundles/dev
- name: binutils
  commit: x86_64/pkg/core/toolchain/binutils/2.42/bundles/dev
- name: make
  commit: x86_64/pkg/core/toolchain/make/4.4.1/bundles/dev
- name: bash
  commit: x86_64/pkg/cli/shells/bash/5.2.21/bundles/dev
- name: coreutils
  commit: x86_64/pkg/core/userland/coreutils/9.5/bundles/dev
- name: findutils
  commit: x86_64/pkg/core/userland/findutils/4.9.0/bundles/dev
- name: sed
  commit: x86_64/pkg/cli/text/sed/4.9/bundles/dev
- name: grep
  commit: x86_64/pkg/cli/text/grep/3.11/bundles/dev
- name: gawk
  commit: x86_64/pkg/cli/text/gawk/5.3.0/bundles/dev
- name: tar
  commit: x86_64/pkg/cli/archive/tar/1.35/bundles/dev
- name: xz
  commit: x86_64/pkg/libs/compression/xz/5.4.6/bundles/dev
- name: linux-headers
  commit: x86_64/pkg/libs/system/linux-headers/6.4.1/bundles/dev
- name: ncurses
  commit: x86_64/pkg/libs/system/ncurses/6.4-20230520/bundles/dev
- name: acl
  commit: x86_64/pkg/libs/system/acl/2.3.2/bundles/dev
- name: attr
  commit: x86_64/pkg/libs/system/attr/2.5.2/bundles/dev
- name: zlib
  commit: x86_64/pkg/libs/system/zlib/1.3.1/bundles/dev
- name: libogg
  commit: x86_64/pkg/libs/audio/libogg/1.3.5/bundles/dev
- name: meson
  commit: x86_64/pkg/core/toolchain/meson/1.6.1/bundles/dev
- name: ninja
  commit: x86_64/pkg/core/toolchain/ninja/1.12.1/bundles/dev
- name: python3
  commit: x86_64/pkg/dev/lang/python3/3.12.2/bundles/dev
- name: pkgconf
  commit: x86_64/pkg/core/toolchain/pkgconf/2.2.0/bundles/dev
- name: libcap
  commit: x86_64/pkg/libs/security/libcap/2.69/bundles/dev

build:
  environment: 27b6e5dc7ad152c9a17c2cabfcc5ee93daa9bbf0
  profile: [4096:914, 8235:3169, 12348:3847, 20721:4679, 24827:4680, 28946:4680, 33084:8046, 41320:8812, 49602:8998, 54920:9475]

  script: |
    tar --no-same-owner -xf /${SOURCE_flac} -C "${WORK_DIR}" --strip-components=1
    cd ${WORK_DIR}

    ./configure \
      --prefix=/usr \
      --disable-static \
      --disable-doxygen-docs \
      --disable-examples \
      --with-ogg

    make
    make DESTDIR="${OUT_DIR}" install

    find ${OUT_DIR} -type f -executable -exec strip --strip-unneeded {} \; 2>/dev/null || true
    find ${OUT_DIR} -name '*.a' -exec objcopy --enable-deterministic-archives {} \; 2>/dev/null || true
    find "${OUT_DIR}" -exec touch -d "2024-01-01T00:00:00+00:00" {} \;

bundles:
  dev:
  - bin
  - dev
  - lib

  full:
  - bin
  - dev
  - lib

outputs:
  bin:
    files:
    - path: /usr/bin/flac
      needs:
      - /usr/lib/ld-linux-x86-64.so.2
      - /usr/lib/libFLAC.so.14
      - /usr/lib/libc.so.6
      - /usr/lib/libm.so.6
    - path: /usr/bin/metaflac
      needs:
      - /usr/lib/ld-linux-x86-64.so.2
      - /usr/lib/libFLAC.so.14
      - /usr/lib/libc.so.6
      - /usr/lib/libm.so.6

  dev:
    files:
    - path: /usr/include/FLAC++/all.h
    - path: /usr/include/FLAC++/decoder.h
    - path: /usr/include/FLAC++/encoder.h
    - path: /usr/include/FLAC++/export.h
    - path: /usr/include/FLAC++/metadata.h
    - path: /usr/include/FLAC/all.h
    - path: /usr/include/FLAC/assert.h
    - path: /usr/include/FLAC/callback.h
    - path: /usr/include/FLAC/export.h
    - path: /usr/include/FLAC/format.h
    - path: /usr/include/FLAC/metadata.h
    - path: /usr/include/FLAC/ordinals.h
    - path: /usr/include/FLAC/stream_decoder.h
    - path: /usr/include/FLAC/stream_encoder.h
    - path: /usr/lib/libFLAC++.la
    - path: /usr/lib/libFLAC.la
    - path: /usr/lib/pkgconfig/flac++.pc
    - path: /usr/lib/pkgconfig/flac.pc

  doc:
    files:
    - path: /usr/share/doc/flac/images/logo.svg
    - path: /usr/share/doc/flac/images/logo130.gif

  lib:
    files:
    - path: /usr/lib/libFLAC++.so
      needs:
      - /usr/lib/libFLAC.so.14
      - /usr/lib/libc.so.6
      - /usr/lib/libgcc_s.so.1
      - /usr/lib/libm.so.6
      - /usr/lib/libstdc++.so.6
    - path: /usr/lib/libFLAC++.so.11
      needs:
      - /usr/lib/libFLAC.so.14
      - /usr/lib/libc.so.6
      - /usr/lib/libgcc_s.so.1
      - /usr/lib/libm.so.6
      - /usr/lib/libstdc++.so.6
    - path: /usr/lib/libFLAC++.so.11.0.0
      needs:
      - /usr/lib/libFLAC.so.14
      - /usr/lib/libc.so.6
      - /usr/lib/libgcc_s.so.1
      - /usr/lib/libm.so.6
      - /usr/lib/libstdc++.so.6
    - path: /usr/lib/libFLAC.so
      needs:
      - /usr/lib/libc.so.6
      - /usr/lib/libm.so.6
      - /usr/lib/libogg.so.0
    - path: /usr/lib/libFLAC.so.14
      needs:
      - /usr/lib/libc.so.6
      - /usr/lib/libm.so.6
      - /usr/lib/libogg.so.0
    - path: /usr/lib/libFLAC.so.14.0.0
      needs:
      - /usr/lib/libc.so.6
      - /usr/lib/libm.so.6
      - /usr/lib/libogg.so.0

  man:
    files:
    - path: /usr/share/man/man1/flac.1
    - path: /usr/share/man/man1/metaflac.1

  misc:
    files:
    - path: /usr/share/aclocal/libFLAC++.m4
    - path: /usr/share/aclocal/libFLAC.m4

resolution:
  /usr/lib/libgcc_s.so.1: gcc
  /usr/lib/libstdc++.so.6: gcc
  /usr/lib/ld-linux-x86-64.so.2: glibc
  /usr/lib/libc.so.6: glibc
  /usr/lib/libm.so.6: glibc
  /usr/lib/libogg.so.0: libogg
  /usr/lib/libFLAC.so.14: self
