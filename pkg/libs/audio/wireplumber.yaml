build:
  environment: 13ce31fd97c19f5756e4413babf279d543b5a71c
  profile: [4117:682, 8338:825, 12469:1424, 16572:1715, 20712:8665, 24903:8665, 29061:8675, 33194:8675, 34294:8784]

  script: |
    tar --no-same-owner -xzf /${SOURCE_wireplumber} -C "${WORK_DIR}" --strip-components=1
    cd ${WORK_DIR}

    # provide lua source and meson wrap patch for subproject (no network in build)
    mkdir -p subprojects/packagecache
    cp /${SOURCE_lua} subprojects/packagecache/lua-5.4.4.tar.gz
    cp /${SOURCE_lua_wrap} subprojects/packagecache/lua_5.4.4-1_patch.zip

    meson setup build \
      --prefix=/usr \
      --buildtype=release \
      -Dsystem-lua=false \
      -Ddoc=disabled \
      -Dintrospection=disabled \
      -Dtests=false

    ninja -C build
    DESTDIR="${OUT_DIR}" ninja -C build install

    find ${OUT_DIR} -type f -executable -exec strip --strip-unneeded {} \; 2>/dev/null || true
    find ${OUT_DIR} -name '*.a' -exec objcopy --enable-deterministic-archives {} \; 2>/dev/null || true
    find "${OUT_DIR}" -exec touch -d "2024-01-01T00:00:00+00:00" {} \;

