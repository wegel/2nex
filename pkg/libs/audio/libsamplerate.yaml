package:
  schema: 1
  name: libsamplerate
  slug: libsamplerate
  namespace: libs/audio
  version: 0.2.2
  description: Sample rate conversion library for audio
  homepage: https://libsndfile.github.io/libsamplerate/
  checksum: cd146b26d7eb5bfb7bdd5cdd20081f166555b2f2a6f84e63521712f992d51698

sources:
- name: libsamplerate
  url: https://github.com/libsndfile/libsamplerate/releases/download/0.2.2/libsamplerate-0.2.2.tar.xz
  sha256: 3258da280511d24b49d6b08615bbe824d0cacc9842b0e4caf11c52cf2b043893

dependencies:
- name: glibc
  commit: x86_64/pkg/libs/system/glibc/2.39/bundles/dev
- name: gmp
  commit: x86_64/pkg/libs/system/gmp/6.3.0/bundles/dev
- name: gcc
  commit: x86_64/pkg/core/toolchain/gcc/13.2.0/bundles/dev
- name: binutils
  commit: x86_64/pkg/core/toolchain/binutils/2.42/bundles/dev
- name: bash
  commit: x86_64/pkg/cli/shells/bash/5.2.21/bundles/dev
- name: ncurses
  commit: x86_64/pkg/libs/system/ncurses/6.4-20230520/bundles/dev
- name: acl
  commit: x86_64/pkg/libs/system/acl/2.3.2/bundles/dev
- name: attr
  commit: x86_64/pkg/libs/system/attr/2.5.2/bundles/dev
- name: tar
  commit: x86_64/pkg/cli/archive/tar/1.35/bundles/dev
- name: xz
  commit: x86_64/pkg/libs/compression/xz/5.4.6/bundles/dev
- name: zlib
  commit: x86_64/pkg/libs/system/zlib/1.3.1/bundles/dev
- name: coreutils
  commit: x86_64/pkg/core/userland/coreutils/9.5/bundles/dev
- name: findutils
  commit: x86_64/pkg/core/userland/findutils/4.9.0/bundles/dev
- name: linux-headers
  commit: x86_64/pkg/libs/system/linux-headers/6.4.1/bundles/dev
- name: cmake
  commit: x86_64/pkg/dev/build/cmake/3.31.10/bundles/dev
- name: ninja
  commit: x86_64/pkg/core/toolchain/ninja/1.12.1/bundles/dev

build:
  environment: 27b6e5dc7ad152c9a17c2cabfcc5ee93daa9bbf0
  profile: [3746:41440]

  script: |
    set -eu

    tar --no-same-owner -xf /${SOURCE_libsamplerate} -C "${WORK_DIR}" --strip-components=1
    cd "${WORK_DIR}"

    cmake -B build -G Ninja \
      -DCMAKE_BUILD_TYPE=Release \
      -DCMAKE_INSTALL_PREFIX=/usr \
      -DCMAKE_INSTALL_LIBDIR=lib \
      -DBUILD_SHARED_LIBS=ON \
      -DBUILD_TESTING=OFF \
      -DLIBSAMPLERATE_EXAMPLES=OFF \
      -DLIBSAMPLERATE_INSTALL=ON

    ninja -C build
    DESTDIR="${OUT_DIR}" ninja -C build install

    find "${OUT_DIR}" -type f -executable -exec strip --strip-unneeded {} \; 2>/dev/null || true
    find "${OUT_DIR}" -name '*.a' -exec objcopy --enable-deterministic-archives {} \; 2>/dev/null || true
    find "${OUT_DIR}" -exec touch -d "2024-01-01T00:00:00+00:00" {} \;

bundles:
  dev:
  - dev
  - lib

outputs:
  dev:
    files:
    - path: /usr/include/samplerate.h
    - path: /usr/lib/cmake/SampleRate/SampleRateConfig.cmake
    - path: /usr/lib/cmake/SampleRate/SampleRateConfigVersion.cmake
    - path: /usr/lib/cmake/SampleRate/SampleRateTargets-release.cmake
    - path: /usr/lib/cmake/SampleRate/SampleRateTargets.cmake
    - path: /usr/lib/pkgconfig/samplerate.pc

  doc:
    files:
    - path: /usr/share/doc/libsamplerate/SRC.png
    - path: /usr/share/doc/libsamplerate/api.md
    - path: /usr/share/doc/libsamplerate/api_callback.md
    - path: /usr/share/doc/libsamplerate/api_full.md
    - path: /usr/share/doc/libsamplerate/api_misc.md
    - path: /usr/share/doc/libsamplerate/api_simple.md
    - path: /usr/share/doc/libsamplerate/bugs.md
    - path: /usr/share/doc/libsamplerate/download.md
    - path: /usr/share/doc/libsamplerate/faq.md
    - path: /usr/share/doc/libsamplerate/history.md
    - path: /usr/share/doc/libsamplerate/index.md
    - path: /usr/share/doc/libsamplerate/license.md
    - path: /usr/share/doc/libsamplerate/lists.md
    - path: /usr/share/doc/libsamplerate/quality.md
    - path: /usr/share/doc/libsamplerate/win32.md

  lib:
    files:
    - path: /usr/lib/libsamplerate.so
      needs:
      - /usr/lib/libc.so.6
      - /usr/lib/libm.so.6
    - path: /usr/lib/libsamplerate.so.0
      needs:
      - /usr/lib/libc.so.6
      - /usr/lib/libm.so.6
    - path: /usr/lib/libsamplerate.so.0.2.2
      needs:
      - /usr/lib/libc.so.6
      - /usr/lib/libm.so.6

resolution:
  /usr/lib/libc.so.6: glibc
  /usr/lib/libm.so.6: glibc
