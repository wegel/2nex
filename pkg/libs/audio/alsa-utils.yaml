build:
  environment: 13ce31fd97c19f5756e4413babf279d543b5a71c
  profile: [4119:759, 12493:2684, 21043:3546, 34024:4197, 42733:5808, 55548:6606, 64159:7671, 81627:9247, 94139:10131, 104414:10636]

  script: |
    tar --no-same-owner -xf /${SOURCE_alsa_utils} -C "${WORK_DIR}" --strip-components=1
    cd ${WORK_DIR}

    ./configure \
      --prefix=/usr \
      --disable-alsaconf \
      --disable-bat \
      --disable-xmlto \
      --with-curses=ncursesw

    make
    make DESTDIR="${OUT_DIR}" install

    find "${OUT_DIR}" -exec touch -d "2024-01-01T00:00:00+00:00" {} \;
    2nex_strip_binaries ${OUT_DIR}

bundles:
  dev:
  - bin
  - lib
  - misc

