package:
  schema: 1
  name: xauth
  slug: xauth
  namespace: apps/x11
  version: 1.1.5
  description: X authority file utility
  homepage: https://xorg.freedesktop.org/
  checksum: 4a2ea27ed2c4deb658b285bc88b260effc0e31bf7c371cfdc657f385bb7afd63

sources:
- name: xauth
  url: https://xorg.freedesktop.org/archive/individual/app/xauth-1.1.5.tar.xz
  sha256: a4000e2f441facebf569026bedecc23ba262cc6927be52070abe0002625cfbe0

dependencies:
- name: glibc
  commit: x86_64/pkg/libs/system/glibc/2.39/bundles/dev
- name: gcc
  commit: x86_64/pkg/core/toolchain/gcc/13.2.0/bundles/dev
- name: binutils
  commit: x86_64/pkg/core/toolchain/binutils/2.42/bundles/dev
- name: make
  commit: x86_64/pkg/core/toolchain/make/4.4.1/bundles/dev
- name: pkgconf
  commit: x86_64/pkg/core/toolchain/pkgconf/2.2.0/bundles/dev
- name: file
  commit: x86_64/pkg/dev/tools/file/5.45/bundles/dev
- name: bash
  commit: x86_64/pkg/cli/shells/bash/5.2.21/bundles/dev
- name: ncurses
  commit: x86_64/pkg/libs/system/ncurses/6.4-20230520/bundles/dev
- name: acl
  commit: x86_64/pkg/libs/system/acl/2.3.2/bundles/dev
- name: attr
  commit: x86_64/pkg/libs/system/attr/2.5.2/bundles/dev
- name: tar
  commit: x86_64/pkg/cli/archive/tar/1.35/bundles/dev
- name: xz
  commit: x86_64/pkg/libs/compression/xz/5.4.6/bundles/dev
- name: zlib
  commit: x86_64/pkg/libs/system/zlib/1.3.1/bundles/dev
- name: coreutils
  commit: x86_64/pkg/core/userland/coreutils/9.5/bundles/dev
- name: findutils
  commit: x86_64/pkg/core/userland/findutils/4.9.0/bundles/dev
- name: diffutils
  commit: x86_64/pkg/core/userland/diffutils/3.10/bundles/dev
- name: linux-headers
  commit: x86_64/pkg/libs/system/linux-headers/6.4.1/bundles/dev
- name: gawk
  commit: x86_64/pkg/cli/text/gawk/5.3.0/bundles/dev
- name: sed
  commit: x86_64/pkg/cli/text/sed/4.9/bundles/dev
- name: grep
  commit: x86_64/pkg/cli/text/grep/3.11/bundles/dev
- name: xorgproto
  commit: x86_64/pkg/libs/x11/xorgproto/2024.1/bundles/dev
- name: util-macros
  commit: x86_64/pkg/libs/x11/util-macros/1.20.2/bundles/dev
- name: libx11
  commit: x86_64/pkg/libs/x11/libx11/1.8.10/bundles/dev
- name: libxcb
  commit: x86_64/pkg/libs/x11/libxcb/1.17.0/bundles/dev
- name: libxau
  commit: x86_64/pkg/libs/x11/libxau/1.0.12/bundles/dev
- name: libxdmcp
  commit: x86_64/pkg/libs/x11/libxdmcp/1.1.5/bundles/dev
- name: libxext
  commit: x86_64/pkg/libs/x11/libxext/1.3.6/bundles/dev
- name: libxmu
  commit: x86_64/pkg/libs/x11/libxmu/1.3.1/bundles/dev

build:
  environment: 27b6e5dc7ad152c9a17c2cabfcc5ee93daa9bbf0
  profile: [4125:6417, 6637:10935]

  script: |
    tar --no-same-owner -xf /${SOURCE0} -C "${WORK_DIR}" --strip-components=1
    cd ${WORK_DIR}

    ./configure --prefix=/usr --without-lint

    make
    make DESTDIR="${OUT_DIR}" install

    find ${OUT_DIR} -type f -executable -exec strip --strip-unneeded {} \; 2>/dev/null || true
    find ${OUT_DIR} -name '*.a' -exec objcopy --enable-deterministic-archives {} \; 2>/dev/null || true
    find "${OUT_DIR}" -exec touch -d "2024-01-01T00:00:00+00:00" {} \;

bundles:
  dev:
  - bin

outputs:
  bin:
    files:
    - path: /usr/bin/xauth
      needs:
      - /usr/lib/ld-linux-x86-64.so.2
      - /usr/lib/libX11.so.6
      - /usr/lib/libXau.so.6
      - /usr/lib/libXext.so.6
      - /usr/lib/libXmuu.so.1
      - /usr/lib/libc.so.6

  man:
    files:
    - path: /usr/share/man/man1/xauth.1

resolution:
  /usr/lib/ld-linux-x86-64.so.2: glibc
  /usr/lib/libc.so.6: glibc
  /usr/lib/libX11.so.6: libx11
  /usr/lib/libXau.so.6: libxau
  /usr/lib/libXext.so.6: libxext
  /usr/lib/libXmuu.so.1: libxmu
