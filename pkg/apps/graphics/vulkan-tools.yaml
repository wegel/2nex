build:
  environment: 27b6e5dc7ad152c9a17c2cabfcc5ee93daa9bbf0
  profile: [2914:11597]

  script: |
    tar --no-same-owner -xf /${SOURCE_vulkan_tools} -C "${WORK_DIR}" --strip-components=1
    cd "${WORK_DIR}"

    export PKG_CONFIG_PATH=/usr/lib/pkgconfig:/usr/share/pkgconfig

    cmake -B build -G Ninja \
      -DCMAKE_BUILD_TYPE=Release \
      -DCMAKE_INSTALL_PREFIX=/usr \
      -DCMAKE_INSTALL_LIBDIR=lib \
      -DBUILD_TESTS=OFF \
      -DBUILD_WSI_DIRECTFB_SUPPORT=OFF

    cmake --build build
    DESTDIR="${OUT_DIR}" cmake --install build

    find "${OUT_DIR}" -type f -executable -exec strip --strip-unneeded {} \; 2>/dev/null || true
    find "${OUT_DIR}" -name '*.a' -exec objcopy --enable-deterministic-archives {} \; 2>/dev/null || true
    find "${OUT_DIR}" -exec touch -d "2024-01-01T00:00:00+00:00" {} \;

bundles:
  dev:
  - bin

outputs:
  bin:
    files:
    - path: /usr/bin/vkcube
      needs:
      - /usr/lib/ld-linux-x86-64.so.2
      - /usr/lib/libc.so.6
      - /usr/lib/libm.so.6
      - /usr/lib/libvulkan.so.1
    - path: /usr/bin/vkcubepp
      needs:
      - /usr/lib/ld-linux-x86-64.so.2
      - /usr/lib/libc.so.6
      - /usr/lib/libgcc_s.so.1
      - /usr/lib/libm.so.6
      - /usr/lib/libstdc++.so.6
      - /usr/lib/libvulkan.so.1
    - path: /usr/bin/vulkaninfo
      needs:
      - /usr/lib/ld-linux-x86-64.so.2
      - /usr/lib/libX11.so.6
      - /usr/lib/libc.so.6
      - /usr/lib/libgcc_s.so.1
      - /usr/lib/libstdc++.so.6
      - /usr/lib/libvulkan.so.1
      - /usr/lib/libwayland-client.so.0
      - /usr/lib/libxcb.so.1

resolution:
  /usr/lib/libgcc_s.so.1: gcc
  /usr/lib/libstdc++.so.6: gcc
  /usr/lib/ld-linux-x86-64.so.2: glibc
  /usr/lib/libc.so.6: glibc
  /usr/lib/libm.so.6: glibc
  /usr/lib/libX11.so.6: libx11
  /usr/lib/libxcb.so.1: libxcb
  /usr/lib/libvulkan.so.1: vulkan-loader
  /usr/lib/libwayland-client.so.0: wayland
