build:
  environment: 27b6e5dc7ad152c9a17c2cabfcc5ee93daa9bbf0
  profile: [103499:210578, 402111:395954, 904144:639994, 1505518:946621, 2006919:1740610, 2509077:2160635, 3010281:3573092, 3760687:4805430, 4511281:5575873, 5010542:6571968]

  script: |
    # re-extract when the source archive changes
    src_id="$(basename "${SOURCE0}")"
    src_marker="${WORK_DIR}/.nex_source_id"
    if [ ! -f "${src_marker}" ] || [ "$(cat "${src_marker}")" != "${src_id}" ]; then
      rm -rf "${WORK_DIR:?}"/*
      tar --no-same-owner -xf /${SOURCE0} -C "${WORK_DIR}" --strip-components=1
      echo "${src_id}" > "${src_marker}"
    fi
    cd ${WORK_DIR}

    # arch: allow building nickel without nickel (https://nickel-lang.org)
    if [ -f nickel/nickel_gen.gni ]; then
      sed -i 's/nickel_version > 0/"nickel_version" not in dir()/' nickel/nickel_gen.gni
    fi

    # arch: allow nickel to find its library
    if [ -f nickel/nickel.gni ]; then
      sed -i 's|nickel_root|"nickel"|' nickel/nickel.gni
    fi

    # arch: use GOOGLE_CHROME_BUILD to get nickel support
    sed -i 's/OFFICIAL_BUILD/GOOGLE_CHROME_BUILD/' tools/generate_shim_headers/generate_shim_headers.py

    # arch: fix xml memory function incompatibility
    sed -i \
      -e 's/\\<xmlMalloc\\>/malloc/' \
      -e 's/\\<xmlFree\\>/free/' \
      -e '1i #include <cstdlib>' \
      third_party/blink/renderer/core/xml/*.cc \
      third_party/blink/renderer/core/xml/parser/xml_document_parser.cc \
      third_party/libxml/chromium/*.cc

    # clang flags from env enable exceptions; chromium expects them off
    CFLAGS="${CFLAGS//-fexceptions/}"
    CXXFLAGS="${CXXFLAGS//-fexceptions/}"
    CFLAGS="${CFLAGS//-flto=auto/}"
    CXXFLAGS="${CXXFLAGS//-flto=auto/}"
    LDFLAGS="${LDFLAGS//-flto=auto/}"
    export CFLAGS CXXFLAGS LDFLAGS

    # clang LTO can't read rust bitcode from a mismatched LLVM; disable it
    if [ -n "${RUSTFLAGS:-}" ]; then
      RUSTFLAGS="${RUSTFLAGS//-C embed-bitcode=yes/}"
      RUSTFLAGS="${RUSTFLAGS} -C embed-bitcode=no"
      export RUSTFLAGS
    fi

    # disable Python multiprocessing (sem_open unavailable in user namespaces)
    sed -i 's/_ENABLE_MULTIPROCESSING = True/_ENABLE_MULTIPROCESSING = False/' \
      mojo/public/tools/mojom/mojom_parser.py
    sed -i "s/default=False,$/default=True,/" \
      third_party/blink/renderer/bindings/scripts/generate_bindings.py

    # point chromium at a writable clang view with the resource version it expects
    clang_base="${WORK_DIR}/clang-base"
    mkdir -p "${clang_base}/lib/clang"
    ln -sfn /usr/bin "${clang_base}/bin"
    ln -sfn /usr/lib/clang/21 "${clang_base}/lib/clang/21"
    ln -sfn /usr/lib/clang/21 "${clang_base}/lib/clang/22"

    # symlink libffi_pic.a for swiftshader (our libffi is already PIC)
    mkdir -p "${WORK_DIR}/libffi-pic"
    ln -sfn /usr/lib/libffi.a "${WORK_DIR}/libffi-pic/libffi_pic.a"
    export LIBRARY_PATH="${WORK_DIR}/libffi-pic:${LIBRARY_PATH:-}"

    # arch: unbundle system libraries - ONLY those compatible with use_custom_libcxx=true
    system_libs="flac fontconfig freetype harfbuzz-ng libjpeg libwebp libxml libxslt opus zlib"
    if [ ! -f "third_party/flac/BUILD.gn" ]; then
      mkdir -p third_party/flac
      printf '' > third_party/flac/BUILD.gn
    fi
    if [ ! -f "third_party/flac/BUILD.gn" ]; then
      echo "FATAL: missing third_party/flac/BUILD.gn"
      exit 1
    fi
    filtered_libs=""
    for lib in ${system_libs}; do
      if [ "${lib}" = "libjpeg" ]; then
        lib_dir="libjpeg_turbo"
      else
        lib_dir="${lib}"
      fi
      if [ ! -f "third_party/${lib_dir}/BUILD.gn" ]; then
        echo "Skipping unbundle for ${lib} (missing third_party/${lib_dir}/BUILD.gn)"
        continue
      fi
      filtered_libs="${filtered_libs} ${lib}"
      if [ -d "third_party/${lib_dir}" ]; then
        find "third_party/${lib_dir}" -type f \
          \! -path "third_party/${lib_dir}/chromium/*" \
          \! -path "third_party/${lib_dir}/google/*" \
          \! -path "third_party/harfbuzz-ng/utils/hb_scoped.h" \
          \! -regex '.*\.\(gn\|gni\|isolate\)' \
          -delete
      fi
    done

    if [ -n "${filtered_libs}" ]; then
      python3 build/linux/unbundle/replace_gn_files.py --system-libraries ${filtered_libs}
    fi

    # bootstrap gn without LTO
    CFLAGS="${CFLAGS//-flto=auto/}" \
    CXXFLAGS="${CXXFLAGS//-flto=auto/}" \
    LDFLAGS="${LDFLAGS//-flto=auto/}" \
    python3 tools/gn/bootstrap/bootstrap.py -o out/gn --skip-generate-buildfiles

    # generate nss.pc since our NSS package doesn't include it
    mkdir -p "${WORK_DIR}/pkgconfig"
    cat > "${WORK_DIR}/pkgconfig/nss.pc" <<'PCEOF'
    prefix=/usr
    exec_prefix=${prefix}
    libdir=${prefix}/lib
    includedir=${prefix}/include/nss

    Name: NSS
    Description: Network Security Services
    Version: 3.100
    Requires: nspr >= 4.35
    Libs: -L${libdir} -lnss3 -lnssutil3 -lsmime3
    Cflags: -I${includedir}
    PCEOF
    export PKG_CONFIG_PATH="${WORK_DIR}/pkgconfig:${PKG_CONFIG_PATH:-}"

    # arch: gn args - matching Arch Linux PKGBUILD exactly
    mkdir -p out/Default
    cat > out/Default/args.gn <<'EOF'
    custom_toolchain="//build/toolchain/linux/unbundle:default"
    host_toolchain="//build/toolchain/linux/unbundle:default"
    is_official_build=true
    symbol_level=0
    treat_warnings_as_errors=false
    fatal_linker_warnings=false
    disable_fieldtrial_testing_config=true
    blink_enable_generated_code_formatting=false
    ffmpeg_branding="Chrome"
    proprietary_codecs=true
    rtc_use_pipewire=true
    link_pulseaudio=true
    use_custom_libcxx=true
    use_sysroot=false
    use_thin_lto=false
    is_cfi=false
    use_cfi_icall=false
    use_system_libffi=true
    enable_hangout_services_extension=true
    enable_widevine=true
    use_qt5=false
    use_qt6=true
    moc_qt6_path="/usr/lib/qt6"
    use_clang_modules=false
    clang_base_path="/nex/work/clang-base"
    clang_use_chrome_plugins=false
    EOF

    unset TARGET
    export LD_LIBRARY_PATH="${WORK_DIR}/third_party/rust-toolchain/lib:${LD_LIBRARY_PATH:-}"

    # unbundle toolchain pulls compilers from env
    export CC=clang
    export CXX=clang++
    export AR=gcc-ar
    export NM=gcc-nm
    export BUILD_CC=clang
    export BUILD_CXX=clang++
    export BUILD_AR=gcc-ar
    export BUILD_NM=gcc-nm

    out/gn gen out/Default
    ninja -C out/Default chrome chrome_sandbox chromedriver

    # install
    mkdir -p ${OUT_DIR}/usr/lib/chromium
    install -m755 out/Default/chrome ${OUT_DIR}/usr/lib/chromium/chromium
    install -m4755 out/Default/chrome_sandbox ${OUT_DIR}/usr/lib/chromium/chrome-sandbox
    install -m755 out/Default/chromedriver ${OUT_DIR}/usr/lib/chromium/chromedriver
    if [ -f out/Default/chrome_crashpad_handler ]; then
      install -m755 out/Default/chrome_crashpad_handler ${OUT_DIR}/usr/lib/chromium/chrome_crashpad_handler
    fi

    cp -a out/Default/*.pak ${OUT_DIR}/usr/lib/chromium/
    cp -a out/Default/*.bin ${OUT_DIR}/usr/lib/chromium/ 2>/dev/null || true
    cp -a out/Default/icudtl.dat ${OUT_DIR}/usr/lib/chromium/
    if [ -d out/Default/locales ]; then
      cp -a out/Default/locales ${OUT_DIR}/usr/lib/chromium/
    fi
    if [ -f out/Default/libvulkan.so.1 ]; then
      cp -a out/Default/libvulkan.so.1 ${OUT_DIR}/usr/lib/chromium/
    fi
    if [ -f out/Default/libvk_swiftshader.so ]; then
      cp -a out/Default/libvk_swiftshader.so ${OUT_DIR}/usr/lib/chromium/
    fi
    if [ -f out/Default/vk_swiftshader_icd.json ]; then
      cp -a out/Default/vk_swiftshader_icd.json ${OUT_DIR}/usr/lib/chromium/
    fi
    if [ -f out/Default/libEGL.so ]; then
      cp -a out/Default/libEGL.so ${OUT_DIR}/usr/lib/chromium/
    fi
    if [ -f out/Default/libGLESv2.so ]; then
      cp -a out/Default/libGLESv2.so ${OUT_DIR}/usr/lib/chromium/
    fi

    mkdir -p ${OUT_DIR}/usr/bin
    ln -sf ../lib/chromium/chromium ${OUT_DIR}/usr/bin/chromium
    ln -sf ../lib/chromium/chromedriver ${OUT_DIR}/usr/bin/chromedriver

    find ${OUT_DIR} -type f -executable -exec strip --strip-unneeded {} \; 2>/dev/null || true
    find ${OUT_DIR} -name '*.a' -exec objcopy --enable-deterministic-archives {} \; 2>/dev/null || true
    find "${OUT_DIR}" -exec touch -d "2024-01-01T00:00:00+00:00" {} \;

bundles:
  dev:
  - bin
  - lib

  full:
  - bin
  - lib

outputs:
  bin:
    files:
    - path: /usr/bin/chromedriver
    - path: /usr/bin/chromium

  lib:
    files:
    - path: /usr/lib/chromium/chrome-sandbox
      needs:
      - /usr/lib/ld-linux-x86-64.so.2
      - /usr/lib/libc.so.6
    - path: /usr/lib/chromium/chrome_100_percent.pak
    - path: /usr/lib/chromium/chrome_200_percent.pak
    - path: /usr/lib/chromium/chrome_crashpad_handler
