build:
  environment: 27b6e5dc7ad152c9a17c2cabfcc5ee93daa9bbf0
  profile: [4155:1180, 8287:1348, 12502:1398, 16646:1447, 20778:1746, 24936:1976, 29046:2225, 33194:18223, 37297:18272, 37873:18274]

  script: |
    tar --no-same-owner -xf /${SOURCE_mpv} -C "${WORK_DIR}" --strip-components=1
    cd ${WORK_DIR}

    meson setup build \
      --prefix=/usr \
      --buildtype=release \
      -Dlibmpv=true \
      -Dlua=luajit \
      -Dwayland=enabled \
      -Dpipewire=enabled \
      -Dalsa=enabled \
      -Dpulse=disabled \
      -Djack=disabled \
      -Dx11=disabled \
      -Dmanpage-build=disabled \
      -Dtests=false

    ninja -C build
    DESTDIR="${OUT_DIR}" ninja -C build install

    find ${OUT_DIR} -type f -executable -exec strip --strip-unneeded {} \; 2>/dev/null || true
    find ${OUT_DIR} -name '*.a' -exec objcopy --enable-deterministic-archives {} \; 2>/dev/null || true
    find "${OUT_DIR}" -exec touch -d '2024-01-01T00:00:00+00:00' {} \;

