build:
  environment: 27b6e5dc7ad152c9a17c2cabfcc5ee93daa9bbf0
  profile: [4140:817, 8239:1096, 12400:1441, 13590:1516]

  script: |
    set -eu

    tar --no-same-owner -xzf /${SOURCE0} -C "${WORK_DIR}" --strip-components=1
    cd "${WORK_DIR}"

    meson setup build \
      --prefix=/usr \
      --buildtype=release \
      -Dalsa_in_out=enabled \
      -Djack_net=disabled \
      -Djack_netsource=enabled \
      -Djack_rec=enabled \
      -Dopus_support=enabled \
      -Dreadline_support=enabled \
      -Dzalsa=disabled

    ninja -C build
    DESTDIR="${OUT_DIR}" ninja -C build install

    find "${OUT_DIR}" -type f -executable -exec strip --strip-unneeded {} \; 2>/dev/null || true
    find "${OUT_DIR}" -name '*.a' -exec objcopy --enable-deterministic-archives {} \; 2>/dev/null || true
    find "${OUT_DIR}" -exec touch -d "2024-01-01T00:00:00+00:00" {} \;

bundles:
  full:
  - bin
  - lib
  - man

