  commit: x86_64/pkg/dev/virt/spice-protocol/0.14.5/bundles/dev

build:
  environment: env/standard.yaml
  profile: [4148:2340, 8293:2557, 12411:12015, 16510:13312, 18448:16206]

  script: |
    set -eu
    tar --no-same-owner -xf "/${SOURCE_looking_glass}" -C "${WORK_DIR}" --strip-components=1
    cd "${WORK_DIR}/client"

    export PKG_CONFIG_PATH=/usr/lib/pkgconfig:/usr/share/pkgconfig
    export CFLAGS="${CFLAGS//-flto=auto/}"
    export CXXFLAGS="${CXXFLAGS//-flto=auto/}"
    export LDFLAGS="${LDFLAGS//-flto=auto/}"

    cmake -B build -G Ninja \
      -DCMAKE_BUILD_TYPE=Release \
      -DCMAKE_INSTALL_PREFIX=/usr \
      -DOPTIMIZE_FOR_NATIVE=OFF \
      -DENABLE_BACKTRACE=OFF \
      -DENABLE_X11=OFF \
      -DENABLE_WAYLAND=ON \
      -DENABLE_LIBDECOR=OFF \
      -DENABLE_PIPEWIRE=ON \
      -DENABLE_PULSEAUDIO=OFF \
      -DENABLE_EGL=ON \
      -DENABLE_OPENGL=OFF

    cmake --build build
    DESTDIR="${OUT_DIR}" cmake --install build

    strip --strip-unneeded "${OUT_DIR}/usr/bin/looking-glass-client"
    find "${OUT_DIR}" -exec touch -d "2024-01-01T00:00:00+00:00" {} \;

bundles:
  runtime:
  - bin
  - misc

outputs:
  bin:
    files:
    - path: /usr/bin/looking-glass-client
      needs:
      - /usr/lib/ld-linux-x86-64.so.2
      - /usr/lib/libEGL.so.1
      - /usr/lib/libGL.so.1
      - /usr/lib/libc.so.6
      - /usr/lib/libfontconfig.so.1
      - /usr/lib/libgcc_s.so.1
      - /usr/lib/libgmp.so.10
      - /usr/lib/libhogweed.so.6
      - /usr/lib/libm.so.6
      - /usr/lib/libmvec.so.1
      - /usr/lib/libnettle.so.8
      - /usr/lib/libpipewire-0.3.so.0
      - /usr/lib/libsamplerate.so.0
      - /usr/lib/libstdc++.so.6
      - /usr/lib/libwayland-client.so.0
      - /usr/lib/libwayland-cursor.so.0
      - /usr/lib/libwayland-egl.so.1
      - /usr/lib/libxkbcommon.so.0

  misc:
    files:
    - path: /usr/share/applications/looking-glass-client.desktop
    - path: /usr/share/icons/hicolor/scalable/apps/looking-glass.svg

resolution:
  /usr/lib/libfontconfig.so.1: fontconfig
  /usr/lib/libgcc_s.so.1: gcc
  /usr/lib/libstdc++.so.6: gcc
  /usr/lib/ld-linux-x86-64.so.2: glibc
  /usr/lib/libc.so.6: glibc
  /usr/lib/libm.so.6: glibc
  /usr/lib/libmvec.so.1: glibc
  /usr/lib/libgmp.so.10: gmp
  /usr/lib/libGL.so.1: libglvnd
  /usr/lib/libsamplerate.so.0: libsamplerate
  /usr/lib/libxkbcommon.so.0: libxkbcommon
  /usr/lib/libEGL.so.1: mesa
  /usr/lib/libhogweed.so.6: nettle
  /usr/lib/libnettle.so.8: nettle
  /usr/lib/libpipewire-0.3.so.0: pipewire
  /usr/lib/libwayland-client.so.0: wayland
  /usr/lib/libwayland-cursor.so.0: wayland
  /usr/lib/libwayland-egl.so.1: wayland
