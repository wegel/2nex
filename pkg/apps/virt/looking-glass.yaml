  commit: x86_64/pkg/libs/input/libxkbcommon/1.7.0/bundles/dev
- name: pipewire
  commit: x86_64/pkg/libs/audio/pipewire/1.4.9/bundles/dev
- name: libsamplerate
  commit: x86_64/pkg/libs/audio/libsamplerate/0.2.2/bundles/dev
- name: nettle
  commit: x86_64/pkg/libs/crypto/nettle/3.1/bundles/dev
