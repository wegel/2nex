build:
  environment: 27b6e5dc7ad152c9a17c2cabfcc5ee93daa9bbf0
  profile: [4126:385, 8278:833, 12473:834, 16599:842, 20695:842, 24814:849, 28952:849, 31258:1053]

  script: |
    set -eu

    tar --no-same-owner -xf "/./${SOURCE_virt_manager}" -C "${WORK_DIR}" --strip-components=1
    cd "${WORK_DIR}"

    meson setup build \
      --prefix=/usr \
      --libdir=lib \
      --buildtype=release \
      -Dcompile-schemas=false \
      -Dupdate-icon-cache=false \
      -Ddefault-graphics=vnc \
      -Ddefault-hvs=qemu \
      -Dtests=disabled

    ninja -C build
    DESTDIR="${OUT_DIR}" ninja -C build install

    for wrapper in virt-clone virt-install virt-manager virt-xml; do
      sed -i '1s|^#!/usr/bin/env python3$|#!/usr/bin/python3|' "${OUT_DIR}/usr/bin/${wrapper}"
    done
    /usr/bin/python3 - "${OUT_DIR}/usr/bin"/virt-{clone,install,manager,xml} <<'PY'
    import sys
    from pathlib import Path

    shim = (
        "import os, sys\n"
        "sys.path.insert(0, os.path.join(os.path.dirname(os.path.dirname(os.path.realpath(__file__))), "
        "\"lib\", \"python3.12\", \"site-packages\"))\n"
    )

    for arg in sys.argv[1:]:
        script = Path(arg)
        lines = script.read_text().splitlines()
        lines[1:1] = shim.splitlines()
        script.write_text("\n".join(lines) + "\n")
    PY

    glib-compile-schemas "${OUT_DIR}/usr/share/glib-2.0/schemas"

    find "${OUT_DIR}" -type f -executable -exec strip --strip-unneeded {} \; 2>/dev/null || true
    find "${OUT_DIR}" -exec touch -d "2024-01-01T00:00:00+00:00" {} \;

