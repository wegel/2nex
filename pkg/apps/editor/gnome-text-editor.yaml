build:
  environment: 13ce31fd97c19f5756e4413babf279d543b5a71c
  profile: [4127:794, 8246:840, 16499:932, 24796:951, 33074:1694, 41412:4823, 49686:4832, 62152:4837, 70371:5092, 77411:5173]

  script: |
    tar --no-same-owner -xf /${SOURCE_gnome_text_editor} -C "${WORK_DIR}" --strip-components=1
    cd ${WORK_DIR}

    meson setup build \
      --prefix=/usr \
      --libdir=lib \
      --buildtype=release \
      -Ddevelopment=false \
      -Deditorconfig=disabled \
      -Dbugreport_url=''

    ninja -C build
    DESTDIR="${OUT_DIR}" ninja -C build install

    find "${OUT_DIR}" -exec touch -d "2024-01-01T00:00:00+00:00" {} \;
    2nex_strip_binaries ${OUT_DIR}

