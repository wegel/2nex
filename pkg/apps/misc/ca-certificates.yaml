package:
  schema: 1
  name: CA Certificates
  slug: ca-certificates
  namespace: apps/misc
  version: "20251104"
  description: Certificate Authority certificates for SSL/TLS
  homepage: https://curl.se/docs/caextract.html
  checksum: 32c3b59dbef894bfb95e2991fabeb53b8ed31b4fc5248454cf6a50395e218218

sources:
- name: cacert
  url: https://curl.se/ca/cacert-2025-11-04.pem
  sha256: 8ac40bdd3d3e151a6b4078d2b2029796e8f843e3f86fbf2adbc4dd9f05e79def

dependencies:
- name: bash
  commit: x86_64/pkg/cli/shells/bash/5.2.21/bundles/dev
- name: coreutils
  commit: x86_64/pkg/core/userland/coreutils/9.5/bundles/dev
- name: findutils
  commit: x86_64/pkg/core/userland/findutils/4.9.0/bundles/dev
- name: glibc
  commit: x86_64/pkg/libs/system/glibc/2.39/bundles/dev
- name: ncurses
  commit: x86_64/pkg/libs/system/ncurses/6.4-20230520/bundles/dev
- name: attr
  commit: x86_64/pkg/libs/system/attr/2.5.2/bundles/dev
- name: acl
  commit: x86_64/pkg/libs/system/acl/2.3.2/bundles/dev
- name: openssl
  commit: x86_64/pkg/dev/libs/openssl3/3.3.1/bundles/dev

build:
  environment: 27b6e5dc7ad152c9a17c2cabfcc5ee93daa9bbf0
  profile: [740:596]

  script: |
    # create output directories
    mkdir -p ${OUT_DIR}/etc/ssl/certs

    # install the CA bundle
    cp ${SOURCE_cacert} ${OUT_DIR}/etc/ssl/certs/ca-certificates.crt

    # create hash symlinks for each certificate in the bundle
    # this splits the bundle and creates hash-named symlinks
    cd ${OUT_DIR}/etc/ssl/certs

    # extract individual certs and create hash symlinks
    csplit -z -f cert- -b '%03d.pem' ca-certificates.crt '/-----BEGIN CERTIFICATE-----/' '{*}' 2>/dev/null || true

    for cert in cert-*.pem; do
      if [ -f "$cert" ]; then
        hash=$(openssl x509 -hash -noout -in "$cert" 2>/dev/null) || continue
        # find unused hash.N name
        n=0
        while [ -e "$hash.$n" ]; do n=$((n+1)); done
        ln -sf ca-certificates.crt "$hash.$n"
        rm "$cert"
      fi
    done

    # set consistent timestamps for reproducible builds
    find "${OUT_DIR}" -exec touch -d '2024-01-01T00:00:00+00:00' {} \;

bundles:
  dev:
  - certs

  full:
  - certs

