package:
  schema: 1
  name: CA Certificates
  slug: ca-certificates
  namespace: apps/misc
  version: "20251104"
  description: Certificate Authority certificates for SSL/TLS
  homepage: https://curl.se/docs/caextract.html
  checksum: b36aa5a04f0b4bf1e6fc67b6bd207c5ed1c5f344135ee0e16700478c53dd825e

sources:
- name: cacert
  url: https://curl.se/ca/cacert-2025-11-04.pem
  sha256: 8ac40bdd3d3e151a6b4078d2b2029796e8f843e3f86fbf2adbc4dd9f05e79def
- name: update_ca_certificates
  file: pkg/apps/misc/update-ca-certificates
  sha256: 2319b6db70a7afb27f29da7a5cd2238bef958e5c0b564c21b5a1a01977064ab3
- name: update_ca_certificates_service
  file: pkg/apps/misc/update-ca-certificates.service
  sha256: e7be9ecf5d07358afb3f80925c1fdab6fbc324d8a80f1a588dd3b9e9f7cb3490

dependencies:
- name: bash
  commit: x86_64/pkg/cli/shells/bash/5.2.21/bundles/dev
- name: coreutils
  commit: x86_64/pkg/core/userland/coreutils/9.5/bundles/dev
- name: findutils
  commit: x86_64/pkg/core/userland/findutils/4.9.0/bundles/dev
- name: sed
  commit: x86_64/pkg/cli/text/sed/4.9/bundles/dev
