  commit: x86_64/pkg/libs/system/attr/2.5.2/bundles/dev
- name: acl
  commit: x86_64/pkg/libs/system/acl/2.3.2/bundles/dev
- name: openssl
  commit: x86_64/pkg/dev/libs/openssl3/3.3.1/bundles/dev
- name: p11-kit
  commit: x86_64/pkg/libs/crypto/p11-kit/0.25.5/bundles/runtime

build:
  environment: 27b6e5dc7ad152c9a17c2cabfcc5ee93daa9bbf0
  profile: [110:410]

  script: |
    set -eu

    install -Dm644 "${SOURCE_cacert}" \
      "${OUT_DIR}/usr/share/pki/trust/anchors/ca-certificates.crt"
    install -Dm755 "/${SOURCE_update_ca_certificates}" \
      "${OUT_DIR}/usr/bin/update-ca-certificates"
    install -Dm644 "/${SOURCE_update_ca_certificates_service}" \
      "${OUT_DIR}/usr/lib/systemd/system/update-ca-certificates.service"
    mkdir -p "${OUT_DIR}/usr/lib/systemd/system/sysinit.target.wants"
    ln -s ../update-ca-certificates.service \
      "${OUT_DIR}/usr/lib/systemd/system/sysinit.target.wants/update-ca-certificates.service"

    mkdir -p /usr/share/pki/trust/anchors
    cp "${SOURCE_cacert}" \
      /usr/share/pki/trust/anchors/ca-certificates.crt

    "${OUT_DIR}/usr/bin/update-ca-certificates" \
      --output-dir "${OUT_DIR}/usr/lib/ssl/certs"

    vendor_count=$(sed -n '/BEGIN CERTIFICATE/p' "${SOURCE_cacert}" | wc -l)
    extracted_count=$(sed -n '/BEGIN CERTIFICATE/p' \
      "${OUT_DIR}/usr/lib/ssl/certs/ca-certificates.crt" | wc -l)
    test "${vendor_count}" -eq "${extracted_count}"
    test "$(find "${OUT_DIR}/usr/lib/ssl/certs" -type l | wc -l)" -gt 0

    mkdir -p /etc/pki/trust/anchors /run/pki/trust/anchors
    openssl req -x509 -newkey rsa:2048 -nodes -days 1 \
      -subj /CN=EP012-admin-anchor \
      -keyout "${WORK_DIR}/admin.key" \
      -out /etc/pki/trust/anchors/admin.pem >/dev/null 2>&1
    openssl req -x509 -newkey rsa:2048 -nodes -days 1 \
      -subj /CN=EP012-transient-anchor \
      -keyout "${WORK_DIR}/transient.key" \
      -out /run/pki/trust/anchors/transient.pem >/dev/null 2>&1
    "${OUT_DIR}/usr/bin/update-ca-certificates" \
      --output-dir "${WORK_DIR}/layered-certs"
    layered_count=$(sed -n '/BEGIN CERTIFICATE/p' \
      "${WORK_DIR}/layered-certs/ca-certificates.crt" | wc -l)
    test "${layered_count}" -eq "$((vendor_count + 2))"
    openssl verify \
      -CAfile "${WORK_DIR}/layered-certs/ca-certificates.crt" \
      /etc/pki/trust/anchors/admin.pem \
      /run/pki/trust/anchors/transient.pem

    csplit -s -n 3 -f "${WORK_DIR}/vendor-" "${SOURCE_cacert}" \
      '/-----BEGIN CERTIFICATE-----/' '{*}'
    mkdir -p /etc/pki/trust/blocklist
    cp "${WORK_DIR}/vendor-001" /etc/pki/trust/blocklist/vendor.pem
    "${OUT_DIR}/usr/bin/update-ca-certificates" \
      --output-dir "${WORK_DIR}/masked-certs"
    masked_count=$(sed -n '/BEGIN CERTIFICATE/p' \
      "${WORK_DIR}/masked-certs/ca-certificates.crt" | wc -l)
    test "${masked_count}" -eq "$((vendor_count + 1))"

    chmod u+w \
      "${WORK_DIR}/layered-certs" \
      "${WORK_DIR}/masked-certs"
    rm -rf \
      "${WORK_DIR}/layered-certs" \
      "${WORK_DIR}/masked-certs"
    rm -f \
      "${WORK_DIR}/admin.key" \
      "${WORK_DIR}/transient.key" \
      "${WORK_DIR}"/vendor-* \
      /etc/pki/trust/anchors/admin.pem \
      /etc/pki/trust/blocklist/vendor.pem \
      /run/pki/trust/anchors/transient.pem \
      /usr/share/pki/trust/anchors/ca-certificates.crt
    rmdir \
      /etc/pki/trust/anchors \
      /etc/pki/trust/blocklist \
      /etc/pki/trust \
      /etc/pki \
      /run/pki/trust/anchors \
      /run/pki/trust \
      /run/pki \
      /usr/share/pki/trust/anchors \
      /usr/share/pki/trust \
      /usr/share/pki

    find "${OUT_DIR}" -exec touch -d '2024-01-01T00:00:00+00:00' {} \;

