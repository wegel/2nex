build:
  environment: 27b6e5dc7ad152c9a17c2cabfcc5ee93daa9bbf0
  profile: [4096:1355, 8226:2158, 12361:2426, 16502:3059, 20659:3063, 24755:3067, 28883:3070, 32992:3074, 37184:3078, 40571:3262]

  script: |
    set -eu

    CFLAGS=${CFLAGS/-flto=auto/}
    CXXFLAGS=${CXXFLAGS/-flto=auto/}
    LDFLAGS=${LDFLAGS/-flto=auto/}

    tar --no-same-owner -xzf /${SOURCE_remmina} -C "${WORK_DIR}" --strip-components=1
    cd "${WORK_DIR}"

    cmake -S . -B build -G Ninja \
      -DCMAKE_BUILD_TYPE=Release \
      -DCMAKE_INSTALL_PREFIX=/usr \
      -DCMAKE_INSTALL_LIBDIR=lib \
      -DBUILD_SHARED_LIBS=ON \
      -DWITH_FREERDP3=ON \
      -DWITH_LIBVNCSERVER=ON \
      -DWITH_LIBSECRET=ON \
      -DWITH_CUPS=OFF \
      -DWITH_LIBSSH=OFF \
      -DWITH_GCRYPT=OFF \
      -DWITH_AVAHI=OFF \
      -DWITH_VTE=OFF \
      -DHAVE_LIBAPPINDICATOR=OFF \
      -DWITH_WWW=OFF \
      -DWITH_WEBKIT2GTK=OFF \
      -DWITH_PYTHONLIBS=OFF \
      -DWITH_SPICE=OFF \
      -DWITH_GVNC=OFF \
      -DWITH_X2GO=OFF \
      -DWITH_KF5WALLET=OFF \
      -DWITH_ST=OFF \
      -DWITH_XDMCP=OFF \
      -DWITH_NX=OFF \
      -DWITH_NEWS=OFF \
      -DWITH_STATS=OFF \
      -DWITH_TIP=OFF \
      -DWITH_MANPAGES=OFF \
      -DWITH_TRANSLATIONS=OFF \
      -DWITH_ICON_CACHE=OFF \
      -DWITH_UPDATE_DESKTOP_DB=OFF \
      -DWITH_KIOSK_SESSION=OFF

    cmake --build build
    DESTDIR="${OUT_DIR}" cmake --install build

    find "${OUT_DIR}/usr/bin" "${OUT_DIR}/usr/share/remmina/external_tools" \
      -type f -exec sed -i '1s|^#!/bin/sh$|#!/usr/bin/sh|' {} \;
    find "${OUT_DIR}" -type f -executable -exec strip --strip-unneeded {} \; 2>/dev/null || true
    find "${OUT_DIR}" -name '*.a' -exec objcopy --enable-deterministic-archives {} \; 2>/dev/null || true
    find "${OUT_DIR}" -exec touch -d "2024-01-01T00:00:00+00:00" {} \;

