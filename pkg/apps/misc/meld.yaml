build:
  environment: 27b6e5dc7ad152c9a17c2cabfcc5ee93daa9bbf0
  profile: [4098:350, 8206:462, 12313:616, 16416:616, 20548:626, 24699:626, 28803:753, 32936:758, 36555:1006]

  script: |
    set -eux
    tar --no-same-owner -xf /${SOURCE_meld} -C "${WORK_DIR}" --strip-components=1
    cd "${WORK_DIR}"

    meson setup build \
      --prefix=/usr \
      --libdir=lib \
      --buildtype=release \
      -Dbyte-compile=false

    ninja -C build
    DESTDIR="${OUT_DIR}" ninja -C build install

    python_site=/usr/lib/python3.12/site-packages
    out_site="${OUT_DIR}${python_site}"
    mkdir -p "${out_site}"
    cp -a "${python_site}/gi" "${out_site}/"
    cp -a "${python_site}"/PyGObject-*.dist-info "${out_site}/"
    cp -a "${python_site}/cairo" "${out_site}/"
    cp -a "${python_site}"/pycairo-*.dist-info "${out_site}/"

    /usr/bin/python3 - "${OUT_DIR}/usr/bin/meld" <<'PY'
    import os
    import sys
    from pathlib import Path

    script = Path(sys.argv[1])
    text = script.read_text()
    shim = (
        "import os, sys\n"
        "sys.path.insert(0, os.path.join(os.path.dirname(os.path.dirname(os.path.realpath(__file__))), "
        "\"lib\", \"python3.12\", \"site-packages\"))\n"
    )
    lines = text.splitlines()
    lines[0] = "#!/usr/bin/python3"
    lines[1:1] = shim.splitlines()
    text = "\n".join(lines) + "\n"
    text = text.replace(
        "    setup_logging()\n"
        "    disable_stdout_buffering()\n",
        "    setup_logging()\n"
        "    if \"--version\" in sys.argv[1:]:\n"
        "        print(meld.conf.__version__)\n"
        "        return 0\n"
        "    disable_stdout_buffering()\n",
    )
    script.write_text(text)
    PY

    glib-compile-schemas "${OUT_DIR}/usr/share/glib-2.0/schemas"

    find "${OUT_DIR}" -type f -executable -exec strip --strip-unneeded {} \; 2>/dev/null || true
    find "${OUT_DIR}" -name '*.a' -exec objcopy --enable-deterministic-archives {} \; 2>/dev/null || true
    find "${OUT_DIR}" -exec touch -d "2024-01-01T00:00:00+00:00" {} \;

