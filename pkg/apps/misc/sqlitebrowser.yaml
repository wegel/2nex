build:
  environment: 27b6e5dc7ad152c9a17c2cabfcc5ee93daa9bbf0
  profile: [4111:8114, 12503:11180, 20774:15050, 37347:15213, 45709:15213, 58210:17287, 70648:39854, 87150:47262, 103870:51769, 111275:52175]

  script: |
    set -eu

    CFLAGS=${CFLAGS/-flto=auto/}
    CXXFLAGS=${CXXFLAGS/-flto=auto/}
    LDFLAGS=${LDFLAGS/-flto=auto/}

    tar --no-same-owner -xf "${SOURCE_sqlitebrowser}" -C "${WORK_DIR}" --strip-components=1
    cd "${WORK_DIR}"

    sed -i \
      -e 's/ LinguistTools//' \
      -e 's/include(config\/translations.cmake)/# translations disabled; qt6-base does not ship Qt Linguist tools/' \
      -e '/src\/translations\/translations.qrc/d' \
      CMakeLists.txt

    cmake -S . -B build -G Ninja \
      -DCMAKE_BUILD_TYPE=Release \
      -DCMAKE_INSTALL_PREFIX=/usr \
      -DCMAKE_INSTALL_LIBDIR=lib \
      -DCMAKE_INSTALL_DATADIR=share \
      -DQT_MAJOR=Qt6 \
      -DBUILD_STABLE_VERSION=ON \
      -DFORCE_INTERNAL_QSCINTILLA=ON \
      -DFORCE_INTERNAL_QCUSTOMPLOT=ON \
      -DFORCE_INTERNAL_QHEXEDIT=ON \
      -DENABLE_TESTING=OFF \
      -Dsqlcipher=OFF

    cmake --build build
    DESTDIR="${OUT_DIR}" cmake --install build

    mkdir -p \
      "${OUT_DIR}/usr/libexec/sqlitebrowser" \
      "${OUT_DIR}/usr/lib/qt6/plugins/platforms"
    mv "${OUT_DIR}/usr/bin/sqlitebrowser" \
      "${OUT_DIR}/usr/libexec/sqlitebrowser/sqlitebrowser"
    cp -a \
      /usr/lib/qt6/plugins/platforms/libqminimal.so \
      /usr/lib/qt6/plugins/platforms/libqoffscreen.so \
      "${OUT_DIR}/usr/lib/qt6/plugins/platforms/"
    cat > "${OUT_DIR}/usr/bin/sqlitebrowser" <<'EOF'
    #!/usr/bin/bash
    script=$0
    if target=$(/usr/bin/readlink "$script"); then
      case "$target" in
        /*) script=$target ;;
      esac
    fi
    root=${script%/usr/bin/sqlitebrowser}
    if [ "$root" = "$script" ]; then
      root=
    fi

    export QT_PLUGIN_PATH="${root}/usr/lib/qt6/plugins${QT_PLUGIN_PATH:+:${QT_PLUGIN_PATH}}"
    if [ "${QT_QPA_PLATFORM:-}" = wayland ] && [ ! -e "${root}/usr/lib/qt6/plugins/platforms/libqwayland-generic.so" ]; then
      export QT_QPA_PLATFORM=minimal
    fi

    exec "${root}/usr/libexec/sqlitebrowser/sqlitebrowser" "$@"
    EOF
    chmod 755 "${OUT_DIR}/usr/bin/sqlitebrowser"

    find "${OUT_DIR}" -type f -executable -exec strip --strip-unneeded {} \; 2>/dev/null || true
    find "${OUT_DIR}" -name '*.a' -exec objcopy --enable-deterministic-archives {} \; 2>/dev/null || true
    find "${OUT_DIR}" -exec touch -d "2024-01-01T00:00:00+00:00" {} \;

