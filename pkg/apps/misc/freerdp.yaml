build:
  environment: 27b6e5dc7ad152c9a17c2cabfcc5ee93daa9bbf0
  profile: [12308:165900, 41414:219813, 90968:259743, 152967:274760, 202604:279251, 252286:281791, 305949:286705, 380374:295530, 454986:304680, 504274:468949]

  script: |
    set -eu

    CFLAGS=${CFLAGS/-flto=auto/}
    CXXFLAGS=${CXXFLAGS/-flto=auto/}
    LDFLAGS=${LDFLAGS/-flto=auto/}

    tar --no-same-owner -xzf /${SOURCE0} -C "${WORK_DIR}" --strip-components=1
    cd "${WORK_DIR}"

    cmake -S . -B build -G Ninja \
      -DCMAKE_BUILD_TYPE=Release \
      -DCMAKE_INSTALL_PREFIX=/usr \
      -DCMAKE_INSTALL_LIBDIR=lib \
      -DBUILD_SHARED_LIBS=ON \
      -DBUILD_TESTING=OFF \
      -DBUILD_TESTING_INTERNAL=OFF \
      -DBUILD_BENCHMARK=OFF \
      -DWITH_CLANG_FORMAT=OFF \
      -DWITH_INTERNAL_MD4=ON \
      -DWITH_UNICODE_BUILTIN=ON \
      -DWITH_MANPAGES=OFF \
      -DWITH_SAMPLE=OFF \
      -DWITH_CLIENT_COMMON=ON \
      -DWITH_CLIENT=ON \
      -DWITH_CLIENT_SDL=OFF \
      -DWITH_CLIENT_INTERFACE=OFF \
      -DWITH_SERVER=OFF \
      -DWITH_SERVER_INTERFACE=OFF \
      -DWITH_CHANNELS=ON \
      -DWITH_CLIENT_CHANNELS=ON \
      -DCHANNEL_URBDRC=OFF \
      -DWITH_X11=OFF \
      -DWITH_XINERAMA=OFF \
      -DWITH_XEXT=OFF \
      -DWITH_XCURSOR=OFF \
      -DWITH_XV=OFF \
      -DWITH_XI=OFF \
      -DWITH_XRENDER=OFF \
      -DWITH_XRANDR=OFF \
      -DWITH_XFIXES=OFF \
      -DWITH_WAYLAND=ON \
      -DWITH_ALSA=OFF \
      -DWITH_PULSE=OFF \
      -DWITH_OSS=OFF \
      -DWITH_FFMPEG=OFF \
      -DWITH_DSP_FFMPEG=OFF \
      -DWITH_VIDEO_FFMPEG=OFF \
      -DWITH_OPENH264=OFF \
      -DWITH_SWSCALE=OFF \
      -DWITH_CAIRO=OFF \
      -DWITH_CUPS=OFF \
      -DWITH_FUSE=OFF \
      -DWITH_KRB5=OFF \
      -DWITH_SMARTCARD_PCSC=OFF \
      -DWITH_SMARTCARD_INSPECT=OFF \
      -DWITH_URIPARSER=OFF \
      -DWITH_JSON_DISABLED=ON

    cmake --build build
    DESTDIR="${OUT_DIR}" cmake --install build

    find "${OUT_DIR}" -type f -executable -exec strip --strip-unneeded {} \; 2>/dev/null || true
    find "${OUT_DIR}" -name '*.a' -exec objcopy --enable-deterministic-archives {} \; 2>/dev/null || true
    find "${OUT_DIR}" -exec touch -d "2024-01-01T00:00:00+00:00" {} \;

