build:
  environment: 27b6e5dc7ad152c9a17c2cabfcc5ee93daa9bbf0
  profile: [4126:3602, 8277:5386, 12391:6391, 16519:7712, 20670:8464, 24789:8912, 28895:20265, 33041:20446, 41245:21476, 42178:21535]

  script: |
    tar --no-same-owner -xf /${SOURCE_nautilus} -C "${WORK_DIR}" --strip-components=1
    cd ${WORK_DIR}

    mkdir -p /usr/local/include

    meson setup build \
      --prefix=/usr \
      --libdir=lib \
      --buildtype=release \
      -Dcloudproviders=false \
      -Dtests=none \
      -Ddocs=false \
      -Dintrospection=false \
      -Dextensions=false \
      -Dpackagekit=false

    ninja -C build
    DESTDIR="${OUT_DIR}" ninja -C build install

    find "${OUT_DIR}" -exec touch -d "2024-01-01T00:00:00+00:00" {} \;
    find ${OUT_DIR} -type f -executable -exec strip --strip-unneeded {} \; 2>/dev/null || true
    find ${OUT_DIR} -name '*.a' -exec objcopy --enable-deterministic-archives {} \; 2>/dev/null || true

