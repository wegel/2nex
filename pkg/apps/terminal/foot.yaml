  commit: x86_64/pkg/cli/text/sed/4.9/bundles/dev

build:
  environment: 27b6e5dc7ad152c9a17c2cabfcc5ee93daa9bbf0
  profile: [4145:620, 8263:697, 12403:901, 16548:5661, 16868:5663]

  script: |
    tar --no-same-owner -xzf /${SOURCE_foot} -C "${WORK_DIR}" --strip-components=1
    cd ${WORK_DIR}

    meson setup build \
      --prefix=/usr \
      --libdir=lib \
      --buildtype=release \
      -Ddocs=disabled \
      -Dthemes=false \
      -Dterminfo=disabled

    ninja -C build
    DESTDIR="${OUT_DIR}" ninja -C build install

    strip --strip-unneeded ${OUT_DIR}/usr/bin/foot ${OUT_DIR}/usr/bin/footclient

    find "${OUT_DIR}" -exec touch -d "2024-01-01T00:00:00+00:00" {} \;

bundles:
  dev:
  - bin
  - conf
  - misc

outputs:
  bin:
    files:
    - path: /usr/bin/foot
      needs:
      - /usr/lib/ld-linux-x86-64.so.2
      - /usr/lib/libc.so.6
      - /usr/lib/libfcft.so.4
      - /usr/lib/libfontconfig.so.1
      - /usr/lib/libm.so.6
      - /usr/lib/libpixman-1.so.0
      - /usr/lib/libutf8proc.so.3
      - /usr/lib/libwayland-client.so.0
      - /usr/lib/libwayland-cursor.so.0
      - /usr/lib/libxkbcommon.so.0
    - path: /usr/bin/footclient
      needs:
      - /usr/lib/ld-linux-x86-64.so.2
      - /usr/lib/libc.so.6

  conf:
    files:
    - path: /etc/xdg/foot/foot.ini

  misc:
    files:
    - path: /usr/share/applications/foot-server.desktop
    - path: /usr/share/applications/foot.desktop
    - path: /usr/share/applications/footclient.desktop
    - path: /usr/share/bash-completion/completions/foot
    - path: /usr/share/bash-completion/completions/footclient
    - path: /usr/share/fish/vendor_completions.d/foot.fish
    - path: /usr/share/fish/vendor_completions.d/footclient.fish
    - path: /usr/share/icons/hicolor/48x48/apps/foot.png
    - path: /usr/share/icons/hicolor/scalable/apps/foot.svg
    - path: /usr/share/zsh/site-functions/_foot
    - path: /usr/share/zsh/site-functions/_footclient

resolution:
  /usr/lib/libfcft.so.4: fcft
  /usr/lib/libfontconfig.so.1: fontconfig
  /usr/lib/ld-linux-x86-64.so.2: glibc
  /usr/lib/libc.so.6: glibc
  /usr/lib/libm.so.6: glibc
  /usr/lib/libutf8proc.so.3: libutf8proc
  /usr/lib/libxkbcommon.so.0: libxkbcommon
  /usr/lib/libpixman-1.so.0: pixman
  /usr/lib/libwayland-client.so.0: wayland
  /usr/lib/libwayland-cursor.so.0: wayland
