package:
  schema: 1
  name: Distrobox
  slug: distrobox
  namespace: apps/containers
  version: 1.8.2.5
  description: Use OCI containers as integrated development environments
  homepage: https://distrobox.it/
  checksum: 4666f493d2b526b6f24e97f6386fa098dc2035ebf0d35c9cd6c68bab868b1f21

sources:
- name: distrobox
  url: https://github.com/89luca89/distrobox/archive/refs/tags/1.8.2.5.tar.gz
  sha256: 0c3bc4785ee3be3b89f93abb7cc0a9f60e56989e81319af140a4b60403b18f80

dependencies:
- name: bash
  commit: x86_64/pkg/cli/shells/bash/5.2.21/bundles/dev
- name: coreutils
  commit: x86_64/pkg/core/userland/coreutils/9.5/bundles/dev
- name: findutils
  commit: x86_64/pkg/core/userland/findutils/4.9.0/bundles/dev
- name: tar
  commit: x86_64/pkg/cli/archive/tar/1.35/bundles/dev
- name: gzip
  commit: x86_64/pkg/cli/archive/gzip/1.13/bundles/dev
- name: grep
  commit: x86_64/pkg/cli/text/grep/3.11/bundles/dev
- name: sed
  commit: x86_64/pkg/cli/text/sed/4.9/bundles/dev
- name: gawk
  commit: x86_64/pkg/cli/text/gawk/5.3.0/bundles/dev
- name: glibc
  commit: x86_64/pkg/libs/system/glibc/2.39/bundles/dev
- name: podman
  commit: x86_64/pkg/apps/containers/podman/5.4.1/bundles/full

build:
  environment: 27b6e5dc7ad152c9a17c2cabfcc5ee93daa9bbf0
  profile: [289:130]

  script: |
    set -eu

    tar --no-same-owner -xf "/./${SOURCE_distrobox}" -C "${WORK_DIR}" --strip-components=1
    cd "${WORK_DIR}"

    find . -maxdepth 1 -type f -name 'distrobox*' -exec sed -i '1s|^#!/bin/sh$|#!/usr/bin/sh|' {} \;
    sed -i '1s|^#!/bin/sh$|#!/usr/bin/sh|' install uninstall

    sh ./install --prefix "${OUT_DIR}/usr" --no-color

    find "${OUT_DIR}" -exec touch -d "2024-01-01T00:00:00+00:00" {} \;

bundles:
  dev:
  - bin
  - completions
  - man

  full:
  - bin
  - completions
  - icons
  - man

