package:
  schema: 1
  name: Conmon
  slug: conmon
  namespace: apps/containers
  version: 2.1.8
  description: A container monitor for podman and other OCI container runtimes
  homepage: https://github.com/containers/conmon
  checksum: 12104935af7b22c21f797cbc84728e89b40b45adfdbabdab0b9588c6aa1b50fb

sources:
- name: conmon
  url: https://github.com/containers/conmon/archive/refs/tags/v2.1.8.tar.gz
  sha256: e72c090210a03ca3b43a0fad53f15bca90bbee65105c412468009cf3a5988325
- name: seccomp_patch
  url: https://raw.githubusercontent.com/buildroot/buildroot/master/package/conmon/0001-src-seccomp_notify.c-fix-static-build.patch
  sha256: 6e09ee2abf5f9dbb4f45f9240ed37469997f053c27968ad7dab00f881eef0fe7

dependencies:
- name: bash
  commit: x86_64/pkg/cli/shells/bash/5.2.21/bundles/dev
- name: coreutils
  commit: x86_64/pkg/core/userland/coreutils/9.5/bundles/dev
- name: findutils
  commit: x86_64/pkg/core/userland/findutils/4.9.0/bundles/dev
- name: phase3
  commit: x86_64/pkg/bootstrap/phase3/2nex-utilities-bootstrap/0.0.1/bundles/dev
- name: gzip
  commit: x86_64/pkg/cli/archive/gzip/1.13/bundles/dev
- name: make
  commit: x86_64/pkg/core/toolchain/make/4.4.1/bundles/dev
- name: tar
  commit: x86_64/pkg/cli/archive/tar/1.35/bundles/dev
- name: binutils
  commit: x86_64/pkg/bootstrap/phase3/binutils/2.42/bundles/dev
- name: glibc
  commit: x86_64/pkg/libs/system/glibc/2.39/bundles/dev
- name: gcc
  commit: x86_64/pkg/core/toolchain/gcc/13.2.0/bundles/dev
- name: ncurses
  commit: x86_64/pkg/libs/system/ncurses/6.4-20230520/bundles/dev
- name: inetutils
  commit: x86_64/pkg/net/misc/inetutils/2.5/bundles/dev
- name: attr
  commit: x86_64/pkg/libs/system/attr/2.5.2/bundles/dev
- name: acl
  commit: x86_64/pkg/libs/system/acl/2.3.2/bundles/dev
- name: mpc
  commit: x86_64/pkg/bootstrap/phase3/mpc/1.2.1/bundles/dev
- name: mpfr
  commit: x86_64/pkg/bootstrap/phase3/mpfr/4.2.1/bundles/dev
- name: gmp
  commit: x86_64/pkg/libs/system/gmp/6.3.0/bundles/dev
- name: zlib
  commit: x86_64/pkg/libs/system/zlib/1.3.1/bundles/dev
- name: linux-headers
  commit: x86_64/pkg/bootstrap/phase3/linux-headers/6.4.1/bundles/dev
- name: glib2
  commit: x86_64/pkg/dev/libs/glib2/2.84.0/bundles/dev
- name: libseccomp
  commit: x86_64/pkg/dev/libs/libseccomp/2.5.6/bundles/dev
- name: patch
  commit: x86_64/pkg/core/toolchain/patch/2.7.6/bundles/dev
- name: pkgconf
  commit: x86_64/pkg/bootstrap/phase3/pkgconf/2.2.0/bundles/dev
- name: pcre2
  commit: x86_64/pkg/dev/libs/pcre2/10.44/bundles/dev

build:
  environment: 13ce31fd97c19f5756e4413babf279d543b5a71c
  profile: [4338:58, 7825:578]

  script: |
    tar --no-same-owner -xf ${SOURCE_conmon} -C "${WORK_DIR}" --strip-components=1
    cd ${WORK_DIR}

    # Apply the seccomp patch
    patch -Np1 -i "/./${SOURCE_seccomp_patch}"

    # Create seccomp-notify script
    printf '#!/bin/bash\necho "0"\n' > hack/seccomp-notify.sh
    chmod +x hack/seccomp-notify.sh

    # Build using gcc explicitly with proper include paths for glib
    make CC=gcc CFLAGS="-std=c99 ${CFLAGS} -I/usr/lib/glib-2.0/include" LDFLAGS="${LDFLAGS}"

    # Install
    mkdir -p ${OUT_DIR}/usr/bin
    install -D -m 755 bin/conmon ${OUT_DIR}/usr/bin/conmon

    # Set consistent timestamps for reproducible builds
    find "${OUT_DIR}" -exec touch -d '2024-01-01T00:00:00+00:00' {} \;
    2nex_strip_binaries ${OUT_DIR}

bundles:
  dev:
  - bin

  full:
  - bin

outputs:
  bin:
    files:
    - path: /usr/bin/conmon
      needs:
      - /usr/lib/ld-linux-x86-64.so.2
      - /usr/lib/libc.so.6
      - /usr/lib/libgcc_s.so.1
      - /usr/lib/libglib-2.0.so.0

resolution:
  /usr/lib/libgcc_s.so.1: gcc
  /usr/lib/libglib-2.0.so.0: glib2
  /usr/lib/ld-linux-x86-64.so.2: glibc
  /usr/lib/libc.so.6: glibc
