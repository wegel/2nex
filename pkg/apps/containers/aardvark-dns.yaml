package:
  schema: 1
  name: Aardvark DNS
  slug: aardvark-dns
  namespace: apps/containers
  version: 1.14.0
  description: A container DNS server for Netavark
  homepage: https://github.com/containers/aardvark-dns
  checksum: 1964dc6957435d4e066cf43714136135286d1bb74a1f6a619957e5386259ec42
sources:
- name: aardvark_dns
  url: https://github.com/containers/aardvark-dns/archive/refs/tags/v1.14.0.tar.gz
  filename: aardvark-dns-v1.14.0.tar.gz
  sha256: d46f170e0439fc97e15bb31d63b7464192f74809b0d54064383e6a0b592d8cfd
- name: aardvark_dns_vendor
  url: https://github.com/containers/aardvark-dns/releases/download/v1.14.0/aardvark-dns-v1.14.0-vendor.tar.gz
  sha256: 0de36c3b39d8babc81267148c652f3aed46e4d4306a4584b02814faa5b5628d0
dependencies:
- name: bash
  commit: x86_64/pkg/cli/shells/bash/5.2.21/bundles/dev
- name: coreutils
  commit: x86_64/pkg/core/userland/coreutils/9.5/bundles/dev
- name: findutils
  commit: x86_64/pkg/core/userland/findutils/4.9.0/bundles/dev
- name: phase3
  commit: x86_64/pkg/bootstrap/phase3/2nex-utilities-bootstrap/0.0.1/bundles/dev
- name: gzip
  commit: x86_64/pkg/cli/archive/gzip/1.13/bundles/dev
- name: tar
  commit: x86_64/pkg/cli/archive/tar/1.35/bundles/dev
- name: binutils
  commit: x86_64/pkg/bootstrap/phase3/binutils/2.42/bundles/dev
- name: glibc
  commit: x86_64/pkg/libs/system/glibc/2.39/bundles/dev
- name: gcc
  commit: x86_64/pkg/bootstrap/phase3/gcc/13.2.0/bundles/dev
- name: ncurses
  commit: x86_64/pkg/libs/system/ncurses/6.4-20230520/bundles/dev
- name: inetutils
  commit: x86_64/pkg/net/misc/inetutils/2.5/bundles/dev
- name: attr
  commit: x86_64/pkg/libs/system/attr/2.5.2/bundles/dev
- name: acl
  commit: x86_64/pkg/libs/system/acl/2.3.2/bundles/dev
- name: mpc
  commit: x86_64/pkg/bootstrap/phase3/mpc/1.2.1/bundles/dev
- name: mpfr
  commit: x86_64/pkg/bootstrap/phase3/mpfr/4.2.1/bundles/dev
- name: gmp
  commit: x86_64/pkg/libs/system/gmp/6.3.0/bundles/dev
- name: zlib
  commit: x86_64/pkg/bootstrap/phase3/zlib/1.3.1/bundles/dev
- name: rust-bin
  commit: x86_64/pkg/dev/lang/rust-bin/1.76.0/bundles/dev
build:
  script: "# Extract the aardvark-dns source code - this will create a directory like\
    \ aardvark-dns-1.14.0\ntar --no-same-owner -xf ${SOURCE_aardvark_dns} -C \"${WORK_DIR}\"\
    \ --strip-components=1\ncd ${WORK_DIR}\n# Extract the vendor tarball directly\n\
    tar --no-same-owner -xf /./${SOURCE_aardvark_dns_vendor} -C \"${WORK_DIR}\"\n\n\
    # Set up Rust environment\nexport CARGO_HOME=\"${WORK_DIR}/.cargo\"\nexport RUSTUP_HOME=\"\
    ${WORK_DIR}/.rustup\"\n\n# Create symlinks for compiler and linker in a system\
    \ location \nmkdir -p /usr/local/bin\nln -sf /usr/bin/gcc /usr/local/bin/cc\n\
    ln -sf /usr/bin/ld.bfd /usr/local/bin/ld\nexport PATH=\"/usr/local/bin:${PATH}\"\
    \n\n# Override default RUSTFLAGS to not use lld\nexport RUSTFLAGS=\"-C codegen-units=1\
    \ -C embed-bitcode=yes -C debuginfo=0 -C target-feature=+crt-static -C link-args=-frandom-seed=424242\"\
    \n\n# Create .cargo/config to use the vendor directory\nmkdir -p \"${CARGO_HOME}\"\
    \ncat > \"${CARGO_HOME}/config.toml\" << EOF\n[source.crates-io]\nreplace-with\
    \ = \"vendored-sources\"\n\n[source.vendored-sources]\ndirectory = \"vendor\"\n\
    EOF\n\n# Build with specific target to avoid proc-macro issues\ncargo build --release\
    \ --offline --target x86_64-unknown-linux-gnu\n\n# Install\nmkdir -p ${OUT_DIR}/usr/bin\n\
    install -D -m 755 target/x86_64-unknown-linux-gnu/release/aardvark-dns ${OUT_DIR}/usr/bin/aardvark-dns\n\
    \n# Create directory for podman\nmkdir -p ${OUT_DIR}/usr/libexec/podman\nln -sf\
    \ ../../bin/aardvark-dns ${OUT_DIR}/usr/libexec/podman/aardvark-dns\n\n# Set consistent\
    \ timestamps for reproducible builds\nfind \"${OUT_DIR}\" -exec touch -d '2024-01-01T00:00:00+00:00'\
    \ {} \\;\n2nex_strip_binaries ${OUT_DIR}\n"
bundles:
  full:
  - bin
  dev:
  - bin
outputs:
  bin:
    files:
    - path: /usr/bin/aardvark-dns
    - path: /usr/libexec/podman/aardvark-dns
