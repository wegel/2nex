package:
  schema: 1
  name: Podman
  slug: podman
  namespace: apps/containers
  version: 5.4.1
  description: A tool for managing OCI containers and pods
  homepage: https://podman.io/
  checksum: b1d375e32a710228060728bd6ba512d065a84c52017d401511313d34cbb24ed8

sources:
- name: podman
  url: https://github.com/containers/podman/archive/refs/tags/v5.4.1.tar.gz
  sha256: 502117195c06678db612313aaf42505cabeea860f8668802a0608754eb0df9f6
- name: policy_json
  url: https://raw.githubusercontent.com/buildroot/buildroot/ebbaac08e3f462bf023c12077f739ed1c0543eb2/package/podman/policy.json
  sha256: dcb3a91795cecb9021141bc565d30a64ebfe754934390ceff6ad2920507010b3
- name: registries_conf
  url: https://raw.githubusercontent.com/buildroot/buildroot/ebbaac08e3f462bf023c12077f739ed1c0543eb2/package/podman/registries.conf
  sha256: ec865a599049720379ebd5b1bcc5a7ad31a341fe624f1e42ac6f98a5b5d0575e

dependencies:
- name: bash
  commit: x86_64/pkg/cli/shells/bash/5.2.21/bundles/dev
- name: coreutils
  commit: x86_64/pkg/core/userland/coreutils/9.5/bundles/dev
- name: findutils
  commit: x86_64/pkg/core/userland/findutils/4.9.0/bundles/dev
- name: libcap
  commit: x86_64/pkg/libs/security/libcap/2.69/bundles/dev
- name: gzip
  commit: x86_64/pkg/cli/archive/gzip/1.13/bundles/dev
- name: make
  commit: x86_64/pkg/core/toolchain/make/4.4.1/bundles/dev
- name: tar
  commit: x86_64/pkg/cli/archive/tar/1.35/bundles/dev
- name: binutils
  commit: x86_64/pkg/core/toolchain/binutils/2.42/bundles/dev
- name: glibc
  commit: x86_64/pkg/libs/system/glibc/2.39/bundles/dev
- name: gcc
  commit: x86_64/pkg/core/toolchain/gcc/13.2.0/bundles/dev
- name: pkgconf
  commit: x86_64/pkg/core/toolchain/pkgconf/2.2.0/bundles/dev
- name: go
  commit: x86_64/pkg/dev/lang/go/1.23.8/bundles/dev
- name: libgpgme
  commit: x86_64/pkg/dev/libs/libgpgme/1.23.2/bundles/dev
- name: libseccomp
  commit: x86_64/pkg/dev/libs/libseccomp/2.5.6/bundles/dev
- name: shadow
  commit: x86_64/pkg/core/userland/shadow/4.15.1/bundles/dev
- name: btrfs-progs
  commit: x86_64/pkg/core/fs/btrfs-progs/6.10/bundles/dev
- name: linux-headers
  commit: x86_64/pkg/libs/system/linux-headers/6.4.1/bundles/dev
- name: ncurses
  commit: x86_64/pkg/libs/system/ncurses/6.4-20230520/bundles/dev
- name: inetutils
  commit: x86_64/pkg/net/misc/inetutils/2.5/bundles/dev
- name: attr
  commit: x86_64/pkg/libs/system/attr/2.5.2/bundles/dev
- name: acl
  commit: x86_64/pkg/libs/system/acl/2.3.2/bundles/dev
- name: libgpg-error
  commit: x86_64/pkg/dev/libs/libgpg-error/1.51/bundles/dev
- name: libassuan
  commit: x86_64/pkg/dev/libs/libassuan/2.5.7/bundles/dev
- name: libxcrypt
  commit: x86_64/pkg/libs/system/libxcrypt/4.4.36/bundles/dev
- name: gmp
  commit: x86_64/pkg/libs/system/gmp/6.3.0/bundles/dev
- name: zlib
  commit: x86_64/pkg/libs/system/zlib/1.3.1/bundles/dev

build:
  environment: 27b6e5dc7ad152c9a17c2cabfcc5ee93daa9bbf0
  profile: [1978:318829]

  script: |
    tar --no-same-owner -xf /./${SOURCE_podman} -C "${WORK_DIR}" --strip-components=1
    cd ${WORK_DIR}

    # Set up Go environment
    export GOROOT="/usr/lib/go"
    export GOPATH="${WORK_DIR}/gopath"
    export PATH="/usr/bin:/usr/lib/go/bin:${PATH}"
    export CGO_ENABLED=1
    export GO111MODULE=on
    export GOFLAGS="-tags=exclude_graphdriver_devicemapper,seccomp,libsubid -ldflags=-compressdwarf=false"

    # Set up proxy to disable external downloads
    export GOPROXY=off
    export GOSUMDB=off

    # Create symlinks for compiler and linker to ensure build tools can find them
    mkdir -p /usr/local/bin
    ln -sf /usr/bin/gcc /usr/local/bin/cc
    ln -sf /usr/bin/ld.bfd /usr/local/bin/ld
    export PATH="/usr/local/bin:${PATH}"

    # Configure PKG_CONFIG_PATH for dependencies
    export PKG_CONFIG_PATH="/usr/lib/pkgconfig:/usr/lib64/pkgconfig:/usr/share/pkgconfig"

    # Configure library path to ensure libcrypt is found
    export LD_LIBRARY_PATH="/usr/lib:/usr/lib64"

    # Build all required binaries
    make BUILDTAGS="seccomp exclude_graphdriver_devicemapper libsubid" GO=go GIT_COMMIT=v5.4.1 podman podman-remote rootlessport

    # Install binaries only, skip manpages
    mkdir -p ${OUT_DIR}/usr/bin ${OUT_DIR}/usr/libexec/podman
    install -m 755 bin/podman ${OUT_DIR}/usr/bin/podman
    install -m 755 bin/podman-remote ${OUT_DIR}/usr/bin/podman-remote
    ln -sf podman ${OUT_DIR}/usr/bin/podmansh
    install -m 755 bin/rootlessport ${OUT_DIR}/usr/libexec/podman/rootlessport

    # Install container configuration files
    mkdir -p ${OUT_DIR}/etc/containers
    install -m 644 /./${SOURCE_policy_json} ${OUT_DIR}/etc/containers/policy.json
    install -m 644 /./${SOURCE_registries_conf} ${OUT_DIR}/etc/containers/registries.conf

    # Set consistent timestamps for reproducible builds
    find "${OUT_DIR}" -exec touch -d '2024-01-01T00:00:00+00:00' {} \;
    find "${OUT_DIR}" ! -type d -exec strip-nondeterminism -T 1704067200 --normalizers +all {} \; || true
    find ${OUT_DIR} -type f -executable -exec strip --strip-unneeded {} \; 2>/dev/null || true
    find ${OUT_DIR} -name '*.a' -exec objcopy --enable-deterministic-archives {} \; 2>/dev/null || true

bundles:
  dev:
  - bin
  - conf

  full:
  - bin
  - conf
  - remote

outputs:
  bin:
    files:
    - path: /usr/bin/podman
      needs:
      - /usr/lib/ld-linux-x86-64.so.2
      - /usr/lib/libc.so.6
      - /usr/lib/libgpgme.so.11
      - /usr/lib/libresolv.so.2
      - /usr/lib/libseccomp.so.2
      - /usr/lib/libsubid.so.4
    - path: /usr/bin/podmansh
      needs:
      - /usr/lib/ld-linux-x86-64.so.2
      - /usr/lib/libc.so.6
      - /usr/lib/libgpgme.so.11
      - /usr/lib/libresolv.so.2
      - /usr/lib/libseccomp.so.2
      - /usr/lib/libsubid.so.4
    - path: /usr/libexec/podman/rootlessport
      needs:
      - /usr/lib/ld-linux-x86-64.so.2
      - /usr/lib/libc.so.6
      - /usr/lib/libresolv.so.2

  conf:
    files:
    - path: /etc/containers/policy.json
    - path: /etc/containers/registries.conf

  remote:
    files:
    - path: /usr/bin/podman-remote
      needs:
      - /usr/lib/ld-linux-x86-64.so.2
      - /usr/lib/libc.so.6
      - /usr/lib/libresolv.so.2

resolution:
  /usr/lib/ld-linux-x86-64.so.2: glibc
  /usr/lib/libc.so.6: glibc
  /usr/lib/libresolv.so.2: glibc
  /usr/lib/libgpgme.so.11: libgpgme
  /usr/lib/libseccomp.so.2: libseccomp
  /usr/lib/libsubid.so.4: shadow
