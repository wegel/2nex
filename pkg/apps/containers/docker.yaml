package:
  schema: 1
  name: Docker Moby
  slug: docker
  namespace: apps/containers
  version: 29.3.0+git1da6517e1a
  description: Docker container engine and command-line client built from Moby
  homepage: https://www.docker.com/
  checksum: 4660e54e63cf2a0aade2db21bb7c05fbab090e529044065bfd5d5f44c419caa7

sources:
- name: moby
  url: https://github.com/moby/moby/archive/1da6517e1a4381297e56862f6f373f265c28d102.tar.gz
  sha256: 22170504140840d37bb3cbc14a0807c1803d71934f4e6f74793448cff7fcf30f
- name: uapi_config
  file: pkg/apps/containers/docker-uapi-config.patch
  sha256: d5482d36ad1471bda5e7622665b56612775bc203b16366459d50ee21a29d1487
- name: docker_cli
  url: https://github.com/docker/cli/archive/df016a3a9538efb6d7d6e7c3baf291dbbe28eee0.tar.gz
  sha256: 537f4ad7fad672dc3e084a2638711f08630715163d875f3fc4fbf2afc47b3c14

