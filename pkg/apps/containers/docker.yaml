build:
  environment: 27b6e5dc7ad152c9a17c2cabfcc5ee93daa9bbf0
  profile: [4144:54687, 8248:60179, 12358:60180, 16470:60180, 20626:60180, 24744:60186, 28886:60205, 33035:60571, 33202:60647]

  script: |
    set -eux
    mkdir -p "${WORK_DIR}/moby" "${WORK_DIR}/cli"
    tar --no-same-owner -xf /${SOURCE_moby} -C "${WORK_DIR}/moby" --strip-components=1
    tar --no-same-owner -xf /${SOURCE_docker_cli} -C "${WORK_DIR}/cli" --strip-components=1

    patch --batch --fuzz=0 -Np1 -d "${WORK_DIR}/moby" -i "/${SOURCE_uapi_config}"

    export GOROOT=/usr/lib/go
    export GOPATH="${WORK_DIR}/moby/.gopath:${WORK_DIR}/moby/vendor"
    export GOCACHE="${WORK_DIR}/gocache"
    export GOENV=off
    export GOTELEMETRY=off
    export GO111MODULE=off
    export CGO_ENABLED=1
    export CGO_CFLAGS="${CFLAGS}"
    export CGO_LDFLAGS="${LDFLAGS} -Wl,--build-id=none"
    export DISABLE_WARN_OUTSIDE_CONTAINER=1

    cd "${WORK_DIR}/moby"
    mkdir -p .gopath/src/github.com/moby/moby
    ln -s ../../../../.. .gopath/src/github.com/moby/moby/v2
    mkdir -p .gopath/src/github.com/docker
    ln -s "${WORK_DIR}/cli" .gopath/src/github.com/docker/cli

    # The implicit daemon.json must come from /etc, then /run, then /usr/lib,
    # so a package can ship a default and a boot can override it.
    go test github.com/moby/moby/v2/daemon/command -run TestNexDaemonConfigTiers -v
    printf 'docker UAPI smoke: daemon.json honoured all tiers\n'

    export BUILDFLAGS="-trimpath -buildvcs=false"
    export DOCKER_LDFLAGS="-buildid="
    VERSION=v29.3.0-46-g1da6517e1a \
      DOCKER_GITCOMMIT=1da6517e1a4381297e56862f6f373f265c28d102 \
      ./hack/make.sh dynbinary

    cd "${WORK_DIR}/cli"
    export GOPATH="${WORK_DIR}/moby/.gopath:${WORK_DIR}/cli/vendor"
    export CFLAGS=
    export LDFLAGS=
    export TARGET=build
    export GO_LDFLAGS="-buildid="
    export BUILDFLAGS="-trimpath -buildvcs=false"
    VERSION=v29.3.0-46-g1da6517e1a GITCOMMIT=df016a3a95 make dynbinary
    make manpages

    install -d "${OUT_DIR}/usr/share/man"
    cp -a man/man[1-9] "${OUT_DIR}/usr/share/man/"

    cd "${WORK_DIR}/moby/man"
    make DESTDIR="${OUT_DIR}" prefix=/usr mandir=/usr/share/man install

    cd "${WORK_DIR}/cli"

    install -Dm755 build/docker "${OUT_DIR}/usr/bin/docker"
    install -Dm755 "${WORK_DIR}/moby/bundles/dynbinary-daemon/dockerd" \
      "${OUT_DIR}/usr/bin/dockerd"
    install -Dm755 "${WORK_DIR}/moby/bundles/dynbinary-daemon/docker-proxy" \
      "${OUT_DIR}/usr/bin/docker-proxy"
    ln -s tini "${OUT_DIR}/usr/bin/docker-init"

    install -Dm644 contrib/completion/bash/docker \
      "${OUT_DIR}/usr/share/bash-completion/completions/docker"
    install -Dm644 contrib/completion/fish/docker.fish \
      "${OUT_DIR}/usr/share/fish/vendor_completions.d/docker.fish"
    install -Dm644 contrib/completion/zsh/_docker \
      "${OUT_DIR}/usr/share/zsh/site-functions/_docker"

    install -Dm644 "${WORK_DIR}/moby/contrib/init/systemd/docker.service" \
      "${OUT_DIR}/usr/lib/systemd/system/docker.service"
    sed -i 's:/bin/kill:/usr/bin/kill:g' \
      "${OUT_DIR}/usr/lib/systemd/system/docker.service"
    install -Dm644 "${WORK_DIR}/moby/contrib/init/systemd/docker.socket" \
      "${OUT_DIR}/usr/lib/systemd/system/docker.socket"
    install -Dm755 "${WORK_DIR}/moby/contrib/check-config.sh" \
      "${OUT_DIR}/usr/share/docker/check-config.sh"

    find "${OUT_DIR}" -exec touch -h -d '2024-01-01T00:00:00+00:00' {} \;

bundles:
  full:
  - bin
  - doc
  - lib
  - man
  - misc

outputs:
  bin:
    files:
    - path: /usr/bin/docker
      needs:
      - /usr/lib/ld-linux-x86-64.so.2
      - /usr/lib/libc.so.6
    - path: /usr/bin/docker-init
      needs:
      - /usr/bin/tini
    - path: /usr/bin/docker-proxy
      needs:
      - /usr/lib/ld-linux-x86-64.so.2
      - /usr/lib/libc.so.6
    - path: /usr/bin/dockerd
