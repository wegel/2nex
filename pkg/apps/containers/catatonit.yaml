package:
  schema: 1
  name: Catatonit
  slug: catatonit
  namespace: apps/containers
  version: 0.2.1
  description: A container init system with simple and predictable behavior
  homepage: https://github.com/openSUSE/catatonit
  checksum: 54a56c4c894dfef037c44e33a09cb3a93dd3d8f75954a0b22e0ece7edceda58c
sources:
- name: catatonit
  url: https://github.com/openSUSE/catatonit/archive/refs/tags/v0.2.1.tar.gz
  sha256: 771385049516fdd561fbb9164eddf376075c4c7de3900a8b18654660172748f1
dependencies:
- name: bash
  commit: x86_64/pkg/cli/shells/bash/5.2.21/bundles/dev
- name: coreutils
  commit: x86_64/pkg/core/userland/coreutils/9.5/bundles/dev
- name: findutils
  commit: x86_64/pkg/core/userland/findutils/4.9.0/bundles/dev
- name: phase3
  commit: x86_64/pkg/bootstrap/phase3/2nex-utilities-bootstrap/0.0.1/bundles/dev
- name: gawk
  commit: x86_64/pkg/cli/text/gawk/5.3.0/bundles/dev
- name: grep
  commit: x86_64/pkg/cli/text/grep/3.11/bundles/dev
- name: gzip
  commit: x86_64/pkg/cli/archive/gzip/1.13/bundles/dev
- name: make
  commit: x86_64/pkg/core/toolchain/make/4.4.1/bundles/dev
- name: sed
  commit: x86_64/pkg/cli/text/sed/4.9/bundles/dev
- name: tar
  commit: x86_64/pkg/cli/archive/tar/1.35/bundles/dev
- name: binutils
  commit: x86_64/pkg/bootstrap/phase3/binutils/2.42/bundles/dev
- name: glibc
  commit: x86_64/pkg/libs/system/glibc/2.39/bundles/dev
- name: gcc
  commit: x86_64/pkg/bootstrap/phase3/gcc/13.2.0/bundles/dev
- name: autoconf
  commit: x86_64/pkg/core/toolchain/autoconf/2.72/bundles/dev
- name: automake
  commit: x86_64/pkg/core/toolchain/automake/1.16.5/bundles/dev
- name: libtool
  commit: x86_64/pkg/core/toolchain/libtool/2.4.7/bundles/dev
- name: ncurses
  commit: x86_64/pkg/libs/system/ncurses/6.4-20230520/bundles/dev
- name: attr
  commit: x86_64/pkg/libs/system/attr/2.5.2/bundles/dev
- name: acl
  commit: x86_64/pkg/libs/system/acl/2.3.2/bundles/dev
- name: mpc
  commit: x86_64/pkg/bootstrap/phase3/mpc/1.2.1/bundles/dev
- name: mpfr
  commit: x86_64/pkg/bootstrap/phase3/mpfr/4.2.1/bundles/dev
- name: gmp
  commit: x86_64/pkg/libs/system/gmp/6.3.0/bundles/dev
- name: libcap
  commit: x86_64/pkg/libs/security/libcap/2.69/bundles/dev
- name: zlib
  commit: x86_64/pkg/bootstrap/phase3/zlib/1.3.1/bundles/dev
- name: perl
  commit: x86_64/pkg/dev/lang/perl/5.38.2/bundles/dev
- name: m4
  commit: x86_64/pkg/bootstrap/phase3/m4/1.4.19/bundles/dev
- name: linux-headers
  commit: x86_64/pkg/bootstrap/phase3/linux-headers/6.4.1/bundles/dev
build:
  script: 'tar --no-same-owner -xf ${SOURCE_catatonit} -C "${WORK_DIR}" --strip-components=1

    cd ${WORK_DIR}


    # Bootstrap the build system

    autoreconf -fi


    # Configure

    ./configure --prefix=/usr


    # Build

    make


    # Install

    make DESTDIR="${OUT_DIR}" install


    # Create directory for podman

    mkdir -p ${OUT_DIR}/usr/libexec/podman

    ln -sf ../../bin/catatonit ${OUT_DIR}/usr/libexec/podman/catatonit


    # Set consistent timestamps for reproducible builds

    find "${OUT_DIR}" -exec touch -d ''2024-01-01T00:00:00+00:00'' {} \;

    2nex_strip_binaries ${OUT_DIR}

    '
bundles:
  full:
  - bin
  dev:
  - bin
outputs:
  bin:
    files:
    - path: /usr/bin/catatonit
    - path: /usr/libexec/podman/catatonit
