package:
  schema: 1
  name: passt
  slug: passt
  namespace: apps/containers
  version: 2025_02_17
  description: Plug A Simple Socket Transport - network passthrough for containers
  homepage: https://passt.top
  checksum: d057b298a5d7f5d1f8c8ed0c05f6725ecaf7b2690b9b772a6785a49e7ce53335

sources:
- name: passt
  url: https://passt.top/passt/snapshot/passt-2025_02_17.a1e48a0.tar.gz
  sha256: fc5517c5e62fdcb6f40e25e66d2d8f5337cb2f96701c9e36b62b87ed89e59631

dependencies:
- name: bash
  commit: x86_64/pkg/cli/shells/bash/5.2.21/bundles/dev
- name: coreutils
  commit: x86_64/pkg/core/userland/coreutils/9.5/bundles/dev
- name: findutils
  commit: x86_64/pkg/core/userland/findutils/4.9.0/bundles/dev
- name: libcap
  commit: x86_64/pkg/libs/security/libcap/2.69/bundles/dev
- name: gzip
  commit: x86_64/pkg/cli/archive/gzip/1.13/bundles/dev
- name: make
  commit: x86_64/pkg/core/toolchain/make/4.4.1/bundles/dev
- name: sed
  commit: x86_64/pkg/cli/text/sed/4.9/bundles/dev
- name: tar
  commit: x86_64/pkg/cli/archive/tar/1.35/bundles/dev
- name: binutils
  commit: x86_64/pkg/core/toolchain/binutils/2.42/bundles/dev
- name: glibc
  commit: x86_64/pkg/libs/system/glibc/2.39/bundles/dev
- name: gcc
  commit: x86_64/pkg/core/toolchain/gcc/13.2.0/bundles/dev
- name: linux-headers
  commit: x86_64/pkg/libs/system/linux-headers/6.4.1/bundles/dev
- name: ncurses
  commit: x86_64/pkg/libs/system/ncurses/6.4-20230520/bundles/dev
- name: inetutils
  commit: x86_64/pkg/net/misc/inetutils/2.5/bundles/dev
- name: attr
  commit: x86_64/pkg/libs/system/attr/2.5.2/bundles/dev
- name: acl
  commit: x86_64/pkg/libs/system/acl/2.3.2/bundles/dev
- name: gmp
  commit: x86_64/pkg/libs/system/gmp/6.3.0/bundles/dev
- name: zlib
  commit: x86_64/pkg/libs/system/zlib/1.3.1/bundles/dev

build:
  environment: 27b6e5dc7ad152c9a17c2cabfcc5ee93daa9bbf0
  profile: [4201:4507, 4765:6949]

  script: |
    tar --no-same-owner -xf ${SOURCE_passt} -C "${WORK_DIR}" --strip-components=1
    cd ${WORK_DIR}

    # Build
    export CC=gcc
    make prefix=/usr CC=gcc

    # Install
    make DESTDIR="${OUT_DIR}" prefix=/usr CC=gcc install

    # Create directory for podman
    mkdir -p ${OUT_DIR}/usr/libexec/podman
    ln -sf ../../bin/pasta ${OUT_DIR}/usr/libexec/podman/pasta

    # Set consistent timestamps for reproducible builds
    find "${OUT_DIR}" -exec touch -d '2024-01-01T00:00:00+00:00' {} \;
    #nex_strip_binaries ${OUT_DIR}

bundles:
  dev:
  - bin

  full:
  - bin
  - doc
  - man

outputs:
  bin:
    files:
    - path: /usr/bin/passt
      needs:
      - /usr/lib/ld-linux-x86-64.so.2
      - /usr/lib/libc.so.6
    - path: /usr/bin/passt-repair
      needs:
      - /usr/lib/ld-linux-x86-64.so.2
      - /usr/lib/libc.so.6
    - path: /usr/bin/passt.avx2
      needs:
      - /usr/lib/ld-linux-x86-64.so.2
      - /usr/lib/libc.so.6
    - path: /usr/bin/pasta
      needs:
      - /usr/lib/ld-linux-x86-64.so.2
      - /usr/lib/libc.so.6
    - path: /usr/bin/pasta.avx2
      needs:
      - /usr/lib/ld-linux-x86-64.so.2
      - /usr/lib/libc.so.6
    - path: /usr/bin/qrap
      needs:
      - /usr/lib/ld-linux-x86-64.so.2
      - /usr/lib/libc.so.6
    - path: /usr/libexec/podman/pasta
      needs:
      - /usr/lib/ld-linux-x86-64.so.2
      - /usr/lib/libc.so.6

  doc:
    files:
    - path: /usr/share/doc/passt/README.md
    - path: /usr/share/doc/passt/demo.sh

  man:
    files:
    - path: /usr/share/man/man1/passt-repair.1
    - path: /usr/share/man/man1/passt.1
    - path: /usr/share/man/man1/pasta.1
    - path: /usr/share/man/man1/qrap.1

resolution:
  /usr/lib/ld-linux-x86-64.so.2: glibc
  /usr/lib/libc.so.6: glibc
