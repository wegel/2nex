package:
  schema: 1
  name: passt
  slug: passt
  namespace: apps/containers
  version: '2025_02_17'
  description: Plug A Simple Socket Transport - network passthrough for containers
  homepage: https://passt.top
  checksum: 551f508fe2973c4416f69a9b1e2453ac6e35e1a7a166c452b7bf8df2fc47789a
sources:
- name: passt
  url: https://passt.top/passt/snapshot/passt-2025_02_17.a1e48a0.tar.gz
  sha256: fc5517c5e62fdcb6f40e25e66d2d8f5337cb2f96701c9e36b62b87ed89e59631
dependencies:
- commit: x86_64/pkg/cli/shells/bash/5.2.21/bundles/dev
  name: bash
- commit: x86_64/pkg/core/userland/coreutils/9.5/bundles/dev
  name: coreutils
- commit: x86_64/pkg/core/userland/findutils/4.9.0/bundles/dev
  name: findutils
- commit: x86_64/pkg/bootstrap/phase3/2nex-utilities-bootstrap/0.0.1/bundles/dev
  name: 2nex-utilities
- commit: x86_64/pkg/cli/archive/gzip/1.13/bundles/dev
  name: gzip
- commit: x86_64/pkg/core/toolchain/make/4.4.1/bundles/dev
  name: make
- commit: x86_64/pkg/cli/text/sed/4.9/bundles/dev
  name: sed
- commit: x86_64/pkg/cli/archive/tar/1.35/bundles/dev
  name: tar
- commit: x86_64/pkg/bootstrap/phase3/binutils/2.42/bundles/dev
  name: binutils
- commit: x86_64/pkg/libs/system/glibc/2.39/bundles/dev
  name: glibc
- commit: x86_64/pkg/bootstrap/phase3/gcc/13.2.0/bundles/dev
  name: gcc
- commit: x86_64/pkg/bootstrap/phase3/linux-headers/6.4.1/bundles/dev
  name: linux-headers
- commit: x86_64/pkg/libs/system/ncurses/6.4-20230520/bundles/dev
  name: ncurses
- commit: x86_64/pkg/net/misc/inetutils/2.5/bundles/dev
  name: inetutils
- commit: x86_64/pkg/libs/system/attr/2.5.2/bundles/dev
  name: attr
- commit: x86_64/pkg/libs/system/acl/2.3.2/bundles/dev
  name: acl
- commit: x86_64/pkg/bootstrap/phase3/mpc/1.2.1/bundles/dev
  name: mpc
- commit: x86_64/pkg/bootstrap/phase3/mpfr/4.2.1/bundles/dev
  name: mpfr
- commit: x86_64/pkg/libs/system/gmp/6.3.0/bundles/dev
  name: gmp
- commit: x86_64/pkg/bootstrap/phase3/zlib/1.3.1/bundles/dev
  name: zlib
build:
  script: 'tar --no-same-owner -xf ${SOURCE_passt} -C "${WORK_DIR}" --strip-components=1

    cd ${WORK_DIR}


    # Build

    export CC=gcc

    make prefix=/usr CC=gcc


    # Install

    make DESTDIR="${OUT_DIR}" prefix=/usr CC=gcc install


    # Create directory for podman

    mkdir -p ${OUT_DIR}/usr/libexec/podman

    ln -sf ../../bin/pasta ${OUT_DIR}/usr/libexec/podman/pasta


    # Set consistent timestamps for reproducible builds

    find "${OUT_DIR}" -exec touch -d ''2024-01-01T00:00:00+00:00'' {} \;

    #2nex_strip_binaries ${OUT_DIR}

    '
bundles:
  full:
  - bin
  - man
  - doc
  dev:
  - bin
outputs:
  bin:
    files:
    - /usr/bin/passt
    - /usr/bin/passt-repair
    - /usr/bin/passt.avx2
    - /usr/bin/pasta
    - /usr/bin/pasta.avx2
    - /usr/bin/qrap
    - /usr/libexec/podman/pasta
    requires:
    - x86_64/pkg/libs/system/glibc/2.39/outputs/lib
  man:
    files:
    - /usr/share/man/man1/passt-repair.1
    - /usr/share/man/man1/passt.1
    - /usr/share/man/man1/pasta.1
    - /usr/share/man/man1/qrap.1
  doc:
    files:
    - /usr/share/doc/passt/README.md
    - /usr/share/doc/passt/demo.sh
    requires:
    - x86_64/pkg/cli/shells/bash/5.2.21/outputs/bin
