package:
  schema: 1
  name: slirp4netns
  slug: slirp4netns
  namespace: apps/containers
  version: 1.3.4
  description: User-mode networking helper for unprivileged network namespaces
  homepage: https://github.com/rootless-containers/slirp4netns
  checksum: e78184da36b6df6784f1a8dbeaeaece61a932e560f591408880ec756800a7423

sources:
- name: slirp4netns
  url: https://github.com/rootless-containers/slirp4netns/archive/refs/tags/v1.3.4.tar.gz
  sha256: c8e445deded09c5e777af3c599f808b3d0cbfeab482d9e76746df0926234200d

dependencies:
- name: glibc
  commit: x86_64/pkg/libs/system/glibc/2.39/bundles/dev
- name: gcc
  commit: x86_64/pkg/core/toolchain/gcc/13.2.0/bundles/dev
- name: binutils
  commit: x86_64/pkg/core/toolchain/binutils/2.42/bundles/dev
- name: bash
  commit: x86_64/pkg/cli/shells/bash/5.2.21/bundles/dev
- name: coreutils
  commit: x86_64/pkg/core/userland/coreutils/9.5/bundles/dev
- name: findutils
  commit: x86_64/pkg/core/userland/findutils/4.9.0/bundles/dev
- name: grep
  commit: x86_64/pkg/cli/text/grep/3.11/bundles/dev
- name: sed
  commit: x86_64/pkg/cli/text/sed/4.9/bundles/dev
- name: gawk
  commit: x86_64/pkg/cli/text/gawk/5.3.0/bundles/dev
- name: tar
  commit: x86_64/pkg/cli/archive/tar/1.35/bundles/dev
- name: gzip
  commit: x86_64/pkg/cli/archive/gzip/1.13/bundles/dev
- name: make
  commit: x86_64/pkg/core/toolchain/make/4.4.1/bundles/dev
- name: pkgconf
  commit: x86_64/pkg/core/toolchain/pkgconf/2.2.0/bundles/dev
- name: autoconf
  commit: x86_64/pkg/core/toolchain/autoconf/2.72/bundles/dev
- name: automake
  commit: x86_64/pkg/core/toolchain/automake/1.16.5/bundles/dev
- name: libtool
  commit: x86_64/pkg/core/toolchain/libtool/2.4.7/bundles/dev
- name: m4
  commit: x86_64/pkg/dev/lang/m4/1.4.19/bundles/dev
- name: perl
  commit: x86_64/pkg/dev/lang/perl/5.38.2/bundles/dev
- name: linux-headers
  commit: x86_64/pkg/libs/system/linux-headers/6.4.1/bundles/dev
- name: glib2
  commit: x86_64/pkg/dev/libs/glib2/2.84.0/bundles/dev
- name: pcre2
  commit: x86_64/pkg/dev/libs/pcre2/10.44/bundles/dev
- name: libffi
  commit: x86_64/pkg/libs/system/libffi/3.4.6/bundles/dev
- name: libslirp
  commit: x86_64/pkg/libs/net/libslirp/4.9.3/bundles/dev
- name: libcap
  commit: x86_64/pkg/libs/security/libcap/2.69/bundles/dev
- name: libseccomp
  commit: x86_64/pkg/dev/libs/libseccomp/2.5.6/bundles/dev

build:
  environment: 27b6e5dc7ad152c9a17c2cabfcc5ee93daa9bbf0
  profile: [4433:48945, 8608:53675, 8940:55216]

  script: |
    set -eu

    tar --no-same-owner -xf "/./${SOURCE_slirp4netns}" -C "${WORK_DIR}" --strip-components=1
    cd "${WORK_DIR}"

    ./autogen.sh
    ./configure \
      --prefix=/usr

    make
    make DESTDIR="${OUT_DIR}" install

    find "${OUT_DIR}" -type f -executable -exec strip --strip-unneeded {} \; 2>/dev/null || true
    find "${OUT_DIR}" -exec touch -d "2024-01-01T00:00:00+00:00" {} \;

bundles:
  dev:
  - bin
  - man

  full:
  - bin
  - man

outputs:
  bin:
    files:
    - path: /usr/bin/slirp4netns
      needs:
      - /usr/lib/ld-linux-x86-64.so.2
      - /usr/lib/libc.so.6
      - /usr/lib/libglib-2.0.so.0
      - /usr/lib/libseccomp.so.2
      - /usr/lib/libslirp.so.0

  man:
    files:
    - path: /usr/share/man/man1/slirp4netns.1

resolution:
  /usr/lib/libglib-2.0.so.0: glib2
  /usr/lib/ld-linux-x86-64.so.2: glibc
  /usr/lib/libc.so.6: glibc
  /usr/lib/libseccomp.so.2: libseccomp
  /usr/lib/libslirp.so.0: libslirp
