build:
  environment: 27b6e5dc7ad152c9a17c2cabfcc5ee93daa9bbf0
  profile: [4164:38181, 8275:51362, 12385:59755, 16490:63048, 24784:70480, 28943:74932, 33042:79159, 41321:89731, 49606:100200, 52247:101494]

  script: |
    tar --no-same-owner -xf /${SOURCE0} -C "${WORK_DIR}" --strip-components=1
    cd "${WORK_DIR}"

    meson setup build \
      --prefix=/usr \
      --sysconfdir=/etc \
      --localstatedir=/var \
      --libdir=lib \
      --buildtype=release \
      -Ddebug-mode=false \
      -Dlibcap-ng=disabled \
      -Dselinux=disabled \
      -Dsystemd=enabled \
      -Dpam=true \
      -Dssh-agent=false \
      -Dmanpage=false

    ninja -C build
    DESTDIR="${OUT_DIR}" ninja -C build install

    find ${OUT_DIR} -type f -executable -exec strip --strip-unneeded {} \; 2>/dev/null || true
    find ${OUT_DIR} -name '*.a' -exec objcopy --enable-deterministic-archives {} \; 2>/dev/null || true
    find "${OUT_DIR}" -exec touch -d "2024-01-01T00:00:00+00:00" {} \;

