build:
  environment: 27b6e5dc7ad152c9a17c2cabfcc5ee93daa9bbf0
  profile: [12352:15221, 35293:17633, 78426:17799, 126487:17969, 168241:18473, 212337:19463, 253351:19758, 315632:23682, 377678:26243, 416395:29534]

  script: |
    tar --no-same-owner -xf ${SOURCE_gnupg} -C "${WORK_DIR}" --strip-components=1
    cd ${WORK_DIR}

    ./configure \
      --prefix=/usr \
      --sbindir=/usr/bin \
      --enable-gnutls \
      --with-zlib=/usr \
      --with-bzip2=/usr \
      --with-readline=/usr

    grep -q '^#define HTTP_USE_GNUTLS 1' config.h
    grep -q '^#define BUILD_WITH_DIRMNGR 1' config.h

    make
    make DESTDIR="${OUT_DIR}" install

    find ${OUT_DIR}/usr/bin ${OUT_DIR}/usr/libexec -type f -executable -exec strip --strip-unneeded {} \; 2>/dev/null || true
    find "${OUT_DIR}" -exec touch -h -d '2024-01-01T00:00:00+00:00' {} \;

