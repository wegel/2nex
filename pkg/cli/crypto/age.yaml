package:
  schema: 1
  name: age
  slug: age
  namespace: cli/crypto
  version: 1.2.1
  description: Simple, modern, secure file encryption tool
  homepage: https://age-encryption.org/
  checksum: 29a148e950684be0993d775957b6ed4ea785ff8eae32981aa159fff74ac90b05

sources:
- name: age
  url: https://github.com/FiloSottile/age/archive/refs/tags/v1.2.1.tar.gz
  sha256: 93bd89a16c74949ee7c69ef580d8e4cf5ce03e7d9c461b68cf1ace3e4017eef5
- name: vendor
  sha256: 5a4e0097d9f166b569cc7995670b433e2a049c022eedb27f8429255f8e088e49
  go_sum: https://raw.githubusercontent.com/FiloSottile/age/v1.2.1/go.sum

dependencies:
- name: bash
  commit: x86_64/pkg/cli/shells/bash/5.2.21/bundles/dev
- name: coreutils
  commit: x86_64/pkg/core/userland/coreutils/9.5/bundles/dev
- name: findutils
  commit: x86_64/pkg/core/userland/findutils/4.9.0/bundles/dev
- name: binutils
  commit: x86_64/pkg/core/toolchain/binutils/2.42/bundles/dev
- name: gzip
  commit: x86_64/pkg/cli/archive/gzip/1.13/bundles/dev
- name: tar
  commit: x86_64/pkg/cli/archive/tar/1.35/bundles/dev
- name: glibc
  commit: x86_64/pkg/libs/system/glibc/2.39/bundles/dev
- name: go
  commit: x86_64/pkg/dev/lang/go/1.23.8/bundles/dev
- name: ncurses
  commit: x86_64/pkg/libs/system/ncurses/6.4-20230520/bundles/dev
- name: acl
  commit: x86_64/pkg/libs/system/acl/2.3.2/bundles/dev
- name: attr
  commit: x86_64/pkg/libs/system/attr/2.5.2/bundles/dev

build:
  environment: 27b6e5dc7ad152c9a17c2cabfcc5ee93daa9bbf0
  profile: [32:26762]

  script: |
    tar --no-same-owner -xf ${SOURCE_age} -C "${WORK_DIR}" --strip-components=1
    cd ${WORK_DIR}

    tar --no-same-owner -xf /./${SOURCE_vendor} -C "${WORK_DIR}"

    export GOROOT=/usr/lib/go
    export GOPATH=${WORK_DIR}/gopath
    export GOCACHE=${WORK_DIR}/gocache
    export CGO_ENABLED=0
    export GOTOOLCHAIN=local
    mkdir -p ${GOPATH} ${GOCACHE}

    go build -mod=vendor -ldflags="-s -w -X main.Version=v1.2.1" -o age ./cmd/age
    go build -mod=vendor -ldflags="-s -w" -o age-keygen ./cmd/age-keygen

    mkdir -p ${OUT_DIR}/usr/bin
    install -m 755 age ${OUT_DIR}/usr/bin/age
    install -m 755 age-keygen ${OUT_DIR}/usr/bin/age-keygen

    strip --strip-all ${OUT_DIR}/usr/bin/age ${OUT_DIR}/usr/bin/age-keygen

    find "${OUT_DIR}" -exec touch -d '2024-01-01T00:00:00+00:00' {} \;

bundles:
  dev:
  - bin

outputs:
  bin:
    files:
    - path: /usr/bin/age
    - path: /usr/bin/age-keygen
