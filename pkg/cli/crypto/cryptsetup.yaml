    files:
    - path: /usr/bin/cryptsetup
      needs:
      - /usr/lib/ld-linux-x86-64.so.2
      - /usr/lib/libblkid.so.1
      - /usr/lib/libc.so.6
      - /usr/lib/libcryptsetup.so.12
      - /usr/lib/libpopt.so.0
      - /usr/lib/libuuid.so.1
    - path: /usr/bin/cryptsetup-ssh
