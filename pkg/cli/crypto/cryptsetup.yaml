  commit: x86_64/pkg/libs/compression/xz/5.4.6/bundles/dev

build:
  environment: 27b6e5dc7ad152c9a17c2cabfcc5ee93daa9bbf0
  profile: [4104:1159, 8230:3064, 12360:4332, 16531:7399, 20697:7495, 23831:7764]

  script: |
    set -eu
    tar --no-same-owner -xf "${SOURCE_cryptsetup}" -C "${WORK_DIR}" --strip-components=1
    cd "${WORK_DIR}"

    export PKG_CONFIG_PATH=/usr/lib/pkgconfig:/usr/share/pkgconfig
    ./configure \
      --prefix=/usr \
      --sbindir=/usr/bin \
      --libdir=/usr/lib \
      --disable-asciidoc \
      --enable-blkid \
      --enable-cryptsetup \
      --enable-integritysetup \
      --enable-internal-argon2 \
      --enable-kernel_crypto \
      --enable-keyring \
      --enable-luks2-reencryption \
      --enable-ssh-token \
      --enable-static \
      --enable-udev \
      --enable-veritysetup \
      --disable-libargon2 \
      --disable-static-cryptsetup \
      --with-crypto_backend=openssl
    make
    make DESTDIR="${OUT_DIR}" install

    find "${OUT_DIR}" -type f -executable -exec strip --strip-unneeded {} \; 2>/dev/null || true
    find "${OUT_DIR}" -name '*.a' -exec ranlib -D {} \; 2>/dev/null || true
    find "${OUT_DIR}" -exec touch -h -d '2024-01-01T00:00:00+00:00' {} \;

bundles:
  dev:
  - bin
  - dev
  - lib
  - static

  full:
  - bin
  - lib
  - locale
  - man

