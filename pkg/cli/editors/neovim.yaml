build:
  script: |
    tar --no-same-owner -xf ${SOURCE_neovim} -C "${WORK_DIR}" --strip-components=1
    cd ${WORK_DIR}

    # pre-populate the deps download directory so cmake won't try to fetch
    DEPS_DIR="${WORK_DIR}/.deps/build/downloads"
    mkdir -p ${DEPS_DIR}/{libuv,lua,unibilium,luv,lpeg,lua_compat53,utf8proc}
    mkdir -p ${DEPS_DIR}/{treesitter,treesitter_c,treesitter_lua,treesitter_vim}
    mkdir -p ${DEPS_DIR}/{treesitter_vimdoc,treesitter_query,treesitter_markdown}

    cp /${SOURCE_libuv} ${DEPS_DIR}/libuv/v1.50.0.tar.gz
    cp /${SOURCE_lua} ${DEPS_DIR}/lua/lua-5.1.5.tar.gz
    cp /${SOURCE_unibilium} ${DEPS_DIR}/unibilium/v2.1.2.tar.gz
    cp /${SOURCE_luv} ${DEPS_DIR}/luv/1.50.0-1.tar.gz
    cp /${SOURCE_lpeg} ${DEPS_DIR}/lpeg/lpeg-1.1.0.tar.gz
    cp /${SOURCE_lua_compat53} ${DEPS_DIR}/lua_compat53/v0.13.tar.gz
    cp /${SOURCE_utf8proc} ${DEPS_DIR}/utf8proc/v2.10.0.tar.gz
    cp /${SOURCE_treesitter} ${DEPS_DIR}/treesitter/v0.25.3.tar.gz
    cp /${SOURCE_treesitter_c} ${DEPS_DIR}/treesitter_c/v0.23.4.tar.gz
    cp /${SOURCE_treesitter_lua} ${DEPS_DIR}/treesitter_lua/v0.3.0.tar.gz
    cp /${SOURCE_treesitter_vim} ${DEPS_DIR}/treesitter_vim/v0.5.0.tar.gz
    cp /${SOURCE_treesitter_vimdoc} ${DEPS_DIR}/treesitter_vimdoc/v3.0.1.tar.gz
    cp /${SOURCE_treesitter_query} ${DEPS_DIR}/treesitter_query/v0.5.1.tar.gz
    cp /${SOURCE_treesitter_markdown} ${DEPS_DIR}/treesitter_markdown/v0.4.1.tar.gz

    # symlink system luajit headers/libs to where deps build expects them
    mkdir -p ${WORK_DIR}/.deps/usr/include
    mkdir -p ${WORK_DIR}/.deps/usr/lib
    ln -s /usr/include/luajit-2.1 ${WORK_DIR}/.deps/usr/include/luajit-2.1
    ln -s /usr/lib/libluajit-5.1.so ${WORK_DIR}/.deps/usr/lib/libluajit-5.1.so
    ln -s /usr/lib/libluajit-5.1.a ${WORK_DIR}/.deps/usr/lib/libluajit-5.1.a

    # patch gen_api_dispatch.lua to make API metadata serialization deterministic
    # the issue is that Lua tables with string keys have non-deterministic iteration order
    # we replace the mpack.encode of exported_functions with manual fixdict serialization
    # use sed to insert deterministic encoder functions before fixdict and replace put() call
    sed -i "/^local function fixdict/i\\
    local function encode_function_deterministic(f)\\
      local pieces = {}\\
      local count = 0\\
      for _, attr in ipairs(exported_attributes) do\\
        if f[attr] ~= nil then count = count + 1 end\\
      end\\
      if f.parameters then count = count + 1 end\\
      if count <= 15 then\\
        table.insert(pieces, string.char(128 + count))\\
      else\\
        error('too many fields')\\
      end\\
      for _, attr in ipairs(exported_attributes) do\\
        if f[attr] ~= nil then\\
          table.insert(pieces, mpack.encode(attr))\\
          table.insert(pieces, mpack.encode(f[attr]))\\
        end\\
      end\\
      if f.parameters then\\
        table.insert(pieces, mpack.encode('parameters'))\\
        table.insert(pieces, mpack.encode(f.parameters))\\
      end\\
      return table.concat(pieces)\\
    end\\
    local function encode_functions_deterministic(funcs)\\
      local pieces = {}\\
      if \\#funcs <= 15 then\\
        table.insert(pieces, string.char(144 + \\#funcs))\\
      elseif \\#funcs <= 65535 then\\
        table.insert(pieces, string.char(0xdc))\\
        table.insert(pieces, string.char(math.floor(\\#funcs / 256)))\\
        table.insert(pieces, string.char(\\#funcs % 256))\\
      else\\
        error('too many functions')\\
      end\\
      for _, f in ipairs(funcs) do\\
        table.insert(pieces, encode_function_deterministic(f))\\
      end\\
      return table.concat(pieces)\\
    end\\
    " src/gen/gen_api_dispatch.lua

    # replace the non-deterministic put() call with deterministic version
    sed -i "s/^put('functions', exported_functions)$/put('functions')\\ntable.insert(pieces, encode_functions_deterministic(exported_functions))/" src/gen/gen_api_dispatch.lua

    # also patch gen_api_ui_events.lua for deterministic ui_events serialization
    # same issue: mpack.encode(exported_events) iterates Lua tables non-deterministically
    sed -i "/^local exported_attributes/a\\
    local function encode_event_deterministic(ev)\\
      local pieces = {}\\
      local count = 0\\
      for _, attr in ipairs(exported_attributes) do\\
        if ev[attr] ~= nil then count = count + 1 end\\
      end\\
      table.insert(pieces, string.char(128 + count))\\
      for _, attr in ipairs(exported_attributes) do\\
        if ev[attr] ~= nil then\\
          table.insert(pieces, mpack.encode(attr))\\
          table.insert(pieces, mpack.encode(ev[attr]))\\
        end\\
      end\\
      return table.concat(pieces)\\
    end\\
    local function encode_events_deterministic(events)\\
      local pieces = {}\\
      if \\#events <= 15 then\\
        table.insert(pieces, string.char(144 + \\#events))\\
      elseif \\#events <= 65535 then\\
        table.insert(pieces, string.char(0xdc))\\
        table.insert(pieces, string.char(math.floor(\\#events / 256)))\\
        table.insert(pieces, string.char(\\#events % 256))\\
      else\\
        error('too many events')\\
      end\\
      for _, ev in ipairs(events) do\\
        table.insert(pieces, encode_event_deterministic(ev))\\
      end\\
      return table.concat(pieces)\\
    end" src/gen/gen_api_ui_events.lua

    # replace mpack.encode(exported_events) with deterministic version
    sed -i "s/^metadata_output:write(mpack.encode(exported_events))$/metadata_output:write(encode_events_deterministic(exported_events))/" src/gen/gen_api_ui_events.lua

    # patch gen_options.lua to sort keys before passing to hashy_hash
    # vim.tbl_keys returns non-deterministic order, which causes the hash table to differ
    # use (function() local t=vim.tbl_keys(x) table.sort(t) return t end)() pattern
    sed -i 's/vim.tbl_keys(option_index),/(function() local t = vim.tbl_keys(option_index); table.sort(t); return t end)(),/' src/gen/gen_options.lua

    # patch gen_api_ui_events.lua to sort client_events keys before hashy_hash
    sed -i 's/vim.tbl_keys(client_events),/(function() local t = vim.tbl_keys(client_events); table.sort(t); return t end)(),/' src/gen/gen_api_ui_events.lua

    # reproducible build settings:
    # - use clang for deterministic string constant ordering in .rodata
    # - LUA_GEN_PRG points to our deterministic LuaJIT (LUAJIT_SECURITY_PRN=0)
    # - lld with --sort-section=name for deterministic section ordering
    # - deterministic ar/ranlib flags for static archives
    export CC=clang
    export CXX=clang++
    export LDFLAGS="${LDFLAGS} -fuse-ld=lld -Wl,--sort-section=name"

    make CMAKE_BUILD_TYPE=Release \
         CMAKE_INSTALL_PREFIX=/usr \
         USE_BUNDLED=ON \
         DEPS_CMAKE_FLAGS="-DUSE_BUNDLED_LUAJIT=OFF -DLUAJIT_INCLUDE_DIR=/usr/include/luajit-2.1 -DLUAJIT_LIBRARY=/usr/lib/libluajit-5.1.so" \
         CMAKE_EXTRA_FLAGS="-DLUA_GEN_PRG=/usr/bin/luajit -DCMAKE_BUILD_WITH_INSTALL_RPATH=ON -DCMAKE_C_ARCHIVE_CREATE='<CMAKE_AR> qcD <TARGET> <OBJECTS>' -DCMAKE_C_ARCHIVE_FINISH='<CMAKE_RANLIB> -D <TARGET>' -DCMAKE_CXX_ARCHIVE_CREATE='<CMAKE_AR> qcD <TARGET> <OBJECTS>' -DCMAKE_CXX_ARCHIVE_FINISH='<CMAKE_RANLIB> -D <TARGET>'"

    make DESTDIR="${OUT_DIR}" install

    find "${OUT_DIR}" -exec touch -d '2024-01-01T00:00:00+00:00' {} \;
    find "${OUT_DIR}" ! -type d -exec strip-nondeterminism -T 1704067200 --normalizers +all {} \; || true
    2nex_strip_binaries ${OUT_DIR}
