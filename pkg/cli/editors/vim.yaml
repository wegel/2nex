package:
  schema: 1
  name: Vim
  slug: vim
  namespace: cli/editors
  version: 9.2.0340
  description: Modal text editor with syntax highlighting, help, and scripting support
  homepage: https://www.vim.org/
  checksum: 03cfbed73d35992c81820af919b3781cc186d4ef460641eaab9f94cca1f13495

sources:
- name: vim
  url: https://github.com/vim/vim/archive/6addd6c101117706bc9b3609d3a418e26e92618f.tar.gz
  sha256: 0d64dfc60b744e878c4f99f1a043a60963bdc6000b059794610bfb1aae77a284
- name: reproducible_patch
  file: pkg/cli/editors/vim-reproducible.patch
  sha256: dfbcee613651206df579f03df2141357b53e0926a400b1704fabe67c27bd5109

