  commit: x86_64/pkg/cli/archive/tar/1.35/bundles/dev

build:
  environment: 27b6e5dc7ad152c9a17c2cabfcc5ee93daa9bbf0
  profile: [4106:1206, 12360:7516, 20661:7577, 33810:7892, 46971:8245, 55757:8500, 68712:9028, 85275:14368, 101776:14529, 109815:15883]

  script: |
    set -eu
    tar --no-same-owner -xf "${SOURCE_vim}" -C "${WORK_DIR}" --strip-components=1
    cd "${WORK_DIR}"
    patch -Np1 -i "/./${SOURCE_reproducible_patch}"

    ./configure \
      --prefix=/usr \
      --with-tlib=ncurses
    make
    make DESTDIR="${OUT_DIR}" install

    sed -i '1s|^#!/bin/sh$|#!/usr/bin/sh|' "${OUT_DIR}/usr/bin/vimtutor"

    find "${OUT_DIR}" -type f -executable -exec strip --strip-unneeded {} \; 2>/dev/null || true
    find "${OUT_DIR}" -exec touch -h -d '2024-01-01T00:00:00+00:00' {} \;

bundles:
  full:
  - bin
  - man
  - misc

