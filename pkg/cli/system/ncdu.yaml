package:
  schema: 1
  name: ncdu
  slug: ncdu
  namespace: cli/system
  version: 2.9.2
  description: NCurses Disk Usage analyzer
  homepage: https://dev.yorhel.nl/ncdu
  checksum: 85f5206d2ea78744785d0a7e22959302a4541f7920bfc73891346db156202fa7

sources:
- name: ncdu
  url: https://dev.yorhel.nl/download/ncdu-2.9.2.tar.gz
  sha256: e91135281cb66569f2ca4c0bac277246991e7e52524c0ca8cba3de5c8e81cec9

dependencies:
- name: bash
  commit: x86_64/pkg/cli/shells/bash/5.2.21/bundles/dev
- name: coreutils
  commit: x86_64/pkg/core/userland/coreutils/9.5/bundles/dev
- name: findutils
  commit: x86_64/pkg/core/userland/findutils/4.9.0/bundles/dev
- name: gzip
  commit: x86_64/pkg/cli/archive/gzip/1.13/bundles/dev
- name: tar
  commit: x86_64/pkg/cli/archive/tar/1.35/bundles/dev
- name: glibc
  commit: x86_64/pkg/libs/system/glibc/2.39/bundles/dev
- name: ncurses
  commit: x86_64/pkg/libs/system/ncurses/6.4-20230520/bundles/dev
- name: acl
  commit: x86_64/pkg/libs/system/acl/2.3.2/bundles/dev
- name: attr
  commit: x86_64/pkg/libs/system/attr/2.5.2/bundles/dev
- name: libcap
  commit: x86_64/pkg/libs/security/libcap/2.69/bundles/dev
- name: zig-bin
  commit: x86_64/pkg/dev/lang/zig-bin/0.15.2/bundles/dev
- name: zstd
  commit: x86_64/pkg/libs/compression/zstd/1.5.6/bundles/dev
- name: file
  commit: x86_64/pkg/dev/tools/file/5.45/bundles/dev
- name: xz
  commit: x86_64/pkg/libs/compression/xz/5.4.6/bundles/dev
- name: bzip2
  commit: x86_64/pkg/libs/compression/bzip2/1.0.8/bundles/dev
- name: zlib
  commit: x86_64/pkg/libs/system/zlib/1.3.1/bundles/dev
- name: grep
  commit: x86_64/pkg/cli/text/grep/3.11/bundles/dev
- name: binutils
  commit: x86_64/pkg/core/toolchain/binutils/2.42/bundles/dev
- name: gcc
  commit: x86_64/pkg/core/toolchain/gcc/13.2.0/bundles/dev
- name: linux-headers
  commit: x86_64/pkg/libs/system/linux-headers/6.4.1/bundles/dev
- name: pkgconf
  commit: x86_64/pkg/core/toolchain/pkgconf/2.2.0/bundles/dev

build:
  environment: 13ce31fd97c19f5756e4413babf279d543b5a71c
  profile: [161:12744]

  script: |
    tar --no-same-owner -xf ${SOURCE_ncdu} -C "${WORK_DIR}" --strip-components=1
    cd ${WORK_DIR}

    export ZIG_GLOBAL_CACHE_DIR=/tmp/.zig-cache
    export PKG_CONFIG_PATH=/usr/lib/pkgconfig
    export CC=gcc
    export C_INCLUDE_PATH=/usr/lib/gcc/x86_64-pc-linux-gnu/13.2.0/include:/usr/include
    mkdir -p /tmp/.zig-cache
    zig build -Doptimize=ReleaseSafe --prefix ${OUT_DIR}/usr \
      --search-prefix /usr \
      --search-prefix /usr/lib/gcc/x86_64-pc-linux-gnu/13.2.0 \
      --global-cache-dir "${ZIG_GLOBAL_CACHE_DIR}"

    find ${OUT_DIR} -type f -executable -exec strip --strip-unneeded {} \; 2>/dev/null || true
    find ${OUT_DIR} -name '*.a' -exec objcopy --enable-deterministic-archives {} \; 2>/dev/null || true
    find "${OUT_DIR}" -exec touch -d "2024-01-01T00:00:00+00:00" {} \;

bundles:
  dev:
  - bin

outputs:
  bin:
    files:
    - path: /usr/bin/ncdu
      needs:
      - /usr/lib/ld-linux-x86-64.so.2
      - /usr/lib/libc.so.6
      - /usr/lib/libncursesw.so.6
      - /usr/lib/libzstd.so.1

resolution:
  /usr/lib/ld-linux-x86-64.so.2: glibc
  /usr/lib/libc.so.6: glibc
  /usr/lib/libncursesw.so.6: ncurses
  /usr/lib/libzstd.so.1: zstd
