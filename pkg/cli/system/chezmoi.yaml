package:
  schema: 1
  name: chezmoi
  slug: chezmoi
  namespace: cli/system
  version: 2.59.0
  description: Manage dotfiles across multiple machines
  homepage: https://www.chezmoi.io/
  checksum: 3c9047afc8e81de8b8e184e2554e0d3f43c18b02379e3d1cd617244109202c55

sources:
- name: chezmoi
  url: https://github.com/twpayne/chezmoi/archive/refs/tags/v2.59.0.tar.gz
  sha256: af1244c07ff5f3b04d6a2af186a9f2bdd33044399c94a051b64162f238a6b8bb
- name: vendor
  sha256: 45cef436669086a6e1929a38f746171650f5c0318fe355765b7d1ffb329650bc
  go_sum: https://raw.githubusercontent.com/twpayne/chezmoi/v2.59.0/go.sum

dependencies:
- name: bash
  commit: x86_64/pkg/cli/shells/bash/5.2.21/bundles/dev
- name: coreutils
  commit: x86_64/pkg/core/userland/coreutils/9.5/bundles/dev
- name: findutils
  commit: x86_64/pkg/core/userland/findutils/4.9.0/bundles/dev
- name: binutils
  commit: x86_64/pkg/core/toolchain/binutils/2.42/bundles/dev
- name: gzip
  commit: x86_64/pkg/cli/archive/gzip/1.13/bundles/dev
- name: tar
  commit: x86_64/pkg/cli/archive/tar/1.35/bundles/dev
- name: glibc
  commit: x86_64/pkg/libs/system/glibc/2.39/bundles/dev
- name: go
  commit: x86_64/pkg/dev/lang/go/1.26.4/bundles/dev
- name: ncurses
  commit: x86_64/pkg/libs/system/ncurses/6.4-20230520/bundles/dev
- name: acl
  commit: x86_64/pkg/libs/system/acl/2.3.2/bundles/dev
- name: attr
  commit: x86_64/pkg/libs/system/attr/2.5.2/bundles/dev

build:
  environment: 27b6e5dc7ad152c9a17c2cabfcc5ee93daa9bbf0
  profile: [32:12397]

  script: |
    tar --no-same-owner -xf ${SOURCE_chezmoi} -C "${WORK_DIR}" --strip-components=1
    cd ${WORK_DIR}

    tar --no-same-owner -xf /./${SOURCE_vendor} -C "${WORK_DIR}"

    export GOROOT=/usr/lib/go
    export GOPATH=${WORK_DIR}/gopath
    export GOCACHE=${WORK_DIR}/gocache
    export CGO_ENABLED=0
    export GOTOOLCHAIN=local
    mkdir -p ${GOPATH} ${GOCACHE}

    go build \
      -mod=vendor \
      -trimpath \
      -ldflags="-s -w -X main.version=2.59.0 -X main.commit=v2.59.0 -X main.date=2024-01-01T00:00:00Z -X main.builtBy=nex" \
      -o chezmoi

    mkdir -p ${OUT_DIR}/usr/bin
    install -m 755 chezmoi ${OUT_DIR}/usr/bin/chezmoi

    strip --strip-all ${OUT_DIR}/usr/bin/chezmoi

    find "${OUT_DIR}" -exec touch -d '2024-01-01T00:00:00+00:00' {} \;

bundles:
  dev:
  - bin

outputs:
  bin:
    files:
    - path: /usr/bin/chezmoi

resolution: {}
