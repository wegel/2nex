package:
  schema: 1
  name: tmux
  slug: tmux
  namespace: cli/system
  version: 3.6a
  description: Terminal multiplexer
  homepage: https://github.com/tmux/tmux
  checksum: c45f335adb98b0e434de16d33265311c62717d379e57f6ca4bd85cdf2a7a02c6

sources:
- name: tmux
  url: https://github.com/tmux/tmux/releases/download/3.6a/tmux-3.6a.tar.gz
  sha256: b6d8d9c76585db8ef5fa00d4931902fa4b8cbe8166f528f44fc403961a3f3759

dependencies:
- name: coreutils
  commit: x86_64/pkg/bootstrap/phase1/coreutils/9.5/bundles/dev
- name: findutils
  commit: x86_64/pkg/bootstrap/phase1/findutils/4.9.0/bundles/dev
- name: bash
  commit: x86_64/pkg/bootstrap/phase1/bash/5.2.21/bundles/dev
- name: 2nex-utilities-bootstrap
  commit: x86_64/pkg/bootstrap/phase3/2nex-utilities-bootstrap/0.0.1/bundles/dev
- name: gawk
  commit: x86_64/pkg/bootstrap/phase1/gawk/5.3.0/bundles/dev
- name: gzip
  commit: x86_64/pkg/bootstrap/phase1/gzip/1.13/bundles/dev
- name: make
  commit: x86_64/pkg/bootstrap/phase1/make/4.4.1/bundles/dev
- name: tar
  commit: x86_64/pkg/bootstrap/phase1/tar/1.35/bundles/dev
- name: bootstrap_tools
  commit: x86_64/pkg/bootstrap/phase1/bootstrap_tools/0.0.1/bundles/dev
- name: xz
  commit: x86_64/pkg/bootstrap/phase3/xz/5.4.6/bundles/dev
- name: bzip2
  commit: x86_64/pkg/bootstrap/phase3/bzip2/1.0.8/outputs/lib
- name: zlib
  commit: x86_64/pkg/bootstrap/phase3/zlib/1.3.1/outputs/lib
- name: file
  commit: x86_64/pkg/bootstrap/phase3/file/5.45/bundles/dev
- name: binutils
  commit: x86_64/pkg/bootstrap/phase3/binutils/2.42/bundles/dev
- name: gmp-bootstrap
  commit: x86_64/pkg/bootstrap/phase3/gmp-bootstrap/6.3.0/outputs/lib
- name: mpfr
  commit: x86_64/pkg/bootstrap/phase3/mpfr/4.2.1/outputs/lib
- name: mpc
  commit: x86_64/pkg/bootstrap/phase3/mpc/1.2.1/outputs/lib
- name: gcc
  commit: x86_64/pkg/bootstrap/phase3/gcc/13.2.0/bundles/dev
- name: glibc
  commit: x86_64/pkg/libs/system/glibc/2.39/bundles/dev
- name: sed
  commit: x86_64/pkg/bootstrap/phase1/sed/4.9/bundles/dev
- name: grep
  commit: x86_64/pkg/bootstrap/phase1/grep/3.11/bundles/dev
- name: ncurses
  commit: x86_64/pkg/libs/system/ncurses/6.4-20230520/bundles/dev
- name: libevent
  commit: x86_64/pkg/libs/system/libevent/2.1.12/bundles/dev
- name: pkgconf
  commit: x86_64/pkg/bootstrap/phase3/pkgconf/2.2.0/bundles/dev
- name: bison
  commit: x86_64/pkg/bootstrap/phase2/bison/3.8.2/bundles/dev

build:
  environment: 13ce31fd97c19f5756e4413babf279d543b5a71c
  profile: [9825:3695, 26842:3696, 55349:3700, 87894:3781, 116457:3809, 144904:3868, 173019:3900, 218140:4009, 257701:4099, 284756:5448]

  script: |
    tar --no-same-owner -xf /${SOURCE_tmux} -C "${WORK_DIR}" --strip-components=1
    cd ${WORK_DIR}

    ./configure --prefix=/usr --sysconfdir=/etc

    make
    make DESTDIR=${OUT_DIR} install

    find "${OUT_DIR}" -exec touch -d '2024-01-01T00:00:00+00:00' {} \;
    2nex_strip_binaries ${OUT_DIR}

bundles:
  dev:
  - bin

outputs:
  bin:
    files:
    - path: /usr/bin/tmux
      needs:
      - /usr/lib/ld-linux-x86-64.so.2
      - /usr/lib/libc.so.6
      - /usr/lib/libevent_core-2.1.so.7
      - /usr/lib/libm.so.6
      - /usr/lib/libncursesw.so.6
      - /usr/lib/libresolv.so.2

  man:
    files:
    - path: /usr/share/man/man1/tmux.1

resolution:
  /usr/lib/ld-linux-x86-64.so.2: glibc
  /usr/lib/libc.so.6: glibc
  /usr/lib/libm.so.6: glibc
  /usr/lib/libresolv.so.2: glibc
  /usr/lib/libevent_core-2.1.so.7: libevent
  /usr/lib/libncursesw.so.6: ncurses
