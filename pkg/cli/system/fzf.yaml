package:
  schema: 1
  name: fzf
  slug: fzf
  namespace: cli/system
  version: 0.67.0
  description: A command-line fuzzy finder
  homepage: https://github.com/junegunn/fzf
  checksum: e4d25b20dba1de2193c96c478d503c70355ae4cf544b9d3485cc8aa17fb6ae1f

sources:
- name: fzf
  url: https://github.com/junegunn/fzf/archive/refs/tags/v0.67.0.tar.gz
  sha256: da72936dd23045346769dbf233a7a1fa6b4cfe4f0e856b279821598ce8f692af
- name: vendor
  sha256: ae1522efa2076fe1b88e8e23e6645e296ff5d306661403c195667cce9d0e5de7
  go_sum: https://raw.githubusercontent.com/junegunn/fzf/v0.67.0/go.sum

dependencies:
- name: bash
  commit: x86_64/pkg/cli/shells/bash/5.2.21/bundles/dev
- name: coreutils
  commit: x86_64/pkg/core/userland/coreutils/9.5/bundles/dev
- name: findutils
  commit: x86_64/pkg/core/userland/findutils/4.9.0/bundles/dev
- name: 2nex-utilities
  commit: x86_64/pkg/bootstrap/phase3/2nex-utilities-bootstrap/0.0.1/bundles/dev
- name: gzip
  commit: x86_64/pkg/cli/archive/gzip/1.13/bundles/dev
- name: tar
  commit: x86_64/pkg/cli/archive/tar/1.35/bundles/dev
- name: glibc
  commit: x86_64/pkg/libs/system/glibc/2.39/bundles/dev
- name: gcc
  commit: x86_64/pkg/core/toolchain/gcc/13.2.0/bundles/dev
- name: go
  commit: x86_64/pkg/dev/lang/go/1.23.8/bundles/dev
- name: ncurses
  commit: x86_64/pkg/libs/system/ncurses/6.4-20230520/bundles/dev
- name: acl
  commit: x86_64/pkg/libs/system/acl/2.3.2/bundles/dev
- name: attr
  commit: x86_64/pkg/libs/system/attr/2.5.2/bundles/dev
- name: libcap
  commit: x86_64/pkg/libs/security/libcap/2.69/bundles/dev
- name: zlib
  commit: x86_64/pkg/libs/system/zlib/1.3.1/bundles/dev

build:
  environment: 13ce31fd97c19f5756e4413babf279d543b5a71c
  profile: [161:2856]

  script: |
    tar --no-same-owner -xf ${SOURCE_fzf} -C "${WORK_DIR}" --strip-components=1
    cd ${WORK_DIR}

    tar --no-same-owner -xf /./${SOURCE_vendor} -C "${WORK_DIR}"

    export GOROOT=/usr/lib/go
    export GOPATH=${WORK_DIR}/gopath
    export GOCACHE=${WORK_DIR}/gocache
    export CGO_ENABLED=0
    export GOTOOLCHAIN=local
    mkdir -p ${GOPATH} ${GOCACHE}

    go build -mod=vendor -ldflags="-s -w -X main.version=0.67.0" -o fzf

    mkdir -p ${OUT_DIR}/usr/bin
    install -m 755 fzf ${OUT_DIR}/usr/bin/fzf

    find "${OUT_DIR}" -exec touch -d '2024-01-01T00:00:00+00:00' {} \;
    2nex_strip_binaries ${OUT_DIR}

bundles:
  dev:
  - bin

outputs:
  bin:
    files:
    - path: /usr/bin/fzf
