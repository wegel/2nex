package:
  schema: 1
  name: duf
  slug: duf
  namespace: cli/system
  version: 0.9.1
  description: Disk Usage/Free Utility - a better 'df' alternative
  homepage: https://github.com/muesli/duf
  checksum: 0cbc5157bd62ba28e407c3fe21796578a4b78a6a26ca7a3a712f37bb5b99fc7b

sources:
- name: duf
  url: https://github.com/muesli/duf/archive/refs/tags/v0.9.1.tar.gz
  sha256: 1334d8c1a7957d0aceebe651e3af9e1c1e0c6f298f1feb39643dd0bd8ad1e955
- name: vendor
  sha256: c61fdde17d7077cf57da176009f00621c633e0a08e7d1e7329c03d171b3b6dbd
  go_sum: https://raw.githubusercontent.com/muesli/duf/v0.9.1/go.sum

dependencies:
- name: bash
  commit: x86_64/pkg/cli/shells/bash/5.2.21/bundles/dev
- name: coreutils
  commit: x86_64/pkg/core/userland/coreutils/9.5/bundles/dev
- name: findutils
  commit: x86_64/pkg/core/userland/findutils/4.9.0/bundles/dev
- name: binutils
  commit: x86_64/pkg/core/toolchain/binutils/2.42/bundles/dev
- name: gzip
  commit: x86_64/pkg/cli/archive/gzip/1.13/bundles/dev
- name: tar
  commit: x86_64/pkg/cli/archive/tar/1.35/bundles/dev
- name: glibc
  commit: x86_64/pkg/libs/system/glibc/2.39/bundles/dev
- name: go
  commit: x86_64/pkg/dev/lang/go/1.26.4/bundles/dev
- name: ncurses
  commit: x86_64/pkg/libs/system/ncurses/6.4-20230520/bundles/dev
- name: acl
  commit: x86_64/pkg/libs/system/acl/2.3.2/bundles/dev
- name: attr
  commit: x86_64/pkg/libs/system/attr/2.5.2/bundles/dev

build:
  environment: 27b6e5dc7ad152c9a17c2cabfcc5ee93daa9bbf0
  profile: [32:2735]

  script: |
    tar --no-same-owner -xf ${SOURCE_duf} -C "${WORK_DIR}" --strip-components=1
    cd ${WORK_DIR}

    tar --no-same-owner -xf /./${SOURCE_vendor} -C "${WORK_DIR}"

    export GOROOT=/usr/lib/go
    export GOPATH=${WORK_DIR}/gopath
    export GOCACHE=${WORK_DIR}/gocache
    export CGO_ENABLED=0
    export GOTOOLCHAIN=local
    mkdir -p ${GOPATH} ${GOCACHE}

    go build -mod=vendor -ldflags="-s -w -X main.Version=0.9.1" -o duf

    mkdir -p ${OUT_DIR}/usr/bin
    install -m 755 duf ${OUT_DIR}/usr/bin/duf

    strip --strip-all ${OUT_DIR}/usr/bin/duf

    find "${OUT_DIR}" -exec touch -d '2024-01-01T00:00:00+00:00' {} \;

bundles:
  dev:
  - bin

outputs:
  bin:
    files:
    - path: /usr/bin/duf
