package:
  schema: 1
  name: screen
  slug: screen
  namespace: cli/system
  version: 5.0.1
  description: Full-screen window manager that multiplexes a physical terminal
  homepage: https://www.gnu.org/software/screen/
  checksum: a51f21c79f3f3271208663a6a3f21198834e317eea79c7a82b4e63b18243ede4

sources:
- name: screen
  url: https://ftp.gnu.org/gnu/screen/screen-5.0.1.tar.gz
  sha256: 2dae36f4db379ffcd14b691596ba6ec18ac3a9e22bc47ac239789ab58409869d

dependencies:
- name: bash
  commit: x86_64/pkg/cli/shells/bash/5.2.21/bundles/dev
- name: coreutils
  commit: x86_64/pkg/core/userland/coreutils/9.5/bundles/dev
- name: findutils
  commit: x86_64/pkg/core/userland/findutils/4.9.0/bundles/dev
- name: gzip
  commit: x86_64/pkg/cli/archive/gzip/1.13/bundles/dev
- name: tar
  commit: x86_64/pkg/cli/archive/tar/1.35/bundles/dev
- name: binutils
  commit: x86_64/pkg/core/toolchain/binutils/2.42/bundles/dev
- name: glibc
  commit: x86_64/pkg/libs/system/glibc/2.39/bundles/dev
- name: gcc
  commit: x86_64/pkg/core/toolchain/gcc/13.2.0/bundles/dev
- name: make
  commit: x86_64/pkg/core/toolchain/make/4.4.1/bundles/dev
- name: linux-headers
  commit: x86_64/pkg/libs/system/linux-headers/6.4.1/bundles/dev
- name: ncurses
  commit: x86_64/pkg/libs/system/ncurses/6.4-20230520/bundles/dev
- name: acl
  commit: x86_64/pkg/libs/system/acl/2.3.2/bundles/dev
- name: attr
  commit: x86_64/pkg/libs/system/attr/2.5.2/bundles/dev
- name: gmp
  commit: x86_64/pkg/libs/system/gmp/6.3.0/bundles/dev
- name: zlib
  commit: x86_64/pkg/libs/system/zlib/1.3.1/bundles/dev
- name: libxcrypt
  commit: x86_64/pkg/libs/system/libxcrypt/4.4.36/bundles/dev
- name: libcap
  commit: x86_64/pkg/libs/security/libcap/2.69/bundles/dev
- name: linux-pam
  commit: x86_64/pkg/libs/security/linux-pam/1.7.1/bundles/dev
- name: sed
  commit: x86_64/pkg/cli/text/sed/4.9/bundles/dev
- name: grep
  commit: x86_64/pkg/cli/text/grep/3.11/bundles/dev
- name: gawk
  commit: x86_64/pkg/cli/text/gawk/5.3.0/bundles/dev
- name: diffutils
  commit: x86_64/pkg/core/userland/diffutils/3.10/bundles/dev
- name: file
  commit: x86_64/pkg/dev/tools/file/5.45/bundles/dev

build:
  environment: 27b6e5dc7ad152c9a17c2cabfcc5ee93daa9bbf0
  profile: [4143:1118, 8363:1120, 12621:1122, 16839:1170, 20942:2168, 23119:2207]

  script: |
    tar --no-same-owner -xf /${SOURCE_screen} -C "${WORK_DIR}" --strip-components=1
    cd "${WORK_DIR}"

    export LIBS="-lcrypt"

    ./configure --prefix=/usr \
      --sysconfdir=/etc

    make
    make DESTDIR="${OUT_DIR}" install

    find "${OUT_DIR}" -type f -executable -exec strip --strip-unneeded {} \; 2>/dev/null || true
    find "${OUT_DIR}" -name '*.a' -exec objcopy --enable-deterministic-archives {} \; 2>/dev/null || true
    find "${OUT_DIR}" -exec touch -d "2024-01-01T00:00:00+00:00" {} \;

bundles:
  dev:
  - bin

outputs:
  bin:
    files:
    - path: /usr/bin/screen
      needs:
      - /usr/lib/ld-linux-x86-64.so.2
      - /usr/lib/libc.so.6
      - /usr/lib/libncursesw.so.6
      - /usr/lib/libpam.so.0
    - path: /usr/bin/screen-5.0.1
      needs:
      - /usr/lib/ld-linux-x86-64.so.2
      - /usr/lib/libc.so.6
      - /usr/lib/libncursesw.so.6
      - /usr/lib/libpam.so.0

  man:
    files:
    - path: /usr/share/man/man1/screen.1

  misc:
    files:
    - path: /usr/share/screen/utf8encodings/01
    - path: /usr/share/screen/utf8encodings/02
    - path: /usr/share/screen/utf8encodings/03
    - path: /usr/share/screen/utf8encodings/04
    - path: /usr/share/screen/utf8encodings/18
    - path: /usr/share/screen/utf8encodings/19
    - path: /usr/share/screen/utf8encodings/a1
    - path: /usr/share/screen/utf8encodings/a3
    - path: /usr/share/screen/utf8encodings/bf
    - path: /usr/share/screen/utf8encodings/c2
    - path: /usr/share/screen/utf8encodings/c3
    - path: /usr/share/screen/utf8encodings/c4
    - path: /usr/share/screen/utf8encodings/c6
    - path: /usr/share/screen/utf8encodings/c7
    - path: /usr/share/screen/utf8encodings/c8
    - path: /usr/share/screen/utf8encodings/cc
    - path: /usr/share/screen/utf8encodings/cd
    - path: /usr/share/screen/utf8encodings/d6

resolution:
  /usr/lib/ld-linux-x86-64.so.2: glibc
  /usr/lib/libc.so.6: glibc
  /usr/lib/libpam.so.0: linux-pam
  /usr/lib/libncursesw.so.6: ncurses
