package:
  schema: 1
  name: dool
  slug: dool
  namespace: cli/system
  version: 1.3.8
  description: Python system resource monitor forked from dstat
  homepage: https://github.com/scottchiefbaker/dool
  checksum: ee5ce1e4faa86a9f26cbac6bdffb783d7e816e6ec5592c44e9a363db123d7789

sources:
- name: dool
  url: https://github.com/scottchiefbaker/dool/archive/refs/tags/v1.3.8.tar.gz
  sha256: efd8b0889542783cd56b11d08e9b571bfbeaad7a21d9d3c586b1e22ae14be1cd

dependencies:
- name: bash
  commit: x86_64/pkg/cli/shells/bash/5.2.21/bundles/dev
- name: coreutils
  commit: x86_64/pkg/core/userland/coreutils/9.5/bundles/dev
- name: findutils
  commit: x86_64/pkg/core/userland/findutils/4.9.0/bundles/dev
- name: make
  commit: x86_64/pkg/core/toolchain/make/4.4.1/bundles/dev
- name: tar
  commit: x86_64/pkg/cli/archive/tar/1.35/bundles/dev
- name: gzip
  commit: x86_64/pkg/cli/archive/gzip/1.13/bundles/dev
- name: python3
  commit: x86_64/pkg/dev/lang/python3/3.12.2/bundles/dev
- name: glibc
  commit: x86_64/pkg/libs/system/glibc/2.39/bundles/dev
- name: ncurses
  commit: x86_64/pkg/libs/system/ncurses/6.4-20230520/bundles/dev
- name: acl
  commit: x86_64/pkg/libs/system/acl/2.3.2/bundles/dev
- name: attr
  commit: x86_64/pkg/libs/system/attr/2.5.2/bundles/dev
- name: zlib
  commit: x86_64/pkg/libs/system/zlib/1.3.1/bundles/dev

build:
  environment: 27b6e5dc7ad152c9a17c2cabfcc5ee93daa9bbf0
  profile: [306:76]

  script: |
    tar --no-same-owner -xf ${SOURCE_dool} -C "${WORK_DIR}" --strip-components=1
    cd ${WORK_DIR}

    make DESTDIR="${OUT_DIR}" install

    find "${OUT_DIR}" -exec touch -d "2024-01-01T00:00:00+00:00" {} \;

bundles:
  dev:
  - bin
  - man
  - misc

outputs:
  bin:
    files:
    - path: /usr/bin/dool
      needs:
      - /usr/bin/python3

  man:
    files:
    - path: /usr/share/man/man1/dool.1

  misc:
    files:
    - path: /usr/share/dool/dool.py
