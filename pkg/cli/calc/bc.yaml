package:
  schema: 1
  name: Bc
  slug: bc
  namespace: cli/calc
  version: 6.7.5
  description: An arbitrary precision numeric processing language
  homepage: https://git.yzena.com/gavin/bc
  checksum: ea75c260081e0e5a181caed9fe448def8c0052b7657383545311c06c9e67f843
sources:
- name: bc
  url: https://github.com/gavinhoward/bc/releases/download/6.7.5/bc-6.7.5.tar.xz
  sha256: c3e02c948d51f3ca9cdb23e011050d2d3a48226c581e0749ed7cbac413ce5461
dependencies:
- name: bash
  commit: x86_64/pkg/bootstrap/phase1/bash/5.2.21/bundles/dev
- name: coreutils
  commit: x86_64/pkg/bootstrap/phase1/coreutils/9.5/bundles/dev
- name: diffutils
  commit: x86_64/pkg/bootstrap/phase1/diffutils/3.10/bundles/dev
- name: findutils
  commit: x86_64/pkg/bootstrap/phase1/findutils/4.9.0/bundles/dev
- name: gawk
  commit: x86_64/pkg/bootstrap/phase1/gawk/5.3.0/bundles/dev
- name: make
  commit: x86_64/pkg/bootstrap/phase1/make/4.4.1/bundles/dev
- name: sed
  commit: x86_64/pkg/bootstrap/phase1/sed/4.9/bundles/dev
- name: tar
  commit: x86_64/pkg/bootstrap/phase1/tar/1.35/bundles/dev
- name: bootstrap_tools
  commit: x86_64/pkg/bootstrap/phase1/bootstrap_tools/0.0.1/bundles/dev
- name: zlib
  commit: x86_64/pkg/bootstrap/phase3/zlib/1.3.1/bundles/dev
- name: binutils
  commit: x86_64/pkg/bootstrap/phase3/binutils/2.42/bundles/dev
- name: gmp-bootstrap
  commit: x86_64/pkg/bootstrap/phase3/gmp-bootstrap/6.3.0/bundles/dev
- name: mpfr
  commit: x86_64/pkg/bootstrap/phase3/mpfr/4.2.1/bundles/dev
- name: gcc
  commit: x86_64/pkg/bootstrap/phase3/gcc/13.2.0/bundles/dev
- name: glibc
  commit: x86_64/pkg/libs/system/glibc/2.39/bundles/dev
- name: mpc
  commit: x86_64/pkg/bootstrap/phase3/mpc/1.2.1/bundles/dev
- name: phase3
  commit: x86_64/pkg/bootstrap/phase3/2nex-utilities-bootstrap/0.0.1/bundles/dev
- name: xz
  commit: x86_64/pkg/bootstrap/phase3/xz/5.4.6/bundles/dev
build:
  script: "tar --no-same-owner -xf ${SOURCE_bc} -C \"${WORK_DIR}\" --strip-components=1\n\
    cd ${WORK_DIR}\n\nCC=gcc ./configure --prefix=/usr -G -O3 -r\nmake\nmake test\
    \  \nmake DESTDIR=\"${OUT_DIR}\" install\n\nfind \"${OUT_DIR}\" -exec touch -d\
    \ '2024-01-01T00:00:00+00:00' {} \\;\n2nex_strip_binaries ${OUT_DIR}\n"
bundles:
  full:
  - bin
  - man
  - locale
  dev:
  - bin
outputs:
  locale:
    files:
    - path: /usr/share/locale/de_AT.UTF-8/bc
