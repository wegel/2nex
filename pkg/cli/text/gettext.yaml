build:
  environment: 27b6e5dc7ad152c9a17c2cabfcc5ee93daa9bbf0
  profile: [41501:25866, 165430:66098, 369008:67749, 613502:72795, 818359:75727, 1022394:76103, 1224178:77091, 1529615:96426, 1835998:102112, 2037900:106723]

  script: |
    tar --no-same-owner -xf ${SOURCE_gettext} -C "${WORK_DIR}" --strip-components=1
    cd "${WORK_DIR}"

    ./configure --prefix=/usr    \
            --disable-static \
            --docdir=/usr/share/doc/gettext-0.22.5

    make
    make DESTDIR=${OUT_DIR} install
    chmod -v 0755 ${OUT_DIR}/usr/lib/preloadable_libintl.so

    find ${OUT_DIR} -type f -executable -exec strip --strip-unneeded {} \; 2>/dev/null || true
    find ${OUT_DIR} -name '*.a' -exec objcopy --enable-deterministic-archives {} \; 2>/dev/null || true
    find "${OUT_DIR}" -exec touch -d '2024-01-01T00:00:00+00:00' {} \;

bundles:
  dev:
  - bin
  - dev
  - gettext
  - lib
  - locale

  full:
  - bin
  - dev
  - doc
  - gettext
  - info
  - lib
  - locale
  - man

