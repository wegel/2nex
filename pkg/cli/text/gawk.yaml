build:
  profile: [4118:1126, 8234:4484, 16673:6328, 24905:7405, 33657:7412, 43061:7414, 51744:8734, 64338:8835, 76882:9218, 82120:9714]

  script: |
    tar --no-same-owner -xf ${SOURCE_gawk} -C "${WORK_DIR}" --strip-components=1
    cd ${WORK_DIR}

    sed -i 's/extras//' Makefile.in
    ./configure --prefix=/usr

    make
    make DESTDIR=${OUT_DIR} install

    find "${OUT_DIR}" -exec touch -d "2024-01-01T00:00:00+00:00" {} \;
    2nex_strip_binaries ${OUT_DIR}

bundles:
  dev:
  - bin
  - dev
  - lib
  - locale
  - misc

  full:
  - bin
  - dev
  - info
  - lib
  - locale
  - man
  - misc

