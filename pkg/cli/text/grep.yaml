package:
  schema: 1
  name: Grep
  slug: grep
  namespace: cli/text
  version: "3.11"
  description: Print lines that match patterns
  homepage: https://www.gnu.org/software/grep/
  checksum: 2cdcb959123292ae9f1a66848981b854b89bdb42d110f15453b56fa660e93e55
  seed: true

sources:
- name: grep
  url: https://ftp.gnu.org/gnu/grep/grep-3.11.tar.xz
  sha256: 1db2aedde89d0dea42b16d9528f894c8d15dae4e190b59aecc78f5a951276eab

dependencies:
- name: linux-headers
  commit: x86_64/pkg/bootstrap/phase1/linux-headers/6.4.1/bundles/dev
- name: glibc
  commit: x86_64/pkg/libs/system/glibc/2.39/bundles/dev
- name: binutils
  commit: x86_64/pkg/bootstrap/phase1/binutils/2.42/bundles/dev
- name: gcc
  commit: x86_64/pkg/bootstrap/phase1/gcc/13.2.0/bundles/dev
- name: zlib
  commit: x86_64/pkg/bootstrap/phase1/zlib/1.3.1/bundles/dev
- name: pcre2
  commit: x86_64/pkg/dev/libs/pcre2/10.44/bundles/dev
- name: texinfo
  commit: x86_64/pkg/cli/text/texinfo/7.1/bundles/dev
- name: bash
  commit: x86_64/pkg/bootstrap/phase1/bash/5.2.21/bundles/dev
- name: coreutils
  commit: x86_64/pkg/bootstrap/phase1/coreutils/9.5/bundles/dev
- name: diffutils
  commit: x86_64/pkg/bootstrap/phase1/diffutils/3.10/bundles/dev
- name: findutils
  commit: x86_64/pkg/bootstrap/phase1/findutils/4.9.0/bundles/dev
- name: gawk
  commit: x86_64/pkg/bootstrap/phase1/gawk/5.3.0/bundles/dev
- name: grep
  commit: x86_64/pkg/bootstrap/phase1/grep/3.11/bundles/dev
- name: make
  commit: x86_64/pkg/bootstrap/phase1/make/4.4.1/bundles/dev
- name: sed
  commit: x86_64/pkg/bootstrap/phase1/sed/4.9/bundles/dev
- name: tar
  commit: x86_64/pkg/bootstrap/phase1/tar/1.35/bundles/dev
- name: xz
  commit: x86_64/pkg/bootstrap/phase1/xz/5.4.6/bundles/dev

build:
  environment: 27b6e5dc7ad152c9a17c2cabfcc5ee93daa9bbf0
  profile: [4129:2855, 8235:7022, 12379:8965, 16544:12016, 20680:15494, 24799:20178, 28916:21434, 33141:21696, 35936:21923]

  script: |
    tar --no-same-owner -xf ${SOURCE_grep} -C "${WORK_DIR}" --strip-components=1
    cd ${WORK_DIR}

    ./configure --prefix=/usr
    grep -q '^#define HAVE_LIBPCRE 1' config.h

    make
    make DESTDIR=${OUT_DIR} install

    find ${OUT_DIR} -type f -executable -exec strip --strip-unneeded {} \; 2>/dev/null || true
    find ${OUT_DIR} -name '*.a' -exec objcopy --enable-deterministic-archives {} \; 2>/dev/null || true
    find "${OUT_DIR}" -exec touch -h -d '2024-01-01T00:00:00+00:00' {} \;

bundles:
  dev:
  - bin
  - locale

  full:
  - bin
  - info
  - locale
  - man

outputs:
  bin:
    files:
    - path: /usr/bin/egrep
    - path: /usr/bin/fgrep
    - path: /usr/bin/grep
      needs:
      - /usr/lib/ld-linux-x86-64.so.2
      - /usr/lib/libc.so.6
      - /usr/lib/libpcre2-8.so.0

  info:
    files:
    - path: /usr/share/info/dir
    - path: /usr/share/info/grep.info

  locale:
    files:
    - path: /usr/share/locale/af/LC_MESSAGES/grep.mo
    - path: /usr/share/locale/be/LC_MESSAGES/grep.mo
    - path: /usr/share/locale/bg/LC_MESSAGES/grep.mo
