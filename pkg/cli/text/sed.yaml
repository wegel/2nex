package:
  schema: 1
  name: Sed
  slug: sed
  namespace: cli/text
  version: "4.9"
  description: A stream editor
  homepage: https://www.gnu.org/software/sed/
  checksum: 4e5f1697d84de155374e916fb8f35925a9af9f7d26f340115100821f1c80e83d
  seed: true

sources:
- name: sed
  url: https://ftp.gnu.org/gnu/sed/sed-4.9.tar.xz
  sha256: 6e226b732e1cd739464ad6862bd1a1aba42d7982922da7a53519631d24975181

dependencies:
- name: linux-headers
  commit: x86_64/pkg/bootstrap/phase3/linux-headers/6.4.1/bundles/dev
- name: glibc
  commit: x86_64/pkg/libs/system/glibc/2.39/bundles/dev
- name: binutils
  commit: x86_64/pkg/bootstrap/phase3/binutils/2.42/bundles/dev
- name: gcc
  commit: x86_64/pkg/bootstrap/phase3/gcc/13.2.0/bundles/dev
- name: zlib
  commit: x86_64/pkg/bootstrap/phase3/zlib/1.3.1/bundles/dev
- name: attr
  commit: x86_64/pkg/libs/system/attr/2.5.2/bundles/dev
- name: acl
  commit: x86_64/pkg/libs/system/acl/2.3.2/bundles/dev
- name: texinfo
  commit: x86_64/pkg/cli/text/texinfo/7.1/bundles/dev
- name: perl
  commit: x86_64/pkg/dev/lang/perl/5.38.2/bundles/dev
- name: bash
  commit: x86_64/pkg/bootstrap/phase3/bash/5.2.21/bundles/dev
- name: coreutils
  commit: x86_64/pkg/bootstrap/phase3/coreutils/9.5/bundles/dev
- name: findutils
  commit: x86_64/pkg/bootstrap/phase3/findutils/4.9.0/bundles/dev
- name: gawk
  commit: x86_64/pkg/bootstrap/phase3/gawk/5.3.0/bundles/dev
- name: grep
  commit: x86_64/pkg/bootstrap/phase3/grep/3.11/bundles/dev
- name: make
  commit: x86_64/pkg/bootstrap/phase3/make/4.4.1/bundles/dev
- name: sed
  commit: x86_64/pkg/bootstrap/phase3/sed/4.9/bundles/dev
- name: tar
  commit: x86_64/pkg/bootstrap/phase3/tar/1.35/bundles/dev
- name: xz
  commit: x86_64/pkg/bootstrap/phase3/xz/5.4.6/bundles/dev

build:
  environment: 27b6e5dc7ad152c9a17c2cabfcc5ee93daa9bbf0
  profile: [4105:3156, 8228:6968, 12328:10590, 16434:14320, 20558:20434, 24676:23176, 28824:25075, 32700:25374]

  script: |
    tar --no-same-owner -xf ${SOURCE_sed} -C "${WORK_DIR}" --strip-components=1
    cd ${WORK_DIR}
    ./configure --prefix=/usr

    make 
    make html

    make DESTDIR=${OUT_DIR} install
    install -d -m755           ${OUT_DIR}/usr/share/doc/sed-4.9
    install -m644 doc/sed.html ${OUT_DIR}/usr/share/doc/sed-4.9

    find ${OUT_DIR} -type f -executable -exec strip --strip-unneeded {} \; 2>/dev/null || true
    find ${OUT_DIR} -name '*.a' -exec objcopy --enable-deterministic-archives {} \; 2>/dev/null || true
    find "${OUT_DIR}" -exec touch -d '2024-01-01T00:00:00+00:00' {} \;

bundles:
  dev:
  - bin
  - locale

  full:
  - bin
  - doc
  - info
  - locale
  - man

outputs:
  bin:
    files:
    - path: /usr/bin/sed
      needs:
      - /usr/lib/ld-linux-x86-64.so.2
      - /usr/lib/libacl.so.1
      - /usr/lib/libc.so.6

  doc:
    files:
    - path: /usr/share/doc/sed-4.9/sed.html

  info:
    files:
    - path: /usr/share/info/dir
    - path: /usr/share/info/sed.info

  locale:
