- commit: x86_64/pkg/libs/system/attr/2.5.2/outputs/lib
  name: attr
- commit: x86_64/pkg/libs/system/acl/2.3.2/bundles/dev
  name: acl
build:
  script: "tar --no-same-owner -xf ${SOURCE_sed} -C \"${WORK_DIR}\" --strip-components=1\n\
    cd ${WORK_DIR}\n./configure --prefix=/usr\n\nmake \nmake html\n\nmake DESTDIR=${OUT_DIR}\
    \ install\ninstall -d -m755           ${OUT_DIR}/usr/share/doc/sed-4.9\ninstall\
    \ -m644 doc/sed.html ${OUT_DIR}/usr/share/doc/sed-4.9\n\nfind \"${OUT_DIR}\" -exec\
    \ touch -d \"2024-01-01T00:00:00+00:00\" {} \\;\n2nex_strip_binaries ${OUT_DIR}\n"
bundles:
  dev:
  - bin
  - locale
  full:
  - man
  - doc
  - bin
  - info
  - locale
outputs:
  man:
    files:
    - /usr/share/man/man1/sed.1
  doc:
    files:
    - /usr/share/doc/sed-4.9/sed.html
  bin:
    files:
    - /usr/bin/sed
    requires:
    - x86_64/pkg/libs/system/acl/2.3.2/outputs/lib
    - x86_64/pkg/libs/system/glibc/2.39/outputs/lib
  info:
    files:
    - /usr/share/info/dir
    - /usr/share/info/sed.info
  locale:
