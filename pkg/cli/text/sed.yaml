  commit: x86_64/pkg/bootstrap/phase2/texinfo/7.1/bundles/dev
- name: xz
  commit: x86_64/pkg/bootstrap/phase3/xz/5.4.6/bundles/dev
- name: bzip2
  commit: x86_64/pkg/bootstrap/phase3/bzip2/1.0.8/bundles/dev
- name: zlib
  commit: x86_64/pkg/bootstrap/phase3/zlib/1.3.1/bundles/dev
- name: file
  commit: x86_64/pkg/bootstrap/phase3/file/5.45/bundles/dev
- name: binutils
  commit: x86_64/pkg/bootstrap/phase3/binutils/2.42/bundles/dev
- name: gmp-bootstrap
  commit: x86_64/pkg/bootstrap/phase3/gmp-bootstrap/6.3.0/bundles/dev
- name: mpfr
  commit: x86_64/pkg/bootstrap/phase3/mpfr/4.2.1/bundles/dev
- name: mpc
  commit: x86_64/pkg/bootstrap/phase3/mpc/1.2.1/bundles/dev
- name: gcc
  commit: x86_64/pkg/bootstrap/phase3/gcc/13.2.0/bundles/dev
- name: linux-headers
  commit: x86_64/pkg/bootstrap/phase3/linux-headers/6.4.1/bundles/dev
- name: glibc
  commit: x86_64/pkg/libs/system/glibc/2.39/bundles/dev
- name: attr
  commit: x86_64/pkg/libs/system/attr/2.5.2/bundles/dev
- name: acl
  commit: x86_64/pkg/libs/system/acl/2.3.2/bundles/dev
build:
  script: "tar --no-same-owner -xf ${SOURCE_sed} -C \"${WORK_DIR}\" --strip-components=1\ncd ${WORK_DIR}\n./configure --prefix=/usr\n\nmake \nmake html\n\nmake DESTDIR=${OUT_DIR} install\ninstall -d -m755           ${OUT_DIR}/usr/share/doc/sed-4.9\ninstall -m644 doc/sed.html ${OUT_DIR}/usr/share/doc/sed-4.9\n\nfind \"${OUT_DIR}\" -exec touch -d \"2024-01-01T00:00:00+00:00\" {} \\;\n2nex_strip_binaries ${OUT_DIR}\n"
bundles:
  dev:
  - bin
  - locale
  full:
  - man
  - doc
  - bin
  - info
  - locale
outputs:
  man:
    files:
    - path: /usr/share/man/man1/sed.1
  doc:
    files:
    - path: /usr/share/doc/sed-4.9/sed.html
  bin:
    files:
    - path: /usr/bin/sed
      needs:
      - /usr/lib/libacl.so.1
      - /usr/lib/libc.so.6
      - /usr/lib/ld-linux-x86-64.so.2
  info:
    files:
    - path: /usr/share/info/dir
    - path: /usr/share/info/sed.info
  locale:
    files:
    - path: /usr/share/locale/af/LC_MESSAGES/sed.mo
    - path: /usr/share/locale/ast/LC_MESSAGES/sed.mo
    - path: /usr/share/locale/bg/LC_MESSAGES/sed.mo
