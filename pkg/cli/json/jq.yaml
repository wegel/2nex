package:
  schema: 1
  name: jq
  slug: jq
  namespace: cli/json
  version: 1.8.2
  description: Command-line JSON processor
  homepage: https://jqlang.org/
  checksum: f8bbdc4a0a3bed736f9bcca54ce54a87f2d5eb2e51b1fde489b830a4c4a95e8e

sources:
- name: jq
  url: https://github.com/jqlang/jq/releases/download/jq-1.8.2/jq-1.8.2.tar.gz
  sha256: 71b8d6e8f5fe81f6c6d0d110e3892251f6ce76ed095abd315e26e6e1193af3af

dependencies:
- name: bash
  commit: x86_64/pkg/cli/shells/bash/5.2.21/bundles/dev
- name: coreutils
  commit: x86_64/pkg/core/userland/coreutils/9.5/bundles/dev
- name: findutils
  commit: x86_64/pkg/core/userland/findutils/4.9.0/bundles/dev
- name: gzip
  commit: x86_64/pkg/cli/archive/gzip/1.13/bundles/dev
- name: tar
  commit: x86_64/pkg/cli/archive/tar/1.35/bundles/dev
- name: binutils
  commit: x86_64/pkg/core/toolchain/binutils/2.42/bundles/dev
- name: glibc
  commit: x86_64/pkg/libs/system/glibc/2.39/bundles/dev
- name: gcc
  commit: x86_64/pkg/core/toolchain/gcc/13.2.0/bundles/dev
- name: make
  commit: x86_64/pkg/core/toolchain/make/4.4.1/bundles/dev
- name: linux-headers
  commit: x86_64/pkg/libs/system/linux-headers/6.4.1/bundles/dev
- name: ncurses
  commit: x86_64/pkg/libs/system/ncurses/6.4-20230520/bundles/dev
- name: acl
  commit: x86_64/pkg/libs/system/acl/2.3.2/bundles/dev
- name: attr
  commit: x86_64/pkg/libs/system/attr/2.5.2/bundles/dev
- name: gmp
  commit: x86_64/pkg/libs/system/gmp/6.3.0/bundles/dev
- name: zlib
  commit: x86_64/pkg/libs/system/zlib/1.3.1/bundles/dev
- name: libcap
  commit: x86_64/pkg/libs/security/libcap/2.69/bundles/dev
- name: sed
  commit: x86_64/pkg/cli/text/sed/4.9/bundles/dev
- name: grep
  commit: x86_64/pkg/cli/text/grep/3.11/bundles/dev
- name: gawk
  commit: x86_64/pkg/cli/text/gawk/5.3.0/bundles/dev
- name: oniguruma
  commit: x86_64/pkg/libs/text/oniguruma/6.9.10/bundles/dev

build:
  environment: 27b6e5dc7ad152c9a17c2cabfcc5ee93daa9bbf0
  profile: [4165:11891, 8276:18749, 11243:23878]

  script: |
    tar --no-same-owner -xf /${SOURCE_jq} -C "${WORK_DIR}" --strip-components=1
    cd "${WORK_DIR}"

    ./configure --prefix=/usr \
      --disable-maintainer-mode \
      --disable-docs \
      --with-oniguruma=/usr

    make
    make DESTDIR="${OUT_DIR}" install

    find "${OUT_DIR}" -type f -executable -exec strip --strip-unneeded {} \; 2>/dev/null || true
    find "${OUT_DIR}" -name '*.a' -exec objcopy --enable-deterministic-archives {} \; 2>/dev/null || true
    find "${OUT_DIR}" -exec touch -d "2024-01-01T00:00:00+00:00" {} \;

bundles:
  dev:
  - bin

outputs:
  bin:
    files:
    - path: /usr/bin/jq
      needs:
      - /usr/lib/ld-linux-x86-64.so.2
      - /usr/lib/libc.so.6
      - /usr/lib/libjq.so.1
      - /usr/lib/libonig.so.5

  dev:
    files:
    - path: /usr/include/jq.h
    - path: /usr/include/jv.h
    - path: /usr/lib/libjq.la
    - path: /usr/lib/pkgconfig/libjq.pc

  doc:
    files:
    - path: /usr/share/doc/jq/AUTHORS
    - path: /usr/share/doc/jq/COPYING
    - path: /usr/share/doc/jq/NEWS.md
    - path: /usr/share/doc/jq/README.md

  lib:
    files:
    - path: /usr/lib/libjq.so
      needs:
      - /usr/lib/ld-linux-x86-64.so.2
      - /usr/lib/libc.so.6
      - /usr/lib/libm.so.6
      - /usr/lib/libonig.so.5
    - path: /usr/lib/libjq.so.1
      needs:
      - /usr/lib/ld-linux-x86-64.so.2
      - /usr/lib/libc.so.6
      - /usr/lib/libm.so.6
      - /usr/lib/libonig.so.5
    - path: /usr/lib/libjq.so.1.0.4
      needs:
      - /usr/lib/ld-linux-x86-64.so.2
      - /usr/lib/libc.so.6
      - /usr/lib/libm.so.6
      - /usr/lib/libonig.so.5

  man:
    files:
    - path: /usr/share/man/man1/jq.1

  static:
    files:
    - path: /usr/lib/libjq.a

resolution:
  /usr/lib/ld-linux-x86-64.so.2: glibc
  /usr/lib/libc.so.6: glibc
  /usr/lib/libm.so.6: glibc
  /usr/lib/libonig.so.5: oniguruma
  /usr/lib/libjq.so.1: self
