package:
  schema: 1
  name: curl
  slug: curl
  namespace: cli/net
  version: 8.17.0
  description: Command line tool and library for transferring data with URLs
  homepage: https://curl.se/
  checksum: ef7bab24e01b4333d6e6ad5bc59869e93c43e535efba35ead26ad5bafd4a4953
sources:
- name: curl
  url: https://curl.se/download/curl-8.17.0.tar.xz
  sha256: 955f6e729ad6b3566260e8fef68620e76ba3c31acf0a18524416a185acf77992
dependencies:
- name: glibc
  commit: x86_64/pkg/libs/system/glibc/2.39/bundles/dev
- name: gcc
  commit: x86_64/pkg/core/toolchain/gcc/13.2.0/bundles/dev
- name: bash
  commit: x86_64/pkg/cli/shells/bash/5.2.21/bundles/dev
- name: attr
  commit: x86_64/pkg/libs/system/attr/2.5.2/bundles/dev
- name: acl
  commit: x86_64/pkg/libs/system/acl/2.3.2/bundles/dev
- name: libcap
  commit: x86_64/pkg/libs/security/libcap/2.69/bundles/dev
- name: coreutils
  commit: x86_64/pkg/core/userland/coreutils/9.5/bundles/dev
- name: findutils
  commit: x86_64/pkg/core/userland/findutils/4.9.0/bundles/dev
- name: phase3
  commit: x86_64/pkg/bootstrap/phase3/2nex-utilities-bootstrap/0.0.1/bundles/dev
- name: gawk
  commit: x86_64/pkg/cli/text/gawk/5.3.0/bundles/dev
- name: grep
  commit: x86_64/pkg/cli/text/grep/3.11/bundles/dev
- name: make
  commit: x86_64/pkg/core/toolchain/make/4.4.1/bundles/dev
- name: sed
  commit: x86_64/pkg/cli/text/sed/4.9/bundles/dev
- name: tar
  commit: x86_64/pkg/cli/archive/tar/1.35/bundles/dev
- name: binutils
  commit: x86_64/pkg/bootstrap/phase3/binutils/2.42/bundles/dev
- name: gmp-bootstrap
  commit: x86_64/pkg/bootstrap/phase3/gmp-bootstrap/6.3.0/bundles/dev
- name: mpfr
  commit: x86_64/pkg/bootstrap/phase3/mpfr/4.2.1/bundles/dev
- name: mpc
  commit: x86_64/pkg/bootstrap/phase3/mpc/1.2.1/bundles/dev
- name: linux-headers
  commit: x86_64/pkg/bootstrap/phase3/linux-headers/6.4.1/bundles/dev
- name: zlib
  commit: x86_64/pkg/libs/system/zlib/1.3.1/bundles/dev
- name: xz
  commit: x86_64/pkg/libs/compression/xz/5.4.6/bundles/dev
- name: ncurses
  commit: x86_64/pkg/libs/system/ncurses/6.4-20230520/bundles/dev
- name: openssl
  commit: x86_64/pkg/dev/libs/openssl3/3.3.1/bundles/dev
- name: zstd
  commit: x86_64/pkg/libs/compression/zstd/1.5.6/bundles/dev
build:
  script: |
    tar --no-same-owner -xf ${SOURCE_curl} -C "${WORK_DIR}" --strip-components=1
    cd ${WORK_DIR}

    ./configure \
      --prefix=/usr \
      --disable-static \
      --with-openssl \
      --enable-threaded-resolver \
      --with-ca-path=/etc/ssl/certs \
      --without-libpsl \
      --without-libidn2 \
      --without-libssh2 \
      --without-brotli \
      --with-zstd \
      --without-nghttp2 \
      --without-nghttp3 \
      --without-ngtcp2

    make
    make DESTDIR="${OUT_DIR}" install

    # remove libtool archives
    find "${OUT_DIR}" -name '*.la' -delete

    find "${OUT_DIR}" -exec touch -d '2024-01-01T00:00:00+00:00' {} \;
    2nex_strip_binaries ${OUT_DIR}
bundles:
  full:
  - bin
  - lib
  - dev
  dev:
  - bin
  - lib
  - dev
outputs:
  bin:
    files:
    - path: /usr/bin/curl
      needs:
      - /usr/lib/libcurl.so.4
      - /usr/lib/libz.so.1
      - /usr/lib/libc.so.6
      - /usr/lib/ld-linux-x86-64.so.2
    - path: /usr/bin/curl-config
    - path: /usr/bin/wcurl
  dev:
    files:
    - path: /usr/include/curl/curl.h
    - path: /usr/include/curl/curlver.h
    - path: /usr/include/curl/easy.h
    - path: /usr/include/curl/header.h
    - path: /usr/include/curl/mprintf.h
    - path: /usr/include/curl/multi.h
    - path: /usr/include/curl/options.h
    - path: /usr/include/curl/stdcheaders.h
    - path: /usr/include/curl/system.h
    - path: /usr/include/curl/typecheck-gcc.h
    - path: /usr/include/curl/urlapi.h
    - path: /usr/include/curl/websockets.h
    - path: /usr/lib/pkgconfig/libcurl.pc
  lib:
    files:
    - path: /usr/lib/libcurl.so
      needs:
      - /usr/lib/libssl.so.3
      - /usr/lib/libcrypto.so.3
      - /usr/lib/libzstd.so.1
      - /usr/lib/libz.so.1
      - /usr/lib/libc.so.6
    - path: /usr/lib/libcurl.so.4
      needs:
      - /usr/lib/libssl.so.3
      - /usr/lib/libcrypto.so.3
      - /usr/lib/libzstd.so.1
      - /usr/lib/libz.so.1
      - /usr/lib/libc.so.6
    - path: /usr/lib/libcurl.so.4.8.0
      needs:
      - /usr/lib/libssl.so.3
      - /usr/lib/libcrypto.so.3
      - /usr/lib/libzstd.so.1
      - /usr/lib/libz.so.1
      - /usr/lib/libc.so.6
  misc:
    files:
    - path: /usr/share/aclocal/libcurl.m4

resolution:
  /usr/lib/libz.so.1: zlib
  /usr/lib/ld-linux-x86-64.so.2: glibc
  /usr/lib/libcrypto.so.3: openssl
  /usr/lib/libzstd.so.1: zstd
  /usr/lib/libssl.so.3: openssl
  /usr/lib/libc.so.6: glibc
  /usr/lib/libcurl.so.4: '@self'
