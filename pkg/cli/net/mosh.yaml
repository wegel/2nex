  /usr/lib/libstdc++.so.6: gcc
  /usr/lib/ld-linux-x86-64.so.2: glibc
  /usr/lib/libc.so.6: glibc
  /usr/lib/libm.so.6: glibc
  /usr/lib/libabsl_log_internal_check_op.so.2501.0.0: libabseil-cpp
  /usr/lib/libabsl_log_internal_message.so.2501.0.0: libabseil-cpp
  /usr/lib/libncursesw.so.6: ncurses
