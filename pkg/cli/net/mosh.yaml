build:
  environment: 27b6e5dc7ad152c9a17c2cabfcc5ee93daa9bbf0
  profile: [4099:2325, 8204:5677, 12338:10481, 16236:12425]

  script: |
    export CFLAGS="${CFLAGS//-flto=auto/}"
    export CXXFLAGS="${CXXFLAGS//-flto=auto/} -std=gnu++17"
    export LDFLAGS="${LDFLAGS//-flto=auto/}"

    tar --no-same-owner -xf ${SOURCE_mosh} -C "${WORK_DIR}" --strip-components=1
    cd ${WORK_DIR}

    export PKG_CONFIG_PATH="/usr/lib/pkgconfig:/usr/share/pkgconfig"

    ./configure \
      --prefix=/usr \
      --sysconfdir=/etc \
      --with-crypto-library=openssl \
      --without-utempter \
      --with-ncursesw \
      --enable-client \
      --enable-server \
      --enable-compile-warnings=yes

    make
    make DESTDIR="${OUT_DIR}" install
    sed -i '1s|.*|#!/usr/bin/perl|' "${OUT_DIR}/usr/bin/mosh"

    find ${OUT_DIR} -type f -executable -exec strip --strip-unneeded {} \; 2>/dev/null || true
    find "${OUT_DIR}" -exec touch -d '2024-01-01T00:00:00+00:00' {} \;

bundles:
  dev:
  - bin
  - man

outputs:
  bin:
    files:
    - path: /usr/bin/mosh
      needs:
      - /usr/bin/perl
      - /usr/bin/ssh
    - path: /usr/bin/mosh-client
      needs:
      - /usr/lib/ld-linux-x86-64.so.2
      - /usr/lib/libabsl_log_internal_check_op.so.2501.0.0
      - /usr/lib/libabsl_log_internal_message.so.2501.0.0
      - /usr/lib/libc.so.6
      - /usr/lib/libcrypto.so.3
      - /usr/lib/libgcc_s.so.1
      - /usr/lib/libm.so.6
      - /usr/lib/libncursesw.so.6
      - /usr/lib/libprotobuf.so.30.2.0
      - /usr/lib/libstdc++.so.6
      - /usr/lib/libz.so.1
    - path: /usr/bin/mosh-server
      needs:
      - /usr/lib/ld-linux-x86-64.so.2
      - /usr/lib/libabsl_log_internal_check_op.so.2501.0.0
      - /usr/lib/libabsl_log_internal_message.so.2501.0.0
      - /usr/lib/libc.so.6
      - /usr/lib/libcrypto.so.3
      - /usr/lib/libgcc_s.so.1
      - /usr/lib/libm.so.6
      - /usr/lib/libncursesw.so.6
      - /usr/lib/libprotobuf.so.30.2.0
      - /usr/lib/libstdc++.so.6
      - /usr/lib/libz.so.1

  man:
    files:
    - path: /usr/share/man/man1/mosh-client.1
    - path: /usr/share/man/man1/mosh-server.1
    - path: /usr/share/man/man1/mosh.1

resolution:
