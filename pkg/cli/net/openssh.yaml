package:
  schema: 1
  name: OpenSSH
  slug: openssh
  namespace: cli/net
  version: 9.9p1
  description: OpenSSH SSH client and server
  homepage: https://www.openssh.com/
  checksum: b9b50e17f25c18b3bb3e19f4e4bc4f2ae9e9de278b53daa2bd493b85f3f91558

sources:
- name: openssh
  url: https://cdn.openbsd.org/pub/OpenBSD/OpenSSH/portable/openssh-9.9p1.tar.gz
  sha256: b343fbcdbff87f15b1986e6e15d6d4fc9a7d36066be6b7fb507087ba8f966c02
- name: uapi_config_patch
  file: pkg/cli/net/openssh-uapi-config.patch
  sha256: 82960c13c7cfdf3ecf14722f22cec2872052ffc6558a4d69778a6d1dfed34963

