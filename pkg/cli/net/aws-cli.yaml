build:
  environment: 27b6e5dc7ad152c9a17c2cabfcc5ee93daa9bbf0
  profile: [4125:6441, 8257:9057, 12370:11159, 14110:15858]

  script: |
    set -eux

    mkdir -p "${WORK_DIR}/sources" "${WORK_DIR}/wheels"

    cp "/${SOURCE_jmespath}" "${WORK_DIR}/sources/jmespath-1.1.0.tar.gz"
    cp "/${SOURCE_six}" "${WORK_DIR}/sources/six-1.17.0.tar.gz"
    cp "/${SOURCE_pyasn1}" "${WORK_DIR}/sources/pyasn1-0.6.3.tar.gz"
    cp "/${SOURCE_colorama}" "${WORK_DIR}/sources/colorama-0.4.4.tar.gz"
    cp "/${SOURCE_urllib3}" "${WORK_DIR}/sources/urllib3-1.26.20.tar.gz"
    cp "/${SOURCE_python_dateutil}" "${WORK_DIR}/sources/python-dateutil-2.9.0.post0.tar.gz"
    cp "/${SOURCE_rsa}" "${WORK_DIR}/sources/rsa-4.7.2.tar.gz"
    cp "/${SOURCE_docutils}" "${WORK_DIR}/sources/docutils-0.19.tar.gz"
    cp "/${SOURCE_pyyaml}" "${WORK_DIR}/sources/pyyaml-6.0.3.tar.gz"
    cp "/${SOURCE_botocore}" "${WORK_DIR}/sources/botocore-1.43.36.tar.gz"
    cp "/${SOURCE_s3transfer}" "${WORK_DIR}/sources/s3transfer-0.19.0.tar.gz"
    cp "/${SOURCE_awscli}" "${WORK_DIR}/sources/awscli-1.45.36.tar.gz"

    for source in "${WORK_DIR}"/sources/*.tar.gz
    do
      PYTHONDONTWRITEBYTECODE=1 \
        PYYAML_FORCE_LIBYAML=0 \
        python3 -m pip wheel --no-cache-dir --no-build-isolation --no-deps \
        -w "${WORK_DIR}/wheels" "${source}"
    done

    PYTHONDONTWRITEBYTECODE=1 \
      python3 -m pip install --no-index --no-deps --no-compile \
      --root="${OUT_DIR}" --prefix=/usr --find-links "${WORK_DIR}/wheels" \
      jmespath six pyasn1 colorama urllib3 python-dateutil rsa docutils \
      PyYAML botocore s3transfer awscli

    find "${OUT_DIR}/usr/bin" -type f -exec \
      sed -i '1s|^#!/usr/sbin/python3$|#!/usr/bin/python3|' {} \;

    find "${OUT_DIR}/usr/bin" -type f -exec sh -c '
      for script
      do
        first_line=$(head -n 1 "${script}")
        if [ "${first_line}" = "#!/usr/bin/python3" ]
        then
          sed -i "2iimport os, sys\\nsys.path.insert(0, os.path.join(os.path.dirname(os.path.dirname(os.path.realpath(__file__))), \"lib\", \"python3.12\", \"site-packages\"))" "${script}"
        fi
      done
    ' sh {} +

    find "${OUT_DIR}" -exec touch -d "2024-01-01T00:00:00+00:00" {} \;

