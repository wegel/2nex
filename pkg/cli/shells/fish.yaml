build:
  environment: 27b6e5dc7ad152c9a17c2cabfcc5ee93daa9bbf0
  profile: [4097:6961, 4499:53463]

  script: |
    tar --no-same-owner -xf ${SOURCE_fish} -C "${WORK_DIR}" --strip-components=1
    cd ${WORK_DIR}

    patch --batch --fuzz=0 -Np1 -i "/${SOURCE_uapi_config}"

    tar --no-same-owner -xf /./${SOURCE_vendor} -C "${WORK_DIR}"

    export CARGO_HOME="${WORK_DIR}/.cargo"
    mkdir -p "${CARGO_HOME}"

    cat > "${CARGO_HOME}/config.toml" << EOF
    [source.crates-io]
    replace-with = "vendored-sources"

    [source.vendored-sources]
    directory = "vendor"

    [source."git+https://github.com/fish-shell/rust-pcre2?tag=0.2.9-utf32"]
    git = "https://github.com/fish-shell/rust-pcre2"
    tag = "0.2.9-utf32"
    replace-with = "vendored-sources"
    EOF

    rm -rf vendor/pcre2-sys-0.2.9
    cp -a vendor/pcre2-0.2.9/pcre2-sys vendor/pcre2-sys-0.2.9
    printf '{"files":{},"package":null}' > vendor/pcre2-sys-0.2.9/.cargo-checksum.json

    mkdir -p /usr/local/bin
    ln -sf /usr/bin/gcc /usr/local/bin/cc
    ln -sf /usr/bin/ld.bfd /usr/local/bin/ld
    export PATH="/usr/local/bin:${PATH}"
    export PKG_CONFIG_PATH="/usr/lib/pkgconfig:/usr/share/pkgconfig"
    export CARGO_TARGET_X86_64_UNKNOWN_LINUX_GNU_LINKER=gcc
    export RUSTFLAGS="-C codegen-units=1 -C embed-bitcode=yes -C debuginfo=0"
    export CFLAGS="${CFLAGS//-flto=auto/}"
    export CXXFLAGS="${CXXFLAGS//-flto=auto/}"
    export LDFLAGS="${LDFLAGS//-flto=auto/}"

    cmake -S . -B build \
      -DCMAKE_BUILD_TYPE=Release \
      -DCMAKE_INSTALL_PREFIX=/usr \
      -DCMAKE_INSTALL_LIBDIR=lib \
      -DCMAKE_INSTALL_SYSCONFDIR=/etc \
      -DRust_CARGO=/usr/bin/cargo \
      -DRust_COMPILER=/usr/bin/rustc \
      -DRust_CARGO_TARGET=x86_64-unknown-linux-gnu \
      -DCARGO_FLAGS=--offline \
      -DWITH_MESSAGE_LOCALIZATION=ON \
      -DFISH_USE_SYSTEM_PCRE2=OFF

    cmake --build build
    DESTDIR="${OUT_DIR}" cmake --install build

    rm "${OUT_DIR}/etc/fish/config.fish"
    rmdir \
      "${OUT_DIR}/etc/fish/completions" \
      "${OUT_DIR}/etc/fish/conf.d" \
      "${OUT_DIR}/etc/fish/functions" \
      "${OUT_DIR}/etc/fish" \
      "${OUT_DIR}/etc"

    smoke_name=99-uapi-config-smoke.fish
    smoke_vendor="${OUT_DIR}/usr/share/fish/vendor_conf.d/${smoke_name}"
    smoke_run="/run/fish/conf.d/${smoke_name}"
    smoke_admin="/etc/fish/conf.d/${smoke_name}"
    smoke_user="${WORK_DIR}/smoke-user/fish/conf.d/${smoke_name}"
    cleanup_smoke() {
      rm -f "${smoke_vendor}" "${smoke_run}" "${smoke_admin}" "${smoke_user}"
    }
    trap cleanup_smoke EXIT

    mkdir -p \
      "${OUT_DIR}/usr/share/fish/vendor_conf.d" \
      /run/fish/conf.d \
      /etc/fish/conf.d \
      "${WORK_DIR}/smoke-user/fish/conf.d"

    printf 'set -g uapi_test_tier vendor\n' > "${smoke_vendor}"
    XDG_CONFIG_HOME="${WORK_DIR}/smoke-user" \
      XDG_DATA_DIRS="${OUT_DIR}/usr/share" \
      "${OUT_DIR}/usr/bin/fish" -c 'test "$uapi_test_tier" = vendor'

    printf 'set -g uapi_test_tier transient\n' > "${smoke_run}"
    XDG_CONFIG_HOME="${WORK_DIR}/smoke-user" \
      XDG_DATA_DIRS="${OUT_DIR}/usr/share" \
      "${OUT_DIR}/usr/bin/fish" -c 'test "$uapi_test_tier" = transient'

    printf 'set -g uapi_test_tier administrator\n' > "${smoke_admin}"
    XDG_CONFIG_HOME="${WORK_DIR}/smoke-user" \
      XDG_DATA_DIRS="${OUT_DIR}/usr/share" \
      "${OUT_DIR}/usr/bin/fish" -c 'test "$uapi_test_tier" = administrator'

    printf 'set -g uapi_test_tier user\n' > "${smoke_user}"
    XDG_CONFIG_HOME="${WORK_DIR}/smoke-user" \
      XDG_DATA_DIRS="${OUT_DIR}/usr/share" \
      "${OUT_DIR}/usr/bin/fish" -c 'test "$uapi_test_tier" = user'

    rm "${smoke_user}"
    : > "${smoke_admin}"
    XDG_CONFIG_HOME="${WORK_DIR}/smoke-user" \
      XDG_DATA_DIRS="${OUT_DIR}/usr/share" \
      "${OUT_DIR}/usr/bin/fish" -c 'not set -q uapi_test_tier'

    cleanup_smoke
    trap - EXIT

    find ${OUT_DIR} -type f -executable -exec strip --strip-unneeded {} \; 2>/dev/null || true
    find "${OUT_DIR}" -exec touch -d '2024-01-01T00:00:00+00:00' {} \;

