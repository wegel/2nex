package:
  schema: 1
  name: Bash Completion
  slug: bash-completion
  namespace: cli/shells
  version: 2.17.0
  description: Programmable completion functions for Bash
  homepage: https://github.com/scop/bash-completion
  checksum: 9b5ee85942099ee315a1d32912c79e6fea6dcc9f1fbc6a4a7169b283ff483c39

sources:
- name: bash_completion
  url: https://github.com/scop/bash-completion/releases/download/2.17.0/bash-completion-2.17.0.tar.xz
  sha256: dd9d825e496435fb3beba3ae7bea9f77e821e894667d07431d1d4c8c570b9e58

dependencies:
- name: bash
  commit: x86_64/pkg/cli/shells/bash/5.2.21/bundles/dev
- name: coreutils
  commit: x86_64/pkg/core/userland/coreutils/9.5/bundles/dev
- name: findutils
  commit: x86_64/pkg/core/userland/findutils/4.9.0/bundles/dev
- name: gawk
  commit: x86_64/pkg/cli/text/gawk/5.3.0/bundles/dev
- name: grep
  commit: x86_64/pkg/cli/text/grep/3.11/bundles/dev
- name: make
  commit: x86_64/pkg/core/toolchain/make/4.4.1/bundles/dev
- name: sed
  commit: x86_64/pkg/cli/text/sed/4.9/bundles/dev
- name: tar
  commit: x86_64/pkg/cli/archive/tar/1.35/bundles/dev
- name: xz
  commit: x86_64/pkg/libs/compression/xz/5.4.6/bundles/dev

build:
  environment: 27b6e5dc7ad152c9a17c2cabfcc5ee93daa9bbf0
  profile: [4102:482, 8210:779, 12322:931, 16426:1055, 20536:1365, 24960:1502, 29059:1549, 37260:1906, 45476:2093, 46629:2534]

  script: |
    set -eu
    tar --no-same-owner -xf "${SOURCE_bash_completion}" -C "${WORK_DIR}" --strip-components=1
    cd "${WORK_DIR}"

    ./configure --prefix=/usr --sysconfdir=/etc
    make
    make DESTDIR="${OUT_DIR}" install

    mkdir -p "${OUT_DIR}/etc/bash_completion.d"
    ln -s /usr/share/bash-completion/bash_completion "${OUT_DIR}/etc/bash_completion"
    find "${OUT_DIR}" -exec touch -h -d '2024-01-01T00:00:00+00:00' {} \;

bundles:
  full:
  - conf
  - misc

outputs:
  conf:
    files:
    - path: /etc/bash_completion
    - path: /etc/bash_completion.d/000_bash_completion_compat.bash
    - path: /etc/profile.d/bash_completion.sh

  dev:
    files:
    - path: /usr/share/pkgconfig/bash-completion.pc

