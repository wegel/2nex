build:
  environment: 27b6e5dc7ad152c9a17c2cabfcc5ee93daa9bbf0
  profile: [4102:12575, 12336:117506, 20579:138104, 32956:148071, 45298:150059, 53550:151656, 66059:172657, 82804:235418, 95394:301765, 105058:327990]

  script: |
    tar --no-same-owner -xJf /${SOURCE_zsh} -C "${WORK_DIR}" --strip-components=1
    cd ${WORK_DIR}

    ./configure \
      --prefix=/usr \
      --enable-pcre \
      --enable-cap \
      --enable-multibyte \
      --with-tcsetpgrp \
      --enable-zsh-secure-free

    make
    make DESTDIR="${OUT_DIR}" install

    find ${OUT_DIR} -type f -executable -exec strip --strip-unneeded {} \; 2>/dev/null || true
    find ${OUT_DIR} -name '*.a' -exec objcopy --enable-deterministic-archives {} \; 2>/dev/null || true
    find "${OUT_DIR}" -exec touch -d "2024-01-01T00:00:00+00:00" {} \;

