package:
  schema: 1
  name: helix
  slug: helix
  namespace: cli/editor
  version: 25.01.1
  description: A post-modern modal text editor
  homepage: https://helix-editor.com
  checksum: 7eec19a538b43c7f970c57f0c564b42c8e058ba9fa47c8381c835943a87d899d

sources:
- name: helix
  url: https://github.com/helix-editor/helix/archive/refs/tags/25.01.1.tar.gz
  sha256: 3f2364463e2e58b0e78ea16fd37a23a93ec2b086323b9ca1e6e310d86a9b3663
- name: vendor
  sha256: 06feb258a5dbfb4966c66942159c8b5913208014f181156716e7a2ee6e2e810a
  cargo_lock: https://raw.githubusercontent.com/helix-editor/helix/25.01.1/Cargo.lock

dependencies:
- name: bash
  commit: x86_64/pkg/cli/shells/bash/5.2.21/bundles/dev
- name: coreutils
  commit: x86_64/pkg/core/userland/coreutils/9.5/bundles/dev
- name: findutils
  commit: x86_64/pkg/core/userland/findutils/4.9.0/bundles/dev
- name: gzip
  commit: x86_64/pkg/cli/archive/gzip/1.13/bundles/dev
- name: tar
  commit: x86_64/pkg/cli/archive/tar/1.35/bundles/dev
- name: binutils
  commit: x86_64/pkg/core/toolchain/binutils/2.42/bundles/dev
- name: glibc
  commit: x86_64/pkg/libs/system/glibc/2.39/bundles/dev
- name: gcc
  commit: x86_64/pkg/core/toolchain/gcc/13.2.0/bundles/dev
- name: rust-bin
  commit: x86_64/pkg/dev/lang/rust-bin/1.91.1/bundles/dev
- name: ncurses
  commit: x86_64/pkg/libs/system/ncurses/6.4-20230520/bundles/dev
- name: acl
  commit: x86_64/pkg/libs/system/acl/2.3.2/bundles/dev
- name: attr
  commit: x86_64/pkg/libs/system/attr/2.5.2/bundles/dev
- name: zlib
  commit: x86_64/pkg/libs/system/zlib/1.3.1/bundles/dev
- name: linux-headers
  commit: x86_64/pkg/libs/system/linux-headers/6.4.1/bundles/dev

build:
  environment: 27b6e5dc7ad152c9a17c2cabfcc5ee93daa9bbf0
  profile: [4100:4287, 12315:14134, 24718:93035, 41102:93078, 53390:93115, 69774:93160, 82062:93193, 102542:93253, 123022:93318, 133070:93347]

  script: |
    tar --no-same-owner -xf ${SOURCE_helix} -C "${WORK_DIR}" --strip-components=1
    cd ${WORK_DIR}

    tar --no-same-owner -xf /./${SOURCE_vendor} -C "${WORK_DIR}"

    export CARGO_HOME="${WORK_DIR}/.cargo"
    mkdir -p "${CARGO_HOME}"

    cat > "${CARGO_HOME}/config.toml" << EOF
    [source.crates-io]
    replace-with = "vendored-sources"

    [source.vendored-sources]
    directory = "vendor"
    EOF

    mkdir -p /usr/local/bin
    ln -sf /usr/bin/gcc /usr/local/bin/cc
    ln -sf /usr/bin/ld.bfd /usr/local/bin/ld
    export PATH="/usr/local/bin:${PATH}"
    export CC=gcc
    export CFLAGS="-fPIC"
    export CARGO_TARGET_X86_64_UNKNOWN_LINUX_GNU_LINKER=gcc
    export RUSTFLAGS="-C codegen-units=1 -C embed-bitcode=yes -C debuginfo=0"
    export HELIX_DEFAULT_RUNTIME=/usr/lib/helix/runtime
    export HELIX_DISABLE_AUTO_GRAMMAR_BUILD=1

    cargo build --release --offline --target x86_64-unknown-linux-gnu

    mkdir -p ${OUT_DIR}/usr/bin
    mkdir -p ${OUT_DIR}/usr/lib/helix
    install -m 755 target/x86_64-unknown-linux-gnu/release/hx ${OUT_DIR}/usr/bin/hx
    cp -r runtime ${OUT_DIR}/usr/lib/helix/

    strip --strip-unneeded ${OUT_DIR}/usr/bin/hx

    find "${OUT_DIR}" -exec touch -d '2024-01-01T00:00:00+00:00' {} \;

bundles:
  dev:
  - bin
  - runtime

outputs:
  bin:
    files:
    - path: /usr/bin/hx
      needs:
      - /usr/lib/ld-linux-x86-64.so.2
      - /usr/lib/libc.so.6
      - /usr/lib/libgcc_s.so.1
      - /usr/lib/libm.so.6

  runtime:
    files:
    - path: /usr/lib/helix/runtime

resolution:
  /usr/lib/libgcc_s.so.1: gcc
  /usr/lib/ld-linux-x86-64.so.2: glibc
  /usr/lib/libc.so.6: glibc
  /usr/lib/libm.so.6: glibc
