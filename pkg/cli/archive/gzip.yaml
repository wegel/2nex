package:
  schema: 1
  name: Gzip
  slug: gzip
  namespace: cli/archive
  version: '1.13'
  description: GNU compression utility
  homepage: https://www.gnu.org/software/gzip/
  checksum: ea7d5b06401433c2bc602abbcfcb19869c5ca57e190cfb2ce488380ab16c86d0
sources:
- name: gzip
  url: https://ftp.gnu.org/gnu/gzip/gzip-1.13.tar.xz
  sha256: 7454eb6935db17c6655576c2e1b0fabefd38b4d0936e0f87f48cd062ce91a057
dependencies:
- commit: x86_64/pkg/bootstrap/phase1/bash/5.2.21/bundles/dev
  name: bash
- commit: x86_64/pkg/bootstrap/phase3/2nex-utilities-bootstrap/0.0.1/bundles/dev
  name: 2nex-utilities-bootstrap
- commit: x86_64/pkg/bootstrap/phase1/make/4.4.1/bundles/dev
  name: make
- commit: x86_64/pkg/bootstrap/phase1/tar/1.35/bundles/dev
  name: tar
- commit: x86_64/pkg/bootstrap/phase1/bootstrap_tools/0.0.1/bundles/dev
  name: bootstrap_tools
- commit: x86_64/pkg/bootstrap/phase2/texinfo/7.1/bundles/dev
  name: texinfo
- commit: x86_64/pkg/bootstrap/phase3/xz/5.4.6/bundles/dev
  name: xz
- commit: x86_64/pkg/bootstrap/phase3/bzip2/1.0.8/outputs/lib
  name: bzip2
- commit: x86_64/pkg/bootstrap/phase3/zlib/1.3.1/outputs/lib
  name: zlib
- commit: x86_64/pkg/bootstrap/phase3/file/5.45/bundles/dev
  name: file
- commit: x86_64/pkg/bootstrap/phase3/binutils/2.42/bundles/dev
  name: binutils
- commit: x86_64/pkg/bootstrap/phase1/gcc/13.2.0/outputs/lib
  name: gcc
- commit: x86_64/pkg/bootstrap/phase3/gmp-bootstrap/6.3.0/outputs/lib
  name: gmp-bootstrap
- commit: x86_64/pkg/bootstrap/phase3/mpfr/4.2.1/outputs/lib
  name: mpfr
- commit: x86_64/pkg/bootstrap/phase3/mpc/1.2.1/outputs/lib
  name: mpc
- commit: x86_64/pkg/bootstrap/phase3/gcc/13.2.0/bundles/dev
  name: gcc
- commit: x86_64/pkg/bootstrap/phase1/sed/4.9/bundles/dev
  name: sed
- commit: x86_64/pkg/bootstrap/phase1/grep/3.11/bundles/dev
  name: grep
- commit: x86_64/pkg/bootstrap/phase1/coreutils/9.5/bundles/dev
  name: coreutils
- commit: x86_64/pkg/bootstrap/phase1/gawk/5.3.0/bundles/dev
  name: gawk
- commit: x86_64/pkg/bootstrap/phase1/findutils/4.9.0/bundles/dev
  name: findutils
- commit: x86_64/pkg/libs/system/glibc/2.39/bundles/dev
  name: glibc
- commit: x86_64/pkg/libs/system/glibc/2.39/outputs/lib
  name: glibc
- commit: x86_64/pkg/core/toolchain/gcc/13.2.0/outputs/lib
  name: gcc
- commit: x86_64/pkg/cli/text/less/643/bundles/dev
  name: less
build:
  script: 'tar --no-same-owner -xf ${SOURCE0} -C "${WORK_DIR}" --strip-components=1

    cd ${WORK_DIR}


    ./configure --prefix=/usr

    make

    make DESTDIR=${OUT_DIR} install


    find "${OUT_DIR}" -exec touch -d "2024-01-01T00:00:00+00:00" {} \;

    2nex_strip_binaries ${OUT_DIR}

    '
bundles:
  full:
  - info
  - man
  - bin
  dev:
  - bin
outputs:
  info:
    files:
    - /usr/share/info/dir
    - /usr/share/info/gzip.info
  man:
    files:
    - /usr/share/man/man1/gunzip.1
    - /usr/share/man/man1/gzexe.1
    - /usr/share/man/man1/gzip.1
    - /usr/share/man/man1/zcat.1
    - /usr/share/man/man1/zcmp.1
    - /usr/share/man/man1/zdiff.1
    - /usr/share/man/man1/zforce.1
    - /usr/share/man/man1/zgrep.1
    - /usr/share/man/man1/zless.1
    - /usr/share/man/man1/zmore.1
    - /usr/share/man/man1/znew.1
  bin:
    files:
    - /usr/bin/gunzip
    - /usr/bin/gzexe
    - /usr/bin/gzip
    - /usr/bin/uncompress
    - /usr/bin/zcat
    - /usr/bin/zcmp
    - /usr/bin/zdiff
    - /usr/bin/zegrep
    - /usr/bin/zfgrep
    - /usr/bin/zforce
    - /usr/bin/zgrep
    - /usr/bin/zless
    - /usr/bin/zmore
    - /usr/bin/znew
    requires:
    - x86_64/pkg/libs/system/glibc/2.39/outputs/lib
