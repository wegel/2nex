package:
  schema: 1
  name: GNU cpio
  slug: cpio
  namespace: cli/archive
  version: "2.15"
  description: GNU cpio copies files into or out of a cpio or tar archive
  homepage: https://www.gnu.org/software/cpio/
  checksum: 57fe6accb6f91f65e3861c1daceea1105278e397c5853f7d240240f6318bc1bf

sources:
- name: cpio
  url: https://ftp.gnu.org/gnu/cpio/cpio-2.15.tar.gz
  sha256: efa50ef983137eefc0a02fdb51509d624b5e3295c980aa127ceee4183455499e

dependencies:
- name: bootstrap_tools
  commit: x86_64/pkg/bootstrap/phase1/bootstrap_tools/0.0.1/bundles/dev
- name: gmp-bootstrap
  commit: x86_64/pkg/bootstrap/phase3/gmp-bootstrap/6.3.0/outputs/lib
- name: mpfr
  commit: x86_64/pkg/bootstrap/phase3/mpfr/4.2.1/outputs/lib
- name: bash
  commit: x86_64/pkg/bootstrap/phase1/bash/5.2.21/bundles/dev
- name: coreutils
  commit: x86_64/pkg/bootstrap/phase1/coreutils/9.5/bundles/dev
- name: bzip2
  commit: x86_64/pkg/bootstrap/phase3/bzip2/1.0.8/outputs/lib
- name: zlib
  commit: x86_64/pkg/bootstrap/phase3/zlib/1.3.1/outputs/lib
- name: file
  commit: x86_64/pkg/bootstrap/phase3/file/5.45/bundles/dev
- name: findutils
  commit: x86_64/pkg/bootstrap/phase1/findutils/4.9.0/bundles/dev
- name: grep
  commit: x86_64/pkg/bootstrap/phase1/grep/3.11/bundles/dev
- name: make
  commit: x86_64/pkg/bootstrap/phase1/make/4.4.1/bundles/dev
- name: sed
  commit: x86_64/pkg/bootstrap/phase1/sed/4.9/bundles/dev
- name: tar
  commit: x86_64/pkg/bootstrap/phase1/tar/1.35/bundles/dev
- name: gzip
  commit: x86_64/pkg/bootstrap/phase1/gzip/1.13/bundles/dev
- name: gawk
  commit: x86_64/pkg/bootstrap/phase1/gawk/5.3.0/bundles/dev
- name: xz
  commit: x86_64/pkg/bootstrap/phase3/xz/5.4.6/bundles/dev
- name: binutils
  commit: x86_64/pkg/bootstrap/phase3/binutils/2.42/bundles/dev
- name: mpc
  commit: x86_64/pkg/bootstrap/phase3/mpc/1.2.1/outputs/lib
- name: gcc
  commit: x86_64/pkg/bootstrap/phase3/gcc/13.2.0/bundles/dev
- name: 2nex-utilities-bootstrap
  commit: x86_64/pkg/bootstrap/phase3/2nex-utilities-bootstrap/0.0.1/bundles/dev
- name: glibc
  commit: x86_64/pkg/libs/system/glibc/2.39/bundles/dev

build:
  profile: [4118:2819, 8218:8356, 12363:18192, 16464:25967, 20575:33635, 24700:35721, 28809:36158, 32968:36997, 36038:37141]

  script: |
    tar --no-same-owner -xf ${SOURCE_cpio} -C "${WORK_DIR}" --strip-components=1
    cd ${WORK_DIR}

    ./configure --prefix=/usr
    make
    make DESTDIR=${OUT_DIR} install

    rm -rf ${OUT_DIR}/usr/share/info ${OUT_DIR}/usr/share/man ${OUT_DIR}/usr/share/doc
    rm -rf ${OUT_DIR}/usr/libexec  # rmt (remote tape server) not needed
    find "${OUT_DIR}" -exec touch -d '2024-01-01T00:00:00+00:00' {} \;

    2nex_strip_binaries ${OUT_DIR}

bundles:
  dev:
  - bin

outputs:
  bin:
    files:
    - path: /usr/bin/cpio
      needs:
      - /usr/lib/ld-linux-x86-64.so.2
      - /usr/lib/libc.so.6

  locale:
    files:
    - path: /usr/share/locale/bg/LC_MESSAGES/cpio.mo
    - path: /usr/share/locale/da/LC_MESSAGES/cpio.mo
    - path: /usr/share/locale/de/LC_MESSAGES/cpio.mo
    - path: /usr/share/locale/es/LC_MESSAGES/cpio.mo
    - path: /usr/share/locale/fi/LC_MESSAGES/cpio.mo
    - path: /usr/share/locale/fr/LC_MESSAGES/cpio.mo
    - path: /usr/share/locale/ga/LC_MESSAGES/cpio.mo
    - path: /usr/share/locale/gl/LC_MESSAGES/cpio.mo
    - path: /usr/share/locale/hr/LC_MESSAGES/cpio.mo
    - path: /usr/share/locale/hu/LC_MESSAGES/cpio.mo
    - path: /usr/share/locale/id/LC_MESSAGES/cpio.mo
    - path: /usr/share/locale/it/LC_MESSAGES/cpio.mo
    - path: /usr/share/locale/ja/LC_MESSAGES/cpio.mo
    - path: /usr/share/locale/ka/LC_MESSAGES/cpio.mo
    - path: /usr/share/locale/ko/LC_MESSAGES/cpio.mo
    - path: /usr/share/locale/nl/LC_MESSAGES/cpio.mo
    - path: /usr/share/locale/pl/LC_MESSAGES/cpio.mo
    - path: /usr/share/locale/pt/LC_MESSAGES/cpio.mo
    - path: /usr/share/locale/pt_BR/LC_MESSAGES/cpio.mo
    - path: /usr/share/locale/ro/LC_MESSAGES/cpio.mo
    - path: /usr/share/locale/ru/LC_MESSAGES/cpio.mo
    - path: /usr/share/locale/sr/LC_MESSAGES/cpio.mo
    - path: /usr/share/locale/sv/LC_MESSAGES/cpio.mo
    - path: /usr/share/locale/tr/LC_MESSAGES/cpio.mo
    - path: /usr/share/locale/uk/LC_MESSAGES/cpio.mo
    - path: /usr/share/locale/vi/LC_MESSAGES/cpio.mo
    - path: /usr/share/locale/zh_CN/LC_MESSAGES/cpio.mo
    - path: /usr/share/locale/zh_TW/LC_MESSAGES/cpio.mo

resolution:
  /usr/lib/ld-linux-x86-64.so.2: glibc
  /usr/lib/libc.so.6: glibc
