package:
  schema: 1
  name: GNU cpio
  slug: cpio
  namespace: cli/archive
  version: "2.15"
  description: GNU cpio copies files into or out of a cpio or tar archive
  homepage: https://www.gnu.org/software/cpio/
  checksum: 047126f4469a2bacf0e8f13e0f8b4ed726dba190de825e509dc47f42cd48f54b

sources:
- name: cpio
  url: https://ftp.gnu.org/gnu/cpio/cpio-2.15.tar.gz
  sha256: efa50ef983137eefc0a02fdb51509d624b5e3295c980aa127ceee4183455499e

dependencies:
- name: glibc
  commit: x86_64/pkg/libs/system/glibc/2.39/bundles/dev
- name: gmp
  commit: x86_64/pkg/libs/system/gmp/6.3.0/bundles/dev
- name: libcap
  commit: x86_64/pkg/libs/security/libcap/2.69/bundles/dev
- name: gcc
  commit: x86_64/pkg/core/toolchain/gcc/13.2.0/bundles/dev
- name: binutils
  commit: x86_64/pkg/core/toolchain/binutils/2.42/bundles/dev
- name: make
  commit: x86_64/pkg/core/toolchain/make/4.4.1/bundles/dev
- name: bash
  commit: x86_64/pkg/cli/shells/bash/5.2.21/bundles/dev
- name: coreutils
  commit: x86_64/pkg/core/userland/coreutils/9.5/bundles/dev
- name: findutils
  commit: x86_64/pkg/core/userland/findutils/4.9.0/bundles/dev
- name: gawk
  commit: x86_64/pkg/cli/text/gawk/5.3.0/bundles/dev
- name: grep
  commit: x86_64/pkg/cli/text/grep/3.11/bundles/dev
- name: sed
  commit: x86_64/pkg/cli/text/sed/4.9/bundles/dev
- name: tar
  commit: x86_64/pkg/cli/archive/tar/1.35/bundles/dev
- name: gzip
  commit: x86_64/pkg/cli/archive/gzip/1.13/bundles/dev
- name: zlib
  commit: x86_64/pkg/libs/system/zlib/1.3.1/bundles/dev
- name: ncurses
  commit: x86_64/pkg/libs/system/ncurses/6.4-20230520/bundles/dev
- name: acl
  commit: x86_64/pkg/libs/system/acl/2.3.2/bundles/dev
- name: attr
  commit: x86_64/pkg/libs/system/attr/2.5.2/bundles/dev
- name: linux-headers
  commit: x86_64/pkg/libs/system/linux-headers/6.4.1/bundles/dev

build:
  environment: 27b6e5dc7ad152c9a17c2cabfcc5ee93daa9bbf0
  profile: [4098:21496, 8225:58768, 12370:79233, 16471:103043, 20582:130629, 24702:147085, 28813:151725, 32913:162803, 35888:164177]

  script: |
    tar --no-same-owner -xf ${SOURCE_cpio} -C "${WORK_DIR}" --strip-components=1
    cd ${WORK_DIR}

    ./configure --prefix=/usr
    make
    make DESTDIR=${OUT_DIR} install

    rm -rf ${OUT_DIR}/usr/share/info ${OUT_DIR}/usr/share/man ${OUT_DIR}/usr/share/doc
    rm -rf ${OUT_DIR}/usr/libexec  # rmt (remote tape server) not needed
    find ${OUT_DIR} -type f -executable -exec strip --strip-unneeded {} \; 2>/dev/null || true
    find ${OUT_DIR} -name '*.a' -exec objcopy --enable-deterministic-archives {} \; 2>/dev/null || true
    find "${OUT_DIR}" -exec touch -d "2024-01-01T00:00:00+00:00" {} \;

bundles:
  dev:
  - bin

outputs:
  bin:
    files:
    - path: /usr/bin/cpio
      needs:
      - /usr/lib/ld-linux-x86-64.so.2
      - /usr/lib/libc.so.6

  locale:
    files:
    - path: /usr/share/locale/bg/LC_MESSAGES/cpio.mo
    - path: /usr/share/locale/da/LC_MESSAGES/cpio.mo
    - path: /usr/share/locale/de/LC_MESSAGES/cpio.mo
    - path: /usr/share/locale/es/LC_MESSAGES/cpio.mo
    - path: /usr/share/locale/fi/LC_MESSAGES/cpio.mo
    - path: /usr/share/locale/fr/LC_MESSAGES/cpio.mo
    - path: /usr/share/locale/ga/LC_MESSAGES/cpio.mo
    - path: /usr/share/locale/gl/LC_MESSAGES/cpio.mo
    - path: /usr/share/locale/hr/LC_MESSAGES/cpio.mo
    - path: /usr/share/locale/hu/LC_MESSAGES/cpio.mo
    - path: /usr/share/locale/id/LC_MESSAGES/cpio.mo
    - path: /usr/share/locale/it/LC_MESSAGES/cpio.mo
    - path: /usr/share/locale/ja/LC_MESSAGES/cpio.mo
    - path: /usr/share/locale/ka/LC_MESSAGES/cpio.mo
    - path: /usr/share/locale/ko/LC_MESSAGES/cpio.mo
    - path: /usr/share/locale/nl/LC_MESSAGES/cpio.mo
    - path: /usr/share/locale/pl/LC_MESSAGES/cpio.mo
    - path: /usr/share/locale/pt/LC_MESSAGES/cpio.mo
    - path: /usr/share/locale/pt_BR/LC_MESSAGES/cpio.mo
    - path: /usr/share/locale/ro/LC_MESSAGES/cpio.mo
    - path: /usr/share/locale/ru/LC_MESSAGES/cpio.mo
    - path: /usr/share/locale/sr/LC_MESSAGES/cpio.mo
    - path: /usr/share/locale/sv/LC_MESSAGES/cpio.mo
    - path: /usr/share/locale/tr/LC_MESSAGES/cpio.mo
    - path: /usr/share/locale/uk/LC_MESSAGES/cpio.mo
    - path: /usr/share/locale/vi/LC_MESSAGES/cpio.mo
    - path: /usr/share/locale/zh_CN/LC_MESSAGES/cpio.mo
    - path: /usr/share/locale/zh_TW/LC_MESSAGES/cpio.mo

resolution:
  /usr/lib/ld-linux-x86-64.so.2: glibc
  /usr/lib/libc.so.6: glibc
