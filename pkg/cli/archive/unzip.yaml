package:
  schema: 1
  name: unzip
  slug: unzip
  namespace: cli/archive
  version: "6.0"
  description: Extract files from ZIP archives
  homepage: https://infozip.sourceforge.net/UnZip.html
  checksum: 3caee3be90533a0ea2b177cfaf1e7ab83b589a6ce11c5f9a070f407419963da2

sources:
- name: unzip
  url: https://downloads.sourceforge.net/infozip/unzip60.tar.gz
  sha256: 036d96991646d0449ed0aa952e4fbe21b476ce994abc276e49d30e686708bd37

dependencies:
- name: glibc
  commit: x86_64/pkg/libs/system/glibc/2.39/bundles/dev
- name: gmp
  commit: x86_64/pkg/libs/system/gmp/6.3.0/bundles/dev
- name: libcap
  commit: x86_64/pkg/libs/security/libcap/2.69/bundles/dev
- name: mpfr
  commit: x86_64/pkg/libs/system/mpfr/4.2.1/bundles/dev
- name: zlib
  commit: x86_64/pkg/libs/system/zlib/1.3.1/bundles/dev
- name: linux-headers
  commit: x86_64/pkg/bootstrap/phase3/linux-headers/6.4.1/bundles/dev
- name: gcc
  commit: x86_64/pkg/core/toolchain/gcc/13.2.0/bundles/dev
- name: binutils
  commit: x86_64/pkg/bootstrap/phase3/binutils/2.42/bundles/dev
- name: bash
  commit: x86_64/pkg/cli/shells/bash/5.2.21/bundles/dev
- name: coreutils
  commit: x86_64/pkg/core/userland/coreutils/9.5/bundles/dev
- name: findutils
  commit: x86_64/pkg/core/userland/findutils/4.9.0/bundles/dev
- name: 2nex-utilities
  commit: x86_64/pkg/bootstrap/phase3/2nex-utilities-bootstrap/0.0.1/bundles/dev
- name: tar
  commit: x86_64/pkg/cli/archive/tar/1.35/bundles/dev
- name: acl
  commit: x86_64/pkg/libs/system/acl/2.3.2/bundles/dev
- name: attr
  commit: x86_64/pkg/libs/system/attr/2.5.2/bundles/dev
- name: make
  commit: x86_64/pkg/core/toolchain/make/4.4.1/bundles/dev
- name: ncurses
  commit: x86_64/pkg/libs/system/ncurses/6.4-20230520/bundles/dev
- name: gzip
  commit: x86_64/pkg/cli/archive/gzip/1.13/bundles/dev
- name: bzip2
  commit: x86_64/pkg/libs/compression/bzip2/1.0.8/bundles/dev

build:
  environment: 13ce31fd97c19f5756e4413babf279d543b5a71c
  profile: [4130:434, 8317:476, 11442:848]

  script: |
    tar --no-same-owner -xf /${SOURCE_unzip} -C "${WORK_DIR}" --strip-components=1
    cd ${WORK_DIR}

    make -f unix/Makefile CC=gcc generic LOCAL_UNZIP=-DLARGE_FILE_SUPPORT
    make -f unix/Makefile prefix="${OUT_DIR}/usr" MANDIR="${OUT_DIR}/usr/share/man/man1" install

    find "${OUT_DIR}" -exec touch -d "2024-01-01T00:00:00+00:00" {} \;
    2nex_strip_binaries ${OUT_DIR}

bundles:
  dev:
  - bin

outputs:
  bin:
    files:
    - path: /usr/bin/funzip
      needs:
      - /usr/lib/ld-linux-x86-64.so.2
      - /usr/lib/libc.so.6
    - path: /usr/bin/unzip
      needs:
      - /usr/lib/ld-linux-x86-64.so.2
      - /usr/lib/libc.so.6
    - path: /usr/bin/unzipsfx
      needs:
      - /usr/lib/ld-linux-x86-64.so.2
      - /usr/lib/libc.so.6
    - path: /usr/bin/zipgrep
    - path: /usr/bin/zipinfo
      needs:
      - /usr/lib/ld-linux-x86-64.so.2
      - /usr/lib/libc.so.6

  man:
    files:
    - path: /usr/share/man/man1/funzip.1
    - path: /usr/share/man/man1/unzip.1
    - path: /usr/share/man/man1/unzipsfx.1
    - path: /usr/share/man/man1/zipgrep.1
    - path: /usr/share/man/man1/zipinfo.1

resolution:
  /usr/lib/ld-linux-x86-64.so.2: glibc
  /usr/lib/libc.so.6: glibc
