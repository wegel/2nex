package:
  schema: 1
  name: LZO
  slug: lzo
  namespace: cli/archive
  version: "2.10"
  description: Data compression library with very fast (de)compression
  homepage: http://www.oberhumer.com/opensource/lzo/
  checksum: c247c4bbf6bd371f9c4336e66a1c4ae3c948462b8042d2714342f17bdacf5719

sources:
- name: lzo
  url: https://www.oberhumer.com/opensource/lzo/download/lzo-2.10.tar.gz
  sha256: c0f892943208266f9b6543b3ae308fab6284c5c90e627931446fb49b4221a072

dependencies:
- name: bash
  commit: x86_64/pkg/cli/shells/bash/5.2.21/bundles/dev
- name: coreutils
  commit: x86_64/pkg/core/userland/coreutils/9.5/bundles/dev
- name: findutils
  commit: x86_64/pkg/core/userland/findutils/4.9.0/bundles/dev
- name: gawk
  commit: x86_64/pkg/cli/text/gawk/5.3.0/bundles/dev
- name: grep
  commit: x86_64/pkg/cli/text/grep/3.11/bundles/dev
- name: make
  commit: x86_64/pkg/core/toolchain/make/4.4.1/bundles/dev
- name: sed
  commit: x86_64/pkg/cli/text/sed/4.9/bundles/dev
- name: tar
  commit: x86_64/pkg/cli/archive/tar/1.35/bundles/dev
- name: binutils
  commit: x86_64/pkg/core/toolchain/binutils/2.42/bundles/dev
- name: glibc
  commit: x86_64/pkg/libs/system/glibc/2.39/bundles/dev
- name: gcc
  commit: x86_64/pkg/core/toolchain/gcc/13.2.0/bundles/dev
- name: acl
  commit: x86_64/pkg/libs/system/acl/2.3.2/bundles/dev
- name: attr
  commit: x86_64/pkg/libs/system/attr/2.5.2/bundles/dev
- name: gzip
  commit: x86_64/pkg/cli/archive/gzip/1.13/bundles/dev
- name: gmp
  commit: x86_64/pkg/libs/system/gmp/6.3.0/bundles/dev
- name: libcap
  commit: x86_64/pkg/libs/security/libcap/2.69/bundles/dev
- name: zlib
  commit: x86_64/pkg/libs/system/zlib/1.3.1/bundles/dev
- name: linux-headers
  commit: x86_64/pkg/libs/system/linux-headers/6.4.1/bundles/dev
- name: ncurses
  commit: x86_64/pkg/libs/system/ncurses/6.4-20230520/bundles/dev

build:
  environment: 13ce31fd97c19f5756e4413babf279d543b5a71c
  profile: [4105:1030, 8221:3995, 12340:5484, 14816:7050]

  script: |
    tar --no-same-owner -xf ${SOURCE_lzo} -C "${WORK_DIR}" --strip-components=1
    cd ${WORK_DIR}

    # Configure
    ./configure --prefix=/usr --enable-shared --disable-static

    # Build
    make

    # Install
    make DESTDIR="${OUT_DIR}" install

    find ${OUT_DIR} -type f -executable -exec strip --strip-unneeded {} \; 2>/dev/null || true
    find ${OUT_DIR} -name '*.a' -exec objcopy --enable-deterministic-archives {} \; 2>/dev/null || true
    find "${OUT_DIR}" -exec touch -d "2024-01-01T00:00:00+00:00" {} \;

bundles:
  dev:
  - dev
  - lib

  full:
  - dev
  - lib

outputs:
  dev:
    files:
    - path: /usr/include/lzo/lzo1a.h
    - path: /usr/include/lzo/lzo1b.h
    - path: /usr/include/lzo/lzo1c.h
    - path: /usr/include/lzo/lzo1f.h
    - path: /usr/include/lzo/lzo1x.h
    - path: /usr/include/lzo/lzo1y.h
    - path: /usr/include/lzo/lzo1z.h
    - path: /usr/include/lzo/lzo1.h
    - path: /usr/include/lzo/lzo2a.h
    - path: /usr/include/lzo/lzo_asm.h
    - path: /usr/include/lzo/lzoconf.h
    - path: /usr/include/lzo/lzodefs.h
    - path: /usr/include/lzo/lzoutil.h
    - path: /usr/lib/liblzo2.la
    - path: /usr/lib/pkgconfig/lzo2.pc

  doc:
    files:
    - path: /usr/share/doc/lzo/AUTHORS
    - path: /usr/share/doc/lzo/COPYING
    - path: /usr/share/doc/lzo/LZO.FAQ
    - path: /usr/share/doc/lzo/LZO.TXT
    - path: /usr/share/doc/lzo/LZOAPI.TXT
    - path: /usr/share/doc/lzo/NEWS
    - path: /usr/share/doc/lzo/THANKS

  lib:
    files:
    - path: /usr/lib/liblzo2.so
      needs:
      - /usr/lib/libc.so.6
    - path: /usr/lib/liblzo2.so.2
      needs:
      - /usr/lib/libc.so.6
    - path: /usr/lib/liblzo2.so.2.0.0
      needs:
      - /usr/lib/libc.so.6

resolution:
  /usr/lib/libc.so.6: glibc
