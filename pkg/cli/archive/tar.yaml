build:
  environment: 13ce31fd97c19f5756e4413babf279d543b5a71c
  profile: [4119:1743, 8237:5238, 12352:10455, 16467:14511, 20594:17858, 24718:23000, 28823:26139, 37043:28202, 41162:28424, 44359:30561]

  script: |
    tar --no-same-owner -xf ${SOURCE0} -C "${WORK_DIR}" --strip-components=1
    cd ${WORK_DIR}

    FORCE_UNSAFE_CONFIGURE=1 ./configure --prefix=/usr gl_cv_func_fchmodat_works=no
    make
    make DESTDIR=${OUT_DIR} install
    make -C doc install-html docdir=${OUT_DIR}/usr/share/doc/tar-1.35

    find "${OUT_DIR}" -exec touch -d "2024-01-01T00:00:00+00:00" {} \;
    2nex_strip_binaries ${OUT_DIR}

bundles:
  dev:
  - bin
  - locale

  full:
  - bin
  - doc
  - locale

outputs:
  bin:
    files:
    - path: /usr/bin/tar
      needs:
      - /usr/lib/ld-linux-x86-64.so.2
      - /usr/lib/libacl.so.1
      - /usr/lib/libc.so.6
    - path: /usr/libexec/rmt
