build:
  environment: 27b6e5dc7ad152c9a17c2cabfcc5ee93daa9bbf0
  profile: [4159:100187, 8287:145520, 12426:159078, 16556:167506, 20667:179304, 24830:188393, 28927:195650, 33070:200688, 37227:205560, 39402:208012]

  script: |
    set -eu

    tar --no-same-owner -xf /${SOURCE_gvfs} -C "${WORK_DIR}" --strip-components=1
    cd "${WORK_DIR}"

    export PKG_CONFIG_PATH=/usr/lib/pkgconfig:/usr/share/pkgconfig

    meson setup build \
      --prefix=/usr \
      --libdir=lib \
      --libexecdir=libexec \
      --sysconfdir=/etc \
      --buildtype=release \
      -Dsystemduserunitdir=/usr/lib/systemd/user \
      -Dtmpfilesdir=no \
      -Dadmin=false \
      -Dafc=false \
      -Dafp=false \
      -Darchive=false \
      -Dburn=false \
      -Dcdda=false \
      -Ddnssd=false \
      -Dgoa=false \
      -Dgoogle=false \
      -Dgphoto2=false \
      -Dhttp=false \
      -Dmtp=false \
      -Dnfs=false \
      -Donedrive=false \
      -Dsftp=false \
      -Dsmb=true \
      -Dudisks2=false \
      -Dwsdd=false \
      -Dbluray=false \
      -Dfuse=false \
      -Dgcr=false \
      -Dgcrypt=false \
      -Dgudev=false \
      -Dkeyring=true \
      -Dlogind=false \
      -Dlibusb=false \
      -Ddeprecated_apis=false \
      -Ddevel_utils=false \
      -Dinstalled_tests=false \
      -Dman=false

    ninja -C build
    DESTDIR="${OUT_DIR}" ninja -C build install
    glib-compile-schemas "${OUT_DIR}/usr/share/glib-2.0/schemas"

    find "${OUT_DIR}" -type f -executable -exec strip --strip-unneeded {} \; 2>/dev/null || true
    find "${OUT_DIR}" -name '*.a' -exec objcopy --enable-deterministic-archives {} \; 2>/dev/null || true
    find "${OUT_DIR}" -exec touch -d "2024-01-01T00:00:00+00:00" {} \;

