build:
  environment: 27b6e5dc7ad152c9a17c2cabfcc5ee93daa9bbf0
  profile: [4110:708, 8209:859, 12337:997, 16448:1281, 20567:1683, 24747:8581, 28932:8581, 33054:8583, 34894:8688]

  script: |
    set -eu

    tar --no-same-owner -xf /${SOURCE_xdg_desktop_portal} -C "${WORK_DIR}" --strip-components=1
    cd "${WORK_DIR}"

    export PKG_CONFIG_PATH=/usr/lib/pkgconfig:/usr/share/pkgconfig

    meson setup build \
      --prefix=/usr \
      --libdir=lib \
      --libexecdir=libexec \
      --sysconfdir=/etc \
      --buildtype=release \
      -Dflatpak-interfaces=disabled \
      -Dsystemd=enabled \
      -Dgeoclue=disabled \
      -Dgudev=disabled \
      -Ddocumentation=disabled \
      -Dtests=disabled \
      -Dinstalled-tests=false \
      -Dman-pages=disabled \
      -Dsandboxed-image-validation=disabled \
      -Dsandboxed-sound-validation=disabled

    ninja -C build
    DESTDIR="${OUT_DIR}" ninja -C build install

    find "${OUT_DIR}" -type f -executable -exec strip --strip-unneeded {} \; 2>/dev/null || true
    find "${OUT_DIR}" -name '*.a' -exec objcopy --enable-deterministic-archives {} \; 2>/dev/null || true
    find "${OUT_DIR}" -exec touch -d "2024-01-01T00:00:00+00:00" {} \;

