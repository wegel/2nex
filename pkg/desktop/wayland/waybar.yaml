build:
  environment: 27b6e5dc7ad152c9a17c2cabfcc5ee93daa9bbf0
  profile: [4155:2193, 8303:7930, 12407:16046, 15077:38922]

  script: |
    set -eu

    tar --no-same-owner -xf "${SOURCE_waybar}" -C "${WORK_DIR}" --strip-components=1
    cd "${WORK_DIR}"

    export PKG_CONFIG_PATH=/usr/lib/pkgconfig:/usr/share/pkgconfig

    meson setup build \
      --prefix=/usr \
      --sysconfdir=/etc \
      --buildtype=release \
      --default-library=shared \
      --pkg-config-path=/usr/lib/pkgconfig:/usr/share/pkgconfig \
      -Ddbusmenu-gtk=enabled \
      -Dlibnl=enabled \
      -Dpulseaudio=enabled \
      -Dlibudev=enabled \
      -Dlibinput=disabled \
      -Dlibevdev=disabled \
      -Dupower_glib=disabled \
      -Dpipewire=disabled \
      -Dmpris=disabled \
      -Dmpd=disabled \
      -Djack=disabled \
      -Dwireplumber=disabled \
      -Dgps=disabled \
      -Dsndio=disabled \
      -Dcava=disabled \
      -Dsystemd=disabled \
      -Dlogind=disabled \
      -Drfkill=disabled \
      -Dman-pages=disabled \
      -Dtests=disabled \
      -Dniri=false \
      -Dlogin-proxy=false

    ninja -C build
    DESTDIR="${OUT_DIR}" ninja -C build install

    strip --strip-unneeded "${OUT_DIR}/usr/bin/waybar"
    find "${OUT_DIR}" -exec touch -d "2024-01-01T00:00:00+00:00" {} \;

bundles:
  full:
  - bin

outputs:
  bin:
    files:
    - path: /usr/bin/waybar
      needs:
      - /usr/lib/ld-linux-x86-64.so.2
      - /usr/lib/libc.so.6
      - /usr/lib/libcairomm-1.0.so.1
      - /usr/lib/libdbusmenu-gtk3.so.4
      - /usr/lib/libfmt.so.11
      - /usr/lib/libgcc_s.so.1
      - /usr/lib/libgdk-3.so.0
      - /usr/lib/libgdkmm-3.0.so.1
