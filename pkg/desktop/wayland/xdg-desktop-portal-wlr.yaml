package:
  schema: 1
  name: xdg-desktop-portal-wlr
  slug: xdg-desktop-portal-wlr
  namespace: desktop/wayland
  version: 0.8.2
  description: XDG Desktop Portal backend for wlroots compositors
  homepage: https://github.com/emersion/xdg-desktop-portal-wlr
  checksum: bb177fa4dbf0362a69a66a10a4d7725ae911ba59ec1057300ee6da886ada9dbf

sources:
- name: xdg_desktop_portal_wlr
  url: https://github.com/emersion/xdg-desktop-portal-wlr/releases/download/v0.8.2/xdg-desktop-portal-wlr-0.8.2.tar.gz
  sha256: 5e6840d3326a4afb440c353ee19cf68d4e4fba40a5648224904b3a06612aae87

dependencies:
- name: glibc
  commit: x86_64/pkg/libs/system/glibc/2.39/bundles/dev
- name: gcc
  commit: x86_64/pkg/core/toolchain/gcc/13.2.0/bundles/dev
- name: binutils
  commit: x86_64/pkg/core/toolchain/binutils/2.42/bundles/dev
- name: bash
  commit: x86_64/pkg/cli/shells/bash/5.2.21/bundles/dev
- name: tar
  commit: x86_64/pkg/cli/archive/tar/1.35/bundles/dev
- name: gzip
  commit: x86_64/pkg/cli/archive/gzip/1.13/bundles/dev
- name: coreutils
  commit: x86_64/pkg/core/userland/coreutils/9.5/bundles/dev
- name: findutils
  commit: x86_64/pkg/core/userland/findutils/4.9.0/bundles/dev
- name: linux-headers
  commit: x86_64/pkg/libs/system/linux-headers/6.4.1/bundles/dev
- name: meson
  commit: x86_64/pkg/core/toolchain/meson/1.6.1/bundles/dev
- name: ninja
  commit: x86_64/pkg/core/toolchain/ninja/1.12.1/bundles/dev
- name: python3
  commit: x86_64/pkg/dev/lang/python3/3.12.2/bundles/dev
- name: pkgconf
  commit: x86_64/pkg/core/toolchain/pkgconf/2.2.0/bundles/dev
- name: wayland
  commit: x86_64/pkg/libs/wayland/wayland/1.24.0/bundles/dev
- name: wayland-protocols
  commit: x86_64/pkg/libs/wayland/wayland-protocols/1.46/bundles/dev
- name: pipewire
  commit: x86_64/pkg/libs/audio/pipewire/1.4.9/bundles/dev
- name: inih
  commit: x86_64/pkg/libs/system/inih/61/bundles/dev
- name: mesa
  commit: x86_64/pkg/libs/graphics/mesa/24.2.7/bundles/dev
- name: libdrm
  commit: x86_64/pkg/libs/graphics/libdrm/2.4.123/bundles/dev
- name: systemd
  commit: x86_64/pkg/core/init/systemd/257.5/bundles/dev
- name: libcap
  commit: x86_64/pkg/libs/security/libcap/2.69/bundles/dev
- name: gcc-libs
  commit: x86_64/pkg/core/toolchain/gcc/13.2.0/outputs/lib
- name: zlib
  commit: x86_64/pkg/libs/system/zlib/1.3.1/bundles/dev
- name: expat
  commit: x86_64/pkg/libs/system/expat/2.6.2/bundles/dev
- name: libffi
  commit: x86_64/pkg/libs/system/libffi/3.4.6/bundles/dev
- name: libxml2
  commit: x86_64/pkg/libs/system/libxml2/2.13.5/bundles/dev
- name: xz
  commit: x86_64/pkg/libs/compression/xz/5.4.6/bundles/dev
- name: zstd
  commit: x86_64/pkg/libs/compression/zstd/1.5.6/bundles/dev

build:
  environment: 27b6e5dc7ad152c9a17c2cabfcc5ee93daa9bbf0
  profile: [4150:2293, 6099:4502]

  script: |
    set -eu

    tar --no-same-owner -xf /${SOURCE_xdg_desktop_portal_wlr} -C "${WORK_DIR}" --strip-components=1
    cd "${WORK_DIR}"

    export PKG_CONFIG_PATH=/usr/lib/pkgconfig:/usr/share/pkgconfig

    meson setup build \
      --prefix=/usr \
      --libdir=lib \
      --libexecdir=libexec \
      --buildtype=release \
      -Dsd-bus-provider=libsystemd \
      -Dsystemd=enabled \
      -Dman-pages=disabled

    ninja -C build
    DESTDIR="${OUT_DIR}" ninja -C build install

    find "${OUT_DIR}" -type f -executable -exec strip --strip-unneeded {} \; 2>/dev/null || true
    find "${OUT_DIR}" -exec touch -d "2024-01-01T00:00:00+00:00" {} \;

bundles:
  full:
  - bin
  - lib
  - misc

outputs:
  bin:
    files:
    - path: /usr/libexec/xdg-desktop-portal-wlr
      needs:
      - /usr/lib/ld-linux-x86-64.so.2
      - /usr/lib/libc.so.6
      - /usr/lib/libdrm.so.2
      - /usr/lib/libgbm.so.1
      - /usr/lib/libinih.so.0
      - /usr/lib/libpipewire-0.3.so.0
      - /usr/lib/libsystemd.so.0
      - /usr/lib/libwayland-client.so.0

  lib:
    files:
    - path: /usr/lib/systemd/user/xdg-desktop-portal-wlr.service

  misc:
    files:
    - path: /usr/share/dbus-1/services/org.freedesktop.impl.portal.desktop.wlr.service
    - path: /usr/share/xdg-desktop-portal/portals/wlr.portal

resolution:
  /usr/lib/ld-linux-x86-64.so.2: glibc
  /usr/lib/libc.so.6: glibc
  /usr/lib/libinih.so.0: inih
  /usr/lib/libdrm.so.2: libdrm
  /usr/lib/libgbm.so.1: mesa
  /usr/lib/libpipewire-0.3.so.0: pipewire
  /usr/lib/libsystemd.so.0: systemd
  /usr/lib/libwayland-client.so.0: wayland
