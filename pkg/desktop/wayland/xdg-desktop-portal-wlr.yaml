build:
  environment: 27b6e5dc7ad152c9a17c2cabfcc5ee93daa9bbf0
  profile: [4134:681, 6236:2189]

  script: |
    set -eu

    tar --no-same-owner -xf /${SOURCE_xdg_desktop_portal_wlr} -C "${WORK_DIR}" --strip-components=1
    cd "${WORK_DIR}"

    patch --batch --fuzz=0 -Np1 -i "/${SOURCE_uapi_config_patch}"

    export PKG_CONFIG_PATH=/usr/lib/pkgconfig:/usr/share/pkgconfig

    meson setup build \
      --prefix=/usr \
      --sysconfdir=/etc \
      --libdir=lib \
      --libexecdir=libexec \
      --buildtype=release \
      -Dsd-bus-provider=libsystemd \
      -Dsystemd=enabled \
      -Dman-pages=disabled

    ninja -C build
    DESTDIR="${OUT_DIR}" ninja -C build install

    admin_conf=/etc/xdg/xdg-desktop-portal-wlr/config
    runtime_conf=/run/xdg/xdg-desktop-portal-wlr/config
    vendor_conf=/usr/share/xdg/xdg-desktop-portal-wlr/config
    mkdir -p /etc/xdg/xdg-desktop-portal-wlr \
      /run/xdg/xdg-desktop-portal-wlr \
      /usr/share/xdg/xdg-desktop-portal-wlr
    write_conf() {
      printf '[screencast]\nmax_fps = %s\n' "$2" > "$1"
    }
    probe_home="${WORK_DIR}/xdpw-uapi-home"
    mkdir -p "${probe_home}"
    probe_out="${WORK_DIR}/xdpw-uapi-probe.out"
    run_probe() {
      env -u WAYLAND_DISPLAY -u XDG_CONFIG_HOME -u XDG_CURRENT_DESKTOP \
        HOME="${probe_home}" \
        "${OUT_DIR}/usr/libexec/xdg-desktop-portal-wlr" -l DEBUG \
        > "${probe_out}" 2>&1 || true
    }
    expect_fps() {
      run_probe
      if ! grep -qF "config: max_fps:  $1" "${probe_out}"; then
        printf 'xdg-desktop-portal-wlr UAPI smoke: expected max_fps %s, log:\n' \
          "$1" >&2
        cat "${probe_out}" >&2
        exit 1
      fi
    }

    write_conf "${admin_conf}" 11
    write_conf "${runtime_conf}" 22
    write_conf "${vendor_conf}" 33
    expect_fps 11
    rm -f "${admin_conf}"
    expect_fps 22
    rm -f "${runtime_conf}"
    expect_fps 33
    rm -f "${vendor_conf}"
    printf 'xdg-desktop-portal-wlr UAPI smoke: config loader read all three tiers in order\n'

    find "${OUT_DIR}" -type f -executable -exec strip --strip-unneeded {} \; 2>/dev/null || true
    find "${OUT_DIR}" -exec touch -d "2024-01-01T00:00:00+00:00" {} \;

bundles:
  full:
  - bin
  - lib
  - misc

outputs:
  bin:
    files:
    - path: /usr/libexec/xdg-desktop-portal-wlr
      needs:
      - /usr/lib/ld-linux-x86-64.so.2
      - /usr/lib/libc.so.6
      - /usr/lib/libdrm.so.2
      - /usr/lib/libgbm.so.1
      - /usr/lib/libinih.so.0
      - /usr/lib/libpipewire-0.3.so.0
      - /usr/lib/libsystemd.so.0
      - /usr/lib/libwayland-client.so.0

  lib:
    files:
    - path: /usr/lib/systemd/user/xdg-desktop-portal-wlr.service

  misc:
    files:
    - path: /usr/share/dbus-1/services/org.freedesktop.impl.portal.desktop.wlr.service
    - path: /usr/share/xdg-desktop-portal/portals/wlr.portal

resolution:
  /usr/lib/ld-linux-x86-64.so.2: glibc
  /usr/lib/libc.so.6: glibc
  /usr/lib/libinih.so.0: inih
  /usr/lib/libdrm.so.2: libdrm
  /usr/lib/libpipewire-0.3.so.0: pipewire
  /usr/lib/libsystemd.so.0: systemd
  /usr/lib/libwayland-client.so.0: wayland
  /usr/lib/libgbm.so.1:
    capability: graphics.gbm
    fallback: mesa
