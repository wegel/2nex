- name: wayland-protocols
  commit: x86_64/pkg/libs/wayland/wayland-protocols/1.46/bundles/dev
- name: pixman
  commit: x86_64/pkg/libs/graphics/pixman/0.46.4/bundles/dev
- name: libpng
  commit: x86_64/pkg/libs/graphics/libpng/1.6.51/bundles/dev
- name: cairo
  commit: x86_64/pkg/libs/graphics/cairo/1.18.4/bundles/dev
- name: libxkbcommon
  commit: x86_64/pkg/libs/input/libxkbcommon/1.7.0/bundles/dev
