  commit: x86_64/pkg/dev/tools/scdoc/1.11.4/bundles/dev

build:
  environment: 13ce31fd97c19f5756e4413babf279d543b5a71c
  profile: [4182:493, 8297:2989, 9129:2992]

  script: |
    tar --no-same-owner -xf ${SOURCE_fuzzel} -C "${WORK_DIR}" --strip-components=1
    cd ${WORK_DIR}

    export PKG_CONFIG_PATH=/usr/lib/pkgconfig:/usr/share/pkgconfig

    meson setup build \
      --prefix=/usr \
      --buildtype=release \
      --pkg-config-path=/usr/lib/pkgconfig:/usr/share/pkgconfig \
      -Dsvg-backend=nanosvg \
      -Denable-cairo=enabled \
      -Dpng-backend=libpng

    ninja -C build
    DESTDIR=${OUT_DIR} ninja -C build install

    find "${OUT_DIR}" -exec touch -d '2024-01-01T00:00:00+00:00' {} \;
    2nex_strip_binaries ${OUT_DIR}

bundles:
  dev:
  - bin

outputs:
  bin:
    files:
    - path: /usr/bin/fuzzel
      needs:
      - /usr/lib/ld-linux-x86-64.so.2
      - /usr/lib/libc.so.6
      - /usr/lib/libcairo.so.2
      - /usr/lib/libfcft.so.4
      - /usr/lib/libfontconfig.so.1
      - /usr/lib/libm.so.6
      - /usr/lib/libpixman-1.so.0
      - /usr/lib/libpng16.so.16
      - /usr/lib/libwayland-client.so.0
      - /usr/lib/libwayland-cursor.so.0
      - /usr/lib/libxkbcommon.so.0

resolution:
  /usr/lib/libcairo.so.2: cairo
  /usr/lib/libfcft.so.4: fcft
  /usr/lib/libfontconfig.so.1: fontconfig
  /usr/lib/ld-linux-x86-64.so.2: glibc
  /usr/lib/libc.so.6: glibc
  /usr/lib/libm.so.6: glibc
  /usr/lib/libpng16.so.16: libpng
  /usr/lib/libxkbcommon.so.0: libxkbcommon
  /usr/lib/libpixman-1.so.0: pixman
  /usr/lib/libwayland-client.so.0: wayland
  /usr/lib/libwayland-cursor.so.0: wayland
