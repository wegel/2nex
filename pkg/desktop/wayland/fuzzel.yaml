package:
  schema: 1
  name: fuzzel
  slug: fuzzel
  namespace: desktop/wayland
  version: 1.13.1
  description: Application launcher for wlroots-based Wayland compositors
  homepage: https://codeberg.org/dnkl/fuzzel
  checksum: f0549b6baa0df1aae9005e32cf9097df7ea86e30807f0eec8b0972e914ee008c

sources:
- name: fuzzel
  url: https://codeberg.org/dnkl/fuzzel/releases/download/1.13.1/fuzzel-1.13.1.tar.gz
  sha256: 5dd0ad62836d7f2f3d8de3bce453ce8d2d354984a116ad8751b941fa71e6b838

