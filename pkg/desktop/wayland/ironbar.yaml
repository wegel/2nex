build:
  environment: 27b6e5dc7ad152c9a17c2cabfcc5ee93daa9bbf0
  profile: [4099:4348, 8215:10857, 11502:98981]

  script: |
    tar --no-same-owner -xf ${SOURCE_ironbar} -C "${WORK_DIR}" --strip-components=1
    cd ${WORK_DIR}

    # extract vendor tarball
    tar --no-same-owner -xf /./${SOURCE_vendor} -C "${WORK_DIR}"

    export CARGO_HOME="${WORK_DIR}/.cargo"
    mkdir -p "${CARGO_HOME}"

    # configure cargo to use vendored deps
    cat > "${CARGO_HOME}/config.toml" << EOF
    [source.crates-io]
    replace-with = "vendored-sources"

    [source.vendored-sources]
    directory = "vendor"
    EOF

    # setup compiler
    mkdir -p /usr/local/bin
    ln -sf /usr/bin/gcc /usr/local/bin/cc
    ln -sf /usr/bin/ld.bfd /usr/local/bin/ld
    export PATH="/usr/local/bin:${PATH}"
    export CARGO_TARGET_X86_64_UNKNOWN_LINUX_GNU_LINKER=gcc
    export RUSTFLAGS="-C codegen-units=1 -C embed-bitcode=yes -C debuginfo=0 -C link-arg=-L/usr/lib"

    export PKG_CONFIG_PATH=/usr/lib/pkgconfig:/usr/share/pkgconfig
    export LIBRARY_PATH=/usr/lib
    # disable LTO for C code to avoid linking issues with static libs
    export CFLAGS="${CFLAGS//-flto=auto/}"

    # build without volume feature (needs libpulse which we don't have)
    cargo build --release --offline --target x86_64-unknown-linux-gnu \
      --no-default-features \
      --features "battery,bluetooth,cli,cairo,clipboard,clock,config+all,custom,focused,http,ipc,keyboard+all,launcher,label,menu,music+all,network_manager,notifications,script,sys_info,workspaces+all"

    mkdir -p ${OUT_DIR}/usr/bin
    install -m 755 target/x86_64-unknown-linux-gnu/release/ironbar ${OUT_DIR}/usr/bin/ironbar

    strip --strip-unneeded ${OUT_DIR}/usr/bin/ironbar

    find "${OUT_DIR}" -exec touch -d '2024-01-01T00:00:00+00:00' {} \;

bundles:
  dev:
  - bin

outputs:
  bin:
    files:
    - path: /usr/bin/ironbar
      needs:
      - /usr/lib/ld-linux-x86-64.so.2
      - /usr/lib/libc.so.6
      - /usr/lib/libcairo-gobject.so.2
      - /usr/lib/libcairo.so.2
      - /usr/lib/libcrypto.so.3
      - /usr/lib/libdbus-1.so.3
      - /usr/lib/libevdev.so.2
      - /usr/lib/libgcc_s.so.1
      - /usr/lib/libgdk_pixbuf-2.0.so.0
      - /usr/lib/libgio-2.0.so.0
      - /usr/lib/libglib-2.0.so.0
      - /usr/lib/libgobject-2.0.so.0
      - /usr/lib/libgtk-4.so.1
      - /usr/lib/libgtk4-layer-shell.so.0
      - /usr/lib/libinput.so.10
      - /usr/lib/libluajit-5.1.so.2
      - /usr/lib/libm.so.6
      - /usr/lib/libpango-1.0.so.0
      - /usr/lib/libssl.so.3
      - /usr/lib/libudev.so.1

