package:
  schema: 1
  name: wlopm
  slug: wlopm
  namespace: desktop/wayland
  version: 1.0.0
  description: Wayland output power management client
  homepage: https://git.sr.ht/~leon_plickat/wlopm
  checksum: 41c45e559265a423b1d191930d9bc1ba32de5018c9f75a5b313ccdb54db0d142

sources:
- name: wlopm
  url: https://git.sr.ht/~leon_plickat/wlopm/archive/v1.0.0.tar.gz
  sha256: 15f31bbd855131943397dded3a26003f2f5056e4c6a1a93d35ff7697b3f1e439

dependencies:
- name: bash
  commit: x86_64/pkg/cli/shells/bash/5.2.21/bundles/dev
- name: coreutils
  commit: x86_64/pkg/core/userland/coreutils/9.5/bundles/dev
- name: findutils
  commit: x86_64/pkg/core/userland/findutils/4.9.0/bundles/dev
- name: gzip
  commit: x86_64/pkg/cli/archive/gzip/1.13/bundles/dev
- name: tar
  commit: x86_64/pkg/cli/archive/tar/1.35/bundles/dev
- name: glibc
  commit: x86_64/pkg/libs/system/glibc/2.39/bundles/dev
- name: gcc
  commit: x86_64/pkg/core/toolchain/gcc/13.2.0/bundles/dev
- name: binutils
  commit: x86_64/pkg/core/toolchain/binutils/2.42/bundles/dev
- name: make
  commit: x86_64/pkg/core/toolchain/make/4.4.1/bundles/dev
- name: ncurses
  commit: x86_64/pkg/libs/system/ncurses/6.4-20230520/bundles/dev
- name: acl
  commit: x86_64/pkg/libs/system/acl/2.3.2/bundles/dev
- name: attr
  commit: x86_64/pkg/libs/system/attr/2.5.2/bundles/dev
- name: linux-headers
  commit: x86_64/pkg/libs/system/linux-headers/6.4.1/bundles/dev
- name: gmp
  commit: x86_64/pkg/libs/system/gmp/6.3.0/bundles/dev
- name: wayland
  commit: x86_64/pkg/libs/wayland/wayland/1.24.0/bundles/dev

build:
  environment: 27b6e5dc7ad152c9a17c2cabfcc5ee93daa9bbf0
  profile: [1570:145]

  script: |
    tar --no-same-owner -xf ${SOURCE_wlopm} -C "${WORK_DIR}" --strip-components=1
    cd ${WORK_DIR}

    make CC=gcc PREFIX=/usr
    mkdir -p "${OUT_DIR}/usr/share/bash-completion/completions"
    make PREFIX=/usr DESTDIR=${OUT_DIR} install

    strip --strip-unneeded ${OUT_DIR}/usr/bin/wlopm

    find "${OUT_DIR}" -exec touch -d '2024-01-01T00:00:00+00:00' {} \;

bundles:
  dev:
  - bin
  - man
  - misc

outputs:
  bin:
    files:
    - path: /usr/bin/wlopm
      needs:
      - /usr/lib/ld-linux-x86-64.so.2
      - /usr/lib/libc.so.6
      - /usr/lib/libwayland-client.so.0

  man:
    files:
    - path: /usr/share/man/man1/wlopm.1

  misc:
    files:
    - path: /usr/share/bash-completion/completions/wlopm

resolution:
  /usr/lib/ld-linux-x86-64.so.2: glibc
  /usr/lib/libc.so.6: glibc
  /usr/lib/libwayland-client.so.0: wayland
