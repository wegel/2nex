  commit: x86_64/pkg/dev/tools/scdoc/1.11.4/bundles/dev

build:
  environment: 27b6e5dc7ad152c9a17c2cabfcc5ee93daa9bbf0
  profile: [4138:1040, 4650:1042]

  script: |
    tar --no-same-owner -xf ${SOURCE_swaylock} -C "${WORK_DIR}" --strip-components=1
    cd ${WORK_DIR}

    export PKG_CONFIG_PATH=/usr/lib/pkgconfig:/usr/share/pkgconfig

    meson setup build \
      --prefix=/usr \
      --buildtype=release \
      --pkg-config-path=/usr/lib/pkgconfig:/usr/share/pkgconfig \
      -Dpam=disabled \
      -Dgdk-pixbuf=enabled

    ninja -C build
    DESTDIR=${OUT_DIR} ninja -C build install

    strip --strip-unneeded ${OUT_DIR}/usr/bin/swaylock

    find "${OUT_DIR}" -exec touch -d '2024-01-01T00:00:00+00:00' {} \;

bundles:
  dev:
  - bin

outputs:
  bin:
    files:
    - path: /usr/bin/swaylock
      needs:
      - /usr/lib/ld-linux-x86-64.so.2
      - /usr/lib/libc.so.6
      - /usr/lib/libcairo.so.2
      - /usr/lib/libcrypt.so.2
      - /usr/lib/libgdk_pixbuf-2.0.so.0
      - /usr/lib/libgobject-2.0.so.0
      - /usr/lib/libwayland-client.so.0
      - /usr/lib/libxkbcommon.so.0

resolution:
  /usr/lib/libcairo.so.2: cairo
  /usr/lib/libgdk_pixbuf-2.0.so.0: gdk-pixbuf
  /usr/lib/libgobject-2.0.so.0: glib2
  /usr/lib/ld-linux-x86-64.so.2: glibc
  /usr/lib/libc.so.6: glibc
  /usr/lib/libcrypt.so.2: libxcrypt
  /usr/lib/libxkbcommon.so.0: libxkbcommon
  /usr/lib/libwayland-client.so.0: wayland
