package:
  schema: 1
  name: slurp
  slug: slurp
  namespace: desktop/wayland
  version: 1.5.0
  description: Select a region in a Wayland compositor
  homepage: https://github.com/emersion/slurp
  checksum: 180573eb8f2db167dce55df5f39abb2420ec9b907e13d229ba815a79cc5fc265

sources:
- name: slurp
  url: https://github.com/emersion/slurp/releases/download/v1.5.0/slurp-1.5.0.tar.gz
  sha256: eeb282b2adc8db5614b852596340b69da6f3954cf6cfbdc4392da509c934208a

dependencies:
- name: bash
  commit: x86_64/pkg/cli/shells/bash/5.2.21/bundles/dev
- name: findutils
  commit: x86_64/pkg/core/userland/findutils/4.9.0/bundles/dev
- name: gzip
  commit: x86_64/pkg/cli/archive/gzip/1.13/bundles/dev
- name: tar
  commit: x86_64/pkg/cli/archive/tar/1.35/bundles/dev
- name: glibc
  commit: x86_64/pkg/libs/system/glibc/2.39/bundles/dev
- name: gcc
  commit: x86_64/pkg/core/toolchain/gcc/13.2.0/bundles/dev
- name: binutils
  commit: x86_64/pkg/core/toolchain/binutils/2.42/bundles/dev
- name: ncurses
  commit: x86_64/pkg/libs/system/ncurses/6.4-20230520/bundles/dev
- name: acl
  commit: x86_64/pkg/libs/system/acl/2.3.2/bundles/dev
- name: attr
  commit: x86_64/pkg/libs/system/attr/2.5.2/bundles/dev
- name: linux-headers
  commit: x86_64/pkg/libs/system/linux-headers/6.4.1/bundles/dev
- name: gmp
  commit: x86_64/pkg/libs/system/gmp/6.3.0/bundles/dev
- name: pkgconf
  commit: x86_64/pkg/core/toolchain/pkgconf/2.2.0/bundles/dev
- name: meson
  commit: x86_64/pkg/core/toolchain/meson/1.6.1/bundles/dev
- name: ninja
  commit: x86_64/pkg/core/toolchain/ninja/1.12.1/bundles/dev
- name: python3
  commit: x86_64/pkg/dev/lang/python3/3.12.2/bundles/dev
- name: zlib
  commit: x86_64/pkg/libs/system/zlib/1.3.1/bundles/dev
- name: libffi
  commit: x86_64/pkg/libs/system/libffi/3.4.6/bundles/dev
- name: expat
  commit: x86_64/pkg/libs/system/expat/2.6.2/bundles/dev
- name: libxml2
  commit: x86_64/pkg/libs/system/libxml2/2.13.5/bundles/dev
- name: wayland
  commit: x86_64/pkg/libs/wayland/wayland/1.24.0/bundles/dev
- name: wayland-protocols
  commit: x86_64/pkg/libs/wayland/wayland-protocols/1.46/bundles/dev
- name: cairo
  commit: x86_64/pkg/libs/graphics/cairo/1.18.4/bundles/dev
- name: libxkbcommon
  commit: x86_64/pkg/libs/input/libxkbcommon/1.7.0/bundles/dev
- name: pixman
  commit: x86_64/pkg/libs/graphics/pixman/0.46.4/bundles/dev
- name: libpng
  commit: x86_64/pkg/libs/graphics/libpng/1.6.51/bundles/dev
- name: freetype
  commit: x86_64/pkg/libs/graphics/freetype/2.14.1/bundles/dev
- name: bzip2
  commit: x86_64/pkg/libs/compression/bzip2/1.0.8/bundles/dev
- name: fontconfig
  commit: x86_64/pkg/libs/graphics/fontconfig/2.17.1/bundles/dev

build:
  environment: 27b6e5dc7ad152c9a17c2cabfcc5ee93daa9bbf0
  profile: [2576:839]

  script: |
    tar --no-same-owner -xf ${SOURCE_slurp} -C "${WORK_DIR}" --strip-components=1
    cd ${WORK_DIR}

    export PKG_CONFIG_PATH=/usr/lib/pkgconfig:/usr/share/pkgconfig

    meson setup build \
      --prefix=/usr \
      --buildtype=release \
      --pkg-config-path=/usr/lib/pkgconfig:/usr/share/pkgconfig \
      -Dman-pages=disabled

    ninja -C build
    DESTDIR=${OUT_DIR} ninja -C build install

    strip --strip-unneeded ${OUT_DIR}/usr/bin/slurp

    find "${OUT_DIR}" -exec touch -d '2024-01-01T00:00:00+00:00' {} \;

bundles:
  dev:
  - bin

outputs:
  bin:
    files:
    - path: /usr/bin/slurp
      needs:
      - /usr/lib/ld-linux-x86-64.so.2
      - /usr/lib/libc.so.6
      - /usr/lib/libcairo.so.2
      - /usr/lib/libwayland-client.so.0
      - /usr/lib/libwayland-cursor.so.0
      - /usr/lib/libxkbcommon.so.0

resolution:
  /usr/lib/libcairo.so.2: cairo
  /usr/lib/ld-linux-x86-64.so.2: glibc
  /usr/lib/libc.so.6: glibc
  /usr/lib/libxkbcommon.so.0: libxkbcommon
  /usr/lib/libwayland-client.so.0: wayland
  /usr/lib/libwayland-cursor.so.0: wayland
