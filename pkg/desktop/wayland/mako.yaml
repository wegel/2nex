package:
  schema: 1
  name: mako
  slug: mako
  namespace: desktop/wayland
  version: 1.9.0
  description: Lightweight Wayland notification daemon
  homepage: https://github.com/emersion/mako
  checksum: 18ecc132fd00b5e67483b0274c278eb2536c2bb1fb01725a13253dba3f67cbd8

sources:
- name: mako
  url: https://github.com/emersion/mako/releases/download/v1.9.0/mako-1.9.0.tar.gz
  sha256: 16d821ef49acfc8503367e1a886d28b2f8578ae9ceb1a7e284888b1e32b3a337

