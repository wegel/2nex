  commit: x86_64/pkg/core/userland/util_linux/2.40/bundles/dev

build:
  environment: 13ce31fd97c19f5756e4413babf279d543b5a71c
  profile: [4109:1301, 4877:1325]

  script: |
    tar --no-same-owner -xf ${SOURCE_mako} -C "${WORK_DIR}" --strip-components=1
    cd ${WORK_DIR}

    export PKG_CONFIG_PATH=/usr/lib/pkgconfig:/usr/share/pkgconfig

    meson setup build \
      --prefix=/usr \
      --buildtype=release \
      --pkg-config-path=/usr/lib/pkgconfig:/usr/share/pkgconfig \
      -Dicons=disabled

    ninja -C build
    DESTDIR=${OUT_DIR} ninja -C build install

    strip --strip-unneeded ${OUT_DIR}/usr/bin/mako

    find "${OUT_DIR}" -exec touch -d '2024-01-01T00:00:00+00:00' {} \;

bundles:
  dev:
  - bin

outputs:
  bin:
    files:
    - path: /usr/bin/mako
      needs:
      - /usr/lib/ld-linux-x86-64.so.2
      - /usr/lib/libc.so.6
      - /usr/lib/libcairo.so.2
      - /usr/lib/libglib-2.0.so.0
      - /usr/lib/libgobject-2.0.so.0
      - /usr/lib/libpango-1.0.so.0
      - /usr/lib/libpangocairo-1.0.so.0
      - /usr/lib/libsystemd.so.0
      - /usr/lib/libwayland-client.so.0
      - /usr/lib/libwayland-cursor.so.0
    - path: /usr/bin/makoctl

resolution:
  /usr/lib/libcairo.so.2: cairo
  /usr/lib/libglib-2.0.so.0: glib2
  /usr/lib/libgobject-2.0.so.0: glib2
  /usr/lib/ld-linux-x86-64.so.2: glibc
  /usr/lib/libc.so.6: glibc
  /usr/lib/libpango-1.0.so.0: pango
  /usr/lib/libpangocairo-1.0.so.0: pango
  /usr/lib/libsystemd.so.0: systemd
  /usr/lib/libwayland-client.so.0: wayland
  /usr/lib/libwayland-cursor.so.0: wayland
