build:
  environment: 27b6e5dc7ad152c9a17c2cabfcc5ee93daa9bbf0
  profile: [4275:30, 5915:763]

  script: |
    # doesn't build correctly with LTO
    CFLAGS=${CFLAGS/-flto=auto/}
    CXXFLAGS=${CXXFLAGS/-flto=auto/}
    LDFLAGS=${LDFLAGS/-flto=auto/}

    tar --no-same-owner -xzf ${SOURCE0} -C "${WORK_DIR}" --strip-components=1
    cd ${WORK_DIR}

    # use ctrl+alt as mod key instead of logo/super
    sed -i 's/#define MODKEY WLR_MODIFIER_LOGO/#define MODKEY (WLR_MODIFIER_CTRL|WLR_MODIFIER_ALT)/' config.def.h

    make CC=gcc PREFIX=/usr XWAYLAND=-DXWAYLAND XLIBS="xcb xcb-icccm"

    make PREFIX=/usr DESTDIR="${OUT_DIR}" install

    find ${OUT_DIR} -type f -executable -exec strip --strip-unneeded {} \; 2>/dev/null || true
    find ${OUT_DIR} -name '*.a' -exec objcopy --enable-deterministic-archives {} \; 2>/dev/null || true
    find "${OUT_DIR}" -exec touch -d "2024-01-01T00:00:00+00:00" {} \;

bundles:
  dev:
  - bin

outputs:
  bin:
    files:
    - path: /usr/bin/vwl
      needs:
      - /usr/lib/ld-linux-x86-64.so.2
      - /usr/lib/libc.so.6
      - /usr/lib/libcairo.so.2
      - /usr/lib/libgobject-2.0.so.0
      - /usr/lib/libinput.so.10
      - /usr/lib/libm.so.6
      - /usr/lib/libpango-1.0.so.0
      - /usr/lib/libpangocairo-1.0.so.0
      - /usr/lib/libwayland-server.so.0
      - /usr/lib/libwlroots-0.19.so
      - /usr/lib/libxcb-icccm.so.4
      - /usr/lib/libxkbcommon.so.0

  misc:
    files:
    - path: /usr/share/wayland-sessions/vwl.desktop

resolution:
  /usr/lib/libcairo.so.2: cairo
  /usr/lib/libgobject-2.0.so.0: glib2
  /usr/lib/ld-linux-x86-64.so.2: glibc
  /usr/lib/libc.so.6: glibc
  /usr/lib/libm.so.6: glibc
  /usr/lib/libinput.so.10: libinput
  /usr/lib/libxkbcommon.so.0: libxkbcommon
  /usr/lib/libpango-1.0.so.0: pango
  /usr/lib/libpangocairo-1.0.so.0: pango
  /usr/lib/libwayland-server.so.0: wayland
  /usr/lib/libwlroots-0.19.so: wlroots
  /usr/lib/libxcb-icccm.so.4: xcb-util-wm
