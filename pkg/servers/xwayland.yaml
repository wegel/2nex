build:
  environment: 27b6e5dc7ad152c9a17c2cabfcc5ee93daa9bbf0
  profile: [4098:1674, 8222:1674, 12327:2288, 16432:2688, 20532:3069, 24682:3570, 28816:3588, 32976:3988, 41273:4290, 43382:4997]

  script: |

    # doesn't build correctly with LTO
    CFLAGS=${CFLAGS/-flto=auto/}
    CXXFLAGS=${CXXFLAGS/-flto=auto/}
    LDFLAGS=${LDFLAGS/-flto=auto/}

    tar --no-same-owner -xf /${SOURCE0} -C "${WORK_DIR}" --strip-components=1
    cd ${WORK_DIR}

    meson setup build \
      --prefix=/usr \
      --buildtype=release \
      -Dglx=false \
      -Dxvfb=false \
      -Dxdmcp=false \
      -Dxcsecurity=false \
      -Ddpms=false \
      -Dscreensaver=false \
      -Dxres=false \
      -Dxinerama=false \
      -Dxselinux=false \
      -Dxwayland_ei=false \
      -Dlibdecor=false \
      -Dsecure-rpc=false

    ninja -C build
    DESTDIR="${OUT_DIR}" ninja -C build install

    find ${OUT_DIR} -type f -executable -exec strip --strip-unneeded {} \; 2>/dev/null || true
    find ${OUT_DIR} -name '*.a' -exec objcopy --enable-deterministic-archives {} \; 2>/dev/null || true
    find "${OUT_DIR}" -exec touch -d "2024-01-01T00:00:00+00:00" {} \;

bundles:
  dev:
  - bin
  - dev

outputs:
  bin:
    files:
    - path: /usr/bin/Xwayland
      needs:
      - /usr/lib/ld-linux-x86-64.so.2
      - /usr/lib/libXau.so.6
      - /usr/lib/libXfont2.so.2
      - /usr/lib/libc.so.6
      - /usr/lib/libcrypto.so.3
      - /usr/lib/libdrm.so.2
      - /usr/lib/libepoxy.so.0
      - /usr/lib/libgbm.so.1
      - /usr/lib/libm.so.6
      - /usr/lib/libpixman-1.so.0
      - /usr/lib/libwayland-client.so.0
      - /usr/lib/libxcvt.so.0
      - /usr/lib/libxshmfence.so.1

  dev:
    files:
    - path: /usr/lib/pkgconfig/xwayland.pc

  lib:
    files:
    - path: /usr/lib/xorg/protocol.txt

  man:
    files:
    - path: /usr/share/man/man1/Xserver.1
    - path: /usr/share/man/man1/Xwayland.1

  misc:
    files:
