package:
  schema: 1
  name: Gawk
  slug: gawk
  namespace: bootstrap/phase0
  version: 5.3.0
  description: GNU awk, a pattern scanning and processing language
  homepage: https://www.gnu.org/software/gawk/
  stable_checksum: false
  seed: true

sources:
- name: gawk
  url: https://ftp.gnu.org/gnu/gawk/gawk-5.3.0.tar.xz
  sha256: ca9c16d3d11d0ff8c69d79dc0b47267e1329a69b39b799895604ed447d3ca90b

dependencies:
- name: toolchain
  commit: x86_64/pkg/bootstrap/phase0/toolchain/1.0/bundles/dev
- name: m4
  commit: x86_64/pkg/bootstrap/phase0/m4/1.4.19/bundles/dev
- name: coreutils
  commit: x86_64/pkg/bootstrap/phase0/coreutils/9.5/bundles/dev
- name: diffutils
  commit: x86_64/pkg/bootstrap/phase0/diffutils/3.10/bundles/dev
- name: file
  commit: x86_64/pkg/bootstrap/phase0/file/5.45/bundles/dev
- name: findutils
  commit: x86_64/pkg/bootstrap/phase0/findutils/4.9.0/bundles/dev

build:
  environment: env/bootstrap.yaml

  profile: [4103:836, 8224:3353, 16439:4984, 25088:6669, 29272:6670, 37567:7664, 41813:7688, 54507:7831, 62766:8107, 69358:8525]
  script: |
    tar --no-same-owner -xf ${SOURCE_gawk} -C "${WORK_DIR}" --strip-components=1
    cd ${WORK_DIR}

    sed -i 's/extras//' Makefile.in
    ./configure --prefix=/usr   \
              --host=${TARGET} \
              --build=$(build-aux/config.guess)
    make
    make DESTDIR=${OUT_DIR} install
    rm -rf ${OUT_DIR}/usr/share/man ${OUT_DIR}/usr/share/info
    rm -rf ${OUT_DIR}/usr/share/locale

    find "${OUT_DIR}" -exec touch -d '2024-01-01T00:00:00+00:00' {} \;

bundles:
  dev:
  - bin

outputs:
  bin:
    files:
    - path: /usr/bin/awk
    - path: /usr/bin/gawk
    - path: /usr/bin/gawk-5.3.0
    - path: /usr/bin/gawkbug
    - path: /usr/libexec/awk/grcat
    - path: /usr/libexec/awk/pwcat

  dev:
    files:
    - path: /usr/include/gawkapi.h

  lib:
    files:
    - path: /usr/lib/gawk/filefuncs.so
    - path: /usr/lib/gawk/fnmatch.so
    - path: /usr/lib/gawk/fork.so
    - path: /usr/lib/gawk/inplace.so
    - path: /usr/lib/gawk/intdiv.so
    - path: /usr/lib/gawk/ordchr.so
    - path: /usr/lib/gawk/readdir.so
    - path: /usr/lib/gawk/readfile.so
    - path: /usr/lib/gawk/revoutput.so
    - path: /usr/lib/gawk/revtwoway.so
    - path: /usr/lib/gawk/rwarray.so
    - path: /usr/lib/gawk/time.so

  misc:
    files:
    - path: /usr/share/awk/assert.awk
    - path: /usr/share/awk/bits2str.awk
    - path: /usr/share/awk/cliff_rand.awk
    - path: /usr/share/awk/ctime.awk
    - path: /usr/share/awk/ftrans.awk
    - path: /usr/share/awk/getopt.awk
    - path: /usr/share/awk/gettime.awk
    - path: /usr/share/awk/group.awk
    - path: /usr/share/awk/have_mpfr.awk
    - path: /usr/share/awk/inplace.awk
    - path: /usr/share/awk/intdiv0.awk
    - path: /usr/share/awk/isnumeric.awk
    - path: /usr/share/awk/join.awk
    - path: /usr/share/awk/libintl.awk
    - path: /usr/share/awk/noassign.awk
    - path: /usr/share/awk/ns_passwd.awk
    - path: /usr/share/awk/ord.awk
    - path: /usr/share/awk/passwd.awk
    - path: /usr/share/awk/processarray.awk
    - path: /usr/share/awk/quicksort.awk
    - path: /usr/share/awk/readable.awk
    - path: /usr/share/awk/readfile.awk
    - path: /usr/share/awk/rewind.awk
    - path: /usr/share/awk/round.awk
    - path: /usr/share/awk/shellquote.awk
    - path: /usr/share/awk/strtonum.awk
    - path: /usr/share/awk/tocsv.awk
    - path: /usr/share/awk/walkarray.awk
    - path: /usr/share/awk/zerofile.awk
