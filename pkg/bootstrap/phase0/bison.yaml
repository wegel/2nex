package:
  schema: 1
  name: Bison
  slug: bison
  namespace: bootstrap/phase0
  version: 3.8.2
  description: The GNU general-purpose parser generator
  homepage: https://www.gnu.org/software/bison/
  stable_checksum: false
  seed: true

  checksum: 8699bb6973a5672638d542e4ed58056871c425d3ed63d48a348cead2d0672856
sources:
- name: bison
  url: https://ftp.gnu.org/gnu/bison/bison-3.8.2.tar.xz
  sha256: 9bba0214ccf7f1079c5d59210045227bcf619519840ebfa80cd3849cff5a5bf2

dependencies:
- name: toolchain
  commit: x86_64/pkg/bootstrap/phase0/toolchain/1.0/bundles/dev
- name: m4
  commit: x86_64/pkg/bootstrap/phase0/m4/1.4.19/bundles/dev
- name: bash
  commit: x86_64/pkg/bootstrap/phase0/bash/5.2.21/bundles/dev
- name: coreutils
  commit: x86_64/pkg/bootstrap/phase0/coreutils/9.5/bundles/dev
- name: diffutils
  commit: x86_64/pkg/bootstrap/phase0/diffutils/3.10/bundles/dev
- name: file
  commit: x86_64/pkg/bootstrap/phase0/file/5.45/bundles/dev
- name: findutils
  commit: x86_64/pkg/bootstrap/phase0/findutils/4.9.0/bundles/dev
- name: gawk
  commit: x86_64/pkg/bootstrap/phase0/gawk/5.3.0/bundles/dev
- name: grep
  commit: x86_64/pkg/bootstrap/phase0/grep/3.11/bundles/dev
- name: gzip
  commit: x86_64/pkg/bootstrap/phase0/gzip/1.13/bundles/dev
- name: make
  commit: x86_64/pkg/bootstrap/phase0/make/4.4.1/bundles/dev
- name: sed
  commit: x86_64/pkg/bootstrap/phase0/sed/4.9/bundles/dev
- name: patch
  commit: x86_64/pkg/bootstrap/phase0/patch/2.7.6/bundles/dev
- name: tar
  commit: x86_64/pkg/bootstrap/phase0/tar/1.35/bundles/dev
- name: xz
  commit: x86_64/pkg/bootstrap/phase0/xz/5.4.6/bundles/dev
- name: bzip2
  commit: x86_64/pkg/bootstrap/phase0/bzip2/1.0.8/bundles/dev

build:
  environment: cec6d21097655bd45c7ecf30e556ec4a77d14646

  profile: [4115:1899, 8249:7653, 12399:9866, 16537:11700, 24758:15397, 28869:16154, 32967:16976, 41315:17213, 49679:17423, 54172:17473]
  script: |
    tar --no-same-owner -xf ${SOURCE_bison} -C "${WORK_DIR}" --strip-components=1
    cd ${WORK_DIR}

    ./configure --prefix=/usr --docdir=/usr/share/doc/bison-3.8.2
    make
    make DESTDIR=$OUT_DIR install
    rm -rf ${OUT_DIR}/usr/share/info ${OUT_DIR}/usr/share/man ${OUT_DIR}/usr/share/doc
    rm -rf ${OUT_DIR}/usr/share/locale

    find "${OUT_DIR}" -exec touch -d '2024-01-01T00:00:00+00:00' {} \;

bundles:
  dev:
  - bin
  - misc

outputs:
  bin:
    files:
    - path: /usr/bin/bison
    - path: /usr/bin/yacc

  misc:
    files:
    - path: /usr/share/aclocal/bison-i18n.m4
    - path: /usr/share/bison/README.md
    - path: /usr/share/bison/bison-default.css
    - path: /usr/share/bison/m4sugar/foreach.m4
    - path: /usr/share/bison/m4sugar/m4sugar.m4
    - path: /usr/share/bison/skeletons/bison.m4
