package:
  schema: 1
  name: Findutils
  slug: findutils
  namespace: bootstrap/phase0
  version: 4.9.0
  description: The GNU versions of find utilities (find and xargs)
  homepage: https://www.gnu.org/software/findutils/
  stable_checksum: false
  seed: true

sources:
- name: findutils
  url: https://ftp.gnu.org/gnu/findutils/findutils-4.9.0.tar.xz
  sha256: a2bfb8c09d436770edc59f50fa483e785b161a3b7b9d547573cb08065fd462fe

dependencies:
- name: toolchain
  commit: x86_64/pkg/bootstrap/phase0/toolchain/1.0/bundles/dev
- name: m4
  commit: x86_64/pkg/bootstrap/phase0/m4/1.4.19/bundles/dev
- name: coreutils
  commit: x86_64/pkg/bootstrap/phase0/coreutils/9.5/bundles/dev
- name: diffutils
  commit: x86_64/pkg/bootstrap/phase0/diffutils/3.10/bundles/dev
- name: file
  commit: x86_64/pkg/bootstrap/phase0/file/5.45/bundles/dev

build:
  environment: cec6d21097655bd45c7ecf30e556ec4a77d14646
  profile: [4111:1310, 8221:3608, 12375:4816, 20640:7071, 24736:8109, 32995:9546, 37095:11010, 49424:13171, 57694:13434, 61043:13571]

  script: |
    tar --no-same-owner -xf ${SOURCE_findutils} -C "${WORK_DIR}" --strip-components=1
    cd ${WORK_DIR}

    ./configure --prefix=/usr                   \
          --localstatedir=/var/lib/locate \
          --host=${TARGET}                 \
          --build=$(build-aux/config.guess)

    make
    make DESTDIR=${OUT_DIR} install
    rm -rf ${OUT_DIR}/usr/share/man ${OUT_DIR}/usr/share/info
    rm -rf ${OUT_DIR}/usr/share/locale

    find "${OUT_DIR}" -exec touch -d '2024-01-01T00:00:00+00:00' {} \;

bundles:
  dev:
  - bin

outputs:
  bin:
    files:
    - path: /usr/bin/find
    - path: /usr/bin/locate
    - path: /usr/bin/updatedb
    - path: /usr/bin/xargs
    - path: /usr/libexec/frcode
