package:
  schema: 1
  name: Bzip2
  slug: bzip2
  namespace: bootstrap/phase0
  version: 1.0.8
  description: A freely available, patent free, high-quality data compressor
  homepage: https://sourceware.org/bzip2/
  stable_checksum: false
  seed: true

  checksum: 9432d15a8d0fa556235d8f09f7db92f350bf851d8e52a0ca8a7fbd1b1173b103
sources:
- name: bzip2
  url: https://sourceware.org/pub/bzip2/bzip2-1.0.8.tar.gz
  sha256: ab5a03176ee106d3f0fa90e381da478ddae405918153cca248e682cd0c4a2269
- name: install_docs_patch
  url: https://www.linuxfromscratch.org/patches/downloads/bzip2/bzip2-1.0.8-install_docs-1.patch
  sha256: 35e3bbd9642af51fef2a8a83afba040d272da42d7e3a251d8e43255a7b496702

dependencies:
- name: toolchain
  commit: x86_64/pkg/bootstrap/phase0/toolchain/1.0/bundles/dev
- name: m4
  commit: x86_64/pkg/bootstrap/phase0/m4/1.4.19/bundles/dev
- name: coreutils
  commit: x86_64/pkg/bootstrap/phase0/coreutils/9.5/bundles/dev
- name: diffutils
  commit: x86_64/pkg/bootstrap/phase0/diffutils/3.10/bundles/dev
- name: file
  commit: x86_64/pkg/bootstrap/phase0/file/5.45/bundles/dev
- name: findutils
  commit: x86_64/pkg/bootstrap/phase0/findutils/4.9.0/bundles/dev
- name: gawk
  commit: x86_64/pkg/bootstrap/phase0/gawk/5.3.0/bundles/dev
- name: grep
  commit: x86_64/pkg/bootstrap/phase0/grep/3.11/bundles/dev
- name: gzip
  commit: x86_64/pkg/bootstrap/phase0/gzip/1.13/bundles/dev
- name: make
  commit: x86_64/pkg/bootstrap/phase0/make/4.4.1/bundles/dev
- name: sed
  commit: x86_64/pkg/bootstrap/phase0/sed/4.9/bundles/dev
- name: patch
  commit: x86_64/pkg/bootstrap/phase0/patch/2.7.6/bundles/dev
- name: tar
  commit: x86_64/pkg/bootstrap/phase0/tar/1.35/bundles/dev
- name: xz
  commit: x86_64/pkg/bootstrap/phase0/xz/5.4.6/bundles/dev

build:
  environment: cec6d21097655bd45c7ecf30e556ec4a77d14646

  profile: [4218:1522, 7134:1557]
  script: |
    tar --no-same-owner -xf ${SOURCE_bzip2} -C "${WORK_DIR}" --strip-components=1
    cd ${WORK_DIR}
    patch -Np1 -i ${SOURCE_install_docs_patch}

    sed -i "s@\(ln -s -f \)\$(PREFIX)/bin/@\1@" Makefile
    sed -i "s@(PREFIX)/man@(PREFIX)/share/man@g" Makefile
    make -f Makefile-libbz2_so
    make clean
    make
    make PREFIX=${OUT_DIR}/usr install
    cp -afv libbz2.so.* ${OUT_DIR}/usr/lib
    ln -sfv libbz2.so.1.0.8 ${OUT_DIR}/usr/lib/libbz2.so
    cp -fv bzip2-shared ${OUT_DIR}/usr/bin/bzip2
    for i in ${OUT_DIR}/usr/bin/{bzcat,bunzip2}; do
      ln -sfv bzip2 $i
    done
    rm -fv ${OUT_DIR}/usr/lib/libbz2.a
    rm -rf ${OUT_DIR}/usr/share/info ${OUT_DIR}/usr/share/man

    find "${OUT_DIR}" -exec touch -d '2024-01-01T00:00:00+00:00' {} \;

bundles:
  dev:
  - bin
  - lib

outputs:
  bin:
    files:
    - path: /usr/bin/bunzip2
    - path: /usr/bin/bzcat
    - path: /usr/bin/bzcmp
    - path: /usr/bin/bzdiff
    - path: /usr/bin/bzegrep
    - path: /usr/bin/bzfgrep
    - path: /usr/bin/bzgrep
    - path: /usr/bin/bzip2
    - path: /usr/bin/bzip2recover
    - path: /usr/bin/bzless
    - path: /usr/bin/bzmore

  dev:
    files:
    - path: /usr/include/bzlib.h

  doc:
    files:
    - path: /usr/share/doc/bzip2-1.0.8/bzip2.txt
    - path: /usr/share/doc/bzip2-1.0.8/manual.html
    - path: /usr/share/doc/bzip2-1.0.8/manual.pdf
    - path: /usr/share/doc/bzip2-1.0.8/manual.ps

  lib:
    files:
    - path: /usr/lib/libbz2.so
    - path: /usr/lib/libbz2.so.1.0
    - path: /usr/lib/libbz2.so.1.0.8
