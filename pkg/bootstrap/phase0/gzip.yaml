package:
  schema: 1
  name: Gzip
  slug: gzip
  namespace: bootstrap/phase0
  version: "1.13"
  description: GNU compression utility
  homepage: https://www.gnu.org/software/gzip/
  stable_checksum: false
  seed: true

sources:
- name: gzip
  url: https://ftp.gnu.org/gnu/gzip/gzip-1.13.tar.xz
  sha256: 7454eb6935db17c6655576c2e1b0fabefd38b4d0936e0f87f48cd062ce91a057

dependencies:
- name: toolchain
  commit: x86_64/pkg/bootstrap/phase0/toolchain/1.0/bundles/dev
- name: m4
  commit: x86_64/pkg/bootstrap/phase0/m4/1.4.19/bundles/dev
- name: coreutils
  commit: x86_64/pkg/bootstrap/phase0/coreutils/9.5/bundles/dev
- name: diffutils
  commit: x86_64/pkg/bootstrap/phase0/diffutils/3.10/bundles/dev
- name: file
  commit: x86_64/pkg/bootstrap/phase0/file/5.45/bundles/dev
- name: findutils
  commit: x86_64/pkg/bootstrap/phase0/findutils/4.9.0/bundles/dev
- name: gawk
  commit: x86_64/pkg/bootstrap/phase0/gawk/5.3.0/bundles/dev
- name: grep
  commit: x86_64/pkg/bootstrap/phase0/grep/3.11/bundles/dev

build:
  environment: cec6d21097655bd45c7ecf30e556ec4a77d14646
  profile: [4124:1367, 8244:4130, 12340:5733, 16437:7524, 20568:8215, 21946:8308]

  script: |
    tar --no-same-owner -xf ${SOURCE_gzip} -C "${WORK_DIR}" --strip-components=1
    cd ${WORK_DIR}

    ./configure --prefix=/usr --host=${TARGET}
    make
    make DESTDIR=${OUT_DIR} install
    rm -rf ${OUT_DIR}/usr/share/info ${OUT_DIR}/usr/share/man

    find "${OUT_DIR}" -exec touch -d '2024-01-01T00:00:00+00:00' {} \;

bundles:
  dev:
  - bin

outputs:
  bin:
    files:
    - path: /usr/bin/gunzip
    - path: /usr/bin/gzexe
    - path: /usr/bin/gzip
    - path: /usr/bin/uncompress
    - path: /usr/bin/zcat
    - path: /usr/bin/zcmp
    - path: /usr/bin/zdiff
    - path: /usr/bin/zegrep
    - path: /usr/bin/zfgrep
    - path: /usr/bin/zforce
    - path: /usr/bin/zgrep
    - path: /usr/bin/zless
    - path: /usr/bin/zmore
    - path: /usr/bin/znew
