package:
  schema: 1
  name: Bash
  slug: bash
  namespace: bootstrap/phase0
  version: 5.2.21
  description: The GNU Bourne Again shell
  homepage: https://www.gnu.org/software/bash/
  stable_checksum: false
  seed: true

  checksum: e5820577ce14fb12366fb3236ce0d6737abe06c8c0270a6fef9d92cb3d370ce3
sources:
- name: bash
  url: https://ftp.gnu.org/gnu/bash/bash-5.2.21.tar.gz
  sha256: c8e31bdc59b69aaffc5b36509905ba3e5cbb12747091d27b4b977f078560d5b8

dependencies:
- name: toolchain
  commit: x86_64/pkg/bootstrap/phase0/toolchain/1.0/bundles/dev
- name: m4
  commit: x86_64/pkg/bootstrap/phase0/m4/1.4.19/bundles/dev

build:
  environment: cec6d21097655bd45c7ecf30e556ec4a77d14646

  profile: [4136:1199, 12359:4801, 24942:8369, 37740:8485, 50621:8576, 58834:8638, 71717:8695, 88451:12190, 105648:12334, 116394:12583]
  script: |
    tar --no-same-owner -xf ${SOURCE_bash} -C "${WORK_DIR}" --strip-components=1
    cd ${WORK_DIR}

    export CFLAGS="$CFLAGS -Wno-error=implicit-function-declaration -Wno-error=incompatible-pointer-types"

    ./configure --prefix=/usr                      \
                --build=$(sh support/config.guess) \
                --host=${TARGET}                   \
                --without-bash-malloc              \
                --disable-readline

    make CFLAGS_FOR_BUILD="-g -DCROSS_COMPILING -std=gnu89"
    make DESTDIR=${OUT_DIR} install
    ln -sv bash ${OUT_DIR}/usr/bin/sh

    rm -rf ${OUT_DIR}/usr/share/man ${OUT_DIR}/usr/share/info ${OUT_DIR}/usr/share/doc
    rm -rf ${OUT_DIR}/usr/include ${OUT_DIR}/usr/lib

    find "${OUT_DIR}" -exec touch -d '2024-01-01T00:00:00+00:00' {} \;

bundles:
  dev:
  - bin

outputs:
  bin:
    files:
    - path: /usr/bin/bash
    - path: /usr/bin/bashbug
    - path: /usr/bin/sh

