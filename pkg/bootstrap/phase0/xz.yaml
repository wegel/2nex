- name: patch
  commit: x86_64/pkg/bootstrap/phase0/patch/2.7.6/bundles/dev
- name: tar
  commit: x86_64/pkg/bootstrap/phase0/tar/1.35/bundles/dev

build:
  environment: cec6d21097655bd45c7ecf30e556ec4a77d14646

  profile: [8231:1768, 21749:3802, 47864:3806, 75500:3848, 99304:3911, 125542:3948, 149499:3997, 185418:4074, 222756:4821, 245534:5622]
  script: |
    tar --no-same-owner -xf ${SOURCE_xz} -C "${WORK_DIR}" --strip-components=1
    cd ${WORK_DIR}

    ./configure --prefix=/usr --libdir=/usr/lib \
          --disable-static \
          --host=${TARGET} \
          --build=$(build-aux/config.guess)
    make
    make DESTDIR=${OUT_DIR} install
    rm -rf ${OUT_DIR}/usr/share/info ${OUT_DIR}/usr/share/man
    rm -rf ${OUT_DIR}/usr/share/locale ${OUT_DIR}/usr/share/doc

    find "${OUT_DIR}" -exec touch -d '2024-01-01T00:00:00+00:00' {} \;

bundles:
  dev:
  - bin
  - lib

