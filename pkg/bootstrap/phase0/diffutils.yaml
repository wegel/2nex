package:
  schema: 1
  name: Diffutils
  slug: diffutils
  namespace: bootstrap/phase0
  version: "3.10"
  description: A package of several programs related to finding differences between files
  homepage: https://www.gnu.org/software/diffutils/
  stable_checksum: false
  seed: true

  checksum: f64a768c1dafd0d6a4efa6fa03d61504c514ac2865f34549acb052bb9c05e38e
sources:
- name: diffutils
  url: https://ftp.gnu.org/gnu/diffutils/diffutils-3.10.tar.xz
  sha256: 90e5e93cc724e4ebe12ede80df1634063c7a855692685919bfe60b556c9bd09e

dependencies:
- name: toolchain
  commit: x86_64/pkg/bootstrap/phase0/toolchain/1.0/bundles/dev
- name: m4
  commit: x86_64/pkg/bootstrap/phase0/m4/1.4.19/bundles/dev
- name: coreutils
  commit: x86_64/pkg/bootstrap/phase0/coreutils/9.5/bundles/dev

build:
  environment: cec6d21097655bd45c7ecf30e556ec4a77d14646

  profile: [4108:1554, 8210:3032, 12321:4332, 16470:5133, 20589:6039, 24690:7100, 28791:8374, 32939:8711, 37065:9001, 38405:9076]
  script: |
    tar --no-same-owner -xf ${SOURCE_diffutils} -C "${WORK_DIR}" --strip-components=1
    cd ${WORK_DIR}

    ./configure --prefix=/usr   \
      --host=${TARGET} \
      --build=$(./build-aux/config.guess)
    make
    make DESTDIR=$OUT_DIR install

    rm -rf ${OUT_DIR}/usr/share

    find "${OUT_DIR}" -exec touch -d '2024-01-01T00:00:00+00:00' {} \;

bundles:
  dev:
  - bin

outputs:
  bin:
    files:
    - path: /usr/bin/cmp
    - path: /usr/bin/diff
    - path: /usr/bin/diff3
    - path: /usr/bin/sdiff
