package:
  schema: 1
  name: Tar
  slug: tar
  namespace: bootstrap/phase0
  version: "1.35"
  description: An archiving program
  homepage: https://www.gnu.org/software/tar/
  stable_checksum: false
  seed: true

sources:
- name: tar
  url: https://ftp.gnu.org/gnu/tar/tar-1.35.tar.xz
  sha256: 4d62ff37342ec7aed748535323930c7cf94acf71c3591882b26a7ea50f3edc16

dependencies:
- name: toolchain
  commit: x86_64/pkg/bootstrap/phase0/toolchain/1.0/bundles/dev
- name: m4
  commit: x86_64/pkg/bootstrap/phase0/m4/1.4.19/bundles/dev
- name: coreutils
  commit: x86_64/pkg/bootstrap/phase0/coreutils/9.5/bundles/dev
- name: diffutils
  commit: x86_64/pkg/bootstrap/phase0/diffutils/3.10/bundles/dev
- name: file
  commit: x86_64/pkg/bootstrap/phase0/file/5.45/bundles/dev
- name: findutils
  commit: x86_64/pkg/bootstrap/phase0/findutils/4.9.0/bundles/dev
- name: gawk
  commit: x86_64/pkg/bootstrap/phase0/gawk/5.3.0/bundles/dev
- name: grep
  commit: x86_64/pkg/bootstrap/phase0/grep/3.11/bundles/dev
- name: gzip
  commit: x86_64/pkg/bootstrap/phase0/gzip/1.13/bundles/dev
- name: make
  commit: x86_64/pkg/bootstrap/phase0/make/4.4.1/bundles/dev
- name: sed
  commit: x86_64/pkg/bootstrap/phase0/sed/4.9/bundles/dev
- name: patch
  commit: x86_64/pkg/bootstrap/phase0/patch/2.7.6/bundles/dev

build:
  environment: cec6d21097655bd45c7ecf30e556ec4a77d14646
  profile: [4106:1253, 8230:3369, 12360:4355, 16500:5579, 20655:6208, 24789:7052, 28885:8118, 37110:10246, 45330:10964, 46563:10989]

  script: |
    tar --no-same-owner -xf ${SOURCE_tar} -C "${WORK_DIR}" --strip-components=1
    cd ${WORK_DIR}

    FORCE_UNSAFE_CONFIGURE=1 ./configure --prefix=/usr                     \
          --host=${TARGET}                   \
          --build=$(build-aux/config.guess)

    make
    make DESTDIR=${OUT_DIR} install
    rm -rf ${OUT_DIR}/usr/share/info ${OUT_DIR}/usr/share/man
    rm -rf ${OUT_DIR}/usr/share/locale

    find "${OUT_DIR}" -exec touch -d '2024-01-01T00:00:00+00:00' {} \;

bundles:
  dev:
  - bin

outputs:
  bin:
    files:
    - path: /usr/bin/tar
    - path: /usr/libexec/rmt
