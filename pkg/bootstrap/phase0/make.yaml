package:
  schema: 1
  name: Make
  slug: make
  namespace: bootstrap/phase0
  version: 4.4.1
  description: Utility to maintain groups of programs
  homepage: https://www.gnu.org/software/make/
  stable_checksum: false
  seed: true

sources:
- name: make
  url: https://ftp.gnu.org/gnu/make/make-4.4.1.tar.gz
  sha256: dd16fb1d67bfab79a72f5e8390735c49e3e8e70b4945a15ab1f81ddb78658fb3

dependencies:
- name: toolchain
  commit: x86_64/pkg/bootstrap/phase0/toolchain/1.0/bundles/dev
- name: m4
  commit: x86_64/pkg/bootstrap/phase0/m4/1.4.19/bundles/dev
- name: coreutils
  commit: x86_64/pkg/bootstrap/phase0/coreutils/9.5/bundles/dev
- name: diffutils
  commit: x86_64/pkg/bootstrap/phase0/diffutils/3.10/bundles/dev
- name: file
  commit: x86_64/pkg/bootstrap/phase0/file/5.45/bundles/dev
- name: findutils
  commit: x86_64/pkg/bootstrap/phase0/findutils/4.9.0/bundles/dev
- name: gawk
  commit: x86_64/pkg/bootstrap/phase0/gawk/5.3.0/bundles/dev
- name: grep
  commit: x86_64/pkg/bootstrap/phase0/grep/3.11/bundles/dev
- name: gzip
  commit: x86_64/pkg/bootstrap/phase0/gzip/1.13/bundles/dev

build:
  environment: env/bootstrap.yaml

  profile: [4100:877, 8210:2595, 12362:3004, 16499:3005, 20694:3006, 24796:3414, 28892:3522, 28946:3530]
  script: |
    tar --no-same-owner -xf ${SOURCE_make} -C "${WORK_DIR}" --strip-components=1
    cd ${WORK_DIR}

    ./configure --prefix=/usr   \
        --without-guile \
        --host=${TARGET} \
        --build=$(build-aux/config.guess)

    make
    make DESTDIR=${OUT_DIR} install
    rm -rf ${OUT_DIR}/usr/share/info ${OUT_DIR}/usr/share/man
    rm -rf ${OUT_DIR}/usr/share/locale

    find "${OUT_DIR}" -exec touch -d '2024-01-01T00:00:00+00:00' {} \;

bundles:
  dev:
  - bin

outputs:
  bin:
    files:
    - path: /usr/bin/make

  dev:
    files:
    - path: /usr/include/gnumake.h
