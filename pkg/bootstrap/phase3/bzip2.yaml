package:
  schema: 1
  name: Bzip2
  slug: bzip2
  namespace: bootstrap/phase3
  version: 1.0.8
  description: A freely available, patent free, high-quality data compressor
  homepage: https://sourceware.org/bzip2/
  checksum: 6d1226c6a2942bd6d5ddae2c54fbbcef15aeb2a01c54b0ac796f19240171f8e9
sources:
- name: bzip2
  url: https://sourceware.org/pub/bzip2/bzip2-1.0.8.tar.gz
  sha256: ab5a03176ee106d3f0fa90e381da478ddae405918153cca248e682cd0c4a2269
- name: install_docs_patch
  url: https://www.linuxfromscratch.org/patches/downloads/bzip2/bzip2-1.0.8-install_docs-1.patch
  sha256: 35e3bbd9642af51fef2a8a83afba040d272da42d7e3a251d8e43255a7b496702
dependencies:
  - name: bootstrap_tools
    commit: x86_64/pkg/bootstrap/phase1/bootstrap_tools/0.0.1/bundles/dev
  - name: bash
    commit: x86_64/pkg/bootstrap/phase1/bash/5.2.21/bundles/dev
  - name: coreutils
    commit: x86_64/pkg/bootstrap/phase1/coreutils/9.5/bundles/dev
  - name: diffutils
    commit: x86_64/pkg/bootstrap/phase1/diffutils/3.10/bundles/dev
  - name: file
    commit: x86_64/pkg/bootstrap/phase1/file/5.45/bundles/dev
  - name: findutils
    commit: x86_64/pkg/bootstrap/phase1/findutils/4.9.0/bundles/dev
  - name: grep
    commit: x86_64/pkg/bootstrap/phase1/grep/3.11/bundles/dev
  - name: gzip
    commit: x86_64/pkg/bootstrap/phase1/gzip/1.13/bundles/dev
  - name: make
    commit: x86_64/pkg/bootstrap/phase1/make/4.4.1/bundles/dev
  - name: patch
    commit: x86_64/pkg/bootstrap/phase1/patch/2.7.6/bundles/dev
  - name: sed
    commit: x86_64/pkg/bootstrap/phase1/sed/4.9/bundles/dev
  - name: tar
    commit: x86_64/pkg/bootstrap/phase1/tar/1.35/bundles/dev
  - name: binutils
    commit: x86_64/pkg/bootstrap/phase1/binutils/2.42/bundles/dev
  - name: gcc
    commit: x86_64/pkg/bootstrap/phase1/gcc/13.2.0/bundles/dev
  - name: glibc
    commit: x86_64/pkg/bootstrap/phase3/glibc-bootstrap/2.39/bundles/dev
  - name: 2nex-utilities
    commit: x86_64/pkg/bootstrap/phase3/2nex-utilities-bootstrap/0.0.1/bundles/dev
build:
  script: "tar --no-same-owner -xf ${SOURCE_bzip2} -C \"${WORK_DIR}\" --strip-components=1\n\
    cd ${WORK_DIR}\n\npatch -Np1 -i /${SOURCE_install_docs_patch}\nsed -i \"s@\\(ln\
    \ -s -f \\)\\$(PREFIX)/bin/@\\1@\" Makefile\nsed -i \"s@(PREFIX)/man@(PREFIX)/share/man@g\"\
    \ Makefile\nmake -f Makefile-libbz2_so\nmake clean\nmake\nmake PREFIX=${OUT_DIR}/usr\
    \ install\n\nmkdir -pv ${OUT_DIR}/usr/{lib,bin}\ncp -afv libbz2.so.* ${OUT_DIR}/usr/lib\n\
    ln -sfv libbz2.so.1.0.8 ${OUT_DIR}/usr/lib/libbz2.so\ncp -fv bzip2-shared ${OUT_DIR}/usr/bin/bzip2\n\
    for i in ${OUT_DIR}/usr/bin/{bzcat,bunzip2}; do\n  ln -sfv bzip2 $i\ndone\n\n\
    find \"${OUT_DIR}\" -exec touch -d '2024-01-01T00:00:00+00:00' {} \\;\n2nex_strip_binaries\
    \ ${OUT_DIR}\n"
bundles:
  full:
  - dev
  - man
  - bin
  - lib
  - static
  - doc
  dev:
  - dev
  - lib
  - static
  - bin
outputs:
  dev:
    files:
    - /usr/include/bzlib.h
  man:
    files:
    - /usr/share/man/man1/bzcmp.1
    - /usr/share/man/man1/bzdiff.1
    - /usr/share/man/man1/bzegrep.1
    - /usr/share/man/man1/bzfgrep.1
    - /usr/share/man/man1/bzgrep.1
    - /usr/share/man/man1/bzip2.1
    - /usr/share/man/man1/bzless.1
    - /usr/share/man/man1/bzmore.1
  bin:
    files:
    - /usr/bin/bunzip2
    - /usr/bin/bzcat
    - /usr/bin/bzcmp
    - /usr/bin/bzdiff
    - /usr/bin/bzegrep
    - /usr/bin/bzfgrep
    - /usr/bin/bzgrep
    - /usr/bin/bzip2
    - /usr/bin/bzip2recover
    - /usr/bin/bzless
    - /usr/bin/bzmore
    requires:
    - x86_64/pkg/bootstrap/phase3/glibc-bootstrap/2.39/outputs/lib
  lib:
    files:
    - /usr/lib/libbz2.so
    - /usr/lib/libbz2.so.1.0
    - /usr/lib/libbz2.so.1.0.8
    requires:
    - x86_64/pkg/bootstrap/phase3/glibc-bootstrap/2.39/outputs/lib
  static:
    files:
    - /usr/lib/libbz2.a
  doc:
    files:
    - /usr/share/doc/bzip2-1.0.8/bzip2.txt
    - /usr/share/doc/bzip2-1.0.8/manual.html
    - /usr/share/doc/bzip2-1.0.8/manual.pdf
    - /usr/share/doc/bzip2-1.0.8/manual.ps
