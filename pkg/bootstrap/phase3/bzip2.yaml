package:
  schema: 1
  name: Bzip2
  slug: bzip2
  namespace: bootstrap/phase3
  version: 1.0.8
  description: A freely available, patent free, high-quality data compressor
  homepage: https://sourceware.org/bzip2/
  checksum: 6d1226c6a2942bd6d5ddae2c54fbbcef15aeb2a01c54b0ac796f19240171f8e9

sources:
- name: bzip2
  url: https://sourceware.org/pub/bzip2/bzip2-1.0.8.tar.gz
  sha256: ab5a03176ee106d3f0fa90e381da478ddae405918153cca248e682cd0c4a2269
- name: install_docs_patch
  url: https://www.linuxfromscratch.org/patches/downloads/bzip2/bzip2-1.0.8-install_docs-1.patch
  sha256: 35e3bbd9642af51fef2a8a83afba040d272da42d7e3a251d8e43255a7b496702

dependencies:
- name: bootstrap_tools
  commit: x86_64/pkg/bootstrap/phase1/bootstrap_tools/0.0.1/bundles/dev
- name: bash
  commit: x86_64/pkg/bootstrap/phase1/bash/5.2.21/bundles/dev
- name: coreutils
  commit: x86_64/pkg/bootstrap/phase1/coreutils/9.5/bundles/dev
- name: diffutils
  commit: x86_64/pkg/bootstrap/phase1/diffutils/3.10/bundles/dev
- name: file
  commit: x86_64/pkg/bootstrap/phase1/file/5.45/bundles/dev
- name: findutils
  commit: x86_64/pkg/bootstrap/phase1/findutils/4.9.0/bundles/dev
- name: grep
  commit: x86_64/pkg/bootstrap/phase1/grep/3.11/bundles/dev
- name: gzip
  commit: x86_64/pkg/bootstrap/phase1/gzip/1.13/bundles/dev
- name: make
  commit: x86_64/pkg/bootstrap/phase1/make/4.4.1/bundles/dev
- name: patch
  commit: x86_64/pkg/bootstrap/phase1/patch/2.7.6/bundles/dev
- name: sed
  commit: x86_64/pkg/bootstrap/phase1/sed/4.9/bundles/dev
- name: tar
  commit: x86_64/pkg/bootstrap/phase1/tar/1.35/bundles/dev
- name: binutils
  commit: x86_64/pkg/bootstrap/phase1/binutils/2.42/bundles/dev
- name: gcc
  commit: x86_64/pkg/bootstrap/phase1/gcc/13.2.0/bundles/dev
- name: glibc
  commit: x86_64/pkg/bootstrap/phase3/glibc-bootstrap/2.39/bundles/dev
- name: 2nex-utilities
  commit: x86_64/pkg/bootstrap/phase3/2nex-utilities-bootstrap/0.0.1/bundles/dev

build:
  environment: 13ce31fd97c19f5756e4413babf279d543b5a71c
  profile: [4164:5494, 8262:9113, 9844:9169]

  script: |
    tar --no-same-owner -xf ${SOURCE_bzip2} -C "${WORK_DIR}" --strip-components=1
    cd ${WORK_DIR}

    patch -Np1 -i /${SOURCE_install_docs_patch}
    sed -i "s@\(ln -s -f \)\$(PREFIX)/bin/@\1@" Makefile
    sed -i "s@(PREFIX)/man@(PREFIX)/share/man@g" Makefile
    make -f Makefile-libbz2_so
    make clean
    make
    make PREFIX=${OUT_DIR}/usr install

    mkdir -pv ${OUT_DIR}/usr/{lib,bin}
    cp -afv libbz2.so.* ${OUT_DIR}/usr/lib
    ln -sfv libbz2.so.1.0.8 ${OUT_DIR}/usr/lib/libbz2.so
    cp -fv bzip2-shared ${OUT_DIR}/usr/bin/bzip2
    for i in ${OUT_DIR}/usr/bin/{bzcat,bunzip2}; do
      ln -sfv bzip2 $i
    done

    find "${OUT_DIR}" -exec touch -d '2024-01-01T00:00:00+00:00' {} \;
    2nex_strip_binaries ${OUT_DIR}

bundles:
  dev:
  - bin
  - dev
  - lib
  - static

  full:
  - bin
  - dev
  - doc
  - lib
  - man
  - static

outputs:
  bin:
    files:
    - path: /usr/bin/bunzip2
    - path: /usr/bin/bzcat
    - path: /usr/bin/bzcmp
    - path: /usr/bin/bzdiff
    - path: /usr/bin/bzegrep
    - path: /usr/bin/bzfgrep
    - path: /usr/bin/bzgrep
    - path: /usr/bin/bzip2
    - path: /usr/bin/bzip2recover
    - path: /usr/bin/bzless
    - path: /usr/bin/bzmore

  dev:
    files:
    - path: /usr/include/bzlib.h

  doc:
    files:
    - path: /usr/share/doc/bzip2-1.0.8/bzip2.txt
    - path: /usr/share/doc/bzip2-1.0.8/manual.html
    - path: /usr/share/doc/bzip2-1.0.8/manual.pdf
    - path: /usr/share/doc/bzip2-1.0.8/manual.ps

  lib:
    files:
    - path: /usr/lib/libbz2.so
    - path: /usr/lib/libbz2.so.1.0
    - path: /usr/lib/libbz2.so.1.0.8

  man:
    files:
    - path: /usr/share/man/man1/bzcmp.1
    - path: /usr/share/man/man1/bzdiff.1
    - path: /usr/share/man/man1/bzegrep.1
    - path: /usr/share/man/man1/bzfgrep.1
    - path: /usr/share/man/man1/bzgrep.1
    - path: /usr/share/man/man1/bzip2.1
    - path: /usr/share/man/man1/bzless.1
    - path: /usr/share/man/man1/bzmore.1

  static:
    files:
    - path: /usr/lib/libbz2.a
