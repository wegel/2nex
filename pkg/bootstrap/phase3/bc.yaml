package:
  schema: 1
  name: Bc
  slug: bc
  namespace: bootstrap/phase3
  version: 6.7.5
  description: An arbitrary precision numeric processing language
  homepage: https://git.yzena.com/gavin/bc
  checksum: 51e183690ad87dc322f23c34c30616ced902bc391dcb3122746e1e3079143904

sources:
- name: bc
  url: https://github.com/gavinhoward/bc/releases/download/6.7.5/bc-6.7.5.tar.xz
  sha256: c3e02c948d51f3ca9cdb23e011050d2d3a48226c581e0749ed7cbac413ce5461

dependencies:
- name: bootstrap_tools
  commit: x86_64/pkg/bootstrap/phase1/bootstrap_tools/0.0.1/bundles/dev
- name: bash
  commit: x86_64/pkg/bootstrap/phase1/bash/5.2.21/bundles/dev
- name: coreutils
  commit: x86_64/pkg/bootstrap/phase1/coreutils/9.5/bundles/dev
- name: diffutils
  commit: x86_64/pkg/bootstrap/phase1/diffutils/3.10/bundles/dev
- name: findutils
  commit: x86_64/pkg/bootstrap/phase1/findutils/4.9.0/bundles/dev
- name: gawk
  commit: x86_64/pkg/bootstrap/phase1/gawk/5.3.0/bundles/dev
- name: make
  commit: x86_64/pkg/bootstrap/phase1/make/4.4.1/bundles/dev
- name: sed
  commit: x86_64/pkg/bootstrap/phase1/sed/4.9/bundles/dev
- name: tar
  commit: x86_64/pkg/bootstrap/phase1/tar/1.35/bundles/dev
- name: binutils
  commit: x86_64/pkg/bootstrap/phase1/binutils/2.42/bundles/dev
- name: gcc
  commit: x86_64/pkg/bootstrap/phase1/gcc/13.2.0/bundles/dev
- name: glibc
  commit: x86_64/pkg/bootstrap/phase3/glibc-bootstrap/2.39/bundles/dev
- name: 2nex-utilities
  commit: x86_64/pkg/bootstrap/phase3/2nex-utilities-bootstrap/0.0.1/bundles/dev
- name: xz
  commit: x86_64/pkg/bootstrap/phase3/xz/5.4.6/bundles/dev

build:
  environment: 13ce31fd97c19f5756e4413babf279d543b5a71c
  profile: [4718:665, 9184:667, 13630:668, 18086:670, 22876:894, 26989:4213, 31137:4233, 39371:4283, 47606:6464, 49526:6470]

  script: |
    tar --no-same-owner -xf ${SOURCE_bc} -C "${WORK_DIR}" --strip-components=1
    cd ${WORK_DIR}

    CC=gcc ./configure --prefix=/usr -G -O3 -r
    make
    make test  
    make DESTDIR="${OUT_DIR}" install

    find "${OUT_DIR}" -exec touch -d '2024-01-01T00:00:00+00:00' {} \;
    2nex_strip_binaries ${OUT_DIR}

bundles:
  dev:
  - bin

  full:
  - bin
  - locale
  - man

outputs:
  bin:
    files:
    - path: /usr/bin/bc
    - path: /usr/bin/dc

  locale:
    files:
    - path: /usr/share/locale/de_AT.UTF-8/bc
    - path: /usr/share/locale/de_CH.UTF-8/bc
    - path: /usr/share/locale/de_DE.UTF-8/bc
    - path: /usr/share/locale/en_AU.UTF-8/bc
    - path: /usr/share/locale/en_CA.UTF-8/bc
    - path: /usr/share/locale/en_GB.UTF-8/bc
    - path: /usr/share/locale/en_IE.UTF-8/bc
    - path: /usr/share/locale/en_NZ.UTF-8/bc
    - path: /usr/share/locale/en_US.UTF-8/bc
    - path: /usr/share/locale/en_US/bc
    - path: /usr/share/locale/es_ES.UTF-8/bc
    - path: /usr/share/locale/fr_BE.UTF-8/bc
    - path: /usr/share/locale/fr_CA.UTF-8/bc
    - path: /usr/share/locale/fr_CH.UTF-8/bc
    - path: /usr/share/locale/fr_FR.UTF-8/bc
    - path: /usr/share/locale/ja_JP.UTF-8/bc
    - path: /usr/share/locale/nl_NL.UTF-8/bc
    - path: /usr/share/locale/pl_PL.UTF-8/bc
    - path: /usr/share/locale/pt_BR.UTF-8/bc
    - path: /usr/share/locale/pt_PT.UTF-8/bc
    - path: /usr/share/locale/ru_RU.CP1251/bc
    - path: /usr/share/locale/ru_RU.KOI8-R/bc
    - path: /usr/share/locale/ru_RU.UTF-8/bc
    - path: /usr/share/locale/zh_CN.GB2312/bc
    - path: /usr/share/locale/zh_CN.GB18030/bc
    - path: /usr/share/locale/zh_CN.GBK/bc
    - path: /usr/share/locale/zh_CN.UTF-8/bc

  man:
    files:
    - path: /usr/share/man/man1/bc.1
    - path: /usr/share/man/man1/dc.1
