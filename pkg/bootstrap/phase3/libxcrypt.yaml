package:
  schema: 1
  name: Libxcrypt
  slug: libxcrypt
  namespace: bootstrap/phase3
  version: 4.4.36
  description: Extended cryptographic library
  homepage: https://github.com/besser82/libxcrypt
  checksum: 4089c92bd3c6573c6bdc25673fb1b2c4015f06a772ec5bda6ec6e6515d474f9c
sources:
- name: libxcrypt
  url: https://github.com/besser82/libxcrypt/releases/download/v4.4.36/libxcrypt-4.4.36.tar.xz
  sha256: e5e1f4caee0a01de2aee26e3138807d6d3ca2b8e67287966d1fefd65e1fd8943
dependencies:
  - name: bootstrap_tools
    commit: x86_64/pkg/bootstrap/phase1/bootstrap_tools/0.0.1/bundles/dev
  - name: bash
    commit: x86_64/pkg/bootstrap/phase1/bash/5.2.21/bundles/dev
  - name: coreutils
    commit: x86_64/pkg/bootstrap/phase1/coreutils/9.5/bundles/dev
  - name: findutils
    commit: x86_64/pkg/bootstrap/phase1/findutils/4.9.0/bundles/dev
  - name: 2nex-utilities
    commit: x86_64/pkg/bootstrap/phase3/2nex-utilities-bootstrap/0.0.1/bundles/dev
  - name: gawk
    commit: x86_64/pkg/bootstrap/phase1/gawk/5.3.0/bundles/dev
  - name: grep
    commit: x86_64/pkg/bootstrap/phase1/grep/3.11/bundles/dev
  - name: make
    commit: x86_64/pkg/bootstrap/phase1/make/4.4.1/bundles/dev
  - name: sed
    commit: x86_64/pkg/bootstrap/phase1/sed/4.9/bundles/dev
  - name: tar
    commit: x86_64/pkg/bootstrap/phase1/tar/1.35/bundles/dev
  - name: gcc
    commit: x86_64/pkg/bootstrap/phase1/gcc/13.2.0/bundles/dev
  - name: perl
    commit: x86_64/pkg/bootstrap/phase2/perl/5.38.2/bundles/dev
  - name: glibc
    commit: x86_64/pkg/bootstrap/phase3/glibc-bootstrap/2.39/bundles/dev
  - name: zlib
    commit: x86_64/pkg/bootstrap/phase3/zlib/1.3.1/bundles/dev
  - name: bzip2
    commit: x86_64/pkg/bootstrap/phase3/bzip2/1.0.8/bundles/dev
  - name: xz
    commit: x86_64/pkg/bootstrap/phase3/xz/5.4.6/bundles/dev
  - name: file
    commit: x86_64/pkg/bootstrap/phase3/file/5.45/bundles/dev
  - name: binutils
    commit: x86_64/pkg/bootstrap/phase3/binutils/2.42/bundles/dev
build:
  script: "tar --no-same-owner -xf ${SOURCE_libxcrypt} -C \"${WORK_DIR}\" --strip-components=1\n\
    cd ${WORK_DIR}\n\n./configure --prefix=/usr                \\\n          --enable-hashes=strong,glibc\
    \ \\\n          --enable-obsolete-api=no     \\\n          --disable-failure-tokens\n\
    \       \nmake\nmake DESTDIR=\"${OUT_DIR}\" install\n\nfind \"${OUT_DIR}\" -exec\
    \ touch -d '2024-01-01T00:00:00+00:00' {} \\;\n2nex_strip_binaries ${OUT_DIR}\n"
bundles:
  full:
  - dev
  - static
  - man
  - lib
  dev:
  - dev
  - static
  - lib
outputs:
  dev:
    files:
    - /usr/include/crypt.h
    - /usr/lib/libcrypt.la
    - /usr/lib/pkgconfig/libcrypt.pc
    - /usr/lib/pkgconfig/libxcrypt.pc
  static:
    files:
    - /usr/lib/libcrypt.a
  man:
    files:
    - /usr/share/man/man3/crypt.3
    - /usr/share/man/man3/crypt_checksalt.3
    - /usr/share/man/man3/crypt_gensalt.3
    - /usr/share/man/man3/crypt_gensalt_ra.3
    - /usr/share/man/man3/crypt_gensalt_rn.3
    - /usr/share/man/man3/crypt_preferred_method.3
    - /usr/share/man/man3/crypt_r.3
    - /usr/share/man/man3/crypt_ra.3
    - /usr/share/man/man3/crypt_rn.3
    - /usr/share/man/man5/crypt.5
  lib:
    files:
    - /usr/lib/libcrypt.so
    - /usr/lib/libcrypt.so.2
    - /usr/lib/libcrypt.so.2.0.0
    requires:
    - x86_64/pkg/bootstrap/phase3/glibc-bootstrap/2.39/outputs/lib
