package:
  schema: 1
  name: Libxcrypt
  slug: libxcrypt
  namespace: bootstrap/phase3
  version: 4.4.36
  description: Extended cryptographic library
  homepage: https://github.com/besser82/libxcrypt
  checksum: de68afa9212f217558a3d1917304d89f5b935b76a248afa0dca713b21da27be4

sources:
- name: libxcrypt
  url: https://github.com/besser82/libxcrypt/releases/download/v4.4.36/libxcrypt-4.4.36.tar.xz
  sha256: e5e1f4caee0a01de2aee26e3138807d6d3ca2b8e67287966d1fefd65e1fd8943

dependencies:
- name: bootstrap_tools
  commit: x86_64/pkg/bootstrap/phase1/bootstrap_tools/0.0.1/bundles/dev
- name: bash
  commit: x86_64/pkg/bootstrap/phase1/bash/5.2.21/bundles/dev
- name: coreutils
  commit: x86_64/pkg/bootstrap/phase1/coreutils/9.5/bundles/dev
- name: findutils
  commit: x86_64/pkg/bootstrap/phase1/findutils/4.9.0/bundles/dev
- name: 2nex-utilities
  commit: x86_64/pkg/bootstrap/phase3/2nex-utilities-bootstrap/0.0.1/bundles/dev
- name: gawk
  commit: x86_64/pkg/bootstrap/phase1/gawk/5.3.0/bundles/dev
- name: grep
  commit: x86_64/pkg/bootstrap/phase1/grep/3.11/bundles/dev
- name: make
  commit: x86_64/pkg/bootstrap/phase1/make/4.4.1/bundles/dev
- name: sed
  commit: x86_64/pkg/bootstrap/phase1/sed/4.9/bundles/dev
- name: tar
  commit: x86_64/pkg/bootstrap/phase1/tar/1.35/bundles/dev
- name: gcc
  commit: x86_64/pkg/bootstrap/phase1/gcc/13.2.0/bundles/dev
- name: perl
  commit: x86_64/pkg/bootstrap/phase2/perl/5.38.2/bundles/dev
- name: glibc
  commit: x86_64/pkg/bootstrap/phase3/glibc-bootstrap/2.39/bundles/dev
- name: zlib
  commit: x86_64/pkg/bootstrap/phase3/zlib/1.3.1/bundles/dev
- name: bzip2
  commit: x86_64/pkg/bootstrap/phase3/bzip2/1.0.8/bundles/dev
- name: xz
  commit: x86_64/pkg/bootstrap/phase3/xz/5.4.6/bundles/dev
- name: file
  commit: x86_64/pkg/bootstrap/phase3/file/5.45/bundles/dev
- name: binutils
  commit: x86_64/pkg/bootstrap/phase3/binutils/2.42/bundles/dev

build:
  environment: 13ce31fd97c19f5756e4413babf279d543b5a71c
  profile: [4103:1490, 13192:3402, 22447:3404, 36517:3406, 45614:3452, 54420:3457, 67705:3512, 80867:3560, 97862:3715, 107284:7990]

  script: |
    tar --no-same-owner -xf ${SOURCE_libxcrypt} -C "${WORK_DIR}" --strip-components=1
    cd ${WORK_DIR}

    ./configure --prefix=/usr                \
              --enable-hashes=strong,glibc \
              --enable-obsolete-api=no     \
              --disable-failure-tokens
           
    make
    make DESTDIR="${OUT_DIR}" install

    find "${OUT_DIR}" -exec touch -d '2024-01-01T00:00:00+00:00' {} \;
    2nex_strip_binaries ${OUT_DIR}

bundles:
  dev:
  - dev
  - lib
  - static

  full:
  - dev
  - lib
  - man
  - static

outputs:
  dev:
    files:
    - path: /usr/include/crypt.h
    - path: /usr/lib/libcrypt.la
    - path: /usr/lib/pkgconfig/libcrypt.pc
    - path: /usr/lib/pkgconfig/libxcrypt.pc

  lib:
    files:
    - path: /usr/lib/libcrypt.so
    - path: /usr/lib/libcrypt.so.2
    - path: /usr/lib/libcrypt.so.2.0.0

  man:
    files:
    - path: /usr/share/man/man3/crypt.3
    - path: /usr/share/man/man3/crypt_checksalt.3
    - path: /usr/share/man/man3/crypt_gensalt.3
    - path: /usr/share/man/man3/crypt_gensalt_ra.3
    - path: /usr/share/man/man3/crypt_gensalt_rn.3
    - path: /usr/share/man/man3/crypt_preferred_method.3
    - path: /usr/share/man/man3/crypt_r.3
    - path: /usr/share/man/man3/crypt_ra.3
    - path: /usr/share/man/man3/crypt_rn.3
    - path: /usr/share/man/man5/crypt.5

  static:
    files:
    - path: /usr/lib/libcrypt.a
