package:
  schema: 1
  name: Linux Kernel Headers
  slug: linux-headers
  namespace: bootstrap/phase3
  version: 6.4.1
  description: Header files of the Linux kernel
  homepage: https://www.kernel.org/
  checksum: 8aeda304965283bf76e8e4362fbde4219046831d33c3c1393c8b7d72dbb9124e
sources:
- name: linux
  url: https://cdn.kernel.org/pub/linux/kernel/v6.x/linux-6.4.1.tar.xz
  sha256: 0d9daa9f1c176fb13b9447f6e3d80e82b49043f0d344c247bbf09b4e625beef3
dependencies:
- name: bootstrap_tools
  commit: x86_64/pkg/bootstrap/phase1/bootstrap_tools/0.0.1/bundles/dev
- name: bash
  commit: x86_64/pkg/bootstrap/phase1/bash/5.2.21/bundles/dev
- name: tar
