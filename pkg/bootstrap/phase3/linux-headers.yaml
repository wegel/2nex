- name: make
  commit: x86_64/pkg/bootstrap/phase1/make/4.4.1/bundles/dev
- name: glibc
  commit: x86_64/pkg/bootstrap/phase3/glibc-bootstrap/2.39/bundles/dev
- name: zlib
  commit: x86_64/pkg/bootstrap/phase3/zlib/1.3.1/bundles/dev
- name: xz
  commit: x86_64/pkg/bootstrap/phase3/xz/5.4.6/bundles/dev
- name: binutils
  commit: x86_64/pkg/bootstrap/phase3/binutils/2.42/bundles/dev
- name: gmp
  commit: x86_64/pkg/bootstrap/phase3/gmp-bootstrap/6.3.0/bundles/dev
- name: mpfr
  commit: x86_64/pkg/bootstrap/phase3/mpfr/4.2.1/bundles/dev
- name: mpc
  commit: x86_64/pkg/bootstrap/phase3/mpc/1.2.1/bundles/dev
- name: gcc
  commit: x86_64/pkg/bootstrap/phase3/gcc/13.2.0/bundles/dev
build:
  script: |
    tar --no-same-owner -xf ${SOURCE_linux} -C "${WORK_DIR}" --strip-components=1
    cd "${WORK_DIR}"

    make mrproper
    make headers

    find usr/include -type f ! -name '*.h' -delete
    mkdir -p ${OUT_DIR}/usr/include
    cp -rv usr/include ${OUT_DIR}/usr

    # use headers from libdrm
    rm -r "${OUT_DIR}/usr/include/drm"
    find "${OUT_DIR}" -exec touch -d '2024-01-01T00:00:00+00:00' {} \;
bundles:
  full:
  - dev
  dev:
  - dev
