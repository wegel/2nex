package:
  schema: 1
  name: File
  slug: file
  namespace: bootstrap/phase3
  version: '5.45'
  description: File type identification utility
  homepage: https://www.darwinsys.com/file/
  checksum: 2b3174e270b5ccdf9525acf06fc700b52874eb5882722549a17294ca0e1d1a7e
sources:
- name: file
  url: https://astron.com/pub/file/file-5.45.tar.gz
  sha256: fc97f51029bb0e2c9f4e3bffefdaf678f0e039ee872b9de5c002a6d09c784d82
dependencies:
  - name: bootstrap_tools
    commit: x86_64/pkg/bootstrap/phase1/bootstrap_tools/0.0.1/bundles/dev
  - name: bash
    commit: x86_64/pkg/bootstrap/phase1/bash/5.2.21/bundles/dev
  - name: coreutils
    commit: x86_64/pkg/bootstrap/phase1/coreutils/9.5/bundles/dev
  - name: file
    commit: x86_64/pkg/bootstrap/phase1/file/5.45/bundles/dev
  - name: findutils
    commit: x86_64/pkg/bootstrap/phase1/findutils/4.9.0/bundles/dev
  - name: gawk
    commit: x86_64/pkg/bootstrap/phase1/gawk/5.3.0/bundles/dev
  - name: grep
    commit: x86_64/pkg/bootstrap/phase1/grep/3.11/bundles/dev
  - name: gzip
    commit: x86_64/pkg/bootstrap/phase1/gzip/1.13/bundles/dev
  - name: make
    commit: x86_64/pkg/bootstrap/phase1/make/4.4.1/bundles/dev
  - name: sed
    commit: x86_64/pkg/bootstrap/phase1/sed/4.9/bundles/dev
  - name: tar
    commit: x86_64/pkg/bootstrap/phase1/tar/1.35/bundles/dev
  - name: binutils
    commit: x86_64/pkg/bootstrap/phase1/binutils/2.42/bundles/dev
  - name: gcc
    commit: x86_64/pkg/bootstrap/phase1/gcc/13.2.0/bundles/dev
  - name: glibc
    commit: x86_64/pkg/bootstrap/phase3/glibc-bootstrap/2.39/bundles/dev
  - name: zlib
    commit: x86_64/pkg/bootstrap/phase3/zlib/1.3.1/bundles/dev
  - name: 2nex-utilities
    commit: x86_64/pkg/bootstrap/phase3/2nex-utilities-bootstrap/0.0.1/bundles/dev
  - name: bzip2
    commit: x86_64/pkg/bootstrap/phase3/bzip2/1.0.8/bundles/dev
  - name: xz
    commit: x86_64/pkg/bootstrap/phase3/xz/5.4.6/bundles/dev
build:
  script: 'tar --no-same-owner -xf ${SOURCE_file} -C "${WORK_DIR}" --strip-components=1

    cd ${WORK_DIR}

    ./configure --prefix=/usr

    make

    make check

    make DESTDIR="${OUT_DIR}" install


    find "${OUT_DIR}" -exec touch -d ''2024-01-01T00:00:00+00:00'' {} \;

    2nex_strip_binaries ${OUT_DIR}

    '
bundles:
  full:
  - man
  - bin
  - lib
  - dev
  dev:
  - bin
  - lib
  - dev
  - misc
outputs:
  man:
    files:
    - /usr/share/man/man1/file.1
    - /usr/share/man/man3/libmagic.3
    - /usr/share/man/man4/magic.4
  bin:
    files:
    - /usr/bin/file
    requires:
    - x86_64/pkg/bootstrap/phase3/glibc-bootstrap/2.39/outputs/lib
  lib:
    files:
    - /usr/lib/libmagic.so
    - /usr/lib/libmagic.so.1
    - /usr/lib/libmagic.so.1.0.0
    requires:
    - x86_64/pkg/bootstrap/phase3/bzip2/1.0.8/outputs/lib
    - x86_64/pkg/bootstrap/phase3/glibc-bootstrap/2.39/outputs/lib
    - x86_64/pkg/bootstrap/phase3/xz/5.4.6/outputs/lib
    - x86_64/pkg/bootstrap/phase3/zlib/1.3.1/outputs/lib
  dev:
    files:
    - /usr/include/magic.h
    - /usr/lib/libmagic.la
    - /usr/lib/pkgconfig/libmagic.pc
  misc:
    files:
    - /usr/share/misc/magic.mgc
