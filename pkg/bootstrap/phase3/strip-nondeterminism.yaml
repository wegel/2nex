package:
  schema: 1
  name: strip-nondeterminism
  slug: strip-nondeterminism
  namespace: bootstrap/phase3
  version: 1.13.0
  description: A program for automating interactive applications
  homepage: https://core.tcl.tk/expect/
  checksum: 53840bce0f43539a8c69e5d1957265139a995db6044595f0cb808b84c9f17e32
sources:
- name: strip_nondeterminism
  url: https://salsa.debian.org/reproducible-builds/reproducible-lfs/-/raw/master/releases/strip-nondeterminism/strip-nondeterminism_1.13.0.tar.bz2?ref_type=heads
  sha256: a70cdad5d728ea78b75d09880c4b51c7d887e89d0b610149b10cfb2abc70b4fc
dependencies:
- name: bootstrap_tools
  commit: x86_64/pkg/bootstrap/phase1/bootstrap_tools/0.0.1/bundles/dev
- name: bash
  commit: x86_64/pkg/bootstrap/phase1/bash/5.2.21/bundles/dev
- name: coreutils
  commit: x86_64/pkg/bootstrap/phase1/coreutils/9.5/bundles/dev
- name: findutils
  commit: x86_64/pkg/bootstrap/phase1/findutils/4.9.0/bundles/dev
- name: make
  commit: x86_64/pkg/bootstrap/phase1/make/4.4.1/bundles/dev
- name: tar
  commit: x86_64/pkg/bootstrap/phase1/tar/1.35/bundles/dev
- name: perl
  commit: x86_64/pkg/bootstrap/phase2/perl/5.38.2/bundles/dev
- name: bzip2
  commit: x86_64/pkg/bootstrap/phase1/bzip2/1.0.8/bundles/dev
build:
  script: |
    tar --no-same-owner -xf ${SOURCE_strip_nondeterminism} -C "${WORK_DIR}" --strip-components=1
    cd ${WORK_DIR}
    perl Makefile.PL

    make
    make DESTDIR="${OUT_DIR}" install

    find "${OUT_DIR}" -exec touch -d '2024-01-01T00:00:00+00:00' {} \;
bundles:
  full:
  - man
  - bin
  - lib
  dev:
  - lib
  - bin
outputs:
