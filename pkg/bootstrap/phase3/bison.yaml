package:
  schema: 1
  name: Bison
  slug: bison
  namespace: bootstrap/phase3
  version: 3.8.2
  description: The GNU general-purpose parser generator
  homepage: https://www.gnu.org/software/bison/
  checksum: f243a8faaf1d6460bae87523763274c5da535ab5ef3a894cdc5ee4ef8aa3ec07
  seed: true

sources:
- name: bison
  url: https://ftp.gnu.org/gnu/bison/bison-3.8.2.tar.xz
  sha256: 9bba0214ccf7f1079c5d59210045227bcf619519840ebfa80cd3849cff5a5bf2

dependencies:
- name: temporary-system
  commit: x86_64/pkg/bootstrap/phase1/temporary-system/1.0/bundles/dev
- name: linux-headers
  commit: x86_64/pkg/bootstrap/phase3/linux-headers/6.4.1/bundles/dev
- name: glibc
  commit: x86_64/pkg/bootstrap/phase3/glibc/2.39/bundles/dev
- name: binutils
  commit: x86_64/pkg/bootstrap/phase3/binutils/2.42/bundles/dev
- name: gcc
  commit: x86_64/pkg/bootstrap/phase3/gcc/13.2.0/bundles/dev

build:
  environment: 002d6759a3ccdb3587b39a187250574c6d1de529
  profile: [4100:3128, 8222:11742, 12321:15358, 16419:21801, 20529:26143, 24649:29789, 28753:30288, 32862:30595, 41157:32133, 41522:32168]

  script: |
    tar --no-same-owner -xf /${SOURCE_bison} -C "${WORK_DIR}" --strip-components=1
    cd ${WORK_DIR}

    ./configure --prefix=/usr --disable-nls
    make
    make DESTDIR=$OUT_DIR install

    rm -rf ${OUT_DIR}/usr/share/info ${OUT_DIR}/usr/share/man ${OUT_DIR}/usr/share/doc
    rm -rf ${OUT_DIR}/usr/share/locale
    rm -f ${OUT_DIR}/usr/lib/liby.a

    find ${OUT_DIR} -type f -executable -exec strip --strip-unneeded {} \; 2>/dev/null || true
    find ${OUT_DIR} -name '*.a' -exec objcopy --enable-deterministic-archives {} \; 2>/dev/null || true
    find "${OUT_DIR}" -exec touch -d '2024-01-01T00:00:00+00:00' {} \;

bundles:
  dev:
  - bin
  - misc

outputs:
  bin:
    files:
    - path: /usr/bin/bison
    - path: /usr/bin/yacc

  misc:
    files:
    - path: /usr/share/aclocal/bison-i18n.m4
    - path: /usr/share/bison/README.md
    - path: /usr/share/bison/bison-default.css
    - path: /usr/share/bison/m4sugar/foreach.m4
    - path: /usr/share/bison/m4sugar/m4sugar.m4
    - path: /usr/share/bison/skeletons/bison.m4
    - path: /usr/share/bison/skeletons/c++-skel.m4
    - path: /usr/share/bison/skeletons/c++.m4
    - path: /usr/share/bison/skeletons/c-like.m4
    - path: /usr/share/bison/skeletons/c-skel.m4
    - path: /usr/share/bison/skeletons/c.m4
    - path: /usr/share/bison/skeletons/d-skel.m4
    - path: /usr/share/bison/skeletons/d.m4
    - path: /usr/share/bison/skeletons/glr.c
    - path: /usr/share/bison/skeletons/glr.cc
    - path: /usr/share/bison/skeletons/glr2.cc
    - path: /usr/share/bison/skeletons/java-skel.m4
    - path: /usr/share/bison/skeletons/java.m4
    - path: /usr/share/bison/skeletons/lalr1.cc
    - path: /usr/share/bison/skeletons/lalr1.d
    - path: /usr/share/bison/skeletons/lalr1.java
    - path: /usr/share/bison/skeletons/location.cc
    - path: /usr/share/bison/skeletons/stack.hh
    - path: /usr/share/bison/skeletons/traceon.m4
    - path: /usr/share/bison/skeletons/variant.hh
    - path: /usr/share/bison/skeletons/yacc.c
    - path: /usr/share/bison/xslt/bison.xsl
    - path: /usr/share/bison/xslt/xml2text.xsl
    - path: /usr/share/bison/xslt/xml2xhtml.xsl
    - path: /usr/share/bison/xslt/xml2dot.xsl
