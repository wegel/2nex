package:
  schema: 1
  name: Libcap
  slug: libcap-bootstrap
  namespace: bootstrap/phase3
  version: "2.69"
  description: POSIX 1003.1e capabilities
  homepage: https://sites.google.com/site/fullycapable/
  checksum: 6e53d58c3d1c69969af3a86cf2d436ad8cb6ed9c098bf414dbc8c225f3151e5b

sources:
- name: libcap
  url: https://www.kernel.org/pub/linux/libs/security/linux-privs/libcap2/libcap-2.69.tar.xz
  sha256: f311f8f3dad84699d0566d1d6f7ec943a9298b28f714cae3c931dfd57492d7eb

dependencies:
- name: bootstrap_tools
  commit: x86_64/pkg/bootstrap/phase1/bootstrap_tools/0.0.1/bundles/dev
- name: bash
  commit: x86_64/pkg/bootstrap/phase1/bash/5.2.21/bundles/dev
- name: coreutils
  commit: x86_64/pkg/bootstrap/phase1/coreutils/9.5/bundles/dev
- name: diffutils
  commit: x86_64/pkg/bootstrap/phase1/diffutils/3.10/bundles/dev
- name: findutils
  commit: x86_64/pkg/bootstrap/phase1/findutils/4.9.0/bundles/dev
- name: phase3
  commit: x86_64/pkg/bootstrap/phase3/2nex-utilities-bootstrap/0.0.1/bundles/dev
- name: grep
  commit: x86_64/pkg/bootstrap/phase1/grep/3.11/bundles/dev
- name: make
  commit: x86_64/pkg/bootstrap/phase1/make/4.4.1/bundles/dev
- name: sed
  commit: x86_64/pkg/bootstrap/phase1/sed/4.9/bundles/dev
- name: tar
  commit: x86_64/pkg/bootstrap/phase1/tar/1.35/bundles/dev
- name: gcc
  commit: x86_64/pkg/bootstrap/phase1/gcc/13.2.0/bundles/dev
- name: glibc-bootstrap
  commit: x86_64/pkg/bootstrap/phase3/glibc-bootstrap/2.39/bundles/dev
- name: zlib
  commit: x86_64/pkg/bootstrap/phase3/zlib/1.3.1/bundles/dev
- name: bzip2
  commit: x86_64/pkg/bootstrap/phase3/bzip2/1.0.8/bundles/dev
- name: xz
  commit: x86_64/pkg/bootstrap/phase3/xz/5.4.6/bundles/dev
- name: file
  commit: x86_64/pkg/bootstrap/phase3/file/5.45/bundles/dev
- name: binutils
  commit: x86_64/pkg/bootstrap/phase3/binutils/2.42/bundles/dev

build:
  profile: [4610:117, 9215:1155, 13849:1276, 18912:2052, 19492:2252]

  script: |
    tar --no-same-owner -xf ${SOURCE_libcap} -C "${WORK_DIR}" --strip-components=1
    cd ${WORK_DIR}

    sed -i "/install -m.*STA/d" libcap/Makefile
    make DESTDIR=${OUT_DIR} prefix=/usr lib=lib sbindir=bin DYNAMIC=yes DYNAMIC=yes KERNEL_HEADERS=/usr/include install

    find "${OUT_DIR}" -exec touch -d '2024-01-01T00:00:00+00:00' {} \;
    2nex_strip_binaries ${OUT_DIR}

bundles:
  dev:
  - bin
  - dev
  - lib

  full:
  - bin
  - dev
  - lib
  - man

outputs:
  bin:
    files:
    - path: /usr/bin/capsh
    - path: /usr/bin/getcap
    - path: /usr/bin/getpcaps
    - path: /usr/bin/setcap

  dev:
    files:
    - path: /usr/include/sys/capability.h
    - path: /usr/include/sys/psx_syscall.h
    - path: /usr/lib/pkgconfig/libcap.pc
    - path: /usr/lib/pkgconfig/libpsx.pc

  lib:
    files:
    - path: /usr/lib/libcap.so
    - path: /usr/lib/libcap.so.2
    - path: /usr/lib/libcap.so.2.69
    - path: /usr/lib/libpsx.so
    - path: /usr/lib/libpsx.so.2
    - path: /usr/lib/libpsx.so.2.69

  man:
    files:
    - path: /usr/share/man/man1/capsh.1
    - path: /usr/share/man/man3/__psx_syscall.3
    - path: /usr/share/man/man3/cap_clear.3
