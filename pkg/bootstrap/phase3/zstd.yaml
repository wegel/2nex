package:
  schema: 1
  name: Zstd
  slug: zstd
  namespace: bootstrap/phase3
  version: 1.5.6
  description: Zstandard - Fast real-time compression algorithm
  homepage: https://facebook.github.io/zstd/
  checksum: 4e1b713be2824b04f6fead2c62f32f8ef618af0bd5357e248431df69f5129bda

sources:
- name: zstd
  url: https://github.com/facebook/zstd/releases/download/v1.5.6/zstd-1.5.6.tar.gz
  sha256: 8c29e06cf42aacc1eafc4077ae2ec6c6fcb96a626157e0593d5e82a34fd403c1

dependencies:
- name: bootstrap_tools
  commit: x86_64/pkg/bootstrap/phase1/bootstrap_tools/0.0.1/bundles/dev
- name: bash
  commit: x86_64/pkg/bootstrap/phase1/bash/5.2.21/bundles/dev
- name: coreutils
  commit: x86_64/pkg/bootstrap/phase1/coreutils/9.5/bundles/dev
- name: diffutils
  commit: x86_64/pkg/bootstrap/phase1/diffutils/3.10/bundles/dev
- name: file
  commit: x86_64/pkg/bootstrap/phase1/file/5.45/bundles/dev
- name: findutils
  commit: x86_64/pkg/bootstrap/phase1/findutils/4.9.0/bundles/dev
- name: grep
  commit: x86_64/pkg/bootstrap/phase1/grep/3.11/bundles/dev
- name: gzip
  commit: x86_64/pkg/bootstrap/phase1/gzip/1.13/bundles/dev
- name: make
  commit: x86_64/pkg/bootstrap/phase1/make/4.4.1/bundles/dev
- name: sed
  commit: x86_64/pkg/bootstrap/phase1/sed/4.9/bundles/dev
- name: tar
  commit: x86_64/pkg/bootstrap/phase1/tar/1.35/bundles/dev
- name: binutils
  commit: x86_64/pkg/bootstrap/phase1/binutils/2.42/bundles/dev
- name: gcc
  commit: x86_64/pkg/bootstrap/phase1/gcc/13.2.0/bundles/dev
- name: glibc
  commit: x86_64/pkg/bootstrap/phase3/glibc-bootstrap/2.39/bundles/dev
- name: zlib
  commit: x86_64/pkg/bootstrap/phase3/zlib/1.3.1/bundles/dev
- name: 2nex-utilities
  commit: x86_64/pkg/bootstrap/phase3/2nex-utilities-bootstrap/0.0.1/bundles/dev
- name: xz
  commit: x86_64/pkg/bootstrap/phase3/xz/5.4.6/bundles/dev
- name: lz4
  commit: x86_64/pkg/bootstrap/phase3/lz4/1.9.4/bundles/dev

build:
  profile: [4142:1359, 12379:50964, 24728:51037, 41201:51256, 53614:51614, 66079:53095, 74717:53739, 95359:55055, 111954:60455, 123969:61951]

  script: |
    tar --no-same-owner -xf ${SOURCE_zstd} -C "${WORK_DIR}" --strip-components=1
    cd ${WORK_DIR}

    make
    make check
    make DESTDIR=${OUT_DIR} PREFIX=/usr install

    find "${OUT_DIR}" -exec touch -d '2024-01-01T00:00:00+00:00' {} \;
    2nex_strip_binaries ${OUT_DIR}

bundles:
  dev:
  - bin
  - dev
  - lib
  - static

  full:
  - bin
  - dev
  - lib
  - man
  - static

outputs:
  bin:
    files:
    - path: /usr/bin/unzstd
    - path: /usr/bin/zstd
    - path: /usr/bin/zstdcat
    - path: /usr/bin/zstdgrep
    - path: /usr/bin/zstdless
    - path: /usr/bin/zstdmt

  dev:
    files:
    - path: /usr/include/zdict.h
    - path: /usr/include/zstd.h
    - path: /usr/include/zstd_errors.h
    - path: /usr/lib/pkgconfig/libzstd.pc

  lib:
    files:
    - path: /usr/lib/libzstd.so
    - path: /usr/lib/libzstd.so.1
    - path: /usr/lib/libzstd.so.1.5.6

  man:
    files:
    - path: /usr/share/man/man1/unzstd.1
    - path: /usr/share/man/man1/zstd.1
    - path: /usr/share/man/man1/zstdcat.1
    - path: /usr/share/man/man1/zstdgrep.1
    - path: /usr/share/man/man1/zstdless.1

  static:
    files:
    - path: /usr/lib/libzstd.a
