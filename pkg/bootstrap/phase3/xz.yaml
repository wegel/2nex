package:
  schema: 1
  name: Xz
  slug: xz
  namespace: bootstrap/phase3
  version: 5.4.6
  description: General-purpose data compression with high compression ratio
  homepage: https://tukaani.org/xz/
  checksum: 696160c335e49e0971fa28663bf217e328700d1dfd6f6394e9691f45e5d66f36
  seed: true

sources:
- name: xz
  url: https://github.com/tukaani-project/xz/releases/download/v5.4.6/xz-5.4.6.tar.xz
  sha256: b92d4e3a438affcf13362a1305cd9d94ed47ddda22e456a42791e630a5644f5c

dependencies:
- name: temporary-system
  commit: x86_64/pkg/bootstrap/phase1/temporary-system/1.0/bundles/dev
- name: linux-headers
  commit: x86_64/pkg/bootstrap/phase3/linux-headers/6.4.1/bundles/dev
- name: glibc
  commit: x86_64/pkg/bootstrap/phase3/glibc/2.39/bundles/dev
- name: binutils
  commit: x86_64/pkg/bootstrap/phase3/binutils/2.42/bundles/dev
- name: gcc
  commit: x86_64/pkg/bootstrap/phase3/gcc/13.2.0/bundles/dev

build:
  environment: 002d6759a3ccdb3587b39a187250574c6d1de529
  profile: [8268:4145, 21211:5525, 42596:5530, 71745:5610, 95224:5675, 118207:5723, 138333:5775, 174058:5894, 207321:8116, 228431:9536]

  script: |
    tar --no-same-owner -xf /${SOURCE_xz} -C "${WORK_DIR}" --strip-components=1
    cd ${WORK_DIR}

    ./configure --prefix=/usr --libdir=/usr/lib --disable-static --disable-nls
    make
    make DESTDIR=${OUT_DIR} install

    rm -rf ${OUT_DIR}/usr/share/info ${OUT_DIR}/usr/share/man
    rm -rf ${OUT_DIR}/usr/share/locale ${OUT_DIR}/usr/share/doc
    rm -f ${OUT_DIR}/usr/lib/liblzma.la

    find ${OUT_DIR} -type f -executable -exec strip --strip-unneeded {} \; 2>/dev/null || true
    find ${OUT_DIR} -name '*.a' -exec objcopy --enable-deterministic-archives {} \; 2>/dev/null || true
    find "${OUT_DIR}" -exec touch -d '2024-01-01T00:00:00+00:00' {} \;

bundles:
  dev:
  - bin
  - lib

outputs:
  bin:
    files:
    - path: /usr/bin/lzcat
    - path: /usr/bin/lzcmp
    - path: /usr/bin/lzdiff
    - path: /usr/bin/lzegrep
    - path: /usr/bin/lzfgrep
    - path: /usr/bin/lzgrep
    - path: /usr/bin/lzless
    - path: /usr/bin/lzma
    - path: /usr/bin/lzmadec
    - path: /usr/bin/lzmainfo
    - path: /usr/bin/lzmore
    - path: /usr/bin/unlzma
    - path: /usr/bin/unxz
    - path: /usr/bin/xz
    - path: /usr/bin/xzcat
    - path: /usr/bin/xzcmp
    - path: /usr/bin/xzdec
    - path: /usr/bin/xzdiff
    - path: /usr/bin/xzegrep
    - path: /usr/bin/xzfgrep
    - path: /usr/bin/xzgrep
    - path: /usr/bin/xzless
    - path: /usr/bin/xzmore

  dev:
    files:
    - path: /usr/include/lzma.h
    - path: /usr/include/lzma/base.h
    - path: /usr/include/lzma/bcj.h
    - path: /usr/include/lzma/block.h
    - path: /usr/include/lzma/check.h
    - path: /usr/include/lzma/container.h
    - path: /usr/include/lzma/delta.h
    - path: /usr/include/lzma/filter.h
    - path: /usr/include/lzma/hardware.h
    - path: /usr/include/lzma/index.h
    - path: /usr/include/lzma/index_hash.h
    - path: /usr/include/lzma/lzma12.h
    - path: /usr/include/lzma/stream_flags.h
    - path: /usr/include/lzma/version.h
    - path: /usr/include/lzma/vli.h
    - path: /usr/lib/pkgconfig/liblzma.pc

  lib:
    files:
    - path: /usr/lib/liblzma.so
    - path: /usr/lib/liblzma.so.5
    - path: /usr/lib/liblzma.so.5.4.6
