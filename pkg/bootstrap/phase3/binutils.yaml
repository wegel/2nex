build:
  script: "tar --no-same-owner -xf ${SOURCE_binutils} -C \"${WORK_DIR}\" --strip-components=1\n\
    cd \"${WORK_DIR}\" && mkdir -p build && cd build\n\n../configure             \
    \    \\\n  --prefix=/usr              \\\n  --build=$(../config.guess) \\\n  --host=${TARGET}\
    \           \\\n  --disable-nls              \\\n  --enable-shared           \
    \ \\\n  --enable-gprofng=no        \\\n  --disable-werror           \\\n  --enable-64-bit-bfd\
    \        \\\n  --enable-default-hash-style=gnu\n\necho \"configure done, make\"\
    \nmake\nmake DESTDIR=${OUT_DIR} install\n\nfind \"${OUT_DIR}\" -exec touch -d\
    \ \"2024-01-01T00:00:00+00:00\" {} \\;\nfind \"${OUT_DIR}\" ! -type d -exec strip-nondeterminism\
    \ -T 1704067200 --normalizers +all {} \\;\n2nex_strip_binaries ${OUT_DIR}\n"
