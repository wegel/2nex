  lib:
    files:
    - path: /usr/lib/libgmp.so
      needs:
      - /usr/lib/libc.so.6
    - path: /usr/lib/libgmp.so.10
      needs:
      - /usr/lib/libc.so.6
    - path: /usr/lib/libgmp.so.10.5.0
