package:
  schema: 1
  name: GNU GMP
  slug: gmp-bootstrap
  namespace: bootstrap/phase3
  version: 6.3.0
  description: GNU multiple precision arithmetic library
  homepage: https://gmplib.org
  checksum: 6ebdb7bae932da93bfc83d9f60d3c2c9c78554a55d9aff6cdcc316ad1f2991af
sources:
- name: gmp
  url: https://gmplib.org/download/gmp/gmp-6.3.0.tar.xz
  sha256: a3c2b80201b89e68616f4ad30bc66aee4927c3ce50e33929ca819d5c43538898
dependencies:
- name: bootstrap_tools
  commit: x86_64/pkg/bootstrap/phase1/bootstrap_tools/0.0.1/bundles/dev
- name: bash
  commit: x86_64/pkg/bootstrap/phase1/bash/5.2.21/bundles/dev
- name: coreutils
  commit: x86_64/pkg/bootstrap/phase1/coreutils/9.5/bundles/dev
- name: findutils
  commit: x86_64/pkg/bootstrap/phase1/findutils/4.9.0/bundles/dev
- name: 2nex-utilities
  commit: x86_64/pkg/bootstrap/phase3/2nex-utilities-bootstrap/0.0.1/bundles/dev
