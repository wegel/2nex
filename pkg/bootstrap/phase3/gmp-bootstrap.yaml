  commit: x86_64/pkg/bootstrap/phase3/zlib/1.3.1/bundles/dev
- name: bzip2
  commit: x86_64/pkg/bootstrap/phase3/bzip2/1.0.8/bundles/dev
- name: xz
  commit: x86_64/pkg/bootstrap/phase3/xz/5.4.6/bundles/dev
- name: file
  commit: x86_64/pkg/bootstrap/phase3/file/5.45/bundles/dev
- name: m4
  commit: x86_64/pkg/bootstrap/phase3/m4/1.4.19/bundles/dev
- name: binutils
  commit: x86_64/pkg/bootstrap/phase3/binutils/2.42/bundles/dev
build:
  script: |
    tar --no-same-owner -xf ${SOURCE_gmp} -C "${WORK_DIR}" --strip-components=1
    cd ${WORK_DIR}

    ./configure --prefix=/usr    \
              --with-pic \
              --build=x86_64-unknown-linux-gnu \
              --enable-fat \
              --enable-cxx     \
              --docdir=/usr/share/doc/gmp-6.3.0

    make
    make html
    make check 2>&1 | tee gmp-check-log
    awk "/# PASS:/{total+=\$3} ; END{print total}" gmp-check-log
    make DESTDIR="${OUT_DIR}" install
    make DESTDIR="${OUT_DIR}" install-html

    rm ${OUT_DIR}/usr/lib/*.la

    find "${OUT_DIR}" -exec touch -d '2024-01-01T00:00:00+00:00' {} \;
    2nex_strip_binaries ${OUT_DIR}
bundles:
  full:
  - lib
  - dev
  - static
  - doc
  - info
  dev:
  - lib
  - dev
  - static
