build:
  script: "tar --no-same-owner -xf ${SOURCE_shadow} -C \"${WORK_DIR}\" --strip-components=1\n\
    cd ${WORK_DIR}\n\npatch -Np1 -i /inputs/0001-Disable-replaced-tools-their-man-pages-and-PAM-integ.patch\n\
    patch -Np1 -i /inputs/0002-Adapt-login.defs-for-PAM-and-util-linux.patch\npatch\
    \ -Np1 -i /inputs/0003-Add-Arch-Linux-defaults-for-login.defs.patch\n\nsed -i\
    \ \"s/groups\\$(EXEEXT) //\" src/Makefile.in\nfind man -name Makefile.in -exec\
    \ sed -i \"s/groups\\.1 / /\"   {} \\;\nfind man -name Makefile.in -exec sed -i\
    \ \"s/getspnam\\.3 / /\" {} \\;\nfind man -name Makefile.in -exec sed -i \"s/passwd\\\
    .5 / /\"   {} \\;\n\nsed -e \"s:#ENCRYPT_METHOD DES:ENCRYPT_METHOD YESCRYPT:\"\
    \ \\\n  -e \"s:/var/spool/mail:/var/mail:\"                   \\\n  -e \"/PATH=/{s@/sbin:@@;s@/bin:@@}\"\
    \                  \\\n  -i etc/login.defs\n\nmkdir -p ${OUT_DIR}/usr/bin && touch\
    \ ${OUT_DIR}/usr/bin/passwd\nln -s ${OUT_DIR}/usr/bin ${OUT_DIR}/usr/sbin\n\n\
    export CFLAGS=\"$CFLAGS -DEXTRA_CHECK_HOME_DIR\"\n./configure \\\n  --bindir=/usr/bin\
    \ \\\n  --disable-account-tools-setuid \\\n  --libdir=/usr/lib \\\n  --mandir=/usr/share/man\
    \ \\\n  --prefix=/usr \\\n  --sbindir=/usr/bin \\\n  --sysconfdir=/etc \\\n  --with-fcaps\
    \ \\\n  --with-group-name-max-length=32 \\\n  --with-yescrypt \\\n  --without-bcrypt\
    \ \\\n  --without-libbsd \\\n  --without-nscd \\\n  --without-selinux \\\n  --without-su\n\
    \nsed -i -e \"s/ -shared / -Wl,-O1,--as-needed\\0/g\" libtool\nmake DESTDIR=\"\
    ${OUT_DIR}\" install\nmake DESTDIR=\"${OUT_DIR}\" -C man install\n\nrm ${OUT_DIR}/usr/sbin\n\
    \nfind \"${OUT_DIR}\" -exec touch -d \"2024-01-01T00:00:00+00:00\" {} \\;\nfind\
    \ \"${OUT_DIR}\" ! -type d -exec strip-nondeterminism -T 1704067200 --normalizers\
    \ +all {} \\;\n2nex_strip_binaries ${OUT_DIR}\n"
