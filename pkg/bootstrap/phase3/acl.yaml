package:
  schema: 1
  name: Acl
  slug: acl
  namespace: bootstrap/phase3
  version: 2.3.2
  description: Utilities for manipulating access control lists
  homepage: https://savannah.nongnu.org/projects/acl
  checksum: 4fbcc925324436299ce905f9186fd1d0c35c18d1e9bcd5caeada97f861016892

sources:
- name: acl
  url: https://download.savannah.nongnu.org/releases/acl/acl-2.3.2.tar.xz
  sha256: 97203a72cae99ab89a067fe2210c1cbf052bc492b479eca7d226d9830883b0bd

dependencies:
- name: bootstrap_tools
  commit: x86_64/pkg/bootstrap/phase1/bootstrap_tools/0.0.1/bundles/dev
- name: bash
  commit: x86_64/pkg/bootstrap/phase1/bash/5.2.21/bundles/dev
- name: coreutils
  commit: x86_64/pkg/bootstrap/phase1/coreutils/9.5/bundles/dev
- name: findutils
  commit: x86_64/pkg/bootstrap/phase1/findutils/4.9.0/bundles/dev
- name: phase3
  commit: x86_64/pkg/bootstrap/phase3/2nex-utilities-bootstrap/0.0.1/bundles/dev
- name: gawk
  commit: x86_64/pkg/bootstrap/phase1/gawk/5.3.0/bundles/dev
- name: grep
  commit: x86_64/pkg/bootstrap/phase1/grep/3.11/bundles/dev
- name: make
  commit: x86_64/pkg/bootstrap/phase1/make/4.4.1/bundles/dev
- name: sed
  commit: x86_64/pkg/bootstrap/phase1/sed/4.9/bundles/dev
- name: tar
  commit: x86_64/pkg/bootstrap/phase1/tar/1.35/bundles/dev
- name: gcc
  commit: x86_64/pkg/bootstrap/phase1/gcc/13.2.0/bundles/dev
- name: perl
  commit: x86_64/pkg/bootstrap/phase2/perl/5.38.2/bundles/dev
- name: strip-nondeterminism
  commit: x86_64/pkg/bootstrap/phase3/strip-nondeterminism/1.13.0/bundles/dev
- name: glibc-bootstrap
  commit: x86_64/pkg/bootstrap/phase3/glibc-bootstrap/2.39/bundles/dev
- name: zlib
  commit: x86_64/pkg/bootstrap/phase3/zlib/1.3.1/bundles/dev
- name: bzip2
  commit: x86_64/pkg/bootstrap/phase3/bzip2/1.0.8/bundles/dev
- name: xz
  commit: x86_64/pkg/bootstrap/phase3/xz/5.4.6/bundles/dev
- name: file
  commit: x86_64/pkg/bootstrap/phase3/file/5.45/bundles/dev
- name: binutils
  commit: x86_64/pkg/bootstrap/phase3/binutils/2.42/bundles/dev
- name: attr
  commit: x86_64/pkg/bootstrap/phase3/attr/2.5.2/bundles/dev

build:
  profile: [4115:1281, 8212:2458, 12456:2598, 13496:3661]

  script: |
    tar --no-same-owner -xf ${SOURCE_acl} -C "${WORK_DIR}" --strip-components=1
    cd ${WORK_DIR}

    ./configure --prefix=/usr         \
              --disable-static      \
              --docdir=/usr/share/doc/acl-2.3.2

    make
    make DESTDIR="${OUT_DIR}" install

    find "${OUT_DIR}" -exec touch -d '2024-01-01T00:00:00+00:00' {} \;
    find "${OUT_DIR}" ! -type d -exec strip-nondeterminism -T 1704067200 --normalizers +all {} \;
    2nex_strip_binaries ${OUT_DIR}

bundles:
  dev:
  - bin
  - dev
  - lib

  full:
  - bin
  - dev
  - doc
  - lib
  - locale
  - man

outputs:
  bin:
    files:
    - path: /usr/bin/chacl
    - path: /usr/bin/getfacl
    - path: /usr/bin/setfacl

  dev:
    files:
    - path: /usr/include/acl/libacl.h
    - path: /usr/include/sys/acl.h
    - path: /usr/lib/libacl.la
    - path: /usr/lib/pkgconfig/libacl.pc

  doc:
    files:
    - path: /usr/share/doc/acl-2.3.2/CHANGES
    - path: /usr/share/doc/acl-2.3.2/COPYING
    - path: /usr/share/doc/acl-2.3.2/COPYING.LGPL
    - path: /usr/share/doc/acl-2.3.2/extensions.txt
    - path: /usr/share/doc/acl-2.3.2/libacl.txt

  lib:
    files:
    - path: /usr/lib/libacl.so
    - path: /usr/lib/libacl.so.1
    - path: /usr/lib/libacl.so.1.1.2302

  locale:
    files:
    - path: /usr/share/locale/de/LC_MESSAGES/acl.mo
    - path: /usr/share/locale/en@boldquot/LC_MESSAGES/acl.mo
    - path: /usr/share/locale/en@quot/LC_MESSAGES/acl.mo
