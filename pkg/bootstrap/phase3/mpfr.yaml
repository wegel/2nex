package:
  schema: 1
  name: MPFR
  slug: mpfr
  namespace: bootstrap/phase3
  version: 4.2.1
  description: Multiple Precision Floating-Point Reliable Library
  homepage: https://www.mpfr.org/
  checksum: 5807cbf4f23f2dc282f1b885f941d359a7042c62fb863ac6145f6b6d8bf23328
sources:
- name: mpfr
  url: https://ftp.gnu.org/gnu/mpfr/mpfr-4.2.1.tar.xz
  sha256: 277807353a6726978996945af13e52829e3abd7a9a5b7fb2793894e18f1fcbb2
dependencies:
  - name: bootstrap_tools
    commit: x86_64/pkg/bootstrap/phase1/bootstrap_tools/0.0.1/bundles/dev
  - name: bash
    commit: x86_64/pkg/bootstrap/phase1/bash/5.2.21/bundles/dev
  - name: coreutils
    commit: x86_64/pkg/bootstrap/phase1/coreutils/9.5/bundles/dev
  - name: findutils
    commit: x86_64/pkg/bootstrap/phase1/findutils/4.9.0/bundles/dev
  - name: 2nex-utilities
    commit: x86_64/pkg/bootstrap/phase3/2nex-utilities-bootstrap/0.0.1/bundles/dev
  - name: gawk
    commit: x86_64/pkg/bootstrap/phase1/gawk/5.3.0/bundles/dev
  - name: grep
    commit: x86_64/pkg/bootstrap/phase1/grep/3.11/bundles/dev
  - name: make
    commit: x86_64/pkg/bootstrap/phase1/make/4.4.1/bundles/dev
  - name: sed
    commit: x86_64/pkg/bootstrap/phase1/sed/4.9/bundles/dev
  - name: tar
    commit: x86_64/pkg/bootstrap/phase1/tar/1.35/bundles/dev
  - name: gcc
    commit: x86_64/pkg/bootstrap/phase1/gcc/13.2.0/bundles/dev
  - name: perl
    commit: x86_64/pkg/bootstrap/phase2/perl/5.38.2/bundles/dev
  - name: texinfo
    commit: x86_64/pkg/bootstrap/phase2/texinfo/7.1/bundles/dev
  - name: glibc
    commit: x86_64/pkg/bootstrap/phase3/glibc-bootstrap/2.39/bundles/dev
  - name: zlib
    commit: x86_64/pkg/bootstrap/phase3/zlib/1.3.1/bundles/dev
  - name: bzip2
    commit: x86_64/pkg/bootstrap/phase3/bzip2/1.0.8/bundles/dev
  - name: xz
    commit: x86_64/pkg/bootstrap/phase3/xz/5.4.6/bundles/dev
  - name: file
    commit: x86_64/pkg/bootstrap/phase3/file/5.45/bundles/dev
  - name: binutils
    commit: x86_64/pkg/bootstrap/phase3/binutils/2.42/bundles/dev
  - name: gmp
    commit: x86_64/pkg/bootstrap/phase3/gmp-bootstrap/6.3.0/bundles/dev
build:
  script: "tar --no-same-owner -xf ${SOURCE_mpfr} -C \"${WORK_DIR}\" --strip-components=1\n\
    cd ${WORK_DIR}\n\n./configure --prefix=/usr        \\\n          --enable-thread-safe\
    \ \\\n          --docdir=/usr/share/doc/mpfr-4.2.1\n\nmake\nmake html\nmake check\n\
    make DESTDIR=\"${OUT_DIR}\" install\nmake DESTDIR=\"${OUT_DIR}\" install-html\n\
    \nfind \"${OUT_DIR}\" -exec touch -d '2024-01-01T00:00:00+00:00' {} \\;\n2nex_strip_binaries\
    \ ${OUT_DIR}\n"
bundles:
  full:
  - dev
  - lib
  - static
  - doc
  - info
  dev:
  - dev
  - lib
  - static
outputs:
  dev:
    files:
    - /usr/include/mpf2mpfr.h
    - /usr/include/mpfr.h
    - /usr/lib/libmpfr.la
    - /usr/lib/pkgconfig/mpfr.pc
  lib:
    files:
    - /usr/lib/libmpfr.so
    - /usr/lib/libmpfr.so.6
    - /usr/lib/libmpfr.so.6.2.1
    requires:
    - x86_64/pkg/bootstrap/phase3/glibc-bootstrap/2.39/outputs/lib
    - x86_64/pkg/bootstrap/phase3/gmp-bootstrap/6.3.0/outputs/lib
  static:
    files:
    - /usr/lib/libmpfr.a
  doc:
    files:
    - /usr/share/doc/mpfr-4.2.1/AUTHORS
