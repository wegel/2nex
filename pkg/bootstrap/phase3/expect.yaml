    - path: /usr/bin/autopasswd
    - path: /usr/bin/cryptdir
    - path: /usr/bin/decryptdir
    - path: /usr/bin/dislocate
    - path: /usr/bin/expect
      needs:
      - /usr/lib/expect5.45.4/libexpect5.45.4.so
      - /usr/lib/libtcl8.6.so
      - /usr/lib/libc.so.6
      - /usr/lib/ld-linux-x86-64.so.2
    - path: /usr/bin/ftp-rfc
    - path: /usr/bin/kibitz
    - path: /usr/bin/lpunlock
    - path: /usr/bin/mkpasswd
    - path: /usr/bin/multixterm
    - path: /usr/bin/passmass
    - path: /usr/bin/rftp
