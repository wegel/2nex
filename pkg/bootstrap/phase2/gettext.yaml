package:
  schema: 1
  name: Gettext
  slug: gettext
  namespace: bootstrap/phase2
  version: 0.22.5
  description: GNU internationalization (i18n) and localization (l10n) library
  homepage: https://www.gnu.org/software/gettext/
  stable_checksum: false

sources:
- name: gettext
  url: https://ftp.gnu.org/gnu/gettext/gettext-0.22.5.tar.xz
  sha256: fe10c37353213d78a5b83d48af231e005c4da84db5ce88037d88355938259640

dependencies:
- name: bootstrap_tools
  commit: x86_64/pkg/bootstrap/phase1/bootstrap_tools/0.0.1/bundles/dev
- name: m4
  commit: x86_64/pkg/bootstrap/phase1/m4/1.4.19/bundles/dev
- name: ncurses
  commit: x86_64/pkg/bootstrap/phase1/ncurses/6.4-20230520/bundles/dev
- name: bash
  commit: x86_64/pkg/bootstrap/phase1/bash/5.2.21/bundles/dev
- name: coreutils
  commit: x86_64/pkg/bootstrap/phase1/coreutils/9.5/bundles/dev
- name: diffutils
  commit: x86_64/pkg/bootstrap/phase1/diffutils/3.10/bundles/dev
- name: file
  commit: x86_64/pkg/bootstrap/phase1/file/5.45/bundles/dev
- name: findutils
  commit: x86_64/pkg/bootstrap/phase1/findutils/4.9.0/bundles/dev
- name: gawk
  commit: x86_64/pkg/bootstrap/phase1/gawk/5.3.0/bundles/dev
- name: grep
  commit: x86_64/pkg/bootstrap/phase1/grep/3.11/bundles/dev
- name: gzip
  commit: x86_64/pkg/bootstrap/phase1/gzip/1.13/bundles/dev
- name: make
  commit: x86_64/pkg/bootstrap/phase1/make/4.4.1/bundles/dev
- name: patch
  commit: x86_64/pkg/bootstrap/phase1/patch/2.7.6/bundles/dev
- name: sed
  commit: x86_64/pkg/bootstrap/phase1/sed/4.9/bundles/dev
- name: tar
  commit: x86_64/pkg/bootstrap/phase1/tar/1.35/bundles/dev
- name: xz
  commit: x86_64/pkg/bootstrap/phase1/xz/5.4.6/bundles/dev
- name: bzip2
  commit: x86_64/pkg/bootstrap/phase1/bzip2/1.0.8/bundles/dev
- name: binutils
  commit: x86_64/pkg/bootstrap/phase1/binutils/2.42/bundles/dev
- name: gcc
  commit: x86_64/pkg/bootstrap/phase1/gcc/13.2.0/bundles/dev

build:
  profile: [28881:16565, 111315:90843, 244820:91424, 408191:92584, 543973:104058, 682375:105343, 816946:105827, 1019270:111422, 1224846:132220, 1357518:135408]

  script: |
    tar --no-same-owner -xf ${SOURCE_gettext} -C "${WORK_DIR}" --strip-components=1
    cd ${WORK_DIR}

    CFLAGS=
    CXXFLAGS=
    LDFLAGS=
    ./configure --disable-shared
    make

    mkdir -p ${OUT_DIR}/usr/bin
    cp -v gettext-tools/src/{msgfmt,msgmerge,xgettext} ${OUT_DIR}/usr/bin

    find "${OUT_DIR}" -exec touch -d "2024-01-01T00:00:00+00:00" {} \;

bundles:
  dev:
  - bin

outputs:
  bin:
    files:
    - path: /usr/bin/msgfmt
    - path: /usr/bin/msgmerge
    - path: /usr/bin/xgettext
