package:
  schema: 1
  name: Gettext
  slug: gettext
  namespace: bootstrap/phase2
  version: 0.22.5
  description: GNU internationalization (i18n) and localization (l10n) library
  homepage: https://www.gnu.org/software/gettext/
  stable_checksum: false
  seed: true

sources:
- name: gettext
  url: https://ftp.gnu.org/gnu/gettext/gettext-0.22.5.tar.xz
  sha256: fe10c37353213d78a5b83d48af231e005c4da84db5ce88037d88355938259640

dependencies:
- name: temporary-system
  commit: x86_64/pkg/bootstrap/phase1/temporary-system/1.0/bundles/dev

build:
  environment: 002d6759a3ccdb3587b39a187250574c6d1de529
  profile: [28836:15920, 111185:89506, 245120:90107, 407952:91286, 543926:102799, 682177:104005, 816766:104487, 1018550:109922, 1224239:130623, 1357388:133652]

  script: |
    tar --no-same-owner -xf ${SOURCE_gettext} -C "${WORK_DIR}" --strip-components=1
    cd ${WORK_DIR}

    CFLAGS=
    CXXFLAGS=
    LDFLAGS=
    ./configure --disable-shared
    make

    mkdir -p ${OUT_DIR}/usr/bin
    cp -v gettext-tools/src/{msgfmt,msgmerge,xgettext} ${OUT_DIR}/usr/bin

    find "${OUT_DIR}" -exec touch -d "2024-01-01T00:00:00+00:00" {} \;

bundles:
  dev:
  - bin

outputs:
  bin:
    files:
    - path: /usr/bin/msgfmt
    - path: /usr/bin/msgmerge
    - path: /usr/bin/xgettext
