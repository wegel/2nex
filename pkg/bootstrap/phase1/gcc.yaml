build:
  environment: eeeb4cd406953b12ddf019ae34e4f0704a1b944a
  profile: [83225:7268, 323869:12235, 726348:18978, 1204712:19712, 1608128:39478, 2008563:67506, 2409952:109990, 3013162:115145, 3612857:144172, 4013856:152233]

  script: |
    # gcc builds itself, so use regular ar/nm/ranlib from phase0 (no gcc-ar yet)
    unset AR NM RANLIB

    # gcc's build system doesn't use gcc-ar/gcc-ranlib consistently, so disable LTO
    CFLAGS=${CFLAGS/-flto=auto/}
    CXXFLAGS=${CXXFLAGS/-flto=auto/}
    LDFLAGS=${LDFLAGS/-flto=auto/}

    # create symlinks so configure finds gcc (binutils provides ar/nm/etc)
    ln -s x86_64-nex-linux-gnu-gcc /usr/bin/gcc
    ln -s x86_64-nex-linux-gnu-g++ /usr/bin/g++

    tar --no-same-owner -xf /${SOURCE_gcc} -C "${WORK_DIR}" --strip-components=1
    cd "${WORK_DIR}"

    # extract gmp/mpfr/mpc in-tree
    mkdir -p gmp mpfr mpc
    tar --no-same-owner -xf /${SOURCE_gmp} -C gmp --strip-components=1
    tar --no-same-owner -xf /${SOURCE_mpfr} -C mpfr --strip-components=1
    tar --no-same-owner -xf /${SOURCE_mpc} -C mpc --strip-components=1

    # reproducibility patches
    patch -p0 < /${SOURCE_gcc9_reproducible_builds}
    patch -p1 < /${SOURCE_gcc9_reproducible_builds_buildid_for_checksum}

    # fix lib64 -> lib
    sed -e "/m64=/s/lib64/lib/" -i.orig gcc/config/i386/t-linux64
    sed -e "s#/lib64#/lib#g" -i.orig gcc/config/i386/t-linux64

    mkdir build && cd build
    ../configure                  \
        --prefix=/usr             \
        --disable-multilib        \
        --disable-bootstrap       \
        --disable-nls             \
        --disable-libsanitizer    \
        --enable-default-pie      \
        --enable-default-ssp      \
        --enable-languages=c,c++  \
        --enable-host-shared

    make
    make DESTDIR=${OUT_DIR} install

    # create cc symlink
    ln -sv gcc ${OUT_DIR}/usr/bin/cc

    # compatibility symlinks for lto plugin
    mkdir -p ${OUT_DIR}/usr/lib/bfd-plugins
    ln -sfv ../../libexec/gcc/x86_64-pc-linux-gnu/13.2.0/liblto_plugin.so \
            ${OUT_DIR}/usr/lib/bfd-plugins/

    rm -rf ${OUT_DIR}/usr/share/info ${OUT_DIR}/usr/share/man

    # strip binaries
    find ${OUT_DIR} -type f -executable -exec strip --strip-unneeded {} \; 2>/dev/null || true

    # make static archives deterministic
    find ${OUT_DIR} -name '*.a' -exec objcopy --enable-deterministic-archives {} \;

    find "${OUT_DIR}" -exec touch -d '2024-01-01T00:00:00+00:00' {} \;

