build:
  environment: eeeb4cd406953b12ddf019ae34e4f0704a1b944a

  profile: [237874:4650, 942114:6083, 2114163:9806, 3525181:13537, 4695127:16261, 5870311:18691, 7044928:24599, 8806944:29816, 10566880:34993, 11737072:47692]
  script: |
    # create symlinks so glibc build finds gcc
    ln -s x86_64-nex-linux-gnu-gcc /usr/bin/gcc
    ln -s x86_64-nex-linux-gnu-g++ /usr/bin/g++

    # create stub libgcc_s for test programs (phase0 only has static libgcc)
    echo 'INPUT(-lgcc)' > /usr/lib/libgcc_s.so

    tar --no-same-owner -xf /${SOURCE_glibc} -C "${WORK_DIR}" --strip-components=1
    cd ${WORK_DIR} && patch -Np1 -i /${SOURCE_fhs_patch} && mkdir build && cd build

    echo "slibdir=/usr/lib" >> configparms
    echo "rtlddir=/usr/lib" >> configparms
    echo "sbindir=/usr/bin" >> configparms
    echo "rootsbindir=/usr/bin" >> configparms

    # glibc builds before phase1 gcc, so use regular ar/nm/ranlib from phase0
    unset AR NM RANLIB
    CFLAGS=
    CXXFLAGS=
    LDFLAGS=

    ../configure --prefix=/usr                            \
               --disable-werror                         \
               --enable-kernel=4.19                     \
               --enable-stack-protector=strong          \
               --disable-nscd                           \
               libc_cv_slibdir=/usr/lib

    sed "/test-installation/s@\$(PERL)@echo not running@" -i ../Makefile
    make
    make install DESTDIR=${OUT_DIR}
    sed "/RTLDLIST=/s@/usr@@g" -i ${OUT_DIR}/usr/bin/ldd

    cat > ${OUT_DIR}/etc/nsswitch.conf << "EOF"
    passwd: files
    group: files
    shadow: files
    hosts: files dns
    networks: files
    protocols: files
    services: files
    ethers: files
    rpc: files
    EOF

    # create /lib64 symlink for binaries with hardcoded interpreter path
    ln -s usr/lib ${OUT_DIR}/lib64

    find "${OUT_DIR}" -exec touch -d '2024-01-01T00:00:00+00:00' {} \;

    for F in libBrokenLocale.a libc.a libc_nonshared.a libg.a libm-2.39.a libmvec.a libresolv.a; do
      x86_64-nex-linux-gnu-strip --strip-debug ${OUT_DIR}/usr/lib/$F
      x86_64-nex-linux-gnu-objcopy --enable-deterministic-archives ${OUT_DIR}/usr/lib/$F
    done

