package:
  schema: 1
  name: GNU C Library
  slug: glibc
  namespace: bootstrap/phase1
  version: "2.39"
  description: The GNU C Library project provides the core libraries for the GNU system
  homepage: https://www.gnu.org/software/libc/
  checksum: 7bbb5d73be97c393dc0ddc4c847f7afc5758b10364a14daa6915a1719666d3d6
  seed: true

sources:
- name: glibc
  url: https://ftp.gnu.org/gnu/glibc/glibc-2.39.tar.xz
  sha256: f77bd47cf8170c57365ae7bf86696c118adb3b120d3259c64c502d3dc1e2d926
- name: fhs_patch
  url: https://www.linuxfromscratch.org/patches/downloads/glibc/glibc-2.39-fhs-1.patch
  sha256: 643552db030e2f2d7ffde4f558e0f5f83d3fabf34a2e0e56ebdb49750ac27b0d

