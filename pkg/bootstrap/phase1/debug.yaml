package:
  schema: 1
  name: Debug Test
  slug: debug
  namespace: bootstrap/phase1
  version: "1.1"
  description: Debug chroot environment
  homepage: https://example.com
  checksum: ace62eebc64c81f8f33b8bb5356e907755e113372228806e07b9c8bdd919e6e8
  seed: true

sources: []

dependencies:
- name: toolchain
  commit: x86_64/pkg/bootstrap/phase0/toolchain/1.0/bundles/dev
- name: m4
  commit: x86_64/pkg/bootstrap/phase0/m4/1.4.19/bundles/dev
- name: bash
  commit: x86_64/pkg/bootstrap/phase0/bash/5.2.21/bundles/dev
- name: coreutils
  commit: x86_64/pkg/bootstrap/phase0/coreutils/9.5/bundles/dev
- name: bison
  commit: x86_64/pkg/bootstrap/phase0/bison/3.8.2/bundles/dev

build:
  environment: env/bootstrap-phase1.yaml

  script: |
    echo "=== Environment ==="
    echo "PATH=$PATH"

    echo "=== Testing bison with yacc options like glibc ==="
    echo '%{ %}' > ${WORK_DIR}/test.y
    echo '%%' >> ${WORK_DIR}/test.y
    echo 'start: ;' >> ${WORK_DIR}/test.y
    echo '%%' >> ${WORK_DIR}/test.y
    /usr/bin/bison --yacc --no-lines --name-prefix=test --output ${WORK_DIR}/test.c ${WORK_DIR}/test.y 2>&1 || echo "bison yacc mode failed: $?"

    echo "=== Check if test.c was created ==="
    ls -la ${WORK_DIR}/test.c 2>&1 || echo "test.c not created"

    touch ${OUT_DIR}/done

bundles:
  dev:
  - out

outputs:
  out:
    files:
    - path: /done
