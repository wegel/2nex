      - /usr/lib/liblzma.so.5
      - /bootstrap/usr/lib/libc.so.6
      - /bootstrap/usr/lib/ld-linux-x86-64.so.2
    - path: /usr/bin/lzmore
    - path: /usr/bin/unlzma
      needs:
      - /usr/lib/liblzma.so.5
      - /bootstrap/usr/lib/libc.so.6
      - /bootstrap/usr/lib/ld-linux-x86-64.so.2
    - path: /usr/bin/unxz
      needs:
      - /usr/lib/liblzma.so.5
      - /bootstrap/usr/lib/libc.so.6
      - /bootstrap/usr/lib/ld-linux-x86-64.so.2
    - path: /usr/bin/xz
      needs:
      - /usr/lib/liblzma.so.5
      - /bootstrap/usr/lib/libc.so.6
      - /bootstrap/usr/lib/ld-linux-x86-64.so.2
    - path: /usr/bin/xzcat
      needs:
      - /usr/lib/liblzma.so.5
      - /bootstrap/usr/lib/libc.so.6
      - /bootstrap/usr/lib/ld-linux-x86-64.so.2
    - path: /usr/bin/xzcmp
    - path: /usr/bin/xzdec
      needs:
      - /usr/lib/liblzma.so.5
      - /bootstrap/usr/lib/libc.so.6
      - /bootstrap/usr/lib/ld-linux-x86-64.so.2
    - path: /usr/bin/xzdiff
    - path: /usr/bin/xzegrep
    - path: /usr/bin/xzfgrep
    - path: /usr/bin/xzgrep
    - path: /usr/bin/xzless
    - path: /usr/bin/xzmore
  locale:
