package:
  schema: 1
  name: Xz
  slug: xz
  namespace: bootstrap/phase1
  bootstrap: true
  version: 5.4.6
  description: General-purpose data compression with high compression ratio
  homepage: https://tukaani.org/xz/
  stable_checksum: false
sources:
- name: xz
  url: https://github.com/tukaani-project/xz/releases/download/v5.4.6/xz-5.4.6.tar.xz
  sha256: b92d4e3a438affcf13362a1305cd9d94ed47ddda22e456a42791e630a5644f5c
dependencies:
- name: bootstrap_tools
  commit: x86_64/pkg/bootstrap/phase0/bootstrap-tools/2.42/bundles/dev
- name: m4
  commit: x86_64/pkg/bootstrap/phase1/m4/1.4.19/bundles/dev
- name: ncurses
  commit: x86_64/pkg/bootstrap/phase1/ncurses/6.4-20230520/bundles/dev
- name: coreutils
  commit: x86_64/pkg/bootstrap/phase1/coreutils/9.5/bundles/dev
- name: diffutils
  commit: x86_64/pkg/bootstrap/phase1/diffutils/3.10/bundles/dev
- name: file
  commit: x86_64/pkg/bootstrap/phase1/file/5.45/bundles/dev
- name: findutils
  commit: x86_64/pkg/bootstrap/phase1/findutils/4.9.0/bundles/dev
- name: gawk
  commit: x86_64/pkg/bootstrap/phase1/gawk/5.3.0/bundles/dev
- name: grep
  commit: x86_64/pkg/bootstrap/phase1/grep/3.11/bundles/dev
- name: gzip
  commit: x86_64/pkg/bootstrap/phase1/gzip/1.13/bundles/dev
- name: make
  commit: x86_64/pkg/bootstrap/phase1/patch/2.7.6/bundles/dev
- name: patch
  commit: x86_64/pkg/bootstrap/phase1/patch/2.7.6/bundles/dev
- name: sed
  commit: x86_64/pkg/bootstrap/phase1/sed/4.9/bundles/dev
- name: tar
  commit: x86_64/pkg/bootstrap/phase1/tar/1.35/bundles/dev
build:
  script: |
    tar --no-same-owner -xf ${SOURCE_xz} -C "${WORK_DIR}" --strip-components=1
    cd ${WORK_DIR}

    ./configure --prefix=/usr --libdir=/usr/lib \
          --disable-static \
          --docdir=/usr/share/doc/xz-5.4.6
    make
    make check

    make DESTDIR=${OUT_DIR} install
    rm -rf ${OUT_DIR}/usr/share/info ${OUT_DIR}/usr/share/man

    find "${OUT_DIR}" -exec touch -d '2024-01-01T00:00:00+00:00' {} \;
bundles:
  dev:
  - lib
  - bin
  - dev
  - locale
outputs:
  lib:
    files:
    - path: /usr/lib/liblzma.so
      needs:
      - /bootstrap/usr/lib/libc.so.6
    - path: /usr/lib/liblzma.so.5
      needs:
      - /bootstrap/usr/lib/libc.so.6
    - path: /usr/lib/liblzma.so.5.4.6
      needs:
      - /bootstrap/usr/lib/libc.so.6
  bin:
    files:
    - path: /usr/bin/lzcat
      needs:
      - /usr/lib/liblzma.so.5
      - /bootstrap/usr/lib/libc.so.6
      - /bootstrap/usr/lib/ld-linux-x86-64.so.2
    - path: /usr/bin/lzcmp
    - path: /usr/bin/lzdiff
    - path: /usr/bin/lzegrep
    - path: /usr/bin/lzfgrep
    - path: /usr/bin/lzgrep
    - path: /usr/bin/lzless
    - path: /usr/bin/lzma
      needs:
      - /usr/lib/liblzma.so.5
      - /bootstrap/usr/lib/libc.so.6
      - /bootstrap/usr/lib/ld-linux-x86-64.so.2
    - path: /usr/bin/lzmadec
      needs:
      - /usr/lib/liblzma.so.5
      - /bootstrap/usr/lib/libc.so.6
      - /bootstrap/usr/lib/ld-linux-x86-64.so.2
    - path: /usr/bin/lzmainfo
