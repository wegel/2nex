build:
  environment: env/bootstrap-phase1.yaml

  profile: [16423:10509, 54234:16345, 120720:19161, 199292:19722, 267279:31552, 329347:31865, 395553:32221, 494992:32749, 594393:38559, 657954:44623]
  script: |
    tar --no-same-owner -xf /${SOURCE_python} -C "${WORK_DIR}" --strip-components=1
    cd ${WORK_DIR}

    PYTHONHASHSEED=424242
    CFLAGS=
    LDFLAGS=

    ./configure --prefix=/usr --enable-shared --without-ensurepip
    make
    make DESTDIR=${OUT_DIR} install

    find ${OUT_DIR}/usr/lib/python* -name "*.a" -delete
    rm -rf ${OUT_DIR}/usr/lib/python*/test
    rm -rf ${OUT_DIR}/usr/share/info ${OUT_DIR}/usr/share/man

    find ${OUT_DIR} -type f -executable -exec strip --strip-unneeded {} \; 2>/dev/null || true
    find ${OUT_DIR} -name '*.a' -exec objcopy --enable-deterministic-archives {} \; 2>/dev/null || true
    find "${OUT_DIR}" -exec touch -d '2024-01-01T00:00:00+00:00' {} \;

bundles:
  dev:
  - bin
  - lib

