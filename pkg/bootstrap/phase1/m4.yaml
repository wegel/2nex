package:
  schema: 1
  name: M4
  slug: m4
  namespace: bootstrap/phase1
  bootstrap: true
  version: 1.4.19
  description: A macro processor
  homepage: https://www.gnu.org/software/m4/
  stable_checksum: false
  sha256: a6218dce36e47ae953fa699ff315ea8d1d6dde519e6e98daada82f322f5e2093
dependencies:
  - name: bootstrap_tools
    commit: x86_64/pkg/bootstrap/phase0/bootstrap-tools/2.42/bundles/dev
sources:
- name: m4
  url: https://ftp.gnu.org/gnu/m4/m4-1.4.19.tar.xz
  sha256: 63aede5c6d33b6d9b13511cd0be2cac046f2e70fd0a07aa9573a04a82783af96
build:
  script: "tar --no-same-owner -xf ${SOURCE_m4} -C \"${WORK_DIR}\" --strip-components=1\n\
    cd ${WORK_DIR}\n\necho 'int main(){}' | ${TARGET}-gcc -v -xc -\n\n./configure\
    \ --prefix=/usr   \\\n            --host=${TARGET} \\\n            --build=$(build-aux/config.guess)\n\
    \nmake -j$(nproc --ignore=1)\nmake DESTDIR=${OUT_DIR} install\n\nrm -rf ${OUT_DIR}/usr/share\n\
    \nfind \"${OUT_DIR}\" -exec touch -d '2024-01-01T00:00:00+00:00' {} \\;\n"
bundles:
  dev:
  - bin
outputs:
  bin:
    files:
    - /usr/bin/m4
    requires:
    - x86_64/pkg/bootstrap/phase0/bootstrap-tools/2.42/bundles/dev
