package:
  schema: 1
  name: File
  slug: file
  namespace: bootstrap/phase1
  bootstrap: true
  version: '5.45'
  description: File type identification utility
  homepage: https://www.darwinsys.com/file/
  stable_checksum: false
  sha256: 1f697080187275454c5c523c1c5666e5636ddbc9328434111c2645aef71d835f
dependencies:
  - name: bootstrap_tools
    commit: x86_64/pkg/bootstrap/phase0/bootstrap-tools/2.42/bundles/dev
  - name: m4
    commit: x86_64/pkg/bootstrap/phase1/m4/1.4.19/bundles/dev
  - name: ncurses
    commit: x86_64/pkg/bootstrap/phase1/ncurses/6.4-20230520/bundles/dev
  - name: coreutils
    commit: x86_64/pkg/bootstrap/phase1/coreutils/9.5/bundles/dev
  - name: diffutils
    commit: x86_64/pkg/bootstrap/phase1/diffutils/3.10/bundles/dev
sources:
- name: file
  url: https://astron.com/pub/file/file-5.45.tar.gz
  sha256: fc97f51029bb0e2c9f4e3bffefdaf678f0e039ee872b9de5c002a6d09c784d82
build:
  script: "tar --no-same-owner -xf ${SOURCE_file} -C \"${WORK_DIR}\" --strip-components=1\n\
    cd ${WORK_DIR}\n\nmkdir build\npushd build\n../configure --disable-bzlib     \
    \ \\\n             --disable-libseccomp \\\n             --disable-xzlib     \
    \ \\\n             --disable-zlib\nmake\npopd\n\n./configure --prefix=/usr --host=${TARGET}\
    \ --build=$(./config.guess)\nmake FILE_COMPILE=$(pwd)/build/src/file\nmake DESTDIR=${OUT_DIR}\
    \ install\nrm -v ${OUT_DIR}/usr/lib/libmagic.la\n\nrm -rf ${OUT_DIR}/usr/share/man\
    \ ${OUT_DIR}/usr/share/info\n\nfind \"${OUT_DIR}\" -exec touch -d '2024-01-01T00:00:00+00:00'\
    \ {} \\;\n"
bundles:
  dev:
  - bin
  - lib
  - dev
  - misc
outputs:
  lib:
    files:
    - /usr/lib/libmagic.so
    - /usr/lib/libmagic.so.1
    - /usr/lib/libmagic.so.1.0.0
    requires:
    - x86_64/pkg/bootstrap/phase0/bootstrap-tools/2.42/bundles/dev
  dev:
    files:
    - /usr/include/magic.h
    - /usr/lib/pkgconfig/libmagic.pc
  misc:
    files:
    - /usr/share/misc/magic.mgc
  bin:
    files:
    - /usr/bin/file
    requires:
    - x86_64/pkg/bootstrap/phase0/bootstrap-tools/2.42/bundles/dev
