package:
  schema: 1
  name: File
  slug: file
  namespace: bootstrap/phase1
  version: "5.45"
  description: File type identification utility
  homepage: https://www.darwinsys.com/file/
  stable_checksum: false
  bootstrap: true

sources:
- name: file
  url: https://astron.com/pub/file/file-5.45.tar.gz
  sha256: fc97f51029bb0e2c9f4e3bffefdaf678f0e039ee872b9de5c002a6d09c784d82

dependencies:
- name: bootstrap_tools
  commit: x86_64/pkg/bootstrap/phase0/bootstrap-tools/2.42/bundles/dev
- name: m4
  commit: x86_64/pkg/bootstrap/phase1/m4/1.4.19/bundles/dev
- name: ncurses
  commit: x86_64/pkg/bootstrap/phase1/ncurses/6.4-20230520/bundles/dev
- name: coreutils
  commit: x86_64/pkg/bootstrap/phase1/coreutils/9.5/bundles/dev
- name: diffutils
  commit: x86_64/pkg/bootstrap/phase1/diffutils/3.10/bundles/dev

build:
  profile: [4133:899, 8332:3229, 12464:4165, 16590:5181, 20687:8876, 24851:11334, 28987:11381, 30104:11397]

  script: |
    tar --no-same-owner -xf ${SOURCE_file} -C "${WORK_DIR}" --strip-components=1
    cd ${WORK_DIR}

    mkdir build
    pushd build
    ../configure --disable-bzlib      \
                 --disable-libseccomp \
                 --disable-xzlib      \
                 --disable-zlib
    make
    popd

    ./configure --prefix=/usr --host=${TARGET} --build=$(./config.guess)
    make FILE_COMPILE=$(pwd)/build/src/file
    make DESTDIR=${OUT_DIR} install
    rm -v ${OUT_DIR}/usr/lib/libmagic.la

    rm -rf ${OUT_DIR}/usr/share/man ${OUT_DIR}/usr/share/info

    find "${OUT_DIR}" -exec touch -d '2024-01-01T00:00:00+00:00' {} \;

bundles:
  dev:
  - bin
  - dev
  - lib
  - misc

outputs:
  bin:
    files:
    - path: /usr/bin/file

  dev:
    files:
    - path: /usr/include/magic.h
    - path: /usr/lib/pkgconfig/libmagic.pc

  lib:
    files:
    - path: /usr/lib/libmagic.so
    - path: /usr/lib/libmagic.so.1
    - path: /usr/lib/libmagic.so.1.0.0

  misc:
    files:
    - path: /usr/share/misc/magic.mgc
