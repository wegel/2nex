package:
  schema: 1
  name: Grep
  slug: grep
  namespace: bootstrap/phase1
  bootstrap: true
  version: '3.11'
  description: Print lines that match patterns
  homepage: https://www.gnu.org/software/grep/
  stable_checksum: false
  sha256: 985c6cd3fcf7ce0f364c15fc2e2cf4e0b723f8db01088a96649063d3b389d4ed
dependencies:
- name: bootstrap_tools
  commit: x86_64/pkg/bootstrap/phase0/bootstrap-tools/2.42/bundles/dev
- name: m4
  commit: x86_64/pkg/bootstrap/phase1/m4/1.4.19/bundles/dev
- name: ncurses
  commit: x86_64/pkg/bootstrap/phase1/ncurses/6.4-20230520/bundles/dev
- name: coreutils
  commit: x86_64/pkg/bootstrap/phase1/coreutils/9.5/bundles/dev
- name: diffutils
  commit: x86_64/pkg/bootstrap/phase1/diffutils/3.10/bundles/dev
- name: file
  commit: x86_64/pkg/bootstrap/phase1/file/5.45/bundles/dev
- name: findutils
  commit: x86_64/pkg/bootstrap/phase1/findutils/4.9.0/bundles/dev
- name: gawk
  commit: x86_64/pkg/bootstrap/phase1/gawk/5.3.0/bundles/dev
sources:
- name: grep
  url: https://ftp.gnu.org/gnu/grep/grep-3.11.tar.xz
  sha256: 1db2aedde89d0dea42b16d9528f894c8d15dae4e190b59aecc78f5a951276eab
build:
  script: |
    tar --no-same-owner -xf ${SOURCE_grep} -C "${WORK_DIR}" --strip-components=1
    cd ${WORK_DIR}

    ./configure --prefix=/usr   \
      --host=${TARGET} \
      --build=$(./build-aux/config.guess)

    make
    make DESTDIR=${OUT_DIR} install
    rm -rf ${OUT_DIR}/usr/share/info ${OUT_DIR}/usr/share/man

    find "${OUT_DIR}" -exec touch -d "2024-01-01T00:00:00+00:00" {} \;
bundles:
  dev:
  - locale
  - bin
outputs:
  bin:
    files:
    - path: /usr/bin/egrep
    - path: /usr/bin/fgrep
    - path: /usr/bin/grep
      needs:
      - /bootstrap/usr/lib/libc.so.6
      - /bootstrap/usr/lib/ld-linux-x86-64.so.2
  locale:
