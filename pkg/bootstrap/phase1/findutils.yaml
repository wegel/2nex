package:
  schema: 1
  name: Findutils
  slug: findutils
  namespace: bootstrap/phase1
  bootstrap: true
  version: 4.9.0
  description: The GNU versions of find utilities (find and xargs)
  homepage: https://www.gnu.org/software/findutils/
  stable_checksum: false
  sha256: caa6d1599ac8c281eb58d8d09f0efd67fcbc1b6e7c36bad81b741cc2c5fc102c
dependencies:
- name: bootstrap_tools
  commit: x86_64/pkg/bootstrap/phase0/bootstrap-tools/2.42/bundles/dev
- name: m4
  commit: x86_64/pkg/bootstrap/phase1/m4/1.4.19/bundles/dev
- name: ncurses
  commit: x86_64/pkg/bootstrap/phase1/ncurses/6.4-20230520/bundles/dev
- name: coreutils
  commit: x86_64/pkg/bootstrap/phase1/coreutils/9.5/bundles/dev
- name: diffutils
  commit: x86_64/pkg/bootstrap/phase1/diffutils/3.10/bundles/dev
- name: file
  commit: x86_64/pkg/bootstrap/phase1/file/5.45/bundles/dev
sources:
- name: findutils
  url: https://ftp.gnu.org/gnu/findutils/findutils-4.9.0.tar.xz
  sha256: a2bfb8c09d436770edc59f50fa483e785b161a3b7b9d547573cb08065fd462fe
build:
  script: |
    tar --no-same-owner -xf ${SOURCE_findutils} -C "${WORK_DIR}" --strip-components=1
    cd ${WORK_DIR}

    ./configure --prefix=/usr                   \
          --localstatedir=/var/lib/locate \
          --host=${TARGET}                 \
          --build=$(build-aux/config.guess)

    make
    make DESTDIR=${OUT_DIR} install
    rm -rf ${OUT_DIR}/usr/share/man ${OUT_DIR}/usr/share/info

    find "${OUT_DIR}" -exec touch -d "2024-01-01T00:00:00+00:00" {} \;
bundles:
  dev:
  - bin
  - locale
outputs:
  locale:
    files:
    - path: /usr/share/locale/be/LC_MESSAGES/findutils.mo
    - path: /usr/share/locale/bg/LC_MESSAGES/findutils.mo
    - path: /usr/share/locale/ca/LC_MESSAGES/findutils.mo
    - path: /usr/share/locale/cs/LC_MESSAGES/findutils.mo
