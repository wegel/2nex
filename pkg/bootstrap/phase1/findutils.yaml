    - path: /usr/share/locale/es/LC_MESSAGES/findutils.mo
    - path: /usr/share/locale/et/LC_MESSAGES/findutils.mo
    - path: /usr/share/locale/fi/LC_MESSAGES/findutils.mo
    - path: /usr/share/locale/fr/LC_MESSAGES/findutils.mo
