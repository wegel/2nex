    - path: /usr/share/locale/pl/LC_MESSAGES/findutils.mo
    - path: /usr/share/locale/pt/LC_MESSAGES/findutils.mo
    - path: /usr/share/locale/pt_BR/LC_MESSAGES/findutils.mo
