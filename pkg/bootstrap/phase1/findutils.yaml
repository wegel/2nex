      needs:
      - /bootstrap/usr/lib/libm.so.6
      - /bootstrap/usr/lib/libc.so.6
      - /bootstrap/usr/lib/ld-linux-x86-64.so.2
    - path: /usr/bin/locate
      needs:
      - /bootstrap/usr/lib/libc.so.6
      - /bootstrap/usr/lib/ld-linux-x86-64.so.2
    - path: /usr/bin/updatedb
    - path: /usr/bin/xargs
      needs:
      - /bootstrap/usr/lib/libc.so.6
      - /bootstrap/usr/lib/ld-linux-x86-64.so.2
    - path: /usr/libexec/frcode
      needs:
      - /bootstrap/usr/lib/libc.so.6
      - /bootstrap/usr/lib/ld-linux-x86-64.so.2

resolution:
  /bootstrap/usr/lib/ld-linux-x86-64.so.2: bootstrap_tools
  /bootstrap/usr/lib/libc.so.6: bootstrap_tools
  /bootstrap/usr/lib/libm.so.6: bootstrap_tools
