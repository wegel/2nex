package:
  schema: 1
  name: Coreutils
  slug: coreutils
  namespace: bootstrap/phase1
  version: "9.5"
  description: A set of basic GNU tools commonly used in shell scripts
  homepage: https://www.gnu.org/software/coreutils/
  checksum: dd6381b5fb399da4c34c2ef24967f2b80d2724f080b49a8da8668f9e66417815
  seed: true

sources:
- name: coreutils
  url: https://ftp.gnu.org/gnu/coreutils/coreutils-9.5.tar.xz
  sha256: cd328edeac92f6a665de9f323c93b712af1858bc2e0d88f3f7100469470a1b8a

dependencies:
- name: linux-headers
  commit: x86_64/pkg/bootstrap/phase1/linux-headers/6.4.1/bundles/dev
- name: glibc
  commit: x86_64/pkg/bootstrap/phase1/glibc/2.39/bundles/dev
- name: binutils
  commit: x86_64/pkg/bootstrap/phase1/binutils/2.42/bundles/dev
- name: gcc
  commit: x86_64/pkg/bootstrap/phase1/gcc/13.2.0/bundles/dev
- name: m4
  commit: x86_64/pkg/bootstrap/phase0/m4/1.4.19/bundles/dev
- name: bash
  commit: x86_64/pkg/bootstrap/phase0/bash/5.2.21/bundles/dev
- name: coreutils
  commit: x86_64/pkg/bootstrap/phase0/coreutils/9.5/bundles/dev
- name: diffutils
  commit: x86_64/pkg/bootstrap/phase0/diffutils/3.10/bundles/dev
- name: file
  commit: x86_64/pkg/bootstrap/phase0/file/5.45/bundles/dev
- name: findutils
  commit: x86_64/pkg/bootstrap/phase0/findutils/4.9.0/bundles/dev
- name: gawk
  commit: x86_64/pkg/bootstrap/phase0/gawk/5.3.0/bundles/dev
- name: grep
  commit: x86_64/pkg/bootstrap/phase0/grep/3.11/bundles/dev
- name: gzip
  commit: x86_64/pkg/bootstrap/phase0/gzip/1.13/bundles/dev
- name: make
  commit: x86_64/pkg/bootstrap/phase0/make/4.4.1/bundles/dev
- name: sed
  commit: x86_64/pkg/bootstrap/phase0/sed/4.9/bundles/dev
- name: tar
  commit: x86_64/pkg/bootstrap/phase0/tar/1.35/bundles/dev
- name: xz
  commit: x86_64/pkg/bootstrap/phase0/xz/5.4.6/bundles/dev

build:
  environment: env/bootstrap-phase1.yaml

  profile: [4096:2155, 8197:7899, 16488:14773, 24759:26098, 32962:33169, 41174:39970, 45274:45564, 57631:46433, 70004:49590, 74833:50504]
  script: |
    tar --no-same-owner -xf /${SOURCE_coreutils} -C "${WORK_DIR}" --strip-components=1
    cd ${WORK_DIR}

    FORCE_UNSAFE_CONFIGURE=1 ./configure --prefix=/usr \
                --enable-install-program=hostname \
                --enable-no-install-program=kill,uptime \
                --disable-nls
    make
    make DESTDIR=${OUT_DIR} install

    rm -rf ${OUT_DIR}/usr/share/man ${OUT_DIR}/usr/share/info
    rm -rf ${OUT_DIR}/usr/share/locale

    find ${OUT_DIR} -type f -executable -exec strip --strip-unneeded {} \; 2>/dev/null || true
    find ${OUT_DIR} -name '*.a' -exec objcopy --enable-deterministic-archives {} \; 2>/dev/null || true
    find "${OUT_DIR}" -exec touch -d '2024-01-01T00:00:00+00:00' {} \;

bundles:
  dev:
  - bin

outputs:
  bin:
    files:
    - path: /usr/bin/[
    - path: /usr/bin/basename
    - path: /usr/bin/cat
    - path: /usr/bin/chgrp
    - path: /usr/bin/chmod
    - path: /usr/bin/chown
    - path: /usr/bin/comm
    - path: /usr/bin/cp
    - path: /usr/bin/cut
    - path: /usr/bin/date
    - path: /usr/bin/dd
    - path: /usr/bin/dirname
    - path: /usr/bin/echo
    - path: /usr/bin/env
    - path: /usr/bin/expr
    - path: /usr/bin/false
    - path: /usr/bin/head
    - path: /usr/bin/hostname
    - path: /usr/bin/id
    - path: /usr/bin/install
    - path: /usr/bin/ln
    - path: /usr/bin/ls
    - path: /usr/bin/mkdir
    - path: /usr/bin/mktemp
    - path: /usr/bin/mv
    - path: /usr/bin/nproc
    - path: /usr/bin/od
    - path: /usr/bin/printf
    - path: /usr/bin/pwd
    - path: /usr/bin/readlink
    - path: /usr/bin/realpath
    - path: /usr/bin/rm
    - path: /usr/bin/rmdir
    - path: /usr/bin/seq
    - path: /usr/bin/sleep
    - path: /usr/bin/sort
    - path: /usr/bin/split
    - path: /usr/bin/stat
    - path: /usr/bin/sync
    - path: /usr/bin/tail
    - path: /usr/bin/tee
    - path: /usr/bin/test
    - path: /usr/bin/touch
    - path: /usr/bin/tr
    - path: /usr/bin/true
    - path: /usr/bin/uname
    - path: /usr/bin/uniq
    - path: /usr/bin/wc
