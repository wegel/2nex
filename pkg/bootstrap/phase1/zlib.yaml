package:
  schema: 1
  name: Zlib
  slug: zlib
  namespace: bootstrap/phase1
  version: 1.3.1
  description: A Massively Spiffy Yet Delicately Unobtrusive Compression Library
  homepage: https://zlib.net/
  checksum: 36a4e2595c9380d10a4ccf8e79e617fde980e934862f842354d6177b03f801d4
  seed: true

sources:
- name: zlib
  url: https://zlib.net/zlib-1.3.1.tar.xz
  sha256: 38ef96b8dfe510d42707d9c781877914792541133e1870841463bfa73f883e32

dependencies:
- name: linux-headers
  commit: x86_64/pkg/bootstrap/phase1/linux-headers/6.4.1/bundles/dev
- name: glibc
  commit: x86_64/pkg/bootstrap/phase1/glibc/2.39/bundles/dev
- name: binutils
  commit: x86_64/pkg/bootstrap/phase1/binutils/2.42/bundles/dev
- name: gcc
  commit: x86_64/pkg/bootstrap/phase1/gcc/13.2.0/bundles/dev
- name: m4
  commit: x86_64/pkg/bootstrap/phase0/m4/1.4.19/bundles/dev
- name: bash
  commit: x86_64/pkg/bootstrap/phase0/bash/5.2.21/bundles/dev
- name: coreutils
  commit: x86_64/pkg/bootstrap/phase0/coreutils/9.5/bundles/dev
- name: diffutils
  commit: x86_64/pkg/bootstrap/phase0/diffutils/3.10/bundles/dev
- name: file
  commit: x86_64/pkg/bootstrap/phase0/file/5.45/bundles/dev
- name: findutils
  commit: x86_64/pkg/bootstrap/phase0/findutils/4.9.0/bundles/dev
- name: gawk
  commit: x86_64/pkg/bootstrap/phase0/gawk/5.3.0/bundles/dev
- name: grep
  commit: x86_64/pkg/bootstrap/phase0/grep/3.11/bundles/dev
- name: gzip
  commit: x86_64/pkg/bootstrap/phase0/gzip/1.13/bundles/dev
- name: make
  commit: x86_64/pkg/bootstrap/phase0/make/4.4.1/bundles/dev
- name: sed
  commit: x86_64/pkg/bootstrap/phase0/sed/4.9/bundles/dev
- name: patch
  commit: x86_64/pkg/bootstrap/phase0/patch/2.7.6/bundles/dev
- name: tar
  commit: x86_64/pkg/bootstrap/phase0/tar/1.35/bundles/dev
- name: xz
  commit: x86_64/pkg/bootstrap/phase0/xz/5.4.6/bundles/dev

build:
  environment: env/bootstrap-phase1.yaml

  script: |
    tar --no-same-owner -xf /${SOURCE_zlib} -C "${WORK_DIR}" --strip-components=1
    cd ${WORK_DIR}

    ./configure --prefix=/usr
    make
    make DESTDIR=${OUT_DIR} install

    rm -rf ${OUT_DIR}/usr/share
    rm -f ${OUT_DIR}/usr/lib/libz.a

    find ${OUT_DIR} -type f -executable -exec strip --strip-unneeded {} \; 2>/dev/null || true
    find ${OUT_DIR} -name '*.a' -exec objcopy --enable-deterministic-archives {} \; 2>/dev/null || true
    find "${OUT_DIR}" -exec touch -d '2024-01-01T00:00:00+00:00' {} \;

bundles:
  dev:
  - dev
  - lib

outputs:
  dev:
    files:
    - path: /usr/include/zconf.h
    - path: /usr/include/zlib.h
    - path: /usr/lib/pkgconfig/zlib.pc

  lib:
    files:
    - path: /usr/lib/libz.so
    - path: /usr/lib/libz.so.1
    - path: /usr/lib/libz.so.1.3.1
