package:
  schema: 1
  name: Tar
  slug: tar
  namespace: bootstrap/phase1
  version: "1.35"
  description: An archiving program
  homepage: https://www.gnu.org/software/tar/
  stable_checksum: false
  bootstrap: true

sources:
- name: tar
  url: https://ftp.gnu.org/gnu/tar/tar-1.35.tar.xz
  sha256: 4d62ff37342ec7aed748535323930c7cf94acf71c3591882b26a7ea50f3edc16

dependencies:
- name: bootstrap_tools
  commit: x86_64/pkg/bootstrap/phase0/bootstrap-tools/2.42/bundles/dev
- name: m4
  commit: x86_64/pkg/bootstrap/phase1/m4/1.4.19/bundles/dev
- name: ncurses
  commit: x86_64/pkg/bootstrap/phase1/ncurses/6.4-20230520/bundles/dev
- name: coreutils
  commit: x86_64/pkg/bootstrap/phase1/coreutils/9.5/bundles/dev
- name: diffutils
  commit: x86_64/pkg/bootstrap/phase1/diffutils/3.10/bundles/dev
- name: file
  commit: x86_64/pkg/bootstrap/phase1/file/5.45/bundles/dev
- name: findutils
  commit: x86_64/pkg/bootstrap/phase1/findutils/4.9.0/bundles/dev
- name: gawk
  commit: x86_64/pkg/bootstrap/phase1/gawk/5.3.0/bundles/dev
- name: grep
  commit: x86_64/pkg/bootstrap/phase1/grep/3.11/bundles/dev
- name: gzip
  commit: x86_64/pkg/bootstrap/phase1/gzip/1.13/bundles/dev
- name: make
  commit: x86_64/pkg/bootstrap/phase1/patch/2.7.6/bundles/dev
- name: patch
  commit: x86_64/pkg/bootstrap/phase1/patch/2.7.6/bundles/dev
- name: sed
  commit: x86_64/pkg/bootstrap/phase1/sed/4.9/bundles/dev

build:
  environment: 9eb9f3c79e8aed36b00daea9698f6605ee6e3bba
  profile: [4149:2243, 8270:6404, 12416:8349, 16515:10561, 20627:11735, 24733:13159, 28839:14793, 37064:22704, 45372:24647, 46349:24717]

  script: |
    tar --no-same-owner -xf ${SOURCE_tar} -C "${WORK_DIR}" --strip-components=1
    cd ${WORK_DIR}

    FORCE_UNSAFE_CONFIGURE=1
    ./configure --prefix=/usr                     \
          --host=${TARGET}                   \
          --build=$(build-aux/config.guess)

    make
    make DESTDIR=${OUT_DIR} install
    rm -rf ${OUT_DIR}/usr/share/info ${OUT_DIR}/usr/share/man

    find "${OUT_DIR}" -exec touch -d "2024-01-01T00:00:00+00:00" {} \;

bundles:
  dev:
  - bin
  - locale

outputs:
  bin:
    files:
    - path: /usr/bin/tar
    - path: /usr/libexec/rmt

  locale:
    files:
    - path: /usr/share/locale/bg/LC_MESSAGES/tar.mo
