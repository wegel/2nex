package:
  schema: 1
  name: Bison
  slug: bison
  namespace: bootstrap/phase1
  version: 3.8.2
  description: The GNU general-purpose parser generator
  homepage: https://www.gnu.org/software/bison/
  checksum: 9f0e998a63a5daf2addc3cec66cbfd1f74c5fbd75971ce57709c97e8fbdfa8d1
  seed: true

sources:
- name: bison
  url: https://ftp.gnu.org/gnu/bison/bison-3.8.2.tar.xz
  sha256: 9bba0214ccf7f1079c5d59210045227bcf619519840ebfa80cd3849cff5a5bf2

dependencies:
- name: linux-headers
  commit: x86_64/pkg/bootstrap/phase1/linux-headers/6.4.1/bundles/dev
- name: glibc
  commit: x86_64/pkg/bootstrap/phase1/glibc/2.39/bundles/dev
- name: binutils
  commit: x86_64/pkg/bootstrap/phase1/binutils/2.42/bundles/dev
- name: gcc
  commit: x86_64/pkg/bootstrap/phase1/gcc/13.2.0/bundles/dev
- name: m4
  commit: x86_64/pkg/bootstrap/phase0/m4/1.4.19/bundles/dev
- name: bash
  commit: x86_64/pkg/bootstrap/phase0/bash/5.2.21/bundles/dev
- name: coreutils
  commit: x86_64/pkg/bootstrap/phase0/coreutils/9.5/bundles/dev
- name: diffutils
  commit: x86_64/pkg/bootstrap/phase0/diffutils/3.10/bundles/dev
- name: file
  commit: x86_64/pkg/bootstrap/phase0/file/5.45/bundles/dev
- name: findutils
  commit: x86_64/pkg/bootstrap/phase0/findutils/4.9.0/bundles/dev
- name: gawk
  commit: x86_64/pkg/bootstrap/phase0/gawk/5.3.0/bundles/dev
- name: grep
  commit: x86_64/pkg/bootstrap/phase0/grep/3.11/bundles/dev
- name: gzip
  commit: x86_64/pkg/bootstrap/phase0/gzip/1.13/bundles/dev
- name: make
  commit: x86_64/pkg/bootstrap/phase0/make/4.4.1/bundles/dev
- name: sed
  commit: x86_64/pkg/bootstrap/phase0/sed/4.9/bundles/dev
- name: patch
  commit: x86_64/pkg/bootstrap/phase0/patch/2.7.6/bundles/dev
- name: tar
  commit: x86_64/pkg/bootstrap/phase0/tar/1.35/bundles/dev
- name: xz
  commit: x86_64/pkg/bootstrap/phase0/xz/5.4.6/bundles/dev
- name: bzip2
  commit: x86_64/pkg/bootstrap/phase0/bzip2/1.0.8/bundles/dev

build:
  environment: eeeb4cd406953b12ddf019ae34e4f0704a1b944a

  profile: [4101:2736, 8223:10605, 12322:14079, 16420:19010, 20530:22930, 24650:25617, 28762:25877, 32871:26095, 41148:27381, 41621:27419]
  script: |
    tar --no-same-owner -xf /${SOURCE_bison} -C "${WORK_DIR}" --strip-components=1
    cd ${WORK_DIR}

    ./configure --prefix=/usr --disable-nls
    make
    make DESTDIR=$OUT_DIR install

    rm -rf ${OUT_DIR}/usr/share/info ${OUT_DIR}/usr/share/man ${OUT_DIR}/usr/share/doc
    rm -rf ${OUT_DIR}/usr/share/locale
    rm -f ${OUT_DIR}/usr/lib/liby.a

    find ${OUT_DIR} -type f -executable -exec strip --strip-unneeded {} \; 2>/dev/null || true
    find ${OUT_DIR} -name '*.a' -exec objcopy --enable-deterministic-archives {} \; 2>/dev/null || true
    find "${OUT_DIR}" -exec touch -d '2024-01-01T00:00:00+00:00' {} \;

bundles:
  dev:
  - bin
  - misc

outputs:
  bin:
    files:
    - path: /usr/bin/bison
    - path: /usr/bin/yacc

  misc:
    files:
    - path: /usr/share/bison/m4sugar/foreach.m4
    - path: /usr/share/bison/m4sugar/m4sugar.m4
    - path: /usr/share/bison/skeletons/bison.m4
    - path: /usr/share/bison/skeletons/c++-skel.m4
    - path: /usr/share/bison/skeletons/c++.m4
    - path: /usr/share/bison/skeletons/c-like.m4
    - path: /usr/share/bison/skeletons/c-skel.m4
    - path: /usr/share/bison/skeletons/c.m4
    - path: /usr/share/bison/skeletons/glr.c
    - path: /usr/share/bison/skeletons/glr.cc
    - path: /usr/share/bison/skeletons/lalr1.cc
    - path: /usr/share/bison/skeletons/location.cc
    - path: /usr/share/bison/skeletons/stack.hh
    - path: /usr/share/bison/skeletons/traceon.m4
    - path: /usr/share/bison/skeletons/variant.hh
    - path: /usr/share/bison/skeletons/yacc.c
