package:
  schema: 1
  name: Bash
  slug: bash
  namespace: bootstrap/phase1
  bootstrap: true
  version: 5.2.21
  description: The GNU Bourne Again shell
  homepage: https://www.gnu.org/software/bash/
  stable_checksum: false
  sha256: 621a75ff2ef12e03763b8df92d8268f253708db8ee9f6deb240cc02129eeae3e
dependencies:
- name: bootstrap_tools
  commit: x86_64/pkg/bootstrap/phase0/bootstrap-tools/2.42/bundles/dev
- name: m4
  commit: x86_64/pkg/bootstrap/phase1/m4/1.4.19/bundles/dev
- name: ncurses
  commit: x86_64/pkg/bootstrap/phase1/ncurses/6.4-20230520/bundles/dev
sources:
- name: bash
  url: https://ftp.gnu.org/gnu/bash/bash-5.2.21.tar.gz
  sha256: c8e31bdc59b69aaffc5b36509905ba3e5cbb12747091d27b4b977f078560d5b8
build:
  script: |
    tar --no-same-owner -xf ${SOURCE_bash} -C "${WORK_DIR}" --strip-components=1
    cd ${WORK_DIR}

    # add flags to handle old K&R C code in bash build tools with modern GCC
    export CFLAGS="$CFLAGS -Wno-error=implicit-function-declaration -Wno-error=incompatible-pointer-types"

    ./configure --prefix=/usr                      \
                --build=$(sh support/config.guess) \
                --host=${TARGET}                   \
                --without-bash-malloc

    # bash uses CFLAGS_FOR_BUILD for host compiler when building tools like mkbuiltins
    # use -std=gnu89 for old C89 standard that allows K&R function declarations
    make CFLAGS_FOR_BUILD="-g -DCROSS_COMPILING -std=gnu89"
    make DESTDIR=${OUT_DIR} install
    ln -sv bash ${OUT_DIR}/usr/bin/sh

    rm -rf ${OUT_DIR}/usr/share/man ${OUT_DIR}/usr/share/info ${OUT_DIR}/usr/share/doc
bundles:
  dev:
  - dev
