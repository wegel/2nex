build:
  profile: [8201:2239, 20529:2841, 41573:3383, 70706:10904, 92160:11003, 117487:11351, 138724:12168, 171714:37749, 209892:77228, 228742:78205]

  script: |
    # Build binutils
    tar --no-same-owner -xf ${SOURCE_binutils} -C "${WORK_DIR}" --strip-components=1
    cd "${WORK_DIR}" && mkdir -p build

    sed '6009s/$add_dir//' -i ltmain.sh
    cd build

    ../configure                 \
      --prefix=/usr              \
      --build=$(../config.guess) \
      --host=${TARGET}           \
      --disable-nls              \
      --enable-shared            \
      --enable-gprofng=no        \
      --disable-werror           \
      --enable-64-bit-bfd        \
      --enable-default-hash-style=gnu

    make
    make DESTDIR=${OUT_DIR} install
    rm -v ${OUT_DIR}/usr/lib/lib{bfd,ctf,ctf-nobfd,opcodes,sframe}.{a,la}

    rm -rf ${OUT_DIR}/usr/share/info ${OUT_DIR}/usr/share/man

    find "${OUT_DIR}" -exec touch -d "2024-01-01T00:00:00+00:00" {} \;

