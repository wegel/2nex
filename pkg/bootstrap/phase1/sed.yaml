package:
  schema: 1
  name: Sed
  slug: sed
  namespace: bootstrap/phase1
  bootstrap: true
  version: '4.9'
  description: A stream editor
  homepage: https://www.gnu.org/software/sed/
  stable_checksum: false
sources:
- name: sed
  url: https://ftp.gnu.org/gnu/sed/sed-4.9.tar.xz
  sha256: 6e226b732e1cd739464ad6862bd1a1aba42d7982922da7a53519631d24975181
dependencies:
  - name: bootstrap_tools
    commit: x86_64/pkg/bootstrap/phase0/bootstrap-tools/2.42/bundles/dev
  - name: m4
    commit: x86_64/pkg/bootstrap/phase1/m4/1.4.19/bundles/dev
  - name: ncurses
    commit: x86_64/pkg/bootstrap/phase1/ncurses/6.4-20230520/bundles/dev
  - name: coreutils
    commit: x86_64/pkg/bootstrap/phase1/coreutils/9.5/bundles/dev
  - name: diffutils
    commit: x86_64/pkg/bootstrap/phase1/diffutils/3.10/bundles/dev
  - name: file
    commit: x86_64/pkg/bootstrap/phase1/file/5.45/bundles/dev
  - name: findutils
    commit: x86_64/pkg/bootstrap/phase1/findutils/4.9.0/bundles/dev
  - name: gawk
    commit: x86_64/pkg/bootstrap/phase1/gawk/5.3.0/bundles/dev
  - name: grep
    commit: x86_64/pkg/bootstrap/phase1/grep/3.11/bundles/dev
  - name: gzip
    commit: x86_64/pkg/bootstrap/phase1/gzip/1.13/bundles/dev
  - name: make
    commit: x86_64/pkg/bootstrap/phase1/patch/2.7.6/bundles/dev
  - name: patch
    commit: x86_64/pkg/bootstrap/phase1/patch/2.7.6/bundles/dev
build:
  script: "tar --no-same-owner -xf ${SOURCE_sed} -C \"${WORK_DIR}\" --strip-components=1\n\
    cd ${WORK_DIR}\n\n./configure --prefix=/usr   \\\n    --host=${TARGET} \\\n  \
    \  --build=$(./build-aux/config.guess)\n\nmake\nmake DESTDIR=${OUT_DIR} install\n\
    rm -rf ${OUT_DIR}/usr/share/info ${OUT_DIR}/usr/share/man\n\nfind \"${OUT_DIR}\"\
    \ -exec touch -d \"2024-01-01T00:00:00+00:00\" {} \\;\n"
bundles:
  dev:
  - bin
  - locale
