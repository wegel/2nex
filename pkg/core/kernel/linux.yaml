build:
  environment: env/linux-kernel.yaml
  profile: [54067:6665, 216511:6675, 483010:6750, 805200:71656, 1072832:209294, 1340477:326961, 1608512:433498, 2012157:486505, 2412923:491562, 2679721:506896]

  script: |
    set -eu
    tar --no-same-owner -xf ${SOURCE_kernel} -C "${WORK_DIR}"
    cd "${WORK_DIR}/linux-6.12.58"

    # set deterministic build environment
    export LC_ALL=C
    export PERL_BADLANG=0
    export LD_LIBRARY_PATH="/usr/lib:${LD_LIBRARY_PATH:-}"
    export KBUILD_BUILD_USER="nex-builder"
    export KBUILD_BUILD_HOST="nex-builder"
    export KBUILD_BUILD_TIMESTAMP="2024-01-01T00:00:00+00:00"

    # copy kconfiglib and allmod.py
    cp /${SOURCE_kconfiglib} kconfiglib.py
    cp /${SOURCE_allmod} allmod.py
    chmod +x allmod.py

    # generate config using allmod.py:
    # 1. start from allnoconfig (minimal base)
    # 2. apply pre-fragments (systemd + builtins + gates)
    # 3. enable all tristates as modules
    # 4. re-apply pre-fragments to restore =y and =n overrides
    # 5. apply post-fragments (disable, overrides)
    make allnoconfig
    PYTHONHASHSEED=0 python3 allmod.py \
      /${SOURCE_systemd_required} \
      /${SOURCE_systemd_recommended} \
      /${SOURCE_builtins} \
      /${SOURCE_gates} \
      /${SOURCE_gates_net_vendors} \
      /${SOURCE_gates_wlan_vendors} \
      -- \
      /${SOURCE_disable} \
      /${SOURCE_overrides}

    # add built-in initramfs
    [ -f /boot/initramfs.cpio ] || { echo "initramfs.cpio not found at /boot/initramfs.cpio"; exit 1; }
    echo 'CONFIG_INITRAMFS_SOURCE="/boot/initramfs.cpio"' >> .config
    echo 'CONFIG_INITRAMFS_ROOT_UID=0' >> .config
    echo 'CONFIG_INITRAMFS_ROOT_GID=0' >> .config

    # resolve any remaining dependencies
    make olddefconfig

    # sanity check
    echo "=== config sanity check ==="
    grep -E '^CONFIG_(ATA|SATA_AHCI|BLK_DEV_NVME|EXT4_FS|BTRFS_FS|SERIAL_8250)=' .config
    REQ="\
    CONFIG_ATA \
    CONFIG_SATA_AHCI \
    CONFIG_BLK_DEV_NVME \
    CONFIG_EXT4_FS \
    CONFIG_BTRFS_FS \
    CONFIG_SERIAL_8250 \
    CONFIG_USB \
    CONFIG_USB_PCI_AMD \
    CONFIG_USB_XHCI_HCD \
    CONFIG_USB_EHCI_HCD \
    CONFIG_USB_EHCI_ROOT_HUB_TT \
    CONFIG_USB_EHCI_TT_NEWSCHED \
    CONFIG_USB_OHCI_HCD \
    CONFIG_USB_OHCI_HCD_PCI \
    CONFIG_USB_OHCI_LITTLE_ENDIAN \
    CONFIG_USB_UHCI_HCD \
    CONFIG_USB_STORAGE \
    CONFIG_USB_HID \
    CONFIG_USB_HIDDEV \
    CONFIG_HID_SUPPORT \
    CONFIG_HID \
    CONFIG_HID_GENERIC \
    CONFIG_HIDRAW \
    CONFIG_INPUT \
    CONFIG_INPUT_KEYBOARD \
    CONFIG_KEYBOARD_ATKBD \
    CONFIG_SERIO_I8042 \
    CONFIG_I2C \
    CONFIG_I2C_SMBUS \
    CONFIG_I2C_HID \
    CONFIG_I2C_HID_ACPI \
    CONFIG_I2C_DESIGNWARE_CORE \
    CONFIG_I2C_DESIGNWARE_PLATFORM \
    CONFIG_I2C_DESIGNWARE_PCI \
    CONFIG_I2C_PIIX4 \
    CONFIG_PINCTRL_AMD \
    CONFIG_FRAMEBUFFER_CONSOLE \
    CONFIG_VT_CONSOLE"
    for sym in $REQ; do
      if ! grep -q "^${sym}=y$" .config; then
        echo "FATAL: ${sym} is not built-in"
        grep "^${sym}=" .config || echo "${sym} is unset"
        exit 1
      fi
    done
    make -j"$(nproc)"

    # size report (keep out of /boot outputs)
    if [ -f vmlinux ]; then
      mkdir -p ${OUT_DIR}/usr/lib/kernel/size
      size -A vmlinux > ${OUT_DIR}/usr/lib/kernel/size/vmlinux.size.txt
      nm -S --size-sort vmlinux | tail -n 200 > ${OUT_DIR}/usr/lib/kernel/size/vmlinux.syms.txt
      if command -v size >/dev/null 2>&1; then
        find . -name built-in.a -print0 | \
          xargs -0 size -A -d 2>/dev/null | \
          awk '
            /:\s*$/ { obj=$0; sub(/:$/,"",obj); next }
            $1 ~ /^\./ && $2 ~ /^[0-9]/ { sum[obj]+=$2 }
            END { for (o in sum) print sum[o], o }
          ' | sort -nr | head -n 200 > ${OUT_DIR}/usr/lib/kernel/size/builtin.objects.txt
      fi
      find . -name built-in.a | sort > ${OUT_DIR}/usr/lib/kernel/size/builtin.objects.paths.txt
    fi

    # install kernel image
    mkdir -p ${OUT_DIR}/boot
    cp -v arch/x86/boot/bzImage ${OUT_DIR}/boot/vmlinuz-6.12.58
    cp -v System.map ${OUT_DIR}/boot/System.map-6.12.58
    cp -v .config ${OUT_DIR}/boot/config-6.12.58

    # install modules (to /usr/lib/modules for usr-merge compatibility)
    # skip depmod during modules_install (it looks at host /lib/modules), run manually after
    mkdir -p ${OUT_DIR}/usr/lib/modules
    make INSTALL_MOD_PATH=${OUT_DIR}/usr DEPMOD=/bin/true modules_install

    # run depmod with correct basedir
    # busybox's depmod lacks -b flag, create temp symlink to kmod
    ln -sf /usr/bin/kmod /tmp/depmod
    /tmp/depmod -b ${OUT_DIR}/usr 6.12.58

    # install a prepared tree for out-of-tree module packages
    sdk_dir="${OUT_DIR}/usr/src/linux-6.12.58"
    srctree=. SRCARCH=x86 MAKE=make CC=gcc HOSTCC=gcc \
      scripts/package/install-extmod-build "${sdk_dir}"
    rm -f "${OUT_DIR}/usr/lib/modules/6.12.58/build" \
          "${OUT_DIR}/usr/lib/modules/6.12.58/source"
    ln -s ../../../src/linux-6.12.58 "${OUT_DIR}/usr/lib/modules/6.12.58/build"
    ln -s ../../../src/linux-6.12.58 "${OUT_DIR}/usr/lib/modules/6.12.58/source"

    # strip kernel modules with --strip-debug to preserve symbols needed by modprobe
    find "${OUT_DIR}" -name "*.ko" -exec strip --strip-debug {} \;

    # deterministic timestamps
    find "${OUT_DIR}" -exec touch -h -d "2024-01-01T00:00:00+00:00" {} \;

