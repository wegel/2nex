package:
  schema: 1
  name: Linux Firmware
  slug: linux-firmware
  namespace: core/kernel
  version: "20251125"
  description: firmware files for linux kernel drivers
  homepage: https://git.kernel.org/pub/scm/linux/kernel/git/firmware/linux-firmware.git
  checksum: 5002580f83ec2fadf50a3cbac1ed7fe49171d9d51b02b6cfe4450977573e8630

sources:
- name: firmware
  url: https://gitlab.com/kernel-firmware/linux-firmware/-/archive/20251125/linux-firmware-20251125.tar.gz
  sha256: 21b8c5f9c70186474bcf9fcc4f4d1f4afe4fd2513cdf7f5a88ff3feb3ba7a374

dependencies:
- name: tar
  commit: x86_64/pkg/cli/archive/tar/1.35/bundles/dev
- name: gzip
  commit: x86_64/pkg/cli/archive/gzip/1.13/bundles/dev
- name: coreutils
  commit: x86_64/pkg/core/userland/coreutils/9.5/bundles/dev
- name: bash
  commit: x86_64/pkg/cli/shells/bash/5.2.21/bundles/dev
- name: findutils
  commit: x86_64/pkg/core/userland/findutils/4.9.0/bundles/dev
- name: glibc
  commit: x86_64/pkg/libs/system/glibc/2.39/bundles/dev
- name: ncurses
  commit: x86_64/pkg/libs/system/ncurses/6.4-20230520/bundles/dev
- name: acl
  commit: x86_64/pkg/libs/system/acl/2.3.2/bundles/dev
- name: attr
  commit: x86_64/pkg/libs/system/attr/2.5.2/bundles/dev

build:
  environment: 27b6e5dc7ad152c9a17c2cabfcc5ee93daa9bbf0

  script: |
    set -eux
    tar --no-same-owner -xzf /${SOURCE_firmware} -C "${WORK_DIR}"
    cd "${WORK_DIR}/linux-firmware-20251125"

    # install firmware to /usr/lib/firmware
    mkdir -p ${OUT_DIR}/usr/lib/firmware

    # copy all firmware files, excluding docs/licenses
    find . -type f \
      ! -name "WHENCE" \
      ! -name "LICENSE*" \
      ! -name "README*" \
      ! -name "configure" \
      ! -name "Makefile" \
      ! -name "*.txt" \
      ! -path "./.git/*" \
      -exec install -Dm644 {} ${OUT_DIR}/usr/lib/firmware/{} \;

    # deterministic timestamps
    find "${OUT_DIR}" -exec touch -d "2024-01-01T00:00:00+00:00" {} \;

