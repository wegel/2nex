  desktop:
  - bluetooth-intel
  - bluetooth-qca
  - bluetooth-realtek
  - gpu-amd
  - gpu-intel
  - gpu-nvidia
  - sound-cirrus
  - sound-intel
  - wifi-broadcom
  - wifi-intel
  - wifi-mediatek
  - wifi-qualcomm
  - wifi-realtek

  laptop-amd:
  - bluetooth-qca
  - gpu-amd
  - sound-cirrus
  - wifi-mediatek
  - wifi-qualcomm

  laptop-intel:
  - bluetooth-intel
  - gpu-intel
  - sound-cirrus
  - sound-intel
