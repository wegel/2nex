build:
  environment: 27b6e5dc7ad152c9a17c2cabfcc5ee93daa9bbf0
  profile: [4101:1377, 8228:4136, 12327:5854, 16435:6498, 24680:8700, 28828:8807, 32940:8898, 41160:8986, 49701:9069, 51833:9437]

  script: |
    tar --no-same-owner -xf ${SOURCE_shadow} -C "${WORK_DIR}" --strip-components=1
    cd ${WORK_DIR}

    patch --batch --fuzz=0 -Np1 -i /${SOURCE1}
    patch --batch --fuzz=0 -Np1 -i /${SOURCE2}
    patch --batch --fuzz=0 -Np1 -i /${SOURCE3}

    sed -i "s/groups\$(EXEEXT) //" src/Makefile.in
    find man -name Makefile.in -exec sed -i "s/groups\.1 / /"   {} \;
    find man -name Makefile.in -exec sed -i "s/getspnam\.3 / /" {} \;
    find man -name Makefile.in -exec sed -i "s/passwd\.5 / /"   {} \;

    sed -e "s:#ENCRYPT_METHOD DES:ENCRYPT_METHOD YESCRYPT:" \
      -e "s:/var/spool/mail:/var/mail:"                   \
      -e "/PATH=/{s@/sbin:@@;s@/bin:@@}"                  \
      -i etc/login.defs

    mkdir -p ${OUT_DIR}/usr/bin && touch ${OUT_DIR}/usr/bin/passwd
    ln -s ${OUT_DIR}/usr/bin ${OUT_DIR}/usr/sbin

    export CFLAGS="$CFLAGS -DEXTRA_CHECK_HOME_DIR"
    ./configure \
      --bindir=/usr/bin \
      --disable-account-tools-setuid \
      --libdir=/usr/lib \
      --mandir=/usr/share/man \
      --prefix=/usr \
      --sbindir=/usr/bin \
      --sysconfdir=/etc \
      --without-fcaps \
      --with-group-name-max-length=32 \
      --with-yescrypt \
      --without-bcrypt \
      --without-libbsd \
      --without-nscd \
      --without-selinux \
      --with-libpam

    sed -i -e "s/ -shared / -Wl,-O1,--as-needed\0/g" libtool
    make DESTDIR="${OUT_DIR}" install
    make DESTDIR="${OUT_DIR}" -C man install

    rm ${OUT_DIR}/usr/sbin

    find ${OUT_DIR} -type f -executable -exec strip --strip-unneeded {} \; 2>/dev/null || true
    find ${OUT_DIR} -name '*.a' -exec objcopy --enable-deterministic-archives {} \; 2>/dev/null || true
    find "${OUT_DIR}" -exec touch -d "2024-01-01T00:00:00+00:00" {} \;

