build:
  script: |
    tar --no-same-owner -xf ${SOURCE_kbd} -C "${WORK_DIR}" --strip-components=1
    cd ${WORK_DIR}

    ./configure --prefix=/usr --disable-vlock --disable-tests

    make

    make DESTDIR=$OUT_DIR install

    find "${OUT_DIR}" -exec touch -d "2024-01-01T00:00:00+00:00" {} \;
    2nex_strip_binaries ${OUT_DIR}
