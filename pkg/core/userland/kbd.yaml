build:
  environment: 27b6e5dc7ad152c9a17c2cabfcc5ee93daa9bbf0
  profile: [4113:886, 8209:2699, 12318:3439, 16433:6543, 20536:6653, 24637:6736, 28779:9005, 29088:9017]

  script: |
    tar --no-same-owner -xf ${SOURCE_kbd} -C "${WORK_DIR}" --strip-components=1
    cd ${WORK_DIR}

    ./configure --prefix=/usr --disable-vlock --disable-tests

    make

    make DESTDIR=$OUT_DIR install

    find ${OUT_DIR} -type f -executable -exec strip --strip-unneeded {} \; 2>/dev/null || true
    find "${OUT_DIR}" -exec touch -d "2024-01-01T00:00:00+00:00" {} \;

