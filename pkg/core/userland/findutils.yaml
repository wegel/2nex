package:
  schema: 1
  name: Findutils
  slug: findutils
  namespace: core/userland
  version: 4.9.0
  description: The GNU versions of find utilities (find and xargs)
  homepage: https://www.gnu.org/software/findutils/
  checksum: 7ce7ec73bc9b2dbfae79e1ee355c802bae90446bfe183a163963022cf651a47c
  seed: true

sources:
- name: findutils
  url: https://ftp.gnu.org/gnu/findutils/findutils-4.9.0.tar.xz
  sha256: a2bfb8c09d436770edc59f50fa483e785b161a3b7b9d547573cb08065fd462fe

dependencies:
- name: linux-headers
  commit: x86_64/pkg/bootstrap/phase1/linux-headers/6.4.1/bundles/dev
- name: glibc
  commit: x86_64/pkg/libs/system/glibc/2.39/bundles/dev
- name: binutils
  commit: x86_64/pkg/bootstrap/phase1/binutils/2.42/bundles/dev
- name: gcc
  commit: x86_64/pkg/bootstrap/phase1/gcc/13.2.0/bundles/dev
- name: texinfo
  commit: x86_64/pkg/cli/text/texinfo/7.1/bundles/dev
- name: bash
  commit: x86_64/pkg/bootstrap/phase1/bash/5.2.21/bundles/dev
- name: coreutils
  commit: x86_64/pkg/bootstrap/phase1/coreutils/9.5/bundles/dev
- name: findutils
  commit: x86_64/pkg/bootstrap/phase1/findutils/4.9.0/bundles/dev
- name: gawk
  commit: x86_64/pkg/bootstrap/phase1/gawk/5.3.0/bundles/dev
- name: grep
  commit: x86_64/pkg/bootstrap/phase1/grep/3.11/bundles/dev
- name: make
  commit: x86_64/pkg/bootstrap/phase1/make/4.4.1/bundles/dev
- name: sed
  commit: x86_64/pkg/bootstrap/phase1/sed/4.9/bundles/dev
- name: tar
  commit: x86_64/pkg/bootstrap/phase1/tar/1.35/bundles/dev
- name: xz
  commit: x86_64/pkg/bootstrap/phase1/xz/5.4.6/bundles/dev

build:
  environment: 27b6e5dc7ad152c9a17c2cabfcc5ee93daa9bbf0
  profile: [4099:2036, 8219:6786, 12345:8671, 20572:13008, 24680:15170, 28805:19231, 37080:23954, 45311:26271, 53593:26703, 57565:26900]

  script: |
    tar --no-same-owner -xf ${SOURCE_findutils} -C "${WORK_DIR}" --strip-components=1
    cd ${WORK_DIR}

    ./configure --prefix=/usr                   \
          --localstatedir=/var/lib/locate

    make
    make DESTDIR=${OUT_DIR} install

    find ${OUT_DIR} -type f -executable -exec strip --strip-unneeded {} \; 2>/dev/null || true
    find ${OUT_DIR} -name '*.a' -exec objcopy --enable-deterministic-archives {} \; 2>/dev/null || true
    find "${OUT_DIR}" -exec touch -d '2024-01-01T00:00:00+00:00' {} \;

bundles:
  dev:
  - bin
  - locale

outputs:
  bin:
    files:
    - path: /usr/bin/find
      needs:
      - /usr/lib/ld-linux-x86-64.so.2
      - /usr/lib/libc.so.6
    - path: /usr/bin/locate
      needs:
      - /usr/lib/ld-linux-x86-64.so.2
      - /usr/lib/libc.so.6
    - path: /usr/bin/updatedb
    - path: /usr/bin/xargs
      needs:
      - /usr/lib/ld-linux-x86-64.so.2
      - /usr/lib/libc.so.6
    - path: /usr/libexec/frcode
      needs:
      - /usr/lib/ld-linux-x86-64.so.2
      - /usr/lib/libc.so.6

  locale:
    files:
    - path: /usr/share/locale/be/LC_MESSAGES/findutils.mo
    - path: /usr/share/locale/bg/LC_MESSAGES/findutils.mo
    - path: /usr/share/locale/ca/LC_MESSAGES/findutils.mo
    - path: /usr/share/locale/cs/LC_MESSAGES/findutils.mo
    - path: /usr/share/locale/da/LC_MESSAGES/findutils.mo
    - path: /usr/share/locale/de/LC_MESSAGES/findutils.mo
    - path: /usr/share/locale/el/LC_MESSAGES/findutils.mo
    - path: /usr/share/locale/eo/LC_MESSAGES/findutils.mo
