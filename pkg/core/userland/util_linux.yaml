build:
  environment: 27b6e5dc7ad152c9a17c2cabfcc5ee93daa9bbf0
  profile: [4105:1154, 8227:2222, 16486:8708, 24719:11702, 32965:12797, 41230:17757, 45368:18003, 57897:18069, 71848:19028, 75034:20289]

  script: |
    tar --no-same-owner -xf ${SOURCE0} -C "${WORK_DIR}" --strip-components=1
    cd ${WORK_DIR}

    patch --batch --fuzz=0 -Np1 -i "/${SOURCE_uapi_config}"

    ./configure --bindir=/usr/bin     \
            --libdir=/usr/lib     \
            --runstatedir=/run    \
            --sbindir=/usr/bin   \
            --disable-chfn-chsh   \
            --disable-login       \
            --disable-nologin     \
            --disable-su          \
            --disable-setpriv     \
            --disable-runuser     \
            --disable-pylibmount  \
            --disable-liblastlog2 \
            --disable-static      \
            --without-python      \
            --disable-makeinstall-chown \
            ADJTIME_PATH=/var/lib/hwclock/adjtime \
            --docdir=/usr/share/doc/util-linux-2.40.1

    make
    make DESTDIR=$OUT_DIR install
    mv ${OUT_DIR}/usr/sbin/* ${OUT_DIR}/usr/bin/
    rmdir ${OUT_DIR}/usr/sbin

    mkdir -p /etc /run /usr/lib
    printf 'root:x:0:0:root:/root:/usr/bin/bash\n' > /etc/passwd
    printf 'root:x:0:\n' > /etc/group
    write_smoke_login_defs() {
      printf 'SYS_UID_MIN %s\nSYS_UID_MAX 999\n' "$2" > "$1"
    }
    expect_root_smoke() {
      desc="$1"
      expect="$2"
      out="${WORK_DIR}/lslogins-smoke.out"
      LD_LIBRARY_PATH="${OUT_DIR}/usr/lib${LD_LIBRARY_PATH:+:$LD_LIBRARY_PATH}" \
        "${OUT_DIR}/usr/bin/lslogins" -s -o USER --noheadings > "${out}" 2>&1
      present=no
      grep -q '^root$' "${out}" && present=yes
      if [ "${present}" != "${expect}" ]; then
        printf 'util-linux UAPI smoke: expected root present=%s for %s, log:\n' \
          "${expect}" "${desc}" >&2
        cat "${out}" >&2
        exit 1
      fi
    }

    rm -f /etc/login.defs /run/login.defs /usr/lib/login.defs
    write_smoke_login_defs /usr/lib/login.defs 1
    write_smoke_login_defs /run/login.defs 0
    write_smoke_login_defs /etc/login.defs 1
    expect_root_smoke "admin tier" no
    rm -f /etc/login.defs
    expect_root_smoke "runtime tier" yes
    rm -f /run/login.defs
    expect_root_smoke "vendor tier" no
    rm -f /usr/lib/login.defs
    printf 'util-linux UAPI smoke: login.defs loader read all three tiers in order\n'

    find ${OUT_DIR} -type f -executable -exec strip --strip-unneeded {} \; 2>/dev/null || true
    find ${OUT_DIR} -name '*.a' -exec objcopy --enable-deterministic-archives {} \; 2>/dev/null || true
    find "${OUT_DIR}" -exec touch -d "2024-01-01T00:00:00+00:00" {} \;

