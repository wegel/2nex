package:
  schema: 1
  name: Diffutils
  slug: diffutils
  namespace: core/userland
  version: "3.10"
  description: A package of several programs related to finding differences between files
  homepage: https://www.gnu.org/software/diffutils/
  checksum: 3e05488b12566ca8037e2dafd3fc7d79650bd83978c5d76465a7a811969017d3
  seed: true

sources:
- name: diffutils
  url: https://ftp.gnu.org/gnu/diffutils/diffutils-3.10.tar.xz
  sha256: 90e5e93cc724e4ebe12ede80df1634063c7a855692685919bfe60b556c9bd09e

dependencies:
- name: linux-headers
  commit: x86_64/pkg/bootstrap/phase1/linux-headers/6.4.1/bundles/dev
- name: glibc
  commit: x86_64/pkg/libs/system/glibc/2.39/bundles/dev
- name: binutils
  commit: x86_64/pkg/bootstrap/phase1/binutils/2.42/bundles/dev
- name: gcc
  commit: x86_64/pkg/bootstrap/phase1/gcc/13.2.0/bundles/dev
- name: texinfo
  commit: x86_64/pkg/cli/text/texinfo/7.1/bundles/dev
- name: bash
  commit: x86_64/pkg/bootstrap/phase1/bash/5.2.21/bundles/dev
- name: coreutils
  commit: x86_64/pkg/bootstrap/phase1/coreutils/9.5/bundles/dev
- name: findutils
  commit: x86_64/pkg/bootstrap/phase1/findutils/4.9.0/bundles/dev
- name: gawk
  commit: x86_64/pkg/bootstrap/phase1/gawk/5.3.0/bundles/dev
- name: grep
  commit: x86_64/pkg/bootstrap/phase1/grep/3.11/bundles/dev
- name: make
  commit: x86_64/pkg/bootstrap/phase1/make/4.4.1/bundles/dev
- name: sed
  commit: x86_64/pkg/bootstrap/phase1/sed/4.9/bundles/dev
- name: tar
  commit: x86_64/pkg/bootstrap/phase1/tar/1.35/bundles/dev
- name: xz
  commit: x86_64/pkg/bootstrap/phase1/xz/5.4.6/bundles/dev

build:
  environment: 13ce31fd97c19f5756e4413babf279d543b5a71c
  profile: [4119:2433, 8231:5751, 12363:7636, 16513:9537, 20641:16147, 24744:17071, 28845:18132, 33007:18382, 35542:18522]

  script: |
    tar --no-same-owner -xf ${SOURCE_diffutils} -C "${WORK_DIR}" --strip-components=1
    cd ${WORK_DIR}

    ./configure --prefix=/usr
    make
    make DESTDIR=$OUT_DIR install

    find ${OUT_DIR} -type f -executable -exec strip --strip-unneeded {} \; 2>/dev/null || true
    find ${OUT_DIR} -name '*.a' -exec objcopy --enable-deterministic-archives {} \; 2>/dev/null || true
    find "${OUT_DIR}" -exec touch -d '2024-01-01T00:00:00+00:00' {} \;

bundles:
  dev:
  - bin
  - locale

  full:
  - bin
  - info
  - locale
  - man

outputs:
  bin:
    files:
    - path: /usr/bin/cmp
      needs:
      - /usr/lib/ld-linux-x86-64.so.2
      - /usr/lib/libc.so.6
    - path: /usr/bin/diff
      needs:
      - /usr/lib/ld-linux-x86-64.so.2
      - /usr/lib/libc.so.6
    - path: /usr/bin/diff3
      needs:
      - /usr/lib/ld-linux-x86-64.so.2
      - /usr/lib/libc.so.6
    - path: /usr/bin/sdiff
      needs:
      - /usr/lib/ld-linux-x86-64.so.2
      - /usr/lib/libc.so.6

  info:
    files:
    - path: /usr/share/info/diffutils.info
    - path: /usr/share/info/dir

  locale:
    files:
    - path: /usr/share/locale/bg/LC_MESSAGES/diffutils.mo
    - path: /usr/share/locale/ca/LC_MESSAGES/diffutils.mo
    - path: /usr/share/locale/cs/LC_MESSAGES/diffutils.mo
