build:
  environment: 27b6e5dc7ad152c9a17c2cabfcc5ee93daa9bbf0
  profile: [4108:1920, 8210:3858, 12316:5633, 16490:7532, 20598:7597, 24754:9491, 28413:10201]

  script: |
    tar --no-same-owner -xf ${SOURCE0} -C "${WORK_DIR}" --strip-components=1
    cd ${WORK_DIR}

    patch --batch --fuzz=0 -Np1 -i "/${SOURCE_uapi_config}"

    ./configure --prefix=/usr                           \
                --sbindir=/usr/bin                      \
                --disable-static                        \
                --disable-kill                          \
                --with-systemd                          \
                --disable-modern-top

    make
    make DESTDIR=${OUT_DIR} install

    grep -qa '/etc/topdefaultrc' "${OUT_DIR}/usr/bin/top"
    grep -qa '/run/top/topdefaultrc' "${OUT_DIR}/usr/bin/top"
    grep -qa '/usr/lib/top/topdefaultrc' "${OUT_DIR}/usr/bin/top"

    mkdir -p /etc /run/top /usr/lib/top "${WORK_DIR}/empty-home"
    export HOME="${WORK_DIR}/empty-home"
    unset XDG_CONFIG_HOME
    expect_top_default() {
      desc="$1"
      path="$2"
      err="${WORK_DIR}/top-smoke.err"
      set +e
      LD_LIBRARY_PATH="${OUT_DIR}/usr/lib${LD_LIBRARY_PATH:+:$LD_LIBRARY_PATH}" \
        "${OUT_DIR}/usr/bin/top" -b -n 1 >"${WORK_DIR}/top-smoke.out" 2>"${err}"
      set -e
      if ! grep -q "${path}" "${err}"; then
        printf 'procps-ng UAPI smoke: expected %s for %s, log:\n' \
          "${path}" "${desc}" >&2
        cat "${err}" >&2
        exit 1
      fi
    }
    printf 'bad\nbad\n' > /usr/lib/top/topdefaultrc
    rm -f /etc/topdefaultrc /run/top/topdefaultrc
    expect_top_default "vendor alone" "/usr/lib/top/topdefaultrc"
    printf 'bad\nbad\n' > /run/top/topdefaultrc
    expect_top_default "runtime over vendor" "/run/top/topdefaultrc"
    printf 'bad\nbad\n' > /etc/topdefaultrc
    expect_top_default "admin over runtime" "/etc/topdefaultrc"
    rm -f /etc/topdefaultrc /run/top/topdefaultrc /usr/lib/top/topdefaultrc
    printf 'procps-ng UAPI smoke: topdefaultrc loader read all three tiers in order\n'

    find ${OUT_DIR} -type f -executable -exec strip --strip-unneeded {} \; 2>/dev/null || true
    find ${OUT_DIR} -name '*.a' -exec objcopy --enable-deterministic-archives {} \; 2>/dev/null || true
    find "${OUT_DIR}" -exec touch -d "2024-01-01T00:00:00+00:00" {} \;

