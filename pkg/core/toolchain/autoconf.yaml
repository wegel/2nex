package:
  schema: 1
  name: Autoconf
  slug: autoconf
  namespace: core/toolchain
  version: "2.72"
  description: A package of M4 macros that produce shell scripts to automatically configure software source code packages
  homepage: https://www.gnu.org/software/autoconf/
  checksum: 7c43fdc9b4856872403d906cd395d14aca17b0f9a30dea985e29fd308bcebb37
  seed: true

sources:
- name: autoconf
  url: https://ftp.gnu.org/gnu/autoconf/autoconf-2.72.tar.xz
  sha256: ba885c1319578d6c94d46e9b0dceb4014caafe2490e437a0dbca3f270a223f5a

dependencies:
- name: glibc
  commit: x86_64/pkg/libs/system/glibc/2.39/bundles/dev
- name: perl
  commit: x86_64/pkg/dev/lang/perl/5.38.2/bundles/dev
- name: texinfo
  commit: x86_64/pkg/cli/text/texinfo/7.1/bundles/dev
- name: m4
  commit: x86_64/pkg/bootstrap/phase1/m4/1.4.19/bundles/dev
- name: bash
  commit: x86_64/pkg/bootstrap/phase1/bash/5.2.21/bundles/dev
- name: coreutils
  commit: x86_64/pkg/bootstrap/phase1/coreutils/9.5/bundles/dev
- name: findutils
  commit: x86_64/pkg/bootstrap/phase1/findutils/4.9.0/bundles/dev
- name: gawk
  commit: x86_64/pkg/bootstrap/phase1/gawk/5.3.0/bundles/dev
- name: grep
  commit: x86_64/pkg/bootstrap/phase1/grep/3.11/bundles/dev
- name: make
  commit: x86_64/pkg/bootstrap/phase1/make/4.4.1/bundles/dev
- name: sed
  commit: x86_64/pkg/bootstrap/phase1/sed/4.9/bundles/dev
- name: tar
  commit: x86_64/pkg/bootstrap/phase1/tar/1.35/bundles/dev
- name: xz
  commit: x86_64/pkg/bootstrap/phase1/xz/5.4.6/bundles/dev

build:
  environment: 27b6e5dc7ad152c9a17c2cabfcc5ee93daa9bbf0
  profile: [4660:1198, 8761:1200, 12862:1207, 16998:1279, 21210:1290, 22535:1337]

  script: |
    tar --no-same-owner -xf ${SOURCE_autoconf} -C "${WORK_DIR}" --strip-components=1
    cd ${WORK_DIR}

    ./configure --prefix=/usr
    make
    make DESTDIR=$OUT_DIR install

    find "${OUT_DIR}" -exec touch -d "2024-01-01T00:00:00+00:00" {} \;

bundles:
  dev:
  - bin
  - misc

  full:
  - bin
  - info
  - man
  - misc

outputs:
  bin:
    files:
    - path: /usr/bin/autoconf
    - path: /usr/bin/autoheader
    - path: /usr/bin/autom4te
    - path: /usr/bin/autoreconf
    - path: /usr/bin/autoscan
    - path: /usr/bin/autoupdate
    - path: /usr/bin/ifnames

  info:
    files:
    - path: /usr/share/info/autoconf.info
    - path: /usr/share/info/dir
    - path: /usr/share/info/standards.info

  man:
    files:
    - path: /usr/share/man/man1/autoconf.1
    - path: /usr/share/man/man1/autoheader.1
    - path: /usr/share/man/man1/autom4te.1
    - path: /usr/share/man/man1/autoreconf.1
    - path: /usr/share/man/man1/autoscan.1
    - path: /usr/share/man/man1/autoupdate.1
    - path: /usr/share/man/man1/ifnames.1

  misc:
    files:
    - path: /usr/share/autoconf/Autom4te/C4che.pm
    - path: /usr/share/autoconf/Autom4te/ChannelDefs.pm
    - path: /usr/share/autoconf/Autom4te/Channels.pm
    - path: /usr/share/autoconf/Autom4te/Config.pm
    - path: /usr/share/autoconf/Autom4te/Configure_ac.pm
    - path: /usr/share/autoconf/Autom4te/FileUtils.pm
    - path: /usr/share/autoconf/Autom4te/General.pm
    - path: /usr/share/autoconf/Autom4te/Getopt.pm
    - path: /usr/share/autoconf/Autom4te/Request.pm
    - path: /usr/share/autoconf/Autom4te/XFile.pm
    - path: /usr/share/autoconf/INSTALL
    - path: /usr/share/autoconf/autoconf/autoconf.m4
    - path: /usr/share/autoconf/autoconf/autoconf.m4f
    - path: /usr/share/autoconf/autoconf/autoheader.m4
    - path: /usr/share/autoconf/autoconf/autoscan.m4
    - path: /usr/share/autoconf/autoconf/autotest.m4
    - path: /usr/share/autoconf/autoconf/autoupdate.m4
    - path: /usr/share/autoconf/autoconf/c.m4
    - path: /usr/share/autoconf/autoconf/erlang.m4
    - path: /usr/share/autoconf/autoconf/fortran.m4
    - path: /usr/share/autoconf/autoconf/functions.m4
    - path: /usr/share/autoconf/autoconf/general.m4
    - path: /usr/share/autoconf/autoconf/go.m4
    - path: /usr/share/autoconf/autoconf/headers.m4
    - path: /usr/share/autoconf/autoconf/lang.m4
    - path: /usr/share/autoconf/autoconf/libs.m4
    - path: /usr/share/autoconf/autoconf/oldnames.m4
    - path: /usr/share/autoconf/autoconf/programs.m4
    - path: /usr/share/autoconf/autoconf/specific.m4
