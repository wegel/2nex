    - path: /usr/share/autoconf/autoconf/types.m4
    - path: /usr/share/autoconf/autom4te.cfg
    - path: /usr/share/autoconf/autoscan/autoscan.list
    - path: /usr/share/autoconf/autotest/autotest.m4
    - path: /usr/share/autoconf/autotest/autotest.m4f
    - path: /usr/share/autoconf/autotest/general.m4
    - path: /usr/share/autoconf/autotest/specific.m4
    - path: /usr/share/autoconf/build-aux/config.guess
    - path: /usr/share/autoconf/build-aux/config.sub
    - path: /usr/share/autoconf/build-aux/install-sh
    - path: /usr/share/autoconf/m4sugar/foreach.m4
    - path: /usr/share/autoconf/m4sugar/m4sh.m4
    - path: /usr/share/autoconf/m4sugar/m4sh.m4f
