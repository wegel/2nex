package:
  schema: 1
  name: Meson
  slug: meson
  namespace: core/toolchain
  version: 1.4.1
  description: Meson is an open source build system meant to be both extremely fast, and as user friendly as possible.
  homepage: https://mesonbuild.com
  checksum: 99d292cf6732dbabd3e12546969c8135b435cd70ad4c4bca07d20a4f385ed8e0
sources:
- name: meson
  url: https://github.com/mesonbuild/meson/releases/download/1.4.1/meson-1.4.1.tar.gz
  sha256: 1b8aad738a5f6ae64294cc8eaba9a82988c1c420204484ac02ef782e5bba5f49
dependencies:
- name: coreutils
  commit: x86_64/pkg/bootstrap/phase1/coreutils/9.5/bundles/dev
- name: findutils
  commit: x86_64/pkg/bootstrap/phase1/findutils/4.9.0/bundles/dev
- name: bash
  commit: x86_64/pkg/bootstrap/phase1/bash/5.2.21/bundles/dev
- name: 2nex-utilities-bootstrap
  commit: x86_64/pkg/bootstrap/phase3/2nex-utilities-bootstrap/0.0.1/bundles/dev
- name: gzip
  commit: x86_64/pkg/bootstrap/phase1/gzip/1.13/bundles/dev
- name: tar
  commit: x86_64/pkg/bootstrap/phase1/tar/1.35/bundles/dev
- name: glibc
  commit: x86_64/pkg/libs/system/glibc/2.39/bundles/dev
- name: expat
  commit: x86_64/pkg/libs/system/expat/2.6.2/outputs/lib
- name: libffi
  commit: x86_64/pkg/libs/system/libffi/3.4.6/outputs/lib
- name: gcc
  commit: x86_64/pkg/core/toolchain/gcc/13.2.0/bundles/dev
- name: zlib
  commit: x86_64/pkg/libs/system/zlib/1.3.1/outputs/lib
- name: python3
  commit: x86_64/pkg/dev/lang/python3/3.12.2/bundles/dev
- name: setuptools
  commit: x86_64/pkg/dev/python/setuptools/70.0.0/bundles/dev
- name: wheel
  commit: x86_64/pkg/dev/python/wheel/0.43.0/bundles/dev
build:
  script: |
    tar --no-same-owner -xf ${SOURCE0} -C "${WORK_DIR}" --strip-components=1
    cd ${WORK_DIR}

    pip3 wheel -w dist --no-cache-dir --no-build-isolation --no-deps $PWD
    pip3 install --no-index --root=${OUT_DIR} --find-links dist meson
    install -vDm644 data/shell-completions/bash/meson ${OUT_DIR}/usr/share/bash-completion/completions/meson
    install -vDm644 data/shell-completions/zsh/_meson ${OUT_DIR}/usr/share/zsh/site-functions/_meson

    find "${OUT_DIR}" -exec touch -d "2024-01-01T00:00:00+00:00" {} \;
    2nex_strip_binaries ${OUT_DIR}
bundles:
  full:
  - bin
  - lib
  - man
  - misc
  dev:
  - bin
  - lib
outputs:
  misc:
    files:
    - path: /usr/share/bash-completion/completions/meson
    - path: /usr/share/polkit-1/actions/com.mesonbuild.install.policy
    - path: /usr/share/zsh/site-functions/_meson
