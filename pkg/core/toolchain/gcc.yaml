build:
  environment: 27b6e5dc7ad152c9a17c2cabfcc5ee93daa9bbf0
  profile: [118157:11680, 455425:16206, 1026470:23763, 1710172:39230, 2278704:83886, 2849877:155391, 3415722:161174, 4279397:201815, 5124394:242339, 5689934:260734]

  script: |
    # gcc's build system doesn't use gcc-ar/gcc-ranlib consistently, so disable LTO
    CFLAGS=${CFLAGS/-Werror=format-security/}
    CFLAGS=${CFLAGS/-flto=auto/}
    CXXFLAGS=${CXXFLAGS/-Werror=format-security/}
    CXXFLAGS=${CXXFLAGS/-flto=auto/}
    LDFLAGS=${LDFLAGS/-flto=auto/}

    tar --no-same-owner -xf ${SOURCE_gcc} -C "${WORK_DIR}" --strip-components=1

    # extract in-tree mpfr/gmp/mpc (avoids bootstrap dependency chain)
    mkdir -p ${WORK_DIR}/mpfr ${WORK_DIR}/gmp ${WORK_DIR}/mpc
    tar --no-same-owner -xf ${SOURCE_mpfr} -C ${WORK_DIR}/mpfr --strip-components=1
    tar --no-same-owner -xf ${SOURCE_gmp} -C ${WORK_DIR}/gmp --strip-components=1
    tar --no-same-owner -xf ${SOURCE_mpc} -C ${WORK_DIR}/mpc --strip-components=1

    cd ${WORK_DIR}

    patch --batch --fuzz=0 -p0 < /${SOURCE_gcc9_reproducible_builds}
    patch --batch --fuzz=0 -p1 < /${SOURCE_gcc9_reproducible_builds_buildid_for_checksum}

    sed -e "/m64=/s/lib64/lib/" -i.orig gcc/config/i386/t-linux64

    mkdir -pv build
    cd       build

    ../configure --prefix=/usr            \
               LD=ld                    \
               --enable-languages=c,c++ \
               --enable-default-pie     \
               --enable-default-ssp     \
               --disable-multilib       \
               --disable-bootstrap      \
               --disable-fixincludes    \
               --with-system-zlib

    ulimit -s 32768

    make
    make DESTDIR=${OUT_DIR} install
    ln -sv gcc ${OUT_DIR}/usr/bin/cc
    ln -svr /usr/bin/cpp ${OUT_DIR}/usr/lib

    mkdir -pv ${OUT_DIR}/usr/share/gdb/auto-load/usr/lib
    mv -v ${OUT_DIR}/usr/lib/*gdb.py ${OUT_DIR}/usr/share/gdb/auto-load/usr/lib
    find "${OUT_DIR}" -name "*.la" -delete


    # strip runtime libraries (but not .o files or plugins)
    find "${OUT_DIR}/usr/lib" -type f -name "*.so.*" -exec strip {} \;

    # strip binaries in /usr/bin and /usr/libexec
    find "${OUT_DIR}/usr/bin" -type f -executable -exec strip {} \;
    find "${OUT_DIR}/usr/libexec/gcc" -type f -executable -exec strip {} \;

    find ${OUT_DIR} -name '*.a' -exec objcopy --enable-deterministic-archives {} \; 2>/dev/null || true
    find "${OUT_DIR}" -exec touch -d "2024-01-01T00:00:00+00:00" {} \;

