package:
  schema: 1
  name: Make
  slug: make
  namespace: core/toolchain
  version: 4.4.1
  description: Utility to maintain groups of programs
  homepage: https://www.gnu.org/software/make/
  checksum: 5a31008bc6e53b1c127c3363582d9b188a944276734a3f6092c60f26839e968f

sources:
- name: make
  url: https://ftp.gnu.org/gnu/make/make-4.4.1.tar.gz
  sha256: dd16fb1d67bfab79a72f5e8390735c49e3e8e70b4945a15ab1f81ddb78658fb3

dependencies:
- name: bash
  commit: x86_64/pkg/bootstrap/phase1/bash/5.2.21/bundles/dev
- name: phase3
  commit: x86_64/pkg/bootstrap/phase3/2nex-utilities-bootstrap/0.0.1/bundles/dev
- name: make
  commit: x86_64/pkg/bootstrap/phase1/make/4.4.1/bundles/dev
- name: tar
  commit: x86_64/pkg/bootstrap/phase1/tar/1.35/bundles/dev
- name: bootstrap_tools
