    - path: /usr/share/locale/hr/LC_MESSAGES/make.mo
    - path: /usr/share/locale/id/LC_MESSAGES/make.mo
    - path: /usr/share/locale/it/LC_MESSAGES/make.mo
    - path: /usr/share/locale/ja/LC_MESSAGES/make.mo
    - path: /usr/share/locale/ko/LC_MESSAGES/make.mo
    - path: /usr/share/locale/lt/LC_MESSAGES/make.mo
    - path: /usr/share/locale/nl/LC_MESSAGES/make.mo
    - path: /usr/share/locale/pl/LC_MESSAGES/make.mo
    - path: /usr/share/locale/pt/LC_MESSAGES/make.mo
    - path: /usr/share/locale/pt_BR/LC_MESSAGES/make.mo
    - path: /usr/share/locale/ro/LC_MESSAGES/make.mo
    - path: /usr/share/locale/ru/LC_MESSAGES/make.mo
    - path: /usr/share/locale/sr/LC_MESSAGES/make.mo
    - path: /usr/share/locale/sv/LC_MESSAGES/make.mo
    - path: /usr/share/locale/tr/LC_MESSAGES/make.mo
    - path: /usr/share/locale/uk/LC_MESSAGES/make.mo
    - path: /usr/share/locale/vi/LC_MESSAGES/make.mo
    - path: /usr/share/locale/zh_CN/LC_MESSAGES/make.mo
    - path: /usr/share/locale/zh_TW/LC_MESSAGES/make.mo

  man:
