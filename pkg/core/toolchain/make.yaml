package:
  schema: 1
  name: Make
  slug: make
  namespace: core/toolchain
  version: 4.4.1
  description: Utility to maintain groups of programs
  homepage: https://www.gnu.org/software/make/
  checksum: 22dd6177b554a95311a5b9cbd6581435ce7637c5c2d0dc4152cfe3c976c69e95
  seed: true

sources:
- name: make
  url: https://ftp.gnu.org/gnu/make/make-4.4.1.tar.gz
  sha256: dd16fb1d67bfab79a72f5e8390735c49e3e8e70b4945a15ab1f81ddb78658fb3

dependencies:
- name: linux-headers
  commit: x86_64/pkg/bootstrap/phase3/linux-headers/6.4.1/bundles/dev
- name: glibc
  commit: x86_64/pkg/libs/system/glibc/2.39/bundles/dev
- name: binutils
  commit: x86_64/pkg/bootstrap/phase3/binutils/2.42/bundles/dev
- name: gcc
  commit: x86_64/pkg/bootstrap/phase3/gcc/13.2.0/bundles/dev
- name: zlib
  commit: x86_64/pkg/bootstrap/phase3/zlib/1.3.1/bundles/dev
- name: texinfo
  commit: x86_64/pkg/cli/text/texinfo/7.1/bundles/dev
- name: bash
  commit: x86_64/pkg/bootstrap/phase3/bash/5.2.21/bundles/dev
- name: coreutils
  commit: x86_64/pkg/bootstrap/phase3/coreutils/9.5/bundles/dev
- name: findutils
  commit: x86_64/pkg/bootstrap/phase3/findutils/4.9.0/bundles/dev
- name: gawk
  commit: x86_64/pkg/bootstrap/phase3/gawk/5.3.0/bundles/dev
- name: grep
  commit: x86_64/pkg/bootstrap/phase3/grep/3.11/bundles/dev
- name: gzip
  commit: x86_64/pkg/bootstrap/phase3/gzip/1.13/bundles/dev
- name: make
  commit: x86_64/pkg/bootstrap/phase3/make/4.4.1/bundles/dev
- name: sed
  commit: x86_64/pkg/bootstrap/phase3/sed/4.9/bundles/dev
- name: tar
  commit: x86_64/pkg/bootstrap/phase3/tar/1.35/bundles/dev
- name: xz
  commit: x86_64/pkg/bootstrap/phase3/xz/5.4.6/bundles/dev

build:
  environment: 27b6e5dc7ad152c9a17c2cabfcc5ee93daa9bbf0
  profile: [4124:1396, 8246:4920, 12612:4963, 16728:4986, 20832:5007, 24984:5022, 29092:6242, 30981:6350]

  script: |
    tar --no-same-owner -xf ${SOURCE_make} -C "${WORK_DIR}" --strip-components=1
    cd ${WORK_DIR}

    ./configure --prefix=/usr

    make
    make DESTDIR=${OUT_DIR} install

    find ${OUT_DIR} -type f -executable -exec strip --strip-unneeded {} \; 2>/dev/null || true
    find ${OUT_DIR} -name '*.a' -exec objcopy --enable-deterministic-archives {} \; 2>/dev/null || true
    find "${OUT_DIR}" -exec touch -d '2024-01-01T00:00:00+00:00' {} \;

bundles:
  dev:
  - bin
  - dev
  - locale

  full:
  - bin
  - dev
  - info
  - locale
  - man

outputs:
  bin:
    files:
    - path: /usr/bin/make
      needs:
      - /usr/lib/ld-linux-x86-64.so.2
      - /usr/lib/libc.so.6

  dev:
    files:
    - path: /usr/include/gnumake.h

  info:
    files:
    - path: /usr/share/info/dir
    - path: /usr/share/info/make.info
    - path: /usr/share/info/make.info-1
    - path: /usr/share/info/make.info-2
    - path: /usr/share/info/make.info-3

  locale:
    files:
    - path: /usr/share/locale/be/LC_MESSAGES/make.mo
    - path: /usr/share/locale/bg/LC_MESSAGES/make.mo
    - path: /usr/share/locale/cs/LC_MESSAGES/make.mo
    - path: /usr/share/locale/da/LC_MESSAGES/make.mo
    - path: /usr/share/locale/de/LC_MESSAGES/make.mo
    - path: /usr/share/locale/es/LC_MESSAGES/make.mo
    - path: /usr/share/locale/fi/LC_MESSAGES/make.mo
    - path: /usr/share/locale/fr/LC_MESSAGES/make.mo
