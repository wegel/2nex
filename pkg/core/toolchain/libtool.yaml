package:
  schema: 1
  name: Libtool
  slug: libtool
  namespace: core/toolchain
  version: 2.4.7
  description: A generic library support script
  homepage: https://www.gnu.org/software/libtool/
  checksum: 67f043593c2b04efcb6f2c701d91510a401777d1b78eb9f64da3e4ce1a8ecdd5
sources:
- name: libtool
  url: https://ftp.gnu.org/gnu/libtool/libtool-2.4.7.tar.xz
  sha256: 4f7f217f057ce655ff22559ad221a0fd8ef84ad1fc5fcb6990cecc333aa1635d
dependencies:
- commit: x86_64/pkg/bootstrap/phase1/coreutils/9.5/bundles/dev
  name: coreutils
- commit: x86_64/pkg/bootstrap/phase1/diffutils/3.10/bundles/dev
  name: diffutils
- commit: x86_64/pkg/bootstrap/phase1/findutils/4.9.0/bundles/dev
  name: findutils
- commit: x86_64/pkg/bootstrap/phase3/2nex-utilities-bootstrap/0.0.1/bundles/dev
  name: 2nex-utilities
- commit: x86_64/pkg/bootstrap/phase1/gawk/5.3.0/bundles/dev
  name: gawk
- commit: x86_64/pkg/bootstrap/phase1/make/4.4.1/bundles/dev
  name: make
- commit: x86_64/pkg/bootstrap/phase1/tar/1.35/bundles/dev
  name: tar
- commit: x86_64/pkg/bootstrap/phase2/texinfo/7.1/bundles/dev
  name: texinfo
- commit: x86_64/pkg/bootstrap/phase3/zlib/1.3.1/bundles/dev
  name: zlib
- commit: x86_64/pkg/bootstrap/phase3/bzip2/1.0.8/bundles/dev
  name: bzip2
- commit: x86_64/pkg/bootstrap/phase3/xz/5.4.6/bundles/dev
  name: xz
- commit: x86_64/pkg/bootstrap/phase3/file/5.45/bundles/dev
  name: file
- commit: x86_64/pkg/bootstrap/phase3/m4/1.4.19/bundles/dev
  name: m4
- commit: x86_64/pkg/bootstrap/phase3/binutils/2.42/bundles/dev
  name: binutils
- commit: x86_64/pkg/bootstrap/phase3/gcc/13.2.0/bundles/dev
  name: gcc
- commit: x86_64/pkg/bootstrap/phase1/bash/5.2.21/bundles/dev
  name: bash
- commit: x86_64/pkg/bootstrap/phase3/strip-nondeterminism/1.13.0/bundles/dev
  name: strip_nondeterminism
- commit: x86_64/pkg/bootstrap/phase2/perl/5.38.2/bundles/dev
  name: perl
- commit: x86_64/pkg/libs/system/glibc/2.39/bundles/dev
  name: glibc
build:
  script: 'tar --no-same-owner -xf ${SOURCE0} -C "${WORK_DIR}" --strip-components=1

    cd ${WORK_DIR}


    ./configure --prefix=/usr

    make

    make DESTDIR=$OUT_DIR install

    rm -fv ${OUT_DIR}/usr/lib/libltdl.a

    sed -i ''s/max_cmd_len=[0-9]*/max_cmd_len=4718592/'' ${OUT_DIR}/usr/bin/libtool

    find "${OUT_DIR}" -exec touch -d "2024-01-01T00:00:00+00:00" {} \;

    find "${OUT_DIR}" ! -type d -exec strip-nondeterminism -T 1704067200 --normalizers
    +all {} \;

    2nex_strip_binaries ${OUT_DIR}

    '
bundles:
  full:
  - bin
  - dev
  - lib
  - info
  - man
  dev:
  - bin
  - dev
  - lib
outputs:
  bin:
    files:
    - /usr/bin/libtool
    - /usr/bin/libtoolize
  dev:
    files:
    - /usr/include/libltdl/lt_dlloader.h
    - /usr/include/libltdl/lt_error.h
    - /usr/include/libltdl/lt_system.h
    - /usr/include/ltdl.h
    - /usr/lib/libltdl.la
    - /usr/share/aclocal/libtool.m4
    - /usr/share/aclocal/ltargz.m4
    - /usr/share/aclocal/ltdl.m4
    - /usr/share/aclocal/ltoptions.m4
    - /usr/share/aclocal/ltsugar.m4
    - /usr/share/aclocal/ltversion.m4
    - /usr/share/aclocal/lt~obsolete.m4
    - /usr/share/libtool/COPYING.LIB
    - /usr/share/libtool/Makefile.am
    - /usr/share/libtool/Makefile.in
    - /usr/share/libtool/README
    - /usr/share/libtool/aclocal.m4
    - /usr/share/libtool/build-aux/compile
    - /usr/share/libtool/build-aux/config.guess
    - /usr/share/libtool/build-aux/config.sub
    - /usr/share/libtool/build-aux/depcomp
    - /usr/share/libtool/build-aux/install-sh
    - /usr/share/libtool/build-aux/ltmain.sh
    - /usr/share/libtool/build-aux/missing
    - /usr/share/libtool/config-h.in
    - /usr/share/libtool/configure
    - /usr/share/libtool/configure.ac
    - /usr/share/libtool/libltdl/lt__alloc.h
    - /usr/share/libtool/libltdl/lt__argz_.h
    - /usr/share/libtool/libltdl/lt__dirent.h
    - /usr/share/libtool/libltdl/lt__glibc.h
    - /usr/share/libtool/libltdl/lt__private.h
    - /usr/share/libtool/libltdl/lt__strl.h
    - /usr/share/libtool/libltdl/lt_dlloader.h
    - /usr/share/libtool/libltdl/lt_error.h
    - /usr/share/libtool/libltdl/lt_system.h
    - /usr/share/libtool/libltdl/slist.h
    - /usr/share/libtool/loaders/dld_link.c
    - /usr/share/libtool/loaders/dlopen.c
    - /usr/share/libtool/loaders/dyld.c
    - /usr/share/libtool/loaders/load_add_on.c
    - /usr/share/libtool/loaders/loadlibrary.c
    - /usr/share/libtool/loaders/preopen.c
    - /usr/share/libtool/loaders/shl_load.c
    - /usr/share/libtool/lt__alloc.c
    - /usr/share/libtool/lt__argz.c
    - /usr/share/libtool/lt__dirent.c
    - /usr/share/libtool/lt__strl.c
    - /usr/share/libtool/lt_dlloader.c
    - /usr/share/libtool/lt_error.c
    - /usr/share/libtool/ltdl.c
    - /usr/share/libtool/ltdl.h
    - /usr/share/libtool/ltdl.mk
    - /usr/share/libtool/slist.c
  lib:
    files:
    - /usr/lib/libltdl.so
    - /usr/lib/libltdl.so.7
    - /usr/lib/libltdl.so.7.3.2
    requires:
    - x86_64/pkg/libs/system/glibc/2.39/outputs/lib
  info:
    files:
    - /usr/share/info/dir
    - /usr/share/info/libtool.info
    - /usr/share/info/libtool.info-1
    - /usr/share/info/libtool.info-2
  man:
