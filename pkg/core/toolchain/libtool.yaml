package:
  schema: 1
  name: Libtool
  slug: libtool
  namespace: core/toolchain
  version: 2.4.7
  description: A generic library support script
  homepage: https://www.gnu.org/software/libtool/
  checksum: 72eeadcc530a74b5bef602b79dd4af7fce68e3a22b5f9fcacddc0bbc67a7f2dc

sources:
- name: libtool
  url: https://ftp.gnu.org/gnu/libtool/libtool-2.4.7.tar.xz
  sha256: 4f7f217f057ce655ff22559ad221a0fd8ef84ad1fc5fcb6990cecc333aa1635d

dependencies:
- name: linux-headers
  commit: x86_64/pkg/libs/system/linux-headers/6.4.1/bundles/dev
- name: glibc
  commit: x86_64/pkg/libs/system/glibc/2.39/bundles/dev
- name: zlib
  commit: x86_64/pkg/libs/system/zlib/1.3.1/bundles/dev
- name: ncurses
  commit: x86_64/pkg/libs/system/ncurses/6.4-20230520/bundles/dev
- name: attr
  commit: x86_64/pkg/libs/system/attr/2.5.2/bundles/dev
- name: acl
  commit: x86_64/pkg/libs/system/acl/2.3.2/bundles/dev
- name: libcap
  commit: x86_64/pkg/libs/security/libcap/2.69/bundles/dev
- name: gmp
  commit: x86_64/pkg/libs/system/gmp/6.3.0/bundles/dev
- name: binutils
  commit: x86_64/pkg/core/toolchain/binutils/2.42/bundles/dev
- name: gcc
  commit: x86_64/pkg/core/toolchain/gcc/13.2.0/bundles/dev
- name: make
  commit: x86_64/pkg/core/toolchain/make/4.4.1/bundles/dev
- name: bash
  commit: x86_64/pkg/cli/shells/bash/5.2.21/bundles/dev
- name: coreutils
  commit: x86_64/pkg/core/userland/coreutils/9.5/bundles/dev
- name: findutils
  commit: x86_64/pkg/core/userland/findutils/4.9.0/bundles/dev
- name: diffutils
  commit: x86_64/pkg/core/userland/diffutils/3.10/bundles/dev
- name: grep
  commit: x86_64/pkg/cli/text/grep/3.11/bundles/dev
- name: gawk
  commit: x86_64/pkg/cli/text/gawk/5.3.0/bundles/dev
- name: sed
  commit: x86_64/pkg/cli/text/sed/4.9/bundles/dev
- name: tar
  commit: x86_64/pkg/cli/archive/tar/1.35/bundles/dev
- name: xz
  commit: x86_64/pkg/libs/compression/xz/5.4.6/bundles/dev
- name: m4
  commit: x86_64/pkg/dev/lang/m4/1.4.19/bundles/dev
- name: texinfo
  commit: x86_64/pkg/cli/text/texinfo/7.1/bundles/dev
- name: file
  commit: x86_64/pkg/dev/tools/file/5.45/bundles/dev

build:
  environment: 27b6e5dc7ad152c9a17c2cabfcc5ee93daa9bbf0
  profile: [4105:8753, 8208:15133, 12333:20806, 16471:24069, 18165:26011]

  script: |
    tar --no-same-owner -xf ${SOURCE0} -C "${WORK_DIR}" --strip-components=1
    cd ${WORK_DIR}

    ./configure --prefix=/usr
    make
    make DESTDIR=$OUT_DIR install
    rm -fv ${OUT_DIR}/usr/lib/libltdl.a
    sed -i 's/max_cmd_len=[0-9]*/max_cmd_len=4718592/' ${OUT_DIR}/usr/bin/libtool

    find ${OUT_DIR} -type f -executable -exec strip --strip-unneeded {} \; 2>/dev/null || true
    find ${OUT_DIR} -name '*.a' -exec objcopy --enable-deterministic-archives {} \; 2>/dev/null || true
    find "${OUT_DIR}" -exec touch -d "2024-01-01T00:00:00+00:00" {} \;

bundles:
  dev:
  - bin
  - dev
  - lib
  - misc

  full:
  - bin
  - dev
  - info
  - lib
  - man
  - misc

outputs:
  bin:
    files:
    - path: /usr/bin/libtool
    - path: /usr/bin/libtoolize

  dev:
    files:
    - path: /usr/include/libltdl/lt_dlloader.h
    - path: /usr/include/libltdl/lt_error.h
    - path: /usr/include/libltdl/lt_system.h
    - path: /usr/include/ltdl.h
    - path: /usr/lib/libltdl.la

  info:
    files:
    - path: /usr/share/info/dir
    - path: /usr/share/info/libtool.info
    - path: /usr/share/info/libtool.info-1
    - path: /usr/share/info/libtool.info-2

  lib:
    files:
    - path: /usr/lib/libltdl.so
      needs:
      - /usr/lib/libc.so.6
    - path: /usr/lib/libltdl.so.7
      needs:
      - /usr/lib/libc.so.6
    - path: /usr/lib/libltdl.so.7.3.2
      needs:
      - /usr/lib/libc.so.6

  man:
    files:
    - path: /usr/share/man/man1/libtool.1
    - path: /usr/share/man/man1/libtoolize.1

  misc:
    files:
    - path: /usr/share/aclocal/libtool.m4
    - path: /usr/share/aclocal/ltargz.m4
    - path: /usr/share/aclocal/ltdl.m4
    - path: /usr/share/aclocal/ltoptions.m4
    - path: /usr/share/aclocal/ltsugar.m4
    - path: /usr/share/aclocal/ltversion.m4
    - path: /usr/share/aclocal/lt~obsolete.m4
    - path: /usr/share/libtool/COPYING.LIB
    - path: /usr/share/libtool/Makefile.am
    - path: /usr/share/libtool/Makefile.in
    - path: /usr/share/libtool/README
    - path: /usr/share/libtool/aclocal.m4
    - path: /usr/share/libtool/build-aux/compile
    - path: /usr/share/libtool/build-aux/config.guess
    - path: /usr/share/libtool/build-aux/config.sub
    - path: /usr/share/libtool/build-aux/depcomp
    - path: /usr/share/libtool/build-aux/install-sh
    - path: /usr/share/libtool/build-aux/ltmain.sh
    - path: /usr/share/libtool/build-aux/missing
    - path: /usr/share/libtool/config-h.in
    - path: /usr/share/libtool/configure
    - path: /usr/share/libtool/configure.ac
    - path: /usr/share/libtool/libltdl/lt__alloc.h
    - path: /usr/share/libtool/libltdl/lt__argz_.h
    - path: /usr/share/libtool/libltdl/lt__dirent.h
    - path: /usr/share/libtool/libltdl/lt__glibc.h
    - path: /usr/share/libtool/libltdl/lt__private.h
    - path: /usr/share/libtool/libltdl/lt__strl.h
    - path: /usr/share/libtool/libltdl/lt_dlloader.h
    - path: /usr/share/libtool/libltdl/lt_error.h
    - path: /usr/share/libtool/libltdl/lt_system.h
    - path: /usr/share/libtool/libltdl/slist.h
    - path: /usr/share/libtool/loaders/dld_link.c
    - path: /usr/share/libtool/loaders/dlopen.c
    - path: /usr/share/libtool/loaders/dyld.c
    - path: /usr/share/libtool/loaders/load_add_on.c
    - path: /usr/share/libtool/loaders/loadlibrary.c
    - path: /usr/share/libtool/loaders/preopen.c
    - path: /usr/share/libtool/loaders/shl_load.c
    - path: /usr/share/libtool/lt__alloc.c
    - path: /usr/share/libtool/lt__argz.c
    - path: /usr/share/libtool/lt__dirent.c
    - path: /usr/share/libtool/lt__strl.c
    - path: /usr/share/libtool/lt_dlloader.c
    - path: /usr/share/libtool/lt_error.c
    - path: /usr/share/libtool/ltdl.c
