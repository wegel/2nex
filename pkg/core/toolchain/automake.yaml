package:
  schema: 1
  name: Automake
  slug: automake
  namespace: core/toolchain
  version: 1.16.5
  description: A tool for automatically generating Makefile.in files compliant with the GNU Coding Standards
  homepage: https://www.gnu.org/software/automake/
  checksum: 8f621f576e6e39c495e400eb02ba0782452c9923232a2acb5f62dcbcb9529a80
  seed: true

sources:
- name: automake
  url: https://ftp.gnu.org/gnu/automake/automake-1.16.5.tar.xz
  sha256: f01d58cd6d9d77fbdca9eb4bbd5ead1988228fdb73d6f7a201f5f8d6b118b469

dependencies:
- name: glibc
  commit: x86_64/pkg/libs/system/glibc/2.39/bundles/dev
- name: perl
  commit: x86_64/pkg/dev/lang/perl/5.38.2/bundles/dev
- name: texinfo
  commit: x86_64/pkg/cli/text/texinfo/7.1/bundles/dev
- name: autoconf
  commit: x86_64/pkg/core/toolchain/autoconf/2.72/bundles/dev
- name: m4
  commit: x86_64/pkg/bootstrap/phase1/m4/1.4.19/bundles/dev
- name: bash
  commit: x86_64/pkg/bootstrap/phase1/bash/5.2.21/bundles/dev
- name: coreutils
  commit: x86_64/pkg/bootstrap/phase1/coreutils/9.5/bundles/dev
- name: findutils
  commit: x86_64/pkg/bootstrap/phase1/findutils/4.9.0/bundles/dev
- name: gawk
  commit: x86_64/pkg/bootstrap/phase1/gawk/5.3.0/bundles/dev
- name: grep
  commit: x86_64/pkg/bootstrap/phase1/grep/3.11/bundles/dev
- name: make
  commit: x86_64/pkg/bootstrap/phase1/make/4.4.1/bundles/dev
- name: sed
  commit: x86_64/pkg/bootstrap/phase1/sed/4.9/bundles/dev
- name: tar
  commit: x86_64/pkg/bootstrap/phase1/tar/1.35/bundles/dev
- name: xz
  commit: x86_64/pkg/bootstrap/phase1/xz/5.4.6/bundles/dev

build:
  environment: 27b6e5dc7ad152c9a17c2cabfcc5ee93daa9bbf0
  profile: [4099:1136, 8280:1390, 9406:1459]

  script: |
    tar --no-same-owner -xf ${SOURCE_automake} -C "${WORK_DIR}" --strip-components=1
    cd ${WORK_DIR}

    ./configure --prefix=/usr --docdir=/usr/share/doc/automake-1.16.5
    make
    make DESTDIR=$OUT_DIR install

    find "${OUT_DIR}" -exec touch -d "2024-01-01T00:00:00+00:00" {} \;

bundles:
  dev:
  - bin
  - dev

  full:
  - bin
  - dev
  - doc
  - info
  - man

outputs:
  bin:
    files:
    - path: /usr/bin/aclocal
    - path: /usr/bin/aclocal-1.16
    - path: /usr/bin/automake
    - path: /usr/bin/automake-1.16

