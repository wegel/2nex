package:
  schema: 1
  name: Ninja
  slug: ninja
  namespace: core/toolchain
  version: 1.12.1
  description: A small build system with a focus on speed.
  homepage: https://ninja-build.org/
  checksum: e9e38fda60ace274d8a9db8a33805cc68fa863d6a76ca29266b1908bde0a1bb9

sources:
- name: ninja
  url: https://github.com/ninja-build/ninja/archive/v1.12.1/ninja-1.12.1.tar.gz
  sha256: 821bdff48a3f683bc4bb3b6f0b5fe7b2d647cf65d52aeb63328c91a6c6df285a

dependencies:
- name: findutils
  commit: x86_64/pkg/bootstrap/phase1/findutils/4.9.0/bundles/dev
- name: bash
  commit: x86_64/pkg/bootstrap/phase1/bash/5.2.21/bundles/dev
- name: 2nex-utilities-bootstrap
  commit: x86_64/pkg/bootstrap/phase3/2nex-utilities-bootstrap/0.0.1/bundles/dev
- name: gzip
  commit: x86_64/pkg/bootstrap/phase1/gzip/1.13/bundles/dev
- name: tar
  commit: x86_64/pkg/bootstrap/phase1/tar/1.35/bundles/dev
- name: file
  commit: x86_64/pkg/bootstrap/phase3/file/5.45/bundles/dev
- name: binutils
  commit: x86_64/pkg/bootstrap/phase3/binutils/2.42/bundles/dev
- name: glibc
  commit: x86_64/pkg/libs/system/glibc/2.39/bundles/dev
- name: zlib
  commit: x86_64/pkg/libs/system/zlib/1.3.1/outputs/lib
- name: gcc
  commit: x86_64/pkg/core/toolchain/gcc/13.2.0/bundles/dev
- name: linux-headers
  commit: x86_64/pkg/bootstrap/phase3/linux-headers/6.4.1/bundles/dev
- name: sed
  commit: x86_64/pkg/bootstrap/phase1/sed/4.9/bundles/dev
- name: grep
  commit: x86_64/pkg/bootstrap/phase1/grep/3.11/bundles/dev
- name: bzip2
  commit: x86_64/pkg/bootstrap/phase1/bzip2/1.0.8/outputs/lib
- name: coreutils
  commit: x86_64/pkg/bootstrap/phase1/coreutils/9.5/outputs/bin
- name: xz
  commit: x86_64/pkg/bootstrap/phase1/xz/5.4.6/outputs/lib
- name: python3
  commit: x86_64/pkg/bootstrap/phase2/python3/3.12.2/bundles/dev
- name: mpc
  commit: x86_64/pkg/bootstrap/phase3/mpc/1.2.1/outputs/lib
- name: mpfr
  commit: x86_64/pkg/bootstrap/phase3/mpfr/4.2.1/bundles/dev
- name: gmp-bootstrap
  commit: x86_64/pkg/bootstrap/phase3/gmp-bootstrap/6.3.0/bundles/dev

build:
  profile: [3493:24271]

  script: |
    tar --no-same-owner -xf ${SOURCE0} -C "${WORK_DIR}" --strip-components=1
    cd ${WORK_DIR}

    python3 configure.py --bootstrap
    mkdir -p ${OUT_DIR}/usr/{bin,share/bash-completion/completions,share/zsh/site-functions}
    install -vm755 ninja ${OUT_DIR}/usr/bin/
    install -vDm644 misc/bash-completion ${OUT_DIR}/usr/share/bash-completion/completions/ninja
    install -vDm644 misc/zsh-completion  ${OUT_DIR}/usr/share/zsh/site-functions/_ninja

    find "${OUT_DIR}" -exec touch -d "2024-01-01T00:00:00+00:00" {} \;
    2nex_strip_binaries ${OUT_DIR}

bundles:
  dev:
  - bin

  full:
  - bin
  - misc

outputs:
  bin:
    files:
    - path: /usr/bin/ninja
      needs:
      - /usr/lib/ld-linux-x86-64.so.2
      - /usr/lib/libc.so.6
      - /usr/lib/libgcc_s.so.1
      - /usr/lib/libstdc++.so.6

  misc:
    files:
    - path: /usr/share/bash-completion/completions/ninja
    - path: /usr/share/zsh/site-functions/_ninja

resolution:
  /usr/lib/libgcc_s.so.1: gcc
  /usr/lib/libstdc++.so.6: gcc
  /usr/lib/ld-linux-x86-64.so.2: glibc
  /usr/lib/libc.so.6: glibc
