package:
  schema: 1
  name: Flex
  slug: flex
  namespace: core/toolchain
  version: 2.6.4
  description: A utility for generating programs that recognize patterns in text
  homepage: https://github.com/westes/flex
  checksum: 773351e9c03f816e157906b134a435880f033d17db923060b7e4ac41ece51685

sources:
- name: flex
  url: https://github.com/westes/flex/releases/download/v2.6.4/flex-2.6.4.tar.gz
  sha256: e87aae032bf07c26f85ac0ed3250998c37621d95f8bd748b31f15b33c45ee995

dependencies:
- name: bootstrap_tools
  commit: x86_64/pkg/bootstrap/phase1/bootstrap_tools/0.0.1/bundles/dev
- name: gmp-bootstrap
  commit: x86_64/pkg/bootstrap/phase3/gmp-bootstrap/6.3.0/bundles/dev
- name: mpfr
  commit: x86_64/pkg/bootstrap/phase3/mpfr/4.2.1/bundles/dev
- name: bash
  commit: x86_64/pkg/bootstrap/phase1/bash/5.2.21/bundles/dev
- name: findutils
  commit: x86_64/pkg/bootstrap/phase1/findutils/4.9.0/bundles/dev
- name: gawk
  commit: x86_64/pkg/bootstrap/phase1/gawk/5.3.0/bundles/dev
- name: grep
  commit: x86_64/pkg/bootstrap/phase1/grep/3.11/bundles/dev
- name: gzip
  commit: x86_64/pkg/bootstrap/phase1/gzip/1.13/bundles/dev
- name: make
  commit: x86_64/pkg/bootstrap/phase1/make/4.4.1/bundles/dev
- name: sed
  commit: x86_64/pkg/bootstrap/phase1/sed/4.9/bundles/dev
- name: tar
  commit: x86_64/pkg/bootstrap/phase1/tar/1.35/bundles/dev
- name: binutils
  commit: x86_64/pkg/bootstrap/phase3/binutils/2.42/bundles/dev
- name: mpc
  commit: x86_64/pkg/bootstrap/phase3/mpc/1.2.1/bundles/dev
- name: gcc
  commit: x86_64/pkg/bootstrap/phase3/gcc/13.2.0/bundles/dev
- name: coreutils
  commit: x86_64/pkg/bootstrap/phase1/coreutils/9.5/bundles/dev
- name: texinfo
  commit: x86_64/pkg/bootstrap/phase2/texinfo/7.1/bundles/dev
- name: glibc
  commit: x86_64/pkg/libs/system/glibc/2.39/bundles/dev
- name: zlib
  commit: x86_64/pkg/bootstrap/phase3/zlib/1.3.1/bundles/dev
- name: phase3
  commit: x86_64/pkg/bootstrap/phase3/2nex-utilities-bootstrap/0.0.1/bundles/dev
- name: bzip2
  commit: x86_64/pkg/bootstrap/phase3/bzip2/1.0.8/bundles/dev
- name: xz
  commit: x86_64/pkg/bootstrap/phase3/xz/5.4.6/bundles/dev
- name: file
  commit: x86_64/pkg/bootstrap/phase3/file/5.45/bundles/dev
- name: m4
  commit: x86_64/pkg/bootstrap/phase3/m4/1.4.19/bundles/dev

build:
  profile: [8252:1680, 16879:2582, 37817:2804, 63654:3990, 85054:4268, 106830:4860, 128496:5099, 158479:5230, 188911:5342, 208211:5958]

  script: |
    tar --no-same-owner -xf ${SOURCE_flex} -C "${WORK_DIR}" --strip-components=1
    cd ${WORK_DIR}

    ./configure --prefix=/usr --docdir=/usr/share/doc/flex-2.6.4

    make
    make check
    make DESTDIR="${OUT_DIR}" install
    ln -sfv flex   "${OUT_DIR}/usr/bin/lex"
    ln -sfv flex.1 "${OUT_DIR}/usr/share/man/man1/lex.1"

    find "${OUT_DIR}" -exec touch -d '2024-01-01T00:00:00+00:00' {} \;
    2nex_strip_binaries "${OUT_DIR}"

bundles:
  dev:
  - bin
  - dev
  - lib
  - static

  full:
  - bin
  - dev
  - doc
  - info
  - lib
  - locale
  - man
  - static

outputs:
  bin:
    files:
    - path: /usr/bin/flex
      needs:
      - /usr/lib/ld-linux-x86-64.so.2
      - /usr/lib/libc.so.6
      - /usr/lib/libm.so.6
    - path: /usr/bin/flex++
      needs:
      - /usr/lib/ld-linux-x86-64.so.2
      - /usr/lib/libc.so.6
      - /usr/lib/libm.so.6
    - path: /usr/bin/lex
      needs:
      - /usr/lib/ld-linux-x86-64.so.2
      - /usr/lib/libc.so.6
      - /usr/lib/libm.so.6

  dev:
    files:
    - path: /usr/include/FlexLexer.h
    - path: /usr/lib/libfl.la

  doc:
    files:
    - path: /usr/share/doc/flex-2.6.4/AUTHORS
    - path: /usr/share/doc/flex-2.6.4/COPYING
    - path: /usr/share/doc/flex-2.6.4/NEWS
    - path: /usr/share/doc/flex-2.6.4/ONEWS
    - path: /usr/share/doc/flex-2.6.4/README.md

  info:
    files:
    - path: /usr/share/info/dir
    - path: /usr/share/info/flex.info
    - path: /usr/share/info/flex.info-1
    - path: /usr/share/info/flex.info-2

  lib:
    files:
    - path: /usr/lib/libfl.so
      needs:
      - /usr/lib/libc.so.6
      - /usr/lib/libm.so.6
    - path: /usr/lib/libfl.so.2
      needs:
      - /usr/lib/libc.so.6
      - /usr/lib/libm.so.6
    - path: /usr/lib/libfl.so.2.0.0
      needs:
      - /usr/lib/libc.so.6
      - /usr/lib/libm.so.6

  locale:
    files:
    - path: /usr/share/locale/ca/LC_MESSAGES/flex.mo
    - path: /usr/share/locale/da/LC_MESSAGES/flex.mo
    - path: /usr/share/locale/de/LC_MESSAGES/flex.mo
    - path: /usr/share/locale/en@boldquot/LC_MESSAGES/flex.mo
    - path: /usr/share/locale/en@quot/LC_MESSAGES/flex.mo
    - path: /usr/share/locale/eo/LC_MESSAGES/flex.mo
    - path: /usr/share/locale/es/LC_MESSAGES/flex.mo
    - path: /usr/share/locale/fi/LC_MESSAGES/flex.mo
    - path: /usr/share/locale/fr/LC_MESSAGES/flex.mo
    - path: /usr/share/locale/ga/LC_MESSAGES/flex.mo
    - path: /usr/share/locale/hr/LC_MESSAGES/flex.mo
    - path: /usr/share/locale/ko/LC_MESSAGES/flex.mo
    - path: /usr/share/locale/nl/LC_MESSAGES/flex.mo
    - path: /usr/share/locale/pl/LC_MESSAGES/flex.mo
    - path: /usr/share/locale/pt_BR/LC_MESSAGES/flex.mo
    - path: /usr/share/locale/ro/LC_MESSAGES/flex.mo
    - path: /usr/share/locale/ru/LC_MESSAGES/flex.mo
    - path: /usr/share/locale/sr/LC_MESSAGES/flex.mo
    - path: /usr/share/locale/sv/LC_MESSAGES/flex.mo
    - path: /usr/share/locale/tr/LC_MESSAGES/flex.mo
    - path: /usr/share/locale/vi/LC_MESSAGES/flex.mo
    - path: /usr/share/locale/zh_CN/LC_MESSAGES/flex.mo
    - path: /usr/share/locale/zh_TW/LC_MESSAGES/flex.mo

  man:
    files:
    - path: /usr/share/man/man1/flex.1
    - path: /usr/share/man/man1/lex.1

  static:
    files:
    - path: /usr/lib/libfl.a

resolution:
  /usr/lib/ld-linux-x86-64.so.2: glibc
  /usr/lib/libc.so.6: glibc
  /usr/lib/libm.so.6: glibc
