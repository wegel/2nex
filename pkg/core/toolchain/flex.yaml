package:
  schema: 1
  name: Flex
  slug: flex
  namespace: core/toolchain
  version: 2.6.4
  description: A utility for generating programs that recognize patterns in text
  homepage: https://github.com/westes/flex
  checksum: 48ed406ffcc2e7d3034c50d0a0962a75591021ab321151545299573e42882683

sources:
- name: flex
  url: https://github.com/westes/flex/releases/download/v2.6.4/flex-2.6.4.tar.gz
  sha256: e87aae032bf07c26f85ac0ed3250998c37621d95f8bd748b31f15b33c45ee995

dependencies:
- name: linux-headers
  commit: x86_64/pkg/libs/system/linux-headers/6.4.1/bundles/dev
- name: glibc
  commit: x86_64/pkg/libs/system/glibc/2.39/bundles/dev
- name: zlib
  commit: x86_64/pkg/libs/system/zlib/1.3.1/bundles/dev
- name: ncurses
  commit: x86_64/pkg/libs/system/ncurses/6.4-20230520/bundles/dev
- name: attr
  commit: x86_64/pkg/libs/system/attr/2.5.2/bundles/dev
- name: acl
  commit: x86_64/pkg/libs/system/acl/2.3.2/bundles/dev
- name: libcap
  commit: x86_64/pkg/libs/security/libcap/2.69/bundles/dev
- name: gmp
  commit: x86_64/pkg/libs/system/gmp/6.3.0/bundles/dev
- name: binutils
  commit: x86_64/pkg/core/toolchain/binutils/2.42/bundles/dev
- name: gcc
  commit: x86_64/pkg/core/toolchain/gcc/13.2.0/bundles/dev
- name: make
  commit: x86_64/pkg/core/toolchain/make/4.4.1/bundles/dev
- name: bash
  commit: x86_64/pkg/cli/shells/bash/5.2.21/bundles/dev
- name: coreutils
  commit: x86_64/pkg/core/userland/coreutils/9.5/bundles/dev
- name: findutils
  commit: x86_64/pkg/core/userland/findutils/4.9.0/bundles/dev
- name: grep
  commit: x86_64/pkg/cli/text/grep/3.11/bundles/dev
- name: gawk
  commit: x86_64/pkg/cli/text/gawk/5.3.0/bundles/dev
- name: sed
  commit: x86_64/pkg/cli/text/sed/4.9/bundles/dev
- name: tar
  commit: x86_64/pkg/cli/archive/tar/1.35/bundles/dev
- name: gzip
  commit: x86_64/pkg/cli/archive/gzip/1.13/bundles/dev
- name: m4
  commit: x86_64/pkg/dev/lang/m4/1.4.19/bundles/dev
- name: texinfo
  commit: x86_64/pkg/cli/text/texinfo/7.1/bundles/dev

build:
  environment: 13ce31fd97c19f5756e4413babf279d543b5a71c
  profile: [8232:2164, 16784:3171, 37783:5231, 63116:5287, 84272:5488, 105593:5701, 127092:5882, 156765:6238, 190172:6651, 208029:7400]

  script: |
    tar --no-same-owner -xf ${SOURCE_flex} -C "${WORK_DIR}" --strip-components=1
    cd ${WORK_DIR}

    ./configure --prefix=/usr --docdir=/usr/share/doc/flex-2.6.4

    make
    make check
    make DESTDIR="${OUT_DIR}" install
    ln -sfv flex   "${OUT_DIR}/usr/bin/lex"
    ln -sfv flex.1 "${OUT_DIR}/usr/share/man/man1/lex.1"

    find ${OUT_DIR} -type f -executable -exec strip --strip-unneeded {} \; 2>/dev/null || true
    find ${OUT_DIR} -name '*.a' -exec objcopy --enable-deterministic-archives {} \; 2>/dev/null || true
    find "${OUT_DIR}" -exec touch -d "2024-01-01T00:00:00+00:00" {} \;

bundles:
  dev:
  - bin
  - dev
  - lib
  - static

  full:
  - bin
  - dev
  - doc
  - info
  - lib
  - locale
  - man
  - static

outputs:
  bin:
    files:
    - path: /usr/bin/flex
      needs:
      - /usr/lib/ld-linux-x86-64.so.2
      - /usr/lib/libc.so.6
      - /usr/lib/libm.so.6
    - path: /usr/bin/flex++
      needs:
      - /usr/lib/ld-linux-x86-64.so.2
      - /usr/lib/libc.so.6
      - /usr/lib/libm.so.6
    - path: /usr/bin/lex
      needs:
      - /usr/lib/ld-linux-x86-64.so.2
      - /usr/lib/libc.so.6
      - /usr/lib/libm.so.6

  dev:
    files:
    - path: /usr/include/FlexLexer.h
    - path: /usr/lib/libfl.la

  doc:
    files:
    - path: /usr/share/doc/flex-2.6.4/AUTHORS
    - path: /usr/share/doc/flex-2.6.4/COPYING
    - path: /usr/share/doc/flex-2.6.4/NEWS
    - path: /usr/share/doc/flex-2.6.4/ONEWS
    - path: /usr/share/doc/flex-2.6.4/README.md

  info:
    files:
    - path: /usr/share/info/dir
    - path: /usr/share/info/flex.info
    - path: /usr/share/info/flex.info-1
    - path: /usr/share/info/flex.info-2

  lib:
    files:
    - path: /usr/lib/libfl.so
      needs:
      - /usr/lib/libc.so.6
      - /usr/lib/libm.so.6
    - path: /usr/lib/libfl.so.2
      needs:
      - /usr/lib/libc.so.6
      - /usr/lib/libm.so.6
    - path: /usr/lib/libfl.so.2.0.0
      needs:
      - /usr/lib/libc.so.6
      - /usr/lib/libm.so.6

  locale:
    files:
    - path: /usr/share/locale/ca/LC_MESSAGES/flex.mo
    - path: /usr/share/locale/da/LC_MESSAGES/flex.mo
    - path: /usr/share/locale/de/LC_MESSAGES/flex.mo
    - path: /usr/share/locale/en@boldquot/LC_MESSAGES/flex.mo
    - path: /usr/share/locale/en@quot/LC_MESSAGES/flex.mo
    - path: /usr/share/locale/eo/LC_MESSAGES/flex.mo
    - path: /usr/share/locale/es/LC_MESSAGES/flex.mo
    - path: /usr/share/locale/fi/LC_MESSAGES/flex.mo
    - path: /usr/share/locale/fr/LC_MESSAGES/flex.mo
    - path: /usr/share/locale/ga/LC_MESSAGES/flex.mo
    - path: /usr/share/locale/hr/LC_MESSAGES/flex.mo
    - path: /usr/share/locale/ko/LC_MESSAGES/flex.mo
    - path: /usr/share/locale/nl/LC_MESSAGES/flex.mo
    - path: /usr/share/locale/pl/LC_MESSAGES/flex.mo
    - path: /usr/share/locale/pt_BR/LC_MESSAGES/flex.mo
    - path: /usr/share/locale/ro/LC_MESSAGES/flex.mo
    - path: /usr/share/locale/ru/LC_MESSAGES/flex.mo
    - path: /usr/share/locale/sr/LC_MESSAGES/flex.mo
    - path: /usr/share/locale/sv/LC_MESSAGES/flex.mo
    - path: /usr/share/locale/tr/LC_MESSAGES/flex.mo
    - path: /usr/share/locale/vi/LC_MESSAGES/flex.mo
    - path: /usr/share/locale/zh_CN/LC_MESSAGES/flex.mo
    - path: /usr/share/locale/zh_TW/LC_MESSAGES/flex.mo

  man:
    files:
    - path: /usr/share/man/man1/flex.1
    - path: /usr/share/man/man1/lex.1

  static:
    files:
    - path: /usr/lib/libfl.a

resolution:
  /usr/lib/ld-linux-x86-64.so.2: glibc
  /usr/lib/libc.so.6: glibc
  /usr/lib/libm.so.6: glibc
