package:
  schema: 1
  name: Patch
  slug: patch
  namespace: core/toolchain
  version: 2.7.6
  description: A utility to apply patch files to original sources
  homepage: https://savannah.gnu.org/projects/patch/
  checksum: 126a97bdecec641b7dc3f39038ae3596997a295f2a026e1b08c39422515aa316
  seed: true

sources:
- name: patch
  url: https://ftp.gnu.org/gnu/patch/patch-2.7.6.tar.xz
  sha256: ac610bda97abe0d9f6b7c963255a11dcb196c25e337c61f94e4778d632f1d8fd

dependencies:
- name: linux-headers
  commit: x86_64/pkg/bootstrap/phase1/linux-headers/6.4.1/bundles/dev
- name: glibc
  commit: x86_64/pkg/libs/system/glibc/2.39/bundles/dev
- name: binutils
  commit: x86_64/pkg/bootstrap/phase1/binutils/2.42/bundles/dev
- name: gcc
  commit: x86_64/pkg/bootstrap/phase1/gcc/13.2.0/bundles/dev
- name: zlib
  commit: x86_64/pkg/bootstrap/phase1/zlib/1.3.1/bundles/dev
- name: attr
  commit: x86_64/pkg/libs/system/attr/2.5.2/bundles/dev
- name: bash
  commit: x86_64/pkg/bootstrap/phase1/bash/5.2.21/bundles/dev
- name: coreutils
  commit: x86_64/pkg/bootstrap/phase1/coreutils/9.5/bundles/dev
- name: findutils
  commit: x86_64/pkg/bootstrap/phase1/findutils/4.9.0/bundles/dev
- name: gawk
  commit: x86_64/pkg/bootstrap/phase1/gawk/5.3.0/bundles/dev
- name: grep
  commit: x86_64/pkg/bootstrap/phase1/grep/3.11/bundles/dev
- name: make
  commit: x86_64/pkg/bootstrap/phase1/make/4.4.1/bundles/dev
- name: sed
  commit: x86_64/pkg/bootstrap/phase1/sed/4.9/bundles/dev
- name: tar
  commit: x86_64/pkg/bootstrap/phase1/tar/1.35/bundles/dev
- name: xz
  commit: x86_64/pkg/bootstrap/phase1/xz/5.4.6/bundles/dev

build:
  environment: 13ce31fd97c19f5756e4413babf279d543b5a71c
  profile: [4126:3023, 8245:6870, 12391:8487, 16487:10075, 20648:11033, 24799:13195, 28897:14667, 33019:15848, 34462:15896]

  script: |
    tar --no-same-owner -xf ${SOURCE_patch} -C "${WORK_DIR}" --strip-components=1
    cd ${WORK_DIR}

    ./configure --prefix=/usr

    make
    make DESTDIR=${OUT_DIR} install

    find ${OUT_DIR} -type f -executable -exec strip --strip-unneeded {} \; 2>/dev/null || true
    find ${OUT_DIR} -name '*.a' -exec objcopy --enable-deterministic-archives {} \; 2>/dev/null || true
    find "${OUT_DIR}" -exec touch -d '2024-01-01T00:00:00+00:00' {} \;

bundles:
  dev:
  - bin

  full:
  - bin
  - man

outputs:
  bin:
    files:
    - path: /usr/bin/patch
      needs:
      - /usr/lib/ld-linux-x86-64.so.2
      - /usr/lib/libattr.so.1
      - /usr/lib/libc.so.6

  man:
    files:
    - path: /usr/share/man/man1/patch.1

resolution:
  /usr/lib/libattr.so.1: attr
  /usr/lib/ld-linux-x86-64.so.2: glibc
  /usr/lib/libc.so.6: glibc
