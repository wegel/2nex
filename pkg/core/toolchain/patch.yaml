package:
  schema: 1
  name: Patch
  slug: patch
  namespace: core/toolchain
  version: 2.7.6
  description: A utility to apply patch files to original sources
  homepage: https://savannah.gnu.org/projects/patch/
  checksum: 4773062ed18080f595ec1730ffa90521c97bcda03e76c55bda8cc4f5f3bc9c17

sources:
- name: patch
  url: https://ftp.gnu.org/gnu/patch/patch-2.7.6.tar.xz
  sha256: ac610bda97abe0d9f6b7c963255a11dcb196c25e337c61f94e4778d632f1d8fd

dependencies:
- name: bash
  commit: x86_64/pkg/bootstrap/phase1/bash/5.2.21/bundles/dev
- name: phase3
  commit: x86_64/pkg/bootstrap/phase3/2nex-utilities-bootstrap/0.0.1/bundles/dev
- name: tar
  commit: x86_64/pkg/bootstrap/phase1/tar/1.35/bundles/dev
- name: bootstrap_tools
  commit: x86_64/pkg/bootstrap/phase1/bootstrap_tools/0.0.1/bundles/dev
- name: xz
  commit: x86_64/pkg/bootstrap/phase3/xz/5.4.6/bundles/dev
- name: bzip2
  commit: x86_64/pkg/bootstrap/phase3/bzip2/1.0.8/bundles/dev
- name: zlib
  commit: x86_64/pkg/bootstrap/phase3/zlib/1.3.1/bundles/dev
- name: file
  commit: x86_64/pkg/bootstrap/phase3/file/5.45/bundles/dev
- name: binutils
  commit: x86_64/pkg/bootstrap/phase3/binutils/2.42/bundles/dev
- name: gmp-bootstrap
  commit: x86_64/pkg/bootstrap/phase3/gmp-bootstrap/6.3.0/bundles/dev
- name: mpfr
  commit: x86_64/pkg/bootstrap/phase3/mpfr/4.2.1/bundles/dev
- name: mpc
  commit: x86_64/pkg/bootstrap/phase3/mpc/1.2.1/bundles/dev
- name: gcc
  commit: x86_64/pkg/bootstrap/phase3/gcc/13.2.0/bundles/dev
- name: sed
  commit: x86_64/pkg/bootstrap/phase1/sed/4.9/bundles/dev
- name: grep
  commit: x86_64/pkg/bootstrap/phase1/grep/3.11/bundles/dev
- name: coreutils
  commit: x86_64/pkg/bootstrap/phase1/coreutils/9.5/bundles/dev
- name: gawk
  commit: x86_64/pkg/bootstrap/phase1/gawk/5.3.0/bundles/dev
- name: findutils
  commit: x86_64/pkg/bootstrap/phase1/findutils/4.9.0/bundles/dev
- name: make
  commit: x86_64/pkg/bootstrap/phase1/make/4.4.1/bundles/dev
- name: glibc
  commit: x86_64/pkg/libs/system/glibc/2.39/bundles/dev
- name: attr
  commit: x86_64/pkg/libs/system/attr/2.5.2/bundles/dev

build:
  profile: [4116:4286, 8240:8281, 12370:9684, 16492:10907, 20632:11899, 24789:14060, 28900:15451, 33028:16331, 34568:16386]

  script: |
    tar --no-same-owner -xf ${SOURCE0} -C "${WORK_DIR}" --strip-components=1
    cd ${WORK_DIR}

    ./configure --prefix=/usr

    make
    make DESTDIR=${OUT_DIR} install

    find "${OUT_DIR}" -exec touch -d "2024-01-01T00:00:00+00:00" {} \;
    2nex_strip_binaries ${OUT_DIR}

bundles:
  dev:
  - bin

  full:
  - bin
  - man

outputs:
  bin:
    files:
    - path: /usr/bin/patch
      needs:
      - /usr/lib/ld-linux-x86-64.so.2
      - /usr/lib/libattr.so.1
      - /usr/lib/libc.so.6

  man:
    files:
    - path: /usr/share/man/man1/patch.1

resolution:
  /usr/lib/libattr.so.1: attr
  /usr/lib/ld-linux-x86-64.so.2: glibc
  /usr/lib/libc.so.6: glibc
