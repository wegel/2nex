package:
  schema: 1
  name: Pkgconf
  slug: pkgconf
  namespace: core/toolchain
  version: 2.2.0
  description: A program which helps to configure compiler and linker flags for development frameworks
  homepage: https://github.com/pkgconf/pkgconf
  checksum: 829b5ffee9339295960f226c8b166129712f9dcff6d43e1f5a83e2d90fe543b1

sources:
- name: pkgconf
  url: https://distfiles.dereferenced.org/pkgconf/pkgconf-2.2.0.tar.xz
  sha256: b06ff63a83536aa8c2f6422fa80ad45e4833f590266feb14eaddfe1d4c853c69

dependencies:
- name: linux-headers
  commit: x86_64/pkg/libs/system/linux-headers/6.4.1/bundles/dev
- name: glibc
  commit: x86_64/pkg/libs/system/glibc/2.39/bundles/dev
- name: zlib
  commit: x86_64/pkg/libs/system/zlib/1.3.1/bundles/dev
- name: ncurses
  commit: x86_64/pkg/libs/system/ncurses/6.4-20230520/bundles/dev
- name: attr
  commit: x86_64/pkg/libs/system/attr/2.5.2/bundles/dev
- name: acl
  commit: x86_64/pkg/libs/system/acl/2.3.2/bundles/dev
- name: libcap
  commit: x86_64/pkg/libs/security/libcap/2.69/bundles/dev
- name: gmp
  commit: x86_64/pkg/libs/system/gmp/6.3.0/bundles/dev
- name: binutils
  commit: x86_64/pkg/core/toolchain/binutils/2.42/bundles/dev
- name: gcc
  commit: x86_64/pkg/core/toolchain/gcc/13.2.0/bundles/dev
- name: make
  commit: x86_64/pkg/core/toolchain/make/4.4.1/bundles/dev
- name: bash
  commit: x86_64/pkg/cli/shells/bash/5.2.21/bundles/dev
- name: coreutils
  commit: x86_64/pkg/core/userland/coreutils/9.5/bundles/dev
- name: findutils
  commit: x86_64/pkg/core/userland/findutils/4.9.0/bundles/dev
- name: grep
  commit: x86_64/pkg/cli/text/grep/3.11/bundles/dev
- name: gawk
  commit: x86_64/pkg/cli/text/gawk/5.3.0/bundles/dev
- name: sed
  commit: x86_64/pkg/cli/text/sed/4.9/bundles/dev
- name: tar
  commit: x86_64/pkg/cli/archive/tar/1.35/bundles/dev
- name: xz
  commit: x86_64/pkg/libs/compression/xz/5.4.6/bundles/dev

build:
  environment: 27b6e5dc7ad152c9a17c2cabfcc5ee93daa9bbf0
  profile: [4114:1126, 8247:3034, 8617:3073]

  script: |
    tar --no-same-owner -xf /${SOURCE0} -C "${WORK_DIR}" --strip-components=1
    cd ${WORK_DIR}

    ./configure --prefix=/usr              \
              --docdir=/usr/share/doc/pkgconf-2.2.0

    make
    make DESTDIR="${OUT_DIR}" install
    ln -sv pkgconf   "${OUT_DIR}"/usr/bin/pkg-config
    ln -sv pkgconf.1 "${OUT_DIR}"/usr/share/man/man1/pkg-config.1

    find ${OUT_DIR} -type f -executable -exec strip --strip-unneeded {} \; 2>/dev/null || true
    find ${OUT_DIR} -name '*.a' -exec objcopy --enable-deterministic-archives {} \; 2>/dev/null || true
    find "${OUT_DIR}" -exec touch -d "2024-01-01T00:00:00+00:00" {} \;

bundles:
  dev:
  - bin
  - dev
  - lib
  - misc
  - static

  full:
  - bin
  - dev
  - doc
  - lib
  - man
  - misc
  - static

outputs:
  bin:
    files:
    - path: /usr/bin/bomtool
      needs:
      - /usr/lib/ld-linux-x86-64.so.2
      - /usr/lib/libc.so.6
      - /usr/lib/libpkgconf.so.5
    - path: /usr/bin/pkg-config
      needs:
      - /usr/lib/ld-linux-x86-64.so.2
      - /usr/lib/libc.so.6
      - /usr/lib/libpkgconf.so.5
    - path: /usr/bin/pkgconf
      needs:
      - /usr/lib/ld-linux-x86-64.so.2
      - /usr/lib/libc.so.6
      - /usr/lib/libpkgconf.so.5

  dev:
    files:
    - path: /usr/include/pkgconf/libpkgconf/bsdstubs.h
    - path: /usr/include/pkgconf/libpkgconf/iter.h
    - path: /usr/include/pkgconf/libpkgconf/libpkgconf-api.h
    - path: /usr/include/pkgconf/libpkgconf/libpkgconf.h
    - path: /usr/include/pkgconf/libpkgconf/stdinc.h
    - path: /usr/lib/libpkgconf.la
    - path: /usr/lib/pkgconfig/libpkgconf.pc

  doc:
    files:
    - path: /usr/share/doc/pkgconf-2.2.0/AUTHORS
    - path: /usr/share/doc/pkgconf-2.2.0/README.md

  lib:
    files:
    - path: /usr/lib/libpkgconf.so
      needs:
      - /usr/lib/libc.so.6
    - path: /usr/lib/libpkgconf.so.5
      needs:
      - /usr/lib/libc.so.6
    - path: /usr/lib/libpkgconf.so.5.0.0
      needs:
      - /usr/lib/libc.so.6

  man:
    files:
    - path: /usr/share/man/man1/pkg-config.1
    - path: /usr/share/man/man1/pkgconf.1
    - path: /usr/share/man/man5/pc.5
    - path: /usr/share/man/man5/pkgconf-personality.5
    - path: /usr/share/man/man7/pkg.m4.7

  misc:
    files:
    - path: /usr/share/aclocal/pkg.m4

  static:
    files:
    - path: /usr/lib/libpkgconf.a

resolution:
  /usr/lib/ld-linux-x86-64.so.2: glibc
  /usr/lib/libc.so.6: glibc
  /usr/lib/libpkgconf.so.5: self
