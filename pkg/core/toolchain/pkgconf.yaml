package:
  schema: 1
  name: Pkgconf
  slug: pkgconf
  namespace: core/toolchain
  version: 2.2.0
  description: A program which helps to configure compiler and linker flags for development frameworks
  homepage: https://github.com/pkgconf/pkgconf
  checksum: 0599627af0b90696055eae245762aaf4e6ea6cdd0167b08593fadf2b157e022f
sources:
- name: pkgconf
  url: https://distfiles.dereferenced.org/pkgconf/pkgconf-2.2.0.tar.xz
  sha256: b06ff63a83536aa8c2f6422fa80ad45e4833f590266feb14eaddfe1d4c853c69
dependencies:
- name: bootstrap_tools
  commit: x86_64/pkg/bootstrap/phase1/bootstrap_tools/0.0.1/bundles/dev
- name: gmp-bootstrap
  commit: x86_64/pkg/bootstrap/phase3/gmp-bootstrap/6.3.0/outputs/lib
- name: mpfr
  commit: x86_64/pkg/bootstrap/phase3/mpfr/4.2.1/outputs/lib
- name: bash
  commit: x86_64/pkg/bootstrap/phase1/bash/5.2.21/bundles/dev
- name: coreutils
  commit: x86_64/pkg/bootstrap/phase1/coreutils/9.5/bundles/dev
- name: findutils
  commit: x86_64/pkg/bootstrap/phase1/findutils/4.9.0/bundles/dev
- name: 2nex-utilities-bootstrap
  commit: x86_64/pkg/bootstrap/phase3/2nex-utilities-bootstrap/0.0.1/bundles/dev
- name: gawk
  commit: x86_64/pkg/bootstrap/phase1/gawk/5.3.0/bundles/dev
- name: grep
  commit: x86_64/pkg/bootstrap/phase1/grep/3.11/bundles/dev
- name: make
  commit: x86_64/pkg/bootstrap/phase1/make/4.4.1/bundles/dev
- name: sed
  commit: x86_64/pkg/bootstrap/phase1/sed/4.9/bundles/dev
- name: tar
  commit: x86_64/pkg/bootstrap/phase1/tar/1.35/bundles/dev
- name: binutils
  commit: x86_64/pkg/bootstrap/phase3/binutils/2.42/bundles/dev
- name: mpc
  commit: x86_64/pkg/bootstrap/phase3/mpc/1.2.1/outputs/lib
- name: gcc
  commit: x86_64/pkg/bootstrap/phase3/gcc/13.2.0/bundles/dev
- name: zlib
  commit: x86_64/pkg/bootstrap/phase3/zlib/1.3.1/bundles/dev
- name: xz
  commit: x86_64/pkg/bootstrap/phase3/xz/5.4.6/bundles/dev
- name: bzip2
  commit: x86_64/pkg/bootstrap/phase3/bzip2/1.0.8/outputs/lib
- name: file
  commit: x86_64/pkg/bootstrap/phase3/file/5.45/bundles/dev
- name: glibc
  commit: x86_64/pkg/libs/system/glibc/2.39/bundles/dev
build:
  script: |
    tar --no-same-owner -xf /inputs/pkgconf-*.tar.* -C "${WORK_DIR}" --strip-components=1
    cd ${WORK_DIR}

    ./configure --prefix=/usr              \
              --docdir=/usr/share/doc/pkgconf-2.2.0

    make
    make DESTDIR="${OUT_DIR}" install
    ln -sv pkgconf   "${OUT_DIR}"/usr/bin/pkg-config
    ln -sv pkgconf.1 "${OUT_DIR}"/usr/share/man/man1/pkg-config.1

    find "${OUT_DIR}" -exec touch -d '2024-01-01T00:00:00+00:00' {} \;
    2nex_strip_binaries ${OUT_DIR}
bundles:
  full:
  - doc
  - dev
  - lib
  - static
  - bin
  - man
  dev:
  - dev
  - lib
  - static
  - bin
outputs:
  doc:
    files:
    - path: /usr/share/doc/pkgconf-2.2.0/AUTHORS
    - path: /usr/share/doc/pkgconf-2.2.0/README.md
  dev:
    files:
    - path: /usr/include/pkgconf/libpkgconf/bsdstubs.h
    - path: /usr/include/pkgconf/libpkgconf/iter.h
    - path: /usr/include/pkgconf/libpkgconf/libpkgconf-api.h
    - path: /usr/include/pkgconf/libpkgconf/libpkgconf.h
    - path: /usr/include/pkgconf/libpkgconf/stdinc.h
    - path: /usr/lib/libpkgconf.la
    - path: /usr/lib/pkgconfig/libpkgconf.pc
    - path: /usr/share/aclocal/pkg.m4
  lib:
    files:
    - path: /usr/lib/libpkgconf.so
      needs:
      - /usr/lib/libc.so.6
    - path: /usr/lib/libpkgconf.so.5
      needs:
      - /usr/lib/libc.so.6
    - path: /usr/lib/libpkgconf.so.5.0.0
      needs:
      - /usr/lib/libc.so.6
  static:
    files:
    - path: /usr/lib/libpkgconf.a
  bin:
    files:
    - path: /usr/bin/bomtool
      needs:
      - /usr/lib/libpkgconf.so.5
      - /usr/lib/libc.so.6
      - /usr/lib/ld-linux-x86-64.so.2
    - path: /usr/bin/pkg-config
      needs:
      - /usr/lib/libpkgconf.so.5
      - /usr/lib/libc.so.6
      - /usr/lib/ld-linux-x86-64.so.2
    - path: /usr/bin/pkgconf
      needs:
      - /usr/lib/libpkgconf.so.5
      - /usr/lib/libc.so.6
      - /usr/lib/ld-linux-x86-64.so.2
  man:
    files:
    - path: /usr/share/man/man1/pkg-config.1
    - path: /usr/share/man/man1/pkgconf.1
    - path: /usr/share/man/man5/pc.5
    - path: /usr/share/man/man5/pkgconf-personality.5
    - path: /usr/share/man/man7/pkg.m4.7

resolution:
  /usr/lib/ld-linux-x86-64.so.2: glibc
  /usr/lib/libpkgconf.so.5: '@self'
  /usr/lib/libc.so.6: glibc
