build:
  environment: 13ce31fd97c19f5756e4413babf279d543b5a71c
  profile: [8227:2341, 20567:2896, 45361:3579, 75020:8407, 97010:8452, 123137:8505, 144730:8560, 179513:11905, 216749:24607, 239053:29919]

  script: |
    tar --no-same-owner -xf ${SOURCE_binutils} -C "${WORK_DIR}" --strip-components=1
    cd "${WORK_DIR}" && mkdir -p build && cd build

    ../configure                 \
      --prefix=/usr              \
      --build=$(../config.guess) \
      --host=${TARGET}           \
      --disable-nls              \
      --enable-shared            \
      --enable-gprofng=no        \
      --disable-werror           \
      --enable-64-bit-bfd        \
      --enable-default-hash-style=gnu

    echo "configure done, make"
    make
    make DESTDIR=${OUT_DIR} install

    find "${OUT_DIR}" -exec touch -d "2024-01-01T00:00:00+00:00" {} \;
    find "${OUT_DIR}" ! -type d -exec strip-nondeterminism -T 1704067200 --normalizers +all {} \;
    2nex_strip_binaries ${OUT_DIR}

bundles:
