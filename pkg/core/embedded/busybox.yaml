build:
  script: |
    set -eux

    tar --no-same-owner -xf "${SOURCE_busybox}" -C "${WORK_DIR}" --strip-components=1
    cd "${WORK_DIR}"

    make defconfig

    # put everything in /bin and /sbin (not /usr/*) so we can relocate cleanly
    sed -i 's/# CONFIG_INSTALL_NO_USR is not set/CONFIG_INSTALL_NO_USR=y/' .config

    yes "" | make oldconfig || true

    make -j$(nproc)
    make CONFIG_PREFIX="${OUT_DIR}" install

    # usrmerge: relocate /bin and /sbin to /usr/bin
    mkdir -p "${OUT_DIR}/usr/bin"
    # move /bin contents (symlinks here point to 'busybox', so they stay valid)
    mv "${OUT_DIR}/bin/"* "${OUT_DIR}/usr/bin/"
    rmdir "${OUT_DIR}/bin"
    # move /sbin contents and fix symlinks (they point to ../bin/busybox)
    for f in "${OUT_DIR}/sbin/"*; do
        name=$(basename "$f")
        rm "$f"
        ln -s busybox "${OUT_DIR}/usr/bin/$name"
    done
    rmdir "${OUT_DIR}/sbin"
    # remove linuxrc (points to bin/busybox which no longer exists)
    rm -f "${OUT_DIR}/linuxrc"

    # create essential directories (for initramfs use)
    mkdir -p "${OUT_DIR}"/{etc,proc,sys,dev,tmp,run}
    chmod 1777 "${OUT_DIR}/tmp"

    find "${OUT_DIR}" -exec touch -d "2024-01-01T00:00:00+00:00" {} \;
    2nex_strip_binaries "${OUT_DIR}"
bundles:
  bin:
  - bin
  full:
  - bin
  - symlinks
