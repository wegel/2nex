package:
  schema: 1
  name: ACPI event daemon
  slug: acpid
  namespace: core/power
  version: 2.0.34
  description: Daemon that dispatches hardware ACPI events to configured handlers
  homepage: https://sourceforge.net/projects/acpid2/
  checksum: f72292006b358bcf9d866cd1360222484e6980bd884281bcab62a77af15018bb

sources:
- name: acpid
  url: https://downloads.sourceforge.net/project/acpid2/acpid-2.0.34.tar.xz
  sha256: 2d095c8cfcbc847caec746d62cdc8d0bff1ec1bc72ef7c674c721e04da6ab333
- name: uapi_config
  file: pkg/core/power/acpid-uapi-config.patch
  sha256: 902e4ac53e71ca8c0780e7d2e72ce7b16e75795c7d004df794da6780c73ee774

dependencies:
- name: bash
  commit: x86_64/pkg/cli/shells/bash/5.2.21/bundles/dev
- name: binutils
  commit: x86_64/pkg/core/toolchain/binutils/2.42/bundles/dev
- name: coreutils
  commit: x86_64/pkg/core/userland/coreutils/9.5/bundles/dev
- name: diffutils
  commit: x86_64/pkg/core/userland/diffutils/3.10/bundles/dev
- name: file
  commit: x86_64/pkg/dev/tools/file/5.45/bundles/dev
- name: findutils
  commit: x86_64/pkg/core/userland/findutils/4.9.0/bundles/dev
- name: gawk
  commit: x86_64/pkg/cli/text/gawk/5.3.0/bundles/dev
- name: gcc
  commit: x86_64/pkg/core/toolchain/gcc/13.2.0/bundles/dev
- name: glibc
  commit: x86_64/pkg/libs/system/glibc/2.39/bundles/dev
- name: grep
  commit: x86_64/pkg/cli/text/grep/3.11/bundles/dev
- name: make
  commit: x86_64/pkg/core/toolchain/make/4.4.1/bundles/dev
- name: patch
  commit: x86_64/pkg/core/toolchain/patch/2.7.6/bundles/dev
- name: sed
  commit: x86_64/pkg/cli/text/sed/4.9/bundles/dev
- name: tar
  commit: x86_64/pkg/cli/archive/tar/1.35/bundles/dev
- name: xz
  commit: x86_64/pkg/libs/compression/xz/5.4.6/bundles/dev
- name: linux-headers
  commit: x86_64/pkg/libs/system/linux-headers/6.4.1/bundles/dev

build:
  environment: 27b6e5dc7ad152c9a17c2cabfcc5ee93daa9bbf0
  profile: [4098:3636, 8590:3847, 13070:3848, 16918:5409]

  script: |
    set -eu

    tar --no-same-owner -xf "/${SOURCE_acpid}" -C "${WORK_DIR}" --strip-components=1
    cd "${WORK_DIR}"

    # acpid already enables large-file support. Use the normal stat API so the
    # source also builds with C libraries that no longer expose stat64 names.
    sed -i 's/struct stat64 st;/struct stat st;/; s/fstat64(fd, \&st)/fstat(fd, \&st)/' sock.c

    patch --batch --fuzz=0 -Np1 -i "/${SOURCE_uapi_config}"

    ./configure \
      --prefix=/usr \
      --sbindir=/usr/bin
    make
    make DESTDIR="${OUT_DIR}" install

    install -d "${OUT_DIR}/usr/lib/systemd/system"
    cat > "${OUT_DIR}/usr/lib/systemd/system/acpid.service" << 'EOF'
    [Unit]
    Description=ACPI event daemon
    Documentation=man:acpid(8)
    ConditionVirtualization=!container
    After=systemd-udevd.service

    [Service]
    ExecStart=/usr/bin/acpid --foreground
    Restart=on-failure

    [Install]
    WantedBy=multi-user.target
    EOF
    chmod 644 "${OUT_DIR}/usr/lib/systemd/system/acpid.service"

    mkdir -p /usr/lib/acpi/events /run/acpi/events /etc/acpi/events
    rm -f /usr/lib/acpi/events/* /run/acpi/events/* /etc/acpi/events/*
    printf 'event=.*\naction=/bin/true\n' > /usr/lib/acpi/events/shared
    printf 'event=.*\naction=/bin/true\n' > /usr/lib/acpi/events/vendor-only
    printf 'event=.*\naction=/bin/true\n' > /run/acpi/events/shared
    printf 'event=.*\naction=/bin/true\n' > /run/acpi/events/run-only
    printf 'event=.*\naction=/bin/true\n' > /etc/acpi/events/shared
    printf 'event=.*\naction=/bin/true\n' > /etc/acpi/events/admin-only
    ln -sf /dev/null /etc/acpi/events/masked-rule
    printf 'event=.*\naction=/bin/true\n' > /usr/lib/acpi/events/masked-rule

    smoke_log="${WORK_DIR}/acpid-uapi-smoke.log"
    : > "${WORK_DIR}/acpi-event"
    set +e
    "${OUT_DIR}/usr/bin/acpid" -d -f -S -e "${WORK_DIR}/acpi-event" \
      >"${smoke_log}" 2>&1 &
    smoke_pid=$!
    sleep 1
    kill "${smoke_pid}" 2>/dev/null
    wait "${smoke_pid}" 2>/dev/null
    set -e

    if ! grep -q 'parsing conf file /etc/acpi/events/shared' "${smoke_log}"; then
      printf 'acpid UAPI smoke: missing /etc shared parse, log follows\n' >&2
      cat "${smoke_log}" >&2
      exit 1
    fi
    grep -q 'parsing conf file /etc/acpi/events/admin-only' "${smoke_log}"
    grep -q 'parsing conf file /run/acpi/events/run-only' "${smoke_log}"
    grep -q 'parsing conf file /usr/lib/acpi/events/vendor-only' "${smoke_log}"
    grep -q 'shadowing conf file /run/acpi/events/shared' "${smoke_log}"
    grep -q 'shadowing conf file /usr/lib/acpi/events/shared' "${smoke_log}"
    grep -q 'masking conf file /etc/acpi/events/masked-rule' "${smoke_log}"
    if grep -q 'parsing conf file /usr/lib/acpi/events/masked-rule' "${smoke_log}"; then
      printf 'acpid UAPI smoke: masked vendor rule was still parsed\n' >&2
      cat "${smoke_log}" >&2
      exit 1
    fi
    rm -f /usr/lib/acpi/events/* /run/acpi/events/* /etc/acpi/events/*
    printf 'acpid UAPI smoke: the config loader read all three tiers in order\n'

    find "${OUT_DIR}" -type f -executable -exec strip --strip-unneeded {} \; 2>/dev/null || true
    find "${OUT_DIR}" -exec touch -h -d '2024-01-01T00:00:00+00:00' {} \;

bundles:
  full:
  - bin
  - doc
  - lib
  - man

outputs:
  bin:
    files:
    - path: /usr/bin/acpi_listen
      needs:
      - /usr/lib/ld-linux-x86-64.so.2
      - /usr/lib/libc.so.6
    - path: /usr/bin/acpid
      needs:
      - /usr/lib/ld-linux-x86-64.so.2
      - /usr/lib/libc.so.6
    - path: /usr/bin/kacpimon
      needs:
      - /usr/lib/ld-linux-x86-64.so.2
      - /usr/lib/libc.so.6

  doc:
    files:
    - path: /usr/share/doc/acpid/COPYING
    - path: /usr/share/doc/acpid/Changelog
    - path: /usr/share/doc/acpid/README
    - path: /usr/share/doc/acpid/TESTPLAN
    - path: /usr/share/doc/acpid/TODO

  lib:
    files:
    - path: /usr/lib/systemd/system/acpid.service

  man:
    files:
    - path: /usr/share/man/man8/acpi_listen.8
    - path: /usr/share/man/man8/acpid.8
    - path: /usr/share/man/man8/kacpimon.8

resolution:
  /usr/lib/ld-linux-x86-64.so.2: glibc
  /usr/lib/libc.so.6: glibc
