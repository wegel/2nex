package:
  schema: 1
  name: nex
  slug: nex
  namespace: core/nex
  version: 0.1.0
  description: 2nex package builder and manager
  checksum: 08d2b0548cb1d790d2c40b9487b344363ed5716ba11225ece8b13372010800b5

sources:
- name: nex_src
  file: pkg/core/nex/nex-builder-src.tar.gz
  sha256: 68ba40081f6de0e8546b25ef357b794cd002a5527ef937246a09efdc637ceee6

dependencies:
- name: bash
  commit: x86_64/pkg/bootstrap/phase1/bash/5.2.21/bundles/dev
- name: coreutils
  commit: x86_64/pkg/bootstrap/phase1/coreutils/9.5/bundles/dev
- name: findutils
  commit: x86_64/pkg/bootstrap/phase1/findutils/4.9.0/bundles/dev
- name: phase3
  commit: x86_64/pkg/bootstrap/phase3/2nex-utilities-bootstrap/0.0.1/bundles/dev
- name: grep
  commit: x86_64/pkg/bootstrap/phase1/grep/3.11/bundles/dev
- name: sed
  commit: x86_64/pkg/bootstrap/phase1/sed/4.9/bundles/dev
- name: tar
  commit: x86_64/pkg/bootstrap/phase1/tar/1.35/bundles/dev
- name: gzip
  commit: x86_64/pkg/bootstrap/phase1/gzip/1.13/bundles/dev
- name: rust-bin
  commit: x86_64/pkg/dev/lang/rust-bin/1.91.1/bundles/dev
- name: zlib
  commit: x86_64/pkg/libs/system/zlib/1.3.1/bundles/dev
- name: glibc
  commit: x86_64/pkg/libs/system/glibc/2.39/bundles/dev
- name: gcc
  commit: x86_64/pkg/core/toolchain/gcc/13.2.0/bundles/dev
- name: binutils
  commit: x86_64/pkg/bootstrap/phase3/binutils/2.42/bundles/dev
- name: linux-headers
  commit: x86_64/pkg/bootstrap/phase3/linux-headers/6.4.1/bundles/dev

build:
  profile: [3168:22173]

  script: |
    # extract source
    tar --no-same-owner -xzf ${SOURCE_nex_src} -C ${WORK_DIR} --strip-components=1
    cd ${WORK_DIR}

    # setup cc symlink for rust linker
    ln -sf gcc /usr/bin/cc

    # build release binary (offline using vendored deps)
    export CARGO_HOME=${WORK_DIR}/.cargo_home
    mkdir -p ${CARGO_HOME}
    cp .cargo/config.toml ${CARGO_HOME}/config.toml
    # use gcc as linker (lld needs /proc/self/exe which is unavailable in unshare)
    export CARGO_TARGET_X86_64_UNKNOWN_LINUX_GNU_LINKER=gcc
    unset RUSTFLAGS
    cargo build --release --offline --locked

    # install
    mkdir -p ${OUT_DIR}/usr/bin
    cp target/release/nex ${OUT_DIR}/usr/bin/

    # set timestamp for reproducibility
    find "${OUT_DIR}" -exec touch -d '2024-01-01T00:00:00+00:00' {} \;

bundles:
  dev:
  - bin

  full:
  - bin

outputs:
  bin:
    files:
    - path: /usr/bin/nex
      needs:
      - /usr/lib/ld-linux-x86-64.so.2
      - /usr/lib/libc.so.6
      - /usr/lib/libgcc_s.so.1

resolution:
  /usr/lib/libgcc_s.so.1: gcc
  /usr/lib/ld-linux-x86-64.so.2: glibc
  /usr/lib/libc.so.6: glibc
