package:
  schema: 1
  name: nex
  slug: nex
  namespace: core/nex
  version: 0.1.0
  description: nex package builder and manager
  checksum: 4c45803defe30406807f693585480f2253a7b09aacda74b0376bd372fe10998d

sources:
- name: nex_src
  dev: src/cli

dependencies:
- name: bash
  commit: x86_64/pkg/cli/shells/bash/5.2.21/bundles/dev
- name: coreutils
  commit: x86_64/pkg/core/userland/coreutils/9.5/bundles/dev
- name: findutils
  commit: x86_64/pkg/core/userland/findutils/4.9.0/bundles/dev
- name: libcap
  commit: x86_64/pkg/libs/security/libcap/2.69/bundles/dev
- name: grep
  commit: x86_64/pkg/cli/text/grep/3.11/bundles/dev
- name: sed
  commit: x86_64/pkg/cli/text/sed/4.9/bundles/dev
- name: tar
  commit: x86_64/pkg/cli/archive/tar/1.35/bundles/dev
- name: gzip
  commit: x86_64/pkg/cli/archive/gzip/1.13/bundles/dev
- name: rust-bin
  commit: x86_64/pkg/dev/lang/rust-bin/1.91.1/bundles/dev
- name: zlib
  commit: x86_64/pkg/libs/system/zlib/1.3.1/bundles/dev
- name: glibc
  commit: x86_64/pkg/libs/system/glibc/2.39/bundles/dev
- name: gcc
  commit: x86_64/pkg/core/toolchain/gcc/13.2.0/bundles/dev
- name: binutils
  commit: x86_64/pkg/core/toolchain/binutils/2.42/bundles/dev
- name: linux-headers
  commit: x86_64/pkg/libs/system/linux-headers/6.4.1/bundles/dev
- name: ncurses
  commit: x86_64/pkg/libs/system/ncurses/6.4-20230520/bundles/dev
- name: acl
  commit: x86_64/pkg/libs/system/acl/2.3.2/bundles/dev
- name: attr
  commit: x86_64/pkg/libs/system/attr/2.5.2/bundles/dev
- name: gmp
  commit: x86_64/pkg/libs/system/gmp/6.3.0/bundles/dev

build:
  environment: 27b6e5dc7ad152c9a17c2cabfcc5ee93daa9bbf0
  profile: [3803:27213]

  script: |

    # doesn't build correctly with LTO
    CFLAGS=${CFLAGS/-flto=auto/}
    CXXFLAGS=${CXXFLAGS/-flto=auto/}
    LDFLAGS=${LDFLAGS/-flto=auto/}

    # extract source (use -xf for dev sources, -xzf for compressed)
    if [ -n "${SOURCE_nex_src_IS_DEV:-}" ]; then
        tar --no-same-owner -xf /${SOURCE_nex_src} -C ${WORK_DIR} --strip-components=1
    else
        tar --no-same-owner -xzf /${SOURCE_nex_src} -C ${WORK_DIR} --strip-components=1
    fi
    cd ${WORK_DIR}

    # setup cc symlink for rust linker
    ln -sf gcc /usr/bin/cc

    # build release binary (offline using vendored deps)
    export CARGO_HOME=${WORK_DIR}/.cargo_home
    mkdir -p ${CARGO_HOME}
    cp .cargo/config.toml ${CARGO_HOME}/config.toml
    # use gcc as linker (lld needs /proc/self/exe which is unavailable in unshare)
    export CARGO_TARGET_X86_64_UNKNOWN_LINUX_GNU_LINKER=gcc
    unset RUSTFLAGS
    cargo build --release --offline --locked

    # install
    mkdir -p ${OUT_DIR}/usr/bin
    cp target/release/nex ${OUT_DIR}/usr/bin/

    # set timestamp for reproducibility
    find "${OUT_DIR}" -exec touch -d '2024-01-01T00:00:00+00:00' {} \;

bundles:
  dev:
  - bin

  full:
  - bin

outputs:
  bin:
    files:
    - path: /usr/bin/nex
      needs:
      - /usr/lib/ld-linux-x86-64.so.2
      - /usr/lib/libc.so.6
      - /usr/lib/libgcc_s.so.1
      - /usr/lib/libm.so.6

resolution:
  /usr/lib/libgcc_s.so.1: gcc
  /usr/lib/ld-linux-x86-64.so.2: glibc
  /usr/lib/libc.so.6: glibc
  /usr/lib/libm.so.6: glibc
