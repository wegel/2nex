package:
  schema: 1
  name: nex Dynamic Linker Shim
  slug: nex-ld-shim
  namespace: core/nex
  version: 0.0.1
  description: Minimal PT_INTERP shim using raw syscalls (no libc dependency)
  checksum: 64af181e1671a5877c8a3bd5e13e859c1ed78ddfa7b3e6fa319ebef3b08a4b7e

sources:
- name: shim
  file: pkg/core/nex/nex-ld-shim-raw.c
  sha256: c9da5b2d40d9c6f125f7f485ce31a568c6df527b334b898b1a36bd5065facde8

dependencies:
- name: bash
  commit: x86_64/pkg/cli/shells/bash/5.2.21/bundles/dev
- name: coreutils
  commit: x86_64/pkg/core/userland/coreutils/9.5/bundles/dev
- name: findutils
  commit: x86_64/pkg/core/userland/findutils/4.9.0/bundles/dev
- name: libcap
  commit: x86_64/pkg/libs/security/libcap/2.69/bundles/dev
- name: binutils
  commit: x86_64/pkg/core/toolchain/binutils/2.42/bundles/dev
- name: gcc
  commit: x86_64/pkg/core/toolchain/gcc/13.2.0/bundles/dev
- name: glibc
  commit: x86_64/pkg/libs/system/glibc/2.39/bundles/dev
- name: ncurses
  commit: x86_64/pkg/libs/system/ncurses/6.4-20230520/bundles/dev
- name: zlib
  commit: x86_64/pkg/libs/system/zlib/1.3.1/bundles/dev
- name: gmp
  commit: x86_64/pkg/libs/system/gmp/6.3.0/bundles/dev

build:
  environment: 27b6e5dc7ad152c9a17c2cabfcc5ee93daa9bbf0
  profile: [433:207]

  script: |
    # create output directory
    mkdir -p ${OUT_DIR}/usr/lib

    # compile the shim without libc - uses raw syscalls only
    # flags:
    #   -nostdlib -nostartfiles: don't link libc or crt
    #   -fno-builtin: don't use builtin functions (they may call libc)
    #   -fno-stack-protector: stack canary requires %fs segment (set by libc)
    #   -static -O2: static binary, optimized
    #   -Wl,-Ttext-segment=0x200000: load at 0x200000 to avoid conflict with
    #     non-PIE executables that default to 0x400000
    gcc -nostdlib -nostartfiles -static \
        -fno-builtin -fno-stack-protector \
        -O2 -Wall -Wextra \
        -Wl,-Ttext-segment=0x200000 \
        -o ${OUT_DIR}/usr/lib/nex-ld-shim \
        ${SOURCE_shim}

    # strip the binary
    strip ${OUT_DIR}/usr/lib/nex-ld-shim

    # set timestamp for reproducibility
    find "${OUT_DIR}" -exec touch -d '2024-01-01T00:00:00+00:00' {} \;

bundles:
  full:
  - lib

outputs:
  lib:
    files:
    - path: /usr/lib/nex-ld-shim
