package:
  schema: 1
  name: Systemd with D-Bus
  slug: systemd-with-dbus
  namespace: core/init
  version: '257.5'
  description: Systemd init system bundled with dbus-broker
  homepage: https://www.freedesktop.org/wiki/Software/systemd/
  checksum: 349cdfe7befc59e1a3d2183e6f4be993fd61bbfe45c724b0c20f5a5e7824f1cf
sources: []
dependencies:
- name: bash
  commit: x86_64/pkg/cli/shells/bash/5.2.21/bundles/dev
- name: coreutils
  commit: x86_64/pkg/core/userland/coreutils/9.5/bundles/dev
- name: findutils
  commit: x86_64/pkg/bootstrap/phase1/findutils/4.9.0/bundles/dev
- name: systemd
  commit: x86_64/pkg/core/init/systemd/257.5/bundles/dev
- name: dbus-broker
  commit: x86_64/pkg/core/ipc/dbus-broker/37/bundles/full
build:
  script: |2

    set -x
    mkdir -p ${OUT_DIR}/usr/bin
    mkdir -p ${OUT_DIR}/usr/lib/systemd
    mkdir -p ${OUT_DIR}/usr/include
    mkdir -p ${OUT_DIR}/usr/share

    # systemd binaries
    for bin in systemctl journalctl hostnamectl localectl loginctl machinectl \
               networkctl oomctl portablectl resolvectl bootctl busctl coredumpctl \
               kernel-install timedatectl udevadm ukify varlinkctl; do
      cp -a /usr/bin/$bin ${OUT_DIR}/usr/bin/ 2>/dev/null || true
    done
    # systemd-* prefixed binaries
    cp -a /usr/bin/systemd-* ${OUT_DIR}/usr/bin/
    # symlinks
    for link in halt init poweroff reboot runlevel shutdown run0 mount.ddi resolvconf; do
      cp -a /usr/bin/$link ${OUT_DIR}/usr/bin/ 2>/dev/null || true
    done

    # dbus-broker binaries
    cp -a /usr/bin/dbus-broker ${OUT_DIR}/usr/bin/
    cp -a /usr/bin/dbus-broker-launch ${OUT_DIR}/usr/bin/

    # systemd libraries
    cp -a /usr/lib/libsystemd* ${OUT_DIR}/usr/lib/
    cp -a /usr/lib/libudev* ${OUT_DIR}/usr/lib/
    cp -a /usr/lib/libnss_myhostname* ${OUT_DIR}/usr/lib/
    cp -a /usr/lib/libnss_mymachines* ${OUT_DIR}/usr/lib/
    cp -a /usr/lib/libnss_resolve* ${OUT_DIR}/usr/lib/
    cp -a /usr/lib/libnss_systemd* ${OUT_DIR}/usr/lib/

    # systemd runtime directories (copy contents, not dir itself - avoids nesting)
    cp -a /usr/lib/systemd/. ${OUT_DIR}/usr/lib/systemd/
    cp -a /usr/lib/udev ${OUT_DIR}/usr/lib/
    cp -a /usr/lib/tmpfiles.d ${OUT_DIR}/usr/lib/
    cp -a /usr/lib/sysctl.d ${OUT_DIR}/usr/lib/
    cp -a /usr/lib/modprobe.d ${OUT_DIR}/usr/lib/
    cp -a /usr/lib/kernel ${OUT_DIR}/usr/lib/
    cp -a /usr/lib/pam.d ${OUT_DIR}/usr/lib/

    # pkgconfig files
    mkdir -p ${OUT_DIR}/usr/lib/pkgconfig
    mkdir -p ${OUT_DIR}/usr/share/pkgconfig
    cp -a /usr/lib/pkgconfig/libsystemd.pc ${OUT_DIR}/usr/lib/pkgconfig/ 2>/dev/null || true
    cp -a /usr/lib/pkgconfig/libudev.pc ${OUT_DIR}/usr/lib/pkgconfig/ 2>/dev/null || true
    cp -a /usr/share/pkgconfig/systemd.pc ${OUT_DIR}/usr/share/pkgconfig/ 2>/dev/null || true
    cp -a /usr/share/pkgconfig/udev.pc ${OUT_DIR}/usr/share/pkgconfig/ 2>/dev/null || true

    # includes (for dev output)
    cp -a /usr/include/systemd ${OUT_DIR}/usr/include/
    cp -a /usr/include/libudev.h ${OUT_DIR}/usr/include/

    # dbus directories
    cp -a /usr/share/dbus-1 ${OUT_DIR}/usr/share/ 2>/dev/null || true

    # create D-Bus system configuration file (required by dbus-broker)
    mkdir -p ${OUT_DIR}/usr/share/dbus-1
    cat > ${OUT_DIR}/usr/share/dbus-1/system.conf << 'DBUS_CONF'
    <!DOCTYPE busconfig PUBLIC "-//freedesktop//DTD D-Bus Bus Configuration 1.0//EN"
     "http://www.freedesktop.org/standards/dbus/1.0/busconfig.dtd">
    <busconfig>
      <type>system</type>
      <user>root</user>
      <auth>EXTERNAL</auth>
      <listen>unix:path=/run/dbus/system_bus_socket</listen>
      <policy context="default">
        <allow user="*"/>
        <allow own="*"/>
        <allow send_type="method_call"/>
        <allow send_type="signal"/>
        <allow receive_type="method_call"/>
        <allow receive_type="signal"/>
      </policy>
      <includedir>/usr/share/dbus-1/system.d</includedir>
      <includedir>/etc/dbus-1/system.d</includedir>
    </busconfig>
    DBUS_CONF

    # /usr/sbin symlink
    ln -sf bin ${OUT_DIR}/usr/sbin 2>/dev/null || true

    # enable dbus-broker as the system D-Bus implementation
    ln -sf dbus-broker.service ${OUT_DIR}/usr/lib/systemd/system/dbus.service

    # create dbus.socket (required for socket activation of dbus-broker)
    cat > ${OUT_DIR}/usr/lib/systemd/system/dbus.socket << 'SOCKET'
    [Unit]
    Description=D-Bus System Message Bus Socket

    [Socket]
    ListenStream=/run/dbus/system_bus_socket

    [Install]
    WantedBy=sockets.target
    SOCKET

    # enable dbus.socket in sockets.target.wants
    mkdir -p ${OUT_DIR}/usr/lib/systemd/system/sockets.target.wants
    ln -sf ../dbus.socket ${OUT_DIR}/usr/lib/systemd/system/sockets.target.wants/dbus.socket

    # ensure consistent timestamps
    find "${OUT_DIR}" -exec touch -d '2024-01-01T00:00:00+00:00' {} \;
