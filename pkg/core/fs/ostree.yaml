build:
  environment: 27b6e5dc7ad152c9a17c2cabfcc5ee93daa9bbf0
  profile: [4102:1619, 8233:2801, 12371:3563, 16484:4224, 20587:4875, 24695:7575, 28851:7777, 29370:7884]

  script: |
    set -eu

    tar --no-same-owner -xf "/${SOURCE_ostree}" -C "${WORK_DIR}" --strip-components=1
    cd "${WORK_DIR}"
    patch --batch --fuzz=0 -Np1 -i "/${SOURCE_grub_command}"

    BASH_COMPLETIONSDIR=/usr/share/bash-completion/completions \
      ./configure \
        --prefix=/usr \
        --sysconfdir=/etc \
        --sbindir=/usr/bin \
        --libexecdir=/usr/lib \
        --disable-static \
        --with-curl \
        --without-soup \
        --with-gpgme \
        --enable-rofiles-fuse \
        --with-libmount \
        --with-libsystemd \
        --with-systemdsystemunitdir=/usr/lib/systemd/system \
        --with-systemdsystemgeneratordir=/usr/lib/systemd/system-generators

    make
    make DESTDIR="${OUT_DIR}" install

    rm "${OUT_DIR}/etc/grub.d/15_ostree"
    rmdir \
      "${OUT_DIR}/etc/grub.d" \
      "${OUT_DIR}/etc/ostree/remotes.d" \
      "${OUT_DIR}/etc/ostree" \
      "${OUT_DIR}/etc"

    grub_script="${OUT_DIR}/usr/lib/libostree/grub2-15_ostree"
    test -x "${grub_script}"
    mkdir -p \
      /boot/grub2 \
      /etc/default \
      /ostree/repo \
      /usr/share/grub

    cat > /usr/share/grub/grub-mkconfig_lib <<'EOF'
    grub_get_device_id() {
      printf 'device-id:%s\n' "$1"
    }
    prepare_grub_to_access_device() {
      printf 'prepare:%s\n' "$1"
    }
    EOF
    cat > /usr/bin/ostree <<'EOF'
    #!/bin/sh
    test "$*" = 'admin instutil grub2-generate'
    test "${GRUB2_BOOT_DEVICE_ID}" = 'device-id:/dev/mock-boot'
    test "${GRUB2_PREPARE_ROOT_CACHE}" = 'prepare:/dev/mock-boot'
    printf '%s\n' 'menuentry mock-ostree'
    EOF
    chmod 755 /usr/bin/ostree
    printf '%s\n' 'GRUB_ENABLE_BLSCFG=false' > /etc/default/grub

    output="$(GRUB_DEVICE=/dev/mock-root \
      GRUB_DEVICE_BOOT=/dev/mock-boot \
      "${grub_script}")"
    test "${output}" = 'menuentry mock-ostree'

    set +e
    output="$("${grub_script}" 2>&1)"
    status=$?
    set -e
    test "${status}" -eq 1
    case "${output}" in
      *'must be run as a child of grub2-mkconfig'*) ;;
      *)
        printf '%s\n' "${output}" >&2
        exit 1
        ;;
    esac

    printf '%s\n' 'GRUB_ENABLE_BLSCFG=true' > /etc/default/grub
    : > /boot/grub2/.grub2-blscfg-supported
    output="$(GRUB_DEVICE=/dev/mock-root "${grub_script}")"
    test -z "${output}"

    rm -rf /ostree/repo
    rm -f \
      /boot/grub2/.grub2-blscfg-supported \
      /etc/default/grub \
      /usr/bin/ostree \
      /usr/share/grub/grub-mkconfig_lib

    find "${OUT_DIR}" -name '*.la' -delete
    find "${OUT_DIR}" -type f -executable -exec strip --strip-unneeded {} \; 2>/dev/null || true
    find "${OUT_DIR}" -exec touch -h -d '2024-01-01T00:00:00+00:00' {} \;

