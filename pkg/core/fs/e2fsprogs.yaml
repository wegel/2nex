build:
  environment: 13ce31fd97c19f5756e4413babf279d543b5a71c
  profile: [4115:960, 8231:3876, 12355:6039, 16473:6999, 20573:8577, 24677:10489, 28821:11900, 32927:12014, 41159:12416, 41581:12544]

  script: |
    tar --no-same-owner -xf ${SOURCE0} -C "${WORK_DIR}" --strip-components=1
    cd ${WORK_DIR}

    mkdir -v build
    cd       build

    ../configure --prefix=/usr           \
             --sysconfdir=/etc       \
             --enable-elf-shlibs     \
             --disable-libblkid      \
             --disable-libuuid       \
             --disable-uuidd         \
             --disable-fsck

    make
    make DESTDIR=$OUT_DIR install

    find "${OUT_DIR}" -exec touch -d "2024-01-01T00:00:00+00:00" {} \;
    2nex_strip_binaries ${OUT_DIR}

bundles:
  dev:
  - bin
  - dev
  - lib

  full:
  - bin
  - dev
  - lib
  - locale
  - man
  - misc

