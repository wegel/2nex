    - path: /usr/lib/libbtrfsutil.a

resolution:
  /usr/lib/libcom_err.so.2: e2fsprogs
  /usr/lib/libext2fs.so.2: e2fsprogs
  /usr/lib/ld-linux-x86-64.so.2: glibc
