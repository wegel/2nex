  lib:
    files:
    - path: /usr/lib/libbtrfs.so
      needs:
      - /usr/lib/libc.so.6
    - path: /usr/lib/libbtrfs.so.0
      needs:
      - /usr/lib/libc.so.6
    - path: /usr/lib/libbtrfs.so.0.1
