      - /usr/lib/ld-linux-x86-64.so.2
      - /usr/lib/libblkid.so.1
      - /usr/lib/libc.so.6
      - /usr/lib/libcom_err.so.2
      - /usr/lib/libext2fs.so.2
      - /usr/lib/libudev.so.1
      - /usr/lib/libuuid.so.1
