package:
  schema: 1
  name: Btrfs Progs
  slug: btrfs-progs
  namespace: core/fs
  version: "6.10"
  description: Userspace utilities for the btrfs filesystem
  homepage: https://btrfs.wiki.kernel.org
  checksum: 4f4a1f0cef100dcc63af16a94e100e9ef8e04f0627e54ba24e6f19a97132ab9b

sources:
- name: btrfs_progs
  url: https://www.kernel.org/pub/linux/kernel/people/kdave/btrfs-progs/btrfs-progs-v6.10.tar.xz
  sha256: 3382a84e3fcfe1ffdea07a61ab3f4e86665d38fa35f1f34548d5df867423e0df

dependencies:
- name: bash
  commit: x86_64/pkg/cli/shells/bash/5.2.21/bundles/dev
- name: coreutils
  commit: x86_64/pkg/core/userland/coreutils/9.5/bundles/dev
- name: findutils
  commit: x86_64/pkg/core/userland/findutils/4.9.0/bundles/dev
- name: phase3
  commit: x86_64/pkg/bootstrap/phase3/2nex-utilities-bootstrap/0.0.1/bundles/dev
- name: gawk
  commit: x86_64/pkg/cli/text/gawk/5.3.0/bundles/dev
- name: grep
  commit: x86_64/pkg/cli/text/grep/3.11/bundles/dev
- name: make
  commit: x86_64/pkg/core/toolchain/make/4.4.1/bundles/dev
- name: sed
  commit: x86_64/pkg/cli/text/sed/4.9/bundles/dev
- name: tar
  commit: x86_64/pkg/cli/archive/tar/1.35/bundles/dev
- name: binutils
  commit: x86_64/pkg/bootstrap/phase3/binutils/2.42/bundles/dev
- name: inetutils
  commit: x86_64/pkg/net/misc/inetutils/2.5/bundles/dev
- name: glibc
  commit: x86_64/pkg/libs/system/glibc/2.39/bundles/dev
- name: gcc
  commit: x86_64/pkg/bootstrap/phase3/gcc/13.2.0/bundles/dev
- name: acl
  commit: x86_64/pkg/libs/system/acl/2.3.2/bundles/dev
- name: attr
  commit: x86_64/pkg/libs/system/attr/2.5.2/bundles/dev
- name: bzip2
  commit: x86_64/pkg/bootstrap/phase3/bzip2/1.0.8/bundles/dev
- name: gmp
  commit: x86_64/pkg/libs/system/gmp/6.3.0/bundles/dev
- name: libcap
  commit: x86_64/pkg/libs/security/libcap/2.69/bundles/dev
- name: mpfr
  commit: x86_64/pkg/bootstrap/phase3/mpfr/4.2.1/bundles/dev
- name: zlib
  commit: x86_64/pkg/bootstrap/phase3/zlib/1.3.1/bundles/dev
- name: linux-headers
  commit: x86_64/pkg/bootstrap/phase3/linux-headers/6.4.1/bundles/dev
- name: mpc
  commit: x86_64/pkg/bootstrap/phase3/mpc/1.2.1/bundles/dev
- name: xz
  commit: x86_64/pkg/bootstrap/phase3/xz/5.4.6/bundles/dev
- name: ncurses
  commit: x86_64/pkg/libs/system/ncurses/6.4-20230520/bundles/dev
- name: util_linux
  commit: x86_64/pkg/core/userland/util_linux/2.40/bundles/dev
- name: lzo
  commit: x86_64/pkg/cli/archive/lzo/2.10/bundles/dev
- name: e2fsprogs
  commit: x86_64/pkg/core/fs/e2fsprogs/1.47.0/bundles/dev
- name: pkgconf
  commit: x86_64/pkg/bootstrap/phase3/pkgconf/2.2.0/bundles/dev
- name: systemd
  commit: x86_64/pkg/core/init/systemd/257.5/bundles/dev
- name: zstd
  commit: x86_64/pkg/bootstrap/phase3/zstd/1.5.6/bundles/dev
- name: file
  commit: x86_64/pkg/bootstrap/phase3/file/5.45/bundles/dev

build:
  profile: [4121:1261, 8242:2005, 12114:3710]

  script: |
    tar --no-same-owner -xf ${SOURCE_btrfs_progs} -C "${WORK_DIR}" --strip-components=1
    cd ${WORK_DIR}

    # Configure
    ./configure --prefix=/usr --disable-documentation --disable-python

    # Build
    make

    # Install
    make DESTDIR="${OUT_DIR}" install

    # Set consistent timestamps for reproducible builds
    find "${OUT_DIR}" -exec touch -d '2024-01-01T00:00:00+00:00' {} \;
    #find "${OUT_DIR}" ! -type d -exec strip-nondeterminism -T 1704067200 --normalizers +all {} \; || true
    2nex_strip_binaries ${OUT_DIR}

bundles:
  dev:
  - bin
  - dev
  - lib
  - static

  full:
  - bin
  - dev
  - lib
  - static

outputs:
  bin:
    files:
    - path: /usr/bin/btrfs
    - path: /usr/bin/btrfs-convert
    - path: /usr/bin/btrfs-find-root
    - path: /usr/bin/btrfs-image
    - path: /usr/bin/btrfs-map-logical
    - path: /usr/bin/btrfs-select-super
    - path: /usr/bin/btrfsck
    - path: /usr/bin/btrfstune
    - path: /usr/bin/fsck.btrfs
    - path: /usr/bin/mkfs.btrfs

  dev:
    files:
    - path: /usr/include/btrfs/ctree.h
    - path: /usr/include/btrfs/ioctl.h
    - path: /usr/include/btrfs/kerncompat.h
    - path: /usr/include/btrfs/list.h
    - path: /usr/include/btrfs/rbtree.h
    - path: /usr/include/btrfs/rbtree_types.h
    - path: /usr/include/btrfs/send-stream.h
    - path: /usr/include/btrfs/send-utils.h
    - path: /usr/include/btrfs/send.h
    - path: /usr/include/btrfs/version.h
    - path: /usr/include/btrfsutil.h
    - path: /usr/lib/pkgconfig/libbtrfsutil.pc

  lib:
    files:
    - path: /usr/lib/libbtrfs.so
    - path: /usr/lib/libbtrfs.so.0
    - path: /usr/lib/libbtrfs.so.0.1
    - path: /usr/lib/libbtrfs.so.0.1.3
    - path: /usr/lib/libbtrfsutil.so
    - path: /usr/lib/libbtrfsutil.so.1
    - path: /usr/lib/libbtrfsutil.so.1.3
    - path: /usr/lib/libbtrfsutil.so.1.3.2
    - path: /usr/lib/udev/rules.d/64-btrfs-dm.rules
    - path: /usr/lib/udev/rules.d/64-btrfs-zoned.rules

  static:
    files:
    - path: /usr/lib/libbtrfs.a
    - path: /usr/lib/libbtrfsutil.a
