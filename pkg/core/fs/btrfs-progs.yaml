    - path: /usr/lib/libbtrfsutil.so.1.3
      needs:
      - /usr/lib/libc.so.6
    - path: /usr/lib/libbtrfsutil.so.1.3.2
      needs:
      - /usr/lib/libc.so.6
    - path: /usr/lib/udev/rules.d/64-btrfs-dm.rules
    - path: /usr/lib/udev/rules.d/64-btrfs-zoned.rules

  static:
