      - /usr/lib/libblkid.so.1
      - /usr/lib/libc.so.6
      - /usr/lib/libudev.so.1
      - /usr/lib/libuuid.so.1
      - /usr/lib/libz.so.1
    - path: /usr/bin/btrfs-map-logical
