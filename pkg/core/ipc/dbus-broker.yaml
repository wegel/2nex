package:
  schema: 1
  name: D-Bus Broker
  slug: dbus-broker
  namespace: core/ipc
  version: "37"
  description: Linux D-Bus Message Broker
  homepage: https://github.com/bus1/dbus-broker
  checksum: 3a299ec7d912613572ff290f4fe3889a61845453139980328407abeaafc2f705

sources:
- name: dbus-broker
  url: https://github.com/bus1/dbus-broker/releases/download/v37/dbus-broker-37.tar.xz
  sha256: f819a8db8795fa08c767612e3823fd594694a0990f2543ecf35d6a1a6bf2ab5b

dependencies:
- name: glibc
  commit: x86_64/pkg/libs/system/glibc/2.39/bundles/dev
- name: gcc
  commit: x86_64/pkg/core/toolchain/gcc/13.2.0/bundles/dev
- name: binutils
  commit: x86_64/pkg/core/toolchain/binutils/2.42/bundles/dev
- name: bash
  commit: x86_64/pkg/cli/shells/bash/5.2.21/bundles/dev
- name: coreutils
  commit: x86_64/pkg/core/userland/coreutils/9.5/bundles/dev
- name: findutils
  commit: x86_64/pkg/core/userland/findutils/4.9.0/bundles/dev
- name: tar
  commit: x86_64/pkg/cli/archive/tar/1.35/bundles/dev
- name: zlib
  commit: x86_64/pkg/libs/system/zlib/1.3.1/bundles/dev
- name: xz
  commit: x86_64/pkg/libs/compression/xz/5.4.6/bundles/dev
- name: attr
  commit: x86_64/pkg/libs/system/attr/2.5.2/bundles/dev
- name: acl
  commit: x86_64/pkg/libs/system/acl/2.3.2/bundles/dev
- name: libcap
  commit: x86_64/pkg/libs/security/libcap/2.69/bundles/dev
- name: ncurses
  commit: x86_64/pkg/libs/system/ncurses/6.4-20230520/bundles/dev
- name: linux-headers
  commit: x86_64/pkg/libs/system/linux-headers/6.4.1/bundles/dev
- name: gmp
  commit: x86_64/pkg/libs/system/gmp/6.3.0/bundles/dev
- name: expat
  commit: x86_64/pkg/libs/system/expat/2.6.2/bundles/dev
- name: python3
  commit: x86_64/pkg/dev/lang/python3/3.12.2/bundles/dev
- name: meson
  commit: x86_64/pkg/core/toolchain/meson/1.6.1/bundles/dev
- name: ninja
  commit: x86_64/pkg/core/toolchain/ninja/1.12.1/bundles/dev
- name: pkgconf
  commit: x86_64/pkg/core/toolchain/pkgconf/2.2.0/bundles/dev
- name: systemd
  commit: x86_64/pkg/core/init/systemd/257.5/bundles/dev

build:
  environment: 27b6e5dc7ad152c9a17c2cabfcc5ee93daa9bbf0
  profile: [4109:587, 8238:686, 12385:920, 16510:1106, 20615:1620, 22251:4539]

  script: |
    tar --no-same-owner -xf ${SOURCE0} -C "${WORK_DIR}" --strip-components=1
    cd ${WORK_DIR}

    # configure dbus-broker
    mkdir -p build
    cd build

    meson setup .. \
      --prefix=/usr \
      --sysconfdir=/etc \
      --buildtype=release \
      -Daudit=false \
      -Ddocs=false \
      -Dlinux-4-17=true \
      -Dsystem-console-users=gdm,sddm,lightdm

    # build
    ninja
    DESTDIR="${OUT_DIR}" ninja install

    # create dbus system directories
    mkdir -p ${OUT_DIR}/etc/dbus-1/system.d
    mkdir -p ${OUT_DIR}/etc/dbus-1/session.d
    mkdir -p ${OUT_DIR}/usr/share/dbus-1/system.d
    mkdir -p ${OUT_DIR}/usr/share/dbus-1/session.d
    mkdir -p ${OUT_DIR}/var/lib/dbus

    # create dbus system.conf - required by dbus-broker-launch
    cat > ${OUT_DIR}/usr/share/dbus-1/system.conf << 'DBUS_CONF'
    <!DOCTYPE busconfig PUBLIC "-//freedesktop//DTD D-Bus Bus Configuration 1.0//EN"
     "http://www.freedesktop.org/standards/dbus/1.0/busconfig.dtd">
    <busconfig>
      <type>system</type>
      <user>root</user>
      <auth>EXTERNAL</auth>
      <listen>unix:path=/run/dbus/system_bus_socket</listen>
      <policy context="default">
        <allow user="*"/>
        <allow own="*"/>
        <allow send_type="method_call"/>
        <allow send_type="signal"/>
        <allow receive_type="method_call"/>
        <allow receive_type="signal"/>
      </policy>
      <includedir>/usr/share/dbus-1/system.d</includedir>
      <includedir>/etc/dbus-1/system.d</includedir>
      <standard_system_servicedirs/>
    </busconfig>
    DBUS_CONF

    # create dbus session.conf - for user sessions
    cat > ${OUT_DIR}/usr/share/dbus-1/session.conf << 'DBUS_CONF'
    <!DOCTYPE busconfig PUBLIC "-//freedesktop//DTD D-Bus Bus Configuration 1.0//EN"
     "http://www.freedesktop.org/standards/dbus/1.0/busconfig.dtd">
    <busconfig>
      <type>session</type>
      <auth>EXTERNAL</auth>
      <listen>unix:tmpdir=/tmp</listen>
      <policy context="default">
        <allow send_destination="*" eavesdrop="true"/>
        <allow eavesdrop="true"/>
        <allow own="*"/>
        <allow user="*"/>
      </policy>
      <includedir>/usr/share/dbus-1/session.d</includedir>
      <includedir>/etc/dbus-1/session.d</includedir>
    </busconfig>
    DBUS_CONF

    # create dbus.socket - required by dbus-broker.service (normally from dbus reference impl)
    cat > ${OUT_DIR}/usr/lib/systemd/system/dbus.socket << 'DBUS_SOCKET'
    [Unit]
    Description=D-Bus System Message Bus Socket
    Documentation=man:dbus-broker-launch(1)
    DefaultDependencies=false
    Before=sockets.target

    [Socket]
    ListenStream=/run/dbus/system_bus_socket
    SocketMode=0666
    Service=dbus-broker.service

    [Install]
    WantedBy=sockets.target
    DBUS_SOCKET

    # create dbus.service alias symlink (normally created by systemctl enable)
    ln -sf dbus-broker.service ${OUT_DIR}/usr/lib/systemd/system/dbus.service

    # create user dbus.socket
    cat > ${OUT_DIR}/usr/lib/systemd/user/dbus.socket << 'DBUS_SOCKET'
    [Unit]
    Description=D-Bus User Message Bus Socket
    Documentation=man:dbus-broker-launch(1)
    DefaultDependencies=false
    Before=sockets.target

    [Socket]
    ListenStream=%t/bus
    ExecStartPost=-/bin/systemctl --user set-environment DBUS_SESSION_BUS_ADDRESS=unix:path=%t/bus

    [Install]
    WantedBy=sockets.target
    DBUS_SOCKET

    find ${OUT_DIR} -type f -executable -exec strip --strip-unneeded {} \; 2>/dev/null || true
    find "${OUT_DIR}" -exec touch -d '2024-01-01T00:00:00+00:00' {} \;

bundles:
  full:
  - bin
  - conf
  - lib

outputs:
  bin:
    files:
    - path: /usr/bin/dbus-broker
      needs:
      - /usr/lib/ld-linux-x86-64.so.2
      - /usr/lib/libc.so.6
      - /usr/lib/libgcc_s.so.1
      - /usr/lib/libm.so.6
    - path: /usr/bin/dbus-broker-launch
      needs:
      - /usr/lib/ld-linux-x86-64.so.2
      - /usr/lib/libc.so.6
      - /usr/lib/libexpat.so.1
      - /usr/lib/libgcc_s.so.1
      - /usr/lib/libsystemd.so.0

  conf:
    files:
    - path: /usr/share/dbus-1/session.conf
    - path: /usr/share/dbus-1/system.conf

  lib:
    files:
    - path: /usr/lib/systemd/catalog/dbus-broker-launch.catalog
    - path: /usr/lib/systemd/catalog/dbus-broker.catalog
    - path: /usr/lib/systemd/system/dbus-broker.service
    - path: /usr/lib/systemd/system/dbus.service
    - path: /usr/lib/systemd/system/dbus.socket
    - path: /usr/lib/systemd/user/dbus-broker.service
    - path: /usr/lib/systemd/user/dbus.socket

resolution:
  /usr/lib/libexpat.so.1: expat
  /usr/lib/libgcc_s.so.1: gcc
  /usr/lib/ld-linux-x86-64.so.2: glibc
  /usr/lib/libc.so.6: glibc
  /usr/lib/libm.so.6: glibc
  /usr/lib/libsystemd.so.0: systemd
