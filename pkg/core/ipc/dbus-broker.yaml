build:
  profile: [4109:455, 8238:558, 12346:843, 16474:1041, 20591:1550, 22577:1799]

  script: |
    tar --no-same-owner -xf ${SOURCE0} -C "${WORK_DIR}" --strip-components=1
    cd ${WORK_DIR}

    # configure dbus-broker
    mkdir -p build
    cd build

    meson setup .. \
      --prefix=/usr \
      --sysconfdir=/etc \
      --buildtype=release \
      -Daudit=false \
      -Ddocs=false \
      -Dlinux-4-17=true \
      -Dsystem-console-users=gdm,sddm,lightdm

    # build
    ninja
    DESTDIR="${OUT_DIR}" ninja install

    # create dbus system directories
    mkdir -p ${OUT_DIR}/etc/dbus-1/system.d
    mkdir -p ${OUT_DIR}/etc/dbus-1/session.d
    mkdir -p ${OUT_DIR}/usr/share/dbus-1/system.d
    mkdir -p ${OUT_DIR}/usr/share/dbus-1/session.d
    mkdir -p ${OUT_DIR}/var/lib/dbus

    # create dbus system.conf - required by dbus-broker-launch
    cat > ${OUT_DIR}/usr/share/dbus-1/system.conf << 'DBUS_CONF'
    <!DOCTYPE busconfig PUBLIC "-//freedesktop//DTD D-Bus Bus Configuration 1.0//EN"
     "http://www.freedesktop.org/standards/dbus/1.0/busconfig.dtd">
    <busconfig>
      <type>system</type>
      <user>root</user>
      <auth>EXTERNAL</auth>
      <listen>unix:path=/run/dbus/system_bus_socket</listen>
      <policy context="default">
        <allow user="*"/>
        <allow own="*"/>
        <allow send_type="method_call"/>
        <allow send_type="signal"/>
        <allow receive_type="method_call"/>
        <allow receive_type="signal"/>
      </policy>
      <includedir>/usr/share/dbus-1/system.d</includedir>
      <includedir>/etc/dbus-1/system.d</includedir>
    </busconfig>
    DBUS_CONF

    # create dbus session.conf - for user sessions
    cat > ${OUT_DIR}/usr/share/dbus-1/session.conf << 'DBUS_CONF'
    <!DOCTYPE busconfig PUBLIC "-//freedesktop//DTD D-Bus Bus Configuration 1.0//EN"
     "http://www.freedesktop.org/standards/dbus/1.0/busconfig.dtd">
    <busconfig>
      <type>session</type>
      <auth>EXTERNAL</auth>
      <listen>unix:tmpdir=/tmp</listen>
      <policy context="default">
        <allow send_destination="*" eavesdrop="true"/>
        <allow eavesdrop="true"/>
        <allow own="*"/>
        <allow user="*"/>
      </policy>
      <includedir>/usr/share/dbus-1/session.d</includedir>
      <includedir>/etc/dbus-1/session.d</includedir>
    </busconfig>
    DBUS_CONF

    # create dbus.socket - required by dbus-broker.service (normally from dbus reference impl)
    cat > ${OUT_DIR}/usr/lib/systemd/system/dbus.socket << 'DBUS_SOCKET'
    [Unit]
    Description=D-Bus System Message Bus Socket
    Documentation=man:dbus-broker-launch(1)
    DefaultDependencies=false
    Before=sockets.target

    [Socket]
    ListenStream=/run/dbus/system_bus_socket
    SocketMode=0666
    Service=dbus-broker.service

    [Install]
    WantedBy=sockets.target
    DBUS_SOCKET

    # create dbus.service alias symlink (normally created by systemctl enable)
    ln -sf dbus-broker.service ${OUT_DIR}/usr/lib/systemd/system/dbus.service

    # create user dbus.socket
    cat > ${OUT_DIR}/usr/lib/systemd/user/dbus.socket << 'DBUS_SOCKET'
    [Unit]
    Description=D-Bus User Message Bus Socket
    Documentation=man:dbus-broker-launch(1)
    DefaultDependencies=false
    Before=sockets.target

    [Socket]
    ListenStream=%t/bus
    ExecStartPost=-/bin/systemctl --user set-environment DBUS_SESSION_BUS_ADDRESS=unix:path=%t/bus

    [Install]
    WantedBy=sockets.target
    DBUS_SOCKET

    # ensure consistent timestamps
    find "${OUT_DIR}" -exec touch -d '2024-01-01T00:00:00+00:00' {} \;
    find "${OUT_DIR}" ! -type d -exec strip-nondeterminism -T 1704067200 --normalizers +all {} \;
    2nex_strip_binaries ${OUT_DIR}

bundles:
  full:
  - bin
  - conf

outputs:
  bin:
    files:
    - path: /usr/bin/dbus-broker
      needs:
      - /usr/lib/ld-linux-x86-64.so.2
      - /usr/lib/libc.so.6
      - /usr/lib/libgcc_s.so.1
      - /usr/lib/libm.so.6
    - path: /usr/bin/dbus-broker-launch
      needs:
      - /usr/lib/ld-linux-x86-64.so.2
      - /usr/lib/libc.so.6
      - /usr/lib/libexpat.so.1
      - /usr/lib/libgcc_s.so.1
      - /usr/lib/libsystemd.so.0

  conf:
    files:
    - path: /usr/lib/systemd/catalog/dbus-broker-launch.catalog
    - path: /usr/lib/systemd/catalog/dbus-broker.catalog
    - path: /usr/lib/systemd/system/dbus-broker.service
    - path: /usr/lib/systemd/system/dbus.service
    - path: /usr/lib/systemd/system/dbus.socket
    - path: /usr/lib/systemd/user/dbus-broker.service
    - path: /usr/lib/systemd/user/dbus.socket
    - path: /usr/share/dbus-1/session.conf
    - path: /usr/share/dbus-1/system.conf

resolution:
  /usr/lib/libexpat.so.1: expat
  /usr/lib/libgcc_s.so.1: gcc
  /usr/lib/ld-linux-x86-64.so.2: glibc
  /usr/lib/libc.so.6: glibc
  /usr/lib/libm.so.6: glibc
  /usr/lib/libsystemd.so.0: systemd
