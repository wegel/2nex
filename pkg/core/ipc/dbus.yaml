build:
  environment: 27b6e5dc7ad152c9a17c2cabfcc5ee93daa9bbf0
  profile: [4126:2189, 8266:2383, 12407:2383, 16538:3795, 20687:3916, 24818:4031, 28954:4108, 33060:8304, 36600:8378]

  script: |
    tar --no-same-owner -xf /${SOURCE_dbus} -C "${WORK_DIR}" --strip-components=1
    cd ${WORK_DIR}

    meson setup build \
      --prefix=/usr \
      --buildtype=release \
      -Dmodular_tests=disabled \
      -Dapparmor=disabled \
      -Dselinux=disabled \
      -Dqt_help=disabled \
      -Ddoxygen_docs=disabled \
      -Dxml_docs=disabled \
      -Dducktype_docs=disabled \
      -Dsystemd=enabled \
      -Dsystemd_system_unitdir=/usr/lib/systemd/system \
      -Dsystemd_user_unitdir=/usr/lib/systemd/user

    ninja -C build
    DESTDIR="${OUT_DIR}" ninja -C build install

    find ${OUT_DIR} -type f -executable -exec strip --strip-unneeded {} \; 2>/dev/null || true
    find "${OUT_DIR}" -exec touch -d "2024-01-01T00:00:00+00:00" {} \;

