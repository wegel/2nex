[package]
name = "xtask"
version = "0.1.0"
edition = "2021"
publish = false

[workspace]

[dependencies]
anyhow = "1.0"
clap = { version = "4.5", features = ["derive"] }
proc-macro2 = { version = "1.0", features = ["span-locations"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
syn = { version = "2.0", features = ["full", "visit"] }
toml = "0.8"

[dev-dependencies]
tempfile = "3.27"

[lints.rust]
unsafe_code = "deny"

[lints.clippy]
expect_used = "deny"
unwrap_used = "deny"
