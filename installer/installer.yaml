system:
  schema: 1
  name: nex Installer
  slug: installer
  version: 0.0.1
  description: Minimal bootable installer for nex systems
  nex_structure: true
  checksum: 84ab805e0cdd92f95a9483477b5de36db23efbaf5c9e5d2808f6a43b1b025857

