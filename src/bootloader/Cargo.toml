[package]
name = "nex-bootloader"
version = "0.1.0"
edition = "2021"
description = "OSTree-aware UEFI bootloader for 2nex"

[dependencies]
uefi = { version = "0.32", features = ["alloc", "logger", "global_allocator", "panic_handler"] }
log = "0.4"
ext4-view = { version = "0.5", default-features = false }

[profile.dev]
panic = "abort"

[profile.release]
opt-level = "z"
lto = true
panic = "abort"
strip = true
