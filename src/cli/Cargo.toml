[package]
name = "nex"
version = "0.0.1"
edition = "2021"

[dependencies]
clap = { version = "4.5.4", features = ["derive"] }
hex = "0.4.3"
nix = { version = "0.28.0", features = ["sched", "user"] }
serde = { version = "1.0.197", features = ["derive"] }
serde_yaml = "0.9.34"
serde_json = "1.0.143"
sha2 = "0.10.8"
blake3 = "1.5"
tar = "0.4"
tempfile = "3.10.1"
toml = "0.8"
walkdir = "2.5.0"
flate2 = "1.0"
num_cpus = "1.16.0"
url = "2.5.2"
goblin = "0.9.0"
petgraph = "0.6"
rayon = "1.10"
indicatif = "0.17"
indexmap = "2.0"
zub = { package = "zub-store", git = "https://github.com/wegel/zub.git", rev = "0db2a06aa0b741eb537ef41e5864226586aced38", default-features = false }

# ostree crate removed - we use CLI wrappers instead for static linking
# [dependencies.ostree]
# version = "0.19.1"
# features = ["v2021_1"]

[profile.release]
opt-level = "z"     # optimize for size
lto = true          # link-time optimization
codegen-units = 1   # single codegen unit for better optimization
strip = true        # strip symbols
panic = "abort"     # smaller panic handling

[profile.release-deploy]
inherits = "release"
# for deployment builds - same as release but explicit
